      - name: توليد الكود - AppsTabView.swift (مصمم جديد)
        run: |
          cat > AppsTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          struct AppsTabView: View {
              @ObservedObject var appsManager: AppsManager
              @State private var selectedApp: AppItem?
              @State private var showDetail = false
              @State private var searchText = ""
              @State private var isSearchFocused = false
              @State private var selectedCategory: String = "الكل"
              @State private var selectedSource: AppSource = .all
              @State private var newOnly: Bool = false

              enum AppSortMode: String, CaseIterable {
                  case newest = "الأحدث"
                  case popular = "الأشهر"
                  case name = "الاسم"
                  case size = "الحجم"
              }
              @State private var sortMode: AppSortMode = .newest

              var categories: [String] {
                  var cats = ["الكل"]
                  let found = Set(appsManager.apps.compactMap { $0.category }).sorted()
                  cats += found.isEmpty ? ["ترفيه", "أدوات", "ألعاب", "اجتماعي", "تعليم"] : Array(found)
                  return cats
              }

              var filteredApps: [AppItem] {
                  var base = appsManager.apps
                  switch selectedSource {
                  case .all:     break
                  case .primary: base = base.filter { $0.source == .primary }
                  case .kurd:    base = base.filter { $0.source == .kurd }
                  }
                  if selectedCategory != "الكل" { base = base.filter { $0.category == selectedCategory } }
                  if newOnly { base = base.filter { $0.isNew } }
                  if !searchText.isEmpty {
                      base = base.filter {
                          $0.name.localizedCaseInsensitiveContains(searchText) ||
                          $0.localizedDescription.localizedCaseInsensitiveContains(searchText) ||
                          $0.developerName.localizedCaseInsensitiveContains(searchText)
                      }
                  }
                  switch sortMode {
                  case .newest:  return base.sorted { ($0.parsedDate ?? .distantPast) > ($1.parsedDate ?? .distantPast) }
                  case .popular: return base.sorted { (Int($0.down) ?? 0) > (Int($1.down) ?? 0) }
                  case .name:    return base.sorted { $0.name < $1.name }
                  case .size:    return base.sorted { $0.size > $1.size }
                  }
              }

              var body: some View {
                  NavigationView {
                      VStack(spacing: 0) {
                          // شريط البحث
                          HStack(spacing: 12) {
                              Image(systemName: "magnifyingglass")
                                  .foregroundColor(isSearchFocused ? .xcodeBlue : .xcodeSecondary)
                                  .font(.system(size: 14))
                              TextField("ابحث عن تطبيق...", text: $searchText)
                                  .font(.system(size: 14))
                                  .multilineTextAlignment(.trailing)
                                  .onTapGesture { isSearchFocused = true }
                                  .onSubmit {
                                      appsManager.addRecentSearch(searchText)
                                      isSearchFocused = false
                                  }
                              if !searchText.isEmpty {
                                  Button(action: { searchText = ""; isSearchFocused = false }) {
                                      Image(systemName: "xmark.circle.fill")
                                          .foregroundColor(.xcodeSecondary)
                                  }
                              }
                          }
                          .padding(10)
                          .background(
                              RoundedRectangle(cornerRadius: 10)
                                  .fill(Color.white)
                                  .shadow(color: Color.black.opacity(0.04), radius: 4, x: 0, y: 2)
                          )
                          .padding(.horizontal, 20)
                          .padding(.top, 8)
                          .padding(.bottom, 8)

                          // المصادر - Segmented Control
                          Picker("المصدر", selection: $selectedSource) {
                              ForEach(AppSource.allCases) { source in
                                  Text(source.displayName).tag(source)
                              }
                          }
                          .pickerStyle(SegmentedPickerStyle())
                          .padding(.horizontal, 20)
                          .padding(.bottom, 8)

                          // الفئات - Chips قابلة للتمرير
                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack(spacing: 8) {
                                  ForEach(categories, id: \.self) { cat in
                                      FilterChip(
                                          title: cat,
                                          icon: nil,
                                          color: .xcodeBlue,
                                          selected: selectedCategory == cat
                                      ) {
                                          withAnimation(.spring()) { selectedCategory = cat }
                                      }
                                  }
                                  // زر التصفية الجديد
                                  FilterChip(
                                      title: "جديد",
                                      icon: "sparkles",
                                      color: .xcodePink,
                                      selected: newOnly
                                  ) {
                                      withAnimation(.spring()) { newOnly.toggle() }
                                  }
                              }
                              .padding(.horizontal, 20)
                          }
                          .padding(.bottom, 4)

                          // ترتيب
                          HStack {
                              Spacer()
                              Menu {
                                  ForEach(AppSortMode.allCases, id: \.self) { mode in
                                      Button(action: { sortMode = mode }) {
                                          HStack {
                                              Text(mode.rawValue)
                                              if sortMode == mode { Image(systemName: "checkmark") }
                                          }
                                      }
                                  }
                              } label: {
                                  HStack(spacing: 4) {
                                      Image(systemName: "arrow.up.arrow.down")
                                          .font(.system(size: 11, weight: .semibold))
                                      Text(sortMode.rawValue)
                                          .font(.system(size: 11, weight: .semibold))
                                  }
                                  .foregroundColor(.xcodeBlue)
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 6)
                                  .background(Capsule().fill(Color.xcodeBlue.opacity(0.1)))
                              }
                          }
                          .padding(.horizontal, 20)
                          .padding(.bottom, 8)

                          // القائمة
                          if appsManager.isLoading && appsManager.apps.isEmpty {
                              LoadingView()
                          } else if let err = appsManager.errorMessage, appsManager.apps.isEmpty {
                              ErrorView(message: err) { appsManager.retryFetch() }
                          } else if filteredApps.isEmpty {
                              XcodeEmptyState(
                                  icon: "magnifyingglass",
                                  title: "لا توجد نتائج",
                                  subtitle: "جرب بحثاً آخر أو تغيير الفلاتر"
                              )
                          } else {
                              ScrollView {
                                  LazyVStack(spacing: 8) {
                                      ForEach(filteredApps, id: \.id) { app in
                                          EnhancedAppCard(app: app)
                                              .onTapGesture { selectedApp = app; showDetail = true }
                                              .padding(.horizontal, 20)
                                      }
                                  }
                                  .padding(.bottom, 20)
                              }
                          }
                      }
                      .background(Color.xcodeBackground)
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              Text("21s Pro")
                                  .font(.system(size: 17, weight: .bold))
                                  .foregroundColor(.xcodeBlue)
                          }
                      }
                  }
                  .sheet(isPresented: $showDetail) {
                      if let app = selectedApp {
                          AppDetailView(app: app)
                      }
                  }
              }
          }

          struct FilterChip: View {
              let title: String
              var icon: String?
              let color: Color
              let selected: Bool
              let action: () -> Void
              var body: some View {
                  Button(action: {
                      HapticManager.shared.selection()
                      action()
                  }) {
                      HStack(spacing: 4) {
                          if let icon {
                              Image(systemName: icon)
                                  .font(.system(size: 10, weight: .bold))
                          }
                          Text(title)
                              .font(.system(size: 11, weight: selected ? .bold : .medium))
                      }
                      .foregroundColor(selected ? .white : .primary)
                      .padding(.horizontal, 12)
                      .padding(.vertical, 6)
                      .background(
                          Capsule().fill(selected ? color : Color.gray.opacity(0.12))
                      )
                  }
              }
          }

          struct EnhancedAppCard: View {
              let app: AppItem
              var body: some View {
                  HStack(spacing: 12) {
                      ZStack(alignment: .bottomTrailing) {
                          CachedAsyncImage(url: URL(string: app.iconURL)) { phase in
                              if let img = phase.image {
                                  img.resizable().aspectRatio(contentMode: .fill)
                                      .frame(width: 52, height: 52)
                                      .clipShape(RoundedRectangle(cornerRadius: 12))
                              } else {
                                  RoundedRectangle(cornerRadius: 12)
                                      .fill(Color.xcodeBlue.opacity(0.1))
                                      .frame(width: 52, height: 52)
                                      .overlay(Image(systemName: "app.fill")
                                          .font(.system(size: 20))
                                          .foregroundColor(.xcodeBlue.opacity(0.3)))
                              }
                          }
                          if app.isNew {
                              Text("NEW")
                                  .font(.system(size: 6, weight: .black))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 3)
                                  .padding(.vertical, 1)
                                  .background(Capsule().fill(Color.xcodeGreen))
                                  .offset(x: 3, y: 3)
                          }
                      }
                      VStack(alignment: .trailing, spacing: 4) {
                          HStack(spacing: 5) {
                              if app.isPopular {
                                  Image(systemName: "flame.fill")
                                      .font(.system(size: 9))
                                      .foregroundColor(.xcodeOrange)
                              }
                              SourceBadge(source: app.source)
                              Spacer()
                              Text(app.name)
                                  .font(.system(size: 14, weight: .bold))
                                  .lineLimit(1)
                          }
                          Text(app.developerName)
                              .font(.system(size: 10))
                              .foregroundColor(.xcodeSecondary)
                              .lineLimit(1)
                              .frame(maxWidth: .infinity, alignment: .trailing)
                          HStack(spacing: 6) {
                              Spacer()
                              Label(app.formattedSize, systemImage: "internaldrive")
                                  .font(.system(size: 9))
                                  .foregroundColor(.xcodeSecondary)
                              Label(app.formattedDate, systemImage: "calendar")
                                  .font(.system(size: 9))
                                  .foregroundColor(.xcodeSecondary)
                              if let cat = app.category {
                                  Text(cat)
                                      .font(.system(size: 8, weight: .medium))
                                      .foregroundColor(.xcodeBlue)
                                      .padding(.horizontal, 5)
                                      .padding(.vertical, 2)
                                      .background(Capsule().fill(Color.xcodeBlue.opacity(0.1)))
                              }
                          }
                          HStack(spacing: 5) {
                              Spacer()
                              Text(app.subscriptionType)
                                  .font(.system(size: 8, weight: .semibold))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 2)
                                  .background(Capsule().fill(Color.xcodePurple))
                              let desc = app.localizedDescription.replacingOccurrences(of: "Injected with ", with: "")
                              if !desc.isEmpty {
                                  Text(desc.components(separatedBy: .whitespaces).prefix(3).joined(separator: " "))
                                      .font(.system(size: 8))
                                      .foregroundColor(.xcodeSecondary)
                                      .lineLimit(1)
                              }
                          }
                      }
                  }
                  .padding(10)
                  .xcodeCard(radius: 14)
                  .overlay(
                      RoundedRectangle(cornerRadius: 14)
                          .stroke(app.isNew ? Color.xcodeGreen.opacity(0.2) : Color.clear, lineWidth: app.isNew ? 1 : 0)
                  )
              }
          }
          VIPEOF

