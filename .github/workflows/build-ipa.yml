              static let text      = Color.white
              static let sub       = Color(red: 0.60, green: 0.60, blue: 0.64)
              static let primary   = Color(red: 0.478, green: 0.196, blue: 0.925)
              static let primaryDk = Color(red: 0.298, green: 0.098, blue: 0.686)
              static let accent    = Color(red: 0.882, green: 0.090, blue: 0.408)
              static let cyan      = Color(red: 0.043, green: 0.796, blue: 0.717)
              static let yellow    = Color(red: 0.98, green: 0.76, blue: 0.30)
