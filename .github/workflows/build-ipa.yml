# ------------------------------------------------------------
# Dylib Viewer - Decrypt & Edit
# يعرض معلومات ملفات dylib (مكتبات ديناميكية) مع إمكانية عرض
# السلاسل النصية، الرموز، أوامر التحميل، وتمكين تحرير النصوص
# (عرض/نسخ/حفظ السلاسل المعدلة) ضمن تطبيق macOS SwiftUI.
# ------------------------------------------------------------
name: Dylib Viewer - Decrypt & Edit

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.yourname.dylibviewer"
  NEW_APP_NAME:  "Dylib Viewer"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip  || { echo "zip not installed"; exit 1; }

      # =========================================================
      # ICONS - أيقونات التطبيق (مولدة محلياً)
      # =========================================================
      - name: Generate app icon
        run: |
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          def gradient(w, h, c1, c2):
              img = Image.new("RGB", (w, h), c1)
              d = ImageDraw.Draw(img)
              for i in range(h):
                  t = i / max(1, h - 1)
                  r = int(c1[0] + (c2[0]-c1[0])*t)
                  g = int(c1[1] + (c2[1]-c1[1])*t)
                  b = int(c1[2] + (c2[2]-c1[2])*t)
                  d.line([(0, i), (w, i)], fill=(r, g, b))
              return img

          def find_font(size):
              for p in [
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/SFNSDisplay.ttf",
                  "/Library/Fonts/Arial Bold.ttf",
              ]:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, size)
                      except: pass
              return ImageFont.load_default()

          img = gradient(1024, 1024, (40, 60, 180), (10, 20, 70))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((260, 380, 764, 644), radius=40, fill=(255, 255, 255))
          font = find_font(120)
          bbox = d.textbbox((0,0), "DV", font=font)
          w, h = bbox[2]-bbox[0], bbox[3]-bbox[1]
          d.text((512 - w/2, 512 - h/2), "DV", font=font, fill=(30, 40, 100))
          img.save("Resources/AppIcon1024x1024.png")

          for size, name in [(128,"AppIcon128.png"), (256,"AppIcon256.png"),
                             (512,"AppIcon512.png"), (1024,"AppIcon1024x1024.png")]:
              if size != 1024:
                  img.resize((size, size)).save(f"Resources/{name}")
          print("Icons generated.")
          PYEOF
          ls -lh Resources

      # =========================================================
      # Info.plist لتطبيق macOS
      # =========================================================
      - name: Write Info.plist
        run: |
          cat > Resources/Info.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>${NEW_APP_NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${NEW_APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${NEW_BUNDLE_ID}</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>DylibViewer</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSMainStoryboardFile</key>
              <string></string>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
          </dict>
          </plist>
          PLISTEOF
          sed -i '' "s/\${NEW_APP_NAME}/${NEW_APP_NAME}/g" Resources/Info.plist
          sed -i '' "s/\${NEW_BUNDLE_ID}/${NEW_BUNDLE_ID}/g" Resources/Info.plist
          cat Resources/Info.plist

      # =========================================================
      # SWIFT SOURCE FILES
      # =========================================================
      - name: Write Swift source files
        run: |
          # ---- نموذج البيانات ----
          cat > DylibInfo.swift << 'SWIFTEOF'
          import Foundation

          struct DylibInfo {
              let path: String
              let loadCommands: String
              let symbols: String
              let strings: String
              let rawHex: String  // عرض عشري (اختياري)
          }
          SWIFTEOF

          # ---- محلل dylib يستخدم أدوات النظام ----
          cat > DylibAnalyzer.swift << 'SWIFTEOF'
          import Foundation

          enum DylibAnalyzer {
              static func analyze(at path: URL) -> DylibInfo? {
                  guard FileManager.default.fileExists(atPath: path.path) else { return nil }

                  let loadCommands = runCommand("/usr/bin/otool", args: ["-l", path.path])
                  let symbols = runCommand("/usr/bin/nm", args: ["-gU", path.path])
                  let strings = runCommand("/usr/bin/strings", args: [path.path])
                  let hexDump = runCommand("/usr/bin/xxd", args: [path.path]) ?? ""

                  return DylibInfo(
                      path: path.path,
                      loadCommands: loadCommands ?? "No load commands",
                      symbols: symbols ?? "No symbols",
                      strings: strings ?? "No strings",
                      rawHex: hexDump
                  )
              }

              private static func runCommand(_ command: String, args: [String]) -> String? {
                  let process = Process()
                  process.executableURL = URL(fileURLWithPath: command)
                  process.arguments = args

                  let pipe = Pipe()
                  process.standardOutput = pipe
                  process.standardError = pipe

                  do {
                      try process.run()
                      process.waitUntilExit()

                      let data = pipe.fileHandleForReading.readDataToEndOfFile()
                      return String(data: data, encoding: .utf8)
                  } catch {
                      return nil
                  }
              }
          }
          SWIFTEOF

          # ---- واجهة المستخدم ----
          cat > ContentView.swift << 'SWIFTEOF'
          import SwiftUI

          struct ContentView: View {
              @State private var selectedFileURL: URL?
              @State private var dylibInfo: DylibInfo?
              @State private var searchText: String = ""
              @State private var replacementText: String = ""
              @State private var modifiedStrings: String = ""

              var body: some View {
                  VStack(spacing: 16) {
                      HStack {
                          Button("اختر ملف dylib") {
                              selectFile()
                          }
                          .padding(.horizontal)

                          if let url = selectedFileURL {
                              Text(url.lastPathComponent)
                                  .font(.headline)
                          }

                          Spacer()

                          if dylibInfo != nil {
                              Button("تحديث") {
                                  analyzeCurrentFile()
                              }
                          }
                      }
                      .padding(.top, 8)

                      if let info = dylibInfo {
                          TabView {
                              // عرض أوامر التحميل
                              ScrollView {
                                  Text(info.loadCommands)
                                      .font(.system(.body, design: .monospaced))
                                      .padding()
                                      .frame(maxWidth: .infinity, alignment: .leading)
                              }
                              .tabItem { Label("أوامر التحميل", systemImage: "list.bullet") }

                              // عرض الرموز
                              ScrollView {
                                  Text(info.symbols)
                                      .font(.system(.body, design: .monospaced))
                                      .padding()
                                      .frame(maxWidth: .infinity, alignment: .leading)
                              }
                              .tabItem { Label("الرموز", systemImage: "s.square") }

                              // عرض السلاسل النصية مع إمكانية التحرير
                              VStack {
                                  HStack {
                                      TextField("بحث", text: $searchText)
                                          .textFieldStyle(RoundedBorderTextFieldStyle())
                                          .frame(width: 200)
                                      TextField("استبدال بـ", text: $replacementText)
                                          .textFieldStyle(RoundedBorderTextFieldStyle())
                                          .frame(width: 200)
                                      Button("استبدال") {
                                          applyReplacement()
                                      }
                                      Button("نسخ") {
                                          NSPasteboard.general.clearContents()
                                          NSPasteboard.general.setString(modifiedStrings.isEmpty ? info.strings : modifiedStrings, forType: .string)
                                      }
                                      Button("حفظ كـ...") {
                                          saveModifiedStrings()
                                      }
                                  }
                                  .padding(.horizontal)

                                  TextEditor(text: $modifiedStrings)
                                      .font(.system(.body, design: .monospaced))
                                      .padding()
                                      .border(Color.gray.opacity(0.3))
                                      .onAppear {
                                          modifiedStrings = info.strings
                                      }
                                      .onChange(of: info.strings) { newValue in
                                          modifiedStrings = newValue
                                      }
                              }
                              .tabItem { Label("السلاسل", systemImage: "textformat") }

                              // عرض Hex (اختياري)
                              ScrollView {
                                  Text(info.rawHex)
                                      .font(.system(.body, design: .monospaced))
                                      .padding()
                                      .frame(maxWidth: .infinity, alignment: .leading)
                              }
                              .tabItem { Label("Hex", systemImage: "hexagon") }
                          }
                          .padding()
                      } else {
                          Spacer()
                          Text("اختر ملف dylib لبدء التحليل")
                              .foregroundColor(.secondary)
                          Spacer()
                      }
                  }
                  .frame(minWidth: 700, minHeight: 500)
                  .onDrop(of: [.fileURL], isTargeted: nil) { providers in
                      handleDrop(providers: providers)
                      return true
                  }
              }

              private func selectFile() {
                  let panel = NSOpenPanel()
                  panel.allowedContentTypes = [.data] // يمكن تخصيص .dylib
                  panel.allowsMultipleSelection = false
                  panel.canChooseDirectories = false
                  if panel.runModal() == .OK, let url = panel.url {
                      selectedFileURL = url
                      analyzeCurrentFile()
                  }
              }

              private func analyzeCurrentFile() {
                  guard let url = selectedFileURL else { return }
                  if let info = DylibAnalyzer.analyze(at: url) {
                      dylibInfo = info
                      modifiedStrings = info.strings
                  } else {
                      dylibInfo = nil
                  }
              }

              private func handleDrop(providers: [NSItemProvider]) -> Bool {
                  for provider in providers {
                      if provider.hasItemConformingToTypeIdentifier("public.file-url") {
                          provider.loadItem(forTypeIdentifier: "public.file-url", options: nil) { (item, error) in
                              if let data = item as? Data,
                                 let url = URL(dataRepresentation: data, relativeTo: nil) {
                                  DispatchQueue.main.async {
                                      self.selectedFileURL = url
                                      self.analyzeCurrentFile()
                                  }
                              }
                          }
                      }
                  }
                  return true
              }

              private func applyReplacement() {
                  guard !searchText.isEmpty else { return }
                  modifiedStrings = modifiedStrings.replacingOccurrences(of: searchText, with: replacementText)
              }

              private func saveModifiedStrings() {
                  let panel = NSSavePanel()
                  panel.allowedContentTypes = [.plainText]
                  panel.canCreateDirectories = true
                  panel.nameFieldStringValue = "modified_strings.txt"
                  panel.begin { response in
                      if response == .OK, let url = panel.url {
                          do {
                              try modifiedStrings.write(to: url, atomically: true, encoding: .utf8)
                          } catch {
                              print("Error saving: \(error)")
                          }
                      }
                  }
              }
          }
          SWIFTEOF

          # ---- نقطة الدخول ----
          cat > DylibViewerApp.swift << 'SWIFTEOF'
          import SwiftUI

          @main
          struct DylibViewerApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .frame(minWidth: 700, minHeight: 500)
                  }
              }
          }
          SWIFTEOF

          echo "Swift sources written."
          ls -la *.swift

      # =========================================================
      # BUILD (تطبيق macOS)
      # =========================================================
      - name: Build the app
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            DylibInfo.swift \
            DylibAnalyzer.swift \
            ContentView.swift \
            DylibViewerApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-macos13.0 \
            -O \
            -module-name DylibViewer \
            -framework SwiftUI \
            -framework AppKit \
            -framework Foundation \
            -o DylibViewer
          file DylibViewer

      # =========================================================
      # PACKAGE (.app)
      # =========================================================
      - name: Create .app bundle
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/DylibViewer.app/Contents/MacOS
          mkdir -p build-output/DylibViewer.app/Contents/Resources

          cp -X DylibViewer                              build-output/DylibViewer.app/Contents/MacOS/DylibViewer
          cp -X Resources/Info.plist                     build-output/DylibViewer.app/Contents/Info.plist
          cp -X Resources/AppIcon1024x1024.png           build-output/DylibViewer.app/Contents/Resources/AppIcon1024x1024.png
          # نسخ جميع أيقونات أخرى إن وجدت
          for f in Resources/AppIcon*.png; do
            [ -f "$f" ] && cp -X "$f" build-output/DylibViewer.app/Contents/Resources/
          done

          # تنظيف السمات
          xattr -cr build-output
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          # توقيع اختياري (ldid)
          ldid -S build-output/DylibViewer.app/Contents/MacOS/DylibViewer

          # ضغط التطبيق كـ zip
          rm -f artifacts/DylibViewer.zip
          cd build-output && zip -r -X -q ../artifacts/DylibViewer.zip DylibViewer.app && cd ..

          # التحقق من صحة الملف المضغوط
          if ! unzip -tq artifacts/DylibViewer.zip >/dev/null 2>&1; then
            echo "Error: ZIP file is corrupt or invalid."
            exit 1
          fi
          if ! unzip -l artifacts/DylibViewer.zip | grep -q "DylibViewer.app/Contents/MacOS/DylibViewer"; then
            echo "Error: ZIP does not contain a valid App Bundle"
            exit 1
          fi
          echo "ZIP size: $(du -sh artifacts/DylibViewer.zip)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DylibViewer-App
          path: artifacts/DylibViewer.zip
          retention-days: 90
