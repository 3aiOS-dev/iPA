                                              .padding(12)
                                              .xcodeCard(radius: 12)
                                              .overlay(
                                                  RoundedRectangle(cornerRadius: 12)
                                                      .stroke(cert.isDefault ? Color.xcodeBlue.opacity(0.3) : Color.clear, lineWidth: 1.5)
                                              )
                                          }
                                          .buttonStyle(PlainButtonStyle())
                                      }
                                  }
                                  .padding(.horizontal)
                              }
                          }
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button { dismiss() } label: {
                                  Image(systemName: "xmark.circle.fill")
                                      .foregroundColor(.xcodeSecondary)
                              }
                          }
                      }
                  }
              }
          }
          VIPEOF

      - name: Generate code - AppDetailView.swift
        run: |
          cat > AppDetailView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          struct AppDetailView: View {
              let app: AppItem
              @ObservedObject var downloadManager: DownloadManager
              @State private var isDownloading = false
              @Environment(\.dismiss) var dismiss

              var isAlreadyDownloading: Bool {
                  downloadManager.downloads.contains { $0.appID == app.id && $0.isActive }
              }
              var hasCompletedDownload: Bool {
                  downloadManager.downloads.contains { $0.appID == app.id && ($0.state == .completed || $0.state == .signed) }
              }

              var body: some View {
                  ZStack {
                      Color.xcodeBackground.edgesIgnoringSafeArea(.all)
                      VStack(spacing: 0) {
                          HStack {
                              Button(action: { dismiss() }) {
                                  Image(systemName: "xmark.circle.fill")
                                      .font(.title2)
                                      .foregroundColor(.xcodeSecondary)
                              }
                              Spacer()
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 16)

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 16) {
                                  ZStack(alignment: .bottom) {
                                      RoundedRectangle(cornerRadius: 24)
                                          .fill(
                                              LinearGradient(
                                                  colors: [Color.xcodePurple.opacity(0.7), Color.xcodeBlue.opacity(0.6)],
                                                  startPoint: .topLeading, endPoint: .bottomTrailing
                                              )
                                          )
                                          .frame(height: 160)
                                          .overlay(
                                              ZStack {
                                                  Circle().fill(Color.white.opacity(0.08))
                                                      .frame(width: 140).offset(x: -100, y: -40)
                                                  Circle().fill(Color.white.opacity(0.05))
                                                      .frame(width: 100).offset(x: 110, y: 35)
                                              }
                                              .clipShape(RoundedRectangle(cornerRadius: 24))
                                          )
                                          .overlay(
                                              RoundedRectangle(cornerRadius: 24)
                                                  .stroke(Color.white.opacity(0.12), lineWidth: 0.5)
                                          )
                                          .shadow(color: Color.xcodePurple.opacity(0.3),
                                                  radius: 18, x: 0, y: 8)
                                          .padding(.horizontal, 16)

                                      CachedAsyncImage(url: URL(string: app.iconURL)) { phase in
                                          switch phase {
                                          case .success(let img):
                                              img.resizable().aspectRatio(contentMode: .fill)
                                          default:
                                              RoundedRectangle(cornerRadius: 22)
                                                  .fill(Color.xcodeBlue.opacity(0.3))
                                                  .overlay(Image(systemName: "app.fill")
                                                      .font(.system(size: 36))
                                                      .foregroundColor(.white.opacity(0.6)))
                                          }
                                      }
                                      .frame(width: 110, height: 110)
                                      .clipShape(RoundedRectangle(cornerRadius: 22))
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 22)
                                              .stroke(Color.white.opacity(0.8), lineWidth: 2.5)
                                      )
                                      .shadow(color: .black.opacity(0.3), radius: 12, x: 0, y: 6)
                                      .offset(y: 45)
                                  }
                                  .padding(.bottom, 45)

                                  VStack(spacing: 5) {
                                      Text(app.name)
                                          .font(.system(size: 22, weight: .black))
                                          .multilineTextAlignment(.center)
                                      Text(app.developerName.isEmpty ? "VIP21 Store" : app.developerName)
                                          .font(.system(size: 12))
                                          .foregroundColor(.xcodeSecondary)
                                      HStack(spacing: 6) {
                                          if app.isNew { NewBadge() }
                                          if app.isPopular { PopularBadge() }
                                          SourceBadge(source: app.source)
                                      }
                                  }

                                  HStack(spacing: 0) {
                                      DetailStat(icon: "memorychip", value: app.formattedSize, label: "Size")
                                      Divider().frame(height: 36).background(Color.xcodeDivider)
                                      DetailStat(icon: "number", value: app.version, label: "Version")
                                      Divider().frame(height: 36).background(Color.xcodeDivider)
                                      DetailStat(icon: "calendar", value: app.formattedDate, label: "Updated")
                                  }
                                  .padding(.vertical, 14)
                                  .xcodeCard(radius: 14)
                                  .padding(.horizontal)

                                  HStack(spacing: 10) {
                                      InfoPill(label: "Bundle ID", value: app.bundleID)
                                      InfoPill(label: "License", value: app.subscriptionType)
                                  }
                                  .padding(.horizontal)

                                  VStack(alignment: .trailing, spacing: 6) {
                                      HStack {
                                          Spacer()
                                          Image(systemName: "text.alignright")
                                              .foregroundColor(.xcodeBlue)
                                          Text("Description")
                                              .font(.system(size: 14, weight: .semibold))
                                      }
                                      Text(app.localizedDescription.replacingOccurrences(of: "Injected with ", with: ""))
                                          .font(.system(size: 12))
                                          .foregroundColor(.xcodeSecondary)
                                          .multilineTextAlignment(.trailing)
                                          .lineSpacing(3)
                                  }
                                  .padding(12)
                                  .xcodeCard(radius: 14)
                                  .padding(.horizontal)

                                  if isAlreadyDownloading {
                                      XcodeButton(
                                          title: "Downloading...",
                                          icon: "arrow.down.circle.fill",
                                          color: .xcodeOrange,
                                          action: {},
                                          isLoading: true,
                                          isDisabled: true
                                      )
                                      .padding(.horizontal, 40)
                                      .padding(.top, 8)
                                  } else if hasCompletedDownload {
                                      HStack(spacing: 12) {
                                          XcodeButton(
                                              title: "Install",
                                              icon: "arrow.down.app.fill",
                                              color: .xcodeGreen
                                          ) {
                                              if let task = downloadManager.downloads.first(where: { $0.appID == app.id }) {
                                                  downloadManager.installApp(id: task.id)
                                              }
                                          }
                                          XcodeButton(
                                              title: "Download Again",
                                              icon: "arrow.down.circle.fill",
                                              color: .xcodeBlue
                                          ) {
                                              downloadManager.startDownload(for: app)
                                          }
                                      }
                                      .padding(.horizontal, 20)
                                      .padding(.top, 8)
                                  } else {
                                      XcodeButton(
                                          title: "Download IPA",
                                          icon: "arrow.down.circle.fill",
                                          color: .xcodeBlue
                                      ) {
                                          HapticManager.shared.impact(.medium)
                                          downloadManager.startDownload(for: app)
                                      }
                                      .padding(.horizontal, 40)
                                      .padding(.top, 8)
                                  }
                              }
                              .padding(.vertical, 16)
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
              }
          }

          struct DetailStat: View {
              let icon: String
              let value: String
              let label: String
              var body: some View {
                  VStack(spacing: 4) {
                      Image(systemName: icon)
                          .font(.system(size: 13))
                          .foregroundColor(.xcodeBlue)
                      Text(value)
                          .font(.system(size: 12, weight: .bold))
                      Text(label)
                          .font(.system(size: 9))
                          .foregroundColor(.xcodeSecondary)
                  }
                  .frame(maxWidth: .infinity)
              }
          }

          struct InfoPill: View {
              let label: String
              let value: String
              var body: some View {
                  VStack(spacing: 2) {
                      Text(label)
                          .font(.system(size: 9))
                          .foregroundColor(.xcodeSecondary)
                      Text(value)
                          .font(.system(size: 11, weight: .semibold))
                          .lineLimit(2)
                          .multilineTextAlignment(.center)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(10)
                  .background(RoundedRectangle(cornerRadius: 10).fill(Color.gray.opacity(0.06)))
              }
          }
          VIPEOF

      - name: Generate code - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UserNotifications

          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
              var body: some Scene {
                  WindowGroup {
                      AuthView()
                          .onAppear {
                              requestNotifications()
                          }
                  }
              }
              func requestNotifications() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }
          }

          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  return true
              }
              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           willPresent notification: UNNotification,
                                           withCompletionHandler handler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  handler([.banner, .sound, .badge])
              }
              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           didReceive response: UNNotificationResponse,
                                           withCompletionHandler handler: @escaping () -> Void) {
                  handler()
              }
          }

          extension UIWindowScene {
              var keyWindow: UIWindow? {
                  return windows.first(where: { $0.isKeyWindow }) ?? windows.first
              }
          }
          VIPEOF

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            AuthManager.swift \
            CertificateManager.swift \
            Signer.swift \
            DownloadManager.swift \
            AppsManager.swift \
            SharedComponents.swift \
            AuthViews.swift \
            ContentView.swift \
            HomeTabView.swift \
            AppsTabView.swift \
            DownloadsTabView.swift \
            AppDetailView.swift \
            VIP21StoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework UserNotifications \
            -framework UniformTypeIdentifiers \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA package
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon60x60@3x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/21s.ipa | head -35
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "✅ IPA is valid and contains the App Bundle."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Pro-IPA-SwiftUI-v8-Xcode
          path: artifacts/21s.ipa
