      - name: 🔗 توليد P2PShareManager.swift
        run: |
          cat > P2PShareManager.swift << 'P2PEOF'
          import Foundation
          import MultipeerConnectivity
          import UIKit

          class P2PShareManager: NSObject, ObservableObject {
              @Published var discoveredPeers: [MCPeerID] = []
              @Published var isAdvertising = false
              @Published var isBrowsing = false
              @Published var transferProgress: Double = 0
              @Published var isTransferring = false

              private var session: MCSession?
              private var advertiser: MCNearbyServiceAdvertiser?
              private var browser: MCNearbyServiceBrowser?
              private let serviceType = "21s-ultra-share"
              private var localPeerID: MCPeerID

              override init() {
                  let deviceName = UIDevice.current.name
                  localPeerID = MCPeerID(displayName: deviceName)
                  super.init()
                  setupSession()
              }

              private func setupSession() {
                  session = MCSession(peer: localPeerID, securityIdentity: nil, encryptionPreference: .required)
                  session?.delegate = self
              }

              func startSharing() {
                  advertiser = MCNearbyServiceAdvertiser(peer: localPeerID, discoveryInfo: nil, serviceType: serviceType)
                  advertiser?.delegate = self
                  advertiser?.startAdvertisingPeer()
                  isAdvertising = true
              }

              func startDiscovery() {
                  browser = MCNearbyServiceBrowser(peer: localPeerID, serviceType: serviceType)
                  browser?.delegate = self
                  browser?.startBrowsingForPeers()
                  isBrowsing = true
              }

              func stopAll() {
                  advertiser?.stopAdvertisingPeer()
                  browser?.stopBrowsingForPeers()
                  isAdvertising = false
                  isBrowsing = false
                  discoveredPeers.removeAll()
              }

              func sendFile(_ url: URL, to peer: MCPeerID) {
                  guard let session = session else { return }
                  isTransferring = true
                  transferProgress = 0

                  do {
                      let data = try Data(contentsOf: url)
                      try session.send(data, toPeers: [peer], with: .reliable)
                      isTransferring = false
                      transferProgress = 1.0
                  } catch {
                      isTransferring = false
                  }
              }

              func invitePeer(_ peer: MCPeerID) {
                  guard let browser = browser else { return }
                  browser.invitePeer(peer, to: session!, withContext: nil, timeout: 30)
              }
          }

          extension P2PShareManager: MCSessionDelegate {
              func session(_ session: MCSession, peer peerID: MCPeerID, didChange state: MCSessionState) {
                  DispatchQueue.main.async {
                      switch state {
                      case .connected:
                          HapticManager.shared.success()
                      case .connecting:
                          break
                      case .notConnected:
                          HapticManager.shared.error()
                      @unknown default:
                          break
                      }
                  }
              }

              func session(_ session: MCSession, didReceive data: Data, fromPeer peerID: MCPeerID) {
                  // Save received file
                  let tempDir = FileManager.default.temporaryDirectory
                  let fileURL = tempDir.appendingPathComponent("received_\(UUID().uuidString).ipa")
                  try? data.write(to: fileURL)

                  DispatchQueue.main.async {
                      HapticManager.shared.success()
                      self.isTransferring = false
                      self.transferProgress = 1.0
                  }
              }

              func session(_ session: MCSession, didReceive stream: InputStream, withName streamName: String, fromPeer peerID: MCPeerID) {}
              func session(_ session: MCSession, didStartReceivingResourceWithName resourceName: String, fromPeer peerID: MCPeerID, with progress: Progress) {
                  DispatchQueue.main.async {
                      self.isTransferring = true
                      Timer.scheduledTimer(withTimeInterval: 0.1, repeats: true) { timer in
                          self.transferProgress = progress.fractionCompleted
                          if progress.isFinished {
                              timer.invalidate()
                          }
                      }
                  }
              }
              func session(_ session: MCSession, didFinishReceivingResourceWithName resourceName: String, fromPeer peerID: MCPeerID, at localURL: URL?, withError error: Error?) {
                  DispatchQueue.main.async {
                      self.isTransferring = false
                  }
              }
          }

          extension P2PShareManager: MCNearbyServiceAdvertiserDelegate {
              func advertiser(_ advertiser: MCNearbyServiceAdvertiser, didReceiveInvitationFromPeer peerID: MCPeerID, withContext context: Data?, invitationHandler: @escaping (Bool, MCSession?) -> Void) {
                  invitationHandler(true, session)
              }
          }

          extension P2PShareManager: MCNearbyServiceBrowserDelegate {
              func browser(_ browser: MCNearbyServiceBrowser, foundPeer peerID: MCPeerID, withDiscoveryInfo info: [String : String]?) {
                  DispatchQueue.main.async {
                      if !self.discoveredPeers.contains(where: { $0.displayName == peerID.displayName }) {
                          self.discoveredPeers.append(peerID)
                      }
                  }
              }

              func browser(_ browser: MCNearbyServiceBrowser, lostPeer peerID: MCPeerID) {
                  DispatchQueue.main.async {
                      self.discoveredPeers.removeAll { $0.displayName == peerID.displayName }
                  }
              }
          }

          struct P2PShareView: View {
              @StateObject private var p2pManager = P2PShareManager()
              @State private var showPeerPicker = false

              var body: some View {
                  VStack(spacing: 20) {
                      HStack(spacing: 20) {
                          Button {
                              p2pManager.startSharing()
                          } label: {
                              VStack {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                      .font(.system(size: 30))
                                  Text("إرسال")
                              }
                              .foregroundColor(.blue)
                          }

                          Button {
                              p2pManager.startDiscovery()
                              showPeerPicker = true
                          } label: {
                              VStack {
                                  Image(systemName: "dot.radiowaves.left.and.right")
                                      .font(.system(size: 30))
                                  Text("استقبال")
                              }
                              .foregroundColor(.green)
                          }
                      }

                      if p2pManager.isTransferring {
                          VStack {
                              Text("جاري النقل...")
                              AnimeProgressBar(progress: p2pManager.transferProgress, colors: [.cyan, .magenta])
                                  .frame(height: 10)
                          }
                          .padding()
                      }
                  }
                  .sheet(isPresented: $showPeerPicker) {
                      PeerPickerView(p2pManager: p2pManager)
                  }
                  .onDisappear {
                      p2pManager.stopAll()
                  }
              }
          }

          struct PeerPickerView: View {
              @ObservedObject var p2pManager: P2PShareManager
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      List(p2pManager.discoveredPeers, id: \.displayName) { peer in
                          HStack {
                              Text(peer.displayName)
                              Spacer()
                              Button("اتصال") {
                                  p2pManager.invitePeer(peer)
                                  dismiss()
                              }
                          }
                      }
                      .navigationTitle("الأجهزة المكتشفة")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("إغلاق") { dismiss() }
                          }
                      }
                  }
              }
          }
          P2PEOF

