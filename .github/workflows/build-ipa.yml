                              Label("صورة", systemImage: "photo.on.rectangle.angled")
                                  .font(.system(size: 13, weight: .semibold))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 14).padding(.vertical, 8)
                                  .background(Capsule().fill(Color.white.opacity(0.08)))
                          }
                          .buttonStyle(.plain)

                          Toggle(isOn: $broadcastOn) {
                              Label("إشعار للجميع", systemImage: "bell.badge.fill")
                                  .font(.system(size: 13, weight: .semibold))
                                  .foregroundColor(.white)
                          }
                          .toggleStyle(SwitchToggleStyle(tint: Color.storePrimary))
                          Spacer()
                      }
                      .padding(.horizontal, 16)
                      .padding(.top, 14)
                      .padding(.bottom, 16)

                      Spacer()
                  }
                  .background(Color.storeBg.ignoresSafeArea())
                  .sheet(isPresented: $showPicker) {
