          }

          /// Schedules background refresh of the catalog and continues
          /// any in-flight downloads while the app is in the background.
          final class BGDownloadCoordinator {
              static let shared = BGDownloadCoordinator()
              private let refreshId = "com.vip21.store.pro.refresh"
              private let downloadId = "com.vip21.store.pro.download"

              func register() {
                  BGTaskScheduler.shared.register(forTaskWithIdentifier: refreshId, using: nil) { [weak self] task in
                      self?.handleRefresh(task: task as! BGAppRefreshTask)
                  }
                  BGTaskScheduler.shared.register(forTaskWithIdentifier: downloadId, using: nil) { [weak self] task in
                      self?.handleDownload(task: task as! BGProcessingTask)
                  }
                  scheduleRefresh()
              }

              func scheduleRefresh() {
                  let req = BGAppRefreshTaskRequest(identifier: refreshId)
                  req.earliestBeginDate = Date(timeIntervalSinceNow: 6 * 3600) // 6h
                  try? BGTaskScheduler.shared.submit(req)
              }
              private func handleRefresh(task: BGAppRefreshTask) {
                  scheduleRefresh()
                  let op = Task {
                      await SourcesManager.shared.refreshAll()
                      task.setTaskCompleted(success: true)
                  }
                  task.expirationHandler = { op.cancel() }
              }
              private func handleDownload(task: BGProcessingTask) {
                  // Background processing keeps the chunked downloader alive
                  // for as long as the system allows. The downloader itself
                  // is idempotent and persists progress to disk.
                  let op = Task {
                      // No-op: ChunkedDownloader is already running per task.
                      // We just keep this task alive so iOS does not kill us.
                      try? await Task.sleep(nanoseconds: 25 * 1_000_000_000)
                      task.setTaskCompleted(success: true)
                  }
                  task.expirationHandler = { op.cancel() }
              }
          }
          VIPEOF

