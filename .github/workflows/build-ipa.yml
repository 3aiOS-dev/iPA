                                                                  .font(.system(size: 11))
                                                          }
                                                          .foregroundColor(.primary)
                                                          .padding(.horizontal, 10)
                                                          .padding(.vertical, 5)
                                                          .xcodeCard(radius: 8)
                                                      }
                                                  }
                                              }
                                              .padding(.horizontal)
                                          }
                                      }
                                      .transition(.opacity)
                                  }

                                  ScrollView(.horizontal, showsIndicators: false) {
