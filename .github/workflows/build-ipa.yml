      - name: Generate Source - Entry Point
        run: |
          cd ${{ github.workspace }}
          cat > main.swift << 'EEOF'
          import UIKit

          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  applyRootTabBarController(animated: false)

                  NotificationCenter.default.addObserver(
                      self, selector: #selector(updateBadge),
                      name: .favoritesChanged, object: nil
                  )
                  NotificationCenter.default.addObserver(
                      self, selector: #selector(themeDidChange),
                      name: .themeChanged, object: nil
                  )

                  if !UserDefaults.standard.bool(forKey: "app21s.onboarding.seen") {
                      let onboarding = OnboardingViewController()
                      onboarding.modalPresentationStyle = .fullScreen
                      window?.rootViewController?.present(onboarding, animated: false)
                  }

                  return true
              }

              @objc private func themeDidChange() {
                  let currentIndex = (window?.rootViewController as? UITabBarController)?.selectedIndex ?? 0
                  applyRootTabBarController(animated: true, selectedIndex: currentIndex)
              }

              private func applyRootTabBarController(animated: Bool, selectedIndex: Int = 0) {
                  guard let window = window else { return }
                  let tabBar = makeTabBarController()
                  tabBar.selectedIndex = selectedIndex

                  if animated {
                      UIView.transition(with: window, duration: 0.3, options: .transitionCrossDissolve, animations: {
                          window.rootViewController = tabBar
                      })
                  } else {
                      window.rootViewController = tabBar
                  }
                  window.makeKeyAndVisible()
                  updateBadge()
              }

              @objc private func updateBadge() {
                  guard let tabBar = window?.rootViewController as? UITabBarController,
                        let controllers = tabBar.viewControllers,
                        controllers.count > 2,
                        let favoritesNav = controllers[2] as? UINavigationController
                  else { return }
                  let count = FavoritesManager.shared.count
                  favoritesNav.tabBarItem.badgeValue = count > 0 ? "\(count)" : nil
              }

              private func makeTabBarController() -> UITabBarController {
                  // تبويب الرئيسية: بنر ترويجي + أفضل 10 تطبيقات + تطبيقات مميزة
                  let homeNav = UINavigationController(rootViewController: HomeViewController())
                  homeNav.navigationBar.isHidden = true
                  homeNav.tabBarItem = UITabBarItem(title: "الرئيسية", image: UIImage(systemName: "house.fill"), tag: 0)

                  // تبويب التطبيقات: تصفح وبحث وتصنيفات
                  let appsNav = UINavigationController(rootViewController: AppsViewController())
                  appsNav.navigationBar.isHidden = true
                  appsNav.tabBarItem = UITabBarItem(title: "التطبيقات", image: UIImage(systemName: "square.grid.2x2.fill"), tag: 1)

                  // تبويب المفضلة: التطبيقات التي أضافها المستخدم محليًا
                  let favoritesNav = UINavigationController(rootViewController: FavoritesViewController())
                  favoritesNav.navigationBar.isHidden = true
                  favoritesNav.tabBarItem = UITabBarItem(title: "المفضلة", image: UIImage(systemName: "heart.fill"), tag: 2)

                  // تبويب الإعدادات: الوضع الداكن، سياسة الخصوصية، ومعلومات عن التطبيق
                  let settingsNav = UINavigationController(rootViewController: SettingsViewController())
                  settingsNav.navigationBar.barStyle = AppTheme.barStyle
                  settingsNav.navigationBar.tintColor = AppTheme.accent
                  settingsNav.tabBarItem = UITabBarItem(title: "الإعدادات", image: UIImage(systemName: "gearshape.fill"), tag: 3)

                  let tabBar = UITabBarController()
                  tabBar.viewControllers = [homeNav, appsNav, favoritesNav, settingsNav]
                  tabBar.tabBar.barStyle = AppTheme.barStyle
                  tabBar.tabBar.isTranslucent = false
                  tabBar.tabBar.backgroundColor = AppTheme.surface
                  tabBar.tabBar.tintColor = AppTheme.accent
                  tabBar.tabBar.unselectedItemTintColor = AppTheme.primaryText.withAlphaComponent(0.35)
                  tabBar.view.backgroundColor = AppTheme.background
                  return tabBar
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EEOF

