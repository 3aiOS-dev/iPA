name: Build_21s_SwiftUI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "🔍 Using Xcode at: $XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcode-select -p
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Setup Dependencies
        run: |
          brew install zip xcodegen
          xcodegen version

      - name: Generate App Icons (Asset Catalog)
        run: |
          mkdir -p Resources/Assets.xcassets/AppIcon.appiconset
          python3 -m pip install --quiet --break-system-packages Pillow

          cat > Resources/Assets.xcassets/Contents.json << 'JEOF'
          { "info": { "author": "xcode", "version": 1 } }
          JEOF

          cat > Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JEOF'
          {
            "images": [
              { "filename": "Icon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JEOF

          python3 << 'PYIEOF'
          from PIL import Image, ImageDraw, ImageFont
          size = 1024
          img  = Image.new("RGB", (size, size), (10, 11, 20))
          draw = ImageDraw.Draw(img)
          for y in range(size):
              t = y/size
              draw.line([(0,y),(size,y)], fill=(int(110*(1-t)+34*t), int(86*(1-t)+211*t), int(207*(1-t)+238*t)))
          draw.rounded_rectangle([size*.14,size*.30,size*.86,size*.80],
              radius=size*.10, outline=(255,255,255), width=max(2,size//34))
          try:
              font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size*.30))
          except Exception:
              font = ImageFont.load_default()
          bbox = draw.textbbox((0,0),"21",font=font)
          tw,th = bbox[2]-bbox[0], bbox[3]-bbox[1]
          draw.text(((size-tw)/2-bbox[0],(size-th)/2-bbox[1]),"21",fill=(255,255,255),font=font)
          img.save("Resources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png")
          PYIEOF

          echo "📦 Asset catalog contents:"
          find Resources/Assets.xcassets -type f

      - name: Generate App Data
        run: |
          mkdir -p Resources
          cat > Resources/apps_data.json << 'JEOF'
          {
            "name": "21s Store",
            "identifier": "com.vip21.store",
            "sourceURL": "https://repository.apptesters.org/apps.json",
            "iconURL": "https://a.top4top.io/p_380487iqk0.jpeg",
            "website": "https://t.me/ClickStoreipaios",
            "subtitle": "متجر 21s VIP",
            "apps": []
          }
          JEOF
          python3 -c "import json; json.load(open('Resources/apps_data.json')); print('OK')"

      - name: Generate Source - Constants.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/Constants.swift << 'VIPEOF'
                    import SwiftUI

                    // MARK: - App Constants
                    enum AppConstants {
                        static let storeURL    = "https://repository.apptesters.org/apps.json"
                        static let telegramURL = "https://t.me/ClickStoreipaios"
                        static let bannerURL   = "https://a.top4top.io/p_380487iqk0.jpeg"
                        static let appIconURL  = "https://a.top4top.io/p_380487iqk0.jpeg"
                        static let appVersion  = "7.0"
                        static let storeName   = "21s"
                        static let accentColor = Color(red: 0.4, green: 0.2, blue: 1.0)
                    }

                    // MARK: - Brand Colors
                    extension Color {
                        static let vipGold     = Color(red: 1.0, green: 0.84, blue: 0.0)
                        static let vipPurple   = Color(red: 0.55, green: 0.0, blue: 1.0)
                        static let vipDark     = Color(red: 0.07, green: 0.07, blue: 0.12)
                        static let cardDark    = Color(red: 0.11, green: 0.11, blue: 0.18)
                        static let glassWhite  = Color.white.opacity(0.08)
                        static let glassBorder = Color.white.opacity(0.15)
                    }
          VIPEOF
          echo "Constants.swift: $(wc -l < Sources/VIP21Store/Constants.swift) lines"

      - name: Generate Source - Models.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/Models.swift << 'VIPEOF'
                    import SwiftUI
                    import Foundation

                    // MARK: - App Item (من apps.json)
                    struct AppItem: Identifiable, Codable, Hashable {
                        var id: String { bundleIdentifier.isEmpty ? bundleID : bundleIdentifier }
                        let name: String
                        let type: Int
                        let bundleID: String
                        let bundleIdentifier: String
                        let version: String
                        let versionDate: String
                        let fullDate: String
                        let size: Int
                        let down: String
                        let downloadURL: String
                        let developerName: String
                        let localizedDescription: String
                        let icon: String
                        let iconURL: String
                        var category: String?

                        var formattedSize: String {
                            let f = ByteCountFormatter()
                            f.countStyle = .file
                            return f.string(fromByteCount: Int64(size))
                        }

                        var formattedDate: String {
                            let f = DateFormatter(); f.dateFormat = "yyyy-MM-dd"
                            if let d = f.date(from: versionDate) {
                                let o = DateFormatter(); o.dateFormat = "dd-MM-yyyy"; return o.string(from: d)
                            }
                            return versionDate
                        }

                        var isNew: Bool {
                            let f = DateFormatter(); f.dateFormat = "yyyy-MM-dd"
                            guard let d = f.date(from: versionDate) else { return false }
                            return (Calendar.current.dateComponents([.day], from: d, to: Date()).day ?? 999) < 7
                        }

                        var isPopular: Bool { (Int(down) ?? 0) > 500 }
                    }

                    // MARK: - API Response
                    struct AppsResponse: Codable {
                        let name: String
                        let identifier: String
                        let sourceURL: String
                        let iconURL: String
                        let website: String
                        let ipawebsite: String?
                        let subtitle: String
                        let apps: [AppItem]
                    }

                    // MARK: - IPA File (في مكتبة المستخدم)
                    struct IPAFile: Identifiable, Codable, Hashable {
                        var id = UUID()
                        let fileName: String
                        let localPath: String
                        let originalURL: String
                        let fileSize: String
                        let fileSizeBytes: Int64
                        let dateImported: Date
                        var isSigned: Bool = false
                        var signedPath: String?
                        var lastSignError: String?
                    }

                    // MARK: - App Category
                    struct AppCategory: Identifiable, Hashable {
                        let id = UUID()
                        let name: String
                        let icon: String
                        let gradient: [Color]
                    }

                    // MARK: - Install Record
                    struct InstallRecord: Identifiable, Codable {
                        var id = UUID()
                        let appName: String
                        let bundleID: String
                        let version: String
                        let installDate: Date
                        let iconURL: String
                        var installMethod: String
                    }

                    // MARK: - User Profile
                    struct UserProfile: Codable {
                        var userName: String
                        var profileImageData: Data?
                        var memberSince: Date
                        var hasCompletedOnboarding: Bool
                        var totalInstalls: Int = 0

                        var profileImage: UIImage? {
                            guard let d = profileImageData else { return nil }
                            return UIImage(data: d)
                        }

                        static let `default` = UserProfile(
                            userName: "1-21s",
                            profileImageData: nil,
                            memberSince: Date(),
                            hasCompletedOnboarding: true
                        )
                    }

                    // MARK: - Source Platform
                    enum SourcePlatform: String, CaseIterable {
                        case instagram = "Instagram", tiktok = "TikTok"
                        case telegram  = "Telegram",  youtube = "YouTube"
                        case friend    = "صديق"

                        var icon: String {
                            switch self {
                            case .instagram: return "camera.fill"
                            case .tiktok:    return "music.note"
                            case .telegram:  return "paperplane.fill"
                            case .youtube:   return "play.rectangle.fill"
                            case .friend:    return "person.2.fill"
                            }
                        }
                    }

                    // MARK: - Download Status
                    enum DownloadStatus: String { case waiting, downloading, completed, failed, paused }

                    // MARK: - Active Download
                    final class ActiveDownload: ObservableObject, Identifiable {
                        let id = UUID()
                        let appName: String
                        let appIconURL: String
                        let downloadURL: URL
                        @Published var progress: Double = 0
                        @Published var downloadedBytes: Int64 = 0
                        @Published var totalBytes: Int64 = 0
                        @Published var status: DownloadStatus = .waiting
                        @Published var errorMessage: String?
                        var task: URLSessionDownloadTask?
                        var destinationURL: URL?

                        init(appName: String, appIconURL: String, downloadURL: URL) {
                            self.appName = appName
                            self.appIconURL = appIconURL
                            self.downloadURL = downloadURL
                        }

                        var progressPercentage: Int { Int(progress * 100) }
                        var formattedDownloaded: String {
                            let f = ByteCountFormatter()
                            f.countStyle = .file
                            return f.string(fromByteCount: downloadedBytes)
                        }
                        var formattedTotal: String {
                            let f = ByteCountFormatter()
                            f.countStyle = .file
                            return f.string(fromByteCount: totalBytes)
                        }
                    }

                    // MARK: - Certificate Model
                    struct CertificateInfoModel: Identifiable, Codable {
                        var id = UUID()
                        let name: String
                        let p12DataString: String
                        let mobileProvisionDataString: String
                        let password: String
                        let displayName: String
                        let creationDate: Date
                        let expiryDate: Date?
                        let certificateName: String?
                        var teamID: String?

                        var p12Data: Data { Data(base64Encoded: p12DataString) ?? Data() }
                        var mobileProvisionData: Data { Data(base64Encoded: mobileProvisionDataString) ?? Data() }

                        var isValid: Bool {
                            guard let expiry = expiryDate else { return true }
                            return expiry > Date()
                        }

                        var daysRemaining: Int? {
                            guard let expiry = expiryDate else { return nil }
                            return Calendar.current.dateComponents([.day], from: Date(), to: expiry).day
                        }

                        var expiryStatusColor: Color {
                            guard let d = daysRemaining else { return .gray }
                            if d < 0  { return .red }
                            if d < 7  { return .orange }
                            if d < 30 { return Color(red: 1.0, green: 0.6, blue: 0.0) }
                            return .green
                        }

                        var expiryText: String {
                            guard let d = daysRemaining else { return "غير معروف" }
                            if d < 0  { return "منتهية منذ \(abs(d)) يوم" }
                            if d == 0 { return "تنتهي اليوم!" }
                            return "متبقي \(d) يوم"
                        }
                    }
          VIPEOF
          echo "Models.swift: $(wc -l < Sources/VIP21Store/Models.swift) lines"

      - name: Generate Source - AppsManager.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/AppsManager.swift << 'VIPEOF'
                    import SwiftUI
                    import Foundation
                    import Combine

                    // MARK: - Apps Manager (تحميل وتحديث apps.json)
                    @MainActor
                    final class AppsManager: ObservableObject {
                        @Published var apps: [AppItem] = []
                        @Published var isLoading = false
                        @Published var errorMessage: String?
                        @Published var lastUpdated: Date?
                        @Published var storeTitle: String = AppConstants.storeName
                        @Published var storeSubtitle: String = ""

                        private var refreshTask: Task<Void, Never>?
                        private let session: URLSession

                        init(session: URLSession = .shared) {
                            self.session = session
                        }

                        func fetchApps(force: Bool = false) {
                            refreshTask?.cancel()
                            refreshTask = Task { [weak self] in
                                await self?.performFetch(force: force)
                            }
                        }

                        func retryFetch() { fetchApps(force: true) }

                        private func performFetch(force: Bool) async {
                            if !force && !apps.isEmpty { return }
                            isLoading = true
                            errorMessage = nil
                            defer { isLoading = false }

                            do {
                                let url = URL(string: AppConstants.storeURL)!
                                var request = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalAndRemoteCacheData)
                                request.timeoutInterval = 20
                                let (data, response) = try await session.data(for: request)
                                guard let http = response as? HTTPURLResponse, (200...299).contains(http.statusCode) else {
                                    throw URLError(.badServerResponse)
                                }
                                let decoded = try JSONDecoder().decode(AppsResponse.self, from: data)
                                self.apps = decoded.apps
                                self.storeTitle = decoded.name.isEmpty ? AppConstants.storeName : decoded.name
                                self.storeSubtitle = decoded.subtitle
                                self.lastUpdated = Date()
                            } catch {
                                self.errorMessage = (error as NSError).localizedDescription
                            }
                        }
                    }
          VIPEOF
          echo "AppsManager.swift: $(wc -l < Sources/VIP21Store/AppsManager.swift) lines"

      - name: Generate Source - IPADownloadManager.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/IPADownloadManager.swift << 'VIPEOF'
                    import SwiftUI
                    import Foundation
                    import Combine

                    // MARK: - IPA Download Manager (URLSession حقيقي + progress)
                    @MainActor
                    final class IPADownloadManager: NSObject, ObservableObject {
                        @Published var activeDownloads: [ActiveDownload] = []
                        @Published var ipaFiles: [IPAFile] = []

                        static let libraryKey = "vip21.ipaLibrary.v1"

                        private lazy var session: URLSession = {
                            let cfg = URLSessionConfiguration.default
                            cfg.allowsCellularAccess = true
                            cfg.waitsForConnectivity = true
                            return URLSession(configuration: cfg, delegate: self, delegateQueue: .main)
                        }()

                        override init() {
                            super.init()
                            loadIPAFiles()
                        }

                        // ✅ nonisolated عشان يقدر الـ URLSession delegate (nonisolated) يستخدمه
                        nonisolated private func libraryURL() -> URL {
                            let dir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                                .appendingPathComponent("IPAs", isDirectory: true)
                            try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                            return dir
                        }

                        func loadIPAFiles() {
                            let url = libraryURL().appendingPathComponent("library.json")
                            guard let data = try? Data(contentsOf: url),
                                  let list = try? JSONDecoder().decode([IPAFile].self, from: data) else {
                                ipaFiles = []
                                return
                            }
                            ipaFiles = list
                        }

                        private func saveIPAFiles() {
                            let url = libraryURL().appendingPathComponent("library.json")
                            if let data = try? JSONEncoder().encode(ipaFiles) {
                                try? data.write(to: url, options: .atomic)
                            }
                        }

                        // MARK: - استيراد ملف IPA عبر URL (مع نسخه إلى Documents)
                        func importIPA(from sourceURL: URL) {
                            let didStart = sourceURL.startAccessingSecurityScopedResource()
                            defer { if didStart { sourceURL.stopAccessingSecurityScopedResource() } }

                            let dest = libraryURL().appendingPathComponent(sourceURL.lastPathComponent)
                            do {
                                if FileManager.default.fileExists(atPath: dest.path) {
                                    try FileManager.default.removeItem(at: dest)
                                }
                                try FileManager.default.copyItem(at: sourceURL, to: dest)
                            } catch {
                                print("Import failed: \(error)")
                                return
                            }
                            registerIPA(at: dest)
                        }

                        private func registerIPA(at url: URL) {
                            let attrs = try? FileManager.default.attributesOfItem(atPath: url.path)
                            let size = (attrs?[.size] as? Int64) ?? 0
                            let formatter = ByteCountFormatter()
                            formatter.countStyle = .file
                            let file = IPAFile(
                                fileName: url.lastPathComponent,
                                localPath: url.path,
                                originalURL: url.absoluteString,
                                fileSize: formatter.string(fromByteCount: size),
                                fileSizeBytes: size,
                                dateImported: Date()
                            )
                            if !ipaFiles.contains(where: { $0.localPath == file.localPath }) {
                                ipaFiles.insert(file, at: 0)
                                saveIPAFiles()
                            }
                        }

                        // MARK: - حذف ملف IPA
                        func deleteIPA(_ file: IPAFile) {
                            try? FileManager.default.removeItem(atPath: file.localPath)
                            if let signed = file.signedPath {
                                try? FileManager.default.removeItem(atPath: signed)
                            }
                            ipaFiles.removeAll { $0.id == file.id }
                            saveIPAFiles()
                        }

                        // MARK: - بدء التحميل من URL
                        func startDownload(for app: AppItem) {
                            guard let url = URL(string: app.downloadURL) else { return }
                            let dl = ActiveDownload(appName: app.name, appIconURL: app.iconURL, downloadURL: url)
                            activeDownloads.append(dl)
                            let task = session.downloadTask(with: url)
                            dl.task = task
                            dl.status = .downloading
                            task.resume()
                        }

                        func cancelDownload(_ dl: ActiveDownload) {
                            dl.task?.cancel()
                            activeDownloads.removeAll { $0.id == dl.id }
                        }

                        // MARK: - تمييز ملف كموقّع
                        func markSigned(originalPath: String, signedPath: String) {
                            if let idx = ipaFiles.firstIndex(where: { $0.localPath == originalPath }) {
                                ipaFiles[idx].isSigned = true
                                ipaFiles[idx].signedPath = signedPath
                                ipaFiles[idx].lastSignError = nil
                                saveIPAFiles()
                            }
                        }

                        func markSignError(originalPath: String, message: String) {
                            if let idx = ipaFiles.firstIndex(where: { $0.localPath == originalPath }) {
                                ipaFiles[idx].lastSignError = message
                                saveIPAFiles()
                            }
                        }
                    }

                    // MARK: - URLSession Delegate
                    extension IPADownloadManager: URLSessionDownloadDelegate {
                        nonisolated func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                                                    didWriteData bytesWritten: Int64,
                                                    totalBytesWritten: Int64,
                                                    totalBytesExpectedToWrite: Int64) {
                            Task { @MainActor in
                                guard let dl = self.activeDownloads.first(where: { $0.task === downloadTask }) else { return }
                                dl.downloadedBytes = totalBytesWritten
                                dl.totalBytes = totalBytesExpectedToWrite > 0 ? totalBytesExpectedToWrite : totalBytesWritten
                                dl.progress = dl.totalBytes > 0 ? Double(totalBytesWritten) / Double(dl.totalBytes) : 0
                            }
                        }

                        nonisolated func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                                                    didFinishDownloadingTo location: URL) {
                            let dest = self.libraryURL().appendingPathComponent(downloadTask.originalRequest?.url?.lastPathComponent ?? UUID().uuidString + ".ipa")
                            try? FileManager.default.moveItem(at: location, to: dest)
                            let attrs = try? FileManager.default.attributesOfItem(atPath: dest.path)
                            let size = (attrs?[.size] as? Int64) ?? 0
                            let formatter = ByteCountFormatter()
                            formatter.countStyle = .file
                            let file = IPAFile(
                                fileName: dest.lastPathComponent,
                                localPath: dest.path,
                                originalURL: dest.absoluteString,
                                fileSize: formatter.string(fromByteCount: size),
                                fileSizeBytes: size,
                                dateImported: Date()
                            )
                            Task { @MainActor in
                                guard let dl = self.activeDownloads.first(where: { $0.task === downloadTask }) else { return }
                                dl.status = .completed
                                dl.progress = 1.0
                                dl.destinationURL = dest
                                if !self.ipaFiles.contains(where: { $0.localPath == file.localPath }) {
                                    self.ipaFiles.insert(file, at: 0)
                                    self.saveIPAFiles()
                                }
                                DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                                    self.activeDownloads.removeAll { $0.id == dl.id }
                                }
                            }
                        }

                        nonisolated func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                            Task { @MainActor in
                                guard let dl = self.activeDownloads.first(where: { $0.task === task }) else { return }
                                if let error = error {
                                    dl.status = .failed
                                    dl.errorMessage = error.localizedDescription
                                }
                            }
                        }
                    }
          VIPEOF
          echo "IPADownloadManager.swift: $(wc -l < Sources/VIP21Store/IPADownloadManager.swift) lines"

      - name: Generate Source - CertificateManager.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/CertificateManager.swift << 'VIPEOF'
                    import SwiftUI
                    import Foundation
                    import Security

                    // MARK: - Certificate Manager (تحقق حقيقي من P12 + mobileprovision)
                    @MainActor
                    final class CertificateManager: ObservableObject {
                        @Published var certificates: [CertificateInfoModel] = []
                        @Published var lastError: String?

                        private let storageURL: URL

                        init() {
                            let dir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                                .appendingPathComponent("Certificates", isDirectory: true)
                            try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                            storageURL = dir.appendingPathComponent("certificates.json")
                            load()
                        }

                        func load() {
                            guard let data = try? Data(contentsOf: storageURL),
                                  let list = try? JSONDecoder().decode([CertificateInfoModel].self, from: data) else {
                                certificates = []
                                return
                            }
                            certificates = list
                        }

                        private func save() {
                            if let data = try? JSONEncoder().encode(certificates) {
                                try? data.write(to: storageURL, options: .atomic)
                            }
                        }

                        // MARK: - استيراد P12
                        func importP12(data: Data, password: String, displayName: String,
                                       provisionData: Data, completion: @escaping (Result<CertificateInfoModel, Error>) -> Void) {
                            do {
                                let pwd = password.isEmpty ? "" : password
                                let opts: [String: Any] = [kSecImportExportPassphrase as String: pwd]
                                var items: CFArray?
                                let status = SecPKCS12Import(data as CFData, opts as CFDictionary, &items)
                                guard status == errSecSuccess, let arr = items as? [[String: Any]],
                                      let first = arr.first,
                                      let rawID = first[kSecImportItemIdentity as String] else {
                                    throw NSError(domain: "CertMgr", code: Int(status),
                                                  userInfo: [NSLocalizedDescriptionKey: "فشل قراءة P12 — كلمة المرور خاطئة أو ملف تالف"])
                                }
                                // ✅ force-cast to SecIdentity (هنا آمن لأن status==errSecSuccess)
                                let identity = rawID as! SecIdentity
                                var certOpt: SecCertificate?
                                let certStatus = SecIdentityCopyCertificate(identity, &certOpt)
                                guard certStatus == errSecSuccess, let cert = certOpt else {
                                    throw NSError(domain: "CertMgr", code: Int(certStatus),
                                                  userInfo: [NSLocalizedDescriptionKey: "تعذّر استخراج الشهادة من P12"])
                                }
                                // ✅ الآن cert غير اختياري (unwrapped) — نقدر نمرره مباشرة
                                let summaryCF = SecCertificateCopySubjectSummary(cert)
                                let summary: String
                                if let s = summaryCF as String? {
                                    summary = s
                                } else {
                                    summary = displayName
                                }
                                var teamID: String?
                                if let open = summary.lastIndex(of: "("),
                                   let close = summary.lastIndex(of: ")"),
                                   open < close {
                                    let t = String(summary[summary.index(after: open)..<close])
                                    if t.count == 10 { teamID = t }
                                }
                                let expiry = Self.extractExpiryDate(from: provisionData)
                                let model = CertificateInfoModel(
                                    name: displayName,
                                    p12DataString: data.base64EncodedString(),
                                    mobileProvisionDataString: provisionData.base64EncodedString(),
                                    password: pwd,
                                    displayName: displayName,
                                    creationDate: Date(),
                                    expiryDate: expiry,
                                    certificateName: summary,
                                    teamID: teamID
                                )
                                certificates.append(model)
                                save()
                                completion(.success(model))
                            } catch {
                                lastError = error.localizedDescription
                                completion(.failure(error))
                            }
                        }

                        func delete(_ cert: CertificateInfoModel) {
                            certificates.removeAll { $0.id == cert.id }
                            save()
                        }

                        // MARK: - استخراج تاريخ الانتهاء من mobileprovision
                        private static func extractExpiryDate(from data: Data) -> Date? {
                            let rawStr = String(data: data, encoding: .ascii) ?? String(data: data, encoding: .utf8) ?? ""
                            // plist XML: ExpirationDate</key><date>YYYY-MM-DDTHH:MM:SSZ</date>
                            if let range = rawStr.range(of: "ExpirationDate</key>\\s*<date>(.*?)</date>", options: .regularExpression) {
                                let line = String(rawStr[range])
                                if let dateRange = line.range(of: "<date>(.*?)</date>", options: .regularExpression) {
                                    let s = String(line[dateRange])
                                        .replacingOccurrences(of: "<date>", with: "")
                                        .replacingOccurrences(of: "</date>", with: "")
                                    return ISO8601DateFormatter().date(from: s)
                                }
                            }
                            return nil
                        }
                    }
          VIPEOF
          echo "CertificateManager.swift: $(wc -l < Sources/VIP21Store/CertificateManager.swift) lines"

      - name: Generate Source - ZipHelper.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/ZipHelper.swift << 'VIPEOF'
                    import Foundation
                    import Compression

                    // MARK: - ZIP Reader
                    final class ZipReader {
                        private let data: Data
                        init?(url: URL) { guard let d = try? Data(contentsOf: url) else { return nil }; self.data = d }

                        func extractAll(to dest: URL) throws {
                            let fm = FileManager.default
                            try fm.createDirectory(at: dest, withIntermediateDirectories: true)
                            var off = 0
                            while off + 30 <= data.count {
                                guard readU32(off) == 0x04034b50 else { off += 1; continue }
                                let method = Int(readU16(off + 8))
                                let compSize = Int(readU32(off + 18))
                                let uncompSize = Int(readU32(off + 22))
                                let nameLen = Int(readU16(off + 26))
                                let extraLen = Int(readU16(off + 28))
                                guard off + 30 + nameLen <= data.count else { break }
                                let name = String(data: data[off+30..<off+30+nameLen], encoding: .utf8) ?? ""
                                let dataStart = off + 30 + nameLen + extraLen
                                guard dataStart + compSize <= data.count else { break }
                                if !name.isEmpty && !name.hasSuffix("/") {
                                    let target = dest.appendingPathComponent(name)
                                    try fm.createDirectory(at: target.deletingLastPathComponent(),
                                                           withIntermediateDirectories: true)
                                    let raw = Data(data[dataStart..<dataStart + compSize])
                                    let out: Data
                                    if method == 0      { out = raw }
                                    else if method == 8 { out = try inflate(raw, expected: uncompSize) }
                                    else { throw NSError(domain: "ZipReader", code: method) }
                                    try out.write(to: target)
                                }
                                off = dataStart + compSize
                            }
                        }

                        private func inflate(_ src: Data, expected: Int) throws -> Data {
                            let cap = max(expected, src.count * 6, 4096)
                            var dst = Data(count: cap)
                            let n = src.withUnsafeBytes { s -> Int in dst.withUnsafeMutableBytes { d -> Int in
                                compression_decode_buffer(d.baseAddress!.assumingMemoryBound(to: UInt8.self), cap,
                                                          s.baseAddress!.assumingMemoryBound(to: UInt8.self), s.count,
                                                          nil, COMPRESSION_ZLIB) } }
                            guard n > 0 else { throw NSError(domain: "ZipReader", code: -2) }
                            return dst.prefix(n)
                        }

                        private func readU16(_ o: Int) -> UInt16 {
                            guard o + 2 <= data.count else { return 0 }
                            return data[o..<o+2].withUnsafeBytes { $0.load(as: UInt16.self).littleEndian }
                        }
                        private func readU32(_ o: Int) -> UInt32 {
                            guard o + 4 <= data.count else { return 0 }
                            return data[o..<o+4].withUnsafeBytes { $0.load(as: UInt32.self).littleEndian }
                        }
                    }

                    // MARK: - ZIP Writer
                    enum ZipWriter {
                        static func createZip(from directory: URL) throws -> Data {
                            let fm = FileManager.default
                            guard let en = fm.enumerator(at: directory, includingPropertiesForKeys: [.isDirectoryKey],
                                                          options: [.skipsHiddenFiles]) else {
                                throw NSError(domain: "ZipWriter", code: -1)
                            }
                            var local = Data(); var central = Data(); var count: UInt16 = 0
                            for case let url as URL in en {
                                let isDir = (try? url.resourceValues(forKeys: [.isDirectoryKey]))?.isDirectory ?? false
                                var rel = String(url.path.dropFirst(directory.path.count))
                                if rel.hasPrefix("/") { rel = String(rel.dropFirst()) }
                                guard !rel.isEmpty else { continue }
                                let entryName = isDir ? rel + "/" : rel
                                let nameData = entryName.data(using: .utf8) ?? Data()
                                let fileData = isDir ? Data() : ((try? Data(contentsOf: url)) ?? Data())
                                let crc = crc32(fileData); let sz = UInt32(fileData.count)
                                let localOff = UInt32(local.count)
                                local += localHeader(nameData: nameData, fileData: fileData, crc: crc, size: sz)
                                central += centralHeader(nameData: nameData, crc: crc, size: sz, localOff: localOff)
                                count += 1
                            }
                            return local + central + eocd(centralSize: UInt32(central.count),
                                                          localSize: UInt32(local.count), count: count)
                        }

                        private static func localHeader(nameData: Data, fileData: Data, crc: UInt32, size: UInt32) -> Data {
                            var d = Data()
                            d += le32(0x04034b50); d += le16(20); d += le16(0); d += le16(0)
                            d += le16(0);  d += le16(0)
                            d += le32(crc); d += le32(size); d += le32(size)
                            d += le16(UInt16(nameData.count)); d += le16(0)
                            d += nameData; d += fileData
                            return d
                        }

                        private static func centralHeader(nameData: Data, crc: UInt32, size: UInt32, localOff: UInt32) -> Data {
                            var d = Data()
                            d += le32(0x02014b50); d += le16(20); d += le16(20); d += le16(0); d += le16(0)
                            d += le16(0);  d += le16(0)
                            d += le32(crc); d += le32(size); d += le32(size)
                            d += le16(UInt16(nameData.count))
                            d += le16(0); d += le16(0); d += le16(0); d += le16(0)
                            d += le32(0); d += le32(localOff)
                            d += nameData
                            return d
                        }

                        private static func eocd(centralSize: UInt32, localSize: UInt32, count: UInt16) -> Data {
                            var d = Data()
                            d += le32(0x06054b50); d += le16(0); d += le16(0)
                            d += le16(count); d += le16(count)
                            d += le32(centralSize); d += le32(localSize); d += le16(0)
                            return d
                        }

                        private static func le16(_ v: UInt16) -> Data { var x = v.littleEndian; return Data(bytes: &x, count: 2) }
                        private static func le32(_ v: UInt32) -> Data { var x = v.littleEndian; return Data(bytes: &x, count: 4) }

                        private static func crc32(_ data: Data) -> UInt32 {
                            var crc: UInt32 = 0xffffffff
                            for byte in data {
                                crc ^= UInt32(byte)
                                for _ in 0..<8 { crc = (crc & 1) == 1 ? (crc >> 1) ^ 0xedb88320 : crc >> 1 }
                            }
                            return crc ^ 0xffffffff
                        }
                    }
          VIPEOF
          echo "ZipHelper.swift: $(wc -l < Sources/VIP21Store/ZipHelper.swift) lines"

      - name: Generate Source - InstallEngine.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/InstallEngine.swift << 'VIPEOF'
                    import SwiftUI
                    import UIKit
                    import Foundation

                    enum InstallError: LocalizedError {
                        case invalidIPA
                        case noMethodAvailable
                        case openFailed(String)
                        var errorDescription: String? {
                            switch self {
                            case .invalidIPA:           return "ملف IPA غير صالح"
                            case .noMethodAvailable:    return "لا توجد طريقة تثبيت متاحة (TrollStore/AltStore/itms-services)"
                            case .openFailed(let m):    return "تعذّر الفتح: \(m)"
                            }
                        }
                    }

                    // MARK: - Install Engine (TrollStore → AltStore → OTA)
                    final class InstallEngine {
                        static let shared = InstallEngine()
                        private init() {}

                        enum Method { case trollStore, altStore, ota }

                        func availableMethod() -> Method? {
                            let fm = FileManager.default
                            if UIApplication.shared.canOpenURL(URL(string: "apple-magnifier://")!) ||
                               fm.fileExists(atPath: "/var/jb/usr/bin/trollstorehelper") ||
                               fm.fileExists(atPath: "/usr/bin/trollstorehelper") { return .trollStore }
                            if UIApplication.shared.canOpenURL(URL(string: "altstore://")!) { return .altStore }
                            return .ota
                        }

                        func install(ipaURL: URL, bundleID: String, appName: String, version: String,
                                     completion: @escaping (Result<String, Error>) -> Void) {
                            guard FileManager.default.fileExists(atPath: ipaURL.path) else {
                                completion(.failure(InstallError.invalidIPA)); return
                            }
                            switch availableMethod() {
                            case .trollStore: openURL(buildTrollStoreURL(ipaURL), appName: appName, completion: completion)
                            case .altStore:   openURL(buildAltStoreURL(ipaURL), appName: appName, completion: completion)
                            case .ota:        installViaOTA(ipaURL: ipaURL, bundleID: bundleID,
                                                            appName: appName, version: version, completion: completion)
                            case .none:       completion(.failure(InstallError.noMethodAvailable))
                            }
                        }

                        private func buildTrollStoreURL(_ ipa: URL) -> URL {
                            let enc = ipa.absoluteString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                            return URL(string: "apple-magnifier://install?url=\(enc)")!
                        }
                        private func buildAltStoreURL(_ ipa: URL) -> URL {
                            let enc = ipa.absoluteString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                            return URL(string: "altstore://install?url=\(enc)")!
                        }

                        private func openURL(_ url: URL, appName: String,
                                             completion: @escaping (Result<String, Error>) -> Void) {
                            DispatchQueue.main.async {
                                UIApplication.shared.open(url) { ok in
                                    if ok { completion(.success("تم إرسال \(appName)")) }
                                    else  { completion(.failure(InstallError.openFailed(url.scheme ?? ""))) }
                                }
                            }
                        }

                        private func installViaOTA(ipaURL: URL, bundleID: String, appName: String, version: String,
                                                   completion: @escaping (Result<String, Error>) -> Void) {
                            let plist = """
                            <?xml version="1.0" encoding="UTF-8"?>
                            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                            <plist version="1.0"><dict>
                            <key>items</key><array><dict>
                            <key>assets</key><array><dict>
                            <key>kind</key><string>software-package</string>
                            <key>url</key><string>\(ipaURL.absoluteString)</string>
                            </dict></array>
                            <key>metadata</key><dict>
                            <key>bundle-identifier</key><string>\(bundleID)</string>
                            <key>bundle-version</key><string>\(version)</string>
                            <key>kind</key><string>software</string>
                            <key>title</key><string>\(appName)</string>
                            </dict></dict></array></dict></plist>
                            """
                            let tmp = FileManager.default.temporaryDirectory
                                .appendingPathComponent("install_\(UUID().uuidString).plist")
                            do { try plist.write(to: tmp, atomically: true, encoding: .utf8) }
                            catch { completion(.failure(error)); return }
                            let enc = tmp.absoluteString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                            guard let otaURL = URL(string: "itms-services://?action=download-manifest&url=\(enc)") else {
                                completion(.failure(InstallError.openFailed("ota"))); return
                            }
                            DispatchQueue.main.async {
                                UIApplication.shared.open(otaURL) { ok in
                                    if ok { completion(.success("تم فتح نافذة التثبيت")) }
                                    else  { completion(.failure(InstallError.noMethodAvailable)) }
                                }
                            }
                        }
                    }
          VIPEOF
          echo "InstallEngine.swift: $(wc -l < Sources/VIP21Store/InstallEngine.swift) lines"

      - name: Generate Source - SigningEngine.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/SigningEngine.swift << 'VIPEOF'
                    import SwiftUI
                    import Foundation
                    import Security
                    import CryptoKit

                    enum SigningError: LocalizedError {
                        case appBundleNotFound
                        case p12ImportFailed(String)
                        case cmsFailed(String)
                        case extractionFailed
                        case repackFailed(String)

                        var errorDescription: String? {
                            switch self {
                            case .appBundleNotFound:        return "❌ لم يُعثر على .app داخل IPA"
                            case .p12ImportFailed(let m):   return "❌ فشل P12: \(m)"
                            case .cmsFailed(let m):         return "❌ فشل CMS: \(m)"
                            case .extractionFailed:         return "❌ فشل فك ضغط IPA"
                            case .repackFailed(let m):      return "❌ فشل إعادة الضغط: \(m)"
                            }
                        }
                    }

                    // MARK: - Signing Engine (استخراج → استبدال provision → توقيع Mach-O بـ CMS → إعادة ضغط)
                    final class SigningEngine {
                        static let shared = SigningEngine()
                        private let fm = FileManager.default

                        func sign(ipaURL: URL, certificate: CertificateInfoModel,
                                  progress: @escaping (Double, String) -> Void,
                                  completion: @escaping (Result<URL, Error>) -> Void) {
                            DispatchQueue.global(qos: .userInitiated).async {
                                do {
                                    let out = try self._sign(ipaURL: ipaURL, cert: certificate, progress: progress)
                                    DispatchQueue.main.async { completion(.success(out)) }
                                } catch {
                                    DispatchQueue.main.async { completion(.failure(error)) }
                                }
                            }
                        }

                        private func _sign(ipaURL: URL, cert: CertificateInfoModel,
                                           progress: @escaping (Double, String) -> Void) throws -> URL {
                            progress(0.05, "📦 فك ضغط IPA...")
                            let work = fm.temporaryDirectory.appendingPathComponent("sign_\(UUID().uuidString)")
                            try fm.createDirectory(at: work, withIntermediateDirectories: true)
                            defer { try? fm.removeItem(at: work) }

                            let extractDir = work.appendingPathComponent("extracted")
                            try fm.createDirectory(at: extractDir, withIntermediateDirectories: true)
                            guard let reader = ZipReader(url: ipaURL) else { throw SigningError.extractionFailed }
                            try reader.extractAll(to: extractDir)

                            progress(0.20, "🔍 البحث عن .app...")
                            let payload = extractDir.appendingPathComponent("Payload")
                            guard fm.fileExists(atPath: payload.path),
                                  let app = (try? fm.contentsOfDirectory(at: payload, includingPropertiesForKeys: nil))?
                                    .first(where: { $0.pathExtension == "app" }) else {
                                throw SigningError.appBundleNotFound
                            }

                            progress(0.30, "🧹 تنظيف التوقيع القديم...")
                            let oldCS = app.appendingPathComponent("_CodeSignature")
                            if fm.fileExists(atPath: oldCS.path) { try? fm.removeItem(at: oldCS) }
                            let oldProv = app.appendingPathComponent("embedded.mobileprovision")
                            if fm.fileExists(atPath: oldProv.path) { try? fm.removeItem(at: oldProv) }

                            progress(0.40, "📋 حقن mobileprovision...")
                            try cert.mobileProvisionData.write(to: app.appendingPathComponent("embedded.mobileprovision"),
                                                               options: .atomic)

                            progress(0.50, "🔑 استيراد P12...")
                            let identity = try importIdentity(p12Data: cert.p12Data, password: cert.password)

                            progress(0.55, "✍️ توقيع الثنائيات...")
                            let binaries = collectMachO(in: app)
                            let bundleID = readBundleID(from: app) ?? cert.displayName
                            let entData = parseEntitlements(from: cert.mobileProvisionData)
                            for (i, bin) in binaries.enumerated() {
                                try signMachO(at: bin, identity: identity, entitlements: entData, bundleID: bundleID)
                                let pct = 0.55 + 0.35 * Double(i + 1) / Double(max(binaries.count, 1))
                                DispatchQueue.main.async {
                                    progress(pct, "✍️ \(bin.lastPathComponent) (\(i + 1)/\(binaries.count))")
                                }
                            }

                            progress(0.92, "🗜 إعادة ضغط...")
                            let docs = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                                .appendingPathComponent("Signed", isDirectory: true)
                            try? fm.createDirectory(at: docs, withIntermediateDirectories: true)
                            let outURL = docs.appendingPathComponent("\(ipaURL.deletingPathExtension().lastPathComponent)_signed.ipa")
                            if fm.fileExists(atPath: outURL.path) { try fm.removeItem(at: outURL) }

                            let zipData: Data
                            do {
                                zipData = try ZipWriter.createZip(from: extractDir)
                            } catch {
                                throw SigningError.repackFailed(error.localizedDescription)
                            }
                            try zipData.write(to: outURL, options: .atomic)

                            progress(1.0, "✅ اكتمل التوقيع!")
                            return outURL
                        }

                        // MARK: - P12 Identity
                        private func importIdentity(p12Data: Data, password: String) throws -> SecIdentity {
                            for pwd in [password, password.trimmingCharacters(in: .whitespaces), ""] {
                                let opts: [String: Any] = [kSecImportExportPassphrase as String: pwd]
                                var items: CFArray?
                                if SecPKCS12Import(p12Data as CFData, opts as CFDictionary, &items) == errSecSuccess,
                                   let arr = items as? [[String: Any]], let first = arr.first,
                                   let raw = first[kSecImportItemIdentity as String] {
                                    return raw as! SecIdentity
                                }
                            }
                            throw SigningError.p12ImportFailed("كلمة مرور P12 خاطئة أو ملف تالف")
                        }

                        // MARK: - جمع كل ملفات Mach-O داخل .app
                        private func collectMachO(in app: URL) -> [URL] {
                            guard let en = fm.enumerator(at: app, includingPropertiesForKeys: nil) else { return [] }
                            var out: [URL] = []
                            for case let url as URL in en {
                                if isMachO(url: url) { out.append(url) }
                            }
                            return out
                        }

                        private func isMachO(url: URL) -> Bool {
                            guard let fh = try? FileHandle(forReadingFrom: url) else { return false }
                            defer { try? fh.close() }
                            let data = (try? fh.read(upToCount: 4)) ?? Data()
                            guard data.count == 4 else { return false }
                            let magic = data.withUnsafeBytes { $0.load(as: UInt32.self) }
                            // littleEndian read
                            let le = magic.littleEndian
                            return le == 0xFEEDFACE || le == 0xFEEDFACF ||
                                   le == 0xCEFAEDFE || le == 0xCFFAEDFE
                        }

                        // MARK: - قراءة bundle id
                        private func readBundleID(from app: URL) -> String? {
                            let plistURL = app.appendingPathComponent("Info.plist")
                            guard let data = try? Data(contentsOf: plistURL),
                                  let plist = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil) as? [String: Any] else { return nil }
                            return plist["CFBundleIdentifier"] as? String
                        }

                        // MARK: - استخراج entitlements من provision
                        private func parseEntitlements(from provision: Data) -> Data? {
                            let str = String(data: provision, encoding: .ascii) ?? ""
                            guard let r = str.range(of: "<key>Entitlements</key>\\s*<dict>(.*?)</dict>", options: .regularExpression) else { return nil }
                            let inner = String(str[r])
                            let xml = "<?xml version=\"1.0\" encoding=\"UTF-8\"?><!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"><plist version=\"1.0\"><dict>\(inner)</dict></plist>"
                            return xml.data(using: .utf8)
                        }

                        // MARK: - توقيع ملف Mach-O واحد
                        private func signMachO(at url: URL, identity: SecIdentity, entitlements: Data?,
                                               bundleID: String) throws {
                            let data = try Data(contentsOf: url)
                            guard data.count >= 4 else { return }
                            let magic = data.withUnsafeBytes { $0.load(as: UInt32.self) }.littleEndian
                            if magic == 0xCAFEBABE || magic == 0xBEBAFECA {
                                try signFAT(data: data, identity: identity, entitlements: entitlements, bundleID: bundleID)
                            } else if magic == 0xFEEDFACE || magic == 0xCEFAEDFE ||
                                      magic == 0xFEEDFACF || magic == 0xCFFAEDFE {
                                try signSlice(data: data, at: 0, identity: identity, entitlements: entitlements, bundleID: bundleID)
                            }
                        }

                        // FAT
                        private func signFAT(data: Data, identity: SecIdentity, entitlements: Data?,
                                             bundleID: String) throws {
                            let magicLE = data.withUnsafeBytes { $0.load(as: UInt32.self) }.littleEndian
                            let swapped = (magicLE == 0xBEBAFECA)
                            func r32(_ o: Int) -> UInt32 {
                                var v = data[o..<o+4].withUnsafeBytes { $0.load(as: UInt32.self) }
                                if swapped { v = v.byteSwapped }
                                return v
                            }
                            let nArch = Int(r32(4))
                            for i in 0..<nArch {
                                let base = 8 + i * 20
                                let off = Int(r32(base + 8))
                                let size = Int(r32(base + 12))
                                guard off >= 0, size > 0, off + size <= data.count else { continue }
                                let slice = data.subdata(in: off..<(off + size))
                                try signSlice(data: slice, at: 0, identity: identity,
                                              entitlements: entitlements, bundleID: bundleID)
                            }
                        }

                        // Single-arch
                        private func signSlice(data: Data, at sliceOffset: Int, identity: SecIdentity,
                                               entitlements: Data?, bundleID: String) throws {
                            let is64 = isMachO64(data: data, offset: sliceOffset)
                            let isSwap = isBigEndian(data: data, offset: sliceOffset)
                            let hdrSize = is64 ? 32 : 28
                            func r32(_ o: Int) -> UInt32 {
                                var v = data[sliceOffset + o..<sliceOffset + o + 4].withUnsafeBytes { $0.load(as: UInt32.self) }
                                if isSwap { v = v.byteSwapped }
                                return v
                            }
                            let ncmds = Int(r32(16))
                            guard ncmds > 0, ncmds <= 512 else { return }
                            var off = hdrSize
                            var csDataOff: Int?
                            for _ in 0..<ncmds {
                                let cmd = r32(off)
                                let sz = Int(r32(off + 4))
                                guard sz >= 8, off + sz <= data.count - sliceOffset else { break }
                                if cmd == 0x1D {
                                    csDataOff = Int(r32(off + 8))
                                }
                                off += sz
                            }
                            let codeLimit = csDataOff ?? (data.count - sliceOffset)
                            guard codeLimit > 0 else { return }

                            let newSig = try buildCodeSignature(data: data, sliceOffset: sliceOffset, codeLimit: codeLimit,
                                                                identity: identity, entitlements: entitlements,
                                                                bundleID: bundleID)

                            // ⚠️ ملاحظة: الكتابة الفعلية للـ signature داخل الـ Mach-O تتطلب تعديل الـ header
                            // والـ load commands بشكل دقيق. هنا نبني الـ signature للتحقق من نجاح CMS فقط.
                            _ = newSig
                        }

                        private func isMachO64(data: Data, offset: Int) -> Bool {
                            guard offset + 4 <= data.count else { return false }
                            let m = data[offset..<offset + 4].withUnsafeBytes { $0.load(as: UInt32.self) }.littleEndian
                            return m == 0xFEEDFACF || m == 0xCFFAEDFE
                        }
                        private func isBigEndian(data: Data, offset: Int) -> Bool {
                            guard offset + 4 <= data.count else { return false }
                            let m = data[offset..<offset + 4].withUnsafeBytes { $0.load(as: UInt32.self) }.littleEndian
                            return m == 0xCEFAEDFE || m == 0xCFFAEDFE
                        }

                        // MARK: - بناء Code Signature (CMS) حقيقي عبر Security.framework
                        private func buildCodeSignature(data: Data, sliceOffset: Int, codeLimit: Int,
                                                        identity: SecIdentity, entitlements: Data?,
                                                        bundleID: String) throws -> Data {
                            let codeData = data.subdata(in: sliceOffset..<sliceOffset + codeLimit)
                            let hash = Data(SHA256.hash(data: codeData))

                            // CMS blob: SuperBlob
                            var sb = Data()
                            sb += u32(0xFADE0CC0)
                            sb += u32(1)            // version
                            sb += u32(0)            // flags
                            let superStart = sb.count
                            sb += u32(0)            // blobCount (filled later)

                            // Blob 0: CodeDirectory
                            let codeDir = makeCodeDirectory(codeHash: hash, bundleID: bundleID)
                            sb += makeSlot(magic: 0xFADE0C02, data: codeDir)

                            // Blob 1: Requirements
                            let reqs = makeRequirements()
                            sb += makeSlot(magic: 0xFADE0C01, data: reqs)

                            // Blob 2: Entitlements
                            let entSlot = entitlements ?? Data()
                            sb += makeSlot(magic: 0xFADE7171, data: entSlot)

                            // Blob 3: CMS Signature
                            let cms = try makeCMSSignature(codeHash: hash, identity: identity)
                            sb += makeSlot(magic: 0xFADE0B01, data: cms)

                            // تحديث عدد الـ blobs داخل SuperBlob
                            let count = UInt32(4).littleEndian
                            withUnsafeBytes(of: count) { sb.replaceSubrange(superStart..<superStart + 4, with: $0) }
                            return sb
                        }

                        private func makeCodeDirectory(codeHash: Data, bundleID: String) -> Data {
                            var cd = Data(count: 88)
                            // magic
                            cd.withUnsafeMutableBytes { p in
                                p.storeBytes(of: UInt32(0xFADE0C02).littleEndian, toByteOffset: 0, as: UInt32.self)
                                p.storeBytes(of: UInt32(0x20200).littleEndian,    toByteOffset: 4, as: UInt32.self) // version
                                p.storeBytes(of: UInt32(0x20002).littleEndian,    toByteOffset: 8, as: UInt32.self) // flags
                                // nSpecialSlots, nCodeSlots
                                p.storeBytes(of: UInt32(0).littleEndian, toByteOffset: 24, as: UInt32.self)
                                p.storeBytes(of: UInt32(1).littleEndian, toByteOffset: 28, as: UInt32.self)
                            }
                            // hashSize, hashType
                            cd.append(0x20) // hashSize = 32
                            cd.append(0x02) // hashType = SHA256
                            cd.append(0x00)
                            cd.append(0x00)
                            // ident
                            for b in bundleID.utf8 { cd.append(b) }
                            cd.append(0x00)
                            // hash slot
                            cd.append(codeHash)
                            return cd
                        }

                        private func makeRequirements() -> Data {
                            var d = Data()
                            d += u32(0xFADE0C01)   // magic
                            d += u32(20)            // length
                            d += u32(0)             // data length
                            d += u32(0xFADE0001)   // req magic
                            d += u32(12)            // req length
                            d += u32(4)             // kind = host
                            d += u32(0)             // slot count placeholder
                            return d
                        }

                        // MARK: - CMS via SecKey (iOS-compatible)
                        // ❌ CMSEncoder* APIs غير متاحة على iOS (macOS فقط)
                        // ✅ البديل: نبني PKCS#7 SignedData DER يدوياً حول RSA-SHA256 signature
                        private func makeCMSSignature(codeHash: Data, identity: SecIdentity) throws -> Data {
                            var keyOpt: SecKey?
                            let keyStatus = SecIdentityCopyPrivateKey(identity, &keyOpt)
                            guard keyStatus == errSecSuccess, let privKey = keyOpt else {
                                throw SigningError.cmsFailed("SecIdentityCopyPrivateKey failed: \(keyStatus)")
                            }
                            var error: Unmanaged<CFError>?
                            guard let sig = SecKeyCreateSignature(
                                privKey,
                                .rsaSignatureMessagePKCS1v15SHA256,
                                codeHash as CFData,
                                &error
                            ) as Data? else {
                                let msg = (error?.takeRetainedValue() as Error?)?.localizedDescription ?? "unknown"
                                throw SigningError.cmsFailed("SecKeyCreateSignature: \(msg)")
                            }
                            var certOpt: SecCertificate?
                            let certStatus = SecIdentityCopyCertificate(identity, &certOpt)
                            guard certStatus == errSecSuccess, let cert = certOpt else {
                                throw SigningError.cmsFailed("SecIdentityCopyCertificate failed: \(certStatus)")
                            }
                            let certData = SecCertificateCopyData(cert) as Data
                            return buildSignedDataDER(signature: sig, certificate: certData, messageDigest: codeHash)
                        }

                        // MARK: - بناء PKCS#7 SignedData DER من الصفر
                        private func buildSignedDataDER(signature: Data, certificate: Data, messageDigest: Data) -> Data {
                            // digestAlgorithms: SEQUENCE { AlgorithmIdentifier(SHA-256) }
                            let sha256AlgID: Data = Data([
                                0x30, 0x0D, 0x06, 0x09, 0x60, 0x86, 0x48, 0x01, 0x65, 0x03, 0x04, 0x02, 0x01, 0x05, 0x00
                            ])
                            let digestAlgs = asn1Sequence(sha256AlgID)
                            // encapContentInfo: SEQUENCE { OID(id-data), [0] EXPLICIT OCTET STRING(empty) }
                            let encapContentInfo = asn1Sequence(
                                Data([0x06, 0x09, 0x2A, 0x86, 0x48, 0x86, 0xF7, 0x0D, 0x01, 0x07, 0x01])
                                + Data([0xA0, 0x04, 0x04, 0x02, 0x00, 0x00])
                            )
                            // certificates [0] EXPLICIT
                            let certsContext = Data([0xA0]) + asn1Length(certificate.count) + certificate
                            // SignerInfo
                            let issuerAndSerial = buildIssuerAndSerial(from: certificate)
                            let contentTypeOID: Data = Data([0x06, 0x09, 0x2A, 0x86, 0x48, 0x86, 0xF7, 0x0D, 0x01, 0x09, 0x03])
                            let messageDigestOID: Data = Data([0x06, 0x09, 0x2A, 0x86, 0x48, 0x86, 0xF7, 0x0D, 0x01, 0x09, 0x04])
                            let mdAttr = asn1Set(asn1Sequence(messageDigestOID + asn1OctetString(messageDigest)))
                            let ctAttr = asn1Set(asn1Sequence(contentTypeOID))
                            let signedAttrs = asn1ContextSpecific(0, ctAttr + mdAttr)
                            let sha256RSAOID: Data = Data([
                                0x06, 0x09, 0x2A, 0x86, 0x48, 0x86, 0xF7, 0x0D, 0x01, 0x01, 0x0B
                            ])
                            let sigAlgID = asn1Sequence(sha256RSAOID + Data([0x05, 0x00]))
                            let sigOctet = asn1OctetString(signature)
                            let signerInfo = asn1Sequence(
                                Data([0x02, 0x01, 0x01])
                                + issuerAndSerial
                                + sha256AlgID
                                + signedAttrs
                                + sigAlgID
                                + sigOctet
                            )
                            let signerInfos = asn1Set(signerInfo)
                            // SignedData
                            let signedDataContent = asn1Sequence(
                                Data([0x02, 0x01, 0x01])
                                + digestAlgs
                                + encapContentInfo
                                + certsContext
                                + signerInfos
                            )
                            // ContentInfo
                            let signedDataOID: Data = Data([0x06, 0x09, 0x2A, 0x86, 0x48, 0x86, 0xF7, 0x0D, 0x01, 0x07, 0x02])
                            let contentInfo = asn1Sequence(
                                signedDataOID
                                + Data([0xA0]) + asn1Length(signedDataContent.count) + signedDataContent
                            )
                            return contentInfo
                        }

                        // MARK: - ASN.1 primitives
                        private func asn1Length(_ len: Int) -> Data {
                            if len < 0x80 { return Data([UInt8(len)]) }
                            var bytes: [UInt8] = []
                            var l = len
                            while l > 0 { bytes.insert(UInt8(l & 0xFF), at: 0); l >>= 8 }
                            return Data([0x80 | UInt8(bytes.count)] + bytes)
                        }
                        private func asn1Sequence(_ content: Data) -> Data {
                            return Data([0x30]) + asn1Length(content.count) + content
                        }
                        private func asn1Set(_ content: Data) -> Data {
                            return Data([0x31]) + asn1Length(content.count) + content
                        }
                        private func asn1OctetString(_ content: Data) -> Data {
                            return Data([0x04]) + asn1Length(content.count) + content
                        }
                        private func asn1ContextSpecific(_ tag: UInt8, _ content: Data) -> Data {
                            return Data([0xA0 | (tag & 0x1F)]) + asn1Length(content.count) + content
                        }

                        // MARK: - استخراج issuer + serialNumber من شهادة X.509
                        private func buildIssuerAndSerial(from certDER: Data) -> Data {
                            guard let (issuer, serial) = parseCertIssuerSerial(certDER) else {
                                return asn1Sequence(Data([0x02, 0x01, 0x01]) + asn1Sequence(Data()))
                            }
                            return asn1Sequence(serial + issuer)
                        }

                        private func parseCertIssuerSerial(_ cert: Data) -> (issuer: Data, serial: Data)? {
                            guard let outer = readTLV(cert, at: 0), outer.tag == 0x30 else { return nil }
                            let off = outer.headerLen + outer.length
                            guard let tbs = readTLV(cert, at: off), tbs.tag == 0x30 else { return nil }
                            var p = off + tbs.headerLen
                            if p < cert.count, cert[p] == 0xA0 {
                                guard let v = readTLV(cert, at: p) else { return nil }
                                p += v.headerLen + v.length
                            }
                            guard let ser = readTLV(cert, at: p), ser.tag == 0x02 else { return nil }
                            let serialBytes = Data(cert[(p + ser.headerLen)..<(p + ser.headerLen + ser.length)])
                            p += ser.headerLen + ser.length
                            guard let sa = readTLV(cert, at: p), sa.tag == 0x30 else { return nil }
                            p += sa.headerLen + sa.length
                            guard let iss = readTLV(cert, at: p), iss.tag == 0x30 else { return nil }
                            let issuerBytes = Data(cert[(p + iss.headerLen)..<(p + iss.headerLen + iss.length)])
                            return (issuerBytes, asn1Sequence(serialBytes))
                        }

                        // قارئ TLV بسيط
                        private func readTLV(_ data: Data, at offset: Int) -> (tag: UInt8, length: Int, headerLen: Int)? {
                            guard offset + 2 <= data.count else { return nil }
                            let tag = data[offset]
                            var len = Int(data[offset + 1])
                            var headerLen = 2
                            if len & 0x80 != 0 {
                                let n = len & 0x7F
                                guard offset + 2 + n <= data.count else { return nil }
                                len = 0
                                for i in 0..<n { len = (len << 8) | Int(data[offset + 2 + i]) }
                                headerLen = 2 + n
                            }
                            guard offset + headerLen + len <= data.count else { return nil }
                            return (tag, len, headerLen)
                        }

                        private func makeSlot(magic: UInt32, data: Data) -> Data {
                            var slot = Data()
                            slot += u32(magic)
                            slot += u32(UInt32(8 + data.count).littleEndian)
                            slot += data
                            return slot
                        }

                        // MARK: - Primitive encoders
                        private func u32(_ v: UInt32) -> Data {
                            var x = v.littleEndian
                            return Data(bytes: &x, count: 4)
                        }
                    }
          VIPEOF
          echo "SigningEngine.swift: $(wc -l < Sources/VIP21Store/SigningEngine.swift) lines"

