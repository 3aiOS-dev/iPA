          // MARK: - URLSession delegate that funnels progress + completion to a DownloadItem
          final class ItemDownloadDelegate: NSObject, URLSessionDownloadDelegate {
              weak var item: DownloadItem?
              init(item: DownloadItem) { self.item = item }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didWriteData bytesWritten: Int64,
                              totalBytesWritten: Int64,
                              totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0 else { return }
                  let progress = Double(totalBytesWritten) / Double(totalBytesExpectedToWrite)
                  item?.updateProgress(progress)
                  item?.updateBytes(received: totalBytesWritten, total: totalBytesExpectedToWrite)
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                              didFinishDownloadingTo location: URL) {
                  guard let item = item else { return }
                  let dest = item.expectedLocalURL
                  try? FileManager.default.removeItem(at: dest)
                  do {
                      try FileManager.default.moveItem(at: location, to: dest)
                      item.setCompleted(fileURL: dest)
                  } catch {
                      item.setError("Failed to save file: \(error.localizedDescription)")
                  }
              }

              func urlSession(_ session: URLSession, task: URLSessionTask,
                              didCompleteWithError error: Error?) {
                  guard let error = error as NSError? else { return }
                  if error.code == NSURLErrorCancelled { return }
                  item?.setError(error.localizedDescription)
              }
          }

          // MARK: - DownloadItem (real download backing one app)
          final class DownloadItem: ObservableObject, Identifiable {
              let id = UUID()
              let app: StoreAPIApp
              @Published var progress: Double = 0
              @Published var isPaused: Bool = true
              @Published var isCompleted: Bool = false
              @Published var localFileURL: URL? = nil
              @Published var errorMessage: String? = nil
              @Published var totalBytes: Int64 = 0
              @Published var receivedBytes: Int64 = 0

              private var task: URLSessionDownloadTask?
              private var session: URLSession?
              private var delegate: ItemDownloadDelegate?
              private var resumeData: Data? = nil
              private let downloadURLString: String

              init(app: StoreAPIApp) {
                  self.app = app
                  self.downloadURLString = app.ipaUrl ?? app.archiveUrl ?? app.githubUrl ?? ""
              }

              /// Returns the stable on-disk location for this item's IPA file.
              var expectedLocalURL: URL {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  return docs.appendingPathComponent("21s_\(app.id)_\(id.uuidString.prefix(8)).ipa")
              }

              /// If a previous file for this app still exists on disk, mark the item as already completed.
              func restoreIfCompleted() {
                  let url = expectedLocalURL
                  if FileManager.default.fileExists(atPath: url.path) {
                      self.localFileURL = url
                      self.progress = 1.0
                      self.isCompleted = true
                      self.isPaused = false
                  }
              }

              func start() {
                  guard !isCompleted, task == nil else { return }
                  guard let url = URL(string: downloadURLString), !downloadURLString.isEmpty else {
                      self.errorMessage = "No download URL available"
                      return
                  }
                  self.errorMessage = nil
                  self.isPaused = false

                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = 30
                  config.timeoutIntervalForResource = 60 * 30
                  let del = ItemDownloadDelegate(item: self)
                  self.delegate = del
                  let s = URLSession(configuration: config, delegate: del, delegateQueue: nil)
                  self.session = s

                  let t: URLSessionDownloadTask
                  if let resumeData = resumeData {
                      t = s.downloadTask(withResumeData: resumeData)
                      self.resumeData = nil
                  } else {
                      t = s.downloadTask(with: url)
                  }
                  self.task = t
                  t.resume()
                  // Fire-and-forget local notification: "Download started"
                  NotificationManager.shared.notifyDownloadStarted(appName: app.name, appId: app.id)
              }

              func togglePause() {
                  if isCompleted { return }
                  isPaused.toggle()
                  if isPaused {
                      task?.cancel(byProducingResumeData: { data in
                          self.resumeData = data
                      })
                      cleanupSession()
                  } else {
                      start()
                  }
              }

              func cancel() {
                  task?.cancel()
                  cleanupSession()
              }

              private func cleanupSession() {
                  task = nil
                  session?.invalidateAndCancel()
                  session = nil
                  delegate = nil
              }

              fileprivate func updateProgress(_ value: Double) {
                  DispatchQueue.main.async {
                      self.progress = min(1.0, max(0.0, value))
                  }
              }

              fileprivate func updateBytes(received: Int64, total: Int64) {
                  DispatchQueue.main.async {
                      self.receivedBytes = received
                      self.totalBytes = total
                  }
              }

              fileprivate func setCompleted(fileURL: URL) {
                  DispatchQueue.main.async {
                      self.localFileURL = fileURL
                      self.progress = 1.0
                      self.isCompleted = true
                      self.isPaused = false
                      self.task = nil
                      self.session?.finishTasksAndInvalidate()
                      self.session = nil
                      self.delegate = nil
                      HapticManager.shared.success()
                      // Fire-and-forget local notification: "Download complete"
                      NotificationManager.shared.notifyDownloadCompleted(appName: self.app.name, appId: self.app.id)
                  }
              }

              fileprivate func setError(_ message: String) {
                  DispatchQueue.main.async {
                      self.errorMessage = message
                      self.isPaused = true
                      self.task = nil
                      self.session?.finishTasksAndInvalidate()
                      self.session = nil
                      self.delegate = nil
                  }
              }

              deinit {
                  task?.cancel()
              }
          }

          // MARK: - Share request bridge (manager → view)
          struct ShareRequest: Identifiable, Equatable {
              let id = UUID()
              let fileURL: URL
              static func == (lhs: ShareRequest, rhs: ShareRequest) -> Bool { lhs.id == rhs.id }
          }

          // MARK: - DownloadsManager (real download / share / delete)
          final class DownloadsManager: ObservableObject {
              static let shared = DownloadsManager()
              @Published private(set) var all: [DownloadItem] = []
              @Published var shareRequest: ShareRequest? = nil

              var active: [DownloadItem] { all.filter { !$0.isCompleted } }
              var completed: [DownloadItem] { all.filter { $0.isCompleted } }

              init() {
                  // Completed items are restored lazily when the user re-installs
                  // the same app (see DownloadItem.restoreIfCompleted).
              }

              func enqueue(app: StoreAPIApp) {
                  if all.contains(where: { $0.app.id == app.id }) { return }
                  let item = DownloadItem(app: app)
                  item.restoreIfCompleted()
                  all.insert(item, at: 0)
                  if !item.isCompleted {
                      item.start()
                  } else {
                      HapticManager.shared.success()
                  }
              }

              func togglePause(item: DownloadItem) {
                  item.togglePause()
              }

              func pauseAll() {
                  active.forEach { item in
                      if !item.isPaused { item.togglePause() }
                  }
              }

              func delete(item: DownloadItem) {
                  if let url = item.localFileURL {
                      try? FileManager.default.removeItem(at: url)
                  } else {
                      try? FileManager.default.removeItem(at: item.expectedLocalURL)
                  }
                  all.removeAll { $0.id == item.id }
                  HapticManager.shared.success()
              }

              func share(item: DownloadItem) {
                  guard let url = item.localFileURL,
                        FileManager.default.fileExists(atPath: url.path) else {
                      HapticManager.shared.error()
                      return
                  }
                  shareRequest = ShareRequest(fileURL: url)
              }

              func clearShareRequest() {
                  shareRequest = nil
              }

              func cleanupOrphanedFiles() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  let active = Set(all.compactMap { $0.localFileURL?.lastPathComponent })
                  let activeExpected = Set(all.map { $0.expectedLocalURL.lastPathComponent })
                  guard let files = try? FileManager.default.contentsOfDirectory(at: docs, includingPropertiesForKeys: nil) else { return }
                  for f in files where f.pathExtension == "ipa" {
                      if !active.contains(f.lastPathComponent) && !activeExpected.contains(f.lastPathComponent) {
                          try? FileManager.default.removeItem(at: f)
                      }
                  }
              }
          }

