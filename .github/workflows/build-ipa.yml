name: Build YouTube Search Tweak (Theos)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install build tools
        run: |
          brew install ldid dpkg xz git

      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          git submodule update --init --recursive
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV

      - name: Create tweak source files
        run: |
          mkdir -p YouTubeSearchTweak
          cd YouTubeSearchTweak

          cat > Makefile << 'EOF'
          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = YouTubeSearch
          YouTubeSearch_FILES = Tweak.xm
          YouTubeSearch_CFLAGS = -fobjc-arc
          YouTubeSearch_LDFLAGS = -lobjc

          ARCHS = arm64
          TARGET = iphone:clang:16.0:14.0

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          mkdir -p layout/DEBIAN
          cat > layout/DEBIAN/control << 'EOF'
          Package: com.yourname.youtube-search
          Name: YouTube Search
          Version: 1.0
          Architecture: iphoneos-arm
          Description: Adds a floating button to search YouTube from any app.
          Maintainer: Your Name <you@example.com>
          Author: Your Name
          Section: Tweaks
          EOF

          cat > Tweak.xm << 'EOF'
          %config(DEBUG=0)
          #import <UIKit/UIKit.h>

          @interface UIWindow (Additions)
          - (void)addFloatingButtonIfNeeded;
          @end

          @implementation UIWindow (Additions)

          - (void)addFloatingButtonIfNeeded {
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  if (self != [UIApplication sharedApplication].keyWindow) return;

                  UIButton *button = [UIButton buttonWithType:UIButtonTypeCustom];
                  button.frame = CGRectMake(20, 100, 55, 55);
                  [button setTitle:@"🔍" forState:UIControlStateNormal];
                  button.titleLabel.font = [UIFont systemFontOfSize:28];
                  button.backgroundColor = [UIColor colorWithRed:0.2 green:0.6 blue:1.0 alpha:0.9];
                  button.layer.cornerRadius = 27.5;
                  button.layer.masksToBounds = YES;
                  button.layer.shadowColor = [UIColor blackColor].CGColor;
                  button.layer.shadowOpacity = 0.4;
                  button.layer.shadowRadius = 5;
                  button.layer.shadowOffset = CGSizeMake(0, 2);
                  [button addTarget:self action:@selector(searchButtonTapped) forControlEvents:UIControlEventTouchUpInside];

                  UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(handlePan:)];
                  [button addGestureRecognizer:pan];

                  [self addSubview:button];
              });
          }

          - (void)searchButtonTapped {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"YouTube Search"
                                                                             message:@"أدخل كلمة البحث"
                                                                      preferredStyle:UIAlertControllerStyleAlert];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *textField) {
                  textField.placeholder = @"بحث...";
                  textField.clearButtonMode = UITextFieldViewModeWhileEditing;
              }];

              UIAlertAction *cancel = [UIAlertAction actionWithTitle:@"إلغاء" style:UIAlertActionStyleCancel handler:nil];
              UIAlertAction *search = [UIAlertAction actionWithTitle:@"بحث" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *query = alert.textFields.firstObject.text;
                  if (query.length == 0) return;

                  NSString *encoded = [query stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];

                  NSString *urlString = [NSString stringWithFormat:@"youtube://search?q=%@", encoded];
                  NSURL *url = [NSURL URLWithString:urlString];
                  UIApplication *app = [UIApplication sharedApplication];

                  if ([app canOpenURL:url]) {
                      [app openURL:url options:@{} completionHandler:nil];
                  } else {
                      NSString *webURL = [NSString stringWithFormat:@"https://www.youtube.com/results?search_query=%@", encoded];
                      [app openURL:[NSURL URLWithString:webURL] options:@{} completionHandler:nil];
                  }
              }];

              [alert addAction:cancel];
              [alert addAction:search];

              UIViewController *rootVC = [UIApplication sharedApplication].keyWindow.rootViewController;
              if (rootVC) {
                  [rootVC presentViewController:alert animated:YES completion:nil];
              } else {
                  [[UIApplication sharedApplication].keyWindow.rootViewController presentViewController:alert animated:YES completion:nil];
              }
          }

          - (void)handlePan:(UIPanGestureRecognizer *)gesture {
              UIButton *button = (UIButton *)gesture.view;
              UIView *superview = button.superview;

              if (gesture.state == UIGestureRecognizerStateChanged) {
                  CGPoint translation = [gesture translationInView:superview];
                  button.center = CGPointMake(button.center.x + translation.x,
                                              button.center.y + translation.y);
                  [gesture setTranslation:CGPointZero inView:superview];
              }
          }

          @end

          %hook UIWindow
          - (void)layoutSubviews {
              %orig;
              [self addFloatingButtonIfNeeded];
          }
          %end
          EOF

          # إضافة ملف الفلتر (لجميع التطبيقات)
          cat > YouTubeSearch.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.apple.UIKit</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Build tweak
        run: |
          cd YouTubeSearchTweak
          export THEOS=$HOME/theos
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          make clean
          make package

      - name: Copy .deb to artifacts
        run: |
          mkdir -p artifacts
          # Theos يضع الـ .deb في مجلد packages/
          find YouTubeSearchTweak -name "*.deb" -exec cp {} artifacts/ \;
          # تأكد من وجود الملف
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSearchTweak
          path: artifacts/*.deb
          retention-days: 90
