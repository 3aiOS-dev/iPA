                               mediaURL: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
                               likes: 39)
                  ]
              }

              private static func seedTools() -> [DevTool] {
                  [
                      DevTool(developer: "21s Studio", verified: true,
                              name: "IPA Signer Pro", details: "أداة لتوقيع ملفات IPA بسرعة.",
