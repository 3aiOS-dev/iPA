              private func toggleReveal(forID: Bool) {
                  HapticManager.shared.impact(.light)
                  if forID {
                      if !isUserIDRevealed {
                          UIPasteboard.general.string = displayUserID
                          copiedText = "User ID"
                          showCopiedToast = true
                          DispatchQueue.main.asyncAfter(deadline: .now() + 1.6) { showCopiedToast = false }
                      }
                      withAnimation(.easeInOut(duration: 0.2)) { isUserIDRevealed.toggle() }
                  } else {
                      if !isCardNumberRevealed {
                          UIPasteboard.general.string = displayCardNumber
                          copiedText = "Card Number"
                          showCopiedToast = true
                          DispatchQueue.main.asyncAfter(deadline: .now() + 1.6) { showCopiedToast = false }
                      }
                      withAnimation(.easeInOut(duration: 0.2)) { isCardNumberRevealed.toggle() }
                  }
              }

              private func generateUserID() -> String {
                  let chars = "ABCDEF0123456789"
                  var s = ""
                  for i in 0..<12 {
                      if i > 0 && i % 4 == 0 { s += "-" }
                      s += String(chars.randomElement()!)
                  }
                  return s
              }

              private func generateCardNumber() -> String {
                  var s = ""
                  for i in 0..<16 {
                      s += String(Int.random(in: 0...9))
                      if (i + 1) % 4 == 0 && i != 15 { s += " " }
                  }
                  return s
              }
          }

