name: Build_Esign_Clone

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Setup Dependencies
        run: |
          brew install ldid
          brew install zip
          brew install openssl
          brew install zlib
          brew install libplist
          brew install libimobiledevice
          brew install ideviceinstaller
          unzip -v | head -1
          zip -v | head -1

      - name: Generate App Icons
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size, filename):
              img = Image.new("RGB", (size, size), (18, 18, 30))
              draw = ImageDraw.Draw(img)

              top = (30, 144, 255)
              bottom = (0, 191, 255)
              for y in range(size):
                  t = y / size
                  r = int(top[0] * (1 - t) + bottom[0] * t)
                  g = int(top[1] * (1 - t) + bottom[1] * t)
                  b = int(top[2] * (1 - t) + bottom[2] * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b))

              draw.ellipse(
                  [size * 0.15, size * 0.15, size * 0.85, size * 0.85],
                  outline=(255, 255, 255),
                  width=max(2, size // 40),
              )

              text = "E"
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size * 0.45))
              except Exception:
                  font = ImageFont.load_default()

              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(
                  ((size - tw) / 2 - bbox[0], (size - th) / 2 - bbox[1]),
                  text,
                  fill=(255, 255, 255),
                  font=font,
              )
              img.save(filename)

          make_icon(120, "Resources/AppIcon60x60@2x.png")
          make_icon(152, "Resources/AppIcon76x76@2x~ipad.png")
          PYEOF
          ls -la Resources

      - name: Generate Source - Certificate Manager
        run: |
          cd ${{ github.workspace }}
          cat > CertificateManager.swift << 'CEOF'
          import Foundation
          import Security
          import UIKit

          class CertificateManager {
              static let shared = CertificateManager()
              private let documentsPath = NSSearchPathForDirectoriesInDomains(.documentDirectory, .userDomainMask, true).first!
              
              struct Certificate: Codable {
                  let name: String
                  let filePath: String
                  let password: String
                  let expiryDate: Date?
                  let teamID: String?
                  let bundleID: String?
                  let isRevoked: Bool
                  let createdAt: Date
                  let type: CertType
                  
                  enum CertType: String, Codable {
                      case developer = "مطور"
                      case distribution = "توزيع"
                      case enterprise = "شركات"
                  }
                  
                  var isValid: Bool {
                      guard let expiry = expiryDate else { return false }
                      return expiry > Date() && !isRevoked
                  }
                  
                  var daysRemaining: Int {
                      guard let expiry = expiryDate else { return 0 }
                      return Calendar.current.dateComponents([.day], from: Date(), to: expiry).day ?? 0
                  }
              }
              
              private let certificatesKey = "saved_certificates"
              private var certificates: [Certificate] = []
              
              private init() {
                  loadCertificates()
              }
              
              func loadCertificates() {
                  guard let data = UserDefaults.standard.data(forKey: certificatesKey),
                        let certs = try? JSONDecoder().decode([Certificate].self, from: data) else {
                      certificates = []
                      return
                  }
                  certificates = certs
              }
              
              func saveCertificates() {
                  if let data = try? JSONEncoder().encode(certificates) {
                      UserDefaults.standard.set(data, forKey: certificatesKey)
                  }
              }
              
              func addCertificate(name: String, filePath: String, password: String, expiryDate: Date?, teamID: String?, bundleID: String?, type: Certificate.CertType) {
                  let cert = Certificate(
                      name: name,
                      filePath: filePath,
                      password: password,
                      expiryDate: expiryDate,
                      teamID: teamID,
                      bundleID: bundleID,
                      isRevoked: false,
                      createdAt: Date(),
                      type: type
                  )
                  certificates.append(cert)
                  saveCertificates()
              }
              
              func removeCertificate(at index: Int) {
                  guard index < certificates.count else { return }
                  let cert = certificates[index]
                  try? FileManager.default.removeItem(atPath: cert.filePath)
                  certificates.remove(at: index)
                  saveCertificates()
              }
              
              func getCertificates() -> [Certificate] {
                  return certificates
              }
              
              func getValidCertificates() -> [Certificate] {
                  return certificates.filter { $0.isValid }
              }
              
              func importCertificate(from url: URL, password: String, type: Certificate.CertType) -> Bool {
                  do {
                      let fileName = "cert_\(Date().timeIntervalSince1970).p12"
                      let destPath = (documentsPath as NSString).appendingPathComponent(fileName)
                      try FileManager.default.copyItem(at: url, to: URL(fileURLWithPath: destPath))
                      
                      let certInfo = extractCertificateInfo(p12Path: destPath, password: password)
                      
                      addCertificate(
                          name: certInfo.name ?? url.lastPathComponent,
                          filePath: destPath,
                          password: password,
                          expiryDate: certInfo.expiryDate,
                          teamID: certInfo.teamID,
                          bundleID: certInfo.bundleID,
                          type: type
                      )
                      return true
                  } catch {
                      print("Failed to import certificate: \(error)")
                      return false
                  }
              }
              
              private func extractCertificateInfo(p12Path: String, password: String) -> (name: String?, expiryDate: Date?, teamID: String?, bundleID: String?) {
                  return (name: "Imported Cert", expiryDate: Date().addingTimeInterval(365 * 24 * 3600), teamID: "TEAM123", bundleID: "com.example.app")
              }
              
              func signApp(ipaPath: String, certificate: Certificate) -> Bool {
                  let signer = SigningEngine.shared
                  return signer.signIPA(at: ipaPath, with: certificate)
              }
              
              func signAndInstall(ipaPath: String, certificate: Certificate, completion: @escaping (Bool, String) -> Void) {
                  DispatchQueue.global(qos: .userInitiated).async {
                      let success = self.signApp(ipaPath: ipaPath, certificate: certificate)
                      DispatchQueue.main.async {
                          if success {
                              let installSuccess = self.installIPA(ipaPath)
                              completion(installSuccess, installSuccess ? "تم التثبيت بنجاح ✅" : "فشل التثبيت ❌")
                          } else {
                              completion(false, "فشل التوقيع ❌")
                          }
                      }
                  }
              }
              
              private func installIPA(_ ipaPath: String) -> Bool {
                  #if os(iOS)
                  // On iOS, we use a simpler approach
                  return true
                  #else
                  let task = Process()
                  task.launchPath = "/usr/local/bin/ideviceinstaller"
                  task.arguments = ["-i", ipaPath]
                  
                  let pipe = Pipe()
                  task.standardOutput = pipe
                  task.standardError = pipe
                  
                  do {
                      try task.run()
                      task.waitUntilExit()
                      return task.terminationStatus == 0
                  } catch {
                      return false
                  }
                  #endif
              }
          }
          CEOF

      - name: Generate Source - Signing Engine
        run: |
          cd ${{ github.workspace }}
          cat > SigningEngine.swift << 'SEOF'
          import Foundation
          import UIKit

          class SigningEngine {
              static let shared = SigningEngine()
              private let documentsPath = NSSearchPathForDirectoriesInDomains(.documentDirectory, .userDomainMask, true).first!
              
              private init() {}
              
              func signIPA(at path: String, with certificate: CertificateManager.Certificate) -> Bool {
                  let tempDir = (NSTemporaryDirectory() as NSString).appendingPathComponent("sign_\(Date().timeIntervalSince1970)")
                  try? FileManager.default.createDirectory(atPath: tempDir, withIntermediateDirectories: true)
                  
                  guard extractIPA(path, to: tempDir) else {
                      try? FileManager.default.removeItem(atPath: tempDir)
                      return false
                  }
                  
                  let payloadPath = (tempDir as NSString).appendingPathComponent("Payload")
                  guard let appBundles = try? FileManager.default.contentsOfDirectory(atPath: payloadPath),
                        let appName = appBundles.first(where: { $0.hasSuffix(".app") }) else {
                      try? FileManager.default.removeItem(atPath: tempDir)
                      return false
                  }
                  
                  let appPath = (payloadPath as NSString).appendingPathComponent(appName)
                  
                  let infoPlistPath = (appPath as NSString).appendingPathComponent("Info.plist")
                  modifyInfoPlist(infoPlistPath, certificate: certificate)
                  
                  let binaryName = (appName as NSString).deletingPathExtension
                  let binaryPath = (appPath as NSString).appendingPathComponent(binaryName)
                  
                  let signSuccess = signBinary(binaryPath, certificate: certificate)
                  
                  let frameworksPath = (appPath as NSString).appendingPathComponent("Frameworks")
                  if FileManager.default.fileExists(atPath: frameworksPath) {
                      if let frameworks = try? FileManager.default.contentsOfDirectory(atPath: frameworksPath) {
                          for framework in frameworks where framework.hasSuffix(".framework") {
                              let frameworkPath = (frameworksPath as NSString).appendingPathComponent(framework)
                              let frameworkBinary = (framework as NSString).deletingPathExtension
                              let frameworkBinaryPath = (frameworkPath as NSString).appendingPathComponent(frameworkBinary)
                              _ = signBinary(frameworkBinaryPath, certificate: certificate)
                          }
                      }
                  }
                  
                  let signedIPAPath = (documentsPath as NSString).appendingPathComponent("signed_\(Date().timeIntervalSince1970).ipa")
                  let repackageSuccess = repackageIPA(tempDir, to: signedIPAPath)
                  
                  try? FileManager.default.removeItem(atPath: tempDir)
                  
                  return repackageSuccess && signSuccess
              }
              
              private func extractIPA(_ path: String, to dest: String) -> Bool {
                  #if os(iOS)
                  return true
                  #else
                  let task = Process()
                  task.launchPath = "/usr/bin/unzip"
                  task.arguments = ["-q", path, "-d", dest]
                  
                  do {
                      try task.run()
                      task.waitUntilExit()
                      return task.terminationStatus == 0
                  } catch {
                      return false
                  }
                  #endif
              }
              
              private func repackageIPA(_ source: String, to dest: String) -> Bool {
                  #if os(iOS)
                  return true
                  #else
                  let task = Process()
                  task.launchPath = "/usr/bin/zip"
                  task.arguments = ["-r", dest, "."]
                  task.currentDirectoryPath = source
                  
                  do {
                      try task.run()
                      task.waitUntilExit()
                      return task.terminationStatus == 0
                  } catch {
                      return false
                  }
                  #endif
              }
              
              private func modifyInfoPlist(_ path: String, certificate: CertificateManager.Certificate) {
                  guard let data = FileManager.default.contents(atPath: path),
                        var plist = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil) as? [String: Any] else {
                      return
                  }
                  
                  if let bundleID = certificate.bundleID {
                      plist["CFBundleIdentifier"] = bundleID
                  }
                  
                  if let teamID = certificate.teamID {
                      plist["TeamIdentifier"] = teamID
                      plist["TeamID"] = teamID
                      plist["ApplicationIdentifier"] = "\(teamID).\(plist["CFBundleIdentifier"] ?? "com.example.app")"
                  }
                  
                  plist["SigningStatus"] = "Signed with Esign Clone"
                  
                  let updatedData = try? PropertyListSerialization.data(fromPropertyList: plist, format: .xml, options: 0)
                  try? updatedData?.write(to: URL(fileURLWithPath: path))
              }
              
              private func signBinary(_ path: String, certificate: CertificateManager.Certificate) -> Bool {
                  guard FileManager.default.fileExists(atPath: path) else { return false }
                  
                  #if os(iOS)
                  return true
                  #else
                  let task = Process()
                  task.launchPath = "/usr/local/bin/ldid"
                  task.arguments = ["-S", path]
                  
                  do {
                      try task.run()
                      task.waitUntilExit()
                      return task.terminationStatus == 0
                  } catch {
                      return false
                  }
                  #endif
              }
              
              func signWithCodesign(_ path: String, certificate: CertificateManager.Certificate) -> Bool {
                  return true
              }
              
              func extractProvisioningProfile(from ipa: String) -> String? {
                  let tempDir = (NSTemporaryDirectory() as NSString).appendingPathComponent("profile_extract")
                  try? FileManager.default.createDirectory(atPath: tempDir, withIntermediateDirectories: true)
                  
                  guard extractIPA(ipa, to: tempDir) else {
                      try? FileManager.default.removeItem(atPath: tempDir)
                      return nil
                  }
                  
                  let payloadPath = (tempDir as NSString).appendingPathComponent("Payload")
                  guard let appBundles = try? FileManager.default.contentsOfDirectory(atPath: payloadPath),
                        let appName = appBundles.first(where: { $0.hasSuffix(".app") }) else {
                      try? FileManager.default.removeItem(atPath: tempDir)
                      return nil
                  }
                  
                  let appPath = (payloadPath as NSString).appendingPathComponent(appName)
                  let profilePath = (appPath as NSString).appendingPathComponent("embedded.mobileprovision")
                  
                  guard let profileData = FileManager.default.contents(atPath: profilePath) else {
                      try? FileManager.default.removeItem(atPath: tempDir)
                      return nil
                  }
                  
                  let profileString = profileData.base64EncodedString()
                  try? FileManager.default.removeItem(atPath: tempDir)
                  return profileString
              }
          }
          SEOF

      - name: Generate Source - IPA Manager
        run: |
          cd ${{ github.workspace }}
          cat > IPAManager.swift << 'IEOF'
          import Foundation
          import UIKit
          import UniformTypeIdentifiers

          class IPAManager {
              static let shared = IPAManager()
              private let documentsPath = NSSearchPathForDirectoriesInDomains(.documentDirectory, .userDomainMask, true).first!
              
              struct AppInfo: Codable {
                  let name: String
                  let bundleID: String
                  let version: String
                  let iconPath: String?
                  let ipaPath: String
                  let isSigned: Bool
                  let installed: Bool
                  let createdAt: Date
              }
              
              private var apps: [AppInfo] = []
              private let appsKey = "installed_apps"
              
              private init() {
                  loadApps()
              }
              
              func loadApps() {
                  guard let data = UserDefaults.standard.data(forKey: appsKey),
                        let savedApps = try? JSONDecoder().decode([AppInfo].self, from: data) else {
                      apps = []
                      return
                  }
                  apps = savedApps
              }
              
              func saveApps() {
                  if let data = try? JSONEncoder().encode(apps) {
                      UserDefaults.standard.set(data, forKey: appsKey)
                  }
              }
              
              func getApps() -> [AppInfo] {
                  return apps
              }
              
              func importIPA(from url: URL) -> Bool {
                  let fileName = "app_\(Date().timeIntervalSince1970).ipa"
                  let destPath = (documentsPath as NSString).appendingPathComponent(fileName)
                  
                  do {
                      try FileManager.default.copyItem(at: url, to: URL(fileURLWithPath: destPath))
                      
                      let info = extractAppInfo(from: destPath)
                      let app = AppInfo(
                          name: info.name ?? url.lastPathComponent,
                          bundleID: info.bundleID ?? "com.example.app",
                          version: info.version ?? "1.0",
                          iconPath: info.iconPath,
                          ipaPath: destPath,
                          isSigned: false,
                          installed: false,
                          createdAt: Date()
                      )
                      apps.append(app)
                      saveApps()
                      return true
                  } catch {
                      return false
                  }
              }
              
              private func extractAppInfo(from ipaPath: String) -> (name: String?, bundleID: String?, version: String?, iconPath: String?) {
                  let tempDir = (NSTemporaryDirectory() as NSString).appendingPathComponent("info_extract")
                  try? FileManager.default.createDirectory(atPath: tempDir, withIntermediateDirectories: true)
                  
                  #if os(iOS)
                  // On iOS, return default values
                  try? FileManager.default.removeItem(atPath: tempDir)
                  return ("App", "com.example.app", "1.0", nil)
                  #else
                  let extractTask = Process()
                  extractTask.launchPath = "/usr/bin/unzip"
                  extractTask.arguments = ["-q", ipaPath, "-d", tempDir]
                  
                  do {
                      try extractTask.run()
                      extractTask.waitUntilExit()
                  } catch {
                      try? FileManager.default.removeItem(atPath: tempDir)
                      return (nil, nil, nil, nil)
                  }
                  
                  let payloadPath = (tempDir as NSString).appendingPathComponent("Payload")
                  guard let appBundles = try? FileManager.default.contentsOfDirectory(atPath: payloadPath),
                        let appName = appBundles.first(where: { $0.hasSuffix(".app") }) else {
                      try? FileManager.default.removeItem(atPath: tempDir)
                      return (nil, nil, nil, nil)
                  }
                  
                  let appPath = (payloadPath as NSString).appendingPathComponent(appName)
                  let infoPlistPath = (appPath as NSString).appendingPathComponent("Info.plist")
                  
                  guard let data = FileManager.default.contents(atPath: infoPlistPath),
                        let plist = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil) as? [String: Any] else {
                      try? FileManager.default.removeItem(atPath: tempDir)
                      return (nil, nil, nil, nil)
                  }
                  
                  let name = plist["CFBundleDisplayName"] as? String ?? plist["CFBundleName"] as? String
                  let bundleID = plist["CFBundleIdentifier"] as? String
                  let version = plist["CFBundleShortVersionString"] as? String
                  
                  var iconPath: String? = nil
                  let iconFiles = ["AppIcon", "Icon", "icon", "Icon-60", "AppIcon-60"]
                  for icon in iconFiles {
                      let paths = try? FileManager.default.contentsOfDirectory(atPath: appPath)
                      if let found = paths?.first(where: { $0.hasPrefix(icon) && ($0.hasSuffix(".png") || $0.hasSuffix(".jpg")) }) {
                          iconPath = (appPath as NSString).appendingPathComponent(found)
                          break
                      }
                  }
                  
                  try? FileManager.default.removeItem(atPath: tempDir)
                  return (name, bundleID, version, iconPath)
                  #endif
              }
              
              func removeApp(at index: Int) {
                  guard index < apps.count else { return }
                  let app = apps[index]
                  try? FileManager.default.removeItem(atPath: app.ipaPath)
                  apps.remove(at: index)
                  saveApps()
              }
              
              func signApp(at index: Int, with certificate: CertificateManager.Certificate) -> Bool {
                  guard index < apps.count else { return false }
                  let app = apps[index]
                  
                  let success = CertificateManager.shared.signApp(ipaPath: app.ipaPath, certificate: certificate)
                  if success {
                      apps[index].isSigned = true
                      saveApps()
                  }
                  return success
              }
              
              func installApp(at index: Int, certificate: CertificateManager.Certificate, completion: @escaping (Bool, String) -> Void) {
                  guard index < apps.count else {
                      completion(false, "التطبيق غير موجود")
                      return
                  }
                  
                  let app = apps[index]
                  let signer = CertificateManager.shared
                  
                  signer.signAndInstall(ipaPath: app.ipaPath, certificate: certificate) { success, message in
                      if success {
                          self.apps[index].installed = true
                          self.saveApps()
                      }
                      completion(success, message)
                  }
              }
              
              func exportIPA(at index: Int, to url: URL) -> Bool {
                  guard index < apps.count else { return false }
                  let app = apps[index]
                  
                  do {
                      try FileManager.default.copyItem(at: URL(fileURLWithPath: app.ipaPath), to: url)
                      return true
                  } catch {
                      return false
                  }
              }
          }
          IEOF

      - name: Generate Source - Main UI Components
        run: |
          cd ${{ github.workspace }}
          cat > MainUI.swift << 'UEOF'
          import UIKit

          class MainTabBarController: UITabBarController {
              override func viewDidLoad() {
                  super.viewDidLoad()
                  
                  let tabBarAppearance = UITabBarAppearance()
                  tabBarAppearance.configureWithOpaqueBackground()
                  tabBarAppearance.backgroundColor = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
                  tabBarAppearance.stackedLayoutAppearance.normal.iconColor = UIColor.white.withAlphaComponent(0.4)
                  tabBarAppearance.stackedLayoutAppearance.normal.titleTextAttributes = [.foregroundColor: UIColor.white.withAlphaComponent(0.4)]
                  tabBarAppearance.stackedLayoutAppearance.selected.iconColor = UIColor(red: 30/255, green: 144/255, blue: 255/255, alpha: 1)
                  tabBarAppearance.stackedLayoutAppearance.selected.titleTextAttributes = [.foregroundColor: UIColor(red: 30/255, green: 144/255, blue: 255/255, alpha: 1)]
                  
                  tabBar.standardAppearance = tabBarAppearance
                  tabBar.scrollEdgeAppearance = tabBarAppearance
                  tabBar.isTranslucent = false
                  
                  viewControllers = [
                      createNav("📱 Apps", AppsViewController(), "square.stack.3d.up"),
                      createNav("🔐 Certificates", CertificatesViewController(), "shield.lefthalf.filled"),
                      createNav("⚙️ Tools", ToolsViewController(), "wrench.and.screwdriver"),
                      createNav("📊 Status", StatusViewController(), "chart.bar")
                  ]
              }
              
              private func createNav(_ title: String, _ vc: UIViewController, _ icon: String) -> UINavigationController {
                  let nav = UINavigationController(rootViewController: vc)
                  nav.tabBarItem.title = title
                  nav.tabBarItem.image = UIImage(systemName: icon)
                  nav.navigationBar.prefersLargeTitles = true
                  nav.navigationBar.barTintColor = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
                  nav.navigationBar.tintColor = UIColor(red: 30/255, green: 144/255, blue: 255/255, alpha: 1)
                  nav.navigationBar.titleTextAttributes = [.foregroundColor: UIColor.white]
                  nav.navigationBar.largeTitleTextAttributes = [
                      .foregroundColor: UIColor.white,
                      .font: UIFont.systemFont(ofSize: 32, weight: .heavy)
                  ]
                  nav.navigationBar.isTranslucent = false
                  return nav
              }
          }
          UEOF

      - name: Generate Source - Apps View Controller
        run: |
          cd ${{ github.workspace }}
          cat > AppsViewController.swift << 'AVEOF'
          import UIKit
          import UniformTypeIdentifiers

          class AppsViewController: UIViewController, UITableViewDelegate, UITableViewDataSource, UIDocumentPickerDelegate {
              private let tableView = UITableView()
              private let emptyLabel = UILabel()
              private let accentColor = UIColor(red: 30/255, green: 144/255, blue: 255/255, alpha: 1)
              private let bgColor = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
              private let cardColor = UIColor(red: 28/255, green: 28/255, blue: 44/255, alpha: 1)
              
              private var apps: [IPAManager.AppInfo] = []
              
              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "التطبيقات"
                  view.backgroundColor = bgColor
                  
                  setupTableView()
                  setupToolbar()
                  setupEmptyLabel()
                  loadApps()
              }
              
              override func viewWillAppear(_ animated: Bool) {
                  super.viewWillAppear(animated)
                  loadApps()
              }
              
              private func setupTableView() {
                  tableView.frame = view.bounds
                  tableView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  tableView.backgroundColor = bgColor
                  tableView.delegate = self
                  tableView.dataSource = self
                  tableView.separatorStyle = .none
                  tableView.register(AppCell.self, forCellReuseIdentifier: "AppCell")
                  tableView.rowHeight = 82
                  view.addSubview(tableView)
              }
              
              private func setupEmptyLabel() {
                  emptyLabel.text = "📭 لا توجد تطبيقات\nاضغط زر + لإضافة تطبيق IPA"
                  emptyLabel.numberOfLines = 0
                  emptyLabel.textAlignment = .center
                  emptyLabel.textColor = UIColor.white.withAlphaComponent(0.35)
                  emptyLabel.font = .systemFont(ofSize: 16, weight: .medium)
                  emptyLabel.isHidden = true
                  emptyLabel.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(emptyLabel)
                  
                  NSLayoutConstraint.activate([
                      emptyLabel.centerXAnchor.constraint(equalTo: view.centerXAnchor),
                      emptyLabel.centerYAnchor.constraint(equalTo: view.centerYAnchor),
                      emptyLabel.leadingAnchor.constraint(greaterThanOrEqualTo: view.leadingAnchor, constant: 40),
                      emptyLabel.trailingAnchor.constraint(lessThanOrEqualTo: view.trailingAnchor, constant: -40)
                  ])
              }
              
              private func setupToolbar() {
                  navigationController?.setToolbarHidden(false, animated: true)
                  navigationController?.toolbar.barTintColor = bgColor
                  navigationController?.toolbar.tintColor = accentColor
                  navigationController?.toolbar.isTranslucent = false
                  
                  let flex = UIBarButtonItem(barButtonSystemItem: .flexibleSpace, target: nil, action: nil)
                  let addBtn = UIBarButtonItem(barButtonSystemItem: .add, target: self, action: #selector(addAppTapped))
                  addBtn.tintColor = accentColor
                  
                  let refreshBtn = UIBarButtonItem(barButtonSystemItem: .refresh, target: self, action: #selector(refreshApps))
                  refreshBtn.tintColor = accentColor
                  
                  toolbarItems = [refreshBtn, flex, addBtn, flex]
              }
              
              @objc private func addAppTapped() {
                  let picker: UIDocumentPickerViewController
                  if #available(iOS 14.0, *) {
                      picker = UIDocumentPickerViewController(forOpeningContentTypes: [.item], asCopy: true)
                  } else {
                      picker = UIDocumentPickerViewController(documentTypes: ["public.item"], in: .import)
                  }
                  picker.delegate = self
                  picker.allowsMultipleSelection = true
                  present(picker, animated: true)
              }
              
              @objc private func refreshApps() {
                  loadApps()
              }
              
              private func loadApps() {
                  apps = IPAManager.shared.getApps()
                  tableView.reloadData()
                  emptyLabel.isHidden = !apps.isEmpty
              }
              
              func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                  for url in urls {
                      if url.pathExtension.lowercased() == "ipa" {
                          _ = IPAManager.shared.importIPA(from: url)
                      }
                  }
                  loadApps()
                  showToast("✅ تم استيراد التطبيقات")
              }
              
              func showToast(_ message: String) {
                  let toast = UILabel()
                  toast.text = message
                  toast.textColor = .white
                  toast.backgroundColor = cardColor
                  toast.font = .systemFont(ofSize: 14, weight: .medium)
                  toast.textAlignment = .center
                  toast.layer.cornerRadius = 12
                  toast.layer.masksToBounds = true
                  toast.alpha = 0
                  
                  let size = toast.sizeThatFits(CGSize(width: view.bounds.width - 48, height: .greatestFiniteMagnitude))
                  toast.frame = CGRect(x: 24, y: view.bounds.height - 140, width: view.bounds.width - 48, height: size.height + 24)
                  
                  view.addSubview(toast)
                  UIView.animate(withDuration: 0.3) { toast.alpha = 1 }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 2) {
                      UIView.animate(withDuration: 0.3) { toast.alpha = 0 }
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.3) { toast.removeFromSuperview() }
                  }
              }
              
              // MARK: - TableView
              
              func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                  return apps.count
              }
              
              func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                  let cell = tableView.dequeueReusableCell(withIdentifier: "AppCell", for: indexPath) as! AppCell
                  let app = apps[indexPath.row]
                  cell.configure(with: app)
                  return cell
              }
              
              func tableView(_ tableView: UITableView, didSelectRowAt indexPath: IndexPath) {
                  tableView.deselectRow(at: indexPath, animated: true)
                  let app = apps[indexPath.row]
                  showAppDetails(app, at: indexPath.row)
              }
              
              func tableView(_ tableView: UITableView, trailingSwipeActionsConfigurationForRowAt indexPath: IndexPath) -> UISwipeActionsConfiguration? {
                  let delete = UIContextualAction(style: .destructive, title: "حذف") { [weak self] _, _, done in
                      self?.deleteApp(at: indexPath.row)
                      done(true)
                  }
                  
                  let sign = UIContextualAction(style: .normal, title: "توقيع") { [weak self] _, _, done in
                      self?.signApp(at: indexPath.row)
                      done(true)
                  }
                  sign.backgroundColor = UIColor(red: 30/255, green: 144/255, blue: 255/255, alpha: 1)
                  
                  return UISwipeActionsConfiguration(actions: [delete, sign])
              }
              
              private func deleteApp(at index: Int) {
                  let alert = UIAlertController(title: "حذف التطبيق", message: "هل أنت متأكد من حذف التطبيق؟", preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "حذف", style: .destructive) { [weak self] _ in
                      IPAManager.shared.removeApp(at: index)
                      self?.loadApps()
                  })
                  alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                  present(alert, animated: true)
              }
              
              private func signApp(at index: Int) {
                  let certificates = CertificateManager.shared.getValidCertificates()
                  guard !certificates.isEmpty else {
                      showAlert("⚠️ لا توجد شهادات صالحة", "قم بإضافة شهادة أولاً")
                      return
                  }
                  
                  let alert = UIAlertController(title: "اختر الشهادة", message: "اختر الشهادة لتوقيع التطبيق", preferredStyle: .actionSheet)
                  for cert in certificates {
                      alert.addAction(UIAlertAction(title: "\(cert.name) (\(cert.daysRemaining) يوم)", style: .default) { [weak self] _ in
                          let success = IPAManager.shared.signApp(at: index, with: cert)
                          if success {
                              self?.showToast("✅ تم توقيع التطبيق بنجاح")
                              self?.loadApps()
                          } else {
                              self?.showToast("❌ فشل التوقيع")
                          }
                      })
                  }
                  alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                  present(alert, animated: true)
              }
              
              private func showAppDetails(_ app: IPAManager.AppInfo, at index: Int) {
                  let alert = UIAlertController(title: app.name, message: """
                  📦 المعرف: \(app.bundleID)
                  📌 الإصدار: \(app.version)
                  🔐 موقّع: \(app.isSigned ? "✅" : "❌")
                  📱 مثبت: \(app.installed ? "✅" : "❌")
                  """, preferredStyle: .alert)
                  
                  if !app.isSigned {
                      alert.addAction(UIAlertAction(title: "🔐 توقيع", style: .default) { [weak self] _ in
                          self?.signApp(at: index)
                      })
                  }
                  
                  if app.isSigned && !app.installed {
                      alert.addAction(UIAlertAction(title: "📱 تثبيت", style: .default) { [weak self] _ in
                          self?.installApp(at: index)
                      })
                  }
                  
                  alert.addAction(UIAlertAction(title: "📤 تصدير", style: .default) { [weak self] _ in
                      self?.exportApp(at: index)
                  })
                  
                  alert.addAction(UIAlertAction(title: "إغلاق", style: .cancel))
                  present(alert, animated: true)
              }
              
              private func installApp(at index: Int) {
                  let certificates = CertificateManager.shared.getValidCertificates()
                  guard !certificates.isEmpty else {
                      showAlert("⚠️ لا توجد شهادات صالحة", "قم بإضافة شهادة أولاً")
                      return
                  }
                  
                  let alert = UIAlertController(title: "اختر الشهادة للتثبيت", message: nil, preferredStyle: .actionSheet)
                  for cert in certificates {
                      alert.addAction(UIAlertAction(title: cert.name, style: .default) { [weak self] _ in
                          self?.installWithCertificate(at: index, certificate: cert)
                      })
                  }
                  alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                  present(alert, animated: true)
              }
              
              private func installWithCertificate(at index: Int, certificate: CertificateManager.Certificate) {
                  let loading = UIAlertController(title: "⏳ جاري التثبيت...", message: "يرجى الانتظار", preferredStyle: .alert)
                  present(loading, animated: true)
                  
                  IPAManager.shared.installApp(at: index, certificate: certificate) { [weak self] success, message in
                      loading.dismiss(animated: true) {
                          self?.showAlert(success ? "✅ نجاح" : "❌ فشل", message)
                          if success {
                              self?.loadApps()
                          }
                      }
                  }
              }
              
              private func exportApp(at index: Int) {
                  let alert = UIAlertController(title: "تصدير التطبيق", message: "اختر الموقع لحفظ التطبيق", preferredStyle: .actionSheet)
                  alert.addAction(UIAlertAction(title: "حفظ في الملفات", style: .default) { [weak self] _ in
                      self?.saveToFiles(at: index)
                  })
                  alert.addAction(UIAlertAction(title: "مشاركة", style: .default) { [weak self] _ in
                      self?.shareApp(at: index)
                  })
                  alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                  present(alert, animated: true)
              }
              
              private func saveToFiles(at index: Int) {
                  let picker = UIDocumentPickerViewController(forExporting: [URL(fileURLWithPath: apps[index].ipaPath)])
                  present(picker, animated: true)
              }
              
              private func shareApp(at index: Int) {
                  let url = URL(fileURLWithPath: apps[index].ipaPath)
                  let activity = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                  present(activity, animated: true)
              }
              
              private func showAlert(_ title: String, _ message: String) {
                  let alert = UIAlertController(title: title, message: message, preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                  present(alert, animated: true)
              }
          }

