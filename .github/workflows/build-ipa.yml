      - name: Generate Swift source - InstalledAppsService.swift
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/InstalledAppsService.swift <<'SWIFT'
          import Foundation
          import UIKit

          @MainActor
          final class InstalledAppsService: ObservableObject {
              @Published private(set) var results: [AppCheckResult] = []
              @Published private(set) var isChecking = false
              @Published private(set) var checkedAt: Date?

              /*
               This is intentionally limited to a fixed, declared list of URL schemes.
               It does NOT enumerate the filesystem, private LaunchServices databases,
               installed application bundles, or use private APIs.

               A positive result means that iOS reports an installed app registered
               for that declared URL scheme. It is not a general installed-app list.
              */
              func checkKnownApps() {
                  guard !isChecking else { return }

                  isChecking = true
                  results = []

                  let catalog = KnownApp.catalog

                  Task { @MainActor in
                      var checked: [AppCheckResult] = []
                      checked.reserveCapacity(catalog.count)

                      for item in catalog {
                          guard let url = URL(string: "\(item.scheme)://") else {
                              checked.append(AppCheckResult(app: item, installed: false))
                              continue
                          }

                          let installed = UIApplication.shared.canOpenURL(url)
                          checked.append(AppCheckResult(app: item, installed: installed))

                          // Keep the UI responsive on physical devices.
                          await Task.yield()
                      }

                      results = checked
                      checkedAt = Date()
                      isChecking = false
                  }
              }

              func clear() {
                  results.removeAll()
                  checkedAt = nil
              }
          }
          SWIFT

