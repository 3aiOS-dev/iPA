      - name: Generate Source - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          // MARK: - Haptic Manager
          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  let g = UIImpactFeedbackGenerator(style: style); g.impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  let g = UINotificationFeedbackGenerator(); g.notificationOccurred(type)
              }
              func selection() {
                  let g = UISelectionFeedbackGenerator(); g.selectionChanged()
              }
          }

          // MARK: - Glass Card Modifier
          extension View {
              func glassCard(radius: CGFloat = 20, padding: CGFloat = 0) -> some View {
                  self
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(Color(UIColor.systemBackground).opacity(0.08))
                              .background(
                                  RoundedRectangle(cornerRadius: radius)
                                      .fill(Color(UIColor { t in t.userInterfaceStyle == .dark
                                          ? UIColor(red: 0.11, green: 0.11, blue: 0.18, alpha: 1)
                                          : UIColor(red: 0.97, green: 0.97, blue: 1.0,  alpha: 1) })
                                      )
                              )
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(Color.white.opacity(0.10), lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
                      .shadow(color: .black.opacity(0.08), radius: 8, x: 0, y: 4)
              }
          }
          VIPEOF
          echo "HapticManager.swift: $(wc -l < HapticManager.swift) lines"

      - name: Generate Source - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - App Data Model
          struct AppItem: Identifiable, Codable {
              var id = UUID()
              let name: String
              let type: Int
              let bundleID: String
              let bundleIdentifier: String
              let version: String
              let versionDate: String
              let fullDate: String
              let size: Int
              let down: String
              let downloadURL: String
              let developerName: String
              let localizedDescription: String
              let icon: String
              let iconURL: String
              var category: String?

              enum CodingKeys: String, CodingKey {
                  case name, type, bundleID, bundleIdentifier, version, versionDate,
                       fullDate, size, down, downloadURL, developerName,
                       localizedDescription, icon, iconURL
              }

              var formattedSize: String { ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .file) }

              var formattedDate: String {
                  let input = DateFormatter(); input.dateFormat = "yyyy-MM-dd"
                  if let d = input.date(from: versionDate) {
                      let out = DateFormatter(); out.dateFormat = "dd-MM-yyyy"; return out.string(from: d)
                  }
                  return versionDate
              }

              var subscriptionType: String {
                  if localizedDescription.contains("Subscription Unlocked") { return "الاشتراك مدى الحياة" }
                  if localizedDescription.contains("Premium") { return "بريميوم" }
                  if localizedDescription.contains("Pro")     { return "Pro" }
                  if localizedDescription.contains("Gold")    { return "Gold" }
                  if localizedDescription.contains("IAP")     { return "المشتريات مفعّلة" }
                  return "مفعّل"
              }

              var isNew: Bool {
                  let f = DateFormatter(); f.dateFormat = "yyyy-MM-dd"
                  guard let d = f.date(from: versionDate) else { return false }
                  return Calendar.current.dateComponents([.day], from: d, to: Date()).day ?? 999 < 7
              }

              var isPopular: Bool { (Int(down) ?? 0) > 500 }

              var _secureDownloadURL: String { downloadURL }
          }

          // MARK: - API Response
          struct AppsResponse: Codable {
              let name: String; let identifier: String; let sourceURL: String
              let iconURL: String; let website: String; let ipawebsite: String
              let subtitle: String; let apps: [AppItem]
          }

          // MARK: - App Category
          struct AppCategory: Identifiable {
              let id = UUID()
              let name: String; let icon: String; let gradient: [Color]
          }

          // MARK: - Imported File Model
          struct ImportedFile: Identifiable, Codable, Equatable {
              let id = UUID()
              let name: String
              let path: String
              let fileSize: Int64
              let creationDate: Date
              let modificationDate: Date
              let fileType: FileType
              var metadata: FileMetadata?

              var formattedSize: String {
                  ByteCountFormatter.string(fromByteCount: fileSize, countStyle: .file)
              }

              var formattedDate: String {
                  let f = DateFormatter()
                  f.dateFormat = "dd-MM-yyyy HH:mm"
                  return f.string(from: modificationDate)
              }

              enum FileType: String, Codable {
                  case ipa
                  case p12
                  case mobileprovision

                  var icon: String {
                      switch self {
                      case .ipa: return "app.badge"
                      case .p12: return "key"
                      case .mobileprovision: return "checkmark.shield"
                      }
                  }

                  var color: Color {
                      switch self {
                      case .ipa: return .blue
                      case .p12: return .orange
                      case .mobileprovision: return .green
                      }
                  }

                  var displayName: String {
                      switch self {
                      case .ipa: return "IPA"
                      case .p12: return "P12"
                      case .mobileprovision: return "Provision"
                      }
                  }
              }

              struct FileMetadata: Codable {
                  var appName: String?
                  var bundleID: String?
                  var version: String?
                  var iconData: Data?
                  var teamName: String?
              }

              static func == (lhs: ImportedFile, rhs: ImportedFile) -> Bool {
                  lhs.id == rhs.id
              }
          }
          VIPEOF
          echo "Models.swift: $(wc -l < Models.swift) lines"

      - name: Generate Source - FileManagerService.swift
        run: |
          cat > FileManagerService.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UniformTypeIdentifiers
          import Zip

          // MARK: - File Manager Service
          class FileManagerService: ObservableObject {
              @Published var importedFiles: [ImportedFile] = []
              @Published var isLoading = false
              @Published var errorMessage: String?

              static let shared = FileManagerService()

              private let fileManager = FileManager.default
              private let documentsURL: URL
              private let appSupportURL: URL

              init() {
                  documentsURL = fileManager.urls(for: .documentDirectory, in: .userDomainMask).first!
                  appSupportURL = fileManager.urls(for: .applicationSupportDirectory, in: .userDomainMask).first!

                  // Create app support directory if needed
                  if !fileManager.fileExists(atPath: appSupportURL.path) {
                      try? fileManager.createDirectory(at: appSupportURL, withIntermediateDirectories: true)
                  }

                  loadFiles()
              }

              // MARK: - Load Files
              func loadFiles() {
                  isLoading = true
                  defer { isLoading = false }

                  var files: [ImportedFile] = []

                  do {
                      let contents = try fileManager.contentsOfDirectory(at: appSupportURL, includingPropertiesForKeys: [
                          .fileSizeKey, .creationDateKey, .contentModificationDateKey
                      ])

                      for url in contents {
                          if url.pathExtension.lowercased() == "ipa" ||
                             url.pathExtension.lowercased() == "p12" ||
                             url.pathExtension.lowercased() == "mobileprovision" {

                              let attrs = try fileManager.attributesOfItem(atPath: url.path)
                              let fileSize = attrs[.size] as? Int64 ?? 0
                              let creationDate = attrs[.creationDate] as? Date ?? Date()
                              let modDate = attrs[.modificationDate] as? Date ?? Date()

                              let fileType: ImportedFile.FileType
                              switch url.pathExtension.lowercased() {
                              case "ipa": fileType = .ipa
                              case "p12": fileType = .p12
                              case "mobileprovision": fileType = .mobileprovision
                              default: continue
                              }

                              var file = ImportedFile(
                                  name: url.lastPathComponent,
                                  path: url.path,
                                  fileSize: fileSize,
                                  creationDate: creationDate,
                                  modificationDate: modDate,
                                  fileType: fileType
                              )

                              // Extract metadata based on file type
                              if fileType == .ipa {
                                  file.metadata = extractIPAMetadata(from: url)
                              } else if fileType == .p12 {
                                  file.metadata = extractP12Metadata(from: url)
                              } else if fileType == .mobileprovision {
                                  file.metadata = extractProvisioningMetadata(from: url)
                              }

                              files.append(file)
                          }
                      }
                  } catch {
                      errorMessage = "Error loading files: \(error.localizedDescription)"
                  }

                  // Sort by modification date (newest first)
                  importedFiles = files.sorted { $0.modificationDate > $1.modificationDate }
              }

              // MARK: - Import File
              func importFile(from url: URL) async -> Bool {
                  await MainActor.run { isLoading = true }

                  do {
                      // Start accessing the security-scoped resource
                      let didStartAccessing = url.startAccessingSecurityScopedResource()
                      defer {
                          if didStartAccessing {
                              url.stopAccessingSecurityScopedResource()
                          }
                      }

                      let fileType: ImportedFile.FileType
                      switch url.pathExtension.lowercased() {
                      case "ipa": fileType = .ipa
                      case "p12": fileType = .p12
                      case "mobileprovision": fileType = .mobileprovision
                      default:
                          await MainActor.run {
                              errorMessage = "نوع الملف غير مدعوم"
                              isLoading = false
                          }
                          return false
                      }

                      // Generate unique filename
                      let fileName = url.lastPathComponent
                      let destinationURL = appSupportURL.appendingPathComponent(fileName)

                      // Copy file
                      if fileManager.fileExists(atPath: destinationURL.path) {
                          try fileManager.removeItem(at: destinationURL)
                      }
                      try fileManager.copyItem(at: url, to: destinationURL)

                      // Get file attributes
                      let attrs = try fileManager.attributesOfItem(atPath: destinationURL.path)
                      let fileSize = attrs[.size] as? Int64 ?? 0
                      let creationDate = attrs[.creationDate] as? Date ?? Date()
                      let modDate = attrs[.modificationDate] as? Date ?? Date()

                      var file = ImportedFile(
                          name: fileName,
                          path: destinationURL.path,
                          fileSize: fileSize,
                          creationDate: creationDate,
                          modificationDate: modDate,
                          fileType: fileType
                      )

                      // Extract metadata
                      if fileType == .ipa {
                          file.metadata = extractIPAMetadata(from: destinationURL)
                      } else if fileType == .p12 {
                          file.metadata = extractP12Metadata(from: destinationURL)
                      } else if fileType == .mobileprovision {
                          file.metadata = extractProvisioningMetadata(from: destinationURL)
                      }

                      await MainActor.run {
                          importedFiles.insert(file, at: 0)
                          isLoading = false
                          HapticManager.shared.notification(.success)
                      }

                      return true

                  } catch {
                      await MainActor.run {
                          errorMessage = "فشل استيراد الملف: \(error.localizedDescription)"
                          isLoading = false
                      }
                      return false
                  }
              }

              // MARK: - Delete File
              func deleteFile(_ file: ImportedFile) async -> Bool {
                  await MainActor.run { isLoading = true }

                  do {
                      let url = URL(fileURLWithPath: file.path)
                      if fileManager.fileExists(atPath: url.path) {
                          try fileManager.removeItem(at: url)
                      }

                      await MainActor.run {
                          importedFiles.removeAll { $0.id == file.id }
                          isLoading = false
                          HapticManager.shared.notification(.success)
                      }
                      return true
                  } catch {
                      await MainActor.run {
                          errorMessage = "فشل حذف الملف: \(error.localizedDescription)"
                          isLoading = false
                      }
                      return false
                  }
              }

              // MARK: - Rename File
              func renameFile(_ file: ImportedFile, newName: String) async -> Bool {
                  guard !newName.trimmingCharacters(in: .whitespaces).isEmpty else { return false }

                  await MainActor.run { isLoading = true }

                  do {
                      let oldURL = URL(fileURLWithPath: file.path)
                      let newURL = oldURL.deletingLastPathComponent().appendingPathComponent(newName)

                      try fileManager.moveItem(at: oldURL, to: newURL)

                      // Update file metadata
                      let attrs = try fileManager.attributesOfItem(atPath: newURL.path)
                      let fileSize = attrs[.size] as? Int64 ?? 0
                      let modDate = attrs[.modificationDate] as? Date ?? Date()

                      var updatedFile = file
                      updatedFile.name = newName
                      updatedFile.path = newURL.path
                      updatedFile.fileSize = fileSize
                      updatedFile.modificationDate = modDate

                      await MainActor.run {
                          if let index = importedFiles.firstIndex(where: { $0.id == file.id }) {
                              importedFiles[index] = updatedFile
                          }
                          isLoading = false
                          HapticManager.shared.notification(.success)
                      }
                      return true
                  } catch {
                      await MainActor.run {
                          errorMessage = "فشل إعادة التسمية: \(error.localizedDescription)"
                          isLoading = false
                      }
                      return false
                  }
              }

              // MARK: - IPA Metadata Extraction
              private func extractIPAMetadata(from url: URL) -> ImportedFile.FileMetadata {
                  var metadata = ImportedFile.FileMetadata()

                  do {
                      // Try to extract Info.plist from IPA
                      let tempDir = fileManager.temporaryDirectory.appendingPathComponent(UUID().uuidString)
                      try fileManager.createDirectory(at: tempDir, withIntermediateDirectories: true)
                      defer { try? fileManager.removeItem(at: tempDir) }

                      // Unzip IPA
                      try Zip.unzipFile(url, destination: tempDir, overwrite: true, password: nil)

                      // Look for Payload/*.app/Info.plist
                      let payloadDir = tempDir.appendingPathComponent("Payload")
                      if let appDir = try? fileManager.contentsOfDirectory(at: payloadDir, includingPropertiesForKeys: nil)
                          .first(where: { $0.pathExtension == "app" }) {

                          let infoPlist = appDir.appendingPathComponent("Info.plist")
                          if fileManager.fileExists(atPath: infoPlist.path) {
                              let data = try Data(contentsOf: infoPlist)
                              let plist = try PropertyListSerialization.propertyList(from: data, options: [], format: nil)

                              if let dict = plist as? [String: Any] {
                                  metadata.appName = dict["CFBundleName"] as? String ?? dict["CFBundleDisplayName"] as? String
                                  metadata.bundleID = dict["CFBundleIdentifier"] as? String
                                  metadata.version = dict["CFBundleShortVersionString"] as? String
                              }
                          }

                          // Try to extract app icon
                          let iconFiles = try fileManager.contentsOfDirectory(at: appDir, includingPropertiesForKeys: nil)
                              .filter { $0.lastPathComponent.hasPrefix("AppIcon") || $0.pathExtension == "png" || $0.pathExtension == "jpg" }

                          if let iconFile = iconFiles.first {
                              let iconData = try Data(contentsOf: iconFile)
                              metadata.iconData = iconData
                          }
                      }
                  } catch {
                      // Silent fail - metadata extraction is best effort
                  }

                  return metadata
              }

              // MARK: - P12 Metadata Extraction
              private func extractP12Metadata(from url: URL) -> ImportedFile.FileMetadata {
                  var metadata = ImportedFile.FileMetadata()

                  // P12 is a binary file, we can only extract basic info from the filename
                  let name = url.deletingPathExtension().lastPathComponent
                  metadata.appName = name

                  return metadata
              }

              // MARK: - Provisioning Profile Metadata Extraction
              private func extractProvisioningMetadata(from url: URL) -> ImportedFile.FileMetadata {
                  var metadata = ImportedFile.FileMetadata()

                  do {
                      let data = try Data(contentsOf: url)

                      // MobileProvision is a PKCS#7 encoded file
                      // Try to extract as XML-like content
                      if let plistData = extractPlistFromProvisioning(data) {
                          let plist = try PropertyListSerialization.propertyList(from: plistData, options: [], format: nil)
                          if let dict = plist as? [String: Any] {
                              metadata.appName = dict["AppIDName"] as? String
                              metadata.bundleID = dict["Entitlements"]?["application-identifier"] as? String
                              metadata.teamName = dict["TeamName"] as? String
                              metadata.version = dict["Version"] as? String
                          }
                      }
                  } catch {
                      // Silent fail
                  }

                  return metadata
              }

              private func extractPlistFromProvisioning(_ data: Data) -> Data? {
                  // Simple extraction - find the plist content between <?xml and </plist>
                  guard let xmlStart = data.range(of: "<?xml".data(using: .utf8) ?? Data()) else { return nil }
                  guard let plistEnd = data.range(of: "</plist>".data(using: .utf8) ?? Data(), range: xmlStart.lowerBound..<data.endIndex) else { return nil }

                  let range = xmlStart.lowerBound..<plistEnd.upperBound
                  return data[range]
              }

              // MARK: - Get File URL for Sharing
              func getFileURL(for file: ImportedFile) -> URL? {
                  let url = URL(fileURLWithPath: file.path)
                  return fileManager.fileExists(atPath: url.path) ? url : nil
              }
          }
          VIPEOF
          echo "FileManagerService.swift: $(wc -l < FileManagerService.swift) lines"

      - name: Generate Source - SharedComponents.swift
        run: |
          cat > SharedComponents.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - Cached Async Image
          struct CachedAsyncImage<Content: View>: View {
              let url: URL?
              @ViewBuilder let content: (AsyncImagePhase) -> Content
              var body: some View {
                  AsyncImage(url: url, transaction: Transaction(animation: .easeIn)) { content($0) }
              }
          }

          // MARK: - Gradient Button
          struct GradientButton: View {
              let title: String; var icon: String?; let gradient: [Color]
              let action: () -> Void
              var isLoading: Bool = false; var isDisabled: Bool = false
              @State private var pressed = false

              var body: some View {
                  Button(action: { HapticManager.shared.impact(.medium); action() }) {
                      HStack(spacing: 8) {
                          if isLoading {
                              ProgressView().progressViewStyle(CircularProgressViewStyle(tint: .white)).scaleEffect(0.85)
                          } else if let icon { Image(systemName: icon).font(.system(size: 15, weight: .semibold)) }
                          Text(isLoading ? "جاري..." : title).font(.system(size: 15, weight: .bold))
                      }
                      .foregroundColor(.white).frame(maxWidth: .infinity).frame(height: 48)
                      .background(LinearGradient(
                          colors: isDisabled ? [.gray, .gray.opacity(0.7)] : gradient,
                          startPoint: .leading, endPoint: .trailing))
                      .cornerRadius(14)
                      .shadow(color: (isDisabled ? Color.gray : gradient.first ?? .blue).opacity(0.3),
                              radius: pressed ? 3 : 8, x: 0, y: pressed ? 1 : 4)
                      .scaleEffect(pressed ? 0.97 : 1.0)
                  }
                  .disabled(isDisabled || isLoading)
                  .buttonStyle(PlainButtonStyle())
                  .simultaneousGesture(
                      DragGesture(minimumDistance: 0)
                          .onChanged { _ in withAnimation(.easeInOut(duration: 0.1)) { pressed = true } }
                          .onEnded   { _ in withAnimation(.spring(response: 0.3)) { pressed = false } }
                  )
              }
          }

          // MARK: - New Badge
          struct NewBadge: View {
              var body: some View {
                  Text("جديد").font(.system(size: 10, weight: .bold)).foregroundColor(.white)
                      .padding(.horizontal, 7).padding(.vertical, 3)
                      .background(Capsule().fill(LinearGradient(colors: [.pink, .purple], startPoint: .leading, endPoint: .trailing)))
              }
          }

          // MARK: - Popular Badge
          struct PopularBadge: View {
              var body: some View {
                  HStack(spacing: 3) {
                      Image(systemName: "flame.fill").font(.system(size: 9))
                      Text("مشهور").font(.system(size: 10, weight: .bold))
                  }
                  .foregroundColor(.white).padding(.horizontal, 7).padding(.vertical, 3)
                  .background(Capsule().fill(LinearGradient(colors: [.orange, .red], startPoint: .leading, endPoint: .trailing)))
              }
          }

          // MARK: - Top Right Icon View
          struct TopRightIconView: View {
              @State private var iconImage: UIImage? = nil
              @State private var isLoading = true

              var body: some View {
                  Group {
                      if let img = iconImage {
                          Image(uiImage: img)
                              .resizable()
                              .aspectRatio(contentMode: .fill)
                              .frame(width: 36, height: 36)
                              .clipShape(Circle())
                              .overlay(Circle().stroke(Color.white.opacity(0.2), lineWidth: 1.5))
                      } else if isLoading {
                          Circle()
                              .fill(Color.vipPurple.opacity(0.3))
                              .frame(width: 36, height: 36)
                              .overlay(
                                  ProgressView()
                                      .progressViewStyle(CircularProgressViewStyle(tint: .white))
                                      .scaleEffect(0.6)
                              )
                      } else {
                          Circle()
                              .fill(Color.vipPurple.opacity(0.5))
                              .frame(width: 36, height: 36)
                              .overlay(
                                  Image(systemName: "person.circle.fill")
                                      .font(.system(size: 22))
                                      .foregroundColor(.white.opacity(0.7))
                              )
                      }
                  }
                  .onAppear {
                      loadIcon()
                  }
              }

              private func loadIcon() {
                  guard let url = URL(string: AppConstants.topRightIconURL) else {
                      isLoading = false
                      return
                  }

                  // Check if image is cached
                  if let cached = ImageCache.shared.get(forKey: url.absoluteString) {
                      iconImage = cached
                      isLoading = false
                      return
                  }

                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      DispatchQueue.main.async {
                          isLoading = false
                          if let data = data, let img = UIImage(data: data) {
                              iconImage = img
                              ImageCache.shared.set(img, forKey: url.absoluteString)
                          }
                      }
                  }.resume()
              }
          }

          // MARK: - Simple Image Cache
          class ImageCache {
              static let shared = ImageCache()
              private var cache: [String: UIImage] = [:]

              func get(forKey key: String) -> UIImage? {
                  cache[key]
              }

              func set(_ image: UIImage, forKey key: String) {
                  cache[key] = image
              }
          }
          VIPEOF
          echo "SharedComponents.swift: $(wc -l < SharedComponents.swift) lines"

