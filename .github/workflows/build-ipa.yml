          import SwiftUI
          import UIKit

          class HapticManager {
              static let shared = HapticManager()
              private let heavy = UIImpactFeedbackGenerator(style: .heavy)
              private let medium = UIImpactFeedbackGenerator(style: .medium)
              private let light = UIImpactFeedbackGenerator(style: .light)
              private let rigid = UIImpactFeedbackGenerator(style: .rigid)
              private let soft = UIImpactFeedbackGenerator(style: .soft)

              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  let g = UIImpactFeedbackGenerator(style: style)
                  g.impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  let g = UINotificationFeedbackGenerator()
                  g.notificationOccurred(type)
              }
              func selection() {
                  let g = UISelectionFeedbackGenerator()
                  g.selectionChanged()
              }
              func success() { notification(.success) }
              func error() { notification(.error) }
              func warning() { notification(.warning) }

              // Anime-style haptic patterns
              func energyPulse() {
                  let generator = UINotificationFeedbackGenerator()
                  generator.notificationOccurred(.success)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.1) {
                      let g2 = UIImpactFeedbackGenerator(style: .soft)
                      g2.impactOccurred(intensity: 0.5)
                  }
              }

              func levelUp() {
                  let generator = UINotificationFeedbackGenerator()
                  generator.notificationOccurred(.success)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.15) {
                      let g2 = UIImpactFeedbackGenerator(style: .heavy)
                      g2.impactOccurred(intensity: 1.0)
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.3) {
                      let g3 = UIImpactFeedbackGenerator(style: .medium)
                      g3.impactOccurred(intensity: 0.8)
                  }
              }
          }

