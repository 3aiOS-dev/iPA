        run: |
          cat > AppEntry.swift << 'AEOF'
          import SwiftUI

          @main
          struct AppPeekApp: App {
              var body: some Scene {
                  WindowGroup {
                      RootView()
                  }
              }
          }
          AEOF

      # =========================================================
      # COMPILE & PACKAGE
      # =========================================================
      - name: Compile & package
        run: |
          set -e
          # Create a minimal app bundle layout
          APP="AppPeek.app"
          rm -rf "$APP"
          mkdir -p "$APP"

          # Compile all swift files into a single binary
          swiftc \
            -O \
            -target arm64-apple-ios17.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -framework SwiftUI -framework UIKit -framework Foundation \
            -parse-as-library \
            Constants.swift Models.swift LinkParser.swift LookupService.swift \
            HistoryStore.swift ImageLoader.swift Components.swift Views.swift AppEntry.swift \
            -o "$APP/AppPeek"

          # Bundle resources — copy flat into app root so SwiftUI Image(_:) can find them
          for f in Resources/*.png Resources/*.jpg Resources/*.gif; do
            [ -f "$f" ] && cp "$f" "$APP/$(basename "$f")" 2>/dev/null || true
          done
          # Info.plist must live inside the bundle
          cp Resources/Info.plist "$APP/Info.plist"

          # Codesign with ldid (ad-hoc / fake)
          ldid -S "$APP/AppPeek" 2>/dev/null || true
          ldid -S "$APP/Info.plist" 2>/dev/null || true

          # Package as Payload/AppPeek.app for proper IPA layout
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr AppPeek.ipa Payload
          # Fallback if zip was empty
          if [ ! -s AppPeek.ipa ]; then
            zip -qr AppPeek.ipa "$APP"
          fi

          ls -lh
          echo "Bundle contents:"
          ls -lh "$APP" | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppPeek-IPA
          path: AppPeek.ipa
          if-no-files-found: error
          retention-days: 7
