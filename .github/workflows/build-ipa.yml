      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Setup Dependencies
        run: |
          brew install ldid
          brew install zip

      - name: Generate App Icons
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size, filename):
              img = Image.new("RGB", (size, size), (10, 11, 20))
              draw = ImageDraw.Draw(img)

              top = (110, 86, 207)     # violet (accent)
              bottom = (34, 211, 238)  # cyan (accent secondary)
              for y in range(size):
                  t = y / size
                  r = int(top[0] * (1 - t) + bottom[0] * t)
                  g = int(top[1] * (1 - t) + bottom[1] * t)
                  b = int(top[2] * (1 - t) + bottom[2] * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b))

              draw.rounded_rectangle(
                  [size * 0.14, size * 0.30, size * 0.86, size * 0.80],
                  radius=size * 0.10,
                  outline=(255, 255, 255),
                  width=max(2, size // 34),
              )

              text = "21"
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size * 0.30))
              except Exception:
                  font = ImageFont.load_default()

              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(
                  ((size - tw) / 2 - bbox[0], (size - th) / 2 - bbox[1]),
                  text,
                  fill=(255, 255, 255),
                  font=font,
              )
              img.save(filename)

          make_icon(120, "Resources/AppIcon60x60@2x.png")
          make_icon(152, "Resources/AppIcon76x76@2x~ipad.png")
          PYEOF
          ls -la Resources

