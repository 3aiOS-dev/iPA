                      descTitleLabel.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),

                      descLabel.topAnchor.constraint(equalTo: descTitleLabel.bottomAnchor, constant: 8),
                      descLabel.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      descLabel.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),
                  ])
              }

