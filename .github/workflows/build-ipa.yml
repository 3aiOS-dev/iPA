          const config = require('../config');
          
          /**
           * Simple in-memory rate limiter (per telegram id, per minute).
           * For multi-instance deployments swap with Redis.
           */
          const buckets = new Map();
          
          function rateLimit() {
            return async (ctx, next) => {
              const id = ctx.from?.id;
              if (!id) return next();
              const now = Date.now();
              const arr = buckets.get(id) || [];
              const fresh = arr.filter((t) => now - t < 60_000);
              if (fresh.length >= config.security.rateLimitPerMin) {
                return ctx.reply('⏳ بطّئ شوي، أنت ترسل رسائل كثيرة. حاول بعد دقيقة.');
              }
              fresh.push(now);
              buckets.set(id, fresh);
              return next();
            };
          }
          
          module.exports = rateLimit;
          
