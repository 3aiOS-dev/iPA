              var p12Types: [UTType] {
                  var t: [UTType] = [.data]
                  if let t1 = UTType(filenameExtension: "p12")    { t.insert(t1, at: 0) }
                  if let t2 = UTType(filenameExtension: "pfx")    { t.insert(t2, at: 1) }
                  t.insert(.pkcs12, at: 0)
                  return t
              }
              var provTypes: [UTType] {
                  var t: [UTType] = [.data]
                  if let t1 = UTType(filenameExtension: "mobileprovision")    { t.insert(t1, at: 0) }
                  if let t2 = UTType(filenameExtension: "provisionprofile")   { t.insert(t2, at: 1) }
                  return t
