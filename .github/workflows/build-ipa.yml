                    import SwiftUI

                    // MARK: - Apps Tab
                    struct AppsTabView: View {
                        @ObservedObject var appsManager: AppsManager
                        @ObservedObject var downloadManager: IPADownloadManager
                        @State private var selectedApp: AppItem?
                        @State private var sortMode: SortMode = .newest
                        @State private var searchText: String = ""

                        enum SortMode: String, CaseIterable {
                            case newest = "الأحدث", popular = "الأكثر", oldest = "الأقدم"
                            var icon: String {
                                switch self {
                                case .newest:  return "clock.fill"
                                case .popular: return "flame.fill"
                                case .oldest:  return "arrow.uturn.backward"
                                }
                            }
                        }

                        private var filtered: [AppItem] {
                            let arr: [AppItem]
                            switch sortMode {
                            case .newest:  arr = appsManager.apps.sorted { $0.versionDate > $1.versionDate }
                            case .popular: arr = appsManager.apps.sorted { (Int($0.down) ?? 0) > (Int($1.down) ?? 0) }
                            case .oldest:  arr = appsManager.apps.sorted { $0.versionDate < $1.versionDate }
                            }
                            if searchText.isEmpty { return arr }
                            return arr.filter { $0.name.localizedCaseInsensitiveContains(searchText) }
