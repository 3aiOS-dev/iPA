                  let text = inputText.trimmingCharacters(in: .whitespaces)
                  guard !text.isEmpty else { return }
                  inputText = ""
                  HapticManager.shared.impact(.light)
                  engine.send(userText: text)
              }
          }
          
          
          struct ChatBubbleView: View {
              let message: ChatMessage
              let scheme: ColorScheme
          
              private var accent: Color { Color(red: 0.20, green: 0.34, blue: 0.55) }
          
              var body: some View {
                  HStack(alignment: .bottom, spacing: 8) {
                      if message.isUser { Spacer(minLength: 50) }
          
                      if !message.isUser {
                          CachedAsyncImage(url: URL(string: AppConstants.appIconURL)) { phase in
                              switch phase {
                              case .success(let img):
                                  img.resizable().aspectRatio(contentMode: .fill)
                                      .frame(width: 30, height: 30)
                                      .clipShape(RoundedRectangle(cornerRadius: 7, style: .continuous))
                              default:
                                  RoundedRectangle(cornerRadius: 7)
                                      .fill(accent.opacity(0.2))
                                      .frame(width: 30, height: 30)
                              }
                          }
                      }
          
                      VStack(alignment: message.isUser ? .trailing : .leading, spacing: 4) {
                          Text(message.content)
                              .font(.system(size: 14.5, design: .serif))
                              .foregroundColor(message.isUser ? .white : (scheme == .dark ? .white : Color(white: 0.12)))
                              .padding(.horizontal, 14).padding(.vertical, 10)
                              .background(
                                  RoundedRectangle(cornerRadius: 8, style: .continuous)
                                      .fill(message.isUser
                                          ? accent
                                          : (scheme == .dark ? Color(white: 0.16) : Color.white))
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 8, style: .continuous)
                                              .stroke(message.isUser
                                                  ? Color.white.opacity(0.15)
                                                  : Color.gray.opacity(0.25), lineWidth: 0.7)
                                      )
                                      .shadow(color: .black.opacity(0.05), radius: 2, x: 0, y: 1)
                              )
                              .environment(\.layoutDirection, .rightToLeft)
                              .contextMenu {
                                  Button(action: { UIPasteboard.general.string = message.content }) {
                                      Label("نسخ", systemImage: "doc.on.doc")
                                  }
                              }
          
                          Text(timeString(message.ts))
                              .font(.system(size: 9.5, design: .serif))
                              .foregroundColor(.gray.opacity(0.7))
                              .padding(.horizontal, 4)
                      }
          
                      if message.isUser {
                          Image(systemName: "person.crop.circle")
                              .font(.system(size: 28, weight: .regular))
                              .foregroundColor(accent.opacity(0.7))
                      } else {
                          Spacer(minLength: 50)
                      }
                  }
              }
          
              func timeString(_ d: Date) -> String {
                  let f = DateFormatter(); f.dateFormat = "HH:mm"
                  return f.string(from: d)
              }
          }
          
          // MARK: - Typing Bubble (كلاسيك)
          struct TypingBubble: View {
              let scheme: ColorScheme
              @State private var anim = false
              private var accent: Color { Color(red: 0.20, green: 0.34, blue: 0.55) }
          
              var body: some View {
                  HStack(alignment: .bottom, spacing: 8) {
                      CachedAsyncImage(url: URL(string: AppConstants.appIconURL)) { phase in
                          switch phase {
                          case .success(let img):
                              img.resizable().aspectRatio(contentMode: .fill)
                                  .frame(width: 30, height: 30)
                                  .clipShape(RoundedRectangle(cornerRadius: 7, style: .continuous))
                          default:
                              RoundedRectangle(cornerRadius: 7)
                                  .fill(accent.opacity(0.2))
                                  .frame(width: 30, height: 30)
                          }
                      }
                      HStack(spacing: 5) {
                          ForEach(0..<3, id: \.self) { i in
                              Circle()
                                  .fill(accent.opacity(0.7))
                                  .frame(width: 6.5, height: 6.5)
                                  .scaleEffect(anim ? 1.3 : 0.7)
                                  .animation(.easeInOut(duration: 0.5)
                                      .repeatForever().delay(Double(i) * 0.15), value: anim)
                          }
                      }
                      .padding(.horizontal, 14).padding(.vertical, 11)
                      .background(
                          RoundedRectangle(cornerRadius: 8, style: .continuous)
                              .fill(scheme == .dark ? Color(white: 0.16) : Color.white)
                              .overlay(RoundedRectangle(cornerRadius: 8, style: .continuous)
                                  .stroke(Color.gray.opacity(0.25), lineWidth: 0.7))
                      )
                      Spacer(minLength: 50)
                  }
                  .onAppear { anim = true }
              }
          }
          
          // MARK: - Floating AI Chat Button
          struct FloatingAIChatButton: View {
              @Binding var show: Bool
              @State private var pulse  = false
              @State private var bounce = false
          
              var body: some View {
                  VStack {
                      Spacer()
                      HStack {
                          Spacer()
                          Button(action: {
                              HapticManager.shared.impact(.medium)
                              withAnimation(.spring(response: 0.3, dampingFraction: 0.6)) { show = true }
                          }) {
                              ZStack {
                                  // Pulse ring
                                  Circle()
                                      .stroke(Color.vipPurple.opacity(0.35), lineWidth: 3)
                                      .frame(width: 66, height: 66)
                                      .scaleEffect(pulse ? 1.25 : 1.0)
                                      .opacity(pulse ? 0 : 0.8)
          
                                  // Main button
                                  Circle()
                                      .fill(LinearGradient(
                                          colors: [Color(red: 0.55, green: 0.0, blue: 1.0),
                                                   Color(red: 0.2, green: 0.4, blue: 1.0)],
                                          startPoint: .topLeading, endPoint: .bottomTrailing))
                                      .frame(width: 56, height: 56)
                                      .shadow(color: .vipPurple.opacity(0.55), radius: 12, x: 0, y: 4)
                                      .scaleEffect(bounce ? 1.08 : 1.0)
          
                                  VStack(spacing: 1) {
                                      Image(systemName: "sparkles")
                                          .font(.system(size: 18, weight: .bold))
                                          .foregroundColor(.white)
                                      Text("AI")
                                          .font(.system(size: 9, weight: .black))
                                          .foregroundColor(.white.opacity(0.9))
                                  }
                              }
                          }
                          .onAppear {
                              withAnimation(.easeInOut(duration: 1.6).repeatForever(autoreverses: false)) {
                                  pulse = true
                              }
                              withAnimation(.easeInOut(duration: 2.0).repeatForever()) {
                                  bounce = true
                              }
                          }
                      }
                      .padding(.trailing, 20)
                      .padding(.bottom, 108)
                  }
              }
          }
          
          
          VIPEOF
          echo "ChatView.swift: $(wc -l < ChatView.swift) lines"

      - name: Generate Source - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine
          import Security
          import CommonCrypto
          import PhotosUI
          import UserNotifications
          import CoreHaptics
          import Network
          import UniformTypeIdentifiers
          import LocalAuthentication
          import Compression
          
          // MARK: - App Entry Point
          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
              @StateObject private var cloud = VIP21Cloud.shared
              @State private var showAdminSheet = false
          
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environmentObject(cloud)
                                         .onReceive(NotificationCenter.default.publisher(for: .vip21ShowAdmin)) { _ in
                              showAdminSheet = true
                          }
                          .sheet(isPresented: $showAdminSheet) {
                              VIP21AdminLoginView()
                          }
                          .onAppear {
                              VIP21Cloud.shared.start()
                          }
                  }
              }
          }
          
          
          extension Notification.Name {
              static let vip21ShowAdmin = Notification.Name("vip21ShowAdmin")
          }
          
          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
          
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  // Request notifications
                  UNUserNotificationCenter.current().delegate = self
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { granted, _ in
                      if granted { NotificationManager.shared.scheduleDailyReminder() }
                  }
                  // 🌩️ Cloud
                  VIP21Cloud.shared.start()
                  // ✨ MesopotamiaX
                  MesopotamiaX.bootstrap()
                  return true
              }
          
              // Show notification even when app is in foreground
              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           willPresent notification: UNNotification,
                                           withCompletionHandler handler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  handler([.banner, .sound, .badge])
              }
          
              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           didReceive response: UNNotificationResponse,
                                           withCompletionHandler handler: @escaping () -> Void) {
                  handler()
              }
          }
          
          
          // MARK: - VIP21Cloud (مزامنة السحابة)
          final class VIP21Cloud: ObservableObject {
              static let shared = VIP21Cloud()
              @Published var isConnected: Bool = false
              private var timer: Timer?
          
              private init() {}
          
              func start() {
                  guard timer == nil else { return }
                  timer = Timer.scheduledTimer(withTimeInterval: 60, repeats: true) { [weak self] _ in
                      self?.ping()
                  }
                  ping()
              }
          
              private func ping() {
                  guard let url = URL(string: "https://repository.apptesters.org/apps.json") else { return }
                  var req = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 10)
                  req.setValue("VIP21Store/7.0", forHTTPHeaderField: "User-Agent")
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, err in
                      DispatchQueue.main.async {
                          self?.isConnected = (data != nil && err == nil)
                      }
                  }.resume()
              }
          }
          
          // MARK: - VIP21AdminLoginView (لوحة الإدارة)
          struct VIP21AdminLoginView: View {
              @Environment(.\dismiss) var dismiss
              @State private var password = ""
              @State private var showError = false
              private let adminPassword = "vip21admin"
          
              var body: some View {
                  NavigationView {
                      VStack(spacing: 24) {
                          Image(systemName: "lock.shield.fill")
                              .font(.system(size: 60))
                              .foregroundStyle(LinearGradient(
                                  colors: [.purple, .blue],
                                  startPoint: .topLeading, endPoint: .bottomTrailing))
                          Text("لوحة الإدارة")
                              .font(.system(size: 24, weight: .bold))
                          SecureField("كلمة السر", text: $password)
                              .textFieldStyle(.roundedBorder)
                              .padding(.horizontal, 32)
                          if showError {
                              Text("❌ كلمة السر خاطئة")
                                  .foregroundColor(.red).font(.system(size: 13))
                          }
                          Button(action: {
                              if password == adminPassword { dismiss() }
                              else { showError = true; password = "" }
                          }) {
                              Text("دخول").font(.system(size: 16, weight: .bold))
                                  .foregroundColor(.white).frame(maxWidth: .infinity).padding()
                                  .background(LinearGradient(colors: [.purple, .blue],
                                      startPoint: .leading, endPoint: .trailing))
                                  .cornerRadius(12)
                          }.padding(.horizontal, 32)
                          Spacer()
                      }.padding(.top, 40)
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("إغلاق") { dismiss() }.foregroundColor(.purple)
                          }
                      }
                  }
              }
          }
          
          // MARK: - MesopotamiaX (خدمات النظام)
          enum MesopotamiaX {
              static func bootstrap() {
                  UserDefaults.standard.set(true, forKey: "vip21_bootstrapped")
              }
          }
          VIPEOF
          echo "VIP21StoreApp.swift: $(wc -l < VIP21StoreApp.swift) lines"

      - name: Generate Source - NotificationManager.swift
        run: |
          cat > NotificationManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine
          import Security
          import CommonCrypto
          import PhotosUI
          import UserNotifications
          import CoreHaptics
          import Network
          import UniformTypeIdentifiers
          import LocalAuthentication
          import Compression
          
          // MARK: - Notification Manager (v7)
          class NotificationManager {
              static let shared = NotificationManager()
              private init() {}
          
              // Send notification with optional app icon attachment
              func send(title: String, body: String, identifier: String = UUID().uuidString,
                        iconURL: String? = nil, delay: TimeInterval = 0.5) {
                  UNUserNotificationCenter.current().getNotificationSettings { settings in
                      guard settings.authorizationStatus == .authorized else { return }
                      let content = UNMutableNotificationContent()
                      content.title = title
                      content.body  = body
                      content.sound = .default
                      content.badge = 1
                      // Try attach icon from cache
                      if let urlStr = iconURL, let url = URL(string: urlStr) {
                          self.attachIcon(url: url, content: content) { finalContent in
                              self.schedule(content: finalContent, identifier: identifier, delay: delay)
                          }
                      } else {
                          self.schedule(content: content, identifier: identifier, delay: delay)
                      }
                  }
              }
          
              private func attachIcon(url: URL, content: UNMutableNotificationContent, completion: @escaping (UNMutableNotificationContent) -> Void) {
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data,
                            let img = UIImage(data: data) else { completion(content); return }
                      let tmpURL = FileManager.default.temporaryDirectory
                          .appendingPathComponent(UUID().uuidString + ".png")
                      if let pngData = img.pngData(), (try? pngData.write(to: tmpURL)) != nil,
                         let att = try? UNNotificationAttachment(identifier: "icon", url: tmpURL, options: nil) {
                          content.attachments = [att]
                      }
                      completion(content)
                  }.resume()
              }
          
              private func schedule(content: UNMutableNotificationContent, identifier: String, delay: TimeInterval) {
                  let trigger = UNTimeIntervalNotificationTrigger(timeInterval: max(delay, 0.5), repeats: false)
                  let req = UNNotificationRequest(identifier: identifier, content: content, trigger: trigger)
                  UNUserNotificationCenter.current().add(req, withCompletionHandler: nil)
              }
          
              // Daily reminder
              func scheduleDailyReminder() {
                  let content = UNMutableNotificationContent()
                  content.title = "🏪 متجر 21s"
                  content.body  = "تطبيقات جديدة تنتظرك — تفقد المتجر الآن! 🚀"
                  content.sound = .default
                  var dc = DateComponents(); dc.hour = 20; dc.minute = 0
                  let trigger = UNCalendarNotificationTrigger(dateMatching: dc, repeats: true)
                  let req = UNNotificationRequest(identifier: "daily_reminder", content: content, trigger: trigger)
                  UNUserNotificationCenter.current().add(req, withCompletionHandler: nil)
              }
          
              // Download complete
              func notifyDownloadComplete(appName: String, iconURL: String?) {
                  send(title: "✅ اكتمل التحميل", body: "\(appName) جاهز للتوقيع والتثبيت!",
                       identifier: "dl_\(appName)", iconURL: iconURL, delay: 0.5)
              }
          
              // Signing complete
              func notifySigningComplete(appName: String, iconURL: String?) {
                  send(title: "✍️ تم التوقيع بنجاح", body: "\(appName) موقّع وجاهز للتثبيت!",
                       identifier: "sign_\(appName)", iconURL: iconURL, delay: 0.5)
              }
          
              // Install complete
              func notifyInstallComplete(appName: String, iconURL: String?) {
                  send(title: "📲 تم التثبيت", body: "\(appName) مثبّت على جهازك بنجاح 🎉",
                       identifier: "install_\(appName)", iconURL: iconURL, delay: 0.5)
              }
          
              // Certificate expiry warning
              func notifyCertExpiry(certName: String, daysLeft: Int) {
                  send(title: "⚠️ تنبيه الشهادة", body: "شهادة \(certName) ستنتهي خلال \(daysLeft) يوم — جدّدها الآن",
                       identifier: "cert_expiry_\(certName)", delay: 1.0)
              }
          }
          
          // MARK: - Shake to open Admin
          extension UIWindow {
              open override func motionEnded(_ motion: UIEvent.EventSubtype, with event: UIEvent?) {
                  if motion == .motionShake {
                      NotificationCenter.default.post(name: .vip21ShowAdmin, object: nil)
                  }
                  super.motionEnded(motion, with: event)
              }
          }
          VIPEOF
          echo "NotificationManager.swift: $(wc -l < NotificationManager.swift) lines"

      - name: Build Application
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            VIPZipHelper.swift \
            SigningEngine.swift \
            VIP21InstallEngine.swift \
            Managers.swift \
            AppsManager.swift \
            SharedComponents.swift \
            ContentView.swift \
            HomeTabView.swift \
            AppsTabView.swift \
            InstallSupportViews.swift \
            SigningTabView.swift \
            AppDetailView.swift \
            SettingsView.swift \
            IPAPatcher.swift \
            ChatView.swift \
            VIP21StoreApp.swift \
            NotificationManager.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework CommonCrypto \
            -framework UserNotifications \
            -framework Network \
            -framework CoreHaptics \
            -framework PhotosUI \
            -framework UniformTypeIdentifiers \
            -framework LocalAuthentication \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA Package
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-IPA-SwiftUI-v7
          path: artifacts/21s.ipa
