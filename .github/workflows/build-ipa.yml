              func doInstall() {
                  let ipaURL = URL(fileURLWithPath: ipaPath)
                  isRunning = true; progress = 0; resultMsg = nil
          
                  certificateManager.installIPA(
                      ipaURL: ipaURL,
                      appName: appName,
                      bundleID: bundleID,
                      progressHandler: { p, s in
                          progress = p; statusMsg = s
                      },
                      completion: { result in
                          isRunning = false
                          switch result {
                          case .success:
                              succeeded = true
                              resultMsg = "✅ تم التثبيت!\nإذا لم يظهر التطبيق فوراً انتظر لحظة."
                              downloadManager.markAsInstalled(file, method: "InstallEngine")
                              HapticManager.shared.notification(.success)
                          case .failure(let err):
                              succeeded = false
                              resultMsg = "❌ \(err.localizedDescription)"
                              HapticManager.shared.notification(.error)
                          }
                      }
                  )
              }
          
          }
          
