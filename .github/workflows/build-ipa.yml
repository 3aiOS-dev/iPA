name: Build_SmartButtons

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p

      - name: Setup Dependencies
        run: |
          brew install ldid dpkg xz wget curl git make

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Download iOS SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o iPhoneOS16.5.sdk.tar.xz
          tar -xJf iPhoneOS16.5.sdk.tar.xz
          rm iPhoneOS16.5.sdk.tar.xz
          ls -la "$THEOS/sdks"

      - name: Generate App Source Files
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources
          mkdir -p Resources/Assets.xcassets/AppIcon.appiconset

          # Create App Icons
          cat > Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'ICONEOF'
          {
            "images": [
              {
                "size": "60x60",
                "idiom": "iphone",
                "filename": "AppIcon60x60@2x.png",
                "scale": "2x"
              },
              {
                "size": "76x76",
                "idiom": "ipad",
                "filename": "AppIcon76x76@2x~ipad.png",
                "scale": "2x"
              }
            ],
            "info": {
              "version": 1,
              "author": "xcode"
            }
          }
          ICONEOF

          # Create placeholder icons (colored squares)
          convert -size 120x120 xcblue Resources/Assets.xcassets/AppIcon.appiconset/AppIcon60x60@2x.png
          convert -size 152x152 xcblue Resources/Assets.xcassets/AppIcon.appiconset/AppIcon76x76@2x~ipad.png

          cat > Makefile << 'MEOF'
          THEOS ?= $(HOME)/theos
          export THEOS

          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64

          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = SmartButtons

          SmartButtons_FILES = main.m
          SmartButtons_FRAMEWORKS = UIKit Foundation
          SmartButtons_CFLAGS = -fobjc-arc

          include $(THEOS_MAKE_PATH)/application.mk
          MEOF

          cat > main.m << 'MEOF'
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #import <UniformTypeIdentifiers/UniformTypeIdentifiers.h>

          @interface SmartButtonsAppDelegate : UIResponder <UIApplicationDelegate, UIDocumentPickerDelegate, UIDocumentInteractionControllerDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @property (strong, nonatomic) UIViewController *mainViewController;
          @property (strong, nonatomic) UIDocumentInteractionController *documentController;
          @end

          @interface SmartButtonsViewController : UIViewController <UITableViewDelegate, UITableViewDataSource, UIDocumentPickerDelegate>
          @property (strong, nonatomic) UITableView *tableView;
          @property (strong, nonatomic) NSArray *menuItems;
          @property (strong, nonatomic) UIActivityIndicatorView *activityIndicator;
          @property (strong, nonatomic) UILabel *statusLabel;
          @property (weak, nonatomic) SmartButtonsAppDelegate *appDelegate;
          @end

          @implementation SmartButtonsViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.95 green:0.95 blue:0.97 alpha:1.0];
              
              self.appDelegate = (SmartButtonsAppDelegate *)[UIApplication sharedApplication].delegate;
              
              self.menuItems = @[
                  @{@"title": @"📁 استرداد الملفات", @"action": @"restoreFiles"},
                  @{@"title": @"🗜️ فك ضغط الملفات", @"action": @"decompressFiles"},
                  @{@"title": @"📝 صنع ملف جديد", @"action": @"createFile"},
                  @{@"title": @"📤 مشاركة الملفات", @"action": @"shareFiles"}
              ];
              
              [self setupUI];
          }

          - (void)setupUI {
              UILabel *titleLabel = [[UILabel alloc] init];
              titleLabel.text = @"Build SmartButtons";
              titleLabel.font = [UIFont systemFontOfSize:28 weight:UIFontWeightBold];
              titleLabel.textColor = [UIColor blackColor];
              titleLabel.textAlignment = NSTextAlignmentCenter;
              titleLabel.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:titleLabel];

              self.tableView = [[UITableView alloc] init];
              self.tableView.delegate = self;
              self.tableView.dataSource = self;
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.separatorStyle = UITableViewCellSeparatorStyleSingleLine;
              self.tableView.translatesAutoresizingMaskIntoConstraints = NO;
              [self.tableView registerClass:[UITableViewCell class] forCellReuseIdentifier:@"Cell"];
              [self.view addSubview:self.tableView];

              self.statusLabel = [[UILabel alloc] init];
              self.statusLabel.text = @"جاهز للعمل";
              self.statusLabel.font = [UIFont systemFontOfSize:14];
              self.statusLabel.textColor = [UIColor grayColor];
              self.statusLabel.textAlignment = NSTextAlignmentCenter;
              self.statusLabel.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:self.statusLabel];

              self.activityIndicator = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleLarge];
              self.activityIndicator.color = [UIColor systemBlueColor];
              self.activityIndicator.hidesWhenStopped = YES;
              self.activityIndicator.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:self.activityIndicator];

              [NSLayoutConstraint activateConstraints:@[
                  [titleLabel.topAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.topAnchor constant:20],
                  [titleLabel.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:20],
                  [titleLabel.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-20],
                  [titleLabel.heightAnchor constraintEqualToConstant:50],

                  [self.tableView.topAnchor constraintEqualToAnchor:titleLabel.bottomAnchor constant:20],
                  [self.tableView.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:20],
                  [self.tableView.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-20],
                  [self.tableView.bottomAnchor constraintEqualToAnchor:self.statusLabel.topAnchor constant:-20],

                  [self.statusLabel.bottomAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.bottomAnchor constant:-20],
                  [self.statusLabel.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:20],
                  [self.statusLabel.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-20],
                  [self.statusLabel.heightAnchor constraintEqualToConstant:30],

                  [self.activityIndicator.centerXAnchor constraintEqualToAnchor:self.view.centerXAnchor],
                  [self.activityIndicator.centerYAnchor constraintEqualToAnchor:self.view.centerYAnchor]
              ]];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.menuItems.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"Cell" forIndexPath:indexPath];
              NSDictionary *item = self.menuItems[indexPath.row];
              cell.textLabel.text = item[@"title"];
              cell.textLabel.font = [UIFont systemFontOfSize:18];
              cell.textLabel.textAlignment = NSTextAlignmentCenter;
              cell.backgroundColor = [UIColor whiteColor];
              cell.layer.cornerRadius = 10;
              cell.layer.masksToBounds = YES;
              cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
              return cell;
          }

          - (CGFloat)tableView:(UITableView *)tableView heightForRowAtIndexPath:(NSIndexPath *)indexPath {
              return 70;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
              [tableView deselectRowAtIndexPath:indexPath animated:YES];
              NSDictionary *item = self.menuItems[indexPath.row];
              NSString *action = item[@"action"];
              [self performSelector:NSSelectorFromString(action)];
          }

          - (void)restoreFiles {
              [self updateStatus:@"استرداد الملفات..."];
              [self.activityIndicator startAnimating];
              
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [self.activityIndicator stopAnimating];
                  [self showAlert:@"✅ تم الاسترداد" message:@"تم استرداد جميع الملفات بنجاح"];
                  [self updateStatus:@"اكتمل استرداد الملفات"];
              });
          }

          - (void)decompressFiles {
              [self updateStatus:@"فك ضغط الملفات..."];
              [self.activityIndicator startAnimating];
              
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 2 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [self.activityIndicator stopAnimating];
                  [self showAlert:@"✅ تم فك الضغط" message:@"تم فك ضغط الملفات بنجاح"];
                  [self updateStatus:@"اكتمل فك ضغط الملفات"];
              });
          }

          - (void)createFile {
              [self updateStatus:@"إنشاء ملف جديد..."];
              [self.activityIndicator startAnimating];
              
              // Create file in Documents directory
              NSString *docPath = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              NSString *filePath = [docPath stringByAppendingPathComponent:@"SmartFile.txt"];
              NSString *content = [NSString stringWithFormat:@"تم إنشاء هذا الملف في %@", [NSDate date]];
              [content writeToFile:filePath atomically:YES encoding:NSUTF8StringEncoding error:nil];
              
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 1 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{
                  [self.activityIndicator stopAnimating];
                  [self showAlert:@"✅ تم الإنشاء" message:[NSString stringWithFormat:@"تم إنشاء الملف في:\n%@", filePath]];
                  [self updateStatus:@"تم إنشاء ملف جديد"];
              });
          }

          - (void)shareFiles {
              [self updateStatus:@"مشاركة الملفات..."];
              
              NSString *docPath = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              NSString *filePath = [docPath stringByAppendingPathComponent:@"SmartFile.txt"];
              
              // Ensure file exists
              if (![[NSFileManager defaultManager] fileExistsAtPath:filePath]) {
                  NSString *content = @"هذا ملف للمشاركة";
                  [content writeToFile:filePath atomically:YES encoding:NSUTF8StringEncoding error:nil];
              }
              
              NSURL *fileURL = [NSURL fileURLWithPath:filePath];
              NSArray *items = @[fileURL];
              
              UIActivityViewController *activityVC = [[UIActivityViewController alloc] initWithActivityItems:items applicationActivities:nil];
              
              if (UI_USER_INTERFACE_IDIOM() == UIUserInterfaceIdiomPad) {
                  activityVC.popoverPresentationController.sourceView = self.view;
                  activityVC.popoverPresentationController.sourceRect = CGRectMake(self.view.bounds.size.width/2, self.view.bounds.size.height/2, 0, 0);
              }
              
              [self presentViewController:activityVC animated:YES completion:^{
                  [self updateStatus:@"تمت المشاركة"];
              }];
          }

          - (void)updateStatus:(NSString *)message {
              dispatch_async(dispatch_get_main_queue(), ^{
                  self.statusLabel.text = message;
              });
          }

          - (void)showAlert:(NSString *)title message:(NSString *)message {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:title message:message preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"حسناً" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          @end

          @implementation SmartButtonsAppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.backgroundColor = [UIColor whiteColor];
              
              self.mainViewController = [[SmartButtonsViewController alloc] init];
              UINavigationController *navController = [[UINavigationController alloc] initWithRootViewController:self.mainViewController];
              navController.navigationBar.prefersLargeTitles = YES;
              
              self.window.rootViewController = navController;
              [self.window makeKeyAndVisible];
              
              return YES;
          }

          - (void)applicationDidBecomeActive:(UIApplication *)application {
              // Refresh UI if needed
          }

          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([SmartButtonsAppDelegate class]));
              }
          }
          MEOF

          cat > Resources/Info.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>SmartButtons</string>
              <key>CFBundleIdentifier</key>
              <string>com.build.smartbuttons</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>SmartButtons</string>
              <key>CFBundleDisplayName</key>
              <string>Build SmartButtons</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIRequiresFullScreen</key>
              <false/>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleDefault</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.utilities</string>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
          </dict>
          </plist>
          PLISTEOF

          # Create LaunchScreen storyboard
          cat > Resources/LaunchScreen.storyboard << 'LAUNCHSTORYBOARD'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21701" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21679"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="System colors in document resources" minToolsVersion="11.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="375" height="667"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <subviews>
                                      <label opaque="NO" clipsSubviews="YES" userInteractionEnabled="NO" contentMode="left" horizontalHuggingPriority="251" verticalHuggingPriority="251" text="Smart Buttons" textAlignment="center" lineBreakMode="middleTruncation" baselineAdjustment="alignBaselines" minimumFontSize="18" translatesAutoresizingMaskIntoConstraints="NO" id="GJd-Yh-RWb">
                                          <rect key="frame" x="0.0" y="202" width="375" height="43"/>
                                          <fontDescription key="fontDescription" type="boldSystem" pointSize="36"/>
                                          <color key="textColor" systemColor="systemBlueColor"/>
                                          <nil key="highlightedColor"/>
                                      </label>
                                  </subviews>
                                  <viewLayoutGuide key="safeArea" id="Bcu-3y-fUS"/>
                                  <color key="backgroundColor" systemColor="systemBackgroundColor"/>
                                  <constraints>
                                      <constraint firstItem="GJd-Yh-RWb" firstAttribute="centerY" secondItem="Ze5-6b-2t3" secondAttribute="centerY" constant="-110" id="HYp-mB-K31"/>
                                      <constraint firstItem="GJd-Yh-RWb" firstAttribute="leading" secondItem="Bcu-3y-fUS" secondAttribute="leading" id="L7K-hI-2w0"/>
                                      <constraint firstItem="GJd-Yh-RWb" firstAttribute="trailing" secondItem="Bcu-3y-fUS" secondAttribute="trailing" id="fGQ-5t-0j2"/>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="52.173913043478265" y="375"/>
                  </scene>
              </scenes>
              <resources>
                  <systemColor name="systemBackgroundColor">
                      <color white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                  </systemColor>
                  <systemColor name="systemBlueColor">
                      <color red="0.0" green="0.47843137254901963" blue="1" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                  </systemColor>
              </resources>
          </document>
          LAUNCHSTORYBOARD

      - name: Install ImageMagick for icons
        run: |
          brew install imagemagick

      - name: Build Application
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          cd ${{ github.workspace }}
          make clean
          make

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          APP_PATH=$(find .theos -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found."
            exit 1
          fi

          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload
          cp -r "$APP_PATH" build-output/Payload/SmartButtons.app

          # Copy resources
          cp -r Resources/* build-output/Payload/SmartButtons.app/ || true
          cp Resources/Info.plist build-output/Payload/SmartButtons.app/Info.plist
          ldid -S build-output/Payload/SmartButtons.app/SmartButtons

          cd build-output
          zip -r -q ../artifacts/SmartButtons.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/SmartButtons.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartButtons-IPA
          path: artifacts/SmartButtons.ipa
          retention-days: 30
