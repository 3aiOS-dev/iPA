                              .onAppear { withAnimation(.linear(duration: 1).repeatForever(autoreverses: false)) { rotate = true } }
                      }
                      Text("جاري تحميل التطبيقات...").font(.system(size: 14)).foregroundColor(.gray)
                  }
                  .frame(maxWidth: .infinity).padding(.top, 120)
              }
          }

          // MARK: - Error View
          struct ErrorView: View {
              let message: String; let onRetry: () -> Void
              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "wifi.slash").font(.system(size: 50)).foregroundColor(.orange)
                      Text("حدث خطأ").font(.system(size: 20, weight: .bold))
                      Text(message).font(.system(size: 13)).foregroundColor(.gray).multilineTextAlignment(.center)
                      GradientButton(title: "إعادة المحاولة", icon: "arrow.clockwise", gradient: [.orange, .red], action: onRetry)
                          .frame(width: 180)
                  }.padding().frame(maxWidth: .infinity).padding(.top, 80)
              }
          }
          VIPEOF
          echo "ContentView.swift: $(wc -l < ContentView.swift) lines"

      - name: Generate Source - HomeTabView.swift
        run: |
          cat > HomeTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - Home Tab
          struct HomeTabView: View {
              @ObservedObject var appsManager: AppsManager
              @State private var selectedApp: AppItem?
              @Environment(\.colorScheme) var scheme
              @State private var showAIChat = false

              private var newest: [AppItem]   { Array(appsManager.apps.prefix(8)) }
              private var popular: [AppItem]  { appsManager.apps.filter { $0.isPopular }.prefix(8).map { $0 } }
              private var trending: [AppItem] { appsManager.apps.filter { $0.isNew }.prefix(8).map { $0 } }
              private var topRated: [AppItem] { appsManager.apps.sorted { (Int($0.down) ?? 0) > (Int($1.down) ?? 0) }.prefix(5).map { $0 } }

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 22) {
                              if appsManager.isLoading && appsManager.apps.isEmpty {
                                  LoadingView()
                              } else if let err = appsManager.errorMessage, appsManager.apps.isEmpty {
                                  ErrorView(message: err) { appsManager.retryFetch() }
                              } else {
                                  // 1) Hero Banner
                                  StoreHeroBanner()
                                      .padding(.top, 6)

                                  // 2) Ad Carousel
