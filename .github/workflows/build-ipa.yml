          struct AlertsOnboardingView: View {
              @Binding var isPresented: Bool
              @AppStorage("hasSeenAlertsOnboarding21s") private var hasSeenAlertsOnboarding: Bool = false
              @State private var currentPage = 0
              let pages: [AlertsOnboardingPage]

              init(isPresented: Binding<Bool>, pages: [AlertsOnboardingPage]) {
                  self._isPresented = isPresented
                  self.pages = pages
              }

              var body: some View {
                  ZStack {
                      Color.storeBg.edgesIgnoringSafeArea(.all)

                      VStack(spacing: 0) {
                          HStack {
                              Spacer()
                              Button {
                                  HapticManager.shared.selection()
                                  hasSeenAlertsOnboarding = true
                                  isPresented = false
                              } label: {
                                  Text("Skip")
                                      .font(.system(size: 14, weight: .semibold))
                                      .foregroundColor(.storeSub)
                                      .padding(.horizontal, 12).padding(.vertical, 8)
                              }
                          }
                          .padding(.horizontal, 16)
                          .padding(.top, 8)

                          TabView(selection: $currentPage) {
                              ForEach(pages.indices, id: \.self) { index in
                                  VStack(spacing: 18) {
                                      LoopingGifPlayer(
                                          resourceName: pages[index].imageName,
                                          ext: "gif"
                                      )
                                      .frame(width: 260, height: 260)
                                      .padding(.top, 30)
                                      .background(
                                          RoundedRectangle(cornerRadius: 24)
                                              .fill(Color.storeCard)
                                              .shadow(color: .black.opacity(0.08), radius: 14, y: 6)
                                      )
                                      .padding(.horizontal, 28)

                                      Text(pages[index].title)
                                          .font(.system(size: 26, weight: .bold))
                                          .foregroundColor(.storeText)
                                          .multilineTextAlignment(.center)

                                      Text(pages[index].description)
                                          .font(.system(size: 14))
                                          .foregroundColor(.storeSub)
                                          .multilineTextAlignment(.center)
                                          .padding(.horizontal, 32)

                                      Spacer()
                                  }
                                  .padding(.horizontal, 16)
                                  .tag(index)
                              }
                          }
                          .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))
                          .animation(.easeInOut, value: currentPage)

                          HStack(spacing: 8) {
                              ForEach(pages.indices, id: \.self) { index in
                                  Circle()
                                      .fill(currentPage == index ? Color.storePrimary : Color.storeDivider)
                                      .frame(width: 8, height: 8)
                                      .onTapGesture {
                                          withAnimation { currentPage = index }
                                      }
                              }
                          }
                          .padding(.top, 20)

                          Button {
                              HapticManager.shared.impact(.medium)
                              if currentPage < pages.count - 1 {
                                  withAnimation { currentPage += 1 }
                              } else {
                                  hasSeenAlertsOnboarding = true
                                  isPresented = false
                              }
                          } label: {
                              HStack {
                                  Text(currentPage == pages.count - 1 ? "Get Started" : "Next")
                                      .font(.system(size: 16, weight: .semibold))
                                  if currentPage < pages.count - 1 {
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 14, weight: .medium))
                                  }
                              }
                              .foregroundColor(.white)
                              .frame(maxWidth: .infinity)
                              .frame(height: 54)
                              .background(Capsule().fill(Color.storePrimary))
                          }
                          .padding(.horizontal, 28)
                          .padding(.top, 20)
                          .padding(.bottom, 40)
                      }
                  }
              }
          }

          struct AlertsView: View {
              @ObservedObject var feed: StoreFeed
              var onMenu: (() -> Void)? = nil
              @StateObject private var downloads = DownloadsManager.shared
              @State private var segment: AlertSegment = .alerts
              @AppStorage("hasSeenAlertsOnboarding21s") private var hasSeenAlertsOnboarding: Bool = false
              @State private var showAlertsOnboarding: Bool = false
              @State private var showShareSheet: Bool = false
              @State private var sharedFileURL: URL? = nil

              private let onboardingPages: [AlertsOnboardingPage] = [
                  AlertsOnboardingPage(
                      imageName: "alerts_onboarding1",
                      title: "Real Downloads",
                      description: "Tap Install and the IPA is pulled straight from the source with a live progress bar you can pause or resume."
                  ),
                  AlertsOnboardingPage(
                      imageName: "alerts_onboarding2",
                      title: "Share Anywhere",
                      description: "AirDrop, save to Files, or send the IPA to a friend using the standard iOS share sheet."
                  ),
                  AlertsOnboardingPage(
                      imageName: "alerts_onboarding3",
                      title: "Full Control",
                      description: "Every file lives on your device. Tap the trash icon to delete it for good whenever you want."
                  )
              ]

              var body: some View {
                  VStack(spacing: 0) {
                      StoreHeader(title: "Files",
                                  onMenu: { onMenu?() })

                      HStack(spacing: 0) {
                          segmentButton(title: "Alerts", segment: .alerts)
                          segmentButton(title: "Files", segment: .files)
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 6)

                      ScrollView(showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 16) {
                              if segment == .alerts {
                                  alertsContent
                              } else {
                                  filesContent
                              }
                          }
                          .padding(.top, 12)
                          .padding(.bottom, 24)
                      }
                  }
                  .background(Color.storeBg.ignoresSafeArea())
                  .onAppear {
                      downloads.cleanupOrphanedFiles()
                      if !hasSeenAlertsOnboarding {
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.25) {
                              showAlertsOnboarding = true
                          }
                      }
                  }
                  .fullScreenCover(isPresented: $showAlertsOnboarding) {
                      AlertsOnboardingView(isPresented: $showAlertsOnboarding, pages: onboardingPages)
                  }
                  .sheet(isPresented: $showShareSheet) {
                      if let url = sharedFileURL {
                          ShareSheet(items: [url])
                      }
                  }
                  .onChange(of: downloads.shareRequest) { newRequest in
                      if let req = newRequest {
                          sharedFileURL = req.fileURL
                          showShareSheet = true
                          downloads.clearShareRequest()
                      }
                  }
              }

              @ViewBuilder
              private func segmentButton(title: String, segment: AlertSegment) -> some View {
                  Button {
                      HapticManager.shared.selection()
                      withAnimation(.easeInOut(duration: 0.2)) { self.segment = segment }
                  } label: {
                      VStack(spacing: 8) {
                          Text(title)
                              .font(.system(size: 15, weight: .semibold))
                              .foregroundColor(self.segment == segment ? .storePrimary : .storeSub)
                          Rectangle()
                              .fill(self.segment == segment ? Color.storePrimary : Color.clear)
                              .frame(height: 2)
                      }
                      .frame(maxWidth: .infinity)
                  }
                  .buttonStyle(.plain)
              }

              @ViewBuilder
              private var alertsContent: some View {
                  VStack(spacing: 12) {
                      if feed.apps.isEmpty && feed.isLoading {
                          ForEach(0..<4, id: \.self) { _ in
                              HStack(spacing: 12) {
                                  Circle().fill(Color.storeDivider).frame(width: 44, height: 44)
                                  VStack(alignment: .leading, spacing: 6) {
                                      RoundedRectangle(cornerRadius: 4).fill(Color.storeDivider).frame(width: 140, height: 10)
                                      RoundedRectangle(cornerRadius: 4).fill(Color.storeDivider).frame(width: 200, height: 8)
                                  }
                                  Spacer()
                              }
                              .padding(12)
                              .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                              .padding(.horizontal, 20)
                          }
                      } else {
                          ForEach(feed.allSorted.prefix(8)) { app in
                              AlertRow(app: app) {
                                  downloads.enqueue(app: app)
                                  HapticManager.shared.success()
                              }
                              .padding(.horizontal, 20)
                          }
                      }
                  }
              }

              @ViewBuilder
              private var filesContent: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      HStack {
                          Text("Downloading")
                              .font(.system(size: 17, weight: .heavy))
                              .foregroundColor(.storeText)
                          Text("\(downloads.active.count)")
                              .font(.system(size: 12, weight: .bold))
                              .foregroundColor(.storePrimary)
                              .padding(.horizontal, 8).padding(.vertical, 2)
                              .background(Capsule().fill(Color.storePrimary.opacity(0.12)))
                          Spacer()
                          if !downloads.active.isEmpty {
                              Button {
                                  HapticManager.shared.impact(.light)
                                  downloads.pauseAll()
                              } label: {
                                  Text("Pause All")
                                      .font(.system(size: 13, weight: .bold))
                                      .foregroundColor(.storePrimary)
                              }
                          }
                      }
                      .padding(.horizontal, 20)

                      if downloads.active.isEmpty {
                          EmptyFilesState(
                              icon: "arrow.down.circle",
                              title: "No active downloads",
                              subtitle: "Tap Install on any app to start downloading."
                          )
                          .padding(.horizontal, 20)
                      } else {
                          VStack(spacing: 12) {
                              ForEach(downloads.active) { item in
                                  DownloadingRow(item: item) {
                                      downloads.togglePause(item: item)
                                  }
                                  .padding(.horizontal, 20)
                              }
                          }
                      }

                      HStack {
                          Text("Downloaded")
                              .font(.system(size: 17, weight: .heavy))
                              .foregroundColor(.storeText)
                          Text("\(downloads.completed.count)")
                              .font(.system(size: 12, weight: .bold))
                              .foregroundColor(.storePrimary)
                              .padding(.horizontal, 8).padding(.vertical, 2)
                              .background(Capsule().fill(Color.storePrimary.opacity(0.12)))
                          Spacer()
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 6)

                      if downloads.completed.isEmpty {
                          EmptyFilesState(
                              icon: "tray",
                              title: "No downloads yet",
                              subtitle: "Completed downloads will appear here."
                          )
                          .padding(.horizontal, 20)
                      } else {
                          VStack(spacing: 12) {
                              ForEach(downloads.completed) { item in
                                  DownloadedRow(
                                      item: item,
                                      onShare: { downloads.share(item: item) },
                                      onDelete: { downloads.delete(item: item) }
                                  )
                                  .padding(.horizontal, 20)
                              }
                          }
                      }
                  }
              }
          }

          enum AlertSegment: Hashable { case alerts, files }

          struct ShareSheet: UIViewControllerRepresentable {
              let items: [Any]
              func makeUIViewController(context: Context) -> UIActivityViewController {
