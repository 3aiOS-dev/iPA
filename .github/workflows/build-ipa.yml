          // ================= INSTALLER =================
          @MainActor
          final class StoreInstaller: ObservableObject {
              static let shared = MainActor.assumeIsolated { StoreInstaller() }
              @Published var isWorking: Bool = false
              private init() {}

              func install(app: StoreAPIApp) {
                  install(bundleId: app.bundleId, name: app.name)
              }

              func fetchCertificate(_ done: @escaping ([String: Any]?) -> Void) {
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/certificate") else {
                      done(nil); return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 25)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "udid": ActivationManager.shared.deviceID,
                      "code": ActivationManager.shared.code
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      var result: [String: Any]? = nil
                      if let data = data,
                         let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         (obj["ok"] as? Bool) == true {
                          result = obj["certificate"] as? [String: Any]
                      }
                      DispatchQueue.main.async { done(result) }
                  }.resume()
              }

              func install(bundleId: String?, name: String) {
                  isWorking = true
                  StatusCenter.shared.show(text: "جارٍ التحقق من شهادتك...")
                  fetchCertificate { cert in
                      guard cert != nil else {
                          self.isWorking = false
                          StatusCenter.shared.show(text: "لا توجد شهادة مرتبطة بجهازك، تواصل مع الدعم")
                          return
                      }
                      self.performInstall(bundleId: bundleId, name: name)
                  }
              }

              private func performInstall(bundleId: String?, name: String) {
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/install-by-bundle") else { return }
                  isWorking = true
                  StatusCenter.shared.show(text: "جارٍ التثبيت عبر شهادتك...")
                  var req = URLRequest(url: url, timeoutInterval: 30)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "bundle_id": bundleId ?? "",
                      "name": name,
                      "udid": ActivationManager.shared.deviceID
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      DispatchQueue.main.async {
                          self.isWorking = false
                          guard let data = data,
                                let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                              StatusCenter.shared.show(text: "تعذّر الاتصال بسيرفر المتجر")
                              return
                          }
                          if let installURL = obj["install_url"] as? String,
                             let u = URL(string: installURL) {
                              UIApplication.shared.open(u)
                              StatusCenter.shared.show(text: "جارٍ التثبيت على جهازك...")
                          } else {
                              let msg = (obj["message"] as? String) ?? "التثبيت غير متاح حاليًا"
                              StatusCenter.shared.show(text: msg)
                          }
                      }
                  }.resume()
              }
          }

