                                     onMenu: { openSettings() },
                                     onSettings: { openSettings() })
                              .opacity(tab == 3 ? 1 : 0)
                              .allowsHitTesting(tab == 3)
                      }
                      .padding(.bottom, 90)

                      StoreTabBar(tab: $tab, onSearch: { showSearch = true })

                      StatusOverlayHost()
                          .ignoresSafeArea(.keyboard)
                          .zIndex(9999)
                  }
                  .onAppear {
                      StatusCenter.shared.start()
                  }
                  .sheet(isPresented: $showSearch) { SearchView(feed: feed) }
                  .sheet(isPresented: $showSettings) {
                      SettingsView(authManager: authManager, isPresented: $showSettings)
                  }
                  .fullScreenCover(isPresented: $showSettingsOnboarding) {
                      SettingsOnboardingView(isPresented: $showSettingsOnboarding,
                                             onFinish: {
