          struct ChangePasswordView: View {
              @ObservedObject var authManager: AuthManager
              @Binding var isPresented: Bool

              @State private var currentPassword: String = ""
              @State private var newPassword: String = ""
              @State private var confirmPassword: String = ""
              @State private var isCurrentVisible: Bool = false
              @State private var isNewVisible: Bool = false
              @State private var isConfirmVisible: Bool = false
              @State private var error: String? = nil
              @State private var showSavedToast = false

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 18) {
                              SettingsTopBar(onBack: { isPresented = false }, title: "Password")

                              VStack(spacing: 12) {
                                  PasswordField(
                                      label: "Current password",
                                      text: $currentPassword,
                                      isVisible: $isCurrentVisible
                                  )
                                  PasswordField(
                                      label: "New password",
                                      text: $newPassword,
                                      isVisible: $isNewVisible
                                  )
                                  PasswordField(
                                      label: "Confirm new password",
                                      text: $confirmPassword,
                                      isVisible: $isConfirmVisible
                                  )
                              }
                              .padding(.horizontal, 20)

                              if let err = error {
                                  HStack(spacing: 6) {
                                      Image(systemName: "exclamationmark.triangle.fill")
                                          .foregroundColor(.xcodeRed)
                                          .font(.system(size: 12))
                                      Text(err).font(.system(size: 12)).foregroundColor(.xcodeRed)
                                      Spacer()
                                  }
                                  .padding(.horizontal, 24)
                              }

                              VStack(alignment: .leading, spacing: 6) {
                                  rule("At least 6 characters", ok: newPassword.count >= 6)
                                  rule("Passwords match", ok: !newPassword.isEmpty && newPassword == confirmPassword)
                              }
                              .padding(.horizontal, 24)
                              .frame(maxWidth: .infinity, alignment: .leading)

                              Button {
                                  update()
                              } label: {
                                  Text("Update password")
                                      .font(.system(size: 15, weight: .bold))
                                      .foregroundColor(.white)
                                      .frame(maxWidth: .infinity)
                                      .frame(height: 50)
                                      .background(Capsule().fill(Color.storePrimary))
                              }
                              .padding(.horizontal, 20)
                              .padding(.top, 6)

                              Spacer(minLength: 30)
                          }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                  }
                  .overlay(alignment: .top) {
                      if showSavedToast {
                          HStack(spacing: 8) {
                              Image(systemName: "checkmark.circle.fill")
                                  .foregroundColor(.white)
                              Text("Password updated")
                                  .font(.system(size: 13, weight: .semibold))
                                  .foregroundColor(.white)
                          }
                          .padding(.horizontal, 18).padding(.vertical, 12)
                          .background(Capsule().fill(Color.accentGreen))
                          .shadow(color: .black.opacity(0.2), radius: 8, y: 4)
                          .transition(.move(edge: .top).combined(with: .opacity))
                          .padding(.top, 60)
                      }
                  }
                  .animation(.spring(), value: showSavedToast)
              }

              private func rule(_ text: String, ok: Bool) -> some View {
                  HStack(spacing: 6) {
                      Image(systemName: ok ? "checkmark.circle.fill" : "circle")
                          .foregroundColor(ok ? .accentGreen : .storeSub)
                          .font(.system(size: 11, weight: .bold))
                      Text(text).font(.system(size: 12, weight: .medium)).foregroundColor(ok ? .storeText : .storeSub)
                  }
              }

              private func update() {
                  error = nil
                  guard let user = authManager.currentUser else { return }
                  if currentPassword != user.password {
                      error = "Current password is incorrect"
                      HapticManager.shared.error(); return
                  }
                  if newPassword.count < 6 {
                      error = "New password must be at least 6 characters"
                      HapticManager.shared.error(); return
                  }
                  if newPassword != confirmPassword {
                      error = "New passwords do not match"
                      HapticManager.shared.error(); return
                  }

                  let key = AppConstants.userDefaultsKey
                  if let data = UserDefaults.standard.data(forKey: key),
                     var users = try? JSONDecoder().decode([AppUser].self, from: data),
                     let idx = users.firstIndex(where: { $0.id == user.id }) {
                      users[idx] = AppUser(
                          id: user.id,
                          phoneNumber: user.phoneNumber,
                          username: user.username,
                          password: newPassword,
                          createdAt: user.createdAt
                      )
                      if let encoded = try? JSONEncoder().encode(users) {
                          UserDefaults.standard.set(encoded, forKey: key)
                      }
                  }

                  HapticManager.shared.success()
                  showSavedToast = true
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                      showSavedToast = false
                      isPresented = false
                  }
              }
          }

