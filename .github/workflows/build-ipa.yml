                  return !p.isEmpty && !prov.isEmpty && !certPassword.isEmpty
              }
          
              // MARK: - استيراد مع التحقق الكامل
              func importCertificate() {
                  guard let p12   = p12Data,
                        let prov  = provData else {
                      validationError = "❌ يرجى اختيار ملف P12 وملف Provisioning Profile"
                      showValidationError = true
                      return
                  }
                  guard !p12.isEmpty, !prov.isEmpty else {
                      validationError = "❌ أحد الملفات فارغ — يرجى إعادة اختيارهما"
                      showValidationError = true
                      return
                  }
          
                  isImporting = true
          
                  certificateManager.validateAndSaveCertificate(
                      p12Data:      p12,
                      provisionData: prov,
                      password:     certPassword,
                      displayName:  certDisplayName
                  ) { result in
                      isImporting = false
                      switch result {
                      case .success(let cert):
                          certificateManager.saveCertificate(cert)
                          p12Data  = nil; p12Name  = ""
                          provData = nil; provName = ""
                          certPassword = ""; certDisplayName = ""
                      case .failure(let err):
                          validationError = err.localizedDescription
                          showValidationError = true
                      }
                  }
              }
          
              func yearOf(_ date: Date) -> String {
                  let df = DateFormatter(); df.dateFormat = "yyyy"; return df.string(from: date)
              }
          }
          
