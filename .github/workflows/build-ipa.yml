              private let kUser  = "ones_social_user_v1"
              private let kName  = "ones_social_name_v1"

              private(set) var token = ""

              private init() {
                  let d = UserDefaults.standard
                  token = d.string(forKey: kToken) ?? ""
                  userID = d.string(forKey: kUser)  ?? ""
                  username = d.string(forKey: kName) ?? ""
                  isSignedIn = !token.isEmpty
              }

              private func persist(_ json: [String: Any], username: String) -> Bool {
                  guard let access = json["access_token"] as? String else {
                      lastError = S(json["msg"]).isEmpty ? S(json["error_description"]) : S(json["msg"])
                      if lastError.isEmpty { lastError = "تعذر إكمال العملية" }
                      return false
                  }
                  token = access
                  if let user = json["user"] as? [String: Any] { userID = S(user["id"]) }
                  self.username = username
                  let d = UserDefaults.standard
                  d.set(access,  forKey: kToken)
                  d.set(userID,  forKey: kUser)
                  d.set(username, forKey: kName)
                  isSignedIn = true
                  lastError = ""
                  return true
              }

              func signUp(username: String, password: String, completion: @escaping (Bool) -> Void) {
                  let name = username.trimmingCharacters(in: .whitespacesAndNewlines)
                  let body: [String: Any] = [
                      "email": ONEsCloud.email(for: name),
                      "password": password,
                      "data": ["username": name, "display_name": name]
                  ]
                  ONEsCloud.send("/auth/v1/signup", method: "POST", body: body) { _, json in
                      guard let json = json else { self.lastError = "لا يوجد اتصال"; completion(false); return }
                      if json["access_token"] != nil {
                          completion(self.persist(json, username: name))
                      } else {
                          self.signIn(username: name, password: password, completion: completion)
                      }
                  }
              }

              func signIn(username: String, password: String, completion: @escaping (Bool) -> Void) {
                  let name = username.trimmingCharacters(in: .whitespacesAndNewlines)
                  let body: [String: Any] = ["email": ONEsCloud.email(for: name), "password": password]
                  ONEsCloud.send("/auth/v1/token?grant_type=password", method: "POST", body: body) { _, json in
                      guard let json = json else { self.lastError = "لا يوجد اتصال"; completion(false); return }
                      completion(self.persist(json, username: name))
                  }
              }

              func signOut() {
                  token = ""; userID = ""; username = ""; isSignedIn = false
                  let d = UserDefaults.standard
                  d.removeObject(forKey: kToken); d.removeObject(forKey: kUser); d.removeObject(forKey: kName)
              }
          }

          // ================= CONTENT STORE =================
          final class ONEsContent: ObservableObject {
              static let shared = ONEsContent()

              @Published var ads: [ONEsAd] = []
              @Published var notices: [ONEsNotice] = []
              @Published var news: [ONEsNews] = []
              @Published var offers: [ONEsOffer] = []
              @Published var suggestions: [ONEsSuggestion] = []
              @Published var posts: [ONEsPost] = []
              @Published var names: [String: String] = [:]
              @Published var avatars: [String: String] = [:]     // uid -> base64 OR http(s) URL
              @Published var bios: [String: String] = [:]
              @Published var likedIDs: Set<String> = []
              @Published var repostedIDs: Set<String> = []
              @Published var notifications: [ONEsNotification] = []
              @Published var unreadNotifs: Int = 0
              @Published var sources: [ONEsSource] = []
              @Published var installs: [String: Int] = [:]
              @Published var myReports: [ONEsReportItem] = []
              @Published var isLoading = false

              private var pollTimer: Timer? = nil
              private let forumKinds: Set<String> = ["post", "broadcast", "news", "offer"]
              var forumNotifications: [ONEsNotification] {
                  notifications.filter { forumKinds.contains($0.kind) }
              }
              var storeNotifications: [ONEsNotification] {
                  notifications.filter { !forumKinds.contains($0.kind) }
              }
              var inboxUnread: Int {
                  let lastSeen = UserDefaults.standard.string(forKey: kLastSeenNotif) ?? ""
                  if lastSeen.isEmpty { return storeNotifications.count }
                  var count = 0
                  for item in storeNotifications {
                      if item.id == lastSeen { break }
                      count += 1
                  }
                  return count
              }

              private let kLastSeenNotif = "ones_last_seen_notif_v2"
              private let kLocalAvatar   = "ones_my_avatar_v2"
              private let kLocalBio      = "ones_my_bio_v2"

              private init() {
                  if let cachedAv = UserDefaults.standard.string(forKey: kLocalAvatar), !cachedAv.isEmpty {
                      DispatchQueue.main.async {
                          if !ONEsSession.shared.userID.isEmpty {
                              self.avatars[ONEsSession.shared.userID] = cachedAv
                          }
                      }
                  }
              }

              // ---- STORE content (ads/notices/news/offers/suggestions) ----
              func loadStoreContent() {
                  ONEsCloud.rows("/rest/v1/ads?active=eq.true&order=sort_order.asc") { rows in
                      self.ads = rows.map {
                          ONEsAd(id: S($0["id"]), title: S($0["title"]), body: S($0["body"]),
                                 image: S($0["image_url"]), link: S($0["link_url"]))
                      }
                  }
                  ONEsCloud.rows("/rest/v1/notices?active=eq.true&order=created_at.desc") { rows in
                      self.notices = rows.map {
                          ONEsNotice(id: S($0["id"]), kind: S($0["kind"]), title: S($0["title"]),
                                     message: S($0["message"]), image: S($0["image_url"]),
                                     actionLabel: S($0["action_label"]), actionURL: S($0["action_url"]))
                      }
                  }
                  ONEsCloud.rows("/rest/v1/news?published=eq.true&order=created_at.desc") { rows in
                      self.news = rows.map {
                          ONEsNews(id: S($0["id"]), kind: S($0["kind"]), title: S($0["title"]),
                                   body: S($0["body"]), image: S($0["image_url"]), link: S($0["link_url"]))
                      }
                  }
                  ONEsCloud.rows("/rest/v1/offers?active=eq.true&order=sort_order.asc") { rows in
                      self.offers = rows.map {
                          ONEsOffer(id: S($0["id"]), title: S($0["title"]), desc: S($0["description"]),
                                    price: S($0["price"]), period: S($0["period"]),
                                    image: S($0["image_url"]), link: S($0["link_url"]))
                      }
                  }
                  ONEsCloud.rows("/rest/v1/suggestions?active=eq.true&order=sort_order.asc") { rows in
                      self.suggestions = rows.map {
                          ONEsSuggestion(id: S($0["id"]), name: S($0["app_name"]), icon: S($0["icon_url"]),
                                         reason: S($0["reason"]), link: S($0["link_url"]))
                      }
                  }
              }

              // ---- FORUM (posts + profiles + avatars + bios) ----
              func loadForum() {
                  isLoading = true
                  let token = ONEsSession.shared.token

                  // Profiles (display_name + avatar_url + bio)
                  ONEsCloud.rows("/rest/v1/profiles?select=id,username,display_name,avatar_url,bio", token: token) { rows in
                      var nameMap: [String: String] = [:]
                      var avMap:   [String: String] = [:]
                      var bioMap:  [String: String] = [:]
                      for r in rows {
                          let id = S(r["id"])
                          if id.isEmpty { continue }
                          let dn = S(r["display_name"])
                          if !dn.isEmpty { nameMap[id] = dn }
                          let av = S(r["avatar_url"])
                          if !av.isEmpty { avMap[id] = av }
                          let b  = S(r["bio"])
                          if !b.isEmpty  { bioMap[id] = b }
                      }
                      // Ensure current user always keeps their locally-cached avatar
                      let me = ONEsSession.shared.userID
                      if !me.isEmpty, let cached = UserDefaults.standard.string(forKey: self.kLocalAvatar), !cached.isEmpty {
                          avMap[me] = cached
                      }
                      DispatchQueue.main.async {
                          self.names   = nameMap
                          self.avatars = avMap
                          self.bios    = bioMap
                      }
                  }

                  // Posts
                  ONEsCloud.rows("/rest/v1/posts?select=*&order=pinned.desc,created_at.desc&limit=120", token: token) { rows in
                      self.isLoading = false
                      self.posts = rows.map {
                          ONEsPost(id: S($0["id"]), author: S($0["author_id"]), body: S($0["body"]),
                                   image: S($0["image_url"]), video: S($0["video_url"]), kind: S($0["kind"]),
                                   likes: I($0["like_count"]), reposts: I($0["repost_count"]),
                                   pinned: B($0["pinned"]), createdAt: S($0["created_at"]))
                      }
                  }

                  guard !ONEsSession.shared.userID.isEmpty else { return }
                  let uid = ONEsSession.shared.userID
                  ONEsCloud.rows("/rest/v1/post_likes?select=post_id&user_id=eq.\(uid)", token: token) { rows in
                      self.likedIDs = Set(rows.map { S($0["post_id"]) })
                  }
                  ONEsCloud.rows("/rest/v1/post_reposts?select=post_id&user_id=eq.\(uid)", token: token) { rows in
                      self.repostedIDs = Set(rows.map { S($0["post_id"]) })
                  }
              }

              // ---- Notifications ----
              func loadNotifications() {
                  let token = ONEsSession.shared.token
                  ONEsCloud.rows("/rest/v1/notifications?select=*&order=created_at.desc&limit=80", token: token) { rows in
                      let list = rows.map {
                          ONEsNotification(id: S($0["id"]), title: S($0["title"]), body: S($0["body"]),
                                           kind: S($0["kind"]), actorID: S($0["actor_id"]),
                                           postID: S($0["post_id"]), createdAt: S($0["created_at"]))
                      }
                      DispatchQueue.main.async {
                          self.notifications = list
                          self.recomputeUnread()
                          self.fireLocalNotifications(for: list)
                      }
                  }
              }

              private func recomputeUnread() {
                  let lastSeen = UserDefaults.standard.string(forKey: kLastSeenNotif) ?? ""
                  if lastSeen.isEmpty { unreadNotifs = storeNotifications.count; return }
                  var n = 0
                  for x in storeNotifications { if x.id == lastSeen { break }; n += 1 }
                  unreadNotifs = n
              }

              func markAllNotificationsRead() {
                  if let first = storeNotifications.first {
                      UserDefaults.standard.set(first.id, forKey: kLastSeenNotif)
                  }
                  unreadNotifs = 0
              }

              private func fireLocalNotifications(for list: [ONEsNotification]) {
                  let lastSeen = UserDefaults.standard.string(forKey: kLastSeenNotif) ?? ""
                  let myID = ONEsSession.shared.userID
                  let center = UNUserNotificationCenter.current()
                  for n in list where !forumKinds.contains(n.kind) {
                      if n.id == lastSeen { break }
                      if n.actorID == myID { continue }   // do not notify yourself
                      let content = UNMutableNotificationContent()
                      content.title = n.title.isEmpty ? "ONEs" : n.title
                      content.body  = n.body
                      content.sound = .default
                      let req = UNNotificationRequest(identifier: n.id, content: content, trigger: nil)
                      center.add(req, withCompletionHandler: nil)
                  }
                  if let first = list.first(where: { !forumKinds.contains($0.kind) }) {
                      UserDefaults.standard.set(first.id, forKey: kLastSeenNotif)
                  }
              }

              // ---- BROADCAST: notify EVERY signed-in user ----
              // Inserts a row into the notifications table — the receiving
              // clients will pick it up on their next loadNotifications()
              // and the iOS notification banner will fire too.
              func broadcast(title: String, body: String, kind: String,
                             postID: String = "", completion: ((Bool) -> Void)? = nil) {
                  let s = ONEsSession.shared
                  let payload: [String: Any] = [
                      "title": title,
                      "body": body,
                      "kind": kind,
                      "actor_id": s.userID,
                      "post_id": postID
                  ]
                  ONEsCloud.send("/rest/v1/notifications", method: "POST", body: payload, token: s.token) { ok, _ in
                      completion?(ok)
                  }
              }

              // ---- Publish (with optional image + auto-broadcast) ----
              func publish(body: String, kind: String, imageBase64: String = "",
                           videoBase64: String = "", completion: @escaping (Bool) -> Void) {
                  let s = ONEsSession.shared
                  guard !s.userID.isEmpty else { completion(false); return }
                  var payload: [String: Any] = [
                      "author_id": s.userID,
                      "body": body,
                      "kind": kind
                  ]
                  if !imageBase64.isEmpty { payload["image_url"] = imageBase64 }
                  if !videoBase64.isEmpty { payload["video_url"] = videoBase64 }
                  ONEsCloud.send("/rest/v1/posts", method: "POST", body: payload, token: s.token) { ok, json in
                      if ok {
                          let newID = S(json?["id"])
                          // Universal broadcast
                          let name = s.username.isEmpty ? "عضو" : s.username
                          let preview = body.prefix(80)
                          let title: String
                          switch kind {
                          case "news":  title = "📰  خبر جديد من \(name)"
                          case "offer": title = "🏷️  عرض جديد من \(name)"
                          default:      title = "💬  منشور جديد من \(name)"
                          }
                          self.broadcast(title: title,
                                         body: String(preview),
                                         kind: kind == "news" ? "news" : (kind == "offer" ? "offer" : "post"),
                                         postID: newID)
                          self.loadForum()
                      }
                      completion(ok)
                  }
              }

              func toggleLike(_ post: ONEsPost) {
                  let s = ONEsSession.shared
                  guard !s.userID.isEmpty else { return }
                  if likedIDs.contains(post.id) {
                      likedIDs.remove(post.id)
                      ONEsCloud.send("/rest/v1/post_likes?post_id=eq.\(post.id)&user_id=eq.\(s.userID)",
                                     method: "DELETE", body: nil, token: s.token) { _, _ in self.loadForum() }
                  } else {
                      likedIDs.insert(post.id)
                      ONEsCloud.send("/rest/v1/post_likes", method: "POST",
                                     body: ["post_id": post.id, "user_id": s.userID], token: s.token) { _, _ in self.loadForum() }
                      // Broadcast a "like" wave (cheap social proof)
                      let name = s.username.isEmpty ? "عضو" : s.username
                      self.broadcast(title: "❤️  تفاعل جديد",
                                     body: "\(name) أعجب بمنشور في المنتدى",
                                     kind: "post", postID: post.id)
                  }
              }

              func toggleRepost(_ post: ONEsPost) {
                  let s = ONEsSession.shared
                  guard !s.userID.isEmpty else { return }
                  if repostedIDs.contains(post.id) {
                      repostedIDs.remove(post.id)
                      ONEsCloud.send("/rest/v1/post_reposts?post_id=eq.\(post.id)&user_id=eq.\(s.userID)",
                                     method: "DELETE", body: nil, token: s.token) { _, _ in self.loadForum() }
                  } else {
                      repostedIDs.insert(post.id)
                      ONEsCloud.send("/rest/v1/post_reposts", method: "POST",
                                     body: ["post_id": post.id, "user_id": s.userID], token: s.token) { _, _ in self.loadForum() }
                      let name = s.username.isEmpty ? "عضو" : s.username
                      self.broadcast(title: "🔁  إعادة نشر",
                                     body: "\(name) أعاد نشر منشور في المنتدى",
                                     kind: "post", postID: post.id)
                  }
              }

              func deletePost(_ post: ONEsPost) {
                  let s = ONEsSession.shared
                  ONEsCloud.send("/rest/v1/posts?id=eq.\(post.id)", method: "DELETE", body: nil, token: s.token) { _, _ in
                      self.loadForum()
                  }
              }

              func report(kind: String, targetID: String, appName: String, bundleID: String, message: String,
                          completion: @escaping (Bool) -> Void) {
                  let s = ONEsSession.shared
                  var payload: [String: Any] = [
                      "kind": kind, "message": message, "app_name": appName,
                      "bundle_id": bundleID, "reporter_name": s.username
                  ]
                  if !targetID.isEmpty { payload["target_id"] = targetID }
                  if !s.userID.isEmpty { payload["reporter_id"] = s.userID }
                  ONEsCloud.send("/rest/v1/reports", method: "POST", body: payload, token: s.token) { ok, _ in
                      completion(ok)
                  }
              }

              // ---- Avatar / Bio ----
              func setMyAvatar(base64: String, completion: @escaping (Bool) -> Void) {
                  let s = ONEsSession.shared
                  guard !s.userID.isEmpty else { completion(false); return }
                  let payload: [String: Any] = [
                      "id": s.userID,
                      "avatar_url": base64,
                      "updated_at": ISO8601DateFormatter().string(from: Date())
                  ]
                  ONEsCloud.send("/rest/v1/profiles?id=eq.\(s.userID)", method: "PATCH",
                                 body: payload, token: s.token) { ok, _ in
                      DispatchQueue.main.async {
                          if ok {
                              self.avatars[s.userID] = base64
                              UserDefaults.standard.set(base64, forKey: self.kLocalAvatar)
                          }
                          completion(ok)
                      }
                  }
              }

              func setMyBio(_ bio: String, completion: @escaping (Bool) -> Void) {
                  let s = ONEsSession.shared
                  guard !s.userID.isEmpty else { completion(false); return }
                  let payload: [String: Any] = [
                      "id": s.userID,
                      "bio": bio,
                      "updated_at": ISO8601DateFormatter().string(from: Date())
                  ]
                  ONEsCloud.send("/rest/v1/profiles?id=eq.\(s.userID)", method: "PATCH",
                                 body: payload, token: s.token) { ok, _ in
                      DispatchQueue.main.async {
                          if ok {
                              self.bios[s.userID] = bio
                              UserDefaults.standard.set(bio, forKey: self.kLocalBio)
                          }
                          completion(ok)
                      }
                  }
              }

              // ---- Full profile (display name + username + bio) ----
              func setMyProfile(displayName: String, username: String, bio: String,
                                completion: @escaping (Bool) -> Void) {
                  let s = ONEsSession.shared
                  guard !s.userID.isEmpty else { completion(false); return }
                  var payload: [String: Any] = [
                      "id": s.userID,
                      "updated_at": ISO8601DateFormatter().string(from: Date())
                  ]
                  let dn = displayName.trimmingCharacters(in: .whitespacesAndNewlines)
                  let un = username.trimmingCharacters(in: .whitespacesAndNewlines)
                  if !dn.isEmpty { payload["display_name"] = dn }
                  if !un.isEmpty { payload["username"] = un }
                  payload["bio"] = bio
                  ONEsCloud.send("/rest/v1/profiles?id=eq.\(s.userID)", method: "PATCH",
                                 body: payload, token: s.token) { ok, _ in
                      DispatchQueue.main.async {
                          if ok {
                              if !dn.isEmpty { self.names[s.userID] = dn }
                              self.bios[s.userID] = bio
                              self.loadForum()
                          }
                          completion(ok)
                      }
                  }
              }

              // ---- Sources (رابط مصدر) ----
              func loadSources() {
                  ONEsCloud.rows("/rest/v1/sources?active=eq.true&order=sort_order.asc") { rows in
                      self.sources = rows.map {
                          ONEsSource(id: S($0["id"]), name: S($0["name"]),
                                     link: S($0["link_url"]), icon: S($0["icon_url"]))
                      }
                  }
              }

              // ---- Install counters ----
              func loadInstalls() {
                  ONEsCloud.rows("/rest/v1/app_installs?select=bundle_id,install_count&limit=1000") { rows in
                      var map: [String: Int] = [:]
                      for r in rows { map[S(r["bundle_id"])] = I(r["install_count"]) }
                      self.installs = map
                  }
              }

              func bumpInstall(bundleID: String, name: String) {
                  guard !bundleID.isEmpty else { return }
                  let payload: [String: Any] = ["_bundle_id": bundleID, "_app_name": name]
                  ONEsCloud.send("/rest/v1/rpc/bump_install", method: "POST", body: payload,
                                 token: ONEsSession.shared.token) { _, _ in
                      DispatchQueue.main.async {
                          self.installs[bundleID] = (self.installs[bundleID] ?? 0) + 1
                          self.loadInstalls()
                      }
                  }
              }

              // ---- My reports + admin replies ----
              func loadMyReports() {
                  let s = ONEsSession.shared
                  guard !s.userID.isEmpty else { self.myReports = []; return }
                  ONEsCloud.rows("/rest/v1/reports?select=*&reporter_id=eq.\(s.userID)&order=created_at.desc&limit=60",
                                 token: s.token) { rows in
                      let list = rows.map {
                          ONEsReportItem(id: S($0["id"]), appName: S($0["app_name"]), message: S($0["message"]),
                                         status: S($0["status"]), reply: S($0["admin_reply"]),
                                         createdAt: S($0["created_at"]))
                      }
                      DispatchQueue.main.async {
                          self.myReports = list
                          self.fireReplyNotifications(list)
                      }
                  }
              }

              private let kSeenReplies = "ones_seen_report_replies_v1"

              private func fireReplyNotifications(_ list: [ONEsReportItem]) {
                  var seen = Set(UserDefaults.standard.stringArray(forKey: kSeenReplies) ?? [])
                  let center = UNUserNotificationCenter.current()
                  for r in list where !r.reply.isEmpty {
                      let key = r.id + "|" + String(r.reply.hashValue)
                      if seen.contains(key) { continue }
                      seen.insert(key)
                      let content = UNMutableNotificationContent()
                      content.title = "📩  رد الإدارة على بلاغك"
                      content.body = r.reply
                      content.sound = .default
                      center.add(UNNotificationRequest(identifier: key, content: content, trigger: nil),
                                 withCompletionHandler: nil)
                  }
                  UserDefaults.standard.set(Array(seen), forKey: kSeenReplies)
              }

              // ---- Polling so notifications arrive even without opening the tab ----
              func startPolling() {
                  pollTimer?.invalidate()
                  let t = Timer.scheduledTimer(withTimeInterval: 45, repeats: true) { _ in
                      self.loadNotifications()
                      self.loadMyReports()
                      self.loadStoreContent()
                  }
                  RunLoop.main.add(t, forMode: .common)
                  pollTimer = t
              }

              func refreshInBackground() {
                  loadNotifications()
                  loadMyReports()
                  loadStoreContent()
                  loadInstalls()
              }
          }

          // ================= EXTRAS (comments + bookmarks + following) =================
          final class ONEsSocialExtras: ObservableObject {
              static let shared = ONEsSocialExtras()

              @Published var comments: [String: [ONEsComment]] = [:]
              @Published var counts: [String: Int] = [:]
              @Published var bookmarks: Set<String> = []
              @Published var following: Set<String> = []

              private let kMarks  = "ones_bookmarks_v2"
              private let kFollow = "ones_following_v2"

              private init() {
                  let d = UserDefaults.standard
                  bookmarks = Set(d.stringArray(forKey: kMarks) ?? [])
                  following = Set(d.stringArray(forKey: kFollow) ?? [])
              }

              func toggleBookmark(_ id: String) {
                  if bookmarks.contains(id) { bookmarks.remove(id) } else { bookmarks.insert(id) }
                  UserDefaults.standard.set(Array(bookmarks), forKey: kMarks)
              }

              func toggleFollow(_ uid: String) {
                  if following.contains(uid) { following.remove(uid) } else { following.insert(uid) }
                  UserDefaults.standard.set(Array(following), forKey: kFollow)
              }

              func loadComments(for postID: String) {
                  let token = ONEsSession.shared.token
                  ONEsCloud.rows("/rest/v1/post_comments?select=*&post_id=eq.\(postID)&order=created_at.asc&limit=200",
                                 token: token) { rows in
                      let list = rows.map {
                          ONEsComment(id: S($0["id"]), postID: S($0["post_id"]), author: S($0["user_id"]),
                                      authorName: S($0["author_name"]),
                                      body: S($0["body"]), createdAt: S($0["created_at"]),
                                      parentID: S($0["parent_id"]))
                      }
                      DispatchQueue.main.async {
                          self.comments[postID] = list
                          self.counts[postID] = list.count
                      }
                  }
              }

              func addComment(postID: String, body: String, parentID: String = "",
                              completion: @escaping (Bool) -> Void) {
                  let s = ONEsSession.shared
                  guard !s.userID.isEmpty, !body.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                      completion(false); return
                  }
                  var payload: [String: Any] = ["post_id": postID, "user_id": s.userID, "body": body,
                                                "author_name": s.username]
                  if !parentID.isEmpty { payload["parent_id"] = parentID }
                  ONEsCloud.send("/rest/v1/post_comments", method: "POST", body: payload, token: s.token) { ok, _ in
                      if ok {
                          self.loadComments(for: postID)
                          let name = s.username.isEmpty ? "عضو" : s.username
                          ONEsContent.shared.broadcast(title: "💬  تعليق جديد",
                                                       body: "\(name): \(body.prefix(80))",
                                                       kind: "post", postID: postID)
                      }
                      completion(ok)
                  }
              }

              func deleteComment(_ c: ONEsComment) {
                  let s = ONEsSession.shared
                  ONEsCloud.send("/rest/v1/post_comments?id=eq.\(c.id)", method: "DELETE", body: nil, token: s.token) { _, _ in
                      self.loadComments(for: c.postID)
                  }
              }
          }

