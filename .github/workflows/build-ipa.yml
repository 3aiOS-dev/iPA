name: Build_21s

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p

      - name: Setup Dependencies
        run: |
          brew install ldid dpkg xz wget curl git make

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Download iOS SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o iPhoneOS16.5.sdk.tar.xz
          tar -xJf iPhoneOS16.5.sdk.tar.xz
          rm iPhoneOS16.5.sdk.tar.xz
          ls -la "$THEOS/sdks"

      - name: Generate App Icons
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size, filename):
              img = Image.new("RGB", (size, size), (18, 18, 30))
              draw = ImageDraw.Draw(img)

              top = (124, 58, 237)      # purple
              bottom = (6, 182, 212)    # teal
              for y in range(size):
                  t = y / size
                  r = int(top[0] * (1 - t) + bottom[0] * t)
                  g = int(top[1] * (1 - t) + bottom[1] * t)
                  b = int(top[2] * (1 - t) + bottom[2] * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b))

              draw.ellipse(
                  [size * 0.18, size * 0.18, size * 0.82, size * 0.82],
                  outline=(255, 255, 255),
                  width=max(2, size // 40),
              )

              text = "21s"
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size * 0.30))
              except Exception:
                  font = ImageFont.load_default()

              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(
                  ((size - tw) / 2 - bbox[0], (size - th) / 2 - bbox[1]),
                  text,
                  fill=(255, 255, 255),
                  font=font,
              )
              img.save(filename)

          # 60pt @2x = 120x120 (iPhone)
          make_icon(120, "Resources/AppIcon60x60@2x.png")
          # 76pt @2x = 152x152 (iPad)
          make_icon(152, "Resources/AppIcon76x76@2x~ipad.png")
          PYEOF
          ls -la Resources

      - name: Generate App Source Files
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources

          cat > Makefile << 'MEOF'
          THEOS ?= $(HOME)/theos
          export THEOS

          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64

          include $(THEOS)/makefiles/common.mk

          APPLICATION_NAME = TwentyOneS

          TwentyOneS_FILES = main.m
          TwentyOneS_FRAMEWORKS = UIKit Foundation
          TwentyOneS_LIBRARIES = z
          TwentyOneS_CFLAGS = -fobjc-arc

          include $(THEOS_MAKE_PATH)/application.mk
          MEOF

          cat > main.m << 'MEOF'
          @import UIKit;
          @import Foundation;
          #import <zlib.h>

          #pragma mark - Simple Zip Extractor

          @interface SimpleUnzip : NSObject
          + (BOOL)extractZipAtPath:(NSString *)zipPath toDirectory:(NSString *)destDir error:(NSError **)error;
          @end

          @implementation SimpleUnzip

          + (BOOL)extractZipAtPath:(NSString *)zipPath toDirectory:(NSString *)destDir error:(NSError **)error {
              NSData *zipData = [NSData dataWithContentsOfFile:zipPath];
              if (!zipData) {
                  if (error) *error = [NSError errorWithDomain:@"SimpleUnzip" code:1 userInfo:@{NSLocalizedDescriptionKey:@"تعذر قراءة الملف"}];
                  return NO;
              }
              const uint8_t *bytes = zipData.bytes;
              NSUInteger length = zipData.length;

              NSInteger eocdOffset = -1;
              for (NSInteger i = (NSInteger)length - 22; i >= 0; i--) {
                  if (bytes[i]==0x50 && bytes[i+1]==0x4b && bytes[i+2]==0x05 && bytes[i+3]==0x06) {
                      eocdOffset = i;
                      break;
                  }
              }
              if (eocdOffset < 0) {
                  if (error) *error = [NSError errorWithDomain:@"SimpleUnzip" code:2 userInfo:@{NSLocalizedDescriptionKey:@"ملف ZIP غير صالح"}];
                  return NO;
              }

              uint16_t entryCount = *(uint16_t *)(bytes + eocdOffset + 10);
              uint32_t centralDirOffset = *(uint32_t *)(bytes + eocdOffset + 16);

              NSFileManager *fm = [NSFileManager defaultManager];
              [fm createDirectoryAtPath:destDir withIntermediateDirectories:YES attributes:nil error:nil];

              NSUInteger pos = centralDirOffset;
              for (int i = 0; i < entryCount; i++) {
                  if (pos + 46 > length) break;
                  uint32_t sig = *(uint32_t *)(bytes + pos);
                  if (sig != 0x02014b50) break;

                  uint16_t method = *(uint16_t *)(bytes + pos + 10);
                  uint32_t compSize = *(uint32_t *)(bytes + pos + 20);
                  uint16_t nameLen = *(uint16_t *)(bytes + pos + 28);
                  uint16_t extraLen = *(uint16_t *)(bytes + pos + 30);
                  uint16_t commentLen = *(uint16_t *)(bytes + pos + 32);
                  uint32_t localHeaderOffset = *(uint32_t *)(bytes + pos + 42);

                  NSString *fileName = [[NSString alloc] initWithBytes:(bytes + pos + 46) length:nameLen encoding:NSUTF8StringEncoding];

                  pos += 46 + nameLen + extraLen + commentLen;

                  if ([fileName hasSuffix:@"/"]) {
                      NSString *dirPath = [destDir stringByAppendingPathComponent:fileName];
                      [fm createDirectoryAtPath:dirPath withIntermediateDirectories:YES attributes:nil error:nil];
                      continue;
                  }

                  if (localHeaderOffset + 30 > length) continue;
                  uint16_t localNameLen = *(uint16_t *)(bytes + localHeaderOffset + 26);
                  uint16_t localExtraLen = *(uint16_t *)(bytes + localHeaderOffset + 28);
                  NSUInteger dataStart = localHeaderOffset + 30 + localNameLen + localExtraLen;
                  if (dataStart + compSize > length) continue;

                  NSData *compData = [NSData dataWithBytes:(bytes + dataStart) length:compSize];
                  NSMutableData *outData = [NSMutableData data];

                  if (method == 0) {
                      outData = [compData mutableCopy];
                  } else if (method == 8) {
                      z_stream strm;
                      memset(&strm, 0, sizeof(strm));
                      if (inflateInit2(&strm, -MAX_WBITS) != Z_OK) continue;

                      strm.next_in = (Bytef *)compData.bytes;
                      strm.avail_in = (uInt)compData.length;

                      uint8_t outBuffer[4096];
                      int ret;
                      do {
                          strm.next_out = outBuffer;
                          strm.avail_out = sizeof(outBuffer);
                          ret = inflate(&strm, Z_NO_FLUSH);
                          if (ret != Z_OK && ret != Z_STREAM_END) break;
                          NSUInteger produced = sizeof(outBuffer) - strm.avail_out;
                          [outData appendBytes:outBuffer length:produced];
                      } while (ret != Z_STREAM_END && strm.avail_in > 0);

                      inflateEnd(&strm);
                  } else {
                      continue;
                  }

                  NSString *outPath = [destDir stringByAppendingPathComponent:fileName];
                  NSString *outParent = [outPath stringByDeletingLastPathComponent];
                  [fm createDirectoryAtPath:outParent withIntermediateDirectories:YES attributes:nil error:nil];
                  [outData writeToFile:outPath atomically:YES];
              }

              return YES;
          }

          @end

          #pragma mark - File Manager View Controller

          @interface FileManagerViewController : UITableViewController
          @property (strong, nonatomic) NSMutableArray<NSString *> *files;
          @property (strong, nonatomic) NSString *documentsPath;
          @end

          @implementation FileManagerViewController

          - (UIColor *)accentPurple { return [UIColor colorWithRed:124/255.0 green:58/255.0 blue:237/255.0 alpha:1.0]; }
          - (UIColor *)accentTeal { return [UIColor colorWithRed:6/255.0 green:182/255.0 blue:212/255.0 alpha:1.0]; }
          - (UIColor *)bgDark { return [UIColor colorWithRed:18/255.0 green:18/255.0 blue:30/255.0 alpha:1.0]; }
          - (UIColor *)cardDark { return [UIColor colorWithRed:28/255.0 green:28/255.0 blue:44/255.0 alpha:1.0]; }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"21s";
              self.documentsPath = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
              self.files = [NSMutableArray array];

              self.view.backgroundColor = [self bgDark];
              self.tableView.backgroundColor = [self bgDark];
              self.tableView.separatorColor = [UIColor colorWithWhite:1.0 alpha:0.08];

              self.navigationController.navigationBar.barTintColor = [self bgDark];
              self.navigationController.navigationBar.tintColor = [self accentTeal];
              self.navigationController.navigationBar.titleTextAttributes = @{NSForegroundColorAttributeName: [UIColor whiteColor], NSFontAttributeName: [UIFont boldSystemFontOfSize:20]};
              self.navigationController.navigationBar.translucent = NO;
              if (@available(iOS 13.0, *)) {
                  self.overrideUserInterfaceStyle = UIUserInterfaceStyleDark;
              }

              self.navigationController.toolbar.barTintColor = [self bgDark];
              self.navigationController.toolbar.tintColor = [self accentTeal];
              self.navigationController.toolbar.translucent = NO;

              UIBarButtonItem *createBtn = [[UIBarButtonItem alloc] initWithTitle:@"➕ صنع ملف" style:UIBarButtonItemStylePlain target:self action:@selector(createFileTapped)];
              UIBarButtonItem *extractBtn = [[UIBarButtonItem alloc] initWithTitle:@"📦 استخراج" style:UIBarButtonItemStylePlain target:self action:@selector(extractZipTapped)];
              UIBarButtonItem *recoverBtn = [[UIBarButtonItem alloc] initWithTitle:@"🔄 استرداد" style:UIBarButtonItemStylePlain target:self action:@selector(recoverFilesTapped)];
              UIBarButtonItem *flex = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemFlexibleSpace target:nil action:nil];

              self.toolbarItems = @[createBtn, flex, extractBtn, flex, recoverBtn];

              [self.tableView registerClass:[UITableViewCell class] forCellReuseIdentifier:@"cell"];
              self.tableView.rowHeight = 64;

              [self reloadFiles];
          }

          - (void)viewWillAppear:(BOOL)animated {
              [super viewWillAppear:animated];
              [self.navigationController setToolbarHidden:NO animated:animated];
          }

          - (void)reloadFiles {
              NSFileManager *fm = [NSFileManager defaultManager];
              NSDirectoryEnumerator *enumerator = [fm enumeratorAtPath:self.documentsPath];
              NSMutableArray *found = [NSMutableArray array];
              NSString *file;
              while ((file = [enumerator nextObject])) {
                  [found addObject:file];
              }
              self.files = found;
              [self.tableView reloadData];
          }

          - (void)recoverFilesTapped {
              [self reloadFiles];
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"تم الاسترداد" message:[NSString stringWithFormat:@"تم العثور على %lu ملف", (unsigned long)self.files.count] preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"حسناً" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (void)createFileTapped {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"صنع ملف جديد" message:@"أدخل اسم الملف والمحتوى" preferredStyle:UIAlertControllerStyleAlert];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *tf) { tf.placeholder = @"اسم الملف مثل test.txt"; }];
              [alert addTextFieldWithConfigurationHandler:^(UITextField *tf) { tf.placeholder = @"محتوى الملف"; }];

              __weak typeof(self) weakSelf = self;
              [alert addAction:[UIAlertAction actionWithTitle:@"إنشاء" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *name = alert.textFields[0].text;
                  NSString *content = alert.textFields[1].text ?: @"";
                  if (name.length == 0) return;
                  NSString *path = [weakSelf.documentsPath stringByAppendingPathComponent:name];
                  [content writeToFile:path atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  [weakSelf reloadFiles];
              }]];
              [alert addAction:[UIAlertAction actionWithTitle:@"إلغاء" style:UIAlertActionStyleCancel handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (void)extractZipTapped {
              NSArray<NSString *> *zipFiles = [self.files filteredArrayUsingPredicate:[NSPredicate predicateWithFormat:@"SELF ENDSWITH[c] '.zip' OR SELF ENDSWITH[c] '.ipa'"]];
              if (zipFiles.count == 0) {
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"لا يوجد ملف مضغوط" message:@"ضع ملف ZIP داخل مجلد المستندات ثم اضغط استرداد" preferredStyle:UIAlertControllerStyleAlert];
                  [alert addAction:[UIAlertAction actionWithTitle:@"حسناً" style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:alert animated:YES completion:nil];
                  return;
              }

              UIAlertController *sheet = [UIAlertController alertControllerWithTitle:@"اختر ملف لفك ضغطه" message:nil preferredStyle:UIAlertControllerStyleActionSheet];
              __weak typeof(self) weakSelf = self;
              for (NSString *zipName in zipFiles) {
                  [sheet addAction:[UIAlertAction actionWithTitle:zipName style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      NSString *zipPath = [weakSelf.documentsPath stringByAppendingPathComponent:zipName];
                      NSString *destDir = [weakSelf.documentsPath stringByAppendingPathComponent:[[zipName stringByDeletingPathExtension] stringByAppendingString:@"_extracted"]];
                      NSError *unzipError;
                      BOOL success = [SimpleUnzip extractZipAtPath:zipPath toDirectory:destDir error:&unzipError];
                      NSString *msg = success ? @"تم فك الضغط بنجاح" : (unzipError.localizedDescription ?: @"فشل فك الضغط");
                      UIAlertController *result = [UIAlertController alertControllerWithTitle:success ? @"نجاح" : @"خطأ" message:msg preferredStyle:UIAlertControllerStyleAlert];
                      [result addAction:[UIAlertAction actionWithTitle:@"حسناً" style:UIAlertActionStyleDefault handler:nil]];
                      [weakSelf presentViewController:result animated:YES completion:nil];
                      [weakSelf reloadFiles];
                  }]];
              }
              [sheet addAction:[UIAlertAction actionWithTitle:@"إلغاء" style:UIAlertActionStyleCancel handler:nil]];

              if (sheet.popoverPresentationController) {
                  sheet.popoverPresentationController.sourceView = self.view;
                  sheet.popoverPresentationController.sourceRect = CGRectMake(self.view.bounds.size.width/2, self.view.bounds.size.height, 1, 1);
              }
              [self presentViewController:sheet animated:YES completion:nil];
          }

          - (void)shareFileAtPath:(NSString *)path {
              NSURL *url = [NSURL fileURLWithPath:path];
              UIActivityViewController *activityVC = [[UIActivityViewController alloc] initWithActivityItems:@[url] applicationActivities:nil];
              if (activityVC.popoverPresentationController) {
                  activityVC.popoverPresentationController.sourceView = self.view;
                  activityVC.popoverPresentationController.sourceRect = CGRectMake(self.view.bounds.size.width/2, self.view.bounds.size.height/2, 1, 1);
              }
              [self presentViewController:activityVC animated:YES completion:nil];
          }

          #pragma mark - UITableViewDataSource

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.files.count;
          }

          - (NSString *)emojiForFile:(NSString *)name {
              NSString *lower = name.lowercaseString;
              if ([lower hasSuffix:@".zip"] || [lower hasSuffix:@".ipa"]) return @"📦";
              if ([lower hasSuffix:@".png"] || [lower hasSuffix:@".jpg"] || [lower hasSuffix:@".jpeg"]) return @"🖼️";
              if ([lower hasSuffix:@".txt"] || [lower hasSuffix:@".md"]) return @"📄";
              if ([lower hasSuffix:@".plist"] || [lower hasSuffix:@".json"]) return @"🧩";
              return @"📁";
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"cell"];
              NSString *relPath = self.files[indexPath.row];
              NSString *fullPath = [self.documentsPath stringByAppendingPathComponent:relPath];

              cell.backgroundColor = [self cardDark];
              UIView *bg = [[UIView alloc] init];
              bg.backgroundColor = [[self accentPurple] colorWithAlphaComponent:0.15];
              cell.selectedBackgroundView = bg;

              cell.textLabel.textColor = [UIColor whiteColor];
              cell.textLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightMedium];
              cell.textLabel.text = [NSString stringWithFormat:@"%@  %@", [self emojiForFile:relPath], relPath];

              NSDictionary *attrs = [[NSFileManager defaultManager] attributesOfItemAtPath:fullPath error:nil];
              unsigned long long fileSize = [attrs[NSFileSize] unsignedLongLongValue];
              cell.detailTextLabel.textColor = [self accentTeal];
              cell.detailTextLabel.font = [UIFont systemFontOfSize:12];
              cell.detailTextLabel.text = [NSByteCountFormatter stringFromByteCount:fileSize countStyle:NSByteCountFormatterCountStyleFile];

              cell.accessoryType = UITableViewCellAccessoryDetailButton;
              return cell;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
              [tableView deselectRowAtIndexPath:indexPath animated:YES];
              NSString *relPath = self.files[indexPath.row];
              NSString *fullPath = [self.documentsPath stringByAppendingPathComponent:relPath];
              [self shareFileAtPath:fullPath];
          }

          @end

          #pragma mark - App Delegate

          @interface TwentyOneSAppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation TwentyOneSAppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              FileManagerViewController *rootVC = [[FileManagerViewController alloc] init];
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:rootVC];
              self.window.rootViewController = nav;
              [self.window makeKeyAndVisible];
              return YES;
          }

          - (void)applicationWillResignActive:(UIApplication *)application {}
          - (void)applicationDidEnterBackground:(UIApplication *)application {}
          - (void)applicationWillEnterForeground:(UIApplication *)application {}
          - (void)applicationDidBecomeActive:(UIApplication *)application {}
          - (void)applicationWillTerminate:(UIApplication *)application {}

          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([TwentyOneSAppDelegate class]));
              }
          }
          MEOF

          cat > Resources/Info.plist << 'MEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>TwentyOneS</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.s21</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>21s</string>
              <key>CFBundleDisplayName</key>
              <string>21s</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                      </array>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76@2x~ipad.png</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          MEOF

      - name: Build Application
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          cd ${{ github.workspace }}
          make clean
          make

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          APP_PATH=$(find .theos -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found."
            exit 1
          fi

          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload
          cp -r "$APP_PATH" build-output/Payload/TwentyOneS.app

          cp Resources/Info.plist build-output/Payload/TwentyOneS.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/TwentyOneS.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/TwentyOneS.app/
          ldid -S build-output/Payload/TwentyOneS.app/TwentyOneS

          cd build-output
          zip -r -q ../artifacts/TwentyOneS.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/TwentyOneS.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwentyOneS-IPA
          path: artifacts/TwentyOneS.ipa
          retention-days: 30
