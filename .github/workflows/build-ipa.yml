                  )
                  persistRepositories()
              }

              func resetQuotaUsage() {
                  quota = DownloadQuota(id: quota.id, totalBytes: quota.totalBytes, usedBytes: 0)
                  persistQuota()
              }

              func addUsedBytes(_ bytes: Int64) {
                  let updated = DownloadQuota(id: quota.id, totalBytes: quota.totalBytes, usedBytes: quota.usedBytes + bytes)
                  quota = updated
                  persistQuota()
              }

              func updateTotalApps(_ count: Int) {
                  totalAppsAvailable = count
              }

