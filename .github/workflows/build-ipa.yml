      - name: Generate Source - Home Tab
        run: |
          cd ${{ github.workspace }}
          cat > HomeViewController.swift << 'HVEOF'
          import UIKit

          final class HomeViewController: UIViewController,
              UICollectionViewDataSource, UICollectionViewDelegate, UICollectionViewDelegateFlowLayout,
              UIScrollViewDelegate {

              private let topBar = TopBarView()
              private let scrollView = UIScrollView()
              private let stack = UIStackView()

              private let bannerScroll = UIScrollView()
              private let bannerStack = UIStackView()
              private let bannerPageControl = UIPageControl()

              private var featuredCollectionView: UICollectionView!

              private var bannerItems: [AppItem] = []
              private var topTenItems: [AppItem] = []
              private var featuredItems: [AppItem] = []

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = AppTheme.background

                  let sorted = AppDataLoader.items.sorted { $0.rating > $1.rating }
                  bannerItems = Array(sorted.prefix(5))
                  topTenItems = Array(sorted.prefix(10))
                  featuredItems = Array(AppDataLoader.items.shuffled().prefix(6))

                  setupTopBar()
                  setupScrollView()

                  buildBannerSection()
                  stack.addArrangedSubview(SectionHeaderView(title: "أفضل 10 تطبيقات", systemIcon: "flame.fill"))
                  buildTopTenSection()
                  stack.addArrangedSubview(paddedAdBanner())
                  stack.addArrangedSubview(SectionHeaderView(title: "مميزة لك", systemIcon: "sparkles"))
                  buildFeaturedSection()
                  stack.addArrangedSubview(paddedAdBanner())
              }

              override func viewWillAppear(_ animated: Bool) {
                  super.viewWillAppear(animated)
                  navigationController?.setNavigationBarHidden(true, animated: animated)
              }

              private func setupTopBar() {
                  topBar.onSettingsTap = { [weak self] in
                      self?.tabBarController?.selectedIndex = 3
                  }
                  topBar.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(topBar)
                  NSLayoutConstraint.activate([
                      topBar.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      topBar.leftAnchor.constraint(equalTo: view.leftAnchor),
                      topBar.rightAnchor.constraint(equalTo: view.rightAnchor),
                      topBar.heightAnchor.constraint(equalToConstant: 56),
                  ])
              }

              private func setupScrollView() {
                  scrollView.showsVerticalScrollIndicator = false
                  scrollView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(scrollView)

                  stack.axis = .vertical
                  stack.spacing = 18
                  stack.translatesAutoresizingMaskIntoConstraints = false
                  scrollView.addSubview(stack)

                  NSLayoutConstraint.activate([
                      scrollView.topAnchor.constraint(equalTo: topBar.bottomAnchor),
                      scrollView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      scrollView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      scrollView.bottomAnchor.constraint(equalTo: view.bottomAnchor),

                      stack.topAnchor.constraint(equalTo: scrollView.topAnchor, constant: 16),
                      stack.leadingAnchor.constraint(equalTo: scrollView.leadingAnchor),
                      stack.trailingAnchor.constraint(equalTo: scrollView.trailingAnchor),
                      stack.bottomAnchor.constraint(equalTo: scrollView.bottomAnchor, constant: -28),
                      stack.widthAnchor.constraint(equalTo: scrollView.widthAnchor),
                  ])
              }

              private func paddedAdBanner() -> UIView {
                  let container = UIView()
                  let ad = AdBannerView()
                  ad.translatesAutoresizingMaskIntoConstraints = false
                  container.addSubview(ad)
                  NSLayoutConstraint.activate([
                      ad.leadingAnchor.constraint(equalTo: container.leadingAnchor, constant: 20),
                      ad.trailingAnchor.constraint(equalTo: container.trailingAnchor, constant: -20),
                      ad.topAnchor.constraint(equalTo: container.topAnchor),
                      ad.bottomAnchor.constraint(equalTo: container.bottomAnchor),
                  ])
                  return container
              }

              // MARK: البنر العلوي المتحرك

              private func buildBannerSection() {
                  let container = UIView()
                  container.heightAnchor.constraint(equalToConstant: 190).isActive = true

                  bannerScroll.showsHorizontalScrollIndicator = false
                  bannerScroll.delegate = self
                  bannerScroll.translatesAutoresizingMaskIntoConstraints = false
                  container.addSubview(bannerScroll)

                  bannerStack.axis = .horizontal
                  bannerStack.spacing = 12
                  bannerStack.translatesAutoresizingMaskIntoConstraints = false
                  bannerScroll.addSubview(bannerStack)

                  for item in bannerItems {
                      let card = BannerCardView(item: item)
                      card.translatesAutoresizingMaskIntoConstraints = false
                      card.widthAnchor.constraint(equalToConstant: 300).isActive = true
                      card.onTap = { [weak self] tapped in
                          self?.openDetail(tapped)
                      }
                      bannerStack.addArrangedSubview(card)
                  }

                  bannerPageControl.numberOfPages = bannerItems.count
                  bannerPageControl.currentPageIndicatorTintColor = AppTheme.accent
                  bannerPageControl.pageIndicatorTintColor = AppTheme.primaryText.withAlphaComponent(0.15)
                  bannerPageControl.translatesAutoresizingMaskIntoConstraints = false
                  container.addSubview(bannerPageControl)

                  NSLayoutConstraint.activate([
                      bannerScroll.topAnchor.constraint(equalTo: container.topAnchor),
                      bannerScroll.leadingAnchor.constraint(equalTo: container.leadingAnchor, constant: 20),
                      bannerScroll.trailingAnchor.constraint(equalTo: container.trailingAnchor, constant: -20),
                      bannerScroll.heightAnchor.constraint(equalToConstant: 160),

                      bannerStack.topAnchor.constraint(equalTo: bannerScroll.topAnchor),
                      bannerStack.leadingAnchor.constraint(equalTo: bannerScroll.leadingAnchor),
                      bannerStack.trailingAnchor.constraint(equalTo: bannerScroll.trailingAnchor),
                      bannerStack.bottomAnchor.constraint(equalTo: bannerScroll.bottomAnchor),
                      bannerStack.heightAnchor.constraint(equalTo: bannerScroll.heightAnchor),

                      bannerPageControl.topAnchor.constraint(equalTo: bannerScroll.bottomAnchor, constant: 6),
                      bannerPageControl.centerXAnchor.constraint(equalTo: container.centerXAnchor),
                  ])

                  stack.addArrangedSubview(container)
              }

              func scrollViewDidScroll(_ scrollView: UIScrollView) {
                  guard scrollView === bannerScroll, bannerItems.count > 0 else { return }
                  let pageWidth: CGFloat = 312
                  let page = Int((scrollView.contentOffset.x + pageWidth / 2) / pageWidth)
                  bannerPageControl.currentPage = max(0, min(page, bannerItems.count - 1))
              }

              // MARK: أفضل 10 تطبيقات

              private func buildTopTenSection() {
                  let container = UIStackView()
                  container.axis = .vertical
                  container.spacing = 2
                  for (index, item) in topTenItems.enumerated() {
                      let row = TopTenRowView(item: item, rank: index + 1)
                      row.onTap = { [weak self] tapped in self?.openDetail(tapped) }
                      container.addArrangedSubview(row)
                  }
                  stack.addArrangedSubview(container)
              }

              // MARK: مميزة لك

              private func buildFeaturedSection() {
                  let layout = UICollectionViewFlowLayout()
                  layout.scrollDirection = .horizontal
                  layout.itemSize = CGSize(width: 150, height: 200)
                  layout.minimumLineSpacing = 12
                  layout.sectionInset = UIEdgeInsets(top: 0, left: 20, bottom: 0, right: 20)

                  featuredCollectionView = UICollectionView(frame: .zero, collectionViewLayout: layout)
                  featuredCollectionView.backgroundColor = .clear
                  featuredCollectionView.showsHorizontalScrollIndicator = false
                  featuredCollectionView.dataSource = self
                  featuredCollectionView.delegate = self
                  featuredCollectionView.register(AppCell.self, forCellWithReuseIdentifier: AppCell.reuseID)
                  featuredCollectionView.translatesAutoresizingMaskIntoConstraints = false
                  featuredCollectionView.heightAnchor.constraint(equalToConstant: 200).isActive = true

                  stack.addArrangedSubview(featuredCollectionView)
              }

              func collectionView(_ collectionView: UICollectionView, numberOfItemsInSection section: Int) -> Int {
                  featuredItems.count
              }

              func collectionView(_ collectionView: UICollectionView, cellForItemAt indexPath: IndexPath) -> UICollectionViewCell {
                  let cell = collectionView.dequeueReusableCell(withReuseIdentifier: AppCell.reuseID, for: indexPath) as! AppCell
                  cell.configure(with: featuredItems[indexPath.item])
                  return cell
              }

              func collectionView(_ collectionView: UICollectionView, didSelectItemAt indexPath: IndexPath) {
                  openDetail(featuredItems[indexPath.item])
              }

              private func openDetail(_ item: AppItem) {
                  let detail = DetailViewController(item: item)
                  navigationController?.pushViewController(detail, animated: true)
              }
          }
          HVEOF

