          // MARK: - Updates Tab
          struct AlertsView: View {
              @ObservedObject var feed: StoreFeed
              @State private var updates: [StoreAPIApp] = []
              @State private var isLoading = false

              private func loadUpdates() {
                  isLoading = true
                  // Use same feed, filter recent
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.1) {
                      let now = Date()
                      let recent = feed.apps.filter { feed.isRecent($0, now: now) }
                      // Separate new vs updated based on createdAt vs updatedAt
                      let newApps = recent.filter { app in
                          if let created = app.createdAt.flatMap({ feed.parseDate($0) }),
                             let updated = app.updatedAt.flatMap({ feed.parseDate($0) }) {
                              return created == updated || updated.timeIntervalSince(created) < 60
                          }
                          return true
                      }
                      let updatedApps = recent.filter { !newApps.contains($0) }
                      // Sort by date descending
                      let sortedNew = newApps.sorted { (a, b) in
                          let da = (a.createdAt ?? a.updatedAt).flatMap { feed.parseDate($0) } ?? .distantPast
                          let db = (b.createdAt ?? b.updatedAt).flatMap { feed.parseDate($0) } ?? .distantPast
                          return da > db
                      }
                      let sortedUpdated = updatedApps.sorted { (a, b) in
                          let da = (a.updatedAt ?? a.createdAt).flatMap { feed.parseDate($0) } ?? .distantPast
                          let db = (b.updatedAt ?? b.createdAt).flatMap { feed.parseDate($0) } ?? .distantPast
                          return da > db
                      }
                      self.updates = sortedNew + sortedUpdated
                      self.isLoading = false
                  }
              }

              var body: some View {
                  VStack(spacing: 0) {
                      ONEsTopBar()

                      ScrollView(showsIndicators: false) {
                          VStack(alignment: .leading, spacing: 12) {
                              if isLoading {
                                  LoadingList()
                              } else if updates.isEmpty {
                                  EmptyState(message: "لا توجد تحديثات جديدة")
                              } else {
                                  // Separate sections
                                  let newItems = updates.filter { app in
                                      if let created = app.createdAt.flatMap({ feed.parseDate($0) }),
                                         let updated = app.updatedAt.flatMap({ feed.parseDate($0) }) {
                                          return created == updated || updated.timeIntervalSince(created) < 60
                                      }
                                      return true
                                  }
                                  let updatedItems = updates.filter { !newItems.contains($0) }

                                  if !newItems.isEmpty {
                                      HStack(spacing: 8) {
                                          Image(systemName: "sparkles")
                                              .font(.system(size: 13, weight: .bold))
                                              .foregroundColor(.storePrimary)
                                          Text("المضافة مؤخراً")
                                              .font(.system(size: 15, weight: .heavy))
                                              .foregroundColor(.storeText)
                                          Spacer()
                                      }
                                      .padding(.horizontal, 22)
                                      .padding(.top, 4)

                                      ForEach(newItems) { app in
                                          UpdateRow(app: app, isNew: true)
                                              .padding(.horizontal, 20)
                                      }
                                  }

                                  if !updatedItems.isEmpty {
                                      HStack(spacing: 8) {
                                          Image(systemName: "arrow.triangle.2.circlepath")
                                              .font(.system(size: 13, weight: .bold))
                                              .foregroundColor(.storeCyan)
                                          Text("تحديثات الإصدارات")
                                              .font(.system(size: 15, weight: .heavy))
                                              .foregroundColor(.storeText)
                                          Spacer()
                                      }
                                      .padding(.horizontal, 22)
                                      .padding(.top, newItems.isEmpty ? 4 : 14)

                                      ForEach(updatedItems) { app in
                                          UpdateRow(app: app, isNew: false)
                                              .padding(.horizontal, 20)
                                      }
                                  }
                              }
                          }
                          .padding(.top, 14)
                          .padding(.bottom, 26)
                      }
                      .refreshable { await feed.refresh(); loadUpdates() }
                  }
                  .background(Color.storeBg.ignoresSafeArea())
                  .onAppear { loadUpdates() }
                  .onChange(of: feed.apps) { _ in loadUpdates() }
              }
          }

