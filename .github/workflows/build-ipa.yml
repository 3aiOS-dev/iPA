              @AppStorage("hasSeenAlertsOnboarding21s") private var hasSeenAlertsOnboarding: Bool = false
              @State private var currentPage = 0
              let pages: [AlertsOnboardingPage]

              init(isPresented: Binding<Bool>, pages: [AlertsOnboardingPage]) {
                  self._isPresented = isPresented
                  self.pages = pages
              }

              var body: some View {
                  ZStack {
                      Color.storeBg.edgesIgnoringSafeArea(.all)

                      VStack(spacing: 0) {
                          HStack {
                              Spacer()
                              Button {
                                  HapticManager.shared.selection()
                                  hasSeenAlertsOnboarding = true
                                  isPresented = false
                              } label: {
                                  Text("تخطي")
                                      .font(.system(size: 14, weight: .semibold))
                                      .foregroundColor(.storeSub)
                                      .padding(.horizontal, 12).padding(.vertical, 8)
                              }
                          }
                          .padding(.horizontal, 16)
                          .padding(.top, 8)

                          TabView(selection: $currentPage) {
                              ForEach(pages.indices, id: \.self) { index in
                                  VStack(spacing: 18) {
                                      LoopingGifPlayer(
                                          resourceName: pages[index].imageName,
                                          ext: "gif"
                                      )
                                      .frame(width: 260, height: 260)
                                      .padding(.top, 30)
                                      .background(
                                          RoundedRectangle(cornerRadius: 24)
                                              .fill(Color.storeCard)
                                              .shadow(color: .black.opacity(0.08), radius: 14, y: 6)
                                      )
                                      .padding(.horizontal, 28)

                                      Text(pages[index].title)
                                          .font(.system(size: 26, weight: .bold))
                                          .foregroundColor(.storeText)
                                          .multilineTextAlignment(.center)

                                      Text(pages[index].description)
                                          .font(.system(size: 14))
                                          .foregroundColor(.storeSub)
                                          .multilineTextAlignment(.center)
                                          .padding(.horizontal, 32)

                                      Spacer()
                                  }
                                  .padding(.horizontal, 16)
                                  .tag(index)
                              }
                          }
                          .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))
                          .animation(.easeInOut, value: currentPage)

                          HStack(spacing: 8) {
                              ForEach(pages.indices, id: \.self) { index in
                                  Circle()
                                      .fill(currentPage == index ? Color.storePrimary : Color.storeDivider)
                                      .frame(width: 8, height: 8)
