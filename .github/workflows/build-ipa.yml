          // ================= COMMENTS SHEET =================
          struct ONEsCommentsSheet: View {
              let post: ONEsPost
              @ObservedObject private var extras = ONEsSocialExtras.shared
              @ObservedObject private var content = ONEsContent.shared
              @ObservedObject private var session = ONEsSession.shared
              @Environment(\.dismiss) private var dismiss
              @State private var draft = ""
              @State private var busy = false
              @State private var replyTo: ONEsComment? = nil

              var body: some View {
                  VStack(spacing: 0) {
                      Capsule().fill(Color.white.opacity(0.2)).frame(width: 40, height: 5).padding(.vertical, 10)
                      HStack {
                          HStack(spacing: 8) {
                              Image(systemName: "bubble.left.fill").foregroundColor(Color.storePrimary)
                              Text("التعليقات")
                                  .font(.system(size: 17, weight: .black))
                                  .foregroundColor(.white)
                          }
                          Spacer()
                          Text("\(extras.counts[post.id] ?? 0)")
                              .font(.system(size: 12, weight: .bold))
                              .foregroundColor(.white.opacity(0.6))
                              .padding(.horizontal, 10).padding(.vertical, 4)
                              .background(Capsule().fill(Color.white.opacity(0.08)))
                          Button { dismiss() } label: {
                              Image(systemName: "xmark.circle.fill")
                                  .font(.system(size: 22))
                                  .foregroundColor(.white.opacity(0.45))
                          }
                          .buttonStyle(.plain)
                      }
                      .padding(.horizontal, 18)
                      .padding(.bottom, 10)

                      Divider().overlay(Color.white.opacity(0.08))

                      ScrollView(showsIndicators: false) {
                          LazyVStack(alignment: .leading, spacing: 14) {
                              let list = extras.comments[post.id] ?? []
                              if list.isEmpty {
                                  VStack(spacing: 8) {
                                      Image(systemName: "bubble.left.and.bubble.right")
                                          .font(.system(size: 30))
                                          .foregroundColor(.white.opacity(0.25))
                                      Text("لا توجد تعليقات بعد — كن أول من يعلّق")
                                          .font(.system(size: 13))
                                          .foregroundColor(.white.opacity(0.5))
                                  }
                                  .frame(maxWidth: .infinity)
                                  .padding(.top, 40)
                              }
                              ForEach(list.filter { $0.parentID.isEmpty }) { c in
                                  ONEsCommentRow(comment: c, all: list, depth: 0, replyTo: $replyTo)
                              }
                              ForEach([ONEsComment]()) { c in
                                  let name = content.names[c.author] ?? "مستخدم"
                                  HStack(alignment: .top, spacing: 10) {
                                      ONEsAvatar(name: name, uid: c.author, size: 34)
                                      VStack(alignment: .leading, spacing: 3) {
                                          HStack(spacing: 6) {
                                              Text(name)
                                                  .font(.system(size: 13, weight: .bold))
                                                  .foregroundColor(.white)
                                              Text(onesTimeAgo(c.createdAt))
                                                  .font(.system(size: 11))
                                                  .foregroundColor(.white.opacity(0.45))
                                              Spacer()
                                              if session.userID == c.author {
                                                  Button { extras.deleteComment(c) } label: {
                                                      Image(systemName: "trash")
                                                          .font(.system(size: 11))
                                                          .foregroundColor(.red.opacity(0.75))
                                                  }
                                                  .buttonStyle(.plain)
                                              }
                                          }
                                          ONEsRichText(text: c.body, baseSize: 14)
                                      }
                                  }
                              }
                          }
                          .padding(18)
                      }

                      if session.isSignedIn {
                          if let r = replyTo {
                              HStack(spacing: 8) {
                                  Image(systemName: "arrowshape.turn.up.left.fill")
                                      .font(.system(size: 11))
                                      .foregroundColor(Color.storePrimary)
                                  Text("ترد على \(content.names[r.author] ?? (r.authorName.isEmpty ? "مستخدم" : r.authorName))")
                                      .font(.system(size: 12, weight: .semibold))
                                      .foregroundColor(.white.opacity(0.7))
                                  Spacer()
                                  Button { replyTo = nil } label: {
                                      Image(systemName: "xmark.circle.fill")
                                          .font(.system(size: 14))
                                          .foregroundColor(.white.opacity(0.4))
                                  }
                                  .buttonStyle(.plain)
                              }
                              .padding(.horizontal, 16).padding(.top, 8)
                          }
                          HStack(spacing: 10) {
                              ONEsAvatar(name: session.username, uid: session.userID, size: 32)
                              TextField("", text: $draft, prompt: Text("أضف تعليقًا…").foregroundColor(.white.opacity(0.35)), axis: .vertical)
                                  .foregroundColor(.white)
                                  .font(.system(size: 14))
                                  .lineLimit(1...4)
                                  .padding(.horizontal, 12).padding(.vertical, 9)
                                  .background(Capsule().fill(Color.white.opacity(0.08)))
                              Button {
                                  busy = true
                                  extras.addComment(postID: post.id, body: draft,
                                                    parentID: replyTo?.id ?? "") { ok in
                                      busy = false
                                      if ok { draft = ""; replyTo = nil }
                                  }
                              } label: {
                                  Image(systemName: busy ? "hourglass" : "paperplane.fill")
                                      .font(.system(size: 15, weight: .bold))
                                      .foregroundColor(.white)
                                      .padding(10)
                                      .background(Circle().fill(draft.isEmpty ? Color.white.opacity(0.12) : Color.storePrimary))
                              }
                              .buttonStyle(.plain)
                              .disabled(busy || draft.isEmpty)
                          }
                          .padding(14)
                          .background(Color.white.opacity(0.04))
                      } else {
                          Text("سجّل الدخول للتعليق")
                              .font(.system(size: 12))
                              .foregroundColor(.white.opacity(0.5))
                              .padding(14)
                      }
                  }
                  .background(Color.storeBg.ignoresSafeArea())
                  .onAppear { if extras.counts[post.id] == nil { extras.loadComments(for: post.id) } }
              }
          }

          // ================= COMPOSER (with image + broadcast) =================
          struct ONEsComposerSheet: View {
              @ObservedObject private var content = ONEsContent.shared
              @ObservedObject private var session = ONEsSession.shared
              @Environment(\.dismiss) private var dismiss
              @State private var draft = ""
              @State private var kind = "post"
              @State private var busy = false
              @State private var attachedImage: UIImage? = nil
              @State private var showPicker = false
              @State private var attachedVideo: String = ""
              @State private var showVideoPicker = false
              @State private var broadcastOn = true

              private let maxChars = 500

              var body: some View {
                  VStack(spacing: 0) {
                      HStack {
                          Button("إلغاء") { dismiss() }
                              .font(.system(size: 14, weight: .semibold))
                              .foregroundColor(.white.opacity(0.7))
                          Spacer()
                          Text("منشور جديد")
                              .font(.system(size: 15, weight: .black))
                              .foregroundColor(.white)
                          Spacer()
                          Button {
                              busy = true
                              let imgB64 = (attachedImage.flatMap { ONEsImageUtil.toBase64JPEG(ONEsImageUtil.resized($0, maxDim: 1280)) }) ?? ""
                              content.publish(body: draft, kind: kind, imageBase64: imgB64,
                                              videoBase64: attachedVideo) { ok in
                                  busy = false
                                  if ok {
                                      if broadcastOn {
                                          let name = session.username.isEmpty ? "عضو" : session.username
                                          let preview = draft.isEmpty ? "[منشور بصورة]" : String(draft.prefix(80))
                                          content.broadcast(title: "💬  منشور جديد من \(name)",
                                                            body: preview,
                                                            kind: kind == "news" ? "news" : (kind == "offer" ? "offer" : "post"))
                                      }
                                      dismiss()
                                  }
                              }
                          } label: {
                              Text(busy ? "…" : "نشر")
                                  .font(.system(size: 14, weight: .black))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 20).padding(.vertical, 8)
                                  .background(
                                      Capsule().fill(
                                          LinearGradient(colors: [Color.storePrimary, Color.storePrimary.opacity(0.6)],
                                                         startPoint: .leading, endPoint: .trailing)
