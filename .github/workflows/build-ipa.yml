name: AppScope 27 - Safe Installed App Checker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: "AppScope"
  BUNDLE_ID: "com.appscope.safe"
  DEPLOYMENT_TARGET: "18.0"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"

          if [ -z "${XCODE_APP}" ]; then
            echo "No Xcode installation was found."
            exit 1
          fi

          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"

          echo "Selected Xcode:"
          xcodebuild -version
          echo "Swift:"
          swift --version

      - name: Install XcodeGen and zip
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          command -v xcodegen
          command -v zip

      - name: Create project directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppScopeBuild
          mkdir -p AppScopeBuild/AppScope

      - name: Generate Info.plist
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/Info.plist <<'PLIST'
