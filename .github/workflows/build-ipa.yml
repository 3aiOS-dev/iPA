      - name: Generate code - ActivationManager.swift
        run: |
          cat > ActivationManager.swift << 'ACTEOF'
          import SwiftUI
          import Foundation
          import Combine
          import UIKit

          @MainActor
          public final class ActivationManager: ObservableObject {
              public static let shared = MainActor.assumeIsolated { ActivationManager() }

              @Published public private(set) var isActive: Bool = false
              @Published public private(set) var code: String = ""
              @Published public private(set) var expiresAt: Date? = nil
              @Published public private(set) var durationDays: Int = 0
              @Published public private(set) var fullName: String = ""
              @Published public var isWorking: Bool = false
              @Published public var lastError: String = ""

              @Published public private(set) var daysLeft: Int = 0
              @Published public private(set) var expiryText: String = "غير مفعّل"

              public static let codesSiteBase = "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app"
              public static let activationNameLink = "https://t.me/deviosx"

              private let kCode = "activation_code_v1"
              private let kExpires = "activation_expires_v1"
              private let kDays = "activation_days_v1"
              private let kName = "activation_full_name_v1"

              @Published public var udid: String = UserDefaults.standard.string(forKey: "official_udid_v1") ?? "" {
                  didSet {
                      let clean = udid.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
                      UserDefaults.standard.set(clean, forKey: "official_udid_v1")
                  }
              }

              public var deviceID: String {
                  let clean = udid.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
                  if !clean.isEmpty { return clean }
                  if let saved = UserDefaults.standard.string(forKey: "activation_device_id_v1"), !saved.isEmpty {
                      return saved
                  }
                  let generated = UIDevice.current.identifierForVendor?.uuidString ?? UUID().uuidString
                  UserDefaults.standard.set(generated, forKey: "activation_device_id_v1")
                  return generated
              }

              private init() {
                  let d = UserDefaults.standard
                  code = d.string(forKey: kCode) ?? ""
                  durationDays = d.integer(forKey: kDays)
                  fullName = d.string(forKey: kName) ?? ""
                  if let ts = d.object(forKey: kExpires) as? Double, ts > 0 {
                      expiresAt = Date(timeIntervalSince1970: ts)
                  }
                  refreshLocalState()
              }

              private func refreshLocalState() {
                  if let exp = expiresAt, exp > Date(), !code.isEmpty {
                      isActive = true
                  } else {
                      isActive = false
                  }
                  if let exp = expiresAt {
                      let days = max(0, Int(ceil(exp.timeIntervalSinceNow / 86400.0)))
                      daysLeft = days
                      let f = DateFormatter()
                      f.locale = Locale(identifier: "ar")
                      f.dateStyle = .medium
                      expiryText = f.string(from: exp)
                  } else {
                      daysLeft = 0
                      expiryText = "غير مفعّل"
                  }
              }

              private func persist() {
                  let d = UserDefaults.standard
                  d.set(code, forKey: kCode)
                  d.set(durationDays, forKey: kDays)
                  d.set(expiresAt?.timeIntervalSince1970 ?? 0, forKey: kExpires)
                  d.set(fullName, forKey: kName)
              }

              public static func parseDate(_ raw: String) -> Date? {
                  let iso = ISO8601DateFormatter()
                  iso.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                  if let d = iso.date(from: raw) { return d }
                  if let d = ISO8601DateFormatter().date(from: raw) { return d }
                  let f = DateFormatter()
                  f.locale = Locale(identifier: "en_US_POSIX")
                  f.timeZone = TimeZone(secondsFromGMT: 0)
                  for fmt in ["yyyy-MM-dd'T'HH:mm:ssZ", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"] {
                      f.dateFormat = fmt
                      if let d = f.date(from: raw) {
                          return fmt == "yyyy-MM-dd" ? d.addingTimeInterval(86_399) : d
                      }
                  }
                  return nil
              }

              private func apply(_ json: [String: Any], fallbackCode: String? = nil) -> Bool {
                  guard (json["ok"] as? Bool) == true else { return false }
                  var jsonData = json
                  if let acc = json["account"] as? [String: Any] {
                      for (k, v) in acc { jsonData[k] = v }
                  }
                  if let active = jsonData["active"] as? Bool, active == false { return false }
                  if let c = jsonData["code"] as? String, !c.isEmpty {
                      code = c
                  } else if let fb = fallbackCode, !fb.isEmpty {
                      code = fb
                  }
                  if let u = jsonData["udid"] as? String, !u.isEmpty {
                      udid = u
                  }
                  if let days = jsonData["duration_days"] as? Int { durationDays = days }
                  if let name = jsonData["full_name"] as? String, !name.isEmpty {
                      fullName = name
                  }
                  if let raw = jsonData["expires_at"] as? String, let d = ActivationManager.parseDate(raw) {
                      expiresAt = d
                      durationDays = max(durationDays, max(0, Int(ceil(d.timeIntervalSinceNow / 86_400.0))))
                  }
                  persist()
                  refreshLocalState()
                  return isActive
              }

              public func activate(code newCode: String, completion: ((Bool) -> Void)? = nil) {
                  let clean = newCode.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
                  guard clean.count >= 6 else {
                      lastError = LS("أدخل كود اشتراك صحيح")
                      completion?(false)
                      return
                  }
                  guard !udid.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                      lastError = LS("ألصق UDID الرسمي للجهاز أولًا")
                      completion?(false)
                      return
                  }
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/activate") else {
                      lastError = "رابط الموقع غير صحيح"; completion?(false); return
                  }
                  isWorking = true
                  lastError = ""
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "code": clean,
                      "udid": deviceID,
                      "device_id": deviceID,
                      "device_model": UIDevice.current.model
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, error in
                      Task { @MainActor in
                          self.isWorking = false
                          guard let data = data,
                                let json = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                              self.lastError = error?.localizedDescription ?? "تعذر الاتصال بالخادم"
                              completion?(false); return
                          }
                          if self.apply(json, fallbackCode: clean) {
                              HapticManager.shared.success()
                              completion?(true)
                          } else {
                              self.lastError = (json["message"] as? String) ?? LS("الاسم غير صالح")
                              completion?(false)
                          }
                      }
                  }.resume()
              }

              public func verify(completion: ((Bool) -> Void)? = nil) {
                  guard !code.isEmpty else { completion?(false); return }
                  var comps = URLComponents(string: ActivationManager.codesSiteBase + "/api/public/store/verify")
                  comps?.queryItems = [
                      URLQueryItem(name: "code", value: code),
                      URLQueryItem(name: "udid", value: deviceID),
                      URLQueryItem(name: "device_id", value: deviceID)
                  ]
                  guard let url = comps?.url else { completion?(false); return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      Task { @MainActor in
                          guard let data = data,
                                let json = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                              self.refreshLocalState()
                              completion?(self.isActive); return
                          }
                          if self.apply(json) {
                              completion?(true)
                          } else {
                              self.lastError = (json["message"] as? String) ?? "انتهى الاشتراك"
                              self.deactivate(keepMessage: true)
                              completion?(false)
                          }
                      }
                  }.resume()
              }

              public func deactivate(keepMessage: Bool = false) {
                  code = ""
                  expiresAt = nil
                  durationDays = 0
                  fullName = ""
                  isActive = false
                  if !keepMessage { lastError = "" }
                  persist()
                  refreshLocalState()
              }

              public func fetchStatus(completion: ((Bool) -> Void)? = nil) {
                  verify(completion: completion)
              }
          }

