          // ================= APPS TAB (no Telegram banner, install button instead of heart) =================
          struct AppsListView: View {
              @ObservedObject var feed: StoreFeed
              @ObservedObject private var reposStore = RepositoriesStore.shared
              var onMenu: (() -> Void)? = nil
              @State private var searchText: String = ""
              @State private var selectedCategory: String? = nil
              @State private var visiblePage: Int = 0
              @State private var showNotifications = false

              private static let hiddenCategories: [String] = ["movies", "movie", "films", "film", "أفلام", "افلام"]

              private static func isHidden(_ c: String?) -> Bool {
                  let v = (c ?? "").trimmingCharacters(in: .whitespaces).lowercased()
                  return hiddenCategories.contains(v)
              }

              private var filtered: [StoreAPIApp] {
                  let base = feed.apps.filter { !AppsListView.isHidden($0.category) }
                  let byCat: [StoreAPIApp]
                  if let cat = selectedCategory {
                      byCat = base.filter { ($0.category ?? "التطبيقات").lowercased() == cat.lowercased() }
                  } else {
                      byCat = base
                  }
                  let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return byCat }
                  return byCat.filter {
                      $0.name.lowercased().contains(q) || ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }

              private var filteredPages: Int {
                  max(1, Int(ceil(Double(filtered.count) / Double(AppConstants.feedPageSize))))
              }

              private var visibleItems: [StoreAPIApp] {
                  let start = visiblePage * AppConstants.feedPageSize
                  let end = min(start + AppConstants.feedPageSize, filtered.count)
                  guard start < filtered.count else { return [] }
                  return Array(filtered[start..<end])
              }

              private var categories: [String] {
                  let set = Set(feed.apps.compactMap { $0.category?.capitalized }
                                  .filter { !AppsListView.isHidden($0) })
                  return Array(set).sorted()
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          ONEsTopBar()

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 14) {
                                  HStack(spacing: 8) {
                                      Image(systemName: "magnifyingglass")
                                          .foregroundColor(Color.storeSub)
                                      TextField("ابحث في \(feed.totalAvailable) تطبيق...", text: $searchText)
                                          .font(.system(size: 14))
                                          .foregroundColor(Color.storeText)
                                          .background(Color.clear)
                                          .tint(Color.storePrimary)
                                      if !searchText.isEmpty {
                                          Button { searchText = "" } label: {
                                              Image(systemName: "xmark.circle.fill")
                                                  .foregroundColor(Color.storeSub)
                                          }
                                      }
                                  }
                                  .padding(.horizontal, 14)
                                  .frame(height: 46)
                                  .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                                  .overlay(RoundedRectangle(cornerRadius: 16).stroke(Color.storeDivider, lineWidth: 1))
                                  .padding(.horizontal, 18)

                                  FeaturedBannerCard(apps: filtered)

                                  // Telegram banner removed from Apps tab

                                  if !categories.isEmpty {
                                      ScrollView(.horizontal, showsIndicators: false) {
                                          HStack(spacing: 9) {
                                              pill(label: "الكل", value: nil, color: Color.storeCardAlt)
                                              ForEach(Array(categories.enumerated()), id: \.element) { i, c in
                                                  pill(label: c, value: c, color: colorForCategory(c))
                                              }
                                          }
                                          .padding(.horizontal, 18)
                                          .padding(.vertical, 4)
                                      }
                                      .onChange(of: selectedCategory) { _ in visiblePage = 0 }
                                  }

                                  HStack {
                                      Text("صفحة \(visiblePage + 1) / \(filteredPages)")
                                          .font(.system(size: 11, weight: .heavy))
                                          .foregroundColor(Color.storePrimary)
                                      Spacer()
                                      Text("يوجد \(feed.totalAvailable) تطبيق في الصفحة")
                                          .font(.system(size: 11, weight: .semibold))
                                          .foregroundColor(Color.storeSub)
                                  }
                                  .padding(.horizontal, 18)

                                  if feed.apps.isEmpty && feed.isLoading {
                                      LoadingList()
                                  } else if filtered.isEmpty {
                                      EmptyState(message: searchText.isEmpty ? "لا توجد تطبيقات في هذا التصنيف." : "لا توجد نتائج تطابق «\(searchText)».")
                                  } else {
                                      LazyVStack(spacing: 10) {
                                          ForEach(visibleItems) { app in
                                              NavigationLink(value: app) {
                                                  AppListRow(app: app, isNew: feed.isRecent(app), showInstall: true)
                                              }
                                              .buttonStyle(.plain)
                                              .onAppear { handleAppear(app: app) }
                                          }
                                      }
                                      .padding(.horizontal, 18)
                                      .padding(.bottom, 24)
                                  }
                              }
                              .padding(.top, 4)
                          }
                          .refreshable { await feed.refresh() }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                      .navigationDestination(for: StoreAPIApp.self) { app in
                          AppDetailView(app: app, feed: feed)
                      }
                  }
                  .sheet(isPresented: $showNotifications) { NotificationCenterView(isPresented: $showNotifications) }
              }

              private func pill(label: String, value: String?, color: Color) -> some View {
                  let active = (value == nil && selectedCategory == nil) || (value != nil && selectedCategory == value)
                  return Button {
                      HapticManager.shared.selection()
                      withAnimation(.spring(response: 0.35, dampingFraction: 0.8)) { selectedCategory = value }
                  } label: {
                      HStack(spacing: 6) {
                          Text(label)
                              .font(.system(size: 12.5, weight: .heavy))
                              .foregroundColor(.white)
                          Image(systemName: "square.grid.2x2.fill")
                              .font(.system(size: 10, weight: .bold))
                              .foregroundColor(.white.opacity(0.9))
                      }
                      .padding(.horizontal, 15)
                      .padding(.vertical, 9)
                      .background(Capsule().fill(active ? color : Color.storeCardAlt))
                      .overlay(Capsule().stroke(active ? Color.white.opacity(0.25) : Color.storeDivider, lineWidth: 1))
                      .shadow(color: active ? color.opacity(0.45) : .clear, radius: 10, y: 5)
                  }
                  .buttonStyle(.plain)
              }

              private func handleAppear(app: StoreAPIApp) {
                  let threshold = max(0, visibleItems.count - 20)
                  if let idx = visibleItems.firstIndex(of: app), idx >= threshold {
                      if visiblePage + 1 < filteredPages {
                          visiblePage += 1
                      }
                  }
              }
          }

