                                      .foregroundColor(.white.opacity(0.6))
                                  TextField("", text: $bio,
                                            prompt: Text("اكتب شيئًا عن نفسك…").foregroundColor(.white.opacity(0.35)),
                                            axis: .vertical)
                                      .foregroundColor(.white)
