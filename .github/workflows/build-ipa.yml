          // ================= PROFILE EDITOR =================
          struct ONEsProfileEditorSheet: View {
              @ObservedObject private var content = ONEsContent.shared
              @ObservedObject private var session = ONEsSession.shared
              @Environment(\.dismiss) private var dismiss
              @State private var picked: UIImage? = nil
              @State private var showPicker = false
              @State private var bio: String = ""
              @State private var displayName: String = ""
              @State private var userName: String = ""
              @State private var busy = false
              @State private var savedOK = false

              var body: some View {
                  VStack(spacing: 0) {
                      HStack {
                          Button("إغلاق") { dismiss() }
                              .font(.system(size: 14, weight: .semibold))
                              .foregroundColor(.white.opacity(0.7))
                          Spacer()
                          Text("تعديل الملف الشخصي")
                              .font(.system(size: 15, weight: .black))
                              .foregroundColor(.white)
                          Spacer()
                          Button {
                              busy = true
                              let group = DispatchGroup()
                              var allOK = true
                              if let img = picked {
                                  let b64 = ONEsImageUtil.toBase64JPEG(ONEsImageUtil.avatarResized(img, maxDim: 320))
                                  group.enter()
                                  content.setMyAvatar(base64: b64) { ok in
                                      if !ok { allOK = false }
                                      group.leave()
                                  }
                              }
                              group.enter()
                              content.setMyProfile(displayName: displayName, username: userName, bio: bio) { ok in
                                  if !ok { allOK = false }
                                  group.leave()
                              }
                              group.notify(queue: .main) {
                                  busy = false
                                  if allOK { savedOK = true; DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) { dismiss() } }
                              }
                          } label: {
                              Text(busy ? "…" : "حفظ")
                                  .font(.system(size: 14, weight: .black))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 18).padding(.vertical, 8)
