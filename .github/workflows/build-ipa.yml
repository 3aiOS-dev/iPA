          import UIKit

          final class SettingsViewController: UIViewController, UITableViewDataSource, UITableViewDelegate {

              private enum Section: Int, CaseIterable {
                  case preferences, general, about

                  var title: String {
                      switch self {
                      case .preferences: return "التفضيلات"
                      case .general: return "عام"
                      case .about: return "حول التطبيق"
                      }
                  }
              }

              private enum PreferenceRow: Int, CaseIterable {
                  case darkMode, notifications

                  var title: String { self == .darkMode ? "الوضع الداكن" : "الإشعارات" }
                  var icon: String { self == .darkMode ? "moon.fill" : "bell.fill" }
              }

              private enum GeneralRow: Int, CaseIterable {
                  case language, rateApp, shareApp, clearCache

                  var title: String {
                      switch self {
                      case .language: return "اللغة"
                      case .rateApp: return "قيّم التطبيق"
                      case .shareApp: return "شارك التطبيق"
                      case .clearCache: return "مسح الذاكرة المؤقتة"
                      }
                  }

                  var icon: String {
                      switch self {
                      case .language: return "globe"
                      case .rateApp: return "star.fill"
                      case .shareApp: return "square.and.arrow.up"
                      case .clearCache: return "arrow.triangle.2.circlepath"
                      }
                  }
              }

              private enum AboutRow: Int, CaseIterable {
                  case privacy, clearFavorites, version, about

                  var title: String {
                      switch self {
                      case .privacy: return "سياسة الخصوصية"
                      case .clearFavorites: return "مسح المفضلة"
                      case .version: return "رقم الإصدار"
                      case .about: return "عن التطبيق"
                      }
                  }

                  var icon: String {
                      switch self {
                      case .privacy: return "hand.raised.fill"
                      case .clearFavorites: return "trash.fill"
                      case .version: return "number.circle.fill"
                      case .about: return "info.circle.fill"
                      }
                  }
              }

              private var tableView: UITableView!

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "الإعدادات"
                  view.backgroundColor = .souqBackground
                  navigationController?.navigationBar.prefersLargeTitles = true
                  setupTableView()
              }

              override func viewWillAppear(_ animated: Bool) {
                  super.viewWillAppear(animated)
                  navigationController?.setNavigationBarHidden(false, animated: animated)
                  tableView.reloadData()
              }

              private func setupTableView() {
                  tableView = UITableView(frame: .zero, style: .insetGrouped)
                  tableView.backgroundColor = .clear
                  tableView.dataSource = self
                  tableView.delegate = self
                  tableView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(tableView)
                  NSLayoutConstraint.activate([
                      tableView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      tableView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      tableView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      tableView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                  ])
              }

              func numberOfSections(in tableView: UITableView) -> Int {
                  Section.allCases.count
              }

              func tableView(_ tableView: UITableView, titleForHeaderInSection section: Int) -> String? {
                  Section.allCases[section].title
              }

              func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                  switch Section.allCases[section] {
                  case .preferences: return PreferenceRow.allCases.count
                  case .general: return GeneralRow.allCases.count
                  case .about: return AboutRow.allCases.count
                  }
              }

              func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                  let section = Section.allCases[indexPath.section]
                  let cell = UITableViewCell(style: .value1, reuseIdentifier: nil)
                  cell.backgroundColor = .souqCard
                  cell.textLabel?.textColor = .souqPrimaryText
                  cell.accessoryView = nil
                  cell.accessoryType = .none
                  cell.selectionStyle = .default

                  switch section {
                  case .preferences:
                      let row = PreferenceRow.allCases[indexPath.row]
                      cell.textLabel?.text = row.title
                      cell.imageView?.image = UIImage(systemName: row.icon)
                      cell.imageView?.tintColor = .souqPurple
                      let toggle = UISwitch()
                      toggle.onTintColor = .souqPurple
                      toggle.isOn = row == .darkMode ? ThemeManager.isDarkMode : UserDefaults.standard.bool(forKey: "souq.notifications")
                      toggle.tag = row == .darkMode ? 0 : 1
                      toggle.addTarget(self, action: #selector(switchToggled(_:)), for: .valueChanged)
                      cell.accessoryView = toggle
                      cell.selectionStyle = .none

                  case .general:
                      let row = GeneralRow.allCases[indexPath.row]
                      cell.textLabel?.text = row.title
                      cell.imageView?.image = UIImage(systemName: row.icon)
                      cell.imageView?.tintColor = .souqPurple
                      if row == .language {
                          cell.detailTextLabel?.text = "العربية"
                          cell.detailTextLabel?.textColor = .souqSecondaryText
                          cell.selectionStyle = .none
                      } else {
                          cell.accessoryType = .disclosureIndicator
                      }

                  case .about:
                      let row = AboutRow.allCases[indexPath.row]
                      cell.textLabel?.text = row.title
                      cell.imageView?.image = UIImage(systemName: row.icon)
                      cell.imageView?.tintColor = .souqPurple
                      if row == .version {
                          cell.detailTextLabel?.text = "1.0.0"
                          cell.detailTextLabel?.textColor = .souqSecondaryText
                          cell.selectionStyle = .none
                      } else if row == .clearFavorites {
                          cell.textLabel?.textColor = .souqRed
                      } else {
                          cell.accessoryType = .disclosureIndicator
                      }
                  }
                  return cell
              }

              @objc private func switchToggled(_ sender: UISwitch) {
                  if sender.tag == 0 {
                      ThemeManager.isDarkMode = sender.isOn
                      ThemeManager.apply(to: view.window)
                  } else {
                      UserDefaults.standard.set(sender.isOn, forKey: "souq.notifications")
                  }
              }

              func tableView(_ tableView: UITableView, didSelectRowAt indexPath: IndexPath) {
                  tableView.deselectRow(at: indexPath, animated: true)
                  let section = Section.allCases[indexPath.section]

                  switch section {
                  case .preferences:
                      break

                  case .general:
                      switch GeneralRow.allCases[indexPath.row] {
                      case .language:
                          break
                      case .rateApp:
                          let alert = UIAlertController(
                              title: "قيّم التطبيق",
                              message: "شكرًا لدعمك! هذا نموذج عرض تجريبي فلا يوجد رابط تقييم حقيقي في متجر التطبيقات حاليًا.",
                              preferredStyle: .alert
                          )
                          alert.addAction(UIAlertAction(title: "حسنًا", style: .default))
                          present(alert, animated: true)
                      case .shareApp:
                          let text = "جرّب تطبيق سوق - متجر تطبيقات تجريبي!"
                          let activity = UIActivityViewController(activityItems: [text], applicationActivities: nil)
                          if let popover = activity.popoverPresentationController {
                              popover.sourceView = tableView
                              popover.sourceRect = tableView.rectForRow(at: indexPath)
                          }
                          present(activity, animated: true)
                      case .clearCache:
                          let alert = UIAlertController(
                              title: "تم بنجاح",
                              message: "تم مسح الذاكرة المؤقتة بنجاح.",
                              preferredStyle: .alert
                          )
                          alert.addAction(UIAlertAction(title: "حسنًا", style: .default))
                          present(alert, animated: true)
                      }

                  case .about:
                      switch AboutRow.allCases[indexPath.row] {
                      case .privacy:
                          navigationController?.pushViewController(PrivacyPolicyViewController(), animated: true)
                      case .clearFavorites:
                          let confirm = UIAlertController(
                              title: "مسح المفضلة",
                              message: "هل تريد إزالة جميع التطبيقات من قائمة المفضلة؟",
                              preferredStyle: .alert
                          )
                          confirm.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                          confirm.addAction(UIAlertAction(title: "مسح", style: .destructive) { _ in
                              FavoritesManager.shared.clearAll()
                          })
                          present(confirm, animated: true)
                      case .version:
                          break
                      case .about:
                          let alert = UIAlertController(
                              title: "سوق",
                              message: "تطبيق عرض تجريبي (Demo) بواجهة متجر تطبيقات. جميع البيانات والتطبيقات المعروضة وهمية لأغراض العرض فقط.",
                              preferredStyle: .alert
                          )
                          alert.addAction(UIAlertAction(title: "حسنًا", style: .default))
                          present(alert, animated: true)
                      }
                  }
              }
          }
          GEOF

