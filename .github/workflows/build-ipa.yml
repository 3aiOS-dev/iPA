                  cats += found.isEmpty ? ["ترفيه", "أدوات", "ألعاب", "اجتماعي", "تعليم"] : Array(found)
                  return cats
              }

              enum AnySource: Identifiable {
                  case store(AppItem)
                  case local(LocalIPA)
