          import UIKit

          // MARK: - عارض قيم Info.plist (اطّلاع فقط)

          final class PlistInspectorViewController: UITableViewController {
              let fileName: String
              let rows: [(String, String)]

              let bgDark = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
              let cardDark = UIColor(red: 28/255, green: 28/255, blue: 44/255, alpha: 1)
              let accentTeal = UIColor(red: 6/255, green: 182/255, blue: 212/255, alpha: 1)

              init(fileName: String, values: [String: Any]) {
                  self.fileName = fileName
                  self.rows = values
                      .map { (String(describing: $0.key), String(describing: $0.value)) }
                      .sorted { $0.0.localizedCaseInsensitiveCompare($1.0) == .orderedAscending }
                  super.init(style: .plain)
              }

              required init?(coder: NSCoder) {
                  self.fileName = ""
                  self.rows = []
                  super.init(coder: coder)
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "🧩 \(fileName)"
                  view.backgroundColor = bgDark
                  tableView.backgroundColor = bgDark
                  tableView.separatorColor = UIColor.white.withAlphaComponent(0.08)
                  if #available(iOS 13.0, *) { overrideUserInterfaceStyle = .dark }
              }

              override func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int { rows.count }

              override func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                  let cell = UITableViewCell(style: .subtitle, reuseIdentifier: "plistCell")
                  let (key, value) = rows[indexPath.row]
                  cell.backgroundColor = cardDark
                  cell.textLabel?.text = key
                  cell.textLabel?.textColor = accentTeal
                  cell.textLabel?.font = .systemFont(ofSize: 13, weight: .semibold)
                  cell.detailTextLabel?.text = value
                  cell.detailTextLabel?.textColor = .white
                  cell.detailTextLabel?.numberOfLines = 3
                  cell.selectionStyle = .none
                  return cell
              }
          }

          // MARK: - عارض نصوص بسيط

          final class TextPreviewViewController: UIViewController {
              let fileName: String
              let text: String
              let bgDark = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)

              init(fileName: String, text: String) {
                  self.fileName = fileName
                  self.text = text
                  super.init(nibName: nil, bundle: nil)
              }

              required init?(coder: NSCoder) {
                  self.fileName = ""
                  self.text = ""
                  super.init(coder: coder)
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = fileName
                  view.backgroundColor = bgDark
                  if #available(iOS 13.0, *) { overrideUserInterfaceStyle = .dark }

                  let textView = UITextView(frame: view.bounds)
                  textView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  textView.backgroundColor = bgDark
                  textView.textColor = .white
                  textView.font = .monospacedSystemFont(ofSize: 13, weight: .regular)
                  textView.text = text
                  textView.isEditable = false
                  textView.textContainerInset = UIEdgeInsets(top: 16, left: 12, bottom: 16, right: 12)
                  view.addSubview(textView)
              }
          }

