                                  ProfileField(label: "اسم المستخدم", text: $username, icon: "person.fill")
                                  ProfileField(label: "رقم الجوال", text: $phoneNumber, icon: "phone.fill", keyboard: .phonePad)
                              }
                              .padding(.horizontal, 20)

                              if let err = validationError {
                                  HStack(spacing: 6) {
                                      Image(systemName: "exclamationmark.triangle.fill")
                                          .foregroundColor(.xcodeRed)
                                          .font(.system(size: 12))
                                      Text(err).font(.system(size: 12)).foregroundColor(.xcodeRed)
                                      Spacer()
                                  }
                                  .padding(.horizontal, 24)
