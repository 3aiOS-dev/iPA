                    }

                    struct CrownBadge: View {
                        var body: some View {
                            HStack(spacing: 3) {
                                Image(systemName: "crown.fill").font(.system(size: 9)).foregroundColor(.vipGold)
                                Text("VIP").font(.system(size: 10, weight: .black)).foregroundColor(.vipGold)
                            }
                            .padding(.horizontal, 8).padding(.vertical, 3)
                            .background(Capsule().fill(Color.vipGold.opacity(0.15)))
                        }
