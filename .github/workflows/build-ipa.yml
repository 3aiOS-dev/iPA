      - name: Generate code - AuthManager.swift
        run: |
          cat > AuthManager.swift << 'VIPEOF'
          import SwiftUI
          import Foundation
          import Combine

          @MainActor
          public final class AuthManager: ObservableObject {
              public static let shared = MainActor.assumeIsolated { AuthManager() }

              @Published var currentUser: AppUser?
              @Published var isAuthenticated: Bool = false
              @Published var isLoading: Bool = false
              @Published var errorMessage: String?

              private let userDefaultsKey = AppConstants.userDefaultsKey

              public init() { loadUser() }

              /// فحص المدخلات قبل التسجيل (يُستدعى قبل إرسال رمز التحقق)
              func validateSignUp(phoneNumber: String, username: String, password: String, confirmPassword: String) -> Bool {
                  errorMessage = nil
                  let trimmedPhone = phoneNumber.trimmingCharacters(in: .whitespaces)
                  if trimmedPhone.isEmpty { errorMessage = "رقم الجوال مطلوب"; return false }
                  if !trimmedPhone.hasPrefix("+") {
                      errorMessage = "يجب أن يشمل رقم الجوال رمز الدولة (مثال: +971501234567)"; return false
                  }
                  let digitsOnly = trimmedPhone.dropFirst().filter { $0.isNumber }
                  if digitsOnly.count < 7 {
                      errorMessage = "أدخل رقم جوال صحيحًا (7 أرقام على الأقل بعد رمز الدولة)"; return false
                  }
                  if username.trimmingCharacters(in: .whitespaces).isEmpty { errorMessage = "اسم المستخدم مطلوب"; return false }
                  if username.count < 3 { errorMessage = "اسم المستخدم يجب أن يكون 3 أحرف على الأقل"; return false }
                  if password.count < 6 { errorMessage = "كلمة المرور يجب أن تكون 6 أحرف على الأقل"; return false }
                  if password != confirmPassword { errorMessage = "كلمتا المرور غير متطابقتين"; return false }
                  let existingUsers = loadAllUsers()
                  if existingUsers.contains(where: { $0.phoneNumber == trimmedPhone }) {
                      errorMessage = "رقم الجوال مسجل بالفعل"; return false
                  }
                  if existingUsers.contains(where: { $0.username.lowercased() == username.lowercased() }) {
                      errorMessage = "اسم المستخدم مستخدم بالفعل"; return false
                  }
                  return true
              }

              func signUp(phoneNumber: String, username: String, password: String, confirmPassword: String) -> Bool {
                  isLoading = true
                  errorMessage = nil

                  let trimmedPhone = phoneNumber.trimmingCharacters(in: .whitespaces)
                  if trimmedPhone.isEmpty {
                      errorMessage = "رقم الجوال مطلوب"
                      isLoading = false
                      return false
                  }
                  if !trimmedPhone.hasPrefix("+") {
                      errorMessage = "يجب أن يشمل رقم الجوال رمز الدولة (مثال: +971501234567)"
                      isLoading = false
                      return false
                  }
                  let digitsOnly = trimmedPhone.dropFirst().filter { $0.isNumber }
                  if digitsOnly.count < 7 {
                      errorMessage = "أدخل رقم جوال صحيحًا (7 أرقام على الأقل بعد رمز الدولة)"
                      isLoading = false
                      return false
                  }

                  if username.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "اسم المستخدم مطلوب"
                      isLoading = false
                      return false
                  }
                  if username.count < 3 {
                      errorMessage = "اسم المستخدم يجب أن يكون 3 أحرف على الأقل"
                      isLoading = false
                      return false
                  }
                  if password.count < 6 {
                      errorMessage = "كلمة المرور يجب أن تكون 6 أحرف على الأقل"
                      isLoading = false
                      return false
                  }
                  if password != confirmPassword {
                      errorMessage = "كلمتا المرور غير متطابقتين"
                      isLoading = false
                      return false
                  }

                  let existingUsers = loadAllUsers()
                  if existingUsers.contains(where: { $0.phoneNumber == trimmedPhone }) {
                      errorMessage = "رقم الجوال مسجل بالفعل"
                      isLoading = false
                      return false
                  }
                  if existingUsers.contains(where: { $0.username.lowercased() == username.lowercased() }) {
                      errorMessage = "اسم المستخدم مستخدم بالفعل"
                      isLoading = false
                      return false
                  }

                  let newUser = AppUser(phoneNumber: trimmedPhone, username: username, password: password)
                  var users = loadAllUsers()
                  users.append(newUser)
                  saveAllUsers(users)

                  // إنشاء حساب حقيقي على السيرفر (يظهر في «حسابات المتجر» بالموقع)
                  BackendAccount.shared.signUp(phone: trimmedPhone, username: username, password: password)

                  currentUser = newUser
                  isAuthenticated = true
                  isLoading = false
                  HapticManager.shared.success()
                  UserDefaults.standard.set(newUser.id.uuidString, forKey: "currentUserID")
                  UserDefaults.standard.set(false, forKey: AppConstants.hasSeenOnboardingKey)
                  return true
              }

              func login(phoneNumber: String, password: String) -> Bool {
                  isLoading = true
                  errorMessage = nil

                  let trimmedPhone = phoneNumber.trimmingCharacters(in: .whitespaces)
                  if trimmedPhone.isEmpty {
                      errorMessage = "رقم الجوال مطلوب"
                      isLoading = false
                      return false
                  }
                  if password.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "كلمة المرور مطلوبة"
                      isLoading = false
                      return false
                  }

                  let users = loadAllUsers()
                  guard let user = users.first(where: { $0.phoneNumber == trimmedPhone && $0.password == password }) else {
                      errorMessage = "رقم الجوال أو كلمة المرور غير صحيحة"
                      isLoading = false
                      return false
                  }

                  // تسجيل الدخول للسيرفر الحقيقي ومزامنة الإعجابات والتعليقات
                  BackendAccount.shared.signIn(phone: trimmedPhone, password: password) { ok in
                      if ok { BackendAccount.shared.saveProfile(username: user.username) }
                  }

                  currentUser = user
                  isAuthenticated = true
                  isLoading = false
                  HapticManager.shared.success()
                  UserDefaults.standard.set(user.id.uuidString, forKey: "currentUserID")
                  UserDefaults.standard.set(false, forKey: AppConstants.hasSeenOnboardingKey)
                  return true
              }

              func logout() {
                  BackendAccount.shared.signOut()
                  currentUser = nil
                  isAuthenticated = false
                  UserDefaults.standard.removeObject(forKey: "currentUserID")
              }

              private func loadUser() {
                  guard let savedID = UserDefaults.standard.string(forKey: "currentUserID"),
                        let id = UUID(uuidString: savedID) else { return }
                  let users = loadAllUsers()
                  if let user = users.first(where: { $0.id == id }) {
                      currentUser = user
                      isAuthenticated = true
                  }
              }

              private func loadAllUsers() -> [AppUser] {
                  guard let data = UserDefaults.standard.data(forKey: userDefaultsKey),
                        let users = try? JSONDecoder().decode([AppUser].self, from: data) else { return [] }
                  return users
              }

              private func saveAllUsers(_ users: [AppUser]) {
                  if let data = try? JSONEncoder().encode(users) {
                      UserDefaults.standard.set(data, forKey: userDefaultsKey)
                  }
              }
          }
          VIPEOF

