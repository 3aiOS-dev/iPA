      - name: Generate code - BackendAccount.swift (real accounts + engagement sync)
        run: |
          cat > BackendAccount.swift << 'BACKEOF'
          import Foundation
          import SwiftUI

          /// عميل مرتبط بالحسابات الحقيقية (باكند لوحة التحكم).
          /// - إنشاء حساب / إنشاء الحساب وتسجيل الدخول يتم على السيرفر الحقيقي
          /// - تُرسل الإعجابات والتعليقات إلى السيرفر وتُشارك مع الموقع
          final class BackendAccount: ObservableObject {
              static let shared = BackendAccount()

              static let siteBase = "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app"
              static let supabaseURL = "https://xpsqdzirevankrzrnxko.supabase.co"
              static let anonKey = "sb_publishable_-UfDzXdzukrKLoh6kp8Gsg_ecMMt56Z"

              @Published private(set) var isSignedIn: Bool = false
              @Published private(set) var remoteUserID: String = ""
              @Published private(set) var displayName: String = ""
              @Published private(set) var lastError: String = ""

              private let kToken = "backend_access_token_v1"
              private let kUserID = "backend_user_id_v1"
              private let kName = "backend_display_name_v1"

              private(set) var accessToken: String = "" {
                  didSet { UserDefaults.standard.set(accessToken, forKey: kToken) }
              }

              private init() {
                  let d = UserDefaults.standard
                  accessToken = d.string(forKey: kToken) ?? ""
                  remoteUserID = d.string(forKey: kUserID) ?? ""
                  displayName = d.string(forKey: kName) ?? ""
                  isSignedIn = !accessToken.isEmpty
              }

              // رقم تحويل رقم الجوال إلى بريد ثابت (إنشاء حساب حقيقي دون مزوّد رسائل)
              static func email(for phone: String) -> String {
                  let digits = phone.filter { $0.isNumber }
                  return "u\(digits)@21s-store.app"
              }

              private func authRequest(_ path: String, body: [String: Any]) -> URLRequest? {
                  guard let url = URL(string: BackendAccount.supabaseURL + path) else { return nil }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.timeoutInterval = 20
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(BackendAccount.anonKey, forHTTPHeaderField: "apikey")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  return req
              }

              private func handleSession(_ data: Data) -> Bool {
                  guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return false }
                  if let msg = json["msg"] as? String ?? json["error_description"] as? String {
                      DispatchQueue.main.async { self.lastError = msg }
                  }
                  guard let token = json["access_token"] as? String else { return false }
                  let user = json["user"] as? [String: Any]
                  let uid = (user?["id"] as? String) ?? ""
                  DispatchQueue.main.async {
                      self.accessToken = token
                      self.remoteUserID = uid
                      self.isSignedIn = true
                      UserDefaults.standard.set(uid, forKey: self.kUserID)
                  }
                  return true
              }

              /// إنشاء الحساب على السيرفر الحقيقي ونشر الملف الشخصي في الموقع
              func signUp(phone: String, username: String, password: String, completion: ((Bool) -> Void)? = nil) {
                  let mail = BackendAccount.email(for: phone)
                  guard let req = authRequest("/auth/v1/signup",
                                              body: ["email": mail,
                                                     "password": password,
                                                     "data": ["username": username]]) else {
                      completion?(false); return
                  }
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, _ in
                      guard let self = self else { return }
                      if let data = data, self.handleSession(data) {
                          self.saveProfile(username: username)
                          completion?(true)
                      } else {
                          // إذا كان مسجلًا مسبقًا فحاول تسجيل الدخول
                          self.signIn(phone: phone, password: password) { ok in
                              if ok { self.saveProfile(username: username) }
                              completion?(ok)
                          }
                      }
                  }.resume()
              }

              func signIn(phone: String, password: String, completion: ((Bool) -> Void)? = nil) {
                  let mail = BackendAccount.email(for: phone)
                  guard let req = authRequest("/auth/v1/token?grant_type=password",
                                              body: ["email": mail, "password": password]) else {
                      completion?(false); return
                  }
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, _ in
                      guard let self = self else { completion?(false); return }
                      let ok = data.map { self.handleSession($0) } ?? false
                      completion?(ok)
                  }.resume()
              }

              func signOut() {
                  accessToken = ""
                  DispatchQueue.main.async {
                      self.isSignedIn = false
                      self.remoteUserID = ""
                  }
              }

              func saveProfile(username: String, avatarURL: String = "", bio: String = "") {
                  DispatchQueue.main.async {
                      self.displayName = username
                      UserDefaults.standard.set(username, forKey: self.kName)
                  }
                  var body: [String: Any] = ["action": "profile",
                                             "username": username,
                                             "displayName": username,
                                             "bio": bio]
                  if !avatarURL.isEmpty { body["avatarUrl"] = avatarURL }
                  engage(body)
              }

              /// إرسال الإعجابات والتعليقات إلى السيرفر (تظهر في الموقع أيضًا)
              func like(reelID: String, liked: Bool) {
                  engage(["action": liked ? "like" : "unlike", "reelId": reelID])
              }

              func comment(reelID: String, text: String) {
                  engage(["action": "comment", "reelId": reelID, "text": text])
              }

              private func engage(_ body: [String: Any]) {
                  guard !accessToken.isEmpty,
                        let url = URL(string: BackendAccount.siteBase + "/api/public/engage") else { return }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.timeoutInterval = 20
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue("Bearer \(accessToken)", forHTTPHeaderField: "Authorization")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  URLSession.shared.dataTask(with: req).resume()
              }
          }

          // ================= إشعارات من لوحة التحكم =================
          struct RemoteNotification: Identifiable, Codable, Hashable {
              var id: String
              var title: String
              var body: String
              var imageURL: String
              var linkURL: String
              var kind: String
          }

          final class RemoteNotificationStore: ObservableObject {
              static let shared = RemoteNotificationStore()
              @Published var items: [RemoteNotification] = []
              @Published var unread: Int = 0

              private struct Envelope: Decodable { let notifications: [RemoteNotification] }
              private let kSeen = "remote_notifications_seen_v1"

              private init() { refresh() }

              func refresh() {
                  guard let url = URL(string: BackendAccount.siteBase + "/api/public/notifications") else { return }
                  var req = URLRequest(url: url)
                  req.cachePolicy = .reloadRevalidatingCacheData
                  req.timeoutInterval = 15
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, _ in
                      guard let self = self, let data = data,
                            let env = try? JSONDecoder().decode(Envelope.self, from: data) else { return }
                      let seen = Set(UserDefaults.standard.stringArray(forKey: self.kSeen) ?? [])
                      DispatchQueue.main.async {
                          self.items = env.notifications
                          self.unread = env.notifications.filter { !seen.contains($0.id) }.count
                      }
                  }.resume()
              }

              func markAllRead() {
                  UserDefaults.standard.set(items.map { $0.id }, forKey: kSeen)
                  unread = 0
              }
          }

          /// قائمة إشعارات لوحة التحكم (تظهر داخل المتجر)
          struct RemoteNotificationsView: View {
              @StateObject private var store = RemoteNotificationStore.shared

              var body: some View {
                  Group {
                      if store.items.isEmpty {
                          VStack(spacing: 8) {
                              Image(systemName: "bell.slash").font(.system(size: 30)).foregroundColor(.storeSub)
                              Text("لا توجد إشعارات").font(.system(size: 13, weight: .semibold)).foregroundColor(.storeSub)
                          }
                          .frame(maxWidth: .infinity, maxHeight: .infinity)
                      } else {
                          ScrollView {
                              LazyVStack(spacing: 12) {
                                  ForEach(store.items) { n in
                                      VStack(alignment: .leading, spacing: 6) {
                                          Text(n.title).font(.system(size: 15, weight: .bold)).foregroundColor(.storeText)
                                          if !n.body.isEmpty {
                                              Text(n.body).font(.system(size: 13)).foregroundColor(.storeSub)
                                          }
                                          if !n.linkURL.isEmpty, let u = URL(string: n.linkURL) {
                                              Link("فتح", destination: u).font(.system(size: 13, weight: .semibold))
                                          }
                                      }
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .padding(14)
                                      .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                                  }
                              }
                              .padding(16)
                          }
                      }
                  }
                  .onAppear { store.refresh(); store.markAllRead() }
              }
          }
          BACKEOF

