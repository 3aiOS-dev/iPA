          // ================= LIVE CATALOG MONITOR =================
          @MainActor
          final class LiveCatalogMonitor: ObservableObject {
              static let shared = LiveCatalogMonitor()
              private var timer: Timer?
              private var lastFingerprint: String = UserDefaults.standard.string(forKey: "live_catalog_fp") ?? ""
              private init() {}

              func start() {
                  guard timer == nil else { return }
                  Task { @MainActor in
                      await self.tick()
                  }
                  timer = Timer.scheduledTimer(withTimeInterval: 90, repeats: true) { [weak self] _ in
                      guard let self = self else { return }
                      Task { @MainActor in await self.tick() }
                  }
                  if let t = timer {
                      RunLoop.main.add(t, forMode: .common)
                  }
              }

              func stop() {
                  timer?.invalidate()
                  timer = nil
              }

              private func tick() async {
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/updates") else { return }
                  var req = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 15)
                  req.setValue("21s-iOS/1.0", forHTTPHeaderField: "User-Agent")
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      guard let parsed = try? JSONDecoder().decode(StoreUpdatesResponse.self, from: data) else { return }
                      let recent = parsed.updates.filter { UpdatesFeed.shared.isRecent($0) }
                      let fp = recent.map { "\($0.id):\($0.version)" }.joined(separator: "|")
                      guard !fp.isEmpty, fp != lastFingerprint else {
                          if UpdatesFeed.shared.items.map({ "\($0.id):\($0.version)" }).joined(separator: "|") != fp {
                              await UpdatesFeed.shared.load()
                          }
                          return
                      }
                      await UpdatesFeed.shared.load()
                      let prev = Set(lastFingerprint.split(separator: "|").map { String($0) })
                      for item in recent {
                          let key = "\(item.id):\(item.version)"
                          if prev.contains(key) { continue }
                          let isNew = (item.is_new == true) || (item.released_at == nil)
                          NotificationsManager.shared.pushAppEvent(
                              name: item.app_name,
                              iconURL: item.icon,
                              version: item.version,
                              isUpdate: !isNew
                          )
                      }
                      lastFingerprint = fp
                      UserDefaults.standard.set(fp, forKey: "live_catalog_fp")
                  } catch {
                  }
              }
          }

