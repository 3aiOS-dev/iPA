name: AppScope 27 - iOS 27 Native Support

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"

          if [ -z "${XCODE_APP}" ]; then
            echo "No Xcode installation was found."
            exit 1
          fi

          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"

          echo "Selected Xcode:"
          xcodebuild -version
          echo "Swift:"
          swift --version

      - name: Install XcodeGen and zip
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          command -v xcodegen
          command -v zip

      - name: Create project directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppScopeBuild
          mkdir -p AppScopeBuild/AppScope

      - name: Generate Info.plist (iOS 27 optimized)
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>AppScope 27</string>

              <key>CFBundleIdentifier</key>
              <string>com.appscope.safe</string>

              <key>CFBundleName</key>
              <string>AppScope 27</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key>
                  <string>LaunchBackground</string>
              </dict>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>

              <!--
               iOS 27 enforces a strict limit of 25 declared URL schemes
               for apps linked against the iOS 27 SDK or later.
               This list is intentionally kept at exactly 25 entries,
               leveraging the system's new quota to ensure compatibility
               and avoid rejection.
              -->
              <key>LSApplicationQueriesSchemes</key>
              <array>
                  <string>youtube</string>
                  <string>twitter</string>
                  <string>instagram</string>
                  <string>facebook</string>
                  <string>telegram</string>
                  <string>whatsapp</string>
                  <string>discord</string>
                  <string>reddit</string>
                  <string>spotify</string>
                  <string>tiktok</string>
                  <string>snapchat</string>
                  <string>linkedin</string>
                  <string>github</string>
                  <string>googlechrome</string>
                  <string>googlemaps</string>
                  <string>waze</string>
                  <string>mailto</string>
                  <string>tel</string>
                  <string>facetime</string>
                  <string>calshow</string>
                  <string>shortcuts</string>
                  <string>music</string>
                  <string>podcasts</string>
                  <string>photos</string>
                  <string>itms-apps</string>
              </array>
          </dict>
          </plist>
          PLIST

      - name: Generate Swift source - AppScopeApp.swift
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/AppScopeApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct AppScopeApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environment(\.layoutDirection, .rightToLeft)
                  }
              }
          }
          SWIFT

      - name: Generate Swift source - Models.swift
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/Models.swift <<'SWIFT'
          import Foundation

          struct KnownApp: Identifiable, Hashable {
              let id: String
              let name: String
              let scheme: String
              let icon: String

              static let catalog: [KnownApp] = [
                  .init(id: "youtube", name: "YouTube", scheme: "youtube", icon: "play.rectangle.fill"),
                  .init(id: "twitter", name: "X", scheme: "twitter", icon: "xmark"),
                  .init(id: "instagram", name: "Instagram", scheme: "instagram", icon: "camera.fill"),
                  .init(id: "facebook", name: "Facebook", scheme: "facebook", icon: "person.2.fill"),
                  .init(id: "telegram", name: "Telegram", scheme: "telegram", icon: "paperplane.fill"),
                  .init(id: "whatsapp", name: "WhatsApp", scheme: "whatsapp", icon: "message.fill"),
                  .init(id: "discord", name: "Discord", scheme: "discord", icon: "bubble.left.and.bubble.right.fill"),
                  .init(id: "reddit", name: "Reddit", scheme: "reddit", icon: "text.bubble.fill"),
                  .init(id: "spotify", name: "Spotify", scheme: "spotify", icon: "music.note"),
                  .init(id: "tiktok", name: "TikTok", scheme: "tiktok", icon: "music.note"),
                  .init(id: "snapchat", name: "Snapchat", scheme: "snapchat", icon: "camera.viewfinder"),
                  .init(id: "linkedin", name: "LinkedIn", scheme: "linkedin", icon: "briefcase.fill"),
                  .init(id: "github", name: "GitHub", scheme: "github", icon: "chevron.left.forwardslash.chevron.right"),
                  .init(id: "chrome", name: "Google Chrome", scheme: "googlechrome", icon: "globe"),
                  .init(id: "maps", name: "Google Maps", scheme: "googlemaps", icon: "map.fill"),
                  .init(id: "waze", name: "Waze", scheme: "waze", icon: "location.fill"),
                  .init(id: "mail", name: "البريد", scheme: "mailto", icon: "envelope.fill"),
                  .init(id: "phone", name: "الهاتف", scheme: "tel", icon: "phone.fill"),
                  .init(id: "facetime", name: "FaceTime", scheme: "facetime", icon: "video.fill"),
                  .init(id: "calendar", name: "التقويم", scheme: "calshow", icon: "calendar"),
                  .init(id: "shortcuts", name: "الاختصارات", scheme: "shortcuts", icon: "square.grid.2x2.fill"),
                  .init(id: "music", name: "الموسيقى", scheme: "music", icon: "music.note"),
                  .init(id: "podcasts", name: "البودكاست", scheme: "podcasts", icon: "mic.fill"),
                  .init(id: "photos", name: "الصور", scheme: "photos", icon: "photo.fill"),
                  .init(id: "appstore", name: "App Store", scheme: "itms-apps", icon: "bag.fill")
              ]
          }

          struct AppCheckResult: Identifiable, Hashable {
              let app: KnownApp
              let installed: Bool

              var id: String { app.id }
          }
          SWIFT

      - name: Generate Swift source - InstalledAppsService.swift
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/InstalledAppsService.swift <<'SWIFT'
          import Foundation
          import UIKit

          @MainActor
          final class InstalledAppsService: ObservableObject {
              @Published private(set) var results: [AppCheckResult] = []
              @Published private(set) var isChecking = false
              @Published private(set) var checkedAt: Date?

              /*
               This service uses the official, secure canOpenURL(_:) API
               with the declared URL schemes. It does NOT use any private
               frameworks, file system enumeration, or LaunchServices
               database access – fully compliant with iOS 27 security model.

               The result indicates whether the system reports an installed
               application registered for the scheme, but does not reveal
               detailed app metadata.
              */
              func checkKnownApps() {
                  guard !isChecking else { return }

                  isChecking = true
                  results = []

                  let catalog = KnownApp.catalog

                  Task { @MainActor in
                      var checked: [AppCheckResult] = []
                      checked.reserveCapacity(catalog.count)

                      for item in catalog {
                          guard let url = URL(string: "\(item.scheme)://") else {
                              checked.append(AppCheckResult(app: item, installed: false))
                              continue
                          }

                          let installed = UIApplication.shared.canOpenURL(url)
                          checked.append(AppCheckResult(app: item, installed: installed))

                          // Keep UI responsive
                          await Task.yield()
                      }

                      results = checked
                      checkedAt = Date()
                      isChecking = false
                  }
              }

              func clear() {
                  results.removeAll()
                  checkedAt = nil
              }
          }
          SWIFT

      - name: Generate Swift source - ContentView.swift
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/ContentView.swift <<'SWIFT'
          import SwiftUI

          struct ContentView: View {
              @StateObject private var service = InstalledAppsService()
              @AppStorage("scanConsent") private var scanConsent = false
              @State private var showingConsent = false
              @State private var search = ""

              private var visibleResults: [AppCheckResult] {
                  guard !search.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                      return service.results
                  }

                  let query = search.lowercased()
                  return service.results.filter {
                      $0.app.name.lowercased().contains(query) ||
                      $0.app.scheme.lowercased().contains(query)
                  }
              }

              private var installedCount: Int {
                  service.results.filter(\.installed).count
              }

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 18) {
                              header

                              if !scanConsent {
                                  consentCard
                              } else {
                                  statusCard

                                  if !service.results.isEmpty {
                                      searchBar
                                      resultsSection
                                  } else if service.isChecking {
                                      checkingCard
                                  } else {
                                      emptyCard
                                  }
                              }
                          }
                          .padding(.horizontal, 18)
                          .padding(.vertical, 18)
                      }
                      .background(Color(uiColor: .systemGroupedBackground))
                      .navigationTitle("AppScope 27")
                      .navigationBarTitleDisplayMode(.inline)
                      .sheet(isPresented: $showingConsent) {
                          ConsentSheet {
                              scanConsent = true
                              showingConsent = false
                              service.checkKnownApps()
                          }
                          .presentationDetents([.medium])
                      }
                  }
              }

              private var header: some View {
                  VStack(alignment: .trailing, spacing: 8) {
                      HStack {
                          Image(systemName: "checkmark.shield.fill")
                              .font(.system(size: 34))
                              .foregroundStyle(.blue)

                          Spacer()

                          VStack(alignment: .trailing, spacing: 4) {
                              Text("فحص التطبيقات")
                                  .font(.system(size: 27, weight: .bold))

                              Text("iOS 27 متوافق")
                                  .font(.subheadline)
                                  .foregroundStyle(.secondary)
                          }
                      }

                      Text("يعرض فقط التطبيقات المعروفة التي يسمح iOS بالتحقق منها عبر URL Schemes المعلنة (الحد الأقصى 25).")
                          .font(.footnote)
                          .foregroundStyle(.secondary)
                          .multilineTextAlignment(.trailing)
                  }
              }

              private var consentCard: some View {
                  VStack(alignment: .trailing, spacing: 14) {
                      Label("قبل البدء", systemImage: "hand.raised.fill")
                          .font(.headline)
                          .foregroundStyle(.blue)

                      Text("يحتاج التطبيق إلى موافقتك قبل إجراء أي فحص.")
                          .font(.headline)

                      Text("سيتم فحص قائمة محددة من التطبيقات المعروفة فقط. لا يتم الوصول إلى ملفات النظام أو قواعد بيانات خاصة، ولا يتم إرسال نتائج الفحص إلى خادم.")
                          .font(.subheadline)
                          .foregroundStyle(.secondary)
                          .multilineTextAlignment(.trailing)

                      Button {
                          showingConsent = true
                      } label: {
                          Text("مراجعة والموافقة")
                              .frame(maxWidth: .infinity)
                      }
                      .buttonStyle(.borderedProminent)
                  }
                  .padding(18)
                  .background(.background, in: RoundedRectangle(cornerRadius: 22))
              }

              private var statusCard: some View {
                  VStack(spacing: 12) {
                      HStack {
                          VStack(alignment: .trailing, spacing: 4) {
                              Text("الحالة")
                                  .font(.caption)
                                  .foregroundStyle(.secondary)

                              Text(service.isChecking ? "جارٍ الفحص…" : "جاهز")
                                  .font(.headline)
                          }

                          Spacer()

                          VStack(alignment: .trailing, spacing: 4) {
                              Text("تم العثور")
                                  .font(.caption)
                                  .foregroundStyle(.secondary)

                              Text("\(installedCount)")
                                  .font(.title2.bold())
                          }
                      }

                      Button {
                          service.checkKnownApps()
                      } label: {
                          Label(
                              service.isChecking ? "جارٍ الفحص…" : "فحص التطبيقات المعروفة",
                              systemImage: "arrow.clockwise"
                          )
                          .frame(maxWidth: .infinity)
                      }
                      .buttonStyle(.borderedProminent)
                      .disabled(service.isChecking)
                  }
                  .padding(18)
                  .background(.background, in: RoundedRectangle(cornerRadius: 22))
              }

              private var searchBar: some View {
                  HStack(spacing: 10) {
                      Image(systemName: "magnifyingglass")
                          .foregroundStyle(.secondary)

                      TextField("ابحث عن تطبيق", text: $search)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled()
                  }
                  .padding(13)
                  .background(.background, in: RoundedRectangle(cornerRadius: 16))
              }

              private var resultsSection: some View {
                  VStack(alignment: .trailing, spacing: 10) {
                      HStack {
                          Text("التطبيقات التي تم فحصها")
                              .font(.headline)

                          Spacer()

                          Text("\(visibleResults.count)")
                              .font(.caption.bold())
                              .foregroundStyle(.secondary)
                      }

                      LazyVStack(spacing: 8) {
                          ForEach(visibleResults) { result in
                              AppResultRow(result: result)
                          }
                      }
                  }
              }

              private var checkingCard: some View {
                  VStack(spacing: 12) {
                      ProgressView()
                      Text("يتم فحص التطبيقات المعروفة…")
                          .font(.subheadline)
                          .foregroundStyle(.secondary)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(30)
                  .background(.background, in: RoundedRectangle(cornerRadius: 22))
              }

              private var emptyCard: some View {
                  VStack(spacing: 10) {
                      Image(systemName: "rectangle.stack.badge.person.crop")
                          .font(.system(size: 34))
                          .foregroundStyle(.secondary)

                      Text("لم يتم إجراء الفحص بعد")
                          .font(.headline)

                      Text("اضغط على زر الفحص للتحقق من التطبيقات المعروفة.")
                          .font(.subheadline)
                          .foregroundStyle(.secondary)
                          .multilineTextAlignment(.center)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(30)
                  .background(.background, in: RoundedRectangle(cornerRadius: 22))
              }
          }

          struct AppResultRow: View {
              let result: AppCheckResult

              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: result.installed ? "checkmark.circle.fill" : "minus.circle")
                          .font(.title3)
                          .foregroundStyle(result.installed ? .green : .secondary)

                      Spacer()

                      VStack(alignment: .trailing, spacing: 3) {
                          Text(result.app.name)
                              .font(.body.weight(.semibold))

                          Text(result.installed ? "متاح على الجهاز" : "غير متاح عبر الرابط المعلن")
                              .font(.caption)
                              .foregroundStyle(.secondary)
                      }

                      Image(systemName: result.app.icon)
                          .frame(width: 34, height: 34)
                          .foregroundStyle(.blue)
                  }
                  .padding(13)
                  .background(.background, in: RoundedRectangle(cornerRadius: 16))
              }
          }

          struct ConsentSheet: View {
              let onAccept: () -> Void
              @Environment(\.dismiss) private var dismiss

              var body: some View {
                  VStack(spacing: 18) {
                      Image(systemName: "checkmark.shield.fill")
                          .font(.system(size: 48))
                          .foregroundStyle(.blue)

                      Text("موافقتك مطلوبة")
                          .font(.title2.bold())

                      Text("أوافق على أن يقوم AppScope 27 بفحص قائمة محددة من URL Schemes لمعرفة ما إذا كان هناك تطبيق مسجل للتعامل معها. أفهم أن هذه ليست قائمة شاملة لكل التطبيقات المثبتة.")
                          .font(.body)
                          .multilineTextAlignment(.center)
                          .foregroundStyle(.secondary)

                      Button("أوافق وأبدأ الفحص") {
                          onAccept()
                      }
                      .buttonStyle(.borderedProminent)
                      .frame(maxWidth: .infinity)

                      Button("إلغاء") {
                          dismiss()
                      }
                      .buttonStyle(.bordered)
                      .frame(maxWidth: .infinity)
                  }
                  .padding(24)
                  .environment(\.layoutDirection, .rightToLeft)
              }
          }
          SWIFT

      - name: Generate XcodeGen project.yml (iOS 27 target)
        shell: bash
        run: |
          cat > AppScopeBuild/project.yml <<'YAML'
          name: AppScope27

          options:
            minimumXcodeGenVersion: "2.40.0"
            deploymentTarget:
              iOS: "27.0"
            createIntermediateGroups: true
            groupSortPosition: top

          settings:
            base:
              SWIFT_VERSION: "6.0"
              IPHONEOS_DEPLOYMENT_TARGET: "27.0"
              DEVELOPMENT_TEAM: ""
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""
              PRODUCT_BUNDLE_IDENTIFIER: "com.appscope.safe"
              MARKETING_VERSION: "1.0"
              CURRENT_PROJECT_VERSION: "1"

          targets:
            AppScope27:
              type: application
              platform: iOS
              sources:
                - path: AppScope
              info:
                path: AppScope/Info.plist
              settings:
                base:
                  PRODUCT_NAME: "AppScope27"
                  INFOPLIST_FILE: "AppScope/Info.plist"
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
              scheme:
                gatherCoverageData: false
                testTargets: []
          YAML

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild
          xcodegen generate
          test -f AppScope27.xcodeproj/project.pbxproj

      - name: Validate Swift sources
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild

          swiftc \
            -parse \
            AppScope/AppScopeApp.swift \
            AppScope/Models.swift \
            AppScope/InstalledAppsService.swift \
            AppScope/ContentView.swift

      - name: Build unsigned archive (iOS 27 SDK)
        shell: bash
        run: |
          set -euo pipefail

          cd AppScopeBuild

          xcodebuild \
            -project AppScope27.xcodeproj \
            -scheme AppScope27 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AppScope27.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/AppScope27.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/AppScope27.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle was not found:"
            find "$ARCHIVE" -maxdepth 5 -type d -name '*.app' -print
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/AppScope27.app"

          cd "$RUNNER_TEMP"
          rm -f AppScope27-unsigned.ipa
          /usr/bin/zip -qry AppScope27-unsigned.ipa Payload

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp AppScope27-unsigned.ipa "$GITHUB_WORKSPACE/artifacts/AppScope27-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppScope27-unsigned-ipa
          path: artifacts/AppScope27-unsigned.ipa
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## AppScope 27 - iOS 27 Native"
            echo ""
            echo "- Built with deployment target iOS 27.0"
            echo "- Uses the official canOpenURL API with declared schemes"
            echo "- Respects iOS 27's 25‑scheme limit"
            echo "- No private APIs or filesystem enumeration"
            echo "- Consent‑based, no data sent to servers"
            echo "- Unsigned IPA: artifacts/AppScope27-unsigned.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
