          import SwiftUI
          import BackgroundTasks
          import UserNotifications

          @main
          struct VIP21StoreApp: App {
              init() {
                  // Force dark mode
                  if let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene {
                      scene.windows.forEach { $0.overrideUserInterfaceStyle = .dark }
                  }
                  // Register background task for catalog refresh
                  BGTaskScheduler.shared.register(
                      forTaskWithIdentifier: "com.21s.store.refresh",
                      using: nil
                  ) { task in
                      task.setTaskCompleted(success: true)
                      self.scheduleAppRefresh()
                  }
                  scheduleAppRefresh()
              }

              func scheduleAppRefresh() {
                  let request = BGAppRefreshTaskRequest(identifier: "com.21s.store.refresh")
                  request.earliestBeginDate = Date(timeIntervalSinceNow: 15 * 60)
                  try? BGTaskScheduler.shared.submit(request)
              }

              var body: some Scene {
                  WindowGroup {
                      StoreRootView()
                          .preferredColorScheme(.dark)
                          .background(Color.storeBg.ignoresSafeArea())
                  }
              }
          }
          APPEOF

      - name: Generate code - StatusScreens.swift (for No Internet)
        run: |
          cat > StatusScreens.swift << 'STATEOF'
          import SwiftUI
          import Network

          enum StatusKind: Equatable {
              case ok
              case noInternet
          }

          @MainActor
          final class StatusCenter: ObservableObject {
              static let shared = StatusCenter()
              @Published var kind: StatusKind = .ok
              private let monitor = NWPathMonitor()
              private let queue = DispatchQueue(label: "com.ones.status.monitor")
              private var didStart = false

              func start() {
                  guard !didStart else { return }
                  didStart = true
                  monitor.pathUpdateHandler = { [weak self] path in
                      DispatchQueue.main.async {
                          self?.evaluate(currentPath: path)
                      }
                  }
                  monitor.start(queue: queue)
                  evaluate(currentPath: monitor.currentPath)
              }

              func refresh() {
                  evaluate(currentPath: monitor.currentPath)
              }

              private func evaluate(currentPath: NWPath) {
                  kind = currentPath.status == .satisfied ? .ok : .noInternet
              }
          }

          struct NoInternetScreen: View {
              var onRetry: () -> Void
              @State private var animatePulse = false

              var body: some View {
