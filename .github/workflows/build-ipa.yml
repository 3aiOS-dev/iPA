          import SwiftUI

          struct OnboardingView: View {
              @Binding var isPresented: Bool
              @State private var currentPage = 0

              private let slides: [OnboardingSlide] = [
                  OnboardingSlide(
                      imageName: "onboarding1",
                      title: "Welcome to 21s",
                      subtitle: "Your premium app marketplace, redesigned for the way you discover."
                  ),
                  OnboardingSlide(
                      imageName: "onboarding2",
                      title: "Discover & Download",
                      subtitle: "Browse curated apps, top charts, and personalized recommendations."
                  ),
                  OnboardingSlide(
                      imageName: "onboarding3",
                      title: "Stay Updated",
                      subtitle: "Get notified about new versions, alerts, and exclusive releases."
                  )
              ]

              var body: some View {
                  ZStack {
                      Color.storeBg.ignoresSafeArea()

                      VStack(spacing: 0) {
                          TabView(selection: $currentPage) {
                              ForEach(Array(slides.enumerated()), id: \.offset) { idx, slide in
                                  OnboardingSlideView(slide: slide)
                                      .tag(idx)
                              }
                          }
                          .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))

                          HStack(spacing: 8) {
                              ForEach(0..<slides.count, id: \.self) { i in
                                  Capsule()
                                      .fill(i == currentPage ? Color.storePrimary : Color.storeDivider)
                                      .frame(width: i == currentPage ? 22 : 8, height: 8)
                                      .animation(.easeInOut(duration: 0.2), value: currentPage)
                              }
                          }
                          .padding(.top, 18)

                          Button {
                              HapticManager.shared.impact(.light)
                              if currentPage < slides.count - 1 {
                                  withAnimation { currentPage += 1 }
                              } else {
                                  UserDefaults.standard.set(true, forKey: AppConstants.hasSeenOnboardingKey)
                                  isPresented = false
                              }
                          } label: {
                              Text(currentPage < slides.count - 1 ? "Next" : "Get Started")
                                  .font(.system(size: 16, weight: .bold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 54)
                                  .background(
                                      RoundedRectangle(cornerRadius: 16)
                                          .fill(LinearGradient(colors: [Color.storePrimary, Color.storePrimaryDk],
                                                               startPoint: .leading, endPoint: .trailing))
                                  )
                          }
                          .padding(.horizontal, 24)
                          .padding(.top, 24)

                          Button("Skip") {
                              UserDefaults.standard.set(true, forKey: AppConstants.hasSeenOnboardingKey)
                              isPresented = false
                          }
                          .font(.system(size: 14, weight: .semibold))
                          .foregroundColor(.storeSub)
                          .padding(.top, 12)
                      }
                      .padding(.bottom, 36)
                  }
              }
          }

          struct OnboardingSlide: Identifiable {
              let id = UUID()
              let imageName: String
              let title: String
              let subtitle: String
          }

          struct OnboardingSlideView: View {
              let slide: OnboardingSlide

              var body: some View {
                  VStack(spacing: 24) {
                      if let img = UIImage.bundled(slide.imageName) {
                          Image(uiImage: img)
                              .resizable()
                              .scaledToFit()
                              .frame(maxWidth: 320)
                              .padding(.top, 40)
                      } else {
                          RoundedRectangle(cornerRadius: 24)
