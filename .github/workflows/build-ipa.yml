          // MARK: - HTML to AttributedString
          extension String {
              func htmlAttributedString(fontSize: CGFloat = 13, color: Color = .storeText) -> AttributedString? {
                  guard let data = self.data(using: .utf8) else { return nil }
                  let options: [NSAttributedString.DocumentReadingOptionKey: Any] = [
                      .documentType: NSAttributedString.DocumentType.html,
                      .characterEncoding: String.Encoding.utf8.rawValue
                  ]
                  guard let ns = try? NSMutableAttributedString(data: data, options: options, documentAttributes: nil) else {
                      return nil
                  }
                  let range = NSRange(location: 0, length: ns.length)
                  ns.addAttribute(.font, value: UIFont.systemFont(ofSize: fontSize), range: range)
                  ns.addAttribute(.foregroundColor, value: UIColor(color), range: range)
                  return AttributedString(ns)
              }
          }

          // Static brand colors - GREEN THEME (shared by every feature)
          extension Color {
              static let storePrimary   = Color(red: 0.16, green: 0.62, blue: 0.36)   // primary green
