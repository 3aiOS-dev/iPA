      - name: Generate code - OnboardingView.swift
        run: |
          cat > OnboardingView.swift << 'VIPEOF'
          import SwiftUI

          struct OnboardingView: View {
              @Binding var isPresented: Bool

              @State private var currentPage = 0
              private let pages: [OnboardingPage] = [
                  OnboardingPage(
                      imageName: "onboarding1.png",
                      title: "Research",
                      description: "Collect data from problems that occur in the field."
                  ),
                  OnboardingPage(
                      imageName: "onboarding2.png",
                      title: "Ideation",
                      description: "Finding a problem that really matters is resolved"
                  ),
                  OnboardingPage(
                      imageName: "onboarding3.png",
                      title: "Prototyping",
                      description: "Realizing a product design that can be tried immediately"
                  )
              ]

              var body: some View {
                  ZStack {
                      Color.xcodeBackground.edgesIgnoringSafeArea(.all)

                      VStack(spacing: 0) {
                          TabView(selection: $currentPage) {
                              ForEach(pages.indices, id: \.self) { index in
                                  OnboardingPageView(page: pages[index])
                                      .tag(index)
                              }
                          }
                          .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))
                          .animation(.easeInOut, value: currentPage)

                          HStack(spacing: 8) {
                              ForEach(pages.indices, id: \.self) { index in
                                  Circle()
                                      .fill(currentPage == index ? Color.xcodeBlue : Color.xcodeDivider)
                                      .frame(width: 8, height: 8)
                                      .onTapGesture {
                                          withAnimation { currentPage = index }
                                      }
                              }
                          }
                          .padding(.top, 20)

                          Button {
                              if currentPage < pages.count - 1 {
                                  withAnimation { currentPage += 1 }
                              } else {
                                  UserDefaults.standard.set(true, forKey: AppConstants.hasSeenOnboardingKey)
                                  isPresented = false
                              }
                          } label: {
                              HStack {
                                  Text(currentPage == pages.count - 1 ? "Get Started" : "Next")
                                      .font(.system(size: 16, weight: .semibold))
                                  if currentPage < pages.count - 1 {
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 14, weight: .medium))
                                  }
                              }
                              .foregroundColor(.white)
                              .frame(maxWidth: .infinity)
                              .frame(height: 54)
                              .background(Capsule().fill(Color.xcodeBlue))
                          }
                          .padding(.horizontal, 28)
                          .padding(.top, 20)
                          .padding(.bottom, 40)
                      }
                  }
                  .preferredColorScheme(.light)
              }
          }

          struct OnboardingPage: Identifiable {
              let id = UUID()
              let imageName: String
              let title: String
