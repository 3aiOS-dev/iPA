              private func authRequest(_ path: String, body: [String: Any]) -> URLRequest? {
                  guard let url = URL(string: BackendAccount.supabaseURL + path) else { return nil }
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.timeoutInterval = 20
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(BackendAccount.anonKey, forHTTPHeaderField: "apikey")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
