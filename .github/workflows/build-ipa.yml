      - name: Generate Source - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UserNotifications

          // MARK: - App Entry Point
          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .onAppear { requestNotifications() }
                  }
              }

              func requestNotifications() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }
          }

          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  return true
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           willPresent notification: UNNotification,
                                           withCompletionHandler handler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  handler([.banner, .sound, .badge])
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           didReceive response: UNNotificationResponse,
                                           withCompletionHandler handler: @escaping () -> Void) {
                  handler()
              }
          }
          VIPEOF
          echo "VIP21StoreApp.swift: $(wc -l < VIP21StoreApp.swift) lines"

      - name: Build Application
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            AppsManager.swift \
            SharedComponents.swift \
            IPAManager.swift \
            ContentView.swift \
            HomeTabView.swift \
            AppsTabView.swift \
            IPAFilesTabView.swift \
            AppDetailView.swift \
            VIP21StoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework UserNotifications \
            -lz \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA Package
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-IPA-SwiftUI-v7
          path: artifacts/21s.ipa
