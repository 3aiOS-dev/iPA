          const db = require('../db');
          const { generateCode, hashToken } = require('../utils/code');
          const config = require('../config');
          const dayjs = require('dayjs');
          
          /**
           * Create a fresh verification code for a telegram user.
           * Old pending codes for the same user/purpose are invalidated.
           */
          function createCode(telegramId, purpose = 'signup') {
            const code = generateCode(config.verification.codeLength);
            const codeHash = hashToken(code);
            const expires = dayjs().add(config.verification.ttlMin, 'minute').toISOString();
          
            // Invalidate any prior unconsumed codes for this purpose
            db.prepare(`
              UPDATE verification_codes
              SET consumed_at = datetime('now')
              WHERE telegram_id = ? AND purpose = ? AND consumed_at IS NULL
            `).run(telegramId, purpose);
          
            db.prepare(`
              INSERT INTO verification_codes (telegram_id, code_hash, purpose, expires_at)
              VALUES (?, ?, ?, ?)
            `).run(telegramId, codeHash, purpose, expires);
          
            return { code, expiresAt: expires };
          }
          
          /**
           * Verify a code attempt. Returns { ok, reason }.
           * ok=true only when code matches, is not expired, not consumed, attempts < max.
           */
          function consumeCode(telegramId, inputCode, purpose = 'signup') {
            const record = db.prepare(`
              SELECT * FROM verification_codes
              WHERE telegram_id = ? AND purpose = ? AND consumed_at IS NULL
              ORDER BY id DESC LIMIT 1
            `).get(telegramId, purpose);
          
            if (!record) return { ok: false, reason: 'no_pending_code' };
          
            const expired = dayjs().isAfter(dayjs(record.expires_at));
            if (expired) {
              db.prepare(`UPDATE verification_codes SET consumed_at = datetime('now') WHERE id = ?`).run(record.id);
              return { ok: false, reason: 'expired' };
            }
          
            if (record.attempts >= config.verification.maxAttempts) {
              db.prepare(`UPDATE verification_codes SET consumed_at = datetime('now') WHERE id = ?`).run(record.id);
              return { ok: false, reason: 'too_many_attempts' };
            }
          
            const inputHash = hashToken(inputCode.trim());
            if (inputHash !== record.code_hash) {
              db.prepare(`UPDATE verification_codes SET attempts = attempts + 1 WHERE id = ?`).run(record.id);
              return { ok: false, reason: 'invalid' };
            }
          
            db.prepare(`UPDATE verification_codes SET consumed_at = datetime('now') WHERE id = ?`).run(record.id);
            return { ok: true, record };
          }
          
          function purgeExpired() {
            const res = db.prepare(`
              DELETE FROM verification_codes
              WHERE expires_at < datetime('now') AND consumed_at IS NULL
            `).run();
            return res.changes;
          }
          
          module.exports = { createCode, consumeCode, purgeExpired };
          
          EOFBOT_SVC_VERIFY_JS
          
