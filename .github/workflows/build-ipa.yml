                      iconView.heightAnchor.constraint(equalToConstant: 88),

                      emojiLabel.centerXAnchor.constraint(equalTo: iconView.centerXAnchor),
                      emojiLabel.centerYAnchor.constraint(equalTo: iconView.centerYAnchor),

                      nameLabel.topAnchor.constraint(equalTo: iconView.topAnchor, constant: 4),
                      nameLabel.leadingAnchor.constraint(equalTo: iconView.trailingAnchor, constant: 16),
                      nameLabel.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),

                      devLabel.topAnchor.constraint(equalTo: nameLabel.bottomAnchor, constant: 4),
                      devLabel.leadingAnchor.constraint(equalTo: nameLabel.leadingAnchor),

                      ratingLabel.topAnchor.constraint(equalTo: devLabel.bottomAnchor, constant: 6),
                      ratingLabel.leadingAnchor.constraint(equalTo: nameLabel.leadingAnchor),

                      sizeLabel.topAnchor.constraint(equalTo: ratingLabel.topAnchor),
                      sizeLabel.leadingAnchor.constraint(equalTo: ratingLabel.trailingAnchor, constant: 10),

                      installButton.topAnchor.constraint(equalTo: iconView.bottomAnchor, constant: 24),
                      installButton.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      installButton.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),
                      installButton.heightAnchor.constraint(equalToConstant: 46),

                      progressView.topAnchor.constraint(equalTo: installButton.bottomAnchor, constant: 10),
                      progressView.leadingAnchor.constraint(equalTo: installButton.leadingAnchor),
                      progressView.trailingAnchor.constraint(equalTo: installButton.trailingAnchor),

                      descTitleLabel.topAnchor.constraint(equalTo: progressView.bottomAnchor, constant: 24),
                      descTitleLabel.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),

                      descLabel.topAnchor.constraint(equalTo: descTitleLabel.bottomAnchor, constant: 8),
                      descLabel.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      descLabel.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),
                  ])
              }

              // ملاحظة مهمة: هذا الزر لا يقوم بأي تنزيل أو تثبيت فعلي لأي ملف؛
              // إنه فقط رسم متحرك تجريبي لشريط تقدم يوضح شكل الواجهة، ثم يتحول
              // إلى زر "فتح" شكلي بدون أي وظيفة تثبيت حقيقية.
              @objc private func installTapped() {
                  guard progressView.isHidden else { return }
                  installButton.isEnabled = false
                  installButton.setTitle("جارِ...", for: .normal)
                  progressView.isHidden = false
                  progressView.progress = 0

                  var progress: Float = 0
                  progressTimer?.invalidate()
                  progressTimer = Timer.scheduledTimer(withTimeInterval: 0.08, repeats: true) { [weak self] timer in
                      guard let self = self else { return }
                      progress += 0.04
                      self.progressView.setProgress(progress, animated: true)
                      if progress >= 1.0 {
                          timer.invalidate()
                          self.progressView.isHidden = true
                          self.installButton.isEnabled = true
                          self.installButton.setTitle("فتح", for: .normal)
                      }
                  }
              }

              deinit {
                  progressTimer?.invalidate()
              }
          }
