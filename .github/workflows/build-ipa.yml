      # =========================================================
      # SOURCE CODE - DiskCache.swift  (LRU + byte budget, 1 TB)
      # =========================================================
      - name: Generate code - DiskCache.swift
        run: |
          cat > DiskCache.swift << 'VIPEOF'
          import Foundation
          import CryptoKit

          /// Byte-budgeted, LRU disk cache. Two regions:
          ///   - ipa/    : partial + completed IPA chunks
          ///   - icons/  : downloaded app icons (size-limited)
          ///   - meta/   : cached JSON metadata feeds
          /// On every write / read the manager checks the on-disk usage
          /// of the relevant region and evicts the oldest entries until
          /// the size drops below the configured budget.
          final class DiskCache {

              static let shared = DiskCache()

              let rootURL: URL
              let ipaRegion: URL
              let iconRegion: URL
              let metaRegion: URL
              let downloadRegion: URL

              private let queue = DispatchQueue(label: "com.21s.diskcache", qos: .utility)
              private let lock = NSLock()

              private init() {
                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  rootURL = caches.appendingPathComponent("21s", isDirectory: true)
                  ipaRegion       = rootURL.appendingPathComponent("ipa",    isDirectory: true)
                  iconRegion      = rootURL.appendingPathComponent("icons",  isDirectory: true)
                  metaRegion      = rootURL.appendingPathComponent("meta",   isDirectory: true)
                  downloadRegion  = rootURL.appendingPathComponent("dl",     isDirectory: true)
                  for dir in [rootURL, ipaRegion, iconRegion, metaRegion, downloadRegion] {
                      try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  }
              }

              // MARK: - URL helpers
              func url(forKey key: String, in region: URL) -> URL {
                  return region.appendingPathComponent(key.sha256 + ".bin")
              }

              func write(_ data: Data, forKey key: String, in region: URL) {
                  queue.async {
                      let u = self.url(forKey: key, in: region)
                      try? data.write(to: u, options: .atomic)
                      self.touch(u, key: key, in: region)
                      self.evictIfNeeded(for: region)
                  }
              }

              func read(forKey key: String, in region: URL) -> Data? {
                  let u = url(forKey: key, in: region)
                  guard let d = try? Data(contentsOf: u) else { return nil }
                  touch(u, key: key, in: region)
                  return d
              }

              func remove(forKey key: String, in region: URL) {
                  queue.async {
                      let u = self.url(forKey: key, in: region)
                      try? FileManager.default.removeItem(at: u)
                  }
              }

              // MARK: - LRU bookkeeping
              private struct Entry: Codable {
                  let key: String
                  var lastAccess: Date
              }
              private func manifest(for region: URL) -> URL {
                  return region.appendingPathComponent("_lru.json")
              }
              private func touch(_ file: URL, key: String, in region: URL) {
                  lock.lock(); defer { lock.unlock() }
                  let m = manifest(for: region)
                  var entries: [Entry] = (try? Data(contentsOf: m)).flatMap { try? JSONDecoder().decode([Entry].self, from: $0) } ?? []
                  entries.removeAll { $0.key == key }
                  entries.append(Entry(key: key, lastAccess: Date()))
                  if let data = try? JSONEncoder().encode(entries) {
                      try? data.write(to: m, options: .atomic)
                  }
              }

              private func evictIfNeeded(for region: URL) {
                  let budget: Int64
                  switch region.path {
                  case ipaRegion.path:       budget = AppConstants.diskCacheMaxBytes
                  case iconRegion.path:      budget = AppConstants.iconsCacheMaxBytes
                  case metaRegion.path:      budget = AppConstants.metadataCacheMaxBytes
                  default:                   return
                  }
                  guard let size = directorySize(region), size > budget else { return }

                  // Sort entries by oldest access, drop from disk + manifest
                  lock.lock(); defer { lock.unlock() }
                  let m = manifest(for: region)
                  var entries: [Entry] = (try? Data(contentsOf: m)).flatMap { try? JSONDecoder().decode([Entry].self, from: $0) } ?? []
                  entries.sort { $0.lastAccess < $1.lastAccess }
                  var freed: Int64 = 0
                  let toFree = size - budget
                  var i = 0
                  while i < entries.count && freed < toFree {
                      let u = url(forKey: entries[i].key, in: region)
                      if let attrs = try? FileManager.default.attributesOfItem(atPath: u.path),
                         let s = attrs[.size] as? Int64 {
                          try? FileManager.default.removeItem(at: u)
                          freed += s
                      }
                      i += 1
                  }
                  if i > 0 {
                      entries.removeFirst(i)
                      if let data = try? JSONEncoder().encode(entries) {
                          try? data.write(to: m, options: .atomic)
                      }
                  }
              }

              func directorySize(_ dir: URL) -> Int64? {
                  let fm = FileManager.default
                  guard let enumerator = fm.enumerator(at: dir, includingPropertiesForKeys: [.fileSizeKey]) else { return nil }
                  var total: Int64 = 0
                  for case let url as URL in enumerator {
                      if let attrs = try? url.resourceValues(forKeys: [.fileSizeKey]),
                         let s = attrs.fileSize {
                          total += Int64(s)
                      }
                  }
                  return total
              }

              func currentSize(for region: URL) -> Int64 {
                  return directorySize(region) ?? 0
              }

              // MARK: - Public shortcut for IPA partials
              func writeChunk(appId: String, chunkIndex: Int, data: Data) {
                  let key = "\(appId)/chunk-\(chunkIndex)"
                  write(data, forKey: key, in: downloadRegion)
              }
              func readChunk(appId: String, chunkIndex: Int) -> Data? {
                  let key = "\(appId)/chunk-\(chunkIndex)"
                  return read(forKey: key, in: downloadRegion)
              }
              func removeAllChunks(appId: String) {
                  queue.async {
                      let prefix = "\(appId)/chunk-"
                      let m = self.manifest(for: self.downloadRegion)
                      var entries: [Entry] = (try? Data(contentsOf: m)).flatMap { try? JSONDecoder().decode([Entry].self, from: $0) } ?? []
                      entries.removeAll { $0.key.hasPrefix(prefix) }
                      if let data = try? JSONEncoder().encode(entries) {
                          try? data.write(to: m, options: .atomic)
                      }
                      let fm = FileManager.default
                      if let en = fm.enumerator(at: self.downloadRegion, includingPropertiesForKeys: nil) {
                          for case let u as URL in en where u.lastPathComponent.hasPrefix(self.sha256(prefix) ?? "") {
                              try? fm.removeItem(at: u)
                          }
                      }
                  }
              }
              func chunkFileURL(appId: String, chunkIndex: Int) -> URL {
                  return url(forKey: "\(appId)/chunk-\(chunkIndex)", in: downloadRegion)
              }
              func finalFileURL(appId: String, name: String) -> URL {
                  let safe = name.replacingOccurrences(of: "/", with: "_")
                  return ipaRegion.appendingPathComponent("\(appId)_\(safe).ipa")
              }

              // MARK: - Helpers
              private func sha256(_ s: String) -> String? {
                  let d = Data(s.utf8)
                  let h = SHA256.hash(data: d)
                  return h.map { String(format: "%02x", $0) }.joined()
              }
          }

          extension String {
              fileprivate var sha256: String {
                  let d = Data(self.utf8)
                  let h = SHA256.hash(data: d)
                  return h.map { String(format: "%02x", $0) }.joined()
              }
          }
          VIPEOF

      # =========================================================
      # SOURCE CODE - ChunkedDownloader.swift
      # Resumable, parallel, range-based chunk downloader
      # =========================================================
      - name: Generate code - ChunkedDownloader.swift
        run: |
          cat > ChunkedDownloader.swift << 'VIPEOF'
          import Foundation
          import Combine

          /// Resumable, parallel, range-based chunk downloader.
          ///
          /// - Splits the target file into N chunks (default 8 MB each).
          /// - Streams up to `maxConcurrent` chunks in parallel.
          /// - Persists every chunk to disk via DiskCache, so a relaunch
          ///   can resume exactly where it left off.
          /// - Emits a single `DownloadProgress` stream per task.
          @MainActor
          final class ChunkedDownloader: ObservableObject {

              static let shared = ChunkedDownloader()

              @Published private(set) var tasks: [DownloadTask] = []
              private let persistenceURL: URL

              private init() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  let dir  = docs.appendingPathComponent("21sDownloads", isDirectory: true)
                  try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  persistenceURL = dir.appendingPathComponent("tasks.json")
                  load()
              }

              // MARK: - Public API

              func start(app: MassiveApp) {
                  guard let urlString = app.ipaURL, let url = URL(string: urlString) else { return }
                  if let existing = tasks.first(where: { $0.appId == app.id }) {
                      resume(task: existing)
                      return
                  }
                  let chunkSize = AppConstants.chunkSizeBytes
                  var task = DownloadTask(
                      id: UUID().uuidString,
                      appId: app.id,
                      appName: app.name,
                      source: app.source,
                      url: urlString,
                      totalSize: app.sizeBytes ?? 0,
                      chunkSize: chunkSize,
                      chunks: [],
                      status: "queued",
                      bytesDownloaded: 0,
                      createdAt: Date(),
                      updatedAt: Date(),
                      destinationPath: nil,
                      lastError: nil
                  )
                  if task.totalSize == 0 {
                      // Try a HEAD request to learn the real size
                      Task { await probeSizeAndPlan(url: url, task: &task) }
                  } else {
                      planChunks(for: &task)
                  }
                  tasks.append(task)
                  persist()
                  NotificationManager.shared.notifyDownloadStarted(appName: app.name, appId: app.id.hashValue)
                  Task { await runTask(id: task.id) }
              }

              func pause(appId: String) {
                  guard let idx = tasks.firstIndex(where: { $0.appId == appId }) else { return }
                  tasks[idx].status = "paused"
                  tasks[idx].updatedAt = Date()
                  persist()
              }

              func resume(appId: String) {
                  guard let task = tasks.first(where: { $0.appId == appId }) else { return }
                  resume(task: task)
              }

              func cancel(appId: String) {
                  tasks.removeAll { $0.appId == appId }
                  DiskCache.shared.removeAllChunks(appId: appId)
                  persist()
              }

              func task(forAppId appId: String) -> DownloadTask? {
                  return tasks.first { $0.appId == appId }
              }

              // MARK: - Planning

              private func probeSizeAndPlan(url: URL, task: inout DownloadTask) async {
                  var req = URLRequest(url: url)
                  req.httpMethod = "HEAD"
                  do {
                      let (_, resp) = try await URLSession.shared.data(for: req)
                      if let http = resp as? HTTPURLResponse, let lenStr = http.value(forHTTPHeaderField: "Content-Length"), let len = Int64(lenStr) {
                          task.totalSize = len
                      }
                  } catch {
                      // fall back: assume unknown
                  }
                  planChunks(for: &task)
                  await runTask(id: task.id)
              }

              private func planChunks(for task: inout DownloadTask) {
                  guard task.totalSize > 0 else { return }
                  let n = Int((task.totalSize + Int64(task.chunkSize) - 1) / Int64(task.chunkSize))
                  var chunks: [DownloadChunk] = []
                  for i in 0..<n {
                      let offset = Int64(i) * Int64(task.chunkSize)
                      let length = min(Int64(task.chunkSize), task.totalSize - offset)
                      chunks.append(DownloadChunk(index: i, offset: offset, length: length, downloaded: false))
                  }
                  task.chunks = chunks
              }

              // MARK: - Run

              private func runTask(id: String) async {
                  guard let idx = tasks.firstIndex(where: { $0.id == id }) else { return }
                  if tasks[idx].totalSize == 0 { tasks[idx].totalSize = 1 } // guard div by zero
                  tasks[idx].status = "running"
                  persist()
                  await withTaskGroup(of: Void.self) { group in
                      var inFlight = 0
                      while let next = nextPendingChunk(in: id) {
                          if tasks.first(where: { $0.id == id })?.status == "paused" { break }
                          while inFlight >= AppConstants.maxConcurrentChunks {
                              await group.next()
                              inFlight -= 1
                          }
                          group.addTask { await self.downloadChunk(taskId: id, chunkIndex: next) }
                          inFlight += 1
                      }
                      await group.waitForAll()
                  }
                  await finalize(taskId: id)
              }

              private func resume(task: DownloadTask) {
                  guard let idx = tasks.firstIndex(where: { $0.id == task.id }) else { return }
                  tasks[idx].status = "running"
                  tasks[idx].updatedAt = Date()
                  persist()
                  Task { await runTask(id: task.id) }
              }

              private func nextPendingChunk(in taskId: String) -> Int? {
                  guard let idx = tasks.firstIndex(where: { $0.id == taskId }) else { return nil }
                  return tasks[idx].chunks.firstIndex(where: { !$0.downloaded })
              }

              private func downloadChunk(taskId: String, chunkIndex: Int) async {
                  guard let idx = tasks.firstIndex(where: { $0.id == taskId }) else { return }
                  guard let url = URL(string: tasks[idx].url) else { return }
                  let chunk = tasks[idx].chunks[chunkIndex]
                  let appId = tasks[idx].appId
                  let fileURL = DiskCache.shared.chunkFileURL(appId: appId, chunkIndex: chunkIndex)

                  // Already on disk? Skip.
                  if FileManager.default.fileExists(atPath: fileURL.path),
                     let attrs = try? FileManager.default.attributesOfItem(atPath: fileURL.path),
                     let s = attrs[.size] as? Int64, s == chunk.length {
                      markChunkDone(taskId: taskId, chunkIndex: chunkIndex, bytes: chunk.length)
                      return
                  }

                  var req = URLRequest(url: url)
                  let endByte = chunk.offset + chunk.length - 1
                  req.setValue("bytes=\(chunk.offset)-\(endByte)", forHTTPHeaderField: "Range")
                  do {
                      let (data, _) = try await URLSession.shared.data(for: req)
                      if data.count == Int(chunk.length) {
                          try? data.write(to: fileURL, options: .atomic)
                          markChunkDone(taskId: taskId, chunkIndex: chunkIndex, bytes: Int64(data.count))
                      } else {
                          // Server returned less than requested; still treat as done for this chunk
                          try? data.write(to: fileURL, options: .atomic)
                          markChunkDone(taskId: taskId, chunkIndex: chunkIndex, bytes: Int64(data.count))
                      }
                  } catch {
                      if let i = tasks.firstIndex(where: { $0.id == taskId }) {
                          tasks[i].lastError = error.localizedDescription
                          tasks[i].status = "paused"
                          tasks[i].updatedAt = Date()
                          persist()
                          NotificationManager.shared.notifyDownloadFailed(
                              appName: tasks[i].appName,
                              appId: tasks[i].appId.hashValue,
                              reason: error.localizedDescription
                          )
                      }
                  }
              }

              private func markChunkDone(taskId: String, chunkIndex: Int, bytes: Int64) {
                  guard let i = tasks.firstIndex(where: { $0.id == taskId }) else { return }
                  tasks[i].chunks[chunkIndex].downloaded = true
                  tasks[i].bytesDownloaded += bytes
                  tasks[i].updatedAt = Date()
                  persist()
              }

              private func finalize(taskId: String) async {
                  guard let i = tasks.firstIndex(where: { $0.id == taskId }) else { return }
                  let task = tasks[i]
                  if task.chunks.allSatisfy({ $0.downloaded }) {
                      // Assemble final file by concatenating chunks
                      let finalURL = DiskCache.shared.finalFileURL(appId: task.appId, name: task.appName)
                      try? FileManager.default.removeItem(at: finalURL)
                      FileManager.default.createFile(atPath: finalURL.path, contents: nil)
                      guard let handle = try? FileHandle(forWritingTo: finalURL) else { return }
                      for (idx, _) in task.chunks.enumerated() {
                          let chunkURL = DiskCache.shared.chunkFileURL(appId: task.appId, chunkIndex: idx)
                          if let data = try? Data(contentsOf: chunkURL) {
                              try? handle.write(contentsOf: data)
                          }
                      }
                      try? handle.close()
                      tasks[i].destinationPath = finalURL.path
                      tasks[i].status = "done"
                      persist()
                      DiskCache.shared.removeAllChunks(appId: task.appId)
                      NotificationManager.shared.notifyDownloadCompleted(
                          appName: task.appName,
                          appId: task.appId.hashValue
                      )
                  }
              }

              // MARK: - Persistence
              private func persist() {
                  if let data = try? JSONEncoder().encode(tasks) {
                      try? data.write(to: persistenceURL, options: .atomic)
                  }
              }
              private func load() {
                  guard let data = try? Data(contentsOf: persistenceURL),
                        let arr  = try? JSONDecoder().decode([DownloadTask].self, from: data) else { return }
                  self.tasks = arr
              }
          }
          VIPEOF

      # =========================================================
      # SOURCE CODE - SourcesManager.swift
      # Multi-source fetcher with health checks, fallback URLs,
      # and bundled defaults (covers the case when the device
      # is offline on first launch).
      # =========================================================
      - name: Generate code - SourcesManager.swift
        run: |
          cat > SourcesManager.swift << 'VIPEOF'
          import Foundation
          import Combine

          struct SourceHealth: Codable, Hashable {
              var source: String
              var ok: Bool
              var latencyMs: Int
              var lastChecked: Date
              var failureCount: Int
          }

          /// Manages multiple external "download libraries" (sources),
          /// each one returning a JSON metadata file of `MassiveApp`
          /// entries. The manager:
          ///   - ships with a default list of well-known repositories
          ///   - allows the user to add / disable / re-order sources
          ///   - runs a health check on each enabled source
          ///   - parallel-fetches the enabled sources on first launch
          ///     and on pull-to-refresh
          ///   - merges all results into a single deduplicated feed
          @MainActor
          final class SourcesManager: ObservableObject {

              static let shared = SourcesManager()

              @Published private(set) var sources: [StoreSource] = []
              @Published private(set) var health: [String: SourceHealth] = [:]
              @Published private(set) var mergedApps: [MassiveApp] = []
              @Published private(set) var isLoading: Bool = false
              @Published private(set) var lastError: String? = nil
              @Published var enabledSourceIds: Set<String> = []

              private let storeKey = "21sEnabledSources"
              private let healthKey = "21sSourceHealth"
              private let metaCacheRegion: URL

              private init() {
                  self.metaCacheRegion = DiskCache.shared.rootURL.appendingPathComponent("meta", isDirectory: true)
                  loadDefaults()
                  loadEnabled()
                  loadHealth()
              }

              // MARK: - Defaults
              private func loadDefaults() {
                  // Hard-coded defaults so the app works offline on
                  // first launch. Users can later add custom sources.
                  sources = [
                      StoreSource(
                          id: "apptesters",
                          displayName: "AppTesters",
                          homepage: "https://repository.apptesters.org",
                          metadataURL: "https://repository.apptesters.org/apps.json",
                          fallbackMetadataURLs: [
                              "https://raw.githubusercontent.com/apptesters-org/apptesters/main/apps.json"
                          ],
                          priority: 0,
                          enabledByDefault: true,
                          category: "all",
                          expectedAppCount: 12000
                      ),
                      StoreSource(
                          id: "iosninja",
                          displayName: "iOS Ninja",
                          homepage: "https://iosninja.io",
                          metadataURL: "https://iosninja.io/api/apps.json",
                          fallbackMetadataURLs: [
                              "https://iosninja.io/feed.json"
                          ],
                          priority: 1,
                          enabledByDefault: true,
                          category: "tweak",
                          expectedAppCount: 4200
                      ),
                      StoreSource(
                          id: "appcake",
                          displayName: "AppCake",
                          homepage: "https://appcake.net",
                          metadataURL: "https://appcake.net/api/list.json",
                          fallbackMetadataURLs: [
                              "https://appcake.net/feed/v3.json"
                          ],
                          priority: 2,
                          enabledByDefault: true,
                          category: "ipa",
                          expectedAppCount: 3800
                      ),
                      StoreSource(
                          id: "ipalibrary",
                          displayName: "iPA Library",
                          homepage: "https://ipa-library.net",
                          metadataURL: "https://ipa-library.net/feed/apps.json",
                          fallbackMetadataURLs: [
                              "https://raw.githubusercontent.com/ipa-library/feed/main/apps.json"
                          ],
                          priority: 3,
                          enabledByDefault: false,
                          category: "all",
                          expectedAppCount: 2200
                      ),
                      StoreSource(
                          id: "tweakbox",
                          displayName: "TweakBox",
                          homepage: "https://tweak-box.com",
                          metadataURL: "https://tweak-box.com/feed/apps.json",
                          fallbackMetadataURLs: [],
                          priority: 4,
                          enabledByDefault: false,
                          category: "tweak",
                          expectedAppCount: 1500
                      )
                  ]
              }

              // MARK: - Enabled set
              private func loadEnabled() {
                  if let data = UserDefaults.standard.data(forKey: storeKey),
                     let arr  = try? JSONDecoder().decode([String].self, from: data) {
                      enabledSourceIds = Set(arr)
                  } else {
                      enabledSourceIds = Set(sources.filter { $0.enabledByDefault }.map { $0.id })
                  }
              }
              private func saveEnabled() {
                  if let data = try? JSONEncoder().encode(Array(enabledSourceIds)) {
                      UserDefaults.standard.set(data, forKey: storeKey)
                  }
              }
              func setEnabled(_ id: String, _ on: Bool) {
                  if on { enabledSourceIds.insert(id) } else { enabledSourceIds.remove(id) }
                  saveEnabled()
              }

              // MARK: - Health
              private func loadHealth() {
                  if let data = UserDefaults.standard.data(forKey: healthKey),
                     let dict = try? JSONDecoder().decode([String: SourceHealth].self, from: data) {
                      health = dict
                  }
              }
              private func saveHealth() {
                  if let data = try? JSONEncoder().encode(health) {
                      UserDefaults.standard.set(data, forKey: healthKey)
                  }
              }

              // MARK: - Refresh
              func refreshAll() async {
                  isLoading = true
                  lastError = nil
                  var allApps: [MassiveApp] = []
                  await withTaskGroup(of: [MassiveApp].self) { group in
                      for src in sources where enabledSourceIds.contains(src.id) {
                          group.addTask { await self.fetch(source: src) }
                      }
                      for await chunk in group {
                          allApps.append(contentsOf: chunk)
                      }
                  }
                  mergedApps = Self.dedupe(allApps)
                  isLoading = false
                  if mergedApps.isEmpty, let first = sources.first(where: { enabledSourceIds.contains($0.id) }) {
                      lastError = "Could not load any source. Checked: \(first.displayName)."
                  }
              }

              /// Loads the cached merged list without hitting the network.
              /// Used on the first frame to keep the UI snappy.
              func loadFromDiskIfAvailable() {
                  if mergedApps.isEmpty {
                      // Try to assemble from per-source cached JSON
                      var all: [MassiveApp] = []
                      for src in sources {
                          if let data = DiskCache.shared.read(forKey: src.id, in: metaCacheRegion) {
                              if let m = try? JSONDecoder().decode(MassiveMetadata.self, from: data) {
                                  all.append(contentsOf: m.apps)
                              }
                          }
                      }
                      if !all.isEmpty { mergedApps = Self.dedupe(all) }
                  }
              }

              // MARK: - Network
              private func fetch(source: StoreSource) async -> [MassiveApp] {
                  let urls = [source.metadataURL] + source.fallbackMetadataURLs
                  for urlStr in urls {
                      guard let url = URL(string: urlStr) else { continue }
                      let start = Date()
                      do {
                          var req = URLRequest(url: url)
                          req.timeoutInterval = 12
                          req.setValue("21s/1.0 iOS", forHTTPHeaderField: "User-Agent")
                          let (data, _) = try await URLSession.shared.data(for: req)
                          let ms = Int(Date().timeIntervalSince(start) * 1000)
                          // Cache raw JSON for offline
                          DiskCache.shared.write(data, forKey: source.id, in: metaCacheRegion)
                          if let m = try? JSONDecoder().decode(MassiveMetadata.self, from: data) {
                              recordHealth(source: source.id, ok: true, latencyMs: ms)
                              return m.apps
                          }
                          // Fall back: try the legacy StoreAPIResponse format
                          if let legacy = try? JSONDecoder().decode(LegacyAppList.self, from: data) {
                              recordHealth(source: source.id, ok: true, latencyMs: ms)
                              return legacy.apps.map { $0.toMassive(source: source.id) }
                          }
                      } catch {
                          recordHealth(source: source.id, ok: false, latencyMs: 0, failed: true)
                          continue
                      }
                  }
                  return []
              }

              private func recordHealth(source: String, ok: Bool, latencyMs: Int, failed: Bool = false) {
                  var h = health[source] ?? SourceHealth(source: source, ok: true, latencyMs: 0, lastChecked: Date(), failureCount: 0)
                  h.ok = ok
                  h.latencyMs = latencyMs
                  h.lastChecked = Date()
                  if failed { h.failureCount += 1 }
                  health[source] = h
                  saveHealth()
              }

              // MARK: - Dedupe by (source, bundleId)
              static func dedupe(_ apps: [MassiveApp]) -> [MassiveApp] {
                  var seen: [String: MassiveApp] = [:]
                  for a in apps {
                      let key = (a.bundleId?.lowercased() ?? "") + "|" + a.source
                      if seen[key] == nil { seen[key] = a }
                  }
                  return Array(seen.values).sorted { $0.name.lowercased() < $1.name.lowercased() }
              }

              // MARK: - Search
              func search(_ query: String, category: String? = nil) -> [MassiveApp] {
                  let q = query.lowercased().trimmingCharacters(in: .whitespaces)
                  return mergedApps.filter { app in
                      let catMatch: Bool = {
                          guard let c = category, !c.isEmpty else { return true }
                          return (app.category ?? "").lowercased() == c.lowercased()
                      }()
                      if !catMatch { return false }
                      if q.isEmpty { return true }
                      let hay = [
                          app.name,
                          app.subtitle ?? "",
                          app.bundleId ?? "",
                          app.developer ?? "",
                          (app.tags ?? []).joined(separator: " ")
                      ].joined(separator: " ").lowercased()
                      return hay.contains(q)
                  }
              }
          }

          // MARK: - Legacy compatibility
          struct LegacyAppList: Codable {
              let apps: [LegacyApp]
              struct LegacyApp: Codable {
                  let name: String
                  let bundleID: String?
                  let down: String?
                  let downloadURL: String?
                  let icon: String?
                  let iconURL: String?
                  let version: String?
                  let size: Double?
                  let localizedDescription: String?

                  func toMassive(source: String) -> MassiveApp {
                      let bundle = bundleID ?? "unknown"
                      let id = (source + ":" + bundle).sha256Short
                      let url = down ?? downloadURL
                      return MassiveApp(
                          id: id,
                          name: name,
                          subtitle: nil,
                          bundleId: bundle,
                          developer: nil,
                          category: nil,
                          iconURL: icon ?? iconURL,
                          version: version,
                          sizeBytes: size.map { Int64($0) },
                          ipaURL: url,
                          source: source,
                          updatedAt: nil,
                          rating: nil,
                          downloads: nil,
                          requiredOS: nil,
                          isPremium: nil,
                          tags: nil
                      )
                  }
              }
          }

          extension String {
              fileprivate var sha256Short: String {
                  let h = SHA256.hash(data: Data(self.utf8))
                  return h.map { String(format: "%02x", $0) }.joined().prefix(32).description
              }
          }
          VIPEOF

