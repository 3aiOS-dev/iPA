      - name: Generate code - StatusScreens.swift
        run: |
          cat > StatusScreens.swift << 'STATUSEOF'
          import SwiftUI
          import Network
          import UIKit
          import Foundation

          enum StatusKind: Equatable {
              case ok
              case noInternet
          }

          @MainActor
          final class StatusCenter: ObservableObject {
              static let shared = StatusCenter()

              @Published var kind: StatusKind = .ok
              @Published var hasShownFirstWelcome: Bool = false

              private let monitor = NWPathMonitor()
              private let queue = DispatchQueue(label: "com.21s.status.monitor")
              private var didStart = false

              private init() {}

              func start() {
                  guard !didStart else { return }
                  didStart = true
                  monitor.pathUpdateHandler = { [weak self] path in
                      guard let self else { return }
                      DispatchQueue.main.async {
                          self.evaluate(currentPath: path)
                      }
                  }
                  monitor.start(queue: queue)
                  evaluate(currentPath: monitor.currentPath)
              }

              func refresh() {
                  evaluate(currentPath: monitor.currentPath)
              }

              private func evaluate(currentPath: NWPath) {
                  let online = (currentPath.status == .satisfied)
                  if !online {
                      if kind != .noInternet {
                          HapticManager.shared.error()
                      }
                      kind = .noInternet
                      return
                  }
                  kind = .ok
              }
          }

          struct GifOnlyView: UIViewRepresentable {
              let resourceName: String
              func makeUIView(context: Context) -> UIView {
                  let container = UIView()
                  container.backgroundColor = .clear
                  let imageView = UIImageView()
                  imageView.contentMode = .scaleAspectFit
                  imageView.translatesAutoresizingMaskIntoConstraints = false
                  imageView.clipsToBounds = true
                  container.addSubview(imageView)
                  NSLayoutConstraint.activate([
                      imageView.topAnchor.constraint(equalTo: container.topAnchor),
                      imageView.bottomAnchor.constraint(equalTo: container.bottomAnchor),
                      imageView.leadingAnchor.constraint(equalTo: container.leadingAnchor),
                      imageView.trailingAnchor.constraint(equalTo: container.trailingAnchor)
                  ])
                  if let gif = UIImage.gif(name: resourceName) {
                      imageView.image = gif
                  } else if let png = UIImage.bundled("\(resourceName).png") {
                      imageView.image = png
                  }
                  return container
              }
              func updateUIView(_ uiView: UIView, context: Context) {}
          }

          struct NoInternetScreen: View {
              var onRetry: () -> Void
              @State private var animatePulse = false

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color(red: 0.06, green: 0.07, blue: 0.14),
                              Color(red: 0.10, green: 0.12, blue: 0.22),
                              Color(red: 0.05, green: 0.05, blue: 0.10)
                          ],
                          startPoint: .topLeading, endPoint: .bottomTrailing
                      )
                      .edgesIgnoringSafeArea(.all)

                      Circle()
                          .fill(Color.storePrimary.opacity(0.18))
                          .frame(width: 320, height: 320)
                          .blur(radius: 60)
                          .scaleEffect(animatePulse ? 1.05 : 0.95)
                          .animation(.easeInOut(duration: 2.4).repeatForever(autoreverses: true), value: animatePulse)

                      VStack(spacing: 22) {
                          GifOnlyView(resourceName: "no_internet")
                              .frame(width: 240, height: 240)
                              .background(
                                  RoundedRectangle(cornerRadius: 28)
                                      .fill(Color.white.opacity(0.04))
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 28)
                                              .stroke(Color.white.opacity(0.08), lineWidth: 1)
                                      )
                              )
                              .shadow(color: Color.storePrimary.opacity(0.35), radius: 24, y: 8)

                          VStack(spacing: 10) {
                              Text("No Connection")
                                  .font(.system(size: 28, weight: .heavy))
                                  .foregroundColor(.white)
                              Text("Looks like you're offline.\nCheck your Wi-Fi or mobile data and try again.")
                                  .font(.system(size: 14, weight: .medium))
                                  .foregroundColor(.white.opacity(0.7))
                                  .multilineTextAlignment(.center)
                                  .lineSpacing(3)
                          }

                          Button(action: {
                              HapticManager.shared.impact(.medium)
                              onRetry()
                          }) {
                              HStack(spacing: 8) {
                                  Image(systemName: "arrow.clockwise")
                                      .font(.system(size: 14, weight: .bold))
                                  Text("Try Again")
                                      .font(.system(size: 15, weight: .bold))
                              }
                              .foregroundColor(.white)
                              .frame(maxWidth: .infinity)
                              .frame(height: 52)
                              .background(
                                  Capsule().fill(
                                      LinearGradient(colors: [Color.storePrimary, Color.storePrimaryDk],
                                                     startPoint: .leading, endPoint: .trailing)
                                  )
                              )
                              .shadow(color: Color.storePrimary.opacity(0.4), radius: 12, y: 6)
                          }
                          .padding(.horizontal, 40)
                          .padding(.top, 4)
                      }
                      .padding(.horizontal, 24)
                  }
                  .onAppear { animatePulse = true }
                  .preferredColorScheme(.dark)
              }
          }

          struct StatusOverlayHost: View {
              @ObservedObject var center = StatusCenter.shared

              var body: some View {
                  Group {
                      switch center.kind {
                      case .ok:
                          EmptyView()
                      case .noInternet:
                          NoInternetScreen {
                              HapticManager.shared.impact(.light)
                              center.refresh()
                          }
                          .transition(.opacity.combined(with: .scale(scale: 1.02)))
                      }
                  }
                  .animation(.easeInOut(duration: 0.25), value: center.kind)
              }
          }
          STATUSEOF

