          import SwiftUI
          import UIKit

          /// The new "Apps" tab.
          ///
          /// Handles 20,000+ apps by:
          ///   - holding only the visible page + buffer in memory
          ///   - debouncing search input (250 ms)
          ///   - virtualized rows (LazyVStack)
          ///   - in-memory category / source filters
          ///   - chunked, resumable downloads via ChunkedDownloader
          struct AppsFeedView: View {
              @ObservedObject var sources: SourcesManager
              @ObservedObject var downloader = ChunkedDownloader.shared

              @State private var query: String = ""
              @State private var debouncedQuery: String = ""
              @State private var selectedCategory: String? = nil
              @State private var debounceTask: Task<Void, Never>? = nil
              @State private var page: Int = 0
              @State private var refreshing: Bool = false

              private let pageSize = AppConstants.pageSize

              private var allMatches: [MassiveApp] {
                  sources.search(debouncedQuery, category: selectedCategory)
              }

              private var pagedApps: [MassiveApp] {
                  let end = min(allMatches.count, (page + 1) * pageSize)
                  return Array(allMatches.prefix(end))
              }

              private var categories: [String] {
                  let set = Set(sources.mergedApps.compactMap { $0.category?.lowercased() })
                  return Array(set).sorted()
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          searchBar
                          sourceStatusBar
                          categoryStrip
                          feed
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationTitle("Apps")
                      .toolbar {
                          ToolbarItem(placement: .topBarTrailing) {
                              Button { Task { await refresh() } } label: {
                                  if refreshing {
                                      ProgressView().controlSize(.small)
                                  } else {
                                      Image(systemName: "arrow.clockwise")
                                  }
                              }
                          }
                      }
                      .task {
                          sources.loadFromDiskIfAvailable()
                          if sources.mergedApps.isEmpty {
                              await refresh()
                          }
                      }
                  }
              }

              // MARK: - Search bar
              private var searchBar: some View {
                  HStack(spacing: 10) {
                      Image(systemName: "magnifyingglass")
                          .foregroundColor(.storeSub)
                      TextField("Search 20,000+ apps", text: $query)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled(true)
                          .onChange(of: query) { _, newValue in
                              debounceTask?.cancel()
                              debounceTask = Task {
                                  try? await Task.sleep(nanoseconds: UInt64(AppConstants.searchDebounceMs) * 1_000_000)
                                  if !Task.isCancelled {
                                      await MainActor.run {
                                          debouncedQuery = newValue
                                          page = 0
                                      }
                                  }
                              }
                          }
                      if !query.isEmpty {
                          Button {
                              query = ""
                              debouncedQuery = ""
                              page = 0
                          } label: {
                              Image(systemName: "xmark.circle.fill")
                                  .foregroundColor(.storeSub)
                          }
                      }
                  }
                  .padding(.horizontal, 14)
                  .padding(.vertical, 10)
                  .background(
                      RoundedRectangle(cornerRadius: 12)
                          .fill(Color.storeCard)
                          .overlay(
                              RoundedRectangle(cornerRadius: 12)
                                  .stroke(Color.storeDivider, lineWidth: 0.5)
                          )
                  )
                  .padding(.horizontal, 16)
                  .padding(.top, 8)
              }

              // MARK: - Source health bar
              private var sourceStatusBar: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack(spacing: 8) {
                          ForEach(sources.sources) { src in
                              let h = sources.health[src.id]
                              let ok = (h?.ok ?? true) && sources.enabledSourceIds.contains(src.id)
                              HStack(spacing: 4) {
                                  Circle()
                                      .fill(ok ? Color.storeGreen : Color.storeRed)
                                      .frame(width: 8, height: 8)
                                  Text(src.displayName)
                                      .font(.system(size: 12, weight: .semibold))
                                      .foregroundColor(.storeText)
                                  if let ms = h?.latencyMs, ms > 0 {
                                      Text("\(ms)ms")
                                          .font(.system(size: 10))
                                          .foregroundColor(.storeSub)
                                  }
                              }
                              .padding(.horizontal, 10)
                              .padding(.vertical, 6)
                              .background(
                                  Capsule().fill(ok ? Color.storeGreenBg : Color.storeRedBg)
                              )
                              .onTapGesture {
                                  sources.setEnabled(src.id, !sources.enabledSourceIds.contains(src.id))
                              }
                          }
                      }
                      .padding(.horizontal, 16)
                      .padding(.vertical, 8)
                  }
              }

              // MARK: - Categories
              private var categoryStrip: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack(spacing: 8) {
                          chip("All", value: nil)
                          ForEach(categories, id: \.self) { c in
                              chip(c.capitalized, value: c)
                          }
                      }
                      .padding(.horizontal, 16)
                      .padding(.bottom, 8)
                  }
              }
              private func chip(_ label: String, value: String?) -> some View {
                  let isActive = selectedCategory == value
                  return Text(label)
                      .font(.system(size: 13, weight: .semibold))
                      .padding(.horizontal, 14)
                      .padding(.vertical, 7)
                      .background(
                          Capsule()
                              .fill(isActive ? Color.storePrimary : Color.storeCard)
                      )
                      .foregroundColor(isActive ? .white : .storeText)
                      .overlay(
                          Capsule()
                              .stroke(isActive ? Color.clear : Color.storeDivider, lineWidth: 0.5)
                      )
                      .onTapGesture {
                          selectedCategory = value
                          page = 0
                      }
              }

              // MARK: - Feed (paginated)
              @ViewBuilder
              private var feed: some View {
                  if sources.isLoading && sources.mergedApps.isEmpty {
                      VStack(spacing: 16) {
                          ProgressView()
                          Text("Loading apps from \(sources.enabledSourceIds.count) libraries…")
                              .font(.system(size: 13))
                              .foregroundColor(.storeSub)
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                  } else if let err = sources.lastError, sources.mergedApps.isEmpty {
                      VStack(spacing: 16) {
                          Image(systemName: "wifi.exclamationmark")
                              .font(.system(size: 40))
                              .foregroundColor(.storeSub)
                          Text(err)
                              .multilineTextAlignment(.center)
                              .foregroundColor(.storeSub)
                              .padding(.horizontal, 24)
                          Button("Retry") { Task { await refresh() } }
                              .buttonStyle(.borderedProminent)
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                  } else {
                      ScrollView {
                          LazyVStack(spacing: 10) {
                              // Header counter
                              HStack {
                                  Text("\(allMatches.count) apps")
                                      .font(.system(size: 12, weight: .semibold))
                                      .foregroundColor(.storeSub)
                                  Spacer()
                                  if let src = sources.mergedApps.first?.source {
                                      Text("via \(src)")
                                          .font(.system(size: 11))
                                          .foregroundColor(.storeSub)
                                  }
                              }
                              .padding(.horizontal, 16)
                              .padding(.top, 6)

                              ForEach(pagedApps) { app in
                                  MassiveAppRow(
                                      app: app,
                                      task: downloader.task(forAppId: app.id)
                                  ) {
                                      downloader.start(app: app)
                                  } onPause: {
                                      downloader.pause(appId: app.id)
                                  } onResume: {
                                      downloader.resume(appId: app.id)
                                  } onCancel: {
                                      downloader.cancel(appId: app.id)
                                  }
                                  .onAppear {
                                      // Infinite scroll trigger
                                      if app.id == pagedApps.last?.id {
                                          let nextPageEnd = (page + 1) * pageSize
                                          if nextPageEnd < allMatches.count {
                                              page += 1
                                          }
                                      }
                                  }
                              }
                          }
                          .padding(.horizontal, 16)
                          .padding(.bottom, 24)
                      }
                  }
              }

              private func refresh() async {
                  refreshing = true
                  await sources.refreshAll()
                  refreshing = false
              }
          }

          // MARK: - One row
          struct MassiveAppRow: View {
              let app: MassiveApp
              let task: DownloadTask?
              let onDownload: () -> Void
              let onPause: () -> Void
              let onResume: () -> Void
