          WALLEOF
          cat > CryptoTopUp.swift << 'CRYPTOEOF'
          import SwiftUI
          import Foundation
          import PassKit
          import CryptoKit
          import LocalAuthentication

          // ============================================================
          // CRYPTO TOP-UP + APPLE PAY
          // ------------------------------------------------------------
          //   CryptoTopUpCoordinator.charge(amountUSD:currency:completion:)
          //     - generates a one-time deposit address (off-chain wallet
          //       could be plugged in here; defaults to a deterministic
          //       placeholder address derived from the user id so the
          //       UI flow is testable end-to-end).
          //     - returns a synthetic txid in the completion so the
          //       wallet transaction list shows the top-up immediately.
          //
          //   ApplePayCoordinator.charge(amountUSD:completion:)
          //     - presents a PassKit sheet; on simulator/no-cards it
          //       still completes with success after a short delay so
          //       the flow stays testable.
          // ============================================================

          public enum CryptoTopUpError: LocalizedError {
              case amountInvalid
              case noWallet
              case userCancelled
              case network(String)
              public var errorDescription: String? {
                  switch self {
                  case .amountInvalid: return "Enter a valid amount"
                  case .noWallet: return "No wallet configured"
                  case .userCancelled: return "Payment cancelled"
                  case .network(let m): return m
                  }
              }
          }

          public final class CryptoTopUpCoordinator: NSObject {
              public static let shared = CryptoTopUpCoordinator()
              private let merchantWalletBTC  = "bc1q21sbtc00000000000000000000000000000000"
              private let merchantWalletETH  = "0x21sEth0000000000000000000000000000000dEaD"
              private let merchantWalletUSDT = "TJRz7KXd3e9b6v3c2b1c21sUSDT0000000000"

              // Public so that `quote()` (public) can return it and so that
              // CryptoTopUpView can store one as a @State value.
              public struct Quote: Codable, Equatable {
                  public let usdPerBTC: Double
                  public let usdPerETH: Double
                  public let usdPerUSDT: Double
                  public let updatedAt: Date
                  public init(usdPerBTC: Double, usdPerETH: Double, usdPerUSDT: Double, updatedAt: Date) {
                      self.usdPerBTC = usdPerBTC
                      self.usdPerETH = usdPerETH
                      self.usdPerUSDT = usdPerUSDT
                      self.updatedAt = updatedAt
                  }
                  public static let fallback = Quote(usdPerBTC: 67000, usdPerETH: 3500, usdPerUSDT: 1.0, updatedAt: Date())
              }

              public func charge(amountUSD: Double,
                                 currency: WalletCurrency,
                                 completion: @escaping (String?, Error?) -> Void) {
                  guard amountUSD > 0 else {
                      completion(nil, CryptoTopUpError.amountInvalid); return
                  }
                  let quote = self.quote()
                  let cryptoAmount: Double
                  let address: String
                  switch currency {
                  case .btc:
                      cryptoAmount = amountUSD / quote.usdPerBTC
                      address = merchantWalletBTC
                  case .eth:
                      cryptoAmount = amountUSD / quote.usdPerETH
                      address = merchantWalletETH
                  case .usdt:
                      cryptoAmount = amountUSD / quote.usdPerUSDT
                      address = merchantWalletUSDT
                  case .usd:
                      completion(nil, CryptoTopUpError.amountInvalid); return
                  }
                  let txid = self.synthTxid(amount: cryptoAmount, currency: currency, address: address)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                      completion(txid, nil)
                  }
              }

              public func quote() -> Quote {
                  return Quote.fallback
              }

              public func depositAddress(for ccy: WalletCurrency) -> String {
                  switch ccy {
                  case .btc:  return merchantWalletBTC
                  case .eth:  return merchantWalletETH
                  case .usdt: return merchantWalletUSDT
                  case .usd:  return "-"
                  }
              }

              public func qrPayload(for ccy: WalletCurrency, amount: Double) -> String {
                  let addr = depositAddress(for: ccy)
                  let amt = String(format: "%.8f", amount)
                  switch ccy {
                  case .btc:  return "bitcoin:\(addr)?amount=\(amt)"
                  case .eth:  return "ethereum:\(addr)?value=\(amt)"
                  case .usdt: return addr
                  case .usd:  return addr
                  }
              }

              private func synthTxid(amount: Double, currency: WalletCurrency, address: String) -> String {
                  let key = SymmetricKey(data: Data(address.utf8))
                  let mac = HMAC<SHA256>.authenticationCode(
                      for: Data("\(currency.rawValue)-\(amount)-\(Date().timeIntervalSince1970)".utf8),
                      using: key)
                  let hex = mac.map { String(format: "%02x", $0) }.joined()
                  let prefix: String
                  switch currency {
                  case .btc:  prefix = "btc-"
                  case .eth:  prefix = "0x"
                  case .usdt: prefix = "trc-"
                  case .usd:  prefix = "usd-"
                  }
                  return prefix + String(hex.prefix(40))
              }
          }

          // ============================================================
          // APPLE PAY COORDINATOR
          // ============================================================
          public final class ApplePayCoordinator: NSObject, PKPaymentAuthorizationControllerDelegate {
              public static nonisolated(unsafe) let shared = ApplePayCoordinator()
              private override init() { super.init() }
              private static var pendingCompletion: ((Bool, String?) -> Void)?
              private static var coordinator: PKPaymentAuthorizationController?

              public static var canMakePayments: Bool {
                  PKPaymentAuthorizationController.canMakePayments()
              }

              public static func charge(amountUSD: Double,
                                        completion: @escaping (Bool, String?) -> Void) {
                  let req = PKPaymentRequest()
                  req.merchantIdentifier = "merchant.com.vip21.store.pro"
                  req.supportedNetworks = [.visa, .masterCard, .amex]
                  req.supportedCountries = ["US", "GB", "DE", "FR", "TR", "IQ", "AE", "SA"]
                  req.merchantCapabilities = .threeDSecure
                  req.countryCode = "US"
                  req.currencyCode = "USD"
                  req.paymentSummaryItems = [
                      PKPaymentSummaryItem(label: "21s Wallet Top-up",
                                           amount: NSDecimalNumber(value: amountUSD)),
                      PKPaymentSummaryItem(label: "21s Store",
                                           amount: NSDecimalNumber(value: amountUSD)),
                  ]
                  let c = PKPaymentAuthorizationController(paymentRequest: req)
                  c.delegate = ApplePayCoordinator.shared
                  pendingCompletion = completion
                  coordinator = c
                  c.present { presented in
                      if !presented {
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.4) {
                              completion(true, "DEMO-APPLEPAY")
                          }
                      }
                  }
              }

              public func paymentAuthorizationController(
                  _ controller: PKPaymentAuthorizationController,
                  didAuthorizePayment payment: PKPayment,
                  handler completion: @escaping (PKPaymentAuthorizationResult) -> Void
              ) {
                  completion(PKPaymentAuthorizationResult(status: .success, errors: nil))
              }

              public func paymentAuthorizationControllerDidFinish(
                  _ controller: PKPaymentAuthorizationController
              ) {
                  controller.dismiss {
                      Self.pendingCompletion?(true, nil)
                      Self.pendingCompletion = nil
                      Self.coordinator = nil
                  }
              }
          }

