          // ================= RICH TEXT (hashtags / mentions) =================
          struct ONEsRichText: View {
              let text: String
              var baseSize: CGFloat = 15

              var body: some View {
                  let words = text.split(separator: " ", omittingEmptySubsequences: false).map(String.init)
                  var attr = AttributedString("")
                  for (i, w) in words.enumerated() {
                      var piece = AttributedString(w + (i == words.count - 1 ? "" : " "))
                      if w.hasPrefix("#") || w.hasPrefix("@") {
                          piece.foregroundColor = Color.storePrimary
                          piece.font = .system(size: baseSize, weight: .semibold)
                      } else {
                          piece.foregroundColor = Color.white.opacity(0.92)
                          piece.font = .system(size: baseSize)
                      }
                      attr.append(piece)
                  }
                  return Text(attr)
                      .multilineTextAlignment(.leading)
                      .fixedSize(horizontal: false, vertical: true)
              }
          }

          // ================= IMAGE PICKER (UIImagePickerController) =================
          struct ONEsImagePicker: UIViewControllerRepresentable {
              @Binding var image: UIImage?
              @Environment(\.dismiss) private var dismiss
              var sourceType: UIImagePickerController.SourceType = .photoLibrary

              func makeUIViewController(context: Context) -> UIImagePickerController {
                  let picker = UIImagePickerController()
                  picker.sourceType = UIImagePickerController.isSourceTypeAvailable(sourceType) ? sourceType : .photoLibrary
                  picker.delegate = context.coordinator
                  picker.allowsEditing = true
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIImagePickerController, context: Context) {}

              func makeCoordinator() -> Coordinator { Coordinator(self) }

              final class Coordinator: NSObject, UIImagePickerControllerDelegate, UINavigationControllerDelegate {
                  let parent: ONEsImagePicker
                  init(_ parent: ONEsImagePicker) { self.parent = parent }

                  func imagePickerController(_ picker: UIImagePickerController,
                                             didFinishPickingMediaWithInfo info: [UIImagePickerController.InfoKey: Any]) {
                      let img = (info[.editedImage] as? UIImage) ?? (info[.originalImage] as? UIImage)
                      if let img = img {
                          parent.image = ONEsImageUtil.resized(img, maxDim: 1280)
                      }
                      parent.dismiss()
                  }

                  func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {
                      parent.dismiss()
                  }
              }
          }

          enum ONEsImageUtil {
              static func resized(_ image: UIImage, maxDim: CGFloat) -> UIImage {
                  let w = image.size.width, h = image.size.height
                  let scale = min(1.0, maxDim / max(w, h))
                  if scale >= 1.0 { return image }
                  let newSize = CGSize(width: w * scale, height: h * scale)
                  let renderer = UIGraphicsImageRenderer(size: newSize)
                  return renderer.image { _ in image.draw(in: CGRect(origin: .zero, size: newSize)) }
              }

              static func avatarResized(_ image: UIImage, maxDim: CGFloat = 320) -> UIImage {
                  let r = resized(image, maxDim: maxDim)
                  // Square crop from center
                  let side = min(r.size.width, r.size.height)
                  let origin = CGPoint(x: (r.size.width - side) / 2, y: (r.size.height - side) / 2)
                  let renderer = UIGraphicsImageRenderer(size: CGSize(width: side, height: side))
                  return renderer.image { _ in
                      r.draw(at: CGPoint(x: -origin.x, y: -origin.y))
                  }
              }

              static func toBase64JPEG(_ image: UIImage, quality: CGFloat = 0.78) -> String {
                  guard let data = image.jpegData(compressionQuality: quality) else { return "" }
                  return "data:image/jpeg;base64," + data.base64EncodedString()
              }
          }

