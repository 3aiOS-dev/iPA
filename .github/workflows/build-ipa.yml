                  else { return }
                  ipaFiles = decoded.filter { fm.fileExists(atPath: $0.localPath) }
              }
          
              func saveIPAFiles() {
                  let url = documentsPath.appendingPathComponent("ipa_files.json")
                  if let data = try? JSONEncoder().encode(ipaFiles) { try? data.write(to: url) }
              }
          
              private func loadInstallHistory() {
                  let url = documentsPath.appendingPathComponent("install_history.json")
                  guard let data = try? Data(contentsOf: url),
                        let decoded = try? JSONDecoder().decode([InstallRecord].self, from: data)
                  else { return }
                  installHistory = decoded
              }
          
              func saveInstallHistory() {
                  let url = documentsPath.appendingPathComponent("install_history.json")
                  if let data = try? JSONEncoder().encode(installHistory) { try? data.write(to: url) }
              }
          
              private func loadFavorites() {
                  favoriteAppNames = Set(UserDefaults.standard.stringArray(forKey: "favoriteApps") ?? [])
              }
          
              func toggleFavorite(appName: String) {
                  if favoriteAppNames.contains(appName) { favoriteAppNames.remove(appName) }
                  else { favoriteAppNames.insert(appName); HapticManager.shared.impact(.light) }
                  UserDefaults.standard.set(Array(favoriteAppNames), forKey: "favoriteApps")
              }
          
              func isFavorite(_ appName: String) -> Bool { favoriteAppNames.contains(appName) }
          
              func startDownload(app: AppItem) {
                  guard let url = URL(string: app._secureDownloadURL) else { return }
                  let download = ActiveDownload(appName: app.name, appIconURL: app.iconURL, downloadURL: url, appItem: app)
                  download.destinationURL = documentsPath.appendingPathComponent("\(app.name).ipa")
                  download.status = .downloading
                  let task = urlSession.dataTask(with: url)
                  download.task = task
                  activeDownloads.append(download)
                  task.resume()
              }
          
              func importIPAFromURL(url: URL) {
                  let dest = documentsPath.appendingPathComponent(url.lastPathComponent)
                  do {
                      if fm.fileExists(atPath: dest.path) { try fm.removeItem(at: dest) }
                      try fm.copyItem(at: url, to: dest)
                      let attrs = try fm.attributesOfItem(atPath: dest.path)
                      let size = attrs[.size] as? Int64 ?? 0
                      let df = DateFormatter(); df.dateFormat = "yyyy-MM-dd"
                      let ipaFile = IPAFile(fileName: url.lastPathComponent, localPath: dest.path,
                                            originalURL: url.absoluteString,
                                            fileSize: ByteCountFormatter.string(fromByteCount: size, countStyle: .file),
                                            fileSizeBytes: size, date: df.string(from: Date()))
                      ipaFiles.insert(ipaFile, at: 0); saveIPAFiles()
                      HapticManager.shared.notification(.success)
                  } catch {
                      print("Import error: \(error)")
                  }
              }
          
              func markAsSigned(_ file: IPAFile, signedPath: String, certificateId: UUID) {
                  if let i = ipaFiles.firstIndex(where: { $0.id == file.id }) {
                      ipaFiles[i].isSigned = true
                      ipaFiles[i].signedPath = signedPath
                      ipaFiles[i].signingCertificateId = certificateId
                      saveIPAFiles()
                  }
              }
          
              func markAsInstalled(_ file: IPAFile, method: String) {
                  if let i = ipaFiles.firstIndex(where: { $0.id == file.id }) {
                      ipaFiles[i].isInstalled = true
                      ipaFiles[i].installDate = Date()
                      saveIPAFiles()
                      let record = InstallRecord(appName: file.fileName.replacingOccurrences(of: ".ipa", with: ""),
                                                 bundleID: "com.vip21.app", version: "1.0",
                                                 installDate: Date(), iconURL: "", installMethod: method)
                      installHistory.insert(record, at: 0)
                      saveInstallHistory()
                  }
              }
          
              func deleteIPAFile(_ file: IPAFile) {
                  try? fm.removeItem(atPath: file.localPath)
                  if let sp = file.signedPath { try? fm.removeItem(atPath: sp) }
                  ipaFiles.removeAll { $0.id == file.id }
                  saveIPAFiles()
              }
          
              func pauseDownload(_ download: ActiveDownload) {
                  download.task?.cancel()
                  download.status = .paused
              }
          
              func resumeDownload(_ download: ActiveDownload) {
                  download.status = .downloading
                  let task = urlSession.dataTask(with: download.downloadURL)
                  download.task = task
                  task.resume()
              }
          
              func cancelDownload(_ download: ActiveDownload) {
                  download.task?.cancel()
                  activeDownloads.removeAll { $0.id == download.id }
              }
          }
          
          extension IPADownloadManager: URLSessionDataDelegate {
              func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                  guard let dl = activeDownloads.first(where: { $0.task == dataTask }),
                        let dest = dl.destinationURL else { return }
                  dl.downloadedBytes += Int64(data.count)
                  if let total = dataTask.response?.expectedContentLength, total > 0 {
                      dl.totalBytes = total; dl.progress = Double(dl.downloadedBytes) / Double(total)
                  }
                  if fm.fileExists(atPath: dest.path) {
                      if let fh = try? FileHandle(forWritingTo: dest) {
                          fh.seekToEndOfFile(); fh.write(data); try? fh.close()
                      }
                  } else { fm.createFile(atPath: dest.path, contents: data) }
              }
          
              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let dl = activeDownloads.first(where: { $0.task == task }) else { return }
                  if let err = error {
                      dl.status = .failed; dl.errorMessage = err.localizedDescription
                  } else if let dest = dl.destinationURL, fm.fileExists(atPath: dest.path) {
                      dl.status = .completed; dl.progress = 1.0
                      let attrs = try? fm.attributesOfItem(atPath: dest.path)
                      let size = attrs?[.size] as? Int64 ?? 0
                      let df = DateFormatter(); df.dateFormat = "yyyy-MM-dd"
                      let ipa = IPAFile(fileName: dest.lastPathComponent, localPath: dest.path,
                                        originalURL: dl.downloadURL.absoluteString,
                                        fileSize: ByteCountFormatter.string(fromByteCount: size, countStyle: .file),
                                        fileSizeBytes: size, date: df.string(from: Date()))
                      ipaFiles.insert(ipa, at: 0); saveIPAFiles()
                      HapticManager.shared.notification(.success)
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2) {
                          self.activeDownloads.removeAll { $0.id == dl.id }
                      }
                  }
              }
          }
          VIPEOF

