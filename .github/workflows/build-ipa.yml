                      stepRow("2", "Friend signs up", "They get $5 wallet credit on day one.", .storePink)
                      stepRow("3", "You earn $5", "Unlimited rewards, paid in wallet credit.", .storeCyan)
                  }
                  .padding(16)
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                  .shadow(color: .black.opacity(0.05), radius: 6, y: 2)
              }
              private func stepRow(_ n: String, _ t: String, _ s: String, _ c: Color) -> some View {
                  HStack(alignment: .top, spacing: 10) {
                      Text(n)
                          .font(.system(size: 14, weight: .black))
                          .foregroundColor(.white)
