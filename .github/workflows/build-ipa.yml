      - name: 🎮 توليد GamificationSystem.swift
        run: |
          cat > GamificationSystem.swift << 'GSEOF'
          import SwiftUI
          import Foundation

          struct UserAchievement: Identifiable, Codable {
              let id: String
              let title: String
              let description: String
              let icon: String
              let color: String
              var isUnlocked: Bool
              var unlockedAt: Date?
              let requirement: Int
              let currentProgress: Int
          }

          struct UserLevel: Codable {
              var level: Int
              var xp: Int
              var totalDownloads: Int
              var totalShares: Int
              var totalSigns: Int

              var xpToNextLevel: Int { level * 1000 }
              var progress: Double { Double(xp) / Double(xpToNextLevel) }

              mutating func addXP(_ amount: Int) {
                  xp += amount
                  while xp >= xpToNextLevel {
                      xp -= xpToNextLevel
                      level += 1
                  }
              }
          }

          @MainActor
          class GamificationManager: ObservableObject {
              @Published var userLevel = UserLevel(level: 1, xp: 0, totalDownloads: 0, totalShares: 0, totalSigns: 0)
              @Published var achievements: [UserAchievement] = []
              @Published var showLevelUp = false
              @Published var newLevel = 1

              init() {
                  loadData()
                  setupAchievements()
              }

              private func setupAchievements() {
                  achievements = [
                      UserAchievement(id: "first_download", title: "أول تحميل", description: "حمّل أول تطبيق", icon: "arrow.down.circle.fill", color: "blue", isUnlocked: false, unlockedAt: nil, requirement: 1, currentProgress: 0),
                      UserAchievement(id: "download_10", title: "محترف التحميل", description: "حمّل 10 تطبيقات", icon: "10.circle.fill", color: "green", isUnlocked: false, unlockedAt: nil, requirement: 10, currentProgress: 0),
                      UserAchievement(id: "download_50", title: "أسطورة التحميل", description: "حمّل 50 تطبيقاً", icon: "50.circle.fill", color: "purple", isUnlocked: false, unlockedAt: nil, requirement: 50, currentProgress: 0),
                      UserAchievement(id: "first_share", title: "مشارك خير", description: "شارك تطبيقاً لأول مرة", icon: "square.and.arrow.up.fill", color: "orange", isUnlocked: false, unlockedAt: nil, requirement: 1, currentProgress: 0),
                      UserAchievement(id: "first_sign", title: "موقّع مبتدئ", description: "وقّع أول تطبيق", icon: "signature", color: "cyan", isUnlocked: false, unlockedAt: nil, requirement: 1, currentProgress: 0),
                      UserAchievement(id: "night_owl", title: "بومة الليل", description: "حمّل تطبيقاً بعد منتصف الليل", icon: "moon.fill", color: "indigo", isUnlocked: false, unlockedAt: nil, requirement: 1, currentProgress: 0),
                      UserAchievement(id: "speed_demon", title: "شيطان السرعة", description: "حمّل 5 تطبيقات في يوم واحد", icon: "bolt.fill", color: "yellow", isUnlocked: false, unlockedAt: nil, requirement: 5, currentProgress: 0)
                  ]
              }

              func recordDownload() {
                  userLevel.totalDownloads += 1
                  userLevel.addXP(100)
                  checkAchievements()
                  checkLevelUp()
                  saveData()
              }

              func recordShare() {
                  userLevel.totalShares += 1
                  userLevel.addXP(50)
                  checkAchievements()
                  saveData()
              }

              func recordSign() {
                  userLevel.totalSigns += 1
                  userLevel.addXP(200)
                  checkAchievements()
                  saveData()
              }

              private func checkAchievements() {
                  for i in achievements.indices {
                      var achievement = achievements[i]
                      switch achievement.id {
                      case "first_download":
                          achievement.currentProgress = userLevel.totalDownloads
                      case "download_10":
                          achievement.currentProgress = userLevel.totalDownloads
                      case "download_50":
                          achievement.currentProgress = userLevel.totalDownloads
                      case "first_share":
                          achievement.currentProgress = userLevel.totalShares
                      case "first_sign":
                          achievement.currentProgress = userLevel.totalSigns
                      default:
                          break
                      }

                      if achievement.currentProgress >= achievement.requirement && !achievement.isUnlocked {
                          achievements[i].isUnlocked = true
                          achievements[i].unlockedAt = Date()
                          achievements[i].currentProgress = achievement.currentProgress
                          HapticManager.shared.success()
                      }
                  }
              }

              private func checkLevelUp() {
                  if userLevel.xp >= userLevel.xpToNextLevel {
                      newLevel = userLevel.level + 1
                      showLevelUp = true
                  }
              }

              private func saveData() {
                  if let data = try? JSONEncoder().encode(userLevel) {
                      UserDefaults.standard.set(data, forKey: "userLevel")
                  }
                  if let data = try? JSONEncoder().encode(achievements) {
                      UserDefaults.standard.set(data, forKey: "achievements")
                  }
              }

              private func loadData() {
                  if let data = UserDefaults.standard.data(forKey: "userLevel"),
                     let level = try? JSONDecoder().decode(UserLevel.self, from: data) {
                      userLevel = level
                  }
                  if let data = UserDefaults.standard.data(forKey: "achievements"),
                     let saved = try? JSONDecoder().decode([UserAchievement].self, from: data) {
                      achievements = saved
                  }
              }
          }

