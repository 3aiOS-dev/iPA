          import SwiftUI
          import Foundation

          // ============================================================
          // REFERRAL SYSTEM
          // ------------------------------------------------------------
          //   ReferralManager.shared
          //     - referralCode(for: username)   - deterministic, 6 chars
          //     - referralLink(for: username)   - 21s://r/<code>?u=<username>
          //     - parse(url:) -> (code, username)?
          //     - rewardIfNeeded(inviter:)      - first-time signup credit
          //
          //   ReferralView()                   - share sheet + link list
          // ============================================================

          public struct ReferralAttribution: Codable, Equatable {
              public let inviterUsername: String
              public let inviterCode: String
              public let attributedAt: Date
              public init(inviterUsername: String, inviterCode: String) {
                  self.inviterUsername = inviterUsername
                  self.inviterCode = inviterCode
                  self.attributedAt = Date()
              }
          }

          @MainActor
          public final class ReferralManager: ObservableObject {
              // Singleton. `load()` updates @Published values on the main
              // actor. `MainActor.assumeIsolated` is safe because the first
              // access is always from a SwiftUI view on the main thread.
              public static let shared = MainActor.assumeIsolated { ReferralManager() }
              @Published public private(set) var attribution: ReferralAttribution?
              @Published public private(set) var totalEarnedUSD: Double = 0
              @Published public private(set) var friendsInvited: Int = 0

              private let keyAttr = "referral.attribution"
              private let keyTotal = "referral.totalEarned"
              private let keyFriends = "referral.friendsInvited"
              private let d = UserDefaults.standard
              public static let rewardUSD: Double = 5.0

              private init() { load() }

              public func load() {
                  if let data = d.data(forKey: keyAttr),
                     let a = try? JSONDecoder().decode(ReferralAttribution.self, from: data) {
                      attribution = a
                  }
                  totalEarnedUSD = d.double(forKey: keyTotal)
                  friendsInvited = d.integer(forKey: keyFriends)
              }

              public func referralCode(for username: String) -> String {
                  let normalized = username.lowercased().trimmingCharacters(in: .whitespaces)
                  var hash: UInt64 = 1469598103934665603
                  for b in normalized.utf8 {
                      hash ^= UInt64(b)
                      hash = hash &* 1099511628211
                  }
                  let alphabet = Array("ABCDEFGHJKLMNPQRSTUVWXYZ23456789")
                  var code = ""
                  var h = hash
                  for _ in 0..<6 {
                      code.append(alphabet[Int(h % UInt64(alphabet.count))])
                      h /= UInt64(alphabet.count)
                      if h == 0 { h = hash }
                  }
                  return code
              }

              public func referralLink(for username: String) -> String {
                  let code = referralCode(for: username)
                  return "https://21s.app/r/\(code)?u=\(username)"
              }

              public func parse(url: URL) -> (code: String, username: String)? {
                  guard url.scheme == "https" || url.scheme == "21s" else { return nil }
                  let comps = URLComponents(url: url, resolvingAgainstBaseURL: false)
                  if url.scheme == "21s" {
                      let pathParts = url.pathComponents.filter { $0 != "/" }
                      let code = pathParts.first ?? ""
                      let user = comps?.queryItems?.first(where: { $0.name == "u" })?.value ?? ""
                      if !code.isEmpty && !user.isEmpty { return (code, user) }
                      return nil
                  } else {
                      let pathParts = url.pathComponents.filter { $0 != "/" }
                      guard let idx = pathParts.firstIndex(of: "r"),
                            idx + 1 < pathParts.count else { return nil }
                      let code = pathParts[idx + 1]
                      let user = comps?.queryItems?.first(where: { $0.name == "u" })?.value ?? ""
                      if !code.isEmpty && !user.isEmpty { return (code, user) }
                      return nil
                  }
              }

              public func attributeIfNeeded(inviter: String) {
                  guard attribution == nil else { return }
                  let a = ReferralAttribution(inviterUsername: inviter,
                                              inviterCode: referralCode(for: inviter))
                  attribution = a
                  if let data = try? JSONEncoder().encode(a) {
                      d.set(data, forKey: keyAttr)
                  }
              }

              public func rewardIfNeeded(forInviter inviter: String) -> Double {
                  totalEarnedUSD += Self.rewardUSD
                  friendsInvited += 1
                  d.set(totalEarnedUSD, forKey: keyTotal)
                  d.set(friendsInvited, forKey: keyFriends)
                  WalletStore.shared.recordReferralReward(usd: Self.rewardUSD,
                                                          from: inviter)
                  HapticManager.shared.notification(.success)
                  return Self.rewardUSD
              }
          }

