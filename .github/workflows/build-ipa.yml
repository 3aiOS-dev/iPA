                  public static let fallback = Quote(usdPerBTC: 67000, usdPerETH: 3500, usdPerUSDT: 1.0, updatedAt: Date())
              }
          
              public func charge(amountUSD: Double,
                                 currency: WalletCurrency,
                                 completion: @escaping (String?, Error?) -> Void) {
                  guard amountUSD > 0 else {
                      completion(nil, CryptoTopUpError.amountInvalid); return
                  }
                  let quote = self.quote()
                  let cryptoAmount: Double
                  let address: String
                  switch currency {
                  case .btc:
                      cryptoAmount = amountUSD / quote.usdPerBTC
                      address = merchantWalletBTC
                  case .eth:
                      cryptoAmount = amountUSD / quote.usdPerETH
                      address = merchantWalletETH
                  case .usdt:
                      cryptoAmount = amountUSD / quote.usdPerUSDT
                      address = merchantWalletUSDT
                  case .usd:
                      completion(nil, CryptoTopUpError.amountInvalid); return
                  }
                  let txid = self.synthTxid(amount: cryptoAmount, currency: currency, address: address)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                      completion(txid, nil)
                  }
              }
          
              public func quote() -> Quote {
                  return Quote.fallback
              }
          
              public func depositAddress(for ccy: WalletCurrency) -> String {
                  switch ccy {
                  case .btc:  return merchantWalletBTC
                  case .eth:  return merchantWalletETH
                  case .usdt: return merchantWalletUSDT
                  case .usd:  return "-"
                  }
              }
          
              public func qrPayload(for ccy: WalletCurrency, amount: Double) -> String {
                  let addr = depositAddress(for: ccy)
                  let amt = String(format: "%.8f", amount)
                  switch ccy {
                  case .btc:  return "bitcoin:\(addr)?amount=\(amt)"
                  case .eth:  return "ethereum:\(addr)?value=\(amt)"
                  case .usdt: return addr
                  case .usd:  return addr
                  }
              }
          
              private func synthTxid(amount: Double, currency: WalletCurrency, address: String) -> String {
                  let key = SymmetricKey(data: Data(address.utf8))
                  let mac = HMAC<SHA256>.authenticationCode(
                      for: Data("\(currency.rawValue)-\(amount)-\(Date().timeIntervalSince1970)".utf8),
                      using: key)
                  let hex = mac.map { String(format: "%02x", $0) }.joined()
                  let prefix: String
                  switch currency {
                  case .btc:  prefix = "btc-"
                  case .eth:  prefix = "0x"
                  case .usdt: prefix = "trc-"
                  case .usd:  prefix = "usd-"
                  }
                  return prefix + String(hex.prefix(40))
              }
          }
          
