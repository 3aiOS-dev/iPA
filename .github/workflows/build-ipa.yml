      - name: Generate code - DownloadsTabView.swift
        run: |
          cat > DownloadsTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UniformTypeIdentifiers

          struct DownloadsTabView: View {
              @ObservedObject var downloadManager: DownloadManager
              @ObservedObject var certificateManager: CertificateManager
              @ObservedObject var signer: Signer
              @Environment(\.colorScheme) var scheme

              @State private var showCertPicker = false
              @State private var showCertImport = false
              @State private var showIPAPicker = false
              @State private var showPasswordAlert = false
              @State private var taskToSign: DownloadTask? = nil
              @State private var selectedCertForSign: StoreCertificate? = nil
              @State private var p12Password = ""
              @State private var taskToDelete: DownloadTask? = nil
              @State private var showShareSheet = false
              @State private var shareURL: URL? = nil
              @State private var showSignSuccess = false
              @State private var signSuccessMessage = ""
              @State private var expandCertificates = true

              var activeDownloads: [DownloadTask] {
                  downloadManager.downloads.filter { $0.isActive }
              }
              var completedDownloads: [DownloadTask] {
                  downloadManager.downloads.filter { $0.state == .completed || $0.state == .signed }
              }
              var failedDownloads: [DownloadTask] {
                  downloadManager.downloads.filter { $0.state == .failed }
              }

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 16) {
                              DownloadsBanner(
                                  activeCount: activeDownloads.count,
                                  completedCount: completedDownloads.count,
                                  totalBytes: downloadManager.totalDownloadedBytes
                              )
                              .padding(.horizontal)
                              .padding(.top, 4)

                              XcodeButton(
                                  title: "Import Local IPA",
                                  icon: "doc.badge.plus",
                                  color: .xcodePurple
                              ) {
                                  HapticManager.shared.impact(.light)
                                  showIPAPicker = true
                              }
                              .padding(.horizontal)

                              VStack(spacing: 0) {
                                  Button {
                                      withAnimation(.spring()) { expandCertificates.toggle() }
                                  } label: {
                                      HStack(spacing: 10) {
                                          Image(systemName: "lock.shield.fill")
                                              .font(.system(size: 18))
                                              .foregroundColor(.xcodeOrange)
                                          VStack(alignment: .trailing, spacing: 2) {
                                              Text("Certificates & Signing")
                                                  .font(.system(size: 15, weight: .heavy))
                                                  .foregroundColor(.primary)
                                              Text("\(certificateManager.certificates.count) certificates saved")
                                                  .font(.system(size: 11))
                                                  .foregroundColor(.xcodeSecondary)
                                          }
                                          Spacer()
                                          Image(systemName: expandCertificates ? "chevron.up" : "chevron.down")
                                              .font(.system(size: 12, weight: .semibold))
                                              .foregroundColor(.xcodeSecondary)
                                      }
                                      .padding(12)
                                      .xcodeCard(radius: 12)
                                      .padding(.horizontal)
                                  }
                                  .buttonStyle(PlainButtonStyle())

                                  if expandCertificates {
                                      VStack(spacing: 10) {
                                          if certificateManager.certificates.isEmpty {
                                              HStack(spacing: 8) {
                                                  Image(systemName: "exclamationmark.triangle.fill")
                                                      .foregroundColor(.xcodeOrange)
                                                  Text("No certificates. Import P12 and provisioning profile to sign.")
                                                      .font(.system(size: 12))
                                                      .foregroundColor(.xcodeSecondary)
                                              }
                                              .padding(10)
                                              .frame(maxWidth: .infinity)
                                              .background(RoundedRectangle(cornerRadius: 8).fill(Color.xcodeOrange.opacity(0.08)))
                                              .padding(.horizontal)
                                          } else {
                                              ScrollView(.horizontal, showsIndicators: false) {
                                                  HStack(spacing: 10) {
                                                      ForEach(certificateManager.certificates) { cert in
                                                          CertificateCard(
                                                              cert: cert,
                                                              isDefault: cert.isDefault,
                                                              onSetDefault: { certificateManager.setDefault(id: cert.id) },
                                                              onDelete: { certificateManager.deleteCertificate(id: cert.id) }
                                                          )
                                                      }
                                                  }
                                                  .padding(.horizontal)
                                              }
                                          }

                                          XcodeButton(
                                              title: "Add New Certificate",
                                              icon: "plus.circle.fill",
                                              color: .xcodeOrange
                                          ) {
                                              HapticManager.shared.impact(.light)
                                              showCertImport = true
                                          }
                                          .padding(.horizontal)
                                      }
                                      .padding(.top, 8)
                                  }
                              }

                              if let success = certificateManager.lastSuccess {
                                  StatusBanner(icon: "checkmark.seal.fill", color: .xcodeGreen, text: success)
                              }
                              if let err = certificateManager.lastError {
                                  StatusBanner(icon: "exclamationmark.triangle.fill", color: .xcodeRed, text: err)
                              }
                              if showSignSuccess {
                                  StatusBanner(icon: "signature", color: .xcodeYellow, text: signSuccessMessage)
                              }

                              if downloadManager.downloads.isEmpty {
                                  XcodeEmptyState(
                                      icon: "arrow.down.circle",
                                      title: "No Downloads",
                                      subtitle: "Go to Apps and tap download, or import an IPA file"
                                  )
                              } else {
                                  if !activeDownloads.isEmpty {
                                      XcodeSectionHeader(title: "⏳ Downloading", icon: "arrow.down.circle.fill")
