                      LinearGradient(colors: [Color.storePrimary, Color.storePrimaryDk],
                                     startPoint: .topLeading, endPoint: .bottomTrailing)
                  )
                  .cornerRadius(20)
                  .shadow(color: .storePrimary.opacity(0.3), radius: 16, y: 6)
              }

              private var quickActions: some View {
                  HStack(spacing: 12) {
                      actionButton("Send",      icon: "paperplane.fill", color: .storePrimary) { showSend = true }
                      actionButton("Top-Up",    icon: "plus.circle.fill", color: .storeCyan) { showTopUp = true }
