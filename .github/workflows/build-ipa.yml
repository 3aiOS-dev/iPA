      - name: Generate Source - SettingsView.swift
        run: |
          cat > SettingsView.swift << 'VIPEOF'
          import SwiftUI
          import UniformTypeIdentifiers
          
          struct SettingsView: View {
              @ObservedObject var certificateManager: CertificateManager
              @ObservedObject var profileManager: UserProfileManager
              @State private var showP12Picker = false
              @State private var showProvPicker = false
              @State private var p12Data: Data? = nil
              @State private var provData: Data? = nil
              @State private var p12Name: String = ""
              @State private var provName: String = ""
              @State private var certPassword = ""
              @State private var certDisplayName = ""
              @State private var isImporting = false
              @State private var showAddCertForm = false
              @State private var validationError = ""
              @State private var showValidationError = false
              @State private var showPassword = false
              @Environment(\.colorScheme) var scheme
          
              var p12Types: [UTType] {
                  var t: [UTType] = [.data]
                  if let t1 = UTType(filenameExtension: "p12") { t.insert(t1, at: 0) }
                  if let t2 = UTType(filenameExtension: "pfx") { t.insert(t2, at: 1) }
                  t.insert(.pkcs12, at: 0)
                  return t
              }
              var provTypes: [UTType] {
                  var t: [UTType] = [.data]
                  if let t1 = UTType(filenameExtension: "mobileprovision") { t.insert(t1, at: 0) }
                  if let t2 = UTType(filenameExtension: "provisionprofile") { t.insert(t2, at: 1) }
                  return t
              }
          
              var body: some View {
                  NavigationView {
                      List {
                          Section {
                              HStack {
                                  if let img = profileManager.profile.profileImage {
                                      Image(uiImage: img)
                                          .resizable()
                                          .aspectRatio(contentMode: .fill)
                                          .frame(width: 60, height: 60)
                                          .clipShape(Circle())
                                  } else {
                                      Circle()
                                          .fill(Color.gray.opacity(0.3))
                                          .frame(width: 60, height: 60)
                                          .overlay(Text(String(profileManager.profile.userName.prefix(1)))
                                              .font(.largeTitle))
                                  }
                                  VStack(alignment: .leading) {
                                      Text(profileManager.profile.userName)
                                          .font(.headline)
                                      Text(AppConstants.storeName)
                                          .font(.caption)
                                          .foregroundColor(.secondary)
                                  }
                                  Spacer()
                                  Button("تعديل") {
                                      profileManager.profile.userName = "مستخدم VIP"
                                      profileManager.saveProfile()
                                  }
                                  .buttonStyle(.bordered)
                              }
                              .padding(.vertical, 4)
                          }
          
                          Section("الشهادات") {
                              if certificateManager.certificates.isEmpty {
                                  Text("لا توجد شهادات")
                                      .foregroundColor(.secondary)
                              } else {
                                  ForEach(certificateManager.certificates) { cert in
                                      HStack {
                                          VStack(alignment: .leading) {
                                              Text(cert.displayName)
                                                  .font(.headline)
                                              Text(cert.expiryText)
                                                  .font(.caption)
                                                  .foregroundColor(cert.expiryStatusColor)
                                          }
                                          Spacer()
                                          if certificateManager.selectedCertificate?.id == cert.id {
                                              Image(systemName: "checkmark.circle.fill")
                                                  .foregroundColor(.blue)
                                          }
                                      }
                                      .onTapGesture {
                                          certificateManager.selectedCertificate = cert
                                      }
                                  }
                                  .onDelete { indices in
                                      certificateManager.removeCertificate(at: indices)
                                  }
                              }
          
                              Button(showAddCertForm ? "إخفاء النموذج" : "إضافة شهادة") {
                                  withAnimation { showAddCertForm.toggle() }
                              }
                          }
          
                          if showAddCertForm {
                              Section("إضافة شهادة جديدة") {
                                  HStack {
                                      Button(p12Data != nil ? "✅ P12 مُحدد" : "اختر P12") {
                                          showP12Picker = true
                                      }
                                      .buttonStyle(.bordered)
                                      if p12Data != nil {
                                          Button("مسح") { p12Data = nil; p12Name = "" }
                                              .buttonStyle(.bordered)
                                              .foregroundColor(.red)
                                      }
                                      Spacer()
                                      Button(provData != nil ? "✅ Profile مُحدد" : "اختر Profile") {
                                          showProvPicker = true
                                      }
                                      .buttonStyle(.bordered)
                                      if provData != nil {
                                          Button("مسح") { provData = nil; provName = "" }
                                              .buttonStyle(.bordered)
                                              .foregroundColor(.red)
                                      }
                                  }
          
                                  HStack {
                                      if showPassword {
                                          TextField("كلمة سر P12", text: $certPassword)
                                      } else {
                                          SecureField("كلمة سر P12", text: $certPassword)
                                      }
                                      Button(action: { showPassword.toggle() }) {
                                          Image(systemName: showPassword ? "eye.slash" : "eye")
                                      }
                                  }
          
                                  TextField("اسم مخصص (اختياري)", text: $certDisplayName)
          
                                  Button(isImporting ? "جاري الاستيراد..." : "استيراد الشهادة") {
                                      importCertificate()
                                  }
                                  .disabled(p12Data == nil || provData == nil || certPassword.isEmpty || isImporting)
                                  .frame(maxWidth: .infinity, alignment: .center)
                                  .buttonStyle(.borderedProminent)
                              }
                          }
          
                          Section("حول التطبيق") {
                              HStack { Text("الإصدار"); Spacer(); Text("v\(AppConstants.appVersion)") }
                              HStack { Text("محرك التوقيع"); Spacer(); Text("Security + CryptoKit") }
                              HStack { Text("المصدر"); Spacer(); Text("VIP21 Store") }
                          }
                      }
                      .listStyle(InsetGroupedListStyle())
                      .navigationTitle("الإعدادات")
                      .sheet(isPresented: $showP12Picker) {
                          DataDocumentPicker(types: p12Types) { data, name in
                              p12Data = data; p12Name = name
                          }
                      }
                      .sheet(isPresented: $showProvPicker) {
                          DataDocumentPicker(types: provTypes) { data, name in
                              provData = data; provName = name
                          }
                      }
                      .alert("خطأ", isPresented: $showValidationError) {
                          Button("حسناً", role: .cancel) { }
                      } message: { Text(validationError) }
                      .alert("تم الاستيراد بنجاح", isPresented: $certificateManager.showImportSuccess) {
                          Button("ممتاز", role: .cancel) { }
                      }
                  }
              }
          
              func importCertificate() {
                  guard let p12 = p12Data, let prov = provData else {
                      validationError = "يرجى اختيار كلا الملفين"
                      showValidationError = true
                      return
                  }
                  isImporting = true
                  certificateManager.validateAndSaveCertificate(
                      p12Data: p12,
                      provisionData: prov,
                      password: certPassword,
                      displayName: certDisplayName
                  ) { result in
                      isImporting = false
                      switch result {
                      case .success:
                          p12Data = nil; provData = nil; p12Name = ""; provName = ""
                          certPassword = ""; certDisplayName = ""
                      case .failure(let err):
                          validationError = err.localizedDescription
                          showValidationError = true
                      }
                  }
              }
          }
          VIPEOF

      - name: Generate Source - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import UserNotifications
          
          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
              @StateObject private var cloud = VIP21Cloud.shared
          
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environmentObject(cloud)
                          .onAppear { VIP21Cloud.shared.start() }
                  }
              }
          }
          
          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
                  VIP21Cloud.shared.start()
                  return true
              }
          
              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           willPresent notification: UNNotification,
                                           withCompletionHandler handler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  handler([.banner, .sound])
              }
          }
          
          final class VIP21Cloud: ObservableObject {
              static let shared = VIP21Cloud()
              @Published var isConnected: Bool = false
              private var timer: Timer?
          
              private init() {}
          
              func start() {
                  guard timer == nil else { return }
                  timer = Timer.scheduledTimer(withTimeInterval: 60, repeats: true) { [weak self] _ in
                      self?.ping()
                  }
                  ping()
              }
          
              private func ping() {
                  guard let url = URL(string: AppConstants.storeURL) else { return }
                  var req = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 10)
                  req.setValue("VIP21Store/7.0", forHTTPHeaderField: "User-Agent")
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, err in
                      DispatchQueue.main.async {
                          self?.isConnected = (data != nil && err == nil)
                      }
                  }.resume()
              }
          }
          VIPEOF

      - name: Build Application
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            VIPZipHelper.swift \
            SigningEngine.swift \
            Managers.swift \
            AppsManager.swift \
            SharedComponents.swift \
            ContentView.swift \
            HomeTabView.swift \
            AppsTabView.swift \
            FavoritesTabView.swift \
            SigningTabView.swift \
            AppDetailView.swift \
            SettingsView.swift \
            VIP21StoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework CryptoKit \
            -framework UserNotifications \
            -framework Network \
            -framework CoreHaptics \
            -framework PhotosUI \
            -framework UniformTypeIdentifiers \
            -framework LocalAuthentication \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA Package
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-IPA-SwiftUI-v7
          path: artifacts/21s.ipa
