          import SwiftUI

          @main
          struct VIP21StoreApp: App {
              // The "Thanks for taking a screenshot" overlay. Sits on top of
              // every screen and is driven by ScreenCaptureService.
              @StateObject private var captureService = ScreenCaptureService.shared
              @State private var showShareSheet: Bool = false

              init() {
                  // Ask for notification permission once at launch and start
                  // listening for the system "screenshot taken" event.
                  NotificationManager.shared.requestPermissionIfNeeded()
                  ScreenCaptureService.shared.start()
              }

              var body: some Scene {
                  WindowGroup {
                      NavigationView { AuthView() }
                          .navigationViewStyle(.stack)
                          // Overlay that appears when the user takes a screenshot
                          .overlay(alignment: .center) {
                              if captureService.showThanksOverlay {
                                  ThanksForScreenshotOverlay(
                                      onShare: {
                                          showShareSheet = true
                                      },
                                      onClose: {
                                          captureService.dismissOverlay()
                                      }
                                  )
                                  .transition(.scale.combined(with: .opacity))
                                  .zIndex(9999)
                              }
                          }
                          .animation(.spring(response: 0.35, dampingFraction: 0.78),
                                     value: captureService.showThanksOverlay)
                          // System share sheet (iOS picks up the latest
                          // screenshot from Photos automatically).
                          .sheet(isPresented: $showShareSheet) {
                              ShareSheet(items: [URL(string: "https://21s.app") as Any,
                                                 "Check out 21s Store 🚀" as Any].compactMap { $0 })
                          }
                  }
              }
          }

