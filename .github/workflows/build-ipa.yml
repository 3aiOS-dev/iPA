                  let author: String
                  let verified: Bool
                  let title: String
                  let caption: String
                  let mediaURL: String
                  let mediaType: String?
                  let aspectRatio: Double?
                  let fitMode: String?
                  let likes: Int
                  let comments: [AdminComment]
              }
              private struct AdminComment: Decodable {
                  let id: String
                  let author: String
