          import SwiftUI
          import UIKit
          import Combine

          // Compact P2P wallet
          @MainActor
          final class WalletStore: ObservableObject {
              static let shared = WalletStore()
              @Published var balance: Double = 0
              @Published var ledger: [LedgerEntry] = []
              @Published var sentTo: [String: Double] = [:]
              @Published var lastTopUpAmount: Double = 0
              @Published var lastTopUpMethod: String = "Apple Pay"
              private init() { load() }

              struct LedgerEntry: Identifiable, Codable {
                  let id: UUID
                  let kind: String
                  let amount: Double
                  let counterparty: String?
                  let timestamp: Date
              }

              func topUp(amount: Double, method: String) {
                  balance += amount
                  lastTopUpAmount = amount
                  lastTopUpMethod = method
                  ledger.append(.init(id: UUID(), kind: "topup", amount: amount, counterparty: method, timestamp: Date()))
                  HapticManager.shared.success()
                  persist()
              }
              func send(to handle: String, amount: Double) -> Bool {
                  guard amount > 0, amount <= balance else {
                      HapticManager.shared.error()
                      return false
                  }
                  balance -= amount
                  sentTo[handle, default: 0] += amount
                  ledger.append(.init(id: UUID(), kind: "send", amount: -amount, counterparty: handle, timestamp: Date()))
                  HapticManager.shared.success()
                  persist()
                  return true
              }
              func receiveBonus(amount: Double, reason: String) {
                  balance += amount
                  ledger.append(.init(id: UUID(), kind: "bonus", amount: amount, counterparty: reason, timestamp: Date()))
                  persist()
              }

              private func persist() {
                  if let d = try? JSONEncoder().encode(ledger) {
                      UserDefaults.standard.set(d, forKey: "21sWalletLedger")
                      UserDefaults.standard.set(balance, forKey: "21sWalletBalance")
                      UserDefaults.standard.set(sentTo, forKey: "21sWalletSentTo")
                  }
              }
              private func load() {
                  balance = UserDefaults.standard.double(forKey: "21sWalletBalance")
                  if let d = UserDefaults.standard.data(forKey: "21sWalletLedger"),
                     let entries = try? JSONDecoder().decode([LedgerEntry].self, from: d) {
                      ledger = entries
                  }
                  if let d = UserDefaults.standard.data(forKey: "21sWalletSentTo"),
                     let dict = try? JSONDecoder().decode([String: Double].self, from: d) {
                      sentTo = dict
                  }
              }
          }

