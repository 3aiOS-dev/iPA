              func install(bundleId: String?, name: String) {
                  guard let bundleId = bundleId, !bundleId.isEmpty else {
                      StatusCenter.shared.show(text: "معرّف التطبيق غير متاح")
                      return
                  }
                  isWorking = true
                  StatusCenter.shared.show(text: "جارٍ التثبيت المباشر...")
                  guard let url = URL(string: "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app/api/public/store/install-by-bundle") else {
                      isWorking = false
                      StatusCenter.shared.show(text: "رابط التثبيت غير صحيح")
                      return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 30)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "bundle_id": bundleId,
                      "name": name,
                      "udid": UIDevice.current.identifierForVendor?.uuidString ?? ""
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      DispatchQueue.main.async {
                          self.isWorking = false
                          guard let data = data,
                                let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                                let installURL = obj["install_url"] as? String,
                                let u = URL(string: installURL) else {
                              StatusCenter.shared.show(text: "فشل التثبيت، حاول مرة أخرى")
                              return
                          }
                          UIApplication.shared.open(u)
