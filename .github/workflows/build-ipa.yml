      # =========================================================
      # 🎌 ANIME ENGINE - المحرك الرسومي المتحرك
      # =========================================================
      - name: 🎌 توليد AnimeEngine.swift
        run: |
          cat > AnimeEngine.swift << 'AEEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - Particle System
          struct AnimeParticle: Identifiable {
              let id = UUID()
              var x: CGFloat
              var y: CGFloat
              var size: CGFloat
              var opacity: Double
              var speed: CGFloat
              var color: Color
          }

          struct AnimeParticleView: View {
              @State private var particles: [AnimeParticle] = []
              let particleCount: Int
              let colors: [Color]

              init(count: Int = 30, colors: [Color] = [.cyan, .magenta, .yellow]) {
                  self.particleCount = count
                  self.colors = colors
              }

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          ForEach(particles) { particle in
                              Circle()
                                  .fill(particle.color)
                                  .frame(width: particle.size, height: particle.size)
                                  .opacity(particle.opacity)
                                  .position(x: particle.x, y: particle.y)
                                  .blur(radius: particle.size * 0.3)
                          }
                      }
                      .onAppear { spawnParticles(in: geo.size) }
                  }
              }

              private func spawnParticles(in size: CGSize) {
                  for _ in 0..<particleCount {
                      let p = AnimeParticle(
                          x: CGFloat.random(in: 0...size.width),
                          y: CGFloat.random(in: 0...size.height),
                          size: CGFloat.random(in: 2...6),
                          opacity: Double.random(in: 0.3...0.8),
                          speed: CGFloat.random(in: 0.5...2),
                          color: colors.randomElement() ?? .cyan
                      )
                      particles.append(p)
                  }
                  animateParticles()
              }

              private func animateParticles() {
                  Timer.scheduledTimer(withTimeInterval: 0.05, repeats: true) { _ in
                      for i in particles.indices {
                          particles[i].y -= particles[i].speed
                          particles[i].opacity -= 0.005
                          if particles[i].y < -10 || particles[i].opacity <= 0 {
                              particles[i].y = UIScreen.main.bounds.height + 10
                              particles[i].opacity = Double.random(in: 0.3...0.8)
                              particles[i].x = CGFloat.random(in: 0...UIScreen.main.bounds.width)
                          }
                      }
                  }
              }
          }

          // MARK: - Glitch Effect
          struct GlitchText: View {
              let text: String
              @State private var offsetX: CGFloat = 0
              @State private var offsetY: CGFloat = 0
              @State private var glitchOpacity: Double = 0
              let primaryColor: Color
              let glitchColor: Color

              var body: some View {
                  ZStack {
                      Text(text)
                          .font(.system(size: 28, weight: .black, design: .rounded))
                          .foregroundColor(glitchColor)
                          .offset(x: offsetX + 2, y: offsetY)
                          .opacity(glitchOpacity)
                      Text(text)
                          .font(.system(size: 28, weight: .black, design: .rounded))
                          .foregroundColor(primaryColor)
                          .offset(x: offsetX - 2, y: offsetY)
                          .opacity(glitchOpacity)
                      Text(text)
                          .font(.system(size: 28, weight: .black, design: .rounded))
                          .foregroundColor(.white)
                  }
                  .onAppear {
                      withAnimation(.easeInOut(duration: 0.1).repeatForever(autoreverses: true)) {
                          offsetX = CGFloat.random(in: -3...3)
                          offsetY = CGFloat.random(in: -1...1)
                          glitchOpacity = 0.8
                      }
                  }
              }
          }

          // MARK: - Energy Aura Button
          struct EnergyAuraButton: View {
              let title: String
              let icon: String?
              let color: Color
              let action: () -> Void
              @State private var pulse = false
              @State private var glow = false

              var body: some View {
                  Button(action: {
                      HapticManager.shared.impact(.heavy)
                      action()
                  }) {
                      ZStack {
                          // Aura glow
                          RoundedRectangle(cornerRadius: 16)
                              .fill(color.opacity(0.3))
                              .frame(height: 56)
                              .blur(radius: pulse ? 15 : 8)
                              .scaleEffect(pulse ? 1.05 : 1.0)

                          RoundedRectangle(cornerRadius: 14)
                              .fill(
                                  LinearGradient(
                                      colors: [color, color.opacity(0.7)],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  )
                              )
                              .frame(height: 52)
                              .overlay(
                                  RoundedRectangle(cornerRadius: 14)
                                      .stroke(Color.white.opacity(0.3), lineWidth: 1)
                              )

                          HStack(spacing: 10) {
                              if let icon = icon {
                                  Image(systemName: icon)
                                      .font(.system(size: 16, weight: .bold))
                              }
                              Text(title)
                                  .font(.system(size: 15, weight: .black))
                          }
                          .foregroundColor(.white)
                      }
                  }
                  .buttonStyle(PlainButtonStyle())
                  .onAppear {
                      withAnimation(.easeInOut(duration: 1.5).repeatForever(autoreverses: true)) {
                          pulse = true
                      }
                      withAnimation(.easeInOut(duration: 2).repeatForever(autoreverses: true)) {
                          glow = true
                      }
                  }
              }
          }

          // MARK: - Hologram Card
          struct HologramCard<Content: View>: View {
              @ViewBuilder let content: Content
              @State private var tiltX: Double = 0
              @State private var tiltY: Double = 0

              var body: some View {
                  content
                      .background(
                          ZStack {
                              RoundedRectangle(cornerRadius: 20)
                                  .fill(Color.black.opacity(0.6))
                              RoundedRectangle(cornerRadius: 20)
                                  .stroke(
                                      LinearGradient(
                                          colors: [.cyan.opacity(0.6), .magenta.opacity(0.6)],
                                          startPoint: .topLeading,
                                          endPoint: .bottomTrailing
                                      ),
                                      lineWidth: 1.5
                                  )
                              // Scanline effect
                              VStack(spacing: 4) {
                                  ForEach(0..<20) { i in
                                      Rectangle()
                                          .fill(Color.cyan.opacity(0.03))
                                          .frame(height: 1)
                                          .offset(y: CGFloat(i * 12))
                                  }
                              }
                          }
                      )
                      .clipShape(RoundedRectangle(cornerRadius: 20))
                      .rotation3DEffect(.degrees(tiltX), axis: (x: 1, y: 0, z: 0))
                      .rotation3DEffect(.degrees(tiltY), axis: (x: 0, y: 1, z: 0))
                      .gesture(
                          DragGesture()
                              .onChanged { value in
                                  tiltY = Double(value.translation.width / 20)
                                  tiltX = Double(-value.translation.height / 20)
                              }
                              .onEnded { _ in
                                  withAnimation(.spring()) {
                                      tiltX = 0
                                      tiltY = 0
                                  }
                              }
                      )
              }
          }

          // MARK: - Neon Border
          struct NeonBorder: ViewModifier {
              var color: Color = .cyan
              var lineWidth: CGFloat = 2
              @State private var glow = false

              func body(content: Content) -> some View {
                  content
                      .overlay(
                          RoundedRectangle(cornerRadius: 16)
                              .stroke(color, lineWidth: lineWidth)
                              .shadow(color: color.opacity(glow ? 0.8 : 0.3), radius: glow ? 10 : 4)
                      )
                      .onAppear {
                          withAnimation(.easeInOut(duration: 1.5).repeatForever(autoreverses: true)) {
                              glow = true
                          }
                      }
              }
          }

          extension View {
              func neonBorder(color: Color = .cyan, lineWidth: CGFloat = 2) -> some View {
                  modifier(NeonBorder(color: color, lineWidth: lineWidth))
              }
          }

          // MARK: - Anime Progress Bar
          struct AnimeProgressBar: View {
              let progress: Double
              let colors: [Color]
              @State private var shimmer = false

              var body: some View {
                  GeometryReader { geo in
                      ZStack(alignment: .leading) {
                          RoundedRectangle(cornerRadius: 8)
                              .fill(Color.black.opacity(0.3))
                              .frame(height: 12)

                          RoundedRectangle(cornerRadius: 8)
                              .fill(
                                  LinearGradient(
                                      colors: colors,
                                      startPoint: .leading,
                                      endPoint: .trailing
                                  )
                              )
                              .frame(width: max(0, min(CGFloat(progress) * geo.size.width, geo.size.width)), height: 12)
                              .overlay(
                                  RoundedRectangle(cornerRadius: 8)
                                      .fill(
                                          LinearGradient(
                                              colors: [.white.opacity(0), .white.opacity(0.4), .white.opacity(0)],
                                              startPoint: .leading,
                                              endPoint: .trailing
                                          )
                                      )
                                      .offset(x: shimmer ? geo.size.width : -geo.size.width)
                              )
                      }
                  }
                  .frame(height: 12)
                  .onAppear {
                      withAnimation(.linear(duration: 1.5).repeatForever(autoreverses: false)) {
                          shimmer = true
                      }
                  }
              }
          }
          AEEOF

      # =========================================================
      # 🎨 ANIME THEMES - نظام الثيمات
      # =========================================================
      - name: 🎨 توليد AnimeThemes.swift
        run: |
          cat > AnimeThemes.swift << 'ATEOF'
          import SwiftUI

          enum AnimeTheme: String, CaseIterable, Identifiable {
              case cyberpunk = "سايبربانك"
              case neonGenesis = "نيون جينيسيس"
              case demonSlayer = "قاتل الشياطين"
              case attackOnTitan = "هجوم العمالقة"
              case onePiece = "ون بيس"
              case naruto = "ناروتو"
              case defaultTheme = "كلاسيكي"

              var id: String { rawValue }
              var displayName: String { rawValue }

              var primaryColor: Color {
                  switch self {
                  case .cyberpunk: return Color(red: 0, green: 1, blue: 1)
                  case .neonGenesis: return Color(red: 0.8, green: 0.2, blue: 0.8)
