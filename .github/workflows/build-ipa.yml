                  <key>UIApplicationSupportsMultipleScenes</key><false/>
              </dict>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
              <!-- App icons intentionally hidden: no CFBundleIconFile / CFBundleIcons keys. -->
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>     <false/>
                  <key>NSExceptionDomains</key>
                  <dict>
                      <key>apptesters.org</key>
                      <dict>
                          <key>NSIncludesSubdomains</key> <true/>
                          <key>NSExceptionAllowsInsecureHTTPLoads</key> <false/>
                          <key>NSExceptionRequiresForwardSecrecy</key> <true/>
                      </dict>
                      <key>githubusercontent.com</key>
                      <dict>
                          <key>NSIncludesSubdomains</key> <true/>
                          <key>NSExceptionAllowsInsecureHTTPLoads</key> <false/>
                          <key>NSExceptionRequiresForwardSecrecy</key> <true/>
                      </dict>
                      <key>github.com</key>
                      <dict>
                          <key>NSIncludesSubdomains</key> <true/>
                          <key>NSExceptionAllowsInsecureHTTPLoads</key> <false/>
                          <key>NSExceptionRequiresForwardSecrecy</key> <true/>
                      </dict>
                      <key>21s.app</key>
                      <dict>
                          <key>NSIncludesSubdomains</key> <true/>
                          <key>NSExceptionAllowsInsecureHTTPLoads</key> <false/>
                          <key>NSExceptionRequiresForwardSecrecy</key> <true/>
                      </dict>
                  </dict>
              </dict>
          </dict>
          </plist>
          PEOF

      # =========================================================
      # SOURCE CODE - Only essential Swift files
      # =========================================================
      - name: Generate code - Localization.swift (Arabic only)
        run: |
          cat > Localization.swift << 'LANGEOF'
          import SwiftUI
          import Foundation

          /// Always returns the Arabic string unchanged (no English translation).
          public func LS(_ ar: String) -> String {
              return ar
          }
          LANGEOF

