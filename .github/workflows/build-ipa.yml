                                          if !isLoginMode {
                                              VStack(alignment: .trailing, spacing: 6) {
                                                  Text("Confirm Password")
                                                      .font(.system(size: 13, weight: .medium))
                                                      .foregroundColor(.xcodeSecondary)
                                                      .frame(maxWidth: .infinity, alignment: .trailing)
                                                  HStack {
                                                      Spacer()
                                                      if isConfirmPasswordVisible {
                                                          TextField("••••••••", text: $confirmPassword)
                                                              .font(.system(size: 14))
                                                              .multilineTextAlignment(.trailing)
                                                      } else {
                                                          SecureField("••••••••", text: $confirmPassword)
                                                              .font(.system(size: 14))
                                                              .multilineTextAlignment(.trailing)
                                                      }
                                                      Button {
                                                          isConfirmPasswordVisible.toggle()
                                                      } label: {
                                                          Image(systemName: isConfirmPasswordVisible ? "eye.slash.fill" : "eye.fill")
                                                              .font(.system(size: 14))
                                                              .foregroundColor(.xcodeSecondary)
                                                      }
                                                  }
                                                  .padding(12)
                                                  .xcodeCard(radius: 10)
                                              }
                                          }

                                          // UDID (Signup only)
                                          if !isLoginMode {
                                              VStack(alignment: .trailing, spacing: 6) {
                                                  HStack {
                                                      Button {
                                                          showUDIDInfo = true
                                                      } label: {
                                                          Image(systemName: "info.circle.fill")
                                                              .font(.system(size: 14))
                                                              .foregroundColor(.xcodeOrange)
                                                      }
                                                      Spacer()
                                                      Text("Device UDID")
                                                          .font(.system(size: 13, weight: .medium))
                                                          .foregroundColor(.xcodeSecondary)
                                                  }
                                                  .frame(maxWidth: .infinity, alignment: .trailing)
                                                  TextField("Enter your device UDID", text: $udid)
                                                      .autocapitalization(.allCharacters)
                                                      .font(.system(size: 13, weight: .medium))
                                                      .multilineTextAlignment(.trailing)
                                                      .padding(12)
                                                      .xcodeCard(radius: 10)
                                                      .overlay(
                                                          RoundedRectangle(cornerRadius: 10)
                                                              .stroke(udid.count > 0 && udid.count < 20 ? Color.xcodeOrange.opacity(0.5) : Color.clear, lineWidth: 1.5)
                                                      )
                                                  if udid.count > 0 && udid.count < 20 {
                                                      Text("⚠️ UDID should be at least 20 characters")
                                                          .font(.system(size: 10))
                                                          .foregroundColor(.xcodeOrange)
                                                          .frame(maxWidth: .infinity, alignment: .trailing)
                                                  }
                                              }
                                          }

                                          // Error message
                                          if let error = authManager.errorMessage {
                                              HStack {
                                                  Image(systemName: "exclamationmark.triangle.fill")
                                                      .foregroundColor(.xcodeRed)
                                                      .font(.system(size: 12))
                                                  Text(error)
                                                      .font(.system(size: 12))
                                                      .foregroundColor(.xcodeRed)
                                                  Spacer()
                                              }
                                              .padding(.horizontal, 4)
                                          }

                                          // Action Buttons
                                          VStack(spacing: 12) {
                                              XcodeButton(
                                                  title: isLoginMode ? "Log in" : "Sign Up",
                                                  color: .xcodeBlue,
                                                  action: {
                                                      HapticManager.shared.impact(.medium)
                                                      if isLoginMode {
                                                          _ = authManager.login(email: email, password: password)
                                                      } else {
                                                          _ = authManager.signUp(
                                                              email: email,
                                                              username: username,
                                                              password: password,
                                                              confirmPassword: confirmPassword,
                                                              udid: udid
                                                          )
                                                      }
                                                  },
                                                  isLoading: authManager.isLoading
                                              )

                                              Button {
                                                  HapticManager.shared.selection()
                                                  withAnimation(.spring()) {
                                                      isLoginMode.toggle()
                                                      email = ""
                                                      username = ""
                                                      password = ""
                                                      confirmPassword = ""
                                                      udid = ""
                                                      authManager.errorMessage = nil
                                                  }
                                              } label: {
                                                  HStack(spacing: 4) {
                                                      Text(isLoginMode ? "Don't have an account?" : "Already have an account?")
                                                          .font(.system(size: 13))
                                                          .foregroundColor(.xcodeSecondary)
                                                      Text(isLoginMode ? "Sign Up" : "Log In")
                                                          .font(.system(size: 13, weight: .bold))
                                                          .foregroundColor(.xcodeBlue)
                                                  }
                                              }
                                          }
                                      }
                                      .padding(24)
                                      .xcodeCard(radius: 20)
                                      .shadow(color: .black.opacity(scheme == .dark ? 0.3 : 0.05), radius: 20, x: 0, y: 8)
                                      .padding(.horizontal, 20)

                                      // Footer
                                      Text("Secure • Private • 21s Pro")
                                          .font(.system(size: 11))
                                          .foregroundColor(.xcodeSecondary.opacity(0.6))
                                          .padding(.top, 8)
                                  }
                                  .padding(.bottom, 40)
                              }
                          }
                          .sheet(isPresented: $showUDIDInfo) {
                              UDIDInfoView()
                          }
                          .preferredColorScheme(.dark)
                      }
                  }
                  .animation(.easeInOut(duration: 0.3), value: authManager.isAuthenticated)
              }
          }

          struct UDIDInfoView: View {
              @Environment(\.dismiss) var dismiss
              var body: some View {
                  NavigationView {
                      ScrollView {
                          VStack(alignment: .trailing, spacing: 16) {
                              Image(systemName: "iphone.gen3")
                                  .font(.system(size: 60))
                                  .foregroundColor(.xcodeBlue)
                                  .frame(maxWidth: .infinity, alignment: .center)

                              Text("What is UDID?")
                                  .font(.system(size: 22, weight: .black))
                                  .frame(maxWidth: .infinity, alignment: .center)

                              Text("""
                              UDID stands for Unique Device Identifier. It is a 40-character hexadecimal string that uniquely identifies your iOS device.

                              ⚠️ **IMPORTANT:** You must enter your device's official UDID. This cannot be changed after registration.

                              **How to find your UDID:**

                              1. Connect your iPhone/iPad to a computer
                              2. Open **Finder** (macOS Catalina+) or **iTunes** (Windows)
                              3. Select your device
                              4. Click on the serial number until it changes to UDID
                              5. Copy the 40-character UDID string

                              **Alternative method:**
                              - Use a third-party app like "UDID Calculator" from the App Store
                              - Or use online services like https://udid.io

                              ⚠️ Entering the wrong UDID will cause issues with app installation and signing.
                              """)
                              .font(.system(size: 14))
                              .multilineTextAlignment(.trailing)

                              Text("Example UDID: \("A".randomElement() ?? "X")\(String(repeating: "X", count: 39))")
                                  .font(.system(size: 12, weight: .medium))
                                  .foregroundColor(.xcodeSecondary)
                                  .frame(maxWidth: .infinity, alignment: .center)
                                  .padding()
                                  .background(RoundedRectangle(cornerRadius: 10).fill(Color.xcodeBlue.opacity(0.08)))
                                  .overlay(RoundedRectangle(cornerRadius: 10).stroke(Color.xcodeBlue.opacity(0.2), lineWidth: 0.5))

                              Spacer()
                          }
                          .padding(20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Done") { dismiss() }
                                  .foregroundColor(.xcodeBlue)
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
              }
          }
          VIPEOF

      - name: Generate code - ContentView.swift
        run: |
          cat > ContentView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine
          import UniformTypeIdentifiers

          enum AppTab: String, CaseIterable {
              case home      = "Home"
              case apps      = "Apps"
              case downloads = "Downloads"

              var icon: String {
                  switch self {
                  case .home:      return "house.fill"
                  case .apps:      return "square.stack.3d.up.fill"
                  case .downloads: return "arrow.down.circle.fill"
                  }
              }
          }

          struct ContentView: View {
              @State private var selectedTab: AppTab = .home
              @Environment(\.colorScheme) var scheme
              @StateObject private var appsManager = AppsManager()
              @StateObject private var downloadManager = DownloadManager()
              @StateObject private var certificateManager = CertificateManager()
              @StateObject private var signer = Signer()
              @StateObject private var authManager = AuthManager()

              var body: some View {
                  TabView(selection: $selectedTab) {
                      HomeTabView(appsManager: appsManager, downloadManager: downloadManager)
                          .tabItem { Label("Home", systemImage: AppTab.home.icon) }
                          .tag(AppTab.home)

                      AppsTabView(appsManager: appsManager, downloadManager: downloadManager)
                          .tabItem { Label("Apps", systemImage: AppTab.apps.icon) }
                          .tag(AppTab.apps)

                      DownloadsTabView(
                          downloadManager: downloadManager,
                          certificateManager: certificateManager,
                          signer: signer
                      )
                          .tabItem { Label("Downloads", systemImage: AppTab.downloads.icon) }
                          .tag(AppTab.downloads)
                  }
                  .accentColor(.xcodeBlue)
                  .onAppear {
                      appsManager.fetchApps()
                      appsManager.loadRecentSearches()
                      requestNotifications()
                  }
              }

              func requestNotifications() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }
          }

          struct LoadingView: View {
              @State private var rotate = false
              var body: some View {
                  VStack(spacing: 20) {
                      ZStack {
                          Circle()
                              .stroke(Color.xcodeBlue.opacity(0.2), lineWidth: 3)
                              .frame(width: 50, height: 50)
                          Circle()
                              .trim(from: 0, to: 0.7)
                              .stroke(Color.xcodeBlue, style: StrokeStyle(lineWidth: 3, lineCap: .round))
                              .frame(width: 50, height: 50)
                              .rotationEffect(.degrees(rotate ? 360 : 0))
                              .onAppear {
                                  withAnimation(.linear(duration: 1).repeatForever(autoreverses: false)) {
                                      rotate = true
                                  }
                              }
                      }
                      Text("Loading...")
                          .font(.system(size: 13))
                          .foregroundColor(.xcodeSecondary)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.top, 100)
              }
          }

          struct ErrorView: View {
              let message: String
              let onRetry: () -> Void
              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "wifi.slash")
                          .font(.system(size: 48))
                          .foregroundColor(.xcodeOrange)
                      Text("Something went wrong")
                          .font(.system(size: 18, weight: .bold))
                      Text(message)
                          .font(.system(size: 12))
                          .foregroundColor(.xcodeSecondary)
                          .multilineTextAlignment(.center)
                      XcodeButton(title: "Retry", icon: "arrow.clockwise", color: .xcodeOrange, action: onRetry)
                          .frame(width: 160)
                  }
                  .padding()
                  .frame(maxWidth: .infinity)
                  .padding(.top, 80)
              }
          }
