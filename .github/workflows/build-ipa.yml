                            case .settings: return "gearshape.2"
                            }
                        }
                    }

                    struct ContentView: View {
                        @State private var selectedTab: AppTab = .home
                        @Environment(\.colorScheme) var scheme
                        @StateObject private var appsManager        = AppsManager()
                        @StateObject private var downloadManager    = IPADownloadManager()
                        @StateObject private var certificateManager = CertificateManager()
                        @StateObject private var profileManager     = UserProfileManager()

                        var body: some View {
                            ZStack {
                                (scheme == .dark ? Color.vipDark : Color(red: 0.96, green: 0.96, blue: 1.0))
                                    .ignoresSafeArea()
                                VStack(spacing: 0) {
                                    topBar
                                    content
                                }
                                VStack { Spacer(); tabBar }
                            }
                            .onAppear { appsManager.fetchApps(); requestNotifications() }
                        }

                        private var topBar: some View {
                            HStack {
                                VStack(alignment: .leading, spacing: 2) {
                                    Text(appsManager.storeTitle).font(.system(size: 20, weight: .black))
                                        .foregroundColor(scheme == .dark ? .white : .black)
