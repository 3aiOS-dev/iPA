      - name: Generate code - OnboardingView.swift
        run: |
          cat > OnboardingView.swift << 'VIPEOF'
          import SwiftUI

          struct OnboardingView: View {
              @Binding var isPresented: Bool

              @State private var currentPage = 0
              private let pages: [OnboardingPage] = [
                  OnboardingPage(
                      imageName: "onboarding1.png",
                      title: "Research",
                      description: "Collect data from problems that occur in the field."
                  ),
                  OnboardingPage(
                      imageName: "onboarding2.png",
                      title: "Ideation",
                      description: "Finding a problem that really matters is resolved"
                  ),
                  OnboardingPage(
                      imageName: "onboarding3.png",
                      title: "Prototyping",
                      description: "Realizing a product design that can be tried immediately"
                  )
              ]

              var body: some View {
                  ZStack {
                      Color.xcodeBackground.edgesIgnoringSafeArea(.all)

                      VStack(spacing: 0) {
                          TabView(selection: $currentPage) {
                              ForEach(pages.indices, id: \.self) { index in
                                  OnboardingPageView(page: pages[index])
                                      .tag(index)
                              }
                          }
                          .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))
                          .animation(.easeInOut, value: currentPage)

                          HStack(spacing: 8) {
                              ForEach(pages.indices, id: \.self) { index in
                                  Circle()
                                      .fill(currentPage == index ? Color.xcodeBlue : Color.xcodeDivider)
                                      .frame(width: 8, height: 8)
                                      .onTapGesture {
                                          withAnimation { currentPage = index }
                                      }
                              }
                          }
                          .padding(.top, 20)

                          Button {
                              if currentPage < pages.count - 1 {
                                  withAnimation { currentPage += 1 }
                              } else {
                                  UserDefaults.standard.set(true, forKey: AppConstants.hasSeenOnboardingKey)
                                  isPresented = false
                              }
                          } label: {
                              HStack {
                                  Text(currentPage == pages.count - 1 ? "Get Started" : "Next")
                                      .font(.system(size: 16, weight: .semibold))
                                  if currentPage < pages.count - 1 {
                                      Image(systemName: "chevron.right")
                                          .font(.system(size: 14, weight: .medium))
                                  }
                              }
                              .foregroundColor(.white)
                              .frame(maxWidth: .infinity)
                              .frame(height: 54)
                              .background(Capsule().fill(Color.xcodeBlue))
                          }
                          .padding(.horizontal, 28)
                          .padding(.top, 20)
                          .padding(.bottom, 40)
                      }
                  }
                  .preferredColorScheme(.light)
              }
          }

          struct OnboardingPage: Identifiable {
              let id = UUID()
              let imageName: String
              let title: String
              let description: String
          }

          struct OnboardingPageView: View {
              let page: OnboardingPage

              var body: some View {
                  VStack(spacing: 20) {
                      if let img = UIImage.bundled(page.imageName) {
                          Image(uiImage: img)
                              .resizable()
                              .aspectRatio(contentMode: .fit)
                              .frame(width: 280, height: 280)
                              .padding(.top, 40)
                      } else {
                          Image(systemName: "photo")
                              .font(.system(size: 80))
                              .foregroundColor(.xcodeAccent)
                              .padding(.top, 40)
                      }

                      Text(page.title)
                          .font(.system(size: 28, weight: .bold))
                          .foregroundColor(.xcodeBlue)
                          .multilineTextAlignment(.center)

                      Text(page.description)
                          .font(.system(size: 16))
                          .foregroundColor(.xcodeSecondary)
                          .multilineTextAlignment(.center)
                          .padding(.horizontal, 32)

                      Spacer()
                  }
                  .padding(.horizontal, 16)
              }
          }
          VIPEOF

      - name: Generate code - AuthViews.swift
        run: |
          cat > AuthViews.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          struct AuthView: View {
              @StateObject private var authManager = AuthManager()
              @State private var isLoginMode = true
              @State private var phoneNumber = ""
              @State private var username = ""
              @State private var password = ""
              @State private var confirmPassword = ""
              @State private var udid = ""
              @State private var showUDIDInfo = false
              @State private var isPasswordVisible = false
              @State private var isConfirmPasswordVisible = false
              @State private var showOnboarding = false

              @State private var selectedCountry = countries.first(where: { $0.dialCode == "+966" }) ?? countries.first!
              @State private var phoneNumberWithoutCode = ""

              var fullPhoneNumber: String {
                  selectedCountry.dialCode + phoneNumberWithoutCode
              }

              var body: some View {
                  Group {
                      if authManager.isAuthenticated {
                          if showOnboarding {
                              Color.clear
                                  .fullScreenCover(isPresented: $showOnboarding) {
                                      OnboardingView(isPresented: $showOnboarding)
                                  }
                          } else {
                              ContentView(authManager: authManager)
                                  .transition(.opacity)
                          }
                      } else {
                          mainAuthView
                      }
                  }
                  .onChange(of: authManager.isAuthenticated) { newValue in
                      if newValue {
                          let hasSeen = UserDefaults.standard.bool(forKey: AppConstants.hasSeenOnboardingKey)
                          if !hasSeen {
                              showOnboarding = true
                          }
                      }
                  }
                  .animation(.easeInOut(duration: 0.3), value: authManager.isAuthenticated)
              }

              var mainAuthView: some View {
                  ZStack {
                      Color.xcodeBackground.edgesIgnoringSafeArea(.all)

                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 28) {
                              IllustrationHeader(isLoginMode: isLoginMode)
                                  .padding(.top, 24)

                              VStack(alignment: .leading, spacing: 22) {
                                  VStack(alignment: .leading, spacing: 6) {
                                      Text(isLoginMode ? "Login" : "Register")
                                          .font(.system(size: 32, weight: .heavy))
                                          .foregroundColor(.xcodeBlue)
                                      Text(isLoginMode ? "Please Sign in to continue." : "Please register to login.")
                                          .font(.system(size: 13))
                                          .foregroundColor(.xcodeSecondary)
                                  }

                                  VStack(spacing: 14) {
                                      HStack(spacing: 0) {
                                          Menu {
                                              ForEach(countries) { country in
                                                  Button {
                                                      selectedCountry = country
                                                  } label: {
                                                      HStack {
                                                          Text(country.flag)
                                                          Text(country.dialCode)
                                                          Text(country.name)
                                                      }
                                                  }
                                              }
                                          } label: {
                                              HStack(spacing: 4) {
                                                  Text(selectedCountry.flag)
                                                  Text(selectedCountry.dialCode)
                                                  Image(systemName: "chevron.down")
                                                      .font(.system(size: 10))
                                                      .foregroundColor(.xcodeSecondary)
                                              }
                                              .padding(.horizontal, 10)
                                              .frame(height: 48)
                                              .background(RoundedRectangle(cornerRadius: 10).fill(Color.xcodeEditor))
                                          }
                                          .padding(.trailing, 6)

                                          TextField("Phone number", text: $phoneNumberWithoutCode)
                                              .font(.system(size: 14))
                                              .keyboardType(.phonePad)
                                              .padding(.horizontal, 14)
                                              .frame(height: 48)
                                              .background(RoundedRectangle(cornerRadius: 10).fill(Color.xcodeEditor))
                                      }

                                      MockupField(icon: "person.fill", placeholder: "Username", text: $username)

                                      MockupSecureField(
                                          icon: "lock.fill",
                                          placeholder: "Password",
                                          text: $password,
                                          isVisible: $isPasswordVisible
                                      )

                                      if !isLoginMode {
                                          MockupSecureField(
                                              icon: "lock.fill",
                                              placeholder: "Confirm Password",
                                              text: $confirmPassword,
                                              isVisible: $isConfirmPasswordVisible
                                          )

                                          VStack(alignment: .trailing, spacing: 4) {
                                              HStack {
                                                  Button { showUDIDInfo = true } label: {
                                                      Image(systemName: "info.circle.fill")
                                                          .font(.system(size: 13))
                                                          .foregroundColor(.xcodeAccent)
                                                  }
                                                  Text("Device UDID")
                                                      .font(.system(size: 12))
                                                      .foregroundColor(.xcodeSecondary)
                                                  Spacer()
                                              }
                                              MockupField(icon: "iphone", placeholder: "Enter your device UDID", text: $udid, autocap: true)
                                          }
                                      }

                                      HStack {
                                          Text("Reminder me nextime")
                                              .font(.system(size: 12))
                                              .foregroundColor(.xcodeSecondary)
                                          Spacer()
                                          Toggle("", isOn: .constant(true))
                                              .labelsHidden()
                                              .tint(.xcodeBlue)
                                      }
                                  }

                                  if let error = authManager.errorMessage {
                                      HStack(spacing: 6) {
                                          Image(systemName: "exclamationmark.triangle.fill")
                                              .foregroundColor(.xcodeRed)
                                              .font(.system(size: 12))
                                          Text(error)
                                              .font(.system(size: 12))
                                              .foregroundColor(.xcodeRed)
                                          Spacer()
                                      }
                                  }

                                  Button {
                                      HapticManager.shared.impact(.medium)
                                      if isLoginMode {
                                          _ = authManager.login(phoneNumber: fullPhoneNumber, password: password)
                                      } else {
                                          _ = authManager.signUp(
                                              phoneNumber: fullPhoneNumber,
                                              username: username,
                                              password: password,
                                              confirmPassword: confirmPassword,
                                              udid: udid
                                          )
                                      }
                                  } label: {
                                      HStack(spacing: 8) {
                                          if authManager.isLoading {
                                              ProgressView().progressViewStyle(CircularProgressViewStyle(tint: .white)).scaleEffect(0.8)
                                          }
                                          Text(authManager.isLoading ? "Loading..." : (isLoginMode ? "Sign In" : "Sign Up"))
                                              .font(.system(size: 15, weight: .semibold))
                                      }
                                      .foregroundColor(.white)
                                      .frame(maxWidth: .infinity)
                                      .frame(height: 50)
                                      .background(Capsule().fill(Color.xcodeBlue))
                                      .opacity(authManager.isLoading ? 0.6 : 1.0)
                                  }
                                  .disabled(authManager.isLoading)

                                  Button {
                                      HapticManager.shared.selection()
                                      withAnimation(.spring()) {
                                          isLoginMode.toggle()
                                          phoneNumberWithoutCode = ""
                                          username = ""
                                          password = ""
                                          confirmPassword = ""
                                          udid = ""
                                          authManager.errorMessage = nil
                                      }
                                  } label: {
                                      HStack(spacing: 4) {
                                          Spacer()
                                          Text(isLoginMode ? "Don't have account?" : "Already have account?")
                                              .font(.system(size: 13))
                                              .foregroundColor(.xcodeSecondary)
                                          Text(isLoginMode ? "Sign Up" : "Sign In")
                                              .font(.system(size: 13, weight: .bold))
                                              .foregroundColor(.xcodeAccent)
                                          Spacer()
                                      }
                                  }
                              }
                              .padding(.horizontal, 28)
                          }
                          .padding(.bottom, 40)
                      }
                  }
                  .sheet(isPresented: $showUDIDInfo) { UDIDInfoView() }
                  .preferredColorScheme(.light)
              }
          }

          struct IllustrationHeader: View {
              let isLoginMode: Bool
              private var imageName: String { isLoginMode ? "login_logo.png" : "register_logo.png" }

              var body: some View {
                  ZStack {
                      Circle()
                          .fill(Color.xcodeEditor)
                          .frame(width: 230, height: 230)
                          .offset(x: -40, y: 10)
                      Circle()
                          .fill(Color.xcodeAccent.opacity(0.12))
                          .frame(width: 150, height: 150)
                          .offset(x: 90, y: -30)

                      if let img = UIImage.bundled(imageName) {
                          Image(uiImage: img)
                              .resizable()
                              .aspectRatio(contentMode: .fit)
                              .frame(width: 240, height: 240)
                              .id(imageName)
                              .transition(.opacity)
                      } else {
                          Image(systemName: "person.crop.circle.badge.checkmark")
                              .font(.system(size: 100))
                              .foregroundColor(.xcodeAccent)
                      }
                  }
                  .frame(height: 250)
                  .animation(.easeInOut(duration: 0.25), value: isLoginMode)
              }
          }

          struct MockupField: View {
              let icon: String
              let placeholder: String
              @Binding var text: String
              var keyboard: UIKeyboardType = .default
              var autocap: Bool = false
              var body: some View {
                  HStack(spacing: 10) {
                      Image(systemName: icon)
                          .font(.system(size: 14))
                          .foregroundColor(.xcodeSecondary)
                          .frame(width: 18)
                      TextField(placeholder, text: $text)
                          .font(.system(size: 14))
                          .keyboardType(keyboard)
                          .autocapitalization(autocap ? .allCharacters : .none)
                  }
                  .padding(.horizontal, 14)
                  .frame(height: 48)
                  .background(RoundedRectangle(cornerRadius: 10).fill(Color.xcodeEditor))
              }
          }

          struct MockupSecureField: View {
              let icon: String
              let placeholder: String
              @Binding var text: String
              @Binding var isVisible: Bool
              var body: some View {
                  HStack(spacing: 10) {
                      Image(systemName: icon)
                          .font(.system(size: 14))
                          .foregroundColor(.xcodeSecondary)
                          .frame(width: 18)
                      if isVisible {
                          TextField(placeholder, text: $text)
                          .font(.system(size: 14))
                      } else {
                          SecureField(placeholder, text: $text)
                          .font(.system(size: 14))
                      }
