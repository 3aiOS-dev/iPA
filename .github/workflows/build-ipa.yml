                              VStack(spacing: 14) {
                                  ProfileField(label: "ユーザー名", text: $username, icon: "person.fill")
                                  ProfileField(label: "電話番号", text: $phoneNumber, icon: "phone.fill", keyboard: .phonePad)
                              }
                              .padding(.horizontal, 20)

                              if let err = validationError {
                                  HStack(spacing: 6) {
                                      Image(systemName: "exclamationmark.triangle.fill")
                                          .foregroundColor(.xcodeRed)
                                          .font(.system(size: 12))
                                      Text(err).font(.system(size: 12)).foregroundColor(.xcodeRed)
                                      Spacer()
                                  }
                                  .padding(.horizontal, 24)
                              }

                              Button {
                                  save()
                              } label: {
                                  Text("変更を保存")
                                      .font(.system(size: 15, weight: .bold))
                                      .foregroundColor(.white)
                                      .frame(maxWidth: .infinity)
                                      .frame(height: 50)
                                      .background(Capsule().fill(Color.storePrimary))
                              }
                              .padding(.horizontal, 20)
                              .padding(.top, 6)

                              Spacer(minLength: 30)
                          }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                  }
                  .onAppear { loadFromUser() }
                  .overlay(alignment: .top) {
                      if showSavedToast {
                          HStack(spacing: 8) {
                              Image(systemName: "checkmark.circle.fill")
                                  .foregroundColor(.white)
                              Text("プロフィール更新完了")
                                  .font(.system(size: 13, weight: .semibold))
                                  .foregroundColor(.white)
                          }
                          .padding(.horizontal, 18).padding(.vertical, 12)
                          .background(Capsule().fill(Color.walletGreen))
                          .shadow(color: .black.opacity(0.2), radius: 8, y: 4)
                          .transition(.move(edge: .top).combined(with: .opacity))
                          .padding(.top, 60)
                      }
                  }
                  .animation(.spring(), value: showSavedToast)
              }

              private func loadFromUser() {
                  guard let user = authManager.currentUser else { return }
                  username = user.username
                  phoneNumber = user.phoneNumber
              }

              private func save() {
                  validationError = nil
                  let trimmedName = username.trimmingCharacters(in: .whitespaces)
                  if trimmedName.count < 3 {
                      validationError = "ユーザー名は3文字以上でなければなりません"
                      HapticManager.shared.error()
                      return
                  }
                  let trimmedPhone = phoneNumber.trimmingCharacters(in: .whitespaces)
                  if !trimmedPhone.hasPrefix("+") || trimmedPhone.dropFirst().filter({ $0.isNumber }).count < 7 {
                      validationError = "国コードを含む有効な電話番号を入力してください"
                      HapticManager.shared.error()
                      return
                  }

                  if let user = authManager.currentUser {
                      let key = AppConstants.userDefaultsKey
                      if let data = UserDefaults.standard.data(forKey: key),
                         var users = try? JSONDecoder().decode([AppUser].self, from: data),
                         let idx = users.firstIndex(where: { $0.id == user.id }) {
                          let preserved = AppUser(
                              id: user.id,
                              phoneNumber: trimmedPhone,
                              username: trimmedName,
                              password: user.password,
                              createdAt: user.createdAt
                          )
                          users[idx] = preserved
                          if let encoded = try? JSONEncoder().encode(users) {
                              UserDefaults.standard.set(encoded, forKey: key)
                          }
                      }
                  }

                  HapticManager.shared.success()
                  showSavedToast = true

                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                      showSavedToast = false
                      isPresented = false
                  }
              }
          }

          extension AppUser {
              init(id: UUID, phoneNumber: String, username: String, password: String, createdAt: Date) {
                  self.id = id
                  self.phoneNumber = phoneNumber
                  self.username = username
                  self.password = password
                  self.createdAt = createdAt
              }
          }

