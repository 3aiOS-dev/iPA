          struct StoreUpdateItem: Codable, Identifiable, Hashable {
              let id: String
              let app_name: String
              let bundle_id: String?
              let icon: String?
              let version: String
              let changelog: String?
              let released_at: String?
              let is_new: Bool?
          }

          struct StoreUpdatesResponse: Codable { let updates: [StoreUpdateItem] }

          @MainActor
          final class UpdatesFeed: ObservableObject {
              static let shared = MainActor.assumeIsolated { UpdatesFeed() }
              @Published var items: [StoreUpdateItem] = []
              @Published var isLoading: Bool = false
              @Published var lastError: String = ""
              private init() {}

              /// عنوان سيرفر التحديثات — افتراضي يمكن تعديله.
              static var updatesSiteBase: String { "https://store.21s.app" }

              func isRecent(_ item: StoreUpdateItem, now: Date = Date()) -> Bool {
                  guard let raw = item.released_at, let d = StoreFeed.parseDate(raw) else { return true }
                  return now.timeIntervalSince(d) <= 24 * 60 * 60
              }

              private func sortForDisplay(_ list: [StoreUpdateItem]) -> [StoreUpdateItem] {
                  return list.sorted { (a, b) in
                      let aNew = (a.is_new == true)
                      let bNew = (b.is_new == true)
                      if aNew != bNew { return aNew && !bNew }
                      let ad = a.released_at.flatMap(StoreFeed.parseDate) ?? .distantPast
                      let bd = b.released_at.flatMap(StoreFeed.parseDate) ?? .distantPast
                      return ad > bd
                  }
              }

              var recentItems: [StoreUpdateItem] { sortForDisplay(items.filter { isRecent($0) }) }
              var newlyAddedItems: [StoreUpdateItem] { recentItems.filter { $0.is_new == true } }
              var recentCount: Int { recentItems.count }

              func load() async {
                  isLoading = true
                  lastError = ""
                  guard let url = URL(string: UpdatesFeed.updatesSiteBase + "/api/public/store/updates") else {
                      isLoading = false; return
                  }
                  do {
                      var req = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 25)
                      req.setValue("21s-iOS/1.0", forHTTPHeaderField: "User-Agent")
                      let (data, _) = try await URLSession.shared.data(for: req)
                      let parsed = try JSONDecoder().decode(StoreUpdatesResponse.self, from: data)
                      self.items = sortForDisplay(parsed.updates.filter { isRecent($0) })
                  } catch {
                      self.lastError = error.localizedDescription
                  }
                  isLoading = false
              }
          }

