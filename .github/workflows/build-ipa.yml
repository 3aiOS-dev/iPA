          struct RoundedCorner: Shape {
              var radius: CGFloat
              var corners: UIRectCorner
              func path(in rect: CGRect) -> Path {
                  let p = UIBezierPath(roundedRect: rect, byRoundingCorners: corners,
                                       cornerRadii: CGSize(width: radius, height: radius))
                  return Path(p.cgPath)
              }
          }

          // ================= NOTIFICATIONS MANAGER (بدون تبويب) =================
          struct AppNotificationItem: Identifiable, Equatable {
              let id: UUID = UUID()
              let title: String
              let body: String
              let icon: String
              var iconURL: String? = nil
              var badgeText: String? = nil
              let date: Date = Date()
          }

          @MainActor
          final class NotificationsManager: ObservableObject {
              static let shared = MainActor.assumeIsolated { NotificationsManager() }

              @Published var authorized: Bool = false
              @Published var enabled: Bool = UserDefaults.standard.object(forKey: "notif_enabled_21s") as? Bool ?? true
              @Published var history: [AppNotificationItem] = []
              @Published var banner: AppNotificationItem? = nil

              private init() {}

              func requestAuthorization() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { granted, _ in
                      DispatchQueue.main.async { self.authorized = granted }
                  }
              }

              func setEnabled(_ value: Bool) {
                  enabled = value
                  UserDefaults.standard.set(value, forKey: "notif_enabled_21s")
                  if value { requestAuthorization() }
              }

              func push(title: String,
                        body: String,
                        icon: String = "bell.fill",
                        iconURL: String? = nil,
                        badgeText: String? = nil,
                        delay: TimeInterval = 0.4) {
                  let item = AppNotificationItem(title: title, body: body, icon: icon,
                                                 iconURL: iconURL, badgeText: badgeText)
                  history.insert(item, at: 0)
                  if history.count > 60 { history.removeLast(history.count - 60) }

                  withAnimation(.spring(response: 0.4, dampingFraction: 0.8)) { banner = item }
                  HapticManager.shared.notification(.success)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 5) {
                      if self.banner?.id == item.id {
                          withAnimation(.easeOut(duration: 0.25)) { self.banner = nil }
                      }
                  }

                  guard enabled else { return }
                  let content = UNMutableNotificationContent()
                  content.title = title
                  content.body = body
                  content.sound = .default
                  let trigger = UNTimeIntervalNotificationTrigger(timeInterval: max(delay, 0.2), repeats: false)
                  let identifier = item.id.uuidString

                  if let iconURL, let url = URL(string: iconURL) {
                      Task { @MainActor in
                          var attachment: UNNotificationAttachment? = nil
                          if let (data, _) = try? await URLSession.shared.data(from: url) {
                              let ext = url.pathExtension.isEmpty ? "png" : url.pathExtension
                              let tmp = FileManager.default.temporaryDirectory
                                  .appendingPathComponent("notif-\(identifier).\(ext)")
                              if (try? data.write(to: tmp)) != nil {
                                  attachment = try? UNNotificationAttachment(identifier: identifier, url: tmp, options: nil)
                              }
                          }
                          if let attachment { content.attachments = [attachment] }
                          let request = UNNotificationRequest(identifier: identifier, content: content, trigger: trigger)
                          try? await UNUserNotificationCenter.current().add(request)
                      }
                  } else {
                      let request = UNNotificationRequest(identifier: identifier, content: content, trigger: trigger)
                      Task { try? await UNUserNotificationCenter.current().add(request) }
                  }
              }

              /// حدث متجر: تطبيق جديد أو إصدار محدَّث.
              func pushAppEvent(name: String, iconURL: String?, version: String?, isUpdate: Bool) {
                  let tag = isUpdate ? "محدَّث" : "جديد"
                  let versionText = (version?.isEmpty == false) ? " • \(version!)" : ""
                  push(title: "\(name) — \(tag)",
                       body: isUpdate
                           ? "صدر تحديث جديد للتطبيق في المتجر\(versionText)"
                           : "تمت إضافة التطبيق إلى المتجر الآن\(versionText)",
                       icon: isUpdate ? "arrow.triangle.2.circlepath" : "sparkles",
                       iconURL: iconURL,
                       badgeText: tag)
              }

              func dismissBanner() {
                  withAnimation(.easeOut(duration: 0.2)) { banner = nil }
              }

              func clearHistory() { history.removeAll() }
          }

