                                          .font(.system(size: 11))
                                          .foregroundColor(.xcodeSecondary)
                                          .padding(.horizontal)
                                  }

                                  if filteredApps.isEmpty {
                                      XcodeEmptyState(
                                          icon: "magnifyingglass",
                                          title: "No Results",
                                          subtitle: "Try a different search or filter"
                                      )
                                  } else {
                                      LazyVStack(spacing: 8) {
                                          ForEach(filteredApps, id: \.id) { app in
                                              EnhancedAppCard(app: app, downloadManager: downloadManager)
                                                  .onTapGesture { selectedApp = app; showDetail = true }
                                                  .padding(.horizontal)
                                          }
                                      }
                                  }
                              }
                          }
                          .padding(.bottom, 20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
