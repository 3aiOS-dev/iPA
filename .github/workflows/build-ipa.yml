name: Build_Souq

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Setup Dependencies
        run: |
          brew install ldid
          brew install zip

      - name: Generate App Icons
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size, filename):
              img = Image.new("RGB", (size, size), (18, 18, 30))
              draw = ImageDraw.Draw(img)

              top = (124, 58, 237)      # purple
              bottom = (245, 158, 11)   # amber
              for y in range(size):
                  t = y / size
                  r = int(top[0] * (1 - t) + bottom[0] * t)
                  g = int(top[1] * (1 - t) + bottom[1] * t)
                  b = int(top[2] * (1 - t) + bottom[2] * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b))

              draw.rounded_rectangle(
                  [size * 0.16, size * 0.30, size * 0.84, size * 0.80],
                  radius=size * 0.08,
                  outline=(255, 255, 255),
                  width=max(2, size // 34),
              )

              text = "S"
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size * 0.34))
              except Exception:
                  font = ImageFont.load_default()

              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(
                  ((size - tw) / 2 - bbox[0], (size - th) / 2 - bbox[1]),
                  text,
                  fill=(255, 255, 255),
                  font=font,
              )
              img.save(filename)

          make_icon(120, "Resources/AppIcon60x60@2x.png")
          make_icon(152, "Resources/AppIcon76x76@2x~ipad.png")
          PYEOF
          ls -la Resources

      - name: Generate Source - Models and Mock Data
        run: |
          cd ${{ github.workspace }}
          cat > AppModel.swift << 'WEOF'
          import UIKit

          enum StoreCategory: String, CaseIterable {
              case all = "الكل"
              case games = "ألعاب"
              case apps = "تطبيقات"
              case tools = "أدوات"
          }

          struct AppItem {
              let id: Int
              let name: String
              let developer: String
              let category: StoreCategory
              let rating: Double
              let sizeMB: Int
              let emoji: String
              let colorHex: String
              let description: String
              let price: String
          }

          extension UIColor {
              convenience init(hex: String) {
                  var sanitized = hex.trimmingCharacters(in: .whitespacesAndNewlines)
                  sanitized = sanitized.replacingOccurrences(of: "#", with: "")
                  var rgb: UInt64 = 0
                  Scanner(string: sanitized).scanHexInt64(&rgb)
                  let r = CGFloat((rgb & 0xFF0000) >> 16) / 255.0
                  let g = CGFloat((rgb & 0x00FF00) >> 8) / 255.0
                  let b = CGFloat(rgb & 0x0000FF) / 255.0
                  self.init(red: r, green: g, blue: b, alpha: 1.0)
              }
          }

          enum MockData {
              // ملاحظة: كل البيانات هنا وهمية بالكامل لأغراض العرض فقط، ولا تمثل
              // أي عملية تنزيل أو تثبيت فعلية لأي برنامج أو لعبة حقيقية.
              static let items: [AppItem] = [
                  AppItem(id: 1, name: "سباق الصحراء", developer: "استوديو الرمال", category: .games, rating: 4.6, sizeMB: 340, emoji: "🏎️", colorHex: "FF6B35", description: "لعبة سباقات سيارات عبر الصحراء بمضامير متعددة وتحديات يومية وتخصيص كامل للسيارة.", price: "مجانًا"),
                  AppItem(id: 2, name: "برج الألغاز", developer: "بلاي لاب", category: .games, rating: 4.3, sizeMB: 210, emoji: "🧩", colorHex: "7C3AED", description: "ألغاز ذهنية ممتعة بمئات المراحل المتصاعدة الصعوبة، مناسبة لجميع الأعمار.", price: "مجانًا"),
                  AppItem(id: 3, name: "دفتري", developer: "نوت آبس", category: .apps, rating: 4.8, sizeMB: 45, emoji: "📝", colorHex: "06B6D4", description: "تطبيق ملاحظات بسيط وسريع مع دعم المزامنة والتذكيرات والتصنيفات.", price: "مجانًا"),
                  AppItem(id: 4, name: "محرر الصور برو", developer: "بيكسل ستوديو", category: .apps, rating: 4.5, sizeMB: 180, emoji: "🎨", colorHex: "F59E0B", description: "أدوات تحرير صور احترافية بفلاتر وطبقات وتصدير عالي الجودة.", price: "12.99 ر.س"),
                  AppItem(id: 5, name: "قافلة الأبطال", developer: "هيرو جيمز", category: .games, rating: 4.1, sizeMB: 520, emoji: "⚔️", colorHex: "EF4444", description: "لعبة مغامرات وقتال بعالم مفتوح وشخصيات قابلة للتطوير.", price: "مجانًا"),
                  AppItem(id: 6, name: "مقياس اللياقة", developer: "فيت تِك", category: .tools, rating: 4.4, sizeMB: 60, emoji: "💪", colorHex: "10B981", description: "تتبع تمارينك اليومية وسعراتك الحرارية بسهولة ووضوح.", price: "مجانًا"),
                  AppItem(id: 7, name: "لغز الكلمات", developer: "وورد بلاي", category: .games, rating: 4.7, sizeMB: 90, emoji: "🔤", colorHex: "8B5CF6", description: "تحدَّ نفسك يوميًا بألغاز كلمات جديدة ومستويات متعددة.", price: "مجانًا"),
                  AppItem(id: 8, name: "محول الملفات", developer: "يوتيل سوفت", category: .tools, rating: 4.2, sizeMB: 30, emoji: "🔄", colorHex: "3B82F6", description: "حوّل ملفاتك بين الصيغ المختلفة مباشرة من هاتفك دون إنترنت.", price: "مجانًا"),
                  AppItem(id: 9, name: "مزرعتي السعيدة", developer: "فارم فن", category: .games, rating: 4.0, sizeMB: 275, emoji: "🌾", colorHex: "84CC16", description: "ابنِ مزرعتك الخاصة وازرع المحاصيل وربِّ الحيوانات.", price: "مجانًا"),
                  AppItem(id: 10, name: "مساعد الميزانية", developer: "موني آبس", category: .tools, rating: 4.6, sizeMB: 38, emoji: "💰", colorHex: "14B8A6", description: "تتبع مصاريفك الشهرية ونظّم ميزانيتك بسهولة.", price: "مجانًا"),
              ]
          }
          WEOF

      - name: Generate Source - App Cell
        run: |
          cd ${{ github.workspace }}
          cat > AppCell.swift << 'CEOF'
          import UIKit

          final class AppCell: UICollectionViewCell {
              static let reuseID = "AppCell"

              private let iconView = UIView()
              private let emojiLabel = UILabel()
              private let nameLabel = UILabel()
              private let devLabel = UILabel()
              private let ratingLabel = UILabel()
              private let installButton = UIButton(type: .system)

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  build()
              }

              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  build()
              }

              private func build() {
                  contentView.backgroundColor = UIColor(red: 26/255, green: 26/255, blue: 42/255, alpha: 1)
                  contentView.layer.cornerRadius = 16
                  contentView.layer.borderWidth = 1
                  contentView.layer.borderColor = UIColor.white.withAlphaComponent(0.06).cgColor

                  iconView.layer.cornerRadius = 14
                  iconView.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(iconView)

                  emojiLabel.font = .systemFont(ofSize: 30)
                  emojiLabel.textAlignment = .center
                  emojiLabel.translatesAutoresizingMaskIntoConstraints = false
                  iconView.addSubview(emojiLabel)

                  nameLabel.font = .systemFont(ofSize: 13, weight: .semibold)
                  nameLabel.textColor = .white
                  nameLabel.numberOfLines = 1
                  nameLabel.textAlignment = .center
                  nameLabel.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(nameLabel)

                  devLabel.font = .systemFont(ofSize: 10.5)
                  devLabel.textColor = UIColor.white.withAlphaComponent(0.5)
                  devLabel.numberOfLines = 1
                  devLabel.textAlignment = .center
                  devLabel.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(devLabel)

                  ratingLabel.font = .systemFont(ofSize: 10.5, weight: .medium)
                  ratingLabel.textColor = UIColor(hex: "F59E0B")
                  ratingLabel.textAlignment = .center
                  ratingLabel.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(ratingLabel)

                  installButton.setTitle("تثبيت", for: .normal)
                  installButton.titleLabel?.font = .systemFont(ofSize: 12, weight: .bold)
                  installButton.backgroundColor = UIColor(hex: "7C3AED")
                  installButton.setTitleColor(.white, for: .normal)
                  installButton.layer.cornerRadius = 14
                  installButton.isUserInteractionEnabled = false // زر شكلي للعرض فقط، بدون تنزيل فعلي
                  installButton.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(installButton)

                  NSLayoutConstraint.activate([
                      iconView.topAnchor.constraint(equalTo: contentView.topAnchor, constant: 12),
                      iconView.centerXAnchor.constraint(equalTo: contentView.centerXAnchor),
                      iconView.widthAnchor.constraint(equalToConstant: 64),
                      iconView.heightAnchor.constraint(equalToConstant: 64),

                      emojiLabel.centerXAnchor.constraint(equalTo: iconView.centerXAnchor),
                      emojiLabel.centerYAnchor.constraint(equalTo: iconView.centerYAnchor),

                      nameLabel.topAnchor.constraint(equalTo: iconView.bottomAnchor, constant: 8),
                      nameLabel.leadingAnchor.constraint(equalTo: contentView.leadingAnchor, constant: 6),
                      nameLabel.trailingAnchor.constraint(equalTo: contentView.trailingAnchor, constant: -6),

                      devLabel.topAnchor.constraint(equalTo: nameLabel.bottomAnchor, constant: 2),
                      devLabel.leadingAnchor.constraint(equalTo: nameLabel.leadingAnchor),
                      devLabel.trailingAnchor.constraint(equalTo: nameLabel.trailingAnchor),

                      ratingLabel.topAnchor.constraint(equalTo: devLabel.bottomAnchor, constant: 4),
                      ratingLabel.centerXAnchor.constraint(equalTo: contentView.centerXAnchor),

                      installButton.topAnchor.constraint(equalTo: ratingLabel.bottomAnchor, constant: 8),
                      installButton.leadingAnchor.constraint(equalTo: contentView.leadingAnchor, constant: 16),
                      installButton.trailingAnchor.constraint(equalTo: contentView.trailingAnchor, constant: -16),
                      installButton.heightAnchor.constraint(equalToConstant: 28),
                      installButton.bottomAnchor.constraint(equalTo: contentView.bottomAnchor, constant: -12),
                  ])
              }

              func configure(with item: AppItem) {
                  iconView.backgroundColor = UIColor(hex: item.colorHex).withAlphaComponent(0.25)
                  emojiLabel.text = item.emoji
                  nameLabel.text = item.name
                  devLabel.text = item.developer
                  ratingLabel.text = "★ \(String(format: "%.1f", item.rating))  ·  \(item.sizeMB) MB"
                  installButton.setTitle(item.price == "مجانًا" ? "تثبيت" : item.price, for: .normal)
              }
          }
          CEOF

      - name: Generate Source - Store View Controller
        run: |
          cd ${{ github.workspace }}
          cat > StoreViewController.swift << 'SEOF'
          import UIKit

          final class StoreViewController: UIViewController,
              UICollectionViewDataSource, UICollectionViewDelegate, UICollectionViewDelegateFlowLayout,
              UISearchBarDelegate {

              private let segmented = UISegmentedControl(items: StoreCategory.allCases.map { $0.rawValue })
              private let searchBar = UISearchBar()
              private var collectionView: UICollectionView!

              private var allItems: [AppItem] = MockData.items
              private var filtered: [AppItem] = MockData.items

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "سوق"
                  view.backgroundColor = UIColor(red: 12/255, green: 12/255, blue: 20/255, alpha: 1)
                  navigationController?.navigationBar.prefersLargeTitles = true
                  setupSearchBar()
                  setupSegmented()
                  setupCollectionView()
                  applyFilter()
              }

              private func setupSearchBar() {
                  searchBar.placeholder = "ابحث عن تطبيق أو لعبة"
                  searchBar.searchBarStyle = .minimal
                  searchBar.delegate = self
                  searchBar.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(searchBar)
                  NSLayoutConstraint.activate([
                      searchBar.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor, constant: 4),
                      searchBar.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 8),
                      searchBar.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -8),
                  ])
              }

              private func setupSegmented() {
                  segmented.selectedSegmentIndex = 0
                  segmented.addTarget(self, action: #selector(categoryChanged), for: .valueChanged)
                  segmented.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(segmented)
                  NSLayoutConstraint.activate([
                      segmented.topAnchor.constraint(equalTo: searchBar.bottomAnchor, constant: 4),
                      segmented.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 16),
                      segmented.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -16),
                  ])
              }

              private func setupCollectionView() {
                  let layout = UICollectionViewFlowLayout()
                  layout.minimumInteritemSpacing = 12
                  layout.minimumLineSpacing = 12
                  layout.sectionInset = UIEdgeInsets(top: 12, left: 16, bottom: 20, right: 16)

                  collectionView = UICollectionView(frame: .zero, collectionViewLayout: layout)
                  collectionView.backgroundColor = .clear
                  collectionView.dataSource = self
                  collectionView.delegate = self
                  collectionView.register(AppCell.self, forCellWithReuseIdentifier: AppCell.reuseID)
                  collectionView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(collectionView)

                  NSLayoutConstraint.activate([
                      collectionView.topAnchor.constraint(equalTo: segmented.bottomAnchor, constant: 8),
                      collectionView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      collectionView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      collectionView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                  ])
              }

              @objc private func categoryChanged() {
                  applyFilter()
              }

              private func applyFilter() {
                  let categoryIndex = segmented.selectedSegmentIndex
                  let category = StoreCategory.allCases[categoryIndex]
                  let query = searchBar.text?.trimmingCharacters(in: .whitespaces) ?? ""

                  filtered = allItems.filter { item in
                      let matchesCategory = (category == .all) || (item.category == category)
                      let matchesQuery = query.isEmpty || item.name.localizedCaseInsensitiveContains(query)
                          || item.developer.localizedCaseInsensitiveContains(query)
                      return matchesCategory && matchesQuery
                  }
                  collectionView.reloadData()
              }

              func searchBar(_ searchBar: UISearchBar, textDidChange searchText: String) {
                  applyFilter()
              }

              func searchBarSearchButtonClicked(_ searchBar: UISearchBar) {
                  searchBar.resignFirstResponder()
              }

              // MARK: UICollectionViewDataSource

              func collectionView(_ collectionView: UICollectionView, numberOfItemsInSection section: Int) -> Int {
                  filtered.count
              }

              func collectionView(_ collectionView: UICollectionView, cellForItemAt indexPath: IndexPath) -> UICollectionViewCell {
                  let cell = collectionView.dequeueReusableCell(withReuseIdentifier: AppCell.reuseID, for: indexPath) as! AppCell
                  cell.configure(with: filtered[indexPath.item])
                  return cell
              }

              func collectionView(_ collectionView: UICollectionView, didSelectItemAt indexPath: IndexPath) {
                  let item = filtered[indexPath.item]
                  let detail = DetailViewController(item: item)
                  navigationController?.pushViewController(detail, animated: true)
              }

              // MARK: Layout

              func collectionView(_ collectionView: UICollectionView, layout collectionViewLayout: UICollectionViewLayout,
                                   sizeForItemAt indexPath: IndexPath) -> CGSize {
                  let spacing: CGFloat = 12 * 3 + 32
                  let width = floor((collectionView.bounds.width - spacing) / 2)
                  return CGSize(width: width, height: 190)
              }
          }
          SEOF

      - name: Generate Source - Detail View Controller
        run: |
          cd ${{ github.workspace }}
          cat > DetailViewController.swift << 'DEOF'
          import UIKit

          final class DetailViewController: UIViewController {

              private let item: AppItem

              private let iconView = UIView()
              private let emojiLabel = UILabel()
              private let nameLabel = UILabel()
              private let devLabel = UILabel()
              private let ratingLabel = UILabel()
              private let sizeLabel = UILabel()
              private let installButton = UIButton(type: .system)
              private let progressView = UIProgressView(progressViewStyle: .default)
              private let descTitleLabel = UILabel()
              private let descLabel = UILabel()

              private var progressTimer: Timer?

              init(item: AppItem) {
                  self.item = item
                  super.init(nibName: nil, bundle: nil)
              }

              required init?(coder: NSCoder) {
                  fatalError("init(coder:) has not been implemented")
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 12/255, green: 12/255, blue: 20/255, alpha: 1)
                  title = item.name
                  build()
              }

              private func build() {
                  iconView.backgroundColor = UIColor(hex: item.colorHex).withAlphaComponent(0.25)
                  iconView.layer.cornerRadius = 22
                  iconView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(iconView)

                  emojiLabel.text = item.emoji
                  emojiLabel.font = .systemFont(ofSize: 46)
                  emojiLabel.textAlignment = .center
                  emojiLabel.translatesAutoresizingMaskIntoConstraints = false
                  iconView.addSubview(emojiLabel)

                  nameLabel.text = item.name
                  nameLabel.font = .systemFont(ofSize: 22, weight: .bold)
                  nameLabel.textColor = .white
                  nameLabel.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(nameLabel)

                  devLabel.text = item.developer
                  devLabel.font = .systemFont(ofSize: 14)
                  devLabel.textColor = UIColor.white.withAlphaComponent(0.55)
                  devLabel.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(devLabel)

                  ratingLabel.text = "★ \(String(format: "%.1f", item.rating))"
                  ratingLabel.font = .systemFont(ofSize: 13, weight: .medium)
                  ratingLabel.textColor = UIColor(hex: "F59E0B")
                  ratingLabel.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(ratingLabel)

                  sizeLabel.text = "\(item.sizeMB) MB  ·  \(item.category.rawValue)"
                  sizeLabel.font = .systemFont(ofSize: 13)
                  sizeLabel.textColor = UIColor.white.withAlphaComponent(0.55)
                  sizeLabel.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(sizeLabel)

                  installButton.setTitle(item.price == "مجانًا" ? "تثبيت" : "شراء \(item.price)", for: .normal)
                  installButton.titleLabel?.font = .systemFont(ofSize: 16, weight: .bold)
                  installButton.backgroundColor = UIColor(hex: "7C3AED")
                  installButton.setTitleColor(.white, for: .normal)
                  installButton.layer.cornerRadius = 12
                  installButton.addTarget(self, action: #selector(installTapped), for: .touchUpInside)
                  installButton.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(installButton)

                  progressView.progress = 0
                  progressView.progressTintColor = UIColor(hex: "7C3AED")
                  progressView.isHidden = true
                  progressView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(progressView)

                  descTitleLabel.text = "الوصف"
                  descTitleLabel.font = .systemFont(ofSize: 16, weight: .bold)
                  descTitleLabel.textColor = .white
                  descTitleLabel.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(descTitleLabel)

                  descLabel.text = item.description
                  descLabel.font = .systemFont(ofSize: 14)
                  descLabel.textColor = UIColor.white.withAlphaComponent(0.75)
                  descLabel.numberOfLines = 0
                  descLabel.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(descLabel)

                  NSLayoutConstraint.activate([
                      iconView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor, constant: 24),
                      iconView.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      iconView.widthAnchor.constraint(equalToConstant: 88),
                      iconView.heightAnchor.constraint(equalToConstant: 88),

                      emojiLabel.centerXAnchor.constraint(equalTo: iconView.centerXAnchor),
                      emojiLabel.centerYAnchor.constraint(equalTo: iconView.centerYAnchor),

                      nameLabel.topAnchor.constraint(equalTo: iconView.topAnchor, constant: 4),
                      nameLabel.leadingAnchor.constraint(equalTo: iconView.trailingAnchor, constant: 16),
                      nameLabel.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),

                      devLabel.topAnchor.constraint(equalTo: nameLabel.bottomAnchor, constant: 4),
                      devLabel.leadingAnchor.constraint(equalTo: nameLabel.leadingAnchor),

                      ratingLabel.topAnchor.constraint(equalTo: devLabel.bottomAnchor, constant: 6),
                      ratingLabel.leadingAnchor.constraint(equalTo: nameLabel.leadingAnchor),

                      sizeLabel.topAnchor.constraint(equalTo: ratingLabel.topAnchor),
                      sizeLabel.leadingAnchor.constraint(equalTo: ratingLabel.trailingAnchor, constant: 10),

                      installButton.topAnchor.constraint(equalTo: iconView.bottomAnchor, constant: 24),
                      installButton.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      installButton.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),
                      installButton.heightAnchor.constraint(equalToConstant: 46),

                      progressView.topAnchor.constraint(equalTo: installButton.bottomAnchor, constant: 10),
                      progressView.leadingAnchor.constraint(equalTo: installButton.leadingAnchor),
                      progressView.trailingAnchor.constraint(equalTo: installButton.trailingAnchor),

                      descTitleLabel.topAnchor.constraint(equalTo: progressView.bottomAnchor, constant: 24),
                      descTitleLabel.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),

                      descLabel.topAnchor.constraint(equalTo: descTitleLabel.bottomAnchor, constant: 8),
                      descLabel.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      descLabel.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),
                  ])
              }

              // ملاحظة مهمة: هذا الزر لا يقوم بأي تنزيل أو تثبيت فعلي لأي ملف؛
              // إنه فقط رسم متحرك تجريبي لشريط تقدم يوضح شكل الواجهة، ثم يتحول
              // إلى زر "فتح" شكلي بدون أي وظيفة تثبيت حقيقية.
              @objc private func installTapped() {
                  guard progressView.isHidden else { return }
                  installButton.isEnabled = false
                  installButton.setTitle("جارِ...", for: .normal)
                  progressView.isHidden = false
                  progressView.progress = 0

                  var progress: Float = 0
                  progressTimer?.invalidate()
                  progressTimer = Timer.scheduledTimer(withTimeInterval: 0.08, repeats: true) { [weak self] timer in
                      guard let self = self else { return }
                      progress += 0.04
                      self.progressView.setProgress(progress, animated: true)
                      if progress >= 1.0 {
                          timer.invalidate()
                          self.progressView.isHidden = true
                          self.installButton.isEnabled = true
                          self.installButton.setTitle("فتح", for: .normal)
                      }
                  }
              }

              deinit {
                  progressTimer?.invalidate()
              }
          }
          DEOF

      - name: Generate Source - Entry Point
        run: |
          cd ${{ github.workspace }}
          cat > main.swift << 'EEOF'
          import UIKit

          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let root = StoreViewController()
                  let nav = UINavigationController(rootViewController: root)
                  nav.navigationBar.barStyle = .black
                  window?.rootViewController = nav
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EEOF

      - name: Generate Info.plist
        run: |
          cd ${{ github.workspace }}
          cat > Resources/Info.plist << 'MEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
