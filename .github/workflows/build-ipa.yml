              private func openSettings() {
                  HapticManager.shared.selection()
                  if hasSeenSettingsOnboarding {
                      showSettings = true
                  } else {
                      showSettingsOnboarding = true
                  }
              }
          }

          // ================= NEW TAB BAR (Home / Categories / Updates / Profile) =================
          struct StoreTabBar: View {
              @Binding var tab: Int

              var body: some View {
                  HStack {
                      tabItem(icon: "house.fill", label: "Home", index: 0)
                      tabItem(icon: "square.grid.2x2.fill", label: "Categories", index: 1)
                      tabItem(icon: "arrow.down.circle.fill", label: "Updates", index: 2)
