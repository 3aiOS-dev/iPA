              let onDelete: () -> Void
              let onShare: () -> Void
              let onRevalidate: () -> Void
              let onTap: () -> Void
              @Environment(\.colorScheme) var scheme

              var body: some View {
                  HStack(spacing: 12) {
                      // Icon
                      ZStack {
                          RoundedRectangle(cornerRadius: 14)
                              .fill(LinearGradient(
                                  colors: [file.kind.color.opacity(0.85), file.kind.color.opacity(0.55)],
                                  startPoint: .topLeading, endPoint: .bottomTrailing
                              ))
                              .frame(width: 54, height: 54)
                              .shadow(color: file.kind.color.opacity(0.35), radius: 6, y: 2)
                          if let iconURL, let img = UIImage(contentsOfFile: iconURL.path) {
                              Image(uiImage: img)
                                  .resizable()
                                  .aspectRatio(contentMode: .fill)
                                  .frame(width: 50, height: 50)
                                  .clipShape(RoundedRectangle(cornerRadius: 12))
                          } else {
                              Image(systemName: file.kind.icon)
                                  .font(.system(size: 22, weight: .bold))
                                  .foregroundColor(.white)
                          }
