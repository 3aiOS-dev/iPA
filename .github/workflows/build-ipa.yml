                      (["productivity", "office", "word", "excel", "pdf", "scan", "إنتاجية", "ملفات", "notes"], "إنتاجية"),
                      (["travel", "سفر", "flight", "hotel", "فندق", "map", "خرائط", "uber", "careem", "booking"], "سفر"),
                      (["health", "fitness", "صحة", "رياضة", "workout", "gym", "diet", "نظام غذائي", "meditation"], "صحة ورياضة"),
                      (["food", "restaurant", "طعام", "مطعم", "hungerstation", "talabat", "جاهز", "recipe"], "طعام"),
                      (["news", "أخبار", "newspaper", "bbc", "cnn", "aljazeera"], "أخبار"),
