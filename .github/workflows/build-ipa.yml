name: Scraper Browser - Build IPA

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.scraper.app"
  NEW_APP_NAME:  "Scraper"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:

      - name: Maximize build resources
        run: |
          df -h
          ulimit -a
          sysctl -n hw.ncpu
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          for v in "15.4" "15.3" "15.2" "15.1" "15.0" "14.4"; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select --switch "/Applications/Xcode_${v}.app/Contents/Developer"
              echo "Using Xcode ${v}"
              break
            fi
          done
          if ! xcode-select -p 2>/dev/null; then
            sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # GENERATE SOURCE FILES FOR SCRAPER APP
      # =========================================================

      - name: Create Resources directory
        run: mkdir -p Resources

      - name: Generate Info.plist
        run: |
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>     <string>en</string>
              <key>CFBundleExecutable</key>            <string>Scraper</string>
              <key>CFBundleIdentifier</key>            <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
              <key>CFBundleName</key>                  <string>Scraper</string>
              <key>CFBundleDisplayName</key>           <string>Scraper</string>
              <key>CFBundlePackageType</key>           <string>APPL</string>
              <key>CFBundleSignature</key>             <string>????</string>
              <key>CFBundleShortVersionString</key>    <string>1.0</string>
              <key>CFBundleVersion</key>               <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key>            <true/>
              <key>UIFileSharingEnabled</key>          <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>   <true/>
              </dict>
              <key>MinimumOSVersion</key>              <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiresFullScreen</key>          <true/>
              <key>UIStatusBarHidden</key>             <false/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
          </dict>
          </plist>
          PEOF

      - name: Generate ScraperApp.swift
        run: |
          cat > ScraperApp.swift << 'EOF'
          import SwiftUI

          @main
          struct ScraperApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

      - name: Generate ContentView.swift
        run: |
          cat > ContentView.swift << 'EOF'
          import SwiftUI
          import WebKit

          class LinkStore: ObservableObject {
              static let shared = LinkStore()
              @Published var allLinks: [String] = []
              @Published var jsonLinks: [String] = []
              @Published var isVerifyingJSON: Bool = false

              private init() {
                  NotificationCenter.default.addObserver(self, selector: #selector(linksReceived(_:)), name: .linksExtracted, object: nil)
                  NotificationCenter.default.addObserver(self, selector: #selector(jsonReceived(_:)), name: .jsonLinksExtracted, object: nil)
                  NotificationCenter.default.addObserver(self, selector: #selector(jsonVerificationStarted), name: .jsonVerificationStarted, object: nil)
              }

              @objc private func linksReceived(_ notification: Notification) {
                  if let links = notification.object as? [String] {
                      DispatchQueue.main.async {
                          // ÙÙ ØªØ´ÙÙØ± Ø£Ù Ø±ÙØ§Ø¨Ø· ÙØªØ¨ÙÙØ© ÙØ¥Ø²Ø§ÙØ© Ø§ÙØªÙØ±Ø§Ø± ÙØ¹ Ø§ÙØ­ÙØ§Ø¸ Ø¹ÙÙ Ø§ÙØªØ±ØªÙØ¨
                          var seen = Set<String>()
                          self.allLinks = links.map { LinkStore.decode($0) }.filter { seen.insert($0).inserted }
                      }
                  }
              }

              @objc private func jsonReceived(_ notification: Notification) {
                  self.isVerifyingJSON = false
                  if let links = notification.object as? [String] {
                      DispatchQueue.main.async {
                          var seen = Set<String>()
                          self.jsonLinks = links.map { LinkStore.decode($0) }.filter { seen.insert($0).inserted }
                      }
                  }
              }

              @objc private func jsonVerificationStarted() {
                  DispatchQueue.main.async {
                      self.isVerifyingJSON = true
                  }
              }

              /// ÙÙ ØªØ´ÙÙØ± Ø§ÙØ±Ø§Ø¨Ø· (URL-encoding) Ø¨Ø´ÙÙ ÙØªÙØ±Ø± ÙØ¥Ø²Ø§ÙØ© Ø£Ù Ø·Ø¨ÙØ§Øª ØªØ´ÙÙØ± ÙØªØ¯Ø§Ø®ÙØ©
              static func decode(_ raw: String) -> String {
                  var current = raw
                  for _ in 0..<3 {
                      guard let decoded = current.removingPercentEncoding, decoded != current else { break }
                      current = decoded
                  }
                  return current
              }
          }

          struct ContentView: View {
              @State private var urlString: String = "https://example.com"
              @State private var isLoading: Bool = false
              @State private var selectedTab: Tab = .browser
              @State private var jsonInput: String = ""
              @State private var jsonParseResult: String = ""
              @State private var parsedApps: [AppInfo] = []
              @ObservedObject private var linkStore = LinkStore.shared

              enum Tab: String, CaseIterable {
                  case browser = "ÙØªØµÙØ­"
                  case links = "Ø§ÙØ±ÙØ§Ø¨Ø·"
                  case json = "JSON"
              }

              var body: some View {
                  NavigationView {
                      VStack(spacing: 0) {
                          // Address bar
                          HStack {
                              TextField("Ø£Ø¯Ø®Ù Ø§ÙØ±Ø§Ø¨Ø·", text: $urlString)
                                  .textFieldStyle(RoundedBorderTextFieldStyle())
                                  .autocapitalization(.none)
                                  .disableAutocorrection(true)
                              Button(action: loadPage) {
                                  Image(systemName: "arrow.right.circle.fill")
                                      .font(.title2)
                              }
                              .disabled(isLoading)
                          }
                          .padding(.horizontal)
                          .padding(.top, 8)

                          // Tab selector
                          Picker("", selection: $selectedTab) {
                              ForEach(Tab.allCases, id: \.self) { tab in
                                  Text(tab.rawValue).tag(tab)
                              }
                          }
                          .pickerStyle(SegmentedPickerStyle())
                          .padding(.horizontal)
                          .padding(.vertical, 4)

                          // Content
                          Group {
                              switch selectedTab {
                              case .browser:
                                  WebView(urlString: $urlString, isLoading: $isLoading)
                                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                              case .links:
                                  LinksListView(links: linkStore.allLinks, jsonLinks: linkStore.jsonLinks)
                              case .json:
                                  JSONView(jsonInput: $jsonInput, parsedApps: $parsedApps, jsonParseResult: $jsonParseResult)
                              }
                          }
                          .frame(maxWidth: .infinity, maxHeight: .infinity)

                          // Action buttons (only in browser tab)
                          if selectedTab == .browser {
                              HStack {
                                  Button("Ø§Ø³ØªØ®Ø±Ø§Ø¬ Ø§ÙØ±ÙØ§Ø¨Ø·") {
                                      NotificationCenter.default.post(name: .extractLinks, object: nil)
                                  }
                                  .buttonStyle(.borderedProminent)
                                  Button {
                                      NotificationCenter.default.post(name: .jsonVerificationStarted, object: nil)
                                      NotificationCenter.default.post(name: .extractJSONLinks, object: nil)
                                  } label: {
                                      if linkStore.isVerifyingJSON {
                                          HStack(spacing: 4) {
                                              ProgressView().scaleEffect(0.7)
                                              Text("Ø¬Ø§Ø±Ù Ø§ÙØªØ­ÙÙ...")
                                          }
                                      } else {
                                          Text("Ø§Ø³ØªØ®Ø±Ø§Ø¬ JSON ÙØ¹ÙÙ")
                                      }
                                  }
                                  .buttonStyle(.bordered)
                                  .disabled(linkStore.isVerifyingJSON)
                              }
                              .padding(.horizontal)
                              .padding(.bottom, 4)
                          }
                      }
                      .navigationTitle("Scraper")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }

              private func loadPage() {
                  let current = urlString
                  urlString = ""
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.1) {
                      urlString = current
                  }
              }
          }

          extension Notification.Name {
              static let extractLinks = Notification.Name("extractLinks")
              static let extractJSONLinks = Notification.Name("extractJSONLinks")
              static let linksExtracted = Notification.Name("linksExtracted")
              static let jsonLinksExtracted = Notification.Name("jsonLinksExtracted")
              static let jsonVerificationStarted = Notification.Name("jsonVerificationStarted")
          }

          struct LinksListView: View {
              let links: [String]
              let jsonLinks: [String]

              var body: some View {
                  List {
                      if !links.isEmpty {
                          Section(header: Text("ÙÙ Ø§ÙØ±ÙØ§Ø¨Ø· (\(links.count))")) {
                              ForEach(links, id: \.self) { link in
                                  Text(link)
                                      .font(.caption)
                                      .lineLimit(1)
                                      .contextMenu {
                                          Button("ÙØ³Ø®") {
                                              UIPasteboard.general.string = link
                                          }
                                      }
                              }
                          }
                      }
                      if !jsonLinks.isEmpty {
                          Section(header: Text("Ø±ÙØ§Ø¨Ø· JSON ÙØ¤ÙØ¯Ø© ÙØ¹ÙÙØ§Ù (\(jsonLinks.count))")) {
                              ForEach(jsonLinks, id: \.self) { link in
                                  Text(link)
                                      .font(.caption)
                                      .foregroundColor(.blue)
                                      .lineLimit(1)
                                      .contextMenu {
                                          Button("ÙØ³Ø®") {
                                              UIPasteboard.general.string = link
                                          }
                                      }
                              }
                          }
                      }
                      if links.isEmpty && jsonLinks.isEmpty {
                          Text("ÙØ§ ØªÙØ¬Ø¯ Ø±ÙØ§Ø¨Ø· ÙØ³ØªØ®Ø±Ø¬Ø© Ø¨Ø¹Ø¯")
                              .foregroundColor(.gray)
                              .padding()
                      }
                  }
                  .listStyle(PlainListStyle())
              }
          }

          struct JSONView: View {
              @Binding var jsonInput: String
              @Binding var parsedApps: [AppInfo]
              @Binding var jsonParseResult: String

              var body: some View {
                  VStack {
                      HStack {
                          TextField("Ø£Ø¯Ø®Ù Ø±Ø§Ø¨Ø· JSON", text: $jsonInput)
                              .textFieldStyle(RoundedBorderTextFieldStyle())
                              .autocapitalization(.none)
                              .disableAutocorrection(true)
                          Button("ØªØ­ÙÙÙ") {
                              parseJSON(from: jsonInput)
                          }
                          .buttonStyle(.borderedProminent)
                      }
                      .padding(.horizontal)

                      if !jsonParseResult.isEmpty {
                          Text(jsonParseResult)
                              .font(.caption)
                              .foregroundColor(.green)
                              .padding(.horizontal)
                      }

                      if parsedApps.isEmpty {
                          Text("ÙØ§ ØªÙØ¬Ø¯ ØªØ·Ø¨ÙÙØ§Øª ÙØ³ØªØ®Ø±Ø¬Ø©")
                              .foregroundColor(.gray)
                              .padding()
                      } else {
                          List(parsedApps, id: \.id) { app in
                              HStack {
                                  AsyncImage(url: URL(string: app.iconURL ?? "")) { phase in
                                      switch phase {
                                      case .success(let image):
                                          image.resizable().aspectRatio(contentMode: .fit)
                                      default:
                                          Color.gray
                                      }
                                  }
                                  .frame(width: 40, height: 40)
                                  .cornerRadius(8)

                                  VStack(alignment: .leading) {
                                      Text(app.name).font(.headline)
                                      if let bundle = app.bundleId {
                                          Text(bundle).font(.caption).foregroundColor(.gray)
                                      }
                                      if let version = app.version {
                                          Text("Ø§ÙØ¥ØµØ¯Ø§Ø±: \(version)").font(.caption2)
                                      }
                                  }
                                  Spacer()
                                  if let url = app.ipaURL, !url.isEmpty {
                                      Button("ØªØ­ÙÙÙ IPA") {
                                          if let url = URL(string: url) {
                                              UIApplication.shared.open(url)
                                          }
                                      }
                                      .buttonStyle(.bordered)
                                      .font(.caption)
                                  }
                              }
                              .padding(.vertical, 4)
                          }
                      }
                  }
                  .padding(.top)
              }

              private func parseJSON(from urlString: String) {
                  guard let url = URL(string: urlString) else {
                      jsonParseResult = "Ø±Ø§Ø¨Ø· ØºÙØ± ØµØ­ÙØ­"
                      return
                  }
                  jsonParseResult = "Ø¬Ø§Ø±Ù Ø§ÙØªØ­ÙÙÙ..."
                  URLSession.shared.dataTask(with: url) { data, _, error in
                      DispatchQueue.main.async {
                          if let error = error {
                              jsonParseResult = "Ø®Ø·Ø£: \(error.localizedDescription)"
                              return
                          }
                          guard let data = data else {
                              jsonParseResult = "ÙØ§ ØªÙØ¬Ø¯ Ø¨ÙØ§ÙØ§Øª"
                              return
                          }
                          do {
                              let decoder = JSONDecoder()
                              if let appArray = try? decoder.decode([AppInfo].self, from: data) {
                                  parsedApps = appArray
                                  jsonParseResult = "ØªÙ Ø§Ø³ØªØ®Ø±Ø§Ø¬ \(appArray.count) ØªØ·Ø¨ÙÙ"
                              } else if let wrapper = try? decoder.decode([String: [AppInfo]].self, from: data),
                                        let apps = wrapper["apps"] {
                                  parsedApps = apps
                                  jsonParseResult = "ØªÙ Ø§Ø³ØªØ®Ø±Ø§Ø¬ \(apps.count) ØªØ·Ø¨ÙÙ"
                              } else {
                                  jsonParseResult = "ØµÙØºØ© JSON ØºÙØ± ÙØ¯Ø¹ÙÙØ©"
                              }
                          } catch {
                              jsonParseResult = "Ø®Ø·Ø£ ÙÙ Ø§ÙØªØ­ÙÙÙ: \(error.localizedDescription)"
                          }
                      }
                  }.resume()
              }
          }

          struct AppInfo: Codable, Identifiable {
              let id: Int
              let name: String
              let bundleId: String?
              let version: String?
              let iconURL: String?
              let ipaURL: String?
              let description: String?

              enum CodingKeys: String, CodingKey {
                  case id
                  case name
                  case bundleId = "bundle_id"
                  case version
                  case iconURL = "icon_url"
                  case ipaURL = "ipa_url"
                  case description
              }
          }
          EOF

      - name: Generate WebView.swift
        run: |
          cat > WebView.swift << 'EOF'
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              @Binding var urlString: String
              @Binding var isLoading: Bool

              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.preferences.javaScriptEnabled = true
                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = context.coordinator
                  if let url = URL(string: urlString) {
                      webView.load(URLRequest(url: url))
                  }
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {
                  if let url = URL(string: urlString), uiView.url?.absoluteString != urlString {
                      uiView.load(URLRequest(url: url))
                  }
              }

              class Coordinator: NSObject, WKNavigationDelegate {
                  var parent: WebView
                  weak var webView: WKWebView?

                  init(_ parent: WebView) {
                      self.parent = parent
                      super.init()
                      NotificationCenter.default.addObserver(self, selector: #selector(extractLinks), name: .extractLinks, object: nil)
                      NotificationCenter.default.addObserver(self, selector: #selector(extractJSON), name: .extractJSONLinks, object: nil)
                  }

                  /// Ø§Ø³ØªØ®Ø±Ø§Ø¬ ÙÙ Ø§ÙØ±ÙØ§Ø¨Ø· ÙÙ Ø§ÙØµÙØ­Ø©Ø ÙØ¹ ØªØ­ÙÙÙÙØ§ ÙØ±ÙØ§Ø¨Ø· ÙØ·ÙÙØ© ÙÙÙ ØªØ´ÙÙØ±ÙØ§ ÙØ¥Ø²Ø§ÙØ© Ø§ÙØªÙØ±Ø§Ø±
                  @objc func extractLinks() {
                      let js = """
                      (function () {
                          const found = new Set();
                          const addUrl = (raw) => {
                              if (!raw) return;
                              try {
                                  let abs = new URL(raw, location.href).href;
                                  try { abs = decodeURIComponent(abs); } catch (e) {}
                                  if (abs && !abs.startsWith('javascript:')) found.add(abs);
                              } catch (e) {}
                          };
                          document.querySelectorAll('a[href]').forEach(a => addUrl(a.getAttribute('href')));
                          document.querySelectorAll('[data-href]').forEach(a => addUrl(a.getAttribute('data-href')));
                          document.querySelectorAll('link[href]').forEach(l => addUrl(l.getAttribute('href')));
                          return Array.from(found);
                      })();
                      """
                      webView?.evaluateJavaScript(js) { (result, error) in
                          if let links = result as? [String] {
                              DispatchQueue.main.async {
                                  NotificationCenter.default.post(name: .linksExtracted, object: links)
                              }
                          } else {
                              DispatchQueue.main.async {
                                  NotificationCenter.default.post(name: .linksExtracted, object: [String]())
                              }
                          }
                      }
                  }

                  /// Ø§Ø³ØªØ®Ø±Ø§Ø¬ Ø±ÙØ§Ø¨Ø· JSON ÙØ¹ ØªØ­ÙÙ ÙØ¹ÙÙ: ÙØ¬Ø±Ø¨ ØªØ­ÙÙÙ ÙÙ Ø±Ø§Ø¨Ø· ÙØ±Ø´ÙØ­ ÙÙØªØ£ÙØ¯ Ø£Ù ÙØ­ØªÙØ§Ù
                  /// JSON ØµØ§ÙØ­ ÙØ¹ÙØ§Ù (Ø¹Ø¨Ø± Content-Type Ø£Ù ØªØ­ÙÙÙ Ø§ÙÙØµ)Ø Ø¨Ø§ÙØ¥Ø¶Ø§ÙØ© ÙÙØ­Øµ Ø£Ù ÙØªÙ
                  /// JSON ÙØ¶ÙÙÙØ© Ø¯Ø§Ø®Ù Ø§ÙØµÙØ­Ø© ÙÙØ³ÙØ§ (script[type="application/json"] ÙØ§ÙÙØµÙØµ Ø§ÙÙØ¶ÙÙØ©).
                  @objc func extractJSON() {
                      let js = """
                      (async function () {
                          const decode = (u) => { try { return decodeURIComponent(u); } catch (e) { return u; } };
                          const candidates = new Set();

                          // Ø±ÙØ§Ø¨Ø· <a> ÙÙØµØ§Ø¯Ø± <script>
                          document.querySelectorAll('a[href]').forEach(a => {
                              try { candidates.add(new URL(a.getAttribute('href'), location.href).href); } catch (e) {}
                          });
                          document.querySelectorAll('script[src]').forEach(s => {
                              try { candidates.add(new URL(s.getAttribute('src'), location.href).href); } catch (e) {}
                          });

                          // Ø§Ø³ØªØ®Ø±Ø§Ø¬ ÙØ³Ø§Ø±Ø§Øª JSON/API ÙØ¶ÙÙØ© Ø¯Ø§Ø®Ù ÙØµÙØµ Ø§ÙØ³ÙØ±Ø¨ØªØ§Øª (ÙØ«ÙØ§Ù fetch('/api/x'))
                          const urlPattern = /["'](\\/[^"'\\s]+?(?:\\.json|\\/api\\/[^"'\\s]*|\\?[^"'\\s]*(?:format|type)=json[^"'\\s]*)[^"'\\s]*)["']/gi;
                          document.querySelectorAll('script:not([src])').forEach(s => {
                              const text = s.textContent || '';
                              let m;
                              while ((m = urlPattern.exec(text)) !== null) {
                                  try { candidates.add(new URL(m[1], location.href).href); } catch (e) {}
                              }
                          });

                          // ØªØ¶ÙÙÙ Ø§ÙÙØ§Ø¦ÙØ© ÙØ±ÙØ§Ø¨Ø· ØªÙÙÙØ­ ÙØ¹ÙØ§Ù ÙÙØ­ØªÙÙ JSON ÙØ¨Ù Ø§ÙØªØ­ÙÙ Ø§ÙØ´Ø¨ÙÙ (ÙØªÙÙÙÙ Ø¹Ø¯Ø¯ Ø§ÙØ·ÙØ¨Ø§Øª)
                          const filtered = Array.from(candidates).filter(u => {
                              const low = u.toLowerCase();
                              return low.includes('.json') || low.includes('/api/') ||
                                     low.includes('graphql') || low.includes('format=json') ||
                                     low.includes('type=json');
                          }).slice(0, 40);

                          const confirmed = [];

                          // ØªØ­ÙÙ ÙØ¹ÙÙ Ø¨Ø¬ÙØ¨ ÙÙ ÙØ±Ø´ÙØ­ ÙÙØ­Ø§ÙÙØ© ØªØ­ÙÙÙÙ ÙÙ JSON Ø­ÙÙÙÙ
                          await Promise.all(filtered.map(async (u) => {
                              try {
                                  const resp = await fetch(u, { credentials: 'include' });
                                  const ct = (resp.headers.get('content-type') || '').toLowerCase();
                                  if (ct.includes('json')) {
                                      confirmed.push(decode(u));
                                      return;
                                  }
                                  const text = await resp.text();
                                  JSON.parse(text);
                                  confirmed.push(decode(u));
                              } catch (e) {
                                  // ÙÙØ³ JSON ØµØ§ÙØ­Ø§Ù Ø£Ù ØªØ¹Ø°Ø± Ø§ÙÙØµÙÙ Ø¥ÙÙÙ (CORS/Ø´Ø¨ÙØ©) â ÙØªÙ ØªØ¬Ø§ÙÙÙ
                              }
                          }));

                          // ÙØªÙ JSON ÙØ¶ÙÙÙØ© ÙØ¹ÙÙØ§Ù Ø¯Ø§Ø®Ù Ø§ÙØµÙØ­Ø© ÙÙØ³ÙØ§ (structured data, state hydration...)
                          document.querySelectorAll('script[type="application/json"], script[type="application/ld+json"]').forEach((s, i) => {
                              try {
                                  JSON.parse(s.textContent);
                                  confirmed.push('inline://' + (s.id || s.getAttribute('data-name') || ('script-' + i)));
                              } catch (e) {}
                          });

                          return Array.from(new Set(confirmed));
                      })();
                      """
                      webView?.evaluateJavaScript(js) { (result, error) in
                          if let links = result as? [String] {
                              DispatchQueue.main.async {
                                  NotificationCenter.default.post(name: .jsonLinksExtracted, object: links)
                              }
                          } else {
                              DispatchQueue.main.async {
                                  NotificationCenter.default.post(name: .jsonLinksExtracted, object: [String]())
                              }
                          }
                      }
                  }

                  func webView(_ webView: WKWebView, didStartProvisionalNavigation navigation: WKNavigation!) {
                      DispatchQueue.main.async {
                          self.parent.isLoading = true
                      }
                  }

                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                      DispatchQueue.main.async {
                          self.parent.isLoading = false
                          self.parent.urlString = webView.url?.absoluteString ?? ""
                      }
                      self.webView = webView
                  }

                  func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
                      DispatchQueue.main.async {
                          self.parent.isLoading = false
                      }
                  }
              }
          }
          EOF

      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc \
            ScraperApp.swift \
            ContentView.swift \
            WebView.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name Scraper \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework WebKit \
            -o Scraper

      - name: Create IPA package
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          mkdir -p build-output/Payload/Scraper.app
          cp -X Scraper build-output/Payload/Scraper.app/Scraper
          cp -X Resources/Info.plist build-output/Payload/Scraper.app/Info.plist
          xattr -cr build-output
          find build-output -name ".DS_Store" -delete

          rm -f artifacts/scraper.ipa
          mkdir -p artifacts
          cd build-output && zip -r -X -q -fz- -Z deflate ../artifacts/scraper.ipa Payload && cd ..
          unzip -tq artifacts/scraper.ipa >/dev/null 2>&1 || { echo "IPA corrupt"; exit 1; }
          ls -lh artifacts/scraper.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scraper-IPA
          path: artifacts/scraper.ipa
          compression-level: 0
          retention-days: 90
