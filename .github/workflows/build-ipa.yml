          struct ImportedFileRow: View {
              let file: ImportedFile
              let iconURL: URL?
              let onRename: () -> Void
              let onDelete: () -> Void
              let onShare: () -> Void
              let onRevalidate: () -> Void
              let onTap: () -> Void

              var body: some View {
                  HStack(spacing: 12) {
                      ZStack {
                          RoundedRectangle(cornerRadius: 10)
                              .fill(file.kind.color.opacity(0.15))
                              .frame(width: 48, height: 48)
                          if let iconURL, let img = UIImage(contentsOfFile: iconURL.path) {
                              Image(uiImage: img)
                                  .resizable()
                                  .aspectRatio(contentMode: .fill)
                                  .frame(width: 44, height: 44)
                                  .clipShape(RoundedRectangle(cornerRadius: 8))
                          } else {
                              Image(systemName: file.kind.icon)
                                  .font(.system(size: 20, weight: .bold))
                                  .foregroundColor(file.kind.color)
                          }
                      }

                      VStack(alignment: .trailing, spacing: 3) {
                          HStack(spacing: 5) {
                              if file.isValid {
                                  Image(systemName: "checkmark.seal.fill")
                                      .foregroundColor(.xcodeGreen)
                                      .font(.system(size: 10))
                              } else {
                                  Image(systemName: "exclamationmark.triangle.fill")
                                      .foregroundColor(.xcodeOrange)
                                      .font(.system(size: 10))
                              }
                              Text(displayTitle)
                                  .font(.system(size: 13, weight: .bold))
                                  .lineLimit(1)
                              Spacer(minLength: 0)
                          }
                          if let sub = subtitle {
                              Text(sub)
                                  .font(.system(size: 10))
                                  .foregroundColor(.xcodeSecondary)
                                  .lineLimit(1)
                                  .frame(maxWidth: .infinity, alignment: .trailing)
                          }
                          HStack(spacing: 6) {
                              Spacer()
                              TagPill(icon: file.kind.icon, color: file.kind.color, text: file.kind.displayName)
                              Label(file.formattedSize, systemImage: "memorychip")
                                  .font(.system(size: 9))
                                  .foregroundColor(.xcodeSecondary)
                              Label(file.formattedDate, systemImage: "calendar")
                                  .font(.system(size: 9))
                                  .foregroundColor(.xcodeSecondary)
                          }
                          if !file.isValid, let err = file.validationError {
                              Text(err)
                                  .font(.system(size: 9, weight: .semibold))
                                  .foregroundColor(.xcodeOrange)
                                  .frame(maxWidth: .infinity, alignment: .trailing)
                                  .lineLimit(2)
                          }
                      }
                  }
                  .padding(10)
                  .xcodeCard(radius: 12)
                  .overlay(
                      RoundedRectangle(cornerRadius: 12)
                          .stroke(file.isValid ? Color.xcodeBlue.opacity(0.08) : Color.xcodeOrange.opacity(0.3),
                                  lineWidth: file.isValid ? 0.5 : 1)
                  )
                  .contentShape(Rectangle())
                  .onTapGesture { HapticManager.shared.impact(.light); onTap() }
                  .contextMenu {
                      Button { onTap() } label: { Label("عرض التفاصيل", systemImage: "info.circle") }
                      Button { onRename() } label: { Label("إعادة تسمية", systemImage: "pencil") }
                      Button { onShare() } label: { Label("مشاركة", systemImage: "square.and.arrow.up") }
                      Button { onRevalidate() } label: { Label("إعادة التحقق", systemImage: "arrow.clockwise") }
                      Divider()
                      Button(role: .destructive) { onDelete() } label: { Label("حذف", systemImage: "trash") }
                  }
                  .swipeActions(edge: .trailing, allowsFullSwipe: true) {
                      Button(role: .destructive, action: onDelete) {
                          Label("حذف", systemImage: "trash")
                      }
                      Button(action: onRename) {
                          Label("إعادة تسمية", systemImage: "pencil")
                      }.tint(.xcodeBlue)
                      Button(action: onShare) {
                          Label("مشاركة", systemImage: "square.and.arrow.up")
                      }.tint(.xcodeGreen)
                  }
              }

              private var displayTitle: String {
                  if let name = file.ipaDisplayName, !name.isEmpty { return name }
                  return file.originalName
              }

              private var subtitle: String? {
                  switch file.kind {
                  case .ipa:
                      var parts: [String] = []
                      if let b = file.ipaBundleID, !b.isEmpty { parts.append(b) }
                      if let v = file.ipaVersion, !v.isEmpty { parts.append("v\(v)") }
                      return parts.isEmpty ? nil : parts.joined(separator: " • ")
                  case .mobileprovision:
                      if let n = file.profileName, !n.isEmpty { return n }
                      return nil
                  case .p12, .other:
                      return nil
                  }
              }
          }

