      - name: Generate Source - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          // MARK: - Haptic Manager
          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  let g = UIImpactFeedbackGenerator(style: style); g.impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  let g = UINotificationFeedbackGenerator(); g.notificationOccurred(type)
              }
              func selection() {
                  let g = UISelectionFeedbackGenerator(); g.selectionChanged()
              }
          }

          // MARK: - Glass Card Modifier
          extension View {
              func glassCard(radius: CGFloat = 20, padding: CGFloat = 0) -> some View {
                  self
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(Color(UIColor.systemBackground).opacity(0.08))
                              .background(
                                  RoundedRectangle(cornerRadius: radius)
                                      .fill(Color(UIColor { t in t.userInterfaceStyle == .dark
                                          ? UIColor(red: 0.11, green: 0.11, blue: 0.18, alpha: 1)
                                          : UIColor(red: 0.97, green: 0.97, blue: 1.0,  alpha: 1) })
                                      )
                              )
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(Color.white.opacity(0.10), lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
                      .shadow(color: .black.opacity(0.08), radius: 8, x: 0, y: 4)
              }
          }
          VIPEOF
          echo "HapticManager.swift: $(wc -l < HapticManager.swift) lines"

      - name: Generate Source - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - App Data Model
          struct AppItem: Identifiable, Codable {
              var id = UUID()
              let name: String
              let type: Int
              let bundleID: String
              let bundleIdentifier: String
              let version: String
              let versionDate: String
              let fullDate: String
              let size: Int
              let down: String
              let downloadURL: String
              let developerName: String
              let localizedDescription: String
              let icon: String
              let iconURL: String
              var category: String?

              enum CodingKeys: String, CodingKey {
                  case name, type, bundleID, bundleIdentifier, version, versionDate,
                       fullDate, size, down, downloadURL, developerName,
                       localizedDescription, icon, iconURL
              }

              var formattedSize: String { ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .file) }

              var formattedDate: String {
                  let input = DateFormatter(); input.dateFormat = "yyyy-MM-dd"
                  if let d = input.date(from: versionDate) {
                      let out = DateFormatter(); out.dateFormat = "dd-MM-yyyy"; return out.string(from: d)
                  }
                  return versionDate
              }

              var subscriptionType: String {
                  if localizedDescription.contains("Subscription Unlocked") { return "الاشتراك مدى الحياة" }
                  if localizedDescription.contains("Premium") { return "بريميوم" }
                  if localizedDescription.contains("Pro")     { return "Pro" }
                  if localizedDescription.contains("Gold")    { return "Gold" }
                  if localizedDescription.contains("IAP")     { return "المشتريات مفعّلة" }
                  return "مفعّل"
              }

              var isNew: Bool {
                  let f = DateFormatter(); f.dateFormat = "yyyy-MM-dd"
                  guard let d = f.date(from: versionDate) else { return false }
                  return Calendar.current.dateComponents([.day], from: d, to: Date()).day ?? 999 < 7
              }

              var isPopular: Bool { (Int(down) ?? 0) > 500 }

              var _secureDownloadURL: String { downloadURL }
          }

          // MARK: - API Response
          struct AppsResponse: Codable {
              let name: String; let identifier: String; let sourceURL: String
              let iconURL: String; let website: String; let ipawebsite: String
              let subtitle: String; let apps: [AppItem]
          }

          // MARK: - App Category
          struct AppCategory: Identifiable {
              let id = UUID()
              let name: String; let icon: String; let gradient: [Color]
          }

          // MARK: - Imported File Model
          struct ImportedFile: Identifiable, Codable, Equatable {
              var id: UUID = UUID()
              var originalName: String
              var storedName: String
              var fileType: FileType
              var sizeBytes: Int64
              var importedAt: Date
              var appName: String?
              var appVersion: String?
              var bundleID: String?
              var iconPath: String?
              var notes: String

              enum FileType: String, Codable, CaseIterable {
                  case ipa            = "IPA"
                  case mobileprovision = "MobileProvision"
                  case p12            = "P12"

                  var fileExtension: String {
                      switch self {
                      case .ipa:            return "ipa"
                      case .mobileprovision: return "mobileprovision"
                      case .p12:            return "p12"
                      }
                  }

                  var systemIcon: String {
                      switch self {
                      case .ipa:            return "app.badge.fill"
                      case .mobileprovision: return "checkmark.shield.fill"
                      case .p12:            return "key.fill"
                      }
                  }

                  var displayName: String {
                      switch self {
                      case .ipa:            return "تطبيق iOS"
                      case .mobileprovision: return "ملف التوقيع"
                      case .p12:            return "شهادة P12"
                      }
                  }

                  var gradient: [Color] {
                      switch self {
                      case .ipa:            return [Color.vipPurple, .blue]
                      case .mobileprovision: return [.green, .teal]
                      case .p12:            return [.orange, .red]
                      }
                  }
              }

              var formattedSize: String {
                  ByteCountFormatter.string(fromByteCount: sizeBytes, countStyle: .file)
              }

              var formattedDate: String {
                  let f = DateFormatter()
                  f.dateFormat = "yyyy-MM-dd HH:mm"
                  return f.string(from: importedAt)
              }

              static func == (lhs: ImportedFile, rhs: ImportedFile) -> Bool { lhs.id == rhs.id }
          }
          VIPEOF
          echo "Models.swift: $(wc -l < Models.swift) lines"

      - name: Generate Source - FileImporterManager.swift
        run: |
          cat > FileImporterManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UniformTypeIdentifiers

          // MARK: - File Importer Manager
          @MainActor
          final class FileImporterManager: ObservableObject {
              @Published var files: [ImportedFile] = []
              @Published var isImporting: Bool = false
              @Published var lastError: String?
              @Published var lastSuccess: String?

              private let storageKey = "importedFiles_v1"
              private let metadataKey = "importedFilesMeta_v1"

              // Storage directory
              static var storageDirectory: URL {
                  let fm = FileManager.default
                  let base = try! fm.url(for: .applicationSupportDirectory,
                                         in: .userDomainMask,
                                         appropriateFor: nil, create: true)
                  let dir = base.appendingPathComponent("ImportedFiles", isDirectory: true)
                  if !fm.fileExists(atPath: dir.path) {
                      try? fm.createDirectory(at: dir, withIntermediateDirectories: true)
                  }
                  return dir
              }

              static var iconsDirectory: URL {
                  let fm = FileManager.default
                  let base = try! fm.url(for: .applicationSupportDirectory,
                                         in: .userDomainMask,
                                         appropriateFor: nil, create: true)
                  let dir = base.appendingPathComponent("ImportedIcons", isDirectory: true)
                  if !fm.fileExists(atPath: dir.path) {
                      try? fm.createDirectory(at: dir, withIntermediateDirectories: true)
                  }
                  return dir
              }

              init() { loadFromDisk() }

              // MARK: - Persistence
              private func loadFromDisk() {
                  guard let data = UserDefaults.standard.data(forKey: storageKey) else { return }
                  if let decoded = try? JSONDecoder().decode([ImportedFile].self, from: data) {
                      self.files = decoded.sorted { $0.importedAt > $1.importedAt }
                  }
              }

              private func saveToDisk() {
                  if let data = try? JSONEncoder().encode(files) {
                      UserDefaults.standard.set(data, forKey: storageKey)
                  }
              }

              // MARK: - File Type Detection
              func detectFileType(from url: URL) -> ImportedFile.FileType? {
                  let ext = url.pathExtension.lowercased()
                  switch ext {
                  case "ipa":              return .ipa
                  case "mobileprovision":  return .mobileprovision
                  case "p12", "pfx":       return .p12
                  default:
                      // UTI fallback
                      if let type = UTType(filenameExtension: ext) {
                          if type.conforms(to: .archive) { return .ipa }
                          if type.conforms(to: .data) { return .p12 }
                      }
                      return nil
                  }
              }

              // MARK: - Import Single File
              func importFile(from sourceURL: URL) async -> Bool {
                  isImporting = true
                  defer { isImporting = false }

                  // Security-scoped resource for iCloud / Files
                  let didStart = sourceURL.startAccessingSecurityScopedResource()
                  defer { if didStart { sourceURL.stopAccessingSecurityScopedResource() } }

                  guard let type = detectFileType(from: sourceURL) else {
                      lastError = "نوع الملف غير مدعوم: .\(sourceURL.pathExtension)"
                      return false
                  }

                  // Read file data
                  let didRead: Bool
                  var data: Data?
                  do {
                      data = try Data(contentsOf: sourceURL)
                      didRead = true
                  } catch {
                      lastError = "فشل قراءة الملف: \(error.localizedDescription)"
                      return false
                  }

                  guard let fileData = data, didRead else {
                      lastError = "الملف فارغ أو تالف"
                      return false
                  }

                  // Validate file
                  let validation = validateFile(data: fileData, type: type, sourceURL: sourceURL)
                  if !validation.isValid {
                      lastError = validation.error ?? "الملف غير صالح"
                      return false
                  }

                  // Copy to Documents/Application Support
                  let storedName = "\(UUID().uuidString)_\(sourceURL.lastPathComponent)"
                  let dest = Self.storageDirectory.appendingPathComponent(storedName)
                  do {
                      try fileData.write(to: dest, options: [.atomic])
                  } catch {
                      lastError = "فشل حفظ الملف: \(error.localizedDescription)"
                      return false
                  }

                  // Build metadata
                  var metadata = ImportedFile(
                      originalName: sourceURL.lastPathComponent,
                      storedName: storedName,
                      fileType: type,
                      sizeBytes: Int64(fileData.count),
                      importedAt: Date(),
                      appName: nil,
                      appVersion: nil,
                      bundleID: nil,
                      iconPath: nil,
                      notes: ""
                  )

                  // Extract IPA info
                  if type == .ipa {
                      let info = IPAInspector.extract(from: dest)
                      metadata.appName = info.name
                      metadata.appVersion = info.version
                      metadata.bundleID = info.bundleID
                      if let iconData = info.iconPNG {
                          let iconName = "\(UUID().uuidString).png"
                          let iconURL = Self.iconsDirectory.appendingPathComponent(iconName)
                          try? iconData.write(to: iconURL)
                          metadata.iconPath = iconName
                      }
                  }

                  files.insert(metadata, at: 0)
                  saveToDisk()
                  HapticManager.shared.notification(.success)
                  lastSuccess = "تم استيراد \(type.displayName) بنجاح"
                  return true
              }

              // MARK: - File Validation
              private func validateFile(data: Data, type: ImportedFile.FileType, sourceURL: URL) -> (isValid: Bool, error: String?) {
                  if data.isEmpty { return (false, "الملف فارغ") }

                  switch type {
                  case .ipa:
                      // IPA = ZIP archive: PK\x03\x04 magic bytes
                      let zipMagic: [UInt8] = [0x50, 0x4B, 0x03, 0x04]
                      let prefix = Array(data.prefix(4))
                      if prefix != zipMagic {
                          return (false, "ملف IPA تالف (توقيع ZIP غير صالح)")
                      }
                      return (true, nil)
                  case .mobileprovision:
                      // plist XML or binary
                      if let str = String(data: data.prefix(64), encoding: .utf8),
                         str.contains("<?xml") || str.contains("plist") {
                          return (true, nil)
                      }
                      return (false, "ملف mobileprovision غير صالح")
                  case .p12:
                      // PKCS#12 also ZIP-based
                      let prefix = Array(data.prefix(4))
                      if prefix == [0x50, 0x4B, 0x03, 0x04] {
                          return (true, nil)
                      }
                      return (false, "ملف P12 تالف")
                  }
              }

              // MARK: - Delete File
              func delete(_ file: ImportedFile) {
                  let url = Self.storageDirectory.appendingPathComponent(file.storedName)
                  try? FileManager.default.removeItem(at: url)
                  if let icon = file.iconPath {
                      try? FileManager.default.removeItem(at: Self.iconsDirectory.appendingPathComponent(icon))
                  }
                  files.removeAll { $0.id == file.id }
                  saveToDisk()
                  HapticManager.shared.notification(.success)
                  lastSuccess = "تم حذف الملف"
              }

              // MARK: - Rename File
              func rename(_ file: ImportedFile, to newOriginalName: String) {
                  if let idx = files.firstIndex(where: { $0.id == file.id }) {
                      files[idx].originalName = newOriginalName
                      saveToDisk()
                      HapticManager.shared.selection()
                  }
              }

              // MARK: - Update Notes
              func updateNotes(for file: ImportedFile, notes: String) {
                  if let idx = files.firstIndex(where: { $0.id == file.id }) {
                      files[idx].notes = notes
                      saveToDisk()
                  }
              }

              // MARK: - Get Stored URL
              func storedURL(for file: ImportedFile) -> URL {
                  Self.storageDirectory.appendingPathComponent(file.storedName)
              }

              // MARK: - Get Icon URL
              func iconURL(for file: ImportedFile) -> URL? {
                  guard let icon = file.iconPath else { return nil }
                  return Self.iconsDirectory.appendingPathComponent(icon)
              }

              // MARK: - Refresh
              func refresh() { loadFromDisk() }

              // MARK: - Clear All
              func clearAll() {
                  for f in files {
                      try? FileManager.default.removeItem(at: storedURL(for: f))
                      if let icon = f.iconPath {
                          try? FileManager.default.removeItem(at: Self.iconsDirectory.appendingPathComponent(icon))
                      }
                  }
                  files.removeAll()
                  saveToDisk()
                  HapticManager.shared.notification(.success)
              }
          }

          // MARK: - IPA Inspector (extract Info.plist + icon)
          enum IPAInspector {
              struct Info {
                  var name: String?
                  var version: String?
                  var bundleID: String?
                  var iconPNG: Data?
              }

              static func extract(from ipaURL: URL) -> Info {
                  var info = Info()
                  let fm = FileManager.default

                  // Read as ZIP using FileManager + NSFileCoordinator (built-in iOS unzip)
                  // Use unzipped via Data reading of central directory is complex on iOS.
                  // Instead, we use NSFileCoordinator to coordinate access and read the archive using
                  // Foundation's built-in ZIP reading via Compression framework.

                  // Approach: copy to a temp dir and iterate using Foundation's built-in ZIP via
                  // libcompression. To keep this self-contained, we read the Info.plist by scanning
                  // the ZIP central directory.

                  guard let data = try? Data(contentsOf: ipaURL, options: .mappedIfSafe) else { return info }

                  // Locate Info.plist path inside Payload/<App>.app/Info.plist
                  let plistPath = locateInfoPlistPath(in: data)
                  if let path = plistPath, let plistData = readEntry(in: data, named: path) {
                      if let plist = try? PropertyListSerialization.propertyList(from: plistData, options: [], format: nil) as? [String: Any] {
                          info.name    = plist["CFBundleDisplayName"] as? String ?? plist["CFBundleName"] as? String
                          info.version = plist["CFBundleShortVersionString"] as? String
                          info.bundleID = plist["CFBundleIdentifier"] as? String
                      }
                  }

                  // Locate icon
                  if let iconPath = locateIconPath(in: data), let iconData = readEntry(in: data, named: iconPath) {
                      info.iconPNG = iconData
                  }

                  return info
              }

              // MARK: - ZIP Central Directory Scan
              private static func locateInfoPlistPath(in data: Data) -> String? {
                  let count = data.count
                  if count < 22 { return nil }
                  let bytes = [UInt8](data)
                  // End of Central Directory signature: 0x06054b50
                  let eocdSig: [UInt8] = [0x50, 0x4B, 0x05, 0x06]
                  var eocdOffset: Int? = nil
                  if count > 65557 {
                      let start = count - 65557
                      for i in stride(from: count - 22, through: start, by: -1) {
                          if i + 4 <= count &&
                              bytes[i] == eocdSig[0] && bytes[i+1] == eocdSig[1] &&
                              bytes[i+2] == eocdSig[2] && bytes[i+3] == eocdSig[3] {
                              eocdOffset = i
                              break
                          }
                      }
                  }
                  if eocdOffset == nil {
                      for i in stride(from: count - 22, through: 0, by: -1) {
                          if i + 4 <= count &&
                              bytes[i] == eocdSig[0] && bytes[i+1] == eocdSig[1] &&
                              bytes[i+2] == eocdSig[2] && bytes[i+3] == eocdSig[3] {
                              eocdOffset = i
                              break
                          }
                      }
                  }
                  guard let eocd = eocdOffset else { return nil }
                  if eocd + 22 > count { return nil }
                  let cdOffset = Int(bytes[eocd + 16]) | (Int(bytes[eocd + 17]) << 8) |
                                 (Int(bytes[eocd + 18]) << 16) | (Int(bytes[eocd + 19]) << 24)
                  let totalEntries = Int(bytes[eocd + 10]) | (Int(bytes[eocd + 11]) << 8)
                  var p = cdOffset
                  let cdSig: [UInt8] = [0x50, 0x4B, 0x01, 0x02]
                  for _ in 0..<totalEntries {
                      if p + 46 > count { break }
                      if !(bytes[p] == cdSig[0] && bytes[p+1] == cdSig[1] &&
                           bytes[p+2] == cdSig[2] && bytes[p+3] == cdSig[3]) { break }
                      let nameLen = Int(bytes[p+28]) | (Int(bytes[p+29]) << 8)
                      let extraLen = Int(bytes[p+30]) | (Int(bytes[p+31]) << 8)
                      let commentLen = Int(bytes[p+32]) | (Int(bytes[p+33]) << 8)
                      if p + 46 + nameLen > count { break }
                      let nameData = Data(bytes[p+46..<p+46+nameLen])
                      if let name = String(data: nameData, encoding: .utf8),
                         name.hasSuffix("Info.plist") && name.contains("Payload/") {
                          return name
                      }
                      p += 46 + nameLen + extraLen + commentLen
                  }
                  return nil
              }

              private static func locateIconPath(in data: Data) -> String? {
                  let count = data.count
                  if count < 22 { return nil }
                  let bytes = [UInt8](data)
                  let eocdSig: [UInt8] = [0x50, 0x4B, 0x05, 0x06]
                  var eocdOffset: Int? = nil
                  if count > 65557 {
                      let start = count - 65557
                      for i in stride(from: count - 22, through: start, by: -1) {
                          if i + 4 <= count &&
                              bytes[i] == eocdSig[0] && bytes[i+1] == eocdSig[1] &&
                              bytes[i+2] == eocdSig[2] && bytes[i+3] == eocdSig[3] {
                              eocdOffset = i
                              break
                          }
                      }
                  }
                  if eocdOffset == nil {
                      for i in stride(from: count - 22, through: 0, by: -1) {
                          if i + 4 <= count &&
                              bytes[i] == eocdSig[0] && bytes[i+1] == eocdSig[1] &&
                              bytes[i+2] == eocdSig[2] && bytes[i+3] == eocdSig[3] {
                              eocdOffset = i
                              break
                          }
                      }
                  }
                  guard let eocd = eocdOffset else { return nil }
                  if eocd + 22 > count { return nil }
                  let cdOffset = Int(bytes[eocd + 16]) | (Int(bytes[eocd + 17]) << 8) |
                                 (Int(bytes[eocd + 18]) << 16) | (Int(bytes[eocd + 19]) << 24)
                  let totalEntries = Int(bytes[eocd + 10]) | (Int(bytes[eocd + 11]) << 8)
                  var p = cdOffset
                  let cdSig: [UInt8] = [0x50, 0x4B, 0x01, 0x02]
                  var bestIcon: String? = nil
                  var bestScore = -1
                  for _ in 0..<totalEntries {
                      if p + 46 > count { break }
                      if !(bytes[p] == cdSig[0] && bytes[p+1] == cdSig[1] &&
                           bytes[p+2] == cdSig[2] && bytes[p+3] == cdSig[3]) { break }
                      let nameLen = Int(bytes[p+28]) | (Int(bytes[p+29]) << 8)
                      let extraLen = Int(bytes[p+30]) | (Int(bytes[p+31]) << 8)
                      let commentLen = Int(bytes[p+32]) | (Int(bytes[p+33]) << 8)
                      if p + 46 + nameLen > count { break }
                      let nameData = Data(bytes[p+46..<p+46+nameLen])
                      if let name = String(data: nameData, encoding: .utf8),
                         name.lowercased().hasSuffix(".png") && name.contains("Payload/") {
                          var score = 0
                          let lower = name.lowercased()
                          if lower.contains("appicon") { score += 100 }
                          if lower.contains("icon") { score += 50 }
                          if lower.contains("@3x") { score += 30 }
                          if lower.contains("@2x") { score += 20 }
                          if lower.contains("60x60") { score += 40 }
                          if lower.contains("120x120") { score += 50 }
                          if lower.contains("180x180") { score += 60 }
                          if lower.contains("1024") { score += 70 }
                          if !lower.contains("launch") && !lower.contains("logo") { score += 10 }
                          if score > bestScore { bestScore = score; bestIcon = name }
                      }
                      p += 46 + nameLen + extraLen + commentLen
                  }
                  return bestIcon
              }

              private static func readEntry(in data: Data, named name: String) -> Data? {
                  let bytes = [UInt8](data)
                  let count = data.count
                  if count < 22 { return nil }
                  let eocdSig: [UInt8] = [0x50, 0x4B, 0x05, 0x06]
                  var eocdOffset: Int? = nil
                  if count > 65557 {
                      let start = count - 65557
                      for i in stride(from: count - 22, through: start, by: -1) {
                          if i + 4 <= count &&
                              bytes[i] == eocdSig[0] && bytes[i+1] == eocdSig[1] &&
                              bytes[i+2] == eocdSig[2] && bytes[i+3] == eocdSig[3] {
                              eocdOffset = i
                              break
                          }
                      }
                  }
                  if eocdOffset == nil {
                      for i in stride(from: count - 22, through: 0, by: -1) {
                          if i + 4 <= count &&
                              bytes[i] == eocdSig[0] && bytes[i+1] == eocdSig[1] &&
                              bytes[i+2] == eocdSig[2] && bytes[i+3] == eocdSig[3] {
                              eocdOffset = i
                              break
                          }
                      }
                  }
                  guard let eocd = eocdOffset else { return nil }
                  if eocd + 22 > count { return nil }
                  let cdOffset = Int(bytes[eocd + 16]) | (Int(bytes[eocd + 17]) << 8) |
                                 (Int(bytes[eocd + 18]) << 16) | (Int(bytes[eocd + 19]) << 24)
                  let totalEntries = Int(bytes[eocd + 10]) | (Int(bytes[eocd + 11]) << 8)
                  var p = cdOffset
                  let cdSig: [UInt8] = [0x50, 0x4B, 0x01, 0x02]
                  for _ in 0..<totalEntries {
                      if p + 46 > count { break }
                      if !(bytes[p] == cdSig[0] && bytes[p+1] == cdSig[1] &&
                           bytes[p+2] == cdSig[2] && bytes[p+3] == cdSig[3]) { break }
                      let nameLen = Int(bytes[p+28]) | (Int(bytes[p+29]) << 8)
                      let extraLen = Int(bytes[p+30]) | (Int(bytes[p+31]) << 8)
                      let commentLen = Int(bytes[p+32]) | (Int(bytes[p+33]) << 8)
                      if p + 46 + nameLen > count { break }
                      let nameData = Data(bytes[p+46..<p+46+nameLen])
                      if let entryName = String(data: nameData, encoding: .utf8), entryName == name {
                          let compSize  = Int(bytes[p+20]) | (Int(bytes[p+21]) << 8) |
                                          (Int(bytes[p+22]) << 16) | (Int(bytes[p+23]) << 24)
                          let uncompSize = Int(bytes[p+24]) | (Int(bytes[p+25]) << 8) |
                                           (Int(bytes[p+26]) << 16) | (Int(bytes[p+27]) << 24)
                          let localHdrOffset = Int(bytes[p+42]) | (Int(bytes[p+43]) << 8) |
                                               (Int(bytes[p+44]) << 16) | (Int(bytes[p+45]) << 24)
                          if localHdrOffset + 30 > count { return nil }
                          let lNameLen = Int(bytes[localHdrOffset+26]) | (Int(bytes[localHdrOffset+27]) << 8)
                          let lExtraLen = Int(bytes[localHdrOffset+28]) | (Int(bytes[localHdrOffset+29]) << 8)
                          let dataStart = localHdrOffset + 30 + lNameLen + lExtraLen
                          if dataStart + compSize > count { return nil }
                          let compData = data.subdata(in: dataStart..<(dataStart + compSize))
                          // Method: 0 = stored, 8 = deflate
                          let method = Int(bytes[p+10]) | (Int(bytes[p+11]) << 8)
                          if method == 0 {
                              return compData
                          } else {
                              return inflate(data: compData, expectedSize: uncompSize)
                          }
                      }
                      p += 46 + nameLen + extraLen + commentLen
                  }
                  return nil
              }

              // MARK: - Raw DEFLATE inflate using Compression framework
              private static func inflate(data: Data, expectedSize: Int) -> Data? {
                  let bufferSize = max(expectedSize + 32, 65536)
                  let buffer = UnsafeMutablePointer<UInt8>.allocate(capacity: bufferSize)
                  defer { buffer.deallocate() }

                  let result = data.withUnsafeBytes { (rawPtr: UnsafeRawBufferPointer) -> Int in
                      guard let baseAddr = rawPtr.baseAddress else { return -1 }
                      return compression_decode_buffer(
                          buffer, bufferSize,
                          baseAddr.assumingMemoryBound(to: UInt8.self), data.count,
                          nil, COMPRESSION_ZLIB
                      )
                  }
                  if result <= 0 { return nil }
                  return Data(bytes: buffer, count: result)
              }
          }
