      - name: Generate XcodeGen project.yml
        shell: bash
        run: |
          cat > AppScopeBuild/project.yml <<'YAML'
          name: AppScope

          options:
            minimumXcodeGenVersion: "2.40.0"
            deploymentTarget:
              iOS: "18.0"
            createIntermediateGroups: true
            groupSortPosition: top

          settings:
            base:
              SWIFT_VERSION: "6.0"
              IPHONEOS_DEPLOYMENT_TARGET: "18.0"
              DEVELOPMENT_TEAM: ""
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""
              PRODUCT_BUNDLE_IDENTIFIER: "com.appscope.safe"
              MARKETING_VERSION: "1.0"
              CURRENT_PROJECT_VERSION: "1"

          targets:
            AppScope:
              type: application
              platform: iOS
              sources:
                - path: AppScope
              info:
                path: AppScope/Info.plist
              settings:
                base:
                  PRODUCT_NAME: "AppScope"
                  INFOPLIST_FILE: "AppScope/Info.plist"
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
              scheme:
                gatherCoverageData: false
                testTargets: []
          YAML

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild
          xcodegen generate
          test -f AppScope.xcodeproj/project.pbxproj

      - name: Validate Swift sources
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild

          swiftc \
            -parse \
            AppScope/AppScopeApp.swift \
            AppScope/Models.swift \
            AppScope/InstalledAppsService.swift \
            AppScope/ContentView.swift

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          cd AppScopeBuild

          xcodebuild \
            -project AppScope.xcodeproj \
            -scheme AppScope \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AppScope.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/AppScope.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/AppScope.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle was not found:"
            find "$ARCHIVE" -maxdepth 5 -type d -name '*.app' -print
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/AppScope.app"

          cd "$RUNNER_TEMP"
          rm -f AppScope-unsigned.ipa
          /usr/bin/zip -qry AppScope-unsigned.ipa Payload

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp AppScope-unsigned.ipa "$GITHUB_WORKSPACE/artifacts/AppScope-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppScope-unsigned-ipa
          path: artifacts/AppScope-unsigned.ipa
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## AppScope 27"
            echo ""
            echo "- New safe app architecture: consent-based known-app checker"
            echo "- No private APIs"
            echo "- No filesystem enumeration"
            echo "- No LaunchServices database access"
            echo "- No server upload of scan results"
            echo "- URL schemes declared: 25"
            echo "- Unsigned IPA: artifacts/AppScope-unsigned.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
