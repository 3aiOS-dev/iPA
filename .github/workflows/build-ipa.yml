name: AppPeek — App Store Lookup (SwiftUI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.apppeek.lookup.app"
  NEW_APP_NAME:  "AppPeek"
  APP_VERSION:   "1.0.0"
  BUILD_NUMBER:  "1"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:

      - name: Maximize build resources
        run: |
          echo "=== Disk ==="
          df -h
          echo "=== CPU ==="
          sysctl -n hw.ncpu
          echo "=== Memory ==="
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES — app icon, splash, accent art (no remote URLs)
      # =========================================================
      - name: Generate resource images
        run: |
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os, math
          os.makedirs("Resources", exist_ok=True)

          def find_font(size, bold=False):
              candidates = [
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/SFNSDisplay.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              ]
              for p in candidates:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, size)
                      except: pass
              return ImageFont.load_default()

          def text_centered(d, txt, x, y, font, fill):
              try:
                  bbox = d.textbbox((0, 0), txt, font=font)
                  w = bbox[2] - bbox[0]; h = bbox[3] - bbox[1]
              except AttributeError:
                  w, h = d.textsize(txt, font=font)
              d.text((x - w // 2, y - h // 2), txt, font=font, fill=fill)

          def save_png(path, img):
              if img.mode == "RGBA":
                  bg = Image.new("RGB", img.size, (255, 255, 255))
                  bg.paste(img, mask=img.split()[-1])
                  img = bg
              img.save(path, "PNG", optimize=True)

          # ---------- App icon (1024) ----------
          SZ = 1024
          icon = Image.new("RGBA", (SZ, SZ), (0, 0, 0, 0))
          d = ImageDraw.Draw(icon)
          # gradient background (indigo -> teal)
          for y in range(SZ):
              t = y / (SZ - 1)
              r = int(99  + (16  - 99)  * t)
              g = int(102 + (185 - 102) * t)
              b = int(241 + (129 - 241) * t)
              d.line([(0, y), (SZ, y)], fill=(r, g, b, 255))
          # rounded mask
          mask = Image.new("L", (SZ, SZ), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle((0, 0, SZ - 1, SZ - 1), radius=225, fill=255)
          icon.putalpha(mask)
          d = ImageDraw.Draw(icon)
          # inner search circle
          d.ellipse((260, 260, 660, 660), outline=(255, 255, 255, 230), width=46)
          d.ellipse((260, 260, 660, 660), outline=(255, 255, 255, 80), width=14)
          # magnifier handle
          d.line([(620, 620), (820, 820)], fill=(255, 255, 255, 240), width=58)
          d.line([(620, 620), (820, 820)], fill=(255, 255, 255, 60),  width=20)
          # small "A" inside circle
          fA = find_font(260, bold=True)
          text_centered(d, "A", 460, 460, fA, (255, 255, 255, 245))
          save_png("Resources/AppIcon1024.png", icon)

          # ---------- iOS app icon set ----------
          for size, name in [
              (120, "AppIcon60x60@2x.png"),
              (180, "AppIcon60x60@3x.png"),
              (152, "AppIcon76x76@2x~ipad.png"),
              (167, "AppIcon83.5x83.5@2x~ipad.png"),
          ]:
              scaled = icon.resize((size, size))
              save_png(f"Resources/{name}", scaled)

          # ---------- Splash screen background ----------
          splash = Image.new("RGB", (1290, 2796), (16, 185, 129))
          sd = ImageDraw.Draw(splash)
          for i in range(120):
              t = i / 119
              r = int(16  + (99  - 16)  * t)
              g = int(185 + (102 - 185) * t)
              b = int(129 + (241 - 129) * t)
              sd.ellipse((i*30, i*30, 1290-i*30, 2796-i*30), outline=(r, g, b), width=2)
          text_centered(sd, "AppPeek", 645, 1300, find_font(180, bold=True), (255, 255, 255))
          text_centered(sd, "Look up any app", 645, 1500, find_font(64), (255, 255, 255))
          save_png("Resources/splash_bg.png", splash)

          # ---------- Onboarding illustrations (3) ----------
          def onboarding(idx, title, subtitle, primary):
              W, H = 900, 1400
              img = Image.new("RGB", (W, H), (245, 247, 250))
              d = ImageDraw.Draw(img)
              d.rounded_rectangle((80, 200, W - 80, 900), radius=40, fill=primary)
              # abstract icon per slide
              if idx == 1:
                  d.ellipse((290, 360, 610, 680), outline=(255, 255, 255), width=24)
                  d.line([(610, 680), (760, 830)], fill=(255, 255, 255), width=36)
              elif idx == 2:
                  d.rounded_rectangle((300, 360, 600, 660), radius=20, outline=(255, 255, 255), width=24)
                  d.line([(360, 460), (540, 460)], fill=(255, 255, 255), width=18)
                  d.line([(360, 530), (500, 530)], fill=(255, 255, 255), width=18)
                  d.line([(360, 600), (470, 600)], fill=(255, 255, 255), width=18)
              else:
                  d.polygon([(450, 360), (620, 600), (280, 600)], outline=(255, 255, 255), width=24)
                  d.ellipse((420, 520, 480, 580), fill=(255, 255, 255))
              text_centered(d, title,  W // 2, 1050, find_font(56, bold=True), (30, 41, 59))
              text_centered(d, subtitle, W // 2, 1130, find_font(34), (100, 116, 139))
              # dots
              for i in range(3):
                  cx = W // 2 - 60 + i * 60
                  fill = (30, 41, 59) if i == idx - 1 else (180, 190, 200)
                  d.ellipse((cx - 12, 1290, cx + 12, 1314), fill=fill)
              return img

          for i, (t, s, c) in enumerate([
              ("Paste any App Store link", "Drop a link from the App Store — apps, games, anything.", (79, 70, 229)),
              ("Instant details", "Name, icon, version, size, age rating, description.",    (16, 185, 129)),
              ("Share & save", "Copy clean info or share it as a card with one tap.",         (236, 72, 153)),
          ], start=1):
              save_png(f"Resources/onboarding_{i}.png", onboarding(i, t, s, c))

          # ---------- Empty state illustration ----------
          empty = Image.new("RGB", (900, 1200), (248, 250, 252))
          ed = ImageDraw.Draw(empty)
          ed.rounded_rectangle((150, 200, 750, 800), radius=40, outline=(200, 210, 220), width=4)
          ed.ellipse((320, 380, 580, 640), outline=(100, 116, 139), width=20)
          ed.line([(580, 640), (720, 780)], fill=(100, 116, 139), width=36)
          text_centered(ed, "No app loaded yet", 450, 900, find_font(48, bold=True), (30, 41, 59))
          text_centered(ed, "Paste an App Store link above\nto see its details here.",
                        450, 1000, find_font(36), (100, 116, 139))
          save_png("Resources/empty_state.png", empty)

          # ---------- Share card template ----------
          card = Image.new("RGB", (1200, 630), (15, 23, 42))
          cd = ImageDraw.Draw(card)
          for x in range(0, 1200, 6):
              cd.line([(x, 0), (x, 630)], fill=(30, 41, 59))
          cd.rounded_rectangle((40, 40, 1160, 590), radius=30, outline=(99, 102, 241), width=4)
          cd.rounded_rectangle((100, 130, 340, 370), radius=24, fill=(255, 255, 255))
          text_centered(cd, "Aa", 220, 250, find_font(110, bold=True), (99, 102, 241))
          cd.text((380, 170), "App Name", font=find_font(54, bold=True), fill=(255, 255, 255))
          cd.text((380, 240), "Version 1.0.0  •  120 MB", font=find_font(34), fill=(203, 213, 225))
          cd.text((380, 300), "Developer • Category", font=find_font(30), fill=(148, 163, 184))
          cd.text((380, 350), "Rated 4.6 ★", font=find_font(30), fill=(250, 204, 21))
          cd.text((100, 470), "Looked up with AppPeek", font=find_font(28), fill=(148, 163, 184))
          save_png("Resources/share_card.png", card)

          print("Resources generated.")
          PYEOF
          ls -lh Resources

      - name: Generate Info.plist
        run: |
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>     <string>en</string>
              <key>CFBundleExecutable</key>            <string>AppPeek</string>
              <key>CFBundleIdentifier</key>            <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
              <key>CFBundleName</key>                  <string>AppPeek</string>
              <key>CFBundleDisplayName</key>           <string>AppPeek</string>
              <key>CFBundlePackageType</key>           <string>APPL</string>
              <key>CFBundleSignature</key>             <string>????</string>
              <key>CFBundleShortVersionString</key>    <string>${{ env.APP_VERSION }}</string>
              <key>CFBundleVersion</key>               <string>${{ env.BUILD_NUMBER }}</string>
              <key>CFBundleSupportedPlatforms</key>
              <array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key>            <true/>
              <key>MinimumOSVersion</key>              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
              </array>
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key><string></string>
              </dict>
              <key>UIRequiresFullScreen</key>         <true/>
              <key>UIStatusBarStyle</key>             <string>UIStatusBarStyleDefault</string>
              <key>UIUserInterfaceStyle</key>         <string>Light</string>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key><false/>
              </dict>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon60x60@3x.png</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>UIPrerenderedIcon</key><false/>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon76x76@2x~ipad.png</string>
                          <string>AppIcon83.5x83.5@2x~ipad.png</string>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76</string>
                          <string>AppIcon83.5x83.5</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>UIPrerenderedIcon</key><false/>
                  </dict>
              </dict>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key><true/>
              </dict>
          </dict>
          </plist>
          PEOF

      # =========================================================
      # SOURCE — Constants & Theme
      # =========================================================
      - name: Generate code - Constants.swift
        run: |
          cat > Constants.swift << 'CEOF'
          import SwiftUI

          enum AppConstants {
              static let appVersion    = "1.0.0"
              static let buildNumber   = "1"
              static let storeName     = "AppPeek"
              static let itunesLookup  = "https://itunes.apple.com/lookup"
              static let recentKey     = "apppeek.recent.v1"
              static let historyKey    = "apppeek.history.v1"
              static let maxRecent     = 8
              static let cacheBytes: Int = 64 * 1024 * 1024
          }

          // Single light palette, no dark mode support (per project policy).
          func dyn(_ light: (CGFloat, CGFloat, CGFloat), _ dark: (CGFloat, CGFloat, CGFloat)) -> Color {
              Color(UIColor(red: light.0, green: light.1, blue: light.2, alpha: 1))
          }

          extension Color {
              // Brand
              static let apPrimary   = Color(red: 0.39, green: 0.40, blue: 0.95) // indigo
              static let apSecondary = Color(red: 0.06, green: 0.73, blue: 0.51) // teal
              static let apAccent    = Color(red: 0.93, green: 0.28, blue: 0.60) // pink

              // Surfaces
              static let apBackground = dyn((0.97, 0.98, 0.99), (0.05, 0.06, 0.09))
              static let apCard       = dyn((1.00, 1.00, 1.00), (0.10, 0.12, 0.16))
              static let apCardAlt    = dyn((0.95, 0.97, 1.00), (0.14, 0.16, 0.20))

              // Text
              static let apText       = dyn((0.12, 0.16, 0.23), (0.95, 0.97, 1.00))
              static let apSubtext    = dyn((0.39, 0.45, 0.55), (0.65, 0.70, 0.80))
              static let apDivider    = dyn((0.88, 0.91, 0.95), (0.20, 0.22, 0.27))

              // Status
              static let apSuccess = Color(red: 0.06, green: 0.72, blue: 0.51)
              static let apWarning = Color(red: 0.96, green: 0.62, blue: 0.04)
              static let apDanger  = Color(red: 0.94, green: 0.27, blue: 0.27)
          }

          extension Font {
              static let apTitle    = Font.system(size: 28, weight: .bold,       design: .rounded)
              static let apHeadline = Font.system(size: 20, weight: .semibold,  design: .rounded)
              static let apBody     = Font.system(size: 16, weight: .regular,   design: .rounded)
              static let apCaption  = Font.system(size: 13, weight: .medium,    design: .rounded)
              static let apMono     = Font.system(size: 14, weight: .medium,    design: .monospaced)
          }
          CEOF

      # =========================================================
      # SOURCE — Models
      # =========================================================
      - name: Generate code - Models.swift
        run: |
          cat > Models.swift << 'MEOF'
          import Foundation

          // MARK: - iTunes Lookup API

          struct ITunesLookupResponse: Decodable {
              let resultCount: Int
              let results: [ITunesApp]

              enum CodingKeys: String, CodingKey {
                  case resultCount = "resultCount"
                  case results     = "results"
              }
          }

          struct ITunesApp: Decodable, Identifiable, Hashable {
              let trackId: Int
              let trackName: String
              let artistName: String?
              let sellerName: String?
              let bundleId: String
              let version: String?
              let releaseDate: String?
              let currentVersionReleaseDate: String?
              let fileSizeBytes: String?
              let averageUserRating: Double?
              let userRatingCount: Int?
              let primaryGenreName: String?
              let contentAdvisoryRating: String?
              let minimumOsVersion: String?
              let formattedPrice: String?
              let currency: String?
              let description: String?
              let releaseNotes: String?
              let artworkUrl100: String?
              let artworkUrl512: String?
              let screenshotUrls: [String]?
              let ipadScreenshotUrls: [String]?
              let trackViewUrl: String?
              let sellerUrl: String?
              let supportedDevices: [String]?

              var id: Int { trackId }

              enum CodingKeys: String, CodingKey {
                  case trackId, trackName, artistName, sellerName, bundleId
                  case version, releaseDate, currentVersionReleaseDate
                  case fileSizeBytes, averageUserRating, userRatingCount
                  case primaryGenreName, contentAdvisoryRating, minimumOsVersion
                  case formattedPrice, currency, description, releaseNotes
                  case artworkUrl100, artworkUrl512
                  case screenshotUrls, ipadScreenshotUrls
                  case trackViewUrl, sellerUrl, supportedDevices
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.trackId  = try c.decode(Int.self,    forKey: .trackId)
                  self.trackName = try c.decode(String.self, forKey: .trackName)
                  self.artistName  = try? c.decode(String.self, forKey: .artistName)
                  self.sellerName  = try? c.decode(String.self, forKey: .sellerName)
                  self.bundleId    = (try? c.decode(String.self, forKey: .bundleId)) ?? "unknown"
                  self.version     = try? c.decode(String.self, forKey: .version)
                  self.releaseDate = try? c.decode(String.self, forKey: .releaseDate)
                  self.currentVersionReleaseDate = try? c.decode(String.self, forKey: .currentVersionReleaseDate)
                  self.fileSizeBytes    = try? c.decode(String.self, forKey: .fileSizeBytes)
                  self.averageUserRating = try? c.decode(Double.self, forKey: .averageUserRating)
                  self.userRatingCount   = try? c.decode(Int.self,    forKey: .userRatingCount)
                  self.primaryGenreName  = try? c.decode(String.self, forKey: .primaryGenreName)
                  self.contentAdvisoryRating = try? c.decode(String.self, forKey: .contentAdvisoryRating)
                  self.minimumOsVersion  = try? c.decode(String.self, forKey: .minimumOsVersion)
                  self.formattedPrice    = try? c.decode(String.self, forKey: .formattedPrice)
                  self.currency          = try? c.decode(String.self, forKey: .currency)
                  self.description       = try? c.decode(String.self, forKey: .description)
                  self.releaseNotes      = try? c.decode(String.self, forKey: .releaseNotes)
                  self.artworkUrl100     = try? c.decode(String.self, forKey: .artworkUrl100)
                  self.artworkUrl512     = try? c.decode(String.self, forKey: .artworkUrl512)
                  self.screenshotUrls    = try? c.decode([String].self, forKey: .screenshotUrls)
                  self.ipadScreenshotUrls = try? c.decode([String].self, forKey: .ipadScreenshotUrls)
                  self.trackViewUrl      = try? c.decode(String.self, forKey: .trackViewUrl)
                  self.sellerUrl         = try? c.decode(String.self, forKey: .sellerUrl)
                  self.supportedDevices  = try? c.decode([String].self, forKey: .supportedDevices)
              }

              var bestArtwork: String? { artworkUrl512 ?? artworkUrl100 }
              var displayPrice: String { (formattedPrice?.isEmpty == false ? formattedPrice! : (priceIsFree ? "Free" : "—")) }
              var priceIsFree: Bool { (formattedPrice ?? "").lowercased().contains("free") }

              var fileSizeFormatted: String {
                  guard let s = fileSizeBytes, let bytes = Double(s) else { return "—" }
                  let f = ByteCountFormatter()
                  f.allowedUnits = [.useKB, .useMB, .useGB]
                  f.countStyle = .file
                  return f.string(fromByteCount: Int64(bytes))
              }

              var releaseDateFormatted: String? {
                  [releaseDate, currentVersionReleaseDate]
                      .compactMap { $0 }
                      .first
                      .flatMap { Self.parseISO($0) }
              }
              var releaseDateShort: String? {
                  releaseDateFormatted.map { DateFormatter.short.string(from: $0) }
              }

              static func parseISO(_ s: String) -> Date? {
                  let f = ISO8601DateFormatter()
                  f.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                  if let d = f.date(from: s) { return d }
                  f.formatOptions = [.withInternetDateTime]
                  return f.date(from: s)
              }
          }

          extension DateFormatter {
              static let short: DateFormatter = {
                  let f = DateFormatter()
                  f.dateStyle = .medium
                  f.timeStyle = .none
                  return f
              }()
          }

          // MARK: - Local models

          struct AppSnapshot: Codable, Identifiable, Hashable {
              var id: Int { trackId }
              let trackId: Int
              let trackName: String
              let artistName: String?
              let bundleId: String
              let version: String?
              let artworkUrl: String?
              let lookedUpAt: Date
          }

          enum LookupError: LocalizedError {
              case invalidURL
              case invalidInput
              case notFound
              case network(String)
              case decoding(String)

              var errorDescription: String? {
                  switch self {
                  case .invalidURL:   return "The link is not a valid App Store URL."
                  case .invalidInput: return "Paste a link like https://apps.apple.com/... or just an app id like id123456789."
                  case .notFound:     return "We couldn't find that app. Double-check the link."
                  case .network(let m): return "Network error: \(m)"
                  case .decoding(let m): return "Couldn't read the response: \(m)"
                  }
              }
          }
          MEOF

      # =========================================================
      # SOURCE — Link Parser
      # =========================================================
      - name: Generate code - LinkParser.swift
        run: |
          cat > LinkParser.swift << 'LEOF'
          import Foundation

          enum LinkParser {
              /// Accepts an App Store URL, a short link, or a raw id, returns numeric app id.
              static func extractAppID(from input: String) -> String? {
                  let trimmed = input.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else { return nil }

                  // Direct numeric id (with or without id prefix)
                  if let id = matchLeadingId(trimmed) { return id }
                  if trimmed.allSatisfy({ $0.isNumber }) { return trimmed }

                  // https://apps.apple.com/us/app/name/id123456789
                  if let id = regexFirst(trimmed, pattern: #"/id(\d+)"#) { return id }
                  // https://apps.apple.com/app/id123456789
                  if let id = regexFirst(trimmed, pattern: #"[?&]id=(\d+)"#) { return id }
                  // https://itunes.apple.com/.../id123456789?...
                  if let id = regexFirst(trimmed, pattern: #"/id(\d+)(?:[/?#]|$)"#) { return id }
                  // short links (itun.es) — we still need to resolve, but try numeric extract
                  if let id = regexFirst(trimmed, pattern: #"(\d{6,})"#) { return id }

                  return nil
              }

              private static func matchLeadingId(_ s: String) -> String? {
                  // "id123456789" or "id123456789?foo=bar"
                  let pattern = #"^id(\d+)(?:[/?#].*)?$"#
                  return regexFirst(s, pattern: pattern)
              }

              private static func regexFirst(_ s: String, pattern: String) -> String? {
                  guard let re = try? NSRegularExpression(pattern: pattern, options: [.caseInsensitive]) else { return nil }
                  let range = NSRange(s.startIndex..<s.endIndex, in: s)
                  guard let m = re.firstMatch(in: s, options: [], range: range), m.numberOfRanges >= 2,
                        let r = Range(m.range(at: 1), in: s) else { return nil }
                  return String(s[r])
              }
          }
          LEOF

      # =========================================================
      # SOURCE — LookupService (iTunes API)
      # =========================================================
      - name: Generate code - LookupService.swift
        run: |
          cat > LookupService.swift << 'LEOF'
          import Foundation

          actor LookupService {
              static let shared = LookupService()
              private let session: URLSession

              init() {
                  let cfg = URLSessionConfiguration.default
                  cfg.timeoutIntervalForRequest = 15
                  cfg.timeoutIntervalForResource = 30
                  cfg.waitsForConnectivity = true
                  self.session = URLSession(configuration: cfg)
              }

              func lookup(appID: String, country: String = "us") async throws -> ITunesApp {
                  guard !appID.isEmpty, appID.allSatisfy({ $0.isNumber }) else {
                      throw LookupError.invalidInput
                  }
                  var comps = URLComponents(string: AppConstants.itunesLookup)!
                  comps.queryItems = [
                      URLQueryItem(name: "id", value: appID),
                      URLQueryItem(name: "country", value: country)
                  ]
                  guard let url = comps.url else { throw LookupError.invalidURL }

                  var req = URLRequest(url: url)
                  req.setValue("AppPeek/1.0", forHTTPHeaderField: "User-Agent")

                  let data: Data
                  do {
                      let (d, resp) = try await session.data(for: req)
                      guard let http = resp as? HTTPURLResponse else {
                          throw LookupError.network("Invalid response")
                      }
                      guard (200..<300).contains(http.statusCode) else {
                          throw LookupError.network("HTTP \(http.statusCode)")
                      }
                      data = d
                  } catch let e as LookupError {
                      throw e
                  } catch {
                      throw LookupError.network(error.localizedDescription)
                  }

                  do {
                      let decoded = try JSONDecoder().decode(ITunesLookupResponse.self, from: data)
                      guard let first = decoded.results.first else { throw LookupError.notFound }
                      return first
                  } catch let e as LookupError {
                      throw e
                  } catch {
                      throw LookupError.decoding(error.localizedDescription)
                  }
              }
          }
          LEOF

