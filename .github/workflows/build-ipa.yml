                                      .background(RoundedRectangle(cornerRadius: 14).fill(Color.storeCardAlt))
                                  VStack(alignment: .leading, spacing: 3) {
                                      Text(reel.title)
                                          .font(.system(size: 13, weight: .bold))
                                          .foregroundColor(.storeText)
                                      HStack(spacing: 5) {
                                          Text("@\(reel.author)")
                                              .font(.system(size: 11))
                                              .foregroundColor(.storeSub)
                                          VerifiedBadge(verified: reel.verified)
                                      }
                                  }
                                  Spacer()
                                  Button {
                                      store.toggleSave(reel)
                                  } label: {
                                      Image(systemName: "bookmark.fill").foregroundColor(.storePrimary)
                                  }
                              }
                              .padding(12)
                              .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                          }
                          if saved.isEmpty {
                              Text("لا توجد ريلز محفوظة بعد.")
                                  .font(.system(size: 12, weight: .semibold))
                                  .foregroundColor(.storeSub)
                                  .padding(.top, 40)
                          }
                      }
                      .padding(16)
                  }
              }
          }

          // ================= DEVELOPER PLATFORM =================
          struct DevPlatformView: View {
              @ObservedObject var store: GeamRelsStore
              @State private var showPublish = false

              var body: some View {
                  ScrollView {
                      VStack(spacing: 14) {
                          accountCard

                          HStack {
                              Text("الأدوات والملفات المنشورة")
                                  .font(.system(size: 14, weight: .bold))
                                  .foregroundColor(.storeText)
                              Spacer()
                              Button {
                                  HapticManager.shared.impact(.light)
                                  showPublish = true
                              } label: {
                                  HStack(spacing: 5) {
                                      Image(systemName: "plus")
                                      Text("نشر")
                                  }
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 12).padding(.vertical, 7)
                                  .background(Capsule().fill(Color.storePrimary))
                              }
                          }

                          ForEach(store.tools) { tool in
                              DevToolCard(tool: tool)
                          }

                          if store.tools.isEmpty {
                              Text("لا توجد أدوات منشورة بعد.")
                                  .font(.system(size: 12, weight: .semibold))
                                  .foregroundColor(.storeSub)
                                  .padding(.top, 30)
                          }
                      }
                      .padding(16)
                  }
                  .sheet(isPresented: $showPublish) {
                      PublishToolSheet(store: store, isPresented: $showPublish)
                  }
              }

              private var accountCard: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack(spacing: 8) {
                          Image(systemName: "person.crop.circle.fill")
                              .font(.system(size: 30))
                              .foregroundColor(.storePrimary)
                          VStack(alignment: .leading, spacing: 3) {
                              HStack(spacing: 5) {
                                  Text("@\(store.username)")
                                      .font(.system(size: 14, weight: .heavy))
                                      .foregroundColor(.storeText)
                                  VerifiedBadge(verified: store.verifyState == .verified)
                              }
                              Text(statusText)
                                  .font(.system(size: 11, weight: .semibold))
                                  .foregroundColor(.storeSub)
                          }
                          Spacer()
                      }

                      TextField("اسم المطور", text: $store.username)
                          .font(.system(size: 13))
                          .padding(.horizontal, 12)
                          .frame(height: 40)
                          .background(RoundedRectangle(cornerRadius: 12).fill(Color.storeBg))

                      if store.verifyState != .verified {
                          Button {
                              HapticManager.shared.impact(.medium)
                              store.requestVerification()
                          } label: {
                              Text(store.verifyState == .pending ? "قيد المراجعة..." : "طلب توثيق (BETA)")
                                  .font(.system(size: 13, weight: .bold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 42)
                                  .background(RoundedRectangle(cornerRadius: 14).fill(Color.storePrimary))
                          }
                          .disabled(store.verifyState == .pending)
                      }
                  }
                  .padding(14)
                  .background(RoundedRectangle(cornerRadius: 18).fill(Color.storeCard))
              }

              private var statusText: String {
                  switch store.verifyState {
                  case .none: return "حساب غير موثق"
                  case .pending: return "قيد المراجعة (BETA)"
                  case .verified: return "مطور موثق"
                  }
              }
          }

          struct DevToolCard: View {
              let tool: DevTool

              var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      HStack(spacing: 6) {
                          Text(tool.name)
                              .font(.system(size: 14, weight: .heavy))
                              .foregroundColor(.storeText)
                          Spacer()
                          Text("v\(tool.version)")
                              .font(.system(size: 10, weight: .bold))
                              .foregroundColor(.storePrimary)
                      }
                      HStack(spacing: 5) {
                          Text("@\(tool.developer)")
                              .font(.system(size: 11, weight: .semibold))
                              .foregroundColor(.storeSub)
                          VerifiedBadge(verified: tool.verified)
                      }
                      Text(tool.details)
                          .font(.system(size: 12))
                          .foregroundColor(.storeSub)

                      if !tool.tags.isEmpty {
                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack(spacing: 6) {
                                  ForEach(tool.tags, id: \.self) { t in
                                      Text("#\(t)")
                                          .font(.system(size: 10, weight: .bold))
                                          .foregroundColor(.storePrimary)
                                          .padding(.horizontal, 8).padding(.vertical, 4)
                                          .background(Capsule().fill(Color.storeCardAlt))
                                  }
                              }
                          }
                      }

                      HStack(spacing: 10) {
                          Button {
                              HapticManager.shared.impact(.light)
                              if let url = URL(string: tool.link) { UIApplication.shared.open(url) }
                          } label: {
                              Text("فتح الرابط")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 38)
                                  .background(RoundedRectangle(cornerRadius: 12).fill(Color.storePrimary))
                          }
                          Button {
                              geamRelsShare("\(tool.name) v\(tool.version)\n\(tool.link)")
                          } label: {
                              Image(systemName: "square.and.arrow.up")
                                  .foregroundColor(.storePrimary)
                                  .frame(width: 44, height: 38)
                                  .background(RoundedRectangle(cornerRadius: 12).fill(Color.storeCardAlt))
                          }
                      }
                  }
                  .padding(14)
                  .background(RoundedRectangle(cornerRadius: 18).fill(Color.storeCard))
              }
          }

          struct PublishToolSheet: View {
              @ObservedObject var store: GeamRelsStore
              @Binding var isPresented: Bool
              @State private var name = ""
              @State private var details = ""
              @State private var version = ""
              @State private var link = ""
              @State private var tags = ""

              var body: some View {
                  NavigationStack {
                      Form {
                          Section("الأداة / الملف") {
                              TextField("الاسم", text: $name)
                              TextField("الوصف", text: $details)
                              TextField("الإصدار", text: $version)
                              TextField("رابط التحميل", text: $link)
                                  .autocapitalization(.none)
                                  .disableAutocorrection(true)
                              TextField("العلامات (مفصولة بفواصل)", text: $tags)
                          }
                          Section {
                              Button("نشر") {
                                  let n = name.trimmingCharacters(in: .whitespacesAndNewlines)
                                  let l = link.trimmingCharacters(in: .whitespacesAndNewlines)
                                  guard !n.isEmpty, !l.isEmpty else { return }
                                  let tagList = tags.split(separator: ",")
                                      .map { $0.trimmingCharacters(in: .whitespaces) }
                                      .filter { !$0.isEmpty }
                                  store.addTool(name: n, details: details, version: version, link: l, tags: tagList)
                                  HapticManager.shared.success()
                                  isPresented = false
                              }
                              .foregroundColor(.storePrimary)
                          }
                      }
                      .navigationTitle("نشر ك مطور")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("إلغاء") { isPresented = false }.foregroundColor(.storeSub)
                          }
                      }
                  }
              }
          }
          GEAMEOF

      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            Repositories.swift \
            FavoritesStore.swift \
            AuthManager.swift \
            Countries.swift \
            OnboardingView.swift \
            AuthViews.swift \
            StoreView.swift \
            ContentView.swift \
            VIP21StoreApp.swift \
            Settings.swift \
            StatusScreens.swift \
            GeamRels.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework ImageIO \
            -framework MobileCoreServices \
            -framework Network \
            -framework CFNetwork \
            -framework CoreImage \
            -framework AVFoundation \
            -framework AVKit \
            -framework UserNotifications \
            -framework Translation \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA package
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp -X VIP21Store                            build-output/Payload/VIP21Store.app/VIP21Store
          cp -X Resources/Info.plist                  build-output/Payload/VIP21Store.app/Info.plist
          cp -X Resources/AppIcon60x60@2x.png         build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon60x60@3x.png         build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon76x76@2x~ipad.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon1024x1024.png        build-output/Payload/VIP21Store.app/
          cp -X Resources/login_logo.png              build-output/Payload/VIP21Store.app/
          cp -X Resources/register_logo.png           build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding1.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding2.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding3.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/banner1.jpg                 build-output/Payload/VIP21Store.app/
          cp -X Resources/banner2.jpg                 build-output/Payload/VIP21Store.app/
          cp -X Resources/banner3.jpg                 build-output/Payload/VIP21Store.app/
          cp -X Resources/banner4.jpg                 build-output/Payload/VIP21Store.app/
          cp -X Resources/ad_banner.png               build-output/Payload/VIP21Store.app/
          cp -X Resources/home_bottom.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding1.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding2.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding3.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/settings_onboarding.gif     build-output/Payload/VIP21Store.app/
          cp -X Resources/no_internet.gif             build-output/Payload/VIP21Store.app/
          cp -X Resources/thanks_overlay.gif          build-output/Payload/VIP21Store.app/
          cp -X Resources/detail_icon_bg.gif          build-output/Payload/VIP21Store.app/
          cp -X Resources/store_icon.gif              build-output/Payload/VIP21Store.app/
          cp -X Resources/geamrels_icon.gif           build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb1.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb2.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb3.png    build-output/Payload/VIP21Store.app/

          xattr -cr build-output
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          ldid -S build-output/Payload/VIP21Store.app/VIP21Store

          rm -f artifacts/21s.ipa
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete
          xattr -cr build-output/Payload || true
          cd build-output && zip -r -X -q ../artifacts/21s.ipa Payload && cd ..
          ls -lh artifacts/21s.ipa

          if ! unzip -tq artifacts/21s.ipa >/dev/null 2>&1; then
            echo "Error: IPA file is corrupt or invalid."
            exit 1
          fi
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/21s.ipa | head -60
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "== Integrity test =="
          unzip -tq artifacts/21s.ipa > /dev/null
          if unzip -l artifacts/21s.ipa | grep -q "_CodeSignature/CodeResources\|_CodeSignature"; then
            echo "Warning: _CodeSignature found in IPA (should be inside .app, not Payload root)"
          fi
          unzip -p artifacts/21s.ipa Payload/VIP21Store.app/VIP21Store | head -c 4 | xxd | head -1
          echo "IPA is valid, passes zip integrity test, and contains the App Bundle."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Clean-IPA
          path: artifacts/21s.ipa
          retention-days: 90
