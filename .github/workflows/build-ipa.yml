      - name: Generate Source - DownloadsTabView.swift
        run: |
          cat > DownloadsTabView.swift << 'VIPEOF'
          import SwiftUI
          import UniformTypeIdentifiers
          
          struct DownloadsTabView: View {
              @ObservedObject var downloadManager: IPADownloadManager
              @State private var showIPAPicker = false
              @State private var showInstallSheet = false
              @State private var pendingInstallFile: IPAFile?
              @State private var showInstallError = false
              @State private var installErrorMsg = ""
              @Environment(\.colorScheme) var scheme
              
              var body: some View {
                  VStack(spacing: 16) {
                      HStack(spacing: 14) {
                          ZStack {
                              RoundedRectangle(cornerRadius: 16)
                                  .fill(LinearGradient(colors: [.vipPurple, .blue, .cyan],
                                                       startPoint: .topLeading, endPoint: .bottomTrailing))
                                  .frame(width: 52, height: 52)
                                  .shadow(color: .vipPurple.opacity(0.45), radius: 8, y: 4)
                              Image(systemName: "arrow.down.circle.fill")
                                  .font(.system(size: 24, weight: .semibold))
                                  .foregroundColor(.white)
                          }
                          VStack(alignment: .leading, spacing: 3) {
                              Text("التحميلات")
                                  .font(.system(size: 20, weight: .heavy))
                              Text("استيراد وتثبيت ملفات IPA")
                                  .font(.system(size: 11)).foregroundColor(.gray)
                          }
                          Spacer()
                      }.padding(.horizontal)
                      
                      HStack(spacing: 10) {
                          quickActionButton(title: "استورد IPA", icon: "tray.and.arrow.down.fill",
                                            colors: [.vipPurple, .indigo]) { showIPAPicker = true }
                          quickActionButton(title: "تثبيت مكتمل", icon: "app.badge.checkmark.fill",
                                            colors: [.blue, .cyan]) {
                              let completed = downloadManager.ipaFiles.filter { $0.isInstalled }
                              if completed.isEmpty {
                                  downloadManager.showPermissionAlert = true
                                  downloadManager.permissionMessage = "لا توجد تطبيقات مثبتة"
                              } else {
                                  downloadManager.showPermissionAlert = true
                                  downloadManager.permissionMessage = "✅ لديك \(completed.count) تطبيق مثبت"
                              }
                          }
                      }.padding(.horizontal)
                      
                      Picker("", selection: .constant(0)) {
                          Text("الملفات (\(downloadManager.ipaFiles.count))").tag(0)
                          Text("قيد التحميل (\(downloadManager.activeDownloads.count))").tag(1)
                      }.pickerStyle(SegmentedPickerStyle()).padding(.horizontal)
                      
                      if downloadManager.ipaFiles.isEmpty && downloadManager.activeDownloads.isEmpty {
                          emptyFilesView
                      } else {
                          LazyVStack(spacing: 12) {
                              if !downloadManager.ipaFiles.isEmpty {
                                  ForEach(downloadManager.ipaFiles) { file in
                                      IPAFileCard(
                                          file: file,
                                          onInstall: { handleInstall(file: file) },
                                          onShare:   { shareIPA(file: file) },
                                          onDelete:  { downloadManager.deleteIPAFile(file) }
                                      ).padding(.horizontal)
                                  }
                              }
                              if !downloadManager.activeDownloads.isEmpty {
                                  ForEach(downloadManager.activeDownloads) { dl in
                                      ActiveDownloadCard(download: dl, downloadManager: downloadManager).padding(.horizontal)
                                  }
                              }
                          }
                      }
                  }
                  .sheet(isPresented: $showIPAPicker) {
                      DocumentPicker(types: [.init(filenameExtension: "ipa") ?? .data]) { url in
                          downloadManager.importIPAFromURL(url: url)
                      }
                  }
                  .sheet(isPresented: $showInstallSheet) {
                      if let file = pendingInstallFile {
                          VIP21InstallSheet(
                              file: file,
                              downloadManager: downloadManager
                          )
                      }
                  }
                  .alert("خطأ في التثبيت", isPresented: $showInstallError) {
                      Button("حسناً", role: .cancel) { }
                  } message: { Text(installErrorMsg) }
              }
              
              func quickActionButton(title: String, icon: String, colors: [Color], action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      HStack(spacing: 8) {
                          Image(systemName: icon).font(.system(size: 14, weight: .semibold))
                          Text(title).font(.system(size: 13, weight: .semibold)).lineLimit(1)
                      }
                      .foregroundColor(.white)
                      .frame(maxWidth: .infinity)
                      .padding(.vertical, 12)
                      .background(
                          RoundedRectangle(cornerRadius: 14)
                              .fill(LinearGradient(colors: colors, startPoint: .topLeading, endPoint: .bottomTrailing))
                              .shadow(color: (colors.first ?? .vipPurple).opacity(0.35), radius: 8, y: 4)
                      )
                  }
              }
              
              var emptyFilesView: some View {
                  VStack(spacing: 16) {
                      Image(systemName: "doc.badge.plus").font(.system(size: 55)).foregroundColor(.gray.opacity(0.4))
                      Text("لا توجد ملفات IPA").font(.system(size: 18, weight: .semibold))
                      Text("حمّل تطبيقاً أو استورد ملف IPA").font(.system(size: 13)).foregroundColor(.gray)
                  }.frame(maxWidth: .infinity).padding(.top, 60)
              }
              
              func handleInstall(file: IPAFile) {
                  pendingInstallFile = file
                  showInstallSheet = true
              }
              
              func shareIPA(file: IPAFile) {
                  let url = URL(fileURLWithPath: file.localPath)
                  let name = file.fileName.replacingOccurrences(of: ".ipa", with: "")
                  let bid  = "com.vip21.\(name.lowercased().replacingOccurrences(of: " ", with: ""))"
                  let ver  = (Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String) ?? "1.0"
                  VIP21InstallEngine.shared.install(
                      ipaURL:   url,
                      bundleID: bid,
                      appName:  name,
                      version:  ver,
                      progressHandler: { _, _ in },
                      completion:      { _ in }
                  )
              }
          }
          
          struct IPAFileCard: View {
              let file: IPAFile
              let onInstall: () -> Void
              let onShare: () -> Void
              let onDelete: () -> Void
              @Environment(\.colorScheme) var scheme
              var statusColor: Color { file.isInstalled ? .blue : .orange }
              var statusLabel: String { file.isInstalled ? "مثبت" : "غير مثبت" }
              var body: some View {
                  VStack(spacing: 12) {
                      HStack(spacing: 12) {
                          ZStack {
                              RoundedRectangle(cornerRadius: 14)
                                  .fill(LinearGradient(colors: [statusColor.opacity(0.2), statusColor.opacity(0.1)],
                                                       startPoint: .topLeading, endPoint: .bottomTrailing))
                                  .frame(width: 54, height: 54)
                              Image(systemName: file.isInstalled ? "app.badge.checkmark.fill" : "doc.fill")
                                  .font(.system(size: 22)).foregroundColor(statusColor)
                          }
                          VStack(alignment: .trailing, spacing: 4) {
                              Text(file.fileName).font(.system(size: 14, weight: .bold)).lineLimit(1)
                              Text("\(file.fileSize) · \(file.date)")
                                  .font(.system(size: 10)).foregroundColor(.gray)
                              if file.isInstalled {
                                  Label("مثبت", systemImage: "checkmark.circle.fill")
                                      .font(.system(size: 9)).foregroundColor(.blue)
                              }
                          }
                          Spacer()
                          Text(statusLabel).font(.system(size: 11, weight: .bold))
                              .padding(.horizontal, 10).padding(.vertical, 5)
                              .background(Capsule().fill(statusColor.opacity(0.15))).foregroundColor(statusColor)
                      }
                      Divider().background(Color.gray.opacity(0.15))
                      HStack(spacing: 8) {
                          iconBtn("square.and.arrow.up", color: .blue)  { onShare() }
                          iconBtn("trash", color: .red) { onDelete() }
                          Spacer()
                          if file.isInstalled {
                              Text("✅ مثبت").font(.system(size: 12, weight: .semibold)).foregroundColor(.gray)
