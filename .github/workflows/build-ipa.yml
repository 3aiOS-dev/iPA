name: Build Jood IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required icons
        shell: bash
        run: |
          set -euo pipefail
          test -f "AppIcon60x60@2x.png"
          test -f "AppIcon76x76@2x~ipad.png"

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Create iOS project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p JoodApp/Sources JoodApp/Resources/Assets.xcassets/AppIcon.appiconset
          echo "" | base64 --decode > "project.yml"
          echo "" | base64 --decode > "JoodApp/Info.plist"
          echo "" | base64 --decode > "JoodApp/Sources/AppDelegate.swift"
          echo "" | base64 --decode > "JoodApp/Sources/SceneDelegate.swift"
          echo "" | base64 --decode > "JoodApp/Sources/WebViewController.swift"
          echo "" | base64 --decode > "JoodApp/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json"
          echo "eyAiaW5mbyI6IHsgImF1dGhvciI6ICJ4Y29kZSIsICJ2ZXJzaW9uIjogMSB9IH0K" | base64 --decode > "JoodApp/Resources/Assets.xcassets/Contents.json"
          ICON_DIR="JoodApp/Resources/Assets.xcassets/AppIcon.appiconset"
          cp "AppIcon60x60@2x.png" "$ICON_DIR/AppIcon60x60@2x.png"
          cp "AppIcon76x76@2x~ipad.png" "$ICON_DIR/AppIcon76x76@2x~ipad.png"
          sips -z 40 40 "AppIcon60x60@2x.png" --out "$ICON_DIR/Icon-20@2x.png" >/dev/null
          sips -z 60 60 "AppIcon60x60@2x.png" --out "$ICON_DIR/Icon-20@3x.png" >/dev/null
          sips -z 58 58 "AppIcon60x60@2x.png" --out "$ICON_DIR/Icon-29@2x.png" >/dev/null
          sips -z 87 87 "AppIcon60x60@2x.png" --out "$ICON_DIR/Icon-29@3x.png" >/dev/null
          sips -z 80 80 "AppIcon60x60@2x.png" --out "$ICON_DIR/Icon-40@2x.png" >/dev/null
          sips -z 120 120 "AppIcon60x60@2x.png" --out "$ICON_DIR/Icon-40@3x.png" >/dev/null
          sips -z 120 120 "AppIcon60x60@2x.png" --out "$ICON_DIR/AppIcon60x60@2x.png" >/dev/null
          sips -z 180 180 "AppIcon60x60@2x.png" --out "$ICON_DIR/Icon-60@3x.png" >/dev/null
          sips -z 20 20 "AppIcon76x76@2x~ipad.png" --out "$ICON_DIR/Icon-20@1x-ipad.png" >/dev/null
          sips -z 29 29 "AppIcon76x76@2x~ipad.png" --out "$ICON_DIR/Icon-29@1x-ipad.png" >/dev/null
          sips -z 40 40 "AppIcon76x76@2x~ipad.png" --out "$ICON_DIR/Icon-40@1x-ipad.png" >/dev/null
          sips -z 76 76 "AppIcon76x76@2x~ipad.png" --out "$ICON_DIR/Icon-76@1x-ipad.png" >/dev/null
          sips -z 152 152 "AppIcon76x76@2x~ipad.png" --out "$ICON_DIR/AppIcon76x76@2x~ipad.png" >/dev/null
          sips -z 167 167 "AppIcon76x76@2x~ipad.png" --out "$ICON_DIR/Icon-83.5@2x-ipad.png" >/dev/null
          sips -z 1024 1024 "AppIcon76x76@2x~ipad.png" --out "$ICON_DIR/Icon-1024.png" >/dev/null
          xcodegen generate

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project JoodApp.xcodeproj -scheme JoodApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/JoodApp.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload JoodApp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JoodApp-unsigned-IPA
          path: JoodApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
