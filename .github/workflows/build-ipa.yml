                ),
              }),
            ],
          });
          
          module.exports = logger;
          
          EOFBOT_UTILS_LOGGER_JS
          
          mkdir -p bot/src/services
          cat > bot/src/services/userService.js << 'EOFBOT_SVC_USER_JS'
          const db = require('../db');
          const { generateRefCode, hashToken } = require('../utils/code');
          const dayjs = require('dayjs');
          
          const UserStatus = Object.freeze({
            PENDING: 'pending',
            ACTIVE: 'active',
            BANNED: 'banned',
          });
          
          const findByTelegramId = (telegramId) =>
            db.prepare('SELECT * FROM users WHERE telegram_id = ?').get(telegramId);
          
          const findByRefCode = (ref) =>
            db.prepare('SELECT * FROM users WHERE ref_code = ?').get(ref);
          
          const createUser = ({ telegram_id, username, full_name, referred_by = null }) => {
            const ref = generateRefCode();
            const stmt = db.prepare(`
              INSERT INTO users (telegram_id, username, full_name, ref_code, referred_by, status)
              VALUES (?, ?, ?, ?, ?, 'pending')
            `);
            stmt.run(telegram_id, username || null, full_name || null, ref, referred_by);
            return findByTelegramId(telegram_id);
          };
          
          const setStatus = (telegramId, status) => {
            db.prepare(`
              UPDATE users SET status = ?, updated_at = datetime('now') WHERE telegram_id = ?
            `).run(status, telegramId);
          };
          
          const updateProfile = (telegramId, fields) => {
            const allowed = ['username', 'full_name', 'phone', 'email', 'locale'];
            const keys = Object.keys(fields).filter((k) => allowed.includes(k));
            if (!keys.length) return;
            const setClause = keys.map((k) => `${k} = ?`).join(', ');
            const values = keys.map((k) => fields[k]);
            db.prepare(`
              UPDATE users SET ${setClause}, updated_at = datetime('now')
              WHERE telegram_id = ?
            `).run(...values, telegramId);
          };
          
          const adjustBalance = (telegramId, delta) => {
            const res = db.prepare(`
              UPDATE users SET balance = balance + ?, updated_at = datetime('now')
              WHERE telegram_id = ?
            `).run(delta, telegramId);
            return res.changes > 0;
          };
          
          const setBalance = (telegramId, value) => {
            db.prepare(`
              UPDATE users SET balance = ?, updated_at = datetime('now')
              WHERE telegram_id = ?
            `).run(value, telegramId);
          };
          
          const listAll = ({ limit = 50, offset = 0, status = null } = {}) => {
            if (status) {
              return db.prepare(`
                SELECT * FROM users WHERE status = ?
                ORDER BY created_at DESC LIMIT ? OFFSET ?
              `).all(status, limit, offset);
            }
            return db.prepare(`
              SELECT * FROM users ORDER BY created_at DESC LIMIT ? OFFSET ?
            `).all(limit, offset);
          };
          
          const countByStatus = () =>
            db.prepare(`
              SELECT status, COUNT(*) as count FROM users GROUP BY status
            `).all();
          
          const audit = (actorTg, action, targetTg = null, details = null) => {
            db.prepare(`
              INSERT INTO audit_log (actor_tg, action, target_tg, details)
              VALUES (?, ?, ?, ?)
            `).run(actorTg, action, targetTg, details ? JSON.stringify(details) : null);
          };
          
          const stats = () => {
            const total = db.prepare('SELECT COUNT(*) as n FROM users').get().n;
            const active = db.prepare(`SELECT COUNT(*) as n FROM users WHERE status = 'active'`).get().n;
