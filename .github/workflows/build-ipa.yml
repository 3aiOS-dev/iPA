          REFEOF
          cat > AutoUDID.swift << 'UDEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import CryptoKit
          import Security
          import WebKit

          public final class UDIDFetcher: NSObject {
              public static nonisolated(unsafe) let shared = UDIDFetcher()

              public struct Result: Equatable {
                  public let udid: String
                  public let token: String
              }

              private enum Keys {
                  static let pendingToken = "udid.pending.token"
                  static let cached       = "udid.cache.json"
              }

              private override init() { super.init() }

              public func cachedUDID(forUsername user: String?) -> String? {
                  guard let user = user, !user.isEmpty else { return nil }
                  if let data = UserDefaults.standard.data(forKey: Keys.cached),
                     let map = try? JSONDecoder().decode([String: String].self, from: data) {
                      return map[user]
                  }
                  return nil
              }

              public func storeUDID(_ udid: String, forUsername user: String) {
                  var map: [String: String] = [:]
                  if let data = UserDefaults.standard.data(forKey: Keys.cached),
                     let decoded = try? JSONDecoder().decode([String: String].self, from: data) {
                      map = decoded
                  }
                  map[user] = udid
                  if let data = try? JSONEncoder().encode(map) {
                      UserDefaults.standard.set(data, forKey: Keys.cached)
                  }
              }

              public func fetchNow(presenter: UIViewController,
                                   username: String,
                                   completion: @escaping (Result?) -> Void) {
                  let token = self.mintToken()
                  UserDefaults.standard.set(token, forKey: Keys.pendingToken)
                  UserDefaults.standard.set(username, forKey: "udid.pending.username")

                  let enroll = URL(string: "https://21s.app/udid/\(token).mobileconfig")!
                  let safari = SafariViewController(url: enroll)
                  safari.modalPresentationStyle = .formSheet
                  safari.udidCompletion = { [weak safari] resultUDID in
                      safari?.dismiss(animated: true) {
                          if let udid = resultUDID, !udid.isEmpty {
                              self.storeUDID(udid, forUsername: username)
                              completion(Result(udid: udid, token: token))
                          } else {
                              completion(nil)
                          }
                      }
                  }
                  presenter.present(safari, animated: true)
              }

              public func handleOpenURL(_ url: URL) -> Result? {
                  guard url.scheme == "21s" else { return nil }
                  let comps = URLComponents(url: url, resolvingAgainstBaseURL: false)
                  let token = comps?.queryItems?.first(where: { $0.name == "token" })?.value
                  let udid  = comps?.queryItems?.first(where: { $0.name == "udid" })?.value
                  guard let token = token, let udid = udid, !udid.isEmpty else { return nil }
                  let user = UserDefaults.standard.string(forKey: "udid.pending.username") ?? ""
                  if !user.isEmpty { self.storeUDID(udid, forUsername: user) }
                  UserDefaults.standard.removeObject(forKey: Keys.pendingToken)
                  return Result(udid: udid, token: token)
              }

              private func mintToken() -> String {
                  var bytes = [UInt8](repeating: 0, count: 24)
                  _ = SecRandomCopyBytes(kSecRandomDefault, bytes.count, &bytes)
                  return bytes.map { String(format: "%02x", $0) }.joined()
              }
          }

          public final class SafariViewController: UIViewController, WKNavigationDelegate {
              private let web: WKWebView
              public var udidCompletion: ((String?) -> Void)?
              private let token: String
              public init(url: URL) {
                  let cfg = WKWebViewConfiguration()
                  cfg.defaultWebpagePreferences.allowsContentJavaScript = true
                  self.web = WKWebView(frame: .zero, configuration: cfg)
                  self.token = url.lastPathComponent.replacingOccurrences(of: ".mobileconfig", with: "")
                  super.init(nibName: nil, bundle: nil)
                  self.web.navigationDelegate = self
                  self.web.load(URLRequest(url: url))
              }
              required init?(coder: NSCoder) { fatalError() }
              public override func loadView() { self.view = self.web }

              public func webView(_ webView: WKWebView,
                                  decidePolicyFor navigationAction: WKNavigationAction,
                                  decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                  if let url = navigationAction.request.url,
                     url.scheme == "21s",
                     let result = UDIDFetcher.shared.handleOpenURL(url) {
                      decisionHandler(.cancel)
                      self.udidCompletion?(result.udid)
                      return
                  }
                  decisionHandler(.allow)
              }
          }

          public struct AutoUDIDView: View {
              @Environment(\.dismiss) private var dismiss
              @Binding var udid: String
              public init(udid: Binding<String>) {
                  self._udid = udid
              }
              public var body: some View {
                  NavigationView {
                      ScrollView {
                          VStack(spacing: 20) {
                              Image(uiImage: UIImage.bundled("autoudid_hero.png") ?? UIImage())
                                  .resizable().scaledToFit()
                                  .frame(maxHeight: 220)
                                  .cornerRadius(20)
                              Text("Get your UDID automatically")
                                  .font(.system(size: 22, weight: .bold))
                                  .multilineTextAlignment(.center)
                              Text("Tap the button below. Safari will open a temporary configuration profile. Once iOS installs it, your UDID is sent back to 21s and the field below is filled in for you - with 0% error rate.")
                                  .font(.system(size: 13))
                                  .multilineTextAlignment(.center)
                                  .foregroundColor(.storeSub)
                              Button {
                                  start()
                              } label: {
                                  HStack {
                                      Image(systemName: "arrow.down.doc.fill")
                                      Text("Fetch UDID automatically")
                                  }
                                  .font(.system(size: 15, weight: .bold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity, minHeight: 52)
                                  .background(RoundedRectangle(cornerRadius: 14).fill(Color.storePrimary))
                              }
                              Text("Or enter it manually")
                                  .font(.system(size: 11, weight: .semibold))
                                  .foregroundColor(.storeSub)
                              TextField("40-character UDID", text: $udid)
                                  .font(.system(size: 13, design: .monospaced))
                                  .padding(12)
                                  .background(RoundedRectangle(cornerRadius: 10)
                                      .stroke(Color.storeDivider, lineWidth: 1))
                                  .autocorrectionDisabled(true)
                                  .textInputAutocapitalization(.never)
                          }
                          .padding(20)
                      }

                      .background(
                          Rectangle()
                              .fill(Color.storeBgGradient)
                              .ignoresSafeArea()
                      )
                      .navigationTitle("Device UDID")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Done") { dismiss() }
                          }
                      }
                  }
              }
              private func start() {
                  let scenes = UIApplication.shared.connectedScenes
                      .compactMap { $0 as? UIWindowScene }
                  guard let window = scenes.first?.windows.first(where: { $0.isKeyWindow }) ?? scenes.first?.windows.first else { return }
                  var top: UIViewController = window.rootViewController ?? UIViewController()
                  while let p = top.presentedViewController { top = p }
                  UDIDFetcher.shared.fetchNow(presenter: top,
                                              username: AuthManager.shared.currentUser?.username ?? "guest") { result in
                      if let result = result {
                          self.udid = result.udid
                          HapticManager.shared.notification(.success)
                          self.dismiss()
                      } else {
                          HapticManager.shared.notification(.error)
                      }
                  }
              }
          }
          UDEOF
          ls -l *.swift | tail -20

      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            Repositories.swift \
            FavoritesStore.swift \
            AuthManager.swift \
            Countries.swift \
            OnboardingView.swift \
            AuthViews.swift \
            StoreView.swift \
            ContentView.swift \
            VIP21StoreApp.swift \
            Settings.swift \
            StatusScreens.swift \
            WalletAdvanced.swift \
            CryptoTopUp.swift \
            ReferralSystem.swift \
            AutoUDID.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework ImageIO \
            -framework MobileCoreServices \
            -framework Network \
            -framework CFNetwork \
            -framework UserNotifications \
            -framework PassKit \
            -framework CryptoKit \
            -framework WebKit \
            -framework LocalAuthentication \
            -framework CoreImage \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA package
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp -X VIP21Store                            build-output/Payload/VIP21Store.app/VIP21Store
          cp -X Resources/Info.plist                  build-output/Payload/VIP21Store.app/Info.plist
          cp -X Resources/AppIcon60x60@2x.png         build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon60x60@3x.png         build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon76x76@2x~ipad.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon1024x1024.png        build-output/Payload/VIP21Store.app/
          cp -X Resources/login_logo.png              build-output/Payload/VIP21Store.app/
          cp -X Resources/register_logo.png           build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding1.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding2.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding3.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/home_banner.gif             build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding1.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding2.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding3.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/settings_onboarding.gif     build-output/Payload/VIP21Store.app/
          cp -X Resources/no_internet.gif             build-output/Payload/VIP21Store.app/
          cp -X Resources/thanks_overlay.gif          build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_hero.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb1.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb2.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb3.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/crypto_topup_hero.png                build-output/Payload/VIP21Store.app/
          cp -X Resources/crypto_onb1.png                      build-output/Payload/VIP21Store.app/
          cp -X Resources/crypto_onb2.png                      build-output/Payload/VIP21Store.app/
          cp -X Resources/crypto_onb3.png                      build-output/Payload/VIP21Store.app/
          cp -X Resources/referral_hero.png                    build-output/Payload/VIP21Store.app/
          cp -X Resources/referral_onb1.png                    build-output/Payload/VIP21Store.app/
          cp -X Resources/referral_onb2.png                    build-output/Payload/VIP21Store.app/
          cp -X Resources/referral_onb3.png                    build-output/Payload/VIP21Store.app/
          cp -X Resources/autoudid_hero.png                    build-output/Payload/VIP21Store.app/
          cp -X Resources/autoudid_onb1.png                    build-output/Payload/VIP21Store.app/
          cp -X Resources/autoudid_onb2.png                    build-output/Payload/VIP21Store.app/
          cp -X Resources/autoudid_onb3.png                    build-output/Payload/VIP21Store.app/
          cp -X Resources/feature_app_icon.png                 build-output/Payload/VIP21Store.app/

          xattr -cr build-output
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          ldid -S build-output/Payload/VIP21Store.app/VIP21Store

          rm -f artifacts/21s.ipa
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete
          xattr -cr build-output/Payload || true
          cd build-output && zip -r -X -q ../artifacts/21s.ipa Payload && cd ..
          ls -lh artifacts/21s.ipa

          if ! unzip -tq artifacts/21s.ipa >/dev/null 2>&1; then
            echo "Error: IPA file is corrupt or invalid."
            exit 1
          fi
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/21s.ipa | head -60
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "== Integrity test =="
          unzip -tq artifacts/21s.ipa > /dev/null
          if unzip -l artifacts/21s.ipa | grep -q "_CodeSignature/CodeResources\|_CodeSignature"; then
            echo "Warning: _CodeSignature found in IPA (should be inside .app, not Payload root)"
          fi
          unzip -p artifacts/21s.ipa Payload/VIP21Store.app/VIP21Store | head -c 4 | xxd | head -1
          echo "IPA is valid, passes zip integrity test, and contains the App Bundle."


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-1000GB-Apps-IPA
          path: artifacts/21s.ipa
          retention-days: 90
