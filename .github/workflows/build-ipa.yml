                  }
              }
          }

          func geamRelsShare(_ text: String) {
              guard let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                    let root = scene.windows.first(where: { $0.isKeyWindow })?.rootViewController else { return }
              let vc = UIActivityViewController(activityItems: [text], applicationActivities: nil)
              var top = root
              while let presented = top.presentedViewController { top = presented }
              if let pop = vc.popoverPresentationController {
                  pop.sourceView = top.view
                  pop.sourceRect = CGRect(x: top.view.bounds.midX, y: top.view.bounds.midY, width: 0, height: 0)
              }
              top.present(vc, animated: true)
          }

          // ================= مشغل GIF عن بعد =================
          struct RemoteGifView: UIViewRepresentable {
              let urlString: String
              var fill: Bool

              func makeUIView(context: Context) -> UIImageView {
                  let iv = UIImageView()
                  iv.contentMode = fill ? .scaleAspectFill : .scaleAspectFit
                  iv.clipsToBounds = true
                  iv.backgroundColor = .black
                  guard let url = URL(string: urlString) else { return iv }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data,
                            let src = CGImageSourceCreateWithData(data as CFData, nil) else { return }
                      let count = CGImageSourceGetCount(src)
                      var frames: [UIImage] = []
                      var duration: Double = 0
                      for i in 0..<count {
                          guard let cg = CGImageSourceCreateImageAtIndex(src, i, nil) else { continue }
                          frames.append(UIImage(cgImage: cg))
                          if let props = CGImageSourceCopyPropertiesAtIndex(src, i, nil) as? [CFString: Any],
                             let gif = props[kCGImagePropertyGIFDictionary] as? [CFString: Any] {
                              let d = (gif[kCGImagePropertyGIFUnclampedDelayTime] as? Double)
                                  ?? (gif[kCGImagePropertyGIFDelayTime] as? Double) ?? 0.1
                              duration += max(d, 0.02)
                          }
                      }
                      DispatchQueue.main.async {
                          if frames.count > 1 {
                              iv.animationImages = frames
                              iv.animationDuration = duration > 0 ? duration : Double(frames.count) / 20.0
                              iv.animationRepeatCount = 0
                              iv.startAnimating()
                          } else {
                              iv.image = frames.first
                          }
                      }
                  }.resume()
                  return iv
              }

              func updateUIView(_ iv: UIImageView, context: Context) {
                  iv.contentMode = fill ? .scaleAspectFill : .scaleAspectFit
              }
          }

          // ================= REEL PLAYER =================
          struct ReelPlayer: UIViewControllerRepresentable {
              let urlString: String
              var isActive: Bool
              var fill: Bool = true

              func makeUIViewController(context: Context) -> AVPlayerViewController {
                  let vc = AVPlayerViewController()
                  vc.showsPlaybackControls = false
                  vc.videoGravity = fill ? .resizeAspectFill : .resizeAspect
                  vc.view.backgroundColor = .black
                  if let url = URL(string: urlString) {
                      let player = AVPlayer(url: url)
                      player.isMuted = false
                      vc.player = player
                      NotificationCenter.default.addObserver(forName: .AVPlayerItemDidPlayToEndTime,
                                                             object: player.currentItem,
                                                             queue: .main) { _ in
                          player.seek(to: .zero)
                          player.play()
                      }
                  }
                  return vc
