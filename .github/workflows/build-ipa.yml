                          .fill(Color.storeCard)
                          .overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.storeDivider, lineWidth: 0.5))
                  )
              }
          }

          @MainActor
          final class StoreFeedViewModel: ObservableObject {
              @Published var apps: [StoreAPIApp] = []
              @Published var query: String = ""
              @Published var isLoading: Bool = false
              @Published var errorMessage: String? = nil

              private let primaryURL = "https://repository.apptesters.org/apps.json"

              init() {}

              var filtered: [StoreAPIApp] {
                  let q = query.lowercased().trimmingCharacters(in: .whitespaces)
                  if q.isEmpty { return apps }
                  return apps.filter {
                      $0.name.lowercased().contains(q) ||
                      ($0.bundleId ?? "").lowercased().contains(q) ||
                      ($0.developerName ?? "").lowercased().contains(q) ||
                      $0.cleanDescription.lowercased().contains(q)
                  }
              }

              func reload() async {
                  isLoading = true
                  errorMessage = nil
                  defer { isLoading = false }
                  guard let url = URL(string: primaryURL) else {
                      errorMessage = "Invalid URL"
                      return
                  }
                  do {
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 12
                      req.setValue("21s/1.0 iOS", forHTTPHeaderField: "User-Agent")
                      let (data, _) = try await URLSession.shared.data(for: req)
                      let resp = try JSONDecoder().decode(StoreAPIResponse.self, from: data)
                      self.apps = resp.apps
                      if resp.apps.isEmpty {
                          errorMessage = "No apps returned by the source."
                      }
                  } catch {
                      self.errorMessage = "Couldn't load the catalog: \(error.localizedDescription)"
                  }
              }
          }
