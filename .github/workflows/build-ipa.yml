                  جميع التطبيقات والألعاب والتقييمات الظاهرة في التطبيق بيانات وهمية لأغراض العرض فقط، ولا يقوم التطبيق بأي تنزيل أو تثبيت فعلي لأي برنامج حقيقي.

                  ٢) المفضلة
                  عند إضافة تطبيق إلى المفضلة، يتم حفظ هذا الاختيار محليًا على جهازك فقط (باستخدام UserDefaults)، ولا تتم مشاركته أو إرساله إلى أي خادم أو جهة خارجية.

                  ٣) جمع البيانات
                  لا يقوم هذا التطبيق بجمع أي معلومات شخصية، ولا يطلب أذونات وصول لجهات الاتصال أو الموقع أو الكاميرا، ولا يتصل بأي خدمات تحليلات أو إعلانات حقيقية.

                  ٤) الاتصال بالإنترنت
                  التطبيق يعمل بالكامل دون اتصال بالإنترنت، ولا يرسل أو يستقبل أي بيانات من مصادر خارجية.

                  ٥) التواصل
                  لأي استفسار حول هذه السياسة، يرجى التواصل مع المطوّر عبر القنوات المعتادة لدعم التطبيق.
                  """
                  scrollView.addSubview(label)

                  NSLayoutConstraint.activate([
                      scrollView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      scrollView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      scrollView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      scrollView.bottomAnchor.constraint(equalTo: view.bottomAnchor),

                      label.topAnchor.constraint(equalTo: scrollView.topAnchor, constant: 20),
                      label.leadingAnchor.constraint(equalTo: scrollView.leadingAnchor, constant: 20),
                      label.trailingAnchor.constraint(equalTo: scrollView.trailingAnchor, constant: -20),
                      label.bottomAnchor.constraint(equalTo: scrollView.bottomAnchor, constant: -20),
                      label.widthAnchor.constraint(equalTo: scrollView.widthAnchor, constant: -40),
                  ])
              }
          }
          HEOF

      - name: Generate Source - Onboarding Screen
        run: |
          cd ${{ github.workspace }}
          cat > OnboardingViewController.swift << 'OEOF'
          import UIKit

          final class OnboardingViewController: UIViewController {

              var onFinish: (() -> Void)?

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = AppTheme.background
                  build()
              }

              private func build() {
                  let iconView = UIView()
                  iconView.backgroundColor = AppTheme.accent
                  iconView.layer.cornerRadius = 20
                  iconView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(iconView)

                  let iconLabel = UILabel()
                  iconLabel.text = "21"
                  iconLabel.font = .systemFont(ofSize: 30, weight: .heavy)
                  iconLabel.textColor = .white
                  iconLabel.textAlignment = .center
                  iconLabel.translatesAutoresizingMaskIntoConstraints = false
                  iconView.addSubview(iconLabel)

                  let title = UILabel()
                  title.text = "أهلًا بك في 21s"
                  title.font = .systemFont(ofSize: 24, weight: .bold)
                  title.textColor = AppTheme.primaryText
                  title.textAlignment = .center
                  title.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(title)

                  let subtitle = UILabel()
                  subtitle.text = "هذا تطبيق عرض تجريبي فقط: كل التطبيقات والبيانات المعروضة وهمية، ولا يتم تنزيل أو تثبيت أي شيء حقيقي. يمكنك تصفح أفضل التطبيقات من الرئيسية، وإضافة تطبيقات للمفضلة، ومراجعة سياسة الخصوصية من تبويب الإعدادات في أي وقت."
                  subtitle.font = .systemFont(ofSize: 15)
                  subtitle.textColor = AppTheme.secondaryText
                  subtitle.numberOfLines = 0
                  subtitle.textAlignment = .center
                  subtitle.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(subtitle)

                  let button = UIButton(type: .system)
                  button.setTitle("ابدأ التصفح", for: .normal)
                  button.titleLabel?.font = .systemFont(ofSize: 16, weight: .bold)
                  button.backgroundColor = AppTheme.accent
                  button.setTitleColor(.white, for: .normal)
                  button.layer.cornerRadius = 12
                  button.addTarget(self, action: #selector(startTapped), for: .touchUpInside)
                  button.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(button)

                  NSLayoutConstraint.activate([
                      iconView.centerXAnchor.constraint(equalTo: view.centerXAnchor),
                      iconView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.centerYAnchor, constant: -150),
                      iconView.widthAnchor.constraint(equalToConstant: 68),
                      iconView.heightAnchor.constraint(equalToConstant: 68),

                      iconLabel.centerXAnchor.constraint(equalTo: iconView.centerXAnchor),
                      iconLabel.centerYAnchor.constraint(equalTo: iconView.centerYAnchor),

                      title.topAnchor.constraint(equalTo: iconView.bottomAnchor, constant: 20),
                      title.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 32),
                      title.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -32),

                      subtitle.topAnchor.constraint(equalTo: title.bottomAnchor, constant: 12),
                      subtitle.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 32),
                      subtitle.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -32),

                      button.topAnchor.constraint(equalTo: subtitle.bottomAnchor, constant: 28),
                      button.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 40),
                      button.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -40),
                      button.heightAnchor.constraint(equalToConstant: 48),
                  ])
              }

              @objc private func startTapped() {
                  UserDefaults.standard.set(true, forKey: "app21s.onboarding.seen")
                  dismiss(animated: true) { [weak self] in
                      self?.onFinish?()
                  }
              }
          }
