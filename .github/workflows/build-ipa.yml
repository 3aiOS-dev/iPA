          import Foundation

          struct Country: Identifiable, Hashable {
              let id = UUID()
              let name: String
              let dialCode: String
              let flag: String

              /// ISO رمز الدولة ("SA") -> علم إيموجي ("\u{1F1F8}\u{1F1E6}")
              var flagEmoji: String {
                  let code = flag.uppercased()
                  guard code.count == 2, code.allSatisfy({ $0.isLetter }) else { return flag }
                  var out = ""
                  for ch in code.unicodeScalars {
                      if let scalar = UnicodeScalar(127397 + ch.value) {
                          out.unicodeScalars.append(scalar)
                      }
                  }
                  return out.isEmpty ? flag : out
              }
