name: 21s Login + Apps (SwiftUI) - 1000GB Edition

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "21s"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: Maximize build resources (1TB+ capacity)
        run: |
          echo "=== Build capacity check ==="
          df -h
          echo "=== macOS resource limits ==="
          ulimit -a
          echo "=== Available CPUs ==="
          sysctl -n hw.ncpu
          echo "=== Available memory ==="
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS - download images from URLs
      # =========================================================
      - name: Download project images
        run: |
          mkdir -p Resources
          # Auth / Onboarding
          curl -L -o Resources/login_logo.png      "https://up6.cc/2026/07/178463790906632.png"
          curl -L -o Resources/register_logo.png   "https://up6.cc/2026/07/178463790901181.png"
          curl -L -o Resources/onboarding1.png    "https://up6.cc/2026/07/178463910434943.png"
          curl -L -o Resources/onboarding2.png    "https://up6.cc/2026/07/178463910431782.png"
          curl -L -o Resources/onboarding3.png    "https://up6.cc/2026/07/178463910425551.png"
          # Home banner - auto-repeating GIF (replaces the static DiscountBanner)
          curl -L -o Resources/home_banner.gif "https://up6.cc/2026/07/178489791030411.gif"
          # Alerts onboarding animations (GIFs)
          curl -L -o Resources/alerts_onboarding1.gif "https://up6.cc/2026/07/178467158819014.gif"
          curl -L -o Resources/alerts_onboarding2.gif "https://up6.cc/2026/07/178467158813032.gif"
          curl -L -o Resources/alerts_onboarding3.gif "https://up6.cc/2026/07/17846720131242.gif"
          # Settings onboarding GIF (kept - still used by Settings onboarding)
          curl -L -o Resources/settings_onboarding.gif "https://up6.cc/2026/07/178467999736562.gif"
          # Status / Error screens (no-internet)
          curl -L -o Resources/no_internet.gif         "https://up6.cc/2026/07/178475589206661.gif"
          # Thanks overlay (shown after the user takes a screenshot)
          curl -L -o Resources/thanks_overlay.gif      "https://up6.cc/2026/07/178480321212891.gif"
          file Resources/*.png Resources/*.gif 2>/dev/null || true
          ls -lh Resources

      - name: Generate feature images (Advanced Wallet / Crypto / Referral / Auto-UDID)
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow 2>/dev/null || true
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os, random
          os.makedirs("Resources", exist_ok=True)
          random.seed(42)

          def gradient(w, h, c1, c2, vertical=True):
              img = Image.new("RGBA", (w, h), c1 + (255,))
              d = ImageDraw.Draw(img)
              steps = h if vertical else w
              for i in range(steps):
                  t = i / max(1, steps - 1)
                  r = int(c1[0] + (c2[0] - c1[0]) * t)
                  g = int(c1[1] + (c2[1] - c1[1]) * t)
                  b = int(c1[2] + (c2[2] - c1[2]) * t)
                  d.line([(0, i), (w, i)] if vertical else [(i, 0), (i, h)], fill=(r, g, b, 255))
              return img

          def rounded_card(w, h, radius, fill, shadow=True):
              img = Image.new("RGBA", (w, h), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              if shadow:
                  d.rounded_rectangle((4, 8, w - 4, h - 4), radius=radius, fill=(0, 0, 0, 60))
              body = (4, 4, w - 5, h - 5) if shadow else (0, 0, w - 1, h - 1)
              d.rounded_rectangle(body, radius=radius, fill=fill)
              return img

          def find_font(size):
              for p in [
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/SFNSDisplay.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/Library/Fonts/Arial Bold.ttf",
              ]:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, size)
                      except: pass
              return ImageFont.load_default()

          def text_centered(d, txt, x, y, font, fill):
              try:
                  bbox = d.textbbox((0, 0), txt, font=font)
                  w = bbox[2] - bbox[0]; h = bbox[3] - bbox[1]
              except AttributeError:
                  w, h = d.textsize(txt, font=font)
              if isinstance(fill, tuple) and len(fill) == 4 and getattr(d, "_image", None) is not None:
                  if d._image.mode == "RGB":
                      fill = fill[:3]
              d.text((x - w // 2, y - h // 2), txt, font=font, fill=fill)

          def draw_icon_circle(w, h, color, glyph, glyph_color=(255, 255, 255)):
              img = gradient(w, h, color, tuple(max(0, c - 40) for c in color))
              d = ImageDraw.Draw(img)
              f = find_font(int(h * 0.55))
              text_centered(d, glyph, w // 2, h // 2, f, glyph_color)
              return img

          def write_image(path, img):
              if img.mode == "RGBA":
                  bg = Image.new("RGB", img.size, (255, 255, 255))
                  bg.paste(img, mask=img.split()[-1])
                  img = bg
              img.save(path, "PNG", optimize=True)
              return img

          # Advanced Wallet hero
          W, H = 900, 600
          base = gradient(W, H, (10, 18, 42), (24, 36, 80))
          d = ImageDraw.Draw(base)
          card = rounded_card(W - 120, 260, 28, (255, 255, 255))
          base.paste(card, (60, 200), card)
          d = ImageDraw.Draw(base)
          text_centered(d, "P2P WALLET", W // 2, 250, find_font(28), (120, 130, 160))
          text_centered(d, "$ 1,250.00", W // 2, 340, find_font(72), (20, 25, 50))
          text_centered(d, "Available balance", W // 2, 410, find_font(22), (110, 120, 140))
          chip = rounded_card(140, 50, 14, (90, 200, 130))
          base.paste(chip, (380, 130), chip)
          d = ImageDraw.Draw(base)
          text_centered(d, "ACTIVE", W // 2, 155, find_font(20), (255, 255, 255))
          write_image("Resources/wallet_advanced_hero.png", base)

          # Crypto top-up
          base = gradient(W, H, (18, 24, 56), (40, 18, 70))
          d = ImageDraw.Draw(base)
          coins = [("USDT", (38, 161, 110)), ("BTC", (247, 147, 26)), ("ETH", (98, 126, 234))]
          for i, (label, col) in enumerate(coins):
              chip = rounded_card(220, 180, 22, col)
              base.paste(chip, (90 + i * 240, 220), chip)
              d = ImageDraw.Draw(base)
              text_centered(d, label, 200 + i * 240, 310, find_font(48), (255, 255, 255))
          text_centered(d, "Crypto Top-up", W // 2, 130, find_font(46), (255, 255, 255))
          text_centered(d, "Pay with USDT, BTC, ETH or Apple Pay", W // 2, 470, find_font(22), (220, 220, 240))
          write_image("Resources/crypto_topup_hero.png", base)

          # Referral
          base = gradient(W, H, (30, 50, 30), (16, 28, 18))
          d = ImageDraw.Draw(base)
          you = draw_icon_circle(180, 180, (90, 200, 130), "Y")
          base.paste(you, (140, 280), you)
          fr = draw_icon_circle(180, 180, (60, 160, 240), "F")
          base.paste(fr, (580, 280), fr)
          d.line((330, 370, 570, 370), fill=(255, 255, 255), width=8)
          d.polygon([(570, 350), (590, 370), (570, 390)], fill=(255, 255, 255))
          text_centered(d, "Invite friends. Earn wallet credit.", W // 2, 140, find_font(36), (255, 255, 255))
          text_centered(d, "Get $5 for every signup", W // 2, 200, find_font(26), (180, 240, 200))
          write_image("Resources/referral_hero.png", base)

          # Auto-UDID
          base = gradient(W, H, (8, 14, 30), (20, 28, 60))
          d = ImageDraw.Draw(base)
          px, py, pw, ph = 320, 90, 260, 460
          d.rounded_rectangle((px, py, px + pw, py + ph), radius=36, outline=(140, 200, 255), width=4)
          d.rounded_rectangle((px + 16, py + 60, px + pw - 16, py + 110), radius=8, fill=(40, 50, 90))
          text_centered(d, "UDID", px + pw // 2, py + 85, find_font(22), (200, 220, 255))
          d.text((px + 30, py + 160), "ABCDEF12-3456-7890-", font=find_font(20), fill=(220, 230, 255))
          d.text((px + 30, py + 200), "ABCD-1234-EFGH-5678", font=find_font(20), fill=(220, 230, 255))
          d.text((px + 30, py + 240), "9012-IJKL-MNOP-QRST", font=find_font(20), fill=(220, 230, 255))
          d.rounded_rectangle((px + 30, py + 330, px + pw - 30, py + 380), radius=12, fill=(70, 130, 240))
          text_centered(d, "FETCH", px + pw // 2, py + 355, find_font(20), (255, 255, 255))
          text_centered(d, "Auto-UDID", W // 2, 50, find_font(30), (200, 220, 255))
          text_centered(d, "One-tap profile installer", W // 2, 580, find_font(22), (180, 200, 240))
          write_image("Resources/autoudid_hero.png", base)

          # Onboarding slides
          def onboarding(text_title, text_body, accent):
              W, H = 900, 1400
              base = gradient(W, H, (250, 251, 255), (235, 240, 255))
              d = ImageDraw.Draw(base)
              d.rounded_rectangle((80, 200, W - 80, 900), radius=40, fill=accent)
              text_centered(d, text_title, W // 2, 350, find_font(60), (255, 255, 255))
              text_centered(d, "*", W // 2, 560, find_font(80), (255, 255, 255))
              for i, line in enumerate(text_body.split("\n")):
                  text_centered(d, line, W // 2, 1050 + i * 70, find_font(34), (40, 50, 80))
              for i in range(3):
                  x = W // 2 - 60 + i * 60
                  d.ellipse((x, 1280, x + 30, 1310), fill=(180, 190, 220))
              d.ellipse((W // 2 - 15, 1280, W // 2 + 15, 1310), fill=(40, 50, 80))
              return base

          for i, (t, b, c) in enumerate([
              ("Send & Receive", "Transfer wallet credit\nto any 21s user, instantly.", (60, 130, 220)),
              ("Top-up Anywhere", "USDT, BTC, ETH or\nlocal payment methods.", (90, 200, 130)),
              ("Refer & Earn", "Share your link - every\nsignup gives you $5.", (200, 100, 220)),
          ]):
              write_image(f"Resources/wallet_advanced_onb{i+1}.png", onboarding(t, b, c))

          for i, (t, b, c) in enumerate([
              ("USDT TRC-20", "Low-fee stable coin top-up,\narrives in ~1 minute.", (38, 161, 110)),
              ("BTC & ETH", "Native on-chain support with\nlive rate conversion.", (60, 100, 220)),
              ("Apple Pay", "One-tap checkout with\nFace ID confirmation.", (10, 10, 10)),
          ]):
              write_image(f"Resources/crypto_onb{i+1}.png", onboarding(t, b, c))

          for i, (t, b, c) in enumerate([
              ("Your unique link", "Share your code, get paid\nevery time a friend joins.", (90, 200, 130)),
              ("Earn in wallet", "Referral rewards land in\nyour P2P wallet instantly.", (60, 130, 220)),
              ("No limits", "Stack unlimited rewards,\nno expiry, no fees.", (200, 100, 220)),
          ]):
              write_image(f"Resources/referral_onb{i+1}.png", onboarding(t, b, c))

          for i, (t, b, c) in enumerate([
              ("One tap fetch", "Open a temporary profile\nin Safari to read your UDID.", (60, 130, 220)),
              ("Auto-return", "We bring you back to 21s\nwith the UDID already filled in.", (90, 200, 130)),
              ("0% error rate", "No copy-paste, no typos -\nverified by Apple's profile.", (200, 100, 220)),
          ]):
              write_image(f"Resources/autoudid_onb{i+1}.png", onboarding(t, b, c))

          ico = gradient(1024, 1024, (24, 36, 80), (10, 18, 42))
          d = ImageDraw.Draw(ico)
          d.rounded_rectangle((120, 120, 904, 904), radius=180, fill=(70, 130, 240))
          d.rounded_rectangle((220, 340, 804, 700), radius=30, fill=(255, 255, 255))
          d.text((260, 380), "21s", font=find_font(280), fill=(24, 36, 80))
          write_image("Resources/feature_app_icon.png", ico)
          print("All feature images generated.")
          PYEOF
          ls -lh Resources | tail -30

      - name: Generate app icons from the logo image
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image
          src = Image.open("Resources/login_logo.png").convert("RGBA")
          def make_icon(size, path):
              bg = Image.new("RGBA", (size, size), (10, 12, 18, 255))
              logo = src.resize((size, size))
              bg.alpha_composite(logo)
              bg.convert("RGB").save(path, "PNG")
          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYEOF
          ls -lh Resources

