                          .font(.system(size: 9))
                          .foregroundColor(.xcodeSecondary)
                      Text(value)
                          .font(.system(size: 11, weight: .semibold))
                          .lineLimit(2)
                          .multilineTextAlignment(.center)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(10)
                  .background(RoundedRectangle(cornerRadius: 10).fill(Color.gray.opacity(0.06)))
              }
          }
          VIPEOF

      - name: توليد الكود - SigningTabView.swift (بدلاً من DownloadsTabView)
        run: |
          cat > SigningTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UniformTypeIdentifiers

          struct SigningTabView: View {
              @ObservedObject var certificateManager: CertificateManager
              @ObservedObject var signer: Signer
              @State private var showCertImport = false
              @State private var showProvisionImport = false
              @State private var showIPAPicker = false
              @State private var showPasswordAlert = false
              @State private var p12Password = ""
              @State private var selectedCertID: UUID?
              @State private var importedIPAPath: String?
              @State private var signingInProgress = false

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 16) {
                              // بطاقة استيراد الشهادة P12
                              ActionCard(
                                  icon: "lock.shield.fill",
                                  title: "استيراد شهادة P12",
                                  description: "قم باستيراد ملف .p12 أو .pfx للتوقيع",
                                  color: .xcodeOrange
                              ) {
                                  showCertImport = true
                              }

                              // بطاقة استيراد ملف التزويد
                              ActionCard(
                                  icon: "doc.badge.gearshape.fill",
                                  title: "استيراد ملف تزويد",
                                  description: "قم باستيراد ملف .mobileprovision",
                                  color: .xcodeGreen
                              ) {
                                  showProvisionImport = true
                              }

                              // بطاقة استيراد IPA
                              ActionCard(
                                  icon: "app.fill",
                                  title: "استيراد ملف IPA",
                                  description: "اختر ملف IPA لتوقيعه",
                                  color: .xcodeBlue
                              ) {
                                  showIPAPicker = true
                              }

                              // عرض الشهادات المستوردة
                              if !certificateManager.certificates.isEmpty {
                                  VStack(alignment: .trailing, spacing: 8) {
                                      HStack {
                                          Text("الشهادات المحفوظة")
                                              .font(.system(size: 14, weight: .bold))
                                              .foregroundColor(.primary)
                                          Spacer()
                                          Text("\(certificateManager.certificates.count)")
                                              .font(.system(size: 12))
                                              .foregroundColor(.xcodeSecondary)
                                      }
                                      .padding(.horizontal, 4)

                                      ForEach(certificateManager.certificates) { cert in
                                          HStack {
                                              VStack(alignment: .trailing, spacing: 4) {
                                                  Text(cert.displayTitle)
                                                      .font(.system(size: 13, weight: .semibold))
                                                  Text(cert.type.displayName)
                                                      .font(.system(size: 10))
                                                      .foregroundColor(.xcodeSecondary)
                                              }
                                              Spacer()
                                              if cert.isDefault {
                                                  Image(systemName: "checkmark.circle.fill")
                                                      .foregroundColor(.xcodeBlue)
                                              }
                                              Button {
                                                  certificateManager.setDefault(id: cert.id)
                                              } label: {
                                                  Text("تعيين")
                                                      .font(.system(size: 10, weight: .bold))
                                                      .padding(.horizontal, 8)
                                                      .padding(.vertical, 4)
                                                      .background(Capsule().fill(Color.xcodeBlue.opacity(0.1)))
                                                      .foregroundColor(.xcodeBlue)
                                              }
                                              .buttonStyle(PlainButtonStyle())
                                          }
                                          .padding(10)
                                          .xcodeCard(radius: 10)
                                      }
                                  }
                                  .padding(.horizontal)
                              }

                              // معلومات التوقيع
                              VStack(alignment: .trailing, spacing: 8) {
                                  Text("معلومات التوقيع")
                                      .font(.system(size: 14, weight: .bold))
                                      .foregroundColor(.primary)
                                      .padding(.horizontal, 4)

                                  InfoRow(label: "الحالة", value: signer.isSigning ? "جاري التوقيع..." : "جاهز")
                                  if let err = signer.lastError {
                                      InfoRow(label: "آخر خطأ", value: err, color: .xcodeRed)
                                  }
                                  if let signed = signer.lastSignedPath {
                                      InfoRow(label: "آخر ملف موقّع", value: signed)
                                  }
                              }
                              .padding(12)
                              .xcodeCard(radius: 12)
                              .padding(.horizontal)

                              // إعدادات إضافية (ثلاث نقاط)
                              HStack {
                                  Spacer()
                                  Menu {
                                      Button(action: {}) {
                                          Label("إدارة الملفات", systemImage: "folder")
                                      }
                                      Button(action: {}) {
                                          Label("مسح الملفات المؤقتة", systemImage: "trash")
                                      }
                                      Button(action: {}) {
                                          Label("تصدير الشهادة", systemImage: "square.and.arrow.up")
                                      }
                                  } label: {
                                      Image(systemName: "ellipsis.circle.fill")
                                          .font(.system(size: 24))
                                          .foregroundColor(.xcodeBlue)
                                  }
                                  .padding(.horizontal, 20)
                                  Spacer()
                              }

                              Spacer()
                          }
                          .padding(.top, 8)
                          .padding(.bottom, 20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 6) {
                                  Image(systemName: "signature")
                                      .foregroundColor(.xcodeBlue)
                                  Text("التوقيع")
                                      .font(.system(size: 17, weight: .heavy))
                                      .foregroundColor(.primary)
                              }
                          }
                      }
                  }
                  .sheet(isPresented: $showCertImport) {
                      DocumentPicker(contentTypes: [UTType(filenameExtension: "p12") ?? .data, UTType(filenameExtension: "pfx") ?? .data],
                                     allowsMultiple: false) { urls in
                          showCertImport = false
                          guard let url = urls.first else { return }
                          Task {
                              _ = await certificateManager.importCertificate(from: url, password: p12Password.isEmpty ? nil : p12Password)
                              p12Password = ""
                          }
                      }
                  }
                  .sheet(isPresented: $showProvisionImport) {
                      DocumentPicker(contentTypes: [UTType(filenameExtension: "mobileprovision") ?? .data],
                                     allowsMultiple: false) { urls in
                          showProvisionImport = false
                          guard let url = urls.first else { return }
                          Task {
                              _ = await certificateManager.importCertificate(from: url)
                          }
                      }
                  }
                  .sheet(isPresented: $showIPAPicker) {
                      DocumentPicker(contentTypes: [UTType(filenameExtension: "ipa") ?? .archive],
                                     allowsMultiple: false) { urls in
                          showIPAPicker = false
                          guard let url = urls.first else { return }
                          // نسخ الـ IPA إلى المجلد المخصص للتوقيع
                          let fm = FileManager.default
                          let docs = (try? fm.url(for: .documentDirectory, in: .userDomainMask, appropriateFor: nil, create: true)) ?? fm.temporaryDirectory
                          let dest = docs.appendingPathComponent(AppConstants.downloadsDir).appendingPathComponent(url.lastPathComponent)
                          try? fm.removeItem(at: dest)
                          do {
                              try fm.copyItem(at: url, to: dest)
                              importedIPAPath = dest.path
                              // محاولة التوقيع فوراً باستخدام الشهادة الافتراضية
                              guard let cert = certificateManager.defaultCertificate else {
                                  signer.lastError = "لا توجد شهادة افتراضية"
                                  return
                              }
                              let provisionCert = certificateManager.certificates.first(where: { $0.type == .mobileprovision })
                              let provisionPath = provisionCert.map { certificateManager.certificateURL(for: $0).path }
                              let certPath = certificateManager.certificateURL(for: cert).path
                              signer.sign(ipaPath: dest.lastPathComponent,
                                          certPath: certPath,
                                          provisionPath: provisionPath,
                                          p12Password: cert.p12Password) { result in
                                  switch result {
                                  case .success(let signedName):
                                      signer.lastSignedPath = signedName
                                      HapticManager.shared.success()
                                  case .failure(let error):
                                      signer.lastError = error.localizedDescription
                                      HapticManager.shared.error()
                                  }
                              }
                          } catch {
                              signer.lastError = "فشل نسخ الـ IPA: \(error.localizedDescription)"
                          }
                      }
                  }
              }
          }

          struct ActionCard: View {
              let icon: String
              let title: String
              let description: String
              let color: Color
              let action: () -> Void

              var body: some View {
                  Button(action: action) {
                      HStack(spacing: 16) {
                          ZStack {
                              Circle()
                                  .fill(color.opacity(0.15))
                                  .frame(width: 48, height: 48)
                              Image(systemName: icon)
                                  .font(.system(size: 22))
                                  .foregroundColor(color)
                          }
                          VStack(alignment: .trailing, spacing: 4) {
                              Text(title)
                                  .font(.system(size: 15, weight: .bold))
                                  .foregroundColor(.primary)
                              Text(description)
                                  .font(.system(size: 12))
                                  .foregroundColor(.xcodeSecondary)
                                  .multilineTextAlignment(.trailing)
                          }
                          Spacer()
                          Image(systemName: "chevron.left")
                              .font(.system(size: 14, weight: .medium))
                              .foregroundColor(.xcodeSecondary)
                      }
                      .padding(14)
                      .xcodeCard(radius: 14)
                  }
                  .buttonStyle(PlainButtonStyle())
                  .padding(.horizontal)
              }
          }

          struct InfoRow: View {
              let label: String
              let value: String
              var color: Color = .primary
              var body: some View {
                  HStack {
                      Text(label)
                          .font(.system(size: 11))
                          .foregroundColor(.xcodeSecondary)
                      Spacer()
                      Text(value)
                          .font(.system(size: 11, weight: .medium))
                          .foregroundColor(color)
                          .lineLimit(1)
                  }
                  .padding(.vertical, 3)
              }
          }
          VIPEOF

