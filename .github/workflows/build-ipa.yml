      - name: Generate code - GreenWave.swift (animated 3D emerald theme + new home ideas)
        run: |
          cat > GreenWave.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          // ============================================================
          // EMERALD 3D ANIMATED WAVE THEME + NEW HOME IDEAS
          // ============================================================

          // MARK: - Wave shape
          struct EmeraldWaveShape: Shape {
              var phase: CGFloat
              var amplitude: CGFloat = 18
              var frequency: CGFloat = 1.6
              var baseline: CGFloat = 0.55

              var animatableData: CGFloat {
                  get { phase }
                  set { phase = newValue }
              }

              func path(in rect: CGRect) -> Path {
                  var p = Path()
                  let midY = rect.height * baseline
                  p.move(to: CGPoint(x: 0, y: midY))
                  var x: CGFloat = 0
                  while x <= rect.width {
                      let rel = x / max(rect.width, 1)
                      let y = midY + sin((rel * frequency + phase) * .pi * 2) * amplitude
                      p.addLine(to: CGPoint(x: x, y: y))
                      x += 3
                  }
                  p.addLine(to: CGPoint(x: rect.width, y: rect.height))
                  p.addLine(to: CGPoint(x: 0, y: rect.height))
                  p.closeSubpath()
                  return p
              }
          }

          // MARK: - Animated wavy 3D background (used behind every tab)
          struct AnimatedWaveBackground: View {
              var height: CGFloat = 260
              @State private var phase: CGFloat = 0

              var body: some View {
                  ZStack(alignment: .top) {
                      LinearGradient(
                          gradient: Gradient(colors: [Color.creamBg, Color.storeBg]),
                          startPoint: .top, endPoint: .bottom)

                      ZStack(alignment: .top) {
                          EmeraldWaveShape(phase: phase, amplitude: 26, frequency: 1.2, baseline: 0.62)
                              .fill(LinearGradient(gradient: Gradient(colors: [Color.storePrimaryDk.opacity(0.30), Color.storePrimary.opacity(0.12)]),
                                                   startPoint: .topLeading, endPoint: .bottomTrailing))
                          EmeraldWaveShape(phase: phase + 0.35, amplitude: 20, frequency: 1.8, baseline: 0.70)
                              .fill(LinearGradient(gradient: Gradient(colors: [Color.storePrimary.opacity(0.35), Color.storeCyan.opacity(0.10)]),
                                                   startPoint: .leading, endPoint: .trailing))
                          EmeraldWaveShape(phase: phase + 0.72, amplitude: 14, frequency: 2.4, baseline: 0.78)
                              .fill(LinearGradient(gradient: Gradient(colors: [Color.storePink.opacity(0.45), Color.storeBlush.opacity(0.10)]),
                                                   startPoint: .topTrailing, endPoint: .bottomLeading))
                      }
                      .frame(height: height)
                      .blur(radius: 0.4)
                  }
                  .ignoresSafeArea()
                  .onAppear {
                      withAnimation(.linear(duration: 11).repeatForever(autoreverses: false)) {
                          phase = 1
                      }
                  }
              }
          }

          // MARK: - 3D glossy card modifier
          struct Emerald3DCard: ViewModifier {
              var radius: CGFloat = 24
              var depth: CGFloat = 14
              func body(content: Content) -> some View {
                  content
                      .background(
                          ZStack {
