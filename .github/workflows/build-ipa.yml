                                                  Label("お気に入りから削除", systemImage: "heart.slash")
                                              }
                                          }
                                      }
                                  }
                                  .padding(.horizontal, 20)
                                  .padding(.top, 10)
                                  .padding(.bottom, 24)
                              }
                          }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                      .navigationDestination(for: StoreAPIApp.self) { app in
                          AppDetailView(app: app)
                      }
                  }
                  .alert("すべてのお気に入りをクリアしますか？", isPresented: $confirmClear) {
                      Button("キャンセル", role: .cancel) {}
                      Button("クリア", role: .destructive) {
                          favs.clearAll()
                          HapticManager.shared.success()
                      }
                  } message: {
                      Text("\(favs.items.count) 件のお気に入りがすべて削除されます。アプリタブから再度追加できます。")
                  }
