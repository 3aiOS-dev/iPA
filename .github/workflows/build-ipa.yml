              <script>
                  // Initialize 3D Scene
                  const engine = new Anime3DEngine('canvas-container', 'cyberpunk');
                  const particles = new AnimeParticles(document.getElementById('particles'));

                  // Bridge to Swift
                  function updateStats(apps, size, newApps, categories) {
                      document.getElementById('stat-apps').innerText = apps;
                      document.getElementById('stat-size').innerText = size;
                      document.getElementById('stat-new').innerText = newApps;
                      document.getElementById('stat-cats').innerText = categories;
                  }

                  function renderApps(appsJson) {
                      const apps = JSON.parse(appsJson);
                      const list = document.getElementById('app-list');
                      list.innerHTML = apps.map(app => `
                          <div class="app-item" onclick="window.webkit.messageHandlers.appTap.postMessage('${app.id}')">
                              <div class="app-icon">${app.name.charAt(0)}</div>
                              <div class="app-info">
                                  <div class="app-name">${app.name}
                                      ${app.isNew ? '<span class="badge badge-new">NEW</span>' : ''}
                                      <span class="badge badge-pro">PRO</span>
                                  </div>
                                  <div class="app-meta">${app.version} • ${app.size}</div>
                              </div>
                              <button class="download-btn" onclick="event.stopPropagation(); window.webkit.messageHandlers.download.postMessage('${app.id}')">تحميل</button>
                          </div>
                      `).join('');
                  }

                  // Animation counters
                  function animateValue(id, start, end, duration) {
                      const obj = document.getElementById(id);
                      let startTime = null;
                      function step(timestamp) {
                          if (!startTime) startTime = timestamp;
                          const progress = Math.min((timestamp - startTime) / duration, 1);
                          obj.innerHTML = Math.floor(progress * (end - start) + start);
                          if (progress < 1) window.requestAnimationFrame(step);
                      }
                      window.requestAnimationFrame(step);
                  }
              </script>
          </body>
