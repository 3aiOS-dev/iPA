                                  ErrorView(message: err) { appsManager.retryFetch() }
                              } else {
                                  HStack(spacing: 12) {
                                      ZStack {
                                          RoundedRectangle(cornerRadius: 12)
                                              .fill(Color.xcodeBlue.opacity(0.15))
