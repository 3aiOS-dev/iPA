          VIPEOF

      - name: Generate code - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  UINotificationFeedbackGenerator().notificationOccurred(type)
              }
              func selection() { UISelectionFeedbackGenerator().selectionChanged() }
              func success() { notification(.success) }
              func error() { notification(.error) }
          }

          struct XcodeCardModifier: ViewModifier {
              var radius: CGFloat = 12
              func body(content: Content) -> some View {
                  content
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(Color.storeCard)
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(Color.storeDivider, lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
              }
          }

          extension View {
              func xcodeCard(radius: CGFloat = 12) -> some View {
                  modifier(XcodeCardModifier(radius: radius))
              }
          }
          VIPEOF

      - name: Generate code - Models.swift (store models only, with convenience init)
        run: |
          cat > Models.swift << 'VIPEOF'
          import Foundation

          // ==================== Remote Store API models ====================
          struct StoreAPIResponse: Codable {
              let lastUpdated: String?
              let apps: [StoreAPIApp]

              enum CodingKeys: String, CodingKey {
                  case lastUpdated = "last_updated"
                  case apps
              }

              // Convenience initializer for building the object manually
              init(lastUpdated: String?, apps: [StoreAPIApp]) {
                  self.lastUpdated = lastUpdated
                  self.apps = apps
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.lastUpdated = try? c.decode(String.self, forKey: .lastUpdated)
                  if let arr = try? c.decode([StoreAPIApp].self, forKey: .apps) {
                      self.apps = arr
                      return
                  }
                  struct Envelope: Codable {
                      let success: Bool?
                      let count: Int?
                      let apps: [StoreAPIApp]
                  }
                  if let env = try? c.decode(Envelope.self, forKey: .apps) {
                      self.apps = env.apps
                      return
                  }
                  if let one = try? c.decode(StoreAPIApp.self, forKey: .apps) {
                      self.apps = [one]
                      return
                  }
                  self.apps = []
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encodeIfPresent(lastUpdated, forKey: .lastUpdated)
                  try c.encode(apps, forKey: .apps)
              }
          }

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let bundleVersion: String?
              let ipaSize: String?
              let githubUrl: String?
              let archiveUrl: String?
              let ipaUrl: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let createdAt: String?
              let updatedAt: String?

              let downloadURL: String?
              let down: String?
              let iconURL: String?
              let localizedDescription: String?
              let developerName: String?
              let version: String?
              let versionDate: String?
              let fullDate: String?
              let size: Double?
              let type: Int?

              enum CodingKeys: String, CodingKey {
                  case id, name
                  case bundleId = "bundle_id"
                  case bundleIdAlt = "bundleID"
                  case bundleIdentifier
                  case bundleVersion = "bundle_version"
                  case ipaSize = "ipa_size"
                  case githubUrl = "github_url"
                  case archiveUrl = "archive_url"
                  case ipaUrl = "ipa_url"
                  case host
                  case icon
                  case iconURL
                  case description
                  case localizedDescription
                  case screenshots, category
                  case createdAt = "created_at"
                  case updatedAt = "updated_at"
                  case downloadURL
                  case down
                  case developerName
                  case version
                  case versionDate
                  case fullDate
                  case size, type
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  if let intId = try? c.decode(Int.self, forKey: .id) {
                      self.id = intId
                  } else {
                      let bundle = (try? c.decode(String.self, forKey: .bundleIdAlt))
                          ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                          ?? UUID().uuidString
                      self.id = abs(bundle.hashValue)
                  }
                  self.name = (try? c.decode(String.self, forKey: .name)) ?? "Untitled"
                  self.bundleId = (try? c.decode(String.self, forKey: .bundleId))
                      ?? (try? c.decode(String.self, forKey: .bundleIdAlt))
                      ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                  self.bundleVersion = (try? c.decode(String.self, forKey: .bundleVersion))
                      ?? (try? c.decode(String.self, forKey: .version))
                  self.ipaSize = (try? c.decode(String.self, forKey: .ipaSize))
                  self.githubUrl = (try? c.decode(String.self, forKey: .githubUrl))
                  self.archiveUrl = (try? c.decode(String.self, forKey: .archiveUrl))
                  self.ipaUrl = (try? c.decode(String.self, forKey: .ipaUrl))
                      ?? (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.host = (try? c.decode(String.self, forKey: .host))
                  self.icon = (try? c.decode(String.self, forKey: .icon))
                      ?? (try? c.decode(String.self, forKey: .iconURL))
                  self.description = (try? c.decode(String.self, forKey: .description))
                      ?? (try? c.decode(String.self, forKey: .localizedDescription))
                  self.screenshots = try? c.decode([String].self, forKey: .screenshots)
                  self.category = (try? c.decode(String.self, forKey: .category))
                  self.createdAt = (try? c.decode(String.self, forKey: .createdAt))
                  self.updatedAt = (try? c.decode(String.self, forKey: .updatedAt))
                      ?? (try? c.decode(String.self, forKey: .versionDate))
                      ?? (try? c.decode(String.self, forKey: .fullDate))
                  self.downloadURL = (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.down = (try? c.decode(String.self, forKey: .down))
                  self.iconURL = (try? c.decode(String.self, forKey: .iconURL))
                  self.localizedDescription = (try? c.decode(String.self, forKey: .localizedDescription))
                  self.developerName = (try? c.decode(String.self, forKey: .developerName))
                  self.version = (try? c.decode(String.self, forKey: .version))
                  self.versionDate = (try? c.decode(String.self, forKey: .versionDate))
                  self.fullDate = (try? c.decode(String.self, forKey: .fullDate))
                  self.size = (try? c.decode(Double.self, forKey: .size))
                  self.type = (try? c.decode(Int.self, forKey: .type))
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encode(id, forKey: .id)
                  try c.encode(name, forKey: .name)
                  try c.encodeIfPresent(bundleId, forKey: .bundleId)
                  try c.encodeIfPresent(bundleVersion, forKey: .bundleVersion)
                  try c.encodeIfPresent(ipaSize, forKey: .ipaSize)
                  try c.encodeIfPresent(githubUrl, forKey: .githubUrl)
                  try c.encodeIfPresent(archiveUrl, forKey: .archiveUrl)
                  try c.encodeIfPresent(ipaUrl, forKey: .ipaUrl)
                  try c.encodeIfPresent(host, forKey: .host)
                  try c.encodeIfPresent(icon, forKey: .icon)
                  try c.encodeIfPresent(description, forKey: .description)
                  try c.encodeIfPresent(screenshots, forKey: .screenshots)
                  try c.encodeIfPresent(category, forKey: .category)
                  try c.encodeIfPresent(createdAt, forKey: .createdAt)
                  try c.encodeIfPresent(updatedAt, forKey: .updatedAt)
              }

              var cleanSize: String {
                  if let s = size, s > 0 {
                      let f = ByteCountFormatter()
                      f.allowedUnits = [.useMB, .useGB, .useKB]
                      f.countStyle = .file
                      return f.string(fromByteCount: Int64(s))
                  }
                  if let s = ipaSize, !s.isEmpty { return s }
                  return "-"
              }

              var cleanDescription: String {
                  let raw = description ?? localizedDescription ?? ""
                  if raw.isEmpty {
                      return "Exclusive app on ONEs Store - download the premium version with all features enabled."
                  }
                  let lines = raw.split(whereSeparator: { $0.isNewline || $0 == "\r" })
                  return lines.joined(separator: " ").trimmingCharacters(in: .whitespacesAndNewlines)
              }

              var resolvedDownloadURL: String? {
                  return ipaUrl ?? downloadURL ?? down ?? githubUrl ?? archiveUrl
              }

              // Helper: determine if app was added/updated within last 24h
              func isRecent(now: Date = Date()) -> Bool {
                  guard let raw = createdAt ?? updatedAt ?? versionDate ?? fullDate else { return false }
                  let parser = ISO8601DateFormatter()
                  parser.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                  var date = parser.date(from: raw)
                  if date == nil {
                      let f = DateFormatter()
                      f.locale = Locale(identifier: "en_US_POSIX")
                      f.timeZone = TimeZone(secondsFromGMT: 0)
                      for fmt in ["yyyy-MM-dd'T'HH:mm:ssZ", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"] {
                          f.dateFormat = fmt
                          if let d = f.date(from: raw) {
                              date = d
                              break
                          }
                      }
                  }
                  guard let d = date else { return false }
                  return now.timeIntervalSince(d) <= 24 * 60 * 60
              }
          }
          VIPEOF

      - name: Generate code - FavoritesStore.swift
        run: |
          cat > FavoritesStore.swift << 'FAVEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class FavoritesStore: ObservableObject {
              static let shared = FavoritesStore()

              @Published private(set) var items: [StoreAPIApp] = []

              private let key = "favorites.v1"
              private let d = UserDefaults.standard

              private init() { load() }

              private func load() {
                  guard let data = d.data(forKey: key),
                        let decoded = try? JSONDecoder().decode([StoreAPIApp].self, from: data) else {
                      return
                  }
                  items = decoded
              }

              private func save() {
                  if let data = try? JSONEncoder().encode(items) {
                      d.set(data, forKey: key)
                  }
              }

              func contains(_ app: StoreAPIApp) -> Bool {
                  items.contains(where: { $0.id == app.id })
              }

              func toggle(_ app: StoreAPIApp) {
                  if contains(app) {
                      items.removeAll { $0.id == app.id }
                      HapticManager.shared.impact(.light)
                  } else {
                      items.insert(app, at: 0)
                      HapticManager.shared.success()
                  }
                  save()
              }

              func add(_ app: StoreAPIApp) {
                  if contains(app) { return }
                  items.insert(app, at: 0)
                  save()
              }

              func remove(_ app: StoreAPIApp) {
                  items.removeAll { $0.id == app.id }
                  save()
              }

              func clearAll() {
                  items.removeAll()
                  save()
              }
          }

          struct FavoriteButton: View {
              let app: StoreAPIApp
              var size: CGFloat = 40
              @ObservedObject private var store = FavoritesStore.shared

              var body: some View {
                  let isFav = store.contains(app)
                  Button {
                      store.toggle(app)
                  } label: {
                      Image(systemName: isFav ? "heart.fill" : "heart")
                          .font(.system(size: size * 0.45, weight: .bold))
                          .foregroundColor(isFav ? .white : Color.storePink)
                          .frame(width: size, height: size)
                          .background(
                              Circle()
                                  .fill(isFav
                                        ? LinearGradient(colors: [Color.storePink, Color.storePrimary],
                                                         startPoint: .topLeading, endPoint: .bottomTrailing)
                                        : LinearGradient(colors: [Color.white], startPoint: .top, endPoint: .bottom))
                          )
                          .overlay(
                              Circle()
                                  .stroke(isFav ? Color.clear : Color.storeDivider, lineWidth: 1)
                          )
                          .shadow(color: isFav ? Color.storePink.opacity(0.35) : Color.black.opacity(0.06),
                                  radius: isFav ? 8 : 4, y: 2)
                  }
                  .buttonStyle(.plain)
                  .animation(.spring(response: 0.3, dampingFraction: 0.6), value: isFav)
              }
          }
          FAVEOF

      - name: Generate code - StoreUtilities.swift
        run: |
          cat > StoreUtilities.swift << 'UTILEOF'
          import SwiftUI
          import UIKit

          // MARK: - Image cache
          @MainActor
          final class RemoteIconCache: ObservableObject {
              static let shared = RemoteIconCache()
              @Published private(set) var cache: [String: UIImage] = [:]
              private let memCache: NSCache<NSString, UIImage> = {
                  let c = NSCache<NSString, UIImage>()
                  c.totalCostLimit = AppConstants.maxIconCacheBytes
                  c.countLimit = 20_000
                  return c
              }()
              private let session: URLSession
              private let diskDir: URL
              private let diskIndexKey = "apptesters-icon-disk-index"
              private var diskIndex: [String: String] = [:]
              private let inflightQueue = DispatchQueue(label: "com.21s.iconcache.inflight")
              private var inflightSet: Set<String> = [:]

              init() {
                  let cfg = URLSessionConfiguration.default
                  cfg.requestCachePolicy = .returnCacheDataElseLoad
                  cfg.urlCache = URLCache(
                      memoryCapacity: 64 * 1024 * 1024,
                      diskCapacity: AppConstants.maxIconCacheBytes,
                      diskPath: "icons-v2"
                  )
                  cfg.httpMaximumConnectionsPerHost = 16
                  cfg.timeoutIntervalForRequest = 10
                  cfg.timeoutIntervalForResource = 30
                  self.session = URLSession(configuration: cfg)

                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  let dir = caches.appendingPathComponent("apptesters-icons-v2", isDirectory: true)
                  try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  self.diskDir = dir
                  if let data = UserDefaults.standard.data(forKey: diskIndexKey),
                     let map = try? JSONDecoder().decode([String: String].self, from: data) {
                      self.diskIndex = map
                  }
              }

              func image(for urlString: String?) -> UIImage? {
                  guard let s = urlString, !s.isEmpty, let url = URL(string: s) else { return nil }
                  if let hit = cache[s] { return hit }
                  if let hit = memCache.object(forKey: s as NSString) {
                      cache[s] = hit
                      return hit
                  }

                  let name = Self.sanitize(s)
                  let path = diskDir.appendingPathComponent(name)
                  if let data = try? Data(contentsOf: path), let img = UIImage(data: data) {
                      memCache.setObject(img, forKey: s as NSString, cost: data.count)
                      cache[s] = img
                      return img
                  }

                  var already = false
                  inflightQueue.sync { already = inflightSet.contains(s); if !already { inflightSet.insert(s) } }
                  if !already {
                      Task { [weak self] in
                          await self?.fetch(urlString: s, url: url, name: name)
                      }
                  }
                  return nil
              }

              private func fetch(urlString: String, url: URL, name: String) async {
                  defer {
                      _ = inflightQueue.sync { inflightSet.remove(urlString) }
                  }
                  do {
                      let (data, _) = try await session.data(from: url)
                      guard let img = UIImage(data: data) else { return }
                      memCache.setObject(img, forKey: urlString as NSString, cost: data.count)
                      cache[urlString] = img
                      let path = diskDir.appendingPathComponent(name)
                      try? data.write(to: path, options: .atomic)
                      diskIndex[urlString] = name
                      if let data = try? JSONEncoder().encode(diskIndex) {
                          UserDefaults.standard.set(data, forKey: diskIndexKey)
                      }
                  } catch {
                  }
              }

              func purgeMemory() {
                  memCache.removeAllObjects()
                  cache.removeAll(keepingCapacity: true)
              }

              private static func sanitize(_ s: String) -> String {
                  let cleaned = s
                      .replacingOccurrences(of: "https://", with: "")
                      .replacingOccurrences(of: "http://", with: "")
                      .replacingOccurrences(of: "/", with: "_")
                      .replacingOccurrences(of: ":", with: "_")
                      .replacingOccurrences(of: "?", with: "_")
                      .replacingOccurrences(of: "&", with: "_")
                  return String(cleaned.prefix(160))
              }
          }

          struct RemoteIcon: View {
              let url: String?
              var size: CGFloat = 56
              var cornerRadius: CGFloat = 14
              @ObservedObject private var cache = RemoteIconCache.shared

              var body: some View {
                  Group {
                      if let img = cache.image(for: url) {
                          Image(uiImage: img)
                              .resizable()
                              .aspectRatio(contentMode: .fill)
                      } else {
                          RoundedRectangle(cornerRadius: cornerRadius)
                              .fill(Color.storeDivider)
                              .overlay(
                                  Image(systemName: "app.fill")
                                      .font(.system(size: size * 0.45, weight: .bold))
                                      .foregroundColor(.storeSub)
                              )
                      }
                  }
                  .frame(width: size, height: size)
                  .clipShape(RoundedRectangle(cornerRadius: cornerRadius))
              }
          }

          func colorForCategory(_ category: String?) -> Color {
              guard let c = category?.lowercased() else { return .storePrimary }
              if c.contains("photo") || c.contains("camera") { return .storePink }
              if c.contains("music") { return Color(red: 0.11, green: 0.72, blue: 0.36) }
              if c.contains("video") || c.contains("stream") { return .storePink }
              if c.contains("social") || c.contains("messag") { return .storeCyan }
              if c.contains("tool") || c.contains("util") { return .storeYellow }
              if c.contains("game") { return .storePrimary }
              if c.contains("book") || c.contains("edu") { return .storeYellow }
              if c.contains("shop") { return .storePink }
              return .storePrimary
          }
