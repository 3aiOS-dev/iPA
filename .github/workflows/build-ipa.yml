          struct AdImageCarousel: View {
              let images: [(image: String, link: String)]
              @State private var current: Int = 0
              private let timer = Timer.publish(every: 5, on: .main, in: .common).autoconnect()
              var body: some View {
                  VStack(spacing: 8) {
                      TabView(selection: $current) {
                          ForEach(Array(images.enumerated()), id: \.offset) { idx, item in
                              CachedAsyncImage(url: URL(string: item.image)) { phase in
                                  switch phase {
                                  case .success(let img):
                                      img.resizable().aspectRatio(contentMode: .fill)
                                  default:
                                      ZStack {
                                          Color.xcodeBlue.opacity(0.1)
                                          ProgressView().tint(.xcodeBlue)
                                      }
                                  }
                              }
                              .frame(maxWidth: .infinity)
                              .frame(height: 85)
                              .clipped()
                              .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))
                              .overlay(
                                  RoundedRectangle(cornerRadius: 12, style: .continuous)
                                      .stroke(Color.xcodeBlue.opacity(0.1), lineWidth: 0.5)
                              )
                              .contentShape(Rectangle())
                              .onTapGesture {
                                  HapticManager.shared.impact(.light)
                                  if let u = URL(string: item.link) { UIApplication.shared.open(u) }
                              }
                              .tag(idx)
                          }
                      }
                      .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))
                      .frame(height: 95)
                      .onReceive(timer) { _ in
                          withAnimation(.easeInOut(duration: 0.5)) {
                              current = (current + 1) % max(images.count, 1)
                          }
                      }
                      HStack(spacing: 5) {
                          ForEach(0..<images.count, id: \.self) { idx in
                              Capsule()
                                  .fill(idx == current ? Color.xcodeBlue : Color.gray.opacity(0.3))
                                  .frame(width: idx == current ? 16 : 5, height: 5)
                                  .animation(.spring(response: 0.3), value: current)
                          }
                      }
                  }
                  .padding(.horizontal, 16)
              }
          }

          struct FeaturedAppCard: View {
