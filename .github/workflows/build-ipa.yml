          const crypto = require('crypto');
          
          /**
           * Generate a numeric verification code with the requested length.
           * Uses crypto.randomInt for unbiased distribution.
           */
          function generateCode(length = 6) {
            const min = Math.pow(10, length - 1);
            const max = Math.pow(10, length) - 1;
            return String(crypto.randomInt(min, max + 1));
          }
          
          /**
           * Generate a unique referral code (alphanumeric, uppercase, 8 chars).
           */
          function generateRefCode() {
            const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            const bytes = crypto.randomBytes(8);
            let out = '';
            for (let i = 0; i < 8; i++) out += alphabet[bytes[i] % alphabet.length];
            return out;
          }
          
          function hashToken(token) {
            return crypto.createHash('sha256').update(token).digest('hex');
          }
          
          module.exports = { generateCode, generateRefCode, hashToken };
          
          EOFBOT_UTILS_CODE_JS
          
