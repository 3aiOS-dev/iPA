              static let xcodeBackground = Color(red: 0.97, green: 0.97, blue: 0.99)
              static let xcodeEditor     = Color(red: 0.95, green: 0.96, blue: 0.99)
              static let xcodeBlue       = Color(red: 0.11, green: 0.17, blue: 0.30)
              static let xcodeAccent     = Color(red: 0.30, green: 0.43, blue: 0.58)
              static let xcodeGreen      = Color(red: 0.20, green: 0.65, blue: 0.40)
              static let xcodeOrange     = Color(red: 0.90, green: 0.55, blue: 0.20)
              static let xcodeRed        = Color(red: 0.85, green: 0.28, blue: 0.25)
              static let xcodeSecondary  = Color(red: 0.45, green: 0.48, blue: 0.55)
              static let xcodeDivider    = Color(red: 0.86, green: 0.88, blue: 0.92)

              // Store brand colors
              static let storePrimary    = Color(red: 0.24, green: 0.36, blue: 0.98)
              static let storePrimaryDk  = Color(red: 0.18, green: 0.27, blue: 0.82)
              static let storePink       = Color(red: 0.96, green: 0.35, blue: 0.55)
              static let storeYellow     = Color(red: 0.99, green: 0.78, blue: 0.20)
              static let storeGreen      = Color(red: 0.20, green: 0.78, blue: 0.50)
              static let storePurple     = Color(red: 0.55, green: 0.35, blue: 0.95)
              static let storeBg         = Color(red: 0.98, green: 0.98, blue: 1.00)
              static let storeCard       = Color(red: 1.00, green: 1.00, blue: 1.00)
              static let storeText       = Color(red: 0.07, green: 0.10, blue: 0.18)
              static let storeSub        = Color(red: 0.45, green: 0.48, blue: 0.55)
