          // ================= FAVORITES =================
          struct FavoritesView: View {
              @ObservedObject private var favs = FavoritesStore.shared
              @ObservedObject private var feed: StoreFeed
              var onMenu: (() -> Void)? = nil

              @State private var confirmClear: Bool = false
              @State private var searchText: String = ""

              init(feed: StoreFeed,
                   onMenu: (() -> Void)? = nil) {
                  self.feed = feed
                  self.onMenu = onMenu
              }

              private var filteredFavs: [StoreAPIApp] {
                  let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return favs.items }
                  return favs.items.filter {
                      $0.name.lowercased().contains(q) ||
                      ($0.bundleId?.lowercased().contains(q) ?? false) ||
                      ($0.category?.lowercased().contains(q) ?? false)
                  }
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          StoreHeader(
                              title: "المفضلة",
                              onRefresh: nil,
                              onMenu: { onMenu?() }
                          )

                          HStack(spacing: 10) {
                              HStack(spacing: 8) {
                                  Image(systemName: "magnifyingglass")
                                      .foregroundColor(.storeSub)
                                  TextField("ابحث في المفضلة...", text: $searchText)
                                      .font(.system(size: 14))
                                  if !searchText.isEmpty {
                                      Button { searchText = "" } label: {
                                          Image(systemName: "xmark.circle.fill")
                                              .foregroundColor(.storeSub)
                                      }
                                  }
                              }
                              .padding(.horizontal, 14)
                              .frame(height: 44)
                              .background(RoundedRectangle(cornerRadius: 12).fill(Color.storeCard))
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 6)

                          HStack {
                              Text("\(favs.items.count) عنصر محفوظ")
                                  .font(.system(size: 11, weight: .semibold))
                                  .foregroundColor(.storeSub)
                              Spacer()
                              if !favs.items.isEmpty {
                                  Button {
                                      HapticManager.shared.impact(.light)
                                      confirmClear = true
                                  } label: {
                                      Text("حذف الكل")
                                          .font(.system(size: 11, weight: .bold))
                                          .foregroundColor(.storePink)
                                          .padding(.horizontal, 10).padding(.vertical, 4)
                                          .background(Capsule().fill(Color.storePink.opacity(0.12)))
                                  }
                              }
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 6)

                          if favs.items.isEmpty {
                              emptyState
                          } else if filteredFavs.isEmpty {
                              EmptyState(message: "لا توجد مفضلة تطابق «\(searchText)»")
                          } else {
                              ScrollView(showsIndicators: false) {
                                  LazyVStack(spacing: 10) {
                                      ForEach(filteredFavs) { app in
                                          NavigationLink(value: app) {
                                              AppListRow(app: app)
