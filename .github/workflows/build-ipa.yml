name: Build WebWrapper IPA - True Fullscreen Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "No Xcode installation was found."
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen and zip
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          command -v xcodegen
          command -v zip

      - name: Create project directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppScopeBuild
          mkdir -p AppScopeBuild/AppScope/Base.lproj

      - name: Generate LaunchScreen Storyboard (Fixes Black Letterbox Borders)
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/Base.lproj/LaunchScreen.storyboard <<'STORYBOARD'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21507" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                          <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                              <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                              <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                              <color key="backgroundColor" systemColor="systemBackgroundColor"/>
                              <viewLayoutGuide key="safeArea" id="6Tk-OE-BBY"/>
                          </view>
                      </viewController>
                  </scene>
              </scenes>
              <resources>
                  <systemColor name="systemBackgroundColor">
                      <color white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                  </systemColor>
              </resources>
          </document>
          STORYBOARD

      - name: Generate Info.plist
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>AppScope</string>

              <key>CFBundleIdentifier</key>
              <string>com.appscope.webwrapper</string>

              <key>CFBundleName</key>
              <string>AppScope</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>UIStatusBarHidden</key>
              <true/>

              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>

              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Generate Swift source - AppScopeApp.swift
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/AppScopeApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct AppScopeApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT

      - name: Generate Swift source - ContentView.swift (Full Screen WebView)
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/ContentView.swift <<'SWIFT'
          import SwiftUI
          import WebKit

          struct ContentView: View {
              // 🔴 ضع رابط موقعك الأصلي هنا
              let targetURL = URL(string: "https://app.iosgods.com/store/")!

              var body: some View {
                  NativeWebView(url: targetURL)
                      .edgesIgnoringSafeArea(.all)
                      .ignoresSafeArea()
                      .onAppear {
                          UIApplication.shared.isIdleTimerDisabled = true
                      }
              }
          }

          struct NativeWebView: UIViewRepresentable {
              let url: URL

              func makeUIView(context: Context) -> WKWebView {
                  // حقن CSS/JS تلقائياً لإجبار الموقع على ملء الشاشة بدون هوامش
                  let jsScript = """
                  var meta = document.createElement('meta');
                  meta.name = 'viewport';
                  meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
                  document.getElementsByTagName('head')[0].appendChild(meta);

                  var style = document.createElement('style');
                  style.innerHTML = 'html, body { width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; overflow-x: hidden; }';
                  document.head.appendChild(style);
                  """
                  let userScript = WKUserScript(source: jsScript, injectionTime: .atDocumentEnd, forMainFrameOnly: true)

                  let config = WKWebViewConfiguration()
                  config.userContentController.addUserScript(userScript)
                  config.allowsInlineMediaPlayback = true

                  let preferences = WKWebpagePreferences()
                  preferences.allowsContentJavaScript = true
                  config.defaultWebpagePreferences = preferences

                  let webView = WKWebView(frame: .zero, configuration: config)

                  // إلغاء حدود الأمان العلوية والسفلية داخل المتصفح
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.bounces = false
                  webView.scrollView.showsVerticalScrollIndicator = false
                  webView.scrollView.showsHorizontalScrollIndicator = false
                  webView.isOpaque = false
                  webView.backgroundColor = .clear

                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]

                  return webView
              }

              func updateUIView(_ webView: WKWebView, context: Context) {
                  if webView.url == nil {
                      let request = URLRequest(url: url, cachePolicy: .useProtocolCachePolicy)
                      webView.load(request)
                  }
              }
          }
          SWIFT

      - name: Generate XcodeGen project.yml
        shell: bash
        run: |
          cat > AppScopeBuild/project.yml <<'YAML'
          name: AppScope

          options:
            minimumXcodeGenVersion: "2.40.0"
            deploymentTarget:
              iOS: "15.0"
            createIntermediateGroups: true
            groupSortPosition: top

          settings:
            base:
              SWIFT_VERSION: "6.0"
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"
              DEVELOPMENT_TEAM: ""
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""
              PRODUCT_BUNDLE_IDENTIFIER: "com.appscope.webwrapper"
              MARKETING_VERSION: "1.0"
              CURRENT_PROJECT_VERSION: "1"
              TARGETED_DEVICE_FAMILY: "1,2"

          targets:
            AppScope:
              type: application
              platform: iOS
              sources:
                - path: AppScope
              info:
                path: AppScope/Info.plist
              settings:
                base:
                  PRODUCT_NAME: "AppScope"
                  INFOPLIST_FILE: "AppScope/Info.plist"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
          YAML

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild
          xcodegen generate
          test -f AppScope.xcodeproj/project.pbxproj

      - name: Validate Swift sources
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild
          swiftc \
            -parse \
            AppScope/AppScopeApp.swift \
            AppScope/ContentView.swift

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild

          xcodebuild \
            -project AppScope.xcodeproj \
            -scheme AppScope \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AppScope.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/AppScope.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/AppScope.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle was not found!"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/AppScope.app"

          cd "$RUNNER_TEMP"
          rm -f AppScope-unsigned.ipa
          /usr/bin/zip -qry AppScope-unsigned.ipa Payload

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp AppScope-unsigned.ipa "$GITHUB_WORKSPACE/artifacts/AppScope-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppScope-unsigned-ipa
          path: artifacts/AppScope-unsigned.ipa
          if-no-files-found: error
