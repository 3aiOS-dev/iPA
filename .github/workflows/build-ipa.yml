      - name: Generate code - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import BackgroundTasks
          import UserNotifications

          @main
          struct VIP21StoreApp: App {
              static let refreshTaskID = "com.21s.store.refresh"

              init() {
                  UNUserNotificationCenter.current().delegate = ForegroundNotificationDelegate.shared
                  NotificationsManager.shared.requestAuthorization()
                  VIP21StoreApp.registerBackgroundTask()
                  VIP21StoreApp.scheduleAppRefresh()
                  applyDarkAppearance()
              }

              static func registerBackgroundTask() {
                  BGTaskScheduler.shared.register(forTaskWithIdentifier: refreshTaskID, using: nil) { task in
                      guard let refresh = task as? BGAppRefreshTask else { task.setTaskCompleted(success: false); return }
                      handleAppRefresh(task: refresh)
                  }
              }

              static func scheduleAppRefresh() {
                  let request = BGAppRefreshTaskRequest(identifier: refreshTaskID)
                  request.earliestBeginDate = Date(timeIntervalSinceNow: 15 * 60)
                  do { try BGTaskScheduler.shared.submit(request) } catch {}
              }

              private static func handleAppRefresh(task: BGAppRefreshTask) {
                  scheduleAppRefresh()
                  let workItem = Task.detached(priority: .background) {
                      await CatalogRefresher.shared.refreshAndNotify()
                      await MainActor.run { task.setTaskCompleted(success: true) }
                  }
                  task.expirationHandler = {
                      workItem.cancel()
                      task.setTaskCompleted(success: false)
                  }
              }

              static func applyDarkAppearance() {
                  let bg = UIColor(red: 0.043, green: 0.043, blue: 0.051, alpha: 1)
                  let card = UIColor(red: 0.106, green: 0.106, blue: 0.118, alpha: 1)
                  let nav = UINavigationBarAppearance()
                  nav.configureWithOpaqueBackground()
                  nav.backgroundColor = bg
                  nav.shadowColor = .clear
                  nav.titleTextAttributes = [.foregroundColor: UIColor.white]
                  nav.largeTitleTextAttributes = [.foregroundColor: UIColor.white]
                  UINavigationBar.appearance().standardAppearance = nav
                  UINavigationBar.appearance().compactAppearance = nav
                  UINavigationBar.appearance().scrollEdgeAppearance = nav
                  UINavigationBar.appearance().tintColor = .white
                  let tab = UITabBarAppearance()
                  tab.configureWithOpaqueBackground()
                  tab.backgroundColor = card
                  UITabBar.appearance().standardAppearance = tab
                  if #available(iOS 15.0, *) { UITabBar.appearance().scrollEdgeAppearance = tab }
                  UITableView.appearance().backgroundColor = bg
                  UITableViewCell.appearance().backgroundColor = card
                  UICollectionView.appearance().backgroundColor = bg
                  UIScrollView.appearance().backgroundColor = bg
                  UITextField.appearance().keyboardAppearance = .dark
                  UITextView.appearance().backgroundColor = .clear
                  if let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene {
                      scene.windows.forEach { $0.overrideUserInterfaceStyle = .dark }
                  }
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                          .background(Color.storeBg.ignoresSafeArea())
                  }
              }
          }

          // Catalog refresher for background
          @MainActor
          final class CatalogRefresher: ObservableObject {
              static let shared = CatalogRefresher()
              private let snapshotKey = "store_catalog_snapshot_v1"
              private init() {}

              func refreshAndNotify() async {
                  let repos = RepositoriesStore.shared.repositories.filter { $0.enabled }
                  guard !repos.isEmpty else { return }
                  var combined: [StoreAPIApp] = []
                  var seen = Set<String>()
                  await withTaskGroup(of: StoreAPIResponse?.self) { group in
                      for repo in repos {
                          group.addTask {
                              guard let url = URL(string: repo.feedURL) else { return nil }
                              do {
                                  var req = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 20)
                                  req.setValue("21s-iOS/1.0", forHTTPHeaderField: "User-Agent")
                                  let (data, response) = try await URLSession.shared.data(for: req)
                                  if let http = response as? HTTPURLResponse, !(200...299).contains(http.statusCode) { return nil }
                                  return try? JSONDecoder().decode(StoreAPIResponse.self, from: data)
                              } catch { return nil }
                          }
                      }
                      for await resp in group {
                          guard let resp = resp else { continue }
                          for app in resp.apps {
                              let key = app.bundleId?.lowercased() ?? "n_\(app.id)_\(app.name.lowercased())"
                              if !seen.contains(key) { seen.insert(key); combined.append(app) }
                          }
                      }
                  }
                  guard !combined.isEmpty else { return }
                  let prev = (UserDefaults.standard.dictionary(forKey: snapshotKey) as? [String: String]) ?? [:]
                  var next: [String: String] = [:]
                  for app in combined { next["\(app.id)"] = app.version ?? app.bundleVersion ?? "" }
                  if !prev.isEmpty {
                      var count = 0
                      for app in combined {
                          let key = "\(app.id)"
                          let cur = next[key] ?? ""
                          let old = prev[key] ?? ""
                          if old.isEmpty {
                              NotificationsManager.shared.pushAppEvent(name: app.name, iconURL: app.iconURL ?? app.icon,
                                                                       version: cur, isUpdate: false)
                              count += 1
                          } else if cur != old {
                              NotificationsManager.shared.pushAppEvent(name: app.name, iconURL: app.iconURL ?? app.icon,
                                                                       version: cur, isUpdate: true)
                              count += 1
                          }
                          if count >= 8 { break }
                      }
                  }
                  UserDefaults.standard.set(next, forKey: snapshotKey)
              }
          }
          VIPEOF

