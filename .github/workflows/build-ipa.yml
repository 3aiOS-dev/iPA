          MEOF

      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift AppModel.swift AppCell.swift StoreViewController.swift DetailViewController.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -o Souq

          file Souq

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/Souq.app

          cp Souq build-output/Payload/Souq.app/Souq
          cp Resources/Info.plist build-output/Payload/Souq.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/Souq.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/Souq.app/

          ldid -S build-output/Payload/Souq.app/Souq

          cd build-output
          zip -r -q ../artifacts/Souq.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/Souq.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Souq-IPA
          path: artifacts/Souq.ipa
          retention-days: 30
