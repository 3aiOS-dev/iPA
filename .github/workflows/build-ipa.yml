          // MARK: - Category Pills (only in Apps tab)
          struct CategoryPills: View {
              let categories: [String]
              @Binding var selected: String?

              private func tone(_ i: Int) -> Color {
                  [ThemePalette.primary, ThemePalette.accent, ThemePalette.cyan, Color(red: 0.15, green: 0.4, blue: 0.95)][i % 4]
              }

              var body: some View {
                  ScrollView(.horizontal, showsIndicators: false) {
                      HStack(spacing: 9) {
                          pill(label: "الكل", value: nil, color: ThemePalette.cardAlt)
                          ForEach(Array(categories.enumerated()), id: \.element) { i, c in
                              pill(label: c, value: c, color: tone(i))
                          }
                      }
                      .padding(.horizontal, 18)
                      .padding(.vertical, 4)
                  }
              }

              private func pill(label: String, value: String?, color: Color) -> some View {
                  let active = (value == nil && selected == nil) || (value != nil && selected == value)
                  return Button {
                      HapticManager.shared.selection()
                      withAnimation(.spring(response: 0.35, dampingFraction: 0.8)) { selected = value }
                  } label: {
                      HStack(spacing: 6) {
                          Text(label)
                              .font(.system(size: 12.5, weight: .heavy))
                              .foregroundColor(.white)
                          Image(systemName: "square.grid.2x2.fill")
                              .font(.system(size: 10, weight: .bold))
                              .foregroundColor(.white.opacity(0.9))
                      }
                      .padding(.horizontal, 15)
                      .padding(.vertical, 9)
                      .background(Capsule().fill(active ? color : ThemePalette.cardAlt))
                      .overlay(Capsule().stroke(active ? Color.white.opacity(0.25) : ThemePalette.divider, lineWidth: 1))
                      .shadow(color: active ? color.opacity(0.45) : .clear, radius: 10, y: 5)
                  }
                  .buttonStyle(.plain)
              }
          }

