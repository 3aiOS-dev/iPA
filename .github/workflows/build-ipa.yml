                                      .onTapGesture { selectedApp = app; showDetail = true }
                                      .padding(.horizontal)
                              }
                          }
                      }
                  }
                  .sheet(isPresented: $showDetail) {
                      if let app = selectedApp { AppDetailView(app: app, downloadManager: downloadManager) }
                  }
              }
          }
          
