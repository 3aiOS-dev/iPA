                                              .foregroundColor(.xcodeSecondary)
                                          Spacer()
                                          Text(userManager.deviceUDID)
                                              .font(.system(size: 11, weight: .medium))
                                              .foregroundColor(.xcodeBlue)
                                              .lineLimit(1)
                                              .truncationMode(.middle)
                                      }
                                      .padding(12)
                                      .xcodeCard(radius: 10)
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 10)
                                              .stroke(Color.xcodeBlue.opacity(0.1), lineWidth: 0.5)
                                      )
                                  } else {
                                      SecureField("Password", text: $password)
                                          .padding(12)
                                          .xcodeCard(radius: 10)
                                          .overlay(
                                              RoundedRectangle(cornerRadius: 10)
                                                  .stroke(Color.xcodeBlue.opacity(0.2), lineWidth: 0.5)
                                          )
                                  }
                              }
                              .padding(.horizontal, 20)

                              if showError {
                                  Text(errorMessage)
                                      .font(.system(size: 12))
                                      .foregroundColor(.xcodeRed)
                                      .padding(.horizontal, 20)
                              }

                              XcodeButton(
                                  title: isLogin ? "Log In" : "Sign Up",
                                  color: .xcodeBlue,
                                  action: handleAuth
                              )
                              .padding(.horizontal, 40)
                              .padding(.top, 8)

                              Button {
                                  withAnimation { isLogin.toggle() }
                              } label: {
                                  Text(isLogin ? "Don't have an account? Sign Up" : "Already have an account? Log In")
                                      .font(.system(size: 13))
                                      .foregroundColor(.xcodeBlue)
                              }
                              .padding(.top, 8)

                              Spacer()
                          }
                          .padding(.vertical, 40)
                      }
                  }
                  .onAppear {
                      // If already logged in, this view won't be shown
                  }
              }

              private func handleAuth() {
                  if isLogin {
                      if userManager.login(email: email, password: password) {
                          // success - will dismiss because userManager.isLoggedIn becomes true
                      } else {
                          showError = true
                          errorMessage = "Invalid email or password."
                      }
                  } else {
                      guard !email.isEmpty, !username.isEmpty, !password.isEmpty else {
                          showError = true
                          errorMessage = "All fields are required."
                          return
                      }
                      guard password == confirmPassword else {
                          showError = true
                          errorMessage = "Passwords do not match."
                          return
                      }
                      guard password.count >= 6 else {
                          showError = true
                          errorMessage = "Password must be at least 6 characters."
                          return
                      }
                      if userManager.register(email: email, username: username, password: password) {
                          // success
                      } else {
                          showError = true
                          errorMessage = "Registration failed. Please try again."
                      }
                  }
              }
          }
          VIPEOF

