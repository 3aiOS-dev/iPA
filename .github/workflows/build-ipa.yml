name: Build iOS IPA Complete

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
        xcode-select -p

    - name: Install Dependencies
      run: |
        brew install ldid dpkg xz wget curl git imagemagick

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

    - name: Download iOS SDK
      run: |
        export THEOS=$HOME/theos
        mkdir -p ~/theos/sdks
        cd ~/theos/sdks
        curl -L https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz -o iPhoneOS16.5.sdk.tar.xz
        tar -xJf iPhoneOS16.5.sdk.tar.xz
        rm iPhoneOS16.5.sdk.tar.xz

    - name: Create Build Directories
      run: |
        mkdir -p Resources artifacts

    - name: Create App Icon
      run: |
        convert -size 120x120 xc:FF3333 -fill white -pointsize 14 -gravity center -annotate +0+0 "Test" Resources/icon.png

    - name: Build Application
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        cd ${{ github.workspace }}
        make clean
        make

    - name: Copy Build Artifacts
      run: |
        cd ${{ github.workspace }}
        find .theos/obj/debug -name "*.deb" -exec cp {} artifacts/ \;
        find .theos/obj/debug -name "*.ipa" -exec cp {} artifacts/ \;
        find .theos/obj/debug -type d -name "*.app" -exec cp -r {} artifacts/ \;

    - name: Create IPA Package
      run: |
        cd ${{ github.workspace }}
        mkdir -p build-output/Payload/TestApp.app

        if [ -d ".theos/obj/debug/TestApp.app" ]; then
          cp -r .theos/obj/debug/TestApp.app/* build-output/Payload/TestApp.app/
        fi

        cd build-output
        zip -r -q ../artifacts/TestApp.ipa Payload/
        cd ..

    - name: Create DEB Package
      run: |
        cd ${{ github.workspace }}
        mkdir -p deb-temp/DEBIAN

        cat > deb-temp/DEBIAN/control << 'EOF'
        Package: com.example.testapp
        Name: Test App
        Version: 1.0.0
        Architecture: iphoneos-arm64
        Description: Simple iOS Test Application
        Maintainer: 3aiOS-dev
        Author: 3aiOS-dev
        Section: Utilities
        Depends: mobilesubstrate
        EOF

        cat > deb-temp/DEBIAN/postinst << 'EOF'
        #!/bin/bash
        echo "Test App installed successfully"
        exit 0
        EOF
        chmod 0755 deb-temp/DEBIAN/postinst

        cat > deb-temp/DEBIAN/postrm << 'EOF'
        #!/bin/bash
        echo "Test App removed"
        exit 0
        EOF
        chmod 0755 deb-temp/DEBIAN/postrm

        dpkg-deb -b deb-temp artifacts/TestApp.deb

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-App-Build
        path: artifacts/
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Build Complete"
        echo "=========================================="
        echo "Status: ${{ job.status }}"
        echo ""
        echo "Artifacts:"
        ls -lh artifacts/ 2>/dev/null || echo "No artifacts"
        echo "=========================================="
