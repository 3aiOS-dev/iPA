          }

          // MARK: - IPA Detail
          struct IPADetailView: View {
              let ipa: LocalIPA
              @ObservedObject var ipaManager: IPAManager
              let onShare: (URL) -> Void
              @Environment(\.dismiss) var dismiss
              @State private var recoverProgress: Double = 0
              @State private var recoverMessage: String = ""
              @State private var isRecovering = false
              @State private var extractedFiles: [ExtractedFile] = []
              @State private var showShare = false
              @State private var shareURL: URL? = nil
              @Environment(\.colorScheme) var scheme

              struct ExtractedFile: Identifiable {
                  let id = UUID()
                  let path: String
                  let size: Int64
                  var isDir: Bool { path.hasSuffix("/") }
                  var formattedSize: String {
                      ByteCountFormatter.string(fromByteCount: size, countStyle: .file)
                  }
                  var displayName: String {
                      let last = (path as NSString).lastPathComponent
                      return last.isEmpty ? path : last
                  }
              }

              var iconURL: URL? {
                  guard let app = ipa.extractedPath?.appendingPathComponent("Payload").appendingPathComponent(ipa.payloadAppName ?? "") else { return nil }
                  if let iconName = ipa.iconRelativePath, !iconName.isEmpty {
                      for c in ["@3x.png", "@2x.png", ".png"] {
                          let p = app.appendingPathComponent("\(iconName)\(c)")
                          if FileManager.default.fileExists(atPath: p.path) { return p }
                      }
                  }
                  return nil
              }

              var body: some View {
                  NavigationView {
                      ZStack(alignment: .bottom) {
                          (scheme == .dark ? Color.vipDark : Color(red: 0.96, green: 0.96, blue: 1.0)).ignoresSafeArea()
                          ScrollView {
                              VStack(spacing: 18) {
                                  header
                                  stats
                                  actionsRow
                                  filesSection
                                  if isRecovering { recoverProgressView }
                                  Color.clear.frame(height: 80)
                              }
                              .padding(.bottom, 40)
                          }
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              Text(ipa.displayName).font(.system(size: 16, weight: .bold))
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("إغلاق") { dismiss() }
                          }
                      }
                      .onAppear { loadExtractedFiles() }
                  }
                  .sheet(isPresented: $showShare) {
                      if let url = shareURL { ShareSheet(items: [url]) }
                  }
              }

              private var header: some View {
                  VStack(spacing: 12) {
                      ZStack {
                          RoundedRectangle(cornerRadius: 26)
                              .fill(LinearGradient(colors: [.vipPurple.opacity(0.85), .blue.opacity(0.75), .indigo.opacity(0.9)],
                                                   startPoint: .topLeading, endPoint: .bottomTrailing))
                              .frame(width: 130, height: 130)
                              .overlay(RoundedRectangle(cornerRadius: 26).stroke(Color.white.opacity(0.4), lineWidth: 2))
                              .shadow(color: .vipPurple.opacity(0.5), radius: 18, y: 8)
                          if let url = iconURL, let data = try? Data(contentsOf: url), let img = UIImage(data: data) {
                              Image(uiImage: img).resizable().aspectRatio(contentMode: .fill)
                                  .frame(width: 110, height: 110)
                                  .clipShape(RoundedRectangle(cornerRadius: 22))
                          } else {
                              Image(systemName: "app.fill").font(.system(size: 50)).foregroundColor(.white)
                          }
                      }
                      Text(ipa.displayName).font(.system(size: 20, weight: .black))
                      Text(ipa.bundleID).font(.system(size: 11)).foregroundColor(.gray)
                  }
                  .padding(.top, 12)
              }

              private var stats: some View {
                  HStack(spacing: 0) {
                      stat("النسخة", ipa.version, "tag")
                      divider
                      stat("الحجم", ipa.formattedSize, "internaldrive")
                      divider
                      stat("iOS", "≥ \(ipa.minOS)", "iphone")
                  }
                  .padding(.vertical, 14).glassCard(radius: 16).padding(.horizontal)
              }

              private func stat(_ label: String, _ value: String, _ icon: String) -> some View {
                  VStack(spacing: 6) {
                      Image(systemName: icon).font(.system(size: 14))
                          .foregroundStyle(LinearGradient(colors: [.vipPurple, .blue], startPoint: .top, endPoint: .bottom))
                      Text(value).font(.system(size: 12, weight: .bold))
                      Text(label).font(.system(size: 10)).foregroundColor(.gray)
                  }.frame(maxWidth: .infinity)
              }

              private var divider: some View {
                  Rectangle().fill(Color.gray.opacity(0.2)).frame(width: 1, height: 36)
              }

              private var actionsRow: some View {
                  HStack(spacing: 10) {
                      if ipa.isInstalled {
                          GradientButton(title: "إلغاء الاسترداد", icon: "arrow.uturn.backward.circle.fill",
                                         gradient: [.gray, .gray.opacity(0.7)]) {
                              ipaManager.uninstall(ipa)
                              HapticManager.shared.notification(.success)
                          }
                      } else {
                          GradientButton(title: "استرداد", icon: "arrow.down.circle.fill",
                                         gradient: [.vipPurple, .blue]) {
                              recover()
                          }
                      }
                      GradientButton(title: "مشاركة", icon: "square.and.arrow.up",
                                     gradient: [.orange, .pink]) {
                          shareURL = ipa.sourceURL
                          showShare = true
                      }
                  }.padding(.horizontal)
              }

              private var filesSection: some View {
                  VStack(alignment: .trailing, spacing: 10) {
                      HStack {
                          Text("\(extractedFiles.count) ملف").font(.system(size: 12, weight: .semibold))
                              .foregroundColor(.vipPurple)
                          Spacer()
                          Text("الملفات المستخرجة").font(.system(size: 16, weight: .bold))
                          Image(systemName: "folder.fill").foregroundColor(.vipPurple)
                      }.padding(.horizontal)

                      VStack(spacing: 0) {
                          ForEach(extractedFiles.prefix(200)) { f in
                              HStack(spacing: 10) {
                                  Image(systemName: f.isDir ? "folder.fill" : "doc.fill")
                                      .foregroundColor(f.isDir ? .vipPurple : .gray).frame(width: 22)
                                  Text(f.displayName).font(.system(size: 12)).lineLimit(1)
                                  Spacer()
                                  if !f.isDir {
                                      Text(f.formattedSize).font(.system(size: 10)).foregroundColor(.gray)
                                  }
                              }
                              .padding(.horizontal, 12).padding(.vertical, 8)
                              .background(scheme == .dark ? Color.cardDark.opacity(0.6) : Color.white)
                              Divider().opacity(0.3)
                          }
                          if extractedFiles.count > 200 {
                              Text("والمزيد…").font(.system(size: 11)).foregroundColor(.gray).padding(8)
                          }
                      }
                      .background(RoundedRectangle(cornerRadius: 14)
                          .fill(scheme == .dark ? Color.cardDark : Color.white)
                          .shadow(color: .black.opacity(0.05), radius: 6))
                      .padding(.horizontal)
                  }
              }

              private var recoverProgressView: some View {
                  VStack(spacing: 10) {
                      HStack {
                          Text(recoverMessage).font(.system(size: 13, weight: .semibold)).foregroundColor(.primary)
                          Spacer()
                          Text("\(Int(recoverProgress * 100))%").font(.system(size: 13, weight: .bold)).foregroundColor(.vipPurple)
                      }
                      ProgressView(value: recoverProgress)
                          .progressViewStyle(LinearProgressViewStyle(tint: .vipPurple))
                  }
                  .padding(14).background(RoundedRectangle(cornerRadius: 14).fill(Color.vipPurple.opacity(0.08)))
                  .padding(.horizontal)
              }

              private func recover() {
                  isRecovering = true
                  recoverProgress = 0
                  recoverMessage = "بدء الاسترداد…"
                  ipaManager.recoverIPA(ipa, progress: { p, msg in
                      recoverProgress = p
                      recoverMessage = msg
                  }) { result in
                      isRecovering = false
                      switch result {
                      case .success:
                          HapticManager.shared.notification(.success)
                      case .failure(let err):
                          recoverMessage = "فشل: \(err.localizedDescription)"
                          HapticManager.shared.notification(.error)
                      }
                  }
              }

              private func loadExtractedFiles() {
                  guard let root = ipa.extractedPath else { return }
                  var list: [ExtractedFile] = []
                  let fm = FileManager.default
                  if let it = fm.enumerator(at: root, includingPropertiesForKeys: [.isRegularFileKey, .fileSizeKey]) {
                      while let u = it.nextObject() as? URL {
                          let rel = u.path.replacingOccurrences(of: root.path + "/", with: "")
                          let vals = try? u.resourceValues(forKeys: [.isRegularFileKey, .fileSizeKey])
                          let isReg = vals?.isRegularFile ?? false
                          let size = Int64(vals?.fileSize ?? 0)
                          list.append(ExtractedFile(path: rel, size: isReg ? size : 0))
                      }
                  }
                  extractedFiles = list.sorted { $0.path < $1.path }
              }
          }
          VIPEOF
          echo "IPAFilesTabView.swift: $(wc -l < IPAFilesTabView.swift) lines"

