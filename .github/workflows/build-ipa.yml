          // ================= APPS LIST WITH CATEGORIES + SHARE =================
          struct AppsListView: View {
              @ObservedObject var feed: StoreFeed
              @ObservedObject private var reposStore = RepositoriesStore.shared
              var onMenu: (() -> Void)? = nil
              @State private var searchText: String = ""
              @State private var selectedCategory: String? = nil
              @State private var visiblePage: Int = 0
              @State private var showShareSheet: Bool = false
              @State private var sharedApp: StoreAPIApp? = nil

              private var filtered: [StoreAPIApp] {
                  let base = feed.apps
                  let byCat: [StoreAPIApp]
                  if let cat = selectedCategory {
                      let target = categoryFromName(cat).id.lowercased()
                      byCat = base.filter { categoryFromName($0.category).id.lowercased() == target }
                  } else {
                      byCat = base
                  }
                  let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return byCat }
                  return byCat.filter {
                      $0.name.lowercased().contains(q) || ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }

              private var filteredPages: Int {
                  max(1, Int(ceil(Double(filtered.count) / Double(AppConstants.feedPageSize))))
              }

              private var visibleItems: [StoreAPIApp] {
                  let start = visiblePage * AppConstants.feedPageSize
                  let end = min(start + AppConstants.feedPageSize, filtered.count)
                  guard start < filtered.count else { return [] }
                  return Array(filtered[start..<end])
              }

              /// Build the category list from apps + known categories, capped at the most common ones
              private var categories: [AppCategory] {
                  var counts: [String: Int] = [:]
                  for app in feed.apps {
                      let id = categoryFromName(app.category).id.lowercased()
                      counts[id, default: 0] += 1
                  }
                  let known = knownCategories.filter { counts[$0.id] != nil }
                  let extras = counts.keys
                      .filter { id in !known.contains(where: { $0.id == id }) }
                      .compactMap { id -> AppCategory? in
                          guard let first = feed.apps.first(where: { categoryFromName($0.category).id == id }) else { return nil }
                          return categoryFromName(first.category)
                      }
                  let combined = known + extras
                  return combined.sorted { (counts[$0.id] ?? 0) > (counts[$1.id] ?? 0) }
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          StoreHeader(title: "التطبيقات",
                                      onRefresh: {
                                          HapticManager.shared.impact(.light)
                                          Task { await feed.refresh() }
                                      },
                                      onMenu: { onMenu?() })

                          HStack(spacing: 10) {
                              HStack(spacing: 8) {
                                  Image(systemName: "magnifyingglass")
                                      .foregroundColor(.storeSub)
                                  TextField("ابحث في \(feed.totalAvailable) تطبيق...", text: $searchText)
                                      .font(.system(size: 14))
                                  if !searchText.isEmpty {
                                      Button { searchText = "" } label: {
                                          Image(systemName: "xmark.circle.fill")
                                              .foregroundColor(.storeSub)
                                      }
                                  }
                              }
                              .padding(.horizontal, 14)
                              .frame(height: 44)
                              .background(RoundedRectangle(cornerRadius: 12).fill(Color.storeCard))
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 6)

                          if !categories.isEmpty {
                              ScrollView(.horizontal, showsIndicators: false) {
                                  HStack(spacing: 8) {
                                      categoryChip(label: "الكل", icon: "square.grid.2x2.fill", value: nil)
                                      ForEach(categories, id: \.id) { c in
                                          categoryChip(label: c.nameAr, icon: c.icon, value: c.nameAr, color: c.color)
                                      }
                                  }
                                  .padding(.horizontal, 20)
                              }
                              .padding(.top, 8)
                          }

                          HStack {
                              Text("\(filtered.count) تطبيق في \(selectedCategory ?? "كل الفئات")")
                                  .font(.system(size: 11, weight: .semibold))
                                  .foregroundColor(.storeSub)
                              Spacer()
                              Text("الصفحة \(visiblePage + 1) / \(filteredPages)")
                                  .font(.system(size: 11, weight: .semibold))
                                  .foregroundColor(.storePrimary)
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 6)

                          if feed.apps.isEmpty && feed.isLoading {
                              LoadingList()
                          } else if filtered.isEmpty {
                              EmptyState(message: searchText.isEmpty ? "لا توجد تطبيقات في هذه الفئة." : "لا توجد نتائج مطابقة لـ '\(searchText)'.")
                          } else {
                              ScrollView(showsIndicators: false) {
                                  LazyVStack(spacing: 10) {
                                      ForEach(visibleItems) { app in
                                          AppListRow(
                                              app: app,
                                              onShare: { shareApp(app) }
                                          )
                                          .onTapGesture {
                                              // Navigation handled by NavigationLink value via context
                                          }
                                          .background(
                                              NavigationLink(value: app) { EmptyView() }
                                                  .opacity(0)
                                          )
                                          .onAppear { handleAppear(app: app) }
                                      }
                                  }
                                  .padding(.horizontal, 20)
                                  .padding(.top, 10)
                                  .padding(.bottom, 24)
                              }
                              .refreshable { await feed.refresh() }
                          }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                      .navigationDestination(for: StoreAPIApp.self) { app in
                          AppDetailView(app: app)
                      }
                  }
                  .sheet(isPresented: $showShareSheet) {
                      if let app = sharedApp {
                          ShareSheet(items: [shareText(for: app)])
                      }
                  }
              }

              private func shareApp(_ app: StoreAPIApp) {
                  HapticManager.shared.impact(.light)
                  sharedApp = app
                  showShareSheet = true
              }

              private func shareText(for app: StoreAPIApp) -> String {
                  let url = app.resolvedDownloadURL ?? app.icon ?? ""
                  let cat = app.category ?? "تطبيق"
                  let ver = app.bundleVersion ?? "-"
                  let size = app.cleanSize
                  return """
                  🌿 \(app.name) — \(cat)
                  📦 الإصدار: \(ver)  •  الحجم: \(size)
                  حمّله من متجر 21s
                  \(url)
                  """
              }

              private func categoryChip(label: String, icon: String, value: String?, color: Color = .storePrimary) -> some View {
                  let active = (value == nil && selectedCategory == nil) || (value != nil && selectedCategory == value)
                  return Button {
                      HapticManager.shared.selection()
                      withAnimation(.easeInOut(duration: 0.2)) {
                          selectedCategory = value
                          visiblePage = 0
                      }
                  } label: {
                      HStack(spacing: 6) {
                          Image(systemName: icon)
                              .font(.system(size: 11, weight: .bold))
                          Text(label)
                              .font(.system(size: 12, weight: .semibold))
                      }
                      .foregroundColor(active ? .white : .storeText)
                      .padding(.horizontal, 12)
                      .padding(.vertical, 8)
                      .background(
                          Capsule().fill(active
                                         ? LinearGradient(colors: [color, color.opacity(0.75)],
                                                          startPoint: .topLeading, endPoint: .bottomTrailing)
                                         : LinearGradient(colors: [Color.storeCard], startPoint: .top, endPoint: .bottom))
                      )
                      .overlay(
                          Capsule().stroke(active ? Color.clear : Color.storeDivider, lineWidth: 1)
                      )
                  }
                  .buttonStyle(.plain)
              }

              private func handleAppear(app: StoreAPIApp) {
                  let threshold = max(0, visibleItems.count - 20)
                  if let idx = visibleItems.firstIndex(of: app), idx >= threshold {
                      if visiblePage + 1 < filteredPages {
                          visiblePage += 1
                      }
                  }
              }
          }

