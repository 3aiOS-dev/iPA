              @Published var reels: [ReelPost] = []
              @Published var tools: [DevTool] = []
              @Published var likedIDs: Set<String> = []
              @Published var savedIDs: Set<String> = []
              @Published var username: String {
                  didSet { UserDefaults.standard.set(username, forKey: kUser) }
              }
              @Published var verifyState: VerifyState {
                  didSet { UserDefaults.standard.set(verifyState.rawValue, forKey: kVerify) }
              }

              private let kReels = "geamrels_reels_v1"
              private let kTools = "geamrels_tools_v1"
              private let kLiked = "geamrels_liked_v1"
              private let kSaved = "geamrels_saved_v1"
              private let kUser  = "geamrels_username_v1"
              private let kVerify = "geamrels_verify_v1"

              private init() {
                  let d = UserDefaults.standard
                  username = d.string(forKey: kUser) ?? "زائر"
                  verifyState = VerifyState(rawValue: d.string(forKey: kVerify) ?? "none") ?? .none
                  likedIDs = Set(d.stringArray(forKey: kLiked) ?? [])
                  savedIDs = Set(d.stringArray(forKey: kSaved) ?? [])
                  reels = GeamRelsStore.decode([ReelPost].self, key: kReels) ?? GeamRelsStore.seedReels()
                  tools = GeamRelsStore.decode([DevTool].self, key: kTools) ?? GeamRelsStore.seedTools()
                  refreshFromAdminPanel()
              }

              static let adminBaseURL = "https://project--5ffe1099-bf1d-4a9f-a669-a7bbab8edcea.lovable.app"

              private struct AdminReelsEnvelope: Decodable { let reels: [AdminReel] }
              private struct AdminReel: Decodable {
                  let id: String
                  let author: String
                  let verified: Bool
                  let title: String
                  let caption: String
                  let mediaURL: String
                  let likes: Int
                  let comments: [AdminComment]
              }
              private struct AdminComment: Decodable {
                  let id: String
                  let author: String
                  let verified: Bool
                  let text: String
              }

              func refreshFromAdminPanel() {
                  guard let url = URL(string: GeamRelsStore.adminBaseURL + "/api/public/reels") else { return }
                  var req = URLRequest(url: url)
                  req.cachePolicy = .reloadRevalidatingCacheData
                  req.timeoutInterval = 15
                  URLSession.shared.dataTask(with: req) { [weak self] data, _, _ in
                      guard let self = self, let data = data,
                            let env = try? JSONDecoder().decode(AdminReelsEnvelope.self, from: data),
                            !env.reels.isEmpty else { return }
                      let mapped: [ReelPost] = env.reels.map { r in
                          ReelPost(id: r.id,
                                   author: r.author,
                                   verified: r.verified,
                                   title: r.title,
                                   caption: r.caption,
                                   mediaURL: r.mediaURL,
                                   likes: r.likes,
                                   comments: r.comments.map { c in
                                       ReelComment(id: c.id, author: c.author, verified: c.verified, text: c.text)
                                   })
                      }
                      DispatchQueue.main.async {
                          self.reels = mapped
                          self.persistAll()
                      }
                  }.resume()
              }

              private static func decode<T: Decodable>(_ type: T.Type, key: String) -> T? {
                  guard let data = UserDefaults.standard.data(forKey: key) else { return nil }
                  return try? JSONDecoder().decode(T.self, from: data)
              }

              private func encode<T: Encodable>(_ value: T, key: String) {
                  if let data = try? JSONEncoder().encode(value) {
                      UserDefaults.standard.set(data, forKey: key)
                  }
              }

              func persistAll() {
                  encode(reels, key: kReels)
                  encode(tools, key: kTools)
                  UserDefaults.standard.set(Array(likedIDs), forKey: kLiked)
                  UserDefaults.standard.set(Array(savedIDs), forKey: kSaved)
              }

              func toggleLike(_ reel: ReelPost) {
                  guard let idx = reels.firstIndex(where: { $0.id == reel.id }) else { return }
                  if likedIDs.contains(reel.id) {
                      likedIDs.remove(reel.id)
                      reels[idx].likes = max(0, reels[idx].likes - 1)
                  } else {
                      likedIDs.insert(reel.id)
                      reels[idx].likes += 1
                  }
                  persistAll()
              }

              func toggleSave(_ reel: ReelPost) {
                  if savedIDs.contains(reel.id) { savedIDs.remove(reel.id) } else { savedIDs.insert(reel.id) }
                  persistAll()
              }

              func addComment(to reel: ReelPost, text: String) {
                  guard let idx = reels.firstIndex(where: { $0.id == reel.id }) else { return }
                  let c = ReelComment(author: username, verified: verifyState == .verified, text: text)
                  reels[idx].comments.append(c)
                  persistAll()
              }

              func addReel(title: String, caption: String, media: String) {
                  let r = ReelPost(author: username,
                                   verified: verifyState == .verified,
                                   title: title,
                                   caption: caption,
                                   mediaURL: media)
                  reels.insert(r, at: 0)
                  persistAll()
              }

              func addTool(name: String, details: String, version: String, link: String, tags: [String]) {
                  let t = DevTool(developer: username,
                                  verified: verifyState == .verified,
                                  name: name,
                                  details: details,
                                  version: version.isEmpty ? "1.0" : version,
                                  link: link,
                                  tags: tags)
                  tools.insert(t, at: 0)
                  persistAll()
              }

              func requestVerification() {
                  guard verifyState == .none else { return }
                  verifyState = .pending
                  DispatchQueue.main.asyncAfter(deadline: .now() + 4.0) { [weak self] in
                      self?.verifyState = .verified
                  }
              }

