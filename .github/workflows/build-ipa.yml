name: 21s Login + Apps (SwiftUI) - Clean Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "21s"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: Maximize build resources (1TB+ capacity)
        run: |
          echo "=== Build capacity check ==="
          df -h
          echo "=== macOS resource limits ==="
          ulimit -a
          echo "=== Available CPUs ==="
          sysctl -n hw.ncpu
          echo "=== Available memory ==="
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null || xcode-select -p
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS - Download images and banners
      # =========================================================
      - name: Download project images
        run: |
          mkdir -p Resources
          # Auth / Onboarding
          curl -L -o Resources/login_logo.png      "https://up6.cc/2026/07/178463790906632.png"
          curl -L -o Resources/register_logo.png   "https://up6.cc/2026/07/178463790901181.png"
          curl -L -o Resources/onboarding1.png    "https://up6.cc/2026/07/178463910434943.png"
          curl -L -o Resources/onboarding2.png    "https://up6.cc/2026/07/178463910431782.png"
          curl -L -o Resources/onboarding3.png    "https://up6.cc/2026/07/178463910425551.png"
          # Home Banners (GIFs)
          curl -L -o Resources/home_banner.gif "https://up6.cc/2026/07/178489791030411.gif"
          curl -L -o Resources/banner2.gif     "https://up6.cc/2026/07/178489791030411.gif"
          curl -L -o Resources/banner3.gif     "https://up6.cc/2026/07/178489791030411.gif"
          curl -L -o Resources/banner4.gif     "https://up6.cc/2026/07/178489791030411.gif"
          # Alerts Onboarding Animations (GIFs)
          curl -L -o Resources/alerts_onboarding1.gif "https://up6.cc/2026/07/178467158819014.gif"
          curl -L -o Resources/alerts_onboarding2.gif "https://up6.cc/2026/07/178467158813032.gif"
          curl -L -o Resources/alerts_onboarding3.gif "https://up6.cc/2026/07/17846720131242.gif"
          # Settings onboarding GIF
          curl -L -o Resources/settings_onboarding.gif "https://up6.cc/2026/07/178467999736562.gif"
          # Status / Offline screens
          curl -L -o Resources/no_internet.gif         "https://up6.cc/2026/07/178493307055591.gif"
          # Thanks overlay
          curl -L -o Resources/thanks_overlay.gif      "https://up6.cc/2026/07/178480321212891.gif"
          file Resources/*.png Resources/*.gif 2>/dev/null || true
          ls -lh Resources

      - name: Generate feature images using Python Pillow
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow 2>/dev/null || true
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os, random
          os.makedirs("Resources", exist_ok=True)
          random.seed(42)

          def gradient(w, h, c1, c2, vertical=True):
              img = Image.new("RGBA", (w, h), c1 + (255,))
              d = ImageDraw.Draw(img)
              steps = h if vertical else w
              for i in range(steps):
                  t = i / max(1, steps - 1)
                  r = int(c1[0] + (c2[0] - c1[0]) * t)
                  g = int(c1[1] + (c2[1] - c1[1]) * t)
                  b = int(c1[2] + (c2[2] - c1[2]) * t)
                  d.line([(0, i), (w, i)] if vertical else [(i, 0), (i, h)], fill=(r, g, b, 255))
              return img

          def find_font(size):
              for p in [
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/SFNSDisplay.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/Library/Fonts/Arial Bold.ttf",
              ]:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, size)
                      except: pass
              return ImageFont.load_default()

          def text_centered(d, txt, x, y, font, fill):
              try:
                  bbox = d.textbbox((0, 0), txt, font=font)
                  w = bbox[2] - bbox[0]; h = bbox[3] - bbox[1]
              except AttributeError:
                  w, h = d.textsize(txt, font=font)
              d.text((x - w // 2, y - h // 2), txt, font=font, fill=fill)

          def write_image(path, img):
              if img.mode == "RGBA":
                  bg = Image.new("RGB", img.size, (255, 255, 255))
                  bg.paste(img, mask=img.split()[-1])
                  img = bg
              img.save(path, "PNG", optimize=True)
              return img

          # Onboarding slides
          W, H = 900, 1400
          def onboarding(text_title, text_body, accent):
              base = gradient(W, H, (250, 251, 255), (235, 240, 255))
              d = ImageDraw.Draw(base)
              d.rounded_rectangle((80, 200, W - 80, 900), radius=40, fill=accent)
              text_centered(d, text_title, W // 2, 350, find_font(60), (255, 255, 255))
              text_centered(d, "*", W // 2, 560, find_font(80), (255, 255, 255))
              for i, line in enumerate(text_body.split("\n")):
                  text_centered(d, line, W // 2, 1050 + i * 70, find_font(34), (40, 50, 80))
              return base

          for i, (t, b, c) in enumerate([
              ("Send & Receive", "Transfer credit instantly.", (60, 130, 220)),
              ("Top-up Anywhere", "Local and global payments.", (90, 200, 130)),
              ("Refer & Earn", "Share your link & rewards.", (200, 100, 220)),
          ]):
              write_image(f"Resources/wallet_advanced_onb{i+1}.png", onboarding(t, b, c))

          ico = gradient(1024, 1024, (24, 36, 80), (10, 18, 42))
          d = ImageDraw.Draw(ico)
          d.rounded_rectangle((120, 120, 904, 904), radius=180, fill=(70, 130, 240))
          d.rounded_rectangle((220, 340, 804, 700), radius=30, fill=(255, 255, 255))
          d.text((260, 380), "21s", font=find_font(280), fill=(24, 36, 80))
          write_image("Resources/feature_app_icon.png", ico)
          print("All feature images generated.")
          PYEOF
          ls -lh Resources | tail -30

      - name: Generate app icons from logo
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image
          src = Image.open("Resources/login_logo.png").convert("RGBA")
          def make_icon(size, path):
              bg = Image.new("RGBA", (size, size), (10, 12, 18, 255))
              logo = src.resize((size, size))
              bg.alpha_composite(logo)
              bg.convert("RGB").save(path, "PNG")
          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYEOF
          ls -lh Resources

      - name: Generate Info.plist
        run: |
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>     <string>ja</string>
              <key>CFBundleExecutable</key>            <string>VIP21Store</string>
              <key>CFBundleIdentifier</key>            <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
              <key>CFBundleName</key>                  <string>21s</string>
              <key>CFBundleDisplayName</key>            <string>21s</string>
              <key>CFBundlePackageType</key>            <string>APPL</string>
              <key>CFBundleSignature</key>              <string>????</string>
              <key>CFBundleShortVersionString</key>     <string>1.0</string>
              <key>CFBundleVersion</key>                <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key>             <true/>
              <key>MinimumOSVersion</key>               <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
              </array>
              <key>CFBundleIconFile</key>              <string>AppIcon60x60</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon60x60@3x.png</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>UIPrerenderedIcon</key><false/>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon76x76@2x~ipad.png</string>
                          <string>AppIcon83.5x83.5@2x~ipad.png</string>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76</string>
                          <string>AppIcon83.5x83.5</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>UIPrerenderedIcon</key><false/>
                  </dict>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiresFullScreen</key>          <true/>
              <key>UIStatusBarHidden</key>             <false/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key><false/>
              </dict>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
              <key>CFBundleURLTypes</key>
              <array>
                  <dict>
                      <key>CFBundleURLName</key>
                      <string>com.vip21.store.pro</string>
                      <key>CFBundleURLSchemes</key>
                      <array>
                          <string>21s</string>
                      </array>
                  </dict>
              </array>
              <key>UIUserInterfaceStyle</key>
              <string>Automatic</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSCameraUsageDescription</key>
              <string>21sはQRコードをスキャンするためにカメラを使用します。</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>21sはスクリーンショットを保存して共有するためにフォトライブラリを使用します。</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>21sはスクリーンショットを保存して後で共有できるようにします。</string>
          </dict>
          </plist>
          PEOF

      - name: Generate Swift Source Files
        run: |
          cat > Constants.swift << 'VIPEOF'
          import SwiftUI

          struct AppConstants {
              static let appVersion = "1.0"
              static let storeName  = "21s"
              static let userDefaultsKey = "21sProUserData"
              static let hasSeenOnboardingKey = "hasSeenOnboarding21s"
              static let maxFeedCacheBytes: Int = 256 * 1024 * 1024
              static let maxIconCacheBytes: Int = 512 * 1024 * 1024
              static let feedPageSize: Int = 200
          }

          extension Color {
              static let xcodeBackground = Color(UIColor.systemBackground)
              static let xcodeEditor     = Color(UIColor.secondarySystemBackground)
              static let xcodeBlue       = Color(red: 0.11, green: 0.17, blue: 0.30)
              static let xcodeAccent     = Color(red: 0.30, green: 0.43, blue: 0.58)
              static let xcodeGreen      = Color(red: 0.20, green: 0.65, blue: 0.40)
              static let xcodeOrange     = Color(red: 0.90, green: 0.55, blue: 0.20)
              static let xcodeRed        = Color(red: 0.85, green: 0.28, blue: 0.25)
              static let xcodeSecondary  = Color(UIColor.secondaryLabel)
              static let xcodeDivider    = Color(UIColor.separator)
              static let storeAccent     = Color(red: 0.30, green: 0.43, blue: 0.58)

              static let storeBg        = Color(UIColor.systemBackground)
              static let storeCard      = Color(UIColor.secondarySystemBackground)
              static let storeText      = Color(UIColor.label)
              static let storeSub       = Color(UIColor.secondaryLabel)
              static let storeDivider   = Color(UIColor.separator)
          }

          extension UIImage {
              static func bundled(_ filename: String) -> UIImage? {
                  guard let path = Bundle.main.path(forResource: filename, ofType: nil) else { return nil }
                  return UIImage(contentsOfFile: path)
              }
          }
          VIPEOF

          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  UINotificationFeedbackGenerator().notificationOccurred(type)
              }
              func selection() { UISelectionFeedbackGenerator().selectionChanged() }
              func success() { notification(.success) }
              func error() { notification(.error) }
          }
          VIPEOF

          cat > Models.swift << 'VIPEOF'
          import Foundation

          struct AppUser: Codable {
              let id: UUID
              let phoneNumber: String
              let username: String
              let password: String
              let createdAt: Date

              init(phoneNumber: String, username: String, password: String) {
                  self.id = UUID()
                  self.phoneNumber = phoneNumber
                  self.username = username
                  self.password = password
                  self.createdAt = Date()
              }
          }

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let bundleVersion: String?
              let ipaSize: String?
              let githubUrl: String?
              let archiveUrl: String?
              let ipaUrl: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let createdAt: String?
              let updatedAt: String?
              let downloadURL: String?
              let down: String?
              let iconURL: String?
              let localizedDescription: String?
              let developerName: String?
              let version: String?
              let versionDate: String?
              let fullDate: String?
              let size: Double?
              let type: Int?
          }

          struct StoreAPIResponse: Codable {
              let lastUpdated: String?
              let apps: [StoreAPIApp]
          }
          VIPEOF

      - name: Build Swift Code using swiftc
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Building for target SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework ImageIO \
            -framework MobileCoreServices \
            -framework Network \
            -framework CFNetwork \
            -framework CoreImage \
            -o VIP21Store
          file VIP21Store

      - name: Package App Bundle & Create IPA
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp -X VIP21Store build-output/Payload/VIP21Store.app/VIP21Store
          cp -X Resources/Info.plist build-output/Payload/VIP21Store.app/Info.plist
          cp -X Resources/*.png build-output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp -X Resources/*.gif build-output/Payload/VIP21Store.app/ 2>/dev/null || true

          xattr -cr build-output
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          ldid -S build-output/Payload/VIP21Store.app/VIP21Store

          rm -f artifacts/21s.ipa
          cd build-output && zip -r -X -q ../artifacts/21s.ipa Payload && cd ..
          ls -lh artifacts/21s.ipa

      - name: Verify IPA Integrity
        run: |
          if ! unzip -tq artifacts/21s.ipa >/dev/null 2>&1; then
            echo "Error: IPA file is corrupt."
            exit 1
          fi
          echo "IPA build completed successfully!"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Clean-IPA
          path: artifacts/21s.ipa
          retention-days: 90
