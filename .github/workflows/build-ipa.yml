                                  Text("عام")
                                      .font(.system(size: 10, weight: .bold))
                                      .foregroundColor(Color.storePrimary)
                                      .padding(.horizontal, 8).padding(.vertical, 4)
                                      .background(Capsule().fill(Color.storePrimary.opacity(0.14)))
                              }
                              TextField("", text: $draft,
                                        prompt: Text("اكتب شيئًا يستحق المشاركة…").foregroundColor(.white.opacity(0.35)),
                                        axis: .vertical)
                                  .foregroundColor(.white)
                                  .font(.system(size: 17))
                                  .lineLimit(4...14)

                              if let img = attachedImage {
                                  ZStack(alignment: .topTrailing) {
                                      Image(uiImage: img)
                                          .resizable()
                                          .aspectRatio(contentMode: .fill)
                                          .frame(maxHeight: 200)
                                          .frame(maxWidth: .infinity)
                                          .clipped()
                                          .clipShape(RoundedRectangle(cornerRadius: 14, style: .continuous))
                                      Button { attachedImage = nil } label: {
                                          Image(systemName: "xmark.circle.fill")
                                              .font(.system(size: 22))
                                              .foregroundColor(.white)
                                              .padding(6)
                                              .background(Circle().fill(Color.black.opacity(0.45)))
                                      }
                                      .buttonStyle(.plain)
                                      .padding(8)
                                  }
                              }

                              HStack(spacing: 10) {
                                  Picker("", selection: $kind) {
                                      Text("منشور").tag("post")
                                      Text("خبر").tag("news")
                                      Text("عرض").tag("offer")
                                  }
                                  .pickerStyle(.segmented)
                                  .frame(maxWidth: 220)
                                  Spacer()
                                  Text("\(draft.count)/\(maxChars)")
                                      .font(.system(size: 11, weight: .semibold))
                                      .foregroundColor(draft.count > maxChars ? .red : .white.opacity(0.45))
                              }
                          }
                      }
                      .padding(16)
                      .background(
                          RoundedRectangle(cornerRadius: 20, style: .continuous)
                              .fill(Color.white.opacity(0.045))
                              .overlay(RoundedRectangle(cornerRadius: 20, style: .continuous)
