                              }
                              Spacer()
                              Text(ipa.displayName).font(.system(size: 14, weight: .bold)).lineLimit(1)
                          }
                          Text(ipa.bundleID).font(.system(size: 10)).foregroundColor(.gray).lineLimit(1)
                          HStack(spacing: 8) {
                              Label(ipa.formattedSize, systemImage: "internaldrive").font(.system(size: 9)).foregroundColor(.gray)
                              Label("v\(ipa.version)", systemImage: "tag").font(.system(size: 9)).foregroundColor(.gray)
                              Text(ipa.formattedDate).font(.system(size: 9)).foregroundColor(.gray)
