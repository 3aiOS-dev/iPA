          const db = require('../db');
          const logger = require('../utils/logger');
          
          /**
           * Queue a notification for later delivery. Returns row id.
           */
          function enqueue(telegramId, type, payload = {}) {
            const res = db.prepare(`
              INSERT INTO notifications (telegram_id, type, payload)
              VALUES (?, ?, ?)
            `).run(telegramId, type, JSON.stringify(payload));
            return res.lastInsertRowid;
          }
          
          /**
           * Best-effort delivery through a Telegram bot instance.
           * On failure the row stays undelivered for retry.
           */
          async function flush(bot, batchSize = 50) {
            const rows = db.prepare(`
              SELECT * FROM notifications WHERE delivered = 0
              ORDER BY id ASC LIMIT ?
            `).all(batchSize);
            let delivered = 0;
            for (const row of rows) {
              try {
                const payload = row.payload ? JSON.parse(row.payload) : {};
                const text = payload.text || `🔔 ${row.type}`;
                await bot.telegram.sendMessage(row.telegram_id, text, {
                  parse_mode: 'HTML',
                  ...payload.options,
                });
                db.prepare(`UPDATE notifications SET delivered = 1 WHERE id = ?`).run(row.id);
                delivered += 1;
              } catch (err) {
                logger.warn('Notification delivery failed', { id: row.id, err: err.message });
              }
            }
            return { delivered, attempted: rows.length };
          }
          
          async function sendDirect(botOrCtx, telegramId, type, payload = {}) {
            const bot = botOrCtx && botOrCtx.telegram ? botOrCtx : botOrCtx && botOrCtx.bot ? botOrCtx.bot : botOrCtx;
            try {
              const text = payload.text || `🔔 ${type}`;
              await bot.telegram.sendMessage(telegramId, text, {
                parse_mode: 'HTML',
                ...(payload.options || {}),
              });
              enqueue(telegramId, type, { ...payload, sent_direct: true });
              return true;
            } catch (err) {
              logger.error('Direct send failed', { telegramId, err: err.message });
              enqueue(telegramId, type, payload);
              return false;
            }
          }
          
          module.exports = { enqueue, flush, sendDirect };
          
