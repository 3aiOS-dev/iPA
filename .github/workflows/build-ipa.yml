      - name: Generate Source - Apps Tab
        run: |
          cd ${{ github.workspace }}
          cat > AppsView.swift << 'AEOF'
          import SwiftUI

          struct AppsView: View {
              @EnvironmentObject var theme: ThemeManager
              var onOpenSettings: () -> Void

              private enum SortOption: String, CaseIterable {
                  case ratingDesc = "الأعلى تقييمًا"
                  case nameAsc = "الاسم (أ-ي)"
                  case sizeAsc = "الأصغر حجمًا"
              }

              @State private var searchText = ""
              @State private var selectedCategory: StoreCategory = .all
              @State private var sortOption: SortOption = .ratingDesc

              private let allItems = AppDataLoader.items
              private let columns = [GridItem(.flexible(), spacing: 12), GridItem(.flexible(), spacing: 12)]

              private var filtered: [AppItem] {
                  var result = allItems.filter { item in
                      let matchesCategory = selectedCategory == .all || item.category == selectedCategory
                      let matchesQuery = searchText.isEmpty
                          || item.name.localizedCaseInsensitiveContains(searchText)
                          || item.developer.localizedCaseInsensitiveContains(searchText)
                      return matchesCategory && matchesQuery
                  }
                  switch sortOption {
                  case .ratingDesc: result.sort { $0.rating > $1.rating }
                  case .nameAsc: result.sort { $0.name.localizedCompare($1.name) == .orderedAscending }
                  case .sizeAsc: result.sort { $0.sizeMB < $1.sizeMB }
                  }
                  return result
              }

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 4) {
                              Picker("الفئة", selection: $selectedCategory) {
                                  ForEach(StoreCategory.allCases, id: \.self) { cat in
                                      Text(cat.rawValue).tag(cat)
                                  }
                              }
                              .pickerStyle(.segmented)
                              .padding(.horizontal, 16)
                              .padding(.top, 4)

                              LazyVGrid(columns: columns, spacing: 12) {
                                  ForEach(filtered) { item in
                                      NavigationLink(value: item) {
                                          AppCellView(item: item).frame(height: 190)
                                      }
                                      .buttonStyle(.plain)
                                  }
                              }
                              .padding(.horizontal, 16)
                              .padding(.top, 8)
                              .padding(.bottom, 20)
                          }
                      }
                      .background(theme.background.ignoresSafeArea())
                      .navigationTitle("التطبيقات")
                      .searchable(text: $searchText, prompt: "ابحث عن تطبيق أو لعبة")
                      .navigationDestination(for: AppItem.self) { item in
                          DetailView(item: item)
                      }
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Menu {
                                  ForEach(SortOption.allCases, id: \.self) { option in
                                      Button {
                                          sortOption = option
                                      } label: {
                                          if option == sortOption {
                                              Label(option.rawValue, systemImage: "checkmark")
                                          } else {
                                              Text(option.rawValue)
                                          }
                                      }
                                  }
                              } label: {
                                  Image(systemName: "arrow.up.arrow.down.circle.fill")
                              }
                          }
                      }
                  }
              }
          }
          AEOF

      - name: Generate Source - Detail Screen
        run: |
          cd ${{ github.workspace }}
          cat > DetailView.swift << 'DEOF'
          import SwiftUI

          struct DetailView: View {
              @EnvironmentObject var theme: ThemeManager
              @EnvironmentObject var favorites: FavoritesManager
              let item: AppItem

              @State private var isInstalling = false
              @State private var progress: Double = 0
              @State private var installed = false
              @State private var showShare = false
              @State private var timer: Timer?

              var body: some View {
                  ScrollView {
                      VStack(alignment: .leading, spacing: 20) {
                          HStack(alignment: .top, spacing: 16) {
                              ZStack {
                                  RoundedRectangle(cornerRadius: 22)
                                      .fill(Color(hex: item.colorHex).opacity(0.25))
                                      .frame(width: 88, height: 88)
                                  Text(item.emoji).font(.system(size: 46))
                              }
                              VStack(alignment: .leading, spacing: 4) {
                                  Text(item.name).font(.system(size: 22, weight: .bold)).foregroundColor(theme.primaryText)
                                  Text(item.developer).font(.system(size: 14)).foregroundColor(theme.secondaryText)
                                  HStack(spacing: 10) {
                                      Text("★ \(String(format: "%.1f", item.rating))")
                                          .font(.system(size: 13, weight: .medium)).foregroundColor(theme.gold)
                                      Text("\(item.sizeMB) MB  ·  \(item.category.rawValue)")
                                          .font(.system(size: 13)).foregroundColor(theme.secondaryText)
                                  }
                              }
                              Spacer()
                          }

                          Button(action: install) {
                              Text(buttonTitle)
                                  .font(.system(size: 16, weight: .bold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 46)
                                  .background(theme.accent)
                                  .clipShape(RoundedRectangle(cornerRadius: 12))
                          }
                          .disabled(isInstalling)

                          if isInstalling {
                              ProgressView(value: progress)
                                  .tint(theme.accent)
                          }

                          VStack(alignment: .leading, spacing: 8) {
                              Text("الوصف").font(.system(size: 16, weight: .bold)).foregroundColor(theme.primaryText)
                              Text(item.description)
                                  .font(.system(size: 14))
                                  .foregroundColor(theme.primaryText.opacity(0.75))
                          }
                      }
                      .padding(20)
                  }
                  .background(theme.background.ignoresSafeArea())
                  .navigationTitle(item.name)
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .navigationBarTrailing) {
                          HStack(spacing: 16) {
                              Button {
                                  favorites.toggle(item.id)
                              } label: {
                                  Image(systemName: favorites.isFavorite(item.id) ? "heart.fill" : "heart")
                                      .foregroundColor(theme.gold)
                              }
                              Button {
                                  showShare = true
                              } label: {
                                  Image(systemName: "square.and.arrow.up")
                                      .foregroundColor(theme.primaryText)
                              }
                          }
                      }
                  }
                  .sheet(isPresented: $showShare) {
                      ShareSheet(items: ["\(item.name) - \(item.developer)\n\(item.description)"])
                  }
                  .onDisappear { timer?.invalidate() }
              }

              private var buttonTitle: String {
                  if installed { return "فتح" }
                  if isInstalling { return "جارِ..." }
                  return item.price == "مجانًا" ? "تثبيت" : "شراء \(item.price)"
              }

              // ملاحظة مهمة: هذا الزر لا يقوم بأي تنزيل أو تثبيت فعلي لأي ملف؛
              // إنه فقط رسم متحرك تجريبي لشريط تقدم يوضح شكل الواجهة، ثم يتحول
              // إلى زر "فتح" شكلي بدون أي وظيفة تثبيت حقيقية.
              private func install() {
                  guard !isInstalling, !installed else { return }
                  isInstalling = true
                  progress = 0
                  timer?.invalidate()
                  timer = Timer.scheduledTimer(withTimeInterval: 0.08, repeats: true) { t in
                      progress += 0.04
                      if progress >= 1.0 {
                          t.invalidate()
                          isInstalling = false
                          installed = true
                      }
                  }
              }
          }
          DEOF

