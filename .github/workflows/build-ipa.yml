                                  .font(.system(size: 28, weight: .heavy))
                                  .foregroundColor(.white)
                              Text("يبدو أنك غير متصل بالإنترنت.\nتحقق من شبكة Wi-Fi أو بيانات الجوال ثم حاول مرة أخرى.")
                                  .font(.system(size: 14, weight: .medium))
                                  .foregroundColor(.white.opacity(0.7))
                                  .multilineTextAlignment(.center)
                                  .lineSpacing(3)
                          }

                          Button(action: {
                              HapticManager.shared.impact(.medium)
                              onRetry()
                          }) {
                              HStack(spacing: 8) {
                                  Image(systemName: "arrow.clockwise")
                                      .font(.system(size: 14, weight: .bold))
                                  Text("إعادة المحاولة")
                                      .font(.system(size: 15, weight: .bold))
                              }
                              .foregroundColor(.white)
                              .frame(maxWidth: .infinity)
                              .frame(height: 52)
                              .background(
                                  Capsule().fill(LinearGradient(colors: [Color.storePrimary, Color.storePrimary],
                                                                startPoint: .leading, endPoint: .trailing))
                              )
                              .shadow(color: Color.storePrimary.opacity(0.4), radius: 12, y: 6)
                          }
                          .padding(.horizontal, 40)
                          .padding(.top, 4)
                      }
                      .padding(.horizontal, 24)
                  }
                  .onAppear { animatePulse = true }
                  .preferredColorScheme(.dark)
              }
          }

          struct StatusOverlayHost: View {
              @ObservedObject var center = StatusCenter.shared

              var body: some View {
                  Group {
                      if center.kind == .noInternet {
                          NoInternetScreen {
                              HapticManager.shared.impact(.light)
                              center.refresh()
                          }
                          .transition(.opacity.combined(with: .scale(scale: 1.02)))
                      }
                  }
                  .animation(.easeInOut(duration: 0.25), value: center.kind)
              }
          }

          extension UIImage {
              static func gif(name: String) -> UIImage? {
                  guard let path = Bundle.main.path(forResource: name, ofType: "gif") else { return nil }
                  let url = URL(fileURLWithPath: path)
                  guard let data = try? Data(contentsOf: url) else { return nil }
                  guard let source = CGImageSourceCreateWithData(data as CFData, nil) else { return nil }
                  let count = CGImageSourceGetCount(source)
                  guard count > 0 else { return nil }
                  var images: [UIImage] = []
                  var duration: TimeInterval = 0
                  for i in 0..<count {
                      guard let cg = CGImageSourceCreateImageAtIndex(source, i, nil) else { continue }
                      images.append(UIImage(cgImage: cg))
                      let props = CGImageSourceCopyPropertiesAtIndex(source, i, nil) as? [CFString: Any]
                      if let gifProps = props?[kCGImagePropertyGIFDictionary] as? [CFString: Any] {
                          if let delay = gifProps[kCGImagePropertyGIFDelayTime] as? Double {
                              duration += delay
                          }
                      }
                  }
                  if images.isEmpty { return nil }
                  if duration <= 0 { duration = Double(count) * 0.1 }
                  return UIImage.animatedImage(with: images, duration: duration)
              }
          }
          STATEOF

