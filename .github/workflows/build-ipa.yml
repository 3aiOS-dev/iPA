                  .padding(.horizontal, 20)
                  .padding(.bottom, 90)
                  .transition(.move(edge: .bottom).combined(with: .opacity))
              }
          }

          // MARK: - IPA Row
          struct IPARow: View {
              let ipa: LocalIPA
              let isRezipping: Bool
              let onTap: () -> Void
              let onDelete: () -> Void
              let onShare: () -> Void
              @Environment(\.colorScheme) var scheme

              var iconURL: URL? {
                  if let app = ipa.extractedPath?.appendingPathComponent("Payload") {
                      let payload = app.appendingPathComponent(ipa.payloadAppName ?? "")
                      if let iconName = ipa.iconRelativePath, !iconName.isEmpty {
                          // جرّب @2x/@3x
                          let candidates = ["@3x.png", "@2x.png", ".png"]
                          for c in candidates {
                              let p = payload.appendingPathComponent("\(iconName)\(c)")
                              if FileManager.default.fileExists(atPath: p.path) { return p }
                          }
                      }
                      if let app2 = try? FileManager.default.contentsOfDirectory(at: app, includingPropertiesForKeys: nil).first {
                          return app2.appendingPathComponent("AppIcon60x60@2x.png")
                      }
                  }
                  return nil
              }

              var body: some View {
                  HStack(spacing: 12) {
                      // الأيقونة
                      Group {
                          if let url = iconURL, let data = try? Data(contentsOf: url), let img = UIImage(data: data) {
                              Image(uiImage: img).resizable().aspectRatio(contentMode: .fill)
                          } else {
                              ZStack {
                                  LinearGradient(colors: [.vipPurple.opacity(0.3), .blue.opacity(0.2),
                                                          .pink.opacity(0.2)],
                                                 startPoint: .topLeading, endPoint: .bottomTrailing)
                                  Image(systemName: "app.fill").font(.system(size: 22))
