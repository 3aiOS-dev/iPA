      - name: Generate code - StoreView.swift
        run: |
          cat > StoreView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import ImageIO

          // ================= Image cache (same as before) =================
          @MainActor
          final class RemoteIconCache: ObservableObject {
              static let shared = RemoteIconCache()
              @Published private(set) var cache: [String: UIImage] = [:]
              private let memCache: NSCache<NSString, UIImage> = {
                  let c = NSCache<NSString, UIImage>()
                  c.totalCostLimit = AppConstants.maxIconCacheBytes
                  c.countLimit = 20_000
                  return c
              }()
              private let session: URLSession
              private let diskDir: URL
              private let diskIndexKey = "apptesters-icon-disk-index"
              private var diskIndex: [String: String] = [:]
              private let inflightQueue = DispatchQueue(label: "com.21s.iconcache.inflight")
              private var inflightSet: Set<String> = []

              init() {
                  let cfg = URLSessionConfiguration.default
                  cfg.requestCachePolicy = .returnCacheDataElseLoad
                  cfg.urlCache = URLCache(
                      memoryCapacity: 64 * 1024 * 1024,
                      diskCapacity: AppConstants.maxIconCacheBytes,
                      diskPath: "icons-v2"
                  )
                  cfg.httpMaximumConnectionsPerHost = 16
                  cfg.timeoutIntervalForRequest = 10
                  cfg.timeoutIntervalForResource = 30
                  self.session = URLSession(configuration: cfg)

                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  let dir = caches.appendingPathComponent("apptesters-icons-v2", isDirectory: true)
                  try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  self.diskDir = dir
                  if let data = UserDefaults.standard.data(forKey: diskIndexKey),
                     let map = try? JSONDecoder().decode([String: String].self, from: data) {
                      self.diskIndex = map
                  }
              }

              func image(for urlString: String?) -> UIImage? {
                  guard let s = urlString, !s.isEmpty, let url = URL(string: s) else { return nil }
                  if let hit = cache[s] { return hit }
                  if let hit = memCache.object(forKey: s as NSString) {
                      cache[s] = hit
                      return hit
                  }

                  let name = Self.sanitize(s)
                  let path = diskDir.appendingPathComponent(name)
                  if let data = try? Data(contentsOf: path), let img = UIImage(data: data) {
                      memCache.setObject(img, forKey: s as NSString, cost: data.count)
                      cache[s] = img
                      return img
                  }

                  var already = false
                  inflightQueue.sync { already = inflightSet.contains(s); if !already { inflightSet.insert(s) } }
                  if !already {
                      Task { [weak self] in
                          await self?.fetch(urlString: s, url: url, name: name)
                      }
                  }
                  return nil
              }

              private func fetch(urlString: String, url: URL, name: String) async {
                  defer {
                      _ = inflightQueue.sync { inflightSet.remove(urlString) }
                  }
                  do {
                      let (data, _) = try await session.data(from: url)
                      guard let img = UIImage(data: data) else { return }
                      memCache.setObject(img, forKey: urlString as NSString, cost: data.count)
                      cache[urlString] = img
                      let path = diskDir.appendingPathComponent(name)
                      try? data.write(to: path, options: .atomic)
                      diskIndex[urlString] = name
                      if let data = try? JSONEncoder().encode(diskIndex) {
                          UserDefaults.standard.set(data, forKey: diskIndexKey)
                      }
                  } catch {
                  }
              }

              func purgeMemory() {
                  memCache.removeAllObjects()
                  cache.removeAll(keepingCapacity: true)
              }

              private static func sanitize(_ s: String) -> String {
                  let cleaned = s
                      .replacingOccurrences(of: "https://", with: "")
                      .replacingOccurrences(of: "http://", with: "")
                      .replacingOccurrences(of: "/", with: "_")
                      .replacingOccurrences(of: ":", with: "_")
                      .replacingOccurrences(of: "?", with: "_")
                      .replacingOccurrences(of: "&", with: "_")
                  return String(cleaned.prefix(160))
              }
          }

          struct RemoteIcon: View {
              let url: String?
              var size: CGFloat = 56
              var cornerRadius: CGFloat = 14
              @ObservedObject private var cache = RemoteIconCache.shared

              var body: some View {
                  Group {
                      if let img = cache.image(for: url) {
                          Image(uiImage: img)
                              .resizable()
                              .aspectRatio(contentMode: .fill)
                      } else {
                          RoundedRectangle(cornerRadius: cornerRadius)
                              .fill(Color.storeDivider)
                              .overlay(
                                  Image(systemName: "app.fill")
                                      .font(.system(size: size * 0.45, weight: .bold))
                                      .foregroundColor(.storeSub)
                              )
                      }
                  }
                  .frame(width: size, height: size)
                  .clipShape(RoundedRectangle(cornerRadius: cornerRadius))
              }
          }

          func colorForCategory(_ category: String?) -> Color {
              guard let c = category?.lowercased() else { return .storePrimary }
              if c.contains("photo") || c.contains("camera") { return .storePink }
              if c.contains("music") { return Color(red: 0.11, green: 0.72, blue: 0.36) }
              if c.contains("video") || c.contains("stream") { return .storePink }
              if c.contains("social") || c.contains("messag") { return .storeCyan }
              if c.contains("tool") || c.contains("util") { return .storeYellow }
              if c.contains("game") { return .storePrimary }
              if c.contains("book") || c.contains("edu") { return .betaOrange }
              if c.contains("shop") { return .storePink }
              return .storePrimary
          }

          // ================= View Model (same) =================
          @MainActor
          final class StoreFeed: ObservableObject {
              @Published var apps: [StoreAPIApp] = []
              @Published var isLoading: Bool = false
              @Published var lastError: String?
              @Published var lastUpdated: String?
              @Published var totalAvailable: Int = 0

              private let cacheURL: URL = {
                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  return caches.appendingPathComponent("apptesters-feed-v2.json")
              }()

              private let repos = RepositoriesStore.shared
              private let pageSize = AppConstants.feedPageSize

              init() { loadCachedThenRefresh() }

              func loadCachedThenRefresh() {
                  if let data = try? Data(contentsOf: cacheURL),
                     let parsed = try? JSONDecoder().decode(StoreAPIResponse.self, from: data) {
                      self.apps = parsed.apps
                      self.lastUpdated = parsed.lastUpdated
                      self.totalAvailable = parsed.apps.count
                      repos.updateTotalApps(parsed.apps.count)
                  }
                  Task { await refresh() }
              }

              func refresh() async {
                  isLoading = true
                  lastError = nil
                  do {
                      let merged = try await fetchMergedFromAllRepos()
                      self.apps = merged.apps
                      self.lastUpdated = merged.lastUpdated
                      self.totalAvailable = merged.apps.count
                      repos.updateTotalApps(merged.apps.count)
                      if let data = try? JSONEncoder().encode(merged) {
                          try? data.write(to: cacheURL)
                      }
                  } catch {
                      self.lastError = error.localizedDescription
                  }
                  isLoading = false
              }

              private func fetchMergedFromAllRepos() async throws -> StoreAPIResponse {
                  let enabled = repos.repositories.filter { $0.enabled }
                  var combined: [StoreAPIApp] = []
                  var seen = Set<String>()
                  var latestUpdate: String? = nil
                  var firstError: Error? = nil

                  await withTaskGroup(of: (StoreAPIResponse?, Error?).self) { group in
                      for repo in enabled {
                          group.addTask { () -> (StoreAPIResponse?, Error?) in
                              do {
                                  var req = URLRequest(url: URL(string: repo.feedURL)!, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 25)
                                  req.setValue("21s-iOS/1.0", forHTTPHeaderField: "User-Agent")
                                  let (data, response) = try await URLSession.shared.data(for: req)
                                  if let http = response as? HTTPURLResponse, !(200...299).contains(http.statusCode) {
                                      throw NSError(domain: "StoreFeed", code: http.statusCode,
                                                    userInfo: [NSLocalizedDescriptionKey: "HTTP \(http.statusCode) from \(repo.name)"])
                                  }
                                  let parsed = try JSONDecoder().decode(StoreAPIResponse.self, from: data)
                                  return (parsed, nil)
                              } catch {
                                  return (nil, error)
                              }
                          }
                      }
                      for await (resp, err) in group {
                          if let resp = resp {
                              for app in resp.apps {
                                  let key = app.bundleId?.lowercased() ?? "n_\(app.id)_\(app.name.lowercased())"
                                  if !seen.contains(key) {
                                      seen.insert(key)
                                      combined.append(app)
                                  }
                              }
                              if let u = resp.lastUpdated, (latestUpdate == nil || u > latestUpdate!) {
                                  latestUpdate = u
                              }
                          } else if let err = err, firstError == nil {
                              firstError = err
                          }
                      }
                  }

                  if combined.isEmpty, let err = firstError { throw err }

                  let sort = combined.sorted { (a, b) in
                      let an = a.name.lowercased()
                      let bn = b.name.lowercased()
                      return an < bn
                  }

                  return StoreAPIResponse.__build(apps: sort, lastUpdated: latestUpdate)
              }

              var featured: [StoreAPIApp] {
                  Array(apps.prefix(8))
              }
              var allSorted: [StoreAPIApp] { apps }

              func page(_ index: Int) -> [StoreAPIApp] {
                  let start = index * pageSize
                  guard start < apps.count else { return [] }
                  let end = min(start + pageSize, apps.count)
                  return Array(apps[start..<end])
              }

              var totalPages: Int {
                  max(1, Int(ceil(Double(apps.count) / Double(pageSize))))
              }

              func search(_ query: String) -> [StoreAPIApp] {
                  let q = query.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return apps }
                  return apps.filter {
                      $0.name.lowercased().contains(q)
                      || ($0.category?.lowercased().contains(q) ?? false)
                      || ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }
          }

          extension StoreAPIResponse {
              init(lastUpdated: String?, apps: [StoreAPIApp]) {
                  self.lastUpdated = lastUpdated
                  self.apps = apps
              }
              static func __build(apps: [StoreAPIApp], lastUpdated: String?) -> StoreAPIResponse {
                  return StoreAPIResponse(lastUpdated: lastUpdated, apps: apps)
              }
          }

