      # =========================================================
      # SOURCE CODE - Localization.swift (Arabic only)
      # =========================================================
      - name: Generate code - Localization.swift
        run: |
          cat > Localization.swift << 'LANGEOF'
          import SwiftUI
          import Foundation
          import Combine

          /// مفتاح اللغة المحفوظة على الجهاز (دائماً عربي).
          public let kAppLanguageKey = "app_language_v1"

          /// مدير اللغة: عربي فقط (RTL). لا توجد تبديل للغة.
          public final class LanguageManager: ObservableObject {
              public static let shared = LanguageManager()

              public let isArabic: Bool = true

              private init() {
                  UserDefaults.standard.set("ar", forKey: kAppLanguageKey)
              }

              public var locale: Locale { Locale(identifier: "ar") }
              public var layout: LayoutDirection { .rightToLeft }
              public var title: String { "العربية" }
          }

          /// دالة ترجمة بسيطة - تعيد النص العربي كما هو.
          public func LS(_ ar: String) -> String {
              return ar
          }
          LANGEOF

      # =========================================================
      # SOURCE CODE - Constants.swift
      # =========================================================
      - name: Generate code - Constants.swift
        run: |
          cat > Constants.swift << 'VIPEOF'
          import SwiftUI

          struct AppConstants {
              static let appVersion = "1.0"
              static let storeName  = "ONEs"
              static let userDefaultsKey = "21sProUserData"
              static let hasSeenOnboardingKey = "hasSeenOnboarding21s"
              static let maxFeedCacheBytes: Int = 256 * 1024 * 1024
              static let maxIconCacheBytes: Int = 512 * 1024 * 1024
              static let feedPageSize: Int = 200
          }

          // Dark mode removed: the app always uses the plain dark palette.
          func dyn(_ light: (CGFloat, CGFloat, CGFloat), _ dark: (CGFloat, CGFloat, CGFloat)) -> Color {
              Color(UIColor(red: light.0, green: light.1, blue: light.2, alpha: 1))
          }

          // ===== THEME ENGINE - single dark palette =====
          struct ThemePalette: Identifiable, Equatable {
              let id: Int
              let name: String
              let primary: (CGFloat, CGFloat, CGFloat)
              let primaryDk: (CGFloat, CGFloat, CGFloat)
              let accent: (CGFloat, CGFloat, CGFloat)
              let blush: (CGFloat, CGFloat, CGFloat)
              let yellow: (CGFloat, CGFloat, CGFloat)
              let cyan: (CGFloat, CGFloat, CGFloat)
              let bg: (CGFloat, CGFloat, CGFloat)
              let card: (CGFloat, CGFloat, CGFloat)
              let cardAlt: (CGFloat, CGFloat, CGFloat)
              let text: (CGFloat, CGFloat, CGFloat)
              let sub: (CGFloat, CGFloat, CGFloat)
              let divider: (CGFloat, CGFloat, CGFloat)

              static func == (a: ThemePalette, b: ThemePalette) -> Bool { a.id == b.id }

              var primaryHex: String { ThemePalette.hex(primary) }
              var accentHex: String { ThemePalette.hex(accent) }
              var darkHex: String { ThemePalette.hex(primaryDk) }
              var cyanHex: String { ThemePalette.hex(cyan) }
              var blushHex: String { ThemePalette.hex(blush) }
              var yellowHex: String { ThemePalette.hex(yellow) }
              var bgHex: String { ThemePalette.hex(bg) }
              var cardHex: String { ThemePalette.hex(card) }
              var cardAltHex: String { ThemePalette.hex(cardAlt) }
              var textHex: String { ThemePalette.hex(text) }
              var subHex: String { ThemePalette.hex(sub) }
              var dividerHex: String { ThemePalette.hex(divider) }

              static func hex(_ c: (CGFloat, CGFloat, CGFloat)) -> String {
                  let r = Int(max(0, min(1, c.0)) * 255)
                  let g = Int(max(0, min(1, c.1)) * 255)
                  let b = Int(max(0, min(1, c.2)) * 255)
                  return String(format: "#%02X%02X%02X", r, g, b)
              }
          }

          enum ThemeCatalog {
              static let all: [ThemePalette] = [
               ThemePalette(id: 0, name: "جبل أزرق",
                            primary: (0.184, 0.565, 0.725), primaryDk: (0.102, 0.345, 0.486),
                            accent: (0.329, 0.671, 0.929), blush: (0.055, 0.067, 0.090),
                            yellow: (0.98, 0.76, 0.30), cyan: (0.043, 0.796, 0.717),
                            bg: (0.035, 0.047, 0.063), card: (0.078, 0.098, 0.125),
                            cardAlt: (0.110, 0.137, 0.169), text: (1.00, 1.00, 1.00),
                            sub: (0.60, 0.64, 0.68), divider: (0.18, 0.22, 0.28))
              ]
              static func palette(_ id: Int) -> ThemePalette {
                  all.first(where: { $0.id == id }) ?? all[0]
              }
          }

          final class ThemeManager: ObservableObject {
              static let shared = ThemeManager()
              private let key = "selectedTheme21s"
              @Published var current: ThemePalette

              private init() {
                  current = ThemeCatalog.palette(0)
              }

              func select(_ id: Int) {
                  UserDefaults.standard.set(id, forKey: key)
                  withAnimation(.easeInOut(duration: 0.3)) {
                      current = ThemeCatalog.palette(id)
                  }
              }
              static var p: ThemePalette { ThemeManager.shared.current }
          }

          func rgb(_ c: (CGFloat, CGFloat, CGFloat)) -> Color {
              Color(UIColor(red: c.0, green: c.1, blue: c.2, alpha: 1))
          }

          extension Color {
              static var xcodeBackground: Color { rgb(ThemeManager.p.bg) }
              static var xcodeEditor: Color     { rgb(ThemeManager.p.card) }
              static var xcodeBlue: Color       { rgb(ThemeManager.p.primary) }
              static var xcodeAccent: Color     { rgb(ThemeManager.p.primary) }
              static var xcodeGreen: Color      { rgb(ThemeManager.p.cyan) }
              static var xcodeOrange: Color     { rgb(ThemeManager.p.yellow) }
              static let xcodeRed               = Color(red: 0.90, green: 0.28, blue: 0.32)
              static var xcodeSecondary: Color  { rgb(ThemeManager.p.sub) }
              static var xcodeDivider: Color    { rgb(ThemeManager.p.divider) }
              static var storeAccent: Color     { rgb(ThemeManager.p.primary) }

              // Store surfaces
              static var storeBg: Color       { rgb(ThemeManager.p.bg) }
              static var storeCard: Color     { rgb(ThemeManager.p.card) }
              static var storeCardAlt: Color  { rgb(ThemeManager.p.cardAlt) }
              static var storeText: Color     { rgb(ThemeManager.p.text) }
              static var storeSub: Color      { rgb(ThemeManager.p.sub) }
              static var storeDivider: Color  { rgb(ThemeManager.p.divider) }
          }

          extension UIImage {
              static func bundled(_ filename: String) -> UIImage? {
                  guard let path = Bundle.main.path(forResource: filename, ofType: nil) else { return nil }
                  return UIImage(contentsOfFile: path)
              }
          }
          VIPEOF

      # =========================================================
      # SOURCE CODE - HapticManager.swift
      # =========================================================
      - name: Generate code - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import UserNotifications

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  UINotificationFeedbackGenerator().notificationOccurred(type)
              }
              func selection() { UISelectionFeedbackGenerator().selectionChanged() }
              func success() { notification(.success) }
              func error() { notification(.error) }
          }

          final class ForegroundNotificationDelegate: NSObject, UNUserNotificationCenterDelegate {
              static let shared = ForegroundNotificationDelegate()

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                          willPresent notification: UNNotification,
                                          withCompletionHandler completionHandler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  completionHandler([.banner, .list, .sound, .badge])
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                          didReceive response: UNNotificationResponse,
                                          withCompletionHandler completionHandler: @escaping () -> Void) {
                  completionHandler()
              }
          }

          struct XcodeCardModifier: ViewModifier {
              var radius: CGFloat = 12
              func body(content: Content) -> some View {
                  content
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(Color.xcodeEditor)
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(Color.xcodeDivider, lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
              }
          }

          extension View {
              func xcodeCard(radius: CGFloat = 12) -> some View {
                  modifier(XcodeCardModifier(radius: radius))
              }
          }

          // ScreenCaptureService (without notification)
          final class ScreenCaptureService: ObservableObject {
              static let shared = ScreenCaptureService()

              @Published var lastScreenshot: UIImage? = nil
              @Published var showThanksOverlay: Bool = false

              private var observer: NSObjectProtocol?

              private init() {}

              func start() {
                  // No screenshot detection needed
              }

              func stop() {
                  if let obs = observer {
                      NotificationCenter.default.removeObserver(obs)
                      observer = nil
                  }
              }

              func dismissOverlay() {
                  showThanksOverlay = false
              }
          }
          VIPEOF

      # =========================================================
      # SOURCE CODE - Models.swift
      # =========================================================
      - name: Generate code - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import Foundation

          // ==================== Remote Store API models ====================
          struct StoreAPIResponse: Codable {
              let lastUpdated: String?
              let apps: [StoreAPIApp]

              enum CodingKeys: String, CodingKey {
                  case lastUpdated = "last_updated"
                  case apps
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)

                  self.lastUpdated = try? c.decode(String.self, forKey: .lastUpdated)

                  if let arr = try? c.decode([StoreAPIApp].self, forKey: .apps) {
                      self.apps = arr
                      return
                  }

                  struct Envelope: Codable {
                      let success: Bool?
                      let count: Int?
                      let apps: [StoreAPIApp]
                  }
                  if let env = try? c.decode(Envelope.self, forKey: .apps) {
                      self.apps = env.apps
                      return
                  }

                  if let one = try? c.decode(StoreAPIApp.self, forKey: .apps) {
                      self.apps = [one]
                      return
                  }

                  self.apps = []
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encodeIfPresent(lastUpdated, forKey: .lastUpdated)
                  try c.encode(apps, forKey: .apps)
              }
          }

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let bundleVersion: String?
              let ipaSize: String?
              let githubUrl: String?
              let archiveUrl: String?
              let ipaUrl: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let createdAt: String?
              let updatedAt: String?

              let downloadURL: String?
              let down: String?
              let iconURL: String?
              let localizedDescription: String?
              let developerName: String?
              let version: String?
              let versionDate: String?
              let fullDate: String?
              let size: Double?
              let type: Int?

              enum CodingKeys: String, CodingKey {
                  case id, name
                  case bundleId = "bundle_id"
                  case bundleIdAlt = "bundleID"
                  case bundleIdentifier
                  case bundleVersion = "bundle_version"
                  case ipaSize = "ipa_size"
                  case githubUrl = "github_url"
                  case archiveUrl = "archive_url"
                  case ipaUrl = "ipa_url"
                  case host
                  case icon
                  case iconURL
                  case description
                  case localizedDescription
                  case screenshots, category
                  case createdAt = "created_at"
                  case updatedAt = "updated_at"
                  case downloadURL
                  case down
                  case developerName
                  case version
                  case versionDate
                  case fullDate
                  case size, type
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  if let intId = try? c.decode(Int.self, forKey: .id) {
                      self.id = intId
                  } else {
                      let bundle = (try? c.decode(String.self, forKey: .bundleIdAlt))
                          ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                          ?? UUID().uuidString
                      self.id = abs(bundle.hashValue)
                  }
                  self.name = (try? c.decode(String.self, forKey: .name)) ?? "Untitled"
                  self.bundleId = (try? c.decode(String.self, forKey: .bundleId))
                      ?? (try? c.decode(String.self, forKey: .bundleIdAlt))
                      ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                  self.bundleVersion = (try? c.decode(String.self, forKey: .bundleVersion))
                      ?? (try? c.decode(String.self, forKey: .version))
                  self.ipaSize = (try? c.decode(String.self, forKey: .ipaSize))
                  self.githubUrl = (try? c.decode(String.self, forKey: .githubUrl))
                  self.archiveUrl = (try? c.decode(String.self, forKey: .archiveUrl))
                  self.ipaUrl = (try? c.decode(String.self, forKey: .ipaUrl))
                      ?? (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.host = (try? c.decode(String.self, forKey: .host))
                  self.icon = (try? c.decode(String.self, forKey: .icon))
                      ?? (try? c.decode(String.self, forKey: .iconURL))
                  self.description = (try? c.decode(String.self, forKey: .description))
                      ?? (try? c.decode(String.self, forKey: .localizedDescription))
                  self.screenshots = try? c.decode([String].self, forKey: .screenshots)
                  self.category = (try? c.decode(String.self, forKey: .category))
                  self.createdAt = (try? c.decode(String.self, forKey: .createdAt))
                  self.updatedAt = (try? c.decode(String.self, forKey: .updatedAt))
                      ?? (try? c.decode(String.self, forKey: .versionDate))
                      ?? (try? c.decode(String.self, forKey: .fullDate))
                  self.downloadURL = (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.down = (try? c.decode(String.self, forKey: .down))
                  self.iconURL = (try? c.decode(String.self, forKey: .iconURL))
                  self.localizedDescription = (try? c.decode(String.self, forKey: .localizedDescription))
                  self.developerName = (try? c.decode(String.self, forKey: .developerName))
                  self.version = (try? c.decode(String.self, forKey: .version))
                  self.versionDate = (try? c.decode(String.self, forKey: .versionDate))
                  self.fullDate = (try? c.decode(String.self, forKey: .fullDate))
                  self.size = (try? c.decode(Double.self, forKey: .size))
                  self.type = (try? c.decode(Int.self, forKey: .type))
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encode(id, forKey: .id)
                  try c.encode(name, forKey: .name)
                  try c.encodeIfPresent(bundleId, forKey: .bundleId)
                  try c.encodeIfPresent(bundleVersion, forKey: .bundleVersion)
                  try c.encodeIfPresent(ipaSize, forKey: .ipaSize)
                  try c.encodeIfPresent(githubUrl, forKey: .githubUrl)
                  try c.encodeIfPresent(archiveUrl, forKey: .archiveUrl)
                  try c.encodeIfPresent(ipaUrl, forKey: .ipaUrl)
                  try c.encodeIfPresent(host, forKey: .host)
                  try c.encodeIfPresent(icon, forKey: .icon)
                  try c.encodeIfPresent(description, forKey: .description)
                  try c.encodeIfPresent(screenshots, forKey: .screenshots)
                  try c.encodeIfPresent(category, forKey: .category)
                  try c.encodeIfPresent(createdAt, forKey: .createdAt)
                  try c.encodeIfPresent(updatedAt, forKey: .updatedAt)
              }

              var cleanSize: String {
                  if let s = size, s > 0 {
                      let f = ByteCountFormatter()
                      f.allowedUnits = [.useMB, .useGB, .useKB]
                      f.countStyle = .file
                      return f.string(fromByteCount: Int64(s))
                  }
                  if let s = ipaSize, !s.isEmpty { return s }
                  return "-"
              }

              var cleanDescription: String {
                  let raw = description ?? localizedDescription ?? ""
                  if raw.isEmpty {
                      return "Exclusive app on ONEs Store - download the premium version with all features enabled."
                  }
                  let lines = raw.split(whereSeparator: { $0.isNewline || $0 == "\r" })
                  return lines.joined(separator: " ").trimmingCharacters(in: .whitespacesAndNewlines)
              }

              var resolvedDownloadURL: String? {
                  return ipaUrl ?? downloadURL ?? down ?? githubUrl ?? archiveUrl
              }
          }

          // ==================== Download Repositories ====================
          struct DownloadRepository: Codable, Identifiable, Hashable {
              let id: String
              let name: String
              let feedURL: String
              let homepage: String
              let enabled: Bool
              let maxGB: Double

              init(id: String, name: String, feedURL: String, homepage: String, enabled: Bool = true, maxGB: Double = 250) {
                  self.id = id
                  self.name = name
                  self.feedURL = feedURL
                  self.homepage = homepage
                  self.enabled = enabled
                  self.maxGB = maxGB
              }
          }

          struct DownloadQuota: Codable, Identifiable, Hashable {
              let id: String
              let totalBytes: Int64
              let usedBytes: Int64
              var freeBytes: Int64 { max(0, totalBytes - usedBytes) }
              var freeGB: Double { Double(freeBytes) / 1_073_741_824.0 }
              var usedGB: Double { Double(usedBytes) / 1_073_741_824.0 }
              var totalGB: Double { Double(totalBytes) / 1_073_741_824.0 }
          }
          VIPEOF

