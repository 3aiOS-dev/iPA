          // ================= POST CARD — Twitter-style =================
          struct ONEsPostCard: View {
              let post: ONEsPost
              var anonymous: Bool = false
              @ObservedObject private var content = ONEsContent.shared
              @ObservedObject private var session = ONEsSession.shared
              @ObservedObject private var extras = ONEsSocialExtras.shared
              @State private var showReport = false
              @State private var showComments = false
              @State private var burst = false
              @State private var likeScale: CGFloat = 1
              @State private var showProfile = false

              private var authorName: String { content.names[post.author] ?? "مستخدم" }
              private var liked: Bool { content.likedIDs.contains(post.id) }
              private var reposted: Bool { content.repostedIDs.contains(post.id) }

              var body: some View {
                  VStack(alignment: .leading, spacing: 0) {
                      if post.pinned {
                          HStack(spacing: 6) {
                              Image(systemName: "pin.fill").font(.system(size: 10))
                              Text("مثبّت").font(.system(size: 11, weight: .bold))
                          }
                          .foregroundColor(.orange)
                          .padding(.horizontal, 16)
                          .padding(.bottom, 8)
                      }

                      HStack(alignment: .top, spacing: 12) {
                          // Avatar
                          if anonymous {
                              ONEsAvatar(name: "?", uid: post.author, size: 40, ring: false, hideForAnonymous: true)
                          } else {
                              ONEsAvatar(name: authorName, uid: post.author, size: 40, ring: post.pinned)
                          }

                          // Content
                          VStack(alignment: .leading, spacing: 6) {
                              // Header row
                              HStack(spacing: 6) {
                                  if anonymous {
                                      Text("ناشر مجهول")
                                          .font(.system(size: 14, weight: .bold))
                                          .foregroundColor(.white.opacity(0.85))
                                      Image(systemName: "eye.slash.fill")
                                          .font(.system(size: 10))
                                          .foregroundColor(.white.opacity(0.35))
                                  } else {
                                      Text(authorName)
                                          .font(.system(size: 14, weight: .bold))
                                          .foregroundColor(.white)
                                      Image(systemName: "checkmark.seal.fill")
                                          .font(.system(size: 11))
                                          .foregroundColor(Color.storePrimary)
                                      Text(onesHandle(authorName))
                                          .font(.system(size: 13))
                                          .foregroundColor(.white.opacity(0.4))
                                          .lineLimit(1)
                                  }
                                  Text("·").foregroundColor(.white.opacity(0.3))
                                  Text(onesTimeAgo(post.createdAt))
                                      .font(.system(size: 13))
                                      .foregroundColor(.white.opacity(0.4))
                                  Spacer(minLength: 0)
                                  if true {
                                      Menu {
                                          Button { showProfile = true } label: {
                                              Label("عرض الملف الشخصي", systemImage: "person.crop.circle")
                                          }
                                          Button { extras.toggleFollow(post.author) } label: {
                                              Label(extras.following.contains(post.author) ? "إلغاء المتابعة" : "متابعة \(authorName)",
                                                    systemImage: "person.badge.plus")
                                          }
                                          Button { extras.toggleBookmark(post.id) } label: {
                                              Label(extras.bookmarks.contains(post.id) ? "إزالة من المحفوظات" : "حفظ المنشور",
                                                    systemImage: "bookmark")
                                          }
                                          Button { showReport = true } label: {
                                              Label("إبلاغ", systemImage: "flag")
                                          }
                                          if session.isSignedIn && session.userID == post.author {
                                              Button(role: .destructive) { content.deletePost(post) } label: {
                                                  Label("حذف", systemImage: "trash")
                                              }
                                          }
                                      } label: {
                                          Image(systemName: "ellipsis")
                                              .font(.system(size: 14, weight: .bold))
                                              .foregroundColor(.white.opacity(0.4))
                                              .padding(6)
                                      }
                                  }
                              }

                              // Kind badge
                              if post.kind == "news" {
                                  HStack(spacing: 4) {
                                      Image(systemName: "newspaper.fill").font(.system(size: 9))
                                      Text("خبر")
                                  }
                                  .font(.system(size: 10, weight: .black))
                                  .foregroundColor(.blue)
                                  .padding(.horizontal, 8).padding(.vertical, 3)
                                  .background(Capsule().fill(Color.blue.opacity(0.15)))
                              } else if post.kind == "offer" {
                                  HStack(spacing: 4) {
                                      Image(systemName: "tag.fill").font(.system(size: 9))
                                      Text("عرض")
                                  }
                                  .font(.system(size: 10, weight: .black))
                                  .foregroundColor(.orange)
                                  .padding(.horizontal, 8).padding(.vertical, 3)
                                  .background(Capsule().fill(Color.orange.opacity(0.15)))
                              }

                              // Body text
                              if !post.body.isEmpty {
                                  ONEsRichText(text: post.body, baseSize: 15)
                              }

                              // Image
                              if !post.image.isEmpty {
                                  ZStack {
                                      ONEsRemoteImage(url: post.image, height: 220, corner: 16)
                                      if burst {
                                          Image(systemName: "heart.fill")
                                              .font(.system(size: 70))
                                              .foregroundColor(.white.opacity(0.9))
                                              .scaleEffect(burst ? 1 : 0.4)
                                              .transition(.scale.combined(with: .opacity))
                                      }
                                  }
                                  .onTapGesture(count: 2) { doubleTapLike() }
                              }

                              // Action bar — Twitter style
                              HStack(spacing: 0) {
                                  actionButton(icon: "bubble.left", count: extras.counts[post.id] ?? 0,
                                               active: false, tint: Color.storePrimary) {
                                      showComments = true
                                  }
                                  Spacer()
                                  actionButton(icon: "arrow.2.squarepath", count: post.reposts,
                                               active: reposted, tint: .green) {
                                      content.toggleRepost(post)
                                  }
                                  Spacer()
                                  actionButton(icon: liked ? "heart.fill" : "heart", count: post.likes,
                                               active: liked, tint: .pink) {
                                      tapLike()
                                  }
                                  .scaleEffect(likeScale)
                                  Spacer()
                                  Button { extras.toggleBookmark(post.id) } label: {
                                      Image(systemName: extras.bookmarks.contains(post.id) ? "bookmark.fill" : "bookmark")
                                          .font(.system(size: 14))
                                          .foregroundColor(extras.bookmarks.contains(post.id) ? Color.storePrimary : .white.opacity(0.4))
                                  }
                                  .buttonStyle(.plain)
                                  Spacer()
                                  Button {
                                      let text = post.body + "\n\nONEs Store"
                                      let av = UIActivityViewController(activityItems: [text], applicationActivities: nil)
                                      UIApplication.shared.connectedScenes
                                          .compactMap { ($0 as? UIWindowScene)?.keyWindow?.rootViewController }
                                          .first?.present(av, animated: true)
                                  } label: {
                                      Image(systemName: "square.and.arrow.up")
                                          .font(.system(size: 14))
                                          .foregroundColor(.white.opacity(0.4))
                                  }
                                  .buttonStyle(.plain)
                              }
                              .padding(.top, 8)
                          }
                      }
                      .padding(.horizontal, 16)
                      .padding(.vertical, 12)
                  }
                  .background(
                      RoundedRectangle(cornerRadius: 0)
                          .fill(Color.storeBg)
                  )
                  .overlay(
                      VStack {
                          Spacer()
                          Divider().overlay(Color.white.opacity(0.06))
                      }
                  )
                  .sheet(isPresented: $showReport) {
                      ONEsReportSheet(kind: "post", targetID: post.id, appName: "منشور " + (anonymous ? "في ONEs" : authorName), bundleID: "")
                  }
                  .sheet(isPresented: $showComments) {
                      ONEsCommentsSheet(post: post)
                  }
                  .sheet(isPresented: $showProfile) {
                      ONEsUserProfileSheet(uid: post.author)
                  }
                  .onAppear { if extras.counts[post.id] == nil { extras.loadComments(for: post.id) } }
              }

              private func tapLike() {
                  withAnimation(.spring(response: 0.25, dampingFraction: 0.4)) { likeScale = 1.3 }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.2) {
                      withAnimation(.spring(response: 0.3, dampingFraction: 0.6)) { likeScale = 1 }
                  }
                  content.toggleLike(post)
              }

              private func doubleTapLike() {
                  if !liked { content.toggleLike(post) }
                  withAnimation(.spring(response: 0.3, dampingFraction: 0.5)) { burst = true }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                      withAnimation(.easeOut(duration: 0.25)) { burst = false }
                  }
              }

              @ViewBuilder
              private func actionButton(icon: String, count: Int, active: Bool, tint: Color, action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      HStack(spacing: 5) {
                          Image(systemName: icon)
                              .font(.system(size: 14))
                          if count > 0 {
                              Text("\(count)")
                                  .font(.system(size: 12, weight: .semibold))
                          }
                      }
                      .foregroundColor(active ? tint : .white.opacity(0.4))
                  }
                  .buttonStyle(.plain)
              }
          }

