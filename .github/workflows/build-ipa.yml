                      Color.storeBg.edgesIgnoringSafeArea(.all)

                      ZStack {
                          StoreHomeView(feed: feed,
                                       onMenu: { openSettings() })
                              .opacity(tab == 0 ? 1 : 0)
                              .allowsHitTesting(tab == 0)
                          FavoritesView(feed: feed,
