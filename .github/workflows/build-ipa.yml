                              .font(.system(size: 11, weight: selected ? .bold : .medium))
                      }
                      .foregroundColor(selected ? .white : .primary)
                      .padding(.horizontal, 12)
                      .padding(.vertical, 6)
                      .background(
                          Capsule().fill(selected ? color : Color.gray.opacity(0.12))
                      )
                  }
              }
          }

          struct EnhancedAppCard: View {
              let app: AppItem
              @ObservedObject var downloadManager: DownloadManager

              var isDownloading: Bool {
                  downloadManager.downloads.contains { $0.appID == app.id && $0.isActive }
              }

              var body: some View {
                  HStack(spacing: 12) {
                      ZStack(alignment: .bottomTrailing) {
                          CachedAsyncImage(url: URL(string: app.iconURL)) { phase in
                              if let img = phase.image {
                                  img.resizable().aspectRatio(contentMode: .fill)
                                      .frame(width: 52, height: 52)
                                      .clipShape(RoundedRectangle(cornerRadius: 12))
                              } else {
                                  RoundedRectangle(cornerRadius: 12)
                                      .fill(Color.xcodeBlue.opacity(0.1))
                                      .frame(width: 52, height: 52)
                                      .overlay(Image(systemName: "app.fill")
                                          .font(.system(size: 20))
                                          .foregroundColor(.xcodeBlue.opacity(0.3)))
                              }
                          }
                          if app.isNew {
                              Text("NEW")
                                  .font(.system(size: 6, weight: .black))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 3)
                                  .padding(.vertical, 1)
                                  .background(Capsule().fill(Color.xcodeGreen))
                                  .offset(x: 3, y: 3)
                          }
                      }

                      VStack(alignment: .trailing, spacing: 4) {
                          HStack(spacing: 5) {
                              if app.isPopular {
                                  Image(systemName: "flame.fill")
                                      .font(.system(size: 9))
                                      .foregroundColor(.xcodeOrange)
                              }
                              SourceBadge(source: app.source)
                              Spacer()
                              Text(app.name)
                                  .font(.system(size: 14, weight: .bold))
                                  .lineLimit(1)
                          }
                          Text(app.developerName)
                              .font(.system(size: 10))
                              .foregroundColor(.xcodeSecondary)
                              .lineLimit(1)
                              .frame(maxWidth: .infinity, alignment: .trailing)
                          HStack(spacing: 6) {
                              Spacer()
                              Label(app.formattedSize, systemImage: "internaldrive")
                                  .font(.system(size: 9))
                                  .foregroundColor(.xcodeSecondary)
                              Label(app.formattedDate, systemImage: "calendar")
                                  .font(.system(size: 9))
                                  .foregroundColor(.xcodeSecondary)
                              if let cat = app.category {
                                  Text(cat)
                                      .font(.system(size: 8, weight: .medium))
                                      .foregroundColor(.xcodeBlue)
                                      .padding(.horizontal, 5)
                                      .padding(.vertical, 2)
                                      .background(Capsule().fill(Color.xcodeBlue.opacity(0.1)))
                              }
                          }
                          HStack(spacing: 5) {
                              Spacer()
                              Text(app.subscriptionType)
                                  .font(.system(size: 8, weight: .semibold))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 6)
                                  .padding(.vertical, 2)
                                  .background(Capsule().fill(Color.xcodePurple))
                              let desc = app.localizedDescription
                                  .replacingOccurrences(of: "Injected with ", with: "")
                              if !desc.isEmpty {
                                  Text(desc.components(separatedBy: .whitespaces).prefix(3).joined(separator: " "))
                                      .font(.system(size: 8))
                                      .foregroundColor(.xcodeSecondary)
                                      .lineLimit(1)
                              }
                          }
                      }
                  }
                  .padding(10)
                  .xcodeCard(radius: 14)
                  .overlay(
                      RoundedRectangle(cornerRadius: 14)
                          .stroke(app.isNew ? Color.xcodeGreen.opacity(0.2) : Color.clear, lineWidth: app.isNew ? 1 : 0)
                  )
              }
          }
          VIPEOF

      - name: توليد الكود - DownloadsTabView.swift (تبويب التحميلات الحقيقي)
        run: |
          cat > DownloadsTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          struct DownloadsTabView: View {
              @ObservedObject var downloadManager: DownloadManager
              @Environment(\.colorScheme) var scheme
              @State private var selectedTask: DownloadTask?
              @State private var showActionSheet = false
              @State private var taskToDelete: DownloadTask?

              var activeDownloads: [DownloadTask] {
                  downloadManager.downloads.filter { $0.isActive }
              }

              var completedDownloads: [DownloadTask] {
                  downloadManager.downloads.filter { $0.state == .completed }
              }

              var failedDownloads: [DownloadTask] {
                  downloadManager.downloads.filter { $0.state == .failed }
              }

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 16) {
                              // Header Banner
                              DownloadsBanner(
                                  activeCount: activeDownloads.count,
                                  completedCount: completedDownloads.count,
                                  totalBytes: downloadManager.totalDownloadedBytes
                              )
                              .padding(.horizontal)
                              .padding(.top, 4)

                              if downloadManager.downloads.isEmpty {
                                  XcodeEmptyState(
                                      icon: "arrow.down.circle",
                                      title: "لا توجد تحميلات",
                                      subtitle: "انتقل إلى التطبيقات واضغط تحميل لبدء التنزيل"
                                  )
                              } else {
                                  // Active Downloads
                                  if !activeDownloads.isEmpty {
                                      XcodeSectionHeader(title: "⏳ قيد التحميل", icon: "arrow.down.circle.fill")
                                      LazyVStack(spacing: 10) {
                                          ForEach(activeDownloads) { task in
                                              ActiveDownloadRow(task: task, downloadManager: downloadManager)
                                                  .padding(.horizontal)
                                          }
                                      }
                                  }

                                  // Failed Downloads
                                  if !failedDownloads.isEmpty {
                                      XcodeSectionHeader(title: "❌ فشل التحميل", icon: "xmark.circle.fill")
                                      LazyVStack(spacing: 10) {
                                          ForEach(failedDownloads) { task in
                                              FailedDownloadRow(task: task, downloadManager: downloadManager)
                                                  .padding(.horizontal)
                                          }
                                      }
                                  }

                                  // Completed Downloads
                                  if !completedDownloads.isEmpty {
                                      XcodeSectionHeader(title: "✅ مكتمل", icon: "checkmark.circle.fill")
                                      LazyVStack(spacing: 10) {
                                          ForEach(completedDownloads) { task in
                                              CompletedDownloadRow(
                                                  task: task,
                                                  downloadManager: downloadManager,
                                                  onDelete: { taskToDelete = task }
                                              )
                                              .padding(.horizontal)
                                          }
                                      }
                                  }
                              }
                          }
                          .padding(.bottom, 20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 6) {
                                  Image(systemName: "arrow.down.circle.fill")
                                      .foregroundColor(.xcodeBlue)
                                  Text("التحميلات")
                                      .font(.system(size: 17, weight: .heavy))
                                      .foregroundColor(.primary)
                              }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              if !downloadManager.downloads.isEmpty {
                                  Button {
                                      HapticManager.shared.impact(.light)
                                      // Clear completed
                                      for task in downloadManager.downloads where task.state == .completed || task.state == .failed {
                                          downloadManager.deleteDownload(id: task.id)
                                      }
                                  } label: {
                                      Image(systemName: "trash")
                                          .foregroundColor(.xcodeRed)
                                  }
                              }
                          }
                      }
                  }
                  .confirmationDialog(
                      "حذف التحميل؟",
                      isPresented: Binding(
                          get: { taskToDelete != nil },
                          set: { if !$0 { taskToDelete = nil } }
                      ),
                      titleVisibility: .visible
                  ) {
                      Button("حذف", role: .destructive) {
                          if let task = taskToDelete {
                              downloadManager.deleteDownload(id: task.id)
                          }
                          taskToDelete = nil
                      }
                      Button("إلغاء", role: .cancel) { taskToDelete = nil }
                  } message: {
                      Text(taskToDelete?.appName ?? "")
                  }
              }
          }

          // MARK: - Downloads Banner
          struct DownloadsBanner: View {
              let activeCount: Int
              let completedCount: Int
              let totalBytes: Int64

              var body: some View {
                  HStack(spacing: 12) {
                      ZStack {
                          Circle()
                              .fill(Color.xcodeBlue.opacity(0.15))
                              .frame(width: 48, height: 48)
                          Image(systemName: "arrow.down.circle.fill")
                              .font(.system(size: 24))
                              .foregroundColor(.xcodeBlue)
                      }

                      VStack(alignment: .trailing, spacing: 3) {
                          Text("إدارة التحميلات")
                              .font(.system(size: 16, weight: .heavy))
                          HStack(spacing: 8) {
                              Text("\(activeCount) نشط")
                                  .font(.system(size: 10, weight: .medium))
                                  .foregroundColor(.xcodeBlue)
                              Text("\(completedCount) مكتمل")
                                  .font(.system(size: 10, weight: .medium))
                                  .foregroundColor(.xcodeGreen)
                          }
                      }
                      Spacer()

                      VStack(alignment: .trailing, spacing: 2) {
                          Text(ByteCountFormatter.string(fromByteCount: totalBytes, countStyle: .file))
                              .font(.system(size: 16, weight: .black, design: .rounded))
                              .foregroundColor(.xcodeBlue)
                          Text("إجمالي المحمل")
                              .font(.system(size: 9))
                              .foregroundColor(.xcodeSecondary)
                      }
                  }
                  .padding(12)
                  .xcodeCard(radius: 14)
                  .overlay(
                      RoundedRectangle(cornerRadius: 14)
                          .stroke(Color.xcodeBlue.opacity(0.1), lineWidth: 0.5)
                  )
              }
          }

          // MARK: - Active Download Row
          struct ActiveDownloadRow: View {
              let task: DownloadTask
              @ObservedObject var downloadManager: DownloadManager

              var body: some View {
                  VStack(spacing: 10) {
                      HStack(spacing: 12) {
                          // App Icon
                          ZStack {
                              RoundedRectangle(cornerRadius: 10)
                                  .fill(Color.xcodeBlue.opacity(0.1))
                                  .frame(width: 44, height: 44)
                              CachedAsyncImage(url: URL(string: task.appIconURL)) { phase in
                                  if let img = phase.image {
                                      img.resizable().aspectRatio(contentMode: .fill)
                                          .frame(width: 40, height: 40)
                                          .clipShape(RoundedRectangle(cornerRadius: 8))
                                  } else {
                                      Image(systemName: "app.fill")
                                          .font(.system(size: 20))
                                          .foregroundColor(.xcodeBlue.opacity(0.4))
                                  }
                              }
                          }

                          VStack(alignment: .trailing, spacing: 3) {
                              Text(task.appName)
                                  .font(.system(size: 14, weight: .bold))
                                  .lineLimit(1)
                              HStack(spacing: 6) {
                                  Text(task.state.displayName)
                                      .font(.system(size: 10, weight: .semibold))
                                      .foregroundColor(task.state.color)
                                  Text("\(task.formattedDownloaded) / \(task.formattedTotal)")
                                      .font(.system(size: 10))
                                      .foregroundColor(.xcodeSecondary)
                              }
                          }
                          Spacer()

                          // Control buttons
                          HStack(spacing: 8) {
                              if task.state == .downloading {
                                  Button {
                                      downloadManager.pauseDownload(id: task.id)
                                  } label: {
                                      Image(systemName: "pause.circle.fill")
                                          .font(.system(size: 26))
                                          .foregroundColor(.xcodeOrange)
                                  }
                              } else if task.state == .paused {
                                  Button {
                                      downloadManager.resumeDownload(id: task.id)
                                  } label: {
                                      Image(systemName: "play.circle.fill")
                                          .font(.system(size: 26))
                                          .foregroundColor(.xcodeGreen)
                                  }
                              }

                              Button {
                                  downloadManager.cancelDownload(id: task.id)
                              } label: {
                                  Image(systemName: "xmark.circle.fill")
                                      .font(.system(size: 22))
                                      .foregroundColor(.xcodeRed.opacity(0.7))
                              }
                          }
                      }

                      // Progress Bar
                      VStack(alignment: .trailing, spacing: 4) {
                          XcodeProgressBar(progress: task.progress, color: task.state.color, height: 5)
                          HStack {
                              Spacer()
                              Text(task.progressPercentage)
                                  .font(.system(size: 11, weight: .bold, design: .monospaced))
                                  .foregroundColor(task.state.color)
                          }
                      }
                  }
                  .padding(12)
                  .xcodeCard(radius: 12)
                  .overlay(
                      RoundedRectangle(cornerRadius: 12)
                          .stroke(task.state.color.opacity(0.2), lineWidth: 1)
                  )
              }
          }

          // MARK: - Failed Download Row
          struct FailedDownloadRow: View {
              let task: DownloadTask
              @ObservedObject var downloadManager: DownloadManager

              var body: some View {
                  HStack(spacing: 12) {
                      ZStack {
                          RoundedRectangle(cornerRadius: 10)
                              .fill(Color.xcodeRed.opacity(0.1))
                              .frame(width: 44, height: 44)
                          Image(systemName: "app.fill")
                              .font(.system(size: 20))
