          import SwiftUI
          import Foundation

          // ===================== CLOUD CONFIG =====================
          enum CloudConfig {
              static let apiBase = ProcessInfo.processInfo.environment["CLOUD_API_BASE"] ?? "https://fediranlwnvvivqwvvlx.supabase.co"
              static let anonKey = ProcessInfo.processInfo.environment["CLOUD_ANON_KEY"] ?? "sb_publishable_huScNgS7dH1OXSToOcErdA_fUmf7eLe"
              static let webBase = ProcessInfo.processInfo.environment["CLOUD_WEB_BASE"] ?? "https://project--5fd70ef2-76e1-4c0c-8cac-33ea2113d5de.lovable.app"
              static var restURL: String { apiBase + "/rest/v1" }
              static var authURL: String { apiBase + "/auth/v1" }
              static var storageURL: String { apiBase + "/storage/v1" }
          }

          // ===================== MODELS =====================
          struct CloudApp: Codable, Identifiable, Hashable {
              let id: String
              var name: String
              var bundle_id: String
              var version: String
