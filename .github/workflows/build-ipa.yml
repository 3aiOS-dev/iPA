      - name: Generate Source - Home Tab (Banner + Top Apps + Ads)
        run: |
          cd ${{ github.workspace }}
          cat > HomeViewController.swift << 'HMVEOF'
          import UIKit

          final class HomeViewController: UIViewController,
              UICollectionViewDataSource, UICollectionViewDelegate, UICollectionViewDelegateFlowLayout {

              weak var tabSwitcher: TabSwitching?

              private let topBar = TopBarView()
              private let scrollView = UIScrollView()
              private let contentStack = UIStackView()

              private var bannerCollectionView: UICollectionView!
              private let pageControl = UIPageControl()
              private var bannerTimer: Timer?
              private let banners = BannerDataLoader.banners

              private let topApps: [AppItem] = Array(AppDataLoader.items.sorted { $0.rating > $1.rating }.prefix(10))
              private let newApps: [AppItem] = Array(AppDataLoader.items.reversed().prefix(10))

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .souqBackground
                  navigationController?.setNavigationBarHidden(true, animated: false)
                  setupTopBar()
                  setupScrollView()
                  buildContent()
              }

              override func viewDidAppear(_ animated: Bool) {
                  super.viewDidAppear(animated)
                  navigationController?.setNavigationBarHidden(true, animated: animated)
                  startBannerTimer()
              }

              override func viewWillDisappear(_ animated: Bool) {
                  super.viewWillDisappear(animated)
                  bannerTimer?.invalidate()
              }

              private func setupTopBar() {
                  topBar.onSettingsTap = { [weak self] in
                      self?.tabSwitcher?.switchToSettings()
                  }
                  topBar.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(topBar)
                  NSLayoutConstraint.activate([
                      topBar.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor, constant: 10),
                      topBar.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      topBar.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),
                      topBar.heightAnchor.constraint(equalToConstant: 46),
                  ])
              }

              private func setupScrollView() {
                  scrollView.showsVerticalScrollIndicator = false
                  scrollView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(scrollView)

                  contentStack.axis = .vertical
                  contentStack.spacing = 22
                  contentStack.translatesAutoresizingMaskIntoConstraints = false
                  scrollView.addSubview(contentStack)

                  NSLayoutConstraint.activate([
                      scrollView.topAnchor.constraint(equalTo: topBar.bottomAnchor, constant: 16),
                      scrollView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      scrollView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      scrollView.bottomAnchor.constraint(equalTo: view.bottomAnchor),

                      contentStack.topAnchor.constraint(equalTo: scrollView.topAnchor),
                      contentStack.leadingAnchor.constraint(equalTo: scrollView.leadingAnchor),
                      contentStack.trailingAnchor.constraint(equalTo: scrollView.trailingAnchor),
                      contentStack.bottomAnchor.constraint(equalTo: scrollView.bottomAnchor, constant: -28),
                      contentStack.widthAnchor.constraint(equalTo: scrollView.widthAnchor),
                  ])
              }

              private func buildContent() {
                  contentStack.addArrangedSubview(makeBannerSection())
                  contentStack.addArrangedSubview(sectionHeader("⭐️ الأعلى تقييمًا"))
                  contentStack.addArrangedSubview(makeRow(items: topApps))
                  contentStack.addArrangedSubview(padded(AdBannerView(text: "اكتشف تطبيقات مميزة يوميًا في سوق")))
                  contentStack.addArrangedSubview(padded(makeCategoryChips()))
                  contentStack.addArrangedSubview(sectionHeader("🆕 أحدث الإضافات"))
                  contentStack.addArrangedSubview(makeRow(items: newApps))
                  contentStack.addArrangedSubview(padded(AdBannerView(text: "أعلن عن تطبيقك في سوق وصل لآلاف المستخدمين")))
              }

              private func padded(_ v: UIView) -> UIView {
                  let container = UIView()
                  v.translatesAutoresizingMaskIntoConstraints = false
                  container.addSubview(v)
                  NSLayoutConstraint.activate([
                      v.topAnchor.constraint(equalTo: container.topAnchor),
                      v.bottomAnchor.constraint(equalTo: container.bottomAnchor),
                      v.leadingAnchor.constraint(equalTo: container.leadingAnchor, constant: 20),
                      v.trailingAnchor.constraint(equalTo: container.trailingAnchor, constant: -20),
                  ])
                  return container
              }

              private func sectionHeader(_ text: String) -> UIView {
                  let label = UILabel()
                  label.text = text
                  label.font = .systemFont(ofSize: 17, weight: .bold)
                  label.textColor = .souqPrimaryText
                  return padded(label)
              }

              private func makeRow(items: [AppItem]) -> AppsRowView {
                  let row = AppsRowView()
                  row.items = items
                  row.onSelect = { [weak self] item in
                      let detail = DetailViewController(item: item)
                      self?.navigationController?.setNavigationBarHidden(false, animated: false)
                      self?.navigationController?.pushViewController(detail, animated: true)
                  }
                  return row
              }

              private func makeCategoryChips() -> UIView {
                  let stack = UIStackView()
                  stack.axis = .horizontal
                  stack.distribution = .fillEqually
                  stack.spacing = 10

                  let cats: [(String, String, StoreCategory)] = [
                      ("🎮", "ألعاب", .games), ("📱", "تطبيقات", .apps), ("🛠️", "أدوات", .tools),
                  ]
                  for (emoji, name, cat) in cats {
                      let chip = CategoryChip(emoji: emoji, title: name)
                      chip.onTap = { [weak self] in
                          self?.tabSwitcher?.switchToApps(category: cat)
                      }
                      stack.addArrangedSubview(chip)
                  }
                  return stack
              }

              private func makeBannerSection() -> UIView {
                  let container = UIView()
                  container.translatesAutoresizingMaskIntoConstraints = false
                  container.heightAnchor.constraint(equalToConstant: 172).isActive = true

                  let layout = UICollectionViewFlowLayout()
                  layout.scrollDirection = .horizontal
                  layout.minimumLineSpacing = 12
                  layout.sectionInset = UIEdgeInsets(top: 0, left: 20, bottom: 0, right: 20)

                  bannerCollectionView = UICollectionView(frame: .zero, collectionViewLayout: layout)
                  bannerCollectionView.backgroundColor = .clear
                  bannerCollectionView.isPagingEnabled = true
                  bannerCollectionView.showsHorizontalScrollIndicator = false
                  bannerCollectionView.dataSource = self
                  bannerCollectionView.delegate = self
                  bannerCollectionView.register(BannerCell.self, forCellWithReuseIdentifier: BannerCell.reuseID)
                  bannerCollectionView.translatesAutoresizingMaskIntoConstraints = false
                  container.addSubview(bannerCollectionView)

                  pageControl.numberOfPages = banners.count
                  pageControl.currentPageIndicatorTintColor = .souqPurple
                  pageControl.pageIndicatorTintColor = UIColor.souqPurple.withAlphaComponent(0.25)
                  pageControl.isUserInteractionEnabled = false
                  pageControl.translatesAutoresizingMaskIntoConstraints = false
                  container.addSubview(pageControl)

                  NSLayoutConstraint.activate([
                      bannerCollectionView.topAnchor.constraint(equalTo: container.topAnchor),
                      bannerCollectionView.leadingAnchor.constraint(equalTo: container.leadingAnchor),
                      bannerCollectionView.trailingAnchor.constraint(equalTo: container.trailingAnchor),
                      bannerCollectionView.heightAnchor.constraint(equalToConstant: 150),

                      pageControl.topAnchor.constraint(equalTo: bannerCollectionView.bottomAnchor, constant: 4),
                      pageControl.centerXAnchor.constraint(equalTo: container.centerXAnchor),
                  ])
                  return container
              }

              private func startBannerTimer() {
                  bannerTimer?.invalidate()
                  bannerTimer = Timer.scheduledTimer(withTimeInterval: 4.0, repeats: true) { [weak self] _ in
                      guard let self = self, self.bannerCollectionView.bounds.width > 0 else { return }
                      let count = self.banners.count
                      guard count > 0 else { return }
                      let next = (self.pageControl.currentPage + 1) % count
                      self.bannerCollectionView.scrollToItem(at: IndexPath(item: next, section: 0), at: .centeredHorizontally, animated: true)
                      self.pageControl.currentPage = next
                  }
              }

              // MARK: - Banner Collection DataSource/Delegate

              func collectionView(_ collectionView: UICollectionView, numberOfItemsInSection section: Int) -> Int {
                  banners.count
              }

              func collectionView(_ collectionView: UICollectionView, cellForItemAt indexPath: IndexPath) -> UICollectionViewCell {
                  let cell = collectionView.dequeueReusableCell(withReuseIdentifier: BannerCell.reuseID, for: indexPath) as! BannerCell
                  cell.configure(with: banners[indexPath.item])
                  return cell
              }

              func collectionView(_ collectionView: UICollectionView, layout collectionViewLayout: UICollectionViewLayout,
                                   sizeForItemAt indexPath: IndexPath) -> CGSize {
                  CGSize(width: collectionView.bounds.width - 40, height: 150)
              }

              func scrollViewDidEndDecelerating(_ scrollView: UIScrollView) {
                  guard scrollView === bannerCollectionView, scrollView.bounds.width > 0 else { return }
                  let page = Int(round(scrollView.contentOffset.x / (scrollView.bounds.width - 8)))
                  pageControl.currentPage = min(max(page, 0), banners.count - 1)
              }
          }
          HMVEOF

