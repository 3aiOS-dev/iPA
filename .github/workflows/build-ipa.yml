                  background:rgba(255,255,255,.35);left:-40px;top:-70px;animation:g1 6s ease-in-out infinite}
                  @keyframes g1{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,16px)}}
                  .shine{position:absolute;top:-60%;left:-30%;width:55%;height:220%;transform:rotate(18deg);
                  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);animation:sw 3.4s linear infinite}
                  @keyframes sw{0%{left:-40%}100%{left:120%}}
