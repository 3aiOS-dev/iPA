          // ================= APPS LIST (بدون «صفحة»، بدون فئات، مع ترتيب: الجديد أولاً) =================
          struct AppsListView: View {
              @ObservedObject var feed: StoreFeed
              @State private var searchText: String = ""

              /// ترتيب التطبيقات: الجديد أولاً، ثم الباقي أبجدياً.
              private var orderedApps: [StoreAPIApp] {
                  let recent = feed.apps.filter { feed.isRecent($0) }
                                       .sorted { (a, b) in
                                           let da = feed.publishedDateOrNow(a)
                                           let db = feed.publishedDateOrNow(b)
                                           return da > db
                                       }
                  let rest = feed.apps.filter { !feed.isRecent($0) }
                                      .sorted { $0.name.lowercased() < $1.name.lowercased() }
                  return recent + rest
              }

              private var filtered: [StoreAPIApp] {
                  let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return orderedApps }
                  return orderedApps.filter {
                      $0.name.lowercased().contains(q) || ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          ONEsTopBar()

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 12) {
                                  HStack(spacing: 8) {
                                      Image(systemName: "magnifyingglass")
                                          .foregroundColor(ONEsUI.sub)
                                      TextField("ابحث في المتجر...", text: $searchText)
                                          .font(.system(size: 14))
                                          .foregroundColor(ONEsUI.text)
                                      if !searchText.isEmpty {
                                          Button { searchText = "" } label: {
                                              Image(systemName: "xmark.circle.fill")
                                                  .foregroundColor(ONEsUI.sub)
                                          }
                                      }
                                  }
                                  .padding(.horizontal, 14)
                                  .frame(height: 46)
                                  .background(RoundedRectangle(cornerRadius: 16).fill(ONEsUI.card))
                                  .overlay(RoundedRectangle(cornerRadius: 16).stroke(ONEsUI.stroke, lineWidth: 1))
                                  .padding(.horizontal, 18)

                                  if feed.apps.isEmpty && feed.isLoading {
                                      LoadingList()
                                  } else if filtered.isEmpty {
                                      EmptyState(message: searchText.isEmpty ? "لا توجد تطبيقات في المتجر." : "لا توجد نتائج تطابق «\(searchText)».")
                                  } else {
                                      LazyVStack(spacing: 10) {
                                          ForEach(filtered) { app in
                                              NavigationLink(value: app) {
                                                  ONEsAppRow(app: app, onInstall: { openInstall(app) })
                                              }
                                              .buttonStyle(.plain)
                                          }
                                      }
                                      .padding(.horizontal, 18)
                                      .padding(.bottom, 24)
                                  }
                              }
                              .padding(.top, 4)
                          }
                          .refreshable { await feed.refresh() }
                      }
                      .background(ONEsUI.bg.ignoresSafeArea())
                      .navigationBarHidden(true)
                      .navigationDestination(for: StoreAPIApp.self) { app in
                          AppDetailView(app: app, feed: feed)
                      }
                  }
              }

              private func openInstall(_ app: StoreAPIApp) {
                  if let urlString = app.resolvedDownloadURL, let url = URL(string: urlString) {
                      UIApplication.shared.open(url)
                  }
              }
          }

          extension StoreFeed {
              /// تاريخ الإصدار أو تاريخ الرصد الأول (fallback).
              func publishedDateOrNow(_ app: StoreAPIApp) -> Date {
                  let raw = app.createdAt ?? app.updatedAt ?? app.versionDate ?? app.fullDate
                  if let raw, let d = StoreFeed.parseDate(raw) { return d }
                  return Date()
              }
          }

