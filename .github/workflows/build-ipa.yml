              var verified: Bool = false
              var title: String
              var caption: String
              var mediaURL: String
              var mediaType: String = "video"   // "video" أو "gif"
              var aspectRatio: Double = 0.5625  // العرض / الارتفاع
              var fitMode: String = "cover"     // "cover" = ملء الشاشة / "contain" = عرض كامل
              var likes: Int = 0
              var comments: [ReelComment] = []
