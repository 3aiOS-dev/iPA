      - name: Generate Source - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import SwiftUI
          import Foundation
          
          struct IPAFile: Identifiable, Codable {
              var id = UUID()
              let fileName: String
              let localPath: String
              let originalURL: String
              let fileSize: String
              let fileSizeBytes: Int64
              let date: String
              var isInstalled: Bool = false
              var installDate: Date?
              enum CodingKeys: String, CodingKey {
                  case id, fileName, localPath, originalURL, fileSize, fileSizeBytes,
                       date, isInstalled, installDate
              }
          }
          
          struct AppItem: Identifiable, Codable {
              var id = UUID()
              let name: String
              let type: Int
              let bundleID: String
              let bundleIdentifier: String
              let version: String
              let versionDate: String
              let fullDate: String
              let size: Int
              let down: String
              let downloadURL: String
              let developerName: String
              let localizedDescription: String
              let icon: String
              let iconURL: String
              var category: String?
              enum CodingKeys: String, CodingKey {
                  case name, type, bundleID, bundleIdentifier, version, versionDate,
                       fullDate, size, down, downloadURL, developerName,
                       localizedDescription, icon, iconURL
              }
              var formattedSize: String { ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .file) }
              var formattedDate: String {
                  let input = DateFormatter(); input.dateFormat = "yyyy-MM-dd"
                  if let d = input.date(from: versionDate) {
                      let out = DateFormatter(); out.dateFormat = "dd-MM-yyyy"; return out.string(from: d)
                  }
                  return versionDate
              }
              var subscriptionType: String {
                  if localizedDescription.contains("Subscription Unlocked") { return "الاشتراك مدى الحياة" }
                  if localizedDescription.contains("Premium") { return "بريميوم" }
                  if localizedDescription.contains("Pro")     { return "Pro" }
                  if localizedDescription.contains("Gold")    { return "Gold" }
                  if localizedDescription.contains("IAP")     { return "المشتريات مفعّلة" }
                  return "مفعّل"
              }
              var isNew: Bool {
                  let f = DateFormatter(); f.dateFormat = "yyyy-MM-dd"
                  guard let d = f.date(from: versionDate) else { return false }
                  return Calendar.current.dateComponents([.day], from: d, to: Date()).day ?? 999 < 7
              }
              var isPopular: Bool { (Int(down) ?? 0) > 500 }
              var _secureDownloadURL: String { downloadURL }
          }
          
          struct InstallRecord: Identifiable, Codable {
              var id = UUID()
              let appName: String
              let bundleID: String
              let version: String
              let installDate: Date
              let iconURL: String
              var installMethod: String
          }
          
          struct AppsResponse: Codable {
              let name: String; let identifier: String; let sourceURL: String
              let iconURL: String; let website: String; let ipawebsite: String
              let subtitle: String; let apps: [AppItem]
          }
          
          struct AppCategory: Identifiable {
              let id = UUID()
              let name: String; let icon: String; let gradient: [Color]
          }
          
          enum DownloadStatus: String {
              case waiting = "في الانتظار"; case downloading = "جاري التحميل"
              case completed = "مكتمل"; case failed = "فشل"; case paused = "متوقف"
          }
          
          class ActiveDownload: ObservableObject, Identifiable {
              let id = UUID()
              let appName: String; let appIconURL: String
              let downloadURL: URL; let appItem: AppItem?
              @Published var progress: Double = 0
              @Published var downloadedBytes: Int64 = 0
              @Published var totalBytes: Int64 = 0
              @Published var status: DownloadStatus = .waiting
              @Published var errorMessage: String?
              var task: URLSessionDataTask?
              var resumeData: Data?
              var destinationURL: URL?
              init(appName: String, appIconURL: String, downloadURL: URL, appItem: AppItem? = nil) {
                  self.appName = appName; self.appIconURL = appIconURL
                  self.downloadURL = downloadURL; self.appItem = appItem
              }
              var progressPercentage: Int { Int(progress * 100) }
              var formattedDownloadedSize: String { ByteCountFormatter.string(fromByteCount: downloadedBytes, countStyle: .file) }
              var formattedTotalSize: String      { ByteCountFormatter.string(fromByteCount: totalBytes,      countStyle: .file) }
          }
          
          enum InstallMethod { case ota; case direct; case local }
          VIPEOF

      - name: Generate Source - VIP21InstallEngine.swift
        run: |
          cat > VIP21InstallEngine.swift << 'VIPEOF'
          import Foundation
          import UIKit
          
          enum VIP21InstallError: LocalizedError {
              case invalidIPA
              case installFailed(String)
              case unsupportedMethod
              var errorDescription: String? {
                  switch self {
                  case .invalidIPA:            return "ملف IPA غير صالح"
                  case .installFailed(let m):  return "فشل التثبيت: \(m)"
                  case .unsupportedMethod:     return "طريقة التثبيت غير مدعومة"
                  }
              }
          }
          
          final class VIP21InstallEngine {
              static let shared = VIP21InstallEngine()
              private init() {}
          
              func install(
                  ipaURL: URL, bundleID: String, appName: String, version: String,
                  progressHandler: @escaping (Double, String) -> Void,
                  completion: @escaping (Result<Void, Error>) -> Void
              ) {
                  DispatchQueue.global(qos: .userInitiated).async {
                      guard FileManager.default.fileExists(atPath: ipaURL.path) else {
                          DispatchQueue.main.async { completion(.failure(VIP21InstallError.invalidIPA)) }
                          return
                      }
                      self.installViaOTA(ipaURL: ipaURL, bundleID: bundleID, appName: appName,
                          version: version, progressHandler: progressHandler, completion: completion)
                  }
              }
          
              private func installViaOTA(
                  ipaURL: URL, bundleID: String, appName: String, version: String,
                  progressHandler: @escaping (Double, String) -> Void,
                  completion: @escaping (Result<Void, Error>) -> Void
              ) {
                  let plist = [
                      "<?xml version=\"1.0\" encoding=\"UTF-8\"?>",
                      "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">",
                      "<plist version=\"1.0\"><dict><key>items</key><array><dict>",
                      "<key>assets</key><array><dict><key>kind</key><string>software-package</string>",
                      "<key>url</key><string>\(ipaURL.absoluteString)</string></dict></array>",
                      "<key>metadata</key><dict><key>bundle-identifier</key><string>\(bundleID)</string>",
                      "<key>bundle-version</key><string>\(version)</string>",
                      "<key>kind</key><string>software</string><key>title</key><string>\(appName)</string>",
                      "</dict></dict></array></dict></plist>"
                  ].joined(separator: "\n")
                  let tmp = FileManager.default.temporaryDirectory
                      .appendingPathComponent("install_\(UUID().uuidString).plist")
                  guard (try? plist.write(to: tmp, atomically: true, encoding: .utf8)) != nil else {
                      DispatchQueue.main.async {
                          completion(.failure(VIP21InstallError.installFailed("فشل إنشاء plist")))
                      }; return
                  }
                  let enc = tmp.absoluteString.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                  guard let otaURL = URL(string: "itms-services://?action=download-manifest&url=\(enc)") else {
                      DispatchQueue.main.async {
                          completion(.failure(VIP21InstallError.installFailed("رابط OTA غير صالح")))
                      }; return
                  }
                  DispatchQueue.main.async {
                      progressHandler(0.5, "فتح مثبّت النظام...")
                      UIApplication.shared.open(otaURL) { ok in
                          if ok { progressHandler(1.0, "تم فتح نافذة التثبيت"); completion(.success(())) }
                          else { completion(.failure(VIP21InstallError.installFailed(
                              "تعذر فتح مثبت النظام")))
                          }
                      }
                  }
              }
          }
          VIPEOF

      - name: Generate Source - DownloadManager.swift
        run: |
          cat > DownloadManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine
          
          class IPADownloadManager: NSObject, ObservableObject {
              @Published var activeDownloads: [ActiveDownload] = []
              @Published var ipaFiles: [IPAFile] = []
              @Published var isDownloading = false
              @Published var statusMessage = ""
              @Published var downloadError: String?
              @Published var downloadProgress: [UUID: Double] = [:]
              @Published var installHistory: [InstallRecord] = []
              @Published var showPermissionAlert = false
              @Published var permissionMessage = ""
              private var urlSession: URLSession!
              private let fm = FileManager.default
              private let documentsPath: URL
              override init() {
                  documentsPath = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  super.init()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest  = 180
                  config.timeoutIntervalForResource = 1200
                  urlSession = URLSession(configuration: config, delegate: self, delegateQueue: OperationQueue.main)
                  loadIPAFiles(); loadInstallHistory()
              }
              private func loadIPAFiles() {
                  let url = documentsPath.appendingPathComponent("ipa_files_v6.json")
                  guard let data = try? Data(contentsOf: url),
                        let decoded = try? JSONDecoder().decode([IPAFile].self, from: data)
                  else { return }
                  ipaFiles = decoded.filter { fm.fileExists(atPath: $0.localPath) }
              }
              func saveIPAFiles() {
                  let url = documentsPath.appendingPathComponent("ipa_files_v6.json")
                  if let data = try? JSONEncoder().encode(ipaFiles) { try? data.write(to: url) }
              }
              private func loadInstallHistory() {
                  let url = documentsPath.appendingPathComponent("install_history.json")
                  guard let data = try? Data(contentsOf: url),
                        let decoded = try? JSONDecoder().decode([InstallRecord].self, from: data)
                  else { return }
                  installHistory = decoded
              }
              func saveInstallHistory() {
                  let url = documentsPath.appendingPathComponent("install_history.json")
                  if let data = try? JSONEncoder().encode(installHistory) { try? data.write(to: url) }
              }
              func addInstallRecord(_ record: InstallRecord) {
                  installHistory.insert(record, at: 0)
                  if installHistory.count > 100 { installHistory = Array(installHistory.prefix(50)) }
                  saveInstallHistory()
              }
              func startDownload(app: AppItem) {
                  if activeDownloads.contains(where: { $0.appName == app.name &&
                      ($0.status == .downloading || $0.status == .waiting) }) {
                      statusMessage = "التحميل قيد التقدم لـ \(app.name)"; return
                  }
                  guard let url = URL(string: app._secureDownloadURL) else { downloadError = "رابط التحميل غير صالح"; return }
                  isDownloading = true; downloadError = nil
                  statusMessage = "بدء تحميل \(app.name)..."
                  HapticManager.shared.impact(.medium)
                  let download = ActiveDownload(appName: app.name, appIconURL: app.iconURL, downloadURL: url, appItem: app)
                  download.status = .downloading
                  download.destinationURL = documentsPath
                      .appendingPathComponent("\(app.name.replacingOccurrences(of: "/", with: "_"))_\(UUID().uuidString).ipa")
                  var req = URLRequest(url: url); req.timeoutInterval = 120
                  let task = urlSession.dataTask(with: req)
                  download.task = task
                  DispatchQueue.main.async { self.activeDownloads.append(download); task.resume() }
              }
              func importIPAFromURL(url: URL) {
                  let dest = documentsPath.appendingPathComponent(url.lastPathComponent)
                  do {
                      if fm.fileExists(atPath: dest.path) { try fm.removeItem(at: dest) }
                      try fm.copyItem(at: url, to: dest)
                      let attrs = try fm.attributesOfItem(atPath: dest.path)
                      let size = attrs[.size] as? Int64 ?? 0
                      let df = DateFormatter(); df.dateFormat = "yyyy-MM-dd"
                      let ipaFile = IPAFile(
                          fileName: url.lastPathComponent, localPath: dest.path, originalURL: url.absoluteString,
                          fileSize: ByteCountFormatter.string(fromByteCount: size, countStyle: .file),
                          fileSizeBytes: size, date: df.string(from: Date())
                      )
                      ipaFiles.insert(ipaFile, at: 0); saveIPAFiles()
                      HapticManager.shared.notification(.success)
                      showPermissionAlert = true
                      permissionMessage = "✅ تم استيراد الملف بنجاح:\n\(url.lastPathComponent)"
                  } catch {
                      downloadError = "فشل استيراد الملف: \(error.localizedDescription)"
                      showPermissionAlert = true
                      permissionMessage = "❌ فشل استيراد الملف:\n\(error.localizedDescription)"
                  }
              }
              func markAsInstalled(_ file: IPAFile, method: String) {
                  if let i = ipaFiles.firstIndex(where: { $0.id == file.id }) {
                      ipaFiles[i].isInstalled = true
                      ipaFiles[i].installDate = Date()
                      saveIPAFiles()
                      let record = InstallRecord(
                          appName: file.fileName.replacingOccurrences(of: ".ipa", with: ""),
                          bundleID: "com.vip21.app", version: "1.0",
                          installDate: Date(), iconURL: "", installMethod: method
                      )
                      addInstallRecord(record)
                  }
              }
              func deleteIPAFile(_ file: IPAFile) {
                  try? fm.removeItem(atPath: file.localPath)
                  ipaFiles.removeAll { $0.id == file.id }
                  saveIPAFiles()
              }
              func pauseDownload(_ download: ActiveDownload) {
                  download.task?.cancel()
                  DispatchQueue.main.async { download.status = .paused }
              }
              func resumeDownload(_ download: ActiveDownload) {
                  download.status = .downloading
                  var req = URLRequest(url: download.downloadURL); req.timeoutInterval = 120
                  let task = urlSession.dataTask(with: req)
                  download.task = task; task.resume()
              }
              func cancelDownload(_ download: ActiveDownload) {
                  download.task?.cancel()
                  activeDownloads.removeAll { $0.id == download.id }
              }
          }
          
          extension IPADownloadManager: URLSessionDataDelegate {
              func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                  guard let dl = activeDownloads.first(where: { $0.task == dataTask }),
                        let dest = dl.destinationURL else { return }
                  dl.downloadedBytes += Int64(data.count)
                  if let total = dataTask.response?.expectedContentLength, total > 0 {
                      dl.totalBytes = total; dl.progress = Double(dl.downloadedBytes) / Double(total)
                  }
                  if fm.fileExists(atPath: dest.path) {
                      if let fh = try? FileHandle(forWritingTo: dest) {
                          fh.seekToEndOfFile(); fh.write(data); try? fh.close()
                      }
                  } else { fm.createFile(atPath: dest.path, contents: data) }
              }
              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let dl = activeDownloads.first(where: { $0.task == task }) else { return }
                  if let err = error {
                      dl.status = .failed; dl.errorMessage = err.localizedDescription; isDownloading = false
                  } else if let dest = dl.destinationURL, fm.fileExists(atPath: dest.path) {
                      dl.status = .completed; dl.progress = 1.0; isDownloading = false
                      let attrs = try? fm.attributesOfItem(atPath: dest.path)
                      let size = attrs?[.size] as? Int64 ?? 0
                      let df = DateFormatter(); df.dateFormat = "yyyy-MM-dd"
                      let ipa = IPAFile(
                          fileName: dest.lastPathComponent, localPath: dest.path, originalURL: dl.downloadURL.absoluteString,
                          fileSize: ByteCountFormatter.string(fromByteCount: size, countStyle: .file),
                          fileSizeBytes: size, date: df.string(from: Date())
                      )
                      ipaFiles.insert(ipa, at: 0); saveIPAFiles()
                      HapticManager.shared.notification(.success)
                      NotificationManager.shared.notifyDownloadComplete(appName: dl.appName, iconURL: dl.appIconURL.isEmpty ? nil : dl.appIconURL)
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2) {
                          self.activeDownloads.removeAll { $0.id == dl.id }
                      }
                  }
              }
          }
          VIPEOF

      - name: Generate Source - AppsManager.swift
        run: |
          cat > AppsManager.swift << 'VIPEOF'
          import SwiftUI
          import Foundation
          
          class AppsManager: ObservableObject {
              @Published var apps: [AppItem] = []
              @Published var isLoading = false
              @Published var errorMessage: String?
              @Published var recentSearches: [String] = []
              var categories: [AppCategory] { [] }
              func appsForCategory(_ cat: AppCategory) -> [AppItem] {
                  return apps
              }
              func fetchApps() {
                  isLoading = true; errorMessage = nil
                  guard let url = URL(string: AppConstants.storeURL) else { isLoading = false; return }
                  URLSession.shared.dataTask(with: url) { [weak self] data, _, err in
                      DispatchQueue.main.async {
                          self?.isLoading = false
                          if let err = err { self?.errorMessage = err.localizedDescription; return }
                          guard let data = data else { self?.errorMessage = "لا توجد بيانات"; return }
                          var loaded: [AppItem] = []
                          if let resp = try? JSONDecoder().decode(AppsResponse.self, from: data) {
                              loaded = resp.apps
                          } else if let arr = try? JSONDecoder().decode([AppItem].self, from: data) {
                              loaded = arr
                          } else {
                              self?.errorMessage = "فشل تحليل البيانات"; return
                          }
                          self?.apps = loaded.map { app in
                              var mutable = app
                              if mutable.category == nil || mutable.category!.isEmpty {
                                  mutable.category = Self.inferCategory(name: app.name, desc: app.localizedDescription)
                              }
                              return mutable
                          }
                      }
                  }.resume()
              }
              static func inferCategory(name: String, desc: String) -> String {
                  let text = (name + " " + desc).lowercased()
                  let map: [(keys: [String], cat: String)] = [
                      (["game", "لعبة", "لعب", "clash", "minecraft", "roblox", "pubg", "cod", "fifa"], "ألعاب"),
                      (["social", "chat", "تواصل", "instagram", "tiktok", "telegram", "whatsapp", "snapchat", "twitter"], "اجتماعي"),
                      (["music", "موسيقى", "spotify", "soundcloud", "youtube", "video", "فيديو", "netflix", "tubi"], "ترفيه"),
                      (["vpn", "security", "أمان", "proxy", "shield", "protect"], "أمان"),
                      (["photo", "camera", "صورة", "تصوير", "edit", "تعديل", "lightroom", "vsco", "capcut"], "صور وفيديو"),
                      (["learn", "تعلّم", "education", "تعليم", "school", "duolingo", "quran", "قرآن"], "تعليم"),
                      (["shop", "store", "تسوق", "amazon", "noon", "delivery", "توصيل"], "تسوق"),
                      (["bank", "pay", "دفع", "مال", "finance", "بنك", "paypal", "stc pay"], "مالية"),
                      (["productivity", "office", "word", "excel", "pdf", "scan", "إنتاجية", "ملفات"], "إنتاجية"),
                      (["travel", "سفر", "flight", "hotel", "فندق", "map", "خرائط", "uber", "careem"], "سفر"),
                      (["health", "fitness", "صحة", "رياضة", "workout", "gym", "diet"], "صحة ورياضة"),
                      (["food", "restaurant", "طعام", "مطعم", "hungerstation", "talabat", "جاهز"], "طعام"),
                      (["news", "أخبار", "newspaper", "bbc", "cnn", "aljazeera"], "أخبار"),
                  ]
                  for entry in map {
                      if entry.keys.contains(where: { text.contains($0) }) { return entry.cat }
                  }
                  return "أدوات"
              }
              func retryFetch() { fetchApps() }
              func loadRecentSearches() {
                  recentSearches = UserDefaults.standard.stringArray(forKey: "recentSearches") ?? []
              }
              func addRecentSearch(_ term: String) {
                  guard !term.isEmpty else { return }
                  recentSearches.removeAll { $0 == term }
                  recentSearches.insert(term, at: 0)
                  if recentSearches.count > 15 { recentSearches = Array(recentSearches.prefix(10)) }
                  UserDefaults.standard.set(recentSearches, forKey: "recentSearches")
              }
          }
