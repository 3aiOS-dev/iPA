                              StatCard(value: "\(gamification.userLevel.totalShares)", label: "مشاركات", icon: "square.and.arrow.up.fill", color: .green)
                              StatCard(value: "\(gamification.userLevel.totalSigns)", label: "توقيعات", icon: "signature", color: .purple)
