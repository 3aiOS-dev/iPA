      # SOURCE — HistoryStore
      # =========================================================
      - name: Generate code - HistoryStore.swift
        run: |
          cat > HistoryStore.swift << 'HEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class HistoryStore: ObservableObject {
              static let shared = HistoryStore()

              @Published private(set) var recent: [AppSnapshot] = []
              private let key = AppConstants.historyKey
              private let d = UserDefaults.standard

              private init() { load() }

              func record(_ app: ITunesApp) {
                  let snap = AppSnapshot(
                      trackId: app.trackId,
                      trackName: app.trackName,
                      artistName: app.artistName,
                      bundleId: app.bundleId,
                      version: app.version,
                      artworkUrl: app.bestArtwork,
                      lookedUpAt: Date()
                  )
                  recent.removeAll { $0.trackId == snap.trackId }
                  recent.insert(snap, at: 0)
                  if recent.count > AppConstants.maxRecent {
                      recent = Array(recent.prefix(AppConstants.maxRecent))
                  }
                  save()
              }

              func clear() {
                  recent.removeAll()
                  save()
              }

              private func load() {
                  guard let data = d.data(forKey: key),
                        let decoded = try? JSONDecoder().decode([AppSnapshot].self, from: data) else { return }
                  recent = decoded
              }
              private func save() {
                  if let data = try? JSONEncoder().encode(recent) {
                      d.set(data, forKey: key)
                  }
              }
          }
          HEOF

      # =========================================================
      # SOURCE — ImageLoader (async image with simple in-memory cache)
      # =========================================================
      - name: Generate code - ImageLoader.swift
        run: |
          cat > ImageLoader.swift << 'IEOF'
          import SwiftUI
          import UIKit

          @MainActor
          final class ImageLoader: ObservableObject {
              @Published var image: UIImage?
              private var task: URLSessionDataTask?
              private static var cache = NSCache<NSString, UIImage>()
              private var currentURL: URL?

              init() {
                  Self.cache.totalCostLimit = AppConstants.cacheBytes
              }

              func load(_ urlString: String?) {
                  currentURL = nil
                  image = nil
                  task?.cancel()
                  guard let s = urlString, let url = URL(string: s) else { return }
                  currentURL = url
                  if let cached = Self.cache.object(forKey: s as NSString) {
                      self.image = cached
                      return
                  }
                  task = URLSession.shared.dataTask(with: url) { [weak self] data, _, _ in
                      guard let self, let data, let img = UIImage(data: data), url == self.currentURL else { return }
                      Self.cache.setObject(img, forKey: s as NSString, cost: data.count)
                      Task { @MainActor in self.image = img }
                  }
                  task?.resume()
              }
          }

          struct CachedImage: View {
              @StateObject private var loader = ImageLoader()
              let url: String?
              var contentMode: ContentMode = .fill
              var placeholderColor: Color = .apCardAlt

              var body: some View {
                  ZStack {
                      placeholderColor
                      if let img = loader.image {
                          Image(uiImage: img)
                              .resizable()
                              .aspectRatio(contentMode: contentMode)
                              .transition(.opacity)
                      }
                  }
                  .onAppear { loader.load(url) }
                  .onChange(of: url) { _, new in loader.load(new) }
              }
          }
          IEOF

