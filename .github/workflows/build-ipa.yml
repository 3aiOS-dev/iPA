                      .background(Capsule().fill(active ? color : ONEsUI.cardAlt))
                      .overlay(Capsule().stroke(active ? Color.white.opacity(0.25) : ONEsUI.stroke, lineWidth: 1))
                      .shadow(color: active ? color.opacity(0.45) : .clear, radius: 10, y: 5)
