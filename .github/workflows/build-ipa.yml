      - name: Generate Source - Theme (Color, ThemeManager)
        run: |
          cd ${{ github.workspace }}
          cat > Theme.swift << 'THEOF'
          import SwiftUI

          extension Color {
              init(hex: String) {
                  var sanitized = hex.trimmingCharacters(in: .whitespacesAndNewlines)
                  sanitized = sanitized.replacingOccurrences(of: "#", with: "")
                  var rgb: UInt64 = 0
                  Scanner(string: sanitized).scanHexInt64(&rgb)
                  let r = Double((rgb & 0xFF0000) >> 16) / 255.0
                  let g = Double((rgb & 0x00FF00) >> 8) / 255.0
                  let b = Double(rgb & 0x0000FF) / 255.0
                  self.init(red: r, green: g, blue: b)
              }
          }

          // يدير مظهر التطبيق (فاتح/داكن) ويحفظ التفضيل محليًا عبر UserDefaults.
          final class ThemeManager: ObservableObject {
              private static let darkModeKey = "app21s.darkMode"

              @Published var isDark: Bool {
                  didSet {
                      UserDefaults.standard.set(isDark, forKey: Self.darkModeKey)
                  }
              }

              init() {
                  if UserDefaults.standard.object(forKey: Self.darkModeKey) == nil {
                      isDark = true
                  } else {
                      isDark = UserDefaults.standard.bool(forKey: Self.darkModeKey)
                  }
              }

              var background: Color { isDark ? Color(hex: "0A0B14") : Color(hex: "F4F5FA") }
              var surface: Color { isDark ? Color(hex: "151826") : Color.white }
              var surfaceElevated: Color { isDark ? Color(hex: "1D2136") : Color(hex: "EDEFF7") }
              var primaryText: Color { isDark ? .white : Color(hex: "12131A") }
              var secondaryText: Color { primaryText.opacity(0.55) }
              var accent: Color { Color(hex: "6E56CF") }
              var accentSecondary: Color { Color(hex: "22D3EE") }
              var gold: Color { Color(hex: "FBBF24") }
              var danger: Color { Color(hex: "F43F5E") }
              var colorScheme: ColorScheme { isDark ? .dark : .light }
          }
          THEOF

      - name: Generate Source - Models and Data
        run: |
          cd ${{ github.workspace }}
          cat > AppModel.swift << 'WEOF'
          import Foundation

          enum StoreCategory: String, CaseIterable {
              case all = "الكل"
              case games = "ألعاب"
              case apps = "تطبيقات"
              case tools = "أدوات"
          }

          struct AppItem: Identifiable, Hashable {
              let id: Int
              let name: String
              let developer: String
              let category: StoreCategory
              let rating: Double
              let sizeMB: Int
              let emoji: String
              let colorHex: String
              let description: String
              let price: String
          }

          enum MockData {
              // بيانات احتياطية فقط (تُستخدم إذا تعذّرت قراءة ملف apps_data.json من حزمة التطبيق).
              // كل البيانات هنا وهمية بالكامل لأغراض العرض فقط، ولا تمثل أي عملية تنزيل
              // أو تثبيت فعلية لأي برنامج أو لعبة حقيقية.
              static let fallbackItems: [AppItem] = [
                  AppItem(id: 1, name: "سباق الصحراء", developer: "استوديو الرمال", category: .games, rating: 4.6, sizeMB: 340, emoji: "🏎️", colorHex: "FF6B35", description: "لعبة سباقات سيارات عبر الصحراء بمضامير متعددة وتحديات يومية وتخصيص كامل للسيارة.", price: "مجانًا"),
                  AppItem(id: 2, name: "برج الألغاز", developer: "بلاي لاب", category: .games, rating: 4.3, sizeMB: 210, emoji: "🧩", colorHex: "7C3AED", description: "ألغاز ذهنية ممتعة بمئات المراحل المتصاعدة الصعوبة، مناسبة لجميع الأعمار.", price: "مجانًا"),
                  AppItem(id: 3, name: "دفتري", developer: "نوت آبس", category: .apps, rating: 4.8, sizeMB: 45, emoji: "📝", colorHex: "06B6D4", description: "تطبيق ملاحظات بسيط وسريع مع دعم المزامنة والتذكيرات والتصنيفات.", price: "مجانًا"),
              ]
          }

          // يمثّل تطبيقًا واحدًا كما هو مخزَّن في ملف apps_data.json (مطابق لبنية الحقول
          // المستخدمة هناك: name, bundleID, version, category...إلخ).
          private struct RawAppItem: Decodable {
              let name: String
              let bundleID: String
              let version: String
              let versionDate: String
              let developerName: String
              let localizedDescription: String
              let category: String
              let rating: Double
              let sizeMB: Int
              let emoji: String
              let colorHex: String
              let price: String
          }

          private struct RawAppsFile: Decodable {
              let apps: [RawAppItem]
          }

          // يقرأ بيانات التطبيقات من ملف Resources/apps_data.json المضمَّن داخل حزمة
          // التطبيق نفسها (Bundle.main) — لا يوجد أي اتصال بالإنترنت أو مصدر خارجي هنا.
          // إذا تعذّرت القراءة أو التحليل لأي سبب، يتم استخدام بيانات احتياطية بسيطة.
          enum AppDataLoader {
              static let items: [AppItem] = load()

              private static func load() -> [AppItem] {
                  guard
                      let url = Bundle.main.url(forResource: "apps_data", withExtension: "json"),
                      let data = try? Data(contentsOf: url),
                      let file = try? JSONDecoder().decode(RawAppsFile.self, from: data)
                  else {
                      return MockData.fallbackItems
                  }

                  return file.apps.enumerated().map { index, raw in
                      AppItem(
                          id: index + 1,
                          name: raw.name,
                          developer: raw.developerName,
                          category: category(from: raw.category),
                          rating: raw.rating,
                          sizeMB: raw.sizeMB,
                          emoji: raw.emoji,
                          colorHex: raw.colorHex,
                          description: raw.localizedDescription,
                          price: raw.price
                      )
                  }
              }

              private static func category(from raw: String) -> StoreCategory {
                  switch raw.lowercased() {
                  case "games": return .games
                  case "tools": return .tools
                  default: return .apps
                  }
              }
          }

          // إدارة قائمة المفضلة محليًا على الجهاز فقط (UserDefaults)، بدون أي اتصال بالإنترنت
          // أو إرسال بيانات لأي جهة خارجية.
          final class FavoritesManager: ObservableObject {
              static let shared = FavoritesManager()
              private let storageKey = "app21s.favorites.ids"

              @Published private(set) var ids: Set<Int>

              private init() {
                  let saved = UserDefaults.standard.array(forKey: storageKey) as? [Int] ?? []
                  ids = Set(saved)
              }

              func isFavorite(_ id: Int) -> Bool {
                  ids.contains(id)
              }

              func toggle(_ id: Int) {
                  if ids.contains(id) {
                      ids.remove(id)
                  } else {
                      ids.insert(id)
                  }
                  UserDefaults.standard.set(Array(ids), forKey: storageKey)
              }

              var favoriteItems: [AppItem] {
                  AppDataLoader.items.filter { ids.contains($0.id) }
              }

              var count: Int {
                  ids.count
              }

              func clearAll() {
                  ids.removeAll()
                  UserDefaults.standard.set(Array(ids), forKey: storageKey)
              }
          }
          WEOF

      - name: Generate Source - Shared Components
        run: |
          cd ${{ github.workspace }}
          cat > Components.swift << 'CEOF'
          import SwiftUI
          import UIKit

          // عنوان قسم داخل الشاشة الرئيسية (أيقونة + نص).
          struct SectionHeader: View {
              @EnvironmentObject var theme: ThemeManager
              let title: String
              let systemIcon: String

              var body: some View {
                  HStack(spacing: 8) {
                      Image(systemName: systemIcon).foregroundColor(theme.accentSecondary)
                      Text(title).font(.system(size: 18, weight: .bold)).foregroundColor(theme.primaryText)
                      Spacer()
                  }
                  .padding(.horizontal, 20)
              }
          }

          // بطاقة بنر ترويجية.
          struct BannerCard: View {
              @EnvironmentObject var theme: ThemeManager
              let item: AppItem

              var body: some View {
                  ZStack(alignment: .topLeading) {
                      LinearGradient(
                          colors: [Color(hex: item.colorHex).opacity(0.92), theme.accent.opacity(0.95)],
                          startPoint: .topLeading, endPoint: .bottomTrailing
                      )
                      VStack(alignment: .leading, spacing: 6) {
                          HStack {
                              Text(item.category.rawValue)
                                  .font(.system(size: 11, weight: .semibold))
                                  .padding(.horizontal, 8).padding(.vertical, 3)
                                  .background(Color.white.opacity(0.22))
                                  .foregroundColor(.white)
                                  .clipShape(Capsule())
                              Spacer()
                              Text(item.emoji).font(.system(size: 42))
                          }
                          Spacer()
                          Text(item.name).font(.system(size: 20, weight: .bold)).foregroundColor(.white)
                          Text("\(item.developer)  ·  ★ \(String(format: "%.1f", item.rating))")
                              .font(.system(size: 12.5)).foregroundColor(.white.opacity(0.85))
                          Text("افتح  ‹").font(.system(size: 12.5, weight: .bold)).foregroundColor(.white)
                      }
                      .padding(18)
                  }
                  .frame(height: 160)
                  .clipShape(RoundedRectangle(cornerRadius: 20))
              }
          }

          // البنر الترويجي المتحرك (Paging) بأعلى الشاشة الرئيسية.
          struct BannerCarousel: View {
              let items: [AppItem]

              var body: some View {
                  TabView {
                      ForEach(items) { item in
                          NavigationLink(value: item) {
                              BannerCard(item: item)
                                  .padding(.horizontal, 20)
                          }
                          .buttonStyle(.plain)
                      }
                  }
                  .tabViewStyle(.page(indexDisplayMode: .always))
                  .frame(height: 190)
              }
          }

          // بطاقة إعلانية شكلية (Placeholder) — لا تتصل بأي شبكة إعلانات حقيقية،
          // هي فقط لإظهار مكان الإعلانات داخل التصميم.
          struct AdBanner: View {
              @EnvironmentObject var theme: ThemeManager

              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: "megaphone.fill").foregroundColor(theme.accent)
                      VStack(alignment: .leading, spacing: 4) {
                          Text("إعلان")
                              .font(.system(size: 10, weight: .bold))
                              .padding(.horizontal, 6).padding(.vertical, 2)
                              .background(theme.primaryText.opacity(0.08))
                              .foregroundColor(theme.secondaryText)
                              .clipShape(Capsule())
                          Text("مساحة إعلانية — عنصر شكلي ضمن نسخة العرض التجريبي")
                              .font(.system(size: 12.5))
                              .foregroundColor(theme.secondaryText)
                              .lineLimit(2)
                      }
                      Spacer()
                  }
                  .padding(14)
                  .frame(height: 74)
                  .background(theme.surface)
                  .overlay(RoundedRectangle(cornerRadius: 16).stroke(theme.primaryText.opacity(0.08), lineWidth: 1))
                  .clipShape(RoundedRectangle(cornerRadius: 16))
              }
          }

          // خلية تطبيق ضمن الشبكة (تُستخدم في الرئيسية، التطبيقات، والمفضلة).
          struct AppCellView: View {
              @EnvironmentObject var theme: ThemeManager
              let item: AppItem

              var body: some View {
                  VStack(spacing: 8) {
                      ZStack {
                          RoundedRectangle(cornerRadius: 14)
                              .fill(Color(hex: item.colorHex).opacity(0.25))
                              .frame(width: 64, height: 64)
                          Text(item.emoji).font(.system(size: 30))
                      }
                      Text(item.name)
                          .font(.system(size: 13, weight: .semibold))
                          .foregroundColor(theme.primaryText)
                          .lineLimit(1)
                      Text(item.developer)
                          .font(.system(size: 10.5))
                          .foregroundColor(theme.secondaryText)
                          .lineLimit(1)
                      Text("★ \(String(format: "%.1f", item.rating))  ·  \(item.sizeMB) MB")
                          .font(.system(size: 10.5, weight: .medium))
                          .foregroundColor(theme.gold)
                      Text(item.price == "مجانًا" ? "تثبيت" : item.price)
                          .font(.system(size: 12, weight: .bold))
                          .foregroundColor(.white)
                          .frame(maxWidth: .infinity)
                          .frame(height: 28)
                          .background(theme.accent)
                          .clipShape(RoundedRectangle(cornerRadius: 14))
