name: 21s ログイン + アプリ (SwiftUI) - クリーンエディション（日本語版）

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "21s"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: ビルドリソースの最大化（1TB以上の容量）
        run: |
          echo "=== ビルド容量チェック ==="
          df -h
          echo "=== macOS リソース制限 ==="
          ulimit -a
          echo "=== 利用可能な CPU コア数 ==="
          sysctl -n hw.ncpu
          echo "=== 利用可能なメモリ ==="
          sysctl -n hw.memsize

      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Xcode のセットアップ
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: 必要なツールのインストール
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid がインストールされていません"; exit 1; }
          command -v zip || { echo "zip がインストールされていません"; exit 1; }

      # =========================================================
      # リソース＆アセット - URL から画像をダウンロード（キャラクターなし）
      # =========================================================
      - name: プロジェクト画像のダウンロード
        run: |
          mkdir -p Resources
          # 認証 / オンボーディング
          curl -L -o Resources/login_logo.png      "https://up6.cc/2026/07/178463790906632.png"
          curl -L -o Resources/register_logo.png   "https://up6.cc/2026/07/178463790901181.png"
          curl -L -o Resources/onboarding1.png    "https://up6.cc/2026/07/178463910434943.png"
          curl -L -o Resources/onboarding2.png    "https://up6.cc/2026/07/178463910431782.png"
          curl -L -o Resources/onboarding3.png    "https://up6.cc/2026/07/178463910425551.png"
          # ホームバナー - GIF
          curl -L -o Resources/home_banner.gif "https://up6.cc/2026/07/178489791030411.gif"
          # アラートオンボーディングアニメーション (GIF)
          curl -L -o Resources/alerts_onboarding1.gif "https://up6.cc/2026/07/178467158819014.gif"
          curl -L -o Resources/alerts_onboarding2.gif "https://up6.cc/2026/07/178467158813032.gif"
          curl -L -o Resources/alerts_onboarding3.gif "https://up6.cc/2026/07/17846720131242.gif"
          # 設定オンボーディング GIF（維持）
          curl -L -o Resources/settings_onboarding.gif "https://up6.cc/2026/07/178467999736562.gif"
          # ステータス / エラー画面（オフライン）
          curl -L -o Resources/no_internet.gif         "https://up6.cc/2026/07/178493307055591.gif"
          # サンクスオーバーレイ
          curl -L -o Resources/thanks_overlay.gif      "https://up6.cc/2026/07/178480321212891.gif"
          # （キャラクター画像はダウンロードしません）
          file Resources/*.png Resources/*.gif 2>/dev/null || true
          ls -lh Resources

      - name: フィーチャー画像の生成（UDID・ウォレットなし）
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow 2>/dev/null || true
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os, random
          os.makedirs("Resources", exist_ok=True)
          random.seed(42)

          def gradient(w, h, c1, c2, vertical=True):
              img = Image.new("RGBA", (w, h), c1 + (255,))
              d = ImageDraw.Draw(img)
              steps = h if vertical else w
              for i in range(steps):
                  t = i / max(1, steps - 1)
                  r = int(c1[0] + (c2[0] - c1[0]) * t)
                  g = int(c1[1] + (c2[1] - c1[1]) * t)
                  b = int(c1[2] + (c2[2] - c1[2]) * t)
                  d.line([(0, i), (w, i)] if vertical else [(i, 0), (i, h)], fill=(r, g, b, 255))
              return img

          def rounded_card(w, h, radius, fill, shadow=True):
              img = Image.new("RGBA", (w, h), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              if shadow:
                  d.rounded_rectangle((4, 8, w - 4, h - 4), radius=radius, fill=(0, 0, 0, 60))
              body = (4, 4, w - 5, h - 5) if shadow else (0, 0, w - 1, h - 1)
              d.rounded_rectangle(body, radius=radius, fill=fill)
              return img

          def find_font(size):
              for p in [
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/SFNSDisplay.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/Library/Fonts/Arial Bold.ttf",
              ]:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, size)
                      except: pass
              return ImageFont.load_default()

          def text_centered(d, txt, x, y, font, fill):
              try:
                  bbox = d.textbbox((0, 0), txt, font=font)
                  w = bbox[2] - bbox[0]; h = bbox[3] - bbox[1]
              except AttributeError:
                  w, h = d.textsize(txt, font=font)
              if isinstance(fill, tuple) and len(fill) == 4 and getattr(d, "_image", None) is not None:
                  if d._image.mode == "RGB":
                      fill = fill[:3]
              d.text((x - w // 2, y - h // 2), txt, font=font, fill=fill)

          def write_image(path, img):
              if img.mode == "RGBA":
                  bg = Image.new("RGB", img.size, (255, 255, 255))
                  bg.paste(img, mask=img.split()[-1])
                  img = bg
              img.save(path, "PNG", optimize=True)
              return img

          # オンボーディングスライド（ウォレット/UDID コンテンツなし）
          W, H = 900, 1400
          def onboarding(text_title, text_body, accent):
              base = gradient(W, H, (250, 251, 255), (235, 240, 255))
              d = ImageDraw.Draw(base)
              d.rounded_rectangle((80, 200, W - 80, 900), radius=40, fill=accent)
              text_centered(d, text_title, W // 2, 350, find_font(60), (255, 255, 255))
              text_centered(d, "*", W // 2, 560, find_font(80), (255, 255, 255))
              for i, line in enumerate(text_body.split("\n")):
                  text_centered(d, line, W // 2, 1050 + i * 70, find_font(34), (40, 50, 80))
              for i in range(3):
                  x = W // 2 - 60 + i * 60
                  d.ellipse((x, 1280, x + 30, 1310), fill=(180, 190, 220))
              d.ellipse((W // 2 - 15, 1280, W // 2 + 15, 1310), fill=(40, 50, 80))
              return base

          for i, (t, b, c) in enumerate([
              ("送信・受信", "ウォレットクレジットを\n瞬時に他の21sユーザーに送金", (60, 130, 220)),
              ("どこでもチャージ", "USDT、BTC、ETH、または\nローカル決済方法", (90, 200, 130)),
              ("紹介＆収入", "あなたのリンクを共有 - \nサインアップごとに $5 獲得", (200, 100, 220)),
          ]):
              write_image(f"Resources/wallet_advanced_onb{i+1}.png", onboarding(t, b, c))

          ico = gradient(1024, 1024, (24, 36, 80), (10, 18, 42))
          d = ImageDraw.Draw(ico)
          d.rounded_rectangle((120, 120, 904, 904), radius=180, fill=(70, 130, 240))
          d.rounded_rectangle((220, 340, 804, 700), radius=30, fill=(255, 255, 255))
          d.text((260, 380), "21s", font=find_font(280), fill=(24, 36, 80))
          write_image("Resources/feature_app_icon.png", ico)
          print("すべてのフィーチャー画像を生成しました。")
          PYEOF
          ls -lh Resources | tail -30

      - name: ロゴ画像からアプリアイコンを生成
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image
          src = Image.open("Resources/login_logo.png").convert("RGBA")
          def make_icon(size, path):
              bg = Image.new("RGBA", (size, size), (10, 12, 18, 255))
              logo = src.resize((size, size))
              bg.alpha_composite(logo)
              bg.convert("RGB").save(path, "PNG")
          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYEOF
          ls -lh Resources

      - name: Info.plist の生成
        run: |
          cat > Resources/Info.plist << 'PEOF'
