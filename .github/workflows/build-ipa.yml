                                          ONEsRemoteImage(url: url, height: 130, corner: 65)
                                              .frame(width: 130, height: 130)
                                      } else {
                                          Text(String(session.username.prefix(1)).uppercased())
                                              .font(.system(size: 56, weight: .black))
                                              .foregroundColor(.white)
