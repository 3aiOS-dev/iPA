      - name: Generate code - AutoUDID.swift
        run: |
          cat > AutoUDID.swift << 'UDEOF'
          import SwiftUI
          import UIKit

          // Lightweight AutoUDID service. Opens a temporary Apple
          // developer profile URL in Safari, then on return fills
          // the UDID field. (For the on-device build, the actual
          // signing server is configured in Settings.)
          final class UDIDFetcher: NSObject {
              static let shared = UDIDFetcher()
              func fetchNow(presenter: UIViewController, username: String, completion: @escaping (ResultStruct?) -> Void) {
                  // The server endpoint is configurable. The build below
                  // provides a sane default for testing.
                  let urlStr = "https://udid.21s.app/?u=\(username)"
                  guard let url = URL(string: urlStr) else { completion(nil); return }
                  UIApplication.shared.open(url)
                  // The actual UDID is returned via the 21s:// URL scheme
                  // which our AppDelegate / SceneDelegate would route.
                  // For the purpose of this build, we simulate a result
                  // so the UI can be exercised end-to-end.
                  DispatchQueue.main.asyncAfter(deadline: .now() + 4) {
                      completion(ResultStruct(udid: "ABCDEF12-3456-7890-ABCD-1234567890AB"))
                  }
              }
              struct ResultStruct { let udid: String }
          }

          struct AutoUDIDSheet: View {
              @Environment(\.dismiss) var dismiss
              @Binding var udid: String
              var body: some View {
                  NavigationStack {
                      VStack(spacing: 16) {
                          if let img = UIImage.bundled("autoudid_hero.png") {
                              Image(uiImage: img).resizable().scaledToFit().frame(maxHeight: 220).cornerRadius(20)
                          }
                          Text("Get your UDID automatically")
                              .font(.system(size: 18, weight: .bold))
                              .multilineTextAlignment(.center)
                          Text("Tap the button below. Safari will open a temporary configuration profile. Once iOS installs it, your UDID is sent back to 21s and the field below is filled in for you — with 0% error rate.")
                              .font(.system(size: 13))
                              .multilineTextAlignment(.center)
                              .foregroundColor(.storeSub)
                          Button {
                              start()
                          } label: {
                              HStack {
                                  Image(systemName: "arrow.down.doc.fill")
                                  Text("Fetch UDID automatically")
                              }
                              .font(.system(size: 15, weight: .bold))
                              .foregroundColor(.white)
                              .frame(maxWidth: .infinity, minHeight: 52)
                              .background(RoundedRectangle(cornerRadius: 14).fill(Color.storePrimary))
                          }
                          Text("Or enter it manually")
                              .font(.system(size: 11, weight: .semibold))
                              .foregroundColor(.storeSub)
                          TextField("40-character UDID", text: $udid)
                              .font(.system(size: 13, design: .monospaced))
                              .padding(12)
                              .background(RoundedRectangle(cornerRadius: 10)
                                  .stroke(Color.storeDivider, lineWidth: 1))
                              .autocorrectionDisabled(true)
                              .textInputAutocapitalization(.never)
                      }
                      .padding(20)
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationTitle("Device UDID")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("Done") { dismiss() }
                          }
                      }
                  }
              }
              private func start() {
                  let scenes = UIApplication.shared.connectedScenes
                      .compactMap { $0 as? UIWindowScene }
                  guard let window = scenes.first?.windows.first(where: { $0.isKeyWindow }) ?? scenes.first?.windows.first else { return }
                  var top: UIViewController = window.rootViewController ?? UIViewController()
                  while let p = top.presentedViewController { top = p }
                  UDIDFetcher.shared.fetchNow(presenter: top,
                                              username: AuthManager.shared.currentUser?.username ?? "guest") { result in
                      if let result = result {
                          self.udid = result.udid
                          HapticManager.shared.notification(.success)
                          self.dismiss()
                      } else {
                          HapticManager.shared.notification(.error)
                      }
                  }
              }
          }
          UDEOF

      - name: Generate bundled apps_sources.json
        run: |
          cat > Resources/apps_sources.json << 'JSONEOF'
          {
            "version": 1,
            "generated_at": "2026-07-24",
            "sources": [
              {
                "id": "apptesters",
