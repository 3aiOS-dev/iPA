                  .overlay(RoundedRectangle(cornerRadius: 16)
                      .stroke(ipa.isInstalled ? Color.green.opacity(0.4) : Color.vipPurple.opacity(0.08), lineWidth: ipa.isInstalled ? 1.5 : 1))
                  .contentShape(Rectangle())
