          import SwiftUI
          import UIKit
          import Foundation
          import Combine
          import Security
          import CommonCrypto
          import PhotosUI
          import UserNotifications
          import CoreHaptics
          import Network
          import UniformTypeIdentifiers
          import LocalAuthentication
          import Compression
          
          // MARK: - Certificate Manager
          class CertificateManager: ObservableObject {
              @Published var certificates: [CertificateInfoModel] = []
              @Published var selectedCertificate: CertificateInfoModel?
              @Published var errorMessage: String?
              @Published var showImportSuccess = false
              @Published var showImportError   = false
          
              private let fm = FileManager.default
              private var certDir: URL {
                  fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      .appendingPathComponent("Certificates")
              }
          
              init() { createDir(); loadCertificates() }
          
              private func createDir() {
                  try? fm.createDirectory(at: certDir, withIntermediateDirectories: true)
              }
          
              // MARK: - loadCertificates
              func loadCertificates() {
                  let url = certDir.appendingPathComponent("certificates.json")
                  guard let data = try? Data(contentsOf: url),
                        let decoded = try? JSONDecoder().decode([CertificateInfoModel].self, from: data)
                  else { return }
          
                  let sorted = decoded.sorted { lhs, rhs in
                      if lhs.isValid != rhs.isValid { return lhs.isValid && !rhs.isValid }
                      return (lhs.daysRemaining ?? 0) > (rhs.daysRemaining ?? 0)
                  }
                  let apply = { [weak self] in
                      guard let self else { return }
                      self.certificates = sorted
                      if let cur = self.selectedCertificate,
                         sorted.contains(where: { $0.id == cur.id && $0.isValid }) {
                      } else {
                          self.selectedCertificate = sorted.first(where: { $0.isValid }) ?? sorted.first
                      }
                  }
                  if Thread.isMainThread { apply() } else { DispatchQueue.main.async { apply() } }
              }
          
              // MARK: - التحقق الحقيقي قبل الحفظ
              func validateAndSaveCertificate(
                  p12Data: Data,
                  provisionData: Data,
                  password: String,
                  displayName: String,
                  completion: @escaping (Result<CertificateInfoModel, Error>) -> Void
              ) {
                  DispatchQueue.global(qos: .userInitiated).async {
                      // 1. التحقق من P12
                      let passwords = [password, password.trimmingCharacters(in: .whitespaces), ""]
                      var p12Valid = false
                      var p12StatusCode: OSStatus = 0
          
                      for pwd in passwords {
                          let opts: [String: Any] = [kSecImportExportPassphrase as String: pwd]
                          var items: CFArray?
                          let status = SecPKCS12Import(p12Data as CFData, opts as CFDictionary, &items)
                          p12StatusCode = status
                          if status == errSecSuccess,
                             let arr = items as? [[String: Any]],
                             arr.first?[kSecImportItemIdentity as String] != nil {
                              p12Valid = true; break
                          }
                      }
          
                      if !p12Valid {
                          let msg: String
                          switch p12StatusCode {
                          case errSecAuthFailed:
                              msg = "❌ كلمة سر الشهادة خاطئة\n\nتأكد من كلمة السر بدقة (حساسة للأحرف الكبيرة والصغيرة)"
                          case errSecDecode:
                              msg = "❌ ملف P12 تالف أو بصيغة غير مدعومة\n\nجرب تصدير الشهادة مجدداً من Keychain Access"
                          case errSecItemNotFound:
                              msg = "❌ لم يُعثر على شهادة داخل الملف"
                          default:
                              msg = "❌ فشل استيراد الشهادة (كود: \(p12StatusCode))\n\nتأكد أن الملف بصيغة .p12 صحيحة"
                          }
                          DispatchQueue.main.async {
                              completion(.failure(NSError(domain: "CertImport", code: Int(p12StatusCode),
                                                         userInfo: [NSLocalizedDescriptionKey: msg])))
                          }
                          return
                      }
          
                      // 2. التحقق من Provisioning Profile
                      let bytes     = [UInt8](provisionData)
                      let xmlMarker = Array("<?xml".utf8)
                      let plistEnd  = Array("</plist>".utf8)
          
                      var provValid     = false
                      var parsedProfile : [String: Any]? = nil
          
                      // محاولة استخراج XML المضمّن داخل الملف الثنائي
                      if let startIdx = bytes.firstRange(of: xmlMarker),
                         let endRange  = bytes.firstRange(of: plistEnd) {
                          let xmlData = Data(bytes[startIdx.lowerBound..<endRange.upperBound])
                          if let dict = try? PropertyListSerialization.propertyList(
                              from: xmlData, options: [], format: nil) as? [String: Any] {
                              parsedProfile = dict
                              let entitlements = dict["Entitlements"] as? [String: Any]
                              provValid = dict["UUID"] != nil
                                     || dict["Name"] != nil
                                     || dict["TeamName"] != nil
                                     || entitlements?["application-identifier"] != nil
                                     || dict["application-identifier"] != nil
                          }
                      }
          
                      // محاولة بديلة: تحليل الملف مباشرةً كـ plist ثنائي
                      if !provValid {
                          if let dict = try? PropertyListSerialization.propertyList(
                              from: provisionData, options: [], format: nil) as? [String: Any] {
                              parsedProfile = dict
                              let entitlements = dict["Entitlements"] as? [String: Any]
                              provValid = dict["UUID"] != nil
                                     || dict["Name"] != nil
                                     || entitlements?["application-identifier"] != nil
                          }
                      }
          
                      // قبول الملف إذا تجاوز حجمه 100 بايت ويبدو ملف provision (iOS 15 / iPhone 11 Pro Max)
                      if !provValid && provisionData.count > 100 {
                          let str = String(bytes: bytes.prefix(500), encoding: .ascii) ?? ""
                          let strUtf8 = String(bytes: bytes.prefix(500), encoding: .utf8) ?? ""
                          if str.contains("Apple") || str.contains("provision") || str.contains("MIME")
                              || strUtf8.contains("Apple") || strUtf8.contains("plist")
                              || bytes.prefix(4).elementsEqual([0x30, 0x80, 0x06, 0x09])  // PKCS#7
                              || bytes.prefix(4).elementsEqual([0x30, 0x82, 0x00, 0x00])  // DER
                              || provisionData.count > 500 {  // أي ملف provision حقيقي أكبر من 500 بايت
                              provValid = true
                          }
                      }
          
                      if !provValid {
                          DispatchQueue.main.async {
                              completion(.failure(NSError(domain: "CertImport", code: -2, userInfo: [
                                  NSLocalizedDescriptionKey: "❌ ملف Provisioning Profile غير صالح\n\nتأكد أن الملف بصيغة .mobileprovision صحيحة\n(حجم الملف: \(provisionData.count) بايت)"
                              ])))
                          }
                          return
                      }
          
                      // 3. بناء النموذج
                      let profileName = parsedProfile?["Name"] as? String
                      let teamName    = parsedProfile?["TeamName"] as? String
                      let autoName: String = {
                          if !displayName.isEmpty    { return displayName }
                          if let p = profileName     { return p }
                          if let t = teamName        { return t }
                          return "شهادة \(Int.random(in: 1000...9999))"
                      }()
                      let cert = CertificateInfoModel(
                          name: autoName, p12Data: p12Data, mobileProvisionData: provisionData,
                          password: password, displayName: autoName, creationDate: Date()
                      )
          
                      DispatchQueue.main.async { completion(.success(cert)) }
                  }
              }
          
              func saveCertificate(_ cert: CertificateInfoModel) {
                  DispatchQueue.main.async {
                      if !self.certificates.contains(where: { $0.id == cert.id }) {
                          self.certificates.append(cert)
                      }
                      self.certificates.sort { lhs, rhs in
                          if lhs.isValid != rhs.isValid { return lhs.isValid && !rhs.isValid }
                          return (lhs.daysRemaining ?? 0) > (rhs.daysRemaining ?? 0)
                      }
                      self.saveToDisk()
                      if self.selectedCertificate == nil || !(self.selectedCertificate?.isValid ?? false) {
                          self.selectedCertificate = self.certificates.first(where: { $0.isValid }) ?? self.certificates.first
                      }
                      self.showImportSuccess = true
                      HapticManager.shared.notification(.success)
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2) { self.showImportSuccess = false }
                  }
              }
          
              func removeCertificate(at index: IndexSet) {
                  certificates.remove(atOffsets: index)
                  let remainingIDs = Set(certificates.map { $0.id })
                  if let sel = selectedCertificate, !remainingIDs.contains(sel.id) {
                      selectedCertificate = certificates.first(where: { $0.isValid }) ?? certificates.first
                  }
                  certificates.sort { lhs, rhs in
                      if lhs.isValid != rhs.isValid { return lhs.isValid && !rhs.isValid }
                      return (lhs.daysRemaining ?? 0) > (rhs.daysRemaining ?? 0)
                  }
                  saveToDisk()
              }
          
              private func saveToDisk() {
                  let url = certDir.appendingPathComponent("certificates.json")
                  do {
                      let data = try JSONEncoder().encode(certificates)
                      try data.write(to: url, options: .atomicWrite)
                  } catch {
                      DispatchQueue.main.async { self.errorMessage = "❌ فشل حفظ الشهادات: \(error.localizedDescription)" }
                  }
              }
          
              // MARK: - التوقيع (عبر SigningEngine)
              func signIPA(ipaURL: URL, with certificate: CertificateInfoModel,
                           progressHandler: @escaping (Double, String) -> Void,
                           completion: @escaping (Result<URL, Error>) -> Void) {
                  SigningEngine.shared.sign(
                      ipaURL: ipaURL,
                      certificate: certificate,
                      progressHandler: progressHandler,
                      completion: completion
                  )
              }
          
              // MARK: - التثبيت (عبر InstallEngine — OTA / TrollStore / AltStore)
              func installIPA(ipaURL: URL, appName: String, bundleID: String,
                              progressHandler: @escaping (Double, String) -> Void,
                              completion: @escaping (Result<Void, Error>) -> Void) {
                  let ver = (Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String) ?? "1.0"
                  VIP21InstallEngine.shared.install(
                      ipaURL:          ipaURL,
                      bundleID:        bundleID.isEmpty ? "com.vip21.app" : bundleID,
                      appName:         appName.isEmpty  ? "App"           : appName,
                      version:         ver,
                      progressHandler: progressHandler,
                      completion:      completion
                  )
              }
          }
          
          // MARK: - IPA Download Manager
          class IPADownloadManager: NSObject, ObservableObject {
              @Published var activeDownloads: [ActiveDownload] = []
              @Published var ipaFiles: [IPAFile] = []
              @Published var isDownloading = false
              @Published var statusMessage = ""
              @Published var downloadError: String?
              @Published var downloadProgress: [UUID: Double] = [:]
              @Published var installHistory: [InstallRecord] = []
              @Published var favoriteAppNames: Set<String> = []
          
              private var urlSession: URLSession!
              private let fm = FileManager.default
              private let documentsPath: URL
          
              override init() {
                  documentsPath = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  super.init()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest  = 180
                  config.timeoutIntervalForResource = 1200
                  urlSession = URLSession(configuration: config, delegate: self, delegateQueue: OperationQueue.main)
                  loadIPAFiles(); loadInstallHistory(); loadFavorites()
              }
          
              private func loadIPAFiles() {
                  let url = documentsPath.appendingPathComponent("ipa_files_v6.json")
                  guard let data = try? Data(contentsOf: url),
                        let decoded = try? JSONDecoder().decode([IPAFile].self, from: data)
                  else { return }
                  ipaFiles = decoded.filter { fm.fileExists(atPath: $0.localPath) }
              }
          
              func saveIPAFiles() {
                  let url = documentsPath.appendingPathComponent("ipa_files_v6.json")
                  if let data = try? JSONEncoder().encode(ipaFiles) { try? data.write(to: url) }
              }
          
              private func loadInstallHistory() {
                  let url = documentsPath.appendingPathComponent("install_history.json")
                  guard let data = try? Data(contentsOf: url),
                        let decoded = try? JSONDecoder().decode([InstallRecord].self, from: data)
                  else { return }
                  installHistory = decoded
              }
          
              func saveInstallHistory() {
                  let url = documentsPath.appendingPathComponent("install_history.json")
                  if let data = try? JSONEncoder().encode(installHistory) { try? data.write(to: url) }
              }
          
              func addInstallRecord(_ record: InstallRecord) {
                  installHistory.insert(record, at: 0)
                  if installHistory.count > 100 { installHistory = Array(installHistory.prefix(50)) }
                  saveInstallHistory()
              }
          
              private func loadFavorites() {
                  let arr = UserDefaults.standard.stringArray(forKey: "favoriteApps") ?? []
                  favoriteAppNames = Set(arr)
              }
          
              func toggleFavorite(appName: String) {
                  if favoriteAppNames.contains(appName) { favoriteAppNames.remove(appName) }
                  else { favoriteAppNames.insert(appName); HapticManager.shared.impact(.light) }
                  UserDefaults.standard.set(Array(favoriteAppNames), forKey: "favoriteApps")
              }
          
              func isFavorite(_ appName: String) -> Bool { favoriteAppNames.contains(appName) }
          
              func startDownload(app: AppItem) {
                  if activeDownloads.contains(where: { $0.appName == app.name &&
                      ($0.status == .downloading || $0.status == .waiting) }) {
                      statusMessage = "التحميل قيد التقدم لـ \(app.name)"; return
                  }
                  guard let url = URL(string: app._secureDownloadURL) else { downloadError = "رابط التحميل غير صالح"; return }
                  isDownloading = true; downloadError = nil
                  statusMessage = "بدء تحميل \(app.name)..."
                  HapticManager.shared.impact(.medium)
          
                  let download = ActiveDownload(appName: app.name, appIconURL: app.iconURL, downloadURL: url, appItem: app)
                  download.status = .downloading
                  download.destinationURL = documentsPath
                      .appendingPathComponent("\(app.name.replacingOccurrences(of: "/", with: "_"))_\(UUID().uuidString).ipa")
          
                  var req = URLRequest(url: url); req.timeoutInterval = 120
                  let task = urlSession.dataTask(with: req)
                  download.task = task
                  DispatchQueue.main.async { self.activeDownloads.append(download); task.resume() }
              }
          
              func importIPAFromURL(url: URL) {
                  let dest = documentsPath.appendingPathComponent(url.lastPathComponent)
                  do {
                      if fm.fileExists(atPath: dest.path) { try fm.removeItem(at: dest) }
                      try fm.copyItem(at: url, to: dest)
                      let attrs = try fm.attributesOfItem(atPath: dest.path)
                      let size = attrs[.size] as? Int64 ?? 0
                      let df = DateFormatter(); df.dateFormat = "yyyy-MM-dd"
                      let ipaFile = IPAFile(
                          fileName: url.lastPathComponent, localPath: dest.path, originalURL: url.absoluteString,
                          fileSize: ByteCountFormatter.string(fromByteCount: size, countStyle: .file),
                          fileSizeBytes: size, date: df.string(from: Date())
                      )
                      ipaFiles.insert(ipaFile, at: 0); saveIPAFiles()
                      HapticManager.shared.notification(.success)
                  } catch {
                      downloadError = "فشل استيراد الملف: \(error.localizedDescription)"
                  }
              }
          
              func markAsSigned(_ file: IPAFile, signedPath: String, certificateId: UUID) {
                  if let i = ipaFiles.firstIndex(where: { $0.id == file.id }) {
                      ipaFiles[i].isSigned = true
                      ipaFiles[i].signedPath = signedPath
                      ipaFiles[i].signingCertificateId = certificateId
                      saveIPAFiles()
                  }
              }
          
              func markAsInstalled(_ file: IPAFile, method: String) {
                  if let i = ipaFiles.firstIndex(where: { $0.id == file.id }) {
                      ipaFiles[i].isInstalled = true
                      ipaFiles[i].installDate = Date()
                      saveIPAFiles()
                      let record = InstallRecord(
                          appName: file.fileName.replacingOccurrences(of: ".ipa", with: ""),
                          bundleID: "com.vip21.app", version: "1.0",
                          installDate: Date(), iconURL: "", installMethod: method
                      )
                      addInstallRecord(record)
                  }
              }
          
              func deleteIPAFile(_ file: IPAFile) {
                  try? fm.removeItem(atPath: file.localPath)
                  if let sp = file.signedPath { try? fm.removeItem(atPath: sp) }
                  ipaFiles.removeAll { $0.id == file.id }
                  saveIPAFiles()
              }
          
              func pauseDownload(_ download: ActiveDownload) {
                  download.task?.cancel()
                  DispatchQueue.main.async { download.status = .paused }
              }
          
              func resumeDownload(_ download: ActiveDownload) {
                  download.status = .downloading
                  var req = URLRequest(url: download.downloadURL); req.timeoutInterval = 120
                  let task = urlSession.dataTask(with: req)
                  download.task = task; task.resume()
              }
          
              func cancelDownload(_ download: ActiveDownload) {
                  download.task?.cancel()
                  activeDownloads.removeAll { $0.id == download.id }
              }
          }
          
          // MARK: - URLSession Delegate
          extension IPADownloadManager: URLSessionDataDelegate {
              func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                  guard let dl = activeDownloads.first(where: { $0.task == dataTask }),
                        let dest = dl.destinationURL else { return }
                  dl.downloadedBytes += Int64(data.count)
                  if let total = dataTask.response?.expectedContentLength, total > 0 {
                      dl.totalBytes = total; dl.progress = Double(dl.downloadedBytes) / Double(total)
                  }
                  if fm.fileExists(atPath: dest.path) {
                      if let fh = try? FileHandle(forWritingTo: dest) {
                          fh.seekToEndOfFile(); fh.write(data); try? fh.close()
                      }
                  } else { fm.createFile(atPath: dest.path, contents: data) }
              }
          
              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let dl = activeDownloads.first(where: { $0.task == task }) else { return }
                  if let err = error {
                      dl.status = .failed; dl.errorMessage = err.localizedDescription; isDownloading = false
                  } else if let dest = dl.destinationURL, fm.fileExists(atPath: dest.path) {
                      dl.status = .completed; dl.progress = 1.0; isDownloading = false
                      let attrs = try? fm.attributesOfItem(atPath: dest.path)
                      let size = attrs?[.size] as? Int64 ?? 0
                      let df = DateFormatter(); df.dateFormat = "yyyy-MM-dd"
                      let ipa = IPAFile(
                          fileName: dest.lastPathComponent, localPath: dest.path, originalURL: dl.downloadURL.absoluteString,
                          fileSize: ByteCountFormatter.string(fromByteCount: size, countStyle: .file),
                          fileSizeBytes: size, date: df.string(from: Date())
                      )
                      ipaFiles.insert(ipa, at: 0); saveIPAFiles()
                      HapticManager.shared.notification(.success)
                      // 🔔 Send download complete notification with app icon
                      NotificationManager.shared.notifyDownloadComplete(appName: dl.appName, iconURL: dl.appIconURL.isEmpty ? nil : dl.appIconURL)
                      DispatchQueue.main.asyncAfter(deadline: .now() + 2) {
                          self.activeDownloads.removeAll { $0.id == dl.id }
                      }
                  }
              }
          }
          VIPEOF
          echo "Managers.swift: $(wc -l < Managers.swift) lines"

