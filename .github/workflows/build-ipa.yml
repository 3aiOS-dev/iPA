          import SwiftUI
          import UIKit
          import Foundation
          import UniformTypeIdentifiers
          import Compression

          @MainActor
          final class FilesManager: ObservableObject {
              @Published private(set) var files: [ImportedFile] = []
              @Published private(set) var isImporting: Bool = false
              @Published private(set) var lastError: String?
              @Published private(set) var lastImportSummary: String?

              private let fm = FileManager.default

              private var supportRoot: URL {
                  let base = (try? fm.url(for: .applicationSupportDirectory,
                                          in: .userDomainMask,
                                          appropriateFor: nil,
                                          create: true)) ?? fm.temporaryDirectory
                  return base
              }

              private var importedRoot: URL {
                  let dir = supportRoot.appendingPathComponent(AppConstants.importedFilesDir, isDirectory: true)
                  ensureDirectory(dir)
                  return dir
              }

              private var iconsDir: URL {
                  let dir = importedRoot.appendingPathComponent("Icons", isDirectory: true)
                  ensureDirectory(dir)
                  return dir
              }

              private func kindDir(_ kind: ImportedFileKind) -> URL {
                  let dir = importedRoot.appendingPathComponent(kind.rawValue, isDirectory: true)
                  ensureDirectory(dir)
                  return dir
              }

              private func ensureDirectory(_ url: URL) {
                  if !fm.fileExists(atPath: url.path) {
                      try? fm.createDirectory(at: url, withIntermediateDirectories: true)
                  }
              }

              init() {
                  ensureDirectory(importedRoot)
                  reload()
              }

              func reload() {
                  var collected: [ImportedFile] = []
                  for kind in ImportedFileKind.allCases where kind != .other {
                      let dir = kindDir(kind)
                      guard let urls = try? fm.contentsOfDirectory(at: dir,
                                                                    includingPropertiesForKeys: [.fileSizeKey, .contentModificationDateKey],
                                                                    options: [.skipsHiddenFiles]) else { continue }
                      for url in urls {
                          if let info = fileMetadata(at: url, kind: kind) {
                              collected.append(info)
                          }
                      }
                  }
                  self.files = collected.sorted { $0.importedAt > $1.importedAt }
              }

              func importFiles(from urls: [URL]) async {
                  guard !urls.isEmpty else { return }
                  isImporting = true
                  lastError = nil
                  lastImportSummary = nil
                  defer { isImporting = false; reload() }

                  var success = 0
                  var failed: [String] = []

                  for src in urls {
                      do {
                          let stored = try await importSingle(src)
                          success += 1
                          _ = stored
                      } catch {
                          failed.append("\(src.lastPathComponent): \(error.localizedDescription)")
                      }
                  }

                  if success > 0 {
                      HapticManager.shared.success()
                      lastImportSummary = "تم استيراد \(success) ملف بنجاح"
                  }
                  if !failed.isEmpty {
                      HapticManager.shared.error()
                      lastError = failed.joined(separator: "\n")
                  }
              }

              private func importSingle(_ src: URL) async throws -> ImportedFile {
                  let needsScope = src.startAccessingSecurityScopedResource()
                  defer { if needsScope { src.stopAccessingSecurityScopedResource() } }

                  let kind = ImportedFileKind.from(url: src)
                  let destKind: ImportedFileKind = (kind == .other) ? .other : kind
                  let destDir  = kindDir(destKind)
                  let original = src.lastPathComponent
                  let storedName = uniqueName(original, in: destDir)
                  let destURL = destDir.appendingPathComponent(storedName)

                  if fm.fileExists(atPath: destURL.path) { try fm.removeItem(at: destURL) }
                  try fm.copyItem(at: src, to: destURL)

                  let attrs = try fm.attributesOfItem(atPath: destURL.path)
                  let size  = (attrs[.size] as? NSNumber)?.int64Value ?? 0

                  var isValid = true
                  var errMsg: String? = nil
                  var bundleID: String? = nil
                  var version: String? = nil
                  var buildNum: String? = nil
                  var displayName: String? = nil
                  var iconName: String? = nil
                  var profileName: String? = nil
                  var profileTeam: String? = nil
                  var profileExp: Date? = nil

                  switch kind {
                  case .ipa:
                      do {
                          let info = try extractIPAInfo(at: destURL)
                          bundleID    = info.bundleID
                          version     = info.version
                          buildNum    = info.build
                          displayName = info.displayName
                          iconName    = info.iconFilename
                          if info.bundleID.isEmpty {
                              isValid = false
                              errMsg = "لا يحتوي على Info.plist صالح"
                          }
                      } catch {
                          isValid = false
                          errMsg = "ملف IPA غير صالح: \(error.localizedDescription)"
                      }

                  case .p12:
                      if !FileSignatureValidator.looksLikePKCS12(destURL) {
                          isValid = false
                          errMsg = "ليس ملف PKCS#12 صحيح"
                      }

                  case .mobileprovision:
                      do {
                          let prof = try ProvisioningProfileInspector.read(from: destURL)
                          profileName = prof.name
                          profileTeam = prof.teamID
                          profileExp  = prof.expirationDate
                          if prof.name.isEmpty {
                              isValid = false
                              errMsg = "ملف التزويد تالف"
                          }
                      } catch {
                          isValid = false
                          errMsg = "ملف التزويد غير صالح: \(error.localizedDescription)"
                      }

                  case .other:
                      isValid = false
                      errMsg = "نوع ملف غير مدعوم. المدعوم: .ipa, .p12, .mobileprovision"
                  }

                  let imported = ImportedFile(
                      originalName: original,
                      storedName: storedName,
                      relativePath: "\(AppConstants.importedFilesDir)/\(destKind.rawValue)/\(storedName)",
                      size: size,
                      kind: destKind,
                      importedAt: Date(),
                      isValid: isValid,
                      validationError: errMsg
                  )
                  var withMeta = imported
                  withMeta.ipaBundleID      = bundleID
                  withMeta.ipaVersion       = version
                  withMeta.ipaBuildNumber   = buildNum
                  withMeta.ipaDisplayName   = displayName
                  withMeta.ipaIconName      = iconName
                  withMeta.profileName      = profileName
                  withMeta.profileTeamID    = profileTeam
                  withMeta.profileExpiration = profileExp

                  persistMetadata(for: withMeta)
                  return withMeta
              }

              private func metadataURL(for file: ImportedFile) -> URL {
                  importedRoot
                      .appendingPathComponent("Meta", isDirectory: true)
                      .appendingPathComponent("\(file.id.uuidString).json")
              }

              private func persistMetadata(for file: ImportedFile) {
                  ensureDirectory(importedRoot.appendingPathComponent("Meta", isDirectory: true))
                  let sidecar = ImportedFileMetadata(
                      id: file.id.uuidString,
                      originalName: file.originalName,
                      storedName: file.storedName,
                      relativePath: file.relativePath,
                      size: file.size,
                      kind: file.kind.rawValue,
                      importedAt: file.importedAt,
                      isValid: file.isValid,
                      validationError: file.validationError,
                      ipaBundleID: file.ipaBundleID,
                      ipaVersion: file.ipaVersion,
                      ipaBuildNumber: file.ipaBuildNumber,
                      ipaDisplayName: file.ipaDisplayName,
                      ipaIconName: file.ipaIconName,
                      profileName: file.profileName,
                      profileTeamID: file.profileTeamID,
                      profileExpiration: file.profileExpiration
                  )
                  if let data = try? JSONEncoder().encode(sidecar) {
                      try? data.write(to: metadataURL(for: file), options: .atomic)
                  }
              }

              @discardableResult
              func rename(file: ImportedFile, to newDisplayName: String) -> Bool {
                  let trimmed = newDisplayName.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else { return false }
                  let originalExt = (file.storedName as NSString).pathExtension
                  let newName = originalExt.isEmpty
                      ? trimmed
                      : "\(trimmed).\(originalExt)"

                  let dir = kindDir(file.kind)
                  let src = dir.appendingPathComponent(file.storedName)
                  let dst = dir.appendingPathComponent(newName)
                  guard src != dst else { return true }
                  if fm.fileExists(atPath: dst.path) { return false }
                  do {
                      try fm.moveItem(at: src, to: dst)
                      if let idx = files.firstIndex(where: { $0.id == file.id }) {
                          let old = files[idx]
                          var updated = old
                          updated = ImportedFile(
                              id: old.id,
                              originalName: newName,
                              storedName: newName,
                              relativePath: "\(AppConstants.importedFilesDir)/\(old.kind.rawValue)/\(newName)",
                              size: old.size,
                              kind: old.kind,
                              importedAt: old.importedAt,
                              isValid: old.isValid,
                              validationError: old.validationError
                          )
                          updated.ipaBundleID = old.ipaBundleID
                          updated.ipaVersion = old.ipaVersion
                          updated.ipaBuildNumber = old.ipaBuildNumber
                          updated.ipaDisplayName = old.ipaDisplayName
                          updated.ipaIconName = old.ipaIconName
                          updated.profileName = old.profileName
                          updated.profileTeamID = old.profileTeamID
                          updated.profileExpiration = old.profileExpiration
                          files[idx] = updated
                          persistMetadata(for: updated)
                      }
                      HapticManager.shared.success()
                      return true
                  } catch {
                      lastError = "فشل إعادة التسمية: \(error.localizedDescription)"
                      return false
                  }
              }

              func delete(file: ImportedFile) {
                  let dir = kindDir(file.kind)
                  let url = dir.appendingPathComponent(file.storedName)
                  do {
                      if fm.fileExists(atPath: url.path) { try fm.removeItem(at: url) }
                      let meta = metadataURL(for: file)
                      if fm.fileExists(atPath: meta.path) { try? fm.removeItem(at: meta) }
                      if let icon = file.ipaIconName {
                          let iconURL = iconsDir.appendingPathComponent(icon)
                          if fm.fileExists(atPath: iconURL.path) { try? fm.removeItem(at: iconURL) }
                      }
                      files.removeAll { $0.id == file.id }
                      HapticManager.shared.success()
                  } catch {
                      lastError = "فشل الحذف: \(error.localizedDescription)"
                      HapticManager.shared.error()
                  }
              }

              func revalidate(_ file: ImportedFile) {
                  let dir = kindDir(file.kind)
                  let url = dir.appendingPathComponent(file.storedName)
                  guard fm.fileExists(atPath: url.path) else { return }
                  do {
                      switch file.kind {
                      case .ipa:
                          let info = try extractIPAInfo(at: url)
                          if let idx = files.firstIndex(where: { $0.id == file.id }) {
                              var updated = files[idx]
                              updated.ipaBundleID = info.bundleID
                              updated.ipaVersion = info.version
                              updated.ipaBuildNumber = info.build
                              updated.ipaDisplayName = info.displayName
                              updated.ipaIconName = info.iconFilename
                              updated.isValid = !info.bundleID.isEmpty
                              updated.validationError = info.bundleID.isEmpty ? "Info.plist فارغ" : nil
                              files[idx] = updated
                              persistMetadata(for: updated)
                          }
                      case .p12:
                          let ok = FileSignatureValidator.looksLikePKCS12(url)
                          updateValidity(fileID: file.id, isValid: ok,
                                         error: ok ? nil : "ليس ملف PKCS#12 صحيح")
                      case .mobileprovision:
                          let prof = try ProvisioningProfileInspector.read(from: url)
                          if let idx = files.firstIndex(where: { $0.id == file.id }) {
                              var updated = files[idx]
                              updated.profileName = prof.name
                              updated.profileTeamID = prof.teamID
                              updated.profileExpiration = prof.expirationDate
                              updated.isValid = !prof.name.isEmpty
                              updated.validationError = prof.name.isEmpty ? "ملف التزويد تالف" : nil
                              files[idx] = updated
                              persistMetadata(for: updated)
                          }
                      case .other:
                          break
                      }
                  } catch {
                      updateValidity(fileID: file.id, isValid: false, error: error.localizedDescription)
                  }
              }

              private func updateValidity(fileID: UUID, isValid: Bool, error: String?) {
                  if let idx = files.firstIndex(where: { $0.id == fileID }) {
                      var updated = files[idx]
                      updated.isValid = isValid
                      updated.validationError = error
                      files[idx] = updated
                      persistMetadata(for: updated)
                  }
              }

              private func fileMetadata(at url: URL, kind: ImportedFileKind) -> ImportedFile? {
                  let attrs = try? fm.attributesOfItem(atPath: url.path)
                  let size  = (attrs?[.size] as? NSNumber)?.int64Value ?? 0
                  let date  = (attrs?[.modificationDate] as? Date) ?? Date()

                  if let sidecar = readSidecar(forStoredName: url.lastPathComponent) {
                      return sidecar
                  }

                  var file = ImportedFile(
                      originalName: url.lastPathComponent,
                      storedName: url.lastPathComponent,
                      relativePath: "\(AppConstants.importedFilesDir)/\(kind.rawValue)/\(url.lastPathComponent)",
                      size: size,
                      kind: kind,
                      importedAt: date,
                      isValid: false,
                      validationError: "لم يتم التحقق"
                  )
                  switch kind {
                  case .ipa:
                      if let info = try? extractIPAInfo(at: url) {
                          file.ipaBundleID = info.bundleID
                          file.ipaVersion = info.version
                          file.ipaBuildNumber = info.build
                          file.ipaDisplayName = info.displayName
                          file.ipaIconName = info.iconFilename
                          file.isValid = !info.bundleID.isEmpty
                          if file.isValid { file.validationError = nil }
                      } else {
                          file.validationError = "ملف IPA تالف"
                      }
                  case .p12:
                      if FileSignatureValidator.looksLikePKCS12(url) {
                          file.isValid = true
                          file.validationError = nil
                      } else {
                          file.validationError = "ليس ملف PKCS#12 صحيح"
                      }
                  case .mobileprovision:
                      if let prof = try? ProvisioningProfileInspector.read(from: url) {
                          file.profileName = prof.name
                          file.profileTeamID = prof.teamID
                          file.profileExpiration = prof.expirationDate
                          file.isValid = !prof.name.isEmpty
                          if file.isValid { file.validationError = nil }
                      } else {
                          file.validationError = "ملف التزويد تالف"
                      }
                  case .other:
                      file.validationError = "نوع ملف غير مدعوم"
                  }
                  return file
              }

              private func readSidecar(forStoredName name: String) -> ImportedFile? {
                  let metaDir = importedRoot.appendingPathComponent("Meta", isDirectory: true)
                  guard let urls = try? fm.contentsOfDirectory(at: metaDir, includingPropertiesForKeys: nil) else { return nil }
                  for u in urls {
                      guard let data = try? Data(contentsOf: u),
                            let m = try? JSONDecoder().decode(ImportedFileMetadata.self, from: data),
                            m.storedName == name else { continue }
                      var file = ImportedFile(
                          id: UUID(uuidString: m.id) ?? UUID(),
                          originalName: m.originalName,
                          storedName: m.storedName,
                          relativePath: m.relativePath,
                          size: m.size,
                          kind: ImportedFileKind(rawValue: m.kind) ?? .other,
                          importedAt: m.importedAt,
                          isValid: m.isValid,
                          validationError: m.validationError
                      )
                      file.ipaBundleID = m.ipaBundleID
                      file.ipaVersion = m.ipaVersion
                      file.ipaBuildNumber = m.ipaBuildNumber
                      file.ipaDisplayName = m.ipaDisplayName
                      file.ipaIconName = m.ipaIconName
                      file.profileName = m.profileName
                      file.profileTeamID = m.profileTeamID
                      file.profileExpiration = m.profileExpiration
                      return file
                  }
                  return nil
              }

              private func uniqueName(_ original: String, in dir: URL) -> String {
                  var candidate = original
                  var counter = 1
                  let ext = (original as NSString).pathExtension
                  let base = (original as NSString).deletingPathExtension
                  while fm.fileExists(atPath: dir.appendingPathComponent(candidate).path) {
                      if !ext.isEmpty {
                          candidate = "\(base)-\(counter).\(ext)"
                      } else {
                          candidate = "\(base)-\(counter)"
                      }
                      counter += 1
                  }
                  return candidate
              }

              struct IPAInfo {
                  var bundleID: String = ""
                  var displayName: String = ""
                  var version: String = ""
                  var build: String = ""
                  var iconFilename: String? = nil
              }

              enum IPAError: LocalizedError {
                  case notAZip, noPayload, noInfoPlist, invalidPlist, io(String)
                  var errorDescription: String? {
                      switch self {
                      case .notAZip:        return "البنية ليست ZIP/IPA"
                      case .noPayload:      return "لا يوجد مجلد Payload"
                      case .noInfoPlist:    return "لا يوجد Info.plist"
                      case .invalidPlist:   return "Info.plist تالف"
                      case .io(let m):      return m
                      }
                  }
              }

              func extractIPAInfo(at ipaURL: URL) throws -> IPAInfo {
                  let data = try Data(contentsOf: ipaURL, options: .mappedIfSafe)
                  let parser = MinimalZipParser(data: data)
                  let entries = try parser.parse()

                  guard let infoEntry = entries.first(where: {
                      $0.path.hasPrefix("Payload/") &&
                      $0.path.hasSuffix(".app/Info.plist")
                  }) else { throw IPAError.noInfoPlist }

                  let infoData = try parser.readData(for: infoEntry)
                  guard let plistObj = try? PropertyListSerialization.propertyList(from: infoData, options: [], format: nil),
                        let dict = plistObj as? [String: Any] else {
                      throw IPAError.invalidPlist
                  }

                  let bundleID = (dict["CFBundleIdentifier"] as? String) ?? ""
                  let display  = (dict["CFBundleDisplayName"] as? String)
                              ?? (dict["CFBundleName"] as? String) ?? ""
                  let version  = (dict["CFBundleShortVersionString"] as? String) ?? ""
                  let build    = (dict["CFBundleVersion"] as? String) ?? ""

                  let appPrefix: String = {
                      if let slash = infoEntry.path.firstIndex(of: "/") {
                          let after = infoEntry.path.index(after: slash)
                          let rest = infoEntry.path[after...]
                          if let next = rest.firstIndex(of: "/") {
                              return String(infoEntry.path[..<next])
                          }
                      }
                      return "Payload/Unknown.app"
                  }()

                  var iconFilename: String? = nil
                  var iconNameFromPlist: String? = nil
                  if let icons = dict["CFBundleIcons"] as? [String: Any],
                     let primary = icons["CFBundlePrimaryIcon"] as? [String: Any],
                     let files = primary["CFBundleIconFiles"] as? [String],
                     let first = files.last {
                      iconNameFromPlist = first
                  }
                  if let files = dict["CFBundleIconFiles"] as? [String], iconNameFromPlist == nil {
                      iconNameFromPlist = files.last
                  }
                  if let iconBase = iconNameFromPlist {
                      let candidates = [
                          "\(iconBase)@2x.png", "\(iconBase)@3x.png", "\(iconBase).png",
                          "\(iconBase)@2x~ipad.png", "\(iconBase)~ipad.png"
                      ]
                      for c in candidates {
                          let p = "\(appPrefix)/\(c)"
                          if let e = entries.first(where: { $0.path == p }) {
                              if let png = try? parser.readData(for: e) {
                                  let name = "\(UUID().uuidString)-\(c)"
                                  let outURL = iconsDir.appendingPathComponent(name)
                                  try? png.write(to: outURL, options: .atomic)
                                  iconFilename = name
                                  break
                              }
                          }
                      }
                      if iconFilename == nil {
                          if let e = entries.first(where: {
                              $0.path.hasPrefix("\(appPrefix)/") &&
                              $0.path.contains(iconBase) &&
                              $0.path.hasSuffix(".png")
                          }) {
                              if let png = try? parser.readData(for: e) {
                                  let c = (e.path as NSString).lastPathComponent
                                  let name = "\(UUID().uuidString)-\(c)"
                                  let outURL = iconsDir.appendingPathComponent(name)
                                  try? png.write(to: outURL, options: .atomic)
                                  iconFilename = name
                              }
                          }
                      }
                  }

                  return IPAInfo(
                      bundleID: bundleID,
                      displayName: display,
                      version: version,
                      build: build,
                      iconFilename: iconFilename
                  )
              }

              func absoluteURL(for file: ImportedFile) -> URL {
                  return kindDir(file.kind).appendingPathComponent(file.storedName)
              }

              func iconURL(for file: ImportedFile) -> URL? {
                  guard let name = file.ipaIconName else { return nil }
                  let url = iconsDir.appendingPathComponent(name)
                  return fm.fileExists(atPath: url.path) ? url : nil
              }

              func deleteAll() {
                  for f in files { delete(file: f) }
              }
          }

          struct ImportedFileMetadata: Codable {
              let id: String
              let originalName: String
              let storedName: String
              let relativePath: String
              let size: Int64
              let kind: String
              let importedAt: Date
              let isValid: Bool
              let validationError: String?
              let ipaBundleID: String?
              let ipaVersion: String?
              let ipaBuildNumber: String?
              let ipaDisplayName: String?
              let ipaIconName: String?
              let profileName: String?
              let profileTeamID: String?
              let profileExpiration: Date?
          }

          enum FileSignatureValidator {
              static func looksLikePKCS12(_ url: URL) -> Bool {
                  guard let handle = try? FileHandle(forReadingFrom: url) else { return false }
                  defer { try? handle.close() }
                  guard let head = try? handle.read(upToCount: 4) else { return false }
                  return head.first == 0x30
              }
          }

          enum ProvisioningProfileInspector {
              struct Info {
                  var name: String = ""
                  var teamID: String = ""
                  var expirationDate: Date? = nil
              }
              static func read(from url: URL) throws -> Info {
                  guard let raw = try? String(contentsOf: url, encoding: .ascii) else {
                      throw NSError(domain: "Profile", code: 1, userInfo: [NSLocalizedDescriptionKey: "تعذر قراءة الملف"])
                  }
                  guard let startRange = raw.range(of: "<?xml"),
                        let endRange   = raw.range(of: "</plist>", options: .backwards) else {
                      throw NSError(domain: "Profile", code: 2, userInfo: [NSLocalizedDescriptionKey: "لا يوجد plist داخل الملف"])
                  }
                  let xml = String(raw[startRange.lowerBound..<endRange.upperBound])
                  guard let data = xml.data(using: .utf8),
                        let obj = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil),
                        let dict = obj as? [String: Any] else {
                      throw NSError(domain: "Profile", code: 3, userInfo: [NSLocalizedDescriptionKey: "plist غير صالح"])
                  }
                  var info = Info()
                  info.name = (dict["Name"] as? String) ?? ""
                  if let ent = dict["Entitlements"] as? [String: Any] {
                      info.teamID = (ent["com.apple.developer.team-identifier"] as? String) ?? ""
                  }
                  if let exp = dict["ExpirationDate"] as? Date {
                      info.expirationDate = exp
                  } else if let expStr = dict["ExpirationDate"] as? String {
                      let f = DateFormatter()
                      f.locale = Locale(identifier: "en_US_POSIX")
                      f.dateFormat = "yyyy-MM-dd'T'HH:mm:ss'Z'"
                      info.expirationDate = f.date(from: expStr)
                  }
                  return info
              }
          }

          struct MinimalZipEntry {
              let path: String
              let compressionMethod: UInt16
              let compressedSize: UInt32
              let uncompressedSize: UInt32
              let localHeaderOffset: UInt32
              let crc32: UInt32
              let dataRelativeOffset: UInt32
          }

          enum MinimalZipError: Error { case invalid, unsupported }

          final class MinimalZipParser {
              private let data: Data
              init(data: Data) { self.data = data }

              func parse() throws -> [MinimalZipEntry] {
                  var entries: [MinimalZipEntry] = []
                  let end = data.count
                  var eocdOffset: Int? = nil
                  if end >= 22 {
                      for i in stride(from: end - 22, through: max(0, end - 65557), by: -1) {
                          if read32(at: i) == 0x06054b50 {
                              eocdOffset = i
                              break
                          }
                      }
                  }
                  guard let eocd = eocdOffset else { throw MinimalZipError.invalid }
                  let totalEntries = Int(read16(at: eocd + 10))
                  let cdOffset = Int(read32(at: eocd + 16))
                  var p = cdOffset
                  for _ in 0..<totalEntries {
                      guard p + 46 <= end, read32(at: p) == 0x02014b50 else { throw MinimalZipError.invalid }
                      let compMethod = read16(at: p + 10)
                      let crc        = read32(at: p + 16)
                      let compSize   = read32(at: p + 20)
                      let uncompSize = read32(at: p + 24)
                      let nameLen    = Int(read16(at: p + 28))
                      let extraLen   = Int(read16(at: p + 30))
                      let commentLen = Int(read16(at: p + 32))
                      let localOff   = read32(at: p + 42)
                      let nameStart  = p + 46
                      let nameEnd    = nameStart + nameLen
                      guard nameEnd <= end else { throw MinimalZipError.invalid }
                      let nameData = data.subdata(in: nameStart..<nameEnd)
                      let path = String(data: nameData, encoding: .utf8) ?? ""

                      guard localOff < end, read32(at: Int(localOff)) == 0x04034b50 else { throw MinimalZipError.invalid }
                      let lhNameLen  = Int(read16(at: Int(localOff) + 26))
                      let lhExtraLen = Int(read16(at: Int(localOff) + 28))
                      let dataOff = UInt32(localOff) + 30 + UInt32(lhNameLen) + UInt32(lhExtraLen)

                      let entry = MinimalZipEntry(
                          path: path,
                          compressionMethod: compMethod,
                          compressedSize: compSize,
                          uncompressedSize: uncompSize,
                          localHeaderOffset: localOff,
                          crc32: crc,
                          dataRelativeOffset: dataOff
                      )
                      entries.append(entry)
                      p = nameEnd + extraLen + commentLen
                  }
                  return entries
              }

              func readData(for entry: MinimalZipEntry) throws -> Data {
                  let start = Int(entry.dataRelativeOffset)
                  let end   = start + Int(entry.compressedSize)
                  guard end <= data.count else { throw MinimalZipError.invalid }
                  let comp = data.subdata(in: start..<end)
                  switch entry.compressionMethod {
                  case 0: return comp
                  case 8:
                      guard let decoded = inflate(deflate: comp,
                                                  uncompressedSize: Int(entry.uncompressedSize)) else {
                          throw MinimalZipError.unsupported
                      }
                      return decoded
                  default: throw MinimalZipError.unsupported
                  }
              }

              private func read16(at offset: Int) -> UInt16 {
                  let lo = UInt16(data[offset])
                  let hi = UInt16(data[offset + 1])
                  return (hi << 8) | lo
              }
              private func read32(at offset: Int) -> UInt32 {
                  let b0 = UInt32(data[offset])
                  let b1 = UInt32(data[offset + 1])
                  let b2 = UInt32(data[offset + 2])
                  let b3 = UInt32(data[offset + 3])
                  return (b3 << 24) | (b2 << 16) | (b1 << 8) | b0
              }

              private func inflate(deflate compressed: Data, uncompressedSize: Int) -> Data? {
                  let capacity = max(uncompressedSize, 1024 * 64)
                  let dest = UnsafeMutablePointer<UInt8>.allocate(capacity: capacity)
                  defer { dest.deallocate() }
                  let decoded = compressed.withUnsafeBytes { (rawBuf: UnsafeRawBufferPointer) -> Int in
                      guard let baseAddr = rawBuf.baseAddress else { return 0 }
                      return compression_decode_buffer(
                          dest, capacity,
                          baseAddr.assumingMemoryBound(to: UInt8.self), compressed.count,
                          nil, COMPRESSION_ZLIB
                      )
                  }
                  if decoded == 0 { return nil }
                  return Data(bytes: dest, count: decoded)
              }
          }

          struct DocumentPicker: UIViewControllerRepresentable {
              let contentTypes: [UTType]
              let allowsMultiple: Bool
              let onPick: ([URL]) -> Void

              func makeCoordinator() -> Coordinator { Coordinator(onPick: onPick) }

              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: contentTypes, asCopy: true)
                  picker.allowsMultipleSelection = allowsMultiple
                  picker.shouldShowFileExtensions = true
                  picker.delegate = context.coordinator
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}

              final class Coordinator: NSObject, UIDocumentPickerDelegate {
                  let onPick: ([URL]) -> Void
                  init(onPick: @escaping ([URL]) -> Void) { self.onPick = onPick }

                  func documentPicker(_ controller: UIDocumentPickerViewController,
                                      didPickDocumentsAt urls: [URL]) {
                      onPick(urls)
                  }
                  func documentPickerWasCancelled(_ controller: UIDocumentPickerViewController) {
                      onPick([])
                  }
              }
          }
          VIPEOF

