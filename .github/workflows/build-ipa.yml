                                          .shadow(color: .black.opacity(0.3), radius: 10, y: 6)
                                  } else {
                                      Image(systemName: file.kind.icon)
                                          .font(.system(size: 70, weight: .bold))
                                          .foregroundColor(.white)
                                  }
                              }
                              .padding(.horizontal)

                              // Name
                              VStack(spacing: 4) {
                                  Text(file.ipaDisplayName ?? file.originalName)
                                      .font(.system(size: 20, weight: .heavy))
                                      .multilineTextAlignment(.center)
                                  Text(file.kind.displayName)
                                      .font(.system(size: 12, weight: .semibold))
                                      .foregroundColor(file.kind.color)
                              }

                              // Status
                              HStack(spacing: 8) {
                                  Image(systemName: file.isValid ? "checkmark.seal.fill" : "exclamationmark.triangle.fill")
                                      .foregroundColor(file.isValid ? .green : .orange)
                                  Text(file.isValid ? "ملف صالح" : (file.validationError ?? "ملف غير صالح"))
                                      .font(.system(size: 12, weight: .semibold))
                                      .foregroundColor(.primary)
                              }
                              .padding(.horizontal, 12).padding(.vertical, 6)
                              .background(Capsule().fill((file.isValid ? Color.green : Color.orange).opacity(0.12)))

                              // Info cards
                              VStack(spacing: 10) {
                                  InfoRow(icon: "memorychip", label: "الحجم", value: file.formattedSize)
                                  InfoRow(icon: "calendar", label: "تاريخ الاستيراد", value: file.formattedDate)
                                  InfoRow(icon: "doc.on.doc", label: "الاسم المخزّن", value: file.storedName)
                                  if let b = file.ipaBundleID, !b.isEmpty {
                                      InfoRow(icon: "app.badge.checkmark", label: "Bundle ID", value: b)
                                  }
                                  if let v = file.ipaVersion, !v.isEmpty {
                                      InfoRow(icon: "number", label: "النسخة", value: v)
                                  }
                                  if let b = file.ipaBuildNumber, !b.isEmpty {
                                      InfoRow(icon: "number.circle", label: "رقم البناء", value: b)
                                  }
                                  if let n = file.profileName, !n.isEmpty {
                                      InfoRow(icon: "doc.badge.gearshape", label: "اسم التزويد", value: n)
                                  }
                                  if let t = file.profileTeamID, !t.isEmpty {
                                      InfoRow(icon: "person.2", label: "Team ID", value: t)
                                  }
                                  if let e = file.profileExpiration {
                                      InfoRow(icon: "hourglass", label: "انتهاء التزويد", value: {
                                          let f = DateFormatter()
                                          f.dateStyle = .medium
                                          return f.string(from: e)
                                      }())
                                  }
                              }
                              .padding(.horizontal)

                              // Actions
                              VStack(spacing: 10) {
                                  GradientButton(title: "مشاركة الملف", icon: "square.and.arrow.up",
                                                 gradient: [.vipPurple, .blue]) {
                                      guard let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                                            let root = scene.keyWindow?.rootViewController else { return }
                                      let url = filesManager.absoluteURL(for: file)
                                      let sheet = UIActivityViewController(activityItems: [url], applicationActivities: nil)
