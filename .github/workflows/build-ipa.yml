      - name: Generate code - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import Foundation

          struct AppUser: Codable {
              let id: UUID
              let phoneNumber: String
              let username: String
              let password: String
              let createdAt: Date

              init(phoneNumber: String, username: String, password: String) {
                  self.id = UUID()
                  self.phoneNumber = phoneNumber
                  self.username = username
                  self.password = password
                  self.createdAt = Date()
              }
          }

          // ==================== Remote Store API models ====================
          struct StoreAPIResponse: Codable {
              let lastUpdated: String?
              let apps: [StoreAPIApp]

              enum CodingKeys: String, CodingKey {
                  case lastUpdated = "last_updated"
                  case apps
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)

                  self.lastUpdated = try? c.decode(String.self, forKey: .lastUpdated)

                  if let arr = try? c.decode([StoreAPIApp].self, forKey: .apps) {
                      self.apps = arr
                      return
                  }

                  struct Envelope: Codable {
                      let success: Bool?
                      let count: Int?
                      let apps: [StoreAPIApp]
                  }
                  if let env = try? c.decode(Envelope.self, forKey: .apps) {
                      self.apps = env.apps
                      return
                  }

                  if let one = try? c.decode(StoreAPIApp.self, forKey: .apps) {
                      self.apps = [one]
                      return
                  }

                  self.apps = []
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encodeIfPresent(lastUpdated, forKey: .lastUpdated)
                  try c.encode(apps, forKey: .apps)
              }
          }

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let bundleVersion: String?
              let ipaSize: String?
              let githubUrl: String?
              let archiveUrl: String?
              let ipaUrl: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let createdAt: String?
              let updatedAt: String?

              let downloadURL: String?
              let down: String?
              let iconURL: String?
              let localizedDescription: String?
              let developerName: String?
              let version: String?
              let versionDate: String?
              let fullDate: String?
              let size: Double?
              let type: Int?

              enum CodingKeys: String, CodingKey {
                  case id, name
                  case bundleId = "bundle_id"
                  case bundleIdAlt = "bundleID"
                  case bundleIdentifier
                  case bundleVersion = "bundle_version"
                  case ipaSize = "ipa_size"
                  case githubUrl = "github_url"
                  case archiveUrl = "archive_url"
                  case ipaUrl = "ipa_url"
                  case host
                  case icon
                  case iconURL
                  case description
                  case localizedDescription
                  case screenshots, category
                  case createdAt = "created_at"
                  case updatedAt = "updated_at"
                  case downloadURL
                  case down
                  case developerName
                  case version
                  case versionDate
                  case fullDate
                  case size, type
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  if let intId = try? c.decode(Int.self, forKey: .id) {
                      self.id = intId
                  } else {
                      let bundle = (try? c.decode(String.self, forKey: .bundleIdAlt))
                          ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                          ?? UUID().uuidString
                      self.id = abs(bundle.hashValue)
                  }
                  self.name = (try? c.decode(String.self, forKey: .name)) ?? "Untitled"
                  self.bundleId = (try? c.decode(String.self, forKey: .bundleId))
                      ?? (try? c.decode(String.self, forKey: .bundleIdAlt))
                      ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                  self.bundleVersion = (try? c.decode(String.self, forKey: .bundleVersion))
                      ?? (try? c.decode(String.self, forKey: .version))
                  self.ipaSize = (try? c.decode(String.self, forKey: .ipaSize))
                  self.githubUrl = (try? c.decode(String.self, forKey: .githubUrl))
                  self.archiveUrl = (try? c.decode(String.self, forKey: .archiveUrl))
                  self.ipaUrl = (try? c.decode(String.self, forKey: .ipaUrl))
                      ?? (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.host = (try? c.decode(String.self, forKey: .host))
                  self.icon = (try? c.decode(String.self, forKey: .icon))
                      ?? (try? c.decode(String.self, forKey: .iconURL))
                  self.description = (try? c.decode(String.self, forKey: .description))
                      ?? (try? c.decode(String.self, forKey: .localizedDescription))
                  self.screenshots = try? c.decode([String].self, forKey: .screenshots)
                  self.category = (try? c.decode(String.self, forKey: .category))
                  self.createdAt = (try? c.decode(String.self, forKey: .createdAt))
                  self.updatedAt = (try? c.decode(String.self, forKey: .updatedAt))
                      ?? (try? c.decode(String.self, forKey: .versionDate))
                      ?? (try? c.decode(String.self, forKey: .fullDate))
                  self.downloadURL = (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.down = (try? c.decode(String.self, forKey: .down))
                  self.iconURL = (try? c.decode(String.self, forKey: .iconURL))
                  self.localizedDescription = (try? c.decode(String.self, forKey: .localizedDescription))
                  self.developerName = (try? c.decode(String.self, forKey: .developerName))
                  self.version = (try? c.decode(String.self, forKey: .version))
                  self.versionDate = (try? c.decode(String.self, forKey: .versionDate))
                  self.fullDate = (try? c.decode(String.self, forKey: .fullDate))
                  self.size = (try? c.decode(Double.self, forKey: .size))
                  self.type = (try? c.decode(Int.self, forKey: .type))
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encode(id, forKey: .id)
                  try c.encode(name, forKey: .name)
                  try c.encodeIfPresent(bundleId, forKey: .bundleId)
                  try c.encodeIfPresent(bundleVersion, forKey: .bundleVersion)
                  try c.encodeIfPresent(ipaSize, forKey: .ipaSize)
                  try c.encodeIfPresent(githubUrl, forKey: .githubUrl)
                  try c.encodeIfPresent(archiveUrl, forKey: .archiveUrl)
                  try c.encodeIfPresent(ipaUrl, forKey: .ipaUrl)
                  try c.encodeIfPresent(host, forKey: .host)
                  try c.encodeIfPresent(icon, forKey: .icon)
                  try c.encodeIfPresent(description, forKey: .description)
                  try c.encodeIfPresent(screenshots, forKey: .screenshots)
                  try c.encodeIfPresent(category, forKey: .category)
                  try c.encodeIfPresent(createdAt, forKey: .createdAt)
                  try c.encodeIfPresent(updatedAt, forKey: .updatedAt)
              }

              var cleanSize: String {
                  if let s = size, s > 0 {
                      let f = ByteCountFormatter()
                      f.allowedUnits = [.useMB, .useGB, .useKB]
                      f.countStyle = .file
                      return f.string(fromByteCount: Int64(s))
                  }
                  if let s = ipaSize, !s.isEmpty { return s }
                  return "-"
              }

              var cleanDescription: String {
                  let raw = description ?? localizedDescription ?? ""
                  if raw.isEmpty {
                      return "Exclusive app on ONEs Store - download the premium version with all features enabled."
                  }
                  let lines = raw.split(whereSeparator: { $0.isNewline || $0 == "\r" })
                  return lines.joined(separator: " ").trimmingCharacters(in: .whitespacesAndNewlines)
              }

              var resolvedDownloadURL: String? {
                  return ipaUrl ?? downloadURL ?? down ?? githubUrl ?? archiveUrl
              }
          }

