                                  .font(.system(size: 10))
                                  .foregroundColor(.storeSub)
                          }
                      }
                      Spacer()
                      actionButton
                  }
                  .padding(12)
                  .background(
                      RoundedRectangle(cornerRadius: 14)
                          .fill(Color.storeCard)
                          .overlay(
                              RoundedRectangle(cornerRadius: 14)
                                  .stroke(Color.storeDivider, lineWidth: 0.5)
                          )
                  )
              }

              @ViewBuilder
              private var actionButton: some View {
                  if let t = task {
                      switch t.status {
                      case "running":
                          Button(action: onPause) {
