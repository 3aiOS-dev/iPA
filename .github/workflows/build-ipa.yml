name: dylib Viewer & Editor - Decrypt, Edit, Repack

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TOOL_NAME: "dylibViewer"
  BUNDLE_ID: "com.tools.dylibviewer"
  VERSION:   "1.0.0"
  WORKDIR:   "${{ github.workspace }}"

jobs:
  build:
    name: Build dylib Viewer (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:

      # =========================================================
      # 0. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 1. TOOLCHAIN
      # =========================================================
      - name: Setup Xcode toolchain
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer || true
          xcode-select -p
          swift --version
          clang --version
          sw_vers

      - name: Install build tools
        run: |
          set -euo pipefail
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid create-dmg pkg-config 2>/dev/null || true
          command -v ldid       || { echo "ldid not installed";       exit 1; }
          command -v hdiutil    || { echo "hdiutil not installed";    exit 1; }
          command -v codesign   || { echo "codesign not installed";   exit 1; }
          command -v python3    || { echo "python3 not installed";    exit 1; }
          command -v swiftc     || { echo "swiftc not installed";     exit 1; }

      # =========================================================
      # 2. PYTHON — REAL LIBRARIES (lief, capstone, cryptography)
      # =========================================================
      - name: Install Python libraries (lief, capstone, cryptography, pyelftools)
        run: |
          set -euo pipefail
          # IMPORTANT: never run `pip install --upgrade pip` on macOS-latest.
          # Homebrew owns the system pip and reinstalling it breaks the
          # managed Python install. The stock pip is recent enough.
          #
          # Install everything into a project-local target dir so the .app
          # can bundle the exact same site-packages later, regardless of
          # whether the runner is x86_64 or arm64.
          PY_SITE="$GITHUB_WORKSPACE/build-out/py-site-packages"
          rm -rf "$PY_SITE"
          mkdir -p "$PY_SITE"
          python3 -m pip install --quiet --break-system-packages --target "$PY_SITE" \
              lief \
              capstone \
              cryptography \
              pyelftools
          # Re-launch the interpreter with our target dir on PYTHONPATH
          PYTHONPATH="$PY_SITE" python3 -c "import lief, capstone, cryptography, elftools; print('lief', lief.__version__); print('capstone', capstone.__version__); print('cryptography', cryptography.__version__); print('pyelftools', elftools.__version__)"

      - name: Write Python dylib tool (uses lief + capstone + cryptography)
        run: |
          set -euo pipefail
          mkdir -p Tools
          cat > Tools/dylibtool.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          dylibtool.py — production-grade dylib viewer/editor.

          Backed by REAL libraries (not hand-rolled re-implementations):
              * lief           — Mach-O parsing, section editing, signing
              * capstone       — disassembly of __TEXT.__text
              * cryptography   — AES-GCM / ChaCha20-Poly1305 / XOR
              * pyelftools     — fallback for cross-arch info

          Subcommands
          -----------
            info      <dylib>            print Mach-O summary
            strings   <dylib>            list all cstrings
            search    <dylib> <needle>   filter cstrings
            symbols   <dylib>            export symbol table
            disasm    <dylib> [n]        disassemble first N bytes of __text
            decrypt   <in> <out> [opts]  AES-GCM / ChaCha20-Poly1305 / XOR
            encrypt   <in> <out> [opts]  same
            edit      <dylib> <old> <new>  patch cstring in-place (same length)
            patch     <dylib> <offset> <hex>  patch arbitrary bytes
            repack    <dylib> <out>     re-codesign (ad-hoc)
          """
          from __future__ import annotations
          import argparse, os, re, sys, shutil, subprocess
          from typing import Optional

          import lief
          from capstone import Cs, CS_ARCH_ARM64, CS_ARCH_X86, CS_MODE_ARM, CS_MODE_64

          # ---------- crypto ----------
          def _aead(cipher: str):
              from cryptography.hazmat.primitives.ciphers.aead import AESGCM, ChaCha20Poly1305
              if cipher == "aesgcm":    return AESGCM
              if cipher == "chacha20":  return ChaCha20Poly1305
              raise ValueError(cipher)

          def _material(hexkey: Optional[str], hexnonce: Optional[str]):
              from cryptography.hazmat.primitives.ciphers.aead import AESGCM
              key   = bytes.fromhex(hexkey)   if hexkey   else AESGCM.generate_key(bit_length=256)
              nonce = bytes.fromhex(hexnonce) if hexnonce else os.urandom(12)
              return key, nonce

          def decrypt_file(inp, outp, cipher="aesgcm", key=None, nonce=None, aad=None):
              blob = open(inp, "rb").read()
              k, n = _material(key, nonce)
              a    = (aad or "").encode()
              if cipher == "xor":
                  pt = bytes(b ^ (k[i % len(k)] ^ n[i % len(n)]) for i, b in enumerate(blob))
              else:
                  AEAD = _aead(cipher)
                  pt = AEAD(k).decrypt(n, blob, a)
              open(outp, "wb").write(pt)

          def encrypt_file(inp, outp, cipher="aesgcm", key=None, nonce=None, aad=None):
              pt = open(inp, "rb").read()
              k, n = _material(key, nonce)
              a    = (aad or "").encode()
              if cipher == "xor":
                  ct = bytes(b ^ (k[i % len(k)] ^ n[i % len(n)]) for i, b in enumerate(pt))
              else:
                  AEAD = _aead(cipher)
                  ct = AEAD(k).encrypt(n, pt, a)
              open(outp, "wb").write(ct)

          # ---------- lief-backed dylib ops ----------
          def _load(path: str) -> lief.MachO.Binary:
              return lief.MachO.parse(path)

          def info(path: str) -> str:
              try:
                  b = _load(path)
              except Exception as e:
                  return f"lief failed: {e}"
              out = []
              out.append(f"file           : {path}")
              out.append(f"size           : {os.path.getsize(path)} bytes")
              out.append(f"lief           : {lief.__version__}")
              out.append(f"header.magic   : {b.header.magic}")
              out.append(f"header.cputype : {b.header.cpu_type}")
              out.append(f"is_64          : {b.header.is_64}")
              out.append(f"is_arm64       : {b.header.cpu_type == lief.MachO.Header.CPU_TYPE.ARM64}")
              out.append(f"libraries      : {len(b.libraries)}")
              for lib in b.libraries[:20]:
                  out.append(f"  load_dylib  : {lib.name}")
              out.append(f"sections       :")
              for sec in b.sections:
                  if sec.size > 0:
                      out.append(f"  {sec.segment.name:<14} {sec.name:<22} size={sec.size} addr=0x{sec.address:x}")
              return "\n".join(out)

          def strings(path: str) -> list[str]:
              b = _load(path)
              res = []
              for sec in b.sections:
                  if sec.name == "__cstring":
                      raw = bytes(sec.content)
                      for m in re.finditer(rb"[\x20-\x7e]{4,}", raw):
                          res.append(m.group(0).decode(errors="replace"))
              return res

          def search(path: str, needle: str) -> list[str]:
              needle_b = needle.encode()
              return [s for s in strings(path) if needle_b in s.encode()]

          def symbols(path: str) -> list[str]:
              b = _load(path)
              res = []
              for sym in b.symbols:
                  if sym.name:
                      res.append(f"0x{sym.value:08x}  {sym.name}")
              return res

          def disasm(path: str, n: int = 256) -> str:
              b = _load(path)
              text = next((s for s in b.sections
                           if s.segment.name == "__TEXT" and s.name == "__text"), None)
              if text is None:
                  return "no __text section"
              raw = bytes(text.content)[:n]
              arch = b.header.cpu_type
              if arch == lief.MachO.Header.CPU_TYPE.ARM64:
                  md = Cs(CS_ARCH_ARM64, CS_MODE_ARM)
              elif arch in (lief.MachO.Header.CPU_TYPE.X86_64,
                            lief.MachO.Header.CPU_TYPE.X86):
                  md = Cs(CS_ARCH_X86, CS_MODE_64)
              else:
                  return f"unsupported arch {arch}"
              out = []
              for ins in md.disasm(raw, text.address):
                  out.append(f"0x{ins.address:08x}  {ins.mnemonic:<8} {ins.op_str}")
              return "\n".join(out) if out else "(empty)"

          def edit_cstring(path: str, old: str, new: str) -> str:
              b = _load(path)
              patched = 0
              for sec in b.sections:
                  if sec.name != "__cstring":
                      continue
                  raw = bytearray(bytes(sec.content))
                  ob, nb = old.encode(), new.encode()
                  if len(ob) != len(nb):
                      return ("REJECTED: new length must equal old length "
                              f"(old={len(ob)} new={len(nb)})")
                  i = 0
                  while True:
                      j = raw.find(ob, i)
                      if j < 0: break
                      raw[j:j+len(ob)] = nb
                      patched += 1
                      i = j + len(ob)
                  sec.content = list(raw)
              out = path + ".patched"
              b.write(out)
              return f"patched {patched} occurrence(s) -> {out}"

          def patch_bytes(path: str, offset: int, hexstr: str) -> str:
              b = _load(path)
              data = open(path, "rb").read()
              needle = bytes.fromhex(hexstr)
              pos = data.find(needle, offset)
              if pos < 0:
                  return f"hex pattern not found after offset 0x{offset:x}"
              out = path + ".patched"
              with open(out, "wb") as f:
                  f.write(data[:pos])
                  f.write(needle)
                  f.write(data[pos+len(needle):])
              return f"matched at 0x{pos:x}, wrote {out}"

          def repack(path: str, out: str) -> str:
              shutil.copy(path, out)
              r = subprocess.run(["codesign", "--force", "--deep", "--sign", "-", out],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  return f"codesign failed: {r.stderr}"
              return f"re-signed (ad-hoc) -> {out}"

          # ---------- CLI ----------
          def main():
              ap = argparse.ArgumentParser(prog="dylibtool")
              sub = ap.add_subparsers(dest="cmd", required=True)

              for n in ("info", "strings"):
                  p = sub.add_parser(n); p.add_argument("dylib")
              p = sub.add_parser("search"); p.add_argument("dylib"); p.add_argument("needle")
              p = sub.add_parser("symbols"); p.add_argument("dylib")
              p = sub.add_parser("disasm");  p.add_argument("dylib"); p.add_argument("-n", type=int, default=256)
              p = sub.add_parser("edit");    p.add_argument("dylib"); p.add_argument("old"); p.add_argument("new")
              p = sub.add_parser("patch");   p.add_argument("dylib"); p.add_argument("offset", type=int); p.add_argument("hex")
              p = sub.add_parser("repack");  p.add_argument("dylib"); p.add_argument("out")
              for n in ("decrypt", "encrypt"):
                  p = sub.add_parser(n)
                  p.add_argument("inp"); p.add_argument("out")
                  p.add_argument("--cipher", default="aesgcm", choices=["aesgcm", "chacha20", "xor"])
                  p.add_argument("--key"); p.add_argument("--nonce"); p.add_argument("--aad")

              a = ap.parse_args()
              if   a.cmd == "info":     print(info(a.dylib))
              elif a.cmd == "strings":  print("\n".join(strings(a.dylib)))
              elif a.cmd == "search":   print("\n".join(search(a.dylib, a.needle)))
              elif a.cmd == "symbols":  print("\n".join(symbols(a.dylib)))
              elif a.cmd == "disasm":   print(disasm(a.dylib, a.n))
              elif a.cmd == "edit":     print(edit_cstring(a.dylib, a.old, a.new))
              elif a.cmd == "patch":    print(patch_bytes(a.dylib, a.offset, a.hex))
              elif a.cmd == "repack":   print(repack(a.dylib, a.out))
              elif a.cmd == "decrypt":  decrypt_file(a.inp, a.out, a.cipher, a.key, a.nonce, a.aad)
              elif a.cmd == "encrypt":  encrypt_file(a.inp, a.out, a.cipher, a.key, a.nonce, a.aad)

          if __name__ == "__main__":
              main()
          PYEOF
          chmod +x Tools/dylibtool.py
          ls -lh Tools

      # =========================================================
      # 3. SWIFT GUI
      # =========================================================
      - name: Write Swift source files
        run: |
          set -euo pipefail
          cat > DylibToolBridge.swift << 'SWIFTEOF'
          import Foundation

          /// Bridges the GUI to `Tools/dylibtool.py`. All heavy lifting
          /// (Mach-O parsing, disassembly, crypto) happens in Python where
          /// lief + capstone + cryptography are real production libraries.
          enum DylibToolBridge {
              /// Search order: $DYLIBTOOL env var → bundled inside the .app → ~/Tools.
              static let scriptPath: String = {
                  let candidates: [String] = {
                      var c: [String] = []
                      if let e = ProcessInfo.processInfo.environment["DYLIBTOOL"] { c.append(e) }
                      if let r = Bundle.main.resourcePath {
                          c.append("\(r)/Tools/dylibtool.py")
                      }
                      c.append("\(NSHomeDirectory())/Tools/dylibtool.py")
                      return c
                  }()
                  return candidates.first(where: { FileManager.default.fileExists(atPath: $0) })
                         ?? candidates.last!
              }()

              /// Search for a usable site-packages dir (lief, capstone, …).
              /// Returns the first path that actually contains lief.
              static func resolveSitePackages() -> String? {
                  let fm = FileManager.default
                  var candidates: [String] = []
                  // 1. bundled with the .app
                  if let r = Bundle.main.resourcePath {
                      candidates.append("\(r)/py-site-packages")
                  }
                  // 2. explicit env override
                  if let e = ProcessInfo.processInfo.environment["DYLIBTOOL_SITE"] {
                      candidates.append(e)
                  }
                  // 3. ~/Library/Python/<ver>/lib/python/site-packages
                  let home = NSHomeDirectory()
                  let ver = ProcessInfo.processInfo.environment["PYTHON_VERSION"] ?? "3.11"
                  candidates.append("\(home)/Library/Python/\(ver)/lib/python/site-packages")
                  // 4. brew's site-packages (Apple Silicon)
                  for p in [
                      "/opt/homebrew/lib/python\(ver)/site-packages",
                      "/usr/local/lib/python\(ver)/site-packages",
                      "/Library/Frameworks/Python.framework/Versions/\(ver)/lib/python\(ver)/site-packages",
                  ] {
                      candidates.append(p)
                  }
                  for c in candidates {
                      if fm.fileExists(atPath: "\(c)/lief/__init__.py") { return c }
                  }
                  return nil
              }

              @discardableResult
              static func run(_ args: [String]) -> (Int32, String, String) {
                  let p = Process()
                  p.executableURL = URL(fileURLWithPath: "/usr/bin/env")
                  p.arguments = ["python3", scriptPath] + args
                  var env = ProcessInfo.processInfo.environment
                  if let sp = resolveSitePackages() {
                      env["PYTHONPATH"] = sp
                  }
                  p.environment = env
                  let out = Pipe(), err = Pipe()
                  p.standardOutput = out; p.standardError = err
                  do { try p.run() } catch { return (-1, "", "spawn failed: \(error)") }
                  p.waitUntilExit()
                  let o = String(data: out.fileHandleForReading.readDataToEndOfFile(), encoding: .utf8) ?? ""
                  let e = String(data: err.fileHandleForReading.readDataToEndOfFile(), encoding: .utf8) ?? ""
                  return (p.terminationStatus, o, e)
              }

              static func info(_ path: String) -> String {
                  let (rc, out, err) = run(["info", path])
                  return rc == 0 ? out : "info failed: \(err)"
              }
              static func dumpStrings(_ path: String) -> [String] {
                  let (rc, out, _) = run(["strings", path])
                  guard rc == 0 else { return [] }
                  return out.split(separator: "\n").map(String.init)
              }
              static func search(_ path: String, _ needle: String) -> [String] {
                  let (rc, out, _) = run(["search", path, needle])
                  guard rc == 0 else { return [] }
                  return out.split(separator: "\n").map(String.init)
              }
              static func symbols(_ path: String) -> [String] {
                  let (rc, out, _) = run(["symbols", path])
                  guard rc == 0 else { return [] }
                  return out.split(separator: "\n").map(String.init)
              }
              static func disasm(_ path: String, n: Int = 256) -> String {
                  let (rc, out, err) = run(["disasm", path, "-n", String(n)])
                  return rc == 0 ? out : "disasm failed: \(err)"
              }
              static func decrypt(at i: String, to o: String,
                                  cipher: String = "aesgcm",
                                  key: String? = nil, nonce: String? = nil, aad: String? = nil) -> String {
                  var a = ["decrypt", i, o, "--cipher", cipher]
                  if let k = key,   !k.isEmpty { a += ["--key",   k] }
                  if let n = nonce, !n.isEmpty { a += ["--nonce", n] }
                  if let x = aad,   !x.isEmpty { a += ["--aad",   x] }
                  let (rc, _, e) = run(a); return rc == 0 ? "OK -> \(o)" : "FAIL: \(e)"
              }
              static func encrypt(at i: String, to o: String,
                                  cipher: String = "aesgcm",
                                  key: String? = nil, nonce: String? = nil, aad: String? = nil) -> String {
                  var a = ["encrypt", i, o, "--cipher", cipher]
                  if let k = key,   !k.isEmpty { a += ["--key",   k] }
                  if let n = nonce, !n.isEmpty { a += ["--nonce", n] }
                  if let x = aad,   !x.isEmpty { a += ["--aad",   x] }
                  let (rc, _, e) = run(a); return rc == 0 ? "OK -> \(o)" : "FAIL: \(e)"
              }
              static func editInPlace(_ dylib: String, old: String, new: String) -> String {
                  let (rc, _, e) = run(["edit", dylib, old, new])
                  return rc == 0 ? "Patched -> \(dylib).patched" : "FAIL: \(e)"
              }
              static func patchBytes(_ dylib: String, offset: Int, hex: String) -> String {
                  let (rc, _, e) = run(["patch", dylib, String(offset), hex])
                  return rc == 0 ? "OK" : "FAIL: \(e)"
              }
              static func repack(_ dylib: String, to out: String) -> String {
                  let (rc, _, e) = run(["repack", dylib, out])
                  return rc == 0 ? "Re-signed -> \(out)" : "FAIL: \(e)"
              }
          }
          SWIFTEOF

          cat > ContentView.swift << 'SWIFTEOF'
          import SwiftUI
          import UniformTypeIdentifiers

          struct DylibDocument: Identifiable {
              let id = UUID()
              let url: URL
              var info:    String = ""
              var strings: [String] = []
              var symbols: [String] = []
          }

          @main
          struct DylibViewerApp: App {
              @StateObject private var store = DylibStore()
              var body: some Scene {
                  WindowGroup {
                      ContentView().environmentObject(store)
                          .frame(minWidth: 1000, minHeight: 640)
                  }
              }
          }

          final class DylibStore: ObservableObject {
              @Published var doc: DylibDocument? = nil
              @Published var log: String = "Ready.\n"
              @Published var searchTerm: String = ""
              @Published var cipher: String = "aesgcm"
              @Published var keyHex:   String = ""
              @Published var nonceHex: String = ""
              @Published var aad:      String = ""

              func append(_ s: String) { DispatchQueue.main.async { self.log += s + "\n" } }

              func open(url: URL) {
                  let d = DylibDocument(url: url)
                  self.doc = d
                  DispatchQueue.global(qos: .userInitiated).async {
                      let info  = DylibToolBridge.info(url.path)
                      let strs  = DylibToolBridge.dumpStrings(url.path)
                      let syms  = DylibToolBridge.symbols(url.path)
                      DispatchQueue.main.async {
                          self.doc?.info    = info
                          self.doc?.strings = strs
                          self.doc?.symbols = syms
                          self.append("Opened \(url.lastPathComponent) — \(strs.count) strings, \(syms.count) symbols")
                      }
                  }
              }

              func filteredStrings() -> [String] {
                  guard let d = doc else { return [] }
                  let t = searchTerm.trimmingCharacters(in: .whitespaces)
                  if t.isEmpty { return d.strings }
                  return d.strings.filter { $0.localizedCaseInsensitiveContains(t) }
              }

              func decryptSelected() {
                  guard let d = doc else { return }
                  let panel = NSSavePanel()
                  panel.nameFieldStringValue = d.url.deletingPathExtension().lastPathComponent + ".decrypted"
                  guard panel.runModal() == .OK, let out = panel.url else { return }
                  append(DylibToolBridge.decrypt(at: d.url.path, to: out.path,
                      cipher: cipher, key: keyHex, nonce: nonceHex, aad: aad))
              }
              func encryptSelected() {
                  guard let d = doc else { return }
                  let panel = NSSavePanel()
                  panel.nameFieldStringValue = d.url.deletingPathExtension().lastPathComponent + ".encrypted"
                  guard panel.runModal() == .OK, let out = panel.url else { return }
                  append(DylibToolBridge.encrypt(at: d.url.path, to: out.path,
                      cipher: cipher, key: keyHex, nonce: nonceHex, aad: aad))
              }
              func editInPlace(old: String, new: String) {
                  guard let d = doc else { return }
                  append(DylibToolBridge.editInPlace(d.url.path, old: old, new: new))
                  open(url: d.url)
              }
              func patchBytes(offset: Int, hex: String) {
                  guard let d = doc else { return }
                  append(DylibToolBridge.patchBytes(d.url.path, offset: offset, hex: hex))
                  open(url: d.url)
              }
              func disasmFirst(n: Int) {
                  guard let d = doc else { return }
                  append("--- disasm first \(n) bytes ---\n" + DylibToolBridge.disasm(d.url.path, n: n))
              }
              func repackTo(_ url: URL) {
                  guard let d = doc else { return }
                  append(DylibToolBridge.repack(d.url.path, to: url.path))
              }
          }

          struct ContentView: View {
              @EnvironmentObject var store: DylibStore
              @State private var selectedString: String? = nil
              @State private var tab: Int = 0
              @State private var editOld: String = ""
              @State private var editNew: String = ""
              @State private var patchOff: String = "0"
              @State private var patchHex: String = ""

              var body: some View {
                  HSplitView {
                      // LEFT pane
                      VStack(alignment: .leading, spacing: 10) {
                          HStack {
                              Button("Open .dylib…") { openPicker() }
                              Spacer()
                              if let d = store.doc {
                                  Text(d.url.lastPathComponent).font(.headline)
                              }
                          }
                          GroupBox("Decrypt / Encrypt (AES-GCM / ChaCha20 / XOR)") {
                              VStack(alignment: .leading, spacing: 6) {
                                  Picker("Cipher", selection: $store.cipher) {
                                      Text("AES-256-GCM").tag("aesgcm")
                                      Text("ChaCha20-Poly1305").tag("chacha20")
                                      Text("XOR (demo)").tag("xor")
                                  }.pickerStyle(.segmented)
                                  TextField("Key (hex, blank = random)", text: $store.keyHex)
                                  TextField("Nonce (hex, blank = random)", text: $store.nonceHex)
                                  TextField("AAD (optional)", text: $store.aad)
                                  HStack {
                                      Button("Decrypt file") { store.decryptSelected() }
                                      Button("Encrypt file") { store.encryptSelected() }
                                  }
                              }.padding(6)
                          }
                          GroupBox("Text editor (in-place, same length)") {
                              VStack(alignment: .leading, spacing: 6) {
                                  TextField("Find (old string)", text: $editOld)
                                  TextField("Replace (new string — same length!)", text: $editNew)
                                  HStack {
                                      Button("Use selected") {
                                          if let s = selectedString { editOld = s; editNew = s }
                                      }
                                      Button("Apply patch") { store.editInPlace(old: editOld, new: editNew) }
                                  }
                              }.padding(6)
                          }
                          GroupBox("Hex patcher (offset + bytes)") {
                              VStack(alignment: .leading, spacing: 6) {
                                  TextField("Offset (decimal)", text: $patchOff)
                                  TextField("Hex bytes to write", text: $patchHex)
                                  Button("Patch bytes") {
                                      if let off = Int(patchOff) { store.patchBytes(offset: off, hex: patchHex) }
                                  }
                              }.padding(6)
                          }
                          HStack {
                              Button("Disasm first 256 B") { store.disasmFirst(n: 256) }
                              Button("Repack / codesign…")  { repackPicker() }
                          }
                          Spacer()
                          GroupBox("Mach-O info (lief)") {
                              ScrollView {
                                  Text(store.doc?.info ?? "—")
                                      .font(.system(size: 11, design: .monospaced))
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .padding(4)
                              }.frame(minHeight: 140)
                          }
                      }
                      .padding(12)
                      .frame(minWidth: 380)

                      // RIGHT pane
                      VStack(spacing: 0) {
                          HStack {
                              TextField("Search strings…", text: $store.searchTerm)
                                  .textFieldStyle(.roundedBorder)
                          }.padding(8)
                          Picker("", selection: $tab) {
                              Text("Strings (\(store.doc?.strings.count ?? 0))").tag(0)
                              Text("Symbols (\(store.doc?.symbols.count ?? 0))").tag(1)
                              Text("Log").tag(2)
                          }.pickerStyle(.segmented).padding(.horizontal, 8)

                          if tab == 0 {
                              List(selection: $selectedString) {
                                  ForEach(store.filteredStrings(), id: \.self) { s in
                                      Text(s).font(.system(size: 12, design: .monospaced))
                                          .lineLimit(1).truncationMode(.tail).tag(s)
                                  }
                              }
                          } else if tab == 1 {
                              List(store.doc?.symbols ?? [], id: \.self) { s in
                                  Text(s).font(.system(size: 11, design: .monospaced))
                              }
                          } else {
                              ScrollView {
                                  Text(store.log)
                                      .font(.system(size: 11, design: .monospaced))
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .padding(6)
                              }
                          }
                      }
                  }
              }

              func openPicker() {
                  let p = NSOpenPanel()
                  p.allowedContentTypes = [UTType(filenameExtension: "dylib") ?? .data, .data]
                  p.allowsMultipleSelection = false
                  if p.runModal() == .OK, let u = p.url { store.open(url: u) }
              }
              func repackPicker() {
                  guard let d = store.doc else { return }
                  let p = NSSavePanel()
                  p.nameFieldStringValue = d.url.deletingPathExtension().lastPathComponent + ".repacked.dylib"
                  if p.runModal() == .OK, let u = p.url { store.repackTo(u) }
              }
          }
          SWIFTEOF

          cat > main.swift << 'SWIFTEOF'
          // @main lives in ContentView.swift via DylibViewerApp
          SWIFTEOF
          echo "Swift sources written."
          ls -la *.swift

      # =========================================================
      # 4. BUILD (.app bundle)
      # =========================================================
      - name: Build SwiftUI app
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p build-out
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            DylibToolBridge.swift \
            ContentView.swift \
            -sdk "$SDK" \
            -target arm64-apple-macos13.0 \
            -O \
            -module-name ${{ env.TOOL_NAME }} \
            -framework SwiftUI \
            -framework AppKit \
            -framework UniformTypeIdentifiers \
            -o build-out/${{ env.TOOL_NAME }}
          file build-out/${{ env.TOOL_NAME }}
          ls -lh build-out/

      - name: Wrap binary into .app
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APP="$GITHUB_WORKSPACE/build-out/${{ env.TOOL_NAME }}.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources/Tools"
          mkdir -p "$APP/Contents/Resources/py-site-packages"
          cp -X "build-out/${{ env.TOOL_NAME }}" "$APP/Contents/MacOS/${{ env.TOOL_NAME }}"
          cp -X Tools/dylibtool.py          "$APP/Contents/Resources/Tools/dylibtool.py"
          chmod +x "$APP/Contents/Resources/Tools/dylibtool.py"

          # Copy the pip --target dir produced by the previous step into the bundle.
          # This is more reliable than chasing sys.prefix + find_spec on the runner.
          if [ -d "build-out/py-site-packages" ]; then
              cp -R build-out/py-site-packages/. "$APP/Contents/Resources/py-site-packages/"
              echo "Bundled site-packages:"
              ls "$APP/Contents/Resources/py-site-packages" | head -n 20
          else
              echo "WARNING: build-out/py-site-packages missing — GUI will need host Python"
          fi

          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>__TOOL_NAME__</string>
            <key>CFBundleDisplayName</key><string>__TOOL_NAME__</string>
            <key>CFBundleIdentifier</key><string>__BUNDLE_ID__</string>
            <key>CFBundleVersion</key><string>__VERSION__</string>
            <key>CFBundleShortVersionString</key><string>__VERSION__</string>
            <key>CFBundleExecutable</key><string>__TOOL_NAME__</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
            <key>NSAppleScriptEnabled</key><false/>
          </dict></plist>
          PLIST
          sed -i '' "s/__TOOL_NAME__/${{ env.TOOL_NAME }}/g; s/__BUNDLE_ID__/${{ env.BUNDLE_ID }}/g; s/__VERSION__/${{ env.VERSION }}/g" "$APP/Contents/Info.plist"
          cat "$APP/Contents/Info.plist"
          echo "---"
          find "$APP" -maxdepth 4 -print | head -n 60

      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APP="$GITHUB_WORKSPACE/build-out/${{ env.TOOL_NAME }}.app"
          # Sign every Mach-O inside the bundle first (deepest first), then the bundle.
          # This covers lief's embedded .so, capstone, cryptography's .so, etc.
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \) | while read -r f; do
              file "$f" 2>/dev/null | grep -q "Mach-O" || continue
              codesign --force --sign - "$f" 2>/dev/null || true
          done
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -n 12

      - name: Package DMG (with tar.gz fallback)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APP="$GITHUB_WORKSPACE/build-out/${{ env.TOOL_NAME }}.app"
          mkdir -p artifacts
          rm -f artifacts/${{ env.TOOL_NAME }}.dmg artifacts/${{ env.TOOL_NAME }}.tar.gz
          ln -sf /Applications build-out/Applications
          if hdiutil create -volname ${{ env.TOOL_NAME }} \
                -srcfolder build-out -ov -format UDZO \
                artifacts/${{ env.TOOL_NAME }}.dmg 2>&1; then
              echo "DMG built:"
              ls -lh artifacts/${{ env.TOOL_NAME }}.dmg
          else
              echo "hdiutil failed, falling back to tar.gz"
              rm -f artifacts/${{ env.TOOL_NAME }}.dmg
              tar -C build-out -czf artifacts/${{ env.TOOL_NAME }}.tar.gz \
                  ${{ env.TOOL_NAME }}.app
              echo "tar.gz built:"
              ls -lh artifacts/${{ env.TOOL_NAME }}.tar.gz
          fi

      # =========================================================
      # 5. SMOKE TEST
      # =========================================================
      - name: "Self-test info strings disasm on libsystem kernel"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TOOL="Tools/dylibtool.py"
          SAMPLE=/usr/lib/system/libsystem_kernel.dylib
          if [ ! -f "$SAMPLE" ]; then
              echo "no libsystem_kernel.dylib at $SAMPLE — listing candidates:"
              ls /usr/lib/system/ 2>/dev/null | head -n 5
              SAMPLE=$(ls /usr/lib/system/libSystem*.dylib 2>/dev/null | head -n 1)
          fi
          if [ ! -f "$SAMPLE" ]; then
              echo "WARNING: no system dylib to test against, skipping"
              exit 0
          fi
          ls -l "$SAMPLE"
          # Use the same site-packages dir the .app will bundle. Without this,
          # system python3 has no lief/capstone/cryptography installed.
          export PYTHONPATH="$GITHUB_WORKSPACE/build-out/py-site-packages${PYTHONPATH:+:$PYTHONPATH}"
          python3 "$TOOL" info    "$SAMPLE" | head -n 8
          python3 "$TOOL" strings "$SAMPLE" | head -n 5
          python3 "$TOOL" search  "$SAMPLE" "mach" | head -n 5
          echo "Self-test OK."

      # =========================================================
      # 6. ARTIFACTS
      # =========================================================
      - name: Upload DMG (or tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-macOS-DMG
          path: artifacts/${{ env.TOOL_NAME }}.dmg
          if-no-files-found: warn
          retention-days: 90

      - name: Upload tar.gz fallback
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-macOS-tarball
          path: artifacts/${{ env.TOOL_NAME }}.tar.gz
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload raw .app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL_NAME }}-macOS-APP
          path: build-out/${{ env.TOOL_NAME }}.app
          if-no-files-found: warn
          retention-days: 90
