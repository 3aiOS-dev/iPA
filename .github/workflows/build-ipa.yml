                      Divider().overlay(Color.white.opacity(0.08))

                      ScrollView {
                          VStack(spacing: 18) {
                              VStack(spacing: 6) {
                                  Text("اجعل حضورك مميزًا")
                                      .font(.system(size: 22, weight: .black))
