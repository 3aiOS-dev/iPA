                  .cta{z-index:2;font-size:11.5px;font-weight:800;padding:8px 15px;border-radius:999px;
                  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.42);white-space:nowrap;
                  backdrop-filter:blur(6px);animation:pl 2.2s ease-in-out infinite}
                  @keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
