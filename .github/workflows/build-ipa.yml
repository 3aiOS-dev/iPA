      - name: Generate code - Repositories.swift
        run: |
          cat > Repositories.swift << 'VIPEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class RepositoriesStore: ObservableObject {
              static let shared = RepositoriesStore()

              @Published private(set) var repositories: [DownloadRepository]
              @Published private(set) var quota: DownloadQuota
              @Published private(set) var totalAppsAvailable: Int = 0

              private let keyRepos = "repositories.v1"
              private let keyQuota = "quota.v1"
              private let d = UserDefaults.standard

              private init() {
                  if let data = d.data(forKey: keyQuota),
                     let decoded = try? JSONDecoder().decode(DownloadQuota.self, from: data) {
                      self.quota = decoded
                  } else {
                      self.quota = DownloadQuota(
                          id: "user-quota",
                          totalBytes: Int64(1000) * 1_073_741_824,
                          usedBytes: 0
                      )
                  }

                  if let data = d.data(forKey: keyRepos),
                     let decoded = try? JSONDecoder().decode([DownloadRepository].self, from: data) {
                      self.repositories = decoded
                  } else {
                      self.repositories = [
                          DownloadRepository(
                              id: "apptesters-main",
                              name: "AppTesters IPA Repo",
                              feedURL: "https://repository.apptesters.org/apps.json",
                              homepage: "https://apptesters.org",
                              enabled: true,
                              maxGB: 250
                          ),
                          DownloadRepository(
                              id: "apptesters-mirror",
                              name: "AppTesters Mirror",
                              feedURL: "https://repo.apptesters.org/index.json",
                              homepage: "https://apptesters.org",
                              enabled: true,
                              maxGB: 250
                          ),
                          DownloadRepository(
                              id: "21s-originals",
                              name: "21s Originals",
                              feedURL: "https://21s.app/repo/apps.json",
                              homepage: "https://21s.app",
                              enabled: true,
                              maxGB: 500
                          )
                      ]
                  }

                  self.persistRepositories()
                  self.persistQuota()
              }

              func totalMaxGB() -> Double {
                  repositories.filter { $0.enabled }.reduce(0) { $0 + $1.maxGB }
              }

              func setEnabled(_ enabled: Bool, for repo: DownloadRepository) {
                  guard let idx = repositories.firstIndex(where: { $0.id == repo.id }) else { return }
                  repositories[idx] = DownloadRepository(
                      id: repo.id, name: repo.name, feedURL: repo.feedURL,
                      homepage: repo.homepage, enabled: enabled, maxGB: repo.maxGB
                  )
                  persistRepositories()
              }

              func resetQuotaUsage() {
                  quota = DownloadQuota(id: quota.id, totalBytes: quota.totalBytes, usedBytes: 0)
                  persistQuota()
              }

              func addUsedBytes(_ bytes: Int64) {
                  let updated = DownloadQuota(id: quota.id, totalBytes: quota.totalBytes, usedBytes: quota.usedBytes + bytes)
                  quota = updated
                  persistQuota()
              }

              func updateTotalApps(_ count: Int) {
                  totalAppsAvailable = count
              }

              private func persistRepositories() {
                  if let data = try? JSONEncoder().encode(repositories) {
                      d.set(data, forKey: keyRepos)
                  }
              }

              private func persistQuota() {
                  if let data = try? JSONEncoder().encode(quota) {
                      d.set(data, forKey: keyQuota)
                  }
              }
          }
          VIPEOF

