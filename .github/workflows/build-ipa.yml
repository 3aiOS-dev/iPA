                    struct ExploreStoreView: View {
                        @ObservedObject var feed: StoreFeed
                        @State private var searchText = ""
                        @State private var selectedCategory: String? = nil

                        private var filtered: [StoreAPIApp] {
                            let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                            return feed.apps.filter { app in
                                let category = (app.category ?? "").lowercased()
                                let isGame = category.contains("game") || category.contains("لعبة") || app.name.lowercased().contains("gta")
                                let matchesCategory = selectedCategory == nil || category.contains(selectedCategory!.lowercased())
                                let matchesQuery = q.isEmpty || app.name.lowercased().contains(q) || (app.bundleId?.lowercased().contains(q) ?? false)
                                return matchesCategory && matchesQuery && !category.contains("movie") && isGame || (selectedCategory == nil && matchesQuery && !category.contains("movie"))
                            }
                        }

                        private var games: [StoreAPIApp] {
                            let gameApps = feed.apps.filter {
                                let c = ($0.category ?? "").lowercased()
                                return c.contains("game") || c.contains("لعبة")
                            }
                            return gameApps.isEmpty ? Array(feed.apps.prefix(80)) : gameApps
                        }

                        var body: some View {
                            NavigationStack {
                                ScrollView(showsIndicators: false) {
                                    VStack(alignment: .leading, spacing: 16) {
                                        HStack {
                                            Text("Explore")
                                                .font(.system(size: 39, weight: .heavy))
