name: Build Unsigned IPA (Wallet BETA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Prepare sources
        run: |
          set -e
          mkdir -p build/App/Sources
          cd build/App/Sources

          # ============================================================
          # AppEntry.swift
          # ============================================================
          cat > AppEntry.swift <<'SWIFT'
          import SwiftUI

          @main
          struct MyStoreApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }

          struct ContentView: View {
              @AppStorage("isLoggedIn") private var isLoggedIn = false
              @AppStorage("didOnboard") private var didOnboard = false
              var body: some View {
                  Group {
                      if !didOnboard {
                          OnboardingView()
                      } else if !isLoggedIn {
                          NavigationView { AuthView() }
                      } else {
                          StoreRootView()
                      }
                  }
              }
          }

          // Placeholder onboarding / auth (from previous file) — kept minimal here.
          struct OnboardingView: View {
              @AppStorage("didOnboard") private var didOnboard = false
              var body: some View {
                  VStack(spacing: 24) {
                      Spacer()
                      Image(systemName: "bag.fill").font(.system(size: 80)).foregroundColor(.blue)
                      Text("Welcome to the Store").font(.title.bold())
                      Text("Discover exclusive apps built for you.")
                          .multilineTextAlignment(.center).foregroundColor(.secondary)
                      Spacer()
                      Button { didOnboard = true } label: {
                          Text("Get Started").frame(maxWidth: .infinity).padding()
                              .background(Color.blue).foregroundColor(.white)
                              .clipShape(RoundedRectangle(cornerRadius: 14))
                      }.padding(.horizontal, 24)
                  }.padding()
              }
          }

          struct AuthView: View {
              @AppStorage("isLoggedIn") private var isLoggedIn = false
              @AppStorage("userName") private var userName = ""
              @State private var name = ""
              var body: some View {
                  VStack(spacing: 20) {
                      Text("Sign In").font(.largeTitle.bold())
                      TextField("Your name", text: $name)
                          .padding().background(Color(.systemGray6))
                          .clipShape(RoundedRectangle(cornerRadius: 12))
                      Button {
                          userName = name.isEmpty ? "Guest" : name
                          isLoggedIn = true
                      } label: {
                          Text("Continue").frame(maxWidth: .infinity).padding()
                              .background(Color.blue).foregroundColor(.white)
                              .clipShape(RoundedRectangle(cornerRadius: 14))
                      }
                      Spacer()
                  }.padding()
              }
          }
          SWIFT

          # ============================================================
          # StoreView.swift  (tabs + wallet entry)
          # ============================================================
          cat > StoreView.swift <<'SWIFT'
          import SwiftUI

          struct StoreRootView: View {
              @State private var tab = 0
              var body: some View {
                  ZStack(alignment: .bottom) {
                      TabView(selection: $tab) {
                          StoreHomeView().tag(0)
                          WalletEntryView().tag(1)
                          AlertsView().tag(2)
                          SocialView().tag(3)
                      }
                      CustomTabBar(tab: $tab)
                  }.ignoresSafeArea(.keyboard)
              }
          }

          struct CustomTabBar: View {
              @Binding var tab: Int
              var body: some View {
                  HStack {
                      tabBtn(0, "house.fill", "Home")
                      tabBtn(1, "creditcard.fill", "Wallet")
                      Spacer().frame(width: 60)
                      tabBtn(2, "bell.fill", "Alerts")
                      tabBtn(3, "person.2.fill", "Social")
                  }
                  .padding(.horizontal, 24).padding(.vertical, 12)
                  .background(Color.white.shadow(radius: 8))
                  .overlay(
                      Circle().fill(Color.blue).frame(width: 56, height: 56)
                          .overlay(Image(systemName: "magnifyingglass").foregroundColor(.white))
                          .offset(y: -24)
                  )
              }
              @ViewBuilder func tabBtn(_ i: Int, _ icon: String, _ label: String) -> some View {
                  Button { tab = i } label: {
                      VStack(spacing: 2) {
                          Image(systemName: icon)
                          Text(label).font(.caption2)
                      }.frame(maxWidth: .infinity)
                       .foregroundColor(tab == i ? .blue : .gray)
                  }
              }
          }

          struct StoreHomeView: View {
              var body: some View {
                  ScrollView {
                      VStack(alignment: .leading, spacing: 16) {
                          Text("Popular Apps").font(.title2.bold()).padding(.horizontal)
                          LazyVGrid(columns: Array(repeating: GridItem(.flexible()), count: 4), spacing: 12) {
                              ForEach(0..<8) { i in
                                  VStack {
                                      RoundedRectangle(cornerRadius: 16)
                                          .fill(Color.blue.opacity(0.15))
                                          .frame(height: 60)
                                          .overlay(Image(systemName: "app.fill").foregroundColor(.blue))
                                      Text("App \(i+1)").font(.caption)
                                  }
                              }
                          }.padding(.horizontal)
                      }.padding(.top, 40).padding(.bottom, 120)
                  }
              }
          }

          struct AlertsView: View {
              var body: some View { Text("Alerts").font(.largeTitle) }
          }
          struct SocialView: View {
              var body: some View { Text("Profile").font(.largeTitle) }
          }
          SWIFT

          # ============================================================
          # WalletView.swift  — 3-step onboarding + BETA wallet card
          # ============================================================
          cat > WalletView.swift <<'SWIFT'
          import SwiftUI
          import UIKit

          // Entry: shows onboarding once, then wallet card.
          struct WalletEntryView: View {
              @AppStorage("didOnboardWallet") private var didOnboardWallet = false
              var body: some View {
                  if didOnboardWallet {
                      WalletCardView()
                  } else {
                      WalletOnboardingView(onDone: { didOnboardWallet = true })
                  }
              }
          }

          // MARK: - Onboarding (3 illustrated screens)
          struct WalletOnboardingView: View {
              var onDone: () -> Void
              @State private var page = 0

              private let pages: [WalletOnbPage] = [
                  .init(icon: "creditcard.and.123",
                        title: "Pay with your card",
                        subtitle: "Use your virtual wallet card at checkout, quickly and securely.",
                        tint: .blue),
                  .init(icon: "iphone.radiowaves.left.and.right",
                        title: "Your card, in your phone",
                        subtitle: "Tap, pay and manage everything from one place — no plastic needed.",
                        tint: .indigo),
                  .init(icon: "doc.text.magnifyingglass",
                        title: "Track every receipt",
                        subtitle: "See balances, purchases and invoices in real time.",
                        tint: .pink)
              ]

              var body: some View {
                  VStack(spacing: 0) {
                      HStack {
                          Spacer()
                          Button("Skip") { onDone() }
                              .foregroundColor(.gray)
                      }
                      .padding(.horizontal).padding(.top, 8)

                      TabView(selection: $page) {
                          ForEach(pages.indices, id: \.self) { i in
                              WalletOnbPageView(page: pages[i]).tag(i)
                          }
                      }
                      .tabViewStyle(.page(indexDisplayMode: .never))

                      // Dots
                      HStack(spacing: 8) {
                          ForEach(pages.indices, id: \.self) { i in
                              Capsule()
                                  .fill(i == page ? Color.blue : Color.gray.opacity(0.3))
                                  .frame(width: i == page ? 22 : 8, height: 8)
                                  .animation(.spring(), value: page)
                          }
                      }
                      .padding(.bottom, 20)

                      Button {
                          if page < pages.count - 1 {
                              withAnimation { page += 1 }
                          } else {
                              onDone()
                          }
                      } label: {
                          Text(page == pages.count - 1 ? "Activate Wallet" : "Next")
                              .font(.headline)
                              .frame(maxWidth: .infinity)
                              .padding()
                              .background(Color.blue)
                              .foregroundColor(.white)
                              .clipShape(RoundedRectangle(cornerRadius: 16))
                      }
                      .padding(.horizontal, 24).padding(.bottom, 100)
                  }
                  .background(Color(.systemBackground).ignoresSafeArea())
              }
          }

          struct WalletOnbPage {
              let icon: String
              let title: String
              let subtitle: String
              let tint: Color
          }

          struct WalletOnbPageView: View {
              let page: WalletOnbPage
              var body: some View {
                  VStack(spacing: 28) {
                      Spacer()
                      ZStack {
                          Circle().fill(page.tint.opacity(0.12)).frame(width: 240, height: 240)
                          Image(systemName: page.icon)
                              .resizable().scaledToFit()
                              .frame(width: 120, height: 120)
                              .foregroundColor(page.tint)
                      }
                      VStack(spacing: 12) {
                          Text(page.title)
                              .font(.title.bold())
                              .multilineTextAlignment(.center)
                          Text(page.subtitle)
                              .font(.subheadline)
                              .foregroundColor(.secondary)
                              .multilineTextAlignment(.center)
                              .padding(.horizontal, 32)
                      }
                      Spacer()
                  }
              }
          }

          // MARK: - Wallet Card (BETA)
          struct WalletCardView: View {
              @AppStorage("userName") private var userName = "User"
              @AppStorage("walletId") private var walletId = ""
              @AppStorage("walletCard") private var walletCard = ""
              @AppStorage("walletBalance") private var walletBalance = 0.0
              @State private var copiedId = false
              @State private var copiedCard = false
              @State private var showShareWarn = false

              var body: some View {
                  ScrollView {
                      VStack(spacing: 20) {
                          // Header
                          HStack {
                              VStack(alignment: .leading, spacing: 4) {
                                  Text("Wallet").font(.largeTitle.bold())
                                  HStack(spacing: 6) {
                                      Text("BETA")
                                          .font(.caption2.bold())
                                          .padding(.horizontal, 8).padding(.vertical, 3)
                                          .background(Color.orange)
                                          .foregroundColor(.white)
                                          .clipShape(Capsule())
                                      Text("Early release")
                                          .font(.caption).foregroundColor(.secondary)
                                  }
                              }
                              Spacer()
                          }
                          .padding(.horizontal).padding(.top, 20)

                          // Card
                          ZStack(alignment: .topLeading) {
                              LinearGradient(colors: [Color.blue, Color(red:0.15,green:0.25,blue:0.75)],
                                             startPoint: .topLeading, endPoint: .bottomTrailing)
                                  .clipShape(RoundedRectangle(cornerRadius: 24))
                                  .frame(height: 210)
                                  .shadow(color: .blue.opacity(0.35), radius: 20, y: 10)

                              VStack(alignment: .leading, spacing: 18) {
                                  HStack {
                                      Text("MyStore Wallet")
                                          .font(.headline).foregroundColor(.white.opacity(0.9))
                                      Spacer()
                                      Text("BETA")
                                          .font(.caption2.bold())
                                          .padding(.horizontal, 8).padding(.vertical, 3)
                                          .background(Color.white.opacity(0.25))
                                          .foregroundColor(.white)
                                          .clipShape(Capsule())
                                  }
                                  Text(formatCard(walletCard))
                                      .font(.system(.title3, design: .monospaced))
                                      .foregroundColor(.white)
                                      .kerning(2)
                                  HStack(alignment: .bottom) {
                                      VStack(alignment: .leading, spacing: 2) {
                                          Text("HOLDER").font(.caption2).foregroundColor(.white.opacity(0.7))
                                          Text(userName.uppercased())
                                              .font(.footnote.bold()).foregroundColor(.white)
                                      }
                                      Spacer()
                                      VStack(alignment: .trailing, spacing: 2) {
                                          Text("BALANCE").font(.caption2).foregroundColor(.white.opacity(0.7))
                                          Text(String(format: "$%.2f", walletBalance))
                                              .font(.footnote.bold()).foregroundColor(.white)
                                      }
                                  }
                              }
                              .padding(20)
                          }
                          .padding(.horizontal)

                          // Wallet ID row
                          VStack(alignment: .leading, spacing: 10) {
                              Text("Wallet ID").font(.subheadline.bold())
                              HStack {
                                  Text(walletId)
                                      .font(.system(.callout, design: .monospaced))
                                      .lineLimit(1).truncationMode(.middle)
                                  Spacer()
                                  Button {
                                      UIPasteboard.general.string = walletId
                                      copiedId = true
                                      showShareWarn = true
                                      DispatchQueue.main.asyncAfter(deadline: .now()+2) { copiedId = false }
                                  } label: {
                                      Label(copiedId ? "Copied" : "Copy",
                                            systemImage: copiedId ? "checkmark" : "doc.on.doc")
                                          .font(.caption.bold())
                                          .padding(.horizontal, 12).padding(.vertical, 8)
                                          .background(Color.blue.opacity(0.12))
                                          .foregroundColor(.blue)
                                          .clipShape(Capsule())
                                  }
                              }
                              .padding()
                              .background(Color(.systemGray6))
                              .clipShape(RoundedRectangle(cornerRadius: 12))

                              Label("Do not share this ID with anyone. It is bound to your account.",
                                    systemImage: "exclamationmark.shield.fill")
                                  .font(.caption)
                                  .foregroundColor(.red)
                          }
                          .padding(.horizontal)

                          // Card number row
                          VStack(alignment: .leading, spacing: 10) {
                              Text("Card Number").font(.subheadline.bold())
                              HStack {
                                  Text(formatCard(walletCard))
                                      .font(.system(.callout, design: .monospaced))
                                  Spacer()
                                  Button {
                                      UIPasteboard.general.string = walletCard
                                      copiedCard = true
                                      DispatchQueue.main.asyncAfter(deadline: .now()+2) { copiedCard = false }
                                  } label: {
                                      Label(copiedCard ? "Copied" : "Copy",
                                            systemImage: copiedCard ? "checkmark" : "doc.on.doc")
                                          .font(.caption.bold())
                                          .padding(.horizontal, 12).padding(.vertical, 8)
                                          .background(Color.blue.opacity(0.12))
                                          .foregroundColor(.blue)
                                          .clipShape(Capsule())
                                  }
                              }
                              .padding()
                              .background(Color(.systemGray6))
                              .clipShape(RoundedRectangle(cornerRadius: 12))
                          }
                          .padding(.horizontal)

                          // Actions
                          HStack(spacing: 12) {
                              walletAction("Top up", "plus.circle.fill", .blue) {
                                  walletBalance += 10
                              }
                              walletAction("Send", "paperplane.fill", .indigo) {}
                              walletAction("History", "clock.fill", .pink) {}
                          }
                          .padding(.horizontal)

                          Spacer(minLength: 120)
                      }
                  }
                  .background(Color(.systemBackground))
                  .onAppear(perform: ensureIdentity)
                  .alert("Keep your Wallet ID private", isPresented: $showShareWarn) {
                      Button("I understand", role: .cancel) {}
                  } message: {
                      Text("Sharing your Wallet ID with anyone else is strictly forbidden and may lock your account.")
                  }
              }

              @ViewBuilder
              private func walletAction(_ title: String, _ icon: String, _ tint: Color, action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      VStack(spacing: 6) {
                          Image(systemName: icon).font(.title2)
                          Text(title).font(.caption.bold())
                      }
                      .frame(maxWidth: .infinity).padding(.vertical, 14)
                      .background(tint.opacity(0.12))
                      .foregroundColor(tint)
                      .clipShape(RoundedRectangle(cornerRadius: 14))
                  }
              }

              private func ensureIdentity() {
                  if walletId.isEmpty {
                      walletId = "MS-" + UUID().uuidString.replacingOccurrences(of: "-", with: "").prefix(12).uppercased()
                  }
                  if walletCard.isEmpty {
                      var s = ""
                      for _ in 0..<16 { s += String(Int.random(in: 0...9)) }
                      walletCard = s
                  }
              }

              private func formatCard(_ s: String) -> String {
                  guard !s.isEmpty else { return "•••• •••• •••• ••••" }
                  return stride(from: 0, to: s.count, by: 4).map {
                      let start = s.index(s.startIndex, offsetBy: $0)
                      let end = s.index(start, offsetBy: min(4, s.count - $0))
                      return String(s[start..<end])
                  }.joined(separator: " ")
              }
          }
          SWIFT

      - name: Build app (unsigned) with swiftc
        run: |
          set -e
          cd build/App
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/MyStore.app
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK" \
            -parse-as-library \
            -O \
            Sources/AppEntry.swift \
            Sources/StoreView.swift \
            Sources/WalletView.swift \
            -o Payload/MyStore.app/MyStore

          cat > Payload/MyStore.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>MyStore</string>
            <key>CFBundleDisplayName</key><string>MyStore</string>
            <key>CFBundleIdentifier</key><string>com.example.mystore</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0-BETA</string>
            <key>CFBundleExecutable</key><string>MyStore</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer></array>
            <key>UILaunchScreen</key><dict/>
          </dict></plist>
          PLIST

      - name: Package IPA
        run: |
          cd build/App
          zip -qr MyStore-unsigned.ipa Payload
          ls -la MyStore-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyStore-unsigned-ipa
          path: build/App/MyStore-unsigned.ipa
