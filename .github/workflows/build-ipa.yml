          import UniformTypeIdentifiers

          // MARK: - IPA Files Tab (استيراد + فك ضغط + عرض + استرداد)
          struct IPAFilesTabView: View {
              @ObservedObject var ipaManager: IPAManager
              @State private var showImporter = false
              @State private var selectedIPA: LocalIPA?
              @State private var rezipInProgress: String? = nil
              @State private var rezipURL: URL? = nil
              @State private var showShare = false
