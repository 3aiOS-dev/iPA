      - name: Generate code - StoreFeed.swift (merged feed from hardcoded repos)
        run: |
          cat > StoreFeed.swift << 'FEEDEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class StoreFeed: ObservableObject {
              @Published var apps: [StoreAPIApp] = []
              @Published var isLoading: Bool = false
              @Published var lastError: String?
              @Published var lastUpdated: String?
              @Published var totalAvailable: Int = 0

              private let cacheURL: URL = {
                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  return caches.appendingPathComponent("apptesters-feed-v2.json")
              }()

              // Hardcoded repository URLs (no UI)
              private let repositories: [(name: String, url: String)] = [
                  ("21s Admin", "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app/api/public/store/apps"),
                  ("AppTesters Mirror", "https://repo.apptesters.org/index.json"),
                  ("21s Originals", "https://21s.app/repo/apps.json")
              ]

              init() { loadCachedThenRefresh() }

              func loadCachedThenRefresh() {
                  if let data = try? Data(contentsOf: cacheURL),
                     let parsed = try? JSONDecoder().decode(StoreAPIResponse.self, from: data) {
                      self.apps = parsed.apps
                      self.lastUpdated = parsed.lastUpdated
                      self.totalAvailable = parsed.apps.count
                  }
                  Task { await refresh() }
              }

              func refresh() async {
                  isLoading = true
                  lastError = nil
                  do {
                      let merged = try await fetchMergedFromAllRepos()
                      self.apps = merged.apps
                      self.lastUpdated = merged.lastUpdated
                      self.totalAvailable = merged.apps.count
                      if let data = try? JSONEncoder().encode(merged) {
                          try? data.write(to: cacheURL)
                      }
                  } catch {
                      self.lastError = error.localizedDescription
                  }
                  isLoading = false
              }

              private func fetchMergedFromAllRepos() async throws -> StoreAPIResponse {
                  var combined: [StoreAPIApp] = []
                  var seen = Set<String>()
                  var latestUpdate: String? = nil
                  var firstError: Error? = nil

                  await withTaskGroup(of: (StoreAPIResponse?, Error?).self) { group in
                      for repo in repositories {
                          group.addTask { () -> (StoreAPIResponse?, Error?) in
                              do {
                                  var req = URLRequest(url: URL(string: repo.url)!, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 25)
                                  req.setValue("21s-iOS/1.0", forHTTPHeaderField: "User-Agent")
                                  let (data, response) = try await URLSession.shared.data(for: req)
                                  if let http = response as? HTTPURLResponse, !(200...299).contains(http.statusCode) {
                                      throw NSError(domain: "StoreFeed", code: http.statusCode,
                                                    userInfo: [NSLocalizedDescriptionKey: "HTTP \(http.statusCode) from \(repo.name)"])
                                  }
                                  let parsed = try JSONDecoder().decode(StoreAPIResponse.self, from: data)
                                  return (parsed, nil)
                              } catch {
                                  return (nil, error)
                              }
                          }
                      }
                      for await (resp, err) in group {
                          if let resp = resp {
                              for app in resp.apps {
                                  let key = app.bundleId?.lowercased() ?? "n_\(app.id)_\(app.name.lowercased())"
                                  if !seen.contains(key) {
                                      seen.insert(key)
                                      combined.append(app)
                                  }
                              }
                              if let u = resp.lastUpdated, (latestUpdate == nil || u > latestUpdate!) {
                                  latestUpdate = u
                              }
                          } else if let err = err, firstError == nil {
                              firstError = err
                          }
                      }
                  }

                  if combined.isEmpty, let err = firstError { throw err }

                  let sort = combined.sorted { (a, b) in
                      let an = a.name.lowercased()
                      let bn = b.name.lowercased()
                      return an < bn
                  }

                  return StoreAPIResponse(lastUpdated: latestUpdate, apps: sort)
              }

              // MARK: - Helpers for new/updated
              func recentApps(now: Date = Date()) -> [StoreAPIApp] {
                  apps.filter { $0.isRecent(now: now) }
              }

              func newlyAddedApps(now: Date = Date()) -> [StoreAPIApp] {
                  apps.filter { app in
                      guard let raw = app.createdAt else { return false }
                      let parser = ISO8601DateFormatter()
                      parser.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                      var date = parser.date(from: raw)
                      if date == nil {
                          let f = DateFormatter()
                          f.locale = Locale(identifier: "en_US_POSIX")
                          f.timeZone = TimeZone(secondsFromGMT: 0)
                          for fmt in ["yyyy-MM-dd'T'HH:mm:ssZ", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"] {
                              f.dateFormat = fmt
                              if let d = f.date(from: raw) {
                                  date = d
                                  break
                              }
                          }
                      }
                      guard let d = date else { return false }
                      return now.timeIntervalSince(d) <= 24 * 60 * 60
                  }
              }

              func updatedApps(now: Date = Date()) -> [StoreAPIApp] {
                  apps.filter { app in
                      guard let raw = app.updatedAt else { return false }
                      let parser = ISO8601DateFormatter()
                      parser.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                      var date = parser.date(from: raw)
                      if date == nil {
                          let f = DateFormatter()
                          f.locale = Locale(identifier: "en_US_POSIX")
                          f.timeZone = TimeZone(secondsFromGMT: 0)
                          for fmt in ["yyyy-MM-dd'T'HH:mm:ssZ", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"] {
                              f.dateFormat = fmt
                              if let d = f.date(from: raw) {
                                  date = d
                                  break
                              }
                          }
                      }
                      guard let d = date else { return false }
                      let isRecentUpdate = now.timeIntervalSince(d) <= 24 * 60 * 60
                      guard isRecentUpdate else { return false }
                      // Not new (createdAt older than 24h)
                      if let createdRaw = app.createdAt {
                          let parser2 = ISO8601DateFormatter()
                          parser2.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                          var createdDate = parser2.date(from: createdRaw)
                          if createdDate == nil {
                              let f = DateFormatter()
                              f.locale = Locale(identifier: "en_US_POSIX")
                              f.timeZone = TimeZone(secondsFromGMT: 0)
                              for fmt in ["yyyy-MM-dd'T'HH:mm:ssZ", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"] {
                                  f.dateFormat = fmt
                                  if let d = f.date(from: createdRaw) {
                                      createdDate = d
                                      break
                                  }
                              }
                          }
                          if let cd = createdDate {
                              return now.timeIntervalSince(cd) > 24 * 60 * 60
                          }
                      }
                      return true
                  }
              }
          }
          FEEDEOF

