                                          .foregroundColor(.white)
                                  }
                              }
                              .padding(.top, 12)

                              // Name
                              VStack(spacing: 4) {
                                  Text(file.appName ?? file.originalName)
                                      .font(.system(size: 22, weight: .black))
                                  Text(file.fileType.displayName)
                                      .font(.system(size: 12, weight: .semibold))
