                  let css = """
                  .card{position:absolute;inset:0;border-radius:20px;overflow:hidden;
                  background:linear-gradient(120deg,\(a),\(b2));display:flex;align-items:center;
                  justify-content:space-between;padding:0 16px;gap:10px}
