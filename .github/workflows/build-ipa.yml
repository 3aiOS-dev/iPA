          struct EditCardSheet: View {
              @Environment(\.dismiss) var dismiss
              @Binding var cardNumber: String
              var onSave: (String) -> Void
              @State private var draft: String = ""

              var body: some View {
                  NavigationView {
                      VStack(spacing: 18) {
                          Image(systemName: "creditcard.fill").font(.system(size: 50)).foregroundColor(.storePrimary).padding(.top, 20)
