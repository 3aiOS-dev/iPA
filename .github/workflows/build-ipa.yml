      - name: توليد الكود - FilesTabView.swift
        run: |
          cat > FilesTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UniformTypeIdentifiers

          struct FilesTabView: View {
              @ObservedObject var filesManager: FilesManager
              @Environment(\.colorScheme) var scheme

              @State private var showPicker = false
              @State private var pickerKinds: [ImportedFileKind] = ImportedFileKind.allCases
              @State private var filterKind: ImportedFileKind? = nil
              @State private var sortNewestFirst: Bool = true
              @State private var fileToRename: ImportedFile? = nil
              @State private var renameText: String = ""
              @State private var fileToConfirmDelete: ImportedFile? = nil
              @State private var fileToShare: ImportedFile? = nil
              @State private var detailFile: ImportedFile? = nil

              var filtered: [ImportedFile] {
                  var arr = filesManager.files
                  if let k = filterKind { arr = arr.filter { $0.kind == k } }
                  arr = sortNewestFirst ? arr.sorted { $0.importedAt > $1.importedAt }
                                        : arr.sorted { $0.importedAt < $1.importedAt }
                  return arr
              }

              var body: some View {
                  NavigationView {
                      ZStack {
                          (scheme == .dark ? Color.xcodeBackground : Color.xcodeLightBg)
                              .edgesIgnoringSafeArea(.all)

                          VStack(spacing: 0) {
                              FilesBanner(
                                  total: filesManager.files.count,
                                  ipaCount: filesManager.files.filter { $0.kind == .ipa }.count,
                                  p12Count: filesManager.files.filter { $0.kind == .p12 }.count,
                                  provCount: filesManager.files.filter { $0.kind == .mobileprovision }.count
                              )
                              .padding(.horizontal)
                              .padding(.top, 4)

                              HStack(spacing: 10) {
                                  XcodeButton(
                                      title: "استيراد من الملفات",
                                      icon: "tray.and.arrow.down.fill",
                                      color: .xcodeBlue
                                  ) {
                                      HapticManager.shared.impact(.light)
                                      pickerKinds = ImportedFileKind.allCases
                                      showPicker = true
                                  }
                                  .frame(maxWidth: .infinity)

                                  Button {
                                      HapticManager.shared.impact(.light)
                                      filesManager.reload()
                                  } label: {
                                      Image(systemName: "arrow.clockwise")
                                          .font(.system(size: 16, weight: .semibold))
                                          .foregroundColor(.xcodeBlue)
                                          .frame(width: 44, height: 44)
                                          .background(
                                              RoundedRectangle(cornerRadius: 10)
                                                  .fill(Color.xcodeBlue.opacity(0.1))
                                          )
                                  }
                              }
                              .padding(.horizontal)
                              .padding(.top, 10)

                              ScrollView(.horizontal, showsIndicators: false) {
                                  HStack(spacing: 8) {
                                      FilterChip(
                                          title: "الكل",
                                          icon: "tray.full.fill",
                                          color: .xcodeBlue,
                                          selected: filterKind == nil
                                      ) {
                                          withAnimation(.spring()) { filterKind = nil }
                                      }
                                      ForEach(ImportedFileKind.allCases, id: \.self) { k in
                                          FilterChip(
                                              title: k.displayName,
                                              icon: k.icon,
                                              color: k.color,
                                              selected: filterKind == k
                                          ) {
                                              withAnimation(.spring()) { filterKind = (filterKind == k ? nil : k) }
                                          }
                                      }
                                      Divider().frame(height: 16).background(Color.gray.opacity(0.3))
                                      Button {
                                          withAnimation(.spring()) { sortNewestFirst.toggle() }
                                      } label: {
                                          HStack(spacing: 4) {
                                              Image(systemName: sortNewestFirst ? "arrow.down.circle.fill" : "arrow.up.circle.fill")
                                                  .font(.system(size: 10, weight: .bold))
                                              Text(sortNewestFirst ? "الأحدث" : "الأقدم")
                                                  .font(.system(size: 11, weight: .semibold))
                                          }
                                          .foregroundColor(.primary)
                                          .padding(.horizontal, 10)
                                          .padding(.vertical, 6)
                                          .background(Capsule().fill(Color.gray.opacity(0.1)))
                                      }
                                  }
                                  .padding(.horizontal)
                              }
                              .padding(.top, 12)

                              if let summary = filesManager.lastImportSummary {
                                  StatusBanner(icon: "checkmark.seal.fill", color: .xcodeGreen, text: summary)
                              }
                              if let err = filesManager.lastError {
                                  StatusBanner(icon: "exclamationmark.triangle.fill", color: .xcodeRed, text: err)
                              }

                              if filesManager.files.isEmpty {
                                  FilesEmptyState {
                                      pickerKinds = ImportedFileKind.allCases
                                      showPicker = true
                                  }
                              } else if filtered.isEmpty {
                                  XcodeEmptyState(
                                      icon: "line.3.horizontal.decrease.circle",
                                      title: "لا توجد ملفات",
                                      subtitle: "لا توجد ملفات بهذا التصنيف"
                                  )
                              } else {
                                  ScrollView {
                                      LazyVStack(spacing: 8) {
                                          ForEach(filtered) { file in
                                              ImportedFileRow(
                                                  file: file,
                                                  iconURL: filesManager.iconURL(for: file),
                                                  onRename: { startRename(file) },
                                                  onDelete: { fileToConfirmDelete = file },
                                                  onShare: { fileToShare = file },
                                                  onRevalidate: { filesManager.revalidate(file) },
                                                  onTap: { detailFile = file }
                                              )
                                              .padding(.horizontal)
                                          }

                                          HStack(spacing: 6) {
                                              Image(systemName: "info.circle").font(.system(size: 10))
                                              Text("يمكنك استيراد ملفات .ipa, .p12, .mobileprovision")
                                                  .font(.system(size: 10))
                                          }
                                          .foregroundColor(.xcodeSecondary)
                                          .padding(.top, 12)
                                      }
                                      .padding(.top, 10)
                                      .padding(.bottom, 24)
                                  }
                              }
                          }
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 6) {
                                  Image(systemName: "folder.badge.gearshape")
                                      .foregroundColor(.xcodeBlue)
                                  Text("إدارة الملفات")
                                      .font(.system(size: 17, weight: .heavy))
                                      .foregroundColor(.primary)
                              }
                          }
                      }
                  }
                  .sheet(isPresented: $showPicker) {
                      DocumentPicker(
                          contentTypes: pickerKinds.flatMap { utTypes(for: $0) },
                          allowsMultiple: true
                      ) { urls in
                          showPicker = false
                          guard !urls.isEmpty else { return }
                          Task {
                              await filesManager.importFiles(from: urls)
                          }
                      }
                      .ignoresSafeArea()
                  }
                  .alert("إعادة تسمية الملف",
                         isPresented: Binding(
                            get: { fileToRename != nil },
                            set: { if !$0 { fileToRename = nil } }
                         )
                  ) {
                      TextField("الاسم الجديد", text: $renameText)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled()
                      Button("حفظ") {
                          if let f = fileToRename {
                              _ = filesManager.rename(file: f, to: renameText)
                          }
                          fileToRename = nil
                      }
                      Button("إلغاء", role: .cancel) { fileToRename = nil }
                  } message: {
                      Text("سيتم تغيير اسم الملف داخل التطبيق فقط.")
                  }
                  .confirmationDialog(
                      "حذف الملف؟",
                      isPresented: Binding(
                        get: { fileToConfirmDelete != nil },
                        set: { if !$0 { fileToConfirmDelete = nil } }
                      ),
                      titleVisibility: .visible
                  ) {
                      Button("حذف", role: .destructive) {
                          if let f = fileToConfirmDelete { filesManager.delete(file: f) }
                          fileToConfirmDelete = nil
                      }
                      Button("إلغاء", role: .cancel) { fileToConfirmDelete = nil }
                  } message: {
                      Text(fileToConfirmDelete?.originalName ?? "")
                  }
                  .sheet(item: $fileToShare) { f in
                      ShareSheet(activityItems: [filesManager.absoluteURL(for: f)])
                  }
                  .sheet(item: $detailFile) { f in
                      ImportedFileDetailView(file: f, filesManager: filesManager)
                  }
              }

              private func startRename(_ f: ImportedFile) {
                  let base = (f.originalName as NSString).deletingPathExtension
                  renameText = base
                  fileToRename = f
              }

              private func utTypes(for kind: ImportedFileKind) -> [UTType] {
                  switch kind {
                  case .ipa:
                      return [
                          UTType(filenameExtension: "ipa") ?? .archive,
                          UTType("com.apple.ipa") ?? .archive
                      ]
                  case .p12:
                      return [
                          UTType(filenameExtension: "p12") ?? .data,
                          UTType(filenameExtension: "pfx") ?? .data,
                          UTType("com.apple.security.pkcs12") ?? .data
                      ]
                  case .mobileprovision:
                      return [
                          UTType(filenameExtension: "mobileprovision") ?? .data,
                          UTType("com.apple.mobileprovision") ?? .data,
                          UTType(filenameExtension: "provisionprofile") ?? .data
                      ]
                  case .other:
                      return [.data, .item]
                  }
              }
          }

