              // بطاقة عرض بعدّاد تنازلي حي
              static func offerCountdown(title: String, subtitle: String) -> String {
                  let pal = ThemeManager.p
                  let body = """
                  <div class="w">
                    <div class="glow"></div>
                    <div class="l"><b>\(title)</b><span>\(subtitle)</span></div>
                    <div class="t"><u id="h">00</u><i>:</i><u id="m">00</u><i>:</i><u id="s">00</u></div>
                  </div>
                  <script>
                  function tick(){var d=new Date();var e=new Date(d);e.setHours(24,0,0,0);
                  var x=Math.max(0,Math.floor((e-d)/1000));
                  var h=String(Math.floor(x/3600)).padStart(2,'0');
                  var m=String(Math.floor(x%3600/60)).padStart(2,'0');
                  var s=String(x%60).padStart(2,'0');
                  document.getElementById('h').textContent=h;
                  document.getElementById('m').textContent=m;
                  document.getElementById('s').textContent=s;}
                  tick();setInterval(tick,1000);
                  </script>
                  """
                  let css = """
