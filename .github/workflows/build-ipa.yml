name: Build_21s_SwiftUI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Setup Dependencies
        run: brew install ldid zip

      - name: Generate App Icons
        run: |
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYIEOF'
          from PIL import Image, ImageDraw, ImageFont
          def make_icon(size, path):
              img  = Image.new("RGB", (size, size), (10, 11, 20))
              draw = ImageDraw.Draw(img)
              for y in range(size):
                  t = y/size
                  draw.line([(0,y),(size,y)], fill=(int(110*(1-t)+34*t), int(86*(1-t)+211*t), int(207*(1-t)+238*t)))
              draw.rounded_rectangle([size*.14,size*.30,size*.86,size*.80],
                  radius=size*.10, outline=(255,255,255), width=max(2,size//34))
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size*.30))
              except Exception:
                  font = ImageFont.load_default()
              bbox = draw.textbbox((0,0),"21",font=font)
              tw,th = bbox[2]-bbox[0], bbox[3]-bbox[1]
              draw.text(((size-tw)/2-bbox[0],(size-th)/2-bbox[1]),"21",fill=(255,255,255),font=font)
              img.save(path)
          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYIEOF
          ls -lh Resources

      - name: Generate App Data
        run: |
          mkdir -p Resources
          cat > Resources/apps_data.json << 'JEOF'
          {
            "name": "21s Store",
            "identifier": "com.vip21.store",
            "sourceURL": "https://repository.apptesters.org/apps.json",
            "kurdStoreURL": "https://kurdstore.info/store-data.json",
            "iconURL": "https://a.top4top.io/p_380487iqk0.jpeg",
            "website": "https://t.me/ClickStoreipaios",
            "subtitle": "متجر 21s VIP",
            "apps": []
          }
          JEOF
          python3 -c "import json; json.load(open('Resources/apps_data.json')); print('OK')"

      - name: Generate Info.plist
        run: |
          mkdir -p Resources
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>          <string>VIP21Store</string>
              <key>CFBundleIdentifier</key>          <string>com.vip21.store</string>
              <key>CFBundleName</key>                <string>21s</string>
              <key>CFBundleDisplayName</key>         <string>21s</string>
              <key>CFBundlePackageType</key>         <string>APPL</string>
              <key>CFBundleShortVersionString</key>  <string>7.0</string>
              <key>CFBundleVersion</key>             <string>7</string>
              <key>LSRequiresIPhoneOS</key>          <true/>
              <key>MinimumOSVersion</key>            <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UILaunchScreen</key><dict/>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>لاستيراد أيقونات التطبيقات</string>
              <key>NSFaceIDUsageDescription</key>
              <string>لحماية إعدادات التطبيق</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
                  <key>NSAllowsArbitraryLoadsInWebContent</key>
                  <true/>
                  <key>NSAllowsArbitraryLoadsForMedia</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PEOF

      - name: Generate Source - Constants.swift
        run: |
          cat > Constants.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          // MARK: - Constants
          struct AppConstants {
              // Primary source (apptesters)
              static let storeURL    = "https://repository.apptesters.org/apps.json"
              // Secondary source (kurdstore)
              static let kurdStoreURL = "https://kurdstore.info/store-data.json"

              static let telegramURL = "https://t.me/ClickStoreipaios"
              static let bannerURL   = "https://a.top4top.io/p_380487iqk0.jpeg"
              static let appIconURL  = "https://a.top4top.io/p_380487iqk0.jpeg"
              static let appVersion  = "7.0"
              static let storeName   = "21s"
              static let accentColor = Color(red: 0.4, green: 0.2, blue: 1.0)
              static let topRightIconURL = "https://up6.cc/2026/07/178416235288151.png"

              static let topNotification = "📸 صوّر  •  📣 أعلن للمتجر  •  🎁 واحصل على كوبون هدية اشتراك ببلاش  •  "

              static let adBanners: [(image: String, link: String)] = [
                  ("https://i.ibb.co/VpgthQ09/F50-B1-F96-40-EB-43-C9-BD64-38-B0-EA105817.jpg", "https://t.me/ClickStoreipaios"),
                  ("https://i.ibb.co/VpgthQ09/F50-B1-F96-40-EB-43-C9-BD64-38-B0-EA105817.jpg", "https://t.me/ClickStoreipaios"),
                  ("https://i.ibb.co/VpgthQ09/F50-B1-F96-40-EB-43-C9-BD64-38-B0-EA105817.jpg", "https://t.me/ClickStoreipaios")
              ]

              // "New this week" window in days
              static let newThisWeekDays = 7
          }

          // MARK: - App Source Enum
          enum AppSource: String, CaseIterable, Identifiable {
              case all     = "الكل"
              case primary = "مصدر 21s"
              case kurd    = "KurdStore"

              var id: String { rawValue }
              var displayName: String { rawValue }

              var icon: String {
                  switch self {
                  case .all:     return "square.grid.2x2.fill"
                  case .primary: return "crown.fill"
                  case .kurd:    return "k.circle.fill"
                  }
              }
          }

          // MARK: - Color Extensions
          extension Color {
              static let vipGold     = Color(red: 1.0, green: 0.84, blue: 0.0)
              static let vipPurple   = Color(red: 0.55, green: 0.0, blue: 1.0)
              static let vipDark     = Color(red: 0.07, green: 0.07, blue: 0.12)
              static let cardDark    = Color(red: 0.11, green: 0.11, blue: 0.18)
              static let cardLight   = Color(red: 0.97, green: 0.97, blue: 1.0)
              static let glassWhite  = Color.white.opacity(0.08)
              static let glassBorder = Color.white.opacity(0.15)
          }
          VIPEOF
          echo "Constants.swift: $(wc -l < Constants.swift) lines"

      - name: Generate Source - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          // MARK: - Haptic Manager
          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  let g = UIImpactFeedbackGenerator(style: style); g.impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  let g = UINotificationFeedbackGenerator(); g.notificationOccurred(type)
              }
              func selection() {
                  let g = UISelectionFeedbackGenerator(); g.selectionChanged()
              }
          }

          // MARK: - Glass Card Modifier
          extension View {
              func glassCard(radius: CGFloat = 20, padding: CGFloat = 0) -> some View {
                  self
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(Color(UIColor.systemBackground).opacity(0.08))
                              .background(
                                  RoundedRectangle(cornerRadius: radius)
                                      .fill(Color(UIColor { t in t.userInterfaceStyle == .dark
                                          ? UIColor(red: 0.11, green: 0.11, blue: 0.18, alpha: 1)
                                          : UIColor(red: 0.97, green: 0.97, blue: 1.0,  alpha: 1) })
                                      )
                              )
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(Color.white.opacity(0.10), lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
                      .shadow(color: .black.opacity(0.08), radius: 8, x: 0, y: 4)
              }
          }
          VIPEOF
          echo "HapticManager.swift: $(wc -l < HapticManager.swift) lines"

      - name: Generate Source - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - App Source Identifier
          enum AppSourceType: String, Codable {
              case primary = "primary"
              case kurd    = "kurd"
          }

          // MARK: - App Data Model (Unified)
          struct AppItem: Identifiable, Codable {
              var id: UUID
              let name: String
              let type: Int
              let bundleID: String
              let bundleIdentifier: String
              let version: String
              let versionDate: String
              let fullDate: String
              let size: Int
              let down: String
              let downloadURL: String
              let developerName: String
              let localizedDescription: String
              let icon: String
              let iconURL: String
              var category: String?
              var source: AppSourceType

              enum CodingKeys: String, CodingKey {
                  case id, name, type, bundleID, bundleIdentifier, version, versionDate,
                       fullDate, size, down, downloadURL, developerName,
                       localizedDescription, icon, iconURL, category, source
              }

              init(name: String,
                   type: Int = 0,
                   bundleID: String,
                   bundleIdentifier: String = "",
                   version: String,
                   versionDate: String,
                   fullDate: String = "",
                   size: Int,
                   down: String = "0",
                   downloadURL: String,
                   developerName: String,
                   localizedDescription: String,
                   icon: String = "",
                   iconURL: String,
                   category: String? = nil,
                   source: AppSourceType = .primary)
              {
                  self.id = UUID()
                  self.name = name
                  self.type = type
                  self.bundleID = bundleID
                  self.bundleIdentifier = bundleIdentifier.isEmpty ? bundleID : bundleIdentifier
                  self.version = version
                  self.versionDate = versionDate
                  self.fullDate = fullDate
                  self.size = size
                  self.down = down
                  self.downloadURL = downloadURL
                  self.developerName = developerName
                  self.localizedDescription = localizedDescription
                  self.icon = icon
                  self.iconURL = iconURL
                  self.category = category
                  self.source = source
              }

              // Custom decoder (for backward compat with primary source that doesn't include source)
              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.id = (try? c.decode(UUID.self, forKey: .id)) ?? UUID()
                  self.name           = try c.decode(String.self, forKey: .name)
                  self.type           = (try? c.decode(Int.self, forKey: .type)) ?? 0
                  self.bundleID       = (try? c.decode(String.self, forKey: .bundleID)) ?? ""
                  self.bundleIdentifier = (try? c.decode(String.self, forKey: .bundleIdentifier)) ?? self.bundleID
                  self.version        = (try? c.decode(String.self, forKey: .version)) ?? ""
                  self.versionDate    = (try? c.decode(String.self, forKey: .versionDate)) ?? ""
                  self.fullDate       = (try? c.decode(String.self, forKey: .fullDate)) ?? self.versionDate
                  self.size           = (try? c.decode(Int.self, forKey: .size)) ?? 0
                  self.down           = (try? c.decode(String.self, forKey: .down)) ?? "0"
                  self.downloadURL    = (try? c.decode(String.self, forKey: .downloadURL)) ?? ""
                  self.developerName  = (try? c.decode(String.self, forKey: .developerName)) ?? ""
                  self.localizedDescription = (try? c.decode(String.self, forKey: .localizedDescription)) ?? ""
                  self.icon           = (try? c.decode(String.self, forKey: .icon)) ?? ""
                  self.iconURL        = (try? c.decode(String.self, forKey: .iconURL)) ?? self.icon
                  self.category       = try? c.decode(String.self, forKey: .category)
                  self.source         = (try? c.decode(AppSourceType.self, forKey: .source)) ?? .primary
              }

              // MARK: Computed

              var formattedSize: String {
                  if size > 0 {
                      return ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .file)
                  }
                  return "—"
              }

              var formattedDate: String {
                  let formats = ["yyyy-MM-dd", "yyyy-MM-dd'T'HH:mm:ssZZZZZ", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"]
                  let inFmt = DateFormatter()
                  inFmt.locale = Locale(identifier: "en_US_POSIX")
                  for fmt in formats {
                      inFmt.dateFormat = fmt
                      if let d = inFmt.date(from: versionDate) {
                          let out = DateFormatter()
                          out.dateFormat = "dd-MM-yyyy"
                          return out.string(from: d)
                      }
                  }
                  return versionDate
              }

              /// Parsed Date for "new this week" comparisons. Returns nil if unparseable.
              var parsedDate: Date? {
                  let formats = ["yyyy-MM-dd", "yyyy-MM-dd'T'HH:mm:ssZZZZZ", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"]
                  let f = DateFormatter()
                  f.locale = Locale(identifier: "en_US_POSIX")
                  for fmt in formats {
                      f.dateFormat = fmt
                      if let d = f.date(from: versionDate) { return d }
                      if let d = f.date(from: fullDate) { return d }
                  }
                  return nil
              }

              var subscriptionType: String {
                  if localizedDescription.contains("Subscription Unlocked") { return "الاشتراك مدى الحياة" }
                  if localizedDescription.contains("Premium") { return "بريميوم" }
                  if localizedDescription.contains("Pro")     { return "Pro" }
                  if localizedDescription.contains("Gold")    { return "Gold" }
                  if localizedDescription.contains("IAP")     { return "المشتريات مفعّلة" }
                  return "مفعّل"
              }

              var isNew: Bool {
                  guard let d = parsedDate else { return false }
                  let days = Calendar.current.dateComponents([.day], from: d, to: Date()).day ?? 999
                  return days < AppConstants.newThisWeekDays
              }

              var isPopular: Bool { (Int(down) ?? 0) > 500 }

              var _secureDownloadURL: String { downloadURL }

              var sourceDisplay: String {
                  switch source {
                  case .primary: return "21s"
                  case .kurd:    return "Kurd"
                  }
              }

              var sourceColor: Color {
                  switch source {
                  case .primary: return .vipPurple
                  case .kurd:    return Color(red: 0.95, green: 0.45, blue: 0.20)
                  }
              }
          }

          // MARK: - Primary Source API Response
          struct AppsResponse: Codable {
              let name: String; let identifier: String; let sourceURL: String
              let iconURL: String; let website: String; let ipawebsite: String
              let subtitle: String; let apps: [AppItem]
          }

          // MARK: - KurdStore API Response
          // {
          //   "last_updated": "...",
          //   "apps": { "success": true, "count": 39, "apps": [ {...}, ... ] }
          // }
          struct KurdStoreRoot: Codable {
              let last_updated: String?
              let apps: KurdStoreAppsContainer
          }

          struct KurdStoreAppsContainer: Codable {
              let success: Bool?
              let count: Int?
              let apps: [KurdStoreApp]
          }

          struct KurdStoreApp: Codable {
              let id: Int
              let name: String
              let bundle_id: String
              let bundle_version: String
              let ipa_size: String?            // e.g. "585.02 MB"
              let github_url: String?
              let archive_url: String?
              let ipa_url: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let created_at: String?          // ISO 8601
              let updated_at: String?          // ISO 8601
          }

          // MARK: - App Category
          struct AppCategory: Identifiable {
              let id = UUID()
              let name: String; let icon: String; let gradient: [Color]
          }
          VIPEOF
          echo "Models.swift: $(wc -l < Models.swift) lines"

      - name: Generate Source - AppsManager.swift
        run: |
          cat > AppsManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          // MARK: - Fetch Error
          enum AppFetchError: LocalizedError {
              case invalidURL(source: String)
              case noData(source: String)
              case decodeFailed(source: String)
              case network(source: String, message: String)

              var errorDescription: String? {
                  switch self {
                  case .invalidURL(let s):     return "\(s): رابط غير صالح"
                  case .noData(let s):         return "\(s): لا توجد بيانات"
                  case .decodeFailed(let s):   return "\(s): فشل تحليل البيانات"
                  case .network(let s, let m): return "\(s): \(m)"
                  }
              }
          }

          // MARK: - Apps Manager
          class AppsManager: ObservableObject {
              @Published var apps: [AppItem] = []
              @Published var isLoading = false
              @Published var errorMessage: String?
              @Published var recentSearches: [String] = []
              @Published var lastUpdated: Date?

              var categories: [AppCategory] {
                  return []
              }

              func appsForCategory(_ cat: AppCategory) -> [AppItem] {
                  switch cat.name {
                  default:              return apps
                  }
              }

              // MARK: - Fetch (both sources in parallel)
              func fetchApps() {
                  isLoading = true
                  errorMessage = nil

                  let group = DispatchGroup()
                  var combined: [AppItem] = []
                  var firstError: String?

                  // Primary
                  group.enter()
                  fetchPrimary { result in
                      switch result {
                      case .success(let items): combined.append(contentsOf: items)
                      case .failure(let err):   if firstError == nil { firstError = err.localizedDescription }
                      }
                      group.leave()
                  }

                  // KurdStore
                  group.enter()
                  fetchKurdStore { result in
                      switch result {
                      case .success(let items): combined.append(contentsOf: items)
                      case .failure(let err):   if firstError == nil { firstError = err.localizedDescription }
                      }
                      group.leave()
                  }

                  group.notify(queue: .main) {
                      self.isLoading = false
                      self.lastUpdated = Date()
                      // de-duplicate by bundleID
                      var seen = Set<String>()
                      let unique = combined.filter { item in
                          let key = item.bundleID.isEmpty ? item.name : item.bundleID
                          if seen.contains(key) { return false }
                          seen.insert(key)
                          return true
                      }
                      self.apps = unique
                      if unique.isEmpty, let err = firstError {
                          self.errorMessage = err
                      }
                  }
              }

              // MARK: - Primary source (apptesters)
              private func fetchPrimary(completion: @escaping (Result<[AppItem], Error>) -> Void) {
                  guard let url = URL(string: AppConstants.storeURL) else {
                      DispatchQueue.main.async { completion(.failure(AppFetchError.invalidURL(source: "المصدر 21s"))) }
                      return
                  }
                  URLSession.shared.dataTask(with: url) { data, _, err in
                      if let err = err {
                          DispatchQueue.main.async {
                              completion(.failure(AppFetchError.network(source: "المصدر 21s", message: err.localizedDescription)))
                          }
                          return
                      }
                      guard let data = data else {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.noData(source: "المصدر 21s"))) }
                          return
                      }
                      var loaded: [AppItem] = []
                      if let resp = try? JSONDecoder().decode(AppsResponse.self, from: data) {
                          loaded = resp.apps
                      } else if let arr = try? JSONDecoder().decode([AppItem].self, from: data) {
                          loaded = arr
                      } else {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.decodeFailed(source: "المصدر 21s"))) }
                          return
                      }
                      // Force source tag & category
                      let enriched = loaded.map { app -> AppItem in
                          var mutable = app
                          if mutable.category == nil || mutable.category!.isEmpty {
                              mutable.category = Self.inferCategory(name: app.name, desc: app.localizedDescription)
                          }
                          return AppItem(
                              name: mutable.name, type: mutable.type,
                              bundleID: mutable.bundleID,
                              bundleIdentifier: mutable.bundleIdentifier,
                              version: mutable.version,
                              versionDate: mutable.versionDate,
                              fullDate: mutable.fullDate,
                              size: mutable.size, down: mutable.down,
                              downloadURL: mutable.downloadURL,
                              developerName: mutable.developerName,
                              localizedDescription: mutable.localizedDescription,
                              icon: mutable.icon, iconURL: mutable.iconURL,
                              category: mutable.category, source: .primary
                          )
                      }
                      DispatchQueue.main.async { completion(.success(enriched)) }
                  }.resume()
              }

              // MARK: - KurdStore source
              private func fetchKurdStore(completion: @escaping (Result<[AppItem], Error>) -> Void) {
                  guard let url = URL(string: AppConstants.kurdStoreURL) else {
                      DispatchQueue.main.async { completion(.failure(AppFetchError.invalidURL(source: "KurdStore"))) }
                      return
                  }
                  URLSession.shared.dataTask(with: url) { data, _, err in
                      if let err = err {
                          DispatchQueue.main.async {
                              completion(.failure(AppFetchError.network(source: "KurdStore", message: err.localizedDescription)))
                          }
                          return
                      }
                      guard let data = data else {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.noData(source: "KurdStore"))) }
                          return
                      }
                      do {
                          let root = try JSONDecoder().decode(KurdStoreRoot.self, from: data)
                          let mapped = root.apps.apps.map { Self.toAppItem($0) }
                          DispatchQueue.main.async { completion(.success(mapped)) }
                      } catch {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.decodeFailed(source: "KurdStore"))) }
                      }
                  }.resume()
              }

              // MARK: - KurdStore -> AppItem mapper
              private static func toAppItem(_ k: KurdStoreApp) -> AppItem {
                  let sizeBytes = parseSizeMB(k.ipa_size)
                  // Build download URL: prefer ipa_url, fall back to github_url, then archive_url
                  let dl = (k.ipa_url?.isEmpty == false ? k.ipa_url :
                            k.github_url?.isEmpty == false ? k.github_url :
                            k.archive_url) ?? ""
                  // Use updated_at as the "newest" reference; fall back to created_at
                  let versionDate = Self.extractDate(from: k.updated_at) ?? Self.extractDate(from: k.created_at) ?? ""
                  return AppItem(
                      name: k.name,
                      type: 0,
                      bundleID: k.bundle_id,
                      bundleIdentifier: k.bundle_id,
                      version: k.bundle_version,
                      versionDate: versionDate,
                      fullDate: k.updated_at ?? k.created_at ?? "",
                      size: sizeBytes,
                      down: "0",
                      downloadURL: dl,
                      developerName: k.host ?? "KurdStore",
                      localizedDescription: k.description ?? "",
                      icon: k.icon ?? "",
                      iconURL: k.icon ?? "",
                      category: k.category,
                      source: .kurd
                  )
              }

              private static func parseSizeMB(_ s: String?) -> Int {
                  guard let s = s, !s.isEmpty else { return 0 }
                  // supports "585.02 MB", "1.2 GB", "900 KB"
                  let trimmed = s.trimmingCharacters(in: .whitespaces).uppercased()
                  let parts = trimmed.split(separator: " ")
                  guard parts.count == 2, let value = Double(parts[0]) else { return 0 }
                  switch parts[1] {
                  case "KB": return Int(value * 1024)
                  case "MB": return Int(value * 1024 * 1024)
                  case "GB": return Int(value * 1024 * 1024 * 1024)
                  default:   return Int(value)
                  }
              }

              private static func extractDate(from iso: String?) -> String? {
                  guard let iso = iso else { return nil }
                  let f = DateFormatter()
                  f.locale = Locale(identifier: "en_US_POSIX")
                  f.dateFormat = "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"
                  if let d = f.date(from: iso) {
                      let out = DateFormatter()
                      out.dateFormat = "yyyy-MM-dd"
                      return out.string(from: d)
                  }
                  f.dateFormat = "yyyy-MM-dd'T'HH:mm:ssZZZZZ"
                  if let d = f.date(from: iso) {
                      let out = DateFormatter()
                      out.dateFormat = "yyyy-MM-dd"
                      return out.string(from: d)
                  }
                  return nil
              }

              // MARK: - Category inference (shared)
              static func inferCategory(name: String, desc: String) -> String {
                  let text = (name + " " + desc).lowercased()
                  let map: [(keys: [String], cat: String)] = [
                      (["game", "لعبة", "لعب", "clash", "minecraft", "roblox", "pubg", "cod", "fifa"], "ألعاب"),
                      (["social", "chat", "تواصل", "instagram", "tiktok", "telegram", "whatsapp", "snapchat", "twitter", "x.com"], "اجتماعي"),
                      (["music", "موسيقى", "spotify", "soundcloud", "youtube", "video", "فيديو", "netflix", "tubi", "مشاهدة"], "ترفيه"),
                      (["vpn", "security", "أمان", "proxy", "shield", "protect"], "أمان"),
                      (["photo", "camera", "صورة", "تصوير", "edit", "تعديل", "lightroom", "vsco", "capcut"], "صور وفيديو"),
                      (["learn", "تعلّم", "education", "تعليم", "school", "duolingo", "quran", "قرآن"], "تعليم"),
                      (["shop", "store", "تسوق", "amazon", "noon", "delivery", "توصيل"], "تسوق"),
                      (["bank", "pay", "دفع", "مال", "finance", "بنك", "paypal", "stc pay"], "مالية"),
                      (["productivity", "office", "word", "excel", "pdf", "scan", "إنتاجية", "ملفات"], "إنتاجية"),
                      (["travel", "سفر", "flight", "hotel", "فندق", "map", "خرائط", "uber", "careem"], "سفر"),
                      (["health", "fitness", "صحة", "رياضة", "workout", "gym", "diet", "نظام غذائي"], "صحة ورياضة"),
                      (["food", "restaurant", "طعام", "مطعم", "hungerstation", "talabat", "جاهز"], "طعام"),
                      (["news", "أخبار", "newspaper", "bbc", "cnn", "aljazeera"], "أخبار"),
                  ]
                  for entry in map {
                      if entry.keys.contains(where: { text.contains($0) }) { return entry.cat }
                  }
                  return "أدوات"
              }

              // MARK: - Derived collections
              var newThisWeek: [AppItem] {
                  apps.filter { $0.isNew }
              }

              func apps(for source: AppSource) -> [AppItem] {
                  switch source {
                  case .all:     return apps
                  case .primary: return apps.filter { $0.source == .primary }
                  case .kurd:    return apps.filter { $0.source == .kurd }
                  }
              }

              func retryFetch() { fetchApps() }

              func loadRecentSearches() {
                  recentSearches = UserDefaults.standard.stringArray(forKey: "recentSearches") ?? []
              }

              func addRecentSearch(_ term: String) {
                  guard !term.isEmpty else { return }
                  recentSearches.removeAll { $0 == term }
                  recentSearches.insert(term, at: 0)
                  if recentSearches.count > 15 { recentSearches = Array(recentSearches.prefix(10)) }
                  UserDefaults.standard.set(recentSearches, forKey: "recentSearches")
              }
          }
          VIPEOF
          echo "AppsManager.swift: $(wc -l < AppsManager.swift) lines"

