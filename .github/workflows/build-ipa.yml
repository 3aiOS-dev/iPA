      - name: Generate Source - Privacy Policy Screen
        run: |
          cd ${{ github.workspace }}
          cat > PrivacyPolicyView.swift << 'HEOF'
          import SwiftUI

          struct PrivacyPolicyView: View {
              @EnvironmentObject var theme: ThemeManager

              var body: some View {
                  ScrollView {
                      Text(policyText)
                          .font(.system(size: 14))
                          .foregroundColor(theme.primaryText.opacity(0.85))
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .padding(20)
                  }
                  .background(theme.background.ignoresSafeArea())
                  .navigationTitle("سياسة الخصوصية")
                  .navigationBarTitleDisplayMode(.inline)
              }

              private var policyText: String {
                  """
                  آخر تحديث: 2026

                  تطبيق 21s هو نموذج عرض تجريبي (Demo) فقط، ونوضح فيما يلي كيفية التعامل مع بياناتك:

                  ١) البيانات المعروضة
                  جميع التطبيقات والألعاب والتقييمات الظاهرة في التطبيق بيانات وهمية لأغراض العرض فقط، ولا يقوم التطبيق بأي تنزيل أو تثبيت فعلي لأي برنامج حقيقي.

                  ٢) المفضلة
                  عند إضافة تطبيق إلى المفضلة، يتم حفظ هذا الاختيار محليًا على جهازك فقط (باستخدام UserDefaults)، ولا تتم مشاركته أو إرساله إلى أي خادم أو جهة خارجية.

                  ٣) جمع البيانات
                  لا يقوم هذا التطبيق بجمع أي معلومات شخصية، ولا يطلب أذونات وصول لجهات الاتصال أو الموقع أو الكاميرا، ولا يتصل بأي خدمات تحليلات أو إعلانات حقيقية.

                  ٤) الاتصال بالإنترنت
                  التطبيق يعمل بالكامل دون اتصال بالإنترنت، ولا يرسل أو يستقبل أي بيانات من مصادر خارجية.

                  ٥) التواصل
                  لأي استفسار حول هذه السياسة، يرجى التواصل مع المطوّر عبر القنوات المعتادة لدعم التطبيق.
                  """
              }
          }
          HEOF

