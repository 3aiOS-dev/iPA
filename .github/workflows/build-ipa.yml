                  )
              }
          }

          final class ScreenCaptureService: ObservableObject {
              static let shared = ScreenCaptureService()

              @Published var lastScreenshot: UIImage? = nil
              @Published var showThanksOverlay: Bool = false

              private var observer: NSObjectProtocol?

              private init() {}

              func start() {
                  guard observer == nil else { return }
                  observer = NotificationCenter.default.addObserver(
                      forName: UIApplication.userDidTakeScreenshotNotification,
                      object: nil,
                      queue: .main
                  ) { [weak self] _ in
                      guard let self = self else { return }
                      self.lastScreenshot = self.loadLatestScreenshotFromPhotos()
                      self.showThanksOverlay = true
                      HapticManager.shared.success()
                      NotificationManager.shared.notifyScreenshotThanks()
                  }
              }

              func stop() {
                  if let obs = observer {
                      NotificationCenter.default.removeObserver(obs)
                      observer = nil
                  }
              }

              func dismissOverlay() {
                  showThanksOverlay = false
              }

              private func loadLatestScreenshotFromPhotos() -> UIImage? {
                  return nil
              }
          }
