                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                      </array>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76@2x~ipad.png</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          MEOF

      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift UIComponents.swift TempManager.swift TempBrowserCore.swift TempBrowserTable.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -framework UserNotifications \
            -o TempS

          file TempS

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/TempS.app

          cp TempS build-output/Payload/TempS.app/TempS
          cp Resources/Info.plist build-output/Payload/TempS.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/TempS.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/TempS.app/

          ldid -S build-output/Payload/TempS.app/TempS

          cd build-output
          zip -r -q ../artifacts/TempS.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/TempS.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempS-IPA
          path: artifacts/TempS.ipa
          retention-days: 30
