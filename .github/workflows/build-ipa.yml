          // ================= NATURAL-SIZE SCREENSHOT (بدون قص) =================
          struct NaturalScreenshot: View {
              let url: String
              @State private var size: CGSize = .init(width: 200, height: 380)
              @State private var didLoad = false

              var body: some View {
                  Group {
                      if let img = RemoteIconCache.shared.image(for: url) {
                          Image(uiImage: img)
                              .resizable()
                              .aspectRatio(img.size.width / max(img.size.height, 1), contentMode: .fit)
                              .frame(maxHeight: 380)
                      } else {
                          RoundedRectangle(cornerRadius: 14)
                              .fill(Color.storeDivider)
                              .frame(width: 200, height: 380)
                      }
                  }
                  .clipShape(RoundedRectangle(cornerRadius: 14))
              }
          }

          // ================= SCREENSHOT GALLERY (بدون قص) =================
          struct ScreenshotGallery: View {
              let urls: [String]
              let startIndex: Int
              @Environment(\.dismiss) private var dismiss
