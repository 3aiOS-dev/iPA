      - name: Generate code - SigningCenter.swift (certificates, IPA restore, server signing, OTA install)
        run: |
          cat > SigningCenter.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import UniformTypeIdentifiers

          // ============================================================
          // SIGNING + INSTALL CENTER
          // - import .p12 / .mobileprovision certificates
          // - import / restore .ipa files from Files & iCloud
          // - sign on a real signing server (multipart upload)
          // - install over-the-air with itms-services
          // ============================================================

          struct SignCertificate: Codable, Identifiable, Hashable {
              var id: UUID = UUID()
              var name: String
              var p12File: String?
              var provisionFile: String?
              var password: String
              var addedAt: Date = Date()

              var isComplete: Bool { p12File != nil && provisionFile != nil }
          }

          struct LocalIPAFile: Codable, Identifiable, Hashable {
              var id: UUID = UUID()
              var name: String
              var fileName: String
              var bytes: Int64
              var addedAt: Date = Date()
              var signedInstallURL: String? = nil

              var sizeText: String {
                  let mb = Double(bytes) / 1_048_576.0
                  if mb >= 1024 { return String(format: "%.2f GB", mb / 1024) }
                  return String(format: "%.1f MB", mb)
              }
          }

          @MainActor
          final class SigningManager: ObservableObject {
              static let shared = MainActor.assumeIsolated { SigningManager() }

              @Published var certificates: [SignCertificate] = []
              @Published var ipaFiles: [LocalIPAFile] = []
              @Published var isWorking: Bool = false
              @Published var progress: Double = 0
              @Published var statusText: String = ""
              @Published var lastInstallURL: String? = nil
              @Published var log: [String] = []

              /// Real signing backend. Any server that accepts a multipart upload
              /// (ipa + p12 + mobileprovision + password) and returns an install URL.
              static let defaultServer = "https://project--291589c4-e7ca-44e3-9e12-655617d8f716.lovable.app/api/public"

              /// A stored value is only used when it is a real http(s) URL with a host.
              /// An empty or broken saved value falls back to the default server, so the
              /// "عنوان سيرفر التوقيع غير صحيح" alert can never lock the user out.
              @Published var serverURL: String = SigningManager.usableServer(UserDefaults.standard.string(forKey: "sign_server_21s"))

              static func isUsable(_ value: String) -> Bool {
                  guard let url = URL(string: value + "/sign"),
                        let scheme = url.scheme?.lowercased(),
                        scheme == "https" || scheme == "http",
                        let host = url.host, !host.isEmpty else { return false }
                  return true
              }

              static func usableServer(_ raw: String?) -> String {
                  let clean = sanitizeServer(raw ?? "")
                  return isUsable(clean) ? clean : defaultServer
              }

              private let certKey = "sign_certs_21s"
              private let ipaKey  = "sign_ipas_21s"

              private init() { load() }

              // MARK: storage
              var storeDir: URL {
                  let base = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      .appendingPathComponent("Signing", isDirectory: true)
                  if !FileManager.default.fileExists(atPath: base.path) {
                      try? FileManager.default.createDirectory(at: base, withIntermediateDirectories: true)
                  }
                  return base
              }

              func fileURL(_ name: String) -> URL { storeDir.appendingPathComponent(name) }

              private func load() {
                  if let d = UserDefaults.standard.data(forKey: certKey),
                     let v = try? JSONDecoder().decode([SignCertificate].self, from: d) { certificates = v }
                  if let d = UserDefaults.standard.data(forKey: ipaKey),
                     let v = try? JSONDecoder().decode([LocalIPAFile].self, from: d) { ipaFiles = v }
              }

              private func save() {
                  if let d = try? JSONEncoder().encode(certificates) { UserDefaults.standard.set(d, forKey: certKey) }
                  if let d = try? JSONEncoder().encode(ipaFiles) { UserDefaults.standard.set(d, forKey: ipaKey) }
              }

              func setServer(_ value: String) {
                  let clean = SigningManager.sanitizeServer(value)
                  guard SigningManager.isUsable(clean) else {
                      // Never store an empty/broken value: keep the working server instead.
                      addLog("الرابط المُدخل غير صالح. أدخل عنوانًا يبدأ بـ https:// .")
                      addLog("سيرفر التوقيع الحالي: \(serverURL)")
                      return
                  }
                  serverURL = clean
                  UserDefaults.standard.set(clean, forKey: "sign_server_21s")
                  addLog("تم حفظ سيرفر التوقيع: \(clean)")
              }

              func resetServer() {
                  serverURL = SigningManager.defaultServer
                  UserDefaults.standard.set(serverURL, forKey: "sign_server_21s")
                  addLog("تمت إعادة سيرفر التوقيع إلى الافتراضي: \(serverURL)")
              }

              /// Accepts anything the user pastes (itms-services://?action=download-manifest&url=...,
              /// a manifest .plist link, a bare host, or a full https base) and returns a usable
              /// https base URL. This is what prevents the "رابط غير مدعوم" (unsupported URL) failure:
              /// URLSession can only POST to http/https, never to itms-services.
              static func sanitizeServer(_ raw: String) -> String {
                  var v = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                  if v.isEmpty { return v }

                  // itms-services://?action=download-manifest&url=<encoded https manifest>
                  if v.lowercased().hasPrefix("itms-services://") {
                      if let comps = URLComponents(string: v),
                         let inner = comps.queryItems?.first(where: { $0.name.lowercased() == "url" })?.value,
                         !inner.isEmpty {
                          v = inner.removingPercentEncoding ?? inner
                      } else if let r = v.range(of: "url=") {
                          let tail = String(v[r.upperBound...])
                          v = tail.removingPercentEncoding ?? tail
                      }
                  }

                  // Add a scheme when the user typed only a host.
                  let lower = v.lowercased()
                  if !lower.hasPrefix("http://") && !lower.hasPrefix("https://") {
                      v = "https://" + v.replacingOccurrences(of: "^/+", with: "", options: .regularExpression)
                  }

                  guard var comps = URLComponents(string: v), let host = comps.host, !host.isEmpty else { return v }
                  comps.query = nil
                  comps.fragment = nil
                  if comps.scheme?.lowercased() != "http" { comps.scheme = "https" }

                  // Keep only the base path: drop /sign, /manifest/..., or a trailing manifest file.
                  var path = comps.path
                  for suffix in ["/sign", "/api/sign", "/api/public/sign"] {
                      if path.lowercased().hasSuffix(suffix) {
                          path = String(path.dropLast(suffix.count))
                          break
                      }
                  }
                  if path.lowercased().hasSuffix(".plist") || path.lowercased().hasSuffix(".ipa") {
                      path = (path as NSString).deletingLastPathComponent
                  }
                  if let r = path.range(of: "/manifest", options: [.caseInsensitive]) {
                      path = String(path[path.startIndex..<r.lowerBound])
                  }
                  while path.hasSuffix("/") { path.removeLast() }
                  comps.path = path
                  return comps.string ?? v
              }

              /// Endpoint used for the multipart upload. Falls back to the default server
              /// when the stored value is empty or unusable, so signing never dead-ends.
              var signEndpoint: URL? {
                  var base = SigningManager.sanitizeServer(serverURL)
                  if !SigningManager.isUsable(base) { base = SigningManager.defaultServer }
                  guard let url = URL(string: base + "/sign"),
                        let scheme = url.scheme?.lowercased(),
                        scheme == "https" || scheme == "http",
                        let host = url.host, !host.isEmpty else { return nil }
                  return url
              }

              private func addLog(_ line: String) {
                  log.insert(line, at: 0)
                  if log.count > 120 { log.removeLast(log.count - 120) }
                  statusText = line
              }

              // MARK: import certificate parts
              func importCertificateFile(_ url: URL) {
                  let ext = url.pathExtension.lowercased()
                  guard let data = try? Data(contentsOf: url) else {
                      addLog("فشل التحميل: \(url.lastPathComponent)")
                      return
                  }
                  let stored = "\(UUID().uuidString).\(ext)"
                  do {
                      try data.write(to: fileURL(stored))
                  } catch {
                      addLog("فشل الحفظ: \(error.localizedDescription)")
                      return
                  }

                  if ext == "p12" || ext == "pfx" {
                      var cert = SignCertificate(name: url.deletingPathExtension().lastPathComponent, p12File: stored, provisionFile: nil, password: "")
                      if let idx = certificates.firstIndex(where: { $0.p12File == nil }) {
                          certificates[idx].p12File = stored
                          cert = certificates[idx]
                          certificates[idx] = cert
                      } else {
                          certificates.append(cert)
                      }
                      addLog("تمت إضافة شهادة (.p12): \(url.lastPathComponent)")
                  } else if ext == "mobileprovision" || ext == "provisionprofile" {
                      if let idx = certificates.lastIndex(where: { $0.provisionFile == nil }) {
                          certificates[idx].provisionFile = stored
                      } else {
                          certificates.append(SignCertificate(name: url.deletingPathExtension().lastPathComponent, p12File: nil, provisionFile: stored, password: ""))
                      }
                      addLog("تمت إضافة ملف البروفايل: \(url.lastPathComponent)")
                  } else {
                      addLog("صيغة غير مدعومة: .\(ext)")
                      return
                  }
                  save()
                  NotificationsManager.shared.push(title: "تمت إضافة الشهادة", body: url.lastPathComponent, icon: "checkmark.seal.fill")
              }

              func setPassword(_ password: String, for cert: SignCertificate) {
                  guard let idx = certificates.firstIndex(where: { $0.id == cert.id }) else { return }
                  certificates[idx].password = password
                  save()
              }

              func rename(_ name: String, for cert: SignCertificate) {
                  guard let idx = certificates.firstIndex(where: { $0.id == cert.id }) else { return }
                  certificates[idx].name = name
                  save()
              }

              func deleteCertificate(_ cert: SignCertificate) {
                  if let f = cert.p12File { try? FileManager.default.removeItem(at: fileURL(f)) }
                  if let f = cert.provisionFile { try? FileManager.default.removeItem(at: fileURL(f)) }
                  certificates.removeAll { $0.id == cert.id }
                  save()
              }

              // MARK: import / restore IPA
              func importIPA(_ url: URL) {
                  guard let data = try? Data(contentsOf: url) else {
                      addLog("فشل تحميل ملف IPA: \(url.lastPathComponent)")
                      return
                  }
                  let stored = "\(UUID().uuidString).ipa"
                  do { try data.write(to: fileURL(stored)) } catch {
                      addLog("فشل حفظ ملف IPA: \(error.localizedDescription)")
                      return
                  }
                  let item = LocalIPAFile(name: url.deletingPathExtension().lastPathComponent,
                                          fileName: stored,
                                          bytes: Int64(data.count))
                  ipaFiles.insert(item, at: 0)
                  save()
                  addLog("استعادة IPA: \(item.name) (\(item.sizeText))")
                  NotificationsManager.shared.push(title: "تمت إضافة ملف IPA", body: "\(item.name) · \(item.sizeText)", icon: "tray.and.arrow.down.fill")
              }

              /// Restore an IPA straight from a download URL (store apps, mirrors...).
              func restoreIPA(from remote: String, displayName: String? = nil) {
                  guard let url = URL(string: remote) else { addLog("الرابط غير صالح"); return }
                  isWorking = true
                  progress = 0
                  addLog("جارٍ التنزيل: \(url.lastPathComponent)")
                  let task = URLSession.shared.downloadTask(with: url) { tmp, _, error in
                      DispatchQueue.main.async {
                          self.isWorking = false
                          guard let tmp = tmp, error == nil else {
                              self.addLog("فشل التنزيل: \(error?.localizedDescription ?? "خطأ غير معروف")")
                              return
                          }
                          let stored = "\(UUID().uuidString).ipa"
                          let dest = self.fileURL(stored)
                          try? FileManager.default.removeItem(at: dest)
                          do { try FileManager.default.moveItem(at: tmp, to: dest) } catch {
                              self.addLog("فشل الحفظ: \(error.localizedDescription)")
                              return
                          }
                          let attrs = try? FileManager.default.attributesOfItem(atPath: dest.path)
                          let size = (attrs?[.size] as? NSNumber)?.int64Value ?? 0
                          let item = LocalIPAFile(name: displayName ?? url.deletingPathExtension().lastPathComponent,
                                                  fileName: stored,
                                                  bytes: size)
                          self.ipaFiles.insert(item, at: 0)
                          self.save()
                          self.addLog("تمت الاستعادة: \(item.name)")
                          NotificationsManager.shared.push(title: "تمت استعادة ملف IPA", body: item.name, icon: "arrow.down.circle.fill")
                      }
                  }
                  task.resume()
              }

              func deleteIPA(_ item: LocalIPAFile) {
                  try? FileManager.default.removeItem(at: fileURL(item.fileName))
                  ipaFiles.removeAll { $0.id == item.id }
                  save()
              }

              func exportURL(for item: LocalIPAFile) -> URL { fileURL(item.fileName) }

              // MARK: signing on the real server
              func sign(ipa: LocalIPAFile, with cert: SignCertificate) {
                  guard cert.isComplete else {
                      addLog("الشهادة غير مكتملة (مطلوب .p12 و .mobileprovision)")
                      return
                  }
                  guard let endpoint = signEndpoint else {
                      let hint = "يجب إدخال عنوان يبدأ بـ https:// لسيرفر التوقيع (لا يمكن استخدام itms-services://)."
                      addLog("عنوان سيرفر التوقيع غير صالح: \(serverURL)")
                      addLog(hint)
                      NotificationsManager.shared.push(title: "عنوان سيرفر التوقيع غير صحيح", body: hint, icon: "exclamationmark.triangle.fill")
                      return
                  }
                  guard let ipaData = try? Data(contentsOf: fileURL(ipa.fileName)),
                        let p12Name = cert.p12File, let p12Data = try? Data(contentsOf: fileURL(p12Name)),
                        let provName = cert.provisionFile, let provData = try? Data(contentsOf: fileURL(provName)) else {
                      addLog("فشل تحميل الملف")
                      return
                  }

                  isWorking = true
                  progress = 0.05
                  addLog("جارٍ الرفع إلى سيرفر التوقيع...")

                  let boundary = "Boundary-\(UUID().uuidString)"
                  var request = URLRequest(url: endpoint)
                  request.httpMethod = "POST"
                  request.timeoutInterval = 600
                  request.setValue("multipart/form-data; boundary=\(boundary)", forHTTPHeaderField: "Content-Type")

                  var body = Data()
                  func appendField(_ name: String, _ value: String) {
                      body.append("--\(boundary)\r\n".data(using: .utf8)!)
                      body.append("Content-Disposition: form-data; name=\"\(name)\"\r\n\r\n".data(using: .utf8)!)
                      body.append("\(value)\r\n".data(using: .utf8)!)
                  }
                  func appendFile(_ name: String, _ filename: String, _ data: Data, _ mime: String) {
                      body.append("--\(boundary)\r\n".data(using: .utf8)!)
                      body.append("Content-Disposition: form-data; name=\"\(name)\"; filename=\"\(filename)\"\r\n".data(using: .utf8)!)
                      body.append("Content-Type: \(mime)\r\n\r\n".data(using: .utf8)!)
                      body.append(data)
                      body.append("\r\n".data(using: .utf8)!)
                  }

                  appendField("password", cert.password)
                  appendField("bundle_name", ipa.name)
                  appendField("client", "21s-ios")
                  appendFile("ipa", "\(ipa.name).ipa", ipaData, "application/octet-stream")
                  appendFile("p12", "cert.p12", p12Data, "application/x-pkcs12")
                  appendFile("mobileprovision", "profile.mobileprovision", provData, "application/octet-stream")
                  body.append("--\(boundary)--\r\n".data(using: .utf8)!)

                  let task = URLSession.shared.uploadTask(with: request, from: body) { data, response, error in
                      DispatchQueue.main.async {
                          self.isWorking = false
                          self.progress = 1
                          if let error = error {
                              self.addLog("فشل التوقيع: \(error.localizedDescription)")
                              NotificationsManager.shared.push(title: "فشل التوقيع", body: error.localizedDescription, icon: "xmark.octagon.fill")
                              return
                          }
                          guard let http = response as? HTTPURLResponse else {
                              self.addLog("لا يوجد رد HTTP صالح من سيرفر التوقيع")
                              NotificationsManager.shared.push(title: "فشل التوقيع", body: "رد سيرفر التوقيع غير صالح.", icon: "xmark.octagon.fill")
                              return
                          }
                          let status = http.statusCode
                          let responseData = data ?? Data()
                          let contentType = (http.value(forHTTPHeaderField: "Content-Type") ?? "").lowercased()
                          guard status >= 200, status < 300 else {
                              let detail = self.serverErrorMessage(from: responseData, status: status)
                              self.addLog("فشل التوقيع: \(detail)")
                              NotificationsManager.shared.push(title: "فشل التوقيع", body: detail, icon: "xmark.octagon.fill")
                              return
                          }
                          guard !contentType.contains("text/html") else {
                              let detail = "تم إرجاع صفحة ويب بدلًا من واجهة التوقيع. تحقق من عنوان السيرفر ومن المسار /api/public/sign."
                              self.addLog(detail)
                              NotificationsManager.shared.push(title: "فشل التوقيع", body: detail, icon: "xmark.octagon.fill")
                              return
                          }
                          if let install = self.parseInstallURL(from: responseData) {
                              if let idx = self.ipaFiles.firstIndex(where: { $0.id == ipa.id }) {
                                  self.ipaFiles[idx].signedInstallURL = install
                                  self.save()
                              }
                              self.lastInstallURL = install
                              self.addLog("تم التوقيع. سيظهر تأكيد التثبيت من iOS.")
                              NotificationsManager.shared.push(title: "تم التوقيع بنجاح", body: "سيبدأ تثبيت \(ipa.name).", icon: "checkmark.seal.fill")
                              self.install(install)
                          } else {
                              let detail = self.serverErrorMessage(from: responseData, status: status)
                              self.addLog("لا يوجد install_url: \(detail)")
                              NotificationsManager.shared.push(title: "فشل التوقيع", body: "لا يحتوي رد السيرفر على install_url أو manifest_url.", icon: "xmark.octagon.fill")
                          }
                      }
                  }
                  task.resume()
              }

              private func serverErrorMessage(from data: Data, status: Int) -> String {
                  if let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                      for key in ["error", "message", "detail"] {
                          if let value = obj[key] as? String, !value.isEmpty { return value }
                      }
                  }
                  let text = String(data: data, encoding: .utf8)?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
                  if text.lowercased().contains("<!doctype html") || text.lowercased().contains("<html") {
                      return "HTTP \(status): تم إرجاع صفحة HTML بدلًا من واجهة التوقيع"
                  }
                  return text.isEmpty ? "HTTP \(status)" : "HTTP \(status): \(text.prefix(180))"
              }

              private func parseInstallURL(from data: Data) -> String? {
                  if let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                      for key in ["install_url", "installURL", "itms", "manifest_url", "plist_url", "url", "ipa_url", "download_url"] {
                          if let v = obj[key] as? String, !v.isEmpty {
                              return normalizeInstall(v)
                          }
                      }
                      if let nested = obj["data"] as? [String: Any] {
                          for key in ["install_url", "manifest_url", "plist_url", "url"] {
                              if let v = nested[key] as? String, !v.isEmpty { return normalizeInstall(v) }
                          }
                      }
                  }
                  if let text = String(data: data, encoding: .utf8) {
                      let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)
                      if trimmed.hasPrefix("itms-services://") || trimmed.hasPrefix("http") {
                          return normalizeInstall(trimmed)
                      }
                  }
                  return nil
              }

              func normalizeInstall(_ raw: String) -> String {
                  var value = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                  if value.lowercased().hasPrefix("itms-services://") { return value }

                  // The intermediary may return a relative manifest path.
                  if value.hasPrefix("/"), let base = URL(string: SigningManager.sanitizeServer(serverURL)),
                     let absolute = URL(string: value, relativeTo: base)?.absoluteURL.absoluteString {
                      value = absolute
                  }

                  let lower = value.lowercased()
                  guard lower.hasPrefix("https://"),
                        lower.hasSuffix(".plist") || lower.contains("/manifest/") || lower.contains("/manifest?") else {
                      return value
                  }
                  var components = URLComponents()
                  components.scheme = "itms-services"
                  components.host = ""
                  components.queryItems = [
                      URLQueryItem(name: "action", value: "download-manifest"),
                      URLQueryItem(name: "url", value: value)
                  ]
                  return components.string ?? value
              }

              // MARK: OTA install
              func install(_ urlString: String) {
                  // iOS only installs through itms-services://?action=download-manifest&url=<https manifest>.
                  // Anything else (plain https link, .plist link) is converted here first.
                  let final = normalizeInstall(urlString.trimmingCharacters(in: .whitespacesAndNewlines))
                  guard let url = URL(string: final), url.scheme != nil else {
                      addLog("رابط التثبيت غير صالح: \(urlString)")
                      NotificationsManager.shared.push(title: "لا يمكن التثبيت", body: "رابط التثبيت غير صالح.", icon: "xmark.octagon.fill")
                      return
                  }
                  guard url.scheme?.lowercased() == "itms-services" else {
                      addLog("يجب أن يكون رابط التثبيت بصيغة itms-services:// : \(final)")
                      NotificationsManager.shared.push(title: "لا يمكن التثبيت", body: "لم يُرجع السيرفر رابط ملف manifest (.plist).", icon: "xmark.octagon.fill")
                      return
                  }
                  addLog("جارٍ بدء التثبيت...")
                  DispatchQueue.main.async {
                      UIApplication.shared.open(url, options: [.universalLinksOnly: false]) { ok in
                          DispatchQueue.main.async {
                              if ok {
                                  NotificationsManager.shared.push(title: "جارٍ التثبيت", body: "تحقق من الشاشة الرئيسية.", icon: "arrow.down.app.fill")
                              } else {
                                  self.addLog("لم نتمكن من بدء التثبيت. تحقق من الثقة عبر الإعدادات > الملفات التعريفية.")
                                  NotificationsManager.shared.push(title: "لا يمكن بدء التثبيت", body: "اسمح بالتثبيت ثم أعد المحاولة.", icon: "xmark.octagon.fill")
                              }
                          }
                      }
                  }
              }
          }

          // MARK: - Document picker
          struct DocumentPickerView: UIViewControllerRepresentable {
              var types: [UTType]
              var onPick: (URL) -> Void

              func makeCoordinator() -> Coordinator { Coordinator(onPick: onPick) }

              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: types, asCopy: true)
                  picker.allowsMultipleSelection = false
                  picker.delegate = context.coordinator
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}

              final class Coordinator: NSObject, UIDocumentPickerDelegate {
                  let onPick: (URL) -> Void
                  init(onPick: @escaping (URL) -> Void) { self.onPick = onPick }
                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      if let url = urls.first { onPick(url) }
                  }
              }
          }

          // ============================================================
          // SIGNING HUB UI (التطبيقات tab)
          // ============================================================
          struct SigningHubView: View {
              @Binding var isPresented: Bool
              @ObservedObject private var manager = SigningManager.shared

              @State private var showCertPicker = false
              @State private var showIPAPicker = false
