          import Foundation
          import SwiftUI

          @MainActor
          final class RepositoriesStore: ObservableObject {
              static let shared = RepositoriesStore()

              @Published private(set) var repositories: [DownloadRepository]
              @Published private(set) var quota: DownloadQuota
              @Published private(set) var totalAppsAvailable: Int = 0

              private let keyRepos = "repositories.v1"
              private let keyQuota = "quota.v1"
              private let d = UserDefaults.standard

              private init() {
                  if let data = d.data(forKey: keyQuota),
                     let decoded = try? JSONDecoder().decode(DownloadQuota.self, from: data) {
                      self.quota = decoded
                  } else {
                      self.quota = DownloadQuota(
                          id: "user-quota",
                          totalBytes: Int64(1000) * 1_073_741_824,
                          usedBytes: 0
                      )
                  }
                  if let data = d.data(forKey: keyRepos),
                     let decoded = try? JSONDecoder().decode([DownloadRepository].self, from: data) {
                      self.repositories = decoded
                  } else {
                      self.repositories = [
                          DownloadRepository(
                              id: "apptesters-main",
                              name: "AppTesters IPA Repo",
                              feedURL: "https://repository.apptesters.org/apps.json",
                              homepage: "https://apptesters.org",
                              enabled: true,
                              maxGB: 250
                          ),
                          DownloadRepository(
                              id: "apptesters-mirror",
                              name: "AppTesters Mirror",
                              feedURL: "https://repo.apptesters.org/index.json",
                              homepage: "https://apptesters.org",
                              enabled: true,
                              maxGB: 250
                          ),
                          DownloadRepository(
                              id: "21s-originals",
                              name: "21s Originals",
                              feedURL: "https://21s.app/repo/apps.json",
                              homepage: "https://21s.app",
                              enabled: true,
                              maxGB: 500
                          )
                      ]
                  }
                  self.persistRepositories()
                  self.persistQuota()
              }

              func totalMaxGB() -> Double {
                  repositories.filter { $0.enabled }.reduce(0) { $0 + $1.maxGB }
              }

              func setEnabled(_ enabled: Bool, for repo: DownloadRepository) {
                  guard let idx = repositories.firstIndex(where: { $0.id == repo.id }) else { return }
                  repositories[idx] = DownloadRepository(
                      id: repo.id, name: repo.name, feedURL: repo.feedURL,
                      homepage: repo.homepage, enabled: enabled, maxGB: repo.maxGB
                  )
                  persistRepositories()
              }

              func resetQuotaUsage() {
                  quota = DownloadQuota(id: quota.id, totalBytes: quota.totalBytes, usedBytes: 0)
                  persistQuota()
              }

              func addUsedBytes(_ bytes: Int64) {
                  let updated = DownloadQuota(id: quota.id, totalBytes: quota.totalBytes, usedBytes: quota.usedBytes + bytes)
                  quota = updated
                  persistQuota()
              }

              func updateTotalApps(_ count: Int) {
                  totalAppsAvailable = count
              }

              private func persistRepositories() {
                  if let data = try? JSONEncoder().encode(repositories) {
                      d.set(data, forKey: keyRepos)
                  }
              }

              private func persistQuota() {
                  if let data = try? JSONEncoder().encode(quota) {
                      d.set(data, forKey: keyQuota)
                  }
              }
          }
          VIPEOF

      - name: Generate code - FavoritesStore.swift
        run: |
          cat > FavoritesStore.swift << 'FAVEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class FavoritesStore: ObservableObject {
              static let shared = FavoritesStore()

              @Published private(set) var items: [StoreAPIApp] = []

              private let key = "favorites.v1"
              private let d = UserDefaults.standard

              private init() { load() }

              private func load() {
                  guard let data = d.data(forKey: key),
                        let decoded = try? JSONDecoder().decode([StoreAPIApp].self, from: data) else {
                      return
                  }
                  items = decoded
              }

              private func save() {
                  if let data = try? JSONEncoder().encode(items) {
                      d.set(data, forKey: key)
                  }
              }

              func contains(_ app: StoreAPIApp) -> Bool {
                  items.contains(where: { $0.id == app.id })
              }

              func toggle(_ app: StoreAPIApp) {
                  if contains(app) {
                      items.removeAll { $0.id == app.id }
                      HapticManager.shared.impact(.light)
                  } else {
                      items.insert(app, at: 0)
                      HapticManager.shared.success()
                  }
                  save()
              }

              func add(_ app: StoreAPIApp) {
                  if contains(app) { return }
                  items.insert(app, at: 0)
                  save()
              }

              func remove(_ app: StoreAPIApp) {
                  items.removeAll { $0.id == app.id }
                  save()
              }

              func clearAll() {
                  items.removeAll()
                  save()
              }
          }

          struct FavoriteButton: View {
              let app: StoreAPIApp
              var size: CGFloat = 40
              var style: Style = .filled
              enum Style { case filled, ghost }

              @ObservedObject private var store = FavoritesStore.shared

              var body: some View {
                  let isFav = store.contains(app)
                  Button {
                      store.toggle(app)
                  } label: {
                      Image(systemName: isFav ? "heart.fill" : "heart")
                          .font(.system(size: size * 0.45, weight: .bold))
                          .foregroundColor(isFav ? .white : Color.storePink)
                          .frame(width: size, height: size)
                          .background(
                              Circle()
                                  .fill(isFav
                                        ? LinearGradient(colors: [Color.storePink, Color.storePrimary],
                                                         startPoint: .topLeading, endPoint: .bottomTrailing)
                                        : LinearGradient(colors: [Color.white], startPoint: .top, endPoint: .bottom))
                          )
                          .overlay(
                              Circle()
                                  .stroke(isFav ? Color.clear : Color.storeDivider, lineWidth: 1)
                          )
                          .shadow(color: isFav ? Color.storePink.opacity(0.35) : Color.black.opacity(0.06),
                                  radius: isFav ? 8 : 4, y: 2)
                  }
                  .buttonStyle(.plain)
                  .animation(.spring(response: 0.3, dampingFraction: 0.6), value: isFav)
              }
          }
          FAVEOF

      - name: Generate code - AuthManager.swift (remove UDID)
        run: |
          cat > AuthManager.swift << 'VIPEOF'
          import SwiftUI
          import Foundation
          import Combine

          @MainActor
          public final class AuthManager: ObservableObject {
              public static let shared = MainActor.assumeIsolated { AuthManager() }

              @Published var currentUser: AppUser?
              @Published var isAuthenticated: Bool = false
              @Published var isLoading: Bool = false
              @Published var errorMessage: String?

              private let userDefaultsKey = AppConstants.userDefaultsKey

              public init() { loadUser() }

              func signUp(phoneNumber: String, username: String, password: String, confirmPassword: String) -> Bool {
                  isLoading = true
                  errorMessage = nil

                  let trimmedPhone = phoneNumber.trimmingCharacters(in: .whitespaces)
                  if trimmedPhone.isEmpty {
                      errorMessage = "Phone number is required"; isLoading = false; return false
                  }
                  if !trimmedPhone.hasPrefix("+") {
                      errorMessage = "Phone number must include country code (e.g., +971501234567)"
                      isLoading = false; return false
                  }
                  let digitsOnly = trimmedPhone.dropFirst().filter { $0.isNumber }
                  if digitsOnly.count < 7 {
                      errorMessage = "Please enter a valid phone number (at least 7 digits after country code)"
                      isLoading = false; return false
                  }

                  if username.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Username is required"; isLoading = false; return false
                  }
                  if username.count < 3 {
                      errorMessage = "Username must be at least 3 characters"; isLoading = false; return false
                  }
                  if password.count < 6 {
                      errorMessage = "Password must be at least 6 characters"; isLoading = false; return false
                  }
                  if password != confirmPassword {
                      errorMessage = "Passwords do not match"; isLoading = false; return false
                  }

                  let existingUsers = loadAllUsers()
                  if existingUsers.contains(where: { $0.phoneNumber == trimmedPhone }) {
                      errorMessage = "This phone number is already registered"; isLoading = false; return false
                  }
                  if existingUsers.contains(where: { $0.username.lowercased() == username.lowercased() }) {
                      errorMessage = "This username is already taken"; isLoading = false; return false
                  }

                  let newUser = AppUser(phoneNumber: trimmedPhone, username: username, password: password)
                  var users = loadAllUsers()
                  users.append(newUser)
                  saveAllUsers(users)

                  currentUser = newUser
                  isAuthenticated = true
                  isLoading = false
                  HapticManager.shared.success()
                  UserDefaults.standard.set(newUser.id.uuidString, forKey: "currentUserID")
                  UserDefaults.standard.set(false, forKey: AppConstants.hasSeenOnboardingKey)
                  return true
              }

              func login(phoneNumber: String, password: String) -> Bool {
                  isLoading = true
                  errorMessage = nil

                  let trimmedPhone = phoneNumber.trimmingCharacters(in: .whitespaces)
                  if trimmedPhone.isEmpty {
                      errorMessage = "Phone number is required"; isLoading = false; return false
                  }
                  if password.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Password is required"; isLoading = false; return false
                  }

                  let users = loadAllUsers()
                  guard let user = users.first(where: { $0.phoneNumber == trimmedPhone && $0.password == password }) else {
                      errorMessage = "Invalid phone number or password"; isLoading = false; return false
                  }

                  currentUser = user
                  isAuthenticated = true
                  isLoading = false
                  HapticManager.shared.success()
                  UserDefaults.standard.set(user.id.uuidString, forKey: "currentUserID")
                  UserDefaults.standard.set(false, forKey: AppConstants.hasSeenOnboardingKey)
                  return true
              }

              func logout() {
                  currentUser = nil
                  isAuthenticated = false
                  UserDefaults.standard.removeObject(forKey: "currentUserID")
              }

              private func loadUser() {
                  guard let savedID = UserDefaults.standard.string(forKey: "currentUserID"),
                        let id = UUID(uuidString: savedID) else { return }
                  let users = loadAllUsers()
                  if let user = users.first(where: { $0.id == id }) {
                      currentUser = user
                      isAuthenticated = true
                  }
              }

              private func loadAllUsers() -> [AppUser] {
                  guard let data = UserDefaults.standard.data(forKey: userDefaultsKey),
                        let users = try? JSONDecoder().decode([AppUser].self, from: data) else { return [] }
                  return users
              }

              private func saveAllUsers(_ users: [AppUser]) {
                  if let data = try? JSONEncoder().encode(users) {
                      UserDefaults.standard.set(data, forKey: userDefaultsKey)
                  }
              }
          }
          VIPEOF

