          // MARK: - Apps Tab (all apps, sorted with "جديد" badge)
          struct AppsListView: View {
              @ObservedObject var feed: StoreFeed
              @State private var searchText: String = ""

              private var sortedApps: [StoreAPIApp] {
                  let now = Date()
                  // Separate new (within 24h) and old
                  var newApps = feed.apps.filter { feed.isRecent($0, now: now) }
                  let oldApps = feed.apps.filter { !feed.isRecent($0, now: now) }
                  // Sort new by date (newest first)
                  newApps.sort { (a, b) in
                      let da = (a.createdAt ?? a.updatedAt).flatMap { feed.parseDate($0) } ?? .distantPast
                      let db = (b.createdAt ?? b.updatedAt).flatMap { feed.parseDate($0) } ?? .distantPast
                      return da > db
                  }
                  // Old apps sorted alphabetically
                  let sortedOld = oldApps.sorted { $0.name.lowercased() < $1.name.lowercased() }
                  return newApps + sortedOld
              }

              private var filtered: [StoreAPIApp] {
                  let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return sortedApps }
                  return sortedApps.filter {
                      $0.name.lowercased().contains(q) || ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          ONEsTopBar()

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 14) {
                                  HStack(spacing: 8) {
                                      Image(systemName: "magnifyingglass")
                                          .foregroundColor(.storeSub)
                                      TextField("ابحث في التطبيقات...", text: $searchText)
                                          .font(.system(size: 14))
                                          .foregroundColor(.storeText)
                                      if !searchText.isEmpty {
                                          Button { searchText = "" } label: {
                                              Image(systemName: "xmark.circle.fill")
                                                  .foregroundColor(.storeSub)
                                          }
                                      }
                                  }
                                  .padding(.horizontal, 14)
                                  .frame(height: 46)
                                  .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                                  .overlay(RoundedRectangle(cornerRadius: 16).stroke(Color.storeDivider, lineWidth: 1))
                                  .padding(.horizontal, 18)

                                  if feed.apps.isEmpty && feed.isLoading {
                                      LoadingList()
                                  } else if filtered.isEmpty {
                                      EmptyState(message: searchText.isEmpty ? "لا توجد تطبيقات" : "لا توجد نتائج مطابقة")
                                  } else {
                                      LazyVStack(spacing: 10) {
                                          ForEach(filtered) { app in
                                              NavigationLink(value: app) {
                                                  AppListRow(app: app, isNew: feed.isRecent(app))
                                              }
                                              .buttonStyle(.plain)
                                          }
                                      }
                                      .padding(.horizontal, 18)
                                      .padding(.bottom, 24)
                                  }
                              }
                              .padding(.top, 4)
                          }
                          .refreshable { await feed.refresh() }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                      .navigationDestination(for: StoreAPIApp.self) { app in
                          AppDetailView(app: app, feed: feed)
                      }
                  }
              }
          }

