          struct FeaturedAppRow: View {
              let app: StoreAPIApp
              var body: some View {
                  HStack(alignment: .center, spacing: 12) {
                      CachedAsyncImage(urlString: app.icon ?? app.iconURL, size: 60)
                      VStack(alignment: .leading, spacing: 4) {
                          Text(app.name).font(.system(size: 15, weight: .semibold)).foregroundColor(.storeText).lineLimit(1)
                          if let dev = app.developerName {
                              Text(dev).font(.system(size: 12)).foregroundColor(.storeSub).lineLimit(1)
                          }
                          Text(app.cleanDescription).font(.system(size: 12)).foregroundColor(.storeSub).lineLimit(2)
                          HStack(spacing: 6) {
                              Text(app.cleanSize).font(.system(size: 11, weight: .semibold)).foregroundColor(.storePrimary)
