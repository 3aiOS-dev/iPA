              // MARK: - Real translation implementation
              private func handleTranslateTap() {
                  if translatedDescription != nil {
                      // Already translated — toggle back to original
                      withAnimation { translatedDescription = nil }
                      showTranslationToast("تم استعادة النص الأصلي")
                      return
                  }
                  let desc = app.cleanDescription
                  guard !desc.isEmpty else {
                      showTranslationToast("لا يوجد نص للترجمة")
                      return
                  }
                  performTranslation(of: desc)
              }

              private func performTranslation(of text: String) {
                  isTranslating = true
                  let target = isArabicDescription ? "en" : "ar"
                  translationSource = isArabicDescription ? "ترجمة إلى الإنجليزية" : "ترجمة إلى العربية"

                  // 1) Try Apple's built-in Translation framework first (iOS 17.4+),
                  //    which works fully on-device for supported language pairs.
                  if #available(iOS 17.4, *) {
                      let sourceLang = isArabicDescription ? "ar" : "en"
                      Task { @MainActor in
                          do {
                              let result = try await translateWithAppleFramework(text: text,
                                                                                source: sourceLang,
                                                                                target: target)
                              self.translatedDescription = result
                              self.isTranslating = false
                              self.showTranslationToast(self.translationSource)
                          } catch {
                              // Fall back to free MyMemory API
                              await self.fallbackTranslate(text: text, target: target)
                          }
                      }
                  } else {
                      // Older iOS: go straight to MyMemory API
                      Task { @MainActor in
                          await fallbackTranslate(text: text, target: target)
                      }
                  }
              }

              @available(iOS 17.4, *)
              private func translateWithAppleFramework(text: String, source: String, target: String) async throws -> String {
                  // Chunk text to avoid huge payloads (Apple's framework has limits)
                  let chunks = text.chunked(into: 480)
                  var translated: [String] = []
                  for chunk in chunks {
                      let session = TranslationSession(
                          installedSource: Locale.Language(identifier: source),
                          installedTarget: Locale.Language(identifier: target)
                      )
                      let response = try await session.translate(chunk)
                      translated.append(response.targetText)
                  }
                  return translated.joined(separator: " ")
              }

              @MainActor
              private func fallbackTranslate(text: String, target: String) async {
                  do {
                      let encoded = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? text
                      let langPair = "auto|\(target)"
                      let urlStr = "https://api.mymemory.translated.net/get?q=\(encoded)&langpair=\(langPair)&de=21s.app@pro"
                      guard let url = URL(string: urlStr) else {
                          isTranslating = false
                          showTranslationToast("فشل الترجمة")
                          return
                      }
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 12
                      let (data, _) = try await URLSession.shared.data(for: req)
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let resp = json["responseData"] as? [String: Any],
                         let translatedText = resp["translatedText"] as? String {
                          let cleaned = translatedText.removingPercentEncoding ?? translatedText
                          self.translatedDescription = cleaned
                          self.isTranslating = false
                          self.showTranslationToast(self.translationSource)
                      } else {
                          self.isTranslating = false
                          self.showTranslationToast("تعذّر الحصول على ترجمة")
                      }
                  } catch {
                      self.isTranslating = false
                      self.showTranslationToast("خطأ في الشبكة")
                  }
              }

              private func showTranslationToast(_ message: String) {
                  translationSource = message
                  showTranslateToast = true
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.6) {
                      showTranslateToast = false
                  }
              }
          }

          extension String {
              func chunked(into size: Int) -> [String] {
                  guard size > 0 else { return [self] }
                  var chunks: [String] = []
                  var idx = startIndex
                  while idx < endIndex {
                      let end = self.index(idx, offsetBy: size, limitedBy: endIndex) ?? endIndex
                      chunks.append(String(self[idx..<end]))
                      idx = end
                  }
                  return chunks
              }
          }

