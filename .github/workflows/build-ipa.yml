              private func rule(_ text: String, ok: Bool) -> some View {
                  HStack(spacing: 6) {
                      Image(systemName: ok ? "checkmark.circle.fill" : "circle")
                          .foregroundColor(ok ? .walletGreen : .storeSub)
                          .font(.system(size: 11, weight: .bold))
                      Text(text).font(.system(size: 12, weight: .medium)).foregroundColor(ok ? .storeText : .storeSub)
                  }
              }

              private func update() {
                  error = nil
                  guard let user = authManager.currentUser else { return }
                  if currentPassword != user.password {
                      error = "كلمة المرور الحالية غير صحيحة"
                      HapticManager.shared.error(); return
                  }
                  if newPassword.count < 6 {
                      error = "كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل"
                      HapticManager.shared.error(); return
                  }
                  if newPassword != confirmPassword {
                      error = "كلمتا المرور الجديدتان غير متطابقتين"
                      HapticManager.shared.error(); return
                  }

                  let key = AppConstants.userDefaultsKey
                  if let data = UserDefaults.standard.data(forKey: key),
                     var users = try? JSONDecoder().decode([AppUser].self, from: data),
                     let idx = users.firstIndex(where: { $0.id == user.id }) {
                      users[idx] = AppUser(
                          id: user.id,
                          phoneNumber: user.phoneNumber,
                          username: user.username,
                          password: newPassword,
                          createdAt: user.createdAt
                      )
                      if let encoded = try? JSONEncoder().encode(users) {
                          UserDefaults.standard.set(encoded, forKey: key)
                      }
                  }

                  HapticManager.shared.success()
                  showSavedToast = true
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                      showSavedToast = false
                      isPresented = false
                  }
              }
          }

