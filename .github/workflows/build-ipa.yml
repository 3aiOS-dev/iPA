                                          .multilineTextAlignment(.center)
                                      GradientButton(
                                          title: "استيراد ملف",
                                          icon: "plus",
                                          gradient: [.vipPurple, .blue],
                                          action: { showingFilePicker = true }
                                      ).frame(width: 180)
                                  }
                                  .padding()
                                  Spacer()
                              } else {
                                  ScrollView(showsIndicators: false) {
                                      LazyVStack(spacing: 12) {
                                          ForEach(fileManager.importedFiles) { file in
                                              FileCardView(
                                                  file: file,
                                                  onRename: { renameFile(file) },
                                                  onDelete: { confirmDelete(file) },
                                                  onShare: { shareFile(file) }
                                              )
                                              .padding(.horizontal, 16)
                                          }
                                      }
                                      .padding(.vertical, 12)
                                  }
                                  .refreshable {
                                      fileManager.loadFiles()
                                  }
                              }
                          }
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 8) {
                                  Text("21s")
                                      .font(.system(size: 20, weight: .bold))
                                      .foregroundColor(.vipPurple)
                              }
                          }
                      }
                  }
                  .fileImporter(
                      isPresented: $showingFilePicker,
                      allowedContentTypes: [
                          UTType(filenameExtension: "ipa") ?? .data,
                          UTType(filenameExtension: "p12") ?? .data,
                          UTType(filenameExtension: "mobileprovision") ?? .data
                      ],
                      allowsMultipleSelection: false
                  ) { result in
                      switch result {
                      case .success(let urls):
                          if let url = urls.first {
                              Task {
                                  _ = await fileManager.importFile(from: url)
                              }
                          }
                      case .failure(let error):
                          fileManager.errorMessage = "فشل اختيار الملف: \(error.localizedDescription)"
                      }
                  }
                  .alert("إعادة تسمية الملف", isPresented: $showingRenameAlert) {
                      TextField("الاسم الجديد", text: $newFileName)
                      Button("إلغاء", role: .cancel) { }
                      Button("حفظ") {
                          if let file = selectedFile {
                              Task {
                                  _ = await fileManager.renameFile(file, newName: newFileName)
                              }
                          }
                      }
                  } message: {
                      Text("أدخل الاسم الجديد للملف")
                  }
                  .alert("حذف الملف", isPresented: $showingDeleteConfirmation) {
                      Button("إلغاء", role: .cancel) { }
                      Button("حذف", role: .destructive) {
                          if let file = fileToDelete {
                              Task {
                                  _ = await fileManager.deleteFile(file)
                              }
                          }
                      }
                  } message: {
                      if let file = fileToDelete {
                          Text("هل أنت متأكد من حذف \"\(file.name)\"؟")
                      } else {
                          Text("هل أنت متأكد من حذف هذا الملف؟")
                      }
                  }
                  .onAppear {
                      fileManager.loadFiles()
                  }
              }

              private func renameFile(_ file: ImportedFile) {
                  selectedFile = file
                  newFileName = file.name
                  showingRenameAlert = true
              }

              private func confirmDelete(_ file: ImportedFile) {
                  fileToDelete = file
                  showingDeleteConfirmation = true
              }

              private func shareFile(_ file: ImportedFile) {
                  guard let url = fileManager.getFileURL(for: file) else { return }
                  let activityVC = UIActivityViewController(
                      activityItems: [url],
                      applicationActivities: nil
                  )
                  if let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                     let rootVC = scene.windows.first?.rootViewController {
                      rootVC.present(activityVC, animated: true)
                  }
              }
          }

          // MARK: - File Card View
          struct FileCardView: View {
              let file: ImportedFile
              let onRename: () -> Void
              let onDelete: () -> Void
              let onShare: () -> Void
              @Environment(\.colorScheme) var scheme

              var body: some View {
                  VStack(alignment: .trailing, spacing: 8) {
                      HStack(spacing: 14) {
                          // File Icon
                          ZStack {
                              RoundedRectangle(cornerRadius: 14)
                                  .fill(file.fileType.color.opacity(0.2))
                                  .frame(width: 50, height: 50)
                              Image(systemName: file.fileType.icon)
                                  .font(.system(size: 22, weight: .medium))
                                  .foregroundColor(file.fileType.color)
                          }

                          // File Info
                          VStack(alignment: .trailing, spacing: 4) {
                              HStack(spacing: 8) {
                                  Spacer()
                                  Text(file.name)
                                      .font(.system(size: 14, weight: .semibold))
                                      .lineLimit(1)
                                  Text(file.fileType.displayName)
                                      .font(.system(size: 9, weight: .bold))
                                      .foregroundColor(.white)
                                      .padding(.horizontal, 6).padding(.vertical, 2)
                                      .background(Capsule().fill(file.fileType.color))
                              }

                              HStack(spacing: 12) {
                                  Spacer()
                                  Text(file.formattedSize)
                                      .font(.system(size: 11)).foregroundColor(.gray)
                                  Text("•")
                                      .font(.system(size: 11)).foregroundColor(.gray)
                                  Text(file.formattedDate)
                                      .font(.system(size: 11)).foregroundColor(.gray)
                              }

                              // Metadata if available
                              if let metadata = file.metadata {
                                  HStack(spacing: 12) {
                                      Spacer()
                                      if let appName = metadata.appName {
                                          Text("📱 \(appName)")
                                              .font(.system(size: 10))
                                              .foregroundColor(.vipPurple)
                                      }
                                      if let version = metadata.version {
                                          Text("v\(version)")
                                              .font(.system(size: 10))
                                              .foregroundColor(.gray)
                                      }
                                      if let bundleID = metadata.bundleID {
                                          Text("🔑 \(bundleID)")
                                              .font(.system(size: 9))
                                              .foregroundColor(.gray.opacity(0.7))
                                      }
                                  }
                              }
                          }

                          Spacer()
                      }

                      // Action Buttons
                      HStack(spacing: 8) {
                          Button(action: onShare) {
                              Label("مشاركة", systemImage: "square.and.arrow.up")
                                  .font(.system(size: 11, weight: .medium))
                                  .foregroundColor(.blue)
                                  .padding(.horizontal, 10).padding(.vertical, 5)
                                  .background(Capsule().fill(Color.blue.opacity(0.1)))
                          }

                          Button(action: onRename) {
                              Label("إعادة تسمية", systemImage: "pencil")
                                  .font(.system(size: 11, weight: .medium))
                                  .foregroundColor(.orange)
                                  .padding(.horizontal, 10).padding(.vertical, 5)
                                  .background(Capsule().fill(Color.orange.opacity(0.1)))
                          }

                          Spacer()

                          Button(action: onDelete) {
                              Label("حذف", systemImage: "trash")
                                  .font(.system(size: 11, weight: .medium))
                                  .foregroundColor(.red)
                                  .padding(.horizontal, 10).padding(.vertical, 5)
                                  .background(Capsule().fill(Color.red.opacity(0.1)))
                          }
                      }
                  }
                  .padding(14)
                  .background(
                      RoundedRectangle(cornerRadius: 18)
                          .fill(scheme == .dark ? Color(white: 0.11) : Color.white)
                          .shadow(color: .black.opacity(0.05), radius: 8, x: 0, y: 3)
                  )
                  .overlay(
                      RoundedRectangle(cornerRadius: 18)
                          .stroke(file.fileType.color.opacity(0.15), lineWidth: 1)
                  )
              }
          }

          // MARK: - Loading View (Reused from ContentView)
          // Note: LoadingView is defined in ContentView.swift
          VIPEOF
          echo "FilesTabView.swift: $(wc -l < FilesTabView.swift) lines"

      - name: Generate Source - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UserNotifications

          // MARK: - App Entry Point
          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .onAppear {
                              requestNotifications()
                          }
                  }
              }

              func requestNotifications() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }
          }

          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  return true
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           willPresent notification: UNNotification,
                                           withCompletionHandler handler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  handler([.banner, .sound, .badge])
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           didReceive response: UNNotificationResponse,
                                           withCompletionHandler handler: @escaping () -> Void) {
                  handler()
              }
          }
          VIPEOF
          echo "VIP21StoreApp.swift: $(wc -l < VIP21StoreApp.swift) lines"

      - name: Build Application
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            AppsManager.swift \
            FileManagerService.swift \
            SharedComponents.swift \
            ContentView.swift \
            HomeTabView.swift \
            AppsTabView.swift \
            AppDetailView.swift \
            FilesTabView.swift \
            VIP21StoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework UserNotifications \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA Package
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-IPA-SwiftUI-v7
          path: artifacts/21s.ipa
