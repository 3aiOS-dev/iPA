      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift ESignCore.swift UIComponents.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -framework UniformTypeIdentifiers \
            -o ESignApp

          file ESignApp

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/ESignApp.app

          cp ESignApp build-output/Payload/ESignApp.app/ESignApp
          cp Resources/Info.plist build-output/Payload/ESignApp.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/ESignApp.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/ESignApp.app/

          ldid -S build-output/Payload/ESignApp.app/ESignApp

          cd build-output
          zip -r -q ../artifacts/ESignApp.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/ESignApp.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESignApp-IPA
          path: artifacts/ESignApp.ipa
          retention-days: 30
