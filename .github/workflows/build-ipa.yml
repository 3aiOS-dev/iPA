          const express = require('express');
          const config = require('../config');
          const logger = require('../utils/logger');
          const db = require('../db');
          const userService = require('./userService');
          const notificationService = require('./notificationService');
          
          /**
           * Express server that receives store webhooks
           * (order updates, payment events, etc.) and notifies the user via Telegram.
           *
           * Wire any external system to POST to /webhook/store
           *   Headers: X-Webhook-Secret: $STORE_WEBHOOK_SECRET
           *   Body: { event: 'order.paid' | 'order.shipped' | 'order.cancelled' | ...,
           *           telegram_id: 12345, order_ref: 'A-1001', amount: 9.99, ... }
           */
          function createWebhookServer(bot) {
            const app = express();
            app.use(express.json({ limit: '1mb' }));
          
            app.get('/healthz', (req, res) =>
              res.json({ ok: true, ts: Date.now() })
            );
          
            app.post('/webhook/store', async (req, res) => {
              const secret = req.get('X-Webhook-Secret');
              if (!config.store.webhookSecret || secret !== config.store.webhookSecret) {
                logger.warn('store webhook: invalid secret');
                return res.status(401).json({ ok: false, error: 'unauthorized' });
              }
          
              const { event, telegram_id, order_ref, amount, status, meta } = req.body || {};
              if (!event || !telegram_id) {
                return res.status(400).json({ ok: false, error: 'missing event or telegram_id' });
              }
          
              // Persist order if referenced
              if (order_ref) {
                try {
                  db.prepare(`
                    INSERT INTO store_orders (telegram_id, order_ref, amount, status, raw_payload)
                    VALUES (?, ?, ?, ?, ?)
                  `).run(telegram_id, order_ref, amount ?? null, status ?? event, JSON.stringify(req.body));
                } catch (e) {
                  // unique constraint — already exists, update instead
                  db.prepare(`
                    UPDATE store_orders SET status = ?, amount = ?, raw_payload = ?
                    WHERE order_ref = ?
                  `).run(status ?? event, amount ?? null, JSON.stringify(req.body), order_ref);
                }
              }
          
              // Notify user
              const messages = {
                'order.created': `🛒 تم استلام طلبك ${order_ref || ''} بمبلغ ${amount ?? '—'}.`,
                'order.paid': `✅ تم الدفع لطلبك ${order_ref || ''} (${amount ?? '—'}).`,
                'order.shipped': `🚚 طلبك ${order_ref || ''} في الطريق!`,
                'order.cancelled': `❌ تم إلغاء طلبك ${order_ref || ''}.`,
                'order.refunded': `💸 تم استرداد مبلغ ${amount ?? ''} للطلب ${order_ref || ''}.`,
              };
              const text = messages[event] || `🔔 تحديث على طلبك ${order_ref || ''}: ${event}`;
          
              const ok = await notificationService.sendDirect(bot, telegram_id, event, {
                text,
                options: meta || {},
              });
          
              userService.audit(null, `webhook.${event}`, telegram_id, { order_ref, amount, delivered: ok });
              return res.json({ ok: true, delivered: ok });
            });
          
            return app;
          }
          
          module.exports = { createWebhookServer };
          
