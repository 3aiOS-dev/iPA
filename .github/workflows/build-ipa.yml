                                            Image(systemName: "magnifyingglass")
                                                .foregroundColor(Color.storeSub)
                                            TextField("ابحث عن تطبيق أو لعبة", text: $searchText)
                                                .foregroundColor(Color.storeText)
                                            if !searchText.isEmpty {
                                                Button {
                                                    searchText = ""
                                                } label: {
                                                    Image(systemName: "xmark.circle.fill")
                                                        .foregroundColor(Color.storeSub)
                                                }
                                            }
                                        }
                                        .padding(.horizontal, 16)
                                        .frame(height: 50)
                                        .background(RoundedRectangle(cornerRadius: 18).fill(Color.storeCard))
                                        .overlay(RoundedRectangle(cornerRadius: 18).stroke(Color.storeDivider, lineWidth: 1))
                                        .padding(.horizontal, 28)

                                        Text("Modified Games")
                                            .font(.system(size: 25, weight: .heavy))
                                            .foregroundColor(Color.storeText)
                                            .padding(.horizontal, 28)

                                        LazyVStack(spacing: 10) {
