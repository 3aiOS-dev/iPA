                    import SwiftUI
                    import UIKit
                    import UserNotifications

                    @main
                    struct VIP21StoreApp: App {
                        @UIApplicationDelegateAdaptor(AppDelegate.self) var delegate
                        var body: some Scene {
                            WindowGroup {
                                ContentView()
                                    .preferredColorScheme(.none)
                                    .onOpenURL { url in
                                        handleOpenURL(url)
                                    }
                            }
                        }

                        private func handleOpenURL(_ url: URL) {
                            guard url.pathExtension.lowercased() == "ipa" else { return }
                            NotificationCenter.default.post(name: .init("OpenExternalIPA"), object: url)
                        }
                    }

                    // MARK: - AppDelegate (للإشعارات + الافتتاح الخارجي)
                    class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
                        func application(_ application: UIApplication,
                                         didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                            UNUserNotificationCenter.current().delegate = self
                            return true
                        }
                        func userNotificationCenter(_ center: UNUserNotificationCenter,
                                                    willPresent notification: UNNotification,
                                                    withCompletionHandler completionHandler: @escaping (UNNotificationPresentationOptions) -> Void) {
                            completionHandler([.banner, .sound])
                        }
                    }
          VIPEOF
          echo "VIP21StoreApp.swift: $(wc -l < Sources/VIP21Store/VIP21StoreApp.swift) lines"

      - name: Generate xcodegen Project Spec (project.yml)
        run: |
          cat > project.yml << 'PEOF'
          name: VIP21Store
          options:
            bundleIdPrefix: com.vip21
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true
          targets:
            VIP21Store:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources/VIP21Store
              resources:
                - path: Resources/Assets.xcassets
              info:
                path: Generated-Info.plist
                properties:
                  CFBundleDisplayName: "21s"
                  CFBundleName: "21s"
                  CFBundleShortVersionString: "7.0"
                  CFBundleVersion: "7"
                  LSRequiresIPhoneOS: true
                  UIRequiredDeviceCapabilities: [arm64]
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
                  UILaunchScreen: {}
                  NSPhotoLibraryUsageDescription: "لاستيراد أيقونات التطبيقات"
                  NSDocumentsFolderUsageDescription: "لحفظ ملفات IPA المستوردة"
                  UISupportsDocumentBrowser: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UIFileSharingEnabled: true
                  CFBundleDocumentTypes:
                    - CFBundleTypeName: "IPA File"
                      LSHandlerRank: "Alternate"
                      LSItemContentTypes: ["com.apple.application"]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.vip21.store
                  PRODUCT_NAME: VIP21Store
                  MARKETING_VERSION: "7.0"
                  CURRENT_PROJECT_VERSION: "7"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  ENABLE_BITCODE: NO
          PEOF
          echo "✅ project.yml generated"
          cat project.yml

      - name: Run xcodegen
        run: |
          xcodegen generate
          echo "📦 Generated project tree:"
          find VIP21Store.xcodeproj -maxdepth 1
          ls -la

      - name: Build with xcodebuild (Unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project VIP21Store.xcodeproj \
            -scheme VIP21Store \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -150

          echo "🔍 Locating built .app ..."
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Build failed: no .app produced"
            find build -maxdepth 4
            exit 1
          fi
          echo "✅ Found app bundle: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "📦 App bundle contents:"
          find "$APP_PATH" -maxdepth 2

          test -x "$APP_PATH/VIP21Store" && echo "✅ Binary executable: OK" || (echo "❌ Binary missing"; exit 1)
          test -f "$APP_PATH/Info.plist" && echo "✅ Info.plist: OK" || (echo "❌ Info.plist missing"; exit 1)

      - name: Strip Signature (Clean Unsigned Build for AltStore/Sideloadly)
        run: |
          # التوقيع الوهمي (ldid) يتعارض مع إعادة التوقيع من AltStore/Sideloadly
          # ويكسر الملف مع SDK حديث (chained fixups). نسلّم .app نظيف بدون توقيع
          # ليقوم AltStore/Sideloadly/Xcode بتوقيعه بالكامل من الصفر بشهادتك الحقيقية.
          codesign --remove-signature "$APP_PATH/VIP21Store" 2>/dev/null || true
          codesign --remove-signature "$APP_PATH" 2>/dev/null || true

          echo "🔍 Signature status (should be unsigned):"
          codesign -dv "$APP_PATH/VIP21Store" 2>&1 || echo "✅ Confirmed unsigned"

      - name: Create IPA Package
        run: |
          IPA_OUT="/tmp/VIP21Store.ipa"
          rm -f "$IPA_OUT"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          echo "📦 Payload contents before zipping:"
          find Payload -maxdepth 2

          # ✅ يجب ضغط مجلد Payload نفسه من المجلد الحالي، وليس الدخول داخله
          zip -r "$IPA_OUT" Payload -x "*.DS_Store"

          echo "🔍 Verifying IPA structure:"
          unzip -l "$IPA_OUT" | head -20

          test -f "$IPA_OUT" && echo "✅ IPA created: $IPA_OUT ($(du -h "$IPA_OUT" | cut -f1))" || (echo "❌ IPA missing"; exit 1)
          echo "IPA_OUT=$IPA_OUT" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VIP21Store-IPA
          path: /tmp/VIP21Store.ipa
          if-no-files-found: error
