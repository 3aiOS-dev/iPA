          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          // MARK: - Quick Questions
          private let storeQuickQuestions: [String] = [
              "ما هو VIP21 Store؟",
              "كيف أحمّل تطبيقاً؟",
              "ما هي التطبيقات المتوفرة؟",
              "كيف أحدّث التطبيقات؟",
              "هل المتجر مجاني؟",
          ]

          // MARK: - Local Knowledge Base
          private let storeKnowledge: [(keys: [String], answer: String)] = [
              (["vip21", "المتجر", "ما هو", "تعريف", "شرح", "about"],
               "🏪 VIP21 Store هو متجر تطبيقات iOS يتيح لك:\n• 📥 تحميل أحدث التطبيقات\n• 🔍 تصفح التطبيقات حسب الفئة\n• 📱 عرض تفاصيل التطبيقات\n\n🔒 يعمل بدون جيلبريك — آمن ومجاني."),

              (["حمّل", "تحميل", "تنزيل", "download", "جلب"],
               "📥 لتحميل تطبيق من المتجر:\n1. اضغط تبويب «التطبيقات» 🏪\n2. ابحث عن التطبيق الذي تريده\n3. اضغط على بطاقة التطبيق\n4. اضغط «تحميل IPA» ▼\n\nسيبدأ التحميل مباشرةً عبر متصفح النظام."),

              (["تحديث", "تحديثات", "update", "new"],
               "🔄 لتحميل أحدث التطبيقات:\n• التطبيقات الجديدة تظهر تلقائياً في الصفحة الرئيسية\n• يمكنك تحديث القائمة بسحب الشاشة لأسفل\n• المتجر يقوم بتحديث القائمة عند فتح التطبيق"),

              (["مجاني", "free", "سعر", "paid", "مدفوع"],
               "💰 جميع التطبيقات في المتجر مجانية!\nلا توجد أي رسوم أو اشتراكات.\n\n💡 بعض التطبيقات قد تحتوي على مشتريات داخلية (IAP) — هذه شأن التطبيق نفسه."),

              (["تواصل", "دعم", "support", "مشكلة", "مساعدة"],
               "📬 للدعم والتواصل:\n• تيليغرام: @ClickStoreipaios\n\n🛠️ قبل التواصل جرّب:\n• إعادة تشغيل التطبيق\n• تحديث قائمة التطبيقات"),
          ]

          class StoreAIEngine: ObservableObject {
              @Published var messages: [ChatMessage] = []
              @Published var isTyping = false

              init() {
                  appendBot("أهلاً بك في **مساعد \(AppConstants.storeName)** 👋\n\nأستطيع إرشادك في:\n• 📥 تحميل التطبيقات\n• 🔍 البحث عن تطبيقات\n• 📱 تفاصيل التطبيقات\n\nاختر سؤالاً سريعاً، أو اكتب استفسارك بحرّية.")
              }

              func send(userText: String) {
                  guard !userText.trimmingCharacters(in: .whitespaces).isEmpty else { return }
                  messages.append(ChatMessage(role: .user, content: userText))
                  isTyping = true

                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.55) { [weak self] in
                      guard let self else { return }
                      self.isTyping = false
                      self.appendBot(self.localAnswer(for: userText) ?? self.fallback(for: userText))
                  }
              }

              func clearChat() {
                  messages.removeAll()
                  appendBot("تم مسح المحادثة ✨\n\nكيف أقدر أساعدك الآن؟")
              }

              private func localAnswer(for text: String) -> String? {
                  let q = text.lowercased()
                      .replacingOccurrences(of: "؟", with: "")
                      .replacingOccurrences(of: "?",  with: "")
                      .trimmingCharacters(in: .whitespaces)
                  var best: (score: Int, answer: String)? = nil
                  for item in storeKnowledge {
                      var score = 0
                      for key in item.keys {
                          let k = key.lowercased()
                          if q == k { score += 4 }
                          else if q.contains(k) { score += 2 }
                          else if k.contains(q) { score += 1 }
                      }
                      if score > 0 && (best == nil || score > best!.score) {
                          best = (score, item.answer)
                      }
                  }
                  return best?.answer
              }

              private func fallback(for text: String) -> String {
                  "🤔 لم أجد إجابة مباشرة لاستفسارك.\n\nجرّب:\n• اختيار سؤال من الأسئلة الشائعة بالأعلى\n• إعادة صياغة الجملة بكلمات أبسط\n\n📬 للدعم المباشر: تيليجرام @ClickStoreipaios"
              }

              private func appendBot(_ text: String) {
                  messages.append(ChatMessage(role: .bot, content: text))
              }
          }

          struct ChatMessage: Identifiable {
              let id      = UUID()
              let role    : MsgRole
              var content : String
              let ts      : Date = Date()
              enum MsgRole { case user, bot, typing }
              var isUser: Bool { role == .user }
          }

