                  guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { return false }
                  if let msg = json["msg"] as? String ?? json["error_description"] as? String {
                      DispatchQueue.main.async { self.lastError = msg }
                  }
                  guard let token = json["access_token"] as? String else { return false }
                  let user = json["user"] as? [String: Any]
                  let uid = (user?["id"] as? String) ?? ""
                  DispatchQueue.main.async {
                      self.accessToken = token
                      self.remoteUserID = uid
                      self.isSignedIn = true
                      UserDefaults.standard.set(uid, forKey: self.kUserID)
