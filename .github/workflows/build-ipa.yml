                                      .foregroundColor(.storeSub)
                              )
                      }
                  }
                  .frame(width: size, height: size)
                  .clipShape(RoundedRectangle(cornerRadius: cornerRadius))
              }
          }

          // MARK: - Feed ViewModel
          @MainActor
          final class StoreFeed: ObservableObject {
              @Published var apps: [StoreAPIApp] = []
              @Published var isLoading: Bool = false
              @Published var lastError: String?
              @Published var lastUpdated: String?

              private let cacheURL: URL = {
                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  return caches.appendingPathComponent("ones-feed.json")
              }()

              private let feedURL = "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app/api/public/store/apps"

              init() { loadCachedThenRefresh() }

              private func loadCachedThenRefresh() {
                  if let data = try? Data(contentsOf: cacheURL),
                     let parsed = try? JSONDecoder().decode(StoreAPIResponse.self, from: data) {
                      self.apps = parsed.apps
                      self.lastUpdated = parsed.lastUpdated
                  }
                  Task { await refresh() }
              }

              func refresh() async {
                  isLoading = true
                  lastError = nil
                  guard let url = URL(string: feedURL) else {
                      isLoading = false
                      return
                  }
                  do {
                      var req = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 25)
                      req.setValue("ones-iOS/1.0", forHTTPHeaderField: "User-Agent")
                      let (data, _) = try await URLSession.shared.data(for: req)
                      let parsed = try JSONDecoder().decode(StoreAPIResponse.self, from: data)
                      self.apps = parsed.apps
                      self.lastUpdated = parsed.lastUpdated
                      if let data = try? JSONEncoder().encode(parsed) {
                          try? data.write(to: cacheURL)
                      }
                  } catch {
                      self.lastError = error.localizedDescription
                  }
                  isLoading = false
              }

              // Helper: apps added/updated within 24h
              func isRecent(_ app: StoreAPIApp, now: Date = Date()) -> Bool {
                  let dateStr = app.createdAt ?? app.updatedAt
                  guard let d = dateStr.flatMap({ parseDate($0) }) else { return false }
                  return now.timeIntervalSince(d) <= 24 * 60 * 60
              }

              private func parseDate(_ raw: String) -> Date? {
                  let iso = ISO8601DateFormatter()
                  iso.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                  if let d = iso.date(from: raw) { return d }
                  if let d = ISO8601DateFormatter().date(from: raw) { return d }
                  let f = DateFormatter()
                  f.locale = Locale(identifier: "en_US_POSIX")
                  f.timeZone = TimeZone(secondsFromGMT: 0)
                  for fmt in ["yyyy-MM-dd'T'HH:mm:ssZ", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"] {
                      f.dateFormat = fmt
                      if let d = f.date(from: raw) {
                          return fmt == "yyyy-MM-dd" ? d.addingTimeInterval(86399) : d
                      }
                  }
                  return nil
              }
          }

          // MARK: - Shared UI Components
          struct ONEsTopBar: View {
              var body: some View {
                  HStack {
                      Spacer()
                      HStack(spacing: 8) {
                          if let img = UIImage.bundled("login_logo.png") {
