                      case .version: return "رقم الإصدار"
                      case .about: return "عن التطبيق"
                      }
                  }

                  var icon: String {
                      switch self {
                      case .darkMode: return "moon.fill"
                      case .notifications: return "bell.fill"
                      case .privacy: return "hand.raised.fill"
                      case .rateApp: return "star.fill"
                      case .shareApp: return "square.and.arrow.up.fill"
                      case .clearFavorites: return "trash.fill"
                      case .version: return "number.circle.fill"
                      case .about: return "info.circle.fill"
                      }
                  }
              }

              private var tableView: UITableView!
              private let notificationsKey = "app21s.notifications"

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "الإعدادات"
                  view.backgroundColor = AppTheme.background
                  navigationController?.navigationBar.prefersLargeTitles = true
                  setupTableView()
              }

              override func viewWillAppear(_ animated: Bool) {
                  super.viewWillAppear(animated)
                  navigationController?.setNavigationBarHidden(false, animated: animated)
                  navigationController?.navigationBar.barStyle = AppTheme.barStyle
                  navigationController?.navigationBar.tintColor = AppTheme.accent
              }

              private func setupTableView() {
                  tableView = UITableView(frame: .zero, style: .insetGrouped)
                  tableView.backgroundColor = .clear
                  tableView.dataSource = self
                  tableView.delegate = self
                  tableView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(tableView)
                  NSLayoutConstraint.activate([
                      tableView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      tableView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      tableView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      tableView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                  ])
              }

              func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                  Row.allCases.count
              }

              func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                  let row = Row.allCases[indexPath.row]
                  let cell = UITableViewCell(style: .value1, reuseIdentifier: nil)
                  cell.backgroundColor = AppTheme.surface
                  cell.textLabel?.textColor = AppTheme.primaryText
                  cell.textLabel?.text = row.title
                  cell.imageView?.image = UIImage(systemName: row.icon)
                  cell.imageView?.tintColor = AppTheme.accent
                  cell.selectionStyle = .default

                  switch row {
                  case .darkMode:
                      let toggle = UISwitch()
                      toggle.isOn = AppTheme.isDark
                      toggle.onTintColor = AppTheme.accent
                      toggle.addTarget(self, action: #selector(darkModeChanged(_:)), for: .valueChanged)
                      cell.accessoryView = toggle
                      cell.selectionStyle = .none
                  case .notifications:
                      let toggle = UISwitch()
                      toggle.isOn = UserDefaults.standard.bool(forKey: notificationsKey)
                      toggle.onTintColor = AppTheme.accent
                      toggle.addTarget(self, action: #selector(notificationsChanged(_:)), for: .valueChanged)
                      cell.accessoryView = toggle
                      cell.selectionStyle = .none
                  case .version:
                      cell.detailTextLabel?.text = "1.0.0"
                      cell.detailTextLabel?.textColor = AppTheme.secondaryText
                      cell.selectionStyle = .none
                  case .clearFavorites:
                      cell.textLabel?.textColor = AppTheme.danger
                      cell.accessoryType = .none
                  default:
                      cell.accessoryType = .disclosureIndicator
                  }
                  return cell
              }

              @objc private func darkModeChanged(_ sender: UISwitch) {
                  AppTheme.setDark(sender.isOn)
              }

              @objc private func notificationsChanged(_ sender: UISwitch) {
                  UserDefaults.standard.set(sender.isOn, forKey: notificationsKey)
              }

              func tableView(_ tableView: UITableView, didSelectRowAt indexPath: IndexPath) {
                  tableView.deselectRow(at: indexPath, animated: true)
                  switch Row.allCases[indexPath.row] {
                  case .privacy:
                      navigationController?.pushViewController(PrivacyPolicyViewController(), animated: true)
                  case .rateApp:
                      let alert = UIAlertController(
                          title: "قيّم 21s",
                          message: "شكرًا لدعمك! هذا زر شكلي ضمن نسخة العرض التجريبي.",
                          preferredStyle: .alert
                      )
                      alert.addAction(UIAlertAction(title: "حسنًا", style: .default))
                      present(alert, animated: true)
                  case .shareApp:
                      let activity = UIActivityViewController(activityItems: ["جرّب تطبيق 21s"], applicationActivities: nil)
                      if let popover = activity.popoverPresentationController {
                          popover.sourceView = tableView
                          popover.sourceRect = tableView.rectForRow(at: indexPath)
                      }
                      present(activity, animated: true)
                  case .clearFavorites:
                      let confirm = UIAlertController(
                          title: "مسح المفضلة",
                          message: "هل تريد إزالة جميع التطبيقات من قائمة المفضلة؟",
                          preferredStyle: .alert
                      )
                      confirm.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                      confirm.addAction(UIAlertAction(title: "مسح", style: .destructive) { _ in
                          FavoritesManager.shared.clearAll()
                      })
                      present(confirm, animated: true)
                  case .version:
                      break
                  case .about:
                      let alert = UIAlertController(
                          title: "21s",
                          message: "تطبيق عرض تجريبي (Demo) بواجهة متجر تطبيقات. جميع البيانات والتطبيقات المعروضة وهمية لأغراض العرض فقط.",
                          preferredStyle: .alert
                      )
                      alert.addAction(UIAlertAction(title: "حسنًا", style: .default))
                      present(alert, animated: true)
                  case .darkMode, .notifications:
                      break
                  }
              }
          }
