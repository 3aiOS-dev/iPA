          import SwiftUI
          import UIKit
          import Foundation
          import UniformTypeIdentifiers

          // MARK: - Files Tab (Real Importer)
          struct FilesTabView: View {
              @ObservedObject var fileImporter: FileImporterManager
              @State private var showImporter = false
              @State private var selectedFile: ImportedFile?
              @State private var showDeleteConfirm: ImportedFile?
              @State private var filter: ImportedFile.FileType? = nil
              @State private var searchText = ""
              @Environment(\.colorScheme) var scheme

              var filteredFiles: [ImportedFile] {
                  var list = fileImporter.files
                  if let f = filter { list = list.filter { $0.fileType == f } }
                  if !searchText.isEmpty {
                      list = list.filter {
                          $0.originalName.localizedCaseInsensitiveContains(searchText) ||
                          ($0.appName ?? "").localizedCaseInsensitiveContains(searchText) ||
                          ($0.bundleID ?? "").localizedCaseInsensitiveContains(searchText)
                      }
                  }
                  return list
              }

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 16) {
                              // Stats Card
                              FilesStatsCard(importer: fileImporter)
                                  .padding(.horizontal)

                              // Type Filter
                              FilesTypeFilter(selected: $filter)
                                  .padding(.horizontal)

                              // Search
                              HStack(spacing: 10) {
                                  Image(systemName: "magnifyingglass").foregroundColor(.gray)
                                  TextField("ابحث في الملفات...", text: $searchText)
                                      .multilineTextAlignment(.trailing)
                                  if !searchText.isEmpty {
                                      Button(action: { searchText = "" }) {
                                          Image(systemName: "xmark.circle.fill").foregroundColor(.gray)
                                      }
                                  }
                              }
                              .padding(12)
                              .background(RoundedRectangle(cornerRadius: 12)
                                  .fill(scheme == .dark ? Color.cardDark : Color.white)
                                  .shadow(color: .black.opacity(0.05), radius: 6))
                              .padding(.horizontal)

                              // File list
                              if filteredFiles.isEmpty {
                                  EmptyFilesView(showImporter: $showImporter)
                                      .padding(.top, 40)
                              } else {
                                  LazyVStack(spacing: 10) {
                                      ForEach(filteredFiles) { file in
                                          ImportedFileRow(
                                              file: file,
                                              importer: fileImporter,
                                              onTap: { selectedFile = file },
                                              onDelete: { showDeleteConfirm = file }
                                          )
                                          .padding(.horizontal)
                                      }
                                  }
                              }
                          }
                          .padding(.bottom, 30)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 8) {
                                  Text("21s").font(.system(size: 20, weight: .bold))
                                      .foregroundColor(.vipPurple)
                              }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button(action: { showImporter = true }) {
                                  Image(systemName: "plus.circle.fill")
                                      .font(.system(size: 22))
                                      .foregroundColor(.vipPurple)
                              }
                          }
                      }
                  }
                  .fileImporter(
                      isPresented: $showImporter,
                      allowedContentTypes: allowedTypes,
                      allowsMultipleSelection: true,
                      onCompletion: handleImport
                  )
                  .alert("حذف الملف؟", isPresented: Binding(
                      get: { showDeleteConfirm != nil },
                      set: { if !$0 { showDeleteConfirm = nil } }
                  )) {
                      Button("حذف", role: .destructive) {
                          if let f = showDeleteConfirm { fileImporter.delete(f) }
                          showDeleteConfirm = nil
                      }
                      Button("إلغاء", role: .cancel) { showDeleteConfirm = nil }
                  } message: {
                      Text("سيتم حذف الملف نهائياً من الجهاز")
                  }
                  .sheet(item: $selectedFile) { file in
                      ImportedFileDetailView(file: file, importer: fileImporter)
                  }
              }

              private var allowedTypes: [UTType] {
                  var types: [UTType] = [.data, .archive, .item]
                  if let ipa = UTType("com.apple.itunes.ipa") { types.append(ipa) }
                  if let mp = UTType("com.apple.mobileprovision") { types.append(mp) }
                  if let p12 = UTType("com.rsa.pkcs-12") { types.append(p12) }
                  return types
              }

              private func handleImport(_ results: [URL]) {
                  Task {
                      var importedCount = 0
                      for url in results {
                          let ok = await fileImporter.importFile(from: url)
                          if ok { importedCount += 1 }
                      }
                      if importedCount > 0 {
                          HapticManager.shared.notification(.success)
                      }
                  }
              }
          }

