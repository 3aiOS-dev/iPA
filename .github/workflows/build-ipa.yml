name: Build WebWrapper IPA - Xcode Fullscreen Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "No Xcode installation was found."
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen and zip
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          command -v xcodegen
          command -v zip

      - name: Create project directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppScopeBuild
          mkdir -p AppScopeBuild/AppScope/Base.lproj
          mkdir -p AppScopeBuild/AppScope/Assets.xcassets/AppIcon.appiconset

      - name: Generate LaunchScreen Storyboard (Resolves iOS Letterboxing)
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/Base.lproj/LaunchScreen.storyboard <<'STORYBOARD'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21507" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                          <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                              <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                              <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                              <color key="backgroundColor" systemColor="systemBackgroundColor"/>
                              <viewLayoutGuide key="safeArea" id="6Tk-OE-BBY"/>
                          </view>
                      </viewController>
                  </scene>
              </scenes>
              <resources>
                  <systemColor name="systemBackgroundColor">
                      <color white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                  </systemColor>
              </resources>
          </document>
          STORYBOARD

      - name: Generate AppIcon Asset Catalog (Contents.json)
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "idiom": "iphone",
                "scale": "2x",
                "size": "60x60",
                "filename": "AppIcon60x60@2x.png"
              },
              {
                "idiom": "iphone",
                "scale": "3x",
                "size": "60x60",
                "filename": "AppIcon60x60@3x.png"
              },
              {
                "idiom": "ipad",
                "scale": "1x",
                "size": "76x76",
                "filename": "AppIcon76x76~ipad.png"
              },
              {
                "idiom": "ipad",
                "scale": "2x",
                "size": "76x76",
                "filename": "AppIcon76x76@2x~ipad.png"
              },
              {
                "idiom": "ios-marketing",
                "scale": "1x",
                "size": "1024x1024",
                "filename": "AppIcon1024x1024.png"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

      - name: Generate Placeholder AppIcons via Swift Script
        shell: bash
        run: |
          swift - <<'SWIFT'
          import AppKit

          func createPNG(size: CGSize, path: String) {
              let image = NSImage(size: size)
              image.lockFocus()
              NSColor.systemBlue.setFill()
              NSRect(origin: .zero, size: size).fill()
              image.unlockFocus()
              if let tiff = image.tiffRepresentation,
                 let bitmap = NSBitmapImageRep(data: tiff),
                 let png = bitmap.representation(using: .png, properties: [:]) {
                  try? png.write(to: URL(fileURLWithPath: path))
              }
          }

          let dir = "AppScopeBuild/AppScope/Assets.xcassets/AppIcon.appiconset/"
          createPNG(size: CGSize(width: 120, height: 120), path: dir + "AppIcon60x60@2x.png")
          createPNG(size: CGSize(width: 180, height: 180), path: dir + "AppIcon60x60@3x.png")
          createPNG(size: CGSize(width: 76, height: 76), path: dir + "AppIcon76x76~ipad.png")
          createPNG(size: CGSize(width: 152, height: 152), path: dir + "AppIcon76x76@2x~ipad.png")
          createPNG(size: CGSize(width: 1024, height: 1024), path: dir + "AppIcon1024x1024.png")
          SWIFT

      - name: Generate Info.plist (Complete Xcode Standard)
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>AppScope</string>

              <key>CFBundleIdentifier</key>
              <string>com.appscope.webwrapper</string>

              <key>CFBundleName</key>
              <string>AppScope</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>UIStatusBarHidden</key>
              <true/>

              <key>UIViewControllerBasedStatusBarAppearance</key>
              <false/>

              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>

              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
                  <key>UISceneConfigurations</key>
                  <dict>
                      <key>UIWindowSceneSessionRoleApplication</key>
                      <array>
                          <dict>
                              <key>UISceneConfigurationName</key>
                              <string>Default Configuration</string>
                              <key>UISceneDelegateClassName</key>
                              <string>$(PRODUCT_MODULE_NAME).SceneDelegate</string>
                          </dict>
                      </array>
                  </dict>
              </dict>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Generate Swift Source - AppDelegate & SceneDelegate (Pure Native Window)
        shell: bash
        run: |
          cat > AppScopeBuild/AppScope/AppDelegate.swift <<'SWIFT'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  return true
              }

              func application(_ application: UIApplication, configurationForConnecting connectingSceneSession: UISceneSession, options: UIScene.ConnectionOptions) -> UISceneConfiguration {
                  return UISceneConfiguration(name: "Default Configuration", sessionRole: connectingSceneSession.role)
              }
          }
          SWIFT

          cat > AppScopeBuild/AppScope/SceneDelegate.swift <<'SWIFT'
          import UIKit
          import WebKit

          class SceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?

              func scene(_ scene: UIScene, willConnectTo session: UISceneSession, options connectionOptions: UIScene.ConnectionOptions) {
                  guard let windowScene = (scene as? UIWindowScene) else { return }

                  let window = UIWindow(windowScene: windowScene)
                  let webVC = WebViewController()
                  window.rootViewController = webVC
                  self.window = window
                  window.makeKeyAndVisible()
              }
          }

          class WebViewController: UIViewController, WKNavigationDelegate {
              var webView: WKWebView!

              override func viewDidLoad() {
                  super.viewDidLoad()

                  view.backgroundColor = .systemBackground

                  let jsScript = """
                  var meta = document.createElement('meta');
                  meta.name = 'viewport';
                  meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
                  document.getElementsByTagName('head')[0].appendChild(meta);

                  var style = document.createElement('style');
                  style.innerHTML = 'html, body { width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; }';
                  document.head.appendChild(style);
                  """
                  let userScript = WKUserScript(source: jsScript, injectionTime: .atDocumentEnd, forMainFrameOnly: true)

                  let config = WKWebViewConfiguration()
                  config.userContentController.addUserScript(userScript)
                  config.allowsInlineMediaPlayback = true

                  let preferences = WKWebpagePreferences()
                  preferences.allowsContentJavaScript = true
                  config.defaultWebpagePreferences = preferences

                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.bounces = false
                  webView.scrollView.showsVerticalScrollIndicator = false
                  webView.scrollView.showsHorizontalScrollIndicator = false
                  webView.isOpaque = false
                  webView.backgroundColor = .clear

                  view.addSubview(webView)

                  // 🔴 استبدل هذا الرابط برابط موقعك الأصلي
                  if let url = URL(string: "https://example.com") {
                      let request = URLRequest(url: url, cachePolicy: .useProtocolCachePolicy)
                      webView.load(request)
                  }

                  UIApplication.shared.isIdleTimerDisabled = true
              }

              override var prefersStatusBarHidden: Bool {
                  return true
              }
          }
          SWIFT

      - name: Generate XcodeGen project.yml
        shell: bash
        run: |
          cat > AppScopeBuild/project.yml <<'YAML'
          name: AppScope

          options:
            minimumXcodeGenVersion: "2.40.0"
            deploymentTarget:
              iOS: "15.0"
            createIntermediateGroups: true
            groupSortPosition: top

          settings:
            base:
              SWIFT_VERSION: "6.0"
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"
              DEVELOPMENT_TEAM: ""
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""
              PRODUCT_BUNDLE_IDENTIFIER: "com.appscope.webwrapper"
              MARKETING_VERSION: "1.0"
              CURRENT_PROJECT_VERSION: "1"
              TARGETED_DEVICE_FAMILY: "1,2"
              ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

          targets:
            AppScope:
              type: application
              platform: iOS
              sources:
                - path: AppScope
              info:
                path: AppScope/Info.plist
              settings:
                base:
                  PRODUCT_NAME: "AppScope"
                  INFOPLIST_FILE: "AppScope/Info.plist"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
          YAML

      - name: Build Xcode Project via XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild
          xcodegen generate
          test -f AppScope.xcodeproj/project.pbxproj

      - name: Validate Swift Source Code
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild
          swiftc \
            -parse \
            AppScope/AppDelegate.swift \
            AppScope/SceneDelegate.swift

      - name: Build Unsigned Native Archive
        shell: bash
        run: |
          set -euo pipefail
          cd AppScopeBuild

          xcodebuild \
            -project AppScope.xcodeproj \
            -scheme AppScope \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AppScope.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/AppScope.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/AppScope.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle was not found!"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/AppScope.app"

          cd "$RUNNER_TEMP"
          rm -f AppScope-unsigned.ipa
          /usr/bin/zip -qry AppScope-unsigned.ipa Payload

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp AppScope-unsigned.ipa "$GITHUB_WORKSPACE/artifacts/AppScope-unsigned.ipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppScope-unsigned-ipa
          path: artifacts/AppScope-unsigned.ipa
          if-no-files-found: error
