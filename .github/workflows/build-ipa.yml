          import SwiftUI
          import UIKit

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  UINotificationFeedbackGenerator().notificationOccurred(type)
              }
              func selection() { UISelectionFeedbackGenerator().selectionChanged() }
              func success() { notification(.success) }
              func error() { notification(.error) }
          }

          struct XcodeCardModifier: ViewModifier {
              var radius: CGFloat = 12
              func body(content: Content) -> some View {
                  content
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(Color.xcodeEditor)
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(Color.xcodeDivider, lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
              }
          }

          extension View {
              func xcodeCard(radius: CGFloat = 12) -> some View {
                  modifier(XcodeCardModifier(radius: radius))
              }
          }

          final class ScreenCaptureService: ObservableObject {
              static let shared = ScreenCaptureService()

              @Published var lastScreenshot: UIImage? = nil
              @Published var showThanksOverlay: Bool = false

              private var observer: NSObjectProtocol?

              private init() {}

              func start() {
                  guard observer == nil else { return }
                  observer = NotificationCenter.default.addObserver(
                      forName: UIApplication.userDidTakeScreenshotNotification,
                      object: nil,
                      queue: .main
                  ) { [weak self] _ in
                      guard let self = self else { return }
                      self.lastScreenshot = self.loadLatestScreenshotFromPhotos()
                      self.showThanksOverlay = true
                      HapticManager.shared.success()
                  }
              }

              func stop() {
                  if let obs = observer {
                      NotificationCenter.default.removeObserver(obs)
                      observer = nil
                  }
              }

              func dismissOverlay() {
                  showThanksOverlay = false
              }

              private func loadLatestScreenshotFromPhotos() -> UIImage? {
                  return nil
              }
          }
          VIPEOF

