                                  .font(.system(size: 11)).foregroundColor(.gray)
                          }
                          Spacer()
                          Menu {
                              ForEach(AppSortMode.allCases, id: \.self) { mode in
                                  Button(action: { sortMode = mode }) {
                                      HStack {
                                          Text(mode.rawValue)
                                          if sortMode == mode { Image(systemName: "checkmark") }
                                      }
                                  }
                              }
                          } label: {
                              HStack(spacing: 4) {
                                  Image(systemName: "arrow.up.arrow.down")
                                      .font(.system(size: 12, weight: .semibold))
                                  Text(sortMode.rawValue)
                                      .font(.system(size: 12, weight: .semibold))
                              }
                              .foregroundColor(.vipPurple)
                              .padding(.horizontal, 10).padding(.vertical, 6)
                              .background(Capsule().fill(Color.vipPurple.opacity(0.1)))
                          }
                      }.padding(.horizontal)
                      HStack(spacing: 10) {
                          Image(systemName: "magnifyingglass")
                              .foregroundColor(isSearchFocused ? .vipPurple : .gray)
                              .font(.system(size: 15))
                          TextField("ابحث عن تطبيق...", text: $searchText)
                              .font(.system(size: 15)).multilineTextAlignment(.trailing)
                              .onTapGesture { isSearchFocused = true }
                              .onSubmit { appsManager.addRecentSearch(searchText); isSearchFocused = false }
                          if !searchText.isEmpty {
                              Button(action: { searchText = ""; isSearchFocused = false }) {
                                  Image(systemName: "xmark.circle.fill").foregroundColor(.gray)
                              }
                          }
                      }
                      .padding(14)
                      .background(RoundedRectangle(cornerRadius: 14)
                          .fill(scheme == .dark ? Color.cardDark : Color.white)
                          .shadow(color: isSearchFocused ? .vipPurple.opacity(0.2) : .black.opacity(0.05), radius: 8))
                      .overlay(RoundedRectangle(cornerRadius: 14)
                          .stroke(isSearchFocused ? Color.vipPurple.opacity(0.5) : Color.clear, lineWidth: 1.5))
                      .animation(.easeInOut(duration: 0.2), value: isSearchFocused)
                      .padding(.horizontal)
                      if isSearchFocused && searchText.isEmpty && !appsManager.recentSearches.isEmpty {
                          VStack(alignment: .trailing, spacing: 6) {
                              Text("بحث سابق").font(.system(size: 12)).foregroundColor(.gray).padding(.horizontal)
                              ScrollView(.horizontal, showsIndicators: false) {
                                  HStack(spacing: 8) {
                                      ForEach(appsManager.recentSearches.prefix(6), id: \.self) { term in
                                          Button(action: { searchText = term; isSearchFocused = false }) {
                                              HStack(spacing: 4) {
                                                  Image(systemName: "clock").font(.system(size: 11))
                                                  Text(term).font(.system(size: 12))
                                              }
                                              .foregroundColor(.primary).padding(.horizontal, 10).padding(.vertical, 6)
                                              .background(Capsule().fill(scheme == .dark ? Color.cardDark : Color.white))
                                          }
                                      }
                                  }.padding(.horizontal)
                              }
                          }.transition(.opacity)
                      }
                      ScrollView(.horizontal, showsIndicators: false) {
                          HStack(spacing: 8) {
                              ForEach(categories, id: \.self) { cat in
                                  Button(action: { withAnimation(.spring()) { selectedCategory = cat } }) {
                                      Text(cat)
                                          .font(.system(size: 12, weight: selectedCategory == cat ? .bold : .regular))
                                          .foregroundColor(selectedCategory == cat ? .white : .primary)
                                          .padding(.horizontal, 14).padding(.vertical, 7)
                                          .background(
                                              Capsule().fill(selectedCategory == cat
                                                  ? LinearGradient(colors: [.vipPurple, .blue], startPoint: .leading, endPoint: .trailing)
                                                  : LinearGradient(colors: [scheme == .dark ? Color(white: 0.15) : Color(white: 0.93), scheme == .dark ? Color(white: 0.15) : Color(white: 0.93)], startPoint: .leading, endPoint: .trailing)
                                              )
                                          )
                                  }
                              }
                          }.padding(.horizontal)
                      }
                      HStack {
                          Spacer()
                          Text("\(filteredApps.count) نتيجة")
                              .font(.system(size: 11)).foregroundColor(.gray).padding(.horizontal)
                      }
                      if filteredApps.isEmpty {
                          VStack(spacing: 16) {
                              Image(systemName: "magnifyingglass")
                                  .font(.system(size: 50)).foregroundColor(.gray.opacity(0.4))
                              Text("لا توجد نتائج لـ \"\(searchText)\"")
                                  .font(.system(size: 16))
                              Text("جرب بحثاً آخر").font(.system(size: 13)).foregroundColor(.gray)
                          }.frame(maxWidth: .infinity).padding(.top, 60)
                      } else {
                          LazyVStack(spacing: 10) {
