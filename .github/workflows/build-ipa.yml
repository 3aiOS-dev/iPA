      # =========================================================
      # SOURCE CODE - Constants.swift (GREEN THEME)
      # =========================================================
      - name: Generate code - Constants.swift
        run: |
          cat > Constants.swift << 'VIPEOF'
          import SwiftUI

          struct AppConstants {
              static let appVersion = "1.0"
              static let storeName  = "21s"
              static let userDefaultsKey = "21sProUserData"
              static let hasSeenOnboardingKey = "hasSeenOnboarding21s"
              static let maxFeedCacheBytes: Int = 256 * 1024 * 1024
              static let maxIconCacheBytes: Int = 512 * 1024 * 1024
              static let feedPageSize: Int = 200
          }

          // Dark mode removed: the app always uses the light green palette.
          // The second tuple is ignored and kept only for source compatibility.
          func dyn(_ light: (CGFloat, CGFloat, CGFloat), _ dark: (CGFloat, CGFloat, CGFloat)) -> Color {
              Color(UIColor(red: light.0, green: light.1, blue: light.2, alpha: 1))
          }

          // ===== GREEN THEME - one palette shared by every tab / screen =====
          extension Color {
              static let xcodeBackground = dyn((0.97, 0.99, 0.97), (0.05, 0.10, 0.06))
              static let xcodeEditor     = dyn((1.00, 1.00, 1.00), (0.10, 0.16, 0.12))
              static let xcodeBlue       = dyn((0.16, 0.62, 0.36), (0.20, 0.72, 0.42))
              static let xcodeAccent     = dyn((0.16, 0.62, 0.36), (0.20, 0.72, 0.42))
              static let xcodeGreen      = Color(red: 0.16, green: 0.78, blue: 0.42)
              static let xcodeOrange     = Color(red: 1.00, green: 0.68, blue: 0.35)
              static let xcodeRed        = Color(red: 0.93, green: 0.30, blue: 0.30)
              static let xcodeSecondary  = dyn((0.36, 0.50, 0.40), (0.68, 0.78, 0.70))
              static let xcodeDivider    = dyn((0.85, 0.93, 0.88), (0.18, 0.28, 0.22))
              static let storeAccent     = dyn((0.16, 0.62, 0.36), (0.20, 0.72, 0.42))

              // Store surfaces (soft green paper, light mode only)
              static let storeBg        = dyn((0.97, 0.99, 0.97), (0.05, 0.10, 0.06))
              static let storeCard      = dyn((1.00, 1.00, 1.00), (0.10, 0.16, 0.12))
              static let storeCardAlt   = dyn((0.92, 0.97, 0.94), (0.14, 0.20, 0.16))
              static let storeText      = dyn((0.08, 0.20, 0.12), (0.95, 1.00, 0.97))
              static let storeSub       = dyn((0.36, 0.50, 0.40), (0.68, 0.78, 0.70))
              static let storeDivider   = dyn((0.85, 0.93, 0.88), (0.18, 0.28, 0.22))
          }

          extension UIImage {
              static func bundled(_ filename: String) -> UIImage? {
                  guard let path = Bundle.main.path(forResource: filename, ofType: nil) else { return nil }
                  return UIImage(contentsOfFile: path)
              }
          }
          VIPEOF

      # =========================================================
