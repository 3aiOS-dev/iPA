                                  )
                                  .animation(.easeInOut(duration: 0.2), value: isSearchFocused)
                                  .padding(.horizontal)

                                  if isSearchFocused && searchText.isEmpty && !appsManager.recentSearches.isEmpty {
                                      VStack(alignment: .trailing, spacing: 6) {
                                          Text("Recent Searches")
                                              .font(.system(size: 11))
