      - name: Generate Source - AppsTabView.swift
        run: |
          cat > AppsTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - Apps Tab
          struct AppsTabView: View {
              @ObservedObject var appsManager: AppsManager
              @State private var selectedApp: AppItem?
              @State private var showDetail = false
              @State private var searchText = ""
              @State private var isSearchFocused = false
              @State private var selectedCategory: String = "الكل"
              @State private var sortMode: AppSortMode = .newest
              @Environment(\.colorScheme) var scheme

              enum AppSortMode: String, CaseIterable {
                  case newest = "الأحدث"; case popular = "الأشهر"; case name = "الاسم"; case size = "الحجم"
              }

              var categories: [String] {
                  var cats = ["الكل"]
                  let found = Set(appsManager.apps.compactMap { $0.category }).sorted()
                  cats += found.isEmpty ? ["ترفيه", "أدوات", "ألعاب", "اجتماعي", "تعليم"] : Array(found)
                  return cats
              }

              var filteredApps: [AppItem] {
                  var base = appsManager.apps
                  if selectedCategory != "الكل" {
                      base = base.filter { $0.category == selectedCategory }
                  }
                  if !searchText.isEmpty {
                      base = base.filter {
                          $0.name.localizedCaseInsensitiveContains(searchText) ||
                          $0.localizedDescription.localizedCaseInsensitiveContains(searchText) ||
                          $0.developerName.localizedCaseInsensitiveContains(searchText)
                      }
                  }
                  switch sortMode {
                  case .newest:  return base
                  case .popular: return base.sorted { (Int($0.down) ?? 0) > (Int($1.down) ?? 0) }
                  case .name:    return base.sorted { $0.name < $1.name }
                  case .size:    return base.sorted { $0.size > $1.size }
                  }
              }

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 14) {
                              if appsManager.isLoading && appsManager.apps.isEmpty {
                                  LoadingView()
                              } else if let err = appsManager.errorMessage, appsManager.apps.isEmpty {
                                  ErrorView(message: err) { appsManager.retryFetch() }
                              } else {
                                  HStack(spacing: 12) {
                                      ZStack {
                                          RoundedRectangle(cornerRadius: 14)
                                              .fill(LinearGradient(colors: [.vipPurple, .blue],
                                                                   startPoint: .topLeading, endPoint: .bottomTrailing))
                                              .frame(width: 46, height: 46)
                                              .shadow(color: .vipPurple.opacity(0.4), radius: 6, y: 3)
                                          Image(systemName: "square.grid.2x2.fill").foregroundColor(.white)
                                      }
                                      VStack(alignment: .trailing, spacing: 2) {
                                          Text("كل التطبيقات").font(.system(size: 18, weight: .heavy))
                                          Text("\(appsManager.apps.count) تطبيق متوفر")
                                              .font(.system(size: 11)).foregroundColor(.gray)
                                      }
                                      Spacer()
                                      Menu {
                                          ForEach(AppSortMode.allCases, id: \.self) { mode in
                                              Button(action: { sortMode = mode }) {
                                                  HStack {
                                                      Text(mode.rawValue)
                                                      if sortMode == mode { Image(systemName: "checkmark") }
                                                  }
                                              }
                                          }
                                      } label: {
                                          HStack(spacing: 4) {
                                              Image(systemName: "arrow.up.arrow.down")
                                                  .font(.system(size: 12, weight: .semibold))
                                              Text(sortMode.rawValue)
                                                  .font(.system(size: 12, weight: .semibold))
                                          }
                                          .foregroundColor(.vipPurple)
                                          .padding(.horizontal, 10).padding(.vertical, 6)
                                          .background(Capsule().fill(Color.vipPurple.opacity(0.1)))
                                      }
                                  }.padding(.horizontal)

                                  HStack(spacing: 10) {
                                      Image(systemName: "magnifyingglass")
                                          .foregroundColor(isSearchFocused ? .vipPurple : .gray)
                                          .font(.system(size: 15))
                                      TextField("ابحث عن تطبيق...", text: $searchText)
                                          .font(.system(size: 15)).multilineTextAlignment(.trailing)
                                          .onTapGesture { isSearchFocused = true }
                                          .onSubmit { appsManager.addRecentSearch(searchText); isSearchFocused = false }
                                      if !searchText.isEmpty {
                                          Button(action: { searchText = ""; isSearchFocused = false }) {
                                              Image(systemName: "xmark.circle.fill").foregroundColor(.gray)
                                          }
                                      }
                                  }
                                  .padding(14)
                                  .background(RoundedRectangle(cornerRadius: 14)
                                      .fill(scheme == .dark ? Color.cardDark : Color.white)
                                      .shadow(color: isSearchFocused ? .vipPurple.opacity(0.2) : .black.opacity(0.05), radius: 8))
                                  .overlay(RoundedRectangle(cornerRadius: 14)
                                      .stroke(isSearchFocused ? Color.vipPurple.opacity(0.5) : Color.clear, lineWidth: 1.5))
                                  .animation(.easeInOut(duration: 0.2), value: isSearchFocused)
                                  .padding(.horizontal)

                                  if isSearchFocused && searchText.isEmpty && !appsManager.recentSearches.isEmpty {
                                      VStack(alignment: .trailing, spacing: 6) {
                                          Text("بحث سابق").font(.system(size: 12)).foregroundColor(.gray).padding(.horizontal)
                                          ScrollView(.horizontal, showsIndicators: false) {
                                              HStack(spacing: 8) {
                                                  ForEach(appsManager.recentSearches.prefix(6), id: \.self) { term in
                                                      Button(action: { searchText = term; isSearchFocused = false }) {
                                                          HStack(spacing: 4) {
                                                              Image(systemName: "clock").font(.system(size: 11))
                                                              Text(term).font(.system(size: 12))
                                                          }
                                                          .foregroundColor(.primary).padding(.horizontal, 10).padding(.vertical, 6)
                                                          .background(Capsule().fill(scheme == .dark ? Color.cardDark : Color.white))
                                                      }
                                                  }
                                              }.padding(.horizontal)
                                          }
                                      }.transition(.opacity)
                                  }

                                  ScrollView(.horizontal, showsIndicators: false) {
                                      HStack(spacing: 8) {
                                          ForEach(categories, id: \.self) { cat in
                                              Button(action: { withAnimation(.spring()) { selectedCategory = cat } }) {
                                                  Text(cat)
                                                      .font(.system(size: 12, weight: selectedCategory == cat ? .bold : .regular))
                                                      .foregroundColor(selectedCategory == cat ? .white : .primary)
                                                      .padding(.horizontal, 14).padding(.vertical, 7)
                                                      .background(
                                                          Capsule().fill(selectedCategory == cat
                                                              ? LinearGradient(colors: [.vipPurple, .blue], startPoint: .leading, endPoint: .trailing)
                                                              : LinearGradient(colors: [scheme == .dark ? Color(white: 0.15) : Color(white: 0.93), scheme == .dark ? Color(white: 0.15) : Color(white: 0.93)], startPoint: .leading, endPoint: .trailing)
                                                          )
                                                      )
                                              }
                                          }
                                      }.padding(.horizontal)
                                  }

                                  HStack {
                                      Spacer()
                                      Text("\(filteredApps.count) نتيجة")
                                          .font(.system(size: 11)).foregroundColor(.gray).padding(.horizontal)
                                  }

                                  if filteredApps.isEmpty {
                                      VStack(spacing: 16) {
                                          Image(systemName: "magnifyingglass")
                                              .font(.system(size: 50)).foregroundColor(.gray.opacity(0.4))
                                          Text("لا توجد نتائج لـ \"\(searchText)\"")
                                              .font(.system(size: 16))
                                          Text("جرب بحثاً آخر").font(.system(size: 13)).foregroundColor(.gray)
                                      }.frame(maxWidth: .infinity).padding(.top, 60)
                                  } else {
                                      LazyVStack(spacing: 10) {
                                          ForEach(filteredApps, id: \.id) { app in
                                              EnhancedAppCard(app: app)
                                                  .onTapGesture { selectedApp = app; showDetail = true }
                                                  .padding(.horizontal)
                                          }
                                      }
                                  }
                              }
                          }
                          .padding(.bottom, 20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 8) {
                                  Text("21s")
                                      .font(.system(size: 20, weight: .bold))
                                      .foregroundColor(.vipPurple)
                              }
                          }
                      }
                  }
                  .sheet(isPresented: $showDetail) {
                      if let app = selectedApp { AppDetailView(app: app) }
                  }
              }
          }

