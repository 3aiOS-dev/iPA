                          statusLabel.text = "✅"
                          statusLabel.textColor = UIColor(red: 0, green: 200/255, blue: 0, alpha: 1)
                      }
                  } else {
                      statusLabel.text = "❌"
                      statusLabel.textColor = UIColor(red: 255/255, green: 50/255, blue: 50/255, alpha: 1)
                  }
              }
          }
          CVEOF

      - name: Generate Source - Tools View Controller
        run: |
          cd ${{ github.workspace }}
          cat > ToolsViewController.swift << 'TVEOF'
          import UIKit

          class ToolsViewController: UIViewController {
              private let bgColor = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
              private let cardColor = UIColor(red: 28/255, green: 28/255, blue: 44/255, alpha: 1)
              private let accentColor = UIColor(red: 30/255, green: 144/255, blue: 255/255, alpha: 1)
              
              private let tools = [
                  ("📦 فك ضغط IPA", "استخراج محتويات ملف IPA"),
                  ("🔐 استرداد التوقيع", "استرداد التوقيع من ملف IPA"),
                  ("📝 تعديل Info.plist", "تعديل معلومات التطبيق"),
                  ("🔄 إعادة توقيع", "إعادة توقيع التطبيق بشهادة جديدة"),
                  ("📱 تثبيت على الجهاز", "تثبيت التطبيق على جهاز متصل"),
                  ("🗑️ تنظيف الملفات", "حذف الملفات المؤقتة"),
              ]
              
              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "الأدوات"
                  view.backgroundColor = bgColor
                  setupUI()
              }
              
              private func setupUI() {
                  let stackView = UIStackView()
                  stackView.axis = .vertical
                  stackView.spacing = 12
                  stackView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(stackView)
                  
                  NSLayoutConstraint.activate([
                      stackView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor, constant: 20),
                      stackView.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      stackView.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20)
                  ])
                  
                  for (title, subtitle) in tools {
                      let button = createToolButton(title: title, subtitle: subtitle)
                      stackView.addArrangedSubview(button)
                  }
              }
              
              private func createToolButton(title: String, subtitle: String) -> UIButton {
                  let button = UIButton(type: .system)
                  button.backgroundColor = cardColor
                  button.layer.cornerRadius = 16
                  button.translatesAutoresizingMaskIntoConstraints = false
                  button.heightAnchor.constraint(equalToConstant: 72).isActive = true
                  
                  let titleLabel = UILabel()
                  titleLabel.text = title
                  titleLabel.textColor = .white
                  titleLabel.font = .systemFont(ofSize: 16, weight: .semibold)
                  titleLabel.translatesAutoresizingMaskIntoConstraints = false
                  
                  let subtitleLabel = UILabel()
                  subtitleLabel.text = subtitle
                  subtitleLabel.textColor = UIColor.white.withAlphaComponent(0.4)
                  subtitleLabel.font = .systemFont(ofSize: 12, weight: .regular)
                  subtitleLabel.translatesAutoresizingMaskIntoConstraints = false
                  
                  let stack = UIStackView(arrangedSubviews: [titleLabel, subtitleLabel])
                  stack.axis = .vertical
                  stack.spacing = 2
                  stack.translatesAutoresizingMaskIntoConstraints = false
                  
                  button.addSubview(stack)
                  NSLayoutConstraint.activate([
                      stack.leadingAnchor.constraint(equalTo: button.leadingAnchor, constant: 20),
                      stack.centerYAnchor.constraint(equalTo: button.centerYAnchor)
                  ])
                  
                  let arrow = UIImageView(image: UIImage(systemName: "chevron.right"))
                  arrow.tintColor = UIColor.white.withAlphaComponent(0.2)
                  arrow.translatesAutoresizingMaskIntoConstraints = false
                  button.addSubview(arrow)
                  
                  NSLayoutConstraint.activate([
                      arrow.trailingAnchor.constraint(equalTo: button.trailingAnchor, constant: -20),
                      arrow.centerYAnchor.constraint(equalTo: button.centerYAnchor),
                      arrow.widthAnchor.constraint(equalToConstant: 14),
                      arrow.heightAnchor.constraint(equalToConstant: 14)
                  ])
                  
                  button.addTarget(self, action: #selector(toolTapped(_:)), for: .touchUpInside)
                  return button
              }
              
              @objc private func toolTapped(_ sender: UIButton) {
                  // Find which tool was tapped
                  let title = sender.subviews.first { view in
                      if let stack = view as? UIStackView,
                         let label = stack.arrangedSubviews.first as? UILabel {
                          return label.text?.contains("فك") == true ||
                                 label.text?.contains("استرداد") == true ||
                                 label.text?.contains("تعديل") == true ||
                                 label.text?.contains("إعادة") == true ||
                                 label.text?.contains("تثبيت") == true ||
                                 label.text?.contains("تنظيف") == true
                      }
                      return false
                  }
                  
                  // Show action sheet
                  let alert = UIAlertController(title: "⚠️ تنبيه", message: "هذه الأداة قيد التطوير", preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                  present(alert, animated: true)
              }
          }
          TVEOF

      - name: Generate Source - Status View Controller
        run: |
          cd ${{ github.workspace }}
          cat > StatusViewController.swift << 'SVEOF'
          import UIKit

          class StatusViewController: UIViewController {
              private let bgColor = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
              private let cardColor = UIColor(red: 28/255, green: 28/255, blue: 44/255, alpha: 1)
              private let accentColor = UIColor(red: 30/255, green: 144/255, blue: 255/255, alpha: 1)
              
              private let infoStack = UIStackView()
              
              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "الحالة"
                  view.backgroundColor = bgColor
                  setupUI()
                  updateStatus()
              }
              
              private func setupUI() {
                  let scrollView = UIScrollView()
                  scrollView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(scrollView)
                  
                  NSLayoutConstraint.activate([
                      scrollView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      scrollView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      scrollView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      scrollView.bottomAnchor.constraint(equalTo: view.bottomAnchor)
                  ])
                  
                  let contentView = UIView()
                  contentView.translatesAutoresizingMaskIntoConstraints = false
                  scrollView.addSubview(contentView)
                  
                  NSLayoutConstraint.activate([
                      contentView.topAnchor.constraint(equalTo: scrollView.topAnchor),
                      contentView.leadingAnchor.constraint(equalTo: scrollView.leadingAnchor),
                      contentView.trailingAnchor.constraint(equalTo: scrollView.trailingAnchor),
                      contentView.bottomAnchor.constraint(equalTo: scrollView.bottomAnchor),
                      contentView.widthAnchor.constraint(equalTo: scrollView.widthAnchor)
                  ])
                  
                  infoStack.axis = .vertical
                  infoStack.spacing = 12
                  infoStack.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(infoStack)
                  
                  NSLayoutConstraint.activate([
                      infoStack.topAnchor.constraint(equalTo: contentView.topAnchor, constant: 20),
                      infoStack.leadingAnchor.constraint(equalTo: contentView.leadingAnchor, constant: 20),
                      infoStack.trailingAnchor.constraint(equalTo: contentView.trailingAnchor, constant: -20),
                      infoStack.bottomAnchor.constraint(equalTo: contentView.bottomAnchor, constant: -20)
                  ])
                  
                  addInfoCard(title: "📱 الجهاز", value: UIDevice.current.model)
                  addInfoCard(title: "📲 النظام", value: "iOS \(UIDevice.current.systemVersion)")
                  addInfoCard(title: "🔐 التطبيقات", value: "\(IPAManager.shared.getApps().count)")
                  addInfoCard(title: "🔑 الشهادات", value: "\(CertificateManager.shared.getCertificates().count)")
                  addInfoCard(title: "✅ الشهادات الصالحة", value: "\(CertificateManager.shared.getValidCertificates().count)")
                  
                  let refreshBtn = UIButton(type: .system)
                  refreshBtn.setTitle("🔄 تحديث", for: .normal)
                  refreshBtn.backgroundColor = accentColor
                  refreshBtn.setTitleColor(.white, for: .normal)
                  refreshBtn.layer.cornerRadius = 12
                  refreshBtn.titleLabel?.font = .systemFont(ofSize: 16, weight: .semibold)
                  refreshBtn.translatesAutoresizingMaskIntoConstraints = false
                  refreshBtn.heightAnchor.constraint(equalToConstant: 50).isActive = true
                  refreshBtn.addTarget(self, action: #selector(refreshStatus), for: .touchUpInside)
                  infoStack.addArrangedSubview(refreshBtn)
              }
              
              private func addInfoCard(title: String, value: String) {
                  let card = UIView()
                  card.backgroundColor = cardColor
                  card.layer.cornerRadius = 14
                  card.translatesAutoresizingMaskIntoConstraints = false
                  card.heightAnchor.constraint(equalToConstant: 64).isActive = true
                  
                  let titleLabel = UILabel()
                  titleLabel.text = title
                  titleLabel.textColor = UIColor.white.withAlphaComponent(0.5)
                  titleLabel.font = .systemFont(ofSize: 14, weight: .regular)
                  titleLabel.translatesAutoresizingMaskIntoConstraints = false
                  card.addSubview(titleLabel)
                  
                  let valueLabel = UILabel()
                  valueLabel.text = value
                  valueLabel.textColor = .white
                  valueLabel.font = .systemFont(ofSize: 18, weight: .semibold)
                  valueLabel.translatesAutoresizingMaskIntoConstraints = false
                  card.addSubview(valueLabel)
                  
                  NSLayoutConstraint.activate([
                      titleLabel.topAnchor.constraint(equalTo: card.topAnchor, constant: 12),
                      titleLabel.leadingAnchor.constraint(equalTo: card.leadingAnchor, constant: 16),
                      titleLabel.trailingAnchor.constraint(equalTo: card.trailingAnchor, constant: -16),
                      
                      valueLabel.topAnchor.constraint(equalTo: titleLabel.bottomAnchor, constant: 4),
                      valueLabel.leadingAnchor.constraint(equalTo: titleLabel.leadingAnchor),
                      valueLabel.trailingAnchor.constraint(equalTo: titleLabel.trailingAnchor)
                  ])
                  
                  infoStack.addArrangedSubview(card)
              }
              
              @objc private func refreshStatus() {
                  updateStatus()
                  showToast("✅ تم التحديث")
              }
              
              private func updateStatus() {
                  while let view = infoStack.arrangedSubviews.last, view is UIButton == false {
                      view.removeFromSuperview()
                  }
                  
                  let totalApps = IPAManager.shared.getApps().count
                  let totalCerts = CertificateManager.shared.getCertificates().count
                  let validCerts = CertificateManager.shared.getValidCertificates().count
                  
                  addInfoCard(title: "📱 الجهاز", value: UIDevice.current.model)
                  addInfoCard(title: "📲 النظام", value: "iOS \(UIDevice.current.systemVersion)")
                  addInfoCard(title: "🔐 التطبيقات", value: "\(totalApps)")
                  addInfoCard(title: "🔑 الشهادات", value: "\(totalCerts)")
                  addInfoCard(title: "✅ الشهادات الصالحة", value: "\(validCerts)")
                  
                  let refreshBtn = UIButton(type: .system)
                  refreshBtn.setTitle("🔄 تحديث", for: .normal)
                  refreshBtn.backgroundColor = accentColor
                  refreshBtn.setTitleColor(.white, for: .normal)
                  refreshBtn.layer.cornerRadius = 12
                  refreshBtn.titleLabel?.font = .systemFont(ofSize: 16, weight: .semibold)
                  refreshBtn.translatesAutoresizingMaskIntoConstraints = false
                  refreshBtn.heightAnchor.constraint(equalToConstant: 50).isActive = true
                  refreshBtn.addTarget(self, action: #selector(refreshStatus), for: .touchUpInside)
                  infoStack.addArrangedSubview(refreshBtn)
              }
              
              private func showToast(_ message: String) {
                  let toast = UILabel()
                  toast.text = message
                  toast.textColor = .white
                  toast.backgroundColor = cardColor
                  toast.font = .systemFont(ofSize: 14, weight: .medium)
                  toast.textAlignment = .center
                  toast.layer.cornerRadius = 12
                  toast.layer.masksToBounds = true
                  toast.alpha = 0
                  
                  let size = toast.sizeThatFits(CGSize(width: view.bounds.width - 48, height: .greatestFiniteMagnitude))
                  toast.frame = CGRect(x: 24, y: view.bounds.height - 140, width: view.bounds.width - 48, height: size.height + 24)
                  
                  view.addSubview(toast)
                  UIView.animate(withDuration: 0.3) { toast.alpha = 1 }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 2) {
                      UIView.animate(withDuration: 0.3) { toast.alpha = 0 }
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.3) { toast.removeFromSuperview() }
                  }
              }
          }
          SVEOF

