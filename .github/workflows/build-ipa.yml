      - name: Generate Source - SigningTabView.swift
        run: |
          mkdir -p Sources/VIP21Store
          cat > Sources/VIP21Store/SigningTabView.swift << 'VIPEOF'
                    import SwiftUI
                    import UIKit
                    import UniformTypeIdentifiers

                    // MARK: - Signing Tab (إدارة شهادات + توقيع IPAs)
                    struct SigningTabView: View {
                        @ObservedObject var downloadManager: IPADownloadManager
                        @ObservedObject var certificateManager: CertificateManager
                        @State private var showP12Picker = false
                        @State private var showProvPicker = false
                        @State private var pendingP12: PendingCert?
                        @State private var p12Password = ""
                        @State private var displayName = ""
                        @State private var showPasswordAlert = false
                        @State private var signingFile: IPAFile?
                        @State private var signingProgress: Double = 0
                        @State private var signingMessage = ""
                        @State private var isSigning = false
                        @State private var signError: String?

                        struct PendingCert { let p12Data: Data; let p12Name: String }

                        var body: some View {
                            ScrollView(showsIndicators: false) {
                                VStack(spacing: 16) {
                                    certificatesSection
                                    ipaFilesSection
                                    if isSigning { signingOverlay }
                                    if let err = signError { errorBanner(err) }
                                    Spacer(minLength: 100)
                                }.padding(.horizontal, 16).padding(.top, 8)
                            }
                            .fileImporter(isPresented: $showP12Picker, allowedContentTypes: [.data, .item], allowsMultipleSelection: false) { result in
                                handleP12(result)
                            }
                            .fileImporter(isPresented: $showProvPicker, allowedContentTypes: [.data, .item], allowsMultipleSelection: false) { result in
                                handleProvision(result)
                            }
                            .alert("كلمة مرور P12", isPresented: $showPasswordAlert) {
                                SecureField("كلمة المرور", text: $p12Password)
                                TextField("اسم العرض (اختياري)", text: $displayName)
                                Button("متابعة") { continueCertImport() }
                                Button("إلغاء", role: .cancel) { pendingP12 = nil }
                            } message: {
                                Text("أدخل كلمة مرور ملف P12")
                            }
                            .sheet(item: $signingFile) { file in
                                SigningPickerSheet(
                                    file: file,
                                    certificates: certificateManager.certificates,
                                    onCancel: { signingFile = nil },
                                    onSign: { cert in
                                        signingFile = nil
                                        performSign(file: file, cert: cert)
                                    }
                                )
                            }
                        }

                        // MARK: - Certificates Section
                        private var certificatesSection: some View {
                            VStack(alignment: .leading, spacing: 8) {
                                HStack {
                                    Text("📜 الشهادات").font(.system(size: 16, weight: .bold))
                                    Spacer()
                                    Button {
                                        HapticManager.impact(.light)
                                        showP12Picker = true
                                    } label: {
                                        Label("إضافة", systemImage: "plus")
                                            .font(.system(size: 12, weight: .bold))
                                            .padding(.horizontal, 10).padding(.vertical, 6)
                                            .background(Capsule().fill(LinearGradient(colors: [.vipPurple, .blue], startPoint: .leading, endPoint: .trailing)))
                                            .foregroundColor(.white)
                                    }
                                }
                                if certificateManager.certificates.isEmpty {
                                    Text("لا توجد شهادات بعد. أضف P12 و mobileprovision للبدء.")
                                        .font(.system(size: 12)).foregroundColor(.gray)
                                        .padding(.vertical, 12)
                                        .frame(maxWidth: .infinity, alignment: .center)
                                        .background(RoundedRectangle(cornerRadius: 14).fill(Color.glassWhite))
                                } else {
                                    ForEach(certificateManager.certificates, id: \.id) { cert in
                                        CertificateCard(cert: cert, onDelete: {
                                            certificateManager.delete(cert)
                                        })
                                    }
                                }
                            }
                        }

                        // MARK: - IPA Files Section
                        private var ipaFilesSection: some View {
                            VStack(alignment: .leading, spacing: 8) {
                                Text("📦 ملفات IPA للتوقيع").font(.system(size: 16, weight: .bold))
                                if downloadManager.ipaFiles.isEmpty {
                                    Text("لا توجد ملفات في المكتبة. استورد ملفاً من تبويب 'ملفاتي'.")
                                        .font(.system(size: 12)).foregroundColor(.gray)
                                        .padding(.vertical, 12)
                                        .frame(maxWidth: .infinity, alignment: .center)
                                        .background(RoundedRectangle(cornerRadius: 14).fill(Color.glassWhite))
                                } else {
                                    ForEach(downloadManager.ipaFiles, id: \.id) { file in
                                        SignFileRow(file: file,
                                                    canSign: !certificateManager.certificates.isEmpty && !file.isSigned,
                                                    onTap: { signingFile = file })
                                    }
                                }
                            }
                        }

                        private var signingOverlay: some View {
                            VStack(spacing: 8) {
                                HStack {
                                    ProgressView().tint(.white)
                                    Text(signingMessage).font(.system(size: 12, weight: .semibold)).foregroundColor(.white)
                                }
                                ProgressView(value: signingProgress).tint(.vipGold)
                            }
                            .padding(14)
                            .background(RoundedRectangle(cornerRadius: 14).fill(Color.vipDark.opacity(0.85)))
                            .foregroundColor(.white)
                        }

                        private func errorBanner(_ msg: String) -> some View {
                            HStack {
                                Image(systemName: "exclamationmark.triangle.fill").foregroundColor(.red)
                                Text(msg).font(.system(size: 11)).foregroundColor(.red).lineLimit(2)
                                Spacer()
                                Button { signError = nil } label: { Image(systemName: "xmark.circle.fill").foregroundColor(.gray) }
                            }.padding(10).background(RoundedRectangle(cornerRadius: 12).fill(Color.red.opacity(0.1)))
                        }

                        // MARK: - P12 Import
                        private func handleP12(_ result: Result<[URL], Error>) {
                            guard case .success(let urls) = result, let url = urls.first else { return }
                            let accessed = url.startAccessingSecurityScopedResource()
                            defer { if accessed { url.stopAccessingSecurityScopedResource() } }
                            guard let data = try? Data(contentsOf: url) else {
                                signError = "تعذر قراءة ملف P12"
                                return
                            }
                            pendingP12 = PendingCert(p12Data: data, p12Name: url.lastPathComponent)
                            p12Password = ""
                            displayName = url.deletingPathExtension().lastPathComponent
                            // ✅ الإصلاح: لازم ننتظر حتى ينتهي إغلاق منتقي الملف الأول بالكامل
                            // قبل فتح الثاني، وإلا SwiftUI يتجاهل طلب العرض الثاني بصمت
                            // (مشكلة معروفة عند تسلسل sheets/fileImporter بدون تأخير).
                            DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                                showProvPicker = true
                            }
                        }

                        private func handleProvision(_ result: Result<[URL], Error>) {
                            guard case .success(let urls) = result, let url = urls.first else { return }
                            let accessed = url.startAccessingSecurityScopedResource()
                            defer { if accessed { url.stopAccessingSecurityScopedResource() } }
                            guard let provData = try? Data(contentsOf: url) else {
                                signError = "تعذر قراءة ملف mobileprovision"
                                return
                            }
                            UserDefaults.standard.set(provData, forKey: "pending.provision")
                            // ✅ نفس الإصلاح: تأخير بسيط قبل عرض الـ alert التالي
                            DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                                showPasswordAlert = true
                            }
                        }

                        private func continueCertImport() {
                            guard let pending = pendingP12,
                                  let prov = UserDefaults.standard.data(forKey: "pending.provision") else { return }
                            let name = displayName.isEmpty ? pending.p12Name : displayName
                            certificateManager.importP12(data: pending.p12Data, password: p12Password,
                                                          displayName: name, provisionData: prov) { result in
                                UserDefaults.standard.removeObject(forKey: "pending.provision")
                                // ✅ الإصلاح: كان الخطأ يُتجاهل بصمت — الآن نعرضه للمستخدم
                                switch result {
                                case .success:
                                    HapticManager.notification(.success)
                                case .failure(let error):
                                    HapticManager.notification(.error)
                                    signError = error.localizedDescription
                                }
                            }
                            pendingP12 = nil
                        }

                        private func performSign(file: IPAFile, cert: CertificateInfoModel) {
                            isSigning = true
                            signingProgress = 0
                            signingMessage = "بدء التوقيع..."
                            let url = URL(fileURLWithPath: file.localPath)
                            SigningEngine.shared.sign(ipaURL: url, certificate: cert, progress: { p, m in
                                signingProgress = p
                                signingMessage = m
                            }) { result in
                                isSigning = false
                                switch result {
                                case .success(let out):
                                    downloadManager.markSigned(originalPath: file.localPath, signedPath: out.path)
                                    signingMessage = "✅ تم التوقيع"
                                    HapticManager.notification(.success)
                                case .failure(let err):
                                    let msg = err.localizedDescription
                                    downloadManager.markSignError(originalPath: file.localPath, message: msg)
                                    signError = msg
                                    HapticManager.notification(.error)
                                }
                            }
                        }
                    }

                    // MARK: - Certificate Card
                    struct CertificateCard: View {
                        let cert: CertificateInfoModel
                        let onDelete: () -> Void
                        @State private var confirm = false

                        var body: some View {
                            HStack(spacing: 10) {
                                Image(systemName: "doc.badge.gearshape.fill")
                                    .font(.system(size: 22))
                                    .foregroundStyle(LinearGradient(colors: [cert.expiryStatusColor, .blue], startPoint: .top, endPoint: .bottom))
                                VStack(alignment: .leading, spacing: 3) {
                                    Text(cert.displayName).font(.system(size: 13, weight: .bold)).lineLimit(1)
                                    if let tid = cert.teamID { Text("Team: \(tid)").font(.system(size: 10)).foregroundColor(.gray) }
                                    Text(cert.expiryText).font(.system(size: 10, weight: .semibold)).foregroundColor(cert.expiryStatusColor)
                                }
                                Spacer()
                                Button { confirm = true } label: { Image(systemName: "trash").foregroundColor(.red) }
                            }
                            .padding(10)
                            .background(RoundedRectangle(cornerRadius: 14).fill(Color.glassWhite))
                            .overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.glassBorder, lineWidth: 0.5))
                            .confirmationDialog("حذف الشهادة؟", isPresented: $confirm) {
                                Button("حذف", role: .destructive) { onDelete() }
                                Button("إلغاء", role: .cancel) { }
                            }
                        }
                    }

                    // MARK: - Sign File Row
                    struct SignFileRow: View {
                        let file: IPAFile
                        let canSign: Bool
                        let onTap: () -> Void
                        var body: some View {
                            Button(action: { if canSign { HapticManager.impact(.light); onTap() } }) {
                                HStack(spacing: 10) {
                                    Image(systemName: file.isSigned ? "checkmark.seal.fill" : "app.gift")
                                        .font(.system(size: 20))
                                        .foregroundColor(file.isSigned ? .green : .vipPurple)
                                    VStack(alignment: .leading, spacing: 3) {
                                        Text(file.fileName).font(.system(size: 12, weight: .bold)).lineLimit(1)
                                        HStack(spacing: 6) {
                                            Text(file.fileSize).font(.system(size: 10)).foregroundColor(.gray)
                                            if file.isSigned { Text("✓ موقّع").font(.system(size: 10, weight: .bold)).foregroundColor(.green) }
                                        }
                                    }
                                    Spacer()
                                    if !file.isSigned {
                                        Image(systemName: "chevron.left").font(.system(size: 11)).foregroundColor(.gray)
                                    }
                                }
                                .padding(10)
                                .background(RoundedRectangle(cornerRadius: 14).fill(Color.glassWhite))
                                .overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.glassBorder, lineWidth: 0.5))
                            }
                            .buttonStyle(.plain)
                            .opacity(canSign ? 1.0 : 0.6)
                            .disabled(!canSign)
                        }
                    }

                    // MARK: - Signing Picker Sheet
                    struct SigningPickerSheet: View {
                        let file: IPAFile
                        let certificates: [CertificateInfoModel]
                        let onCancel: () -> Void
                        let onSign: (CertificateInfoModel) -> Void

                        var body: some View {
                            NavigationView {
                                List {
                                    Section("اختر شهادة للتوقيع") {
                                        ForEach(certificates, id: \.id) { cert in
                                            Button { onSign(cert) } label: {
                                                HStack {
                                                    VStack(alignment: .leading) {
