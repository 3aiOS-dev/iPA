      - name: Generate code - NotifyCenter.swift (notifications + sign-up verification code)
        run: |
          cat > NotifyCenter.swift << 'VIPEOF'
          import SwiftUI
          import UserNotifications
          import UIKit

          // ============================================================
          // NOTIFICATIONS + SIGN-UP VERIFICATION CODE (demo delivery,
          // but the displayed code IS the code that gets verified)
          // ============================================================

          struct AppNotificationItem: Identifiable, Equatable {
              let id: UUID = UUID()
              let title: String
              let body: String
              let icon: String
              let date: Date = Date()
          }

          @MainActor
          final class NotificationsManager: ObservableObject {
              static let shared = MainActor.assumeIsolated { NotificationsManager() }

              @Published var authorized: Bool = false
              @Published var enabled: Bool = UserDefaults.standard.object(forKey: "notif_enabled_21s") as? Bool ?? true
              @Published var history: [AppNotificationItem] = []
              @Published var banner: AppNotificationItem? = nil

              private init() {}

              func requestAuthorization() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { granted, _ in
                      DispatchQueue.main.async { self.authorized = granted }
                  }
              }

              func setEnabled(_ value: Bool) {
                  enabled = value
                  UserDefaults.standard.set(value, forKey: "notif_enabled_21s")
                  if value { requestAuthorization() }
              }

              /// Shows a real local notification (when allowed) + an in-app banner.
              func push(title: String, body: String, icon: String = "bell.fill", delay: TimeInterval = 0.4) {
                  let item = AppNotificationItem(title: title, body: body, icon: icon)
                  history.insert(item, at: 0)
                  if history.count > 60 { history.removeLast(history.count - 60) }

                  withAnimation(.spring(response: 0.4, dampingFraction: 0.8)) { banner = item }
                  HapticManager.shared.notification(.success)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 5) {
                      if self.banner?.id == item.id {
                          withAnimation(.easeOut(duration: 0.25)) { self.banner = nil }
                      }
                  }

                  guard enabled else { return }
                  let content = UNMutableNotificationContent()
                  content.title = title
                  content.body = body
                  content.sound = .default
                  let trigger = UNTimeIntervalNotificationTrigger(timeInterval: max(delay, 0.2), repeats: false)
                  let request = UNNotificationRequest(identifier: item.id.uuidString, content: content, trigger: trigger)
                  UNUserNotificationCenter.current().add(request, withCompletionHandler: nil)
              }

              func dismissBanner() {
                  withAnimation(.easeOut(duration: 0.2)) { banner = nil }
              }

              func clearHistory() { history.removeAll() }
          }

          // MARK: - Verification code engine
          @MainActor
          final class VerificationService: ObservableObject {
              static let shared = MainActor.assumeIsolated { VerificationService() }

              @Published private(set) var currentCode: String = ""
              @Published private(set) var targetPhone: String = ""
              @Published private(set) var expiresAt: Date = Date()
              @Published var attempts: Int = 0

              private init() {}

              /// Generates a 6 digit code, delivers it through the notification centre.
              @discardableResult
              func sendCode(to phone: String) -> String {
                  let code = String(format: "%06d", Int.random(in: 0...999999))
                  currentCode = code
                  targetPhone = phone
                  expiresAt = Date().addingTimeInterval(300)
                  attempts = 0
                  NotificationsManager.shared.push(
                      title: LS("رمز تحقق ONEs"),
                      body: "رمز التحقق الخاص بـ \(phone) هو \(code) (صالح لمدة 5 دقائق)",
                      icon: "lock.shield.fill"
                  )
                  return code
              }

              func resend() {
                  guard !targetPhone.isEmpty else { return }
                  sendCode(to: targetPhone)
              }

              var isExpired: Bool { Date() > expiresAt }

              func verify(_ input: String) -> Bool {
                  let clean = input.trimmingCharacters(in: .whitespaces)
                  attempts += 1
                  guard !currentCode.isEmpty, !isExpired else { return false }
                  return clean == currentCode
              }

              func reset() {
                  currentCode = ""
                  targetPhone = ""
                  attempts = 0
              }
          }

          // MARK: - In-app notification banner
          struct NotificationBannerHost: View {
              @ObservedObject private var notifier = NotificationsManager.shared

              var body: some View {
                  VStack {
                      if let item = notifier.banner {
                          HStack(spacing: 12) {
                              ZStack {
                                  RoundedRectangle(cornerRadius: 12).fill(PinkTheme.gradient).frame(width: 38, height: 38)
                                  Image(systemName: item.icon).font(.system(size: 16, weight: .bold)).foregroundColor(.white)
                              }
                              VStack(alignment: .leading, spacing: 2) {
                                  Text(item.title).font(.system(size: 13, weight: .heavy)).foregroundColor(.storeText)
                                  Text(item.body).font(.system(size: 12)).foregroundColor(.storeSub).lineLimit(2)
                              }
                              Spacer(minLength: 0)
                              Button(action: { notifier.dismissBanner() }) {
                                  Image(systemName: "xmark").font(.system(size: 11, weight: .bold)).foregroundColor(.storeSub)
                              }
                          }
                          .padding(12)
                          .emerald3D(radius: 20, depth: 12)
                          .padding(.horizontal, 14)
                          .padding(.top, 8)
                          .transition(.move(edge: .top).combined(with: .opacity))
                      }
                      Spacer()
                  }
                  .animation(.spring(response: 0.4, dampingFraction: 0.82), value: notifier.banner)
              }
          }

          // MARK: - Notification centre screen
          struct NotificationCenterView: View {
              @Binding var isPresented: Bool
              @ObservedObject private var notifier = NotificationsManager.shared

              var body: some View {
                  ZStack {
                      AnimatedWaveBackground()
                      VStack(spacing: 0) {
                          HStack {
                              Button(action: { isPresented = false }) {
                                  Image(systemName: "chevron.left").font(.system(size: 16, weight: .bold)).foregroundColor(.storePrimary)
                              }
                              Spacer()
                              Text("الإشعارات").font(.system(size: 17, weight: .heavy)).foregroundColor(.storeText)
                              Spacer()
                              Button(action: { notifier.clearHistory() }) {
                                  Image(systemName: "trash").font(.system(size: 14, weight: .bold)).foregroundColor(.storeSub)
                              }
                          }
                          .padding(.horizontal, 18).padding(.vertical, 14)

                          ScrollView {
                              VStack(spacing: 12) {
                                  Toggle(isOn: Binding(get: { notifier.enabled }, set: { notifier.setEnabled($0) })) {
                                      VStack(alignment: .leading, spacing: 2) {
                                          Text("الإشعارات الفورية").font(.system(size: 14, weight: .bold)).foregroundColor(.storeText)
                                          Text(notifier.authorized ? "مسموح" : "مطلوب إذن من الجهاز")
                                              .font(.system(size: 11)).foregroundColor(.storeSub)
                                      }
                                  }
                                  .tint(.storePrimary)
                                  .padding(14)
                                  .emerald3D(radius: 20, depth: 10)

                                  if notifier.history.isEmpty {
                                      VStack(spacing: 8) {
                                          Image(systemName: "bell.slash").font(.system(size: 26)).foregroundColor(.storeSub)
                                          Text("لا توجد إشعارات بعد").font(.system(size: 13)).foregroundColor(.storeSub)
                                      }
                                      .padding(.top, 60)
                                  }

                                  ForEach(notifier.history) { item in
                                      HStack(spacing: 12) {
                                          ZStack {
                                              Circle().fill(PinkTheme.gradient).frame(width: 36, height: 36)
                                              Image(systemName: item.icon).font(.system(size: 15, weight: .bold)).foregroundColor(.white)
                                          }
                                          VStack(alignment: .leading, spacing: 3) {
                                              Text(item.title).font(.system(size: 13, weight: .bold)).foregroundColor(.storeText)
                                              Text(item.body).font(.system(size: 12)).foregroundColor(.storeSub)
                                          }
                                          Spacer(minLength: 0)
                                      }
                                      .padding(14)
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .emerald3D(radius: 20, depth: 8)
                                  }
                              }
                              .padding(16)
                          }
                      }
                  }
                  .onAppear { notifier.requestAuthorization() }
              }
          }

          // MARK: - Verification code screen (sign-up gate)
          struct VerifyCodeView: View {
              let phone: String
              var onVerified: () -> Void
              var onCancel: () -> Void

              @ObservedObject private var service = VerificationService.shared
              @State private var code: String = ""
              @State private var error: String? = nil
              @State private var seconds: Int = 60
              @State private var timer: Timer? = nil

              var body: some View {
                  ZStack {
                      AnimatedWaveBackground()
                      ScrollView {
                          VStack(spacing: 22) {
                              EmeraldOrb(size: 96).padding(.top, 40)
                              VStack(spacing: 6) {
                                  Text("إدخال رمز التحقق").font(.system(size: 24, weight: .heavy)).foregroundColor(.storeText)
                                  Text("تم إرسال رمز من 6 أرقام إلى \(phone). تحقق من الإشعارات.")
                                      .font(.system(size: 12)).foregroundColor(.storeSub)
                                      .multilineTextAlignment(.center)
                              }

