                      message = "أدخل UDID أو ثبّت ملف التعريف أولًا"; return
                  }
                  CloudAPI.shared.device(udid: udid) { device in
                      if let device = device, device.verified {
                          verified = true
                          UserDefaults.standard.set(device.udid, forKey: "ones_verified_udid")
                          message = "تم التحقق من الجهاز في لوحة التحكم"
                      } else {
                          message = "لم يتم التحقق بعد"
                      }
                  }
              }

              private func link() {
                  busy = true
                  CloudAPI.shared.linkSubscription(udid: udid, code: code) { ok, err in
                      busy = false
                      verified = ok
                      if ok { UserDefaults.standard.set(udid, forKey: "ones_verified_udid") }
                      message = ok ? "تم ربط UDID والكود بالمتجر" : ("فشل: " + (err ?? ""))
                  }
              }
          }

          VIPEOF

      - name: Generate code - InstallFlowView.swift
        run: |
          cat > InstallFlowView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          // ================= REAL SIGN + INSTALL FLOW =================
          struct InstallStage: Identifiable {
              let id: String
              let label: String
          }

          let installStages: [InstallStage] = [
              InstallStage(id: "signing_started",   label: "بدء التوقيع"),
              InstallStage(id: "certificate_check", label: "التحقق من الشهادة"),
              InstallStage(id: "signing_app",       label: "توقيع التطبيق"),
              InstallStage(id: "creating_manifest", label: "إنشاء Manifest"),
              InstallStage(id: "install_ready",     label: "بدء التثبيت"),
              InstallStage(id: "completed",         label: "اكتمل التثبيت")
          ]

          struct InstallFlowView: View {
              let jobId: String
              let appName: String

              @State private var job: CloudJob?
              @State private var opened = false
              private let timer = Timer.publish(every: 2, on: .main, in: .common).autoconnect()

              private var currentIndex: Int {
                  guard let stage = job?.stage else { return -1 }
                  return installStages.firstIndex(where: { $0.id == stage }) ?? -1
              }

              var body: some View {
                  ScrollView {
                      VStack(spacing: 16) {
                          Text(appName).font(.system(size: 20, weight: .bold))

                          ProgressView(value: Double(job?.progress ?? 0), total: 100)
                              .tint(.storePrimary).padding(.horizontal, 6)

                          VStack(alignment: .leading, spacing: 10) {
                              ForEach(Array(installStages.enumerated()), id: \.element.id) { index, stage in
                                  HStack(spacing: 10) {
                                      Image(systemName: index <= currentIndex ? "checkmark.circle.fill" : "circle")
                                          .foregroundColor(index <= currentIndex ? .storePrimary : .storeInkLine)
                                      Text(stage.label)
                                          .font(.system(size: 15, weight: index == currentIndex ? .bold : .regular))
                                          .foregroundColor(index <= currentIndex ? .storeInk : .storeInkSub)
                                      Spacer()
                                  }
                              }
                          }
                          .padding(16).background(Color.storeSurface).cornerRadius(16)

                          if job?.status == "failed" {
                              Text("فشل: " + (job?.error ?? "خطأ غير معروف"))
                                  .font(.system(size: 13)).foregroundColor(.storePink)
                                  .padding(14).frame(maxWidth: .infinity, alignment: .leading)
                                  .background(Color.storePink.opacity(0.08)).cornerRadius(12)
                          }

                          if let itms = job?.itms_url, let url = URL(string: itms) {
                              Button {
                                  UIApplication.shared.open(url)
                              } label: {
                                  Text("تثبيت الآن على الجهاز")
                                      .frame(maxWidth: .infinity).padding(14)
                                      .background(Color.storePrimary).foregroundColor(.white).cornerRadius(12)
                              }
                          }

                          VStack(alignment: .leading, spacing: 6) {
                              Text("سجل السيرفر الحقيقي").font(.system(size: 15, weight: .bold))
                              ForEach(Array((job?.logs ?? []).enumerated()), id: \.offset) { _, entry in
                                  Text("• \(entry.stage ?? "") \(entry.message ?? "")")
                                      .font(.system(size: 12)).foregroundColor(.storeInkSub)
                                      .frame(maxWidth: .infinity, alignment: .leading)
                              }
                          }
                          .padding(16).frame(maxWidth: .infinity, alignment: .leading)
                          .background(Color.storeSurface).cornerRadius(16)
                      }
                      .padding(14)
                  }
                  .background(Color.storeBg.ignoresSafeArea())
                  .navigationTitle("حالة العملية")
                  .environment(\.layoutDirection, .rightToLeft)
                  .onAppear { refresh() }
                  .onReceive(timer) { _ in refresh() }
              }

              private func refresh() {
                  CloudAPI.shared.job(id: jobId) { fetched in
                      guard let fetched = fetched else { return }
                      job = fetched
                      if !opened, fetched.stage == "install_ready" || fetched.stage == "completed",
                         let itms = fetched.itms_url, let url = URL(string: itms) {
                          opened = true
                          UIApplication.shared.open(url)
                      }
                  }
              }
          }

          // ================= CLOUD STORE (real apps + real signing) =================
          struct CloudStoreView: View {
              @State private var apps: [CloudApp] = []
              @State private var certificates: [CloudCertificate] = []
              @State private var query = ""
              @State private var selectedApp: CloudApp?
              @State private var selectedCert: String = ""
              @State private var startedJobId: String?
              @State private var startedAppName: String = ""
              @State private var message: String?
              @State private var busy = false

              private var filtered: [CloudApp] {
                  query.isEmpty ? apps : apps.filter {
                      $0.name.lowercased().contains(query.lowercased()) ||
                      $0.bundle_id.lowercased().contains(query.lowercased())
                  }
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          TextField("ابحث عن تطبيق...", text: $query)
                              .padding(12).background(Color.storeCard).cornerRadius(12).padding(12)

                          ScrollView {
                              VStack(spacing: 12) {
                                  if apps.isEmpty {
                                      Text("لا توجد تطبيقات بعد — أضفها من لوحة التحكم")
                                          .foregroundColor(.storeInkSub).padding(.top, 40)
                                  }
                                  ForEach(filtered) { app in
                                      HStack(spacing: 12) {
                                          RemoteIcon(urlString: app.icon_url, name: app.name)
                                              .frame(width: 56, height: 56).cornerRadius(14)
                                          VStack(alignment: .leading, spacing: 4) {
                                              Text(app.name).font(.system(size: 16, weight: .semibold))
                                              Text(app.bundle_id).font(.system(size: 11)).foregroundColor(.storeInkSub)
                                              Text("v\(app.version) • \(String(format: "%.1f", Double(app.size_bytes) / 1048576.0)) MB • \(app.category)")
                                                  .font(.system(size: 11)).foregroundColor(.storeInkSub)
                                          }
                                          Spacer()
                                          Button("تثبيت") { selectedApp = app }
                                              .padding(.horizontal, 16).padding(.vertical, 8)
                                              .background(Color.storePrimary).foregroundColor(.white).cornerRadius(10)
                                      }
                                      .padding(12).background(Color.storeSurface).cornerRadius(16)
                                  }
                              }
                              .padding(.horizontal, 12)
                          }

                          NavigationLink(
                              destination: InstallFlowView(jobId: startedJobId ?? "", appName: startedAppName),
                              isActive: Binding(get: { startedJobId != nil }, set: { if !$0 { startedJobId = nil } })
                          ) { EmptyView() }.hidden()
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationTitle("ONEs Store")
                      .sheet(item: $selectedApp) { app in
                          installSheet(app)
                      }
                  }
                  .environment(\.layoutDirection, .rightToLeft)
                  .onAppear {
                      CloudAPI.shared.apps { apps = $0 }
                      CloudAPI.shared.certificates(activeOnly: true) { certificates = $0 }
                  }
              }

              private func installSheet(_ app: CloudApp) -> some View {
                  VStack(spacing: 16) {
                      Text("تثبيت \(app.name)").font(.system(size: 19, weight: .bold)).padding(.top, 20)
                      Text("سيتم توقيع الملف فعليًا على السيرفر بالشهادة المختارة")
                          .font(.system(size: 13)).foregroundColor(.storeInkSub)

                      Picker("الشهادة", selection: $selectedCert) {
                          Text("اختر شهادة").tag("")
                          ForEach(certificates) { cert in Text(cert.owner_name).tag(cert.id) }
                      }
                      .pickerStyle(.wheel).frame(height: 120)

                      Button {
                          busy = true
                          let udid = UserDefaults.standard.string(forKey: "ones_verified_udid")
                          CloudAPI.shared.startInstall(appId: app.id, certificateId: selectedCert, udid: udid) { jobId, err in
                              busy = false
                              if let jobId = jobId {
                                  startedAppName = app.name
                                  selectedApp = nil
                                  startedJobId = jobId
                              } else {
                                  message = err ?? "فشل بدء التوقيع"
                              }
                          }
                      } label: {
                          Text(busy ? "جارٍ بدء التوقيع..." : "بدء التوقيع والتثبيت")
                              .frame(maxWidth: .infinity).padding(14)
                              .background(Color.storePrimary).foregroundColor(.white).cornerRadius(12)
                      }
                      .disabled(selectedCert.isEmpty || busy)
                      .padding(.horizontal, 20)

                      if let message = message {
                          Text(message).font(.system(size: 13)).foregroundColor(.storePink)
                      }
                      Spacer()
                  }
                  .environment(\.layoutDirection, .rightToLeft)
                  .presentationDetents([.medium])
              }
          }

          // ================= REMOTE ICON =================
          struct RemoteIcon: View {
              let urlString: String?
              let name: String
              @State private var image: UIImage?

              var body: some View {
                  ZStack {
                      if let image = image {
                          Image(uiImage: image).resizable().scaledToFill()
                      } else {
                          LinearGradient(colors: [Color.storePrimary, Color.storePrimaryDk],
                                         startPoint: .topLeading, endPoint: .bottomTrailing)
                          Text(String(name.prefix(1)).uppercased())
                              .font(.system(size: 22, weight: .bold)).foregroundColor(.white)
                      }
                  }
                  .onAppear(perform: load)
              }

              private func load() {
                  guard image == nil, let urlString = urlString, let url = URL(string: urlString) else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data, let ui = UIImage(data: data) else { return }
                      DispatchQueue.main.async { image = ui }
                  }.resume()
              }
          }

          VIPEOF

      # =========================================================
      # SOURCE CODE - VIP21StoreApp.swift (no themes, light only, no background tasks)
      # =========================================================
      - name: Generate code - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import BackgroundTasks
          import UserNotifications

          @main
          struct VIP21StoreApp: App {
              @StateObject private var captureService = ScreenCaptureService.shared
              @ObservedObject private var lang = LanguageManager.shared

              init() {
                  ScreenCaptureService.shared.start()
                  UNUserNotificationCenter.current().delegate = ForegroundNotificationDelegate.shared
                  VIP21StoreApp.applyLightAppearance()
                  ActivationManager.shared.verify()
              }

              static func applyLightAppearance() {
                  // Light mode appearance
