      - name: Generate Source - Models, Theme and Mock Data
        run: |
          cd ${{ github.workspace }}
          cat > AppModel.swift << 'WEOF'
          import UIKit

          enum StoreCategory: String, CaseIterable {
              case all = "الكل"
              case games = "ألعاب"
              case apps = "تطبيقات"
              case tools = "أدوات"
          }

          struct AppItem {
              let id: Int
              let name: String
              let developer: String
              let category: StoreCategory
              let rating: Double
              let sizeMB: Int
              let emoji: String
              let colorHex: String
              let description: String
              let price: String
          }

          extension UIColor {
              convenience init(hex: String) {
                  var sanitized = hex.trimmingCharacters(in: .whitespacesAndNewlines)
                  sanitized = sanitized.replacingOccurrences(of: "#", with: "")
                  var rgb: UInt64 = 0
                  Scanner(string: sanitized).scanHexInt64(&rgb)
                  let r = CGFloat((rgb & 0xFF0000) >> 16) / 255.0
                  let g = CGFloat((rgb & 0x00FF00) >> 8) / 255.0
                  let b = CGFloat(rgb & 0x0000FF) / 255.0
                  self.init(red: r, green: g, blue: b, alpha: 1.0)
              }
          }

          // نظام الألوان والمظهر (فاتح/داكن) لتطبيق 21s بالكامل.
          enum AppTheme {
              private static let darkModeKey = "app21s.darkMode"

              static var isDark: Bool {
                  if UserDefaults.standard.object(forKey: darkModeKey) == nil { return true }
                  return UserDefaults.standard.bool(forKey: darkModeKey)
              }

              static func setDark(_ value: Bool) {
                  UserDefaults.standard.set(value, forKey: darkModeKey)
                  NotificationCenter.default.post(name: .themeChanged, object: nil)
              }

              static var background: UIColor {
                  isDark ? UIColor(hex: "0A0B14") : UIColor(hex: "F4F5FA")
              }
              static var surface: UIColor {
                  isDark ? UIColor(hex: "151826") : UIColor.white
              }
              static var surfaceElevated: UIColor {
                  isDark ? UIColor(hex: "1D2136") : UIColor(hex: "EDEFF7")
              }
              static var primaryText: UIColor {
                  isDark ? .white : UIColor(hex: "12131A")
              }
              static var secondaryText: UIColor {
                  primaryText.withAlphaComponent(0.55)
              }
              static var accent: UIColor { UIColor(hex: "6E56CF") }
              static var accentSecondary: UIColor { UIColor(hex: "22D3EE") }
              static var gold: UIColor { UIColor(hex: "FBBF24") }
              static var danger: UIColor { UIColor(hex: "F43F5E") }
              static var barStyle: UIBarStyle { isDark ? .black : .default }
          }

          extension Notification.Name {
              static let themeChanged = Notification.Name("app21s.themeChanged")
          }

          enum MockData {
              // بيانات احتياطية فقط (تُستخدم إذا تعذّرت قراءة ملف apps_data.json من حزمة التطبيق).
              // كل البيانات هنا وهمية بالكامل لأغراض العرض فقط، ولا تمثل أي عملية تنزيل
              // أو تثبيت فعلية لأي برنامج أو لعبة حقيقية.
              static let fallbackItems: [AppItem] = [
                  AppItem(id: 1, name: "سباق الصحراء", developer: "استوديو الرمال", category: .games, rating: 4.6, sizeMB: 340, emoji: "🏎️", colorHex: "FF6B35", description: "لعبة سباقات سيارات عبر الصحراء بمضامير متعددة وتحديات يومية وتخصيص كامل للسيارة.", price: "مجانًا"),
                  AppItem(id: 2, name: "برج الألغاز", developer: "بلاي لاب", category: .games, rating: 4.3, sizeMB: 210, emoji: "🧩", colorHex: "7C3AED", description: "ألغاز ذهنية ممتعة بمئات المراحل المتصاعدة الصعوبة، مناسبة لجميع الأعمار.", price: "مجانًا"),
                  AppItem(id: 3, name: "دفتري", developer: "نوت آبس", category: .apps, rating: 4.8, sizeMB: 45, emoji: "📝", colorHex: "06B6D4", description: "تطبيق ملاحظات بسيط وسريع مع دعم المزامنة والتذكيرات والتصنيفات.", price: "مجانًا"),
              ]
          }

          // يمثّل تطبيقًا واحدًا كما هو مخزَّن في ملف apps_data.json (مطابق لبنية الحقول
          // المستخدمة هناك: name, bundleID, version, category...إلخ).
          private struct RawAppItem: Decodable {
              let name: String
              let bundleID: String
              let version: String
              let versionDate: String
              let developerName: String
              let localizedDescription: String
              let category: String
              let rating: Double
              let sizeMB: Int
              let emoji: String
              let colorHex: String
              let price: String
          }

          private struct RawAppsFile: Decodable {
              let apps: [RawAppItem]
          }

          // يقرأ بيانات التطبيقات من ملف Resources/apps_data.json المضمَّن داخل حزمة
          // التطبيق نفسها (Bundle.main) — لا يوجد أي اتصال بالإنترنت أو مصدر خارجي هنا.
          // إذا تعذّرت القراءة أو التحليل لأي سبب، يتم استخدام بيانات احتياطية بسيطة.
          enum AppDataLoader {
              static let items: [AppItem] = load()

              private static func load() -> [AppItem] {
                  guard
                      let url = Bundle.main.url(forResource: "apps_data", withExtension: "json"),
                      let data = try? Data(contentsOf: url),
                      let file = try? JSONDecoder().decode(RawAppsFile.self, from: data)
                  else {
                      return MockData.fallbackItems
                  }

                  return file.apps.enumerated().map { index, raw in
                      AppItem(
                          id: index + 1,
                          name: raw.name,
                          developer: raw.developerName,
                          category: category(from: raw.category),
                          rating: raw.rating,
                          sizeMB: raw.sizeMB,
                          emoji: raw.emoji,
                          colorHex: raw.colorHex,
                          description: raw.localizedDescription,
                          price: raw.price
                      )
                  }
              }

              private static func category(from raw: String) -> StoreCategory {
                  switch raw.lowercased() {
                  case "games": return .games
                  case "tools": return .tools
                  default: return .apps
                  }
              }
          }

          // إدارة قائمة المفضلة محليًا على الجهاز فقط (UserDefaults)، بدون أي اتصال بالإنترنت
          // أو إرسال بيانات لأي جهة خارجية.
          final class FavoritesManager {
              static let shared = FavoritesManager()
              private let storageKey = "app21s.favorites.ids"
              private var ids: Set<Int>

              private init() {
                  let saved = UserDefaults.standard.array(forKey: storageKey) as? [Int] ?? []
                  ids = Set(saved)
              }

              func isFavorite(_ id: Int) -> Bool {
                  ids.contains(id)
              }

              func toggle(_ id: Int) {
                  if ids.contains(id) {
                      ids.remove(id)
                  } else {
                      ids.insert(id)
                  }
                  UserDefaults.standard.set(Array(ids), forKey: storageKey)
                  NotificationCenter.default.post(name: .favoritesChanged, object: nil)
              }

              var favoriteItems: [AppItem] {
                  AppDataLoader.items.filter { ids.contains($0.id) }
              }

              var count: Int {
                  ids.count
              }

              func clearAll() {
                  ids.removeAll()
                  UserDefaults.standard.set(Array(ids), forKey: storageKey)
                  NotificationCenter.default.post(name: .favoritesChanged, object: nil)
              }
          }

          extension Notification.Name {
              static let favoritesChanged = Notification.Name("app21s.favoritesChanged")
          }
          WEOF

      - name: Generate Source - App Cell
        run: |
          cd ${{ github.workspace }}
          cat > AppCell.swift << 'CEOF'
          import UIKit

          final class AppCell: UICollectionViewCell {
              static let reuseID = "AppCell"

              private let iconView = UIView()
              private let emojiLabel = UILabel()
              private let nameLabel = UILabel()
              private let devLabel = UILabel()
              private let ratingLabel = UILabel()
              private let installButton = UIButton(type: .system)

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  build()
              }

              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  build()
              }

              private func build() {
                  contentView.backgroundColor = AppTheme.surface
                  contentView.layer.cornerRadius = 16
                  contentView.layer.borderWidth = 1
                  contentView.layer.borderColor = AppTheme.primaryText.withAlphaComponent(0.08).cgColor

                  iconView.layer.cornerRadius = 14
                  iconView.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(iconView)

                  emojiLabel.font = .systemFont(ofSize: 30)
                  emojiLabel.textAlignment = .center
                  emojiLabel.translatesAutoresizingMaskIntoConstraints = false
                  iconView.addSubview(emojiLabel)

                  nameLabel.font = .systemFont(ofSize: 13, weight: .semibold)
                  nameLabel.textColor = AppTheme.primaryText
                  nameLabel.numberOfLines = 1
                  nameLabel.textAlignment = .center
                  nameLabel.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(nameLabel)

                  devLabel.font = .systemFont(ofSize: 10.5)
                  devLabel.textColor = AppTheme.secondaryText
                  devLabel.numberOfLines = 1
                  devLabel.textAlignment = .center
                  devLabel.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(devLabel)

                  ratingLabel.font = .systemFont(ofSize: 10.5, weight: .medium)
                  ratingLabel.textColor = AppTheme.gold
                  ratingLabel.textAlignment = .center
                  ratingLabel.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(ratingLabel)

                  installButton.setTitle("تثبيت", for: .normal)
                  installButton.titleLabel?.font = .systemFont(ofSize: 12, weight: .bold)
                  installButton.backgroundColor = AppTheme.accent
                  installButton.setTitleColor(.white, for: .normal)
                  installButton.layer.cornerRadius = 14
                  installButton.isUserInteractionEnabled = false // زر شكلي للعرض فقط، بدون تنزيل فعلي
                  installButton.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(installButton)

                  NSLayoutConstraint.activate([
                      iconView.topAnchor.constraint(equalTo: contentView.topAnchor, constant: 12),
                      iconView.centerXAnchor.constraint(equalTo: contentView.centerXAnchor),
                      iconView.widthAnchor.constraint(equalToConstant: 64),
                      iconView.heightAnchor.constraint(equalToConstant: 64),

                      emojiLabel.centerXAnchor.constraint(equalTo: iconView.centerXAnchor),
                      emojiLabel.centerYAnchor.constraint(equalTo: iconView.centerYAnchor),

                      nameLabel.topAnchor.constraint(equalTo: iconView.bottomAnchor, constant: 8),
                      nameLabel.leadingAnchor.constraint(equalTo: contentView.leadingAnchor, constant: 6),
                      nameLabel.trailingAnchor.constraint(equalTo: contentView.trailingAnchor, constant: -6),

                      devLabel.topAnchor.constraint(equalTo: nameLabel.bottomAnchor, constant: 2),
                      devLabel.leadingAnchor.constraint(equalTo: nameLabel.leadingAnchor),
                      devLabel.trailingAnchor.constraint(equalTo: nameLabel.trailingAnchor),

                      ratingLabel.topAnchor.constraint(equalTo: devLabel.bottomAnchor, constant: 4),
                      ratingLabel.centerXAnchor.constraint(equalTo: contentView.centerXAnchor),

                      installButton.topAnchor.constraint(equalTo: ratingLabel.bottomAnchor, constant: 8),
                      installButton.leadingAnchor.constraint(equalTo: contentView.leadingAnchor, constant: 16),
                      installButton.trailingAnchor.constraint(equalTo: contentView.trailingAnchor, constant: -16),
                      installButton.heightAnchor.constraint(equalToConstant: 28),
                      installButton.bottomAnchor.constraint(equalTo: contentView.bottomAnchor, constant: -12),
                  ])
              }

              func configure(with item: AppItem) {
                  iconView.backgroundColor = UIColor(hex: item.colorHex).withAlphaComponent(0.25)
                  emojiLabel.text = item.emoji
                  nameLabel.text = item.name
                  devLabel.text = item.developer
                  ratingLabel.text = "★ \(String(format: "%.1f", item.rating))  ·  \(item.sizeMB) MB"
                  installButton.setTitle(item.price == "مجانًا" ? "تثبيت" : item.price, for: .normal)
              }
          }
          CEOF

      - name: Generate Source - Top Bar Component
        run: |
          cd ${{ github.workspace }}
          cat > TopBarView.swift << 'TEOF'
          import UIKit

          // تسمية بحواف داخلية (للشارات الصغيرة مثل رقم الإصدار وعلامة "إعلان").
          final class PaddingLabel: UILabel {
              var insets = UIEdgeInsets(top: 3, left: 8, bottom: 3, right: 8)

              override func drawText(in rect: CGRect) {
                  super.drawText(in: rect.inset(by: insets))
              }

              override var intrinsicContentSize: CGSize {
                  let size = super.intrinsicContentSize
                  return CGSize(width: size.width + insets.left + insets.right,
                                height: size.height + insets.top + insets.bottom)
              }
          }

          // الشريط العلوي المشترك بين تبويبات الرئيسية والتطبيقات والمفضلة:
          // أيقونة التطبيق + الاسم "21s" + شارة الإصدار على اليسار، وزر الإعدادات على اليمين.
          final class TopBarView: UIView {
              var onSettingsTap: (() -> Void)?

              private let iconView = UIView()
              private let iconLabel = UILabel()
              private let nameLabel = UILabel()
              private let badgeLabel = PaddingLabel()
              private let settingsButton = UIButton(type: .system)

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  build()
              }

              required init?(coder: NSCoder) {
                  super.init(coder: coder)
                  build()
              }

              private func build() {
                  backgroundColor = AppTheme.background

                  let gradient = CAGradientLayer()
                  gradient.colors = [AppTheme.accent.cgColor, AppTheme.accentSecondary.cgColor]
                  gradient.startPoint = CGPoint(x: 0, y: 0)
                  gradient.endPoint = CGPoint(x: 1, y: 1)
                  iconView.layer.insertSublayer(gradient, at: 0)
                  iconGradient = gradient
                  iconView.layer.cornerRadius = 9
                  iconView.translatesAutoresizingMaskIntoConstraints = false
                  addSubview(iconView)

                  iconLabel.text = "21"
                  iconLabel.font = .systemFont(ofSize: 12.5, weight: .heavy)
                  iconLabel.textColor = .white
                  iconLabel.textAlignment = .center
                  iconLabel.translatesAutoresizingMaskIntoConstraints = false
                  iconView.addSubview(iconLabel)

                  nameLabel.text = "21s"
                  nameLabel.font = .systemFont(ofSize: 19, weight: .bold)
                  nameLabel.textColor = AppTheme.primaryText
                  nameLabel.translatesAutoresizingMaskIntoConstraints = false
                  addSubview(nameLabel)

                  badgeLabel.text = "الإصدار 1.0"
                  badgeLabel.font = .systemFont(ofSize: 10, weight: .semibold)
                  badgeLabel.textColor = AppTheme.accentSecondary
                  badgeLabel.backgroundColor = AppTheme.accentSecondary.withAlphaComponent(0.15)
                  badgeLabel.layer.cornerRadius = 8
                  badgeLabel.clipsToBounds = true
                  badgeLabel.translatesAutoresizingMaskIntoConstraints = false
                  addSubview(badgeLabel)

                  settingsButton.setImage(UIImage(systemName: "gearshape.fill"), for: .normal)
                  settingsButton.tintColor = AppTheme.primaryText.withAlphaComponent(0.85)
                  settingsButton.addTarget(self, action: #selector(settingsTapped), for: .touchUpInside)
                  settingsButton.translatesAutoresizingMaskIntoConstraints = false
                  addSubview(settingsButton)

                  let bottomLine = UIView()
