                    import SwiftUI
                    import UIKit
                    import UniformTypeIdentifiers

                    // MARK: - Library Tab (ملفاتي) — استيراد + قائمة + تثبيت
                    struct LibraryTabView: View {
                        @ObservedObject var downloadManager: IPADownloadManager
                        @State private var showFilePicker = false
                        @State private var installingFile: IPAFile?
                        @State private var showInstallPicker = false

                        var body: some View {
                            VStack(spacing: 0) {
                                header
                                if downloadManager.ipaFiles.isEmpty && downloadManager.activeDownloads.isEmpty {
                                    emptyState
                                } else {
                                    ScrollView(showsIndicators: false) {
                                        VStack(spacing: 10) {
                                            if !downloadManager.activeDownloads.isEmpty {
                                                sectionLabel("⏬ جاري التحميل")
                                                ForEach(downloadManager.activeDownloads) { dl in
                                                    ActiveDownloadCard(dl: dl) {
                                                        downloadManager.cancelDownload(dl)
                                                    }
                                                }
                                            }
                                            if !downloadManager.ipaFiles.isEmpty {
                                                sectionLabel("📂 ملفاتي")
                                                ForEach(downloadManager.ipaFiles, id: \.id) { file in
                                                    IPAFileRow(file: file, onInstall: {
                                                        installingFile = file
                                                        showInstallPicker = true
                                                    }, onDelete: {
                                                        downloadManager.deleteIPA(file)
                                                    })
                                                }
                                            }
                                            Spacer(minLength: 100)
                                        }.padding(.horizontal, 16).padding(.top, 10)
                                    }
                                }
                            }
                            .fileImporter(
                                isPresented: $showFilePicker,
                                allowedContentTypes: [
                                    UTType(filenameExtension: "ipa") ?? .archive,
                                    UTType.application,
                                    .archive,
                                    .data
                                ],
                                allowsMultipleSelection: false
                            ) { result in
                                handleFileImport(result)
                            }
                            .confirmationDialog("اختر طريقة التثبيت",
                                                isPresented: $showInstallPicker,
                                                presenting: installingFile) { file in
                                if InstallEngine.shared.availableMethod() != nil {
                                    Button("تثبيت") {
                                        install(file: file)
                                    }
                                } else {
                                    Button("لا توجد طريقة تثبيت") { }
                                }
                                Button("إلغاء", role: .cancel) { }
                            } message: { file in
                                Text("سيتم تثبيت \(file.fileName)")
                            }
                        }

                        private var header: some View {
                            HStack {
                                Text("ملفاتي").font(.system(size: 22, weight: .black))
                                Spacer()
                                Button {
                                    HapticManager.impact(.light)
                                    showFilePicker = true
                                } label: {
                                    HStack(spacing: 6) {
                                        Image(systemName: "plus.circle.fill")
                                        Text("استيراد IPA").font(.system(size: 13, weight: .bold))
                                    }
                                    .padding(.horizontal, 14).padding(.vertical, 8)
                                    .background(LinearGradient(colors: [.vipPurple, .blue], startPoint: .leading, endPoint: .trailing))
                                    .foregroundColor(.white)
                                    .clipShape(Capsule())
                                    .shadow(color: .vipPurple.opacity(0.35), radius: 6, y: 3)
                                }
                            }.padding(.horizontal, 16).padding(.top, 8).padding(.bottom, 4)
                        }

                        private var emptyState: some View {
                            VStack(spacing: 16) {
                                Image(systemName: "tray").font(.system(size: 60)).foregroundColor(.gray.opacity(0.6))
                                Text("لا توجد ملفات بعد").font(.system(size: 16, weight: .semibold))
                                Text("استورد ملف IPA من جهازك أو حمّل تطبيق من المتجر").font(.system(size: 12)).foregroundColor(.gray)
                                    .multilineTextAlignment(.center)
                                Button {
                                    showFilePicker = true
                                } label: {
                                    Label("استيراد ملف IPA", systemImage: "square.and.arrow.down.fill")
                                        .padding(.horizontal, 18).padding(.vertical, 10)
