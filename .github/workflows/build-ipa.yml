                                  .frame(width: 120).offset(x: 50, y: -30)
                              Circle().fill(Color.xcodePurple.opacity(0.05))
                                  .frame(width: 80).offset(x: -60, y: 25)
                          }
                      )
                      .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))
                      .overlay(
                          RoundedRectangle(cornerRadius: 16, style: .continuous)
                              .stroke(Color.xcodeBlue.opacity(0.15), lineWidth: 0.5)
                      )
                      .shadow(color: .black.opacity(0.2), radius: 12, x: 0, y: 6)
                      .padding(.horizontal, 16)
                      .onAppear { pulse = true }

                      HStack(spacing: 10) {
                          StatPill(icon: "app.fill", value: "\(stats.totalApps)", label: "Apps")
