          import Foundation
          import SwiftUI

          @MainActor
          final class FavoritesStore: ObservableObject {
              static let shared = FavoritesStore()

              @Published private(set) var items: [StoreAPIApp] = []

              private let key = "favorites.v1"
              private let d = UserDefaults.standard

              private init() { load() }

              private func load() {
                  guard let data = d.data(forKey: key),
                        let decoded = try? JSONDecoder().decode([StoreAPIApp].self, from: data) else {
                      return
                  }
                  items = decoded
              }

              private func save() {
                  if let data = try? JSONEncoder().encode(items) {
                      d.set(data, forKey: key)
                  }
              }

              func contains(_ app: StoreAPIApp) -> Bool {
                  items.contains(where: { $0.id == app.id })
              }

              func toggle(_ app: StoreAPIApp) {
                  if contains(app) {
                      items.removeAll { $0.id == app.id }
                      HapticManager.shared.impact(.light)
                  } else {
                      items.insert(app, at: 0)
                      HapticManager.shared.success()
                  }
                  save()
              }

              func add(_ app: StoreAPIApp) {
                  if contains(app) { return }
                  items.insert(app, at: 0)
                  save()
              }

              func remove(_ app: StoreAPIApp) {
                  items.removeAll { $0.id == app.id }
                  save()
              }

              func clearAll() {
                  items.removeAll()
                  save()
              }
          }

