  # =========================================================
  # STAGE 4: توليد كود SwiftUI المتكامل مع الأنمي
  # =========================================================
  generate-swift-code:
    runs-on: macos-latest
    needs: [prepare, generate-assets, generate-web-engine]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Anime Assets
        uses: actions/download-artifact@v4
        with:
          name: anime-assets-${{ needs.prepare.outputs.build_id }}
