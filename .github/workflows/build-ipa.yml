                  label.numberOfLines = 0
                  label.textColor = .souqPrimaryText
                  label.font = .systemFont(ofSize: 14)
                  label.translatesAutoresizingMaskIntoConstraints = false
                  label.text = """
                  آخر تحديث: 2026

                  هذا التطبيق هو نموذج عرض تجريبي (Demo) فقط، ونوضح فيما يلي كيفية التعامل مع بياناتك:

                  ١) البيانات المعروضة
                  جميع التطبيقات والألعاب والتقييمات الظاهرة في المتجر بيانات وهمية لأغراض العرض فقط، ولا يقوم التطبيق بأي تنزيل أو تثبيت فعلي لأي برنامج حقيقي.

                  ٢) المفضلة
                  عند إضافة تطبيق إلى المفضلة، يتم حفظ هذا الاختيار محليًا على جهازك فقط (باستخدام UserDefaults)، ولا تتم مشاركته أو إرساله إلى أي خادم أو جهة خارجية.

                  ٣) جمع البيانات
                  لا يقوم هذا التطبيق بجمع أي معلومات شخصية، ولا يطلب أذونات وصول لجهات الاتصال أو الموقع أو الكاميرا، ولا يتصل بأي خدمات تحليلات أو إعلانات.

                  ٤) الاتصال بالإنترنت
                  التطبيق يعمل بالكامل دون اتصال بالإنترنت، ولا يرسل أو يستقبل أي بيانات من مصادر خارجية.

                  ٥) التواصل
                  لأي استفسار حول هذه السياسة، يرجى التواصل مع المطوّر عبر القنوات المعتادة لدعم التطبيق.
                  """
                  scrollView.addSubview(label)

                  NSLayoutConstraint.activate([
                      scrollView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      scrollView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      scrollView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      scrollView.bottomAnchor.constraint(equalTo: view.bottomAnchor),

                      label.topAnchor.constraint(equalTo: scrollView.topAnchor, constant: 20),
                      label.leadingAnchor.constraint(equalTo: scrollView.leadingAnchor, constant: 20),
                      label.trailingAnchor.constraint(equalTo: scrollView.trailingAnchor, constant: -20),
                      label.bottomAnchor.constraint(equalTo: scrollView.bottomAnchor, constant: -20),
                      label.widthAnchor.constraint(equalTo: scrollView.widthAnchor, constant: -40),
                  ])
              }
          }
          HEOF

      - name: Generate Source - Onboarding Screen
        run: |
          cd ${{ github.workspace }}
          cat > OnboardingViewController.swift << 'OEOF'
          import UIKit

          final class OnboardingViewController: UIViewController {

              var onFinish: (() -> Void)?

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .souqBackground
                  build()
              }

              private func build() {
                  let emoji = UILabel()
                  emoji.text = "🛍️"
                  emoji.font = .systemFont(ofSize: 64)
                  emoji.textAlignment = .center
                  emoji.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(emoji)

                  let title = UILabel()
                  title.text = "أهلًا بك في سوق"
                  title.font = .systemFont(ofSize: 24, weight: .bold)
                  title.textColor = .souqPrimaryText
                  title.textAlignment = .center
                  title.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(title)

                  let subtitle = UILabel()
                  subtitle.text = "هذا تطبيق عرض تجريبي فقط: كل التطبيقات والبيانات المعروضة وهمية، ولا يتم تنزيل أو تثبيت أي شيء حقيقي. تصفح الرئيسية والتطبيقات، أضف المفضلة، وجرّب الوضع الداكن من الإعدادات."
                  subtitle.font = .systemFont(ofSize: 15)
                  subtitle.textColor = .souqSecondaryText
                  subtitle.numberOfLines = 0
                  subtitle.textAlignment = .center
                  subtitle.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(subtitle)

                  let button = UIButton(type: .system)
                  button.setTitle("ابدأ التصفح", for: .normal)
                  button.titleLabel?.font = .systemFont(ofSize: 16, weight: .bold)
                  button.backgroundColor = .souqPurple
                  button.setTitleColor(.white, for: .normal)
                  button.layer.cornerRadius = 12
                  button.addTarget(self, action: #selector(startTapped), for: .touchUpInside)
                  button.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(button)

                  NSLayoutConstraint.activate([
                      emoji.centerXAnchor.constraint(equalTo: view.centerXAnchor),
                      emoji.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.centerYAnchor, constant: -140),

                      title.topAnchor.constraint(equalTo: emoji.bottomAnchor, constant: 16),
                      title.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 32),
                      title.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -32),

                      subtitle.topAnchor.constraint(equalTo: title.bottomAnchor, constant: 12),
                      subtitle.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 32),
                      subtitle.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -32),

                      button.topAnchor.constraint(equalTo: subtitle.bottomAnchor, constant: 28),
                      button.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 40),
                      button.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -40),
                      button.heightAnchor.constraint(equalToConstant: 48),
                  ])
              }

              @objc private func startTapped() {
                  UserDefaults.standard.set(true, forKey: "souq.onboarding.seen")
                  dismiss(animated: true) { [weak self] in
                      self?.onFinish?()
                  }
              }
          }
          OEOF

      - name: Generate Source - Entry Point (4 Tabs)
        run: |
          cd ${{ github.workspace }}
          cat > main.swift << 'EEOF'
          import UIKit

          // متحكم التبويبات الرئيسي: الرئيسية، التطبيقات، المفضلة، الإعدادات.
          final class SouqTabBarController: UITabBarController, TabSwitching {

              let homeVC = HomeViewController()
              let appsVC = AppsViewController()
              let favoritesVC = FavoritesViewController()
              let settingsVC = SettingsViewController()

              private var favoritesNav: UINavigationController!

              override func viewDidLoad() {
                  super.viewDidLoad()
                  homeVC.tabSwitcher = self

                  let homeNav = UINavigationController(rootViewController: homeVC)
                  let appsNav = UINavigationController(rootViewController: appsVC)
                  favoritesNav = UINavigationController(rootViewController: favoritesVC)
                  let settingsNav = UINavigationController(rootViewController: settingsVC)

                  for nav in [homeNav, appsNav, favoritesNav, settingsNav] {
                      nav.navigationBar.prefersLargeTitles = true
                  }

                  homeNav.tabBarItem = UITabBarItem(title: "الرئيسية", image: UIImage(systemName: "house.fill"), tag: 0)
                  appsNav.tabBarItem = UITabBarItem(title: "التطبيقات", image: UIImage(systemName: "square.grid.2x2.fill"), tag: 1)
                  favoritesNav.tabBarItem = UITabBarItem(title: "المفضلة", image: UIImage(systemName: "heart.fill"), tag: 2)
                  settingsNav.tabBarItem = UITabBarItem(title: "الإعدادات", image: UIImage(systemName: "gearshape.fill"), tag: 3)

                  viewControllers = [homeNav, appsNav, favoritesNav, settingsNav]
                  tabBar.tintColor = .souqPurple

                  NotificationCenter.default.addObserver(
                      self, selector: #selector(updateBadge),
                      name: .favoritesChanged, object: nil
                  )
                  updateBadge()
              }

              @objc private func updateBadge() {
                  let count = FavoritesManager.shared.count
                  favoritesNav.tabBarItem.badgeValue = count > 0 ? "\(count)" : nil
              }

              func switchToSettings() {
                  selectedIndex = 3
              }

              func switchToApps(category: StoreCategory) {
                  appsVC.select(category: category)
                  selectedIndex = 1
                  (viewControllers?[1] as? UINavigationController)?.popToRootViewController(animated: false)
              }
          }

          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              private var tabBarController: SouqTabBarController!

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  tabBarController = SouqTabBarController()
                  window?.rootViewController = tabBarController
                  ThemeManager.apply(to: window)
                  window?.makeKeyAndVisible()

                  if !UserDefaults.standard.bool(forKey: "souq.onboarding.seen") {
                      let onboarding = OnboardingViewController()
                      onboarding.modalPresentationStyle = .fullScreen
                      tabBarController.present(onboarding, animated: false)
                  }

                  return true
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EEOF

