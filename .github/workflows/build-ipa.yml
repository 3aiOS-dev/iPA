              var verified: Bool = false
              var name: String
              var details: String
              var version: String
              var link: String
              var tags: [String] = []
              var date: Date = Date()
          }

          enum VerifyState: String, Codable {
              case none, pending, verified
          }

          // ================= STORE =================
          final class GeamRelsStore: ObservableObject {
              static let shared = GeamRelsStore()

              @Published var reels: [ReelPost] = []
              @Published var tools: [DevTool] = []
