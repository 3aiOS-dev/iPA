      - name: Generate AnimeTheme.swift
        run: |
          cat > AnimeTheme.swift << 'SWIFTEOF'
          import SwiftUI
          import Foundation

          enum AnimeTheme: String, CaseIterable, Identifiable {
              case cyberpunk = "cyberpunk"
              case naruto = "naruto"
              case demonSlayer = "demon_slayer"
              case onePiece = "one_piece"
              case attackOnTitan = "attack_on_titan"

              var id: String { rawValue }

              var displayName: String {
                  switch self {
                  case .cyberpunk: return "سايبربانك ⚡"
                  case .naruto: return "ناروتو 🍥"
                  case .demonSlayer: return "قاتل الشياطين ⚔️"
                  case .onePiece: return "ون بيس ☠️"
                  case .attackOnTitan: return "هجوم العمالقة 🏰"
                  }
              }

              var colors: ThemeColors {
                  switch self {
                  case .cyberpunk:
                      return ThemeColors(
                          primary: Color(hex: "00f0ff"),
                          secondary: Color(hex: "ff00aa"),
                          accent: Color(hex: "ffe600"),
                          background: Color(hex: "0a0a1a"),
                          surface: Color(hex: "12122a"),
                          text: Color(hex: "ffffff"),
                          textSecondary: Color(hex: "8899aa")
                      )
                  case .naruto:
                      return ThemeColors(
                          primary: Color(hex: "ff6b00"),
                          secondary: Color(hex: "ffd700"),
                          accent: Color(hex: "ff4500"),
                          background: Color(hex: "1a0f00"),
                          surface: Color(hex: "2a1a00"),
                          text: Color(hex: "ffffff"),
                          textSecondary: Color(hex: "ccaa88")
                      )
                  case .demonSlayer:
                      return ThemeColors(
                          primary: Color(hex: "00d4ff"),
                          secondary: Color(hex: "ff0066"),
                          accent: Color(hex: "7b2cbf"),
                          background: Color(hex: "0a001a"),
                          surface: Color(hex: "1a0a2a"),
                          text: Color(hex: "ffffff"),
                          textSecondary: Color(hex: "aa88cc")
                      )
                  case .onePiece:
                      return ThemeColors(
                          primary: Color(hex: "ff3333"),
                          secondary: Color(hex: "ffd700"),
                          accent: Color(hex: "0066cc"),
                          background: Color(hex: "001a33"),
                          surface: Color(hex: "0a2a4a"),
                          text: Color(hex: "ffffff"),
                          textSecondary: Color(hex: "88aacc")
                      )
                  case .attackOnTitan:
                      return ThemeColors(
                          primary: Color(hex: "8b0000"),
                          secondary: Color(hex: "daa520"),
                          accent: Color(hex: "2f4f4f"),
                          background: Color(hex: "1a1a1a"),
                          surface: Color(hex: "2a2a2a"),
                          text: Color(hex: "ffffff"),
                          textSecondary: Color(hex: "aaaaaa")
                      )
                  }
              }

              var particleColors: [Color] {
                  [colors.primary, colors.secondary, colors.accent]
              }

              var backgroundGradient: LinearGradient {
                  LinearGradient(
                      colors: [colors.background, colors.surface],
                      startPoint: .top,
                      endPoint: .bottom
                  )
              }
          }

          struct ThemeColors {
              let primary: Color
              let secondary: Color
              let accent: Color
              let background: Color
              let surface: Color
              let text: Color
              let textSecondary: Color
          }

          extension Color {
              init(hex: String) {
                  let hex = hex.trimmingCharacters(in: CharacterSet.alphanumerics.inverted)
                  var int: UInt64 = 0
                  Scanner(string: hex).scanHexInt64(&int)
                  let a, r, g, b: UInt64
                  switch hex.count {
                  case 3:
                      (a, r, g, b) = (255, (int >> 8) * 17, (int >> 4 & 0xF) * 17, (int & 0xF) * 17)
                  case 6:
                      (a, r, g, b) = (255, int >> 16, int >> 8 & 0xFF, int & 0xFF)
                  case 8:
                      (a, r, g, b) = (int >> 24, int >> 16 & 0xFF, int >> 8 & 0xFF, int & 0xFF)
                  default:
                      (a, r, g, b) = (1, 1, 1, 0)
                  }
                  self.init(.sRGB, red: Double(r) / 255, green: Double(g) / 255, blue: Double(b) / 255, opacity: Double(a) / 255)
              }
          }

          @MainActor
          class ThemeManager: ObservableObject {
              @Published var currentTheme: AnimeTheme = .cyberpunk
              @Published var is3DEnabled: Bool = true
              @Published var particleIntensity: Double = 1.0
              @Published var useAnimeFonts: Bool = true

              func setTheme(_ theme: AnimeTheme) {
                  withAnimation(.spring(response: 0.5, dampingFraction: 0.7)) {
                      currentTheme = theme
                  }
                  HapticManager.shared.success()
              }

              func cycleTheme() {
                  let all = AnimeTheme.allCases
                  if let idx = all.firstIndex(of: currentTheme) {
                      let next = all[(idx + 1) % all.count]
                      setTheme(next)
                  }
              }
          }
          SWIFTEOF

      - name: Generate AnimeWebView.swift
        run: |
          cat > AnimeWebView.swift << 'SWIFTEOF'
          import SwiftUI
          import WebKit
          import Combine

          struct AnimeWebView: UIViewRepresentable {
              let htmlName: String
              @ObservedObject var themeManager: ThemeManager
              var onMessage: ((String, String) -> Void)?

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []

                  let userContent = WKUserContentController()
                  userContent.add(context.coordinator, name: "appTap")
                  userContent.add(context.coordinator, name: "download")
                  userContent.add(context.coordinator, name: "share")
                  userContent.add(context.coordinator, name: "themeChange")
                  config.userContentController = userContent

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = context.coordinator
                  webView.isOpaque = false
                  webView.backgroundColor = .clear
                  webView.scrollView.backgroundColor = .clear
                  webView.scrollView.showsVerticalScrollIndicator = false
                  webView.scrollView.showsHorizontalScrollIndicator = false
                  webView.configuration.preferences.javaScriptEnabled = true
                  return webView
              }

              func updateUIView(_ webView: WKWebView, context: Context) {
                  if let url = Bundle.main.url(forResource: htmlName, withExtension: "html", subdirectory: "WebEngine") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
              }

              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }

              class Coordinator: NSObject, WKNavigationDelegate, WKScriptMessageHandler {
                  var parent: AnimeWebView

                  init(_ parent: AnimeWebView) {
                      self.parent = parent
                  }

                  func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                      if let body = message.body as? String {
                          parent.onMessage?(message.name, body)
                      }
                  }

                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                      let theme = parent.themeManager.currentTheme
                      let js = """
                      if (typeof updateTheme === 'function') {
                          updateTheme('\(theme.rawValue)');
                      }
                      """
                      webView.evaluateJavaScript(js, completionHandler: nil)
                  }
              }
          }

          struct Anime3DHomeView: View {
              @EnvironmentObject var themeManager: ThemeManager
              @EnvironmentObject var appsManager: AppsManager
              @State private var showDetail = false
              @State private var selectedAppID: String?

              var body: some View {
                  ZStack {
                      themeManager.currentTheme.backgroundGradient
                          .ignoresSafeArea()

                      AnimeWebView(htmlName: "anime-home", themeManager: themeManager) { msg, body in
                          handleWebMessage(msg, body)
                      }
                      .environmentObject(themeManager)

                      // Overlay particles
                      if themeManager.is3DEnabled {
                          AnimeParticleOverlay()
                              .allowsHitTesting(false)
                      }
                  }
                  .sheet(isPresented: $showDetail) {
                      if let id = selectedAppID,
                         let app = appsManager.apps.first(where: { $0.id.uuidString == id }) {
                          AppDetailView(app: app, downloadManager: DownloadManager())
                      }
                  }
              }

              func handleWebMessage(_ msg: String, _ body: String) {
                  switch msg {
                  case "appTap":
                      selectedAppID = body
                      showDetail = true
                  case "download":
                      if let id = UUID(uuidString: body),
