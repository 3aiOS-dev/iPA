      # 🌐 Anime WebView
      # =========================================================
      - name: 🌐 توليد AnimeWebView.swift
        run: |
          cat > AnimeWebView.swift << 'AWEOF'
          import SwiftUI
          import WebKit

          struct AnimeWebView: UIViewRepresentable {
              let htmlString: String
              @ObservedObject var themeManager: ThemeManager

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.preferences.javaScriptEnabled = true

                  let userContentController = WKUserContentController()
                  userContentController.add(context.coordinator, name: "app")
                  config.userContentController = userContentController

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.backgroundColor = .clear
                  webView.isOpaque = false
                  webView.scrollView.bounces = false
                  webView.navigationDelegate = context.coordinator
                  return webView
              }

              func updateUIView(_ webView: WKWebView, context: Context) {
                  webView.loadHTMLString(htmlString, baseURL: nil)
              }

              func makeCoordinator() -> Coordinator {
                  Coordinator()
              }

              class Coordinator: NSObject, WKNavigationDelegate, WKScriptMessageHandler {
                  func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                      if message.name == "app", let body = message.body as? String {
                          if body == "download" {
                              HapticManager.shared.impact(.heavy)
                          }
                      }
                  }

                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                      // Inject theme colors
                      let js = """
                      document.documentElement.style.setProperty('--primary', '\(ThemeManager.shared.currentTheme.primaryColor.toHex)');
                      """
                      webView.evaluateJavaScript(js, completionHandler: nil)
                  }
              }
          }
          AWEOF

      # =========================================================
      # 🔒 SECURITY VAULT
      # =========================================================
      - name: 🔒 توليد SecurityVault.swift
        run: |
          cat > SecurityVault.swift << 'SVEOF'
          import Foundation
          import LocalAuthentication
          import CryptoKit

          actor SecurityVault {
              static let shared = SecurityVault()
              private let context = LAContext()

              func authenticateWithBiometrics() async -> Bool {
                  var error: NSError?
                  guard context.canEvaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, error: &error) else {
                      return false
                  }
                  do {
                      let success = try await context.evaluatePolicy(
                          .deviceOwnerAuthenticationWithBiometrics,
                          localizedReason: "حماية الشهادات والإعدادات"
                      )
                      return success
                  } catch {
                      return false
                  }
              }

              func encryptData(_ data: Data, using password: String) -> Data? {
                  guard let passwordData = password.data(using: .utf8) else { return nil }
                  let key = SymmetricKey(data: SHA256.hash(data: passwordData))
                  do {
                      let sealedBox = try AES.GCM.seal(data, using: key)
                      return sealedBox.combined
                  } catch {
                      return nil
                  }
              }

              func decryptData(_ data: Data, using password: String) -> Data? {
                  guard let passwordData = password.data(using: .utf8) else { return nil }
                  let key = SymmetricKey(data: SHA256.hash(data: passwordData))
                  do {
                      let sealedBox = try AES.GCM.SealedBox(combined: data)
                      return try AES.GCM.open(sealedBox, using: key)
                  } catch {
                      return nil
                  }
              }

              func secureStore(key: String, data: Data) {
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrAccount as String: key,
                      kSecValueData as String: data,
                      kSecAttrAccessible as String: kSecAttrAccessibleWhenUnlockedThisDeviceOnly
                  ]
                  SecItemDelete(query as CFDictionary)
                  SecItemAdd(query as CFDictionary, nil)
              }

              func secureRetrieve(key: String) -> Data? {
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrAccount as String: key,
                      kSecReturnData as String: true,
                      kSecMatchLimit as String: kSecMatchLimitOne
                  ]
                  var result: AnyObject?
                  SecItemCopyMatching(query as CFDictionary, &result)
                  return result as? Data
              }
          }
          SVEOF

      # =========================================================
      # 👥 SOCIAL HUB
      # =========================================================
      - name: 👥 توليد SocialHub.swift
        run: |
          cat > SocialHub.swift << 'SHEOF'
          import SwiftUI
          import Foundation

          struct SocialProfile: Identifiable, Codable {
              let id: UUID
              var username: String
              var avatarURL: String?
              var bio: String
              var favoriteApps: [UUID]
              var sharedLists: [SharedAppList]
              var followers: Int
              var following: Int
              var joinDate: Date
          }

          struct SharedAppList: Identifiable, Codable {
              let id: UUID
              var name: String
              var apps: [AppItem]
              var createdAt: Date
              var likes: Int
              var isPublic: Bool
          }

          struct Review: Identifiable, Codable {
              let id: UUID
              let userId: UUID
              let appId: UUID
              let rating: Int
              let comment: String
              let date: Date
          }

          @MainActor
          class SocialManager: ObservableObject {
              @Published var currentUser: SocialProfile?
              @Published var reviews: [Review] = []
              @Published var sharedLists: [SharedAppList] = []
              @Published var isLoading = false

              func createProfile(username: String) {
                  currentUser = SocialProfile(
                      id: UUID(),
                      username: username,
                      avatarURL: nil,
                      bio: "",
                      favoriteApps: [],
                      sharedLists: [],
                      followers: 0,
                      following: 0,
                      joinDate: Date()
                  )
                  saveProfile()
              }

              func addReview(appId: UUID, rating: Int, comment: String) {
                  guard let userId = currentUser?.id else { return }
                  let review = Review(
                      id: UUID(),
                      userId: userId,
                      appId: appId,
                      rating: rating,
                      comment: comment,
                      date: Date()
                  )
                  reviews.append(review)
                  saveReviews()
              }

              func createSharedList(name: String, apps: [AppItem], isPublic: Bool) {
                  guard let user = currentUser else { return }
                  var mutableUser = user
                  let list = SharedAppList(
                      id: UUID(),
                      name: name,
                      apps: apps,
                      createdAt: Date(),
                      likes: 0,
                      isPublic: isPublic
                  )
                  mutableUser.sharedLists.append(list)
                  currentUser = mutableUser
                  saveProfile()
              }

              private func saveProfile() {
                  guard let user = currentUser,
                        let data = try? JSONEncoder().encode(user) else { return }
                  UserDefaults.standard.set(data, forKey: "socialProfile")
              }

              private func saveReviews() {
                  guard let data = try? JSONEncoder().encode(reviews) else { return }
                  UserDefaults.standard.set(data, forKey: "appReviews")
