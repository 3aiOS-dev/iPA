                      .frame(width: 54, height: 54)
                      .clipShape(RoundedRectangle(cornerRadius: 13))
                      .overlay(RoundedRectangle(cornerRadius: 13).stroke(Color.white.opacity(0.15), lineWidth: 1))

                      VStack(alignment: .trailing, spacing: 4) {
                          Text(ipa.displayName).font(.system(size: 14, weight: .bold)).lineLimit(1)
                          Text(ipa.bundleID).font(.system(size: 10)).foregroundColor(.gray).lineLimit(1)
