      # =========================================================
      # SOURCE CODE - StoreView.swift (with Arabic RTL, 3 banners, redesigned cards, HTML support)
      # =========================================================
      - name: Generate code - StoreView.swift
        run: |
          cat > StoreView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import ImageIO
          import WebKit

          // MARK: - 3D / HTML ENGINE (WKWebView) =========================
          struct HTMLContentView: UIViewRepresentable {
              let html: String
              var transparent: Bool = true
              var scrollEnabled: Bool = false

              func makeUIView(context: Context) -> WKWebView {
                  let cfg = WKWebViewConfiguration()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []
                  let wv = WKWebView(frame: .zero, configuration: cfg)
                  wv.isOpaque = !transparent
                  wv.backgroundColor = .clear
                  wv.scrollView.backgroundColor = .clear
                  wv.scrollView.isScrollEnabled = scrollEnabled
                  wv.scrollView.bounces = false
                  wv.scrollView.contentInsetAdjustmentBehavior = .never
                  wv.loadHTMLString(html, baseURL: nil)
                  context.coordinator.lastHTML = html
                  return wv
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {
                  if context.coordinator.lastHTML != html {
                      context.coordinator.lastHTML = html
                      uiView.loadHTMLString(html, baseURL: nil)
                  }
              }

              func makeCoordinator() -> Coordinator { Coordinator(html) }
              final class Coordinator {
                  var lastHTML: String
                  init(_ h: String) { lastHTML = h }
              }
          }

          enum HTML3D {
              static func page(_ body: String, _ css: String) -> String {
                  return """
