                        // MARK: - File Import Handler (iOS 16+ FileImporter)
                        private func handleFileImport(_ result: Result<[URL], Error>) {
                            switch result {
                            case .success(let urls):
                                guard let src = urls.first else { return }
                                let accessed = src.startAccessingSecurityScopedResource()
                                defer { if accessed { src.stopAccessingSecurityScopedResource() } }
                                downloadManager.importIPA(from: src)
                                HapticManager.notification(.success)
                            case .failure(let err):
                                HapticManager.notification(.error)
                                print("Import error: \(err)")
                            }
                        }

                        private func install(file: IPAFile) {
                            let url = URL(fileURLWithPath: file.localPath)
                            let bundleID = (file.fileName as NSString).deletingPathExtension
                            InstallEngine.shared.install(ipaURL: url, bundleID: bundleID,
                                                         appName: file.fileName, version: "1.0") { result in
                                switch result {
                                case .success:    HapticManager.notification(.success)
                                case .failure(let e): HapticManager.notification(.error); print("Install error: \(e)")
                                }
                            }
                        }
                    }

