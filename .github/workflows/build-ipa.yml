name: بناء تطبيق 21s Pro Anime Edition (SwiftUI + 3D WebView) - تصميم احترافي متكامل

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      anime_theme:
        description: 'الثيم الأنمي الافتراضي'
        required: true
        default: 'cyberpunk'
        type: choice
        options:
          - cyberpunk
          - naruto
          - demon_slayer
          - one_piece
          - attack_on_titan

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro.anime"
  NEW_APP_NAME: "21s Pro Anime"
  APP_VERSION: "9.0"
  BUILD_NUMBER: "900"
  SWIFT_VERSION: "6.0"
  DEPLOYMENT_TARGET: "16.0"
  ANIME_THEME: ${{ github.event.inputs.anime_theme || 'cyberpunk' }}

jobs:
  # =========================================================
  # STAGE 1: إعداد البيئة وتوليد الأصول
  # =========================================================
  prepare:
    runs-on: macos-latest
    outputs:
      build_id: ${{ steps.vars.outputs.build_id }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Build Metadata
        id: vars
        run: |
          echo "build_id=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "🎌 21s Pro Anime Edition - Build Start"

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer ||           sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcrun --show-sdk-path
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Build Tools & Dependencies
        run: |
          brew untap aws/tap 2>/dev/null || true
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip zsign imagemagick 2>/dev/null || true
          pip3 install --quiet --break-system-packages Pillow numpy 2>/dev/null || pip3 install --quiet Pillow numpy
          command -v ldid || { echo "❌ ldid missing"; exit 1; }
          command -v convert || { echo "⚠️ ImageMagick not found"; }
          echo "✅ Build tools ready"

  # =========================================================
  # STAGE 2: توليد أصول الأنمي والأيقونات والرسومات 3D
  # =========================================================
  generate-assets:
    runs-on: macos-latest
    needs: prepare
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & PIL
        run: |
          pip3 install --quiet --break-system-packages Pillow numpy 2>/dev/null || pip3 install --quiet Pillow numpy

      - name: Generate Anime App Icons (3D Style)
        run: |
          mkdir -p Resources/AnimeAssets/Icons
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFilter, ImageFont
          import math, random

          def hex_to_rgb(h):
              h = h.lstrip('#')
              return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))

          # أنماط ثيمات الأنمي
          themes = {
              'cyberpunk': {'bg': '#0a0a1a', 'primary': '#00f0ff', 'secondary': '#ff00aa', 'accent': '#ffe600'},
              'naruto': {'bg': '#1a0f00', 'primary': '#ff6b00', 'secondary': '#ffd700', 'accent': '#ff4500'},
              'demon_slayer': {'bg': '#0a001a', 'primary': '#00d4ff', 'secondary': '#ff0066', 'accent': '#7b2cbf'},
              'one_piece': {'bg': '#001a33', 'primary': '#ff3333', 'secondary': '#ffd700', 'accent': '#0066cc'},
              'attack_on_titan': {'bg': '#1a1a1a', 'primary': '#8b0000', 'secondary': '#daa520', 'accent': '#2f4f4f'}
          }

          theme = themes.get('${{ env.ANIME_THEME }}', themes['cyberpunk'])

          def make_anime_icon(size, path):
              img = Image.new("RGBA", (size*2, size*2), (0,0,0,0))
              draw = ImageDraw.Draw(img)
              bg = hex_to_rgb(theme['bg'])
              prim = hex_to_rgb(theme['primary'])
              sec = hex_to_rgb(theme['secondary'])
              acc = hex_to_rgb(theme['accent'])

              # خلفية دائرية متدرجة
              for y in range(size*2):
                  for x in range(size*2):
                      dx, dy = x - size, y - size
                      dist = math.sqrt(dx*dx + dy*dy)
                      if dist <= size:
                          ratio = dist / size
                          r = int(bg[0]*(1-ratio) + prim[0]*ratio*0.5)
                          g = int(bg[1]*(1-ratio) + prim[1]*ratio*0.5)
                          b = int(bg[2]*(1-ratio) + prim[2]*ratio*0.5)
                          draw.point((x,y), fill=(r,g,b,255))

              # تأثير هالة نيون
              glow = Image.new("RGBA", (size*2, size*2), (0,0,0,0))
              glow_draw = ImageDraw.Draw(glow)
              for i in range(3):
                  offset = (i+1) * size//10
                  glow_draw.ellipse([size-offset, size-offset, size+offset, size+offset],
                                    outline=(*prim, 80-i*20), width=size//15)
              img = Image.alpha_composite(img, glow)
              draw = ImageDraw.Draw(img)

              # رسم شعار "21" بتأثير 3D أنمي
              try:
                  font_big = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", int(size*0.9))
                  font_small = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", int(size*0.28))
              except:
                  font_big = ImageFont.load_default()
                  font_small = font_big

              # ظل نيون للنص
              for offset in [(3,3), (-3,3), (3,-3), (-3,-3)]:
                  draw.text((size+offset[0], size+offset[1]), "21", font=font_big,
                           fill=(*prim, 120), anchor="mm")

              # النص الرئيسي
              draw.text((size, size), "21", font=font_big, fill=(255,255,255,255), anchor="mm")

              # شارة PRO
              pro_text = "PRO"
              bbox = draw.textbbox((0,0), pro_text, font=font_small)
              pw, ph = bbox[2]-bbox[0], bbox[3]-bbox[1]
              px = size + size//3
              py = size - size//3
              draw.rounded_rectangle([px-size//15, py-size//15, px+pw+size//15, py+ph+size//15],
                                     radius=size//20, fill=(*sec, 230))
              draw.text((px, py), pro_text, font=font_small, fill=(0,0,0,255), anchor="lm")

              # زخرفة أنمي (نجمات صغيرة)
              for _ in range(8):
                  sx = random.randint(size//4, size*7//4)
                  sy = random.randint(size//4, size*7//4)
                  if math.sqrt((sx-size)**2 + (sy-size)**2) < size*0.8:
                      draw.regular_polygon((sx, sy, size//25), 4, fill=(*acc, 200))

              img = img.resize((size, size), Image.LANCZOS)
              img.save(path, "PNG")
              print(f"✅ Generated anime icon: {path} ({size}x{size})")

          sizes = [
              (120, "Resources/AnimeAssets/Icons/AppIcon60x60@2x.png"),
              (180, "Resources/AnimeAssets/Icons/AppIcon60x60@3x.png"),
              (152, "Resources/AnimeAssets/Icons/AppIcon76x76@2x~ipad.png"),
              (167, "Resources/AnimeAssets/Icons/AppIcon83.5x83.5@2x~ipad.png"),
              (1024, "Resources/AnimeAssets/Icons/AppIcon1024x1024.png"),
              (167, "Resources/AnimeAssets/Icons/AppIcon83.5x83.5@2x~ipad.png"),
              (76, "Resources/AnimeAssets/Icons/AppIcon76x76~ipad.png"),
              (40, "Resources/AnimeAssets/Icons/AppIcon40x40.png"),
              (80, "Resources/AnimeAssets/Icons/AppIcon40x40@2x.png"),
              (58, "Resources/AnimeAssets/Icons/AppIcon29x29@2x.png"),
              (87, "Resources/AnimeAssets/Icons/AppIcon29x29@3x.png"),
              (20, "Resources/AnimeAssets/Icons/AppIcon20x20.png"),
              (40, "Resources/AnimeAssets/Icons/AppIcon20x20@2x.png"),
              (60, "Resources/AnimeAssets/Icons/AppIcon20x20@3x.png"),
          ]
          for s, p in sizes:
              make_anime_icon(s, p)

          # توليد صورة Launch Screen أنمي
          launch = Image.new("RGBA", (1290, 2796), hex_to_rgb(theme['bg']))
          ldraw = ImageDraw.Draw(launch)
          # تأثير جزيئات نيون
          for _ in range(100):
              x, y = random.randint(0, 1290), random.randint(0, 2796)
              r = random.randint(2, 6)
              color = random.choice([prim, sec, acc])
              ldraw.ellipse([x-r, y-r, x+r, y+r], fill=(*color, 150))
          # شعار مركزي
          try:
              fnt = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", 200)
              fnt2 = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", 60)
          except:
              fnt = ImageFont.load_default()
              fnt2 = fnt
          ldraw.text((645, 1200), "21s", font=fnt, fill=(255,255,255,255), anchor="mm")
          ldraw.text((645, 1350), "PRO ANIME", font=fnt2, fill=(*prim, 255), anchor="mm")
          ldraw.text((645, 1450), "LOADING...", font=fnt2, fill=(*sec, 200), anchor="mm")
          launch.save("Resources/AnimeAssets/LaunchImage.png", "PNG")
          print("✅ Launch image generated")
          PYEOF
          ls -lh Resources/AnimeAssets/

      - name: Generate Anime Character Assets
        run: |
          mkdir -p Resources/AnimeAssets/Characters
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import math

          def draw_chibi_base(size, filename, colors):
              img = Image.new("RGBA", (size, size), (0,0,0,0))
              d = ImageDraw.Draw(img)
              cx, cy = size//2, size//2 + size//10
              # وجه
              d.ellipse([cx-size//3, cy-size//3, cx+size//3, cy+size//3], fill=colors['skin'])
              # عيون أنمي كبيرة
              eye_y = cy - size//12
              d.ellipse([cx-size//4, eye_y-size//8, cx-size//12, eye_y+size//8], fill=colors['eye'])
              d.ellipse([cx+size//12, eye_y-size//8, cx+size//4, eye_y+size//8], fill=colors['eye'])
              d.ellipse([cx-size//5, eye_y-size//10, cx-size//10, eye_y+size//10], fill=(255,255,255))
              d.ellipse([cx+size//10, eye_y-size//10, cx+size//5, eye_y+size//10], fill=(255,255,255))
              # شعر
              hair_points = []
              for angle in range(0, 360, 20):
                  r = size//2 + size//10 + int(math.sin(angle*3)*size//20)
                  x = cx + int(r * math.cos(math.radians(angle)))
                  y = cy - size//6 + int(r * math.sin(math.radians(angle)) * 0.6)
                  hair_points.append((x,y))
              d.polygon(hair_points, fill=colors['hair'])
              # فم صغير
              d.arc([cx-size//12, cy+size//12, cx+size//12, cy+size//6], 0, 180, fill=(200,100,100), width=2)
              img.save(filename)
              print(f"Generated {filename}")

          characters = [
              {'name': 'hero', 'skin': (255,220,180), 'eye': (100,200,255), 'hair': (50,50,80)},
              {'name': 'mage', 'skin': (255,230,200), 'eye': (255,100,200), 'hair': (120,50,150)},
              {'name': 'ninja', 'skin': (255,210,170), 'eye': (255,50,50), 'hair': (30,30,30)},
          ]
          for char in characters:
              draw_chibi_base(512, f"Resources/AnimeAssets/Characters/{char['name']}.png", char)
          PYEOF

      - name: Upload Anime Assets
        uses: actions/upload-artifact@v4
        with:
          name: anime-assets-${{ needs.prepare.outputs.build_id }}
          path: Resources/AnimeAssets/
          retention-days: 1

  # =========================================================
  # STAGE 3: توليد محرك Three.js 3D Anime
  # =========================================================
  generate-web-engine:
    runs-on: macos-latest
    needs: prepare
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Three.js 3D Anime Engine
        run: |
          mkdir -p Resources/WebEngine
          cat > Resources/WebEngine/anime-3d-engine.js << 'JSEOF'
          // ============================================
          // 21s Pro Anime 3D Engine - Three.js
          // ============================================
          class Anime3DEngine {
              constructor(containerId, theme = 'cyberpunk') {
                  this.container = document.getElementById(containerId);
                  this.theme = theme;
                  this.scene = new THREE.Scene();
                  this.camera = new THREE.PerspectiveCamera(75, this.container.clientWidth / this.container.clientHeight, 0.1, 1000);
                  this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                  this.init();
              }

              init() {
                  this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
                  this.renderer.setPixelRatio(window.devicePixelRatio);
                  this.renderer.shadowMap.enabled = true;
                  this.container.appendChild(this.renderer.domElement);

                  this.camera.position.z = 5;
                  this.setupLights();
                  this.createAnimeScene();
                  this.animate();
                  window.addEventListener('resize', () => this.onResize());
              }

              setupLights() {
                  const ambient = new THREE.AmbientLight(0x404040, 2);
                  this.scene.add(ambient);
                  const dirLight = new THREE.DirectionalLight(0x00f0ff, 1);
                  dirLight.position.set(5, 5, 5);
                  dirLight.castShadow = true;
                  this.scene.add(dirLight);
                  const pointLight = new THREE.PointLight(0xff00aa, 2, 10);
                  pointLight.position.set(-3, 2, 3);
                  this.scene.add(pointLight);
              }

              createAnimeScene() {
                  // كرة طاقة أنمي (Anime Energy Sphere)
                  const sphereGeo = new THREE.IcosahedronGeometry(1.5, 4);
                  const sphereMat = new THREE.MeshPhongMaterial({
                      color: 0x00f0ff,
                      emissive: 0x0044aa,
                      specular: 0xffffff,
                      shininess: 100,
                      transparent: true,
                      opacity: 0.9,
                      wireframe: false
                  });
                  this.energySphere = new THREE.Mesh(sphereGeo, sphereMat);
                  this.energySphere.castShadow = true;
                  this.scene.add(this.energySphere);

                  // حلقات طاقة دوارة
                  this.rings = [];
                  for (let i = 0; i < 3; i++) {
                      const ringGeo = new THREE.TorusGeometry(2 + i * 0.5, 0.02, 16, 100);
                      const ringMat = new THREE.MeshBasicMaterial({
                          color: i === 0 ? 0xff00aa : i === 1 ? 0x00f0ff : 0xffe600,
                          transparent: true,
                          opacity: 0.6
                      });
                      const ring = new THREE.Mesh(ringGeo, ringMat);
                      ring.rotation.x = Math.PI / 2 + i * 0.5;
                      this.rings.push(ring);
                      this.scene.add(ring);
                  }

                  // جزيئات عائمة
                  const particlesGeo = new THREE.BufferGeometry();
                  const particleCount = 200;
                  const posArray = new Float32Array(particleCount * 3);
                  for (let i = 0; i < particleCount * 3; i++) {
                      posArray[i] = (Math.random() - 0.5) * 10;
                  }
                  particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                  const particlesMat = new THREE.PointsMaterial({
                      size: 0.05,
                      color: 0xffffff,
                      transparent: true,
                      opacity: 0.8
                  });
                  this.particles = new THREE.Points(particlesGeo, particlesMat);
                  this.scene.add(this.particles);

                  // شخصية أنمي مبسطة (مجسم هندسي)
                  this.createChibiCharacter();
              }

              createChibiCharacter() {
                  const group = new THREE.Group();

                  // رأس
                  const headGeo = new THREE.SphereGeometry(0.6, 32, 32);
                  const headMat = new THREE.MeshPhongMaterial({ color: 0xffdbac });
                  const head = new THREE.Mesh(headGeo, headMat);
                  head.position.y = 1.2;
                  group.add(head);

                  // عيون
                  const eyeGeo = new THREE.SphereGeometry(0.12, 16, 16);
                  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00aaff });
                  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                  leftEye.position.set(-0.2, 1.25, 0.5);
                  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                  rightEye.position.set(0.2, 1.25, 0.5);
                  group.add(leftEye, rightEye);

                  // شعر
                  const hairGeo = new THREE.SphereGeometry(0.65, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2);
                  const hairMat = new THREE.MeshPhongMaterial({ color: 0x3366ff });
                  const hair = new THREE.Mesh(hairGeo, hairMat);
                  hair.position.y = 1.25;
                  group.add(hair);

                  // جسم
                  const bodyGeo = new THREE.CylinderGeometry(0.3, 0.4, 0.8, 16);
                  const bodyMat = new THREE.MeshPhongMaterial({ color: 0x222244 });
                  const body = new THREE.Mesh(bodyGeo, bodyMat);
                  body.position.y = 0.4;
                  group.add(body);

                  group.position.set(2, -0.5, 0);
                  group.scale.set(0.8, 0.8, 0.8);
                  this.character = group;
                  this.scene.add(group);
              }

              animate() {
                  requestAnimationFrame(() => this.animate());
                  const time = Date.now() * 0.001;

                  // دوران الكرة
                  this.energySphere.rotation.y += 0.01;
                  this.energySphere.rotation.x += 0.005;
                  this.energySphere.scale.setScalar(1 + Math.sin(time * 2) * 0.05);

                  // دوران الحلقات
                  this.rings.forEach((ring, i) => {
                      ring.rotation.z += 0.01 * (i + 1);
                      ring.rotation.x = Math.PI / 2 + Math.sin(time + i) * 0.2;
                  });

                  // حركة الجزيئات
                  this.particles.rotation.y += 0.002;

                  // حركة الشخصية
                  if (this.character) {
                      this.character.position.y = -0.5 + Math.sin(time * 2) * 0.1;
                      this.character.rotation.y = Math.sin(time * 0.5) * 0.3;
                  }

                  this.renderer.render(this.scene, this.camera);
              }

              onResize() {
                  this.camera.aspect = this.container.clientWidth / this.container.clientHeight;
                  this.camera.updateProjectionMatrix();
                  this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
              }
          }

          // Anime Particle System
          class AnimeParticles {
              constructor(canvas) {
                  this.canvas = canvas;
                  this.ctx = canvas.getContext('2d');
                  this.particles = [];
                  this.resize();
                  window.addEventListener('resize', () => this.resize());
                  this.init();
              }
              resize() {
                  this.canvas.width = this.canvas.parentElement.clientWidth;
                  this.canvas.height = this.canvas.parentElement.clientHeight;
              }
              init() {
                  for (let i = 0; i < 50; i++) {
                      this.particles.push({
                          x: Math.random() * this.canvas.width,
                          y: Math.random() * this.canvas.height,
                          vx: (Math.random() - 0.5) * 0.5,
                          vy: (Math.random() - 0.5) * 0.5,
                          size: Math.random() * 3 + 1,
                          color: `hsl(${Math.random() * 60 + 180}, 100%, 70%)`
                      });
                  }
                  this.animate();
              }
              animate() {
                  this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                  this.particles.forEach(p => {
                      p.x += p.vx;
                      p.y += p.vy;
                      if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                      if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
                      this.ctx.beginPath();
                      this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                      this.ctx.fillStyle = p.color;
                      this.ctx.shadowBlur = 10;
                      this.ctx.shadowColor = p.color;
                      this.ctx.fill();
                  });
                  requestAnimationFrame(() => this.animate());
              }
          }

          // Anime UI Effects
          class AnimeUI {
              static glitch(element) {
                  const original = element.innerText;
                  const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789';
                  let iterations = 0;
                  const interval = setInterval(() => {
                      element.innerText = original.split('').map((char, idx) => {
                          if (idx < iterations) return original[idx];
                          return chars[Math.floor(Math.random() * chars.length)];
                      }).join('');
                      if (iterations >= original.length) clearInterval(interval);
                      iterations += 1/3;
                  }, 30);
              }

              static pulseGlow(element) {
                  element.style.animation = 'animePulse 2s infinite';
              }
          }

          // CSS Animation Injector
          const style = document.createElement('style');
          style.textContent = `
              @keyframes animePulse {
                  0%, 100% { box-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff; }
                  50% { box-shadow: 0 0 20px #ff00aa, 0 0 40px #ff00aa; }
              }
              @keyframes float {
                  0%, 100% { transform: translateY(0px); }
                  50% { transform: translateY(-10px); }
              }
              .anime-card {
                  background: rgba(10, 10, 30, 0.8);
                  border: 1px solid rgba(0, 240, 255, 0.3);
                  border-radius: 16px;
                  backdrop-filter: blur(10px);
                  transition: all 0.3s ease;
              }
              .anime-card:hover {
                  border-color: #ff00aa;
                  box-shadow: 0 0 20px rgba(255, 0, 170, 0.3);
                  transform: translateY(-2px);
              }
              .anime-text {
                  background: linear-gradient(90deg, #00f0ff, #ff00aa);
                  -webkit-background-clip: text;
                  -webkit-text-fill-color: transparent;
                  font-weight: bold;
              }
          `;
          document.head.appendChild(style);
          JSEOF

      - name: Generate Anime HTML Templates
        run: |
          mkdir -p Resources/WebEngine
          cat > Resources/WebEngine/anime-home.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>21s Pro Anime</title>
              <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
                  body {
                      background: #0a0a1a;
                      color: #fff;
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                      overflow-x: hidden;
                      min-height: 100vh;
                  }
                  #canvas-container {
                      position: fixed;
                      top: 0; left: 0;
                      width: 100%; height: 100%;
                      z-index: 0;
                      pointer-events: none;
                  }
                  .content {
                      position: relative;
                      z-index: 1;
                      padding: 20px;
                  }
                  .hero {
                      text-align: center;
                      padding: 60px 20px;
                      background: rgba(10,10,30,0.6);
                      border-radius: 24px;
                      margin-bottom: 20px;
                      border: 1px solid rgba(0,240,255,0.2);
                  }
                  .hero h1 {
                      font-size: 2.5em;
                      background: linear-gradient(135deg, #00f0ff, #ff00aa);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      margin-bottom: 10px;
                  }
                  .hero p { color: #8899aa; font-size: 1.1em; }
                  .stats-grid {
