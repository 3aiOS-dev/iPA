      - name: Generate Gamification.swift
        run: |
          cat > Gamification.swift << 'SWIFTEOF'
          import SwiftUI
          import Foundation

          struct UserAchievement: Identifiable, Codable {
              let id: String
              let title: String
              let description: String
              let icon: String
              let colorHex: String
              var isUnlocked: Bool
              var unlockDate: Date?
              var progress: Double
              let target: Double

              var color: Color { Color(hex: colorHex) }
          }

          @MainActor
          class GamificationManager: ObservableObject {
              @Published var achievements: [UserAchievement] = []
              @Published var totalPoints: Int = 0
              @Published var level: Int = 1
              @Published var currentStreak: Int = 0

              init() { loadAchievements() }

              func loadAchievements() {
                  achievements = [
                      UserAchievement(id: "first_download", title: "أول تحميل", description: "حمّل أول تطبيق", icon: "arrow.down.circle.fill", colorHex: "00f0ff", isUnlocked: false, progress: 0, target: 1),
                      UserAchievement(id: "ten_downloads", title: "محترف التحميل", description: "حمّل 10 تطبيقات", icon: "10.circle.fill", colorHex: "ff00aa", isUnlocked: false, progress: 0, target: 10),
                      UserAchievement(id: "first_sign", title: "موقّع مبتدئ", description: "وقّع أول تطبيق", icon: "signature", colorHex: "ffe600", isUnlocked: false, progress: 0, target: 1),
                      UserAchievement(id: "week_streak", title: "متواصل", description: "استخدم التطبيق 7 أيام متتالية", icon: "flame.fill", colorHex: "ff6b00", isUnlocked: false, progress: 0, target: 7),
                      UserAchievement(id: "explorer", title: "مستكشف", description: "تصفح 50 تطبيق", icon: "binoculars.fill", colorHex: "00ff88", isUnlocked: false, progress: 0, target: 50),
                      UserAchievement(id: "collector", title: "جامع الشهادات", description: "استورد 5 شهادات", icon: "lock.shield.fill", colorHex: "7b2cbf", isUnlocked: false, progress: 0, target: 5),
                  ]
                  totalPoints = UserDefaults.standard.integer(forKey: "user_points")
                  level = UserDefaults.standard.integer(forKey: "user_level")
                  if level == 0 { level = 1 }
              }

              func incrementProgress(id: String, amount: Double = 1) {
                  guard let idx = achievements.firstIndex(where: { $0.id == id }) else { return }
                  if achievements[idx].isUnlocked { return }
                  achievements[idx].progress += amount
                  if achievements[idx].progress >= achievements[idx].target {
                      achievements[idx].isUnlocked = true
                      achievements[idx].unlockDate = Date()
                      totalPoints += 100
                      checkLevelUp()
                      save()
                      HapticManager.shared.success()
                  }
              }

              func checkLevelUp() {
                  let newLevel = (totalPoints / 500) + 1
                  if newLevel > level {
                      level = newLevel
                  }
              }

              func save() {
                  UserDefaults.standard.set(totalPoints, forKey: "user_points")
                  UserDefaults.standard.set(level, forKey: "user_level")
              }
          }

          struct AchievementsView: View {
              @StateObject var manager = GamificationManager()
              @EnvironmentObject var themeManager: ThemeManager

              var body: some View {
                  ScrollView {
                      VStack(spacing: 20) {
                          // Level Card
                          ZStack {
                              RoundedRectangle(cornerRadius: 20)
                                  .fill(themeManager.currentTheme.colors.surface)
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 20)
                                          .stroke(themeManager.currentTheme.colors.primary.opacity(0.3), lineWidth: 1)
                                  )
                              VStack(spacing: 12) {
                                  Text("المستوى \(manager.level)")
                                      .font(.system(size: 28, weight: .black))
                                      .foregroundStyle(themeManager.currentTheme.colors.primary)
                                  Text("\(manager.totalPoints) نقطة")
                                      .font(.title3)
                                      .foregroundColor(themeManager.currentTheme.colors.textSecondary)
                                  ProgressView(value: Double(manager.totalPoints % 500), total: 500)
                                      .tint(themeManager.currentTheme.colors.secondary)
                                      .scaleEffect(x: 1, y: 2, anchor: .center)
                              }
                              .padding(20)
                          }
                          .padding(.horizontal)

                          // Achievements Grid
                          LazyVGrid(columns: [GridItem(.flexible()), GridItem(.flexible())], spacing: 12) {
                              ForEach(manager.achievements) { ach in
                                  AchievementCard(achievement: ach)
                              }
                          }
                          .padding(.horizontal)
                      }
                      .padding(.vertical)
                  }
                  .background(themeManager.currentTheme.backgroundGradient.ignoresSafeArea())
              }
          }

          struct AchievementCard: View {
              let achievement: UserAchievement
              @EnvironmentObject var themeManager: ThemeManager

              var body: some View {
                  VStack(spacing: 10) {
                      ZStack {
                          Circle()
                              .fill(achievement.isUnlocked ? achievement.color.opacity(0.2) : Color.gray.opacity(0.1))
                              .frame(width: 60, height: 60)
                          Image(systemName: achievement.icon)
                              .font(.system(size: 28))
                              .foregroundColor(achievement.isUnlocked ? achievement.color : .gray)
                      }
                      Text(achievement.title)
                          .font(.system(size: 14, weight: .bold))
                          .foregroundColor(achievement.isUnlocked ? themeManager.currentTheme.colors.text : .gray)
                      Text(achievement.description)
                          .font(.caption)
                          .foregroundColor(.gray)
                          .multilineTextAlignment(.center)
                      if !achievement.isUnlocked {
                          ProgressView(value: achievement.progress, total: achievement.target)
                              .tint(achievement.color)
                              .scaleEffect(x: 1, y: 1.5)
                      } else {
                          Text("✅ مكتمل")
                              .font(.caption2)
                              .foregroundColor(.green)
                      }
                  }
                  .padding(12)
                  .frame(height: 160)
                  .background(
                      RoundedRectangle(cornerRadius: 16)
                          .fill(themeManager.currentTheme.colors.surface)
                          .overlay(
                              RoundedRectangle(cornerRadius: 16)
                                  .stroke(achievement.isUnlocked ? achievement.color.opacity(0.4) : Color.clear, lineWidth: 2)
                          )
                  )
              }
          }
          SWIFTEOF

