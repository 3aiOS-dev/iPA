      - name: Generate code - DownloadsManager.swift
        run: |
          cat > DownloadsManager.swift << 'VIPEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class DownloadsManager: ObservableObject {
              static let shared = DownloadsManager()
              @Published var queue: [StoreAPIApp] = []
              @Published var completed: [StoreAPIApp] = []
              @Published var isProcessing: Bool = false

              func enqueue(app: StoreAPIApp) {
                  if queue.contains(where: { $0.id == app.id }) { return }
                  queue.insert(app, at: 0)
                  HapticManager.shared.success()
              }
              func clear() { queue.removeAll(); completed.removeAll() }
          }
          VIPEOF

      - name: Generate code - StatusCenter.swift
        run: |
          cat > StatusCenter.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          @MainActor
          final class StatusCenter: ObservableObject {
              static let shared = StatusCenter()
              @Published var isOnline: Bool = true
              @Published var lastError: String? = nil
              private var observer: NSObjectProtocol?
              private init() {}
              func start() {
                  guard observer == nil else { return }
                  observer = NotificationCenter.default.addObserver(
                      forName: UIApplication.didBecomeActiveNotification,
                      object: nil, queue: .main
                  ) { [weak self] _ in
                      self?.isOnline = true
                  }
              }
              func reportError(_ msg: String) { lastError = msg }
          }

          struct StatusOverlayHost: View {
              @ObservedObject private var status = StatusCenter.shared
              var body: some View {
                  Group {
                      if !status.isOnline {
                          VStack {
                              HStack {
                                  Image(systemName: "wifi.slash")
