                  Button {
                      HapticManager.shared.selection()
                  } label: {
                      HStack(spacing: 10) {
                          ZStack {
                              Circle().fill(color.opacity(0.18)).frame(width: 32, height: 32)
                              Image(systemName: icon).font(.system(size: 13, weight: .bold)).foregroundColor(color)
                          }
                          Text(label).font(.system(size: 14, weight: .semibold)).foregroundColor(.storeText)
                          Spacer()
                          Image(systemName: "arrow.up.right.square.fill")
                              .font(.system(size: 13, weight: .semibold))
                              .foregroundColor(.storeSub)
                      }
                      .padding(12)
                      .background(
                          RoundedRectangle(cornerRadius: 12)
                              .fill(Color.storeCard)
                              .overlay(
                                  RoundedRectangle(cornerRadius: 12)
                                      .stroke(Color.storeDivider, lineWidth: 1)
                              )
                      )
                  }
                  .buttonStyle(.plain)
              }
          }

          struct DeactivateAccountView: View {
              @ObservedObject var authManager: AuthManager
              @Binding var isPresented: Bool
              var onDeactivated: () -> Void

              @State private var confirmText: String = ""
              @State private var error: String? = nil

              private let required = "DEACTIVATE"

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 18) {
                              SettingsTopBar(onBack: { isPresented = false }, title: "Deactivate")

                              VStack(spacing: 12) {
                                  ZStack {
                                      Circle()
                                          .fill(Color.storePrimaryDk.opacity(0.18))
                                          .frame(width: 90, height: 90)
                                      Image(systemName: "exclamationmark.triangle.fill")
                                          .font(.system(size: 42))
                                          .foregroundColor(.storePrimaryDk)
                                  }
                                  .padding(.top, 10)

                                  Text("Deactivate your account?")
                                      .font(.system(size: 20, weight: .heavy))
                                      .foregroundColor(.storeText)
                                      .multilineTextAlignment(.center)

                                  Text("This will permanently remove your account and all downloaded files from this device. This action cannot be undone.")
                                      .font(.system(size: 13))
                                      .foregroundColor(.storeSub)
                                      .multilineTextAlignment(.center)
                                      .padding(.horizontal, 24)
                              }

                              VStack(alignment: .leading, spacing: 8) {
                                  Text("What will be deleted:")
                                      .font(.system(size: 12, weight: .bold))
                                      .foregroundColor(.storeText)
                                      .tracking(0.5)
                                  DeactivateBullet(icon: "person.crop.circle.fill", text: "Your account profile")
                                  DeactivateBullet(icon: "arrow.down.circle.fill", text: "All downloaded files")
                              }
                              .padding(16)
                              .background(
                                  RoundedRectangle(cornerRadius: 14)
                                      .fill(Color.storeCard)
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 14)
                                              .stroke(Color.storeDivider, lineWidth: 1)
                                      )
                              )
                              .padding(.horizontal, 20)

                              VStack(alignment: .leading, spacing: 6) {
                                  Text("Type \(required) to confirm")
                                      .font(.system(size: 12, weight: .bold))
                                      .foregroundColor(.storeSub)
                                      .padding(.horizontal, 4)
                                  HStack {
                                      Image(systemName: "keyboard")
                                          .foregroundColor(.storeSub)
                                          .frame(width: 28)
                                      TextField(required, text: $confirmText)
                                          .font(.system(size: 14, weight: .semibold, design: .monospaced))
                                          .foregroundColor(.storeText)
                                          .autocapitalization(.allCharacters)
                                          .disableAutocorrection(true)
                                  }
                                  .padding(12)
                                  .background(
                                      RoundedRectangle(cornerRadius: 12)
                                          .fill(Color.storeCard)
                                          .overlay(
                                              RoundedRectangle(cornerRadius: 12)
                                                  .stroke(confirmText == required ? Color.storePrimaryDk : Color.storeDivider, lineWidth: 1)
                                          )
                                  )
                              }
                              .padding(.horizontal, 20)

                              if let err = error {
                                  HStack(spacing: 6) {
                                      Image(systemName: "exclamationmark.triangle.fill")
                                          .foregroundColor(.xcodeRed)
                                          .font(.system(size: 12))
                                      Text(err).font(.system(size: 12)).foregroundColor(.xcodeRed)
                                      Spacer()
                                  }
                                  .padding(.horizontal, 24)
                              }

                              Button {
                                  performDeactivation()
                              } label: {
                                  Text("Deactivate my account")
                                      .font(.system(size: 15, weight: .bold))
                                      .foregroundColor(.white)
                                      .frame(maxWidth: .infinity)
                                      .frame(height: 50)
                                      .background(Capsule().fill(Color.storePrimaryDk))
                                      .opacity(confirmText == required ? 1.0 : 0.5)
                              }
                              .padding(.horizontal, 20)
                              .disabled(confirmText != required)

                              Button {
                                  isPresented = false
                              } label: {
                                  Text("Cancel")
                                      .font(.system(size: 14, weight: .semibold))
                                      .foregroundColor(.storeSub)
                              }
                              .padding(.top, 4)

                              Spacer(minLength: 30)
                          }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                  }
              }

              private func performDeactivation() {
                  error = nil
                  guard confirmText == required else {
                      error = "Type \(required) to confirm"
                      HapticManager.shared.error()
                      return
                  }
                  let key = AppConstants.userDefaultsKey
                  if let data = UserDefaults.standard.data(forKey: key),
                     var users = try? JSONDecoder().decode([AppUser].self, from: data),
                     let user = authManager.currentUser {
                      users.removeAll { $0.id == user.id }
                      if let encoded = try? JSONEncoder().encode(users) {
                          UserDefaults.standard.set(encoded, forKey: key)
                      }
                  }
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  if let files = try? FileManager.default.contentsOfDirectory(at: docs, includingPropertiesForKeys: nil) {
                      for f in files where f.pathExtension == "ipa" {
                          try? FileManager.default.removeItem(at: f)
                      }
                  }
                  HapticManager.shared.success()
                  authManager.logout()
                  onDeactivated()
              }
          }

          struct DeactivateBullet: View {
              let icon: String
              let text: String
              var body: some View {
                  HStack(spacing: 10) {
                      Image(systemName: icon)
                          .font(.system(size: 12, weight: .bold))
                          .foregroundColor(.storePrimaryDk)
                          .frame(width: 22)
                      Text(text)
                          .font(.system(size: 13))
                          .foregroundColor(.storeSub)
                      Spacer()
                  }
              }
          }
          VIPEOF

      - name: Generate code - StatusScreens.swift (green theme)
        run: |
          cat > StatusScreens.swift << 'STATUSEOF'
          import SwiftUI
          import Network
          import UIKit
          import Foundation

          enum StatusKind: Equatable {
              case ok
              case noInternet
          }

          @MainActor
          final class StatusCenter: ObservableObject {
              static let shared = StatusCenter()

              @Published var kind: StatusKind = .ok
              @Published var hasShownFirstWelcome: Bool = false

              private let monitor = NWPathMonitor()
              private let queue = DispatchQueue(label: "com.21s.status.monitor")
              private var didStart = false

              private init() {}

              func start() {
                  guard !didStart else { return }
                  didStart = true
                  monitor.pathUpdateHandler = { [weak self] path in
                      guard let self else { return }
                      DispatchQueue.main.async {
                          self.evaluate(currentPath: path)
                      }
                  }
                  monitor.start(queue: queue)
                  evaluate(currentPath: monitor.currentPath)
              }

              func refresh() {
                  evaluate(currentPath: monitor.currentPath)
              }

              private func evaluate(currentPath: NWPath) {
                  let online = (currentPath.status == .satisfied)
                  if !online {
                      if kind != .noInternet {
                          HapticManager.shared.error()
                      }
                      kind = .noInternet
                      return
                  }
                  kind = .ok
              }
          }

          struct GifOnlyView: UIViewRepresentable {
              let resourceName: String
              func makeUIView(context: Context) -> UIView {
                  let container = UIView()
                  container.backgroundColor = .clear
                  let imageView = UIImageView()
                  imageView.contentMode = .scaleAspectFit
                  imageView.translatesAutoresizingMaskIntoConstraints = false
                  imageView.clipsToBounds = true
                  container.addSubview(imageView)
                  NSLayoutConstraint.activate([
                      imageView.topAnchor.constraint(equalTo: container.topAnchor),
                      imageView.bottomAnchor.constraint(equalTo: container.bottomAnchor),
                      imageView.leadingAnchor.constraint(equalTo: container.leadingAnchor),
                      imageView.trailingAnchor.constraint(equalTo: container.trailingAnchor)
                  ])
                  if let gif = UIImage.gif(name: resourceName) {
                      imageView.image = gif
                  } else if let png = UIImage.bundled("\(resourceName).png") {
                      imageView.image = png
                  }
                  return container
              }
              func updateUIView(_ uiView: UIView, context: Context) {}
          }

          struct NoInternetScreen: View {
              var onRetry: () -> Void
              @State private var animatePulse = false

              var body: some View {
                  ZStack {
                      Color.white.edgesIgnoringSafeArea(.all)

                      VStack(spacing: 22) {
                          GifOnlyView(resourceName: "no_internet")
                              .frame(width: 240, height: 240)
                              .background(
                                  RoundedRectangle(cornerRadius: 28)
                                      .fill(Color.storeCard)
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 28)
                                              .stroke(Color.storeDivider, lineWidth: 1)
                                      )
                              )
                              .shadow(color: Color.storePrimary.opacity(0.20), radius: 18, y: 6)

                          VStack(spacing: 10) {
                              Text("No Connection")
                                  .font(.system(size: 28, weight: .heavy))
                                  .foregroundColor(.storeText)
                              Text("Looks like you're offline.\nCheck your Wi-Fi or mobile data and try again.")
                                  .font(.system(size: 14, weight: .medium))
                                  .foregroundColor(.storeSub)
                                  .multilineTextAlignment(.center)
                                  .lineSpacing(3)
                          }

                          Button(action: {
                              HapticManager.shared.impact(.medium)
                              onRetry()
                          }) {
                              HStack(spacing: 8) {
                                  Image(systemName: "arrow.clockwise")
                                      .font(.system(size: 14, weight: .bold))
                                  Text("Try Again")
                                      .font(.system(size: 15, weight: .bold))
                              }
                              .foregroundColor(.white)
                              .frame(maxWidth: .infinity)
                              .frame(height: 52)
                              .background(
                                  Capsule().fill(
                                      LinearGradient(colors: [Color.storePrimary, Color.storePrimaryDk],
                                                     startPoint: .leading, endPoint: .trailing)
                                  )
                              )
                              .shadow(color: Color.storePrimary.opacity(0.35), radius: 12, y: 6)
                          }
                          .padding(.horizontal, 40)
                          .padding(.top, 4)
                      }
                      .padding(.horizontal, 24)
                  }
                  .onAppear { animatePulse = true }
              }
          }

          struct StatusOverlayHost: View {
              @ObservedObject var center = StatusCenter.shared

              var body: some View {
                  Group {
                      switch center.kind {
                      case .ok:
                          EmptyView()
                      case .noInternet:
                          NoInternetScreen {
                              HapticManager.shared.impact(.light)
                              center.refresh()
                          }
                          .transition(.opacity.combined(with: .scale(scale: 1.02)))
                      }
                  }
                  .animation(.easeInOut(duration: 0.25), value: center.kind)
              }
          }
          STATUSEOF

      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            Repositories.swift \
            FavoritesStore.swift \
            AuthManager.swift \
            Countries.swift \
            OnboardingView.swift \
            AuthViews.swift \
            StoreView.swift \
            ContentView.swift \
            VIP21StoreApp.swift \
            Settings.swift \
            StatusScreens.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework ImageIO \
            -framework MobileCoreServices \
            -framework Network \
            -framework CFNetwork \
            -framework CoreImage \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA package
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp -X VIP21Store                            build-output/Payload/VIP21Store.app/VIP21Store
          cp -X Resources/Info.plist                  build-output/Payload/VIP21Store.app/Info.plist
          cp -X Resources/AppIcon60x60@2x.png         build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon60x60@3x.png         build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon76x76@2x~ipad.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon1024x1024.png        build-output/Payload/VIP21Store.app/
          cp -X Resources/login_logo.png              build-output/Payload/VIP21Store.app/
          cp -X Resources/register_logo.png           build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding1.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding2.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding3.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/home_banner.gif             build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding1.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding2.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding3.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/settings_onboarding.gif     build-output/Payload/VIP21Store.app/
          cp -X Resources/no_internet.gif             build-output/Payload/VIP21Store.app/
          cp -X Resources/thanks_overlay.gif          build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb1.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb2.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_advanced_onb3.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/tab_home.png                build-output/Payload/VIP21Store.app/
          # (No character images)

          xattr -cr build-output
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          ldid -S build-output/Payload/VIP21Store.app/VIP21Store

          rm -f artifacts/21s.ipa
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete
          xattr -cr build-output/Payload || true
          cd build-output && zip -r -X -q ../artifacts/21s.ipa Payload && cd ..
          ls -lh artifacts/21s.ipa

          if ! unzip -tq artifacts/21s.ipa >/dev/null 2>&1; then
            echo "Error: IPA file is corrupt or invalid."
            exit 1
          fi
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/21s.ipa | head -60
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "== Integrity test =="
          unzip -tq artifacts/21s.ipa > /dev/null
          if unzip -l artifacts/21s.ipa | grep -q "_CodeSignature/CodeResources\|_CodeSignature"; then
            echo "Warning: _CodeSignature found in IPA (should be inside .app, not Payload root)"
          fi
          unzip -p artifacts/21s.ipa Payload/VIP21Store.app/VIP21Store | head -c 4 | xxd | head -1
          echo "IPA is valid, passes zip integrity test, and contains the App Bundle."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Clean-IPA
          path: artifacts/21s.ipa
          retention-days: 90
