                                  Button("إغلاق") { pendingRecovery = false }
                                      .foregroundColor(.vipPurple)
                              }
                          }
                      }
                  }
                  .alert("خطأ في التثبيت", isPresented: $showInstallError) {
                      Button("حسناً", role: .cancel) { }
                  } message: { Text(installErrorMsg) }
              }
          
          
              // ── زر إجراء سريع ──
              func quickActionButton(title: String, icon: String, colors: [Color], action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      HStack(spacing: 8) {
                          Image(systemName: icon).font(.system(size: 14, weight: .semibold))
                          Text(title).font(.system(size: 13, weight: .semibold)).lineLimit(1)
                      }
                      .foregroundColor(.white)
                      .frame(maxWidth: .infinity)
                      .padding(.vertical, 12)
                      .background(
                          RoundedRectangle(cornerRadius: 14)
                              .fill(LinearGradient(colors: colors, startPoint: .topLeading, endPoint: .bottomTrailing))
                              .shadow(color: (colors.first ?? .vipPurple).opacity(0.35), radius: 8, y: 4)
                      )
                  }
              }
          
              // ── قسم العلامات المخصصة ──
              var tagsSection: some View {
                  var tags: [String] {
                      savedTagsCSV.split(separator: ",").map { $0.trimmingCharacters(in: .whitespaces) }.filter { !$0.isEmpty }
                  }
                  return VStack(alignment: .trailing, spacing: 14) {
                      HStack {
                          Spacer()
                          Text("العلامات المخصصة").font(.system(size: 15, weight: .bold))
                          Image(systemName: "tag.fill").foregroundColor(.vipPurple)
                      }
                      HStack(spacing: 8) {
                          Button(action: {
                              let t = tagInput.trimmingCharacters(in: .whitespaces)
                              guard !t.isEmpty else { return }
                              var current = tags
                              if !current.contains(t) { current.append(t) }
                              savedTagsCSV = current.joined(separator: ",")
                              tagInput = ""
                              HapticManager.shared.impact(.light)
                          }) {
                              Image(systemName: "plus.circle.fill").font(.system(size: 24))
                                  .foregroundStyle(LinearGradient(colors: [.vipPurple, .blue],
                                                   startPoint: .top, endPoint: .bottom))
                          }
                          TextField("أضف علامة (مثال: مفضّل، عمل، ألعاب)", text: $tagInput)
                              .font(.system(size: 14)).multilineTextAlignment(.trailing)
                              .padding(.horizontal, 12).padding(.vertical, 10)
                              .background(RoundedRectangle(cornerRadius: 12)
                                  .fill(scheme == .dark ? Color(white: 0.12) : Color(white: 0.96)))
                      }
          
                      if tags.isEmpty {
                          VStack(spacing: 8) {
                              Image(systemName: "tag.slash").font(.system(size: 32)).foregroundColor(.gray.opacity(0.4))
                              Text("لا توجد علامات بعد").font(.system(size: 12)).foregroundColor(.gray)
                          }.frame(maxWidth: .infinity).padding(.vertical, 16)
                      } else {
                          // عرض شبكي مع إمكانية الحذف
                          FlexibleTagsView(tags: tags) { tag in
                              var current = tags
                              current.removeAll { $0 == tag }
                              savedTagsCSV = current.joined(separator: ",")
                          }
                      }
                  }
                  .padding(16).glassCard(radius: 18)
              }
          
              var emptyCertView: some View {
                  VStack(spacing: 16) {
                      Image(systemName: "signature").font(.system(size: 55)).foregroundColor(.gray.opacity(0.4))
                      Text("لا توجد شهادات").font(.system(size: 18, weight: .semibold))
                      Text("أضف شهادة P12 من تبويب الإعدادات").font(.system(size: 13)).foregroundColor(.gray)
                  }.frame(maxWidth: .infinity).padding(.top, 60)
              }
          
              var emptyFilesView: some View {
                  VStack(spacing: 16) {
                      Image(systemName: "doc.badge.plus").font(.system(size: 55)).foregroundColor(.gray.opacity(0.4))
                      Text("لا توجد ملفات IPA").font(.system(size: 18, weight: .semibold))
                      Text("حمّل تطبيقاً أو استورد ملف IPA").font(.system(size: 13)).foregroundColor(.gray)
                  }.frame(maxWidth: .infinity).padding(.top, 60)
              }
          
              func handleInstall(file: IPAFile) { pendingInstallFile = file; showInstallSheet = true }
          
              func performSigning(file: IPAFile, cert: CertificateInfoModel) {
                  let ipaURL = URL(fileURLWithPath: file.localPath)
                  signingProgress = 0.0
                  signingStatus   = "⚙️ جاري التوقيع..."
          
                  certificateManager.signIPA(
                      ipaURL: ipaURL, with: cert,
                      progressHandler: { p, s in
                          DispatchQueue.main.async {
                              signingProgress = p * 0.85   // 0→85% للتوقيع
                              signingStatus   = s
                          }
                      },
                      completion: { result in
                          switch result {
                          case .success(let signed):
                              downloadManager.markAsSigned(file, signedPath: signed.path, certificateId: cert.id)
                              HapticManager.shared.notification(.success)
                              // 🔔 Signing notification
                              NotificationManager.shared.notifySigningComplete(appName: file.fileName, iconURL: nil)
                              // ── تثبيت تلقائي بعد التوقيع ──
                              signingProgress = 0.87
                              signingStatus   = "📲 جاري التثبيت..."
                              let signedURL = URL(fileURLWithPath: signed.path)
                              let signedAppName  = file.fileName.replacingOccurrences(of: ".ipa", with: "")
                              let signedBundleID = "com.vip21.\(signedAppName.lowercased().replacingOccurrences(of: " ", with: ""))"
                              let signedVersion  = (Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String) ?? "1.0"
                              VIP21InstallEngine.shared.install(
                                  ipaURL:   signedURL,
                                  bundleID: signedBundleID,
                                  appName:  signedAppName,
                                  version:  signedVersion,
                                  progressHandler: { p, s in
                                      DispatchQueue.main.async {
                                          signingProgress = 0.87 + p * 0.13   // 87→100% للتثبيت
                                          signingStatus   = s
                                      }
                                  },
                                  completion: { installResult in
                                      DispatchQueue.main.async {
                                          signingProgress = nil
                                          switch installResult {
                                          case .success:
                                              downloadManager.markAsInstalled(
                                                  downloadManager.ipaFiles.first { $0.id == file.id } ?? file,
                                                  method: "InstallEngine"
                                              )
                                              HapticManager.shared.notification(.success)
                                          case .failure(let err):
                                              // فشل التثبيت — اعرض sheet يدوي
                                              pendingInstallFile = downloadManager.ipaFiles.first { $0.id == file.id } ?? file
                                              showInstallSheet   = true
                                              installErrorMsg    = err.localizedDescription
                                          }
                                      }
                                  }
                              )
                          case .failure(let err):
                              DispatchQueue.main.async {
                                  signingProgress = nil
                                  installErrorMsg  = err.localizedDescription
                                  showInstallError = true
                                  HapticManager.shared.notification(.error)
                              }
                          }
                      }
                  )
              }
          
              func shareIPA(file: IPAFile) {
                  // إعادة تشغيل محرك التثبيت مباشرةً بدلاً من Share Sheet
                  let url = URL(fileURLWithPath: file.signedPath ?? file.localPath)
                  let name = file.fileName.replacingOccurrences(of: ".ipa", with: "")
                  let bid  = "com.vip21.\(name.lowercased().replacingOccurrences(of: " ", with: ""))"
                  let ver  = (Bundle.main.infoDictionary?["CFBundleShortVersionString"] as? String) ?? "1.0"
                  VIP21InstallEngine.shared.install(
                      ipaURL:   url,
                      bundleID: bid,
                      appName:  name,
                      version:  ver,
                      progressHandler: { _, _ in },
                      completion:      { _ in }
                  )
              }
          }
          
