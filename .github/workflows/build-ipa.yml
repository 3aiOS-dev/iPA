name: AppStore Previewer - عرض تفاصيل تطبيقات آب ستور

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.apppreviewer.store"
  NEW_APP_NAME:  "AppStore Previewer"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: Maximize build resources
        run: |
          echo "=== Build capacity check ==="
          df -h
          echo "=== macOS resource limits ==="
          ulimit -a
          echo "=== Available CPUs ==="
          sysctl -n hw.ncpu
          echo "=== Available memory ==="
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS - generate app icon and assets
      # =========================================================
      - name: Generate app assets
        run: |
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow 2>/dev/null || true
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          os.makedirs("Resources", exist_ok=True)

          def draw_icon(size, path):
              bg = Image.new("RGBA", (size, size), (10, 50, 28, 255))
              d = ImageDraw.Draw(bg)
              # Rounded rect background
              d.rounded_rectangle((20, 20, size-20, size-20), radius=size*0.22, fill=(40, 160, 90))
              # Magnifying glass symbol
              cx, cy = size//2, size//2
              r = size * 0.22
              d.ellipse((cx-r, cy-r-10, cx+r, cy+r-10), outline=(255,255,255), width=int(size*0.06))
              d.line((cx+r*0.7, cy+r*0.7-10, cx+r*1.6, cy+r*1.6-10), fill=(255,255,255), width=int(size*0.08))
              # "App" text
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", int(size*0.12))
              except:
                  font = ImageFont.load_default()
              d.text((cx, size-80), "Previewer", font=font, fill=(255,255,255,200), anchor="mm")
              bg.convert("RGB").save(path, "PNG")

          draw_icon(120,  "Resources/AppIcon60x60@2x.png")
          draw_icon(180,  "Resources/AppIcon60x60@3x.png")
          draw_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          draw_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          draw_icon(1024, "Resources/AppIcon1024x1024.png")

          # Also generate a logo for the UI
          logo = Image.new("RGBA", (512, 512), (10, 50, 28, 255))
          d = ImageDraw.Draw(logo)
          d.rounded_rectangle((80, 80, 432, 432), radius=100, fill=(40, 160, 90))
          d.ellipse((190, 140, 322, 272), outline=(255,255,255), width=16)
          d.line((290, 250, 370, 330), fill=(255,255,255), width=20)
          try:
              font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", 48)
          except:
              font = ImageFont.load_default()
          d.text((256, 340), "AppStore\nPreviewer", font=font, fill=(255,255,255,220), anchor="mm", align="center")
          logo.convert("RGB").save("Resources/app_logo.png", "PNG")
          print("Assets generated.")
          PYEOF
          ls -lh Resources

      - name: Generate Info.plist
        run: |
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>     <string>ar</string>
              <key>CFBundleExecutable</key>            <string>AppPreviewer</string>
              <key>CFBundleIdentifier</key>            <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
              <key>CFBundleName</key>                  <string>AppStore Previewer</string>
              <key>CFBundleDisplayName</key>           <string>AppStore Previewer</string>
              <key>CFBundlePackageType</key>           <string>APPL</string>
              <key>CFBundleSignature</key>             <string>????</string>
              <key>CFBundleShortVersionString</key>    <string>1.0</string>
              <key>CFBundleVersion</key>               <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key>             <true/>
              <key>MinimumOSVersion</key>               <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
              </array>
              <key>CFBundleIconFile</key>              <string>AppIcon60x60</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon60x60@3x.png</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>UIPrerenderedIcon</key><false/>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon76x76@2x~ipad.png</string>
                          <string>AppIcon83.5x83.5@2x~ipad.png</string>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76</string>
                          <string>AppIcon83.5x83.5</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>UIPrerenderedIcon</key><false/>
                  </dict>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiresFullScreen</key>          <true/>
              <key>UIStatusBarHidden</key>             <false/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key><false/>
              </dict>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
              <key>UIUserInterfaceStyle</key>
              <string>Light</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PEOF

      # =========================================================
      # SOURCE CODE - Models.swift
      # =========================================================
      - name: Generate code - Models.swift
        run: |
          cat > Models.swift << 'MODEOF'
          import Foundation

          // MARK: - iTunes API Response Models
          struct iTunesResponse: Codable {
              let resultCount: Int
              let results: [iTunesApp]
          }

          struct iTunesApp: Codable, Identifiable {
              let id: Int
              let trackId: Int
              let trackName: String
              let bundleId: String?
              let version: String?
              let description: String?
              let releaseNotes: String?
              let sellerName: String?
              let artistName: String?
              let price: Double?
              let currency: String?
              let formattedPrice: String?
              let averageUserRating: Double?
              let userRatingCount: Int?
              let artworkUrl60: String?
              let artworkUrl100: String?
              let artworkUrl512: String?
              let screenshotUrls: [String]?
              let ipadScreenshotUrls: [String]?
              let appletvScreenshotUrls: [String]?
              let genreNames: [String]?
              let primaryGenreName: String?
              let trackCensoredName: String?
              let trackViewUrl: String?
              let contentAdvisoryRating: String?
              let isGameCenterEnabled: Bool?
              let languageCodesISO2A: [String]?
              let fileSizeBytes: String?
              let minimumOsVersion: String?
              let releaseDate: String?
              let sellerUrl: String?

              enum CodingKeys: String, CodingKey {
                  case id = "trackId"
                  case trackId
                  case trackName
                  case bundleId = "bundleId"
                  case version
                  case description
                  case releaseNotes
                  case sellerName
                  case artistName
                  case price
                  case currency
                  case formattedPrice
                  case averageUserRating
                  case userRatingCount
                  case artworkUrl60
                  case artworkUrl100
                  case artworkUrl512
                  case screenshotUrls
                  case ipadScreenshotUrls
                  case appletvScreenshotUrls
                  case genreNames = "genres"
                  case primaryGenreName
                  case trackCensoredName
                  case trackViewUrl
                  case contentAdvisoryRating
                  case isGameCenterEnabled
                  case languageCodesISO2A
                  case fileSizeBytes
                  case minimumOsVersion
                  case releaseDate
                  case sellerUrl
              }

              // Computed property for a clean ID
              var appId: String { String(trackId) }

              // Clean description without HTML
              var cleanDescription: String {
                  guard let desc = description else { return "لا يوجد وصف متاح." }
                  let withoutHTML = desc.replacingOccurrences(of: "<[^>]+>", with: "", options: .regularExpression)
                  return withoutHTML.trimmingCharacters(in: .whitespacesAndNewlines)
              }

              // Size in MB/GB
              var formattedSize: String {
                  guard let sizeStr = fileSizeBytes,
                        let size = Int64(sizeStr) else { return "-" }
                  let formatter = ByteCountFormatter()
                  formatter.allowedUnits = [.useMB, .useGB, .useKB]
                  formatter.countStyle = .file
                  return formatter.string(fromByteCount: size)
              }

              // Rating as stars
              var ratingStars: Int {
                  guard let rating = averageUserRating else { return 0 }
                  return Int(round(rating))
              }

              // Release date formatted
              var formattedReleaseDate: String {
                  guard let dateStr = releaseDate else { return "-" }
                  let formatter = ISO8601DateFormatter()
                  formatter.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
                  guard let date = formatter.date(from: dateStr) else {
                      // Try without fractional seconds
                      let simple = ISO8601DateFormatter()
                      simple.formatOptions = [.withInternetDateTime]
                      guard let d = simple.date(from: dateStr) else { return dateStr }
                      let df = DateFormatter()
                      df.dateStyle = .medium
                      df.locale = Locale(identifier: "ar")
                      return df.string(from: d)
                  }
                  let df = DateFormatter()
                  df.dateStyle = .medium
                  df.locale = Locale(identifier: "ar")
                  return df.string(from: date)
              }

              // App Store URL
              var appStoreURL: String? {
                  trackViewUrl
              }
          }

          // MARK: - History Item
          struct HistoryItem: Codable, Identifiable, Equatable {
              let id: String // app ID
              let appName: String
              let iconURL: String?
              let timestamp: Date

              init(app: iTunesApp) {
                  self.id = app.appId
                  self.appName = app.trackName
                  self.iconURL = app.artworkUrl60
                  self.timestamp = Date()
              }

              static func == (lhs: HistoryItem, rhs: HistoryItem) -> Bool {
                  lhs.id == rhs.id
              }
          }
          MODEOF

      # =========================================================
      # SOURCE CODE - APIService.swift
      # =========================================================
      - name: Generate code - APIService.swift
        run: |
          cat > APIService.swift << 'APISEOF'
          import Foundation
          import Combine

          enum AppStoreError: Error, LocalizedError {
              case invalidURL
              case invalidAppID
              case networkError
              case noResults
              case decodingError

              var errorDescription: String? {
                  switch self {
                  case .invalidURL:
                      return "رابط التطبيق غير صالح"
                  case .invalidAppID:
                      return "تعذر العثور على معرف التطبيق في الرابط"
                  case .networkError:
                      return "حدث خطأ في الشبكة. تحقق من اتصالك بالإنترنت"
                  case .noResults:
                      return "لم يتم العثور على تطبيق بهذا المعرف"
                  case .decodingError:
                      return "حدث خطأ في قراءة البيانات"
                  }
              }
          }

          final class APIService: ObservableObject {
              static let shared = APIService()

              @Published var isLoading: Bool = false
              @Published var error: AppStoreError?
              @Published var currentApp: iTunesApp?
              @Published var history: [HistoryItem] = []

              private let session = URLSession.shared
              private let historyKey = "appstore_previewer_history"
              private let decoder = JSONDecoder()

              private init() {
                  loadHistory()
              }

              // MARK: - URL Parsing
              func extractAppID(from urlString: String) -> String? {
                  // Clean the URL
                  let trimmed = urlString.trimmingCharacters(in: .whitespacesAndNewlines)

                  // Try direct ID if it's just digits
                  if trimmed.allSatisfy({ $0.isNumber }) {
                      return trimmed
                  }

                  // Look for id pattern: /id1234567890 or ?id=1234567890
                  let patterns = [
                      #"/id(\d+)"#,
                      #"id=(\d+)"#,
                      #"id/(\d+)"#,
                      #"id_(\d+)"#,
                      #"=(\d{8,10})"#
                  ]

                  for pattern in patterns {
                      if let regex = try? NSRegularExpression(pattern: pattern, options: []),
                         let match = regex.firstMatch(in: trimmed, options: [], range: NSRange(trimmed.startIndex..., in: trimmed)) {
                          if let range = Range(match.range(at: 1), in: trimmed) {
                              return String(trimmed[range])
                          }
                      }
                  }

                  // Try to find a sequence of 8-10 digits
                  let digitPattern = #"(\d{8,10})"#
                  if let regex = try? NSRegularExpression(pattern: digitPattern, options: []),
                     let match = regex.firstMatch(in: trimmed, options: [], range: NSRange(trimmed.startIndex..., in: trimmed)) {
                      if let range = Range(match.range(at: 1), in: trimmed) {
                          return String(trimmed[range])
                      }
                  }

                  return nil
              }

              // MARK: - Fetch App
              func fetchApp(from urlString: String) async {
                  await MainActor.run {
                      isLoading = true
                      error = nil
                      currentApp = nil
                  }

                  guard let appID = extractAppID(from: urlString) else {
                      await MainActor.run {
                          isLoading = false
                          error = .invalidAppID
                      }
                      return
                  }

                  await fetchApp(byID: appID)
              }

              func fetchApp(byID appID: String) async {
                  let urlString = "https://itunes.apple.com/lookup?id=\(appID)&country=all"
                  guard let url = URL(string: urlString) else {
                      await MainActor.run {
                          isLoading = false
                          error = .invalidURL
                      }
                      return
                  }

                  do {
                      let (data, _) = try await session.data(from: url)

                      let response = try decoder.decode(iTunesResponse.self, from: data)

                      guard let app = response.results.first else {
                          await MainActor.run {
                              isLoading = false
                              error = .noResults
                          }
                          return
                      }

                      await MainActor.run {
                          currentApp = app
                          isLoading = false
                          addToHistory(app)
                      }

                  } catch {
                      await MainActor.run {
                          isLoading = false
                          error = .decodingError
                      }
                  }
              }

              // MARK: - History
              private func addToHistory(_ app: iTunesApp) {
                  let item = HistoryItem(app: app)
                  // Remove if already exists
                  history.removeAll { $0.id == item.id }
                  history.insert(item, at: 0)
                  // Keep last 50
                  if history.count > 50 {
                      history = Array(history.prefix(50))
                  }
                  saveHistory()
              }

              func clearHistory() {
                  history.removeAll()
                  saveHistory()
              }

              private func loadHistory() {
                  guard let data = UserDefaults.standard.data(forKey: historyKey),
                        let items = try? JSONDecoder().decode([HistoryItem].self, from: data) else {
                      return
                  }
                  history = items
              }

              private func saveHistory() {
                  if let data = try? JSONEncoder().encode(history) {
                      UserDefaults.standard.set(data, forKey: historyKey)
                  }
              }
          }
          APISEOF

      # =========================================================
      # SOURCE CODE - ColorTheme.swift
      # =========================================================
      - name: Generate code - ColorTheme.swift
        run: |
          cat > ColorTheme.swift << 'COLOREOF'
          import SwiftUI

          // MARK: - App Theme (Green inspired)
          extension Color {
              // Primary brand colors
              static let appPrimary = Color(red: 0.16, green: 0.62, blue: 0.36)
              static let appPrimaryDark = Color(red: 0.08, green: 0.42, blue: 0.20)
              static let appPrimaryLight = Color(red: 0.30, green: 0.78, blue: 0.45)
              static let appGreen = Color(red: 0.20, green: 0.72, blue: 0.40)
              static let appGreenSoft = Color(red: 0.78, green: 0.92, blue: 0.82)
              static let appYellow = Color(red: 1.00, green: 0.80, blue: 0.35)

              // Background & surfaces
              static let appBg = Color(red: 0.97, green: 0.99, blue: 0.97)
              static let appCard = Color(red: 1.00, green: 1.00, blue: 1.00)
              static let appCardAlt = Color(red: 0.92, green: 0.97, blue: 0.94)

              // Text colors
              static let appText = Color(red: 0.08, green: 0.20, blue: 0.12)
              static let appSubtext = Color(red: 0.36, green: 0.50, blue: 0.40)
              static let appDivider = Color(red: 0.85, green: 0.93, blue: 0.88)

              // Rating star color
              static let starGold = Color(red: 1.00, green: 0.78, blue: 0.20)

              // Gradient
              static let appGradient = LinearGradient(
                  colors: [Color.appGreen, Color.appPrimary, Color.appPrimaryDark],
                  startPoint: .topLeading,
                  endPoint: .bottomTrailing
              )

              static let appGradientSoft = LinearGradient(
                  colors: [Color.appGreenSoft.opacity(0.85), Color.appPrimary.opacity(0.20)],
                  startPoint: .topLeading,
                  endPoint: .bottomTrailing
              )
          }

          // MARK: - Card Modifier
          struct AppCardModifier: ViewModifier {
              var radius: CGFloat = 16
              var padding: CGFloat = 16

              func body(content: Content) -> some View {
                  content
                      .padding(padding)
                      .background(
                          RoundedRectangle(cornerRadius: radius, style: .continuous)
                              .fill(Color.appCard)
                              .shadow(color: Color.black.opacity(0.05), radius: 10, y: 4)
                      )
                      .overlay(
                          RoundedRectangle(cornerRadius: radius, style: .continuous)
                              .stroke(Color.appDivider, lineWidth: 0.8)
                      )
              }
          }

          extension View {
              func appCard(radius: CGFloat = 16, padding: CGFloat = 16) -> some View {
                  modifier(AppCardModifier(radius: radius, padding: padding))
              }
          }

          // MARK: - Haptic Manager
          class HapticManager {
              static let shared = HapticManager()
              private init() {}

              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }

              func success() {
                  UINotificationFeedbackGenerator().notificationOccurred(.success)
              }

              func error() {
                  UINotificationFeedbackGenerator().notificationOccurred(.error)
              }

              func selection() {
                  UISelectionFeedbackGenerator().selectionChanged()
              }
          }
          COLOREOF

      # =========================================================
      # SOURCE CODE - ContentView.swift (Main UI)
      # =========================================================
      - name: Generate code - ContentView.swift
        run: |
          cat > ContentView.swift << 'CONTENTEOF'
          import SwiftUI
          import UIKit

          struct ContentView: View {
              @StateObject private var api = APIService.shared
              @State private var urlInput: String = ""
              @State private var isFocused: Bool = false
              @State private var showingHistory: Bool = false
              @State private var showShareSheet: Bool = false

              // Pasteboard detection
              @State private var clipboardURL: String? = nil

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          VStack(spacing: 20) {
                              // Header
                              headerView

                              // Input area
                              inputArea

                              // Loading
                              if api.isLoading {
                                  loadingView
                              }

                              // Error
                              if let error = api.error {
                                  errorView(error)
                              }

                              // Result
                              if let app = api.currentApp {
                                  appDetailView(app)
                              }

                              // History
                              if !api.history.isEmpty && api.currentApp == nil {
                                  historyView
                              }

                              // Footer
                              footer
                          }
                          .padding(.horizontal, 16)
                          .padding(.bottom, 30)
                      }
                      .background(Color.appBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                      .onAppear {
                          checkClipboard()
                      }
                      .refreshable {
                          if let app = api.currentApp {
                              await api.fetchApp(byID: app.appId)
                          }
                      }
                  }
                  .sheet(isPresented: $showingHistory) {
                      HistoryView(api: api, isPresented: $showingHistory)
                  }
                  .sheet(isPresented: $showShareSheet) {
                      if let app = api.currentApp {
                          ShareSheet(items: [shareText(for: app)])
                      }
                  }
              }

              // MARK: - Header
              private var headerView: some View {
                  HStack(spacing: 12) {
                      ZStack {
                          Circle()
                              .fill(Color.appGradient)
                              .frame(width: 48, height: 48)
                          Image(systemName: "magnifyingglass")
                              .font(.system(size: 20, weight: .bold))
                              .foregroundColor(.white)
                      }
                      VStack(alignment: .leading, spacing: 2) {
                          Text("AppStore Previewer")
                              .font(.system(size: 20, weight: .heavy))
                              .foregroundColor(.appText)
                          Text("عرض تفاصيل أي تطبيق من آب ستور")
                              .font(.system(size: 12, weight: .medium))
                              .foregroundColor(.appSubtext)
                      }
                      Spacer()
                      if !api.history.isEmpty {
                          Button {
                              HapticManager.shared.selection()
                              showingHistory = true
                          } label: {
                              Image(systemName: "clock.arrow.circlepath")
                                  .font(.system(size: 20, weight: .semibold))
                                  .foregroundColor(.appPrimary)
                                  .frame(width: 40, height: 40)
                                  .background(Circle().fill(Color.appPrimary.opacity(0.12)))
                          }
                      }
                  }
                  .padding(.top, 12)
              }

              // MARK: - Input Area
              private var inputArea: some View {
                  VStack(spacing: 10) {
                      HStack(spacing: 8) {
                          // Paste button
                          if let clip = clipboardURL, !clip.isEmpty {
                              Button {
                                  HapticManager.shared.impact(.light)
                                  urlInput = clip
                              } label: {
                                  Image(systemName: "doc.on.clipboard")
                                      .font(.system(size: 14, weight: .bold))
                                      .foregroundColor(.white)
                                      .frame(width: 38, height: 38)
                                      .background(Circle().fill(Color.appPrimary))
                              }
                          }

                          // Text field
                          HStack(spacing: 8) {
                              Image(systemName: "link")
                                  .font(.system(size: 14))
                                  .foregroundColor(.appSubtext)
                              TextField("ألصق رابط التطبيق هنا...", text: $urlInput)
                                  .font(.system(size: 14))
                                  .autocapitalization(.none)
                                  .disableAutocorrection(true)
                                  .onSubmit { fetchApp() }
                              if !urlInput.isEmpty {
                                  Button {
                                      urlInput = ""
                                  } label: {
                                      Image(systemName: "xmark.circle.fill")
                                          .foregroundColor(.appSubtext)
                                          .font(.system(size: 14))
                                  }
                              }
                          }
                          .padding(.horizontal, 14)
                          .padding(.vertical, 10)
                          .background(
                              RoundedRectangle(cornerRadius: 14)
                                  .fill(Color.appCard)
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 14)
                                          .stroke(isFocused ? Color.appPrimary : Color.appDivider, lineWidth: 1.5)
                                  )
                          )
                          .onTapGesture { isFocused = true }

                          // Fetch button
                          Button {
                              HapticManager.shared.impact(.medium)
                              fetchApp()
                          } label: {
                              Image(systemName: "arrow.right.circle.fill")
                                  .font(.system(size: 36))
                                  .foregroundColor(.appPrimary)
                                  .background(Circle().fill(Color.white))
                                  .shadow(color: .black.opacity(0.08), radius: 4, y: 2)
                          }
                          .disabled(urlInput.trimmingCharacters(in: .whitespaces).isEmpty)
                          .opacity(urlInput.trimmingCharacters(in: .whitespaces).isEmpty ? 0.5 : 1.0)
                      }
                  }
                  .padding(.top, 4)
              }

              // MARK: - Loading
              private var loadingView: some View {
                  VStack(spacing: 14) {
                      ProgressView()
                          .progressViewStyle(CircularProgressViewStyle(tint: .appPrimary))
                          .scaleEffect(1.2)
                      Text("جاري البحث عن التطبيق...")
                          .font(.system(size: 13, weight: .medium))
                          .foregroundColor(.appSubtext)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 50)
                  .appCard()
              }

              // MARK: - Error
              private func errorView(_ error: AppStoreError) -> some View {
                  VStack(spacing: 12) {
                      Image(systemName: "exclamationmark.triangle.fill")
                          .font(.system(size: 34))
                          .foregroundColor(.appYellow)
                      Text(error.localizedDescription)
                          .font(.system(size: 14, weight: .semibold))
                          .foregroundColor(.appText)
                          .multilineTextAlignment(.center)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 32)
                  .appCard()
              }

              // MARK: - App Detail View
              private func appDetailView(_ app: iTunesApp) -> some View {
                  VStack(spacing: 0) {
                      // Header with icon and name
                      HStack(spacing: 14) {
                          // Icon
                          if let urlStr = app.artworkUrl100 ?? app.artworkUrl60,
                             let url = URL(string: urlStr) {
                              AsyncImage(url: url) { phase in
                                  if let image = phase.image {
                                      image.resizable().aspectRatio(contentMode: .fit)
                                  } else if phase.error != nil {
                                      Image(systemName: "app.fill")
                                          .font(.system(size: 40))
                                          .foregroundColor(.appSubtext)
                                  } else {
                                      ProgressView()
                                  }
                              }
                              .frame(width: 64, height: 64)
                              .clipShape(RoundedRectangle(cornerRadius: 16))
                              .overlay(
                                  RoundedRectangle(cornerRadius: 16)
                                      .stroke(Color.appDivider, lineWidth: 0.5)
                              )
                          } else {
                              RoundedRectangle(cornerRadius: 16)
                                  .fill(Color.appDivider)
                                  .frame(width: 64, height: 64)
                                  .overlay(
                                      Image(systemName: "app.fill")
                                          .font(.system(size: 30))
                                          .foregroundColor(.appSubtext)
                                  )
                          }

                          VStack(alignment: .leading, spacing: 4) {
                              Text(app.trackName)
                                  .font(.system(size: 17, weight: .bold))
                                  .foregroundColor(.appText)
                                  .lineLimit(2)

                              HStack(spacing: 6) {
                                  Text(app.artistName ?? app.sellerName ?? "مطور غير معروف")
                                      .font(.system(size: 12, weight: .medium))
                                      .foregroundColor(.appSubtext)

                                  if let rating = app.averageUserRating {
                                      HStack(spacing: 2) {
                                          ForEach(0..<5, id: \.self) { i in
                                              Image(systemName: i < Int(rating.rounded()) ? "star.fill" : "star")
                                                  .font(.system(size: 10))
                                                  .foregroundColor(i < Int(rating.rounded()) ? .starGold : .appDivider)
                                          }
                                          if let count = app.userRatingCount {
                                              Text("(\(count))")
                                                  .font(.system(size: 10))
                                                  .foregroundColor(.appSubtext)
                                          }
                                      }
                                  }
                              }
                          }

                          Spacer()
                      }
                      .padding(.bottom, 12)

                      Divider()
                          .background(Color.appDivider)

                      // Details grid
                      LazyVGrid(columns: [
                          GridItem(.flexible()),
                          GridItem(.flexible()),
                          GridItem(.flexible())
                      ], spacing: 12) {
                          detailItem(label: "الإصدار", value: app.version ?? "-")
                          detailItem(label: "الحجم", value: app.formattedSize)
                          detailItem(label: "الحد الأدنى", value: app.minimumOsVersion ?? "-")
                          detailItem(label: "النوع", value: app.primaryGenreName ?? "-")
                          detailItem(label: "السعر", value: app.formattedPrice ?? "مجاناً")
                          detailItem(label: "التحديث", value: app.formattedReleaseDate)
                      }
                      .padding(.vertical, 12)

                      Divider()
                          .background(Color.appDivider)

                      // Description
                      if !app.cleanDescription.isEmpty {
                          VStack(alignment: .leading, spacing: 8) {
                              Text("الوصف")
                                  .font(.system(size: 13, weight: .bold))
                                  .foregroundColor(.appText)

                              Text(app.cleanDescription)
                                  .font(.system(size: 12))
                                  .foregroundColor(.appSubtext)
                                  .lineSpacing(4)
                                  .fixedSize(horizontal: false, vertical: true)
                          }
                          .padding(.vertical, 12)
                      }

                      // Screenshots
                      if let screenshots = app.screenshotUrls, !screenshots.isEmpty {
                          VStack(alignment: .leading, spacing: 8) {
                              Text("لقطات الشاشة")
                                  .font(.system(size: 13, weight: .bold))
                                  .foregroundColor(.appText)

                              ScrollView(.horizontal, showsIndicators: false) {
                                  HStack(spacing: 10) {
                                      ForEach(Array(screenshots.prefix(5).enumerated()), id: \.offset) { _, urlStr in
                                          if let url = URL(string: urlStr) {
                                              AsyncImage(url: url) { phase in
                                                  if let image = phase.image {
                                                      image.resizable().aspectRatio(contentMode: .fit)
                                                  } else if phase.error != nil {
                                                      RoundedRectangle(cornerRadius: 8)
                                                          .fill(Color.appDivider)
                                                          .frame(width: 100, height: 180)
                                                          .overlay(
                                                              Image(systemName: "photo")
                                                                  .foregroundColor(.appSubtext)
                                                          )
                                                  } else {
                                                      RoundedRectangle(cornerRadius: 8)
                                                          .fill(Color.appDivider)
                                                          .frame(width: 100, height: 180)
                                                          .overlay(ProgressView())
                                                  }
                                              }
                                              .frame(width: 100, height: 180)
                                              .clipShape(RoundedRectangle(cornerRadius: 8))
                                              .overlay(
                                                  RoundedRectangle(cornerRadius: 8)
                                                      .stroke(Color.appDivider, lineWidth: 0.5)
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                          .padding(.vertical, 12)
                      }

                      // Actions
                      HStack(spacing: 12) {
                          Button {
                              HapticManager.shared.impact(.light)
                              showShareSheet = true
                          } label: {
                              Label("مشاركة", systemImage: "square.and.arrow.up")
                                  .font(.system(size: 13, weight: .semibold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity)
                                  .padding(.vertical, 12)
                                  .background(Capsule().fill(Color.appPrimary))
                          }

                          if let url = app.appStoreURL, let appURL = URL(string: url) {
                              Button {
                                  HapticManager.shared.impact(.medium)
                                  UIApplication.shared.open(appURL)
                              } label: {
                                  Label("فتح في آب ستور", systemImage: "arrow.up.right.square")
                                      .font(.system(size: 13, weight: .semibold))
                                      .foregroundColor(.appPrimary)
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 12)
                                      .background(Capsule().fill(Color.appPrimary.opacity(0.12)))
                              }
                          }
                      }
                      .padding(.top, 8)
                  }
                  .padding(16)
                  .appCard()
                  .padding(.top, 4)
              }

              private func detailItem(label: String, value: String) -> some View {
                  VStack(spacing: 3) {
                      Text(value)
                          .font(.system(size: 13, weight: .bold))
                          .foregroundColor(.appText)
                          .lineLimit(1)
                          .minimumScaleFactor(0.7)
                      Text(label)
                          .font(.system(size: 10, weight: .medium))
                          .foregroundColor(.appSubtext)
                  }
                  .frame(maxWidth: .infinity)
              }

              // MARK: - History View
              private var historyView: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack {
                          Text("سجل البحث")
                              .font(.system(size: 14, weight: .bold))
                              .foregroundColor(.appText)
                          Spacer()
                          Button {
                              HapticManager.shared.selection()
                              showingHistory = true
                          } label: {
                              Text("عرض الكل")
                                  .font(.system(size: 12, weight: .semibold))
                                  .foregroundColor(.appPrimary)
                          }
                      }

                      ScrollView(.horizontal, showsIndicators: false) {
                          HStack(spacing: 10) {
                              ForEach(api.history.prefix(10)) { item in
                                  Button {
                                      HapticManager.shared.impact(.light)
                                      Task {
                                          await api.fetchApp(byID: item.id)
                                      }
                                  } label: {
                                      HStack(spacing: 8) {
                                          if let iconURL = item.iconURL,
                                             let url = URL(string: iconURL) {
                                              AsyncImage(url: url) { phase in
                                                  if let image = phase.image {
                                                      image.resizable().aspectRatio(contentMode: .fit)
                                                  } else {
                                                      Image(systemName: "app.fill")
                                                          .foregroundColor(.appSubtext)
                                                  }
                                              }
                                              .frame(width: 28, height: 28)
                                              .clipShape(RoundedRectangle(cornerRadius: 6))
                                          } else {
                                              Image(systemName: "app.fill")
                                                  .foregroundColor(.appSubtext)
                                                  .frame(width: 28, height: 28)
                                          }
                                          Text(item.appName)
                                              .font(.system(size: 12, weight: .semibold))
                                              .foregroundColor(.appText)
                                              .lineLimit(1)
                                      }
                                      .padding(.horizontal, 12)
                                      .padding(.vertical, 8)
                                      .background(
                                          Capsule()
                                              .fill(Color.appCard)
                                              .overlay(
                                                  Capsule()
                                                      .stroke(Color.appDivider, lineWidth: 0.8)
                                              )
                                      )
                                  }
                                  .buttonStyle(.plain)
                              }
                          }
                      }
                  }
                  .padding(.top, 8)
              }

              // MARK: - Footer
              private var footer: some View {
                  VStack(spacing: 6) {
                      Text("ألصق رابط تطبيق من آب ستور للاطلاع على تفاصيله")
                          .font(.system(size: 11, weight: .medium))
                          .foregroundColor(.appSubtext)
                      Text("مثال: https://apps.apple.com/app/id123456789")
                          .font(.system(size: 10))
                          .foregroundColor(.appSubtext.opacity(0.7))
                  }
                  .padding(.top, 10)
              }

              // MARK: - Helpers
              private func fetchApp() {
                  let trimmed = urlInput.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else { return }
                  Task {
                      await api.fetchApp(from: trimmed)
                  }
                  // Dismiss keyboard
                  UIApplication.shared.sendAction(#selector(UIResponder.resignFirstResponder), to: nil, from: nil, for: nil)
                  isFocused = false
              }

              private func checkClipboard() {
                  let pasteboard = UIPasteboard.general
                  if let string = pasteboard.string,
                     !string.isEmpty,
                     (string.contains("apps.apple.com") || string.contains("itunes.apple.com") || string.contains("itunes.com")) {
                      clipboardURL = string
                  } else {
                      clipboardURL = nil
                  }
              }

              private func shareText(for app: iTunesApp) -> String {
                  """
                  📱 \(app.trackName)
                  👤 \(app.artistName ?? app.sellerName ?? "مطور")
                  📦 الإصدار: \(app.version ?? "-")
                  📏 الحجم: \(app.formattedSize)
                  🏷️ النوع: \(app.primaryGenreName ?? "-")
                  ⭐ التقييم: \(String(format: "%.1f", app.averageUserRating ?? 0)) (\(app.userRatingCount ?? 0))
                  📅 التحديث: \(app.formattedReleaseDate)
                  🔗 \(app.appStoreURL ?? "")
                  """
              }
          }

          // MARK: - History View (Sheet)
          struct HistoryView: View {
              @ObservedObject var api: APIService
              @Binding var isPresented: Bool

              var body: some View {
                  NavigationStack {
                      List {
                          if api.history.isEmpty {
                              Text("لا يوجد سجل بحث")
                                  .foregroundColor(.appSubtext)
                                  .frame(maxWidth: .infinity, alignment: .center)
                                  .padding()
                          } else {
                              ForEach(api.history) { item in
                                  Button {
                                      HapticManager.shared.selection()
                                      isPresented = false
                                      Task {
                                          await api.fetchApp(byID: item.id)
                                      }
                                  } label: {
                                      HStack(spacing: 12) {
                                          if let iconURL = item.iconURL,
                                             let url = URL(string: iconURL) {
                                              AsyncImage(url: url) { phase in
                                                  if let image = phase.image {
                                                      image.resizable().aspectRatio(contentMode: .fit)
                                                  } else {
                                                      Image(systemName: "app.fill")
                                                          .foregroundColor(.appSubtext)
                                                  }
                                              }
                                              .frame(width: 40, height: 40)
                                              .clipShape(RoundedRectangle(cornerRadius: 8))
                                          } else {
                                              Image(systemName: "app.fill")
                                                  .foregroundColor(.appSubtext)
                                                  .frame(width: 40, height: 40)
                                          }

                                          VStack(alignment: .leading, spacing: 3) {
                                              Text(item.appName)
                                                  .font(.system(size: 14, weight: .semibold))
                                                  .foregroundColor(.appText)
                                              Text(formatDate(item.timestamp))
                                                  .font(.system(size: 11))
                                                  .foregroundColor(.appSubtext)
                                          }
                                          Spacer()
                                          Image(systemName: "chevron.right")
                                              .font(.system(size: 12))
                                              .foregroundColor(.appSubtext)
                                      }
                                      .padding(.vertical, 4)
                                  }
                                  .buttonStyle(.plain)
                              }
                              .onDelete { indices in
                                  for index in indices {
                                      let item = api.history[index]
                                      api.history.removeAll { $0.id == item.id }
                                  }
                                  api.saveHistory()
                              }
                          }
                      }
                      .navigationTitle("سجل البحث")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarLeading) {
                              Button("إلغاء") {
                                  isPresented = false
                              }
                              .foregroundColor(.appPrimary)
                          }
                          if !api.history.isEmpty {
                              ToolbarItem(placement: .navigationBarTrailing) {
                                  Button("مسح الكل") {
                                      HapticManager.shared.impact(.light)
                                      api.clearHistory()
                                  }
                                  .foregroundColor(.appPrimary)
                              }
                          }
                      }
                  }
              }

              private func formatDate(_ date: Date) -> String {
                  let formatter = DateFormatter()
                  formatter.dateStyle = .short
                  formatter.timeStyle = .short
                  formatter.locale = Locale(identifier: "ar")
                  return formatter.string(from: date)
              }
          }

          // MARK: - Share Sheet
          struct ShareSheet: UIViewControllerRepresentable {
              let items: [Any]

              func makeUIViewController(context: Context) -> UIActivityViewController {
                  let vc = UIActivityViewController(activityItems: items, applicationActivities: nil)
                  return vc
              }

              func updateUIViewController(_ uiViewController: UIActivityViewController, context: Context) {}
          }

          // MARK: - Preview
          #if DEBUG
          struct ContentView_Previews: PreviewProvider {
              static var previews: some View {
                  ContentView()
              }
          }
          #endif
          CONTENTEOF

      # =========================================================
      # SOURCE CODE - AppStorePreviewerApp.swift (Main Entry)
      # =========================================================
      - name: Generate code - AppStorePreviewerApp.swift
        run: |
          cat > AppStorePreviewerApp.swift << 'APPEOF'
          import SwiftUI

          @main
          struct AppStorePreviewerApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environment(\.locale, Locale(identifier: "ar"))
                          .preferredColorScheme(.light)
                  }
              }
          }
          APPEOF

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Models.swift \
            APIService.swift \
            ColorTheme.swift \
            ContentView.swift \
            AppStorePreviewerApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name AppStorePreviewer \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework Combine \
            -framework ImageIO \
            -o AppStorePreviewer
          file AppStorePreviewer

      - name: Create IPA package
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/AppStorePreviewer.app
          cp -X AppStorePreviewer                     build-output/Payload/AppStorePreviewer.app/AppStorePreviewer
          cp -X Resources/Info.plist                  build-output/Payload/AppStorePreviewer.app/Info.plist
          cp -X Resources/AppIcon60x60@2x.png         build-output/Payload/AppStorePreviewer.app/
          cp -X Resources/AppIcon60x60@3x.png         build-output/Payload/AppStorePreviewer.app/
          cp -X Resources/AppIcon76x76@2x~ipad.png    build-output/Payload/AppStorePreviewer.app/
          cp -X Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/AppStorePreviewer.app/
          cp -X Resources/AppIcon1024x1024.png        build-output/Payload/AppStorePreviewer.app/
          cp -X Resources/app_logo.png                build-output/Payload/AppStorePreviewer.app/

          xattr -cr build-output
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          ldid -S build-output/Payload/AppStorePreviewer.app/AppStorePreviewer

          rm -f artifacts/AppStorePreviewer.ipa
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete
          xattr -cr build-output/Payload || true
          cd build-output && zip -r -X -q ../artifacts/AppStorePreviewer.ipa Payload && cd ..
          ls -lh artifacts/AppStorePreviewer.ipa

          if ! unzip -tq artifacts/AppStorePreviewer.ipa >/dev/null 2>&1; then
            echo "Error: IPA file is corrupt or invalid."
            exit 1
          fi
          if ! unzip -l artifacts/AppStorePreviewer.ipa | grep -q "Payload/AppStorePreviewer.app/AppStorePreviewer"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "IPA: $(du -sh artifacts/AppStorePreviewer.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/AppStorePreviewer.ipa | head -60
          if ! unzip -l artifacts/AppStorePreviewer.ipa | grep -q "Payload/AppStorePreviewer.app/AppStorePreviewer"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "== Integrity test =="
          unzip -tq artifacts/AppStorePreviewer.ipa > /dev/null
          echo "IPA is valid, passes zip integrity test, and contains the App Bundle."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppStorePreviewer-IPA
          path: artifacts/AppStorePreviewer.ipa
          retention-days: 90
