          // MARK: - Comments store
          @MainActor
          final class StoreCommentsStore: ObservableObject {
              @Published var comments: [StoreComment] = []
              @Published var isLoading = false
              @Published var isSending = false

              func load(appId: Int) {
                  let base = "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app"
                  guard let url = URL(string: base + "/api/public/store/comments?app=\(appId)") else { return }
                  isLoading = true
                  URLSession.shared.dataTask(with: URLRequest(url: url, timeoutInterval: 25)) { data, _, _ in
                      let list = data.flatMap { try? JSONDecoder().decode(StoreCommentsResponse.self, from: $0).comments } ?? []
                      DispatchQueue.main.async {
                          self.comments = list
                          self.isLoading = false
                      }
                  }.resume()
              }

              func send(appId: Int, text: String, done: @escaping (Bool) -> Void) {
                  let base = "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app"
                  guard let url = URL(string: base + "/api/public/store/comments") else { done(false); return }
                  isSending = true
                  var req = URLRequest(url: url, timeoutInterval: 25)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  let deviceID = UIDevice.current.identifierForVendor?.uuidString ?? "unknown"
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "app_id": appId,
                      "body": text,
                      "udid": deviceID
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      var ok = false
                      if let data = data,
                         let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                          ok = (obj["ok"] as? Bool) == true
                      }
                      DispatchQueue.main.async {
                          self.isSending = false
                          if ok { self.load(appId: appId) }
                          done(ok)
                      }
                  }.resume()
              }
          }

          struct StoreComment: Identifiable, Decodable, Hashable {
              let id: String
              let author: String
              let body: String
              let reply: String?
              let created_at: String?
          }

          struct StoreCommentsResponse: Decodable { let comments: [StoreComment] }

          // MARK: - Status Center
          @MainActor
          final class StatusCenter: ObservableObject {
              static let shared = StatusCenter()
              @Published var kind: StatusKind = .ok
              @Published var toastText: String = ""
              private var toastToken: Int = 0
              private let monitor = NWPathMonitor()
              private let queue = DispatchQueue(label: "com.21s.status.monitor")
              private var didStart = false

              private init() {}

              nonisolated func show(text: String) {
                  Task { @MainActor in
                      StatusCenter.shared.presentToast(text)
                  }
              }

              private func presentToast(_ text: String) {
                  toastText = text
                  toastToken &+= 1
                  let token = toastToken
                  Task { @MainActor in
                      try? await Task.sleep(nanoseconds: 2_600_000_000)
                      if self.toastToken == token {
                          self.toastText = ""
                      }
                  }
              }

              func start() {
                  guard !didStart else { return }
                  didStart = true
                  monitor.pathUpdateHandler = { [weak self] path in
                      guard let self else { return }
                      DispatchQueue.main.async {
                          self.evaluate(currentPath: path)
                      }
                  }
                  monitor.start(queue: queue)
                  evaluate(currentPath: monitor.currentPath)
              }

              func refresh() {
                  evaluate(currentPath: monitor.currentPath)
              }

              private func evaluate(currentPath: NWPath) {
                  let online = (currentPath.status == .satisfied)
                  if !online {
                      kind = .noInternet
                  } else {
                      kind = .ok
                  }
              }
          }

          enum StatusKind { case ok, noInternet }

          // NoInternet overlay
          struct NoInternetScreen: View {
              var onRetry: () -> Void
              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "wifi.slash")
                          .font(.system(size: 60))
                          .foregroundColor(.storeSub)
                      Text("لا يوجد اتصال")
                          .font(.system(size: 22, weight: .bold))
                          .foregroundColor(.storeText)
                      Text("تحقق من شبكة Wi-Fi أو بيانات الجوال ثم حاول مرة أخرى.")
                          .font(.system(size: 14))
                          .foregroundColor(.storeSub)
                          .multilineTextAlignment(.center)
                          .padding(.horizontal, 40)
                      Button(action: onRetry) {
                          HStack(spacing: 8) {
                              Image(systemName: "arrow.clockwise")
                              Text("إعادة المحاولة")
                          }
                          .font(.system(size: 16, weight: .bold))
                          .foregroundColor(.white)
                          .padding(.horizontal, 30).padding(.vertical, 12)
                          .background(Capsule().fill(Color.storePrimary))
                      }
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.storeBg)
              }
          }

          // MARK: - Store Installer
          @MainActor
          final class StoreInstaller: ObservableObject {
              static let shared = StoreInstaller()
              @Published var isWorking: Bool = false
              private init() {}

              func install(app: StoreAPIApp) {
                  guard let urlString = app.resolvedDownloadURL,
                        let url = URL(string: urlString) else {
                      StatusCenter.shared.show(text: "رابط التثبيت غير متاح")
                      return
                  }
                  isWorking = true
                  UIApplication.shared.open(url) { success in
                      DispatchQueue.main.async {
                          self.isWorking = false
                          if !success {
                              StatusCenter.shared.show(text: "تعذر فتح رابط التثبيت")
                          } else {
                              StatusCenter.shared.show(text: "جارٍ التثبيت...")
                          }
                      }
                  }
              }
          }

          // MARK: - Status overlay
          struct StatusOverlayHost: View {
              @ObservedObject var center = StatusCenter.shared
              var body: some View {
                  ZStack {
                      if center.kind == .noInternet {
                          NoInternetScreen(onRetry: { center.refresh() })
                              .transition(.opacity)
                      }
                      if !center.toastText.isEmpty {
                          VStack {
                              Spacer()
                              Text(center.toastText)
                                  .font(.system(size: 14, weight: .semibold))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 18).padding(.vertical, 12)
                                  .background(RoundedRectangle(cornerRadius: 16).fill(Color.black.opacity(0.85)))
                                  .padding(.bottom, 60)
                                  .padding(.horizontal, 24)
                          }
                          .transition(.opacity)
                      }
                  }
                  .animation(.easeInOut(duration: 0.25), value: center.kind)
                  .animation(.easeInOut(duration: 0.25), value: center.toastText)
              }
          }
          STOREVIEWEOF

      - name: Generate code - VIP21StoreApp.swift (no auth, no background tasks)
