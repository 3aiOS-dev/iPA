          retention-days: 1

  # =========================================================
  # STAGE 5: تجميع وبناء IPA النهائي
  # =========================================================
  build:
    runs-on: macos-latest
    needs: [prepare, generate-assets, generate-web-engine, generate-swift-code]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Organize Files
        run: |
          mkdir -p Sources Resources/WebEngine Resources/AnimeAssets
          cp -R artifacts/anime-assets-${{ needs.prepare.outputs.build_id }}/* Resources/AnimeAssets/ || true
          cp -R artifacts/web-engine-${{ needs.prepare.outputs.build_id }}/* Resources/WebEngine/ || true
          cp artifacts/swift-code-${{ needs.prepare.outputs.build_id }}/*.swift Sources/ || true
          ls -R Sources/
          ls -R Resources/

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer ||           sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p

      - name: Install Signing Tools
        run: |
          brew install ldid zip zsign 2>/dev/null || true
          command -v ldid || { echo "❌ ldid missing"; exit 1; }

      - name: Generate Info.plist
        run: |
          mkdir -p Resources
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>ar</string>
              <key>CFBundleExecutable</key><string>VIP21Store</string>
              <key>CFBundleIdentifier</key><string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundleDisplayName</key><string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleSignature</key><string>????</string>
              <key>CFBundleShortVersionString</key><string>${{ env.APP_VERSION }}</string>
              <key>CFBundleVersion</key><string>${{ env.BUILD_NUMBER }}</string>
              <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>16.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key><array><string>AppIcon60x60</string><string>AppIcon76x76</string></array>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>UIPrerenderedIcon</key><false/>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array><string>AppIcon76x76</string><string>AppIcon83.5x83.5</string><string>AppIcon60x60</string></array>
                      <key>CFBundleIconName</key><string>AppIcon</string>
                      <key>UIPrerenderedIcon</key><false/>
                  </dict>
              </dict>
              <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key><string>LaunchBackground</string>
                  <key>UIImageName</key><string>LaunchImage</string>
              </dict>
              <key>UIApplicationSceneManifest</key><dict><key>UIApplicationSupportsMultipleScenes</key><false/></dict>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
              <key>UIBackgroundModes</key><array><string>fetch</string><string>processing</string></array>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UISupportsDocumentBrowser</key><true/>
              <key>UIFileSharingEnabled</key><true/>
              <key>NSCameraUsageDescription</key><string>لمسح رموز QR</string>
              <key>NSPhotoLibraryUsageDescription</key><string>لاستيراد الأيقونات</string>
              <key>NSPhotoLibraryAddUsageDescription</key><string>لحفظ الصور</string>
              <key>NSFaceIDUsageDescription</key><string>لحماية الإعدادات</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key><true/>
                  <key>NSAllowsArbitraryLoadsInWebContent</key><true/>
                  <key>NSAllowsArbitraryLoadsForMedia</key><true/>
              </dict>
              <key>LSApplicationQueriesSchemes</key>
              <array><string>tg</string><string>telegram</string><string>twitter</string><string>whatsapp</string><string>itms-services</string></array>
              <key>CFBundleURLTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeRole</key><string>Editor</string>
                      <key>CFBundleURLName</key><string>${{ env.NEW_BUNDLE_ID }}</string>
                      <key>CFBundleURLSchemes</key><array><string>vip21anime</string></array>
                  </dict>
              </array>
          </dict>
          </plist>
          PEOF

      - name: Build Swift Project
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Building with SDK: $SDK"
          cd Sources
          xcrun swiftc             -sdk "$SDK"             -target arm64-apple-ios16.0             -O -whole-module-optimization             -module-name VIP21Store             -framework SwiftUI -framework UIKit -framework Foundation             -framework UserNotifications -framework UniformTypeIdentifiers             -framework AVFoundation -framework WebKit             -o ../VIP21Store             *.swift
          cd ..
          file VIP21Store || echo "Build may need adjustment"

      - name: Package IPA
        run: |
          rm -rf build-output artifacts
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist build-output/Payload/VIP21Store.app/

          # Copy icons
          if [ -d "Resources/AnimeAssets/Icons" ]; then
            cp Resources/AnimeAssets/Icons/*.png build-output/Payload/VIP21Store.app/
          fi

          # Copy web engine
          if [ -d "Resources/WebEngine" ]; then
            cp -R Resources/WebEngine build-output/Payload/VIP21Store.app/
          fi

          # Copy other resources
          if [ -d "Resources/AnimeAssets" ]; then
            cp -R Resources/AnimeAssets build-output/Payload/VIP21Store.app/
          fi

          # Sign binary
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store

          # Create IPA
          mkdir -p artifacts
          cd build-output && zip -r -q ../artifacts/21s-Pro-Anime-v${{ env.APP_VERSION }}.ipa Payload/ && cd ..

          echo "📦 IPA Created:"
          ls -lh artifacts/
          du -sh artifacts/*.ipa

      - name: Validate IPA
        run: |
          echo "=== IPA Contents ==="
          unzip -l artifacts/21s-Pro-Anime-v${{ env.APP_VERSION }}.ipa | head -40
          if ! unzip -l artifacts/21s-Pro-Anime-v${{ env.APP_VERSION }}.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ Invalid IPA structure"
            exit 1
          fi
          if ! unzip -l artifacts/21s-Pro-Anime-v${{ env.APP_VERSION }}.ipa | grep -q "WebEngine"; then
            echo "⚠️ WebEngine not found in IPA"
          fi
          echo "✅ IPA validation passed"

      - name: Upload Final IPA
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Pro-Anime-v${{ env.APP_VERSION }}-b${{ needs.prepare.outputs.build_id }}
          path: artifacts/*.ipa
          retention-days: 30

      - name: Build Summary
        run: |
          echo "==================================="
          echo "🎌 21s Pro Anime Edition Build Complete"
          echo "==================================="
          echo "Version: ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          echo "Theme: ${{ env.ANIME_THEME }}"
          echo "Build ID: ${{ needs.prepare.outputs.build_id }}"
          echo "Commit: ${{ needs.prepare.outputs.short_sha }}"
          echo "Features:"
          echo "  ✅ 3D Anime Three.js Engine"
          echo "  ✅ HTML/CSS/JS WebViews"
          echo "  ✅ 5 Anime Themes (Cyberpunk, Naruto, Demon Slayer, One Piece, AoT)"
                  echo "  ✅ QR Scanner with Anime UI"
          echo "  ✅ Social Sharing (Telegram, Twitter, WhatsApp)"
          echo "  ✅ Gamification & Achievements"
          echo "  ✅ Particle Effects & Animated Backgrounds"
          echo "  ✅ Dynamic Theme Manager"
          echo "  ✅ Professional IPA Signing"
          echo "==================================="
