      # =========================================================
      # SOURCE CODE - Constants.swift
      # =========================================================
      - name: Generate code - Constants.swift
        run: |
          cat > Constants.swift << 'VIPEOF'
          import SwiftUI

          struct AppConstants {
              static let appVersion = "1.0"
              static let storeName  = "21s"
              static let userDefaultsKey = "21sProUserData"
              static let hasSeenOnboardingKey = "hasSeenOnboarding21s"

              // Massive-store tuning
              static let pageSize              = 50          // 50 apps / page
              static let metadataPageSize      = 200         // page size for full metadata feed
              static let searchDebounceMs      = 250
              static let maxConcurrentChunks   = 6           // parallel chunk streams per download
              static let chunkSizeBytes        = 8 * 1024 * 1024  // 8 MB chunks
              static let diskCacheMaxBytes: Int64 = 1_000_000_000_000  // 1 TB
              static let metadataCacheMaxBytes: Int64 = 256 * 1024 * 1024  // 256 MB
              static let imageCacheMaxBytes: Int64   = 512 * 1024 * 1024  // 512 MB
              static let iconsCacheMaxBytes: Int64   = 128 * 1024 * 1024  // 128 MB
              static let iconCacheMaxEntries         = 4_000

              // Bundled fallback sources
              static let bundledSourcesFileName      = "apps_sources"
          }

          extension Color {
              static let xcodeBackground = Color.white
              static let xcodeEditor     = Color(red: 0.95, green: 0.955, blue: 0.965)
              static let xcodeBlue       = Color(red: 0.11, green: 0.17, blue: 0.30)
              static let xcodeAccent     = Color(red: 0.30, green: 0.43, blue: 0.58)
              static let xcodeGreen      = Color(red: 0.20, green: 0.65, blue: 0.40)
              static let xcodeOrange     = Color(red: 0.90, green: 0.55, blue: 0.20)
              static let xcodeRed        = Color(red: 0.85, green: 0.28, blue: 0.25)
              static let xcodeSecondary  = Color(red: 0.55, green: 0.57, blue: 0.62)
              static let xcodeDivider    = Color(red: 0.90, green: 0.90, blue: 0.93)
              static let storeAccent     = Color(red: 0.30, green: 0.43, blue: 0.58)
          }

          extension UIImage {
              static func bundled(_ filename: String) -> UIImage? {
                  guard let path = Bundle.main.path(forResource: filename, ofType: nil) else { return nil }
                  return UIImage(contentsOfFile: path)
              }
          }
          VIPEOF

      - name: Generate code - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          @preconcurrency import UserNotifications

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  UINotificationFeedbackGenerator().notificationOccurred(type)
              }
              func selection() { UISelectionFeedbackGenerator().selectionChanged() }
              func success() { notification(.success) }
              func error() { notification(.error) }
          }

          struct XcodeCardModifier: ViewModifier {
              var radius: CGFloat = 12
              func body(content: Content) -> some View {
                  content
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(Color.xcodeEditor)
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(Color.xcodeDivider, lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
              }
          }

          extension View {
              func xcodeCard(radius: CGFloat = 12) -> some View {
                  modifier(XcodeCardModifier(radius: radius))
              }
          }

          final class NotificationManager: ObservableObject {
              static let shared = NotificationManager()
              @Published private(set) var permissionGranted: Bool = false

              private init() {}

              nonisolated func requestPermissionIfNeeded() {
                  let center = UNUserNotificationCenter.current()
                  center.getNotificationSettings { settings in
                      switch settings.authorizationStatus {
                      case .notDetermined:
                          center.requestAuthorization(options: [.alert, .badge, .sound]) { granted, _ in
                              DispatchQueue.main.async {
                                  NotificationManager.shared.permissionGranted = granted
                              }
                          }
                      case .authorized, .provisional, .ephemeral:
                          DispatchQueue.main.async { NotificationManager.shared.permissionGranted = true }
                      default:
                          DispatchQueue.main.async { NotificationManager.shared.permissionGranted = false }
                      }
                  }
              }

              nonisolated fileprivate func post(id: String, title: String, body: String, userInfo: [AnyHashable: Any] = [:]) {
                  let content = UNMutableNotificationContent()
                  content.title = title
                  content.body  = body
                  content.sound = .default
                  if !userInfo.isEmpty { content.userInfo = userInfo }
                  let req = UNNotificationRequest(identifier: id, content: content, trigger: nil)
                  UNUserNotificationCenter.current().add(req) { _ in }
              }

              nonisolated func notifyDownloadStarted(appName: String, appId: Int) {
                  post(
                      id: "dl-start-\(appId)",
                      title: "Downloading...",
                      body: "\(appName) - your download has started."
                  )
              }

              nonisolated func notifyDownloadProgress(appName: String, appId: Int, percent: Int) {
                  post(
                      id: "dl-prog-\(appId)",
                      title: "\(appName) - \(percent)%",
                      body: "Download in progress"
                  )
              }

              nonisolated func notifyDownloadCompleted(appName: String, appId: Int) {
                  post(
                      id: "dl-done-\(appId)",
                      title: "Download complete",
                      body: "\(appName) finished downloading. Open Files to install."
                  )
              }

              nonisolated func notifyDownloadFailed(appName: String, appId: Int, reason: String) {
                  post(
                      id: "dl-fail-\(appId)",
                      title: "Download paused",
                      body: "\(appName) - \(reason). Will resume automatically."
                  )
              }

              nonisolated func notifyScreenshotThanks() {
                  post(
                      id: "shot-thanks-\(Int(Date().timeIntervalSince1970))",
                      title: "Thanks for the screenshot!",
                      body: "Share it with your friends to help us grow 🚀"
                  )
              }
          }

          final class ScreenCaptureService: ObservableObject {
              static let shared = ScreenCaptureService()

              @Published var lastScreenshot: UIImage? = nil
              @Published var showThanksOverlay: Bool = false

              private var observer: NSObjectProtocol?

              private init() {}

              func start() {
                  guard observer == nil else { return }
                  observer = NotificationCenter.default.addObserver(
                      forName: UIApplication.userDidTakeScreenshotNotification,
                      object: nil,
                      queue: .main
                  ) { [weak self] _ in
                      guard let self = self else { return }
                      self.lastScreenshot = self.loadLatestScreenshotFromPhotos()
                      self.showThanksOverlay = true
                      HapticManager.shared.success()
                      NotificationManager.shared.notifyScreenshotThanks()
                  }
              }

              func stop() {
                  if let obs = observer {
                      NotificationCenter.default.removeObserver(obs)
                      observer = nil
                  }
              }

              func dismissOverlay() {
                  showThanksOverlay = false
              }

              private func loadLatestScreenshotFromPhotos() -> UIImage? {
                  return nil
              }
          }
          VIPEOF

      # =========================================================
      # SOURCE CODE - MassiveStoreModels.swift
      # Multi-source schema with chunked download support
      # =========================================================
      - name: Generate code - MassiveStoreModels.swift
        run: |
          cat > MassiveStoreModels.swift << 'VIPEOF'
          import Foundation

          // MARK: - Source descriptor
          // Each entry describes one external repository (one of the
          // supported IPA download libraries). Sources can be enabled /
          // disabled at runtime, and the manager rotates through them
          // with health checks.
          struct StoreSource: Codable, Identifiable, Hashable {
              let id: String                // e.g. "apptesters", "iosninja", "appcake"
              let displayName: String        // "AppTesters"
              let homepage: String?
              let metadataURL: String        // primary metadata endpoint
              let fallbackMetadataURLs: [String]
              let priority: Int              // 0 = highest priority
              let enabledByDefault: Bool
              let category: String           // "tweak", "ipa", "jailbreak", "all"
              let expectedAppCount: Int      // 0 = unknown / dynamic

              static let allDefaults: [StoreSource] = []
          }

          // MARK: - Source manifest bundled in the app
          // 21s ships with a small `apps_sources.json` file (a few KB) that
          // tells the app where to fetch metadata from. The metadata itself
          // (5-20 MB) is downloaded lazily on first launch and refreshed
          // every 24 h. The full IPAs are NEVER downloaded up front - they
          // are fetched on demand in 8 MB chunks.
          struct SourceManifest: Codable {
              let version: Int
              let generatedAt: String?
              let sources: [StoreSource]
          }

          // MARK: - MassiveApp (catalog entry)
          // Slim per-app record. A real 20K-app feed is only ~5-20 MB
          // when stored as JSON. We keep this struct lean: 10 fields,
          // no nested heavy data.
          struct MassiveApp: Codable, Identifiable, Hashable {
              let id: String                 // stable hash of (source, bundleId)
              let name: String
              let subtitle: String?
              let bundleId: String?
              let developer: String?
              let category: String?
              let iconURL: String?
              let version: String?
              let sizeBytes: Int64?          // total IPA size in bytes
              let ipaURL: String?            // primary download URL (chunked)
              let source: String             // which library it came from
              let updatedAt: String?
              let rating: Double?            // 0.0 - 5.0
              let downloads: Int64?          // historical downloads
              let requiredOS: String?
              let isPremium: Bool?           // true if from a paid source
              let tags: [String]?
          }

          // MARK: - Metadata envelope
          // A single source returns its full catalog as a JSON object of
          // this shape. `chunkSize` is the recommended chunk size for the
          // chunked downloader (defaults to 8 MB).
          struct MassiveMetadata: Codable {
              let source: String
              let generatedAt: String?
              let chunkSize: Int?
              let totalApps: Int
              let apps: [MassiveApp]

              enum CodingKeys: String, CodingKey {
                  case source
                  case generatedAt = "generated_at"
                  case chunkSize   = "chunk_size"
                  case totalApps   = "total"
                  case apps
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.source       = (try? c.decode(String.self, forKey: .source)) ?? "unknown"
                  self.generatedAt  = try? c.decode(String.self, forKey: .generatedAt)
                  self.chunkSize    = try? c.decode(Int.self,    forKey: .chunkSize)
                  let explicitTotal = try? c.decode(Int.self,    forKey: .totalApps)
                  if let appsArr = try? c.decode([MassiveApp].self, forKey: .apps) {
                      self.apps = appsArr
                  } else {
                      self.apps = []
                  }
                  self.totalApps = explicitTotal ?? self.apps.count
              }
          }

          // MARK: - Chunk descriptor
          // Metadata about one chunk of a single IPA file. Stored in the
          // DownloadManager so that a partially-completed download can be
          // resumed without re-downloading anything that already landed
          // on disk.
          struct DownloadChunk: Codable, Hashable {
              let index: Int
              let offset: Int64
              let length: Int64
              var downloaded: Bool
              var checksum: String?    // optional, used for verification
          }

          // MARK: - Download task
          // One record per app the user starts downloading. Persisted to
          // disk so that a relaunch after a crash resumes everything.
          struct DownloadTask: Codable, Identifiable, Hashable {
              let id: String
              let appId: String
              let appName: String
              let source: String
              let url: String
              let totalSize: Int64
              let chunkSize: Int
              var chunks: [DownloadChunk]
              var status: String      // "queued", "running", "paused", "done", "failed"
              var bytesDownloaded: Int64
              var createdAt: Date
              var updatedAt: Date
              var destinationPath: String?  // local file path
              var lastError: String?

              var percent: Double {
                  guard totalSize > 0 else { return 0 }
                  return min(1.0, Double(bytesDownloaded) / Double(totalSize))
              }
          }
          VIPEOF

      - name: Generate code - Models.swift  (kept for compat)
        run: |
          cat > Models.swift << 'VIPEOF'
          import Foundation

          struct AppUser: Codable {
              let id: UUID
              let phoneNumber: String
              let username: String
              let password: String
              let udid: String
              let createdAt: Date

              init(phoneNumber: String, username: String, password: String, udid: String) {
                  self.id = UUID()
                  self.phoneNumber = phoneNumber
                  self.username = username
                  self.password = password
                  self.udid = udid
                  self.createdAt = Date()
              }
          }

          // Backward-compat type from the original feed. Kept so the
          // existing "old" tab can still load its first-party catalog
          // while the new MassiveStore tab handles the 20K+ feed.
          struct StoreAPIResponse: Codable {
              let lastUpdated: String?
              let apps: [StoreAPIApp]

              enum CodingKeys: String, CodingKey {
                  case lastUpdated = "last_updated"
                  case apps
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.lastUpdated = try? c.decode(String.self, forKey: .lastUpdated)
                  if let arr = try? c.decode([StoreAPIApp].self, forKey: .apps) {
                      self.apps = arr
                      return
                  }
                  struct Envelope: Codable {
                      let success: Bool?
                      let count: Int?
                      let apps: [StoreAPIApp]
                  }
                  if let env = try? c.decode(Envelope.self, forKey: .apps) {
                      self.apps = env.apps
                      return
                  }
                  if let one = try? c.decode(StoreAPIApp.self, forKey: .apps) {
                      self.apps = [one]
                      return
                  }
                  self.apps = []
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encodeIfPresent(lastUpdated, forKey: .lastUpdated)
                  try c.encode(apps, forKey: .apps)
              }
          }

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let bundleVersion: String?
              let ipaSize: String?
              let githubUrl: String?
              let archiveUrl: String?
              let ipaUrl: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let createdAt: String?
              let updatedAt: String?

              let downloadURL: String?
              let down: String?
              let iconURL: String?
              let localizedDescription: String?
              let developerName: String?
              let version: String?
              let versionDate: String?
              let fullDate: String?
              let size: Double?
              let type: Int?

              enum CodingKeys: String, CodingKey {
                  case id, name
                  case bundleId = "bundle_id"
                  case bundleIdAlt = "bundleID"
                  case bundleIdentifier
                  case bundleVersion = "bundle_version"
                  case ipaSize = "ipa_size"
                  case githubUrl = "github_url"
                  case archiveUrl = "archive_url"
                  case ipaUrl = "ipa_url"
                  case host
                  case icon
                  case iconURL
                  case description
                  case localizedDescription
                  case screenshots, category
                  case createdAt = "created_at"
                  case updatedAt = "updated_at"
                  case downloadURL
                  case down
                  case developerName
                  case version
                  case versionDate
                  case fullDate
                  case size, type
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  if let intId = try? c.decode(Int.self, forKey: .id) {
                      self.id = intId
                  } else {
                      let bundle = (try? c.decode(String.self, forKey: .bundleIdAlt))
                          ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                          ?? UUID().uuidString
                      self.id = abs(bundle.hashValue)
                  }
                  self.name = (try? c.decode(String.self, forKey: .name)) ?? "Untitled"
                  self.bundleId = (try? c.decode(String.self, forKey: .bundleId))
                      ?? (try? c.decode(String.self, forKey: .bundleIdAlt))
                      ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                  self.bundleVersion = (try? c.decode(String.self, forKey: .bundleVersion))
                      ?? (try? c.decode(String.self, forKey: .version))
                  self.ipaSize = (try? c.decode(String.self, forKey: .ipaSize))
                  self.githubUrl = (try? c.decode(String.self, forKey: .githubUrl))
                  self.archiveUrl = (try? c.decode(String.self, forKey: .archiveUrl))
                  self.ipaUrl = (try? c.decode(String.self, forKey: .ipaUrl))
                      ?? (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.host = (try? c.decode(String.self, forKey: .host))
                  self.icon = (try? c.decode(String.self, forKey: .icon))
                      ?? (try? c.decode(String.self, forKey: .iconURL))
                  self.description = (try? c.decode(String.self, forKey: .description))
                      ?? (try? c.decode(String.self, forKey: .localizedDescription))
                  self.screenshots = try? c.decode([String].self, forKey: .screenshots)
                  self.category = (try? c.decode(String.self, forKey: .category))
                  self.createdAt = (try? c.decode(String.self, forKey: .createdAt))
                  self.updatedAt = (try? c.decode(String.self, forKey: .updatedAt))
                      ?? (try? c.decode(String.self, forKey: .versionDate))
                      ?? (try? c.decode(String.self, forKey: .fullDate))
                  self.downloadURL = (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.down = (try? c.decode(String.self, forKey: .down))
                  self.iconURL = (try? c.decode(String.self, forKey: .iconURL))
                  self.localizedDescription = (try? c.decode(String.self, forKey: .localizedDescription))
                  self.developerName = (try? c.decode(String.self, forKey: .developerName))
                  self.version = (try? c.decode(String.self, forKey: .version))
                  self.versionDate = (try? c.decode(String.self, forKey: .versionDate))
                  self.fullDate = (try? c.decode(String.self, forKey: .fullDate))
                  self.size = (try? c.decode(Double.self, forKey: .size))
                  self.type = (try? c.decode(Int.self, forKey: .type))
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encode(id, forKey: .id)
                  try c.encode(name, forKey: .name)
                  try c.encodeIfPresent(bundleId, forKey: .bundleId)
                  try c.encodeIfPresent(bundleVersion, forKey: .bundleVersion)
                  try c.encodeIfPresent(ipaSize, forKey: .ipaSize)
                  try c.encodeIfPresent(githubUrl, forKey: .githubUrl)
                  try c.encodeIfPresent(archiveUrl, forKey: .archiveUrl)
                  try c.encodeIfPresent(ipaUrl, forKey: .ipaUrl)
                  try c.encodeIfPresent(host, forKey: .host)
                  try c.encodeIfPresent(icon, forKey: .icon)
                  try c.encodeIfPresent(description, forKey: .description)
                  try c.encodeIfPresent(screenshots, forKey: .screenshots)
                  try c.encodeIfPresent(category, forKey: .category)
                  try c.encodeIfPresent(createdAt, forKey: .createdAt)
                  try c.encodeIfPresent(updatedAt, forKey: .updatedAt)
              }

              var cleanSize: String {
                  if let s = size, s > 0 {
                      let f = ByteCountFormatter()
                      f.allowedUnits = [.useMB, .useGB, .useKB]
                      f.countStyle = .file
                      return f.string(fromByteCount: Int64(s))
                  }
                  if let s = ipaSize, !s.isEmpty { return s }
                  return "-"
              }

              var cleanDescription: String {
                  let raw = description ?? localizedDescription ?? ""
                  if raw.isEmpty {
                      return "Exclusive app on 21s Store - download the premium version with all features enabled."
                  }
                  let lines = raw.split(whereSeparator: { $0.isNewline || $0 == "\r" })
                  return lines.joined(separator: " ").trimmingCharacters(in: .whitespacesAndNewlines)
              }

              var resolvedDownloadURL: String? {
                  return ipaUrl ?? downloadURL ?? down ?? githubUrl ?? archiveUrl
              }
          }
          VIPEOF

      - name: Generate code - AuthManager.swift
        run: |
          cat > AuthManager.swift << 'VIPEOF'
          import SwiftUI
          import Foundation
          import Combine

          @MainActor
          public final class AuthManager: ObservableObject {
              public static let shared = MainActor.assumeIsolated { AuthManager() }

              @Published var currentUser: AppUser?
              @Published var isAuthenticated: Bool = false
              @Published var isLoading: Bool = false
              @Published var errorMessage: String?

              private let userDefaultsKey = AppConstants.userDefaultsKey

              public init() { loadUser() }

              func signUp(phoneNumber: String, username: String, password: String, confirmPassword: String, udid: String) -> Bool {
                  isLoading = true
                  errorMessage = nil

                  let trimmedPhone = phoneNumber.trimmingCharacters(in: .whitespaces)
                  if trimmedPhone.isEmpty {
                      errorMessage = "Phone number is required"; isLoading = false; return false
                  }
                  if !trimmedPhone.hasPrefix("+") {
                      errorMessage = "Phone number must include country code (e.g., +971501234567)"
                      isLoading = false; return false
                  }
                  let digitsOnly = trimmedPhone.dropFirst().filter { $0.isNumber }
                  if digitsOnly.count < 7 {
                      errorMessage = "Please enter a valid phone number (at least 7 digits after country code)"
                      isLoading = false; return false
                  }

                  if username.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Username is required"; isLoading = false; return false
                  }
                  if username.count < 3 {
                      errorMessage = "Username must be at least 3 characters"; isLoading = false; return false
                  }
                  if password.count < 6 {
                      errorMessage = "Password must be at least 6 characters"; isLoading = false; return false
                  }
                  if password != confirmPassword {
                      errorMessage = "Passwords do not match"; isLoading = false; return false
                  }
                  if udid.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Device UDID is required"; isLoading = false; return false
                  }
                  if udid.count < 20 {
                      errorMessage = "Please enter a valid device UDID (at least 20 characters)"; isLoading = false; return false
                  }

                  let existingUsers = loadAllUsers()
                  if existingUsers.contains(where: { $0.phoneNumber == trimmedPhone }) {
                      errorMessage = "This phone number is already registered"; isLoading = false; return false
                  }
                  if existingUsers.contains(where: { $0.username.lowercased() == username.lowercased() }) {
                      errorMessage = "This username is already taken"; isLoading = false; return false
                  }
                  if existingUsers.contains(where: { $0.udid == udid }) {
                      errorMessage = "This UDID is already registered to another account"; isLoading = false; return false
                  }

                  let newUser = AppUser(phoneNumber: trimmedPhone, username: username, password: password, udid: udid)
                  var users = loadAllUsers()
                  users.append(newUser)
                  saveAllUsers(users)

                  currentUser = newUser
                  isAuthenticated = true
                  isLoading = false
                  HapticManager.shared.success()
                  UserDefaults.standard.set(newUser.id.uuidString, forKey: "currentUserID")
                  UserDefaults.standard.set(false, forKey: AppConstants.hasSeenOnboardingKey)
                  UserDefaults.standard.set(false, forKey: "hasSeenWalletOnboarding21s")
                  return true
              }

              func login(phoneNumber: String, password: String) -> Bool {
                  isLoading = true
                  errorMessage = nil

                  let trimmedPhone = phoneNumber.trimmingCharacters(in: .whitespaces)
                  if trimmedPhone.isEmpty {
                      errorMessage = "Phone number is required"; isLoading = false; return false
                  }
                  if password.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Password is required"; isLoading = false; return false
                  }

                  let users = loadAllUsers()
                  guard let user = users.first(where: { $0.phoneNumber == trimmedPhone && $0.password == password }) else {
                      errorMessage = "Invalid phone number or password"; isLoading = false; return false
                  }

                  currentUser = user
                  isAuthenticated = true
                  isLoading = false
                  HapticManager.shared.success()
                  UserDefaults.standard.set(user.id.uuidString, forKey: "currentUserID")
                  UserDefaults.standard.set(false, forKey: AppConstants.hasSeenOnboardingKey)
                  UserDefaults.standard.set(false, forKey: "hasSeenWalletOnboarding21s")
                  return true
              }

              func logout() {
                  currentUser = nil
                  isAuthenticated = false
                  UserDefaults.standard.removeObject(forKey: "currentUserID")
              }

              private func loadUser() {
                  guard let savedID = UserDefaults.standard.string(forKey: "currentUserID"),
                        let id = UUID(uuidString: savedID) else { return }
                  let users = loadAllUsers()
                  if let user = users.first(where: { $0.id == id }) {
                      currentUser = user
                      isAuthenticated = true
                  }
              }

              private func loadAllUsers() -> [AppUser] {
                  guard let data = UserDefaults.standard.data(forKey: userDefaultsKey),
                        let users = try? JSONDecoder().decode([AppUser].self, from: data) else { return [] }
                  return users
              }

              private func saveAllUsers(_ users: [AppUser]) {
                  if let data = try? JSONEncoder().encode(users) {
                      UserDefaults.standard.set(data, forKey: userDefaultsKey)
                  }
              }

              func getUDIDInfo() -> String {
                  return """
                  ⚠️ Important: Device UDID Information

                  Your UDID is a unique identifier for your iOS device.
                  This is required to ensure your account is linked to your specific device.

                  To find your UDID:
                  1. Connect your iPhone to a computer
                  2. Open Finder (macOS Catalina+) or iTunes (Windows)
                  3. Select your device
                  4. Click on the serial number until you see the UDID
                  5. Copy the UDID string

                  Or use a third-party app like "UDID Calculator" from the App Store.

                  ⚠️ Make sure you enter the correct UDID. This cannot be changed later.
                  """
              }
          }
          VIPEOF

