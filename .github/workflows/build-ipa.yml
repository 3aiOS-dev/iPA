name: ONEs Store - Pure Arabic, No Auth, No 3D

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "ONEs"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: Maximize build resources
        run: |
          echo "=== Build capacity check ==="
          df -h
          echo "=== macOS resource limits ==="
          ulimit -a
          echo "=== Available CPUs ==="
          sysctl -n hw.ncpu
          echo "=== Available memory ==="
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS - only necessary images
      # =========================================================
      - name: Download project images
        run: |
          mkdir -p Resources
          # Logo (used as app icon and brand)
          curl -L -o Resources/login_logo.png      "https://up6.cc/2026/07/178463790906632.png"
          # No‑internet GIF
          curl -L -o Resources/no_internet.gif     "https://up6.cc/2026/07/178493307055591.gif"
          # App Store glyph
          curl -L -o Resources/appstore_glyph.png  "https://up6.cc/2026/08/178602172173251.png"
          file Resources/*.png Resources/*.gif 2>/dev/null || true
          ls -lh Resources

      - name: Generate app icons from the logo
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image
          src = Image.open("Resources/login_logo.png").convert("RGBA")
          def make_icon(size, path):
              bg = Image.new("RGBA", (size, size), (10, 12, 18, 255))
              logo = src.resize((size, size))
              bg.alpha_composite(logo)
              bg.convert("RGB").save(path, "PNG")
          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYEOF
          ls -lh Resources

      - name: Generate Info.plist
        run: |
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>     <string>ar</string>
              <key>CFBundleAllowMixedLocalizations</key> <true/>
              <key>CFBundleLocalizations</key>          <array><string>ar</string></array>
              <key>CFBundleExecutable</key>             <string>VIP21Store</string>
              <key>CFBundleIdentifier</key>             <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key>  <string>6.0</string>
              <key>CFBundleName</key>                   <string>ONEs</string>
              <key>CFBundleDisplayName</key>            <string>ONEs</string>
              <key>CFBundlePackageType</key>            <string>APPL</string>
              <key>CFBundleSignature</key>              <string>????</string>
              <key>CFBundleShortVersionString</key>     <string>1.0</string>
              <key>CFBundleVersion</key>                <string>1</string>
              <key>CFBundleSupportedPlatforms</key>     <array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key>             <true/>
              <key>UIFileSharingEnabled</key>           <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key> <true/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>remote-notification</string>
                  <string>fetch</string>
                  <string>processing</string>
              </array>
              <key>BGTaskSchedulerPermittedIdentifiers</key>
              <array>
                  <string>com.21s.store.refresh</string>
              </array>
              <key>LSApplicationQueriesSchemes</key>
              <array>
                  <string>itms-services</string>
                  <string>itms-apps</string>
              </array>
              <key>MinimumOSVersion</key>               <string>16.0</string>
              <key>UIDeviceFamily</key>                 <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>   <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UISupportedInterfaceOrientations~ipad</key>
