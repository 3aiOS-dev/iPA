      - name: توليد الكود - AppsTabView.swift
        run: |
          cat > AppsTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          struct AppsTabView: View {
              @ObservedObject var appsManager: AppsManager
              @ObservedObject var downloadManager: DownloadManager
              @State private var selectedApp: AppItem?
              @State private var showDetail = false
              @State private var searchText = ""
              @State private var isSearchFocused = false
              @State private var selectedCategory: String = "الكل"
              @State private var selectedSource: AppSource = .all
              @State private var newOnly: Bool = false
              @State private var sortMode: AppSortMode = .newest

              enum AppSortMode: String, CaseIterable {
                  case newest = "الأحدث"
                  case popular = "الأشهر"
                  case name = "الاسم"
                  case size = "الحجم"
              }

              var categories: [String] {
                  var cats = ["الكل"]
                  let found = Set(appsManager.apps.compactMap { $0.category }).sorted()
                  cats += found.isEmpty ? ["ترفيه", "أدوات", "ألعاب", "اجتماعي", "تعليم"] : Array(found)
                  return cats
              }

              var filteredApps: [AppItem] {
                  var base = appsManager.apps

                  switch selectedSource {
                  case .all:     break
                  case .primary: base = base.filter { $0.source == .primary }
                  case .kurd:    base = base.filter { $0.source == .kurd }
                  case .local:   base = base.filter { $0.source == .local }
                  }

                  if selectedCategory != "الكل" {
                      base = base.filter { $0.category == selectedCategory }
                  }

                  if newOnly {
                      base = base.filter { $0.isNew }
                  }

                  if !searchText.isEmpty {
                      base = base.filter {
                          $0.name.localizedCaseInsensitiveContains(searchText) ||
                          $0.localizedDescription.localizedCaseInsensitiveContains(searchText) ||
                          $0.developerName.localizedCaseInsensitiveContains(searchText)
                      }
                  }

                  switch sortMode {
                  case .newest:  return base.sorted { ($0.parsedDate ?? .distantPast) > ($1.parsedDate ?? .distantPast) }
                  case .popular: return base.sorted { (Int($0.down) ?? 0) > (Int($1.down) ?? 0) }
                  case .name:    return base.sorted { $0.name < $1.name }
                  case .size:    return base.sorted { $0.size > $1.size }
                  }
              }

              var newThisWeekCount: Int { appsManager.newThisWeek.count }

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 14) {
                              if appsManager.isLoading && appsManager.apps.isEmpty {
                                  LoadingView()
                              } else if let err = appsManager.errorMessage, appsManager.apps.isEmpty {
                                  ErrorView(message: err) { appsManager.retryFetch() }
                              } else {
                                  // Header
                                  HStack(spacing: 12) {
                                      ZStack {
                                          RoundedRectangle(cornerRadius: 12)
                                              .fill(Color.xcodeBlue.opacity(0.15))
                                              .frame(width: 44, height: 44)
                                          Image(systemName: "square.grid.2x2.fill")
                                              .foregroundColor(.xcodeBlue)
                                              .font(.system(size: 20))
                                      }
                                      VStack(alignment: .trailing, spacing: 2) {
                                          Text("كل التطبيقات")
                                              .font(.system(size: 17, weight: .heavy))
                                          Text("\(appsManager.apps.count) تطبيق  •  \(newThisWeekCount) جديد هذا الأسبوع")
                                              .font(.system(size: 11))
                                              .foregroundColor(.xcodeSecondary)
                                      }
                                      Spacer()
                                      Menu {
                                          ForEach(AppSortMode.allCases, id: \.self) { mode in
                                              Button(action: { sortMode = mode }) {
                                                  HStack {
                                                      Text(mode.rawValue)
                                                      if sortMode == mode { Image(systemName: "checkmark") }
                                                  }
                                              }
                                          }
                                      } label: {
                                          HStack(spacing: 4) {
                                              Image(systemName: "arrow.up.arrow.down")
                                                  .font(.system(size: 11, weight: .semibold))
                                              Text(sortMode.rawValue)
                                                  .font(.system(size: 11, weight: .semibold))
                                          }
                                          .foregroundColor(.xcodeBlue)
                                          .padding(.horizontal, 10)
                                          .padding(.vertical, 6)
                                          .background(Capsule().fill(Color.xcodeBlue.opacity(0.1)))
                                      }
                                  }
                                  .padding(.horizontal)

                                  // Search
                                  HStack(spacing: 10) {
                                      Image(systemName: "magnifyingglass")
                                          .foregroundColor(isSearchFocused ? .xcodeBlue : .xcodeSecondary)
                                          .font(.system(size: 14))
                                      TextField("ابحث عن تطبيق...", text: $searchText)
                                          .font(.system(size: 14))
                                          .multilineTextAlignment(.trailing)
                                          .onTapGesture { isSearchFocused = true }
                                          .onSubmit {
                                              appsManager.addRecentSearch(searchText)
                                              isSearchFocused = false
                                          }
                                      if !searchText.isEmpty {
                                          Button(action: { searchText = ""; isSearchFocused = false }) {
                                              Image(systemName: "xmark.circle.fill")
                                                  .foregroundColor(.xcodeSecondary)
                                          }
                                      }
                                  }
                                  .padding(12)
                                  .xcodeCard(radius: 12)
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 12)
                                          .stroke(isSearchFocused ? Color.xcodeBlue.opacity(0.4) : Color.clear, lineWidth: 1.5)
                                  )
                                  .animation(.easeInOut(duration: 0.2), value: isSearchFocused)
                                  .padding(.horizontal)

                                  // Recent searches
                                  if isSearchFocused && searchText.isEmpty && !appsManager.recentSearches.isEmpty {
                                      VStack(alignment: .trailing, spacing: 6) {
                                          Text("بحث سابق")
                                              .font(.system(size: 11))
                                              .foregroundColor(.xcodeSecondary)
                                              .padding(.horizontal)
                                          ScrollView(.horizontal, showsIndicators: false) {
                                              HStack(spacing: 8) {
                                                  ForEach(appsManager.recentSearches.prefix(6), id: \.self) { term in
                                                      Button(action: { searchText = term; isSearchFocused = false }) {
                                                          HStack(spacing: 4) {
                                                              Image(systemName: "clock")
                                                                  .font(.system(size: 10))
                                                              Text(term)
                                                                  .font(.system(size: 11))
                                                          }
                                                          .foregroundColor(.primary)
                                                          .padding(.horizontal, 10)
                                                          .padding(.vertical, 5)
                                                          .xcodeCard(radius: 8)
                                                      }
                                                  }
                                              }
                                              .padding(.horizontal)
                                          }
                                      }
                                      .transition(.opacity)
                                  }

                                  // Source filters
                                  ScrollView(.horizontal, showsIndicators: false) {
                                      HStack(spacing: 8) {
                                          ForEach(AppSource.allCases.filter { $0 != .local }) { src in
                                              FilterChip(
                                                  title: src.displayName,
                                                  icon: src.icon,
                                                  color: src.color,
                                                  selected: selectedSource == src
                                              ) {
                                                  withAnimation(.spring()) { selectedSource = src }
                                              }
                                          }

                                          Divider()
                                              .frame(height: 16)
                                              .background(Color.gray.opacity(0.3))
                                              .padding(.horizontal, 4)

                                          FilterChip(
                                              title: "جديد هذا الأسبوع",
                                              icon: "sparkles",
                                              color: .xcodePink,
                                              selected: newOnly
                                          ) {
                                              withAnimation(.spring()) { newOnly.toggle() }
                                          }

                                          if newOnly {
                                              Text("\(filteredApps.count)")
                                                  .font(.system(size: 9, weight: .heavy))
                                                  .foregroundColor(.white)
                                                  .padding(.horizontal, 6)
                                                  .padding(.vertical, 2)
                                                  .background(Capsule().fill(Color.xcodePink))
                                          }
                                      }
                                      .padding(.horizontal)
                                  }

                                  // Category filters
                                  ScrollView(.horizontal, showsIndicators: false) {
                                      HStack(spacing: 8) {
                                          ForEach(categories, id: \.self) { cat in
                                              FilterChip(
                                                  title: cat,
                                                  icon: nil,
                                                  color: .xcodeBlue,
                                                  selected: selectedCategory == cat
                                              ) {
                                                  withAnimation(.spring()) { selectedCategory = cat }
                                              }
                                          }
                                      }
                                      .padding(.horizontal)
                                  }

                                  // Results count
                                  HStack {
                                      Spacer()
                                      Text("\(filteredApps.count) نتيجة")
                                          .font(.system(size: 11))
                                          .foregroundColor(.xcodeSecondary)
                                          .padding(.horizontal)
                                  }

                                  // Apps list
                                  if filteredApps.isEmpty {
                                      XcodeEmptyState(
                                          icon: "magnifyingglass",
                                          title: "لا توجد نتائج",
                                          subtitle: "جرب بحثاً آخر أو تغيير الفلاتر"
                                      )
                                  } else {
                                      LazyVStack(spacing: 8) {
                                          ForEach(filteredApps, id: \.id) { app in
                                              EnhancedAppCard(app: app, downloadManager: downloadManager)
                                                  .onTapGesture { selectedApp = app; showDetail = true }
                                                  .padding(.horizontal)
                                          }
                                      }
                                  }
                              }
                          }
                          .padding(.bottom, 20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              Text("21s Pro")
                                  .font(.system(size: 17, weight: .bold))
                                  .foregroundColor(.xcodeBlue)
                          }
                      }
                  }
                  .sheet(isPresented: $showDetail) {
                      if let app = selectedApp {
                          AppDetailView(app: app, downloadManager: downloadManager)
                      }
                  }
              }
          }

          struct FilterChip: View {
              let title: String
              var icon: String?
              let color: Color
              let selected: Bool
              let action: () -> Void

              var body: some View {
                  Button(action: {
                      HapticManager.shared.selection()
                      action()
                  }) {
                      HStack(spacing: 4) {
                          if let icon {
