                          Text(item.developer).font(.system(size: 12)).foregroundColor(theme.secondaryText)
                      }
                      Spacer()
                      Text("★ \(String(format: "%.1f", item.rating))")
                          .font(.system(size: 12.5, weight: .semibold))
                          .foregroundColor(theme.gold)
                  }
                  .padding(.horizontal, 18)
                  .frame(height: 64)
                  .contentShape(Rectangle())
              }
          }

          // شارة عنوان الشريط العلوي: أيقونة التطبيق + الاسم "21s" + رقم الإصدار.
          struct TopBarTitle: View {
              @EnvironmentObject var theme: ThemeManager

              var body: some View {
                  HStack(spacing: 8) {
                      ZStack {
                          LinearGradient(colors: [theme.accent, theme.accentSecondary], startPoint: .topLeading, endPoint: .bottomTrailing)
                              .frame(width: 32, height: 32)
                              .clipShape(RoundedRectangle(cornerRadius: 9))
                          Text("21").font(.system(size: 12.5, weight: .heavy)).foregroundColor(.white)
                      }
                      Text("21s").font(.system(size: 19, weight: .bold)).foregroundColor(theme.primaryText)
                      Text("الإصدار 1.0")
