      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift AppModel.swift AppCell.swift TopBarView.swift HomeComponents.swift \
            HomeViewController.swift AppsViewController.swift DetailViewController.swift \
            FavoritesViewController.swift SettingsViewController.swift PrivacyPolicyViewController.swift \
            OnboardingViewController.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -o TwentyOneS

          file TwentyOneS

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/TwentyOneS.app

          cp TwentyOneS build-output/Payload/TwentyOneS.app/TwentyOneS
          cp Resources/Info.plist build-output/Payload/TwentyOneS.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/TwentyOneS.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/TwentyOneS.app/
          cp Resources/apps_data.json build-output/Payload/TwentyOneS.app/apps_data.json

          ldid -S build-output/Payload/TwentyOneS.app/TwentyOneS

          cd build-output
          zip -r -q ../artifacts/21s.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/21s.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-IPA
          path: artifacts/21s.ipa
