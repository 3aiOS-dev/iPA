                                      Text("New app available").font(.system(size: 13, weight: .semibold)).foregroundColor(.storeText)
                                      Text("Update #\(i + 1) is ready to install now.").font(.system(size: 11)).foregroundColor(.storeSub)
                                  }
                                  Spacer()
                              }
                              .padding(12)
                              .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                              .padding(.horizontal, 20)
                          }
                      }
                      .padding(.top, 8)
                  }
              }
          }
          
          // ============================================================
          // SOCIAL / PROFILE TAB
          // ============================================================
          struct SocialView: View {
              @ObservedObject var authManager: AuthManager
              var body: some View {
                  ScrollView {
                      VStack(spacing: 20) {
                          StoreHeader(title: "Profile")
                          VStack(spacing: 12) {
                              ZStack {
                                  Circle().fill(Color.storePrimary.opacity(0.15)).frame(width: 90, height: 90)
                                  Image(systemName: "person.fill").font(.system(size: 40)).foregroundColor(.storePrimary)
                              }
                              Text(authManager.currentUser?.username ?? "User").font(.system(size: 18, weight: .bold)).foregroundColor(.storeText)
                              Text(authManager.currentUser?.phoneNumber ?? "").font(.system(size: 12)).foregroundColor(.storeSub)
                          }
                          VStack(spacing: 10) {
                              ProfileRow(icon: "heart.fill", label: "Wishlist", color: .storePink)
                              ProfileRow(icon: "square.and.arrow.down.fill", label: "My Downloads", color: .storePrimary)
                              ProfileRow(icon: "gearshape.fill", label: "Settings", color: .storeCyan)
                              Button {
                                  HapticManager.shared.impact(.light)
                                  authManager.logout()
                              } label: {
                                  HStack {
                                      Image(systemName: "arrow.right.square.fill").foregroundColor(.white)
                                      Text("Log out").font(.system(size: 14, weight: .semibold)).foregroundColor(.white)
                                  }
                                  .frame(maxWidth: .infinity).frame(height: 48)
                                  .background(Capsule().fill(Color.storePink))
                              }
                              .padding(.top, 6)
                          }
                          .padding(.horizontal, 20)
                      }
                      .padding(.top, 8)
                  }
              }
          }
          
          struct ProfileRow: View {
              let icon: String
              let label: String
              let color: Color
              var body: some View {
                  HStack {
                      ZStack { Circle().fill(color.opacity(0.15)).frame(width: 40, height: 40); Image(systemName: icon).foregroundColor(color) }
                      Text(label).font(.system(size: 14, weight: .semibold)).foregroundColor(.storeText)
                      Spacer()
                      Image(systemName: "chevron.right").foregroundColor(.storeSub)
                  }
                  .padding(12)
                  .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
              }
          }
          
          // ============================================================
          // SEARCH
          // ============================================================
          struct SearchView: View {
              @Environment(\.dismiss) private var dismiss
              @ObservedObject var feed: StoreFeed
              @State private var query = ""
              var results: [StoreAPIApp] { feed.search(query) }
              var body: some View {
                  NavigationView {
                      VStack {
                          HStack {
                              Image(systemName: "magnifyingglass").foregroundColor(.storeSub)
                              TextField("Search apps...", text: $query)
                          }
                          .padding(14)
                          .background(RoundedRectangle(cornerRadius: 14).fill(Color.storeBg))
                          .padding(.horizontal, 16).padding(.top, 8)
          
                          ScrollView {
                              LazyVStack(spacing: 10) {
                                  ForEach(results) { app in
                                      NavigationLink(destination: AppDetailView(app: app)) {
                                          HStack {
                                              RemoteIcon(url: app.icon, size: 50, cornerRadius: 12)
                                              VStack(alignment: .leading) {
                                                  Text(app.name).font(.system(size: 13, weight: .semibold)).foregroundColor(.storeText)
                                                  Text("\(app.category ?? "App") · \(app.ipaSize ?? "—")").font(.system(size: 11)).foregroundColor(.storeSub)
                                              }
                                              Spacer()
                                              Image(systemName: "chevron.right").foregroundColor(.storeSub).font(.system(size: 12))
                                          }
                                          .padding(10)
                                          .background(RoundedRectangle(cornerRadius: 14).fill(Color.storeCard))
                                      }
                                      .buttonStyle(.plain)
                                  }
                                  if results.isEmpty {
                                      Text("No results")
                                          .font(.system(size: 12, weight: .semibold))
                                          .foregroundColor(.storeSub)
                                          .padding(.top, 30)
                                  }
                              }
                              .padding(.horizontal, 16)
                          }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) { Text("Search").font(.system(size: 15, weight: .bold)) }
                          ToolbarItem(placement: .navigationBarTrailing) { Button("Done") { dismiss() }.foregroundColor(.storePrimary) }
                      }
                  }
                  .preferredColorScheme(.light)
              }
          }
          
          VIPEOF


      - name: Generate code - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI

          @main
          struct VIP21StoreApp: App {
              var body: some Scene {
                  WindowGroup {
                      NavigationView { AuthView() }
                          .navigationViewStyle(.stack)
                  }
              }
          }
          VIPEOF

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            AuthManager.swift \
            Countries.swift \
            OnboardingView.swift \
            AuthViews.swift \
            StoreView.swift \
            ContentView.swift \
            VIP21StoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework ImageIO \
            -framework MobileCoreServices \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA package
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                              build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                    build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png           build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon60x60@3x.png           build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png      build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon83.5x83.5@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png          build-output/Payload/VIP21Store.app/
          cp Resources/login_logo.png                build-output/Payload/VIP21Store.app/
          cp Resources/register_logo.png             build-output/Payload/VIP21Store.app/
          cp Resources/onboarding1.png               build-output/Payload/VIP21Store.app/
          cp Resources/onboarding2.png               build-output/Payload/VIP21Store.app/
          cp Resources/onboarding3.png               build-output/Payload/VIP21Store.app/
          cp Resources/wallet_onboarding1.png        build-output/Payload/VIP21Store.app/
          cp Resources/wallet_onboarding2.png        build-output/Payload/VIP21Store.app/
          cp Resources/wallet_onboarding3.png        build-output/Payload/VIP21Store.app/
          cp Resources/balance_animation.gif         build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store

          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          cd build-output
          zip -r -X ../artifacts/21s.ipa Payload/
          cd ..

          if ! unzip -t artifacts/21s.ipa >/dev/null 2>&1; then
            echo "❌ Error: IPA file is corrupt or invalid."
            exit 1
          fi
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/21s.ipa | head -40
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "== Integrity test =="
          unzip -t artifacts/21s.ipa > /dev/null
          echo "✅ IPA is valid, passes zip integrity test, and contains the App Bundle."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Login-Wallet-IPA
          path: artifacts/21s.ipa
