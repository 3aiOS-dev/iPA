name: Quick Launcher (SwiftUI) - Deep Link Edition

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.yourname.quicklauncher"
  NEW_APP_NAME:  "Quick Launcher"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip  || { echo "zip not installed"; exit 1; }

      # =========================================================
      # ICONS - generated locally (no third-party logos/assets used)
      # =========================================================
      - name: Generate app icon
        run: |
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          def gradient(w, h, c1, c2):
              img = Image.new("RGB", (w, h), c1)
              d = ImageDraw.Draw(img)
              for i in range(h):
                  t = i / max(1, h - 1)
                  r = int(c1[0] + (c2[0]-c1[0])*t)
                  g = int(c1[1] + (c2[1]-c1[1])*t)
                  b = int(c1[2] + (c2[2]-c1[2])*t)
                  d.line([(0, i), (w, i)], fill=(r, g, b))
              return img

          def find_font(size):
              for p in [
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/SFNSDisplay.ttf",
                  "/Library/Fonts/Arial Bold.ttf",
              ]:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, size)
                      except: pass
              return ImageFont.load_default()

          img = gradient(1024, 1024, (60, 90, 220), (20, 30, 90))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((260, 380, 764, 644), radius=40, fill=(255, 255, 255))
          font = find_font(120)
          bbox = d.textbbox((0,0), "QL", font=font)
          w, h = bbox[2]-bbox[0], bbox[3]-bbox[1]
          d.text((512 - w/2, 512 - h/2), "QL", font=font, fill=(30, 40, 100))
          img.save("Resources/AppIcon1024x1024.png")

          for size, name in [(120,"AppIcon60x60@2x.png"), (180,"AppIcon60x60@3x.png"),
                              (152,"AppIcon76x76@2x~ipad.png"), (167,"AppIcon83.5x83.5@2x~ipad.png")]:
              img.resize((size, size)).save(f"Resources/{name}")
          print("Icons generated.")
          PYEOF
          ls -lh Resources

      # =========================================================
      # Info.plist
      # =========================================================
      - name: Write Info.plist
        run: |
          cat > Resources/Info.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>${NEW_APP_NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${NEW_APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${NEW_BUNDLE_ID}</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleExecutable</key>
              <string>QuickLauncher</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon60x60@2x</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <!--
                These are the ONLY URL schemes this app needs to be able to *check and open*
                other apps' official deep links (LSApplicationQueriesSchemes). This app does
                NOT contain or host copies of Instagram/TikTok/Telegram/etc.
              -->
              <key>LSApplicationQueriesSchemes</key>
              <array>
                  <string>instagram</string>
                  <string>tiktok</string>
                  <string>tg</string>
                  <string>figma</string>
                  <string>canva</string>
                  <string>pinterest</string>
                  <string>behance</string>
                  <string>dribbble</string>
              </array>
          </dict>
          </plist>
          PLISTEOF
          # Substitute env vars manually (no envsubst dependency assumed)
          sed -i '' "s/\${NEW_APP_NAME}/${NEW_APP_NAME}/g" Resources/Info.plist
          sed -i '' "s/\${NEW_BUNDLE_ID}/${NEW_BUNDLE_ID}/g" Resources/Info.plist
          cat Resources/Info.plist

      # =========================================================
      # SWIFT SOURCE
      # =========================================================
      - name: Write Swift source files
        run: |
          cat > AppModel.swift << 'SWIFTEOF'
          import Foundation

          struct LauncherApp: Identifiable {
              let id = UUID()
              let name: String
              let subtitle: String
              /// Official URL scheme used to open the installed app (deep link only).
              let scheme: String
              /// Official App Store page, used as a safe fallback if the app isn't installed
              /// or the scheme is unavailable/changed.
              let appStoreURL: String
              let symbol: String   // SF Symbol name (no third-party logos used)
              let colorHex: String

              var schemeURL: URL? { URL(string: scheme) }
              var storeURL: URL? { URL(string: appStoreURL) }
          }

          enum AppCatalog {
              static let social: [LauncherApp] = [
                  LauncherApp(name: "Instagram", subtitle: "Photos & Reels",
                              scheme: "instagram://app",
                              appStoreURL: "https://apps.apple.com/app/instagram/id389801252",
                              symbol: "camera.fill", colorHex: "E1306C"),
                  LauncherApp(name: "TikTok", subtitle: "Short videos",
                              scheme: "tiktok://",
                              appStoreURL: "https://apps.apple.com/app/tiktok/id835599320",
                              symbol: "music.note", colorHex: "010101"),
                  LauncherApp(name: "Telegram", subtitle: "Messaging",
                              scheme: "tg://",
                              appStoreURL: "https://apps.apple.com/app/telegram-messenger/id686449807",
                              symbol: "paperplane.fill", colorHex: "2AABEE"),
              ]

              static let design: [LauncherApp] = [
                  LauncherApp(name: "Figma", subtitle: "UI Design",
                              scheme: "figma://",
                              appStoreURL: "https://apps.apple.com/app/figma/id1152214172",
                              symbol: "square.on.square", colorHex: "A259FF"),
                  LauncherApp(name: "Canva", subtitle: "Graphic design",
                              scheme: "canva://",
                              appStoreURL: "https://apps.apple.com/app/canva/id897446215",
                              symbol: "paintpalette.fill", colorHex: "00C4CC"),
                  LauncherApp(name: "Pinterest", subtitle: "Inspiration",
                              scheme: "pinterest://",
                              appStoreURL: "https://apps.apple.com/app/pinterest/id429047995",
                              symbol: "pin.fill", colorHex: "E60023"),
                  LauncherApp(name: "Behance", subtitle: "Portfolios",
                              scheme: "behance://",
                              appStoreURL: "https://apps.apple.com/app/behance/id474139006",
                              symbol: "rectangle.stack.fill", colorHex: "1769FF"),
                  LauncherApp(name: "Dribbble", subtitle: "Design shots",
                              scheme: "dribbble://",
                              appStoreURL: "https://apps.apple.com/app/dribbble/id489210681",
                              symbol: "basketball.fill", colorHex: "EA4C89"),
              ]
          }
          SWIFTEOF

          cat > OpenAppHelper.swift << 'SWIFTEOF'
          import UIKit

          enum OpenAppHelper {
              /// Tries to open the app's official deep link. If that fails (app not
              /// installed, scheme unavailable, or blocked), falls back to the app's
              /// official App Store page. Never bundles or launches any local copy.
              static func open(_ app: LauncherApp) {
                  if let schemeURL = app.schemeURL, UIApplication.shared.canOpenURL(schemeURL) {
                      UIApplication.shared.open(schemeURL, options: [:]) { success in
                          if !success { openStore(app) }
                      }
                  } else {
                      openStore(app)
                  }
              }

              private static func openStore(_ app: LauncherApp) {
                  guard let storeURL = app.storeURL else { return }
                  UIApplication.shared.open(storeURL, options: [:], completionHandler: nil)
              }
          }
          SWIFTEOF

          cat > ContentView.swift << 'SWIFTEOF'
          import SwiftUI

          struct AppTile: View {
              let app: LauncherApp

              var body: some View {
                  Button {
                      OpenAppHelper.open(app)
                  } label: {
                      VStack(spacing: 10) {
                          ZStack {
                              RoundedRectangle(cornerRadius: 20)
                                  .fill(Color(hex: app.colorHex))
                                  .frame(width: 64, height: 64)
                              Image(systemName: app.symbol)
                                  .font(.system(size: 26, weight: .semibold))
                                  .foregroundColor(.white)
                          }
                          Text(app.name)
                              .font(.system(size: 13, weight: .semibold))
                              .foregroundColor(.primary)
                          Text(app.subtitle)
                              .font(.system(size: 11))
                              .foregroundColor(.secondary)
                      }
                      .frame(maxWidth: .infinity)
                      .padding(.vertical, 14)
                      .background(
                          RoundedRectangle(cornerRadius: 18)
                              .fill(Color(.secondarySystemBackground))
                      )
                  }
                  .buttonStyle(.plain)
              }
          }

          struct AppSection: View {
              let title: String
              let apps: [LauncherApp]
              let columns = [GridItem(.flexible()), GridItem(.flexible()), GridItem(.flexible())]

              var body: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text(title)
                          .font(.system(size: 20, weight: .bold))
                          .padding(.horizontal, 4)
                      LazyVGrid(columns: columns, spacing: 14) {
                          ForEach(apps) { app in
                              AppTile(app: app)
                          }
                      }
                  }
              }
          }

          struct ContentView: View {
              var body: some View {
                  NavigationView {
                      ScrollView {
                          VStack(alignment: .leading, spacing: 28) {
                              AppSection(title: "Social", apps: AppCatalog.social)
                              AppSection(title: "Design", apps: AppCatalog.design)

                              Text("Tapping a tile opens the official app if it's installed, or its App Store page if it isn't.")
                                  .font(.system(size: 12))
                                  .foregroundColor(.secondary)
                                  .padding(.horizontal, 4)
                                  .padding(.top, 8)
                          }
                          .padding(16)
                      }
                      .navigationTitle("Quick Launcher")
                  }
              }
          }

          extension Color {
              init(hex: String) {
                  var hex = hex.trimmingCharacters(in: .whitespacesAndNewlines)
                  hex = hex.replacingOccurrences(of: "#", with: "")
                  var rgb: UInt64 = 0
                  Scanner(string: hex).scanHexInt64(&rgb)
                  let r = Double((rgb >> 16) & 0xFF) / 255
                  let g = Double((rgb >> 8) & 0xFF) / 255
                  let b = Double(rgb & 0xFF) / 255
                  self.init(red: r, green: g, blue: b)
              }
          }
          SWIFTEOF

          cat > QuickLauncherApp.swift << 'SWIFTEOF'
          import SwiftUI

          @main
          struct QuickLauncherApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFTEOF

          echo "Swift sources written."
          ls -la *.swift

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            AppModel.swift \
            OpenAppHelper.swift \
            ContentView.swift \
            QuickLauncherApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name QuickLauncher \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -o QuickLauncher
          file QuickLauncher

      # =========================================================
      # PACKAGE IPA
      # =========================================================
      - name: Create IPA package
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/QuickLauncher.app
          cp -X QuickLauncher                                  build-output/Payload/QuickLauncher.app/QuickLauncher
          cp -X Resources/Info.plist                           build-output/Payload/QuickLauncher.app/Info.plist
          cp -X Resources/AppIcon60x60@2x.png                  build-output/Payload/QuickLauncher.app/
          cp -X Resources/AppIcon60x60@3x.png                  build-output/Payload/QuickLauncher.app/
          cp -X Resources/AppIcon76x76@2x~ipad.png             build-output/Payload/QuickLauncher.app/
          cp -X Resources/AppIcon83.5x83.5@2x~ipad.png         build-output/Payload/QuickLauncher.app/
          cp -X Resources/AppIcon1024x1024.png                 build-output/Payload/QuickLauncher.app/

          xattr -cr build-output
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          ldid -S build-output/Payload/QuickLauncher.app/QuickLauncher

          rm -f artifacts/QuickLauncher.ipa
          cd build-output && zip -r -X -q ../artifacts/QuickLauncher.ipa Payload && cd ..
          ls -lh artifacts/QuickLauncher.ipa

          if ! unzip -tq artifacts/QuickLauncher.ipa >/dev/null 2>&1; then
            echo "Error: IPA file is corrupt or invalid."
            exit 1
          fi
          if ! unzip -l artifacts/QuickLauncher.ipa | grep -q "Payload/QuickLauncher.app/QuickLauncher"; then
            echo "Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "IPA: $(du -sh artifacts/QuickLauncher.ipa)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickLauncher-IPA
          path: artifacts/QuickLauncher.ipa
          retention-days: 90
