          struct RoundedCorner: Shape {
              var radius: CGFloat
              var corners: UIRectCorner
              func path(in rect: CGRect) -> Path {
                  let p = UIBezierPath(roundedRect: rect, byRoundingCorners: corners,
                                       cornerRadii: CGSize(width: radius, height: radius))
                  return Path(p.cgPath)
              }
          }

          // ================= COMMENTS STORE (shared) =================
          struct StoreComment: Identifiable, Decodable, Hashable {
              let id: String
              let author: String
              let body: String
              let reply: String?
              let created_at: String?
          }

          private struct StoreCommentsResponse: Decodable { let comments: [StoreComment] }

          @MainActor
          final class StoreCommentsStore: ObservableObject {
              @Published var comments: [StoreComment] = []
              @Published var isLoading = false
              @Published var isSending = false

              func load(appId: Int) {
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/comments?app=\(appId)") else { return }
                  isLoading = true
                  URLSession.shared.dataTask(with: URLRequest(url: url, timeoutInterval: 25)) { data, _, _ in
                      let list = data.flatMap { try? JSONDecoder().decode(StoreCommentsResponse.self, from: $0).comments } ?? []
                      DispatchQueue.main.async {
                          self.comments = list
                          self.isLoading = false
                      }
                  }.resume()
              }

              func send(appId: Int, text: String, done: @escaping (Bool) -> Void) {
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/comments") else { done(false); return }
                  isSending = true
                  var req = URLRequest(url: url, timeoutInterval: 25)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "app_id": appId,
                      "body": text,
                      "code": ActivationManager.shared.code,
                      "udid": ActivationManager.shared.deviceID
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      var ok = false
                      if let data = data,
                         let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                          ok = (obj["ok"] as? Bool) == true
                      }
                      DispatchQueue.main.async {
                          self.isSending = false
                          if ok { self.load(appId: appId) }
                          done(ok)
                      }
                  }.resume()
              }
          }

          // ================= INSTALLER =================
          @MainActor
          final class StoreInstaller: ObservableObject {
              static let shared = MainActor.assumeIsolated { StoreInstaller() }
              @Published var isWorking: Bool = false
              private init() {}

              func install(app: StoreAPIApp) {
                  install(bundleId: app.bundleId, name: app.name)
              }

              func fetchCertificate(_ done: @escaping ([String: Any]?) -> Void) {
                   let activation = ActivationManager.shared
                   guard !activation.deviceID.isEmpty else {
                       StatusCenter.shared.show(text: "ألصق UDID الرسمي للجهاز أولًا")
                       done(nil)
                       return
                   }
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/certificate") else {
                      done(nil); return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 25)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                   if !BackendAccount.shared.accessToken.isEmpty {
                       req.setValue("Bearer \(BackendAccount.shared.accessToken)", forHTTPHeaderField: "Authorization")
                   }
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                       "udid": activation.deviceID,
                       "code": activation.code,
                       "account_id": BackendAccount.shared.remoteUserID
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      var result: [String: Any]? = nil
                      if let data = data,
                         let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         (obj["ok"] as? Bool) == true {
                          result = obj["certificate"] as? [String: Any]
                       } else if let data = data,
                                 let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                                 let message = obj["message"] as? String {
                           DispatchQueue.main.async {
                               StatusCenter.shared.show(text: message)
                           }
                      }
                      DispatchQueue.main.async { done(result) }
                  }.resume()
              }

              func install(bundleId: String?, name: String) {
                  isWorking = true
                  StatusCenter.shared.show(text: "جارٍ التحقق من شهادتك...")
                  fetchCertificate { cert in
                      guard cert != nil else {
                          self.isWorking = false
                          StatusCenter.shared.show(text: "لا توجد شهادة مرتبطة بجهازك، تواصل مع الدعم")
                          return
                      }
                      self.performInstall(bundleId: bundleId, name: name)
                  }
              }

              private func performInstall(bundleId: String?, name: String) {
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/install-by-bundle") else { return }
                   let activation = ActivationManager.shared
                   guard !activation.deviceID.isEmpty else {
                       isWorking = false
                       StatusCenter.shared.show(text: "ألصق UDID الرسمي للجهاز أولًا")
                       return
                   }
                  isWorking = true
                  StatusCenter.shared.show(text: "جارٍ التثبيت عبر شهادتك...")
                  var req = URLRequest(url: url, timeoutInterval: 30)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                   if !BackendAccount.shared.accessToken.isEmpty {
                       req.setValue("Bearer \(BackendAccount.shared.accessToken)", forHTTPHeaderField: "Authorization")
                   }
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "bundle_id": bundleId ?? "",
                      "name": name,
                       "udid": activation.deviceID,
                       "code": activation.code,
                       "account_id": BackendAccount.shared.remoteUserID
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      DispatchQueue.main.async {
                          self.isWorking = false
                          guard let data = data,
                                let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                              StatusCenter.shared.show(text: "تعذّر الاتصال بسيرفر المتجر")
                              return
                          }
                          let serverOK = (obj["ok"] as? Bool) == true
                          let installURL = (obj["install_url"] as? String)
                              ?? (obj["installation_url"] as? String)
                          if serverOK,
                              let installURL,
                              let u = URL(string: installURL),
                              u.scheme == "itms-services" {
                              UIApplication.shared.open(u)
                              ONEsContent.shared.bumpInstall(bundleID: bundleId ?? "", name: name)
                              StatusCenter.shared.show(text: "جارٍ التثبيت على جهازك...")
                          } else {
                              let msg = (obj["message"] as? String) ?? "التثبيت غير متاح حاليًا"
                              StatusCenter.shared.show(text: msg)
                          }
                      }
                  }.resume()
              }
          }

          // ================= UPDATES TAB =================
          struct StoreUpdateItem: Codable, Identifiable, Hashable {
              let id: String
              let app_name: String
              let bundle_id: String?
              let icon: String?
              let version: String
              let changelog: String?
              let released_at: String?
              let is_new: Bool?
          }

          struct StoreUpdatesResponse: Codable { let updates: [StoreUpdateItem] }

          @MainActor
          final class UpdatesFeed: ObservableObject {
              static let shared = MainActor.assumeIsolated { UpdatesFeed() }
              @Published var items: [StoreUpdateItem] = []
              @Published var isLoading: Bool = false
              @Published var lastError: String = ""
              private init() {}

              func isRecent(_ item: StoreUpdateItem, now: Date = Date()) -> Bool {
                  guard let raw = item.released_at,
                        let d = ActivationManager.parseDate(raw) else { return false }
                  let age = now.timeIntervalSince(d)
                  return age >= 0 && age <= 24 * 60 * 60
              }

              private func sortForDisplay(_ list: [StoreUpdateItem]) -> [StoreUpdateItem] {
                  return list.sorted { (a, b) in
                      let aNew = (a.is_new == true)
                      let bNew = (b.is_new == true)
                      if aNew != bNew { return aNew && !bNew }
                      let ad = a.released_at.flatMap(ActivationManager.parseDate) ?? .distantPast
                      let bd = b.released_at.flatMap(ActivationManager.parseDate) ?? .distantPast
                      return ad > bd
                  }
              }

              var recentItems: [StoreUpdateItem] { sortForDisplay(items.filter { isRecent($0) }) }

              var newlyAddedItems: [StoreUpdateItem] { recentItems.filter { $0.is_new == true } }

              var recentCount: Int { recentItems.count }

              func load() async {
                  isLoading = true
                  lastError = ""
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/updates") else {
                      isLoading = false; return
                  }
                  do {
