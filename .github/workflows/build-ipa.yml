          // ================= INSTALLER =================
          @MainActor
          final class StoreInstaller: ObservableObject {
              static let shared = MainActor.assumeIsolated { StoreInstaller() }
              @Published var isWorking: Bool = false
              private init() {}

              func install(app: StoreAPIApp) {
                  install(bundleId: app.bundleId, name: app.name)
              }

              func fetchCertificate(_ done: @escaping ([String: Any]?) -> Void) {
                  guard let url = URL(string: ActivationManager.codesSiteBase + "/api/public/store/certificate") else {
                      done(nil); return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 25)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "udid": ActivationManager.shared.deviceID,
                      "code": ActivationManager.shared.code
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      var result: [String: Any]? = nil
                      if let data = data,
                         let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         (obj["ok"] as? Bool) == true {
                          result = obj["certificate"] as? [String: Any]
                      }
                      DispatchQueue.main.async { done(result) }
                  }.resume()
              }

              func install(bundleId: String?, name: String) {
                  isWorking = true
                  StatusCenter.shared.show(text: "جارٍ التحقق من شهادتك...")
                  fetchCertificate { cert in
                      guard cert != nil else {
                          self.isWorking = false
                          StatusCenter.shared.show(text: "لا توجد شهادة مرتبطة بجهازك، تواصل مع الدعم")
                          return
                      }
                      self.performInstall(bundleId: bundleId, name: name)
                  }
              }

              private func performInstall(bundleId: String?, name: String) {
                  guard let url = URL(string: ActivationManager.storeAPIBase + "/store/install-by-bundle") else { return }
                  isWorking = true
                  StatusCenter.shared.show(text: "بدء التوقيع...")
                  var req = URLRequest(url: url, timeoutInterval: 30)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "bundle_id": bundleId ?? "",
                      "name": name,
                      "udid": ActivationManager.shared.deviceID,
                      "code": ActivationManager.shared.code
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      DispatchQueue.main.async {
                          guard let data = data,
                                let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                              self.isWorking = false
                              StatusCenter.shared.show(text: "تعذّر الاتصال بسيرفر التوقيع")
                              return
                          }
                          if let jobId = obj["job_id"] as? String {
                              StatusCenter.shared.show(text: "بدء التوقيع → التحقق من الشهادة")
                              self.pollJob(jobId: jobId, attempt: 0)
                          } else {
                              self.isWorking = false
                              let msg = (obj["message"] as? String) ?? "التوقيع غير متاح حاليًا"
                              StatusCenter.shared.show(text: msg)
                          }
                      }
                  }.resume()
              }
              
              /// Polls the REAL signing server: signing started -> certificate check -> signing app
              /// -> manifest -> install. Every message comes from the server, nothing is faked.
              private func pollJob(jobId: String, attempt: Int) {
                  guard attempt < 150 else {
                      self.isWorking = false
                      StatusCenter.shared.show(text: "انتهت مدة انتظار سيرفر التوقيع")
                      return
                  }
                  guard let url = URL(string: ActivationManager.storeAPIBase + "/sign/status?id=" + jobId) else { return }
                  var req = URLRequest(url: url, timeoutInterval: 25)
                  req.httpMethod = "GET"
                  req.cachePolicy = .reloadIgnoringLocalCacheData
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      DispatchQueue.main.async {
                          var status = ""
                          var message = ""
                          var installURL: String? = nil
                          if let data = data,
                             let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                              status = (obj["status"] as? String) ?? ""
                              message = (obj["message"] as? String) ?? ""
                              installURL = obj["install_url"] as? String
                          }
                          if !message.isEmpty { StatusCenter.shared.show(text: message) }
                          if status == "completed", let s = installURL, let u = URL(string: s) {
                              self.isWorking = false
                              UIApplication.shared.open(u)
                              StatusCenter.shared.show(text: "اكتمل التوقيع → بدء التثبيت")
                              return
                          }
                          if status == "failed" {
                              self.isWorking = false
                              StatusCenter.shared.show(text: message.isEmpty ? "فشل التوقيع على السيرفر" : message)
                              return
                          }
                          DispatchQueue.main.asyncAfter(deadline: .now() + 3) {
                              self.pollJob(jobId: jobId, attempt: attempt + 1)
                          }
                      }
                  }.resume()
              }
          }

