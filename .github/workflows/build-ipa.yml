name: Build_21s

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Setup Dependencies
        run: |
          brew install ldid zip unzip

      - name: Generate App Icons
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size, filename):
              # Gradient background: deep purple to vibrant blue
              img = Image.new("RGB", (size, size), (18, 18, 30))
              draw = ImageDraw.Draw(img)

              top = (88, 0, 160)       # deep purple
              bottom = (0, 120, 200)   # vibrant blue
              for y in range(size):
                  t = y / size
                  r = int(top[0] * (1 - t) + bottom[0] * t)
                  g = int(top[1] * (1 - t) + bottom[1] * t)
                  b = int(top[2] * (1 - t) + bottom[2] * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b))

              # Rounded square background
              radius = size * 0.15
              draw.rounded_rectangle(
                  [size * 0.05, size * 0.05, size * 0.95, size * 0.95],
                  radius=radius,
                  fill=None,
                  outline=(255, 255, 255, 180),
                  width=max(2, size // 60)
              )

              # Circular icon element
              draw.ellipse(
                  [size * 0.12, size * 0.12, size * 0.88, size * 0.88],
                  outline=(255, 255, 255, 120),
                  width=max(1, size // 50),
              )

              # Text: "IPA"
              text = "IPA"
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size * 0.35))
              except Exception:
                  font = ImageFont.load_default()

              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(
                  ((size - tw) / 2 - bbox[0], (size - th) / 2 - bbox[1]),
                  text,
                  fill=(255, 255, 255, 230),
                  font=font,
              )

              # Small text: "21s"
              try:
                  font_small = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size * 0.12))
              except Exception:
                  font_small = ImageFont.load_default()

              small_text = "21s"
              bbox_small = draw.textbbox((0, 0), small_text, font=font_small)
              stw, sth = bbox_small[2] - bbox_small[0], bbox_small[3] - bbox_small[1]
              draw.text(
                  ((size - stw) / 2 - bbox_small[0], size * 0.80 - bbox_small[1]),
                  small_text,
                  fill=(255, 255, 255, 150),
                  font=font_small,
              )

              img.save(filename)

          # Generate icons for various sizes
          make_icon(120, "Resources/AppIcon60x60@2x.png")
          make_icon(152, "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167, "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(180, "Resources/AppIcon60x60@3x.png")
          PYEOF
          ls -la Resources

      - name: Generate App Source Files
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources

          cat > main.swift << 'SEOF'
          import UIKit
          import Compression
          import UniformTypeIdentifiers

          // MARK: - ZIP Extraction with Compression Framework

          enum UnzipError: Error {
              case readFailed
              case invalidArchive
              case extractionFailed
          }

          final class ZipExtractor {

              static func extract(zipPath: String, to destDir: String) throws {
                  guard let data = FileManager.default.contents(atPath: zipPath) else {
                      throw UnzipError.readFailed
                  }
                  let bytes = [UInt8](data)
                  let length = bytes.count

                  // Find End of Central Directory
                  var eocdOffset = -1
                  var i = length - 22
                  while i >= 0 {
                      if bytes[i] == 0x50 && bytes[i+1] == 0x4b && bytes[i+2] == 0x05 && bytes[i+3] == 0x06 {
                          eocdOffset = i
                          break
                      }
                      i -= 1
                  }
                  guard eocdOffset >= 0 else { throw UnzipError.invalidArchive }

                  func readUInt16(_ offset: Int) -> UInt16 {
                      UInt16(bytes[offset]) | (UInt16(bytes[offset+1]) << 8)
                  }
                  func readUInt32(_ offset: Int) -> UInt32 {
                      UInt32(bytes[offset]) | (UInt32(bytes[offset+1]) << 8) |
                      (UInt32(bytes[offset+2]) << 16) | (UInt32(bytes[offset+3]) << 24)
                  }

                  let entryCount = readUInt16(eocdOffset + 10)
                  let centralDirOffset = Int(readUInt32(eocdOffset + 16))

                  let fm = FileManager.default
                  try? fm.createDirectory(atPath: destDir, withIntermediateDirectories: true)

                  var pos = centralDirOffset
                  for _ in 0..<entryCount {
                      guard pos + 46 <= length else { break }
                      guard readUInt32(pos) == 0x02014b50 else { break }

                      let method = readUInt16(pos + 10)
                      let compSize = Int(readUInt32(pos + 20))
                      let nameLen = Int(readUInt16(pos + 28))
                      let extraLen = Int(readUInt16(pos + 30))
                      let commentLen = Int(readUInt16(pos + 32))
                      let localHeaderOffset = Int(readUInt32(pos + 42))

                      let nameBytes = Array(bytes[(pos + 46)..<(pos + 46 + nameLen)])
                      let fileName = String(bytes: nameBytes, encoding: .utf8) ?? "file_\(pos)"

                      pos += 46 + nameLen + extraLen + commentLen

                      if fileName.hasSuffix("/") {
                          let dirPath = (destDir as NSString).appendingPathComponent(fileName)
                          try? fm.createDirectory(atPath: dirPath, withIntermediateDirectories: true)
                          continue
                      }

                      guard localHeaderOffset + 30 <= length else { continue }
                      let localNameLen = Int(readUInt16(localHeaderOffset + 26))
                      let localExtraLen = Int(readUInt16(localHeaderOffset + 28))
                      let dataStart = localHeaderOffset + 30 + localNameLen + localExtraLen
                      guard dataStart + compSize <= length else { continue }

                      let compData = Data(bytes[dataStart..<(dataStart + compSize)])
                      var outData = Data()

                      if method == 0 {
                          outData = compData
                      } else if method == 8 {
                          outData = decompressRawDeflate(compData) ?? Data()
                      } else {
                          continue
                      }

                      let outPath = (destDir as NSString).appendingPathComponent(fileName)
                      let outParent = (outPath as NSString).deletingLastPathComponent
                      try? fm.createDirectory(atPath: outParent, withIntermediateDirectories: true)
                      fm.createFile(atPath: outPath, contents: outData)
                  }
              }

              private static func decompressRawDeflate(_ input: Data) -> Data? {
                  let bufferSize = max(input.count * 8, 1 << 16)
                  var output = Data(count: bufferSize)
                  let result = output.withUnsafeMutableBytes { outPtr -> Int in
                      input.withUnsafeBytes { inPtr -> Int in
                          compression_decode_buffer(
                              outPtr.bindMemory(to: UInt8.self).baseAddress!, bufferSize,
                              inPtr.bindMemory(to: UInt8.self).baseAddress!, input.count,
                              nil, COMPRESSION_ZLIB
                          )
                      }
                  }
                  guard result > 0 else { return nil }
                  return output.prefix(result)
              }
          }

          // MARK: - IPA Info Editor

          struct IPAInfo {
              var bundleIdentifier: String
              var bundleName: String
              var bundleDisplayName: String
              var shortVersion: String
              var bundleVersion: String
              var minimumOSVersion: String
          }

          class IPAEditor {

              static func readInfoPlist(from ipaPath: String) -> (info: IPAInfo?, plistPath: String?) {
                  let tempDir = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString)
                  do {
                      try ZipExtractor.extract(zipPath: ipaPath, to: tempDir.path)

                      // Find the .app bundle
                      let payloadDir = tempDir.appendingPathComponent("Payload")
                      guard let appBundle = try? FileManager.default.contentsOfDirectory(at: payloadDir, includingPropertiesForKeys: nil)
                          .first(where: { $0.pathExtension == "app" }) else {
                          return (nil, nil)
                      }

                      let plistPath = appBundle.appendingPathComponent("Info.plist")
                      guard let plistData = try? Data(contentsOf: plistPath),
                            let plist = try? PropertyListSerialization.propertyList(from: plistData, options: [], format: nil) as? [String: Any] else {
                          return (nil, nil)
                      }

                      let info = IPAInfo(
                          bundleIdentifier: plist["CFBundleIdentifier"] as? String ?? "",
                          bundleName: plist["CFBundleName"] as? String ?? "",
                          bundleDisplayName: plist["CFBundleDisplayName"] as? String ?? plist["CFBundleName"] as? String ?? "",
                          shortVersion: plist["CFBundleShortVersionString"] as? String ?? "",
                          bundleVersion: plist["CFBundleVersion"] as? String ?? "",
                          minimumOSVersion: plist["MinimumOSVersion"] as? String ?? ""
                      )

                      return (info, plistPath.path)
                  } catch {
                      return (nil, nil)
                  }
              }

              static func updateInfoPlist(at plistPath: String, newInfo: IPAInfo) throws {
                  guard let plistData = try? Data(contentsOf: URL(fileURLWithPath: plistPath)),
                        var plist = try? PropertyListSerialization.propertyList(from: plistData, options: [], format: nil) as? [String: Any] else {
                      throw UnzipError.invalidArchive
                  }

                  plist["CFBundleIdentifier"] = newInfo.bundleIdentifier
                  plist["CFBundleName"] = newInfo.bundleName
                  plist["CFBundleDisplayName"] = newInfo.bundleDisplayName
                  plist["CFBundleShortVersionString"] = newInfo.shortVersion
                  plist["CFBundleVersion"] = newInfo.bundleVersion
                  plist["MinimumOSVersion"] = newInfo.minimumOSVersion

                  let newData = try PropertyListSerialization.data(fromPropertyList: plist, format: .xml, options: 0)
                  try newData.write(to: URL(fileURLWithPath: plistPath))
              }

              static func repackIPA(from extractedPath: String, to outputPath: String) throws {
                  let tempDir = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString)
                  defer { try? FileManager.default.removeItem(at: tempDir) }

                  try FileManager.default.copyItem(at: URL(fileURLWithPath: extractedPath), to: tempDir)

                  let zipPath = tempDir.appendingPathComponent("Payload.zip")
                  let process = Process()
                  process.executableURL = URL(fileURLWithPath: "/usr/bin/zip")
                  process.arguments = ["-r", zipPath.path, "Payload"]
                  process.currentDirectoryURL = tempDir
                  try process.run()
                  process.waitUntilExit()

                  try FileManager.default.moveItem(at: zipPath, to: URL(fileURLWithPath: outputPath))
              }
          }

          // MARK: - Main View Controller

          final class MainViewController: UITableViewController {

              var files: [String] = []
              let documentsPath = NSSearchPathForDirectoriesInDomains(.documentDirectory, .userDomainMask, true).first!

              let accentPurple = UIColor(red: 88/255, green: 0/255, blue: 160/255, alpha: 1)
              let accentBlue = UIColor(red: 0/255, green: 120/255, blue: 200/255, alpha: 1)
              let bgDark = UIColor(red: 12/255, green: 12/255, blue: 24/255, alpha: 1)
              let cardDark = UIColor(red: 24/255, green: 24/255, blue: 44/255, alpha: 1)

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "IPA Editor"
                  view.backgroundColor = bgDark
                  tableView.backgroundColor = bgDark
                  tableView.separatorColor = UIColor.white.withAlphaComponent(0.08)
                  tableView.rowHeight = 72

                  navigationController?.navigationBar.barTintColor = bgDark
                  navigationController?.navigationBar.tintColor = accentBlue
                  navigationController?.navigationBar.titleTextAttributes = [
                      .foregroundColor: UIColor.white,
                      .font: UIFont.boldSystemFont(ofSize: 20)
                  ]
                  navigationController?.navigationBar.isTranslucent = false
                  if #available(iOS 13.0, *) {
                      overrideUserInterfaceStyle = .dark
                  }
                  navigationController?.toolbar.barTintColor = bgDark
                  navigationController?.toolbar.tintColor = accentBlue
                  navigationController?.toolbar.isTranslucent = false

                  let importBtn = UIBarButtonItem(title: "📥 استيراد", style: .plain, target: self, action: #selector(importIPATapped))
                  let refreshBtn = UIBarButtonItem(barButtonSystemItem: .refresh, target: self, action: #selector(refreshFiles))
                  let flex = UIBarButtonItem(barButtonSystemItem: .flexibleSpace, target: nil, action: nil)
                  toolbarItems = [importBtn, flex, refreshBtn]

                  refreshFiles()
              }

              override func viewWillAppear(_ animated: Bool) {
                  super.viewWillAppear(animated)
                  navigationController?.setToolbarHidden(false, animated: animated)
              }

              @objc func refreshFiles() {
                  let fm = FileManager.default
                  var found: [String] = []
                  if let enumerator = fm.enumerator(atPath: documentsPath) {
                      for case let file as String in enumerator {
                          if file.lowercased().hasSuffix(".ipa") {
                              found.append(file)
                          }
                      }
                  }
                  files = found.sorted()
                  tableView.reloadData()
              }

              @objc func importIPATapped() {
                  let alert = UIAlertController(title: "استيراد IPA", message: "ضع ملف IPA في مجلد المستندات ثم اضغط تحديث", preferredStyle: .alert)
                  alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                  present(alert, animated: true)
              }

              func emoji(for name: String) -> String {
                  return "📦"
              }

              override func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                  files.count
              }

              override func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                  let cell = UITableViewCell(style: .subtitle, reuseIdentifier: "cell")
                  let relPath = files[indexPath.row]
                  let fullPath = (documentsPath as NSString).appendingPathComponent(relPath)

                  cell.backgroundColor = cardDark
                  let bg = UIView()
                  bg.backgroundColor = accentPurple.withAlphaComponent(0.15)
                  cell.selectedBackgroundView = bg

                  cell.textLabel?.textColor = .white
                  cell.textLabel?.font = .systemFont(ofSize: 16, weight: .medium)
                  cell.textLabel?.text = "\(emoji(for: relPath))  \(relPath)"

                  let attrs = try? FileManager.default.attributesOfItem(atPath: fullPath)
                  let size = (attrs?[.size] as? NSNumber)?.int64Value ?? 0
                  cell.detailTextLabel?.textColor = accentBlue
                  cell.detailTextLabel?.font = .systemFont(ofSize: 12)
                  cell.detailTextLabel?.text = ByteCountFormatter.string(fromByteCount: size, countStyle: .file)

                  cell.accessoryType = .disclosureIndicator
                  return cell
              }

              override func tableView(_ tableView: UITableView, didSelectRowAt indexPath: IndexPath) {
                  tableView.deselectRow(at: indexPath, animated: true)
                  let relPath = files[indexPath.row]
                  let fullPath = (documentsPath as NSString).appendingPathComponent(relPath)
                  showEditor(for: fullPath)
              }

              func showEditor(for ipaPath: String) {
                  let (info, plistPath) = IPAEditor.readInfoPlist(from: ipaPath)
                  guard let info = info, let plistPath = plistPath else {
                      let alert = UIAlertController(title: "خطأ", message: "لا يمكن قراءة معلومات IPA", preferredStyle: .alert)
                      alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                      present(alert, animated: true)
                      return
                  }

                  let editorVC = EditorViewController()
                  editorVC.ipaPath = ipaPath
                  editorVC.plistPath = plistPath
                  editorVC.currentInfo = info
                  navigationController?.pushViewController(editorVC, animated: true)
              }
          }

          // MARK: - Editor View Controller

          final class EditorViewController: UIViewController {

              var ipaPath: String = ""
              var plistPath: String = ""
              var currentInfo: IPAInfo = IPAInfo(bundleIdentifier: "", bundleName: "", bundleDisplayName: "", shortVersion: "", bundleVersion: "", minimumOSVersion: "")

              let accentPurple = UIColor(red: 88/255, green: 0/255, blue: 160/255, alpha: 1)
              let accentBlue = UIColor(red: 0/255, green: 120/255, blue: 200/255, alpha: 1)
              let bgDark = UIColor(red: 12/255, green: 12/255, blue: 24/255, alpha: 1)
              let cardDark = UIColor(red: 24/255, green: 24/255, blue: 44/255, alpha: 1)

              var textFields: [UITextField] = []

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = bgDark
                  title = "تعديل IPA"

                  navigationItem.rightBarButtonItem = UIBarButtonItem(
                      title: "💾 حفظ",
                      style: .done,
                      target: self,
                      action: #selector(saveChanges)
                  )

                  setupUI()
              }

              func setupUI() {
                  let scrollView = UIScrollView()
                  scrollView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(scrollView)

                  let contentView = UIView()
                  contentView.translatesAutoresizingMaskIntoConstraints = false
                  scrollView.addSubview(contentView)

                  NSLayoutConstraint.activate([
                      scrollView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      scrollView.bottomAnchor.constraint(equalTo: view.safeAreaLayoutGuide.bottomAnchor),
                      scrollView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      scrollView.trailingAnchor.constraint(equalTo: view.trailingAnchor),

                      contentView.topAnchor.constraint(equalTo: scrollView.topAnchor),
                      contentView.bottomAnchor.constraint(equalTo: scrollView.bottomAnchor),
                      contentView.leadingAnchor.constraint(equalTo: scrollView.leadingAnchor),
                      contentView.trailingAnchor.constraint(equalTo: scrollView.trailingAnchor),
                      contentView.widthAnchor.constraint(equalTo: scrollView.widthAnchor),
                  ])

                  let fields = [
                      ("معرف البندل (Bundle ID)", currentInfo.bundleIdentifier),
                      ("اسم البندل", currentInfo.bundleName),
                      ("اسم العرض", currentInfo.bundleDisplayName),
                      ("الإصدار القصير", currentInfo.shortVersion),
                      ("رقم الإصدار", currentInfo.bundleVersion),
                      ("الحد الأدنى لنظام iOS", currentInfo.minimumOSVersion),
                  ]

                  var previousField: UITextField?

                  for (index, (labelText, value)) in fields.enumerated() {
                      let label = UILabel()
                      label.text = labelText
                      label.textColor = .white
                      label.font = .systemFont(ofSize: 14, weight: .medium)
                      label.translatesAutoresizingMaskIntoConstraints = false
                      contentView.addSubview(label)

                      let textField = UITextField()
                      textField.text = value
                      textField.textColor = .white
                      textField.backgroundColor = cardDark
                      textField.layer.cornerRadius = 8
                      textField.layer.borderWidth = 1
                      textField.layer.borderColor = accentPurple.withAlphaComponent(0.3).cgColor
                      textField.leftView = UIView(frame: CGRect(x: 0, y: 0, width: 12, height: 0))
                      textField.leftViewMode = .always
                      textField.translatesAutoresizingMaskIntoConstraints = false
                      textField.heightAnchor.constraint(equalToConstant: 44).isActive = true
                      contentView.addSubview(textField)

                      textFields.append(textField)

                      NSLayoutConstraint.activate([
                          label.topAnchor.constraint(equalTo: previousField?.bottomAnchor ?? contentView.topAnchor, constant: previousField == nil ? 20 : 16),
                          label.leadingAnchor.constraint(equalTo: contentView.leadingAnchor, constant: 20),
                          label.trailingAnchor.constraint(equalTo: contentView.trailingAnchor, constant: -20),

                          textField.topAnchor.constraint(equalTo: label.bottomAnchor, constant: 6),
                          textField.leadingAnchor.constraint(equalTo: contentView.leadingAnchor, constant: 20),
                          textField.trailingAnchor.constraint(equalTo: contentView.trailingAnchor, constant: -20),
                      ])

                      previousField = textField
                  }

                  let bottomSpacer = UIView()
                  bottomSpacer.translatesAutoresizingMaskIntoConstraints = false
                  contentView.addSubview(bottomSpacer)

                  NSLayoutConstraint.activate([
                      bottomSpacer.topAnchor.constraint(equalTo: previousField?.bottomAnchor ?? contentView.topAnchor, constant: 30),
                      bottomSpacer.bottomAnchor.constraint(equalTo: contentView.bottomAnchor, constant: -30),
                      bottomSpacer.heightAnchor.constraint(equalToConstant: 1),
                  ])
              }

              @objc func saveChanges() {
                  guard textFields.count == 6 else { return }

                  let newInfo = IPAInfo(
                      bundleIdentifier: textFields[0].text ?? currentInfo.bundleIdentifier,
                      bundleName: textFields[1].text ?? currentInfo.bundleName,
                      bundleDisplayName: textFields[2].text ?? currentInfo.bundleDisplayName,
                      shortVersion: textFields[3].text ?? currentInfo.shortVersion,
                      bundleVersion: textFields[4].text ?? currentInfo.bundleVersion,
                      minimumOSVersion: textFields[5].text ?? currentInfo.minimumOSVersion
                  )

                  do {
                      try IPAEditor.updateInfoPlist(at: plistPath, newInfo: newInfo)

                      // Repack IPA
                      let extractedPath = (plistPath as NSString).deletingLastPathComponent
                      let originalName = (ipaPath as NSString).lastPathComponent
                      let outputDir = (ipaPath as NSString).deletingLastPathComponent
                      let outputPath = (outputDir as NSString).appendingPathComponent("modified_" + originalName)

                      try IPAEditor.repackIPA(from: extractedPath, to: outputPath)

                      let alert = UIAlertController(title: "نجاح", message: "تم حفظ التغييرات وإعادة تعبئة IPA", preferredStyle: .alert)
                      alert.addAction(UIAlertAction(title: "حسناً", style: .default) { _ in
                          self.navigationController?.popViewController(animated: true)
                      })
                      present(alert, animated: true)
                  } catch {
                      let alert = UIAlertController(title: "خطأ", message: "فشل حفظ التغييرات: \(error.localizedDescription)", preferredStyle: .alert)
                      alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                      present(alert, animated: true)
                  }
              }
          }

          // MARK: - App Delegate

          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let root = MainViewController()
                  let nav = UINavigationController(rootViewController: root)
                  window?.rootViewController = nav
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          // MARK: - Entry Point

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          SEOF

          cat > Resources/Info.plist << 'MEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>IPAEditor</string>
              <key>CFBundleIdentifier</key>
              <string>com.ipa.editor</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>IPA Editor</string>
              <key>CFBundleDisplayName</key>
              <string>IPA Editor</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon60x60@3x.png</string>
                      </array>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76@2x~ipad.png</string>
                          <string>AppIcon83.5x83.5@2x~ipad.png</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          MEOF

      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -o IPAEditor

          file IPAEditor

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/IPAEditor.app

          cp IPAEditor build-output/Payload/IPAEditor.app/IPAEditor
          cp Resources/Info.plist build-output/Payload/IPAEditor.app/Info.plist
          cp Resources/AppIcon*.png build-output/Payload/IPAEditor.app/ 2>/dev/null || true

          ldid -S build-output/Payload/IPAEditor.app/IPAEditor

          cd build-output
          zip -r -q ../artifacts/IPAEditor.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/IPAEditor.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPAEditor-IPA
          path: artifacts/IPAEditor.ipa
          retention-days: 30
