name: Build_21s_SwiftUI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install ldid
        run: brew install ldid

      - name: Prepare Resources
        run: |
          mkdir -p Resources
          cat > Resources/apps_data.json << 'JEOF'
          { "name": "21s Store", "identifier": "com.vip21.store", "sourceURL": "https://repository.apptesters.org/apps.json", "iconURL": "https://a.top4top.io/p_380487iqk0.jpeg", "website": "https://t.me/ClickStoreipaios", "subtitle": "متجر 21s VIP", "apps": [] }
          JEOF
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>VIP21Store</string>
              <key>CFBundleIdentifier</key><string>com.vip21.store</string>
              <key>CFBundleName</key><string>21s</string>
              <key>CFBundleDisplayName</key><string>21s</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>7.0</string>
              <key>CFBundleVersion</key><string>7</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>16.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UILaunchScreen</key><dict/>
              <key>UISupportedInterfaceOrientations~ipad</key><array><string>UIInterfaceOrientationPortrait</string><string>UIInterfaceOrientationPortraitUpsideDown</string><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
              <key>NSPhotoLibraryUsageDescription</key><string>لاستيراد الأيقونات</string>
              <key>NSCameraUsageDescription</key><string>للمسح الضوئي للشهادات</string>
              <key>NSFaceIDUsageDescription</key><string>لحماية الوصول</string>
              <key>ITSAppUsesNonExemptEncryption</key><false/>
              <key>CFBundleDocumentTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeName</key><string>IPA File</string>
                      <key>LSHandlerRank</key><string>Owner</string>
                      <key>LSItemContentTypes</key><array><string>com.apple.application</string><string>public.archive</string></array>
                  </dict>
                  <dict>
                      <key>CFBundleTypeName</key><string>Certificate</string>
                      <key>LSHandlerRank</key><string>Alternate</string>
                      <key>LSItemContentTypes</key><array><string>com.rsa.pkcs-12</string><string>com.apple.mobileprovision</string></array>
                  </dict>
              </array>
              <key>UTExportedTypeDeclarations</key>
              <array>
                  <dict>
                      <key>UTTypeIdentifier</key><string>com.vip21.ipa</string>
                      <key>UTTypeConformsTo</key><array><string>public.archive</string><string>com.apple.application</string></array>
                      <key>UTTypeDescription</key><string>21s IPA</string>
                      <key>UTTypeTagSpecification</key>
                      <dict><key>public.filename-extension</key><array><string>ipa</string></array></dict>
                  </dict>
              </array>
          </dict>
          </plist>
          PEOF
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYI'
          from PIL import Image, ImageDraw, ImageFont
          sz = 1024
          img = Image.new("RGB", (sz, sz), (10, 11, 20))
          d = ImageDraw.Draw(img)
          for y in range(sz):
              t = y/sz
              d.line([(0,y),(sz,y)], fill=(int(110*(1-t)+34*t), int(86*(1-t)+211*t), int(207*(1-t)+238*t)))
          d.rounded_rectangle([sz*.14,sz*.30,sz*.86,sz*.80], radius=sz*.10, outline=(255,255,255), width=max(2,sz//34))
          try: f = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(sz*.30))
          except: f = ImageFont.load_default()
          b = d.textbbox((0,0),"21s",font=f)
          d.text(((sz-(b[2]-b[0]))/2-b[0],(sz-(b[3]-b[1]))/2-b[1]),"21s",fill=(255,255,255),font=f)
          img.save("Resources/AppIcon1024x1024.png")
          img.resize((120,120)).save("Resources/AppIcon60x60@2x.png")
          img.resize((152,152)).save("Resources/AppIcon76x76@2x~ipad.png")
          PYI

      - name: Generate Source - Constants.swift
        run: echo '' | base64 --decode > Constants.swift
          echo "Constants.swift generated"

      - name: Generate Source - Models.swift
        run: echo '' | base64 --decode > Models.swift
          echo "Models.swift generated"

      - name: Generate Source - VIPZipHelper.swift
        run: echo '' | base64 --decode > VIPZipHelper.swift
          echo "VIPZipHelper.swift generated"

      - name: Generate Source - SigningEngine.swift
        run: echo '' | base64 --decode > SigningEngine.swift
          echo "SigningEngine.swift generated"

      - name: Generate Source - VIP21InstallEngine.swift
        run: echo '' | base64 --decode > VIP21InstallEngine.swift
          echo "VIP21InstallEngine.swift generated"

      - name: Generate Source - Managers.swift
        run: echo '' | base64 --decode > Managers.swift
          echo "Managers.swift generated"

      - name: Generate Source - AppsManager.swift
        run: echo '' | base64 --decode > AppsManager.swift
          echo "AppsManager.swift generated"

      - name: Generate Source - SharedComponents.swift
        run: echo '' | base64 --decode > SharedComponents.swift
          echo "SharedComponents.swift generated"

      - name: Generate Source - ContentView.swift
        run: echo '' | base64 --decode > ContentView.swift
          echo "ContentView.swift generated"

      - name: Generate Source - HomeTabView.swift
        run: echo '' | base64 --decode > HomeTabView.swift
          echo "HomeTabView.swift generated"

      - name: Generate Source - AppsTabView.swift
        run: echo '' | base64 --decode > AppsTabView.swift
          echo "AppsTabView.swift generated"

      - name: Generate Source - AppDetailView.swift
        run: echo '' | base64 --decode > AppDetailView.swift
          echo "AppDetailView.swift generated"

      - name: Generate Source - SigningTabView.swift
        run: echo '' | base64 --decode > SigningTabView.swift
          echo "SigningTabView.swift generated"

      - name: Generate Source - InstallSupportViews.swift
        run: echo '' | base64 --decode > InstallSupportViews.swift
          echo "InstallSupportViews.swift generated"

      - name: Generate Source - IPAPatcher.swift
        run: echo '' | base64 --decode > IPAPatcher.swift
          echo "IPAPatcher.swift generated"

      - name: Generate Source - ChatView.swift
        run: echo '' | base64 --decode > ChatView.swift
          echo "ChatView.swift generated"

      - name: Generate Source - SettingsView.swift
        run: echo '' | base64 --decode > SettingsView.swift
          echo "SettingsView.swift generated"

      - name: Generate Source - VIP21StoreApp.swift
        run: echo '' | base64 --decode > VIP21StoreApp.swift
          echo "VIP21StoreApp.swift generated"


      - name: Build Application
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          set -e
          xcrun swiftc \
            Constants.swift \
            Models.swift \
            VIPZipHelper.swift \
            SigningEngine.swift \
            VIP21InstallEngine.swift \
            Managers.swift \
            AppsManager.swift \
            SharedComponents.swift \
            ContentView.swift \
            HomeTabView.swift \
            AppsTabView.swift \
            AppDetailView.swift \
            SigningTabView.swift \
            InstallSupportViews.swift \
            IPAPatcher.swift \
            ChatView.swift \
            SettingsView.swift \
            VIP21StoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework Network \
            -framework PhotosUI \
            -framework UniformTypeIdentifiers \
            -framework CryptoKit \
            -framework Compression \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA Package
        run: |
          set -e
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-IPA-SwiftUI-v7
          path: artifacts/21s.ipa
