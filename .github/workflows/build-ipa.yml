                                  HStack(spacing: 6) {
                                      Image(systemName: "exclamationmark.triangle.fill")
                                          .foregroundColor(.xcodeRed)
                                          .font(.system(size: 12))
                                      Text(err).font(.system(size: 12)).foregroundColor(.xcodeRed)
                                      Spacer()
                                  }
                                  .padding(.horizontal, 24)
                              }
          
                              Button {
                                  performDeactivation()
                              } label: {
                                  Text("Deactivate my account")
                                      .font(.system(size: 15, weight: .bold))
                                      .foregroundColor(.white)
                                      .frame(maxWidth: .infinity)
                                      .frame(height: 50)
                                      .background(Capsule().fill(Color.storePink))
                                      .opacity(confirmText == required ? 1.0 : 0.5)
                              }
                              .padding(.horizontal, 20)
                              .disabled(confirmText != required)
          
                              Button {
                                  isPresented = false
                              } label: {
                                  Text("Cancel")
                                      .font(.system(size: 14, weight: .semibold))
                                      .foregroundColor(.storeSub)
