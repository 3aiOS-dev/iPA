          struct AppsListView: View {
              @ObservedObject var feed: StoreFeed
              @State private var searchText: String = ""
              @State private var selectedCategory: String? = nil
              @State private var visiblePage: Int = 0

              private static let hiddenCategories: [String] = ["movies", "movie", "films", "film", "أفلام", "افلام"]

              private static func isHidden(_ c: String?) -> Bool {
                  let v = (c ?? "").trimmingCharacters(in: .whitespaces).lowercased()
                  return hiddenCategories.contains(v)
              }

              private var filtered: [StoreAPIApp] {
                  let base = feed.apps.filter { !AppsListView.isHidden($0.category) }
                  let byCat: [StoreAPIApp]
                  if let cat = selectedCategory {
                      byCat = base.filter { ($0.category ?? "التطبيقات").lowercased() == cat.lowercased() }
                  } else {
                      byCat = base
                  }
                  let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return byCat }
                  return byCat.filter {
                      $0.name.lowercased().contains(q) || ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }

              private var filteredPages: Int {
                  max(1, Int(ceil(Double(filtered.count) / Double(AppConstants.feedPageSize))))
              }

              private var visibleItems: [StoreAPIApp] {
                  let start = visiblePage * AppConstants.feedPageSize
                  let end = min(start + AppConstants.feedPageSize, filtered.count)
                  guard start < filtered.count else { return [] }
                  return Array(filtered[start..<end])
              }

              private var categories: [String] {
                  let set = Set(feed.apps.compactMap { $0.category?.capitalized }
                                  .filter { !AppsListView.isHidden($0) })
                  return Array(set).sorted()
              }

