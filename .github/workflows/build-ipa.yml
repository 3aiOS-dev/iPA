          // MARK: - GIF Player
          struct LoopingGifPlayer: UIViewRepresentable {
              let resourceName: String
              let ext: String
              var fillMode: GifFillMode = .fit

              func makeUIView(context: Context) -> UIView {
                  let container = UIView()
                  container.backgroundColor = .clear
                  container.clipsToBounds = true
                  let imageView = UIImageView()
                  imageView.contentMode = (fillMode == .fill) ? .scaleAspectFill : .scaleAspectFit
                  imageView.translatesAutoresizingMaskIntoConstraints = false
                  imageView.clipsToBounds = true
                  container.addSubview(imageView)
                  NSLayoutConstraint.activate([
                      imageView.topAnchor.constraint(equalTo: container.topAnchor),
                      imageView.bottomAnchor.constraint(equalTo: container.bottomAnchor),
                      imageView.leadingAnchor.constraint(equalTo: container.leadingAnchor),
                      imageView.trailingAnchor.constraint(equalTo: container.trailingAnchor)
                  ])
                  if let gif = UIImage.gif(name: resourceName) {
                      imageView.image = gif
                  } else if let png = UIImage.bundled("\(resourceName).png") {
                      imageView.image = png
                  }
                  return container
              }

              func updateUIView(_ uiView: UIView, context: Context) {}
          }

          extension UIImage {
              static func gif(name: String) -> UIImage? {
                  guard let path = Bundle.main.path(forResource: name, ofType: "gif") else { return nil }
                  let url = URL(fileURLWithPath: path)
                  guard let data = try? Data(contentsOf: url) else { return nil }
                  return gif(data: data)
              }

              static func gif(data: Data) -> UIImage? {
                  guard let source = CGImageSourceCreateWithData(data as CFData, nil) else { return nil }
                  let count = CGImageSourceGetCount(source)
                  guard count > 0 else { return nil }
                  var images: [UIImage] = []
                  var duration: TimeInterval = 0
                  for i in 0..<count {
                      guard let cg = CGImageSourceCreateImageAtIndex(source, i, nil) else { continue }
                      images.append(UIImage(cgImage: cg))
                      let props = CGImageSourceCopyPropertiesAtIndex(source, i, nil) as? [CFString: Any]
                      if let gifProps = props?[kCGImagePropertyGIFDictionary] as? [CFString: Any],
                         let delay = gifProps[kCGImagePropertyGIFDelayTime] as? Double {
                          duration += delay
                      }
                  }
                  if images.isEmpty { return nil }
                  if duration <= 0 { duration = Double(count) * 0.1 }
                  return UIImage.animatedImage(with: images, duration: duration)
              }
          }

          enum GifFillMode { case fit, fill }

