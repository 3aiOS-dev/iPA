              private var featured: StoreAPIApp? { apps.isEmpty ? nil : apps[dayIndex] }

              var body: some View {
                  ZStack(alignment: .topTrailing) {
                      RoundedRectangle(cornerRadius: 22, style: .continuous)
                          .fill(LinearGradient(colors: [Color(red: 0.298, green: 0.098, blue: 0.686),
                                                        Color(red: 0.09, green: 0.11, blue: 0.24),
                                                        Color.black],
                                               startPoint: .topTrailing, endPoint: .bottomLeading))

                      Circle()
                          .fill(Color.storePrimary.opacity(0.35))
                          .frame(width: 160, height: 160)
                          .blur(radius: 50)
                          .offset(x: -70, y: -40)

