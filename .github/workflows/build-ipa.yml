              // MARK: Logic
              private func performLookup() {
                  let raw = linkInput
                  guard let id = LinkParser.extractAppID(from: raw) else {
                      errorMessage = "We couldn't find an app ID in that link. Try pasting the full App Store URL."
                      return
                  }
                  Task { await fetch(byID: id) }
              }

              private func fetch(byID id: String) async {
                  isLoading = true
                  errorMessage = nil
                  defer { isLoading = false }
                  do {
                      let result = try await LookupService.shared.lookup(appID: id)
                      await MainActor.run {
                          self.app = result
                          self.linkInput = ""
                          HistoryStore.shared.record(result)
                          HapticManager.shared.success()
                      }
                  } catch {
                      await MainActor.run {
                          self.errorMessage = error.localizedDescription
                          HapticManager.shared.error()
                      }
                  }
              }

              static func prettyCount(_ n: Int) -> String {
                  if n >= 1_000_000 { return String(format: "%.1fM", Double(n) / 1_000_000) }
                  if n >= 1_000     { return String(format: "%.1fK", Double(n) / 1_000) }
                  return "\(n)"
              }
          }

