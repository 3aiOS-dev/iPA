          // MARK: - Apps List View (with categories)
          struct AppsListView: View {
              @ObservedObject var feed: StoreFeed
              @State private var searchText: String = ""
              @State private var selectedCategory: String? = nil

              private var filtered: [StoreAPIApp] {
                  let base = feed.apps
                  let byCat = selectedCategory == nil ? base : base.filter { ($0.category ?? "").lowercased() == selectedCategory!.lowercased() }
                  let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return byCat }
                  return byCat.filter {
                      $0.name.lowercased().contains(q) ||
                      ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }

              // Sorted: recent first (new badge)
              private var sortedApps: [StoreAPIApp] {
                  filtered.sorted { (a, b) in
                      let aRecent = feed.isRecent(a)
                      let bRecent = feed.isRecent(b)
                      if aRecent != bRecent { return aRecent && !bRecent }
                      return a.name < b.name
                  }
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          StoreTopBar()
                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 14) {
                                  HStack(spacing: 8) {
                                      Image(systemName: "magnifyingglass")
                                          .foregroundColor(.storeSub)
                                      TextField("ابحث في \(feed.totalAvailable) تطبيق...", text: $searchText)
                                          .font(.system(size: 14))
                                          .foregroundColor(.storeText)
                                      if !searchText.isEmpty {
                                          Button { searchText = "" } label: {
                                              Image(systemName: "xmark.circle.fill")
                                                  .foregroundColor(.storeSub)
                                          }
                                      }
                                  }
                                  .padding(.horizontal, 14)
                                  .frame(height: 46)
                                  .background(RoundedRectangle(cornerRadius: 16).fill(ThemePalette.card))
                                  .overlay(RoundedRectangle(cornerRadius: 16).stroke(ThemePalette.divider, lineWidth: 1))
                                  .padding(.horizontal, 18)

                                  if !feed.categories.isEmpty {
                                      CategoryPills(categories: feed.categories, selected: $selectedCategory)
                                  }

                                  if feed.apps.isEmpty && feed.isLoading {
                                      LoadingList()
                                  } else if sortedApps.isEmpty {
                                      EmptyState(message: searchText.isEmpty ? "لا توجد تطبيقات في هذا التصنيف." : "لا توجد نتائج تطابق «\(searchText)».")
                                  } else {
                                      LazyVStack(spacing: 10) {
                                          ForEach(sortedApps) { app in
                                              NavigationLink(value: app) {
                                                  AppRow(app: app, onInstall: { StoreInstaller.shared.install(app: app) },
                                                         showNewBadge: feed.isRecent(app))
                                              }
                                              .buttonStyle(.plain)
                                          }
                                      }
                                      .padding(.horizontal, 18)
                                      .padding(.bottom, 24)
                                  }
                              }
                              .padding(.top, 4)
                          }
                          .refreshable { await feed.refresh() }
                      }
                      .background(ThemePalette.bg.ignoresSafeArea())
                      .navigationBarHidden(true)
                      .navigationDestination(for: StoreAPIApp.self) { app in
                          AppDetailView(app: app, feed: feed)
                      }
                  }
              }
          }

          // MARK: - Alerts (Updates) View
          struct AlertsView: View {
              @ObservedObject var feed: StoreFeed

              private var recentItems: [StoreAPIApp] {
                  feed.recentApps
              }

              private var newlyAdded: [StoreAPIApp] {
                  recentItems.filter { feed.isRecent($0) && (($0.createdAt ?? $0.updatedAt ?? "") != "") } // heuristic
              }

              private var updatedOnly: [StoreAPIApp] {
                  recentItems.filter { !newlyAdded.contains($0) }
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          StoreTopBar()
                          ScrollView(showsIndicators: false) {
                              VStack(alignment: .leading, spacing: 12) {
                                  if feed.isLoading {
                                      LoadingList()
                                  } else if recentItems.isEmpty {
                                      EmptyState(message: "لا توجد تحديثات جديدة حالياً.")
                                          .padding(.horizontal, 20)
                                  } else {
                                      // Newly added
                                      if !newlyAdded.isEmpty {
                                          HStack(spacing: 8) {
                                              Image(systemName: "sparkles")
                                                  .font(.system(size: 13, weight: .bold))
                                                  .foregroundColor(.storePrimary)
                                              Text("المضافة مؤخراً")
                                                  .font(.system(size: 15, weight: .heavy))
                                                  .foregroundColor(.storeText)
                                              Text("(\(newlyAdded.count))")
                                                  .font(.system(size: 12, weight: .bold))
                                                  .foregroundColor(.storeSub)
                                              Spacer()
                                          }
                                          .padding(.horizontal, 22)
                                          .padding(.top, 4)

                                          ForEach(newlyAdded) { app in
                                              UpdateRow(app: app, isNew: true)
                                                  .padding(.horizontal, 20)
                                          }
                                      }

                                      // Updated
                                      if !updatedOnly.isEmpty {
                                          HStack(spacing: 8) {
                                              Image(systemName: "arrow.triangle.2.circlepath")
                                                  .font(.system(size: 13, weight: .bold))
                                                  .foregroundColor(.storeCyan)
                                              Text("تحديثات الإصدارات")
                                                  .font(.system(size: 15, weight: .heavy))
                                                  .foregroundColor(.storeText)
                                              Text("(\(updatedOnly.count))")
                                                  .font(.system(size: 12, weight: .bold))
                                                  .foregroundColor(.storeSub)
                                              Spacer()
                                          }
                                          .padding(.horizontal, 22)
                                          .padding(.top, newlyAdded.isEmpty ? 4 : 14)

                                          ForEach(updatedOnly) { app in
                                              UpdateRow(app: app, isNew: false)
                                                  .padding(.horizontal, 20)
                                          }
                                      }
                                  }
                              }
                              .padding(.top, 14)
                              .padding(.bottom, 26)
                          }
                          .refreshable { await feed.refresh() }
                      }
                      .background(ThemePalette.bg.ignoresSafeArea())
                      .navigationBarHidden(true)
                  }
              }
          }

