          import SwiftUI
          import UIKit
          import UniformTypeIdentifiers

          // MARK: - IPA Files Tab
          struct IPAFilesTabView: View {
              @ObservedObject var ipaManager: IPAManager
              @State private var showImporter = false
              @State private var selectedIPA: LocalIPA?
              @State private var searchText = ""
              @State private var recoverProgress: Double = 0
              @State private var recoverMessage: String = ""
              @State private var isRecovering = false
              @State private var showShare = false
              @State private var shareURL: URL? = nil
              @Environment(\.colorScheme) var scheme

              var filtered: [LocalIPA] {
                  guard !searchText.isEmpty else { return ipaManager.ipas }
                  return ipaManager.ipas.filter {
                      $0.displayName.localizedCaseInsensitiveContains(searchText) ||
                      $0.bundleID.localizedCaseInsensitiveContains(searchText) ||
                      $0.fileName.localizedCaseInsensitiveContains(searchText)
                  }
              }

              var body: some View {
                  NavigationView {
                      ZStack(alignment: .bottom) {
                          (scheme == .dark ? Color.vipDark : Color(red: 0.96, green: 0.96, blue: 1.0))
                              .ignoresSafeArea()

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 14) {
                                  header
                                  searchBar
                                  if ipaManager.ipas.isEmpty { emptyState } else { list }
                              }
                              .padding(.bottom, 110)
                          }

                          if ipaManager.isImporting { importProgressCard }
                          if isRecovering { recoverOverlay }

                          VStack {
                              Spacer()
                              importButton
                          }
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              Text("ملفات IPA")
                                  .font(.system(size: 20, weight: .bold))
                                  .foregroundColor(.vipPurple)
                          }
                      }
                  }
                  .fileImporter(isPresented: $showImporter,
                                allowedContentTypes: [UTType(filenameExtension: "ipa") ?? .data, .zip, .data],
                                allowsMultipleSelection: true) { result in
                      switch result {
                      case .success(let urls):
                          for url in urls { ipaManager.importIPA(from: url) }
                      case .failure(let err):
                          ipaManager.lastError = err.localizedDescription
                      }
                  }
                  .sheet(item: $selectedIPA) { ipa in
                      IPADetailView(ipa: ipa, ipaManager: ipaManager) { outURL in
                          shareURL = outURL
                          showShare = true
                      }
                  }
                  .sheet(isPresented: $showShare) {
                      if let url = shareURL { ShareSheet(items: [url]) }
                  }
              }

              private var header: some View {
                  HStack(spacing: 12) {
                      ZStack {
                          RoundedRectangle(cornerRadius: 14)
                              .fill(LinearGradient(colors: [Color(red: 1.0, green: 0.45, blue: 0.2), .pink],
                                                   startPoint: .topLeading, endPoint: .bottomTrailing))
                              .frame(width: 46, height: 46)
                              .shadow(color: .orange.opacity(0.4), radius: 6, y: 3)
                          Image(systemName: "archivebox.fill").foregroundColor(.white)
                      }
                      VStack(alignment: .trailing, spacing: 2) {
                          Text("مكتبة IPA").font(.system(size: 18, weight: .heavy))
                          Text("\(ipaManager.ipas.count) ملف  •  \(ipaManager.ipas.filter{$0.isInstalled}.count) مسترد")
                              .font(.system(size: 11)).foregroundColor(.gray)
                      }
                      Spacer()
                  }.padding(.horizontal).padding(.top, 6)
              }

              private var searchBar: some View {
                  HStack(spacing: 10) {
                      Image(systemName: "magnifyingglass").foregroundColor(.gray)
                      TextField("ابحث في الملفات...", text: $searchText).multilineTextAlignment(.trailing)
                      if !searchText.isEmpty {
                          Button(action: { searchText = "" }) {
                              Image(systemName: "xmark.circle.fill").foregroundColor(.gray)
                          }
                      }
                  }
                  .padding(12)
                  .background(RoundedRectangle(cornerRadius: 14)
                      .fill(scheme == .dark ? Color.cardDark : Color.white)
                      .shadow(color: .black.opacity(0.05), radius: 6))
                  .padding(.horizontal)
              }

              private var list: some View {
                  LazyVStack(spacing: 10) {
                      ForEach(filtered) { ipa in
                          IPARow(ipa: ipa) {
                              selectedIPA = ipa
                          } onDelete: {
                              withAnimation { ipaManager.delete(ipa) }
                              HapticManager.shared.notification(.warning)
                          } onRecover: {
                              recover(ipa)
                          } onShare: {
                              shareURL = ipa.sourceURL
                              showShare = true
                          }
                          .padding(.horizontal)
                      }
                  }
              }

              private var emptyState: some View {
                  VStack(spacing: 18) {
                      Image(systemName: "tray.and.arrow.down.fill")
                          .font(.system(size: 60))
                          .foregroundStyle(LinearGradient(colors: [.vipPurple, .blue], startPoint: .top, endPoint: .bottom))
                      Text("لا توجد ملفات بعد").font(.system(size: 18, weight: .bold))
                      Text("اضغط زر + أدناه لاستيراد ملف IPA\nسيتم فك الضغط وقراءة البيانات تلقائياً")
                          .font(.system(size: 12)).foregroundColor(.gray).multilineTextAlignment(.center)
                  }
                  .padding(40).frame(maxWidth: .infinity).padding(.top, 60)
              }

              private var importButton: some View {
                  Button {
                      HapticManager.shared.impact(.medium)
                      showImporter = true
                  } label: {
                      HStack(spacing: 10) {
                          Image(systemName: "plus.circle.fill").font(.system(size: 22, weight: .bold))
                          Text("استيراد ملف IPA").font(.system(size: 16, weight: .bold))
                      }
                      .foregroundColor(.white)
                      .padding(.horizontal, 22).padding(.vertical, 14)
                      .background(LinearGradient(colors: [.vipPurple, .blue], startPoint: .leading, endPoint: .trailing))
                      .clipShape(Capsule())
                      .shadow(color: .vipPurple.opacity(0.5), radius: 14, x: 0, y: 8)
                  }
                  .padding(.bottom, 18)
              }

              private var importProgressCard: some View {
                  VStack(spacing: 10) {
                      HStack {
                          Image(systemName: "archivebox").foregroundColor(.white)
                          Text(ipaManager.importMessage).foregroundColor(.white)
                              .font(.system(size: 13, weight: .semibold))
                          Spacer()
                          Text("\(Int(ipaManager.importProgress * 100))%")
                              .foregroundColor(.white).font(.system(size: 12, weight: .bold))
                      }
                      ProgressView(value: ipaManager.importProgress)
                          .progressViewStyle(LinearProgressViewStyle(tint: .white))
                  }
                  .padding(14)
                  .background(LinearGradient(colors: [.vipPurple, .blue], startPoint: .leading, endPoint: .trailing))
                  .cornerRadius(16)
                  .shadow(color: .black.opacity(0.3), radius: 12, y: 6)
                  .padding(.horizontal, 20)
                  .padding(.bottom, 90)
                  .transition(.move(edge: .bottom).combined(with: .opacity))
              }

              private var recoverOverlay: some View {
                  VStack(spacing: 14) {
                      ProgressView(value: recoverProgress)
                          .progressViewStyle(CircularProgressViewStyle(tint: .white))
                          .scaleEffect(1.4)
                      Text(recoverMessage).foregroundColor(.white)
                          .font(.system(size: 14, weight: .semibold))
                          .multilineTextAlignment(.center)
                      Text("\(Int(recoverProgress * 100))%")
                          .foregroundColor(.white).font(.system(size: 24, weight: .black))
                  }
                  .padding(30)
                  .background(LinearGradient(colors: [.vipPurple, .blue], startPoint: .topLeading, endPoint: .bottomTrailing))
                  .cornerRadius(20)
                  .shadow(color: .black.opacity(0.4), radius: 20)
              }

              private func recover(_ ipa: LocalIPA) {
                  isRecovering = true
                  recoverProgress = 0
                  recoverMessage = "جاري استرداد \(ipa.displayName)…"
                  ipaManager.recoverIPA(ipa, progress: { p, msg in
                      recoverProgress = p
                      recoverMessage = msg
                  }) { result in
                      isRecovering = false
                      switch result {
                      case .success(let url):
                          recoverMessage = "تم الاسترداد ✓"
                          HapticManager.shared.notification(.success)
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                              shareURL = url
                              showShare = true
                          }
                      case .failure(let err):
                          recoverMessage = "فشل: \(err.localizedDescription)"
                          HapticManager.shared.notification(.error)
                      }
                  }
              }
          }

          // MARK: - IPA Row
          struct IPARow: View {
              let ipa: LocalIPA
              let onTap: () -> Void
              let onDelete: () -> Void
              let onRecover: () -> Void
              let onShare: () -> Void
              @Environment(\.colorScheme) var scheme

              var iconURL: URL? {
                  guard let app = ipa.extractedPath?.appendingPathComponent("Payload").appendingPathComponent(ipa.payloadAppName ?? "") else { return nil }
                  if let iconName = ipa.iconRelativePath, !iconName.isEmpty {
                      for c in ["@3x.png", "@2x.png", ".png"] {
                          let p = app.appendingPathComponent("\(iconName)\(c)")
