          import UIKit

          final class SettingsViewController: UIViewController, UITableViewDataSource, UITableViewDelegate {

              private enum Row: Int, CaseIterable {
                  case darkMode
                  case notifications
                  case privacy
                  case rateApp
                  case shareApp
                  case clearFavorites
                  case version
                  case about

                  var title: String {
                      switch self {
