      # 🎬 ANIME TRANSITIONS
      # =========================================================
      - name: 🎬 توليد AnimeTransitions.swift
        run: |
          cat > AnimeTransitions.swift << 'ATEOF2'
          import SwiftUI

          extension AnyTransition {
              static var animeMorph: AnyTransition {
                  AnyTransition.modifier(
                      active: AnimeMorphModifier(progress: 0),
                      identity: AnimeMorphModifier(progress: 1)
                  )
              }

              static var portalOpen: AnyTransition {
                  AnyTransition.modifier(
                      active: PortalModifier(progress: 0),
                      identity: PortalModifier(progress: 1)
                  )
              }

              static var glitchReveal: AnyTransition {
                  AnyTransition.modifier(
                      active: GlitchRevealModifier(progress: 0),
                      identity: GlitchRevealModifier(progress: 1)
                  )
              }

              static var energyBurst: AnyTransition {
                  AnyTransition.scale.combined(with: .opacity)
              }
          }

          struct AnimeMorphModifier: ViewModifier {
              let progress: CGFloat

              func body(content: Content) -> some View {
                  content
                      .scaleEffect(1 - progress * 0.3)
                      .opacity(progress)
                      .rotationEffect(.degrees(progress * 360))
                      .blur(radius: (1 - progress) * 10)
              }
          }

          struct PortalModifier: ViewModifier {
              let progress: CGFloat

              func body(content: Content) -> some View {
                  content
                      .clipShape(
                          Circle()
                              .scale(progress == 0 ? 0.01 : 1)
                      )
                      .scaleEffect(progress)
                      .opacity(progress)
              }
          }

          struct GlitchRevealModifier: ViewModifier {
              let progress: CGFloat

              func body(content: Content) -> some View {
                  content
                      .offset(x: (1 - progress) * CGFloat.random(in: -10...10))
                      .opacity(progress)
                      .overlay(
                          Rectangle()
                              .fill(Color.cyan.opacity((1 - progress) * 0.3))
                              .offset(x: (1 - progress) * 5)
                      )
              }
          }
          ATEOF2

