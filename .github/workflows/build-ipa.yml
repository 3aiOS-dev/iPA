                              .fill(Color.storeBgGradient)
                              .ignoresSafeArea()
                      )
                      .navigationBarHidden(true)
                  }
                  .preferredColorScheme(.light)
              }
          
              private func performDeactivation() {
                  error = nil
                  guard confirmText == required else {
                      error = "Type \(required) to confirm"
                      HapticManager.shared.error()
                      return
                  }
                  let key = AppConstants.userDefaultsKey
                  if let data = UserDefaults.standard.data(forKey: key),
                     var users = try? JSONDecoder().decode([AppUser].self, from: data),
                     let user = authManager.currentUser {
                      users.removeAll { $0.id == user.id }
                      if let encoded = try? JSONEncoder().encode(users) {
                          UserDefaults.standard.set(encoded, forKey: key)
                      }
                  }
                  UserDefaults.standard.removeObject(forKey: "walletUserID_21s")
                  UserDefaults.standard.removeObject(forKey: "walletCardNumber_21s")
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  if let files = try? FileManager.default.contentsOfDirectory(at: docs, includingPropertiesForKeys: nil) {
                      for f in files where f.pathExtension == "ipa" {
                          try? FileManager.default.removeItem(at: f)
                      }
                  }
                  HapticManager.shared.success()
                  authManager.logout()
                  onDeactivated()
              }
          }
          
