                  collectionView.backgroundColor = .clear
                  collectionView.dataSource = self
                  collectionView.delegate = self
                  collectionView.register(AppCell.self, forCellWithReuseIdentifier: AppCell.reuseID)
                  collectionView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(collectionView)

                  refreshControl.tintColor = .souqPurple
                  refreshControl.addTarget(self, action: #selector(handleRefresh), for: .valueChanged)
                  collectionView.refreshControl = refreshControl

                  NSLayoutConstraint.activate([
                      collectionView.topAnchor.constraint(equalTo: segmented.bottomAnchor, constant: 8),
                      collectionView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      collectionView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      collectionView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                  ])
              }

              @objc private func handleRefresh() {
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) { [weak self] in
                      self?.applyFilter()
                      self?.refreshControl.endRefreshing()
                  }
              }

              @objc private func categoryChanged() {
                  applyFilter()
              }

              private func applyFilter() {
                  let categoryIndex = segmented.selectedSegmentIndex
                  let category = StoreCategory.allCases[categoryIndex]
                  let query = searchBar.text?.trimmingCharacters(in: .whitespaces) ?? ""

                  filtered = allItems.filter { item in
                      let matchesCategory = (category == .all) || (item.category == category)
                      let matchesQuery = query.isEmpty || item.name.localizedCaseInsensitiveContains(query)
                          || item.developer.localizedCaseInsensitiveContains(query)
                      return matchesCategory && matchesQuery
                  }

                  switch currentSort {
                  case .ratingDesc:
                      filtered.sort { $0.rating > $1.rating }
                  case .nameAsc:
                      filtered.sort { $0.name.localizedCompare($1.name) == .orderedAscending }
                  case .sizeAsc:
                      filtered.sort { $0.sizeMB < $1.sizeMB }
                  }

                  collectionView.reloadData()
              }

              func searchBar(_ searchBar: UISearchBar, textDidChange searchText: String) {
                  applyFilter()
              }

              func searchBarSearchButtonClicked(_ searchBar: UISearchBar) {
                  searchBar.resignFirstResponder()
              }

              // MARK: UICollectionViewDataSource

              func collectionView(_ collectionView: UICollectionView, numberOfItemsInSection section: Int) -> Int {
                  filtered.count
              }

              func collectionView(_ collectionView: UICollectionView, cellForItemAt indexPath: IndexPath) -> UICollectionViewCell {
                  let cell = collectionView.dequeueReusableCell(withReuseIdentifier: AppCell.reuseID, for: indexPath) as! AppCell
                  cell.configure(with: filtered[indexPath.item])
                  return cell
              }

              func collectionView(_ collectionView: UICollectionView, didSelectItemAt indexPath: IndexPath) {
                  let item = filtered[indexPath.item]
                  let detail = DetailViewController(item: item)
                  navigationController?.pushViewController(detail, animated: true)
              }

              // MARK: Layout

              func collectionView(_ collectionView: UICollectionView, layout collectionViewLayout: UICollectionViewLayout,
                                   sizeForItemAt indexPath: IndexPath) -> CGSize {
                  let spacing: CGFloat = 12 * 3 + 32
                  let width = floor((collectionView.bounds.width - spacing) / 2)
                  return CGSize(width: width, height: 190)
              }
          }
          SEOF

