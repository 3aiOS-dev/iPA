      - name: Generate Source - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - App Data Model
          struct AppItem: Identifiable, Codable {
              var id = UUID()
              let name: String
              let type: Int
              let bundleID: String
              let bundleIdentifier: String
              let version: String
              let versionDate: String
              let fullDate: String
              let size: Int
              let down: String
              let downloadURL: String
              let developerName: String
              let localizedDescription: String
              let icon: String
              let iconURL: String
              var category: String?

              enum CodingKeys: String, CodingKey {
                  case name, type, bundleID, bundleIdentifier, version, versionDate,
                       fullDate, size, down, downloadURL, developerName,
                       localizedDescription, icon, iconURL
              }

              var formattedSize: String { ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .file) }

              var formattedDate: String {
                  let input = DateFormatter(); input.dateFormat = "yyyy-MM-dd"
                  if let d = input.date(from: versionDate) {
                      let out = DateFormatter(); out.dateFormat = "dd-MM-yyyy"; return out.string(from: d)
                  }
                  return versionDate
              }

              var subscriptionType: String {
                  if localizedDescription.contains("Subscription Unlocked") { return "الاشتراك مدى الحياة" }
                  if localizedDescription.contains("Premium") { return "بريميوم" }
                  if localizedDescription.contains("Pro")     { return "Pro" }
                  if localizedDescription.contains("Gold")    { return "Gold" }
                  if localizedDescription.contains("IAP")     { return "المشتريات مفعّلة" }
                  return "مفعّل"
              }

              var isNew: Bool {
                  let f = DateFormatter(); f.dateFormat = "yyyy-MM-dd"
                  guard let d = f.date(from: versionDate) else { return false }
                  return Calendar.current.dateComponents([.day], from: d, to: Date()).day ?? 999 < 7
              }

              var isPopular: Bool { (Int(down) ?? 0) > 500 }

              var _secureDownloadURL: String { downloadURL }
          }

          // MARK: - API Response
          struct AppsResponse: Codable {
              let name: String; let identifier: String; let sourceURL: String
              let iconURL: String; let website: String; let ipawebsite: String
              let subtitle: String; let apps: [AppItem]
          }

          // MARK: - App Category
          struct AppCategory: Identifiable {
              let id = UUID()
              let name: String; let icon: String; let gradient: [Color]
          }
          VIPEOF
          echo "Models.swift: $(wc -l < Models.swift) lines"

      - name: Generate Source - AppsManager.swift
        run: |
          cat > AppsManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          // MARK: - Apps Manager
          class AppsManager: ObservableObject {
              @Published var apps: [AppItem] = []
              @Published var isLoading = false
              @Published var errorMessage: String?
              @Published var recentSearches: [String] = []

              var categories: [AppCategory] {
                  return []
              }

              func appsForCategory(_ cat: AppCategory) -> [AppItem] {
                  switch cat.name {
                  default:              return apps
                  }
              }

              func fetchApps() {
                  isLoading = true; errorMessage = nil
                  guard let url = URL(string: AppConstants.storeURL) else { isLoading = false; return }
                  URLSession.shared.dataTask(with: url) { [weak self] data, _, err in
                      DispatchQueue.main.async {
                          self?.isLoading = false
                          if let err = err { self?.errorMessage = err.localizedDescription; return }
                          guard let data = data else { self?.errorMessage = "لا توجد بيانات"; return }
                          var loaded: [AppItem] = []
                          if let resp = try? JSONDecoder().decode(AppsResponse.self, from: data) {
                              loaded = resp.apps
                          } else if let arr = try? JSONDecoder().decode([AppItem].self, from: data) {
                              loaded = arr
                          } else {
                              self?.errorMessage = "فشل تحليل البيانات"; return
                          }
                          self?.apps = loaded.map { app in
                              var mutable = app
                              if mutable.category == nil || mutable.category!.isEmpty {
                                  mutable.category = Self.inferCategory(name: app.name, desc: app.localizedDescription)
                              }
                              return mutable
                          }
                      }
                  }.resume()
              }

              static func inferCategory(name: String, desc: String) -> String {
                  let text = (name + " " + desc).lowercased()
                  let map: [(keys: [String], cat: String)] = [
                      (["game", "لعبة", "لعب", "clash", "minecraft", "roblox", "pubg", "cod", "fifa"], "ألعاب"),
                      (["social", "chat", "تواصل", "instagram", "tiktok", "telegram", "whatsapp", "snapchat", "twitter", "x.com"], "اجتماعي"),
                      (["music", "موسيقى", "spotify", "soundcloud", "youtube", "video", "فيديو", "netflix", "tubi", "مشاهدة"], "ترفيه"),
                      (["vpn", "security", "أمان", "proxy", "shield", "protect"], "أمان"),
                      (["photo", "camera", "صورة", "تصوير", "edit", "تعديل", "lightroom", "vsco", "capcut"], "صور وفيديو"),
                      (["learn", "تعلّم", "education", "تعليم", "school", "duolingo", "quran", "قرآن"], "تعليم"),
                      (["shop", "store", "تسوق", "amazon", "noon", "delivery", "توصيل"], "تسوق"),
                      (["bank", "pay", "دفع", "مال", "finance", "بنك", "paypal", "stc pay"], "مالية"),
                      (["productivity", "office", "word", "excel", "pdf", "scan", "إنتاجية", "ملفات"], "إنتاجية"),
                      (["travel", "سفر", "flight", "hotel", "فندق", "map", "خرائط", "uber", "careem"], "سفر"),
                      (["health", "fitness", "صحة", "رياضة", "workout", "gym", "diet", "نظام غذائي"], "صحة ورياضة"),
                      (["food", "restaurant", "طعام", "مطعم", "hungerstation", "talabat", "جاهز"], "طعام"),
                      (["news", "أخبار", "newspaper", "bbc", "cnn", "aljazeera", "رياضة"], "أخبار"),
                  ]
                  for entry in map {
                      if entry.keys.contains(where: { text.contains($0) }) { return entry.cat }
                  }
                  return "أدوات"
              }

              func retryFetch() { fetchApps() }

              func loadRecentSearches() {
                  recentSearches = UserDefaults.standard.stringArray(forKey: "recentSearches") ?? []
              }

              func addRecentSearch(_ term: String) {
                  guard !term.isEmpty else { return }
                  recentSearches.removeAll { $0 == term }
                  recentSearches.insert(term, at: 0)
                  if recentSearches.count > 15 { recentSearches = Array(recentSearches.prefix(10)) }
                  UserDefaults.standard.set(recentSearches, forKey: "recentSearches")
              }
          }
          VIPEOF
          echo "AppsManager.swift: $(wc -l < AppsManager.swift) lines"

      - name: Generate Source - SharedComponents.swift
        run: |
          cat > SharedComponents.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - Image Cache (external to generic struct)
          final class ImageCache {
              static let shared = NSCache<NSURL, UIImage>()
          }

          // MARK: - Cached Async Image with URLCache and NSCache
          struct CachedAsyncImage<Content: View>: View {
              let url: URL?
              @ViewBuilder let content: (AsyncImagePhase) -> Content

              @State private var phase: AsyncImagePhase = .empty

              var body: some View {
                  Group {
                      switch phase {
                      case .empty:
                          content(.empty)
                              .onAppear { loadImage() }
                      case .success(let image):
                          content(.success(image))
                      case .failure(let error):
                          content(.failure(error))
                      @unknown default:
                          content(.empty)
                      }
                  }
              }

              private func loadImage() {
                  guard let url = url else {
                      phase = .failure(URLError(.badURL))
                      return
                  }

                  // Check memory cache
                  if let cachedImage = ImageCache.shared.object(forKey: url as NSURL) {
                      phase = .success(Image(uiImage: cachedImage))
                      return
                  }

                  // Check disk cache (URLCache)
                  let request = URLRequest(url: url)
                  if let cachedResponse = URLCache.shared.cachedResponse(for: request),
                     let image = UIImage(data: cachedResponse.data) {
                      ImageCache.shared.setObject(image, forKey: url as NSURL)
                      phase = .success(Image(uiImage: image))
                      return
                  }

                  // Download
                  URLSession.shared.dataTask(with: request) { data, _, error in
                      DispatchQueue.main.async {
                          if let data = data, let image = UIImage(data: data) {
                              ImageCache.shared.setObject(image, forKey: url as NSURL)
                              // Also cache in URLCache
                              let cachedData = CachedURLResponse(response: URLResponse(), data: data)
                              URLCache.shared.storeCachedResponse(cachedData, for: request)
                              phase = .success(Image(uiImage: image))
                          } else if let error = error {
                              phase = .failure(error)
                          } else {
                              phase = .failure(URLError(.unknown))
                          }
                      }
                  }.resume()
              }
          }

          // MARK: - Gradient Button
          struct GradientButton: View {
              let title: String; var icon: String?; let gradient: [Color]
              let action: () -> Void
              var isLoading: Bool = false; var isDisabled: Bool = false
              @State private var pressed = false

              var body: some View {
                  Button(action: { HapticManager.shared.impact(.medium); action() }) {
                      HStack(spacing: 8) {
                          if isLoading {
                              ProgressView().progressViewStyle(CircularProgressViewStyle(tint: .white)).scaleEffect(0.85)
                          } else if let icon { Image(systemName: icon).font(.system(size: 15, weight: .semibold)) }
                          Text(isLoading ? "جاري..." : title).font(.system(size: 15, weight: .bold))
                      }
                      .foregroundColor(.white).frame(maxWidth: .infinity).frame(height: 48)
                      .background(LinearGradient(
                          colors: isDisabled ? [.gray, .gray.opacity(0.7)] : gradient,
                          startPoint: .leading, endPoint: .trailing))
                      .cornerRadius(14)
                      .shadow(color: (isDisabled ? Color.gray : gradient.first ?? .blue).opacity(0.3),
                              radius: pressed ? 3 : 8, x: 0, y: pressed ? 1 : 4)
                      .scaleEffect(pressed ? 0.97 : 1.0)
                  }
                  .disabled(isDisabled || isLoading)
                  .buttonStyle(PlainButtonStyle())
                  .simultaneousGesture(
                      DragGesture(minimumDistance: 0)
                          .onChanged { _ in withAnimation(.easeInOut(duration: 0.1)) { pressed = true } }
                          .onEnded   { _ in withAnimation(.spring(response: 0.3)) { pressed = false } }
                  )
              }
          }

          // MARK: - New Badge
          struct NewBadge: View {
              var body: some View {
                  Text("جديد").font(.system(size: 10, weight: .bold)).foregroundColor(.white)
                      .padding(.horizontal, 7).padding(.vertical, 3)
                      .background(Capsule().fill(LinearGradient(colors: [.pink, .purple], startPoint: .leading, endPoint: .trailing)))
              }
          }

          // MARK: - Popular Badge
          struct PopularBadge: View {
              var body: some View {
                  HStack(spacing: 3) {
                      Image(systemName: "flame.fill").font(.system(size: 9))
                      Text("مشهور").font(.system(size: 10, weight: .bold))
                  }
                  .foregroundColor(.white).padding(.horizontal, 7).padding(.vertical, 3)
                  .background(Capsule().fill(LinearGradient(colors: [.orange, .red], startPoint: .leading, endPoint: .trailing)))
              }
          }

          // MARK: - Crown Badge
          struct CrownBadge: View {
              @State private var pulse = false
              var body: some View {
                  Image(systemName: "crown.fill").font(.system(size: 12, weight: .bold)).foregroundColor(.black)
                      .padding(.horizontal, 8).padding(.vertical, 4)
                      .background(Capsule().fill(LinearGradient(colors: [.vipGold, .orange], startPoint: .leading, endPoint: .trailing)))
                      .shadow(color: .vipGold.opacity(0.5), radius: pulse ? 8 : 3).scaleEffect(pulse ? 1.05 : 1.0)
                      .onAppear { withAnimation(.easeInOut(duration: 1.5).repeatForever(autoreverses: true)) { pulse = true } }
              }
          }
          VIPEOF
          echo "SharedComponents.swift: $(wc -l < SharedComponents.swift) lines"

      - name: Generate Source - ContentView.swift
        run: |
          cat > ContentView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          // MARK: - Main Tab Enum
          enum AppTab: String, CaseIterable {
              case home = "الرئيسية"
              case apps = "التطبيقات"
              
              var icon: String {
                  switch self {
                  case .home: return "house"
                  case .apps: return "square.stack.3d.up"
                  }
              }
          }

          // MARK: - Main Content View
          struct ContentView: View {
              @State private var selectedTab: AppTab = .home
              @Environment(\.colorScheme) var scheme
              @StateObject private var appsManager = AppsManager()

              var body: some View {
                  TabView(selection: $selectedTab) {
                      HomeTabView(appsManager: appsManager)
                          .tabItem {
                              Label("الرئيسية", systemImage: AppTab.home.icon)
                          }
                          .tag(AppTab.home)
                      
                      AppsTabView(appsManager: appsManager)
                          .tabItem {
                              Label("التطبيقات", systemImage: AppTab.apps.icon)
                          }
                          .tag(AppTab.apps)
                  }
                  .preferredColorScheme(.none)
                  .onAppear {
                      appsManager.fetchApps()
                      appsManager.loadRecentSearches()
                      requestNotifications()
                  }
                  .accentColor(.vipPurple)
              }

              func requestNotifications() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }
          }

          // MARK: - Loading View
          struct LoadingView: View {
              @State private var rotate = false
              var body: some View {
                  VStack(spacing: 20) {
                      ZStack {
                          Circle().stroke(Color.vipPurple.opacity(0.2), lineWidth: 4).frame(width: 60, height: 60)
                          Circle().trim(from: 0, to: 0.7)
                              .stroke(LinearGradient(colors: [.vipPurple, .blue], startPoint: .leading, endPoint: .trailing),
                                      style: StrokeStyle(lineWidth: 4, lineCap: .round))
