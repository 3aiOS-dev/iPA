name: Build_21s

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Setup Dependencies
        run: |
          brew install ldid

      - name: Generate App Icons
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size, filename):
              img = Image.new("RGB", (size, size), (18, 18, 30))
              draw = ImageDraw.Draw(img)

              top = (124, 58, 237)      # purple
              bottom = (6, 182, 212)    # teal
              for y in range(size):
                  t = y / size
                  r = int(top[0] * (1 - t) + bottom[0] * t)
                  g = int(top[1] * (1 - t) + bottom[1] * t)
                  b = int(top[2] * (1 - t) + bottom[2] * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b))

              draw.ellipse(
                  [size * 0.18, size * 0.18, size * 0.82, size * 0.82],
                  outline=(255, 255, 255),
                  width=max(2, size // 40),
              )

              text = "21s"
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", int(size * 0.30))
              except Exception:
                  font = ImageFont.load_default()

              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(
                  ((size - tw) / 2 - bbox[0], (size - th) / 2 - bbox[1]),
                  text,
                  fill=(255, 255, 255),
                  font=font,
              )
              img.save(filename)

          # 60pt @2x = 120x120 (iPhone)
          make_icon(120, "Resources/AppIcon60x60@2x.png")
          # 76pt @2x = 152x152 (iPad)
          make_icon(152, "Resources/AppIcon76x76@2x~ipad.png")
          PYEOF
          ls -la Resources

      - name: Generate App Source Files
        run: |
          cd ${{ github.workspace }}
          mkdir -p Resources

          cat > main.swift << 'SEOF'
          import UIKit
          import Compression
          import UniformTypeIdentifiers

          // MARK: - Simple ZIP / IPA Extractor

          enum UnzipError: Error {
              case readFailed
              case invalidArchive
          }

          final class SimpleUnzip {

              static func extract(zipPath: String, to destDir: String) throws {
                  guard let data = FileManager.default.contents(atPath: zipPath) else {
                      throw UnzipError.readFailed
                  }
                  let bytes = [UInt8](data)
                  let length = bytes.count

                  var eocdOffset = -1
                  var i = length - 22
                  while i >= 0 {
                      if bytes[i] == 0x50 && bytes[i+1] == 0x4b && bytes[i+2] == 0x05 && bytes[i+3] == 0x06 {
                          eocdOffset = i
                          break
                      }
                      i -= 1
                  }
                  guard eocdOffset >= 0 else { throw UnzipError.invalidArchive }

                  func readUInt16(_ offset: Int) -> UInt16 {
                      UInt16(bytes[offset]) | (UInt16(bytes[offset+1]) << 8)
                  }
                  func readUInt32(_ offset: Int) -> UInt32 {
                      UInt32(bytes[offset]) | (UInt32(bytes[offset+1]) << 8) |
                      (UInt32(bytes[offset+2]) << 16) | (UInt32(bytes[offset+3]) << 24)
                  }

                  let entryCount = readUInt16(eocdOffset + 10)
                  let centralDirOffset = Int(readUInt32(eocdOffset + 16))

                  let fm = FileManager.default
                  try? fm.createDirectory(atPath: destDir, withIntermediateDirectories: true)

                  var pos = centralDirOffset
                  for _ in 0..<entryCount {
                      guard pos + 46 <= length else { break }
                      guard readUInt32(pos) == 0x02014b50 else { break }

                      let method = readUInt16(pos + 10)
                      let compSize = Int(readUInt32(pos + 20))
                      let nameLen = Int(readUInt16(pos + 28))
                      let extraLen = Int(readUInt16(pos + 30))
                      let commentLen = Int(readUInt16(pos + 32))
                      let localHeaderOffset = Int(readUInt32(pos + 42))

                      let nameBytes = Array(bytes[(pos + 46)..<(pos + 46 + nameLen)])
                      let fileName = String(bytes: nameBytes, encoding: .utf8) ?? "file_\(pos)"

                      pos += 46 + nameLen + extraLen + commentLen

                      if fileName.hasSuffix("/") {
                          let dirPath = (destDir as NSString).appendingPathComponent(fileName)
                          try? fm.createDirectory(atPath: dirPath, withIntermediateDirectories: true)
                          continue
                      }

                      guard localHeaderOffset + 30 <= length else { continue }
                      let localNameLen = Int(readUInt16(localHeaderOffset + 26))
                      let localExtraLen = Int(readUInt16(localHeaderOffset + 28))
                      let dataStart = localHeaderOffset + 30 + localNameLen + localExtraLen
                      guard dataStart + compSize <= length else { continue }

                      let compData = Data(bytes[dataStart..<(dataStart + compSize)])
                      var outData = Data()

                      if method == 0 {
                          outData = compData
                      } else if method == 8 {
                          outData = decompressRawDeflate(compData) ?? Data()
                      } else {
                          continue
                      }

                      let outPath = (destDir as NSString).appendingPathComponent(fileName)
                      let outParent = (outPath as NSString).deletingLastPathComponent
                      try? fm.createDirectory(atPath: outParent, withIntermediateDirectories: true)
                      fm.createFile(atPath: outPath, contents: outData)
                  }
              }

              private static func decompressRawDeflate(_ input: Data) -> Data? {
                  let bufferSize = max(input.count * 8, 1 << 16)
                  var output = Data(count: bufferSize)
                  let result = output.withUnsafeMutableBytes { outPtr -> Int in
                      input.withUnsafeBytes { inPtr -> Int in
                          compression_decode_buffer(
                              outPtr.bindMemory(to: UInt8.self).baseAddress!, bufferSize,
                              inPtr.bindMemory(to: UInt8.self).baseAddress!, input.count,
                              nil, COMPRESSION_ZLIB
                          )
                      }
                  }
                  guard result > 0 else { return nil }
                  return output.prefix(result)
              }
          }

          // MARK: - File Manager View Controller

          final class FileManagerViewController: UITableViewController, UIDocumentPickerDelegate {

              var files: [String] = []
              let documentsPath = NSSearchPathForDirectoriesInDomains(.documentDirectory, .userDomainMask, true).first!

              let accentPurple = UIColor(red: 124/255, green: 58/255, blue: 237/255, alpha: 1)
              let accentTeal = UIColor(red: 6/255, green: 182/255, blue: 212/255, alpha: 1)
              let bgDark = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
              let cardDark = UIColor(red: 28/255, green: 28/255, blue: 44/255, alpha: 1)

              let emptyLabel: UILabel = {
                  let label = UILabel()
                  label.text = "📭  لا توجد ملفات بعد\nاضغط \"استيراد من الملفات\" لإضافة ملف"
                  label.numberOfLines = 0
                  label.textAlignment = .center
                  label.textColor = UIColor.white.withAlphaComponent(0.35)
                  label.font = .systemFont(ofSize: 15, weight: .medium)
                  return label
              }()

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "21s"
                  view.backgroundColor = bgDark
                  tableView.backgroundColor = bgDark
                  tableView.separatorColor = UIColor.white.withAlphaComponent(0.08)
                  tableView.rowHeight = 68

                  navigationController?.navigationBar.barTintColor = bgDark
                  navigationController?.navigationBar.tintColor = accentTeal
                  navigationController?.navigationBar.titleTextAttributes = [
                      .foregroundColor: UIColor.white,
                      .font: UIFont.boldSystemFont(ofSize: 20)
                  ]
                  navigationController?.navigationBar.isTranslucent = false
                  if #available(iOS 13.0, *) {
                      overrideUserInterfaceStyle = .dark
                  }
                  navigationController?.toolbar.barTintColor = bgDark
                  navigationController?.toolbar.tintColor = accentTeal
                  navigationController?.toolbar.isTranslucent = false

                  let importBtn = UIBarButtonItem(title: "📂  استيراد من الملفات", style: .plain, target: self, action: #selector(importFilesTapped))
                  importBtn.tintColor = accentTeal
                  let flex = UIBarButtonItem(barButtonSystemItem: .flexibleSpace, target: nil, action: nil)
                  toolbarItems = [flex, importBtn, flex]

                  let refresh = UIRefreshControl()
                  refresh.tintColor = accentTeal
                  refresh.addTarget(self, action: #selector(pullToRefresh), for: .valueChanged)
                  tableView.refreshControl = refresh

                  reloadFiles()
              }

              override func viewWillAppear(_ animated: Bool) {
                  super.viewWillAppear(animated)
                  navigationController?.setToolbarHidden(false, animated: animated)
              }

              func reloadFiles() {
                  let fm = FileManager.default
                  var found: [String] = []
                  if let enumerator = fm.enumerator(atPath: documentsPath) {
                      for case let file as String in enumerator {
                          found.append(file)
                      }
                  }
                  files = found.sorted()
                  tableView.backgroundView = files.isEmpty ? emptyLabel : nil
                  tableView.reloadData()
              }

              @objc func pullToRefresh() {
                  reloadFiles()
                  tableView.refreshControl?.endRefreshing()
              }

              // MARK: - استيراد الملفات من جهازك (تطبيق الملفات)

              @objc func importFilesTapped() {
                  let picker: UIDocumentPickerViewController
                  if #available(iOS 14.0, *) {
                      picker = UIDocumentPickerViewController(forOpeningContentTypes: [.item], asCopy: true)
                  } else {
                      picker = UIDocumentPickerViewController(documentTypes: ["public.item"], in: .import)
                  }
                  picker.delegate = self
                  picker.allowsMultipleSelection = true
                  present(picker, animated: true)
              }

              func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                  let fm = FileManager.default
                  var importedCount = 0
                  for url in urls {
                      let destURL = URL(fileURLWithPath: (documentsPath as NSString).appendingPathComponent(url.lastPathComponent))
                      try? fm.removeItem(at: destURL)
                      if (try? fm.copyItem(at: url, to: destURL)) != nil {
                          importedCount += 1
                      }
                  }
                  reloadFiles()

                  let alert = UIAlertController(
                      title: "✅ تم الاسترداد",
                      message: "تم استيراد \(importedCount) ملف من جهازك.\nاضغط على أي ملف مضغوط لاستخراجه تلقائياً.",
                      preferredStyle: .alert
                  )
                  alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                  present(alert, animated: true)
              }

              // MARK: - الاستخراج التلقائي عند الضغط على الملف

              func extractArchive(named name: String) {
                  let zipPath = (documentsPath as NSString).appendingPathComponent(name)
                  let destName = (name as NSString).deletingPathExtension + "_extracted"
                  let destDir = (documentsPath as NSString).appendingPathComponent(destName)

                  let progress = UIAlertController(title: "📦 جارِ الاستخراج...", message: name, preferredStyle: .alert)
                  present(progress, animated: true)

                  DispatchQueue.global(qos: .userInitiated).async { [weak self] in
                      guard let self = self else { return }
                      do {
                          try SimpleUnzip.extract(zipPath: zipPath, to: destDir)
                          DispatchQueue.main.async {
                              progress.dismiss(animated: true) {
                                  self.reloadFiles()
                                  let result = UIAlertController(title: "✅ نجح الاستخراج", message: "تم استخراج المحتوى إلى:\n\(destName)", preferredStyle: .alert)
                                  result.addAction(UIAlertAction(title: "حسناً", style: .default))
                                  self.present(result, animated: true)
                              }
                          }
                      } catch {
                          DispatchQueue.main.async {
                              progress.dismiss(animated: true) {
                                  let result = UIAlertController(title: "❌ فشل الاستخراج", message: "تعذر استخراج \(name)", preferredStyle: .alert)
                                  result.addAction(UIAlertAction(title: "حسناً", style: .default))
                                  self.present(result, animated: true)
                              }
                          }
                      }
                  }
              }

              func shareFile(at path: String) {
                  let url = URL(fileURLWithPath: path)
                  let activityVC = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                  if let popover = activityVC.popoverPresentationController {
                      popover.sourceView = view
                      popover.sourceRect = CGRect(x: view.bounds.midX, y: view.bounds.midY, width: 1, height: 1)
                  }
                  present(activityVC, animated: true)
              }

              // MARK: - أيقونة ولون لكل نوع ملف

              func icon(for name: String) -> String {
                  let lower = name.lowercased()
                  if lower.hasSuffix(".zip") || lower.hasSuffix(".ipa") { return "📦" }
                  if lower.hasSuffix(".png") || lower.hasSuffix(".jpg") || lower.hasSuffix(".jpeg") { return "🖼️" }
                  if lower.hasSuffix(".txt") || lower.hasSuffix(".md") { return "📄" }
                  if lower.hasSuffix(".plist") || lower.hasSuffix(".json") { return "🧩" }
                  return "📁"
              }

              func isArchive(_ name: String) -> Bool {
                  let lower = name.lowercased()
                  return lower.hasSuffix(".zip") || lower.hasSuffix(".ipa")
              }

              override func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                  files.count
              }

              override func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                  let cell = UITableViewCell(style: .subtitle, reuseIdentifier: "cell")
                  let relPath = files[indexPath.row]
                  let fullPath = (documentsPath as NSString).appendingPathComponent(relPath)

                  cell.backgroundColor = cardDark
                  let bg = UIView()
                  bg.backgroundColor = accentPurple.withAlphaComponent(0.15)
                  cell.selectedBackgroundView = bg

                  cell.textLabel?.textColor = .white
                  cell.textLabel?.font = .systemFont(ofSize: 16, weight: .medium)
                  cell.textLabel?.text = "\(icon(for: relPath))  \(relPath)"

                  let attrs = try? FileManager.default.attributesOfItem(atPath: fullPath)
                  let size = (attrs?[.size] as? NSNumber)?.int64Value ?? 0
                  let sizeText = ByteCountFormatter.string(fromByteCount: size, countStyle: .file)
                  let hint = isArchive(relPath) ? "  •  اضغط للاستخراج التلقائي" : ""
                  cell.detailTextLabel?.text = "\(sizeText)\(hint)"
                  cell.detailTextLabel?.textColor = isArchive(relPath) ? accentTeal : UIColor.white.withAlphaComponent(0.4)
                  cell.detailTextLabel?.font = .systemFont(ofSize: 12, weight: isArchive(relPath) ? .semibold : .regular)

                  cell.accessoryType = isArchive(relPath) ? .disclosureIndicator : .detailButton
                  return cell
              }

              override func tableView(_ tableView: UITableView, didSelectRowAt indexPath: IndexPath) {
                  tableView.deselectRow(at: indexPath, animated: true)
                  let relPath = files[indexPath.row]
                  let fullPath = (documentsPath as NSString).appendingPathComponent(relPath)

                  if isArchive(relPath) {
                      extractArchive(named: relPath)
                  } else {
                      shareFile(at: fullPath)
                  }
              }

              override func tableView(_ tableView: UITableView, accessoryButtonTappedForRowWith indexPath: IndexPath) {
                  let relPath = files[indexPath.row]
                  let fullPath = (documentsPath as NSString).appendingPathComponent(relPath)
                  shareFile(at: fullPath)
              }
          }

          // MARK: - App Delegate

          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let root = FileManagerViewController()
                  let nav = UINavigationController(rootViewController: root)
                  window?.rootViewController = nav
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          // MARK: - Entry point (this file must be named main.swift)

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          SEOF

          cat > Resources/Info.plist << 'MEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>TwentyOneS</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.s21</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>21s</string>
              <key>CFBundleDisplayName</key>
              <string>21s</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                      </array>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76@2x~ipad.png</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          MEOF

      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -o TwentyOneS

          file TwentyOneS

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/TwentyOneS.app

          cp TwentyOneS build-output/Payload/TwentyOneS.app/TwentyOneS
          cp Resources/Info.plist build-output/Payload/TwentyOneS.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/TwentyOneS.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/TwentyOneS.app/

          ldid -S build-output/Payload/TwentyOneS.app/TwentyOneS

          cd build-output
          zip -r -q ../artifacts/TwentyOneS.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/TwentyOneS.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwentyOneS-IPA
          path: artifacts/TwentyOneS.ipa
          retention-days: 30
