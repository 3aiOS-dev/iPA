                          tabItem(icon: "tray.full.fill", label: LS("الملفات"), index: 2)
                      }
                      .padding(.horizontal, 14)
                      .padding(.vertical, 12)
                      .background(
                          RoundedRectangle(cornerRadius: 28)
                              .fill(Color.storeCard)
                              .shadow(color: Color.black.opacity(0.06), radius: 14, x: 0, y: -2)
                      )
                      .padding(.horizontal, 12)

                      Button(action: {
                          HapticManager.shared.impact(.light)
                          withAnimation(.spring(response: 0.3, dampingFraction: 0.45)) { searchPop = true }
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.28) {
                              withAnimation(.spring(response: 0.4, dampingFraction: 0.6)) { searchPop = false }
                          }
                          onSearch()
                      }) {
                          Image(systemName: "magnifyingglass")
                              .font(.system(size: 20, weight: .bold))
                              .foregroundColor(.white)
                              .rotationEffect(.degrees(searchPop ? 90 : 0))
                              .frame(width: 58, height: 58)
                              .background(Circle().fill(Color.storePrimary))
                              .scaleEffect(searchPop ? 1.18 : 1.0)
                              .shadow(color: Color.storePrimary.opacity(0.35), radius: 10, y: 6)
                      }
                      .offset(y: -18)
                  }
                  .padding(.bottom, 16)
              }

              private func fire(_ index: Int) {
                  HapticManager.shared.selection()
                  withAnimation(.spring(response: 0.28, dampingFraction: 0.4)) {
                      pop[index] = true
                      spin[index] = (spin[index] ?? 0) + 360
                  }
                  tab = index
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.3) {
                      withAnimation(.spring(response: 0.45, dampingFraction: 0.6)) { pop[index] = false }
                  }
              }

              @ViewBuilder
              private func tabItem(icon: String, label: String, index: Int, badge: Int = 0) -> some View {
                  let active = tab == index
                  let popped = pop[index] == true
                  Button {
                      fire(index)
                  } label: {
                      VStack(spacing: 4) {
                          ZStack(alignment: .topTrailing) {
                              Image(systemName: icon)
                                  .font(.system(size: 18, weight: .semibold))
                                  .scaleEffect(popped ? 1.5 : (active ? 1.14 : 1.0))
                                  .offset(y: popped ? -6 : 0)
                                  .rotation3DEffect(.degrees(spin[index] ?? 0),
                                                    axis: (x: 0, y: 1, z: 0),
                                                    perspective: 0.6)
                                  .animation(.spring(response: 0.55, dampingFraction: 0.55), value: spin[index])
                              if badge > 0 {
                                  Text(badge > 99 ? "99+" : "\(badge)")
                                      .font(.system(size: 9, weight: .heavy))
                                      .foregroundColor(.white)
                                      .padding(.horizontal, 4)
                                      .frame(minWidth: 16, minHeight: 16)
                                      .background(Capsule().fill(Color.storePink))
                                      .offset(x: 12, y: -8)
                                      .scaleEffect(popped ? 1.15 : 1.0)
                              }
                          }
                          Text(label)
                              .font(.system(size: 10, weight: active ? .bold : .medium))
                              .lineLimit(1)
                              .minimumScaleFactor(0.8)
                              .opacity(active ? 1 : 0.85)
                      }
                      .foregroundColor(active ? .storePrimary : .storeSub)
                      .padding(.vertical, 6)
                      .frame(maxWidth: .infinity)
                      .background(
                          ZStack {
                              if active {
                                  RoundedRectangle(cornerRadius: 16)
                                      .fill(Color.storePrimary.opacity(0.12))
                                      .matchedGeometryEffect(id: "tabPill", in: tabNS)
                              }
                          }
                      )
                      .animation(.spring(response: 0.35, dampingFraction: 0.75), value: tab)
                  }
                  .buttonStyle(.plain)
              }
          }

