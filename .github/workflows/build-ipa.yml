          CONSTEOF

      - name: Generate code - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'HAPTICEOF'
          import SwiftUI
          import UIKit

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  UINotificationFeedbackGenerator().notificationOccurred(type)
              }
              func selection() { UISelectionFeedbackGenerator().selectionChanged() }
              func success() { notification(.success) }
              func error() { notification(.error) }
          }
          HAPTICEOF

      - name: Generate code - Models.swift (no user, no repositories)
        run: |
          cat > Models.swift << 'MODELSEOF'
          import Foundation

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let bundleVersion: String?
              let ipaSize: String?
              let githubUrl: String?
              let archiveUrl: String?
              let ipaUrl: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let createdAt: String?
              let updatedAt: String?

              enum CodingKeys: String, CodingKey {
                  case id, name
                  case bundleId = "bundle_id"
                  case bundleVersion = "bundle_version"
                  case ipaSize = "ipa_size"
                  case githubUrl = "github_url"
                  case archiveUrl = "archive_url"
                  case ipaUrl = "ipa_url"
                  case host, icon, description, screenshots, category
                  case createdAt = "created_at"
                  case updatedAt = "updated_at"
              }

              var cleanSize: String {
                  if let s = ipaSize, !s.isEmpty { return s }
                  return "-"
              }

              var cleanDescription: String {
                  let raw = description ?? ""
                  if raw.isEmpty {
                      return "تطبيق حصري على متجر ONEs - حمل النسخة المميزة بكل الميزات."
                  }
                  let lines = raw.split(whereSeparator: { $0.isNewline || $0 == "\r" })
                  return lines.joined(separator: " ").trimmingCharacters(in: .whitespacesAndNewlines)
              }

              var resolvedDownloadURL: String? {
                  return ipaUrl ?? githubUrl ?? archiveUrl
              }
          }

          struct StoreAPIResponse: Codable {
              let lastUpdated: String?
              let apps: [StoreAPIApp]

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.lastUpdated = try? c.decode(String.self, forKey: .lastUpdated)
                  if let arr = try? c.decode([StoreAPIApp].self, forKey: .apps) {
                      self.apps = arr
                  } else {
                      self.apps = []
                  }
              }
          }
          MODELSEOF

      - name: Generate code - FavoritesStore.swift
        run: |
          cat > FavoritesStore.swift << 'FAVEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class FavoritesStore: ObservableObject {
              static let shared = FavoritesStore()
              @Published private(set) var items: [StoreAPIApp] = []
              private let key = "favorites.v1"
              private let d = UserDefaults.standard

              private init() { load() }

              private func load() {
                  guard let data = d.data(forKey: key),
                        let decoded = try? JSONDecoder().decode([StoreAPIApp].self, from: data) else { return }
                  items = decoded
              }

              private func save() {
                  if let data = try? JSONEncoder().encode(items) {
                      d.set(data, forKey: key)
                  }
              }

              func contains(_ app: StoreAPIApp) -> Bool {
                  items.contains(where: { $0.id == app.id })
              }

              func toggle(_ app: StoreAPIApp) {
                  if contains(app) {
                      items.removeAll { $0.id == app.id }
                      HapticManager.shared.impact(.light)
                  } else {
                      items.insert(app, at: 0)
                      HapticManager.shared.success()
                  }
                  save()
              }

              func clearAll() {
                  items.removeAll()
                  save()
              }
          }
          FAVEOF

      - name: Generate code - StoreView.swift (pure native, no 3D/HTML, no auth)
        run: |
          cat > StoreView.swift << 'STOREEOF'
          import SwiftUI
          import UIKit
          import ImageIO

          // MARK: - Image cache
          @MainActor
          final class RemoteIconCache: ObservableObject {
              static let shared = RemoteIconCache()
              @Published private(set) var cache: [String: UIImage] = [:]
              private let memCache: NSCache<NSString, UIImage> = {
                  let c = NSCache<NSString, UIImage>()
                  c.totalCostLimit = AppConstants.maxIconCacheBytes
                  c.countLimit = 20000
                  return c
              }()
              private let session: URLSession
              private let diskDir: URL
              private let diskIndexKey = "icon-disk-index"
              private var diskIndex: [String: String] = [:]
              private let inflightQueue = DispatchQueue(label: "com.ones.iconcache.inflight")
              private var inflightSet: Set<String> = []

              init() {
                  let cfg = URLSessionConfiguration.default
                  cfg.requestCachePolicy = .returnCacheDataElseLoad
                  cfg.urlCache = URLCache(memoryCapacity: 64*1024*1024,
                                          diskCapacity: AppConstants.maxIconCacheBytes,
                                          diskPath: "icons")
                  cfg.httpMaximumConnectionsPerHost = 16
                  cfg.timeoutIntervalForRequest = 10
                  cfg.timeoutIntervalForResource = 30
                  self.session = URLSession(configuration: cfg)

                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  let dir = caches.appendingPathComponent("ones-icons", isDirectory: true)
                  try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  self.diskDir = dir
                  if let data = UserDefaults.standard.data(forKey: diskIndexKey),
                     let map = try? JSONDecoder().decode([String: String].self, from: data) {
                      self.diskIndex = map
                  }
              }

              func image(for urlString: String?) -> UIImage? {
                  guard let s = urlString, !s.isEmpty, let url = URL(string: s) else { return nil }
                  if let hit = cache[s] { return hit }
                  if let hit = memCache.object(forKey: s as NSString) {
                      cache[s] = hit
                      return hit
                  }

                  let name = Self.sanitize(s)
                  let path = diskDir.appendingPathComponent(name)
                  if let data = try? Data(contentsOf: path), let img = UIImage(data: data) {
                      memCache.setObject(img, forKey: s as NSString, cost: data.count)
                      cache[s] = img
                      return img
                  }

                  var already = false
                  inflightQueue.sync { already = inflightSet.contains(s); if !already { inflightSet.insert(s) } }
                  if !already {
                      Task { [weak self] in await self?.fetch(urlString: s, url: url, name: name) }
                  }
                  return nil
              }

              private func fetch(urlString: String, url: URL, name: String) async {
                  defer { _ = inflightQueue.sync { inflightSet.remove(urlString) } }
                  do {
                      let (data, _) = try await session.data(from: url)
                      guard let img = UIImage(data: data) else { return }
                      memCache.setObject(img, forKey: urlString as NSString, cost: data.count)
                      cache[urlString] = img
                      let path = diskDir.appendingPathComponent(name)
                      try? data.write(to: path, options: .atomic)
                      diskIndex[urlString] = name
                      if let data = try? JSONEncoder().encode(diskIndex) {
                          UserDefaults.standard.set(data, forKey: diskIndexKey)
                      }
                  } catch {}
              }

              private static func sanitize(_ s: String) -> String {
                  let cleaned = s
                      .replacingOccurrences(of: "https://", with: "")
                      .replacingOccurrences(of: "http://", with: "")
                      .replacingOccurrences(of: "/", with: "_")
                      .replacingOccurrences(of: ":", with: "_")
                      .replacingOccurrences(of: "?", with: "_")
                      .replacingOccurrences(of: "&", with: "_")
                  return String(cleaned.prefix(160))
              }
          }

          struct RemoteIcon: View {
              let url: String?
              var size: CGFloat = 56
              var cornerRadius: CGFloat = 14
              @ObservedObject private var cache = RemoteIconCache.shared

              var body: some View {
                  Group {
                      if let img = cache.image(for: url) {
                          Image(uiImage: img)
                              .resizable()
                              .aspectRatio(contentMode: .fill)
                      } else {
