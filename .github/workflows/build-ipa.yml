name: ONEs Store - Login + Apps (SwiftUI) - Dynamic Dark/Light

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "ONEs"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: Maximize build resources (1TB+ capacity)
        run: |
          echo "=== Build capacity check ==="
          df -h
          echo "=== macOS resource limits ==="
          ulimit -a
          echo "=== Available CPUs ==="
          sysctl -n hw.ncpu
          echo "=== Available memory ==="
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS - only static PNGs (no GIFs)
      # =========================================================
      - name: Download project images
        run: |
          mkdir -p Resources
          curl -L -o Resources/header_logo.png     "https://up6.cc/2026/08/17868045641091.png"
          curl -L -o Resources/appstore_glyph.png  "https://up6.cc/2026/08/17868045641091.png"
          curl -L -o Resources/sub_mascot.png      "https://up6.cc/2026/08/178680469138521.png"
          curl -L -o Resources/home_banner.png     "https://up6.cc/2026/08/178680278357461.png"
          file Resources/*.png 2>/dev/null || true
          ls -lh Resources

      - name: Generate app icons (simple)
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          def generate_icon(size, path):
              img = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              draw = ImageDraw.Draw(img)
              rect_size = int(size * 0.8)
              x0 = (size - rect_size) // 2
              y0 = (size - rect_size) // 2
              draw.rounded_rectangle((x0, y0, x0+rect_size, y0+rect_size), radius=int(rect_size*0.2), fill=(232, 184, 92))
              try:
                  font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", int(size*0.3))
              except:
                  font = ImageFont.load_default()
              draw.text((size//2, size//2), "ONEs", font=font, fill=(255,255,255), anchor="mm")
              img.save(path, "PNG")

          generate_icon(120,  "Resources/AppIcon60x60@2x.png")
          generate_icon(180,  "Resources/AppIcon60x60@3x.png")
          generate_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          generate_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          generate_icon(1024, "Resources/AppIcon1024x1024.png")
          PYEOF
          ls -lh Resources

      - name: Generate Info.plist
        run: |
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>     <string>ar</string>
              <key>CFBundleAllowMixedLocalizations</key> <true/>
              <key>CFBundleLocalizations</key>
              <array><string>ar</string></array>
