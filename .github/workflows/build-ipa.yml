          public struct QRCodeView: View {
              public let payload: String
              public init(payload: String) { self.payload = payload }
              public var body: some View {
                  if let img = Self.generate(from: payload) {
                      Image(uiImage: img)
                          .interpolation(.none)
                          .resizable()
                          .scaledToFit()
                  } else {
                      Image(systemName: "qrcode")
                          .resizable().scaledToFit()
                          .foregroundColor(.storeSub)
                  }
              }
              public static func generate(from string: String) -> UIImage? {
                  guard let data = string.data(using: .utf8) else { return nil }
                  guard let f = CIFilter(name: "CIQRCodeGenerator") else { return nil }
                  f.setValue(data, forKey: "inputMessage")
                  f.setValue("H", forKey: "inputCorrectionLevel")
                  guard let ci = f.outputImage else { return nil }
                  let scaled = ci.transformed(by: CGAffineTransform(scaleX: 10, y: 10))
                  let ctx = CIContext()
                  guard let cg = ctx.createCGImage(scaled, from: scaled.extent) else { return nil }
                  return UIImage(cgImage: cg)
              }
          }
