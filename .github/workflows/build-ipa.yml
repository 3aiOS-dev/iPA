      - name: Generate code - HomeTabView.swift
        run: |
          cat > HomeTabView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation

          struct HomeTabView: View {
              @ObservedObject var appsManager: AppsManager
              @ObservedObject var downloadManager: DownloadManager
              @State private var selectedApp: AppItem?
              @Environment(\.colorScheme) var scheme

              private var newest: [AppItem] {
                  Array(appsManager.apps.prefix(8))
              }
              private var popular: [AppItem] {
                  appsManager.apps.filter { $0.isPopular }.prefix(8).map { $0 }
              }
              private var newThisWeek: [AppItem] {
                  appsManager.newThisWeek
              }
              private var topRated: [AppItem] {
                  appsManager.apps.sorted { (Int($0.down) ?? 0) > (Int($1.down) ?? 0) }.prefix(5).map { $0 }
              }

              var body: some View {
                  NavigationView {
                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 20) {
                              if appsManager.isLoading && appsManager.apps.isEmpty {
                                  LoadingView()
                              } else if let err = appsManager.errorMessage, appsManager.apps.isEmpty {
                                  ErrorView(message: err) { appsManager.retryFetch() }
                              } else {
                                  StoreHeroBanner(stats: appsManager.stats)
                                      .padding(.top, 6)
                                  AdImageCarousel(images: AppConstants.adBanners)
                                  if !newThisWeek.isEmpty {
                                      XcodeSectionHeader(title: "🆕 New This Week", icon: "sparkles")
                                      ScrollView(.horizontal, showsIndicators: false) {
                                          HStack(spacing: 12) {
                                              ForEach(newThisWeek, id: \.id) { app in
                                                  NewThisWeekCard(app: app)
                                                      .contentShape(Rectangle())
                                                      .onTapGesture { selectedApp = app }
                                              }
                                          }
                                          .padding(.horizontal, 16)
                                      }
                                  }
                                  if !popular.isEmpty {
                                      XcodeSectionHeader(title: "🔥 Most Popular", icon: "flame.fill")
                                      ScrollView(.horizontal, showsIndicators: false) {
                                          HStack(spacing: 12) {
                                              ForEach(popular, id: \.id) { app in
                                                  FeaturedAppCard(app: app)
                                                      .contentShape(Rectangle())
                                                      .onTapGesture { selectedApp = app }
                                              }
                                          }
                                          .padding(.horizontal, 16)
                                      }
                                  }
                                  if !topRated.isEmpty {
                                      XcodeSectionHeader(title: "⬇️ Top Downloads", icon: "arrow.down.circle.fill")
                                      ScrollView(.horizontal, showsIndicators: false) {
                                          HStack(spacing: 12) {
                                              ForEach(Array(topRated.enumerated()), id: \.element.id) { idx, app in
                                                  TopDownloadWideCard(rank: idx + 1, app: app)
                                                      .onTapGesture { selectedApp = app }
                                              }
                                          }
                                          .padding(.horizontal, 16)
                                          .padding(.vertical, 4)
                                      }
                                  }
                                  XcodeSectionHeader(title: "🕐 Latest Apps", icon: "clock.fill")
                                  ForEach(newest, id: \.id) { app in
                                      AppCardView(app: app)
                                          .contentShape(Rectangle())
                                          .onTapGesture { selectedApp = app }
                                          .padding(.horizontal)
                                  }
                              }
                          }
                          .padding(.bottom, 20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 8) {
                                  Text("21s Pro")
                                      .font(.system(size: 18, weight: .bold))
                                      .foregroundColor(.xcodeBlue)
                              }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              TopRightIconView()
                          }
                      }
                  }
                  .sheet(item: $selectedApp) { app in
                      AppDetailView(app: app, downloadManager: downloadManager)
                  }
              }
          }

          struct StoreHeroBanner: View {
