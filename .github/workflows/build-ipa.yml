      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift CertificateManager.swift SigningEngine.swift IPAManager.swift MainUI.swift AppsViewController.swift CertificatesViewController.swift ToolsViewController.swift StatusViewController.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -o EsignClone

          file EsignClone

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/EsignClone.app

          cp EsignClone build-output/Payload/EsignClone.app/EsignClone
          cp Resources/Info.plist build-output/Payload/EsignClone.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/EsignClone.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/EsignClone.app/

          ldid -S build-output/Payload/EsignClone.app/EsignClone

          cd build-output
          zip -r -q ../artifacts/EsignClone.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/EsignClone.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EsignClone-IPA
          path: artifacts/EsignClone.ipa
          retention-days: 30
