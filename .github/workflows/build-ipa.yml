          import SwiftUI
          import UIKit
          import Foundation

          // MARK: - App Detail View
          struct AppDetailView: View {
              let app: AppItem
              @State private var isDownloading = false
              @State private var showAlert = false
              @Environment(\.dismiss) var dismiss
              @Environment(\.colorScheme) var scheme

              var body: some View {
                  ZStack {
                      (scheme == .dark ? Color.vipDark : Color(red: 0.96, green: 0.96, blue: 1.0)).edgesIgnoringSafeArea(.all)
                      VStack(spacing: 0) {
                          HStack {
                              Button(action: { dismiss() }) {
                                  Image(systemName: "xmark.circle.fill").font(.title2).foregroundColor(.gray)
                              }
                              Spacer()
                          }.padding(.horizontal, 20).padding(.top, 16)

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 18) {
                                  // Banner
                                  ZStack(alignment: .bottom) {
                                      RoundedRectangle(cornerRadius: 28)
                                          .fill(
                                              LinearGradient(
                                                  colors: app.source == .kurd
                                                      ? [Color(red: 0.95, green: 0.45, blue: 0.20), Color(red: 0.85, green: 0.25, blue: 0.10), Color(red: 0.75, green: 0.15, blue: 0.05)]
                                                      : [.vipPurple.opacity(0.85), .blue.opacity(0.75), .indigo.opacity(0.9)],
                                                  startPoint: .topLeading,
                                                  endPoint: .bottomTrailing
                                              )
                                          )
                                          .frame(height: 180)
                                          .overlay(
                                              ZStack {
                                                  Circle().fill(Color.white.opacity(0.10))
                                                      .frame(width: 160, height: 160)
                                                      .offset(x: -110, y: -50)
                                                  Circle().fill(Color.white.opacity(0.08))
                                                      .frame(width: 110, height: 110)
                                                      .offset(x: 120, y: 40)
                                              }.clipShape(RoundedRectangle(cornerRadius: 28))
                                          )
                                          .overlay(
                                              RoundedRectangle(cornerRadius: 28)
                                                  .stroke(Color.white.opacity(0.18), lineWidth: 1)
                                          )
                                          .shadow(color: app.source == .kurd ? Color.orange.opacity(0.45) : .vipPurple.opacity(0.45), radius: 22, x: 0, y: 12)
                                          .shadow(color: .blue.opacity(0.25), radius: 30, x: 0, y: 18)
                                          .padding(.horizontal, 16)

                                      CachedAsyncImage(url: URL(string: app.iconURL)) { phase in
                                          switch phase {
                                          case .success(let img): img.resizable().aspectRatio(contentMode: .fill)
                                          default:
                                              RoundedRectangle(cornerRadius: 26)
                                                  .fill(LinearGradient(colors: [.vipPurple.opacity(0.4), .blue.opacity(0.3)],
                                                                       startPoint: .topLeading, endPoint: .bottomTrailing))
                                                  .overlay(Image(systemName: "app.fill").font(.system(size: 40)).foregroundColor(.white.opacity(0.7)))
                                          }
                                      }
                                      .frame(width: 120, height: 120)
                                      .clipShape(RoundedRectangle(cornerRadius: 26))
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 26)
                                              .stroke(Color.white.opacity(0.9), lineWidth: 3)
                                      )
                                      .shadow(color: .black.opacity(0.35), radius: 14, x: 0, y: 8)
                                      .shadow(color: .vipPurple.opacity(0.4), radius: 20, x: 0, y: 10)
                                      .offset(y: 50)
                                  }
                                  .padding(.bottom, 50)

                                  VStack(spacing: 6) {
                                      Text(app.name).font(.system(size: 24, weight: .black)).multilineTextAlignment(.center)
                                      Text(app.developerName.isEmpty ? "VIP21 Store" : app.developerName)
                                          .font(.system(size: 13)).foregroundColor(.gray)
                                      HStack(spacing: 6) {
                                          if app.isNew { NewBadge() }
                                          if app.isPopular { PopularBadge() }
                                          SourceBadge(source: app.source)
                                      }
                                  }

                                  HStack(spacing: 0) {
                                      DetailStat(icon: "memorychip", value: app.formattedSize, label: "الحجم")
                                      Divider().frame(height: 40).background(Color.gray.opacity(0.2))
                                      DetailStat(icon: "star.circle", value: app.version, label: "النسخة")
                                      Divider().frame(height: 40).background(Color.gray.opacity(0.2))
                                      DetailStat(icon: "calendar", value: app.formattedDate, label: "آخر تحديث")
                                  }.padding(.vertical, 16).glassCard(radius: 18).padding(.horizontal)

                                  HStack(spacing: 12) {
                                      InfoPill(label: "Bundle ID", value: app.bundleID)
                                      InfoPill(label: "الترخيص",   value: app.subscriptionType)
                                  }.padding(.horizontal)

                                  VStack(alignment: .trailing, spacing: 8) {
                                      HStack {
                                          Spacer()
                                          Image(systemName: "text.alignright").foregroundColor(.vipPurple)
                                          Text("الوصف").font(.system(size: 15, weight: .semibold))
                                      }
                                      Text(app.localizedDescription.replacingOccurrences(of: "Injected with ", with: ""))
                                          .font(.system(size: 13)).foregroundColor(.secondary).multilineTextAlignment(.trailing).lineSpacing(4)
                                  }.padding(14).glassCard(radius: 16).padding(.horizontal)

                                  GradientButton(
                                      title: "تحميل IPA",
                                      icon: "arrow.down.circle.fill",
                                      gradient: app.source == .kurd
                                          ? [Color(red: 0.95, green: 0.45, blue: 0.20), Color(red: 0.85, green: 0.25, blue: 0.10)]
                                          : [.vipPurple, .blue],
                                      action: {
                                          HapticManager.shared.impact(.medium)
                                          if let url = URL(string: app._secureDownloadURL) {
                                              UIApplication.shared.open(url)
                                          }
                                      }
                                  ).padding(.horizontal, 40).padding(.top, 8)
                              }.padding(.vertical, 16)
                          }
                      }
                  }
                  .preferredColorScheme(.none)
              }
          }

          struct DetailStat: View {
              let icon: String; let value: String; let label: String
              var body: some View {
                  VStack(spacing: 5) {
                      Image(systemName: icon).font(.system(size: 14))
                          .foregroundStyle(LinearGradient(colors: [.vipPurple, .blue], startPoint: .top, endPoint: .bottom))
                      Text(value).font(.system(size: 13, weight: .bold))
                      Text(label).font(.system(size: 10)).foregroundColor(.gray)
                  }.frame(maxWidth: .infinity)
              }
          }

          struct InfoPill: View {
              let label: String; let value: String
              var body: some View {
                  VStack(spacing: 3) {
                      Text(label).font(.system(size: 10)).foregroundColor(.gray)
                      Text(value).font(.system(size: 12, weight: .semibold)).lineLimit(2).multilineTextAlignment(.center)
                  }
                  .frame(maxWidth: .infinity).padding(10)
                  .background(RoundedRectangle(cornerRadius: 12).fill(Color.gray.opacity(0.08)))
              }
          }
          VIPEOF
          echo "AppDetailView.swift: $(wc -l < AppDetailView.swift) lines"

      - name: Generate Source - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UserNotifications

          // MARK: - App Entry Point
          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .onAppear {
                              requestNotifications()
                          }
                  }
              }

              func requestNotifications() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }
          }

          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  return true
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           willPresent notification: UNNotification,
                                           withCompletionHandler handler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  handler([.banner, .sound, .badge])
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           didReceive response: UNNotificationResponse,
                                           withCompletionHandler handler: @escaping () -> Void) {
                  handler()
              }
          }
          VIPEOF
          echo "VIP21StoreApp.swift: $(wc -l < VIP21StoreApp.swift) lines"

      - name: Build Application
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            AppsManager.swift \
            SharedComponents.swift \
            ContentView.swift \
            HomeTabView.swift \
            AppsTabView.swift \
            AppDetailView.swift \
            VIP21StoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework UserNotifications \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA Package
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-IPA-SwiftUI-v7
          path: artifacts/21s.ipa
