              let usedBytes: Int64
              var freeBytes: Int64 { max(0, totalBytes - usedBytes) }
              var freeGB: Double { Double(freeBytes) / 1_073_741_824.0 }
              var usedGB: Double { Double(usedBytes) / 1_073_741_824.0 }
              var totalGB: Double { Double(totalBytes) / 1_073_741_824.0 }
          }
