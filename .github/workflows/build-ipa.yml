                      switch self {
                      case .store(let a): return "S-\(a.id)"
                      case .local(let l): return "L-\(l.id)"
                      }
                  }
              }

              var merged: [AnySource] {
                  var list: [AnySource] = []
                  switch sourceFilter {
                  case .all:    list.append(contentsOf: ipaManager.ipas.map { .local($0) })
                  case .local:  list.append(contentsOf: ipaManager.ipas.map { .local($0) })
                  case .store:  break
                  }
                  if sourceFilter != .local {
                      list.append(contentsOf: appsManager.apps.map { .store($0) })
                  }
                  return list
              }

              var filtered: [AnySource] {
                  var base = merged
                  if selectedCategory != "الكل" {
                      base = base.filter { item in
                          switch item {
                          case .store(let a): return a.category == selectedCategory
                          case .local: return false
                          }
