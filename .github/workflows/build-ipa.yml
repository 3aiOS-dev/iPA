          // ================= ONEsCloud =================
          enum ONEsCloud {
              static let baseURL = "https://xtxcjrkfuuubzlebwpte.supabase.co"
              static let anonKey = "sb_publishable_eYzOxEoy6MuGmndv39emFQ_DD7SthnX"
              static let usernameDomain = "ones.local"

              static func email(for username: String) -> String {
                  let clean = username.lowercased().filter { $0.isLetter || $0.isNumber || $0 == "_" || $0 == "." || $0 == "-" }
                  return "\(clean.isEmpty ? "user" : clean)@\(usernameDomain)"
              }

              static func request(_ path: String, method: String = "GET", body: Any? = nil, token: String = "") -> URLRequest? {
                  guard let url = URL(string: baseURL + path) else { return nil }
                  var req = URLRequest(url: url)
                  req.httpMethod = method
                  req.timeoutInterval = 25
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(anonKey, forHTTPHeaderField: "apikey")
                  req.setValue("Bearer \(token.isEmpty ? anonKey : token)", forHTTPHeaderField: "Authorization")
                  req.setValue("return=representation", forHTTPHeaderField: "Prefer")
                  if let body = body {
                      req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  }
                  return req
              }

              static func rows(_ path: String, token: String = "", completion: @escaping ([[String: Any]]) -> Void) {
                  guard let req = request(path, token: token) else { completion([]); return }
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      var out: [[String: Any]] = []
                      if let data = data,
                         let json = try? JSONSerialization.jsonObject(with: data) as? [[String: Any]] {
                          out = json
                      }
                      DispatchQueue.main.async { completion(out) }
                  }.resume()
              }

              static func send(_ path: String, method: String, body: Any?, token: String = "",
                               completion: @escaping (Bool, [String: Any]?) -> Void) {
                  guard let req = request(path, method: method, body: body, token: token) else {
                      completion(false, nil); return
                  }
                  URLSession.shared.dataTask(with: req) { data, resp, _ in
                      let ok = (resp as? HTTPURLResponse).map { (200..<300).contains($0.statusCode) } ?? false
                      var obj: [String: Any]? = nil
                      if let data = data {
                          if let dict = try? JSONSerialization.jsonObject(with: data) as? [String: Any] { obj = dict }
                          else if let arr = try? JSONSerialization.jsonObject(with: data) as? [[String: Any]] { obj = arr.first }
                      }
                      DispatchQueue.main.async { completion(ok, obj) }
                  }.resume()
              }
          }

