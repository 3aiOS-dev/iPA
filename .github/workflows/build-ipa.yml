                    import SwiftUI
                    import Foundation

                    @MainActor
                    final class UserProfileManager: ObservableObject {
                        @Published var profile: UserProfile
                        private let url: URL

                        init() {
                            let dir = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                                .appendingPathComponent("Profile", isDirectory: true)
                            try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                            url = dir.appendingPathComponent("profile.json")
                            if let data = try? Data(contentsOf: url),
                               let p = try? JSONDecoder().decode(UserProfile.self, from: data) {
                                profile = p
                            } else {
                                profile = .default
                            }
                        }

                        func save() {
                            if let data = try? JSONEncoder().encode(profile) {
                                try? data.write(to: url, options: .atomic)
                            }
                        }

                        func setName(_ name: String) { profile.userName = name; save() }
                        func incrementInstalls() { profile.totalInstalls += 1; save() }
                        func setImage(_ data: Data?) { profile.profileImageData = data; save() }
                    }
          VIPEOF
          echo "UserProfileManager.swift: $(wc -l < Sources/VIP21Store/UserProfileManager.swift) lines"

