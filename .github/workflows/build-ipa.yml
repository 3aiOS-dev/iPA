              @State private var pop: [Int: Bool] = [:]
              @State private var spin: [Int: Double] = [:]
              @State private var searchPop: Bool = false
              @Namespace private var tabNS

              var body: some View {
                  ZStack {
                      HStack(spacing: 0) {
                          tabItem(icon: "house.fill", label: LS("الرئيسية"), index: 0)
