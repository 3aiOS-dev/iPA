          // ============================================================
          // WALLET TAB
          // ============================================================
          struct WalletView: View {
              var onMenu: (() -> Void)? = nil
              var onBell: (() -> Void)? = nil
              @AppStorage("walletUserID_21s") private var storedWalletUserID: String = ""
              @AppStorage("walletCardNumber_21s") private var storedCardNumber: String = ""
              @State private var showIDSheet = false
              @State private var showCardSheet = false
              @State private var showCopiedToast = false
              @State private var copiedText: String = ""
              @State private var tempUserID: String = ""
              @State private var tempCardNumber: String = ""

              @State private var isUserIDRevealed: Bool = false
              @State private var isCardNumberRevealed: Bool = false

              private var displayUserID: String {
                  if !storedWalletUserID.isEmpty { return storedWalletUserID }
                  return generateUserID()
              }

              private var displayCardNumber: String {
                  if !storedCardNumber.isEmpty { return storedCardNumber }
                  return generateCardNumber()
              }

              var body: some View {
                  ScrollView {
                      VStack(spacing: 20) {
                          StoreHeader(title: "Wallet",
                                      onMenu: { onMenu?() },
                                      onBell: { onBell?() })

                          HStack {
                              HStack(spacing: 6) {
                                  Image(systemName: "exclamationmark.shield.fill")
                                      .font(.system(size: 12, weight: .bold))
                                      .foregroundColor(.white)
                                  Text("BETA")
                                      .font(.system(size: 13, weight: .black))
                                      .foregroundColor(.white)
                                      .tracking(1.5)
                              }
                              .padding(.horizontal, 12).padding(.vertical, 6)
                              .background(Capsule().fill(Color.betaOrange))
                              .shadow(color: Color.betaOrange.opacity(0.3), radius: 6, y: 3)
                              Spacer()
                              Text("Wallet v1.0")
                                  .font(.system(size: 11, weight: .semibold))
                                  .foregroundColor(.storeSub)
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 4)

                          CreditCardView(
                              userID: displayUserID,
                              cardNumber: displayCardNumber,
                              isCardSet: !storedCardNumber.isEmpty,
                              isIDSet: !storedWalletUserID.isEmpty,
                              isUserIDRevealed: isUserIDRevealed,
                              isCardNumberRevealed: isCardNumberRevealed,
                              onToggleUserID: { toggleReveal(forID: true) },
                              onToggleCardNumber: { toggleReveal(forID: false) }
                          )
                          .padding(.horizontal, 20)

                          Spacer(minLength: 40)
                      }
                      .padding(.top, 8)
                  }
                  .sheet(isPresented: $showIDSheet) {
                      EditIDSheet(userID: $tempUserID) { newID in
                          storedWalletUserID = newID
                          HapticManager.shared.success()
                      }
                      .onAppear {
                          tempUserID = storedWalletUserID.isEmpty ? generateUserID() : storedWalletUserID
                      }
                  }
                  .sheet(isPresented: $showCardSheet) {
                      EditCardSheet(cardNumber: $tempCardNumber) { newCard in
                          storedCardNumber = newCard
                          HapticManager.shared.success()
                      }
                      .onAppear {
                          tempCardNumber = storedCardNumber.isEmpty ? generateCardNumber() : storedCardNumber
                      }
                  }
                  .overlay(
                      Group {
                          if showCopiedToast {
                              HStack(spacing: 8) {
                                  Image(systemName: "checkmark.circle.fill")
                                      .foregroundColor(.white)
                                  Text("\(copiedText) copied")
                                      .font(.system(size: 13, weight: .semibold))
                                      .foregroundColor(.white)
                              }
                              .padding(.horizontal, 18).padding(.vertical, 12)
                              .background(Capsule().fill(Color.walletGreen))
                              .shadow(color: .black.opacity(0.2), radius: 8, y: 4)
                              .transition(.move(edge: .top).combined(with: .opacity))
                              .padding(.top, 60)
                          }
                      }
                      .animation(.spring(), value: showCopiedToast),
                      alignment: .top
                  )
              }

              private func toggleReveal(forID: Bool) {
                  HapticManager.shared.impact(.light)
                  if forID {
                      if !isUserIDRevealed {
                          UIPasteboard.general.string = displayUserID
                          copiedText = "User ID"
                          showCopiedToast = true
                          DispatchQueue.main.asyncAfter(deadline: .now() + 1.6) { showCopiedToast = false }
                      }
                      withAnimation(.easeInOut(duration: 0.2)) { isUserIDRevealed.toggle() }
                  } else {
                      if !isCardNumberRevealed {
                          UIPasteboard.general.string = displayCardNumber
                          copiedText = "Card Number"
                          showCopiedToast = true
                          DispatchQueue.main.asyncAfter(deadline: .now() + 1.6) { showCopiedToast = false }
                      }
                      withAnimation(.easeInOut(duration: 0.2)) { isCardNumberRevealed.toggle() }
                  }
              }

              private func generateUserID() -> String {
                  let chars = "ABCDEF0123456789"
                  var s = ""
                  for i in 0..<12 {
                      if i > 0 && i % 4 == 0 { s += "-" }
                      s += String(chars.randomElement()!)
                  }
                  return s
              }

              private func generateCardNumber() -> String {
                  var s = ""
                  for i in 0..<16 {
                      s += String(Int.random(in: 0...9))
                      if (i + 1) % 4 == 0 && i != 15 { s += " " }
                  }
                  return s
              }
          }

