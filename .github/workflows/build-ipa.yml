                      <div class="stat-card"><div class="value" id="stat-apps">0</div><div class="label">تطبيق</div></div>
                      <div class="stat-card"><div class="value" id="stat-size">0</div><div class="label">إجمالي</div></div>
                      <div class="stat-card"><div class="value" id="stat-new">0</div><div class="label">جديد</div></div>
                      <div class="stat-card"><div class="value" id="stat-cats">0</div><div class="label">تصنيف</div></div>
                  </div>
                  <div class="section-title">🔥 الأكثر شعبية</div>
                  <div class="app-list" id="app-list">جاري التحميل...</div>
              </div>
