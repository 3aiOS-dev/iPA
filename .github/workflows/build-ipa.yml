      # 🔄 AUTO UPDATER
      # =========================================================
      - name: 🔄 توليد AutoUpdater.swift
        run: |
          cat > AutoUpdater.swift << 'AUEOF'
          import Foundation
          import UIKit

          struct InstalledApp: Codable, Identifiable {
              let id: UUID
              let bundleID: String
              let name: String
              let currentVersion: String
              let installDate: Date
              var lastChecked: Date?
          }

          @MainActor
          class AutoUpdater: ObservableObject {
              @Published var installedApps: [InstalledApp] = []
              @Published var availableUpdates: [(app: InstalledApp, newVersion: String)] = []
              @Published var isChecking = false

              private let checkInterval: TimeInterval = 3600 // 1 hour

              init() {
                  loadInstalledApps()
                  scheduleBackgroundChecks()
              }

              func registerInstalledApp(bundleID: String, name: String, version: String) {
                  let app = InstalledApp(
                      id: UUID(),
                      bundleID: bundleID,
                      name: name,
                      currentVersion: version,
                      installDate: Date(),
                      lastChecked: nil
                  )
                  installedApps.append(app)
                  saveInstalledApps()
              }

              func checkForUpdates(appsManager: AppsManager) async {
                  isChecking = true
                  availableUpdates.removeAll()

                  for i in installedApps.indices {
                      if let storeApp = appsManager.apps.first(where: { $0.bundleID == installedApps[i].bundleID }) {
                          if storeApp.version != installedApps[i].currentVersion {
                              availableUpdates.append((installedApps[i], storeApp.version))
                          }
                          installedApps[i].lastChecked = Date()
                      }
                  }

                  saveInstalledApps()
                  isChecking = false

                  if !availableUpdates.isEmpty {
                      sendUpdateNotification()
                  }
              }

              private func scheduleBackgroundChecks() {
                  let timer = Timer.scheduledTimer(withTimeInterval: checkInterval, repeats: true) { _ in
                      Task {
                          // Background check triggered
                      }
                  }
                  RunLoop.current.add(timer, forMode: .common)
              }

              private func sendUpdateNotification() {
                  let content = UNMutableNotificationContent()
                  content.title = "تحديثات متوفرة!"
                  content.body = "هناك \(availableUpdates.count) تحديثات جديدة لتطبيقاتك"
