                                  Image(systemName: "safari.fill")
                                      .foregroundColor(themeManager.currentTheme.primaryColor)
                              }
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 16)

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 16) {
                                  ZStack(alignment: .bottom) {
                                      RoundedRectangle(cornerRadius: 24)
                                          .fill(
                                              LinearGradient(
                                                  colors: app.source == .kurd
                                                      ? [Color.xcodeOrange.opacity(0.8), Color.xcodeOrange.opacity(0.5)]
                                                      : [themeManager.currentTheme.primaryColor.opacity(0.7), themeManager.currentTheme.secondaryColor.opacity(0.6)],
                                                  startPoint: .topLeading, endPoint: .bottomTrailing
                                              )
                                          )
                                          .frame(height: 160)
                                          .overlay(
                                              ZStack {
                                                  Circle().fill(Color.white.opacity(0.08))
                                                      .frame(width: 140).offset(x: -100, y: -40)
                                                  Circle().fill(Color.white.opacity(0.05))
                                                      .frame(width: 100).offset(x: 110, y: 35)
                                              }
                                              .clipShape(RoundedRectangle(cornerRadius: 24))
                                          )
                                          .overlay(
                                              RoundedRectangle(cornerRadius: 24)
                                                  .stroke(Color.white.opacity(0.12), lineWidth: 0.5)
                                          )
                                          .shadow(color: app.source == .kurd ? Color.xcodeOrange.opacity(0.3) : themeManager.currentTheme.primaryColor.opacity(0.3),
                                                  radius: 18, x: 0, y: 8)
                                          .padding(.horizontal, 16)

                                      CachedAsyncImage(url: URL(string: app.iconURL)) { phase in
                                          switch phase {
                                          case .success(let img):
                                              img.resizable().aspectRatio(contentMode: .fill)
                                          default:
                                              RoundedRectangle(cornerRadius: 22)
                                                  .fill(themeManager.currentTheme.primaryColor.opacity(0.3))
                                                  .overlay(Image(systemName: "app.fill")
                                                      .font(.system(size: 36))
                                                      .foregroundColor(.white.opacity(0.6)))
                                          }
                                      }
                                      .frame(width: 110, height: 110)
                                      .clipShape(RoundedRectangle(cornerRadius: 22))
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 22)
                                              .stroke(Color.white.opacity(0.8), lineWidth: 2.5)
                                      )
                                      .shadow(color: .black.opacity(0.3), radius: 12, x: 0, y: 6)
                                      .offset(y: 45)
                                  }
                                  .padding(.bottom, 45)

                                  VStack(spacing: 5) {
                                      Text(app.name)
                                          .font(.system(size: 22, weight: .black))
                                          .multilineTextAlignment(.center)
                                      Text(app.developerName.isEmpty ? "VIP21 Store" : app.developerName)
                                          .font(.system(size: 12))
                                          .foregroundColor(.xcodeSecondary)
                                      HStack(spacing: 6) {
                                          if app.isNew { NewBadge() }
                                          if app.isPopular { PopularBadge() }
                                          SourceBadge(source: app.source)
                                      }
                                  }

                                  HStack(spacing: 0) {
                                      DetailStat(icon: "memorychip", value: app.formattedSize, label: "الحجم")
                                      Divider().frame(height: 36).background(Color.xcodeDivider)
                                      DetailStat(icon: "number", value: app.version, label: "النسخة")
                                      Divider().frame(height: 36).background(Color.xcodeDivider)
                                      DetailStat(icon: "calendar", value: app.formattedDate, label: "التحديث")
                                  }
                                  .padding(.vertical, 14)
                                  .xcodeCard(radius: 14)
                                  .padding(.horizontal)

                                  HStack(spacing: 10) {
                                      InfoPill(label: "Bundle ID", value: app.bundleID)
                                      InfoPill(label: "الترخيص", value: app.subscriptionType)
                                  }
                                  .padding(.horizontal)

                                  VStack(alignment: .trailing, spacing: 6) {
                                      HStack {
                                          Spacer()
                                          Image(systemName: "text.alignright")
                                              .foregroundColor(themeManager.currentTheme.primaryColor)
                                          Text("الوصف")
                                              .font(.system(size: 14, weight: .semibold))
                                      }
                                      Text(app.localizedDescription.replacingOccurrences(of: "Injected with ", with: ""))
                                          .font(.system(size: 12))
                                          .foregroundColor(.xcodeSecondary)
                                          .multilineTextAlignment(.trailing)
                                          .lineSpacing(3)
                                  }
                                  .padding(12)
                                  .xcodeCard(radius: 14)
                                  .padding(.horizontal)

                                  // HTML Preview Button
                                  EnergyAuraButton(
                                      title: "معاينة HTML أنمي",
                                      icon: "eye.fill",
                                      color: themeManager.currentTheme.secondaryColor
                                  ) {
                                      showHTMLPreview = true
                                  }
                                  .padding(.horizontal, 40)

                                  if isAlreadyDownloading {
                                      EnergyAuraButton(
                                          title: "جاري التحميل...",
                                          icon: "arrow.down.circle.fill",
                                          color: .xcodeOrange
                                      ) {}
                                      .padding(.horizontal, 40)
                                      .padding(.top, 8)
                                      .disabled(true)
                                  } else if hasCompletedDownload {
                                      HStack(spacing: 12) {
                                          EnergyAuraButton(
                                              title: "تثبيت",
                                              icon: "arrow.down.app.fill",
                                              color: .xcodeGreen
                                          ) {
                                              if let task = downloadManager.downloads.first(where: { $0.appID == app.id }) {
                                                  downloadManager.installApp(id: task.id)
                                              }
                                          }
                                          EnergyAuraButton(
                                              title: "تحميل مجدداً",
                                              icon: "arrow.down.circle.fill",
                                              color: themeManager.currentTheme.primaryColor
                                          ) {
                                              downloadManager.startDownload(for: app)
                                          }
                                      }
                                      .padding(.horizontal, 20)
                                      .padding(.top, 8)
                                  } else {
                                      EnergyAuraButton(
                                          title: "تحميل IPA",
                                          icon: "arrow.down.circle.fill",
                                          color: app.source == .kurd ? .xcodeOrange : themeManager.currentTheme.primaryColor
                                      ) {
                                          HapticManager.shared.impact(.medium)
                                          downloadManager.startDownload(for: app)
                                      }
                                      .padding(.horizontal, 40)
                                      .padding(.top, 8)
                                  }
                              }
                              .padding(.vertical, 16)
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
                  .sheet(isPresented: $showHTMLPreview) {
                      HTMLPreviewSheet(app: app, themeManager: themeManager)
                  }
              }
          }

          struct HTMLPreviewSheet: View {
              let app: AppItem
              @ObservedObject var themeManager: ThemeManager
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      AnimeWebView(
                          htmlString: HTMLTemplates.animeDetailTemplate(
                              appName: app.name,
                              developer: app.developerName,
                              version: app.version,
                              size: app.formattedSize,
                              description: app.localizedDescription,
                              theme: themeManager.currentTheme
                          ),
                          themeManager: themeManager
                      )
                      .navigationTitle("معاينة أنمي")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("إغلاق") { dismiss() }
                          }
                      }
                  }
              }
          }

          struct DetailStat: View {
              let icon: String
              let value: String
              let label: String
              var body: some View {
                  VStack(spacing: 4) {
                      Image(systemName: icon)
                          .font(.system(size: 13))
                          .foregroundColor(ThemeManager.shared.currentTheme.primaryColor)
                      Text(value)
                          .font(.system(size: 12, weight: .bold))
                      Text(label)
                          .font(.system(size: 9))
                          .foregroundColor(.xcodeSecondary)
                  }
                  .frame(maxWidth: .infinity)
              }
          }

          struct InfoPill: View {
              let label: String
              let value: String
              var body: some View {
                  VStack(spacing: 2) {
                      Text(label)
                          .font(.system(size: 9))
                          .foregroundColor(.xcodeSecondary)
                      Text(value)
                          .font(.system(size: 11, weight: .semibold))
                          .lineLimit(2)
                          .multilineTextAlignment(.center)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(10)
                  .background(RoundedRectangle(cornerRadius: 10).fill(Color.gray.opacity(0.06)))
              }
          }
          VIPEOF

      # =========================================================
      # ⚡ ULTRA BUILD WITH OPTIMIZATIONS
      # =========================================================
      - name: ⚡ بناء التطبيق Ultra (مع تحسينات الأداء)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"

          # Compiler optimizations
          export SWIFT_OPTIMIZATION_LEVEL="-Ounchecked"
          export SWIFT_WHOLE_MODULE_OPTIMIZATION=1

          xcrun swiftc             Constants.swift             AnimeThemes.swift             AnimeEngine.swift             UltraCacheManager.swift             HTMLTemplates.swift             AnimeWebView.swift             SecurityVault.swift             SocialHub.swift             GamificationSystem.swift             P2PShareManager.swift             AutoUpdater.swift             AnalyticsDashboard.swift             AnimeTransitions.swift             HapticManager.swift             Models.swift             CertificateManager.swift             Signer.swift             DownloadManager.swift             AppsManager.swift             SharedComponents.swift             ContentView.swift             HomeTabView.swift             AppsTabView.swift             DownloadsTabView.swift             AppDetailView.swift             VIP21StoreApp.swift             -sdk "$SDK"             -target arm64-apple-ios16.0             -O             -whole-module-optimization             -module-name VIP21Store             -framework SwiftUI             -framework UIKit             -framework Foundation             -framework UserNotifications             -framework UniformTypeIdentifiers             -framework LocalAuthentication             -framework MultipeerConnectivity             -framework WebKit             -o VIP21Store

          file VIP21Store
          ls -lh VIP21Store

      - name: 📦 إنشاء حزمة IPA Ultra (محسّنة)
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app

          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon60x60@3x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/

          # إضافة خلفيات Anime
          cp Resources/LaunchImage_*.png         build-output/Payload/VIP21Store.app/ 2>/dev/null || true

          # توقيع فائق
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store

          # إنشاء IPA
          cd build-output && zip -r -9 -q ../artifacts/21s-ultra.ipa Payload/ && cd ..

          echo "IPA النهائي:"
          du -sh artifacts/21s-ultra.ipa

      - name: 📦 تحسين حجم IPA النهائي
        run: |
          # إزالة لغات غير مستخدمة
          find build-output/Payload/VIP21Store.app -name "*.lproj" -not -name "ar.lproj" -not -name "en.lproj" -exec rm -rf {} + 2>/dev/null || true

          # إعادة إنشاء IPA بعد التحسين
          rm -f artifacts/21s-ultra.ipa
          cd build-output && zip -r -9 -q ../artifacts/21s-ultra.ipa Payload/ && cd ..

          echo "الحجم النهائي بعد التحسين:"
          du -sh artifacts/21s-ultra.ipa

      - name: ✅ التحقق من صحة حزمة IPA
        run: |
          echo "== محتويات ملف IPA =="
          unzip -l artifacts/21s-ultra.ipa | head -50
          if ! unzip -l artifacts/21s-ultra.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ خطأ: الحزمة لا تحتوي على App Bundle صحيح"
            exit 1
          fi
          echo "✅ الحزمة سليمة وتحتوي على App Bundle صحيح."
          echo "== معلومات البناء =="
          echo "الحجم: $(du -sh artifacts/21s-ultra.ipa | cut -f1)"
          echo "الملفات: $(unzip -l artifacts/21s-ultra.ipa | wc -l | xargs)"

      - name: 📤 رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Pro-Ultra-Anime-Edition-v9
          path: artifacts/21s-ultra.ipa
          retention-days: 30
