          // ================= APPS LIST =================
          // ================= APPS TAB (3D + HTML) =================
          struct AppsListView: View {
              @ObservedObject var feed: StoreFeed
              @ObservedObject private var reposStore = RepositoriesStore.shared
              var onMenu: (() -> Void)? = nil
              @State private var searchText: String = ""
              @State private var selectedCategory: String? = nil
              @State private var visiblePage: Int = 0
              @State private var gridMode: Bool = true

              private static let hiddenCategories: [String] = ["movies", "movie", "films", "film", "أفلام", "افلام"]

              private static func isHidden(_ c: String?) -> Bool {
                  let v = (c ?? "").trimmingCharacters(in: .whitespaces).lowercased()
                  return hiddenCategories.contains(v)
              }

              private var filtered: [StoreAPIApp] {
                  let base = feed.apps.filter { !AppsListView.isHidden($0.category) }
                  let byCat: [StoreAPIApp]
                  if let cat = selectedCategory {
                      byCat = base.filter { ($0.category ?? "التطبيقات").lowercased() == cat.lowercased() }
                  } else {
                      byCat = base
                  }
                  let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return byCat }
                  return byCat.filter {
                      $0.name.lowercased().contains(q) || ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }

              private var filteredPages: Int {
                  max(1, Int(ceil(Double(filtered.count) / Double(AppConstants.feedPageSize))))
              }

              private var visibleItems: [StoreAPIApp] {
                  let start = visiblePage * AppConstants.feedPageSize
                  let end = min(start + AppConstants.feedPageSize, filtered.count)
                  guard start < filtered.count else { return [] }
                  return Array(filtered[start..<end])
              }

              private var categories: [String] {
                  let set = Set(feed.apps.compactMap { $0.category?.capitalized }
                                  .filter { !AppsListView.isHidden($0) })
                  return Array(set).sorted()
              }

              private let columns = [GridItem(.flexible(), spacing: 14), GridItem(.flexible(), spacing: 14)]

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          StoreHeader(title: "التطبيقات",
                                      onRefresh: {
                                          HapticManager.shared.impact(.light)
                                          Task { await feed.refresh() }
                                      },
                                      onMenu: { onMenu?() })

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 0) {
                                  // ---- search ----
                                  HStack(spacing: 10) {
                                      HStack(spacing: 8) {
                                          Image(systemName: "magnifyingglass")
                                              .foregroundColor(.storeSub)
                                          TextField("ابحث في \(feed.totalAvailable) تطبيق...", text: $searchText)
                                              .font(.system(size: 14))
                                          if !searchText.isEmpty {
                                              Button { searchText = "" } label: {
                                                  Image(systemName: "xmark.circle.fill")
                                                      .foregroundColor(.storeSub)
                                              }
                                          }
                                      }
                                      .padding(.horizontal, 14)
                                      .frame(height: 46)
                                      .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                                      .overlay(RoundedRectangle(cornerRadius: 16).stroke(Color.storeDivider, lineWidth: 1))

                                      Button {
                                          HapticManager.shared.selection()
                                          withAnimation(.spring(response: 0.45, dampingFraction: 0.7)) { gridMode.toggle() }
                                      } label: {
                                          Image(systemName: gridMode ? "square.grid.2x2.fill" : "list.bullet")
                                              .font(.system(size: 16, weight: .bold))
                                              .foregroundColor(.white)
                                              .frame(width: 46, height: 46)
                                              .background(RoundedRectangle(cornerRadius: 16).fill(Color.storePrimary))
                                              .rotation3DEffect(.degrees(gridMode ? 0 : 180), axis: (x: 0, y: 1, z: 0))
                                      }
                                      .buttonStyle(.plain)
                                  }
                                  .padding(.horizontal, 20)
                                  .padding(.top, 12)

                                  if !categories.isEmpty {
                                      ScrollView(.horizontal, showsIndicators: false) {
                                          HStack(spacing: 8) {
                                              categoryChip(label: "الكل", value: nil)
                                              ForEach(categories, id: \.self) { c in
                                                  categoryChip(label: c, value: c)
                                              }
                                          }
                                          .padding(.horizontal, 20)
                                          .padding(.vertical, 4)
                                      }
                                      .padding(.top, 10)
                                  }

                                  HStack {
                                      Text("يوجد \(feed.totalAvailable) تطبيق في الكتالوج")
                                          .font(.system(size: 11, weight: .semibold))
                                          .foregroundColor(.storeSub)
                                      Spacer()
                                      Text("صفحة \(visiblePage + 1) / \(filteredPages)")
                                          .font(.system(size: 11, weight: .semibold))
                                          .foregroundColor(.storePrimary)
                                  }
                                  .padding(.horizontal, 20)
                                  .padding(.top, 10)

                                  if feed.apps.isEmpty && feed.isLoading {
                                      LoadingList()
                                  } else if filtered.isEmpty {
                                      EmptyState(message: searchText.isEmpty ? "لا توجد تطبيقات في هذا التصنيف." : "لا توجد نتائج تطابق «\(searchText)».")
                                  } else if gridMode {
                                      LazyVGrid(columns: columns, spacing: 14) {
                                          ForEach(Array(visibleItems.enumerated()), id: \.element.id) { pair in
                                              NavigationLink(value: pair.element) {
                                                  App3DCard(app: pair.element, index: pair.offset)
                                              }
                                              .buttonStyle(.plain)
                                              .onAppear { handleAppear(app: pair.element) }
                                          }
                                      }
                                      .padding(.horizontal, 18)
                                      .padding(.top, 14)
                                      .padding(.bottom, 30)
                                  } else {
                                      LazyVStack(spacing: 10) {
                                          ForEach(visibleItems) { app in
                                              NavigationLink(value: app) { AppListRow(app: app) }
                                                  .buttonStyle(.plain)
                                                  .onAppear { handleAppear(app: app) }
                                          }
                                      }
                                      .padding(.horizontal, 20)
                                      .padding(.top, 12)
                                      .padding(.bottom, 30)
                                  }
                              }
                          }
                          .refreshable { await feed.refresh() }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationBarHidden(true)
                      .navigationDestination(for: StoreAPIApp.self) { app in
                          AppDetailView(app: app)
                      }
                  }
              }

              private func categoryChip(label: String, value: String?) -> some View {
                  let active = (value == nil && selectedCategory == nil) || (value != nil && selectedCategory == value)
                  return Button {
                      HapticManager.shared.selection()
                      withAnimation(.spring(response: 0.4, dampingFraction: 0.7)) {
                          selectedCategory = value
                          visiblePage = 0
                      }
                  } label: {
                      Text(label)
                          .font(.system(size: 12, weight: .semibold))
                          .foregroundColor(active ? .white : .storeText)
                          .padding(.horizontal, 16)
                          .padding(.vertical, 9)
                          .background(
                              Capsule().fill(active ? Color.storePrimary : Color.storeCard)
                          )
                          .overlay(
                              Capsule().stroke(active ? Color.clear : Color.storeDivider, lineWidth: 1)
                          )
                          .scaleEffect(active ? 1.06 : 1.0)
                          .rotation3DEffect(.degrees(active ? 0 : 12), axis: (x: 1, y: 0, z: 0), perspective: 0.5)
                          .shadow(color: active ? Color.storePrimary.opacity(0.35) : .clear, radius: 10, y: 5)
                  }
                  .buttonStyle(.plain)
              }

              private func handleAppear(app: StoreAPIApp) {
                  let threshold = max(0, visibleItems.count - 20)
                  if let idx = visibleItems.firstIndex(of: app), idx >= threshold {
                      if visiblePage + 1 < filteredPages {
                          visiblePage += 1
                      }
                  }
              }
          }

          // ================= 3D APP CARD =================
          struct App3DCard: View {
              let app: StoreAPIApp
              let index: Int
              @ObservedObject private var theme = ThemeManager.shared
              @State private var appear: Bool = false
              @State private var float: Bool = false
              @State private var tapped: Bool = false

              private var accent: Color { colorForCategory(app.category) }

              var body: some View {
                  VStack(spacing: 10) {
                      ZStack {
                          RoundedRectangle(cornerRadius: 22)
                              .fill(
                                  LinearGradient(colors: [accent.opacity(0.32), accent.opacity(0.06)],
                                                 startPoint: .topLeading, endPoint: .bottomTrailing)
                              )
                          HTMLContentView(html: HTML3D.iconAura(seed: index))
                              .allowsHitTesting(false)
                              .clipShape(RoundedRectangle(cornerRadius: 22))
                              .opacity(0.95)
                          RemoteIcon(url: app.icon, size: 66, cornerRadius: 18)
                              .shadow(color: accent.opacity(0.45), radius: 14, y: 10)
                              .rotation3DEffect(.degrees(float ? 10 : -10), axis: (x: 0, y: 1, z: 0), perspective: 0.7)
                              .offset(y: float ? -5 : 5)
                              .scaleEffect(tapped ? 1.22 : 1.0)
                      }
                      .frame(height: 126)

                      VStack(spacing: 4) {
                          Text(app.name)
                              .font(.system(size: 13, weight: .bold))
                              .foregroundColor(.storeText)
                              .lineLimit(1)
                          Text(app.category ?? "التطبيقات")
                              .font(.system(size: 10, weight: .semibold))
                              .foregroundColor(accent)
                              .lineLimit(1)
                      }

                      HStack(spacing: 6) {
                          Text(app.cleanSize)
                              .font(.system(size: 9, weight: .semibold))
                              .foregroundColor(.storeSub)
                          Spacer()
                          AppActionsButton(app: app)
                      }
                  }
                  .padding(10)
                  .background(
                      RoundedRectangle(cornerRadius: 26)
                          .fill(Color.storeCard)
                          .shadow(color: .black.opacity(0.08), radius: 14, y: 8)
                  )
                  .overlay(
                      RoundedRectangle(cornerRadius: 26).stroke(Color.storeDivider, lineWidth: 0.6)
                  )
                  .scaleEffect(tapped ? 0.96 : 1.0)
                  .rotation3DEffect(.degrees(appear ? 0 : 60), axis: (x: 1, y: 0, z: 0), perspective: 0.55)
                  .opacity(appear ? 1 : 0)
                  .simultaneousGesture(TapGesture().onEnded { fireBurst() })
                  .onAppear {
                      withAnimation(.spring(response: 0.6, dampingFraction: 0.75).delay(Double(index % 8) * 0.05)) {
                          appear = true
                      }
                      withAnimation(.easeInOut(duration: 2.6).repeatForever(autoreverses: true)) {
                          float = true
                      }
                  }
              }

              private func fireBurst() {
                  HapticManager.shared.impact(.light)
                  withAnimation(.spring(response: 0.25, dampingFraction: 0.45)) { tapped = true }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.22) {
                      withAnimation(.spring(response: 0.45, dampingFraction: 0.6)) { tapped = false }
                  }
              }
          }


