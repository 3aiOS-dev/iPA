                              Label(ipa.formattedSize, systemImage: "internaldrive")
                                  .font(.system(size: 9)).foregroundColor(.gray)
                              Label("v\(ipa.version)", systemImage: "tag")
                                  .font(.system(size: 9)).foregroundColor(.gray)
                              Text(ipa.formattedDate).font(.system(size: 9)).foregroundColor(.gray)
