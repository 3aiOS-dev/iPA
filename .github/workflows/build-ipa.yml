      # =========================================================
      # SOURCE CODE - Constants.swift
      # =========================================================
      - name: Generate code - Constants.swift
        run: |
          cat > Constants.swift << 'VIPEOF'
          import SwiftUI

          struct AppConstants {
              static let appVersion = "1.0"
              static let storeName  = "21s"
              static let userDefaultsKey = "21sProUserData"
              static let hasSeenOnboardingKey = "hasSeenOnboarding21s"
              static let maxFeedCacheBytes: Int = 256 * 1024 * 1024
              static let maxIconCacheBytes: Int = 512 * 1024 * 1024
              static let feedPageSize: Int = 200
          }

          // Dark mode removed: the app always uses the light pink palette.
          // The second tuple is ignored and kept only for source compatibility.
          func dyn(_ light: (CGFloat, CGFloat, CGFloat), _ dark: (CGFloat, CGFloat, CGFloat)) -> Color {
              Color(UIColor(red: light.0, green: light.1, blue: light.2, alpha: 1))
          }

          // ===== EMERALD 3D THEME - one palette shared by every tab / screen =====
          extension Color {
              static let xcodeBackground = dyn((0.94, 0.99, 0.96), (0.04, 0.11, 0.08))
              static let xcodeEditor     = dyn((1.00, 1.00, 1.00), (0.07, 0.16, 0.12))
              static let xcodeBlue       = dyn((0.09, 0.66, 0.44), (0.24, 0.83, 0.58))
              static let xcodeAccent     = dyn((0.09, 0.66, 0.44), (0.24, 0.83, 0.58))
              static let xcodeGreen      = Color(red: 0.13, green: 0.75, blue: 0.50)
              static let xcodeOrange     = Color(red: 1.00, green: 0.68, blue: 0.35)
              static let xcodeRed        = Color(red: 0.90, green: 0.28, blue: 0.32)
              static let xcodeSecondary  = dyn((0.33, 0.47, 0.40), (0.68, 0.82, 0.74))
              static let xcodeDivider    = dyn((0.84, 0.95, 0.89), (0.16, 0.28, 0.22))
              static let storeAccent     = dyn((0.09, 0.66, 0.44), (0.24, 0.83, 0.58))

              // Store surfaces (soft mint paper, light mode only)
              static let storeBg        = dyn((0.94, 0.99, 0.96), (0.04, 0.11, 0.08))
              static let storeCard      = dyn((1.00, 1.00, 1.00), (0.07, 0.16, 0.12))
              static let storeCardAlt   = dyn((0.90, 0.98, 0.93), (0.10, 0.20, 0.15))
              static let storeText      = dyn((0.05, 0.17, 0.11), (0.94, 0.99, 0.96))
              static let storeSub       = dyn((0.33, 0.47, 0.40), (0.68, 0.82, 0.74))
              static let storeDivider   = dyn((0.84, 0.95, 0.89), (0.16, 0.28, 0.22))
          }

          extension UIImage {
              static func bundled(_ filename: String) -> UIImage? {
                  guard let path = Bundle.main.path(forResource: filename, ofType: nil) else { return nil }
                  return UIImage(contentsOfFile: path)
              }
          }
          VIPEOF

      # =========================================================
