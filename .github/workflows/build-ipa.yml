name: 21s Pro Auth App (SwiftUI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "21s Pro"

jobs:
  build:
    runs-on: macos-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          export PATH="/opt/homebrew/opt/zip/bin:$PATH"
          command -v ldid || { echo "❌ ldid not installed"; exit 1; }
          command -v zip || { echo "❌ zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS
      # =========================================================
      - name: Generate app icons
        run: |
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYIEOF'
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size, path):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              for y in range(size):
                  t = y / size
                  r = int(20 * (1-t) + 10 * t)
                  g = int(22 * (1-t) + 12 * t)
                  b = int(35 * (1-t) + 20 * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b, 255))
              margin = int(size * 0.06)
              draw.rounded_rectangle(
                  [margin, margin, size-margin, size-margin],
                  radius=size//5,
                  outline=(60, 130, 240, 255),
                  width=max(2, size//40)
              )
              try:
                  font_size = int(size * 0.38)
                  font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", font_size)
              except:
                  font = ImageFont.load_default()
              text = "21"
              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              x = (size - tw) / 2 - bbox[0]
              y = (size - th) / 2 - bbox[1]
              draw.text((x+2, y+2), text, fill=(0, 0, 0, 100), font=font)
              draw.text((x, y), text, fill=(80, 160, 255, 255), font=font)
              img.save(path, "PNG")

          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYIEOF
          ls -lh Resources

      - name: Generate Info.plist
        run: |
          mkdir -p Resources
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>           <string>en</string>
              <key>CFBundleExecutable</key>                  <string>VIP21Store</string>
              <key>CFBundleIdentifier</key>                  <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key>       <string>6.0</string>
              <key>CFBundleName</key>                        <string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundleDisplayName</key>                 <string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundlePackageType</key>                 <string>APPL</string>
              <key>CFBundleSignature</key>                   <string>????</string>
              <key>CFBundleShortVersionString</key>          <string>1.0</string>
              <key>CFBundleVersion</key>                     <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>LSRequiresIPhoneOS</key>                  <true/>
              <key>MinimumOSVersion</key>                    <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                          <string>AppIcon76x76</string>
                      </array>
                      <key>CFBundleIconName</key>
                      <string>AppIcon</string>
                      <key>UIPrerenderedIcon</key>
                      <false/>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon76x76</string>
                          <string>AppIcon83.5x83.5</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key>
                      <string>AppIcon</string>
                      <key>UIPrerenderedIcon</key>
                      <false/>
                  </dict>
              </dict>
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key>                     <string>LaunchBackground</string>
              </dict>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>          <true/>
              </dict>
          </dict>
          </plist>
          PEOF

      # =========================================================
      # SOURCE CODE
      # =========================================================
      - name: Generate code - Constants.swift
        run: |
          cat > Constants.swift << 'VIPEOF'
          import SwiftUI

          extension Color {
              static let xcodeBackground = Color(red: 0.06, green: 0.07, blue: 0.09)
              static let xcodeBlue       = Color(red: 0.20, green: 0.55, blue: 1.00)
              static let xcodeSecondary  = Color(red: 0.55, green: 0.56, blue: 0.58)
              static let xcodeGreen      = Color(red: 0.25, green: 0.85, blue: 0.45)
              static let xcodeRed        = Color(red: 1.00, green: 0.30, blue: 0.25)
              static let xcodeOrange     = Color(red: 1.00, green: 0.60, blue: 0.20)
              static let xcodeEditor     = Color(red: 0.10, green: 0.11, blue: 0.14)
              static let xcodeDivider    = Color(red: 0.15, green: 0.16, blue: 0.18)
              static let xcodePurple     = Color(red: 0.65, green: 0.35, blue: 0.95)
          }

          struct AppConstants {
              static let userDefaultsKey = "21sProUserData"
          }
          VIPEOF

      - name: Generate code - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func success() {
                  UINotificationFeedbackGenerator().notificationOccurred(.success)
              }
              func error() {
                  UINotificationFeedbackGenerator().notificationOccurred(.error)
              }
          }

          struct XcodeCardModifier: ViewModifier {
              @Environment(\.colorScheme) var scheme
              var radius: CGFloat = 12
              func body(content: Content) -> some View {
                  content
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(scheme == .dark ? Color.xcodeEditor : Color.white)
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(scheme == .dark ? Color.xcodeDivider : Color.gray.opacity(0.2), lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
              }
          }

          struct XcodeButtonStyle: ButtonStyle {
              var color: Color = .xcodeBlue
              var isLoading: Bool = false
              func makeBody(configuration: Configuration) -> some View {
                  configuration.label
                      .foregroundColor(.white)
                      .frame(maxWidth: .infinity)
                      .frame(height: 44)
                      .background(
                          RoundedRectangle(cornerRadius: 10)
                              .fill(color)
                              .opacity(configuration.isPressed ? 0.8 : 1.0)
                      )
                      .scaleEffect(configuration.isPressed ? 0.97 : 1.0)
                      .animation(.easeInOut(duration: 0.15), value: configuration.isPressed)
                      .overlay(
                          Group {
                              if isLoading {
                                  ProgressView()
                                      .progressViewStyle(CircularProgressViewStyle(tint: .white))
                                      .scaleEffect(0.8)
                              }
                          }
                      )
              }
          }

          extension View {
              func xcodeCard(radius: CGFloat = 12) -> some View {
                  modifier(XcodeCardModifier(radius: radius))
              }
          }
          VIPEOF

      - name: Generate code - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import Foundation

          struct AppUser: Codable {
              let id: UUID
              let email: String
              let username: String
              let password: String
              let udid: String
              let createdAt: Date

              init(email: String, username: String, password: String, udid: String) {
                  self.id = UUID()
                  self.email = email
                  self.username = username
                  self.password = password
                  self.udid = udid
                  self.createdAt = Date()
              }
          }
          VIPEOF

      - name: Generate code - AuthManager.swift
        run: |
          cat > AuthManager.swift << 'VIPEOF'
          import SwiftUI
          import Foundation

          @MainActor
          final class AuthManager: ObservableObject {
              @Published var currentUser: AppUser?
              @Published var isAuthenticated: Bool = false
              @Published var isLoading: Bool = false
              @Published var errorMessage: String?

              private let userDefaultsKey = AppConstants.userDefaultsKey

              init() {
                  loadUser()
              }

              func signUp(email: String, username: String, password: String, confirmPassword: String, udid: String) -> Bool {
                  isLoading = true
                  errorMessage = nil

                  // Validation
                  if email.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Email is required"
                      isLoading = false
                      return false
                  }
                  if !email.contains("@") || !email.contains(".") {
                      errorMessage = "Please enter a valid email address"
                      isLoading = false
                      return false
                  }
                  if username.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Username is required"
                      isLoading = false
                      return false
                  }
                  if username.count < 3 {
                      errorMessage = "Username must be at least 3 characters"
                      isLoading = false
                      return false
                  }
                  if password.count < 6 {
                      errorMessage = "Password must be at least 6 characters"
                      isLoading = false
                      return false
                  }
                  if password != confirmPassword {
                      errorMessage = "Passwords do not match"
                      isLoading = false
                      return false
                  }
                  if udid.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Device UDID is required"
                      isLoading = false
                      return false
                  }
                  if udid.count < 20 {
                      errorMessage = "UDID must be at least 20 characters"
                      isLoading = false
                      return false
                  }

                  let existingUsers = loadAllUsers()
                  if existingUsers.contains(where: { $0.email.lowercased() == email.lowercased() }) {
                      errorMessage = "An account with this email already exists"
                      isLoading = false
                      return false
                  }
                  if existingUsers.contains(where: { $0.username.lowercased() == username.lowercased() }) {
                      errorMessage = "This username is already taken"
                      isLoading = false
                      return false
                  }
                  if existingUsers.contains(where: { $0.udid == udid }) {
                      errorMessage = "This UDID is already registered to another account"
                      isLoading = false
                      return false
                  }

                  let newUser = AppUser(email: email, username: username, password: password, udid: udid)
                  var users = loadAllUsers()
                  users.append(newUser)
                  saveAllUsers(users)

                  currentUser = newUser
                  isAuthenticated = true
                  isLoading = false
                  HapticManager.shared.success()
                  return true
              }

              func login(email: String, password: String) -> Bool {
                  isLoading = true
                  errorMessage = nil

                  if email.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Email is required"
                      isLoading = false
                      return false
                  }
                  if password.trimmingCharacters(in: .whitespaces).isEmpty {
                      errorMessage = "Password is required"
                      isLoading = false
                      return false
                  }

                  let users = loadAllUsers()
                  guard let user = users.first(where: { $0.email.lowercased() == email.lowercased() && $0.password == password }) else {
                      errorMessage = "Invalid email or password"
                      isLoading = false
                      return false
                  }

                  currentUser = user
                  isAuthenticated = true
                  isLoading = false
                  HapticManager.shared.success()
                  return true
              }

              func logout() {
                  currentUser = nil
                  isAuthenticated = false
                  UserDefaults.standard.removeObject(forKey: "currentUserID")
              }

              private func loadUser() {
                  guard let savedID = UserDefaults.standard.string(forKey: "currentUserID"),
                        let id = UUID(uuidString: savedID) else { return }
                  let users = loadAllUsers()
                  if let user = users.first(where: { $0.id == id }) {
                      currentUser = user
                      isAuthenticated = true
                  }
              }

              private func loadAllUsers() -> [AppUser] {
                  guard let data = UserDefaults.standard.data(forKey: userDefaultsKey),
                        let users = try? JSONDecoder().decode([AppUser].self, from: data) else {
                      return []
                  }
                  return users
              }

              private func saveAllUsers(_ users: [AppUser]) {
                  if let data = try? JSONEncoder().encode(users) {
                      UserDefaults.standard.set(data, forKey: userDefaultsKey)
                  }
              }

              func getUDIDInfo() -> String {
                  return """
                  ⚠️ Important: Device UDID Information

                  Your UDID is a unique identifier for your iOS device.
                  This is required to ensure your account is linked to your specific device.

                  To find your UDID:
                  1. Connect your iPhone to a computer
                  2. Open Finder (macOS Catalina+) or iTunes (Windows)
                  3. Select your device
                  4. Click on the serial number until you see the UDID
                  5. Copy the UDID string

                  Or use a third-party app like "UDID Calculator" from the App Store.

                  ⚠️ Make sure you enter the correct UDID. This cannot be changed later.
                  """
              }
          }
          VIPEOF

      - name: Generate code - AuthViews.swift
        run: |
          cat > AuthViews.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          struct AuthView: View {
              @StateObject private var authManager = AuthManager()
              @State private var isLoginMode = true
              @State private var email = ""
              @State private var username = ""
              @State private var password = ""
              @State private var confirmPassword = ""
              @State private var udid = ""
              @State private var showUDIDInfo = false
              @State private var isPasswordVisible = false
              @State private var isConfirmPasswordVisible = false
              @Environment(\.colorScheme) var scheme

              var body: some View {
                  Group {
                      if authManager.isAuthenticated {
                          HomeView(authManager: authManager)
                              .transition(.opacity)
                      } else {
                          ZStack {
                              // Background
                              LinearGradient(
                                  colors: scheme == .dark
                                      ? [Color(red: 0.04, green: 0.05, blue: 0.08), Color(red: 0.08, green: 0.10, blue: 0.14)]
                                      : [Color(red: 0.95, green: 0.96, blue: 0.98), Color(red: 0.98, green: 0.99, blue: 1.00)],
                                  startPoint: .topLeading,
                                  endPoint: .bottomTrailing
                              )
                              .edgesIgnoringSafeArea(.all)

                              ScrollView(showsIndicators: false) {
                                  VStack(spacing: 24) {
                                      // Welcome Header
                                      VStack(spacing: 8) {
                                          Text("Welcome")
                                              .font(.system(size: 34, weight: .black))
                                              .foregroundColor(.xcodeBlue)
                                          Text("Here you log in securely")
                                              .font(.system(size: 14))
                                              .foregroundColor(.xcodeSecondary)
                                      }
                                      .padding(.top, 50)

                                      // Card
                                      VStack(spacing: 20) {
                                          // Title
                                          HStack {
                                              Spacer()
                                              VStack(alignment: .trailing, spacing: 2) {
                                                  Text(isLoginMode ? "Log in" : "Sign up")
                                                      .font(.system(size: 22, weight: .bold))
                                                      .foregroundColor(.primary)
                                                  Text(isLoginMode ? "Welcome back" : "Create an account, It's free")
                                                      .font(.system(size: 12))
                                                      .foregroundColor(.xcodeSecondary)
                                              }
                                          }

                                          // Email
                                          VStack(alignment: .trailing, spacing: 6) {
                                              Text("Email")
                                                  .font(.system(size: 13, weight: .medium))
                                                  .foregroundColor(.xcodeSecondary)
                                                  .frame(maxWidth: .infinity, alignment: .trailing)
                                              TextField("your@email.com", text: $email)
                                                  .autocapitalization(.none)
                                                  .keyboardType(.emailAddress)
                                                  .font(.system(size: 14))
                                                  .multilineTextAlignment(.trailing)
                                                  .padding(12)
                                                  .xcodeCard(radius: 10)
                                          }

                                          // Username (Signup only)
                                          if !isLoginMode {
                                              VStack(alignment: .trailing, spacing: 6) {
                                                  Text("Username")
                                                      .font(.system(size: 13, weight: .medium))
                                                      .foregroundColor(.xcodeSecondary)
                                                      .frame(maxWidth: .infinity, alignment: .trailing)
                                                  TextField("Choose a username", text: $username)
                                                      .autocapitalization(.none)
                                                      .font(.system(size: 14))
                                                      .multilineTextAlignment(.trailing)
                                                      .padding(12)
                                                      .xcodeCard(radius: 10)
                                              }
                                          }

                                          // Password
                                          VStack(alignment: .trailing, spacing: 6) {
                                              Text("Password")
                                                  .font(.system(size: 13, weight: .medium))
                                                  .foregroundColor(.xcodeSecondary)
                                                  .frame(maxWidth: .infinity, alignment: .trailing)
                                              HStack {
                                                  Spacer()
                                                  if isPasswordVisible {
                                                      TextField("••••••••", text: $password)
                                                          .font(.system(size: 14))
                                                          .multilineTextAlignment(.trailing)
                                                  } else {
                                                      SecureField("••••••••", text: $password)
                                                          .font(.system(size: 14))
                                                          .multilineTextAlignment(.trailing)
                                                  }
                                                  Button {
                                                      isPasswordVisible.toggle()
                                                  } label: {
                                                      Image(systemName: isPasswordVisible ? "eye.slash.fill" : "eye.fill")
                                                          .font(.system(size: 14))
                                                          .foregroundColor(.xcodeSecondary)
                                                  }
                                              }
                                              .padding(12)
                                              .xcodeCard(radius: 10)
                                          }

                                          // Confirm Password (Signup only)
                                          if !isLoginMode {
                                              VStack(alignment: .trailing, spacing: 6) {
                                                  Text("Confirm Password")
                                                      .font(.system(size: 13, weight: .medium))
                                                      .foregroundColor(.xcodeSecondary)
                                                      .frame(maxWidth: .infinity, alignment: .trailing)
                                                  HStack {
                                                      Spacer()
                                                      if isConfirmPasswordVisible {
                                                          TextField("••••••••", text: $confirmPassword)
                                                              .font(.system(size: 14))
                                                              .multilineTextAlignment(.trailing)
                                                      } else {
                                                          SecureField("••••••••", text: $confirmPassword)
                                                              .font(.system(size: 14))
                                                              .multilineTextAlignment(.trailing)
                                                      }
                                                      Button {
                                                          isConfirmPasswordVisible.toggle()
                                                      } label: {
                                                          Image(systemName: isConfirmPasswordVisible ? "eye.slash.fill" : "eye.fill")
                                                              .font(.system(size: 14))
                                                              .foregroundColor(.xcodeSecondary)
                                                      }
                                                  }
                                                  .padding(12)
                                                  .xcodeCard(radius: 10)
                                              }
                                          }

                                          // UDID (Signup only)
                                          if !isLoginMode {
                                              VStack(alignment: .trailing, spacing: 6) {
                                                  HStack {
                                                      Button {
                                                          showUDIDInfo = true
                                                      } label: {
                                                          Image(systemName: "info.circle.fill")
                                                              .font(.system(size: 14))
                                                              .foregroundColor(.xcodeOrange)
                                                      }
                                                      Spacer()
                                                      Text("Device UDID")
                                                          .font(.system(size: 13, weight: .medium))
                                                          .foregroundColor(.xcodeSecondary)
                                                  }
                                                  .frame(maxWidth: .infinity, alignment: .trailing)
                                                  TextField("Enter your device UDID", text: $udid)
                                                      .autocapitalization(.allCharacters)
                                                      .font(.system(size: 13, weight: .medium))
                                                      .multilineTextAlignment(.trailing)
                                                      .padding(12)
                                                      .xcodeCard(radius: 10)
                                                      .overlay(
                                                          RoundedRectangle(cornerRadius: 10)
                                                              .stroke(udid.count > 0 && udid.count < 20 ? Color.xcodeOrange.opacity(0.5) : Color.clear, lineWidth: 1.5)
                                                      )
                                                  if udid.count > 0 && udid.count < 20 {
                                                      Text("⚠️ UDID should be at least 20 characters")
                                                          .font(.system(size: 10))
                                                          .foregroundColor(.xcodeOrange)
                                                          .frame(maxWidth: .infinity, alignment: .trailing)
                                                  }
                                              }
                                          }

                                          // Error message
                                          if let error = authManager.errorMessage {
                                              HStack {
                                                  Image(systemName: "exclamationmark.triangle.fill")
                                                      .foregroundColor(.xcodeRed)
                                                      .font(.system(size: 12))
                                                  Text(error)
                                                      .font(.system(size: 12))
                                                      .foregroundColor(.xcodeRed)
                                                  Spacer()
                                              }
                                              .padding(.horizontal, 4)
                                          }

                                          // Action Buttons
                                          VStack(spacing: 12) {
                                              Button {
                                                  HapticManager.shared.impact(.medium)
                                                  if isLoginMode {
                                                      _ = authManager.login(email: email, password: password)
                                                  } else {
                                                      _ = authManager.signUp(
                                                          email: email,
                                                          username: username,
                                                          password: password,
                                                          confirmPassword: confirmPassword,
                                                          udid: udid
                                                      )
                                                  }
                                              } label: {
                                                  Text(isLoginMode ? "Log in" : "Sign Up")
                                                      .font(.system(size: 16, weight: .semibold))
                                              }
                                              .buttonStyle(XcodeButtonStyle(isLoading: authManager.isLoading))
                                              .disabled(authManager.isLoading)

                                              Button {
                                                  HapticManager.shared.selection()
                                                  withAnimation(.spring()) {
                                                      isLoginMode.toggle()
                                                      email = ""
                                                      username = ""
                                                      password = ""
                                                      confirmPassword = ""
                                                      udid = ""
                                                      authManager.errorMessage = nil
                                                  }
                                              } label: {
                                                  HStack(spacing: 4) {
                                                      Text(isLoginMode ? "Don't have an account?" : "Already have an account?")
                                                          .font(.system(size: 13))
                                                          .foregroundColor(.xcodeSecondary)
                                                      Text(isLoginMode ? "Sign Up" : "Log In")
                                                          .font(.system(size: 13, weight: .bold))
                                                          .foregroundColor(.xcodeBlue)
                                                  }
                                              }
                                          }
                                      }
                                      .padding(24)
                                      .xcodeCard(radius: 20)
                                      .shadow(color: .black.opacity(scheme == .dark ? 0.3 : 0.05), radius: 20, x: 0, y: 8)
                                      .padding(.horizontal, 20)

                                      // Footer
                                      Text("Secure • Private • 21s Pro")
                                          .font(.system(size: 11))
                                          .foregroundColor(.xcodeSecondary.opacity(0.6))
                                          .padding(.top, 8)
                                  }
                                  .padding(.bottom, 40)
                              }
                          }
                          .sheet(isPresented: $showUDIDInfo) {
                              UDIDInfoView()
                          }
                          .preferredColorScheme(.dark)
                      }
                  }
                  .animation(.easeInOut(duration: 0.3), value: authManager.isAuthenticated)
              }
          }

          struct UDIDInfoView: View {
              @Environment(\.dismiss) var dismiss
              var body: some View {
                  NavigationView {
                      ScrollView {
                          VStack(alignment: .trailing, spacing: 16) {
                              Image(systemName: "iphone.gen3")
                                  .font(.system(size: 60))
                                  .foregroundColor(.xcodeBlue)
                                  .frame(maxWidth: .infinity, alignment: .center)

                              Text("What is UDID?")
                                  .font(.system(size: 22, weight: .black))
                                  .frame(maxWidth: .infinity, alignment: .center)

                              Text("""
                              UDID stands for Unique Device Identifier. It is a 40-character hexadecimal string that uniquely identifies your iOS device.

                              ⚠️ **IMPORTANT:** You must enter your device's official UDID. This cannot be changed after registration.

                              **How to find your UDID:**

                              1. Connect your iPhone/iPad to a computer
                              2. Open **Finder** (macOS Catalina+) or **iTunes** (Windows)
                              3. Select your device
                              4. Click on the serial number until it changes to UDID
                              5. Copy the 40-character UDID string

                              **Alternative method:**
                              - Use a third-party app like "UDID Calculator" from the App Store
                              - Or use online services like https://udid.io

                              ⚠️ Entering the wrong UDID will cause issues with app installation and signing.
                              """)
                              .font(.system(size: 14))
                              .multilineTextAlignment(.trailing)

                              Text("Example UDID: \("A".randomElement() ?? "X")\(String(repeating: "X", count: 39))")
                                  .font(.system(size: 12, weight: .medium))
                                  .foregroundColor(.xcodeSecondary)
                                  .frame(maxWidth: .infinity, alignment: .center)
                                  .padding()
                                  .background(RoundedRectangle(cornerRadius: 10).fill(Color.xcodeBlue.opacity(0.08)))
                                  .overlay(RoundedRectangle(cornerRadius: 10).stroke(Color.xcodeBlue.opacity(0.2), lineWidth: 0.5))

                              Spacer()
                          }
                          .padding(20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("Done") { dismiss() }
                                  .foregroundColor(.xcodeBlue)
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
              }
          }

          struct HomeView: View {
              @ObservedObject var authManager: AuthManager
              @State private var showLogoutAlert = false

              var body: some View {
                  NavigationView {
                      VStack(spacing: 30) {
                          Spacer()

                          Image(systemName: "checkmark.seal.fill")
                              .font(.system(size: 80))
                              .foregroundColor(.xcodeGreen)

                          Text("Welcome, \(authManager.currentUser?.username ?? "User")!")
                              .font(.system(size: 28, weight: .bold))

                          VStack(alignment: .leading, spacing: 8) {
                              InfoRow(label: "Email", value: authManager.currentUser?.email ?? "")
                              InfoRow(label: "UDID", value: authManager.currentUser?.udid ?? "")
                              InfoRow(label: "Joined", value: formatDate(authManager.currentUser?.createdAt))
                          }
                          .padding()
                          .xcodeCard(radius: 14)
                          .padding(.horizontal)

                          Button {
                              showLogoutAlert = true
                          } label: {
                              Text("Log Out")
                                  .font(.system(size: 16, weight: .semibold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 50)
                                  .background(
                                      RoundedRectangle(cornerRadius: 12)
                                          .fill(Color.xcodeRed)
                                  )
                          }
                          .padding(.horizontal, 40)
                          .alert("Log Out", isPresented: $showLogoutAlert) {
                              Button("Cancel", role: .cancel) { }
                              Button("Log Out", role: .destructive) {
                                  authManager.logout()
                              }
                          } message: {
                              Text("Are you sure you want to log out?")
                          }

                          Spacer()
                      }
                      .padding()
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              Text("21s Pro")
                                  .font(.system(size: 18, weight: .bold))
                                  .foregroundColor(.xcodeBlue)
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
              }

              private func formatDate(_ date: Date?) -> String {
                  guard let date = date else { return "—" }
                  let formatter = DateFormatter()
                  formatter.dateStyle = .medium
                  formatter.timeStyle = .short
                  return formatter.string(from: date)
              }
          }

          struct InfoRow: View {
              let label: String
              let value: String

              var body: some View {
                  HStack {
                      Text(label)
                          .font(.system(size: 12, weight: .medium))
                          .foregroundColor(.xcodeSecondary)
                      Spacer()
                      Text(value)
                          .font(.system(size: 13, weight: .semibold))
                          .multilineTextAlignment(.trailing)
                          .lineLimit(2)
                  }
                  Divider()
              }
          }
          VIPEOF

      - name: Generate code - VIP21StoreApp.swift
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import UserNotifications

          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate

              var body: some Scene {
                  WindowGroup {
                      AuthView()
                          .onAppear {
                              requestNotifications()
                          }
                  }
              }

              func requestNotifications() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }
          }

          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  return true
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           willPresent notification: UNNotification,
                                           withCompletionHandler handler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  handler([.banner, .sound, .badge])
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           didReceive response: UNNotificationResponse,
                                           withCompletionHandler handler: @escaping () -> Void) {
                  handler()
              }
          }
          VIPEOF

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            AuthManager.swift \
            AuthViews.swift \
            VIP21StoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework UserNotifications \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA package
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon60x60@3x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA size: $(du -sh artifacts/21s.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/21s.ipa | head -20
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "✅ IPA is valid."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Pro-Auth-Only
          path: artifacts/21s.ipa
