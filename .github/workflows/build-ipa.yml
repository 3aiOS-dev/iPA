                            AsyncImage(url: url, transaction: Transaction(animation: .easeInOut)) { phase in
                                content(phase)
                            }
                        }
                    }

                    // MARK: - Document Picker (UIKit wrapper — لاختيار ملفات iOS)
                    struct DocumentPicker: UIViewControllerRepresentable {
                        let contentTypes: [UTType]
                        let onPick: (URL) -> Void
                        let onCancel: () -> Void

                        func makeCoordinator() -> Coordinator { Coordinator(self) }

                        func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                            let picker = UIDocumentPickerViewController(forOpeningContentTypes: contentTypes, asCopy: true)
                            picker.allowsMultipleSelection = false
                            picker.delegate = context.coordinator
                            return picker
                        }

                        func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}

                        final class Coordinator: NSObject, UIDocumentPickerDelegate {
                            let parent: DocumentPicker
                            init(_ parent: DocumentPicker) { self.parent = parent }
                            func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                                guard let url = urls.first else { parent.onCancel(); return }
                                let accessed = url.startAccessingSecurityScopedResource()
                                defer { if accessed { url.stopAccessingSecurityScopedResource() } }
                                parent.onPick(url)
                            }
                            func documentPickerWasCancelled(_ controller: UIDocumentPickerViewController) {
                                parent.onCancel()
                            }
                        }
                    }

                    // MARK: - Data Picker (يقرأ Data من ملف)
                    struct DataDocumentPicker: UIViewControllerRepresentable {
                        let contentTypes: [UTType]
                        let onPick: (Data, String) -> Void
                        let onCancel: () -> Void

                        func makeCoordinator() -> Coordinator { Coordinator(self) }

                        func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                            let picker = UIDocumentPickerViewController(forOpeningContentTypes: contentTypes, asCopy: true)
                            picker.allowsMultipleSelection = false
                            picker.delegate = context.coordinator
                            return picker
                        }

                        func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}

                        final class Coordinator: NSObject, UIDocumentPickerDelegate {
                            let parent: DataDocumentPicker
                            init(_ parent: DataDocumentPicker) { self.parent = parent }
                            func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                                guard let url = urls.first else { parent.onCancel(); return }
                                let accessed = url.startAccessingSecurityScopedResource()
                                defer { if accessed { url.stopAccessingSecurityScopedResource() } }
                                do {
                                    let data = try Data(contentsOf: url)
                                    parent.onPick(data, url.lastPathComponent)
                                } catch {
                                    parent.onCancel()
                                }
                            }
                            func documentPickerWasCancelled(_ controller: UIDocumentPickerViewController) {
                                parent.onCancel()
                            }
                        }
                    }

                    // MARK: - Image Picker
                    struct ImagePicker: UIViewControllerRepresentable {
                        let onPick: (UIImage) -> Void
                        let onCancel: () -> Void
                        func makeCoordinator() -> Coordinator { Coordinator(self) }
                        func makeUIViewController(context: Context) -> UIImagePickerController {
                            let pc = UIImagePickerController()
                            pc.sourceType = .photoLibrary
                            pc.delegate = context.coordinator
                            return pc
                        }
                        func updateUIViewController(_ uiViewController: UIImagePickerController, context: Context) {}
                        final class Coordinator: NSObject, UIImagePickerControllerDelegate, UINavigationControllerDelegate {
                            let parent: ImagePicker
                            init(_ parent: ImagePicker) { self.parent = parent }
                            func imagePickerController(_ picker: UIImagePickerController,
                                                       didFinishPickingMediaWithInfo info: [UIImagePickerController.InfoKey: Any]) {
                                if let img = info[.originalImage] as? UIImage { parent.onPick(img) }
                                else { parent.onCancel() }
                            }
                            func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {
                                parent.onCancel()
                            }
                        }
                    }

                    // MARK: - Reusable Buttons & Badges
                    struct GradientButton: View {
                        let title: String
                        let icon: String
                        let gradient: [Color]
                        let action: () -> Void
                        var body: some View {
                            Button(action: action) {
                                HStack(spacing: 6) {
                                    Image(systemName: icon)
                                    Text(title).font(.system(size: 14, weight: .bold))
                                }
                                .foregroundColor(.white)
                                .padding(.horizontal, 18).padding(.vertical, 11)
                                .background(LinearGradient(colors: gradient, startPoint: .topLeading, endPoint: .bottomTrailing))
                                .clipShape(Capsule())
