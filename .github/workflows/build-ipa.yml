      - name: Generate code - HapticManager.swift
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          @preconcurrency import UserNotifications

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  UINotificationFeedbackGenerator().notificationOccurred(type)
              }
              func selection() { UISelectionFeedbackGenerator().selectionChanged() }
              func success() { notification(.success) }
              func error() { notification(.error) }
          }

          struct XcodeCardModifier: ViewModifier {
              var radius: CGFloat = 12
              func body(content: Content) -> some View {
                  content
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(Color.xcodeEditor)
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(Color.xcodeDivider, lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
              }
          }

          extension View {
              func xcodeCard(radius: CGFloat = 12) -> some View {
                  modifier(XcodeCardModifier(radius: radius))
              }
          }

          final class NotificationManager: ObservableObject {
              static let shared = NotificationManager()
              @Published private(set) var permissionGranted: Bool = false

              private init() {}

              nonisolated func requestPermissionIfNeeded() {
                  let center = UNUserNotificationCenter.current()
                  center.getNotificationSettings { settings in
                      switch settings.authorizationStatus {
                      case .notDetermined:
                          center.requestAuthorization(options: [.alert, .badge, .sound]) { granted, _ in
                              DispatchQueue.main.async {
                                  NotificationManager.shared.permissionGranted = granted
                              }
                          }
                      case .authorized, .provisional, .ephemeral:
                          DispatchQueue.main.async { NotificationManager.shared.permissionGranted = true }
                      default:
                          DispatchQueue.main.async { NotificationManager.shared.permissionGranted = false }
                      }
                  }
              }

              nonisolated fileprivate func post(id: String, title: String, body: String, userInfo: [AnyHashable: Any] = [:]) {
                  let content = UNMutableNotificationContent()
                  content.title = title
                  content.body  = body
                  content.sound = .default
                  if !userInfo.isEmpty { content.userInfo = userInfo }
                  let req = UNNotificationRequest(identifier: id, content: content, trigger: nil)
                  UNUserNotificationCenter.current().add(req) { _ in }
              }

              nonisolated func notifyDownloadStarted(appName: String, appId: Int) {
                  post(
                      id: "dl-start-\(appId)",
                      title: "Downloading...",
                      body: "\(appName) - your download has started."
                  )
              }

              nonisolated func notifyDownloadCompleted(appName: String, appId: Int) {
                  post(
                      id: "dl-done-\(appId)",
                      title: "Download complete",
                      body: "\(appName) finished downloading. Open Files to install."
                  )
              }

              nonisolated func notifyScreenshotThanks() {
                  post(
                      id: "shot-thanks-\(Int(Date().timeIntervalSince1970))",
                      title: "Thanks for the screenshot!",
                      body: "Share it with your friends to help us grow 🚀"
                  )
              }
          }

          final class ScreenCaptureService: ObservableObject {
              static let shared = ScreenCaptureService()

              @Published var lastScreenshot: UIImage? = nil
              @Published var showThanksOverlay: Bool = false

              private var observer: NSObjectProtocol?

              private init() {}

              func start() {
                  guard observer == nil else { return }
                  observer = NotificationCenter.default.addObserver(
                      forName: UIApplication.userDidTakeScreenshotNotification,
                      object: nil,
                      queue: .main
                  ) { [weak self] _ in
                      guard let self = self else { return }
                      self.lastScreenshot = self.loadLatestScreenshotFromPhotos()
                      self.showThanksOverlay = true
                      HapticManager.shared.success()
                      NotificationManager.shared.notifyScreenshotThanks()
                  }
              }

              func stop() {
                  if let obs = observer {
                      NotificationCenter.default.removeObserver(obs)
                      observer = nil
                  }
              }

              func dismissOverlay() {
                  showThanksOverlay = false
              }

              private func loadLatestScreenshotFromPhotos() -> UIImage? {
                  return nil
              }
          }
          VIPEOF

      # =========================================================
      # SOURCE CODE - Models.swift (remove UDID)
      # =========================================================
      - name: Generate code - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import Foundation

          struct AppUser: Codable {
              let id: UUID
              let phoneNumber: String
              let username: String
              let password: String
              // UDID removed
              let createdAt: Date

              init(phoneNumber: String, username: String, password: String) {
                  self.id = UUID()
                  self.phoneNumber = phoneNumber
                  self.username = username
                  self.password = password
                  self.createdAt = Date()
              }
          }

          // ==================== Remote Store API models ====================
          struct StoreAPIResponse: Codable {
              let lastUpdated: String?
              let apps: [StoreAPIApp]

              enum CodingKeys: String, CodingKey {
                  case lastUpdated = "last_updated"
                  case apps
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.lastUpdated = try? c.decode(String.self, forKey: .lastUpdated)
                  if let arr = try? c.decode([StoreAPIApp].self, forKey: .apps) {
                      self.apps = arr
                      return
                  }
                  struct Envelope: Codable {
                      let success: Bool?
                      let count: Int?
                      let apps: [StoreAPIApp]
                  }
                  if let env = try? c.decode(Envelope.self, forKey: .apps) {
                      self.apps = env.apps
                      return
                  }
                  if let one = try? c.decode(StoreAPIApp.self, forKey: .apps) {
                      self.apps = [one]
                      return
                  }
                  self.apps = []
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encodeIfPresent(lastUpdated, forKey: .lastUpdated)
                  try c.encode(apps, forKey: .apps)
              }
          }

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let bundleVersion: String?
              let ipaSize: String?
              let githubUrl: String?
              let archiveUrl: String?
              let ipaUrl: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let createdAt: String?
              let updatedAt: String?

              let downloadURL: String?
              let down: String?
              let iconURL: String?
              let localizedDescription: String?
              let developerName: String?
              let version: String?
              let versionDate: String?
              let fullDate: String?
              let size: Double?
              let type: Int?

              enum CodingKeys: String, CodingKey {
                  case id, name
                  case bundleId = "bundle_id"
                  case bundleIdAlt = "bundleID"
                  case bundleIdentifier
                  case bundleVersion = "bundle_version"
                  case ipaSize = "ipa_size"
                  case githubUrl = "github_url"
                  case archiveUrl = "archive_url"
                  case ipaUrl = "ipa_url"
                  case host
                  case icon
                  case iconURL
                  case description
                  case localizedDescription
                  case screenshots, category
                  case createdAt = "created_at"
                  case updatedAt = "updated_at"
                  case downloadURL
                  case down
                  case developerName
                  case version
                  case versionDate
                  case fullDate
                  case size, type
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  if let intId = try? c.decode(Int.self, forKey: .id) {
                      self.id = intId
                  } else {
                      let bundle = (try? c.decode(String.self, forKey: .bundleIdAlt))
                          ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                          ?? UUID().uuidString
                      self.id = abs(bundle.hashValue)
                  }
                  self.name = (try? c.decode(String.self, forKey: .name)) ?? "Untitled"
                  self.bundleId = (try? c.decode(String.self, forKey: .bundleId))
                      ?? (try? c.decode(String.self, forKey: .bundleIdAlt))
                      ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                  self.bundleVersion = (try? c.decode(String.self, forKey: .bundleVersion))
                      ?? (try? c.decode(String.self, forKey: .version))
                  self.ipaSize = (try? c.decode(String.self, forKey: .ipaSize))
                  self.githubUrl = (try? c.decode(String.self, forKey: .githubUrl))
                  self.archiveUrl = (try? c.decode(String.self, forKey: .archiveUrl))
                  self.ipaUrl = (try? c.decode(String.self, forKey: .ipaUrl))
                      ?? (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.host = (try? c.decode(String.self, forKey: .host))
                  self.icon = (try? c.decode(String.self, forKey: .icon))
                      ?? (try? c.decode(String.self, forKey: .iconURL))
                  self.description = (try? c.decode(String.self, forKey: .description))
                      ?? (try? c.decode(String.self, forKey: .localizedDescription))
                  self.screenshots = try? c.decode([String].self, forKey: .screenshots)
                  self.category = (try? c.decode(String.self, forKey: .category))
                  self.createdAt = (try? c.decode(String.self, forKey: .createdAt))
                  self.updatedAt = (try? c.decode(String.self, forKey: .updatedAt))
                      ?? (try? c.decode(String.self, forKey: .versionDate))
                      ?? (try? c.decode(String.self, forKey: .fullDate))
                  self.downloadURL = (try? c.decode(String.self, forKey: .downloadURL))
                      ?? (try? c.decode(String.self, forKey: .down))
                  self.down = (try? c.decode(String.self, forKey: .down))
                  self.iconURL = (try? c.decode(String.self, forKey: .iconURL))
                  self.localizedDescription = (try? c.decode(String.self, forKey: .localizedDescription))
                  self.developerName = (try? c.decode(String.self, forKey: .developerName))
                  self.version = (try? c.decode(String.self, forKey: .version))
                  self.versionDate = (try? c.decode(String.self, forKey: .versionDate))
                  self.fullDate = (try? c.decode(String.self, forKey: .fullDate))
                  self.size = (try? c.decode(Double.self, forKey: .size))
                  self.type = (try? c.decode(Int.self, forKey: .type))
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encode(id, forKey: .id)
                  try c.encode(name, forKey: .name)
                  try c.encodeIfPresent(bundleId, forKey: .bundleId)
                  try c.encodeIfPresent(bundleVersion, forKey: .bundleVersion)
                  try c.encodeIfPresent(ipaSize, forKey: .ipaSize)
                  try c.encodeIfPresent(githubUrl, forKey: .githubUrl)
                  try c.encodeIfPresent(archiveUrl, forKey: .archiveUrl)
                  try c.encodeIfPresent(ipaUrl, forKey: .ipaUrl)
                  try c.encodeIfPresent(host, forKey: .host)
                  try c.encodeIfPresent(icon, forKey: .icon)
                  try c.encodeIfPresent(description, forKey: .description)
                  try c.encodeIfPresent(screenshots, forKey: .screenshots)
                  try c.encodeIfPresent(category, forKey: .category)
                  try c.encodeIfPresent(createdAt, forKey: .createdAt)
                  try c.encodeIfPresent(updatedAt, forKey: .updatedAt)
              }

              var cleanSize: String {
                  if let s = size, s > 0 {
                      let f = ByteCountFormatter()
                      f.allowedUnits = [.useMB, .useGB, .useKB]
                      f.countStyle = .file
                      return f.string(fromByteCount: Int64(s))
                  }
                  if let s = ipaSize, !s.isEmpty { return s }
                  return "-"
              }

              var cleanDescription: String {
                  let raw = description ?? localizedDescription ?? ""
                  if raw.isEmpty {
                      return "Exclusive app on 21s Store - download the premium version with all features enabled."
                  }
                  let lines = raw.split(whereSeparator: { $0.isNewline || $0 == "\r" })
                  return lines.joined(separator: " ").trimmingCharacters(in: .whitespacesAndNewlines)
              }

              var resolvedDownloadURL: String? {
                  return ipaUrl ?? downloadURL ?? down ?? githubUrl ?? archiveUrl
              }
          }

          // ==================== Download Repositories ====================
          struct DownloadRepository: Codable, Identifiable, Hashable {
              let id: String
              let name: String
              let feedURL: String
              let homepage: String
              let enabled: Bool
              let maxGB: Double

              init(id: String, name: String, feedURL: String, homepage: String, enabled: Bool = true, maxGB: Double = 250) {
                  self.id = id
                  self.name = name
                  self.feedURL = feedURL
                  self.homepage = homepage
                  self.enabled = enabled
                  self.maxGB = maxGB
              }
          }

          struct DownloadQuota: Codable, Identifiable, Hashable {
              let id: String
              let totalBytes: Int64
              let usedBytes: Int64
              var freeBytes: Int64 { max(0, totalBytes - usedBytes) }
              var freeGB: Double { Double(freeBytes) / 1_073_741_824.0 }
              var usedGB: Double { Double(usedBytes) / 1_073_741_824.0 }
              var totalGB: Double { Double(totalBytes) / 1_073_741_824.0 }
          }
          VIPEOF

