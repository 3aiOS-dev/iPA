      - name: Generate code - StatusScreens.swift
        run: |
          cat > StatusScreens.swift << 'VIPEOF'
          import SwiftUI

          struct GifOnlyView: UIViewRepresentable {
              let resourceName: String
              let ext: String
              func makeUIView(context: Context) -> UIView {
                  let v = UIView()
                  let iv = UIImageView()
                  iv.contentMode = .scaleAspectFill
                  iv.clipsToBounds = true
                  iv.translatesAutoresizingMaskIntoConstraints = false
                  v.addSubview(iv)
                  NSLayoutConstraint.activate([
                      iv.topAnchor.constraint(equalTo: v.topAnchor),
                      iv.bottomAnchor.constraint(equalTo: v.bottomAnchor),
                      iv.leadingAnchor.constraint(equalTo: v.leadingAnchor),
                      iv.trailingAnchor.constraint(equalTo: v.trailingAnchor)
                  ])
                  if let url = Bundle.main.url(forResource: resourceName, withExtension: ext),
                     let data = try? Data(contentsOf: url),
                     let img = UIImage.gif(data: data) {
                      iv.image = img
                  }
                  return v
              }
              func updateUIView(_ uiView: UIView, context: Context) {}
          }

          extension UIImage {
              static func gif(data: Data) -> UIImage? {
                  guard let src = CGImageSourceCreateWithData(data as CFData, nil) else { return nil }
                  let count = CGImageSourceGetCount(src)
                  var imgs: [UIImage] = []
                  var duration: TimeInterval = 0
                  for i in 0..<count {
                      if let cg = CGImageSourceCreateImageAtIndex(src, i, nil) {
                          imgs.append(UIImage(cgImage: cg))
                      }
                      if let props = CGImageSourceCopyPropertiesAtIndex(src, i, nil) as? [CFString: Any],
                         let d = props[kCGImagePropertyGIFDictionary] as? [CFString: Any],
                         let dt = d[kCGImagePropertyGIFDelayTime] as? Double {
                          duration += dt
                      }
                  }
                  if imgs.isEmpty { return nil }
                  return UIImage.animatedImage(with: imgs, duration: duration > 0 ? duration : Double(count) * 0.1)
              }
          }
          VIPEOF

