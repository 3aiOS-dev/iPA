          // MARK: - Comments Store
          @MainActor
          final class CommentsStore: ObservableObject {
              @Published var comments: [StoreComment] = []
              @Published var isLoading = false
              @Published var isSending = false

              func load(appId: Int) {
                  let urlString = "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app/api/public/store/comments?app=\(appId)"
                  guard let url = URL(string: urlString) else { return }
                  isLoading = true
                  URLSession.shared.dataTask(with: URLRequest(url: url, timeoutInterval: 25)) { data, _, _ in
                      var list: [StoreComment] = []
                      if let data = data,
                         let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let arr = json["comments"] as? [[String: Any]] {
                          list = arr.compactMap { dict in
                              guard let id = dict["id"] as? String,
                                    let author = dict["author"] as? String,
                                    let body = dict["body"] as? String else { return nil }
                              return StoreComment(id: id, author: author, body: body,
                                                  reply: dict["reply"] as? String,
                                                  created_at: dict["created_at"] as? String)
                          }
                      }
                      DispatchQueue.main.async {
                          self.comments = list
                          self.isLoading = false
                      }
                  }.resume()
              }

              func send(appId: Int, text: String, done: @escaping (Bool) -> Void) {
                  guard let url = URL(string: "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app/api/public/store/comments") else { done(false); return }
                  isSending = true
                  var req = URLRequest(url: url, timeoutInterval: 25)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: [
                      "app_id": appId,
                      "body": text
                  ])
                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      var ok = false
                      if let data = data,
                         let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                          ok = (obj["ok"] as? Bool) == true
                      }
                      DispatchQueue.main.async {
                          self.isSending = false
                          if ok { self.load(appId: appId) }
                          done(ok)
                      }
                  }.resume()
              }
          }

