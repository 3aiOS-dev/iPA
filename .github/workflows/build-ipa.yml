          func colorForCategory(_ category: String?) -> Color {
              guard let c = category?.lowercased() else { return .storePrimary }
              if c.contains("photo") || c.contains("camera") { return .storePink }
              if c.contains("music") { return Color(red: 0.11, green: 0.72, blue: 0.36) }
              if c.contains("video") || c.contains("stream") { return .storePink }
              if c.contains("social") || c.contains("messag") { return .storeCyan }
              if c.contains("tool") || c.contains("util") { return .storeYellow }
              if c.contains("game") { return .storePrimary }
              if c.contains("book") || c.contains("edu") { return .betaOrange }
              if c.contains("shop") { return .storePink }
              return .storePrimary
          }

          // ================= View Model =================
          @MainActor
          final class StoreFeed: ObservableObject {
              @Published var apps: [StoreAPIApp] = []
              @Published var isLoading: Bool = false
              @Published var lastError: String?
              @Published var lastUpdated: String?
              @Published var totalAvailable: Int = 0

              private let cacheURL: URL = {
                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  return caches.appendingPathComponent("apptesters-feed-v2.json")
              }()

              private let repos = RepositoriesStore.shared
              private let pageSize = AppConstants.feedPageSize

              /// Snapshot of every known app id -> version
              private let catalogKey = "store_catalog_snapshot_v1"
              private var catalogSnapshot: [String: String] =
                  (UserDefaults.standard.dictionary(forKey: "store_catalog_snapshot_v1") as? [String: String]) ?? [:]

              private let firstSeenKey = "store_catalog_first_seen_v1"
              private var firstSeen: [String: Date] =
                  (UserDefaults.standard.dictionary(forKey: "store_catalog_first_seen_v1") as? [String: Double])?
                      .mapValues { Date(timeIntervalSince1970: $0) } ?? [:]

              @Published private(set) var recentApps: [StoreAPIApp] = []

              init() { loadCachedThenRefresh() }

              private func snapshotVersion(_ app: StoreAPIApp) -> String {
                  app.version ?? app.bundleVersion ?? app.versionDate ?? app.updatedAt ?? ""
              }

              private func publishedDate(for app: StoreAPIApp) -> Date? {
                  let raw = app.createdAt ?? app.updatedAt ?? app.versionDate ?? app.fullDate
                  if let raw, let d = ActivationManager.parseDate(raw) { return d }
                  return firstSeen["\(app.id)"]
              }

              func isRecent(_ app: StoreAPIApp, now: Date = Date()) -> Bool {
                  guard let d = publishedDate(for: app) else { return false }
                  return now.timeIntervalSince(d) <= 24 * 60 * 60
              }

              var recentCount: Int { recentApps.count }

              private func rebuildRecentApps(from incoming: [StoreAPIApp]) {
                  let now = Date()
                  let cutoff = now.addingTimeInterval(-24 * 60 * 60)
                  var updatedFirstSeen = firstSeen
                  var recent: [StoreAPIApp] = []
                  for app in incoming {
                      let key = "\(app.id)"
                      let date: Date = {
                          if let raw = app.createdAt ?? app.updatedAt ?? app.versionDate ?? app.fullDate,
                             let parsed = ActivationManager.parseDate(raw) { return parsed }
                          if let existing = updatedFirstSeen[key] { return existing }
                          let now2 = Date()
                          updatedFirstSeen[key] = now2
                          return now2
                      }()
                      if date >= cutoff { recent.append(app) }
                  }
                  self.firstSeen = updatedFirstSeen
                  if let data = try? JSONEncoder().encode(
                      updatedFirstSeen.mapValues { $0.timeIntervalSince1970 }) {
                      UserDefaults.standard.set(data, forKey: firstSeenKey)
                  }
                  self.recentApps = recent.sorted { (a, b) in
                      let da = publishedDate(for: a) ?? .distantPast
                      let db = publishedDate(for: b) ?? .distantPast
                      return da > db
                  }
              }

              private func announceCatalogChanges(_ incoming: [StoreAPIApp]) {
                  var next: [String: String] = [:]
                  for app in incoming { next["\(app.id)"] = snapshotVersion(app) }

                  let isFirstRun = catalogSnapshot.isEmpty
                  if !isFirstRun {
                      var events: [(StoreAPIApp, Bool)] = []
                      for app in incoming {
                          let key = "\(app.id)"
                          guard let previous = catalogSnapshot[key] else {
                              events.append((app, false))
                              continue
                          }
                          if previous != next[key] { events.append((app, true)) }
                      }
                      for (app, isUpdate) in events.prefix(8) {
                          NotificationsManager.shared.pushAppEvent(
                              name: app.name,
                              iconURL: app.iconURL ?? app.icon,
                              version: snapshotVersion(app),
                              isUpdate: isUpdate
                          )
                      }
                  } else {
                      let now = Date()
                      let cutoff = now.addingTimeInterval(-24 * 60 * 60)
                      for app in incoming.prefix(8) {
                          if let raw = app.createdAt ?? app.updatedAt ?? app.versionDate ?? app.fullDate,
                             let d = ActivationManager.parseDate(raw), d >= cutoff {
                              NotificationsManager.shared.pushAppEvent(
                                  name: app.name,
                                  iconURL: app.iconURL ?? app.icon,
                                  version: snapshotVersion(app),
                                  isUpdate: false
                              )
                          }
                      }
                  }

                  catalogSnapshot = next
                  UserDefaults.standard.set(next, forKey: catalogKey)
                  rebuildRecentApps(from: incoming)
              }

              func loadCachedThenRefresh() {
                  if let data = try? Data(contentsOf: cacheURL),
                     let parsed = try? JSONDecoder().decode(StoreAPIResponse.self, from: data) {
                      self.apps = parsed.apps
                      self.lastUpdated = parsed.lastUpdated
                      self.totalAvailable = parsed.apps.count
                      repos.updateTotalApps(parsed.apps.count)
                  }
                  Task { await refresh() }
              }

              func refresh() async {
                  isLoading = true
                  lastError = nil
                  do {
                      let merged = try await fetchMergedFromAllRepos()
                      announceCatalogChanges(merged.apps)
                      self.apps = merged.apps
                      self.lastUpdated = merged.lastUpdated
                      self.totalAvailable = merged.apps.count
                      repos.updateTotalApps(merged.apps.count)
                      if let data = try? JSONEncoder().encode(merged) {
                          try? data.write(to: cacheURL)
                      }
                  } catch {
                      self.lastError = error.localizedDescription
                  }
                  isLoading = false
              }

              private func fetchMergedFromAllRepos() async throws -> StoreAPIResponse {
                  let enabled = repos.repositories.filter { $0.enabled }
                  var combined: [StoreAPIApp] = []
                  var seen = Set<String>()
                  var latestUpdate: String? = nil
                  var firstError: Error? = nil

                  await withTaskGroup(of: (StoreAPIResponse?, Error?).self) { group in
                      for repo in enabled {
                          group.addTask { () -> (StoreAPIResponse?, Error?) in
                              do {
                                  var req = URLRequest(url: URL(string: repo.feedURL)!, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 25)
                                  req.setValue("21s-iOS/1.0", forHTTPHeaderField: "User-Agent")
                                  let (data, response) = try await URLSession.shared.data(for: req)
                                  if let http = response as? HTTPURLResponse, !(200...299).contains(http.statusCode) {
                                      throw NSError(domain: "StoreFeed", code: http.statusCode,
                                                    userInfo: [NSLocalizedDescriptionKey: "HTTP \(http.statusCode) from \(repo.name)"])
                                  }
                                  let parsed = try JSONDecoder().decode(StoreAPIResponse.self, from: data)
                                  return (parsed, nil)
                              } catch {
                                  return (nil, error)
                              }
                          }
                      }
                      for await (resp, err) in group {
                          if let resp = resp {
                              for app in resp.apps {
                                  let key = app.bundleId?.lowercased() ?? "n_\(app.id)_\(app.name.lowercased())"
                                  if !seen.contains(key) {
                                      seen.insert(key)
                                      combined.append(app)
                                  }
                              }
                              if let u = resp.lastUpdated, (latestUpdate == nil || u > latestUpdate!) {
                                  latestUpdate = u
                              }
                          } else if let err = err, firstError == nil {
                              firstError = err
                          }
                      }
                  }

                  if combined.isEmpty, let err = firstError { throw err }

                  // Sort by newest first (using createdAt if available)
                  let sort = combined.sorted { (a, b) in
                      let da = a.createdAt ?? a.updatedAt ?? a.versionDate ?? ""
                      let db = b.createdAt ?? b.updatedAt ?? b.versionDate ?? ""
                      return da > db
                  }

                  return StoreAPIResponse.__build(apps: sort, lastUpdated: latestUpdate)
              }

              var featured: [StoreAPIApp] {
                  Array(apps.prefix(8))
              }
              var allSorted: [StoreAPIApp] { apps }

              func page(_ index: Int) -> [StoreAPIApp] {
                  let start = index * pageSize
                  guard start < apps.count else { return [] }
                  let end = min(start + pageSize, apps.count)
                  return Array(apps[start..<end])
              }

              var totalPages: Int {
                  max(1, Int(ceil(Double(apps.count) / Double(pageSize))))
              }

              func search(_ query: String) -> [StoreAPIApp] {
                  let q = query.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()
                  if q.isEmpty { return apps }
                  return apps.filter {
                      $0.name.lowercased().contains(q)
                      || ($0.category?.lowercased().contains(q) ?? false)
                      || ($0.bundleId?.lowercased().contains(q) ?? false)
                  }
              }
          }

          extension StoreAPIResponse {
              init(lastUpdated: String?, apps: [StoreAPIApp]) {
                  self.lastUpdated = lastUpdated
                  self.apps = apps
              }
              static func __build(apps: [StoreAPIApp], lastUpdated: String?) -> StoreAPIResponse {
                  return StoreAPIResponse(lastUpdated: lastUpdated, apps: apps)
              }
          }

          // ================= CATALOG REFRESHER =================
          @MainActor
          final class CatalogRefresher: ObservableObject {
              static let shared = CatalogRefresher()
              private let snapshotKey = "store_catalog_snapshot_v1"
              private init() {}

              func refreshAndNotify() async {
                  let repos = RepositoriesStore.shared.repositories.filter { $0.enabled }
                  guard !repos.isEmpty else { return }

                  var combined: [StoreAPIApp] = []
                  var seen = Set<String>()
                  await withTaskGroup(of: StoreAPIResponse?.self) { group in
                      for repo in repos {
                          group.addTask { () -> StoreAPIResponse? in
                              guard let url = URL(string: repo.feedURL) else { return nil }
                              do {
                                  var req = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 20)
                                  req.setValue("21s-iOS/1.0", forHTTPHeaderField: "User-Agent")
                                  let (data, response) = try await URLSession.shared.data(for: req)
                                  if let http = response as? HTTPURLResponse, !(200...299).contains(http.statusCode) { return nil }
                                  return try? JSONDecoder().decode(StoreAPIResponse.self, from: data)
                              } catch {
                                  return nil
                              }
                          }
                      }
                      for await resp in group {
                          guard let resp = resp else { continue }
                          for app in resp.apps {
                              let key = app.bundleId?.lowercased() ?? "n_\(app.id)_\(app.name.lowercased())"
                              if !seen.contains(key) { seen.insert(key); combined.append(app) }
                          }
                      }
                  }

                  guard !combined.isEmpty else { return }

                  let prev = (UserDefaults.standard.dictionary(forKey: snapshotKey) as? [String: String]) ?? [:]
                  var next: [String: String] = [:]
                  for app in combined { next["\(app.id)"] = app.version ?? app.bundleVersion ?? "" }

                  if !prev.isEmpty {
                      var count = 0
                      for app in combined {
                          let key = "\(app.id)"
                          let cur = next[key] ?? ""
                          let old = prev[key] ?? ""
                          if old.isEmpty {
                              NotificationsManager.shared.pushAppEvent(
                                  name: app.name, iconURL: app.iconURL ?? app.icon,
                                  version: cur, isUpdate: false)
                              count += 1
                          } else if cur != old {
                              NotificationsManager.shared.pushAppEvent(
                                  name: app.name, iconURL: app.iconURL ?? app.icon,
                                  version: cur, isUpdate: true)
                              count += 1
                          }
                          if count >= 8 { break }
                      }
                  }

                  UserDefaults.standard.set(next, forKey: snapshotKey)
              }
          }

