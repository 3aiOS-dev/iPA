      - name: Generate Source - IPAManager.swift (المصحح)
        run: |
          cat > IPAManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import zlib

          // MARK: - IPA Manager (استخراج Streaming + استرداد بدون ضغط)
          final class IPAManager: ObservableObject {
              static let shared = IPAManager()

              @Published var ipas: [LocalIPA] = []
              @Published var isImporting: Bool = false
              @Published var importProgress: Double = 0.0
              @Published var importMessage: String = ""
              @Published var lastError: String?

              private let queue = DispatchQueue(label: "ipa.manager.queue", qos: .userInitiated)
              private let metadataFile: URL
              private let ipasRoot: URL
              private let extractedRoot: URL
              private let installedRoot: URL

              private init() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  ipasRoot        = docs.appendingPathComponent("IPAs", isDirectory: true)
                  extractedRoot   = docs.appendingPathComponent("IPAs_Extracted", isDirectory: true)
                  installedRoot   = docs.appendingPathComponent("IPAs_Installed", isDirectory: true)
                  metadataFile    = docs.appendingPathComponent("ipas_index.json")
                  try? FileManager.default.createDirectory(at: ipasRoot, withIntermediateDirectories: true)
                  try? FileManager.default.createDirectory(at: extractedRoot, withIntermediateDirectories: true)
                  try? FileManager.default.createDirectory(at: installedRoot, withIntermediateDirectories: true)
                  load()
              }

              // MARK: - Storage Paths
              static var documentsDirectory: URL { FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0] }
              static var ipasDirectory: URL      { IPAManager.shared.ipasRoot }
              static var extractedDirectory: URL { IPAManager.shared.extractedRoot }
              static var installedDirectory: URL { IPAManager.shared.installedRoot }

              // MARK: - Index
              private func load() {
                  guard FileManager.default.fileExists(atPath: metadataFile.path),
                        let data = try? Data(contentsOf: metadataFile) else { return }
                  let dec = JSONDecoder()
                  dec.dateDecodingStrategy = .iso8601
                  if let list = try? dec.decode([LocalIPA].self, from: data) {
                      let verified = list.map { ipa -> LocalIPA in
                          var copy = ipa
                          if let p = ipa.extractedPath, let app = ipa.payloadAppName {
                              let inst = installedRoot.appendingPathComponent(app)
                              copy.isInstalled = FileManager.default.fileExists(atPath: inst.path)
                                          && (try? inst.resourceValues(forKeys: [.isDirectoryKey]).isDirectory) == true
                              _ = p
                          }
                          return copy
                      }
                      DispatchQueue.main.async { self.ipas = verified.sorted { $0.importedAt > $1.importedAt } }
                  }
              }

              private func save() {
                  let enc = JSONEncoder()
                  enc.dateEncodingStrategy = .iso8601
                  enc.outputFormatting = .prettyPrinted
                  if let data = try? enc.encode(ipas) {
                      try? data.write(to: metadataFile, options: .atomic)
                  }
              }

              // MARK: - Import (نسخ + استخراج streaming)
              func importIPA(from sourceURL: URL, completion: ((Result<LocalIPA, Error>) -> Void)? = nil) {
                  isImporting = true
                  importProgress = 0.0
                  importMessage  = "جاري نسخ الملف…"
                  lastError      = nil

                  let needsScope = sourceURL.startAccessingSecurityScopedResource()
                  defer { if needsScope { sourceURL.stopAccessingSecurityScopedResource() } }

                  let originalName = sourceURL.lastPathComponent
                  let safeName = sanitize(originalName)
                  let dest = ipasRoot.appendingPathComponent(safeName)

                  queue.async { [weak self] in
                      guard let self = self else { return }
                      do {
                          if FileManager.default.fileExists(atPath: dest.path) {
                              try FileManager.default.removeItem(at: dest)
                          }
                          try self.copyLargeFile(from: sourceURL, to: dest) { p in
                              self.tick(progress: 0.0 + p * 0.30, msg: "جاري نسخ الملف…")
                          }
                          self.tick(progress: 0.30, msg: "جاري قراءة البيانات…")
                          let sha = Self.quickHash(of: dest)

                          let extractDest = self.extractedRoot.appendingPathComponent(
                              safeName.replacingOccurrences(of: ".ipa", with: "", options: .caseInsensitive)
                          )
                          try? FileManager.default.removeItem(at: extractDest)
                          try FileManager.default.createDirectory(at: extractDest, withIntermediateDirectories: true)

                          self.tick(progress: 0.32, msg: "جاري فك الضغط…")
                          _ = try? self.streamingUnzip(src: dest, into: extractDest) { p in
                              self.tick(progress: 0.32 + p * 0.55, msg: "جاري فك الضغط… (\(Int(p*100))%)")
                          }

                          self.tick(progress: 0.88, msg: "قراءة المعلومات…")
                          var payloadAppName: String? = nil
                          var iconRel: String? = nil
                          var bundleID = (safeName as NSString).deletingPathExtension
                          var version  = "1.0"
                          var minOS    = "16.0"
                          var display  = (safeName as NSString).deletingPathExtension

                          if let appURL = self.findAppInPayload(in: extractDest),
                             let plist = self.readInfoPlist(in: appURL) {
                              bundleID = plist.bundleID ?? bundleID
                              version  = plist.version  ?? version
                              minOS    = plist.minOS    ?? minOS
                              display  = plist.displayName ?? display
                              payloadAppName = plist.executableName ?? appURL.lastPathComponent
                              iconRel = plist.iconName
                          }

                          let size = (try? FileManager.default.attributesOfItem(atPath: dest.path)[.size] as? NSNumber)?.int64Value ?? 0
                          let model = LocalIPA(
                              fileName: safeName,
                              displayName: display,
                              bundleID: bundleID,
                              version: version,
                              minOS: minOS,
                              sizeBytes: size,
                              importedAt: Date(),
                              sourceURL: dest,
                              extractedPath: extractDest,
                              payloadAppName: payloadAppName,
                              iconRelativePath: iconRel,
                              sha256: sha,
                              isInstalled: false
                          )
                          DispatchQueue.main.async {
                              self.ipas.insert(model, at: 0)
                              self.save()
                              self.tick(progress: 1.0, msg: "تم الاستيراد")
                              HapticManager.shared.notification(.success)
                              self.isImporting = false
                              completion?(.success(model))
                          }
                      } catch {
                          DispatchQueue.main.async {
                              self.isImporting = false
                              self.lastError = "فشل الاستيراد: \(error.localizedDescription)"
                              HapticManager.shared.notification(.error)
                              completion?(.failure(error))
                          }
                      }
                  }
              }

              // MARK: - نسخ ملفات كبيرة
              private func copyLargeFile(from src: URL, to dst: URL, progress: (Double) -> Void) throws {
                  let fm = FileManager.default
                  let attrs = try fm.attributesOfItem(atPath: src.path)
                  let total = (attrs[.size] as? NSNumber)?.int64Value ?? 0
                  if total < 8 * 1024 * 1024 {
                      try fm.copyItem(at: src, to: dst)
                      progress(1.0)
                      return
                  }
                  if fm.fileExists(atPath: dst.path) { try fm.removeItem(at: dst) }
                  fm.createFile(atPath: dst.path, contents: nil)
                  guard let inH  = try? FileHandle(forReadingFrom: src),
                        let outH = try? FileHandle(forWritingTo: dst) else {
                      try fm.copyItem(at: src, to: dst)
                      progress(1.0)
                      return
                  }
                  defer { try? inH.close(); try? outH.close() }
                  let chunkSize: Int = 4 * 1024 * 1024
                  var written: Int64 = 0
                  while true {
                      let chunk = (try? inH.read(upToCount: chunkSize)) ?? Data()
                      if chunk.isEmpty { break }
                      outH.write(chunk)
                      written += Int64(chunk.count)
                      if total > 0 {
                          progress(Double(written) / Double(total))
                      } else {
                          progress(min(1.0, Double(written) / (64 * 1024 * 1024)))
                      }
                  }
                  progress(1.0)
              }

              // MARK: - Quick hash
              static func quickHash(of url: URL) -> String {
                  guard let h = try? FileHandle(forReadingFrom: url) else {
                      return UUID().uuidString.replacingOccurrences(of: "-", with: "")
                  }
                  defer { try? h.close() }
                  let attrs = (try? FileManager.default.attributesOfItem(atPath: url.path)) ?? [:]
                  let size = (attrs[.size] as? NSNumber)?.int64Value ?? 0
                  var hasher = Hasher()
                  if let head = try? h.read(upToCount: 4096) { hasher.combine(head) }
                  if size > 10_000_000 {
                      try? h.seek(toOffset: UInt64(size / 2))
                      if let mid = try? h.read(upToCount: 4096) { hasher.combine(mid) }
                      try? h.seek(toOffset: UInt64(max(0, size - 4096)))
                      if let tail = try? h.read(upToCount: 4096) { hasher.combine(tail) }
                  }
                  hasher.combine(size)
                  hasher.combine(url.lastPathComponent)
                  let raw = hasher.finalize()
                  return String(format: "%016llx", UInt(bitPattern: raw))
              }

              private func tick(progress: Double, msg: String) {
                  DispatchQueue.main.async {
                      self.importProgress = progress
                      self.importMessage  = msg
                  }
              }

              // MARK: - Find .app in Payload
              private func findAppInPayload(in extractDest: URL) -> URL? {
                  let payload = extractDest.appendingPathComponent("Payload")
                  guard let apps = try? FileManager.default.contentsOfDirectory(at: payload, includingPropertiesForKeys: nil) else { return nil }
                  return apps.first(where: { $0.pathExtension == "app" })
              }

              // MARK: - Streaming Unzip باستخدام zlib من النظام
              struct UnzipResult {
                  let appURL: URL?
                  let fileCount: Int
              }

              private func streamingUnzip(src: URL,
                                           into dest: URL,
                                           progress: (Double) -> Void) throws -> UnzipResult {
                  let file = try FileHandle(forReadingFrom: src)
                  defer { try? file.close() }

                  guard let eocd = CentralDirectoryReader.locateEOCD(in: file) else {
                      throw NSError(domain: "IPA", code: 1, userInfo: [NSLocalizedDescriptionKey: "ملف ZIP غير صالح"])
                  }
                  let entries = eocd.entries.filter { !$0.isDirectory }
                  let total = Double(max(entries.count, 1))
                  var processed: Double = 0
                  var firstApp: URL? = nil
                  let fm = FileManager.default

                  for entry in entries {
                      processed += 1
                      progress(processed / total)

                      let outURL = dest.appendingPathComponent(entry.path)
                      let parent = outURL.deletingLastPathComponent()
                      try fm.createDirectory(at: parent, withIntermediateDirectories: true)

                      try file.seek(toOffset: entry.dataOffset)

                      if entry.method == 0 {
                          let data = (try file.read(upToCount: Int(entry.compressedSize))) ?? Data()
                          if !data.isEmpty { try data.write(to: outURL, options: .atomic) }
                      } else if entry.method == 8 {
                          let compressed = (try file.read(upToCount: Int(entry.compressedSize))) ?? Data()
                          if !compressed.isEmpty {
                              if let raw = StreamingInflate.inflate(compressed) {
                                  try raw.write(to: outURL, options: .atomic)
                              } else {
                                  try compressed.write(to: outURL, options: .atomic)
                              }
                          }
                      } else {
                          continue
                      }

                      if entry.path.contains("Payload/") && entry.path.hasSuffix(".app/") {
                          if firstApp == nil { firstApp = outURL }
                      }
                  }

                  if firstApp == nil {
                      firstApp = findAppInPayload(in: dest)
                  }
                  return UnzipResult(appURL: firstApp, fileCount: entries.count)
              }

              // MARK: - Info.plist Reader
              struct PlistInfo {
                  let bundleID: String?
                  let version: String?
                  let minOS: String?
                  let displayName: String?
                  let executableName: String?
                  let iconName: String?
              }

              func readInfoPlist(in payloadApp: URL) -> PlistInfo? {
                  let plistURL = payloadApp.appendingPathComponent("Info.plist")
                  guard let data = try? Data(contentsOf: plistURL) else { return nil }
                  guard let plist = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil) as? [String: Any] else { return nil }

                  let bundleID = plist["CFBundleIdentifier"] as? String
                  let version  = plist["CFBundleShortVersionString"] as? String
                  let minOS    = plist["MinimumOSVersion"] as? String
                  let display  = (plist["CFBundleDisplayName"] as? String) ?? (plist["CFBundleName"] as? String)
                  let exec     = plist["CFBundleExecutable"] as? String

                  var iconName: String? = nil
                  if let icons = plist["CFBundleIcons"] as? [String: Any],
                     let cf2 = icons["CFBundlePrimaryIcon"] as? [String: Any],
                     let files = cf2["CFBundleIconFiles"] as? [String], let last = files.last {
                      iconName = last
                  } else if let icons = plist["CFBundleIcons~ipad"] as? [String: Any],
                            let cf2 = icons["CFBundlePrimaryIcon"] as? [String: Any],
                            let files = cf2["CFBundleIconFiles"] as? [String], let last = files.last {
                      iconName = last
                  } else if let files = plist["CFBundleIconFiles"] as? [String], let last = files.last {
                      iconName = last
                  }

                  return PlistInfo(bundleID: bundleID, version: version, minOS: minOS,
                                   displayName: display, executableName: exec, iconName: iconName)
              }

              // MARK: - استرداد
              func recoverIPA(_ ipa: LocalIPA,
                              progress: @escaping (Double, String) -> Void,
                              completion: @escaping (Result<URL, Error>) -> Void) {
                  DispatchQueue.global(qos: .userInitiated).async { [weak self] in
                      guard let self = self else { return }
                      guard let appName = ipa.payloadAppName else {
                          DispatchQueue.main.async {
                              completion(.failure(NSError(domain: "IPA", code: 3,
                                  userInfo: [NSLocalizedDescriptionKey: "لا يوجد Payload صالح في الملف"])))
                          }
                          return
                      }

                      let src = ipa.extractedPath?.appendingPathComponent("Payload").appendingPathComponent(appName)
                      guard let src = src, FileManager.default.fileExists(atPath: src.path) else {
                          DispatchQueue.main.async { progress(0.0, "إعادة الاستخراج…") }
                          do {
                              let extractDest = self.extractedRoot.appendingPathComponent(
                                  ipa.fileName.replacingOccurrences(of: ".ipa", with: "", options: .caseInsensitive)
                              )
                              try? FileManager.default.removeItem(at: extractDest)
                              try FileManager.default.createDirectory(at: extractDest, withIntermediateDirectories: true)
                              _ = try self.streamingUnzip(src: ipa.sourceURL, into: extractDest) { p in
                                  DispatchQueue.main.async { progress(p * 0.5, "جاري فك الضغط…") }
                              }
                              let payloadSrc = extractDest.appendingPathComponent("Payload").appendingPathComponent(appName)
                              self.installApp(from: payloadSrc, ipa: ipa, progress: progress, completion: completion)
                          } catch {
                              DispatchQueue.main.async { completion(.failure(error)) }
                          }
                          return
                      }
                      self.installApp(from: src, ipa: ipa, progress: progress, completion: completion)
                  }
              }

              private func installApp(from src: URL,
                                      ipa: LocalIPA,
                                      progress: @escaping (Double, String) -> Void,
                                      completion: @escaping (Result<URL, Error>) -> Void) {
                  guard let appName = ipa.payloadAppName else {
                      DispatchQueue.main.async {
                          completion(.failure(NSError(domain: "IPA", code: 4,
                              userInfo: [NSLocalizedDescriptionKey: "اسم التطبيق غير معروف"])))
                      }
                      return
                  }
                  let dest = installedRoot.appendingPathComponent(appName)

                  do {
                      if FileManager.default.fileExists(atPath: dest.path) {
                          try FileManager.default.removeItem(at: dest)
                      }
                      try FileManager.default.createDirectory(at: dest, withIntermediateDirectories: true)

                      DispatchQueue.main.async { progress(0.55, "جاري نسخ الملفات…") }
                      let fm = FileManager.default
                      let enumerator = fm.enumerator(at: src, includingPropertiesForKeys: [.isRegularFileKey, .fileSizeKey])
                      var allFiles: [URL] = []
                      while let next = enumerator?.nextObject() as? URL {
                          let vals = try? next.resourceValues(forKeys: [.isRegularFileKey])
                          if vals?.isRegularFile == true { allFiles.append(next) }
                      }
                      let total = Double(max(allFiles.count, 1))
                      var done: Double = 0

                      for file in allFiles {
                          let rel = file.path.replacingOccurrences(of: src.path + "/", with: "")
                          let out = dest.appendingPathComponent(rel)
                          try fm.createDirectory(at: out.deletingLastPathComponent(), withIntermediateDirectories: true)
                          try fm.copyItem(at: file, to: out)
                          done += 1
                          let p = 0.55 + (done / total) * 0.40
                          DispatchQueue.main.async { progress(p, "جاري نسخ الملفات… (\(Int(p*100))%)") }
                      }

                      DispatchQueue.main.async { progress(0.97, "إنهاء…") }
                      if let idx = self.ipas.firstIndex(where: { $0.id == ipa.id }) {
                          self.ipas[idx].isInstalled = true
                          self.save()
                      }

                      DispatchQueue.main.async {
                          progress(1.0, "تم الاسترداد")
                          HapticManager.shared.notification(.success)
                          completion(.success(dest))
                      }
                  } catch {
                      DispatchQueue.main.async {
                          completion(.failure(error))
                      }
                  }
              }

              // MARK: - جلب ملف IPA الأصلي
              func sharedIPAFile(_ ipa: LocalIPA) -> URL { ipa.sourceURL }

              // MARK: - جلب التطبيق المُستخرج
              func installedAppURL(for ipa: LocalIPA) -> URL? {
                  guard let appName = ipa.payloadAppName else { return nil }
                  let p = installedRoot.appendingPathComponent(appName)
                  return FileManager.default.fileExists(atPath: p.path) ? p : nil
              }

              // MARK: - حذف
              func delete(_ ipa: LocalIPA) {
                  try? FileManager.default.removeItem(at: ipa.sourceURL)
                  if let p = ipa.extractedPath { try? FileManager.default.removeItem(at: p) }
                  if let appName = ipa.payloadAppName {
                      try? FileManager.default.removeItem(at: installedRoot.appendingPathComponent(appName))
                  }
                  ipas.removeAll { $0.id == ipa.id }
                  save()
              }

              func uninstall(_ ipa: LocalIPA) {
                  guard let appName = ipa.payloadAppName else { return }
                  try? FileManager.default.removeItem(at: installedRoot.appendingPathComponent(appName))
                  if let idx = ipas.firstIndex(where: { $0.id == ipa.id }) {
                      ipas[idx].isInstalled = false
                      save()
                  }
              }

              // MARK: - Helpers
              private func sanitize(_ name: String) -> String {
                  let invalid = CharacterSet(charactersIn: "/\\?%*|\"<>:")
                  return name.components(separatedBy: invalid).joined(separator: "_")
              }
          }

          // MARK: - StreamingInflate (باستخدام zlib من النظام)
          enum StreamingInflate {
              static func inflate(_ data: Data) -> Data? {
                  let expectedMax = max(data.count * 1000, 16 * 1024 * 1024)
                  let dst = UnsafeMutablePointer<UInt8>.allocate(capacity: expectedMax)
                  defer { dst.deallocate() }

                  var stream = z_stream()
                  stream.zalloc = nil
                  stream.zfree = nil
                  stream.opaque = nil

                  let initRet = data.withUnsafeBytes { (rawBuf: UnsafeRawBufferPointer) -> Int32 in
                      guard let base = rawBuf.baseAddress else { return Z_DATA_ERROR }
                      let src = base.assumingMemoryBound(to: UInt8.self)
                      stream.next_in = UnsafeMutablePointer(mutating: src)
                      stream.avail_in = uInt(data.count)
                      stream.next_out = dst
                      stream.avail_out = uInt(expectedMax)
                      return inflateInit2_(&stream, -MAX_WBITS, ZLIB_VERSION, Int32(MemoryLayout<z_stream>.size))
                  }
                  guard initRet == Z_OK else { return nil }

                  let totalOutBefore = stream.total_out
                  let inflateRet = inflate(&stream, Z_FINISH)
                  inflateEnd(&stream)

                  guard inflateRet == Z_STREAM_END || inflateRet == Z_OK else { return nil }
                  let written = Int(stream.total_out - totalOutBefore)
                  guard written > 0 else { return nil }
                  return Data(bytes: dst, count: written)
              }
          }

          // MARK: - ZIP Central Directory Reader
          enum CentralDirectoryReader {
              struct Entry {
                  let path: String
                  let compressedSize: UInt32
                  let method: UInt16
                  let dataOffset: UInt64
                  let isDirectory: Bool
              }
              struct EOCD {
                  let totalEntries: Int
                  let entries: [Entry]
              }

              static func locateEOCD(in file: FileHandle) -> EOCD? {
                  let maxBack: UInt64 = 65557
                  do {
                      let totalSize = (try file.seekToEnd())
                      let back = min(maxBack, totalSize)
                      try file.seek(toOffset: totalSize - back)
                      let tail = try file.read(upToCount: Int(back)) ?? Data()
                      guard let sigIdx = tail.range(of: Data([0x50, 0x4b, 0x05, 0x06]), options: .backwards) else { return nil }
                      let eocdOffset = totalSize - back + UInt64(sigIdx.lowerBound)
                      try file.seek(toOffset: eocdOffset)
                      let eocd = try file.read(upToCount: 22) ?? Data()
                      guard eocd.count >= 22 else { return nil }
                      let totalEntries = Int(eocd.readU16(at: 10))
                      _              = eocd.readU32(at: 12)
                      let cdOffset     = eocd.readU32(at: 16)

                      var entries: [Entry] = []
                      var pos: UInt64 = UInt64(cdOffset)
                      for _ in 0..<totalEntries {
                          try file.seek(toOffset: pos)
                          let header = try file.read(upToCount: 46) ?? Data()
                          guard header.count >= 46 else { break }
                          guard header[0] == 0x50, header[1] == 0x4b, header[2] == 0x01, header[3] == 0x02 else { break }
                          let method     = header.readU16(at: 10)
                          let compSize   = header.readU32(at: 20)
                          let nameLen    = Int(header.readU16(at: 28))
                          let extraLen   = Int(header.readU16(at: 30))
                          let commentLen = Int(header.readU16(at: 32))
                          let localOff   = header.readU32(at: 42)
                          try file.seek(toOffset: pos + 46)
                          let nameData = (try file.read(upToCount: nameLen)) ?? Data()
                          let path = String(data: nameData, encoding: .utf8) ?? ""
                          let isDir = path.hasSuffix("/")
                          try file.seek(toOffset: UInt64(localOff))
                          let lh = (try file.read(upToCount: 30)) ?? Data()
                          let lNameLen = lh.count >= 30 ? Int(lh.readU16(at: 26)) : 0
                          let lExtraLen = lh.count >= 30 ? Int(lh.readU16(at: 28)) : 0
                          let dataOffset = UInt64(localOff) + 30 + UInt64(lNameLen) + UInt64(lExtraLen)
                          entries.append(Entry(path: path, compressedSize: compSize,
                                               method: method, dataOffset: dataOffset, isDirectory: isDir))
                          pos += 46 + UInt64(nameLen) + UInt64(extraLen) + UInt64(commentLen)
                      }
                      return EOCD(totalEntries: totalEntries, entries: entries)
                  } catch {
                      return nil
                  }
              }
          }

          extension Data {
              func readU16(at offset: Int) -> UInt16 {
                  guard offset + 2 <= count else { return 0 }
                  return UInt16(self[offset]) | (UInt16(self[offset+1]) << 8)
              }
              func readU32(at offset: Int) -> UInt32 {
                  guard offset + 4 <= count else { return 0 }
                  return UInt32(self[offset])
                      | (UInt32(self[offset+1]) << 8)
                      | (UInt32(self[offset+2]) << 16)
                      | (UInt32(self[offset+3]) << 24)
              }
          }

          // MARK: - Share Sheet
          struct ShareSheet: UIViewControllerRepresentable {
              let items: [Any]
              func makeUIViewController(context: Context) -> UIActivityViewController {
                  UIActivityViewController(activityItems: items, applicationActivities: nil)
              }
              func updateUIViewController(_ uiViewController: UIActivityViewController, context: Context) {}
          }
          VIPEOF
          echo "IPAManager.swift: $(wc -l < IPAManager.swift) lines"

