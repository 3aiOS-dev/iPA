              /// المصادر المُعطّلة — تُحفظ تلقائياً عبر @AppStorage (مفصولة بـ \n)
              @AppStorage("vip_disabled_sources") private var disabledSourcesRaw: String = ""
              /// المصدر المفتوح حالياً لعرض تطبيقاته (URL أو فارغ)
              @State private var expandedSource: String = ""
              @Environment(\.colorScheme) var scheme
          
              /// المصادر الافتراضية المدمجة (لا يمكن حذفها)
              private let defaultSources: [String] = [
                  "https://raw.githubusercontent.com/driftywinds/driftywinds.github.io/master/AltStore/apps.json",
                  "https://raw.githubusercontent.com/swaggyP36000/TrollStore-IPAs/main/apps.json",
                  "https://provenance-emu.com/apps.json"
              ]
              private var allSources: [String] { defaultSources }
              private var disabledSources: Set<String> {
                  Set(disabledSourcesRaw.split(separator: "\n").map { String($0) })
              }
              private func isEnabled(_ s: String) -> Bool { !disabledSources.contains(s) }
              private func setEnabled(_ s: String, _ enabled: Bool) {
                  var set = disabledSources
                  if enabled { set.remove(s) } else { set.insert(s) }
                  disabledSourcesRaw = set.sorted().joined(separator: "\n")
                  HapticManager.shared.selection()
