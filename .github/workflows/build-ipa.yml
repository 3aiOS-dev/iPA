name: Jood App - Build IPA

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "No Xcode installation was found."; exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          echo "Selected Xcode:"; xcodebuild -version
          echo "Swift:"; swift --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          command -v xcodegen

      - name: Create project directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf JoodBuild
          mkdir -p JoodBuild/Jood
          mkdir -p JoodBuild/Jood/Assets.xcassets/AppIcon.appiconset
          mkdir -p JoodBuild/Jood/Assets.xcassets/LaunchBackground.colorset

      - name: Generate Info.plist (with full device support)
        shell: bash
        run: |
          cat > JoodBuild/Jood/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Jood</string>

              <key>CFBundleIdentifier</key>
              <string>com.jood.webapp</string>

              <key>CFBundleName</key>
              <string>Jood</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>CFBundleIconName</key>
              <string>AppIcon</string>

              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key>
                  <string>LaunchBackground</string>
              </dict>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>

              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleDefault</string>
              <key>UIViewControllerBasedStatusBarAppearance</key>
              <true/>

              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <false/>
                  <key>NSAllowsLocalNetworking</key>
                  <false/>
              </dict>

              <key>UIRequiresFullScreen</key>
              <false/>
          </dict>
          </plist>
          PLIST

      - name: Generate AppIcon assets (ALL required sizes)
        shell: bash
        run: |
          set -euo pipefail

          ICONSET="JoodBuild/Jood/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"

          python3 - <<'PY'
          import struct, zlib, os

          OUT = "JoodBuild/Jood/Assets.xcassets/AppIcon.appiconset"

          TOP = (18, 107, 240)
          BOTTOM = (140, 56, 220)

          def write_png(path, w, h):
              sig = b'\x89PNG\r\n\x1a\n'
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + \
                         struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              rows = bytearray()
              denom = max(1, h - 1)
              for y in range(h):
                  t = y / denom
                  r = int(TOP[0] + (BOTTOM[0] - TOP[0]) * t)
                  g = int(TOP[1] + (BOTTOM[1] - TOP[1]) * t)
                  b = int(TOP[2] + (BOTTOM[2] - TOP[2]) * t)
                  rows += b'\x00' + bytes((r, g, b)) * w
              idat = zlib.compress(bytes(rows), 9)
              with open(path, 'wb') as f:
                  f.write(sig)
                  f.write(chunk(b'IHDR', ihdr))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))

          icons = [
              # iPhone
              ("AppIcon20x20@2x.png", 40, 40),
              ("AppIcon20x20@3x.png", 60, 60),
              ("AppIcon29x29@2x.png", 58, 58),
              ("AppIcon29x29@3x.png", 87, 87),
              ("AppIcon40x40@2x.png", 80, 80),
              ("AppIcon40x40@3x.png", 120, 120),
              ("AppIcon60x60@2x.png", 120, 120),
              ("AppIcon60x60@3x.png", 180, 180),
              # iPad
              ("AppIcon20x20~ipad.png", 20, 20),
              ("AppIcon20x20@2x~ipad.png", 40, 40),
              ("AppIcon29x29~ipad.png", 29, 29),
              ("AppIcon29x29@2x~ipad.png", 58, 58),
              ("AppIcon40x40~ipad.png", 40, 40),
              ("AppIcon40x40@2x~ipad.png", 80, 80),
              ("AppIcon76x76~ipad.png", 76, 76),
              ("AppIcon76x76@2x~ipad.png", 152, 152),
              ("AppIcon83.5x83.5@2x~ipad.png", 167, 167),
              # Marketing
              ("AppIcon1024x1024.png", 1024, 1024),
          ]

          for name, w, h in icons:
              write_png(os.path.join(OUT, name), w, h)
              print("generated", name, f"{w}x{h}")
          print("Total icons:", len(icons))
          PY

          ls -la "$ICONSET"

      - name: Generate AppIcon Contents.json
        shell: bash
        run: |
          cat > JoodBuild/Jood/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              { "filename" : "AppIcon20x20@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "20x20" },
              { "filename" : "AppIcon20x20@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "20x20" },
              { "filename" : "AppIcon29x29@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "29x29" },
              { "filename" : "AppIcon29x29@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "29x29" },
              { "filename" : "AppIcon40x40@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "40x40" },
              { "filename" : "AppIcon40x40@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "40x40" },
              { "filename" : "AppIcon60x60@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "AppIcon60x60@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "AppIcon20x20~ipad.png", "idiom" : "ipad", "scale" : "1x", "size" : "20x20" },
              { "filename" : "AppIcon20x20@2x~ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "20x20" },
              { "filename" : "AppIcon29x29~ipad.png", "idiom" : "ipad", "scale" : "1x", "size" : "29x29" },
              { "filename" : "AppIcon29x29@2x~ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "29x29" },
              { "filename" : "AppIcon40x40~ipad.png", "idiom" : "ipad", "scale" : "1x", "size" : "40x40" },
              { "filename" : "AppIcon40x40@2x~ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "40x40" },
              { "filename" : "AppIcon76x76~ipad.png", "idiom" : "ipad", "scale" : "1x", "size" : "76x76" },
              { "filename" : "AppIcon76x76@2x~ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "76x76" },
              { "filename" : "AppIcon83.5x83.5@2x~ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "83.5x83.5" },
              { "filename" : "AppIcon1024x1024.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Generate LaunchBackground colorset
        shell: bash
        run: |
          cat > JoodBuild/Jood/Assets.xcassets/LaunchBackground.colorset/Contents.json <<'JSON'
          {
            "colors" : [
              {
                "color" : {
                  "color-space" : "srgb",
                  "components" : {
                    "alpha" : "1.000",
                    "blue" : "0.941",
                    "green" : "0.420",
                    "red" : "0.070"
                  }
                },
                "idiom" : "universal"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Generate Assets.xcassets root Contents.json
        shell: bash
        run: |
          cat > JoodBuild/Jood/Assets.xcassets/Contents.json <<'JSON'
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Generate Swift source - JoodApp.swift
        shell: bash
        run: |
          cat > JoodBuild/Jood/JoodApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct JoodApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT

      - name: Generate Swift source - WebView.swift
        shell: bash
        run: |
          cat > JoodBuild/Jood/WebView.swift <<'SWIFT'
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              let url: URL
              @Binding var isLoading: Bool

              func makeCoordinator() -> Coordinator { Coordinator(self) }

              func makeUIView(context: Context) -> WKWebView {
                  let configuration = WKWebViewConfiguration()
                  configuration.allowsInlineMediaPlayback = true
                  configuration.mediaTypesRequiringUserActionForPlayback = []
                  configuration.websiteDataStore = .default()

                  let webView = WKWebView(frame: .zero, configuration: configuration)
                  webView.navigationDelegate = context.coordinator
                  webView.allowsBackForwardNavigationGestures = true
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.bounces = true
                  webView.isOpaque = false
                  webView.backgroundColor = .systemBackground
                  webView.scrollView.backgroundColor = .systemBackground
                  webView.scrollView.showsVerticalScrollIndicator = false
                  webView.scrollView.showsHorizontalScrollIndicator = false
                  // Full screen across all device sizes
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.contentMode = .scaleToFill

                  var request = URLRequest(url: url)
                  request.cachePolicy = .returnCacheDataElseLoad
                  request.timeoutInterval = 30
                  webView.load(request)

                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}

              final class Coordinator: NSObject, WKNavigationDelegate {
                  private var parent: WebView
                  init(_ parent: WebView) { self.parent = parent }

                  func webView(_ webView: WKWebView,
                               didStartProvisionalNavigation navigation: WKNavigation!) {
                      DispatchQueue.main.async { self.parent.isLoading = true }
                  }
                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                      DispatchQueue.main.async { self.parent.isLoading = false }
                  }
                  func webView(_ webView: WKWebView,
                               didFail navigation: WKNavigation!,
                               withError error: Error) {
                      DispatchQueue.main.async { self.parent.isLoading = false }
                  }
                  func webView(_ webView: WKWebView,
                               didFailProvisionalNavigation navigation: WKNavigation!,
                               withError error: Error) {
                      DispatchQueue.main.async { self.parent.isLoading = false }
                  }
              }
          }
          SWIFT

      - name: Generate Swift source - ContentView.swift
        shell: bash
        run: |
          cat > JoodBuild/Jood/ContentView.swift <<'SWIFT'
          import SwiftUI

          struct ContentView: View {
              @State private var isLoading = true
              @State private var hasFinishedInitialLoad = false

              private let targetURL = URL(string: "https://jood-ipa.neocities.org")!

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          WebView(url: targetURL, isLoading: $isLoading)
                              .frame(width: geo.size.width, height: geo.size.height)
                              .ignoresSafeArea(.all)
                              .background(Color(uiColor: .systemBackground))

                          if isLoading && !hasFinishedInitialLoad {
                              SplashView(size: geo.size)
                                  .transition(.opacity)
                                  .ignoresSafeArea(.all)
                          }
                      }
                      .frame(width: geo.size.width, height: geo.size.height)
                  }
                  .ignoresSafeArea(.all)
                  .onChange(of: isLoading) { newValue in
                      if !newValue {
                          withAnimation(.easeOut(duration: 0.45)) {
                              hasFinishedInitialLoad = true
                          }
                      }
                  }
              }
          }

          struct SplashView: View {
              let size: CGSize

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [Color(red: 0.12, green: 0.42, blue: 0.94),
                                   Color(red: 0.55, green: 0.22, blue: 0.86)],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )

                      VStack(spacing: 24) {
                          Image(systemName: "square.stack.3d.up.fill")
                              .font(.system(size: min(size.width, size.height) * 0.18,
                                            weight: .semibold))
                              .foregroundStyle(.white)

                          Text("Jood")
                              .font(.system(size: min(size.width, size.height) * 0.11,
                                            weight: .bold, design: .rounded))
                              .foregroundStyle(.white)

                          ProgressView()
                              .progressViewStyle(.circular)
                              .tint(.white)
                              .scaleEffect(1.25)
                              .padding(.top, 6)
                      }
                  }
              }
          }
          SWIFT

      - name: Generate XcodeGen project.yml
        shell: bash
        run: |
          cat > JoodBuild/project.yml <<'YAML'
          name: Jood

          options:
            minimumXcodeGenVersion: "2.40.0"
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true
            groupSortPosition: top

          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              DEVELOPMENT_TEAM: ""
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGN_IDENTITY: ""
              PRODUCT_BUNDLE_IDENTIFIER: "com.jood.webapp"
              MARKETING_VERSION: "1.0"
              CURRENT_PROJECT_VERSION: "1"
              TARGETED_DEVICE_FAMILY: "1,2"
              ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

          targets:
            Jood:
              type: application
              platform: iOS
              sources:
                - path: Jood
              info:
                path: Jood/Info.plist
              settings:
                base:
                  PRODUCT_NAME: "Jood"
                  INFOPLIST_FILE: "Jood/Info.plist"
                  ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
              scheme:
                gatherCoverageData: false
                testTargets: []
          YAML

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd JoodBuild
          xcodegen generate
          test -f Jood.xcodeproj/project.pbxproj

      - name: Validate Swift sources
        shell: bash
        run: |
          set -euo pipefail
          cd JoodBuild
          swiftc -parse \
            Jood/JoodApp.swift \
            Jood/WebView.swift \
            Jood/ContentView.swift

      - name: Validate AppIcon set
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="JoodBuild/Jood/Assets.xcassets/AppIcon.appiconset"
          for f in \
            AppIcon60x60@2x.png \
            AppIcon60x60@3x.png \
            AppIcon76x76~ipad.png \
            AppIcon76x76@2x~ipad.png \
            AppIcon83.5x83.5@2x~ipad.png \
            AppIcon1024x1024.png ; do
            if [ ! -f "$ICONSET/$f" ]; then
              echo "MISSING: $f"; exit 1
            fi
          done
          echo "All required AppIcon files present:"
          ls -1 "$ICONSET"

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          cd JoodBuild
          xcodebuild \
            -project Jood.xcodeproj \
            -scheme Jood \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Jood.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Verify AppIcon inside built app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Jood.xcarchive/Products/Applications/Jood.app"
          echo "--- Info.plist icon keys ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Info.plist" || true
          echo "--- Icon files inside .app ---"
          ls -1 "$APP" | grep -i "AppIcon" || true

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/Jood.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/Jood.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle was not found:"
            find "$ARCHIVE" -maxdepth 5 -type d -name '*.app' -print
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/Jood.app"
          cd "$RUNNER_TEMP"
          rm -f Jood-unsigned.ipa
          /usr/bin/zip -qry Jood-unsigned.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp Jood-unsigned.ipa "$GITHUB_WORKSPACE/artifacts/Jood-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jood-unsigned-ipa
          path: artifacts/Jood-unsigned.ipa
          if-no-files-found: error

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Jood — Full Screen Web App"
            echo ""
            echo "- Displays https://jood-ipa.neocities.org"
            echo "- Full-screen WKWebView, no browser chrome"
            echo "- Adaptive layout: all iPhone + iPad screen sizes"
            echo "- AppIcon60x60@2x.png (120x120) ✓"
            echo "- AppIcon76x76@2x~ipad.png (152x152) ✓"
            echo "- Unsigned IPA: artifacts/Jood-unsigned.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
