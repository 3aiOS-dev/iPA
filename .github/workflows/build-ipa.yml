          // MARK: - Signing Tab
          struct SigningTabView: View {
              @ObservedObject var downloadManager: IPADownloadManager
              @ObservedObject var certificateManager: CertificateManager
              @State private var selectedFile: IPAFile?
              @State private var patchFile: IPAFile?
              @State private var signingProgress: Double?
              @State private var signingStatus = ""
              @State private var showIPAPicker = false
              @State private var showInstallSheet = false
              @State private var pendingInstallFile: IPAFile?
              @State private var showInstallError = false
              @State private var installErrorMsg = ""
              @State private var selectedSegment = 0
              @State private var tagInput: String = ""
              @State private var pendingRecovery = false
              @AppStorage("vip21.userTags") private var savedTagsCSV: String = ""
              @Environment(\.colorScheme) var scheme
          
              var body: some View {
                  VStack(spacing: 16) {
                      // ── الهيدر المحسّن v7 ──
                      HStack(spacing: 14) {
                          ZStack {
                              RoundedRectangle(cornerRadius: 16)
                                  .fill(LinearGradient(colors: [.vipPurple, .blue, .cyan],
                                                       startPoint: .topLeading, endPoint: .bottomTrailing))
                                  .frame(width: 52, height: 52)
                                  .shadow(color: .vipPurple.opacity(0.45), radius: 8, y: 4)
                              Image(systemName: "wand.and.stars")
                                  .font(.system(size: 24, weight: .semibold))
                                  .foregroundColor(.white)
                          }
                          VStack(alignment: .leading, spacing: 3) {
                              Text("التوقيع والتثبيت")
                                  .font(.system(size: 20, weight: .heavy))
                              Text("IPA • توقيع • تثبيت")
                                  .font(.system(size: 11)).foregroundColor(.gray)
                          }
                          Spacer()
                          // Cert quick status
                          if let cert = certificateManager.selectedCertificate {
                              VStack(spacing: 2) {
                                  Circle()
                                      .fill(cert.isValid ? Color.green : Color.red)
                                      .frame(width: 8, height: 8)
                                  Text(cert.isValid ? "شهادة نشطة" : "منتهية")
                                      .font(.system(size: 8, weight: .semibold))
                                      .foregroundColor(cert.isValid ? .green : .red)
                              }
                          }
                      }.padding(.horizontal)
          
                      // ── حالة الشهادة ──
                      CertificateStatusBar(certificateManager: certificateManager).padding(.horizontal)
          
                      // ── أزرار الإجراءات السريعة (مرتّبة) ──
                      HStack(spacing: 10) {
                          quickActionButton(title: "استورد IPA", icon: "tray.and.arrow.down.fill",
                                            colors: [.vipPurple, .indigo]) { showIPAPicker = true }
                          quickActionButton(title: "استرداد الملفات", icon: "arrow.clockwise.icloud.fill",
                                            colors: [.orange, .red]) { pendingRecovery = true }
                      }.padding(.horizontal)
          
                      // ── شريط التبويبات (مرتّب) ──
                      Picker("", selection: $selectedSegment) {
                          Text("الملفات (\(downloadManager.ipaFiles.count))").tag(0)
                          Text("قيد التحميل (\(downloadManager.activeDownloads.count))").tag(1)
                          Text("العلامات").tag(2)
                      }.pickerStyle(SegmentedPickerStyle()).padding(.horizontal)
          
                      if selectedSegment == 0 {
                          if certificateManager.certificates.isEmpty { emptyCertView }
                          else if downloadManager.ipaFiles.isEmpty { emptyFilesView }
                          else {
                              LazyVStack(spacing: 12) {
                                  ForEach(downloadManager.ipaFiles) { file in
                                      IPAFileCard(
                                          file: file,
                                          hasValidCert: certificateManager.selectedCertificate?.isValid == true,
                                          onSign:    { selectedFile = file },
                                          onInstall: { handleInstall(file: file) },
                                          onShare:   { shareIPA(file: file) },
                                          onDelete:  { downloadManager.deleteIPAFile(file) },
                                          onEdit:    { patchFile = file }
                                      ).padding(.horizontal)
                                  }
                              }
                          }
                      } else if selectedSegment == 1 {
                          if downloadManager.activeDownloads.isEmpty {
                              VStack(spacing: 12) {
                                  Image(systemName: "icloud.and.arrow.down").font(.system(size: 50))
                                      .foregroundColor(.gray.opacity(0.4))
                                  Text("لا توجد تحميلات نشطة").font(.system(size: 15)).foregroundColor(.gray)
                              }.frame(maxWidth: .infinity).padding(.top, 60)
                          } else {
                              LazyVStack(spacing: 12) {
                                  ForEach(downloadManager.activeDownloads) { dl in
                                      ActiveDownloadCard(download: dl, downloadManager: downloadManager).padding(.horizontal)
                                  }
                              }
                          }
                      } else {
                          // ── قسم العلامات المخصّص ──
                          tagsSection.padding(.horizontal)
                      }
                  }
                  .sheet(isPresented: $showIPAPicker) {
                      DocumentPicker(types: [.init(filenameExtension: "ipa") ?? .data]) { url in
                          downloadManager.importIPAFromURL(url: url)
                      }
                  }
                  .sheet(item: $patchFile) { file in
                      IPAPatchSheet(file: file, downloadManager: downloadManager)
                  }
                  .sheet(item: $selectedFile) { file in
                      SigningSheetView(
                          ipaFile: file, certificates: certificateManager.certificates,
                          selectedCertId: certificateManager.selectedCertificate?.id,
                          onSign: { cert in selectedFile = nil; performSigning(file: file, cert: cert) }
                      )
                  }
                  .sheet(isPresented: $showInstallSheet) {
                      if let file = pendingInstallFile {
                          VIP21FullInstallView(
                              file: file,
                              certificateManager: certificateManager,
                              downloadManager: downloadManager
                          )
                      }
                  }
                  .overlay(signingProgress.map { p in SigningProgressOverlay(progress: p, status: signingStatus) })
                  .sheet(isPresented: $pendingRecovery) {
                      NavigationView {
                          ScrollView {
                              VIP21FileRecoveryView(downloadManager: downloadManager)
                          }
