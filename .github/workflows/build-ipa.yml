                                                  .padding(.horizontal)
                                          }
                                      }
                                  }
                                  if !failedDownloads.isEmpty {
                                      XcodeSectionHeader(title: "❌ Failed", icon: "xmark.circle.fill")
                                      LazyVStack(spacing: 10) {
                                          ForEach(failedDownloads) { task in
                                              FailedDownloadRow(task: task, downloadManager: downloadManager)
                                                  .padding(.horizontal)
                                          }
                                      }
                                  }
                                  if !completedDownloads.isEmpty {
                                      XcodeSectionHeader(title: "✅ Completed & Ready", icon: "checkmark.circle.fill")
                                      LazyVStack(spacing: 10) {
                                          ForEach(completedDownloads) { task in
                                              CompletedDownloadRow(
                                                  task: task,
                                                  downloadManager: downloadManager,
                                                  certificateManager: certificateManager,
                                                  signer: signer,
                                                  onSign: { startSign(task: task) },
                                                  onInstall: { downloadManager.installApp(id: task.id) },
                                                  onShare: { shareTask(task) },
                                                  onDelete: { taskToDelete = task }
                                              )
                                              .padding(.horizontal)
                                          }
                                      }
                                  }
                              }
                          }
                          .padding(.bottom, 20)
                      }
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .principal) {
                              HStack(spacing: 6) {
                                  Image(systemName: "arrow.down.circle.fill")
                                      .foregroundColor(.xcodeBlue)
                                  Text("Downloads & Signing")
                                      .font(.system(size: 17, weight: .heavy))
                                      .foregroundColor(.primary)
                              }
                          }
                          ToolbarItem(placement: .navigationBarTrailing) {
                              if !downloadManager.downloads.isEmpty {
                                  Button {
                                      HapticManager.shared.impact(.light)
                                      for task in downloadManager.downloads where task.state == .completed || task.state == .failed || task.state == .signed {
                                          downloadManager.deleteDownload(id: task.id)
                                      }
                                  } label: {
                                      Image(systemName: "trash")
                                          .foregroundColor(.xcodeRed)
                                  }
                              }
                          }
                      }
                  }
                  .sheet(isPresented: $showIPAPicker) {
                      DocumentPicker(
                          contentTypes: [UTType(filenameExtension: "ipa") ?? .archive],
                          allowsMultiple: false
                      ) { urls in
                          showIPAPicker = false
                          guard let url = urls.first else { return }
                          _ = downloadManager.importLocalIPA(from: url)
                      }
                      .ignoresSafeArea()
                  }
                  .sheet(isPresented: $showCertImport) {
                      CertificateImportView(certificateManager: certificateManager)
                  }
                  .sheet(item: $taskToSign) { task in
                      SignCertificatePickerView(
                          certificates: certificateManager.certificates,
                          onSelect: { cert in
                              selectedCertForSign = cert
                              taskToSign = nil
                              if cert.type == .p12 {
                                  showPasswordAlert = true
                              } else {
                                  performSign(task: task, cert: cert, password: nil)
                              }
                          }
                      )
                  }
                  .alert("Certificate Password", isPresented: $showPasswordAlert) {
                      SecureField("Password", text: $p12Password)
                      Button("Sign") {
                          if let task = taskToSign, let cert = selectedCertForSign {
                              performSign(task: task, cert: cert, password: p12Password)
                          }
                          showPasswordAlert = false
                      }
                      Button("Cancel", role: .cancel) {
                          showPasswordAlert = false
                          p12Password = ""
                      }
                  } message: {
                      Text("Enter the P12 certificate password")
                  }
                  .confirmationDialog(
                      "Delete download?",
                      isPresented: Binding(
                          get: { taskToDelete != nil },
                          set: { if !$0 { taskToDelete = nil } }
                      ),
                      titleVisibility: .visible
                  ) {
                      Button("Delete", role: .destructive) {
                          if let task = taskToDelete { downloadManager.deleteDownload(id: task.id) }
                          taskToDelete = nil
                      }
                      Button("Cancel", role: .cancel) { taskToDelete = nil }
                  } message: {
                      Text(taskToDelete?.appName ?? "")
                  }
                  .sheet(isPresented: $showShareSheet) {
                      if let url = shareURL {
                          ShareSheet(activityItems: [url])
                      }
                  }
              }

              private func startSign(task: DownloadTask) {
                  taskToSign = task
              }

              private func performSign(task: DownloadTask, cert: StoreCertificate, password: String?) {
                  guard let path = task.localFilePath else { return }
                  let certURL = certificateManager.certificateURL(for: cert)
                  let provisionCert = certificateManager.certificates.first(where: { $0.type == .mobileprovision })
                  let provisionPath = provisionCert.map { certificateManager.certificateURL(for: $0).path }

                  if cert.type == .p12, let password = password, !password.isEmpty {
                      if let idx = certificateManager.certificates.firstIndex(where: { $0.id == cert.id }) {
                          certificateManager.certificates[idx].p12Password = password
                      }
                  }

                  signer.sign(
                      ipaPath: path,
                      certPath: certURL.path,
                      provisionPath: provisionPath,
                      p12Password: cert.p12Password ?? password
                  ) { result in
                      switch result {
                      case .success(let signedName):
                          downloadManager.setSignedPath(id: task.id, path: signedName, certID: cert.id)
                          showSignSuccess = true
                          signSuccessMessage = "Successfully signed \(task.appName)!"
                          HapticManager.shared.success()
                          DispatchQueue.main.asyncAfter(deadline: .now() + 3) {
                              showSignSuccess = false
                          }
                      case .failure(let error):
                          certificateManager.lastError = error.localizedDescription
                          HapticManager.shared.error()
                      }
                  }
              }

              private func shareTask(_ task: DownloadTask) {
                  guard let url = downloadManager.fileURL(for: task) else { return }
                  shareURL = url
                  showShareSheet = true
              }
          }

