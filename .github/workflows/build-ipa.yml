          enum HomeHTML {
              // بنر بطولي متعدد الطبقات
              static func hero(title: String, subtitle: String, badge: String, hue: Int) -> String {
                  let pal = ThemeManager.p
                  var bits = ""
                  for i in 0..<22 {
                      let l = (i * 41 + hue * 13) % 100
                      let t = (i * 27 + hue * 9) % 100
                      let s = 3 + (i % 4) * 4
                      bits += "<b style='left:\(l)%;top:\(t)%;width:\(s)px;height:\(s)px;animation-delay:\(Double(i) * 0.21)s'></b>"
                  }
                  let body = """
                  <div class="bg"></div>
                  <div class="mesh"></div>
                  <div class="grid"></div>
                  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
                  <div class="bits">\(bits)</div>
                  <div class="shine"></div>
