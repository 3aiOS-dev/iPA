          cat > main.swift << 'EEOF'
          import UIKit

          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              private var favoritesNav: UINavigationController!

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let tabBar = makeTabBarController()
                  window?.rootViewController = tabBar
                  window?.makeKeyAndVisible()

                  NotificationCenter.default.addObserver(
                      self, selector: #selector(updateBadge),
                      name: .favoritesChanged, object: nil
                  )
                  updateBadge()

                  if !UserDefaults.standard.bool(forKey: "souq.onboarding.seen") {
                      let onboarding = OnboardingViewController()
                      onboarding.modalPresentationStyle = .fullScreen
                      tabBar.present(onboarding, animated: false)
                  }

                  return true
              }

              @objc private func updateBadge() {
                  let count = FavoritesManager.shared.count
                  favoritesNav.tabBarItem.badgeValue = count > 0 ? "\(count)" : nil
              }

              private func makeTabBarController() -> UITabBarController {
                  // تبويب المتجر: تصفح وبحث عن التطبيقات
                  let storeNav = UINavigationController(rootViewController: StoreViewController())
                  storeNav.navigationBar.barStyle = .black
                  storeNav.tabBarItem = UITabBarItem(title: "المتجر", image: UIImage(systemName: "bag.fill"), tag: 0)

                  // تبويب المفضلة: التطبيقات التي أضافها المستخدم محليًا
                  favoritesNav = UINavigationController(rootViewController: FavoritesViewController())
                  favoritesNav.navigationBar.barStyle = .black
                  favoritesNav.tabBarItem = UITabBarItem(title: "المفضلة", image: UIImage(systemName: "heart.fill"), tag: 1)

                  // تبويب الإعدادات: يحتوي على سياسة الخصوصية ومعلومات عن التطبيق
                  let settingsNav = UINavigationController(rootViewController: SettingsViewController())
                  settingsNav.navigationBar.barStyle = .black
                  settingsNav.tabBarItem = UITabBarItem(title: "الإعدادات", image: UIImage(systemName: "gearshape.fill"), tag: 2)

                  let tabBar = UITabBarController()
                  tabBar.viewControllers = [storeNav, favoritesNav, settingsNav]
                  tabBar.tabBar.barStyle = .black
                  tabBar.tabBar.tintColor = UIColor(red: 124/255, green: 58/255, blue: 237/255, alpha: 1)
                  return tabBar
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EEOF

      - name: Generate Info.plist
        run: |
          cd ${{ github.workspace }}
          cat > Resources/Info.plist << 'MEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>ar</string>
              <key>CFBundleExecutable</key>
              <string>Souq</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.souqdemo</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>سوق</string>
              <key>CFBundleDisplayName</key>
              <string>سوق</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                      </array>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76@2x~ipad.png</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          MEOF

      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift AppModel.swift AppCell.swift StoreViewController.swift DetailViewController.swift \
            FavoritesViewController.swift SettingsViewController.swift PrivacyPolicyViewController.swift \
            OnboardingViewController.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -o Souq

          file Souq

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/Souq.app

          cp Souq build-output/Payload/Souq.app/Souq
          cp Resources/Info.plist build-output/Payload/Souq.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/Souq.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/Souq.app/
          cp Resources/apps_data.json build-output/Payload/Souq.app/apps_data.json

          ldid -S build-output/Payload/Souq.app/Souq

          cd build-output
          zip -r -q ../artifacts/Souq.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/Souq.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Souq-IPA
          path: artifacts/Souq.ipa
          retention-days: 30
