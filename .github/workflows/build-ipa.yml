      - name: Generate code - StoreView.swift
        run: |
          cat > StoreView.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import ImageIO

          // ================= Store Design Tokens =================
          extension Color {
              static let storeBg        = Color(red: 0.96, green: 0.97, blue: 1.00)
              static let storeCard      = Color.white
              static let storePrimary   = Color(red: 0.24, green: 0.36, blue: 0.98) // vivid blue
              static let storePrimaryDk = Color(red: 0.18, green: 0.27, blue: 0.82)
              static let storePink      = Color(red: 0.96, green: 0.35, blue: 0.55)
              static let storeYellow    = Color(red: 1.00, green: 0.78, blue: 0.20)
              static let storeCyan      = Color(red: 0.30, green: 0.80, blue: 0.90)
              static let storeText      = Color(red: 0.08, green: 0.10, blue: 0.20)
              static let storeSub       = Color(red: 0.55, green: 0.58, blue: 0.66)
              static let storeDivider   = Color(red: 0.92, green: 0.93, blue: 0.97)
              static let betaOrange     = Color(red: 1.00, green: 0.55, blue: 0.10)
              static let walletGreen    = Color(red: 0.20, green: 0.65, blue: 0.40)
              static let walletDark     = Color(red: 0.10, green: 0.18, blue: 0.12)
              static let walletDeep     = Color(red: 0.05, green: 0.12, blue: 0.08)
              static let creamBg        = Color(red: 0.99, green: 0.93, blue: 0.85)
          }

          // ================= Remote Icon Cache (THREAD-SAFE) =================
          // Loads app icons (PNG) from remote URLs with an in-memory cache,
          // disk cache (Caches dir), and a graceful placeholder fallback.
          //
          // CRASH FIX: This class is now MainActor-isolated, with a separate
          // background URLSession for fetching. The previous implementation
          // called DispatchQueue.main.sync from detached background tasks, which
          // could deadlock when the cache was first touched from a background
          // thread during a SwiftUI update - and the resulting hang/crash was
          // triggered every time the user opened the Store tab.
          @MainActor
          final class RemoteIconCache: ObservableObject {
              static let shared = RemoteIconCache()
              @Published private(set) var cache: [String: UIImage] = [:]
              private let session: URLSession
              private let diskDir: URL

              init() {
                  let cfg = URLSessionConfiguration.default
                  cfg.requestCachePolicy = .returnCacheDataElseLoad
                  cfg.urlCache = URLCache(memoryCapacity: 32 * 1024 * 1024,
                                           diskCapacity: 128 * 1024 * 1024,
                                           diskPath: "icons")
                  cfg.timeoutIntervalForRequest = 12
                  self.session = URLSession(configuration: cfg)

                  let caches = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask).first!
                  let dir = caches.appendingPathComponent("apptesters-icons", isDirectory: true)
                  try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                  self.diskDir = dir
              }

              /// Synchronous lookup. Returns a cached image if available, otherwise
              /// returns nil and kicks off an async fetch that will republish the
              /// image into `cache` when complete (the SwiftUI view will refresh).
              func image(for urlString: String?) -> UIImage? {
                  guard let s = urlString, let url = URL(string: s) else { return nil }
                  if let hit = cache[s] { return hit }

                  let dir = self.diskDir
                  // Build the disk path (pure function, safe to call from any thread)
                  let name = s
                      .replacingOccurrences(of: "https://", with: "")
                      .replacingOccurrences(of: "http://", with: "")
                      .replacingOccurrences(of: "/", with: "_")
                      .replacingOccurrences(of: ":", with: "_")
                  let path = dir.appendingPathComponent(name)

                  // Fast disk read (off-main) - happens at most once per URL
                  if let data = try? Data(contentsOf: path), let img = UIImage(data: data) {
                      cache[s] = img
                      return img
                  }

                  // Kick off the network fetch; the view refreshes via @Published.
                  Task { [weak self] in
                      guard let self else { return }
                      await self.fetch(urlString: s, url: url, path: path)
                  }
                  return nil
              }

              private func fetch(urlString: String, url: URL, path: URL) async {
                  do {
                      let (data, _) = try await session.data(from: url)
                      guard let img = UIImage(data: data) else { return }
                      // Persist to disk (best-effort)
                      try? data.write(to: path)
                      cache[urlString] = img
                  } catch {
                      // Network failure - keep the placeholder, no crash
                  }
              }
          }

