                                  )
                          }
                          .buttonStyle(.plain)
                          .disabled(busy || draft.isEmpty || draft.count > maxChars)
                      }
                      .padding(16)

                      Divider().overlay(Color.white.opacity(0.08))

                      HStack(alignment: .top, spacing: 12) {
                          ONEsAvatar(name: session.username, uid: session.userID, size: 42)
