            const db = require('../db');
            const rows = db
              .prepare('SELECT * FROM store_orders WHERE telegram_id = ? ORDER BY id DESC LIMIT 10')
              .all(tg);
            if (!rows.length) return ctx.reply('📭 ما عندك طلبات.');
            const text = rows
              .map(
                (o) =>
                  `• #${o.order_ref || o.id} — ${o.status} — ${o.amount} (${o.created_at})`
              )
              .join('\n');
            return ctx.replyWithMarkdown(`📦 <b>طلباتك</b>\n\n${text}`, { parse_mode: 'HTML' });
          }
          
          function register(bot) {
            bot.command('help', onHelp);
            bot.command('profile', activeOnly(), onProfile);
            bot.command('balance', activeOnly(), onBalance);
            bot.command('referral', activeOnly(), onReferral);
            bot.command('products', activeOnly(), onProducts);
            bot.command('orders', activeOnly(), onOrders);
          }
          
          module.exports = { register, onHelp };
          
          EOFBOT_H_USER_JS
          
          mkdir -p bot/src/handlers
          cat > bot/src/handlers/admin.js << 'EOFBOT_H_ADMIN_JS'
          const userService = require('../services/userService');
          const { adminOnly, activeOnly } = require('../middleware/auth');
          const logger = require('../utils/logger');
          
          /**
           * Admin commands (ADMIN_ID only).
           *  /admin                  — menu
           *  /admin_stats            — counts
           *  /admin_pending          — list pending users
           *  /admin_approve <tg>     — set user active
           *  /admin_ban <tg>         — ban user
           *  /admin_balance <tg> <n> — set balance
           *  /admin_credit <tg> <n>  — add to balance
           *  /admin_broadcast <text> — send to all active users
           */
          function parseTg(text) {
            const m = text.match(/(\d{5,15})/);
            return m ? Number(m[1]) : null;
          }
          
          async function onAdmin(ctx) {
            return ctx.replyWithMarkdown(
              `🛠 <b>لوحة الأدمن</b>\n\n` +
                `/admin_stats — إحصائيات\n` +
                `/admin_pending — المستخدمون قيد التفعيل\n` +
                `/admin_approve &lt;tg_id&gt; — تفعيل\n` +
                `/admin_ban &lt;tg_id&gt; — حظر\n` +
                `/admin_balance &lt;tg_id&gt; &lt;amount&gt; — تعديل رصيد\n` +
                `/admin_credit &lt;tg_id&gt; &lt;amount&gt; — إضافة رصيد\n` +
                `/admin_broadcast &lt;text&gt; — بث للكل`,
              { parse_mode: 'HTML' }
            );
          }
          
          async function onStats(ctx) {
            const s = userService.stats();
            const byStatus = userService.countByStatus();
            return ctx.replyWithMarkdown(
              `📊 <b>إحصائيات</b>\n` +
                `المجموع: <b>${s.total}</b>\n` +
                `نشط: <b>${s.active}</b>\n` +
                `قيد التفعيل: <b>${s.pending}</b>\n` +
                `جديد اليوم: <b>${s.newToday}</b>\n\n` +
                byStatus.map((b) => `• ${b.status}: ${b.count}`).join('\n'),
              { parse_mode: 'HTML' }
            );
          }
          
          async function onPending(ctx) {
            const rows = userService.listAll({ status: 'pending', limit: 30 });
            if (!rows.length) return ctx.reply('لا يوجد مستخدمون قيد التفعيل.');
            const text = rows
              .map(
                (u) =>
                  `• <code>${u.telegram_id}</code> — ${u.full_name} — @${u.username || '—'} (${u.created_at})`
              )
              .join('\n');
            return ctx.replyWithMarkdown(`⏳ <b>قيد التفعيل</b>\n\n${text}`, { parse_mode: 'HTML' });
          }
          
          async function onApprove(ctx) {
            const tg = parseTg(ctx.message.text);
            if (!tg) return ctx.reply('اكتب ID المستخدم: /admin_approve 123456789');
            const u = userService.findByTelegramId(tg);
            if (!u) return ctx.reply('ما لقيت المستخدم.');
            userService.setStatus(tg, 'active');
            userService.audit(ctx.from.id, 'admin.approve', tg);
            try {
              await ctx.telegram.sendMessage(tg, '✅ تم تفعيل حسابك من قبل الإدارة.');
            } catch (e) {
              logger.warn('approve notify failed', { err: e.message });
            }
            return ctx.reply(`✅ تم تفعيل ${u.full_name}`);
          }
          
          async function onBan(ctx) {
            const tg = parseTg(ctx.message.text);
            if (!tg) return ctx.reply('اكتب ID: /admin_ban 123456789');
            const u = userService.findByTelegramId(tg);
            if (!u) return ctx.reply('ما لقيت المستخدم.');
            userService.setStatus(tg, 'banned');
            userService.audit(ctx.from.id, 'admin.ban', tg);
            try {
              await ctx.telegram.sendMessage(tg, '🚫 تم حظر حسابك من قبل الإدارة.');
            } catch (e) {
              logger.warn('ban notify failed', { err: e.message });
            }
            return ctx.reply(`🚫 تم حظر ${u.full_name}`);
          }
          
          async function onBalance(ctx) {
            const parts = (ctx.message.text || '').trim().split(/\s+/);
            const tg = parseTg(parts[1] || '');
            const amount = Number(parts[2]);
            if (!tg || Number.isNaN(amount)) {
              return ctx.reply('الاستخدام: /admin_balance <tg_id> <amount>');
            }
            const u = userService.findByTelegramId(tg);
            if (!u) return ctx.reply('ما لقيت المستخدم.');
            userService.setBalance(tg, amount);
            userService.audit(ctx.from.id, 'admin.balance.set', tg, { amount });
            return ctx.reply(`💰 تم تعديل رصيد ${u.full_name} إلى ${amount}`);
          }
          
          async function onCredit(ctx) {
            const parts = (ctx.message.text || '').trim().split(/\s+/);
            const tg = parseTg(parts[1] || '');
            const amount = Number(parts[2]);
            if (!tg || Number.isNaN(amount)) {
              return ctx.reply('الاستخدام: /admin_credit <tg_id> <amount>');
            }
            const u = userService.findByTelegramId(tg);
            if (!u) return ctx.reply('ما لقيت المستخدم.');
            userService.adjustBalance(tg, amount);
            userService.audit(ctx.from.id, 'admin.balance.adjust', tg, { amount });
            try {
              await ctx.telegram.sendMessage(tg, `💰 تم إضافة <b>${amount}</b> لرصيدك. رصيدك الآن: <b>${u.balance + amount}</b>`, { parse_mode: 'HTML' });
            } catch (e) { /* ignore */ }
            return ctx.reply(`✅ تمت إضافة ${amount} لـ ${u.full_name}`);
          }
          
          async function onBroadcast(ctx) {
            const text = (ctx.message.text || '').replace(/^\/admin_broadcast\s*/, '').trim();
            if (!text) return ctx.reply('الاستخدام: /admin_broadcast <رسالتك>');
            const rows = userService.listAll({ status: 'active', limit: 1000 });
            let ok = 0, fail = 0;
            for (const u of rows) {
              try {
                await ctx.telegram.sendMessage(u.telegram_id, `📢 ${text}`);
                ok++;
              } catch (e) {
                fail++;
              }
            }
            userService.audit(ctx.from.id, 'admin.broadcast', null, { ok, fail });
            return ctx.reply(`📢 تم الإرسال.\nنجح: ${ok}\nفشل: ${fail}`);
          }
          
          function register(bot) {
            const guard = adminOnly();
            bot.command('admin', guard, onAdmin);
            bot.command('admin_stats', guard, onStats);
            bot.command('admin_pending', guard, onPending);
            bot.command('admin_approve', guard, onApprove);
            bot.command('admin_ban', guard, onBan);
            bot.command('admin_balance', guard, onBalance);
            bot.command('admin_credit', guard, onCredit);
            bot.command('admin_broadcast', guard, onBroadcast);
          }
          
          module.exports = { register };
          
          EOFBOT_H_ADMIN_JS
          
          mkdir -p bot/src
          cat > bot/src/index.js << 'EOFBOT_INDEX_JS'
          const { Telegraf, Scenes, session, Markup } = require('telegraf');
          const cron = require('node-cron');
          const config = require('./config');
          const logger = require('./utils/logger');
          const rateLimit = require('./middleware/rateLimit');
          const userService = require('./services/userService');
          const verificationService = require('./services/verificationService');
          const notificationService = require('./services/notificationService');
          const startHandler = require('./handlers/start');
          const verifyHandler = require('./handlers/verify');
          const userHandler = require('./handlers/user');
          const adminHandler = require('./handlers/admin');
          
          const http = require('http');
          
          async function startHealthServer() {
            const server = http.createServer((req, res) => {
              if (req.url === '/healthz') {
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ ok: true, ts: Date.now() }));
              } else {
                res.writeHead(404);
                res.end('Not found');
              }
            });
            server.listen(config.server.port, () => {
              logger.info(`Health server listening on :${config.server.port}/healthz`);
            });
            return server;
          }
          
          async function main() {
            await startHealthServer();
            const bot = new Telegraf(config.bot.token);
          
            // Sessions for future scene wizards
            bot.use(session());
            bot.use(rateLimit());
          
            // /start
            bot.start(startHandler.onStart);
            bot.command('verify', verifyHandler.onVerify);
            bot.command('resend', verifyHandler.onResend);
          
            // User handlers
            userHandler.register(bot);
          
            // Admin handlers
            adminHandler.register(bot);
          
            // Fallback text
            bot.on('text', async (ctx) => {
              return ctx.replyWithMarkdown(
                '🤔 ما فهمت. جرّب /help لشوف الأوامر المتاحة.',
                { parse_mode: 'HTML' }
              );
            });
          
            // Error handler
            bot.catch((err, ctx) => {
              logger.error('Bot error', { err: err.message, update: ctx.update?.update_id });
            });
          
            // Polling or webhook
            if (config.server.webhookUrl) {
              const secret = config.server.webhookUrl.split('/').pop();
              await bot.telegram.setWebhook(`${config.server.webhookUrl}/${secret}`);
              const app = require('express')();
              app.use(bot.webhookCallback(`/${secret}`));
              // mount store webhook handler
              const { createWebhookServer } = require('./services/webhookServer');
              app.use(createWebhookServer(bot));
              app.listen(config.server.webhookPort, () => {
                logger.info(`Webhook listening on :${config.server.webhookPort}/${secret}`);
              });
            } else {
              await bot.launch();
              logger.info('Bot launched in polling mode');
            }
          
            // Cron: purge expired codes every 5 minutes
            cron.schedule('*/5 * * * *', () => {
              try {
                const n = verificationService.purgeExpired();
                if (n) logger.info(`Purged ${n} expired codes`);
              } catch (e) {
                logger.error('purge failed', { err: e.message });
              }
            });
          
            // Cron: flush pending notifications every minute
            cron.schedule('* * * * *', async () => {
              try {
                const r = await notificationService.flush(bot, 100);
                if (r.delivered) logger.debug(`Delivered ${r.delivered} notifications`);
              } catch (e) {
                logger.error('notify flush failed', { err: e.message });
              }
            });
          
            // Cron: daily digest for admin
            cron.schedule(`0 ${config.notifications.dailyDigestHour} * * *`, async () => {
              try {
                const s = userService.stats();
                await bot.telegram.sendMessage(
                  config.bot.adminId,
                  `📅 <b>ملخص اليوم</b>\nالمجموع: ${s.total}\nنشط: ${s.active}\nقيد التفعيل: ${s.pending}\nجديد اليوم: ${s.newToday}`,
                  { parse_mode: 'HTML' }
                );
              } catch (e) {
                logger.error('daily digest failed', { err: e.message });
              }
            });
          
            process.once('SIGINT', () => bot.stop('SIGINT'));
            process.once('SIGTERM', () => bot.stop('SIGTERM'));
          }
          
          main().catch((err) => {
            logger.error('Fatal', { err: err.message, stack: err.stack });
            process.exit(1);
          });
          
          EOFBOT_INDEX_JS
          
          mkdir -p bot/.
          cat > bot/README.md << 'EOFBOT_BOT_README_MD'
          # 🤖 Telegram Bot — Verification + Store Integration
          
          A full-featured Telegram bot built with **Node.js + Telegraf + SQLite**, featuring:
          
          - ✅ Per-user **verification codes** sent through the bot itself
          - ✅ Account management (status, balance, profile)
          - ✅ Admin dashboard (approve, ban, balance, broadcast)
          - ✅ Store API integration (products, orders)
          - ✅ Notification queue with retry
          - ✅ Scheduled jobs (purge expired codes, daily digest)
          - ✅ Docker Compose stack with Redis + Nginx
          - ✅ Rate limiting + audit log
          
          ## 🚀 Quick start
          
          ### Option 1 — Docker (recommended)
          
          ```bash
          cp .env.example .env
          # edit .env: BOT_TOKEN, ADMIN_ID, STORE_API_*
          
          docker compose up -d
          docker compose logs -f bot
          ```
          
          ### Option 2 — Local Node
          
          ```bash
          cp .env.example .env
          npm install
          npm run init-db
          npm start
          ```
          
          Requires **Node.js ≥ 18**.
          
          ## 🔐 Verification flow
          
          1. User sends `/start` (optionally with a referral code: `/start ABC123`).
          2. Bot creates the user (status `pending`) and **sends a unique numeric code** to that same chat.
          3. User sends `/verify <code>` — bot activates the account (`status = active`).
          4. Codes are **single-use**, expire after `VERIFICATION_CODE_TTL_MIN` minutes, and are rate-limited (`MAX_VERIFICATION_ATTEMPTS`).
          
          Use `/resend` to get a fresh code (invalidates the previous one).
          
          ## 🛠 Commands
          
          ### Users
          | Command | What it does |
          |---|---|
          | `/start` | Register / re-enter the bot |
          | `/verify <code>` | Activate account with the code |
          | `/resend` | Request a new verification code |
          | `/profile` | Show your profile |
          | `/balance` | Show balance |
          | `/referral` | Show your referral code + share link |
          | `/products` | List store products (uses `STORE_API_URL`) |
          | `/orders` | Show your orders |
          | `/help` | Show help |
          
          ### Admin (only `ADMIN_ID`)
          | Command | What it does |
          |---|---|
          | `/admin` | Admin menu |
          | `/admin_stats` | Bot statistics |
          | `/admin_pending` | List users awaiting activation |
          | `/admin_approve <tg_id>` | Activate a user |
          | `/admin_ban <tg_id>` | Ban a user |
          | `/admin_balance <tg_id> <amount>` | Set exact balance |
          | `/admin_credit <tg_id> <amount>` | Add to balance |
          | `/admin_broadcast <text>` | DM all active users |
          
          ## 🔔 Notifications
          
          The bot automatically notifies:
          
          - **Admin** on new registrations (configurable)
          - **Admin** on account activation
          - **User** on balance change, ban, etc.
          - **Admin** with a daily digest at `DAILY_DIGEST_HOUR`
          
          Failed sends are queued in `notifications` table and retried every minute.
          
          ## 🛒 Store integration
          
          Configure these in `.env`:
          
          ```env
          STORE_API_URL=https://your-store.example.com/api
          STORE_API_KEY=your-api-key
          ```
          
          Expected endpoints (override in `src/services/storeService.js` if yours differ):
          
          | Method | Path | Purpose |
          |---|---|---|
          | GET | `/products?limit=N&offset=N` | List products |
          | GET | `/products/:id` | Product detail |
          | POST | `/orders` | Create order |
          | GET | `/orders/:ref` | Order status |
          | POST | `/users/link` | Link Telegram ↔ store user |
          
          If `STORE_API_URL` is empty, the bot runs in **dev mode** and returns a stub for store calls.
          
          ## ⚙️ Configuration
          
          All env vars (see `.env.example`):
          
          ```env
          BOT_TOKEN=...                # required
          ADMIN_ID=...                 # required
          PORT=3000
          DB_PATH=./store/bot.db
          STORE_API_URL=...
          STORE_API_KEY=...
          VERIFICATION_CODE_TTL_MIN=10
          VERIFICATION_CODE_LENGTH=6
          MAX_VERIFICATION_ATTEMPTS=5
          DAILY_DIGEST_HOUR=9
          JWT_SECRET=change-me
          RATE_LIMIT_PER_MIN=20
          ```
          
          ## 🧪 Smoke test
          
          ```bash
          npm test
          ```
          
          Tests core flows: user creation, code generation, wrong/right/exhausted codes, balance, referral lookup, stats.
          
          ## 📁 Project layout
          
          ```
          telegram-bot-shop/
          ├── docker-compose.yml          # full stack
          ├── Dockerfile
          ├── .env.example
          ├── package.json
          ├── nginx/nginx.conf
          ├── scripts/
          │   ├── init-db.js              # create schema
          │   └── test-flow.js            # smoke tests
          ├── src/
          │   ├── index.js                # entrypoint
          │   ├── config/index.js
          │   ├── db/index.js             # schema + migrations
          │   ├── services/
          │   │   ├── userService.js
          │   │   ├── verificationService.js
          │   │   ├── notificationService.js
          │   │   └── storeService.js
          │   ├── middleware/
          │   │   ├── auth.js
          │   │   └── rateLimit.js
          │   ├── handlers/
          │   │   ├── start.js
          │   │   ├── verify.js
          │   │   ├── user.js
          │   │   └── admin.js
          │   └── utils/
          │       ├── code.js
          │       └── logger.js
          ├── store/                      # SQLite db lives here
          └── logs/
          ```
          
          ## 🛡 Security
          
          - Codes stored as SHA-256 hash, never plaintext
          - Rate limit per telegram id
          - Audit log on every admin action
          - Bcrypt ready (add for password flows)
          - JWT secret in env (use for future API auth)
          
          ## 📜 License
          
          MIT
          
          EOFBOT_BOT_README_MD
          

      - name: Smoke-test the bot
        working-directory: bot
        run: |
          cp .env.example .env
          npm install --no-audit --no-fund
          node scripts/test-flow.js
        env:
          BOT_TOKEN: ${{ env.BOT_TOKEN }}
          ADMIN_ID:  ${{ env.ADMIN_ID }}

      - name: Package bot source as tarball
        run: |
          tar -czf bot-source.tar.gz bot \
              --exclude='bot/node_modules' \
              --exclude='bot/store/*.db*' \
              --exclude='bot/logs/*.log' \
              --exclude='bot/.env'

      - name: Upload bot source artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-telegram-bot-source
          path: bot-source.tar.gz

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            AuthManager.swift \
            Countries.swift \
            OnboardingView.swift \
            AuthViews.swift \
            StoreView.swift \
            ContentView.swift \
            VIP21StoreApp.swift \
            Settings.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework ImageIO \
            -framework MobileCoreServices \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA package
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp -X VIP21Store                            build-output/Payload/VIP21Store.app/VIP21Store
          cp -X Resources/Info.plist                  build-output/Payload/VIP21Store.app/Info.plist
          cp -X Resources/AppIcon60x60@2x.png         build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon60x60@3x.png         build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon76x76@2x~ipad.png    build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp -X Resources/AppIcon1024x1024.png        build-output/Payload/VIP21Store.app/
          cp -X Resources/login_logo.png              build-output/Payload/VIP21Store.app/
          cp -X Resources/register_logo.png           build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding1.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding2.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/onboarding3.png             build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_onboarding1.png      build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_onboarding2.png      build-output/Payload/VIP21Store.app/
          cp -X Resources/wallet_onboarding3.png      build-output/Payload/VIP21Store.app/
          cp -X Resources/balance_animation.gif       build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding1.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding2.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/alerts_onboarding3.gif      build-output/Payload/VIP21Store.app/
          cp -X Resources/settings_onboarding.gif     build-output/Payload/VIP21Store.app/

          xattr -cr build-output
          find build-output -name ".DS_Store" -delete
          find build-output -name "._*" -delete

          ldid -S build-output/Payload/VIP21Store.app/VIP21Store

          rm -f artifacts/21s.ipa
          ditto -c -k --sequesterRsrc --keepParent \
                build-output/Payload \
                artifacts/21s.ipa

          if ! unzip -tq artifacts/21s.ipa >/dev/null 2>&1; then
            echo "❌ Error: IPA file is corrupt or invalid."
            exit 1
          fi
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/21s.ipa | head -50
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "== Integrity test =="
          unzip -tq artifacts/21s.ipa > /dev/null
          if unzip -l artifacts/21s.ipa | grep -q "_CodeSignature\|CodeResources"; then
            echo "⚠️ Warning: _CodeSignature found in IPA (should be inside .app, not Payload root)"
          fi
          echo "✅ IPA is valid, passes zip integrity test, and contains the App Bundle."


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Login-Wallet-IPA
          path: artifacts/21s.ipa
