      - name: Generate code - StatusScreens.swift
        run: |
          cat > StatusScreens.swift << 'STATUSEOF'
          import SwiftUI
          import Network
          import UIKit
          import Foundation

          enum StatusKind: Equatable {
              case ok
              case noInternet
          }

          @MainActor
          final class StatusCenter: ObservableObject {
              static let shared = StatusCenter()

              @Published var kind: StatusKind = .ok
              @Published var hasShownFirstWelcome: Bool = false

              private let monitor = NWPathMonitor()
              private let queue = DispatchQueue(label: "com.21s.status.monitor")
              private var didStart = false

              @Published var toastText: String = ""
              private var toastToken: Int = 0

              private init() {}

              nonisolated func show(text: String) {
                  Task { @MainActor in
                      StatusCenter.shared.presentToast(text)
                  }
              }

              private func presentToast(_ text: String) {
                  toastText = text
                  toastToken &+= 1
                  let token = toastToken
                  Task { @MainActor in
                      try? await Task.sleep(nanoseconds: 2_600_000_000)
                      if self.toastToken == token {
                          self.toastText = ""
                      }
                  }
              }

              func start() {
                  guard !didStart else { return }
                  didStart = true
                  monitor.pathUpdateHandler = { [weak self] path in
                      guard let self else { return }
                      DispatchQueue.main.async {
                          self.evaluate(currentPath: path)
                      }
                  }
                  monitor.start(queue: queue)
                  evaluate(currentPath: monitor.currentPath)
              }

              func refresh() {
                  evaluate(currentPath: monitor.currentPath)
              }

              private func evaluate(currentPath: NWPath) {
                  let online = (currentPath.status == .satisfied)
                  if !online {
                      if kind != .noInternet {
                          HapticManager.shared.error()
                      }
                      kind = .noInternet
                      return
                  }
                  kind = .ok
              }
          }

          struct NoInternetScreen: View {
              var onRetry: () -> Void

              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "wifi.slash")
                          .font(.system(size: 50))
                          .foregroundColor(.storeSub)
                      Text("لا يوجد اتصال")
                          .font(.system(size: 20, weight: .bold))
                      Text("تحقق من اتصالك بالإنترنت ثم حاول مرة أخرى.")
                          .font(.system(size: 14))
                          .foregroundColor(.storeSub)
                          .multilineTextAlignment(.center)
                          .padding(.horizontal, 40)
                      Button(action: onRetry) {
                          HStack {
                              Image(systemName: "arrow.clockwise")
                              Text("إعادة المحاولة")
                          }
                          .padding(.horizontal, 30)
                          .padding(.vertical, 10)
                          .background(Capsule().fill(Color.storePrimary))
                          .foregroundColor(.white)
                      }
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.storeBg.ignoresSafeArea())
              }
          }

          struct StatusOverlayHost: View {
              @ObservedObject var center = StatusCenter.shared

              var body: some View {
                  ZStack {
                      Group {
                          switch center.kind {
                          case .ok:
                              EmptyView()
                          case .noInternet:
                              NoInternetScreen {
                                  HapticManager.shared.impact(.light)
                                  center.refresh()
                              }
                              .transition(.opacity.combined(with: .scale(scale: 1.02)))
                          }
                      }
                      .animation(.easeInOut(duration: 0.25), value: center.kind)

                      if !center.toastText.isEmpty {
                          VStack {
                              Spacer()
                              Text(center.toastText)
                                  .font(.system(size: 14, weight: .semibold))
                                  .foregroundColor(.white)
                                  .multilineTextAlignment(.center)
                                  .padding(.horizontal, 18)
                                  .padding(.vertical, 12)
                                  .background(
                                      RoundedRectangle(cornerRadius: 16, style: .continuous)
                                          .fill(Color.black.opacity(0.85))
                                  )
                                  .padding(.bottom, 60)
                                  .padding(.horizontal, 24)
                          }
                          .transition(.opacity)
                      }
                  }
                  .animation(.easeInOut(duration: 0.25), value: center.toastText)
              }
          }
