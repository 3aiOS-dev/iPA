          import SwiftUI
          import Foundation
          import Combine

          /// مفتاح اللغة المحفوظ على الجهاز.
          public let kAppLanguageKey = "app_language_v1"

          /// مدير اللغة: عربي (RTL) أو إنجليزي (LTR) - اختياري بالكامل.
          public final class LanguageManager: ObservableObject {
              public static let shared = LanguageManager()

              @Published public var isArabic: Bool {
                  didSet {
                      UserDefaults.standard.set(isArabic ? "ar" : "en", forKey: kAppLanguageKey)
                  }
              }

              private init() {
                  let saved = UserDefaults.standard.string(forKey: kAppLanguageKey) ?? "ar"
                  isArabic = (saved != "en")
              }

              public static var currentCode: String {
                  (UserDefaults.standard.string(forKey: kAppLanguageKey) ?? "ar") == "en" ? "en" : "ar"
              }

              public var locale: Locale { Locale(identifier: isArabic ? "ar" : "en") }
              public var layout: LayoutDirection { isArabic ? .rightToLeft : .leftToRight }
              public var title: String { isArabic ? "العربية" : "English" }

              public func toggle() { isArabic.toggle() }
          }

