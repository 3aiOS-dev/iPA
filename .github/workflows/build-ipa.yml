      # =========================================================
      # ⚡ ULTRA CACHE MANAGER
      # =========================================================
      - name: ⚡ توليد UltraCacheManager.swift
        run: |
          cat > UltraCacheManager.swift << 'UCEOF'
          import Foundation
          import UIKit

          actor UltraCacheManager {
              static let shared = UltraCacheManager()

              // L1: Memory Cache
              private let memoryCache = NSCache<NSString, CacheEntry>()

              // L2: Disk Cache
              private var diskCacheURL: URL {
                  let urls = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask)
                  return urls[0].appendingPathComponent("UltraCache", isDirectory: true)
              }

              private init() {
                  memoryCache.countLimit = 200
                  memoryCache.totalCostLimit = 50 * 1024 * 1024 // 50MB
                  try? FileManager.default.createDirectory(at: diskCacheURL, withIntermediateDirectories: true)
              }

              struct CacheEntry: Codable {
                  let data: Data
                  let timestamp: Date
                  let etag: String?
                  let maxAge: TimeInterval

                  var isExpired: Bool {
                      Date().timeIntervalSince(timestamp) > maxAge
                  }
              }

              func get<T: Codable>(key: String) async -> T? {
                  let keyNSString = key as NSString

                  // L1 Check
                  if let entry = memoryCache.object(forKey: keyNSString), !entry.isExpired {
                      return try? JSONDecoder().decode(T.self, from: entry.data)
                  }

                  // L2 Check
                  let fileURL = diskCacheURL.appendingPathComponent(key.md5)
                  if let data = try? Data(contentsOf: fileURL),
                     let entry = try? JSONDecoder().decode(CacheEntry.self, from: data),
                     !entry.isExpired {
                      // Promote to L1
                      memoryCache.setObject(entry, forKey: keyNSString)
                      return try? JSONDecoder().decode(T.self, from: entry.data)
                  }

                  return nil
              }

              func set<T: Codable>(key: String, value: T, etag: String? = nil, maxAge: TimeInterval = 3600) async {
                  guard let data = try? JSONEncoder().encode(value) else { return }
                  let entry = CacheEntry(data: data, timestamp: Date(), etag: etag, maxAge: maxAge)

                  // L1 Store
                  memoryCache.setObject(entry, forKey: key as NSString)

                  // L2 Store
                  let fileURL = diskCacheURL.appendingPathComponent(key.md5)
                  if let entryData = try? JSONEncoder().encode(entry) {
                      try? entryData.write(to: fileURL)
                  }
              }

              func prefetch(urls: [URL]) async {
                  await withTaskGroup(of: Void.self) { group in
                      for url in urls {
                          group.addTask {
                              do {
                                  let (data, _) = try await URLSession.shared.data(from: url)
                                  let key = url.absoluteString
                                  let entry = CacheEntry(data: data, timestamp: Date(), etag: nil, maxAge: 86400)
                                  self.memoryCache.setObject(entry, forKey: key as NSString)
                              } catch {}
                          }
                      }
                  }
              }

              func clearAll() async {
                  memoryCache.removeAllObjects()
                  let files = try? FileManager.default.contentsOfDirectory(at: diskCacheURL, includingPropertiesForKeys: nil)
                  files?.forEach { try? FileManager.default.removeItem(at: $0) }
              }

              func clearExpired() async {
                  let files = try? FileManager.default.contentsOfDirectory(at: diskCacheURL, includingPropertiesForKeys: nil)
                  for file in files ?? [] {
                      if let data = try? Data(contentsOf: file),
                         let entry = try? JSONDecoder().decode(CacheEntry.self, from: data),
                         entry.isExpired {
                          try? FileManager.default.removeItem(at: file)
                      }
                  }
              }
          }

          extension String {
              var md5: String {
                  let data = Data(self.utf8)
                  // Simple hash fallback
                  return data.base64EncodedString().replacingOccurrences(of: "/", with: "_")
              }
          }
          UCEOF

