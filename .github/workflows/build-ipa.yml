name: ONEs Store - Control Panel Edition (SwiftUI) - UDID + Certificate Activation

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "ONEs"
  # ============================================================
  # لوحة التحكم الوحيدة للمتجر (Lovable Cloud)
  # كل شيء يمر عبر هذا السيرفر: التطبيقات - الأكواد - الشهادات - UDID
  # ============================================================
  PANEL_BASE_URL: "https://project--d6a05110-85ff-4efe-a926-4256f7b82f5c.lovable.app"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install zip 2>/dev/null || true
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES
      # =========================================================
      - name: Download project images
        run: |
          mkdir -p Resources
          curl -L -o Resources/store_icon.gif     "https://up6.cc/2026/08/178554033779411.gif" || true
          curl -L -o Resources/header_logo.png    "https://up6.cc/2026/08/178601927933882.png" || true
          curl -L -o Resources/appstore_glyph.png "https://up6.cc/2026/08/178602172173251.png" || true
          curl -L -o Resources/sub_mascot.png     "https://up6.cc/2026/08/178648656495841.png" || true
          curl -L -o Resources/home_banner.png    "https://up6.cc/2026/08/178648777615571.png" || true
          ls -lh Resources || true

      - name: Generate app icons
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os
          os.makedirs("Resources", exist_ok=True)
          size = 1024
          img = Image.new("RGB", (size, size), (10, 26, 22))
          d = ImageDraw.Draw(img)
          for i in range(size):
              t = i / size
              d.line([(0, i), (size, i)],
                     fill=(int(10 + 20 * t), int(40 + 70 * t), int(34 + 55 * t)))
          d.ellipse([size*0.22, size*0.22, size*0.78, size*0.78], outline=(212, 175, 55), width=26)
          d.ellipse([size*0.36, size*0.36, size*0.64, size*0.64], fill=(46, 204, 143))
          img.save("Resources/AppIcon1024.png")
          print("icon generated")
          PYEOF

      - name: Generate Info.plist
        run: |
          mkdir -p Sources
          cat > Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>ar</string>
            <key>CFBundleDisplayName</key><string>ONEs</string>
            <key>CFBundleExecutable</key><string>ONEs</string>
            <key>CFBundleIdentifier</key><string>com.vip21.store.pro</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>ONEs</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>3.0</string>
            <key>CFBundleVersion</key><string>300</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>UILaunchScreen</key><dict/>
            <key>UIUserInterfaceStyle</key><string>Dark</string>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key><string>com.vip21.store.pro</string>
                <key>CFBundleURLSchemes</key><array><string>onesstore</string></array>
              </dict>
            </array>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array>
                <key>UIPrerenderedIcon</key><false/>
              </dict>
            </dict>
          </dict>
          </plist>
          PLIST
          echo "Info.plist ready"

      # =========================================================
      # THEME
      # =========================================================
      - name: Generate code - Theme.swift
        run: |
          cat > Sources/Theme.swift << 'SWIFT'
          import SwiftUI

          enum Palette {
              static let bg        = Color(red: 0.04, green: 0.09, blue: 0.08)
              static let bgSoft    = Color(red: 0.07, green: 0.14, blue: 0.12)
              static let card      = Color(red: 0.09, green: 0.18, blue: 0.16)
              static let emerald   = Color(red: 0.18, green: 0.80, blue: 0.56)
              static let gold      = Color(red: 0.85, green: 0.70, blue: 0.25)
              static let textMain  = Color.white
              static let textSoft  = Color.white.opacity(0.65)
              static let stroke    = Color.white.opacity(0.10)
          }

          struct PremiumCard: ViewModifier {
              func body(content: Content) -> some View {
                  content
                      .background(Palette.card)
                      .clipShape(RoundedRectangle(cornerRadius: 20, style: .continuous))
                      .overlay(
                          RoundedRectangle(cornerRadius: 20, style: .continuous)
                              .stroke(Palette.stroke, lineWidth: 1)
                      )
                      .shadow(color: .black.opacity(0.35), radius: 18, x: 0, y: 10)
              }
          }

          extension View {
              func premiumCard() -> some View { modifier(PremiumCard()) }
          }

          struct AppBackground: View {
              var body: some View {
                  ZStack {
                      LinearGradient(colors: [Palette.bg, Palette.bgSoft],
                                     startPoint: .top, endPoint: .bottom)
                      RadialGradient(colors: [Palette.emerald.opacity(0.16), .clear],
                                     center: .topTrailing, startRadius: 20, endRadius: 520)
                      RadialGradient(colors: [Palette.gold.opacity(0.10), .clear],
                                     center: .bottomLeading, startRadius: 20, endRadius: 460)
                  }
                  .ignoresSafeArea()
              }
          }

          struct GoldTitle: View {
              let text: String
              var size: CGFloat = 28
              var body: some View {
                  Text(text)
                      .font(.system(size: size, weight: .black))
                      .foregroundStyle(
                          LinearGradient(colors: [Palette.gold, Palette.emerald],
                                         startPoint: .leading, endPoint: .trailing)
                      )
              }
          }
          SWIFT

      # =========================================================
      # API CLIENT — لوحة التحكم الجديدة فقط
      # =========================================================
      - name: Generate code - PanelAPI.swift
        run: |
          cat > Sources/PanelAPI.swift << 'SWIFT'
          import Foundation

          enum Panel {
              static let base = "PANEL_BASE_URL_PLACEHOLDER"
              static var appsURL: URL      { URL(string: base + "/api/public/store/apps")! }
              static var activateURL: URL  { URL(string: base + "/api/public/store/activate")! }
              static var statusURL: URL    { URL(string: base + "/api/public/store/status")! }
              static var downloadURL: URL  { URL(string: base + "/api/public/store/download")! }
              static var udidProfileURL: URL { URL(string: base + "/api/public/udid/profile")! }
          }

          struct StoreApp: Codable, Identifiable, Hashable {
              let id: String
              let name: String
              var bundle_id: String?
              var category: String?
              var description: String?
              var icon_url: String?
              var download_url: String?
              var version: String?
              var size_mb: Double?
              var developer: String?
              var screenshots: [String]?
              var is_featured: Bool?
              var requires_signing: Bool?
              var downloads_count: Int?
              var rating: Double?
          }

          private struct AppsEnvelope: Codable {
              let success: Bool
              let apps: [StoreApp]
          }

          struct CertificateInfo: Codable, Hashable {
              let id: String
              let name: String
              var team_name: String?
              var udid: String?
              var expires_at: String?
              var password: String?
              var p12_url: String?
              var provision_url: String?
          }

          struct ActivationResult: Codable {
              let success: Bool
              var error: String?
              var udid: String?
              var code: String?
              var expires_at: String?
              var certificate: CertificateInfo?
          }

          struct StatusResult: Codable {
              let success: Bool
              var udid_verified: Bool?
              var active: Bool?
              var code: String?
              var expires_at: String?
              var has_certificate: Bool?
          }

          struct DownloadResult: Codable {
              let success: Bool
              var error: String?
              var download_url: String?
              var requires_signing: Bool?
          }

          enum PanelError: LocalizedError {
              case server(String)
              var errorDescription: String? {
                  switch self {
                  case .server(let code): return Localized.activationError(code)
                  }
              }
          }

          @MainActor
          final class PanelClient {
              static let shared = PanelClient()
              private let session: URLSession = {
                  let cfg = URLSessionConfiguration.default
                  cfg.timeoutIntervalForRequest = 25
                  cfg.requestCachePolicy = .reloadIgnoringLocalCacheData
                  return URLSession(configuration: cfg)
              }()

              func fetchApps() async throws -> [StoreApp] {
                  let (data, _) = try await session.data(from: Panel.appsURL)
                  return (try JSONDecoder().decode(AppsEnvelope.self, from: data)).apps
              }

              func activate(code: String, udid: String) async throws -> ActivationResult {
                  let result: ActivationResult = try await post(Panel.activateURL,
                                                                ["code": code, "udid": udid])
                  if !result.success { throw PanelError.server(result.error ?? "UNKNOWN") }
                  return result
              }

              func status(udid: String) async throws -> StatusResult {
                  try await post(Panel.statusURL, ["udid": udid])
              }

              func requestDownload(appId: String, udid: String) async throws -> DownloadResult {
                  let result: DownloadResult = try await post(Panel.downloadURL,
                                                              ["app_id": appId, "udid": udid])
                  if !result.success { throw PanelError.server(result.error ?? "UNKNOWN") }
                  return result
              }

              private func post<T: Decodable>(_ url: URL, _ body: [String: String]) async throws -> T {
                  var req = URLRequest(url: url)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try JSONSerialization.data(withJSONObject: body)
                  let (data, _) = try await session.data(for: req)
                  return try JSONDecoder().decode(T.self, from: data)
              }
          }
          SWIFT
          python3 - << 'PY'
          import os
          p = "Sources/PanelAPI.swift"
          s = open(p).read().replace("PANEL_BASE_URL_PLACEHOLDER", os.environ["PANEL_BASE_URL"])
          open(p, "w").write(s)
          print("panel base injected")
          PY

      - name: Generate code - Localization.swift
        run: |
          cat > Sources/Localization.swift << 'SWIFT'
          import Foundation

          enum Localized {
              static func activationError(_ code: String) -> String {
                  switch code {
                  case "UDID_NOT_VERIFIED":        return "لم يتم التحقق من UDID الجهاز بعد. أكمل خطوة التحقق أولاً."
                  case "INVALID_CODE":             return "الكود غير صحيح أو تم إيقافه من لوحة التحكم."
                  case "CODE_BOUND_TO_OTHER_DEVICE": return "هذا الكود مرتبط بجهاز آخر."
                  case "CODE_EXPIRED":             return "انتهت صلاحية الاشتراك."
                  case "CERTIFICATE_INACTIVE":     return "الشهادة المرتبطة بالكود غير مفعّلة."
                  case "CERTIFICATE_UDID_MISMATCH":return "UDID جهازك لا يطابق UDID المسجل في الشهادة."
                  case "NOT_ACTIVATED":            return "يجب تفعيل الاشتراك قبل التحميل."
                  case "APP_NOT_FOUND":            return "التطبيق غير موجود."
                  default:                         return "تعذّر إتمام العملية. حاول مرة أخرى."
                  }
              }
          }
          SWIFT

      # =========================================================
      # ACTIVATION — UDID الفعلي + الكود + الشهادة
      # =========================================================
      - name: Generate code - ActivationManager.swift
        run: |
          cat > Sources/ActivationManager.swift << 'SWIFT'
          import SwiftUI
          import UIKit

          @MainActor
          final class ActivationManager: ObservableObject {
              static let shared = ActivationManager()

              @Published var udid: String = UserDefaults.standard.string(forKey: "ones.udid") ?? ""
              @Published var code: String = UserDefaults.standard.string(forKey: "ones.code") ?? ""
              @Published var expiresAt: Date?
              @Published var certificate: CertificateInfo?
              @Published var isActive = false
              @Published var isWorking = false
              @Published var message: String?

              var udidVerified: Bool { !udid.isEmpty }

              var remainingDays: Int {
                  guard let expiresAt else { return 0 }
                  return max(0, Calendar.current.dateComponents([.day], from: Date(), to: expiresAt).day ?? 0)
              }

              func openUDIDProfile() {
                  UIApplication.shared.open(Panel.udidProfileURL, options: [:], completionHandler: nil)
              }

              func handleCallback(url: URL) {
                  guard url.scheme == "onesstore" else { return }
                  let items = URLComponents(url: url, resolvingAgainstBaseURL: false)?.queryItems ?? []
                  if let value = items.first(where: { $0.name == "value" })?.value, !value.isEmpty {
                      setUDID(value)
                  }
              }

              func setUDID(_ value: String) {
                  let cleaned = value.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !cleaned.isEmpty else { return }
                  udid = cleaned
                  UserDefaults.standard.set(cleaned, forKey: "ones.udid")
                  Task { await refreshStatus() }
              }

              func refreshStatus() async {
                  guard udidVerified else { return }
                  do {
                      let status = try await PanelClient.shared.status(udid: udid)
                      isActive = status.active ?? false
                      if let iso = status.expires_at { expiresAt = ISO8601DateFormatter().date(from: iso) }
                      if let c = status.code { code = c }
                  } catch {
                      // بقاء الحالة المحفوظة عند انقطاع الشبكة
                  }
              }

              func activate() async {
                  guard udidVerified else {
                      message = "أكمل خطوة التحقق عبر الـ UDID أولاً."
                      return
                  }
                  isWorking = true
                  message = nil
                  do {
                      let result = try await PanelClient.shared.activate(
                          code: code.trimmingCharacters(in: .whitespaces).uppercased(),
                          udid: udid)
                      certificate = result.certificate
                      if let iso = result.expires_at { expiresAt = ISO8601DateFormatter().date(from: iso) }
                      isActive = true
                      UserDefaults.standard.set(code, forKey: "ones.code")
                      message = "تم تفعيل الاشتراك والتحقق من الشهادة بنجاح."
                  } catch {
                      isActive = false
                      message = error.localizedDescription
                  }
                  isWorking = false
              }

              func reset() {
                  isActive = false
                  code = ""
                  certificate = nil
                  expiresAt = nil
                  UserDefaults.standard.removeObject(forKey: "ones.code")
              }
          }
          SWIFT

      - name: Generate code - SubscriptionGateView.swift
        run: |
          cat > Sources/SubscriptionGateView.swift << 'SWIFT'
          import SwiftUI

          struct SubscriptionGateView: View {
              @ObservedObject private var manager = ActivationManager.shared
              @State private var manualUDID = ""

              var body: some View {
                  ZStack {
                      AppBackground()
                      ScrollView {
                          VStack(spacing: 22) {
                              header
                              stepOne
                              stepTwo
                              if let message = manager.message {
                                  Text(message)
                                      .font(.footnote)
                                      .multilineTextAlignment(.center)
                                      .foregroundStyle(manager.isActive ? Palette.emerald : .red)
                                      .padding(.horizontal, 8)
                              }
                              footer
                          }
                          .padding(20)
                      }
                  }
                  .environment(\.layoutDirection, .rightToLeft)
                  .task { await manager.refreshStatus() }
              }

              private var header: some View {
                  VStack(spacing: 10) {
                      GoldTitle(text: "ONEs", size: 44)
                      Text("متطلبات الاشتراك")
                          .font(.title3.weight(.bold))
                          .foregroundStyle(Palette.textMain)
                      Text("للوصول إلى المتجر يلزم التحقق من جهازك عبر الـ UDID ثم إدخال كود الاشتراك المرتبط بشهادة التوقيع.")
                          .font(.footnote)
                          .multilineTextAlignment(.center)
                          .foregroundStyle(Palette.textSoft)
                  }
                  .padding(.top, 26)
              }

              private var stepOne: some View {
                  VStack(alignment: .trailing, spacing: 14) {
                      stepBadge(number: "1", title: "تحقق عبر الـ UDID",
                                done: manager.udidVerified)

                      Text("سيتم فتح سفاري لتحميل ملف التعريف الرسمي، بعد تثبيته يُجلب UDID الفعلي لجهازك تلقائياً ثم تعود إلى المتجر.")
                          .font(.caption)
                          .foregroundStyle(Palette.textSoft)
                          .multilineTextAlignment(.trailing)

                      Button {
                          manager.openUDIDProfile()
                      } label: {
                          Label("تحقق عبر الـ UDID", systemImage: "checkmark.seal.fill")
                              .font(.headline)
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 14)
                              .background(
                                  LinearGradient(colors: [Palette.emerald, Palette.emerald.opacity(0.75)],
                                                 startPoint: .leading, endPoint: .trailing)
                              )
                              .foregroundStyle(Color.black)
                              .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))
                      }

                      if manager.udidVerified {
                          Text(manager.udid)
                              .font(.system(.caption, design: .monospaced))
                              .environment(\.layoutDirection, .leftToRight)
                              .foregroundStyle(Palette.gold)
                              .lineLimit(2)
                              .truncationMode(.middle)
                      } else {
                          HStack(spacing: 8) {
                              TextField("ألصق UDID بعد التثبيت", text: $manualUDID)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                                  .padding(12)
                                  .background(Palette.bgSoft)
                                  .clipShape(RoundedRectangle(cornerRadius: 12))
                                  .foregroundStyle(Palette.textMain)
                              Button("حفظ") { manager.setUDID(manualUDID) }
                                  .font(.subheadline.weight(.bold))
                                  .foregroundStyle(Palette.gold)
                          }
                      }
                  }
                  .padding(18)
                  .frame(maxWidth: .infinity)
                  .premiumCard()
              }

              private var stepTwo: some View {
                  VStack(alignment: .trailing, spacing: 14) {
                      stepBadge(number: "2", title: "كود الاشتراك والشهادة",
                                done: manager.isActive)

                      Text("أدخل الكود الصادر من لوحة التحكم، ويتم التحقق من ارتباطه بشهادة توقيع مطابقة لـ UDID جهازك.")
                          .font(.caption)
                          .foregroundStyle(Palette.textSoft)
                          .multilineTextAlignment(.trailing)

                      TextField("ONES-XXXX-XXXX-XXXX", text: $manager.code)
                          .textInputAutocapitalization(.characters)
                          .disableAutocorrection(true)
                          .environment(\.layoutDirection, .leftToRight)
                          .font(.system(.body, design: .monospaced))
                          .padding(14)
                          .background(Palette.bgSoft)
                          .clipShape(RoundedRectangle(cornerRadius: 14))
                          .foregroundStyle(Palette.textMain)

                      Button {
                          Task { await manager.activate() }
                      } label: {
                          HStack {
                              if manager.isWorking { ProgressView().tint(.black) }
                              Text(manager.isWorking ? "جارٍ التحقق…" : "تفعيل الاشتراك")
                          }
                          .font(.headline)
                          .frame(maxWidth: .infinity)
                          .padding(.vertical, 14)
                          .background(
                              LinearGradient(colors: [Palette.gold, Palette.gold.opacity(0.7)],
                                             startPoint: .leading, endPoint: .trailing)
                          )
                          .foregroundStyle(Color.black)
                          .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))
                      }
                      .disabled(manager.isWorking || manager.code.isEmpty || !manager.udidVerified)
                      .opacity(manager.udidVerified ? 1 : 0.5)

                      if let cert = manager.certificate {
                          VStack(alignment: .trailing, spacing: 4) {
                              Text("الشهادة: \(cert.name)")
                              if let team = cert.team_name { Text("الفريق: \(team)") }
                              if let exp = cert.expires_at { Text("انتهاء الشهادة: \(exp)") }
                          }
                          .font(.caption2)
                          .foregroundStyle(Palette.textSoft)
                      }
                  }
                  .padding(18)
                  .frame(maxWidth: .infinity)
                  .premiumCard()
              }

              private var footer: some View {
                  Text("جميع العمليات تُدار من لوحة التحكم الرسمية للمتجر.")
                      .font(.caption2)
                      .foregroundStyle(Palette.textSoft.opacity(0.7))
                      .padding(.bottom, 24)
              }

              private func stepBadge(number: String, title: String, done: Bool) -> some View {
                  HStack(spacing: 10) {
                      Image(systemName: done ? "checkmark.circle.fill" : "circle")
                          .foregroundStyle(done ? Palette.emerald : Palette.textSoft)
                      Text(title)
                          .font(.headline)
                          .foregroundStyle(Palette.textMain)
                      Spacer()
                      Text(number)
                          .font(.caption.weight(.black))
                          .frame(width: 26, height: 26)
                          .background(Palette.gold.opacity(0.2))
                          .clipShape(Circle())
                          .foregroundStyle(Palette.gold)
                  }
              }
          }

          struct ActivationGate<Content: View>: View {
              @ObservedObject private var manager = ActivationManager.shared
              @ViewBuilder var content: () -> Content

              var body: some View {
                  Group {
                      if manager.isActive {
                          content()
                      } else {
                          SubscriptionGateView()
                      }
                  }
              }
          }
          SWIFT

      # =========================================================
      # STORE UI
      # =========================================================
      - name: Generate code - StoreViewModel.swift
        run: |
          cat > Sources/StoreViewModel.swift << 'SWIFT'
          import SwiftUI

          @MainActor
          final class StoreViewModel: ObservableObject {
              static let shared = StoreViewModel()

              @Published var apps: [StoreApp] = []
              @Published var loading = false
              @Published var error: String?

              var featured: [StoreApp] { apps.filter { $0.is_featured == true } }
              var categories: [String] {
                  Array(Set(apps.compactMap { $0.category })).sorted()
              }
              var topDownloads: [StoreApp] {
                  apps.sorted { ($0.downloads_count ?? 0) > ($1.downloads_count ?? 0) }
              }

              func load() async {
                  loading = true
                  error = nil
                  do { apps = try await PanelClient.shared.fetchApps() }
                  catch { self.error = "تعذّر تحميل التطبيقات من لوحة التحكم." }
                  loading = false
              }
          }

          struct RemoteIcon: View {
              let url: String?
              var size: CGFloat = 60
              var body: some View {
                  AsyncImage(url: URL(string: url ?? "")) { phase in
                      switch phase {
                      case .success(let image):
                          image.resizable().scaledToFill()
                      default:
                          Palette.bgSoft
                      }
                  }
                  .frame(width: size, height: size)
                  .clipShape(RoundedRectangle(cornerRadius: size * 0.24, style: .continuous))
                  .overlay(
                      RoundedRectangle(cornerRadius: size * 0.24, style: .continuous)
                          .stroke(Palette.stroke, lineWidth: 1)
                  )
              }
          }
          SWIFT

      - name: Generate code - StoreViews.swift
        run: |
          cat > Sources/StoreViews.swift << 'SWIFT'
          import SwiftUI

          struct StoreRootView: View {
              @StateObject private var model = StoreViewModel.shared

              var body: some View {
                  TabView {
                      NavigationStack { HomeView(model: model) }
                          .tabItem { Label("الرئيسية", systemImage: "house.fill") }
                      NavigationStack { AppsListView(model: model, title: "كل التطبيقات", apps: model.apps) }
                          .tabItem { Label("التطبيقات", systemImage: "square.grid.2x2.fill") }
                      NavigationStack { SearchView(model: model) }
                          .tabItem { Label("بحث", systemImage: "magnifyingglass") }
                      NavigationStack { AccountView() }
                          .tabItem { Label("حسابي", systemImage: "person.crop.circle") }
                  }
                  .tint(Palette.emerald)
                  .environment(\.layoutDirection, .rightToLeft)
                  .task { await model.load() }
              }
          }

          struct HomeView: View {
              @ObservedObject var model: StoreViewModel

              var body: some View {
                  ZStack {
                      AppBackground()
                      ScrollView {
                          VStack(alignment: .trailing, spacing: 22) {
                              HStack {
                                  GoldTitle(text: "ONEs", size: 32)
                                  Spacer()
                                  Text("متجر التطبيقات")
                                      .font(.subheadline)
                                      .foregroundStyle(Palette.textSoft)
                              }

                              // ===== الأكثر تحميلاً كنص قابل للضغط =====
                              NavigationLink {
                                  TopDownloadsView(model: model)
                              } label: {
                                  HStack {
                                      Image(systemName: "chevron.left")
                                          .font(.caption.weight(.bold))
                                          .foregroundStyle(Palette.gold)
                                      Spacer()
                                      Text("التطبيقات الأكثر تحميلاً")
                                          .font(.headline)
                                          .foregroundStyle(Palette.gold)
                                      Image(systemName: "flame.fill")
                                          .foregroundStyle(Palette.gold)
                                  }
                                  .padding(16)
                                  .frame(maxWidth: .infinity)
                                  .premiumCard()
                              }

                              if !model.featured.isEmpty {
                                  sectionTitle("مميزة")
                                  ScrollView(.horizontal, showsIndicators: false) {
                                      HStack(spacing: 14) {
                                          ForEach(model.featured) { app in
                                              NavigationLink { AppDetailView(app: app) } label: {
                                                  VStack(spacing: 10) {
                                                      RemoteIcon(url: app.icon_url, size: 92)
                                                      Text(app.name)
                                                          .font(.caption.weight(.semibold))
                                                          .foregroundStyle(Palette.textMain)
                                                          .lineLimit(1)
                                                  }
                                                  .frame(width: 110)
                                              }
                                          }
                                      }
                                  }
                              }

                              sectionTitle("أحدث الإضافات")
                              VStack(spacing: 12) {
                                  ForEach(model.apps.prefix(12)) { app in
                                      NavigationLink { AppDetailView(app: app) } label: { AppRow(app: app) }
                                  }
                              }

                              if model.loading { ProgressView().tint(Palette.emerald) }
                              if let error = model.error {
                                  Text(error).font(.footnote).foregroundStyle(.red)
                              }
                          }
                          .padding(18)
                      }
                      .refreshable { await model.load() }
                  }
                  .navigationBarTitleDisplayMode(.inline)
              }

              private func sectionTitle(_ text: String) -> some View {
                  Text(text)
                      .font(.title3.weight(.bold))
                      .foregroundStyle(Palette.textMain)
                      .frame(maxWidth: .infinity, alignment: .trailing)
              }
          }

          struct TopDownloadsView: View {
              @ObservedObject var model: StoreViewModel

              var body: some View {
                  ZStack {
                      AppBackground()
                      ScrollView {
                          VStack(spacing: 12) {
                              ForEach(Array(model.topDownloads.enumerated()), id: \.element.id) { index, app in
                                  NavigationLink { AppDetailView(app: app) } label: {
                                      HStack(spacing: 12) {
                                          AppRow(app: app)
                                          Text("\(index + 1)")
                                              .font(.title3.weight(.black))
                                              .foregroundStyle(Palette.gold)
                                              .frame(width: 30)
                                      }
                                  }
                              }
                          }
                          .padding(18)
                      }
                  }
                  .navigationTitle("الأكثر تحميلاً")
                  .navigationBarTitleDisplayMode(.inline)
              }
          }

          struct AppRow: View {
              let app: StoreApp
              var body: some View {
                  HStack(spacing: 12) {
                      Spacer(minLength: 0)
                      VStack(alignment: .trailing, spacing: 4) {
                          Text(app.name)
                              .font(.headline)
                              .foregroundStyle(Palette.textMain)
                              .lineLimit(1)
                          Text("\(app.category ?? "apps") · \(app.downloads_count ?? 0) تحميل")
                              .font(.caption2)
                              .foregroundStyle(Palette.textSoft)
                      }
                      RemoteIcon(url: app.icon_url, size: 58)
                  }
                  .padding(12)
                  .frame(maxWidth: .infinity)
                  .premiumCard()
              }
          }

          struct AppsListView: View {
              @ObservedObject var model: StoreViewModel
              let title: String
              let apps: [StoreApp]

              var body: some View {
                  ZStack {
                      AppBackground()
                      ScrollView {
                          VStack(spacing: 12) {
                              ForEach(apps) { app in
                                  NavigationLink { AppDetailView(app: app) } label: { AppRow(app: app) }
                              }
                          }
                          .padding(18)
                      }
                      .refreshable { await model.load() }
                  }
                  .navigationTitle(title)
                  .navigationBarTitleDisplayMode(.inline)
              }
          }

          struct SearchView: View {
              @ObservedObject var model: StoreViewModel
              @State private var query = ""

              private var results: [StoreApp] {
                  guard !query.isEmpty else { return model.apps }
                  return model.apps.filter { $0.name.localizedCaseInsensitiveContains(query) }
              }

              var body: some View {
                  ZStack {
                      AppBackground()
                      ScrollView {
                          VStack(spacing: 12) {
                              TextField("ابحث عن تطبيق", text: $query)
                                  .padding(14)
                                  .background(Palette.card)
                                  .clipShape(RoundedRectangle(cornerRadius: 14))
                                  .foregroundStyle(Palette.textMain)
                              ForEach(results) { app in
                                  NavigationLink { AppDetailView(app: app) } label: { AppRow(app: app) }
                              }
                          }
                          .padding(18)
                      }
                  }
                  .navigationTitle("بحث")
                  .navigationBarTitleDisplayMode(.inline)
              }
          }

          struct AppDetailView: View {
              let app: StoreApp
              @ObservedObject private var manager = ActivationManager.shared
              @State private var working = false
              @State private var note: String?

              var body: some View {
                  ZStack {
                      AppBackground()
                      ScrollView {
                          VStack(alignment: .trailing, spacing: 18) {
                              HStack(alignment: .top, spacing: 14) {
                                  Spacer(minLength: 0)
                                  VStack(alignment: .trailing, spacing: 6) {
                                      Text(app.name).font(.title2.weight(.bold))
                                          .foregroundStyle(Palette.textMain)
                                      Text(app.developer ?? "ONEs Store")
                                          .font(.caption).foregroundStyle(Palette.textSoft)
                                      Text("v\(app.version ?? "1.0") · \(Int(app.size_mb ?? 0)) MB")
                                          .font(.caption2).foregroundStyle(Palette.textSoft)
                                  }
                                  RemoteIcon(url: app.icon_url, size: 92)
                              }

                              Button {
                                  Task { await install() }
                              } label: {
                                  HStack {
                                      if working { ProgressView().tint(.black) }
                                      Text(working ? "جارٍ التثبيت…" : "تثبيت")
                                  }
                                  .font(.headline)
                                  .frame(maxWidth: .infinity)
                                  .padding(.vertical, 14)
                                  .background(
                                      LinearGradient(colors: [Palette.emerald, Palette.emerald.opacity(0.75)],
                                                     startPoint: .leading, endPoint: .trailing)
                                  )
                                  .foregroundStyle(Color.black)
                                  .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))
                              }
                              .disabled(working)

                              if let note {
                                  Text(note).font(.footnote).foregroundStyle(Palette.gold)
                              }

                              if let description = app.description, !description.isEmpty {
                                  Text(description)
                                      .font(.callout)
                                      .foregroundStyle(Palette.textSoft)
                                      .multilineTextAlignment(.trailing)
                                      .frame(maxWidth: .infinity, alignment: .trailing)
                              }
                          }
                          .padding(18)
                      }
                  }
                  .navigationBarTitleDisplayMode(.inline)
              }

              private func install() async {
                  working = true
                  note = nil
                  do {
                      let result = try await PanelClient.shared.requestDownload(appId: app.id,
                                                                                udid: manager.udid)
                      if let link = result.download_url, let url = URL(string: link) {
                          await UIApplication.shared.open(url)
                          note = "تم إرسال طلب التثبيت الموقّع من لوحة التحكم."
                      } else {
                          note = "رابط التثبيت غير متوفر."
                      }
                  } catch {
                      note = error.localizedDescription
                  }
                  working = false
              }
          }

          struct AccountView: View {
              @ObservedObject private var manager = ActivationManager.shared

              var body: some View {
                  ZStack {
                      AppBackground()
                      ScrollView {
                          VStack(alignment: .trailing, spacing: 16) {
                              VStack(alignment: .trailing, spacing: 8) {
                                  Text("حالة الاشتراك").font(.headline)
                                      .foregroundStyle(Palette.textMain)
                                  Text(manager.isActive ? "مفعّل — يتبقى \(manager.remainingDays) يوم" : "غير مفعّل")
                                      .font(.subheadline)
                                      .foregroundStyle(manager.isActive ? Palette.emerald : .red)
                                  Text("الكود: \(manager.code)")
                                      .font(.caption).foregroundStyle(Palette.textSoft)
                                  Text("UDID: \(manager.udid)")
                                      .font(.system(.caption2, design: .monospaced))
                                      .environment(\.layoutDirection, .leftToRight)
                                      .foregroundStyle(Palette.textSoft)
                              }
                              .padding(18)
                              .frame(maxWidth: .infinity)
                              .premiumCard()

                              Button("تحديث الحالة") { Task { await manager.refreshStatus() } }
                                  .foregroundStyle(Palette.gold)
                              Button("تسجيل الخروج من الاشتراك") { manager.reset() }
                                  .foregroundStyle(.red)
                          }
                          .padding(18)
                      }
                  }
                  .navigationTitle("حسابي")
                  .navigationBarTitleDisplayMode(.inline)
              }
          }
          SWIFT

      - name: Generate code - ONEsApp.swift
        run: |
          cat > Sources/ONEsApp.swift << 'SWIFT'
          import SwiftUI

          @main
          struct ONEsApp: App {
              @ObservedObject private var manager = ActivationManager.shared

              var body: some Scene {
                  WindowGroup {
                      ActivationGate {
                          StoreRootView()
                      }
                      .preferredColorScheme(.dark)
                      .onOpenURL { url in manager.handleCallback(url: url) }
                      .task { await manager.refreshStatus() }
                  }
              }
          }
          SWIFT

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build the app
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/Payload/ONEs.app
          swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios15.0 \
            -O -whole-module-optimization \
            -framework SwiftUI -framework UIKit -framework Foundation \
            -o build/Payload/ONEs.app/ONEs \
            Sources/*.swift
          echo "build finished"

      - name: Create IPA package
        run: |
          set -e
          cp Info.plist build/Payload/ONEs.app/Info.plist
          cp Resources/AppIcon1024.png build/Payload/ONEs.app/AppIcon60x60.png 2>/dev/null || true
          cp Resources/*.png build/Payload/ONEs.app/ 2>/dev/null || true
          cp Resources/*.gif build/Payload/ONEs.app/ 2>/dev/null || true
          cd build
          zip -qry ONEs.ipa Payload
          ls -lh ONEs.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONEs-Store-ipa
          path: build/ONEs.ipa
          retention-days: 30

      - name: Summary
        run: |
          echo "## ONEs Store" >> $GITHUB_STEP_SUMMARY
          echo "- لوحة التحكم: $PANEL_BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- التطبيقات، الأكواد، الشهادات، وUDID تُدار بالكامل من لوحة التحكم." >> $GITHUB_STEP_SUMMARY
          echo "- تمت إزالة المنتدى والستوريات والإشعارات وكل السيرفرات القديمة." >> $GITHUB_STEP_SUMMARY
