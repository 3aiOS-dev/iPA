          public struct WalletTransaction: Codable, Identifiable, Hashable {
              public let id: UUID
              public let kind: Kind
              public let currency: WalletCurrency
              public let amount: Double
              public let counterparty: String?
              public let note: String?
              public let createdAt: Date
              public let txid: String?
          
              public enum Kind: String, Codable {
                  case topUp, send, receive, referral, refund, fee
              }
          
              public init(kind: WalletTransaction.Kind,
                          currency: WalletCurrency,
                          amount: Double,
                          counterparty: String? = nil,
                          note: String? = nil,
                          txid: String? = nil) {
                  self.id = UUID()
                  self.kind = kind
                  self.currency = currency
                  self.amount = amount
                  self.counterparty = counterparty
                  self.note = note
                  self.txid = txid
                  self.createdAt = Date()
              }
          }
          
          @MainActor
          public final class WalletStore: ObservableObject {
              public static let shared = MainActor.assumeIsolated { WalletStore() }
          
              @Published public private(set) var balance: Double = 0
              @Published public private(set) var pendingIncoming: Double = 0
              @Published public private(set) var transactions: [WalletTransaction] = []
              @Published public var lastError: String?
              @Published public private(set) var isProcessing: Bool = false
          
              private let keyBalance = "wallet.balance"
              private let keyTx = "wallet.transactions.v2"
              private let defaultUserDefaults = UserDefaults.standard
          
              private init() { load() }
          
              public func resetForLogout() {
                  balance = 0
                  pendingIncoming = 0
                  transactions = []
                  defaultUserDefaults.removeObject(forKey: keyBalance)
                  defaultUserDefaults.removeObject(forKey: keyTx)
              }
          
              public func load() {
                  balance = defaultUserDefaults.double(forKey: keyBalance)
                  if let data = defaultUserDefaults.data(forKey: keyTx),
                     let decoded = try? JSONDecoder().decode([WalletTransaction].self, from: data) {
                      transactions = decoded.sorted(by: { $0.createdAt > $1.createdAt })
                  }
              }
          
              public func save() {
                  defaultUserDefaults.set(balance, forKey: keyBalance)
                  if let data = try? JSONEncoder().encode(transactions) {
                      defaultUserDefaults.set(data, forKey: keyTx)
                  }
              }
          
              public func credit(_ amount: Double, currency: WalletCurrency = .usd,
                                 counterparty: String? = nil, note: String? = nil,
                                 kind: WalletTransaction.Kind = .topUp,
                                 txid: String? = nil) {
                  guard amount > 0 else { return }
                  balance += amount
                  let tx = WalletTransaction(kind: kind, currency: currency,
                                             amount: amount,
                                             counterparty: counterparty,
                                             note: note, txid: txid)
                  transactions.insert(tx, at: 0)
                  save()
              }
          
              public func debit(_ amount: Double, currency: WalletCurrency = .usd,
                                counterparty: String? = nil, note: String? = nil) -> Bool {
                  guard amount > 0 else { return false }
                  guard balance >= amount else {
                      lastError = "Insufficient wallet balance"
                      return false
                  }
                  balance -= amount
                  let tx = WalletTransaction(kind: .send, currency: currency,
                                             amount: -amount,
                                             counterparty: counterparty,
                                             note: note)
                  transactions.insert(tx, at: 0)
                  save()
                  return true
              }
          
              public func send(to username: String, amount: Double) -> Bool {
                  guard amount > 0 else { return false }
                  if !debit(amount, currency: .usd, counterparty: username, note: "P2P transfer") {
                      return false
                  }
                  HapticManager.shared.notification(.success)
                  return true
              }
          
              public func requestFrom(_ username: String, amount: Double) {
                  pendingIncoming += amount
                  let tx = WalletTransaction(kind: .receive, currency: .usd,
                                             amount: amount,
                                             counterparty: username,
                                             note: "Pending request")
                  transactions.insert(tx, at: 0)
                  save()
              }
          
              public func topUp(method: String, amount: Double, currency: WalletCurrency,
                                txid: String? = nil) {
                  credit(amount, currency: currency, counterparty: method,
                         note: "Top-up via \(method)", kind: .topUp, txid: txid)
                  HapticManager.shared.notification(.success)
              }
          
              public func recordReferralReward(usd amount: Double, from username: String) {
                  credit(amount, currency: .usd, counterparty: username,
                         note: "Referral reward", kind: .referral)
                  HapticManager.shared.notification(.success)
              }
          }
          
