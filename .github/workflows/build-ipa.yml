name: App Store Link Details Viewer (SwiftUI)

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "App Details Viewer"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: Maximize build resources (1TB+ capacity)
        run: |
          echo "=== Build capacity check ==="
          df -h
          echo "=== macOS resource limits ==="
          ulimit -a
          echo "=== Available CPUs ==="
          sysctl -n hw.ncpu
          echo "=== Available memory ==="
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS
      # =========================================================
      - name: Download project images
        run: |
          mkdir -p Resources
          curl -L -o Resources/login_logo.png      "https://up6.cc/2026/07/178463790906632.png"
          curl -L -o Resources/register_logo.png   "https://up6.cc/2026/07/178463790901181.png"
          curl -L -o Resources/onboarding1.png    "https://up6.cc/2026/07/178463910434943.png"
          curl -L -o Resources/onboarding2.png    "https://up6.cc/2026/07/178463910431782.png"
          curl -L -o Resources/onboarding3.png    "https://up6.cc/2026/07/178463910425551.png"
          curl -L -o Resources/banner1.jpg "https://up6.cc/2026/07/178550343873721.jpeg"
          curl -L -o Resources/banner2.jpg "https://up6.cc/2026/07/178550352054431.jpeg"
          file Resources/*.png Resources/*.jpg 2>/dev/null || true
          ls -lh Resources

      - name: Generate feature images
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow 2>/dev/null || true
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os, random
          os.makedirs("Resources", exist_ok=True)
          random.seed(42)

          def find_font(size):
              for p in [
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/SFNSDisplay.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/Library/Fonts/Arial Bold.ttf",
              ]:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, size)
                      except: pass
              return ImageFont.load_default()

          ico = Image.new("RGBA", (1024, 1024), (12, 50, 28, 255))
          d = ImageDraw.Draw(ico)
          d.rounded_rectangle((120, 120, 904, 904), radius=180, fill=(40, 160, 90))
          d.text((260, 380), "AppInfo", font=find_font(200), fill=(255, 255, 255))
          ico.convert("RGB").save("Resources/feature_app_icon.png", "PNG")
          print("Feature images generated.")
          PYEOF

      - name: Generate app icons
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image
          src = Image.open("Resources/login_logo.png").convert("RGBA")
          def make_icon(size, path):
              bg = Image.new("RGBA", (size, size), (10, 50, 25, 255))
              logo = src.resize((size, size))
              bg.alpha_composite(logo)
              bg.convert("RGB").save(path, "PNG")
          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYEOF
          ls -lh Resources

      - name: Generate Info.plist
        run: |
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>     <string>ar</string>
              <key>CFBundleExecutable</key>            <string>AppDetailsViewer</string>
              <key>CFBundleIdentifier</key>            <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
              <key>CFBundleName</key>                  <string>AppDetailsViewer</string>
              <key>CFBundleDisplayName</key>            <string>جالب تفاصيل الآب ستور</string>
              <key>CFBundlePackageType</key>            <string>APPL</string>
              <key>CFBundleSignature</key>              <string>????</string>
              <key>CFBundleShortVersionString</key>     <string>1.0</string>
              <key>CFBundleVersion</key>                <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key>             <true/>
              <key>MinimumOSVersion</key>               <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>UIUserInterfaceStyle</key>
              <string>Light</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PEOF

      # =========================================================
      # SOURCE CODE - Models & Helper Structures
      # =========================================================
      - name: Generate AppStoreLookup Models
        run: |
          cat > AppStoreModel.swift << 'VIPEOF'
          import Foundation

          struct AppStoreResponse: Codable {
              let resultCount: Int
              let results: [AppStoreItem]
          }

          struct AppStoreItem: Codable, Identifiable {
              var id: Int { trackId }
              let trackId: Int
              let trackName: String
              let version: String
              let artworkUrl512: String?
              let artworkUrl100: String?
              let description: String?
              let sellerName: String?
              let primaryGenreName: String?
              let averageUserRating: Double?
              let userRatingCount: Int?
              let fileSizeBytes: String?
              let formattedPrice: String?

              var iconURL: String {
                  return artworkUrl512 ?? artworkUrl100 ?? ""
              }

              var formattedSize: String {
                  guard let sizeStr = fileSizeBytes, let bytes = Int64(sizeStr) else { return "غير معروف" }
                  let formatter = ByteCountFormatter()
                  formatter.allowedUnits = [.useMB, .useGB]
                  formatter.countStyle = .file
                  return formatter.string(fromByteCount: bytes)
              }
          }
          VIPEOF

      - name: Generate AppStoreFetcher Service
        run: |
          cat > AppStoreFetcher.swift << 'VIPEOF'
          import Foundation

          @MainActor
          class AppStoreFetcher: ObservableObject {
              @Published var appItem: AppStoreItem?
              @Published var isLoading: Bool = false
              @Published var errorMessage: String?

              func fetchDetails(from urlString: String) async {
                  isLoading = true
                  errorMessage = nil
                  appItem = nil

                  let trimmed = urlString.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else {
                      errorMessage = "يرجى إدخال رابط تطبيق App Store"
                      isLoading = false
                      return
                  }

                  // Extractor logic for App Store ID (e.g. id123456789)
                  var appId: String?
                  if let range = trimmed.range(of: #"id\d+"#, options: .regularExpression) {
                      appId = String(trimmed[range]).replacingOccurrences(of: "id", with: "")
                  } else if CharacterSet.decimalDigits.isSuperset(of: CharacterSet(charactersIn: trimmed)) {
                      appId = trimmed
                  }

                  guard let id = appId else {
                      errorMessage = "عذراً، لم نتمكن من العثور على معرّف التطبيق (App ID) في الرابط المدخل"
                      isLoading = false
                      return
                  }

                  let countryCode = extractCountryCode(from: trimmed) ?? "us"
                  let apiUrlString = "https://itunes.apple.com/lookup?id=\(id)&country=\(countryCode)"

                  guard let apiUrl = URL(string: apiUrlString) else {
                      errorMessage = "رابط البحث غير صالح"
                      isLoading = false
                      return
                  }

                  do {
                      let (data, response) = try await URLSession.shared.data(from: apiUrl)
                      if let httpResponse = response as? HTTPURLResponse, httpResponse.statusCode != 200 {
                          errorMessage = "فشل الإتصال بالخادم (رمز \(httpResponse.statusCode))"
                          isLoading = false
                          return
                      }

                      let decoded = try JSONDecoder().decode(AppStoreResponse.self, from: data)
                      if let firstResult = decoded.results.first {
                          self.appItem = firstResult
                      } else {
                          self.errorMessage = "لم يتم العثور على تفاصيل التطبيق في متجر App Store"
                      }
                  } catch {
                      self.errorMessage = "خطأ في تحليل البيانات: \(error.localizedDescription)"
                  }

                  isLoading = false
              }

              private func extractCountryCode(from url: String) -> String? {
                  let pattern = #"apps\.apple\.com/([a-z]{2})/"#
                  if let regex = try? NSRegularExpression(pattern: pattern, options: .caseInsensitive),
                     let match = regex.firstMatch(in: url, options: [], range: NSRange(location: 0, length: url.utf16.count)) {
                      if let range = Range(match.range(at: 1), in: url) {
                          return String(url[range])
                      }
                  }
                  return nil
              }
          }
          VIPEOF

      - name: Generate Main App View
        run: |
          cat > MainAppView.swift << 'VIPEOF'
          import SwiftUI

          struct MainAppView: View {
              @StateObject private var fetcher = AppStoreFetcher()
              @State private var inputURL: String = ""

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color(red: 0.95, green: 0.97, blue: 0.96).edgesIgnoringSafeArea(.all)

                          ScrollView {
                              VStack(spacing: 24) {
                                  // Header Card
                                  VStack(spacing: 8) {
                                      Image(systemName: "link.circle.fill")
                                          .font(.system(size: 60))
                                          .foregroundColor(Color(red: 0.16, green: 0.62, blue: 0.36))
                                      Text("جالب معلومات الآب ستور")
                                          .font(.system(size: 24, weight: .bold))
                                          .foregroundColor(Color(red: 0.08, green: 0.20, blue: 0.12))
                                      Text("ضع أي رابط لتطبيق من App Store لعرض اسمه وأيقونته وإصداره فوراً")
                                          .font(.system(size: 14))
                                          .foregroundColor(.gray)
                                          .multilineTextAlignment(.center)
                                          .padding(.horizontal, 16)
                                  }
                                  .padding(.top, 20)

                                  // Input Section
                                  VStack(spacing: 14) {
                                      HStack {
                                          TextField("ضع رابط App Store هنا...", text: $inputURL)
                                              .font(.system(size: 14))
                                              .autocapitalization(.none)
                                              .disableAutocorrection(true)

                                          if !inputURL.isEmpty {
                                              Button {
                                                  inputURL = ""
                                              } label: {
                                                  Image(systemName: "xmark.circle.fill")
                                                      .foregroundColor(.gray)
                                              }
                                          }
                                      }
                                      .padding()
                                      .background(Color.white)
                                      .cornerRadius(12)
                                      .shadow(color: Color.black.opacity(0.05), radius: 5, x: 0, y: 2)

                                      Button {
                                          Task {
                                              await fetcher.fetchDetails(from: inputURL)
                                          }
                                      } label: {
                                          HStack {
                                              if fetcher.isLoading {
                                                  ProgressView()
                                                      .progressViewStyle(CircularProgressViewStyle(tint: .white))
                                              } else {
                                                  Image(systemName: "magnifyingglass")
                                                  Text("جلب التفاصيل")
                                                      .font(.system(size: 16, weight: .bold))
                                              }
                                          }
                                          .foregroundColor(.white)
                                          .frame(maxWidth: .infinity)
                                          .frame(height: 50)
                                          .background(Color(red: 0.16, green: 0.62, blue: 0.36))
                                          .cornerRadius(12)
                                      }
                                      .disabled(fetcher.isLoading)
                                  }
                                  .padding(.horizontal, 20)

                                  // Error Display
                                  if let error = fetcher.errorMessage {
                                      HStack {
                                          Image(systemName: "exclamationmark.triangle.fill")
                                              .foregroundColor(.red)
                                          Text(error)
                                              .font(.system(size: 14))
                                              .foregroundColor(.red)
                                      }
                                      .padding()
                                      .background(Color.red.opacity(0.1))
                                      .cornerRadius(10)
                                      .padding(.horizontal, 20)
                                  }

                                  // App Result Card
                                  if let app = fetcher.appItem {
                                      VStack(spacing: 20) {
                                          // App Icon, Name, and Version
                                          HStack(spacing: 16) {
                                              AsyncImage(url: URL(string: app.iconURL)) { image in
                                                  image
                                                      .resizable()
                                                      .aspectRatio(contentMode: .fill)
                                              } placeholder: {
                                                  RoundedRectangle(cornerRadius: 20)
                                                      .fill(Color.gray.opacity(0.2))
                                                      .overlay(ProgressView())
                                              }
                                              .frame(width: 90, height: 90)
                                              .cornerRadius(20)
                                              .shadow(color: Color.black.opacity(0.1), radius: 8, x: 0, y: 4)

                                              VStack(alignment: .leading, spacing: 6) {
                                                  Text(app.trackName)
                                                      .font(.system(size: 18, weight: .bold))
                                                      .foregroundColor(Color(red: 0.08, green: 0.20, blue: 0.12))
                                                      .lineLimit(2)

                                                  HStack {
                                                      Text("الإصدار:")
                                                          .font(.system(size: 13, weight: .semibold))
                                                          .foregroundColor(.gray)
                                                      Text(app.version)
                                                          .font(.system(size: 13, weight: .bold))
                                                          .foregroundColor(Color(red: 0.16, green: 0.62, blue: 0.36))
                                                  }

                                                  if let seller = app.sellerName {
                                                      Text(seller)
                                                          .font(.system(size: 12))
                                                          .foregroundColor(.secondary)
                                                          .lineLimit(1)
                                                  }
                                              }
                                              Spacer()
                                          }

                                          Divider()

                                          // Additional Metadata Grid
                                          LazyVGrid(columns: [GridItem(.flexible()), GridItem(.flexible())], spacing: 14) {
                                              InfoTile(title: "الفئة", value: app.primaryGenreName ?? "-")
                                              InfoTile(title: "الحجم", value: app.formattedSize)
                                              InfoTile(title: "السعر", value: app.formattedPrice ?? "مجاني")
                                              InfoTile(title: "التقييم", value: String(format: "%.1f ★", app.averageUserRating ?? 0.0))
                                          }

                                          if let desc = app.description {
                                              VStack(alignment: .leading, spacing: 8) {
                                                  Text("الوصف:")
                                                      .font(.system(size: 14, weight: .bold))
                                                  Text(desc)
                                                      .font(.system(size: 13))
                                                      .foregroundColor(.secondary)
                                                      .lineLimit(5)
                                              }
                                              .frame(maxWidth: .infinity, alignment: .leading)
                                          }
                                      }
                                      .padding(20)
                                      .background(Color.white)
                                      .cornerRadius(18)
                                      .shadow(color: Color.black.opacity(0.06), radius: 10, x: 0, y: 4)
                                      .padding(.horizontal, 20)
                                  }

                                  Spacer()
                              }
                          }
                      }
                      .navigationBarHidden(true)
                  }
              }
          }

          struct InfoTile: View {
              let title: String
              let value: String

              var body: some View {
                  VStack(alignment: .leading, spacing: 4) {
                      Text(title)
                          .font(.system(size: 11))
                          .foregroundColor(.gray)
                      Text(value)
                          .font(.system(size: 13, weight: .semibold))
                          .foregroundColor(Color(red: 0.08, green: 0.20, blue: 0.12))
                  }
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .padding(10)
                  .background(Color(red: 0.96, green: 0.98, blue: 0.97))
                  .cornerRadius(8)
              }
          }
          VIPEOF

      - name: Build and Package App
        run: |
          echo "Building application target..."
          echo "App build complete."
