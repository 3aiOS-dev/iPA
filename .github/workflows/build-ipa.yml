      - name: Generate AnimeParticles.swift
        run: |
          cat > AnimeParticles.swift << 'SWIFTEOF'
          import SwiftUI

          struct AnimeParticleOverlay: View {
              @EnvironmentObject var themeManager: ThemeManager
              let particleCount = 30

              var body: some View {
                  TimelineView(.animation(minimumInterval: 0.016, paused: false)) { timeline in
                      Canvas { context, size in
                          let t = timeline.date.timeIntervalSinceReferenceDate
                          let colors = themeManager.currentTheme.particleColors

                          for i in 0..<particleCount {
                              let progress = Double(i) / Double(particleCount)
                              let x = size.width * CGFloat(sin(t * 0.5 + progress * 6.28) * 0.4 + 0.5)
                              let y = size.height * CGFloat(cos(t * 0.3 + progress * 4.71) * 0.4 + 0.5)
                              let radius = CGFloat(2 + sin(t * 2 + progress * 10) * 1.5)
                              let color = colors[i % colors.count]
                              let alpha = 0.3 + 0.2 * sin(t * 3 + progress * 10)

                              var path = Path()
                              path.addEllipse(in: CGRect(x: x - radius, y: y - radius, width: radius * 2, height: radius * 2))
                              context.fill(path, with: .color(color.opacity(alpha)))
                          }
                      }
                  }
              }
          }

          struct AnimeBackgroundView: View {
              @EnvironmentObject var themeManager: ThemeManager
              @State private var phase = 0.0

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          // Base gradient
                          themeManager.currentTheme.backgroundGradient

                          // Animated mesh gradient effect
                          Canvas { context, size in
                              let colors = themeManager.currentTheme.particleColors
                              for i in 0..<3 {
                                  let x = size.width * CGFloat(sin(phase + Double(i) * 2.0) * 0.3 + 0.5)
                                  let y = size.height * CGFloat(cos(phase * 0.7 + Double(i) * 1.5) * 0.3 + 0.5)
                                  let radius = min(size.width, size.height) * 0.6
                                  var path = Path()
                                  path.addEllipse(in: CGRect(x: x - radius/2, y: y - radius/2, width: radius, height: radius))
                                  context.fill(path, with: .color(colors[i].opacity(0.08)))
                              }
                          }
                          .blur(radius: 60)

                          // Grid lines (cyberpunk style)
                          if themeManager.currentTheme == .cyberpunk {
                              Canvas { context, size in
                                  let gridSize: CGFloat = 40
                                  var path = Path()
                                  for x in stride(from: 0, to: size.width, by: gridSize) {
                                      path.move(to: CGPoint(x: x, y: 0))
                                      path.addLine(to: CGPoint(x: x, y: size.height))
                                  }
                                  for y in stride(from: 0, to: size.height, by: gridSize) {
                                      path.move(to: CGPoint(x: 0, y: y))
                                      path.addLine(to: CGPoint(x: size.width, y: y))
                                  }
                                  context.stroke(path, with: .color(Color(hex: "00f0ff").opacity(0.03)), lineWidth: 0.5)
                              }
                          }
                      }
                  }
                  .onAppear {
                      withAnimation(.linear(duration: 20).repeatForever(autoreverses: false)) {
                          phase = 6.28
                      }
                  }
              }
          }
          SWIFTEOF

      - name: Generate QRScanner.swift
        run: |
          cat > QRScanner.swift << 'SWIFTEOF'
          import SwiftUI
          import AVFoundation

          struct QRScannerView: UIViewControllerRepresentable {
              var onScan: (String) -> Void
              @Environment(\.dismiss) var dismiss

              func makeUIViewController(context: Context) -> QRScannerVC {
                  let vc = QRScannerVC()
                  vc.onScan = { code in
                      onScan(code)
                      dismiss()
                  }
                  return vc
              }

              func updateUIViewController(_ uiViewController: QRScannerVC, context: Context) {}
          }

          class QRScannerVC: UIViewController, AVCaptureMetadataOutputObjectsDelegate {
              var onScan: ((String) -> Void)?
              var captureSession: AVCaptureSession!
              var previewLayer: AVCaptureVideoPreviewLayer!

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .black
                  captureSession = AVCaptureSession()

                  guard let videoCaptureDevice = AVCaptureDevice.default(for: .video) else { return }
                  let videoInput: AVCaptureDeviceInput
                  do { videoInput = try AVCaptureDeviceInput(device: videoCaptureDevice) }
                  catch { return }

                  if captureSession.canAddInput(videoInput) { captureSession.addInput(videoInput) }
                  else { return }

                  let metadataOutput = AVCaptureMetadataOutput()
                  if captureSession.canAddOutput(metadataOutput) {
                      captureSession.addOutput(metadataOutput)
                      metadataOutput.setMetadataObjectsDelegate(self, queue: DispatchQueue.main)
                      metadataOutput.metadataObjectTypes = [.qr]
                  }

                  previewLayer = AVCaptureVideoPreviewLayer(session: captureSession)
                  previewLayer.frame = view.layer.bounds
                  previewLayer.videoGravity = .resizeAspectFill
                  view.layer.addSublayer(previewLayer)

                  // Anime overlay
                  let overlay = createAnimeOverlay(frame: view.bounds)
                  view.addSubview(overlay)

                  captureSession.startRunning()
              }

              func createAnimeOverlay(frame: CGRect) -> UIView {
                  let v = UIView(frame: frame)
                  v.backgroundColor = .clear
                  let scanArea = CGRect(x: frame.midX - 125, y: frame.midY - 125, width: 250, height: 250)

                  // Corner brackets
                  let bracketColor = UIColor(Color(hex: "00f0ff")).cgColor
                  let bracketLayer = CAShapeLayer()
                  let path = UIBezierPath()
                  let cornerLength: CGFloat = 30
                  let corners = [
                      (scanArea.minX, scanArea.minY, 1, 1),
                      (scanArea.maxX, scanArea.minY, -1, 1),
                      (scanArea.minX, scanArea.maxY, 1, -1),
                      (scanArea.maxX, scanArea.maxY, -1, -1)
                  ]
                  for (cx, cy, dx, dy) in corners {
                      path.move(to: CGPoint(x: cx + CGFloat(dx) * cornerLength, y: cy))
                      path.addLine(to: CGPoint(x: cx, y: cy))
                      path.addLine(to: CGPoint(x: cx, y: cy + CGFloat(dy) * cornerLength))
                  }
                  bracketLayer.path = path.cgPath
                  bracketLayer.strokeColor = bracketColor
                  bracketLayer.lineWidth = 4
                  bracketLayer.fillColor = UIColor.clear.cgColor
                  v.layer.addSublayer(bracketLayer)

                  // Scan line animation
                  let scanLine = CALayer()
                  scanLine.frame = CGRect(x: scanArea.minX, y: scanArea.minY, width: scanArea.width, height: 2)
                  scanLine.backgroundColor = UIColor(Color(hex: "ff00aa")).cgColor
                  scanLine.shadowColor = UIColor(Color(hex: "ff00aa")).cgColor
                  scanLine.shadowRadius = 10
                  scanLine.shadowOpacity = 1
                  v.layer.addSublayer(scanLine)

                  let anim = CABasicAnimation(keyPath: "position.y")
                  anim.fromValue = scanArea.minY
                  anim.toValue = scanArea.maxY
                  anim.duration = 2
                  anim.repeatCount = .infinity
                  anim.autoreverses = true
                  scanLine.add(anim, forKey: "scan")

                  return v
              }

              func metadataOutput(_ output: AVCaptureMetadataOutput, didOutput metadataObjects: [AVMetadataObject], from connection: AVCaptureConnection) {
                  if let object = metadataObjects.first as? AVMetadataMachineReadableCodeObject,
                     let stringValue = object.stringValue {
                      captureSession.stopRunning()
                      AudioServicesPlaySystemSound(kSystemSoundID_Vibrate)
                      onScan?(stringValue)
                  }
              }

              override func viewWillDisappear(_ animated: Bool) {
                  super.viewWillDisappear(animated)
                  if captureSession?.isRunning == true { captureSession.stopRunning() }
              }
          }
          SWIFTEOF

