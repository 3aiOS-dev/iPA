          // MARK: - Source Apps Loader (يجلب JSON ويعرض تطبيقات المصدر)
          struct SourceAppsLoader: View {
              let urlString: String
              @State private var apps: [AppItem] = []
              @State private var sourceName: String = ""
              @State private var isLoading = false
              @State private var errorMsg: String? = nil
              @Environment(\.colorScheme) var scheme
          
              var body: some View {
                  VStack(alignment: .trailing, spacing: 8) {
                      HStack {
                          Button(action: load) {
                              Image(systemName: "arrow.clockwise").font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.white)
                                  .padding(.horizontal, 10).padding(.vertical, 6)
                                  .background(Capsule().fill(LinearGradient(
                                      colors: [.vipPurple, .blue],
                                      startPoint: .leading, endPoint: .trailing)))
                          }
                          Spacer()
                          if !sourceName.isEmpty {
                              Text(sourceName).font(.system(size: 12, weight: .bold)).lineLimit(1)
                          }
                          Text("\(apps.count) تطبيق")
                              .font(.system(size: 10)).foregroundColor(.gray)
                      }
          
                      if isLoading {
                          HStack { Spacer(); ProgressView(); Spacer() }.padding(.vertical, 12)
                      } else if let e = errorMsg {
                          Text(e).font(.system(size: 11)).foregroundColor(.red)
                              .frame(maxWidth: .infinity, alignment: .trailing)
                      } else if apps.isEmpty {
                          Text("لا توجد تطبيقات بعد — اضغط 🔄 للتحديث")
                              .font(.system(size: 11)).foregroundColor(.gray)
                              .frame(maxWidth: .infinity, alignment: .trailing)
                      } else {
                          LazyVStack(spacing: 6) {
                              ForEach(apps) { app in
                                  HStack(spacing: 10) {
                                      AsyncImage(url: URL(string: app.iconURL)) { img in
                                          img.resizable().scaledToFill()
                                      } placeholder: {
                                          RoundedRectangle(cornerRadius: 8).fill(Color.gray.opacity(0.2))
                                      }
                                      .frame(width: 36, height: 36)
                                      .clipShape(RoundedRectangle(cornerRadius: 8))
          
                                      Spacer()
                                      VStack(alignment: .trailing, spacing: 2) {
                                          Text(app.name).font(.system(size: 13, weight: .semibold)).lineLimit(1)
                                          Text("v\(app.version) · \(app.formattedSize)")
                                              .font(.system(size: 10)).foregroundColor(.gray)
                                      }
                                  }
                                  .padding(8)
                                  .background(RoundedRectangle(cornerRadius: 10)
                                      .fill(scheme == .dark ? Color(white: 0.10) : Color(white: 0.96)))
                              }
                          }
                      }
                  }
                  .padding(10)
                  .background(RoundedRectangle(cornerRadius: 12)
                      .strokeBorder(Color.vipPurple.opacity(0.25), lineWidth: 1))
                  .onAppear { if apps.isEmpty { load() } }
              }
          
              private func load() {
                  guard let url = URL(string: urlString) else {
                      errorMsg = "رابط غير صالح"; return
                  }
                  isLoading = true; errorMsg = nil
                  var req = URLRequest(url: url)
                  req.cachePolicy = .reloadIgnoringLocalCacheData
                  req.timeoutInterval = 20
                  URLSession.shared.dataTask(with: req) { data, _, err in
                      DispatchQueue.main.async {
                          isLoading = false
                          if let err = err { errorMsg = err.localizedDescription; return }
                          guard let data = data else { errorMsg = "لا توجد بيانات"; return }
                          let dec = JSONDecoder()
                          if let resp = try? dec.decode(AppsResponse.self, from: data) {
                              sourceName = resp.name; apps = resp.apps; return
                          }
                          if let list = try? dec.decode([AppItem].self, from: data) {
                              sourceName = URL(string: urlString)?.host ?? ""; apps = list; return
                          }
                          errorMsg = "تنسيق غير مدعوم (يتطلب JSON متوافق)"
                      }
                  }.resume()
              }
          }
          
