                  let pal = ThemeManager.p
                  let a = tone == 0 ? pal.primaryHex : (tone == 1 ? pal.accentHex : pal.cyanHex)
                  let b2 = tone == 0 ? pal.accentHex : (tone == 1 ? pal.darkHex : pal.primaryHex)
                  let body = """
                  <div class="card">
                    <div class="glow"></div>
                    <div class="shine"></div>
                    <div class="txt"><h2>\(title)</h2><span>\(subtitle)</span></div>
