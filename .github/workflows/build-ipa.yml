          struct StoreStatusBar: View {
              @ObservedObject var feed: StoreFeed

              var body: some View {
                  HStack(spacing: 8) {
                      if feed.isLoading {
                          ProgressView().scaleEffect(0.7)
                      } else {
                          Image(systemName: "checkmark.seal.fill")
                              .foregroundColor(.walletGreen)
                      }
                      if let updated = feed.lastUpdated {
                          Text("تحديث: \(formatDate(updated))")
                              .font(.system(size: 11, weight: .semibold))
                              .foregroundColor(.storeSub)
                      } else if let err = feed.lastError {
                          Text(err)
                              .font(.system(size: 11, weight: .semibold))
                              .foregroundColor(.storePink)
                              .lineLimit(1)
                      } else {
                          Text("المصادر: apptesters.org + المرايا")
                              .font(.system(size: 11, weight: .semibold))
                              .foregroundColor(.storeSub)
                      }
                      Spacer()
                      Text("\(feed.apps.count) تطبيق")
                          .font(.system(size: 11, weight: .bold))
                          .foregroundColor(.storePrimary)
                          .padding(.horizontal, 8).padding(.vertical, 3)
                          .background(Capsule().fill(Color.storePrimary.opacity(0.12)))
                  }
                  .padding(.horizontal, 20)
              }

              private func formatDate(_ iso: String) -> String {
                  let f = ISO8601DateFormatter()
                  f.formatOptions = [.withInternetDateTime]
                  if let d = f.date(from: iso) {
                      let df = DateFormatter()
                      df.dateFormat = "yyyy-MM-dd HH:mm"
                      return df.string(from: d)
                  }
                  return String(iso.prefix(16))
              }
          }

