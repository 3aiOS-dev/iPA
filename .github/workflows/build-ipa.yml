              private func pill(label: String, value: String?, color: Color) -> some View {
                  let active = (value == nil && selected == nil) || (value != nil && selected == value)
                  return Button {
                      HapticManager.shared.selection()
                      withAnimation(.spring(response: 0.35, dampingFraction: 0.8)) { selected = value }
