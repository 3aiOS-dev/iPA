              static let shared = MXAppsWatcher()
              private var lastCheckDate: Date? = nil
              private let cooldown: TimeInterval = 300 // 5 دقائق بين كل فحص
          
              private let monitoredSources: [String] = [
                  "https://raw.githubusercontent.com/driftywinds/driftywinds.github.io/master/AltStore/apps.json",
                  "https://raw.githubusercontent.com/swaggyP36000/TrollStore-IPAs/main/apps.json",
                  "https://provenance-emu.com/apps.json"
              ]
          
              /// يفحص المصادر ويرسل إشعاراً إذا وجد تطبيقات — مع cooldown لمنع الازدحام
              func check() {
                  let now = Date()
                  if let last = lastCheckDate, now.timeIntervalSince(last) < cooldown { return }
                  lastCheckDate = now
          
                  for urlString in monitoredSources {
                      guard let url = URL(string: urlString) else { continue }
                      var req = URLRequest(url: url,
                                          cachePolicy: .reloadIgnoringLocalCacheData,
                                          timeoutInterval: 15)
                      req.setValue("VIP21Store/7.0", forHTTPHeaderField: "User-Agent")
                      URLSession.shared.dataTask(with: req) { data, _, err in
                          guard let data = data, err == nil else { return }
                          let dec = JSONDecoder()
                          if let resp = try? dec.decode(AppsResponse.self, from: data), !resp.apps.isEmpty {
                              DispatchQueue.main.async {
                                  NotificationManager.shared.send(
                                      title: "🆕 تطبيقات جديدة متاحة",
                                      body: "\(resp.apps.count) تطبيق في المصدر: \(resp.name)"
                                  )
                              }
                          }
                      }.resume()
                  }
              }
          }
          
