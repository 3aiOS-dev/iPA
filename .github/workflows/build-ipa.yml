                          endPoint: .bottomTrailing
                      )
                      LoopingGifPlayer(resourceName: "home_banner", ext: "gif", fillMode: .fill)
                  }
                  .frame(maxWidth: .infinity)
                  .frame(height: 170)
                  .clipShape(RoundedRectangle(cornerRadius: 22))
                  .overlay(
                      RoundedRectangle(cornerRadius: 22)
