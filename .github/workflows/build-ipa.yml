      - name: Generate UserManager.swift (new for auth)
        run: |
          cat > UserManager.swift << 'VIPEOF'
          import SwiftUI
          import Foundation
          import Security

          @MainActor
          class UserManager: ObservableObject {
              @Published var isLoggedIn = false
              @Published var currentEmail: String = ""
              @Published var currentUsername: String = ""
              @Published var deviceUDID: String = ""

              private let userDefaults = UserDefaults.standard
              private let keychainService = "com.vip21.store.auth"

              init() {
                  loadUserData()
                  generateDeviceUDID()
              }

              func register(email: String, username: String, password: String) -> Bool {
                  guard !email.isEmpty, !username.isEmpty, !password.isEmpty else { return false }
                  // Save credentials
                  userDefaults.set(email, forKey: "userEmail")
                  userDefaults.set(username, forKey: "userUsername")
                  userDefaults.set(deviceUDID, forKey: "deviceUDID")
                  userDefaults.set(true, forKey: "isLoggedIn")
                  // Save password securely
                  savePassword(password)
                  currentEmail = email
                  currentUsername = username
                  isLoggedIn = true
                  return true
              }

              func login(email: String, password: String) -> Bool {
                  guard let savedEmail = userDefaults.string(forKey: "userEmail"),
                        savedEmail == email,
                        let savedPassword = getPassword(),
                        savedPassword == password else { return false }
                  currentEmail = email
                  currentUsername = userDefaults.string(forKey: "userUsername") ?? ""
                  deviceUDID = userDefaults.string(forKey: "deviceUDID") ?? ""
                  isLoggedIn = true
                  return true
              }

              func logout() {
                  isLoggedIn = false
                  currentEmail = ""
                  currentUsername = ""
                  // Keep stored data for next login
              }

              private func loadUserData() {
                  isLoggedIn = userDefaults.bool(forKey: "isLoggedIn")
                  if isLoggedIn {
                      currentEmail = userDefaults.string(forKey: "userEmail") ?? ""
                      currentUsername = userDefaults.string(forKey: "userUsername") ?? ""
                      deviceUDID = userDefaults.string(forKey: "deviceUDID") ?? ""
                  }
              }

              private func generateDeviceUDID() {
                  if let storedUDID = userDefaults.string(forKey: "deviceUDID"), !storedUDID.isEmpty {
                      deviceUDID = storedUDID
                      return
                  }
                  // Generate a unique identifier and store it
                  let newUDID = UUID().uuidString
                  userDefaults.set(newUDID, forKey: "deviceUDID")
                  deviceUDID = newUDID
              }

              private func savePassword(_ password: String) {
                  guard let data = password.data(using: .utf8) else { return }
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: keychainService,
                      kSecAttrAccount as String: "userPassword",
                      kSecValueData as String: data
                  ]
                  SecItemDelete(query as CFDictionary) // Remove old
                  SecItemAdd(query as CFDictionary, nil)
              }

              private func getPassword() -> String? {
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: keychainService,
                      kSecAttrAccount as String: "userPassword",
                      kSecReturnData as String: true,
                      kSecMatchLimit as String: kSecMatchLimitOne
                  ]
                  var result: AnyObject?
                  let status = SecItemCopyMatching(query as CFDictionary, &result)
                  guard status == errSecSuccess, let data = result as? Data,
                        let password = String(data: data, encoding: .utf8) else { return nil }
                  return password
              }
          }
          VIPEOF

