                                        }
                                    }
                                    if let err = file.lastSignError {
                                        Text(err).font(.system(size: 9)).foregroundColor(.red).lineLimit(1)
                                    }
                                }
                                Spacer()
                                Menu {
                                    Button { onInstall() } label: { Label("تثبيت", systemImage: "arrow.down.to.line") }
                                    if let signed = file.signedPath, FileManager.default.fileExists(atPath: signed) {
                                        Button {
                                            UIActivityViewController.present(items: [URL(fileURLWithPath: signed)])
                                        } label: { Label("مشاركة الموقّع", systemImage: "square.and.arrow.up") }
                                    }
                                    Button(role: .destructive) {
                                        showDeleteConfirm = true
                                    } label: { Label("حذف", systemImage: "trash") }
                                } label: {
                                    Image(systemName: "ellipsis.circle.fill")
                                        .font(.system(size: 24))
                                        .foregroundStyle(LinearGradient(colors: [.vipPurple, .blue], startPoint: .top, endPoint: .bottom))
                                }
                            }
                            .padding(10)
                            .background(RoundedRectangle(cornerRadius: 16).fill(Color.glassWhite))
                            .overlay(RoundedRectangle(cornerRadius: 16).stroke(Color.glassBorder, lineWidth: 0.5))
                            .confirmationDialog("حذف الملف؟", isPresented: $showDeleteConfirm) {
                                Button("حذف", role: .destructive) { onDelete() }
                                Button("إلغاء", role: .cancel) { }
                            }
                        }
                    }

                    // MARK: - Active Download Card
                    struct ActiveDownloadCard: View {
                        @ObservedObject var dl: ActiveDownload
                        let onCancel: () -> Void

                        var body: some View {
                            HStack(spacing: 12) {
                                ZStack {
                                    Circle()
                                        .stroke(Color.glassBorder, lineWidth: 4)
                                        .frame(width: 50, height: 50)
                                    Circle()
                                        .trim(from: 0, to: dl.progress)
                                        .stroke(LinearGradient(colors: [.vipPurple, .blue], startPoint: .top, endPoint: .bottom),
                                                style: StrokeStyle(lineWidth: 4, lineCap: .round))
                                        .frame(width: 50, height: 50)
                                        .rotationEffect(.degrees(-90))
                                    Text("\(dl.progressPercentage)%").font(.system(size: 10, weight: .bold))
                                }
