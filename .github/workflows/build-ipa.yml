      - name: Generate code - NotifyCenter.swift (notifications + sign-up verification code)
        run: |
          cat > NotifyCenter.swift << 'VIPEOF'
          import SwiftUI
          import UserNotifications
          import UIKit

          // ============================================================
          // NOTIFICATIONS + SIGN-UP VERIFICATION CODE (demo delivery,
          // but the displayed code IS the code that gets verified)
          // ============================================================

          struct AppNotificationItem: Identifiable, Equatable {
              let id: UUID = UUID()
              let title: String
              let body: String
              let icon: String
              let date: Date = Date()
          }

          @MainActor
          final class NotificationsManager: ObservableObject {
              static let shared = MainActor.assumeIsolated { NotificationsManager() }

              @Published var authorized: Bool = false
              @Published var enabled: Bool = UserDefaults.standard.object(forKey: "notif_enabled_21s") as? Bool ?? true
              @Published var history: [AppNotificationItem] = []
              @Published var banner: AppNotificationItem? = nil

              private init() {}

              func requestAuthorization() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { granted, _ in
                      DispatchQueue.main.async { self.authorized = granted }
                  }
              }

              func setEnabled(_ value: Bool) {
                  enabled = value
                  UserDefaults.standard.set(value, forKey: "notif_enabled_21s")
                  if value { requestAuthorization() }
              }

              /// Shows a real local notification (when allowed) + an in-app banner.
              func push(title: String, body: String, icon: String = "bell.fill", delay: TimeInterval = 0.4) {
                  let item = AppNotificationItem(title: title, body: body, icon: icon)
                  history.insert(item, at: 0)
                  if history.count > 60 { history.removeLast(history.count - 60) }

                  withAnimation(.spring(response: 0.4, dampingFraction: 0.8)) { banner = item }
                  HapticManager.shared.notification(.success)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 5) {
                      if self.banner?.id == item.id {
                          withAnimation(.easeOut(duration: 0.25)) { self.banner = nil }
                      }
                  }

                  guard enabled else { return }
                  let content = UNMutableNotificationContent()
                  content.title = title
                  content.body = body
                  content.sound = .default
                  let trigger = UNTimeIntervalNotificationTrigger(timeInterval: max(delay, 0.2), repeats: false)
                  let request = UNNotificationRequest(identifier: item.id.uuidString, content: content, trigger: trigger)
                  UNUserNotificationCenter.current().add(request, withCompletionHandler: nil)
              }

              func dismissBanner() {
                  withAnimation(.easeOut(duration: 0.2)) { banner = nil }
              }

              func clearHistory() { history.removeAll() }
          }

          // MARK: - Verification code engine
          @MainActor
          final class VerificationService: ObservableObject {
              static let shared = MainActor.assumeIsolated { VerificationService() }

              @Published private(set) var currentCode: String = ""
              @Published private(set) var targetPhone: String = ""
              @Published private(set) var expiresAt: Date = Date()
              @Published var attempts: Int = 0

              private init() {}

              /// Generates a 6 digit code, delivers it through the notification centre.
              @discardableResult
              func sendCode(to phone: String) -> String {
                  let code = String(format: "%06d", Int.random(in: 0...999999))
                  currentCode = code
                  targetPhone = phone
                  expiresAt = Date().addingTimeInterval(300)
                  attempts = 0
                  NotificationsManager.shared.push(
                      title: "21s 認証コード",
                      body: "\(phone) の認証コードは \(code) です（5分間有効）",
                      icon: "lock.shield.fill"
                  )
                  return code
              }

              func resend() {
                  guard !targetPhone.isEmpty else { return }
                  sendCode(to: targetPhone)
              }

              var isExpired: Bool { Date() > expiresAt }

              func verify(_ input: String) -> Bool {
                  let clean = input.trimmingCharacters(in: .whitespaces)
                  attempts += 1
                  guard !currentCode.isEmpty, !isExpired else { return false }
                  return clean == currentCode
              }

              func reset() {
                  currentCode = ""
                  targetPhone = ""
                  attempts = 0
              }
          }

          // MARK: - In-app notification banner
          struct NotificationBannerHost: View {
              @ObservedObject private var notifier = NotificationsManager.shared

              var body: some View {
                  VStack {
                      if let item = notifier.banner {
                          HStack(spacing: 12) {
                              ZStack {
                                  RoundedRectangle(cornerRadius: 12).fill(PinkTheme.gradient).frame(width: 38, height: 38)
                                  Image(systemName: item.icon).font(.system(size: 16, weight: .bold)).foregroundColor(.white)
                              }
                              VStack(alignment: .leading, spacing: 2) {
                                  Text(item.title).font(.system(size: 13, weight: .heavy)).foregroundColor(.storeText)
                                  Text(item.body).font(.system(size: 12)).foregroundColor(.storeSub).lineLimit(2)
                              }
                              Spacer(minLength: 0)
                              Button(action: { notifier.dismissBanner() }) {
                                  Image(systemName: "xmark").font(.system(size: 11, weight: .bold)).foregroundColor(.storeSub)
                              }
                          }
                          .padding(12)
                          .emerald3D(radius: 20, depth: 12)
                          .padding(.horizontal, 14)
                          .padding(.top, 8)
                          .transition(.move(edge: .top).combined(with: .opacity))
                      }
                      Spacer()
                  }
                  .animation(.spring(response: 0.4, dampingFraction: 0.82), value: notifier.banner)
              }
          }

          // MARK: - Notification centre screen
          struct NotificationCenterView: View {
              @Binding var isPresented: Bool
              @ObservedObject private var notifier = NotificationsManager.shared

              var body: some View {
                  ZStack {
                      AnimatedWaveBackground()
                      VStack(spacing: 0) {
                          HStack {
                              Button(action: { isPresented = false }) {
                                  Image(systemName: "chevron.left").font(.system(size: 16, weight: .bold)).foregroundColor(.storePrimary)
                              }
                              Spacer()
                              Text("通知").font(.system(size: 17, weight: .heavy)).foregroundColor(.storeText)
                              Spacer()
                              Button(action: { notifier.clearHistory() }) {
                                  Image(systemName: "trash").font(.system(size: 14, weight: .bold)).foregroundColor(.storeSub)
                              }
                          }
                          .padding(.horizontal, 18).padding(.vertical, 14)

                          ScrollView {
                              VStack(spacing: 12) {
                                  Toggle(isOn: Binding(get: { notifier.enabled }, set: { notifier.setEnabled($0) })) {
                                      VStack(alignment: .leading, spacing: 2) {
                                          Text("プッシュ通知").font(.system(size: 14, weight: .bold)).foregroundColor(.storeText)
                                          Text(notifier.authorized ? "許可されています" : "端末の許可が必要です")
                                              .font(.system(size: 11)).foregroundColor(.storeSub)
                                      }
                                  }
                                  .tint(.storePrimary)
                                  .padding(14)
                                  .emerald3D(radius: 20, depth: 10)

                                  if notifier.history.isEmpty {
                                      VStack(spacing: 8) {
                                          Image(systemName: "bell.slash").font(.system(size: 26)).foregroundColor(.storeSub)
                                          Text("通知はまだありません").font(.system(size: 13)).foregroundColor(.storeSub)
                                      }
                                      .padding(.top, 60)
                                  }

                                  ForEach(notifier.history) { item in
                                      HStack(spacing: 12) {
                                          ZStack {
                                              Circle().fill(PinkTheme.gradient).frame(width: 36, height: 36)
                                              Image(systemName: item.icon).font(.system(size: 15, weight: .bold)).foregroundColor(.white)
                                          }
                                          VStack(alignment: .leading, spacing: 3) {
                                              Text(item.title).font(.system(size: 13, weight: .bold)).foregroundColor(.storeText)
                                              Text(item.body).font(.system(size: 12)).foregroundColor(.storeSub)
                                          }
                                          Spacer(minLength: 0)
                                      }
                                      .padding(14)
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .emerald3D(radius: 20, depth: 8)
                                  }
                              }
                              .padding(16)
                          }
                      }
                  }
                  .onAppear { notifier.requestAuthorization() }
              }
          }

          // MARK: - Verification code screen (sign-up gate)
          struct VerifyCodeView: View {
              let phone: String
              var onVerified: () -> Void
              var onCancel: () -> Void

              @ObservedObject private var service = VerificationService.shared
              @State private var code: String = ""
              @State private var error: String? = nil
              @State private var seconds: Int = 60
              @State private var timer: Timer? = nil

              var body: some View {
                  ZStack {
                      AnimatedWaveBackground()
                      ScrollView {
                          VStack(spacing: 22) {
                              EmeraldOrb(size: 96).padding(.top, 40)
                              VStack(spacing: 6) {
                                  Text("認証コードの入力").font(.system(size: 24, weight: .heavy)).foregroundColor(.storeText)
                                  Text("\(phone) に 6 桁のコードを送信しました。通知を確認してください。")
                                      .font(.system(size: 12)).foregroundColor(.storeSub)
                                      .multilineTextAlignment(.center)
                              }

                              TextField("------", text: $code)
                                  .keyboardType(.numberPad)
                                  .multilineTextAlignment(.center)
                                  .font(.system(size: 28, weight: .heavy, design: .monospaced))
                                  .foregroundColor(.storeText)
                                  .padding(.vertical, 16)
                                  .frame(maxWidth: .infinity)
                                  .emerald3D(radius: 20, depth: 10)
                                  .onChange(of: code) { newValue in
                                      let digits = newValue.filter { $0.isNumber }
                                      if digits.count > 6 { code = String(digits.prefix(6)) }
                                      else if digits != newValue { code = digits }
                                  }

                              if let error = error {
                                  Text(error).font(.system(size: 12, weight: .semibold)).foregroundColor(.xcodeRed)
                              }

                              Button(action: submit) {
                                  Text("確認する")
                                      .font(.system(size: 15, weight: .bold))
                                      .foregroundColor(.white)
                                      .frame(maxWidth: .infinity).frame(height: 50)
                                      .background(Capsule().fill(PinkTheme.gradient))
                                      .shadow(color: Color.storePrimary.opacity(0.35), radius: 10, y: 5)
                              }
                              .disabled(code.count < 6)
                              .opacity(code.count < 6 ? 0.6 : 1)

                              Button(action: {
                                  guard seconds == 0 else { return }
                                  service.resend()
                                  startTimer()
                              }) {
                                  Text(seconds > 0 ? "コードを再送信 (\(seconds)秒)" : "コードを再送信")
                                      .font(.system(size: 12, weight: .semibold))
                                      .foregroundColor(seconds > 0 ? .storeSub : .storePrimary)
                              }

                              Button(action: { timer?.invalidate(); onCancel() }) {
                                  Text("戻る").font(.system(size: 12)).foregroundColor(.storeSub)
                              }
                              Spacer(minLength: 30)
                          }
                          .padding(.horizontal, 24)
                      }
                      NotificationBannerHost()
                  }
                  .onAppear { startTimer() }
                  .onDisappear { timer?.invalidate() }
              }

              private func submit() {
                  if service.verify(code) {
                      HapticManager.shared.success()
                      timer?.invalidate()
                      onVerified()
                  } else {
                      HapticManager.shared.error()
                      error = service.isExpired ? "コードの有効期限が切れました。再送信してください。" : "コードが正しくありません。"
                  }
              }

              private func startTimer() {
                  seconds = 60
                  timer?.invalidate()
                  timer = Timer.scheduledTimer(withTimeInterval: 1, repeats: true) { t in
                      if seconds > 0 { seconds -= 1 } else { t.invalidate() }
                  }
              }
          }
          VIPEOF

      - name: Generate code - SigningCenter.swift (certificates, IPA restore, server signing, OTA install)
        run: |
          cat > SigningCenter.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import UniformTypeIdentifiers

          // ============================================================
          // SIGNING + INSTALL CENTER
          // - import .p12 / .mobileprovision certificates
          // - import / restore .ipa files from Files & iCloud
          // - sign on a real signing server (multipart upload)
          // - install over-the-air with itms-services
          // ============================================================

          struct SignCertificate: Codable, Identifiable, Hashable {
              var id: UUID = UUID()
              var name: String
              var p12File: String?
              var provisionFile: String?
              var password: String
              var addedAt: Date = Date()

              var isComplete: Bool { p12File != nil && provisionFile != nil }
          }

          struct LocalIPAFile: Codable, Identifiable, Hashable {
              var id: UUID = UUID()
              var name: String
              var fileName: String
              var bytes: Int64
              var addedAt: Date = Date()
              var signedInstallURL: String? = nil

              var sizeText: String {
                  let mb = Double(bytes) / 1_048_576.0
                  if mb >= 1024 { return String(format: "%.2f GB", mb / 1024) }
                  return String(format: "%.1f MB", mb)
              }
          }

          @MainActor
          final class SigningManager: ObservableObject {
              static let shared = MainActor.assumeIsolated { SigningManager() }

              @Published var certificates: [SignCertificate] = []
              @Published var ipaFiles: [LocalIPAFile] = []
              @Published var isWorking: Bool = false
              @Published var progress: Double = 0
              @Published var statusText: String = ""
              @Published var lastInstallURL: String? = nil
              @Published var log: [String] = []

              /// Real signing backend. Any server that accepts a multipart upload
              /// (ipa + p12 + mobileprovision + password) and returns an install URL.
              @Published var serverURL: String = UserDefaults.standard.string(forKey: "sign_server_21s") ?? "https://sign.21s.app"

              private let certKey = "sign_certs_21s"
              private let ipaKey  = "sign_ipas_21s"

              private init() { load() }

              // MARK: storage
              var storeDir: URL {
                  let base = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      .appendingPathComponent("Signing", isDirectory: true)
                  if !FileManager.default.fileExists(atPath: base.path) {
                      try? FileManager.default.createDirectory(at: base, withIntermediateDirectories: true)
                  }
                  return base
              }

              func fileURL(_ name: String) -> URL { storeDir.appendingPathComponent(name) }

              private func load() {
                  if let d = UserDefaults.standard.data(forKey: certKey),
                     let v = try? JSONDecoder().decode([SignCertificate].self, from: d) { certificates = v }
                  if let d = UserDefaults.standard.data(forKey: ipaKey),
                     let v = try? JSONDecoder().decode([LocalIPAFile].self, from: d) { ipaFiles = v }
              }

              private func save() {
                  if let d = try? JSONEncoder().encode(certificates) { UserDefaults.standard.set(d, forKey: certKey) }
                  if let d = try? JSONEncoder().encode(ipaFiles) { UserDefaults.standard.set(d, forKey: ipaKey) }
              }

              func setServer(_ value: String) {
                  let clean = value.trimmingCharacters(in: .whitespaces)
                  serverURL = clean
                  UserDefaults.standard.set(clean, forKey: "sign_server_21s")
              }

              private func addLog(_ line: String) {
                  log.insert(line, at: 0)
                  if log.count > 120 { log.removeLast(log.count - 120) }
                  statusText = line
              }

              // MARK: import certificate parts
              func importCertificateFile(_ url: URL) {
                  let ext = url.pathExtension.lowercased()
                  guard let data = try? Data(contentsOf: url) else {
                      addLog("読み込み失敗: \(url.lastPathComponent)")
                      return
                  }
                  let stored = "\(UUID().uuidString).\(ext)"
                  do {
                      try data.write(to: fileURL(stored))
                  } catch {
                      addLog("保存失敗: \(error.localizedDescription)")
                      return
                  }

                  if ext == "p12" || ext == "pfx" {
                      var cert = SignCertificate(name: url.deletingPathExtension().lastPathComponent, p12File: stored, provisionFile: nil, password: "")
                      if let idx = certificates.firstIndex(where: { $0.p12File == nil }) {
                          certificates[idx].p12File = stored
                          cert = certificates[idx]
                          certificates[idx] = cert
                      } else {
                          certificates.append(cert)
                      }
                      addLog("証明書 (.p12) を追加: \(url.lastPathComponent)")
                  } else if ext == "mobileprovision" || ext == "provisionprofile" {
                      if let idx = certificates.lastIndex(where: { $0.provisionFile == nil }) {
                          certificates[idx].provisionFile = stored
                      } else {
                          certificates.append(SignCertificate(name: url.deletingPathExtension().lastPathComponent, p12File: nil, provisionFile: stored, password: ""))
                      }
                      addLog("プロビジョニングを追加: \(url.lastPathComponent)")
                  } else {
                      addLog("対応していない形式: .\(ext)")
                      return
                  }
                  save()
                  NotificationsManager.shared.push(title: "証明書を追加しました", body: url.lastPathComponent, icon: "checkmark.seal.fill")
              }

              func setPassword(_ password: String, for cert: SignCertificate) {
                  guard let idx = certificates.firstIndex(where: { $0.id == cert.id }) else { return }
                  certificates[idx].password = password
                  save()
              }

              func rename(_ name: String, for cert: SignCertificate) {
                  guard let idx = certificates.firstIndex(where: { $0.id == cert.id }) else { return }
                  certificates[idx].name = name
                  save()
              }

              func deleteCertificate(_ cert: SignCertificate) {
                  if let f = cert.p12File { try? FileManager.default.removeItem(at: fileURL(f)) }
                  if let f = cert.provisionFile { try? FileManager.default.removeItem(at: fileURL(f)) }
                  certificates.removeAll { $0.id == cert.id }
                  save()
              }

              // MARK: import / restore IPA
              func importIPA(_ url: URL) {
                  guard let data = try? Data(contentsOf: url) else {
                      addLog("IPA の読み込みに失敗: \(url.lastPathComponent)")
                      return
                  }
                  let stored = "\(UUID().uuidString).ipa"
                  do { try data.write(to: fileURL(stored)) } catch {
                      addLog("IPA の保存に失敗: \(error.localizedDescription)")
                      return
                  }
                  let item = LocalIPAFile(name: url.deletingPathExtension().lastPathComponent,
                                          fileName: stored,
                                          bytes: Int64(data.count))
                  ipaFiles.insert(item, at: 0)
                  save()
                  addLog("IPA を復元: \(item.name) (\(item.sizeText))")
                  NotificationsManager.shared.push(title: "IPA を追加しました", body: "\(item.name) · \(item.sizeText)", icon: "tray.and.arrow.down.fill")
              }

              /// Restore an IPA straight from a download URL (store apps, mirrors...).
              func restoreIPA(from remote: String, displayName: String? = nil) {
                  guard let url = URL(string: remote) else { addLog("URL が無効です"); return }
                  isWorking = true
                  progress = 0
                  addLog("ダウンロード中: \(url.lastPathComponent)")
                  let task = URLSession.shared.downloadTask(with: url) { tmp, _, error in
                      DispatchQueue.main.async {
                          self.isWorking = false
                          guard let tmp = tmp, error == nil else {
                              self.addLog("ダウンロード失敗: \(error?.localizedDescription ?? "不明なエラー")")
                              return
                          }
                          let stored = "\(UUID().uuidString).ipa"
                          let dest = self.fileURL(stored)
                          try? FileManager.default.removeItem(at: dest)
                          do { try FileManager.default.moveItem(at: tmp, to: dest) } catch {
                              self.addLog("保存失敗: \(error.localizedDescription)")
                              return
                          }
                          let attrs = try? FileManager.default.attributesOfItem(atPath: dest.path)
                          let size = (attrs?[.size] as? NSNumber)?.int64Value ?? 0
                          let item = LocalIPAFile(name: displayName ?? url.deletingPathExtension().lastPathComponent,
                                                  fileName: stored,
                                                  bytes: size)
                          self.ipaFiles.insert(item, at: 0)
                          self.save()
                          self.addLog("復元完了: \(item.name)")
                          NotificationsManager.shared.push(title: "IPA を復元しました", body: item.name, icon: "arrow.down.circle.fill")
                      }
                  }
                  task.resume()
              }

              func deleteIPA(_ item: LocalIPAFile) {
                  try? FileManager.default.removeItem(at: fileURL(item.fileName))
                  ipaFiles.removeAll { $0.id == item.id }
                  save()
              }

              func exportURL(for item: LocalIPAFile) -> URL { fileURL(item.fileName) }

              // MARK: signing on the real server
              func sign(ipa: LocalIPAFile, with cert: SignCertificate) {
                  guard cert.isComplete else {
                      addLog("証明書が未完成です (.p12 と .mobileprovision が必要)")
                      return
                  }
                  guard let endpoint = URL(string: serverURL.hasSuffix("/") ? serverURL + "sign" : serverURL + "/sign") else {
                      addLog("署名サーバー URL が無効です")
                      return
                  }
                  guard let ipaData = try? Data(contentsOf: fileURL(ipa.fileName)),
                        let p12Name = cert.p12File, let p12Data = try? Data(contentsOf: fileURL(p12Name)),
                        let provName = cert.provisionFile, let provData = try? Data(contentsOf: fileURL(provName)) else {
                      addLog("ファイルの読み込みに失敗しました")
                      return
                  }

                  isWorking = true
                  progress = 0.05
                  addLog("署名サーバーへアップロード中...")

                  let boundary = "Boundary-\(UUID().uuidString)"
                  var request = URLRequest(url: endpoint)
                  request.httpMethod = "POST"
                  request.timeoutInterval = 600
                  request.setValue("multipart/form-data; boundary=\(boundary)", forHTTPHeaderField: "Content-Type")

                  var body = Data()
                  func appendField(_ name: String, _ value: String) {
                      body.append("--\(boundary)\r\n".data(using: .utf8)!)
                      body.append("Content-Disposition: form-data; name=\"\(name)\"\r\n\r\n".data(using: .utf8)!)
                      body.append("\(value)\r\n".data(using: .utf8)!)
                  }
                  func appendFile(_ name: String, _ filename: String, _ data: Data, _ mime: String) {
                      body.append("--\(boundary)\r\n".data(using: .utf8)!)
                      body.append("Content-Disposition: form-data; name=\"\(name)\"; filename=\"\(filename)\"\r\n".data(using: .utf8)!)
                      body.append("Content-Type: \(mime)\r\n\r\n".data(using: .utf8)!)
                      body.append(data)
                      body.append("\r\n".data(using: .utf8)!)
                  }

                  appendField("password", cert.password)
                  appendField("bundle_name", ipa.name)
                  appendField("client", "21s-ios")
                  appendFile("ipa", "\(ipa.name).ipa", ipaData, "application/octet-stream")
                  appendFile("p12", "cert.p12", p12Data, "application/x-pkcs12")
                  appendFile("mobileprovision", "profile.mobileprovision", provData, "application/octet-stream")
                  body.append("--\(boundary)--\r\n".data(using: .utf8)!)

                  let task = URLSession.shared.uploadTask(with: request, from: body) { data, response, error in
                      DispatchQueue.main.async {
                          self.isWorking = false
                          self.progress = 1
                          if let error = error {
                              self.addLog("署名失敗: \(error.localizedDescription)")
                              NotificationsManager.shared.push(title: "署名に失敗しました", body: error.localizedDescription, icon: "xmark.octagon.fill")
                              return
                          }
                          let status = (response as? HTTPURLResponse)?.statusCode ?? 0
                          guard let data = data, status >= 200, status < 300 else {
                              self.addLog("サーバーエラー (HTTP \(status))")
                              NotificationsManager.shared.push(title: "署名に失敗しました", body: "サーバーエラー HTTP \(status)", icon: "xmark.octagon.fill")
                              return
                          }
                          let install = self.parseInstallURL(from: data)
                          if let install = install {
                              if let idx = self.ipaFiles.firstIndex(where: { $0.id == ipa.id }) {
                                  self.ipaFiles[idx].signedInstallURL = install
                                  self.save()
                              }
                              self.lastInstallURL = install
                              self.addLog("署名完了。インストール準備ができました。")
                              NotificationsManager.shared.push(title: "署名が完了しました", body: "\(ipa.name) をインストールできます。", icon: "checkmark.seal.fill")
                          } else {
                              let text = String(data: data, encoding: .utf8) ?? ""
                              self.addLog("応答を解析できません: \(text.prefix(160))")
                          }
                      }
                  }
                  task.resume()
              }

              private func parseInstallURL(from data: Data) -> String? {
                  if let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                      for key in ["install_url", "installURL", "itms", "manifest_url", "plist_url", "url", "ipa_url", "download_url"] {
                          if let v = obj[key] as? String, !v.isEmpty {
                              return normalizeInstall(v)
                          }
                      }
                      if let nested = obj["data"] as? [String: Any] {
                          for key in ["install_url", "manifest_url", "plist_url", "url"] {
                              if let v = nested[key] as? String, !v.isEmpty { return normalizeInstall(v) }
                          }
                      }
                  }
                  if let text = String(data: data, encoding: .utf8) {
                      let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)
                      if trimmed.hasPrefix("itms-services://") || trimmed.hasPrefix("http") {
                          return normalizeInstall(trimmed)
                      }
                  }
                  return nil
              }

              private func normalizeInstall(_ raw: String) -> String {
                  if raw.hasPrefix("itms-services://") { return raw }
                  if raw.lowercased().hasSuffix(".plist") {
                      let encoded = raw.addingPercentEncoding(withAllowedCharacters: .alphanumerics) ?? raw
                      return "itms-services://?action=download-manifest&url=\(encoded)"
                  }
                  return raw
              }

              // MARK: OTA install
              func install(_ urlString: String) {
                  guard let url = URL(string: urlString) else { addLog("インストール URL が無効です"); return }
                  addLog("インストールを開始します...")
                  UIApplication.shared.open(url, options: [:]) { ok in
                      DispatchQueue.main.async {
                          if ok {
                              NotificationsManager.shared.push(title: "インストール中", body: "ホーム画面を確認してください。", icon: "arrow.down.app.fill")
                          } else {
                              self.addLog("インストールを開始できませんでした。")
                          }
                      }
                  }
              }
          }

          // MARK: - Document picker
          struct DocumentPickerView: UIViewControllerRepresentable {
              var types: [UTType]
              var onPick: (URL) -> Void

              func makeCoordinator() -> Coordinator { Coordinator(onPick: onPick) }

              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: types, asCopy: true)
                  picker.allowsMultipleSelection = false
                  picker.delegate = context.coordinator
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}

              final class Coordinator: NSObject, UIDocumentPickerDelegate {
                  let onPick: (URL) -> Void
                  init(onPick: @escaping (URL) -> Void) { self.onPick = onPick }
                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      if let url = urls.first { onPick(url) }
                  }
              }
          }

