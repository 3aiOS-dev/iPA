      - name: Generate Source - SigningTabView.swift
        run: |
          cat > SigningTabView.swift << 'VIPEOF'
          import SwiftUI
          import UniformTypeIdentifiers
          
          struct SigningTabView: View {
              @ObservedObject var downloadManager: IPADownloadManager
              @ObservedObject var certificateManager: CertificateManager
              @State private var selectedFile: IPAFile?
              @State private var signingProgress: Double?
              @State private var signingStatus = ""
              @State private var showIPAPicker = false
              @State private var showInstallSheet = false
              @State private var pendingInstallFile: IPAFile?
              @State private var pendingRecovery = false
              @State private var selectedSegment = 0
              @AppStorage("vip21.userTags") private var savedTagsCSV: String = ""
              @Environment(\.colorScheme) var scheme
          
              var tags: [String] {
                  savedTagsCSV.split(separator: ",").map { $0.trimmingCharacters(in: .whitespaces) }.filter { !$0.isEmpty }
              }
          
              var body: some View {
                  NavigationView {
                      List {
                          Section {
                              HStack {
                                  Spacer()
                                  Button("استورد IPA") { showIPAPicker = true }
                                      .buttonStyle(.borderedProminent)
                                  Button("استرداد الملفات") { pendingRecovery = true }
                                      .buttonStyle(.bordered)
                              }
                          }
                          .listRowBackground(Color.clear)
          
                          Section("شهادات التوقيع") {
                              if certificateManager.certificates.isEmpty {
                                  Text("لا توجد شهادات")
                                      .foregroundColor(.secondary)
                              } else {
                                  ForEach(certificateManager.certificates) { cert in
                                      HStack {
                                          VStack(alignment: .leading) {
                                              Text(cert.displayName)
                                                  .font(.headline)
                                              Text(cert.expiryText)
                                                  .font(.caption)
                                                  .foregroundColor(cert.expiryStatusColor)
                                          }
                                          Spacer()
                                          if certificateManager.selectedCertificate?.id == cert.id {
                                              Image(systemName: "checkmark.circle.fill")
                                                  .foregroundColor(.blue)
                                          }
                                      }
                                      .onTapGesture {
                                          certificateManager.selectedCertificate = cert
                                      }
                                  }
                              }
                          }
          
                          if !downloadManager.ipaFiles.isEmpty {
                              Section("ملفات IPA (\(downloadManager.ipaFiles.count))") {
                                  ForEach(downloadManager.ipaFiles) { file in
                                      VStack(alignment: .leading, spacing: 4) {
                                          Text(file.fileName)
                                              .font(.headline)
                                          HStack {
                                              Text(file.fileSize)
                                              Spacer()
                                              if file.isSigned {
                                                  Image(systemName: "checkmark.seal.fill")
                                                      .foregroundColor(.green)
                                              }
                                              Button("توقيع") {
                                                  selectedFile = file
                                              }
                                              .buttonStyle(.bordered)
                                              .disabled(certificateManager.selectedCertificate == nil)
                                              Button("تثبيت") {
                                                  pendingInstallFile = file
                                                  showInstallSheet = true
                                              }
                                              .buttonStyle(.borderedProminent)
                                          }
                                      }
                                      .padding(.vertical, 4)
                                  }
                                  .onDelete { indices in
                                      for index in indices {
                                          downloadManager.deleteIPAFile(downloadManager.ipaFiles[index])
                                      }
                                  }
                              }
                          }
          
                          if !tags.isEmpty {
                              Section("العلامات") {
                                  ScrollView(.horizontal, showsIndicators: false) {
                                      HStack {
                                          ForEach(tags, id: \.self) { tag in
                                              Text(tag)
                                                  .padding(.horizontal, 10)
                                                  .padding(.vertical, 4)
                                                  .background(Capsule().fill(Color.blue.opacity(0.1)))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      .listStyle(InsetGroupedListStyle())
                      .navigationTitle("التوقيع والتثبيت")
                      .sheet(isPresented: $showIPAPicker) {
                          DocumentPicker(types: [.init(filenameExtension: "ipa") ?? .data]) { url in
                              downloadManager.importIPAFromURL(url: url)
                          }
                      }
                      .sheet(isPresented: $pendingRecovery) {
                          NavigationView {
                              VIP21FileRecoveryView(downloadManager: downloadManager)
                          }
                      }
                      .sheet(item: $selectedFile) { file in
                          SigningSheetView(
                              ipaFile: file,
                              certificates: certificateManager.certificates,
                              selectedCertId: certificateManager.selectedCertificate?.id,
                              onSign: { cert in
                                  selectedFile = nil
                                  performSigning(file: file, cert: cert)
                              }
                          )
                      }
                      .sheet(isPresented: $showInstallSheet) {
                          if let file = pendingInstallFile {
                              VIP21FullInstallView(
                                  file: file,
                                  certificateManager: certificateManager,
                                  downloadManager: downloadManager
                              )
                          }
                      }
                      .overlay(signingProgress.map { p in
                          ProgressView(value: p, total: 1.0) {
                              Text(signingStatus)
                          }
                          .padding()
                          .background(RoundedRectangle(cornerRadius: 10).fill(Color(UIColor.systemBackground)))
                          .padding()
                      })
                  }
              }
          
              func performSigning(file: IPAFile, cert: CertificateInfoModel) {
                  let ipaURL = URL(fileURLWithPath: file.localPath)
                  signingProgress = 0.0
                  signingStatus = "جاري التوقيع..."
          
                  certificateManager.signIPA(
                      ipaURL: ipaURL,
                      with: cert,
                      progressHandler: { p, s in
                          DispatchQueue.main.async {
                              signingProgress = p
                              signingStatus = s
                          }
                      },
                      completion: { result in
                          DispatchQueue.main.async {
                              switch result {
                              case .success(let signed):
                                  downloadManager.markAsSigned(file, signedPath: signed.path, certificateId: cert.id)
                                  signingStatus = "تم التوقيع بنجاح"
                                  HapticManager.shared.notification(.success)
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 2) { signingProgress = nil }
                              case .failure(let err):
                                  signingStatus = "فشل: \(err.localizedDescription)"
                                  HapticManager.shared.notification(.error)
                                  DispatchQueue.main.asyncAfter(deadline: .now() + 3) { signingProgress = nil }
                              }
                          }
                      }
                  )
              }
          }
          
          struct VIP21FileRecoveryView: View {
              @ObservedObject var downloadManager: IPADownloadManager
              @Environment(\.dismiss) var dismiss
              @State private var isRecovering = false
              @State private var recoveryMsg = ""
          
              var body: some View {
                  List {
                      Section {
                          VStack(spacing: 12) {
                              Image(systemName: "arrow.triangle.2.circlepath.doc.fill")
                                  .font(.system(size: 40))
                                  .foregroundColor(.blue)
                              Text("استرداد الملفات")
                                  .font(.headline)
                              Text("يبحث عن ملفات IPA في تخزين التطبيق ويستردها")
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                          }
                          .frame(maxWidth: .infinity)
                          .padding(.vertical, 20)
                      }
                      .listRowBackground(Color.clear)
          
                      Section {
                          HStack {
                              Spacer()
                              if isRecovering {
                                  ProgressView()
                              }
                              Button(isRecovering ? "جاري الاسترداد..." : "استرداد الآن") {
                                  isRecovering = true
                                  recoveryMsg = ""
                                  DispatchQueue.global(qos: .userInitiated).async {
                                      let fm = FileManager.default
                                      let docs = fm.urls(for: .documentDirectory, in: .userDomainMask).first!
                                      var cnt = 0
                                      if let files = try? fm.contentsOfDirectory(at: docs, includingPropertiesForKeys: nil) {
                                          for url in files where url.pathExtension.lowercased() == "ipa" {
                                              if !downloadManager.ipaFiles.contains(where: { $0.localPath == url.path }) {
                                                  DispatchQueue.main.async {
                                                      downloadManager.importIPAFromURL(url: url)
                                                  }
                                                  cnt += 1
                                              }
                                          }
                                      }
                                      DispatchQueue.main.async {
                                          isRecovering = false
                                          recoveryMsg = cnt > 0 ? "تم استرداد \(cnt) ملف" : "لا توجد ملفات جديدة"
                                          if cnt > 0 { HapticManager.shared.notification(.success) }
                                      }
                                  }
                              }
                              .buttonStyle(.borderedProminent)
                              .disabled(isRecovering)
                              Spacer()
                          }
                      }
          
                      if !recoveryMsg.isEmpty {
                          Section {
                              Text(recoveryMsg)
                                  .frame(maxWidth: .infinity, alignment: .center)
                          }
                      }
          
                      if !downloadManager.ipaFiles.isEmpty {
                          Section("الملفات المتوفرة") {
                              ForEach(downloadManager.ipaFiles) { file in
                                  HStack {
                                      Text(file.fileName)
                                      Spacer()
                                      if file.isSigned {
                                          Image(systemName: "checkmark.seal.fill")
                                              .foregroundColor(.green)
                                      }
                                  }
                              }
                          }
                      }
                  }
                  .listStyle(InsetGroupedListStyle())
                  .navigationTitle("استرداد الملفات")
                  .toolbar {
                      ToolbarItem(placement: .navigationBarTrailing) {
                          Button("إغلاق") { dismiss() }
                      }
                  }
              }
          }
          
          struct VIP21FullInstallView: View {
              let file: IPAFile
              @ObservedObject var certificateManager: CertificateManager
              @ObservedObject var downloadManager: IPADownloadManager
              @Environment(\.dismiss) var dismiss
              @Environment(\.colorScheme) var scheme
          
              @State private var progress: Double = 0
              @State private var statusMsg = ""
              @State private var isRunning = false
              @State private var resultMsg: String?
              @State private var succeeded = false
          
              var appName: String { file.fileName.replacingOccurrences(of: ".ipa", with: "") }
              var bundleID: String { "com.vip21." + appName.lowercased().replacingOccurrences(of: " ", with: "") }
          
              var body: some View {
                  NavigationView {
                      List {
                          Section {
                              VStack(spacing: 8) {
                                  Image(systemName: "app.badge.fill")
                                      .font(.system(size: 50))
                                      .foregroundColor(.blue)
                                  Text(appName)
                                      .font(.title2.bold())
                                  Text(file.fileSize)
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                                  if file.isSigned {
                                      Label("موقَّع وجاهز للتثبيت", systemImage: "checkmark.seal.fill")
                                          .font(.caption)
                                          .foregroundColor(.green)
                                  }
                              }
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 12)
                          }
                          .listRowBackground(Color.clear)
          
                          if isRunning || progress > 0 {
                              Section {
                                  ProgressView(value: progress)
                                  Text(statusMsg)
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                              }
                          }
          
                          if let msg = resultMsg {
                              Section {
                                  HStack {
                                      Image(systemName: succeeded ? "checkmark.circle.fill" : "xmark.circle.fill")
                                          .foregroundColor(succeeded ? .green : .red)
                                      Text(msg)
                                  }
                              }
                          }
          
                          Section {
                              Button(isRunning ? "جاري التثبيت..." : "تثبيت التطبيق") {
                                  isRunning = true
                                  resultMsg = nil
                                  let ipaURL = URL(fileURLWithPath: file.signedPath ?? file.localPath)
                                  certificateManager.installIPA(
                                      ipaURL: ipaURL,
                                      appName: appName,
                                      bundleID: bundleID,
                                      progressHandler: { p, s in
                                          DispatchQueue.main.async { progress = p; statusMsg = s }
                                      },
                                      completion: { result in
                                          DispatchQueue.main.async {
                                              isRunning = false
                                              switch result {
                                              case .success:
                                                  succeeded = true
                                                  resultMsg = "تم إرسال طلب التثبيت"
                                                  downloadManager.markAsInstalled(file, method: "InstallEngine")
                                                  HapticManager.shared.notification(.success)
                                              case .failure(let err):
                                                  succeeded = false
                                                  resultMsg = err.localizedDescription
                                                  HapticManager.shared.notification(.error)
                                              }
                                          }
                                      }
                                  )
                              }
                              .disabled(isRunning)
                              .frame(maxWidth: .infinity, alignment: .center)
                          }
                      }
                      .listStyle(InsetGroupedListStyle())
                      .navigationTitle("تثبيت التطبيق")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("إغلاق") { dismiss() }
                          }
                      }
                  }
              }
          }
          
          struct SigningSheetView: View {
              let ipaFile: IPAFile
              let certificates: [CertificateInfoModel]
              let selectedCertId: UUID?
              let onSign: (CertificateInfoModel) -> Void
              @Environment(\.dismiss) var dismiss
              @State private var selectedCert: CertificateInfoModel?
          
              var body: some View {
                  NavigationView {
                      List {
                          Section {
                              Text(ipaFile.fileName)
                                  .font(.headline)
                                  .frame(maxWidth: .infinity, alignment: .center)
                          }
                          .listRowBackground(Color.clear)
          
                          Section("اختر شهادة") {
                              if certificates.isEmpty {
                                  Text("لا توجد شهادات")
                                      .foregroundColor(.secondary)
                              } else {
                                  ForEach(certificates) { cert in
                                      HStack {
                                          VStack(alignment: .leading) {
                                              Text(cert.displayName)
                                                  .font(.headline)
                                              Text(cert.expiryText)
                                                  .font(.caption)
                                                  .foregroundColor(cert.expiryStatusColor)
                                          }
                                          Spacer()
                                          if selectedCert?.id == cert.id {
                                              Image(systemName: "checkmark.circle.fill")
                                                  .foregroundColor(.blue)
                                          }
                                      }
                                      .onTapGesture { selectedCert = cert }
                                  }
                              }
                          }
          
                          Section {
                              Button("توقيع") {
                                  if let cert = selectedCert { onSign(cert); dismiss() }
                              }
                              .disabled(selectedCert == nil || selectedCert?.isValid == false)
                              .frame(maxWidth: .infinity, alignment: .center)
                          }
                      }
                      .listStyle(InsetGroupedListStyle())
                      .navigationTitle("توقيع IPA")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("إلغاء") { dismiss() }
                          }
                      }
                      .onAppear {
                          selectedCert = certificates.first(where: { $0.isValid }) ?? certificates.first
                      }
                  }
              }
          }
          VIPEOF

