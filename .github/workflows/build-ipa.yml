                          .foregroundColor(.storeText)
                      Text("Tap the heart on any app to keep it here for quick access. Your favorites are stored on this device only.")
                          .font(.system(size: 13))
                          .foregroundColor(.storeSub)
                          .multilineTextAlignment(.center)
                          .padding(.horizontal, 40)
                      Spacer()
