      - name: Generate Source - PDF Tools (توقيع / دمج / عرض)
        run: |
          cd ${{ github.workspace }}
          cat > PDFTools.swift << 'PEOF'
          import UIKit
          import PDFKit

          // MARK: - لوحة رسم التوقيع بإصبعك

          final class SignatureDrawView: UIView {
              private var paths: [UIBezierPath] = []
              private var currentPath = UIBezierPath()
              var strokeColor: UIColor = .white
              var lineWidth: CGFloat = 3.5

              override init(frame: CGRect) {
                  super.init(frame: frame)
                  backgroundColor = .clear
                  isMultipleTouchEnabled = false
              }
              required init?(coder: NSCoder) { super.init(coder: coder) }

              var isEmpty: Bool { paths.isEmpty }

              func clear() {
                  paths.removeAll()
                  currentPath = UIBezierPath()
                  setNeedsDisplay()
              }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  guard let point = touches.first?.location(in: self) else { return }
                  currentPath = UIBezierPath()
                  currentPath.lineWidth = lineWidth
                  currentPath.lineCapStyle = .round
                  currentPath.lineJoinStyle = .round
                  currentPath.move(to: point)
              }

              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  guard let point = touches.first?.location(in: self) else { return }
                  currentPath.addLine(to: point)
                  setNeedsDisplay()
              }

              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  paths.append(currentPath)
                  currentPath = UIBezierPath()
                  setNeedsDisplay()
              }

              override func draw(_ rect: CGRect) {
                  strokeColor.setStroke()
                  for path in paths { path.stroke() }
                  currentPath.stroke()
              }

              /// يصدّر التوقيع كصورة بخلفية شفافة لوضعها فوق صفحة PDF
              func exportImage() -> UIImage? {
                  guard !isEmpty else { return nil }
                  let renderer = UIGraphicsImageRenderer(size: bounds.size)
                  return renderer.image { _ in
                      strokeColor.setStroke()
                      for path in paths { path.stroke() }
                  }
              }
          }

          // MARK: - شاشة التوقيع (مودال)

          final class SignatureViewController: UIViewController {
              var onComplete: ((UIImage) -> Void)?
              private let drawView = SignatureDrawView()
              private let bgDark = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
              private let cardDark = UIColor(red: 28/255, green: 28/255, blue: 44/255, alpha: 1)
              private let accentTeal = UIColor(red: 6/255, green: 182/255, blue: 212/255, alpha: 1)

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = bgDark
                  if #available(iOS 13.0, *) { overrideUserInterfaceStyle = .dark }
                  title = "✍️ ارسم توقيعك"

                  navigationItem.leftBarButtonItem = UIBarButtonItem(title: "إلغاء", style: .plain, target: self, action: #selector(cancelTapped))
                  let doneBtn = UIBarButtonItem(title: "استخدام التوقيع", style: .done, target: self, action: #selector(doneTapped))
                  doneBtn.tintColor = accentTeal
                  navigationItem.rightBarButtonItem = doneBtn

                  let hint = UILabel()
                  hint.text = "استخدم إصبعك للتوقيع داخل الإطار بالأسفل"
                  hint.textColor = UIColor.white.withAlphaComponent(0.4)
                  hint.font = .systemFont(ofSize: 13, weight: .medium)
                  hint.textAlignment = .center
                  hint.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(hint)

                  let card = UIView()
                  card.backgroundColor = cardDark
                  card.layer.cornerRadius = 20
                  card.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(card)

                  drawView.strokeColor = .white
                  drawView.translatesAutoresizingMaskIntoConstraints = false
                  card.addSubview(drawView)

                  let clearBtn = UIButton(type: .system)
                  clearBtn.setTitle("🗑️  مسح التوقيع", for: .normal)
                  clearBtn.setTitleColor(UIColor.white.withAlphaComponent(0.6), for: .normal)
                  clearBtn.titleLabel?.font = .systemFont(ofSize: 14, weight: .semibold)
                  clearBtn.addTarget(self, action: #selector(clearTapped), for: .touchUpInside)
                  clearBtn.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(clearBtn)

                  NSLayoutConstraint.activate([
                      hint.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor, constant: 20),
                      hint.centerXAnchor.constraint(equalTo: view.centerXAnchor),

                      card.topAnchor.constraint(equalTo: hint.bottomAnchor, constant: 16),
                      card.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      card.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),
                      card.heightAnchor.constraint(equalToConstant: 260),

                      drawView.topAnchor.constraint(equalTo: card.topAnchor, constant: 8),
                      drawView.bottomAnchor.constraint(equalTo: card.bottomAnchor, constant: -8),
                      drawView.leadingAnchor.constraint(equalTo: card.leadingAnchor, constant: 8),
                      drawView.trailingAnchor.constraint(equalTo: card.trailingAnchor, constant: -8),

                      clearBtn.topAnchor.constraint(equalTo: card.bottomAnchor, constant: 16),
                      clearBtn.centerXAnchor.constraint(equalTo: view.centerXAnchor),
                  ])
              }

              @objc private func clearTapped() { drawView.clear() }
              @objc private func cancelTapped() { dismiss(animated: true) }
              @objc private func doneTapped() {
                  guard let image = drawView.exportImage() else {
                      let alert = UIAlertController(title: "⚠️ لا يوجد توقيع", message: "ارسم توقيعك أولاً بإصبعك", preferredStyle: .alert)
                      alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                      present(alert, animated: true)
                      return
                  }
                  dismiss(animated: true) { [weak self] in self?.onComplete?(image) }
              }
          }

          // MARK: - أنوتيشن مخصص لرسم صورة التوقيع فوق صفحة PDF

          final class SignatureStampAnnotation: PDFAnnotation {
              private let stampImage: UIImage

              init(bounds: CGRect, image: UIImage) {
                  self.stampImage = image
                  super.init(bounds: bounds, forType: .stamp, withProperties: nil)
              }

              required init?(coder: NSCoder) { fatalError("init(coder:) غير مدعوم") }

              override func draw(with box: PDFDisplayBox, in context: CGContext) {
                  guard let cgImage = stampImage.cgImage else { return }
                  context.saveGState()
                  context.draw(cgImage, in: bounds)
                  context.restoreGState()
              }
          }

          // MARK: - عارض PDF كامل (تصفح + توقيع + تكرار + دمج + مشاركة)

          final class PDFViewerViewController: UIViewController {
              private let fileURL: URL
              private let fileName: String
              private weak var browser: FileBrowserViewController?
              private let item: FileBrowserViewController.FileItem
              private let pdfView = PDFView()

              private let bgDark = UIColor(red: 18/255, green: 18/255, blue: 30/255, alpha: 1)
              private let accentTeal = UIColor(red: 6/255, green: 182/255, blue: 212/255, alpha: 1)

              init(fileURL: URL, fileName: String, browser: FileBrowserViewController, item: FileBrowserViewController.FileItem) {
                  self.fileURL = fileURL
                  self.fileName = fileName
                  self.browser = browser
                  self.item = item
                  super.init(nibName: nil, bundle: nil)
              }
              required init?(coder: NSCoder) { fatalError("init(coder:) غير مدعوم") }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = fileName
                  view.backgroundColor = bgDark
                  if #available(iOS 13.0, *) { overrideUserInterfaceStyle = .dark }

                  pdfView.frame = view.bounds
                  pdfView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  pdfView.backgroundColor = bgDark
                  pdfView.autoScales = true
                  pdfView.displayMode = .singlePageContinuous
                  pdfView.usePageViewController(false)
                  pdfView.document = PDFDocument(url: fileURL)
                  view.addSubview(pdfView)

                  let thumb = PDFThumbnailView()
                  thumb.pdfView = pdfView

                  let moreBtn = UIBarButtonItem(image: UIImage(systemName: "ellipsis.circle.fill"), style: .plain, target: self, action: #selector(moreTapped))
                  moreBtn.tintColor = accentTeal
                  navigationItem.rightBarButtonItem = moreBtn
              }

              @objc private func moreTapped() {
                  let sheet = UIAlertController(title: fileName, message: nil, preferredStyle: .actionSheet)
                  sheet.addAction(UIAlertAction(title: "✍️  توقيع الملف", style: .default) { [weak self] _ in self?.startSigning() })
                  sheet.addAction(UIAlertAction(title: "📑  تكرار الملف", style: .default) { [weak self] _ in
                      guard let self = self else { return }
                      self.browser?.duplicateItem(self.item)
                  })
                  sheet.addAction(UIAlertAction(title: "🔗  دمج مع ملف PDF آخر", style: .default) { [weak self] _ in self?.startMerge() })
                  sheet.addAction(UIAlertAction(title: "📤  مشاركة", style: .default) { [weak self] _ in self?.shareTapped() })
                  sheet.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                  if let popover = sheet.popoverPresentationController {
                      popover.barButtonItem = navigationItem.rightBarButtonItem
                  }
                  present(sheet, animated: true)
              }

              private func shareTapped() {
                  let activityVC = UIActivityViewController(activityItems: [fileURL], applicationActivities: nil)
                  if let popover = activityVC.popoverPresentationController {
                      popover.barButtonItem = navigationItem.rightBarButtonItem
                  }
                  present(activityVC, animated: true)
              }

              private func startSigning() {
                  let sigVC = SignatureViewController()
                  sigVC.onComplete = { [weak self] image in
                      self?.placeSignatureAndSave(image)
                  }
                  let nav = UINavigationController(rootViewController: sigVC)
                  present(nav, animated: true)
              }

              private func placeSignatureAndSave(_ signatureImage: UIImage) {
                  guard let document = pdfView.document,
                        let page = pdfView.currentPage ?? document.page(at: 0) else { return }

                  let pageBounds = page.bounds(for: .mediaBox)
                  let sigWidth = min(pageBounds.width * 0.42, 220)
                  let sigHeight = sigWidth * (signatureImage.size.height / max(signatureImage.size.width, 1))
                  let sigBounds = CGRect(x: pageBounds.width - sigWidth - 24, y: 24, width: sigWidth, height: sigHeight)

                  let stamp = SignatureStampAnnotation(bounds: sigBounds, image: signatureImage)
                  page.addAnnotation(stamp)
                  pdfView.setNeedsDisplay(pdfView.bounds)

                  guard document.write(to: fileURL) else {
                      let alert = UIAlertController(title: "❌ فشل الحفظ", message: "تعذر حفظ التوقيع في الملف", preferredStyle: .alert)
                      alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                      present(alert, animated: true)
                      return
                  }
                  browser?.showToast("✅ تم توقيع المستند وحفظه بنجاح")
              }

              private func startMerge() {
                  guard let browser = browser else { return }
                  let others = browser.allItems.filter { browser.isPDF($0) && $0.relPath != item.relPath }
                  guard !others.isEmpty else {
                      let alert = UIAlertController(title: "⚠️ لا يوجد ملف آخر", message: "لا يوجد ملف PDF آخر في هذا المجلد للدمج معه", preferredStyle: .alert)
                      alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                      present(alert, animated: true)
                      return
                  }
                  let sheet = UIAlertController(title: "🔗 دمج مع:", message: nil, preferredStyle: .actionSheet)
                  for other in others {
                      sheet.addAction(UIAlertAction(title: other.name, style: .default) { [weak self] _ in
                          guard let self = self else { return }
                          browser.mergePDFs([self.item, other])
                          self.navigationController?.popViewController(animated: true)
                      })
                  }
                  sheet.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                  if let popover = sheet.popoverPresentationController {
                      popover.barButtonItem = navigationItem.rightBarButtonItem
                  }
                  present(sheet, animated: true)
              }
          }

          // MARK: - امتداد المتصفح: فتح / توقيع / دمج / تكرار ملفات PDF

          extension FileBrowserViewController {

              func openPDFViewer(for item: FileItem) {
                  let fullItemPath = (documentsPath as NSString).appendingPathComponent(item.relPath)
                  let url = URL(fileURLWithPath: fullItemPath)
                  let viewer = PDFViewerViewController(fileURL: url, fileName: item.name, browser: self, item: item)
                  navigationController?.pushViewController(viewer, animated: true)
              }

              /// توقيع سريع من قائمة الملفات مباشرة (بدون فتح العارض)
              func signPDF(_ item: FileItem) {
                  let sigVC = SignatureViewController()
                  sigVC.onComplete = { [weak self] image in
                      self?.applySignature(image, to: item)
                  }
                  let nav = UINavigationController(rootViewController: sigVC)
                  present(nav, animated: true)
              }

              private func applySignature(_ image: UIImage, to item: FileItem) {
                  let fullItemPath = (documentsPath as NSString).appendingPathComponent(item.relPath)
                  let url = URL(fileURLWithPath: fullItemPath)
                  guard let document = PDFDocument(url: url),
                        let page = document.page(at: max(document.pageCount - 1, 0)) else {
                      showAlert(title: "❌ خطأ", message: "تعذر فتح ملف PDF")
                      return
                  }
                  let pageBounds = page.bounds(for: .mediaBox)
                  let sigWidth = min(pageBounds.width * 0.42, 220)
                  let sigHeight = sigWidth * (image.size.height / max(image.size.width, 1))
                  let sigBounds = CGRect(x: pageBounds.width - sigWidth - 24, y: 24, width: sigWidth, height: sigHeight)
                  let stamp = SignatureStampAnnotation(bounds: sigBounds, image: image)
                  page.addAnnotation(stamp)

                  guard document.write(to: url) else {
                      showAlert(title: "❌ فشل الحفظ", message: "تعذر حفظ التوقيع")
                      return
                  }
                  reload()
                  showToast("✅ تم توقيع \(item.name)")
              }

              /// دمج عدة ملفات PDF في ملف واحد جديد داخل نفس المجلد
              func mergePDFs(_ items: [FileItem]) {
                  guard items.count >= 2 else { return }
                  let merged = PDFDocument()
                  var pageIndex = 0
                  for pdfItem in items {
                      let fullItemPath = (documentsPath as NSString).appendingPathComponent(pdfItem.relPath)
                      guard let doc = PDFDocument(url: URL(fileURLWithPath: fullItemPath)) else { continue }
                      for i in 0..<doc.pageCount {
                          if let page = doc.page(at: i) {
                              merged.insert(page, at: pageIndex)
                              pageIndex += 1
                          }
                      }
                  }
                  guard merged.pageCount > 0 else {
                      showAlert(title: "❌ فشل الدمج", message: "تعذرت قراءة ملفات PDF المحددة")
                      return
                  }
                  var name = "مدمج.pdf"
                  var n = 2
                  while FileManager.default.fileExists(atPath: (fullPath as NSString).appendingPathComponent(name)) {
                      name = "مدمج \(n).pdf"
                      n += 1
                  }
                  let destURL = URL(fileURLWithPath: (fullPath as NSString).appendingPathComponent(name))
                  guard merged.write(to: destURL) else {
                      showAlert(title: "❌ فشل الحفظ", message: "تعذر حفظ الملف المدمج")
                      return
                  }
                  isSelecting = false
                  selectedPaths.removeAll()
                  tableView.setEditing(false, animated: true)
                  setupToolbar()
                  reload()
                  showToast("✅ تم إنشاء ملف مدمج جديد: \(name)")
              }

              /// إنشاء نسخة مطابقة من أي ملف أو مجلد بنفس المكان
              func duplicateItem(_ item: FileItem) {
                  let fm = FileManager.default
                  let srcFull = (documentsPath as NSString).appendingPathComponent(item.relPath)
                  let ext = (item.name as NSString).pathExtension
                  let base = (item.name as NSString).deletingPathExtension
                  var candidate = ext.isEmpty ? "\(base) - نسخة" : "\(base) - نسخة.\(ext)"
                  var n = 2
                  while fm.fileExists(atPath: (fullPath as NSString).appendingPathComponent(candidate)) {
                      candidate = ext.isEmpty ? "\(base) - نسخة \(n)" : "\(base) - نسخة \(n).\(ext)"
                      n += 1
                  }
                  let destFull = (fullPath as NSString).appendingPathComponent(candidate)
                  do {
                      try fm.copyItem(atPath: srcFull, toPath: destFull)
                      reload()
                      showToast("✅ تم إنشاء نسخة: \(candidate)")
                  } catch {
                      showAlert(title: "❌ فشل النسخ", message: error.localizedDescription)
                  }
              }
          }
          PEOF

      - name: Generate Source - Entry Point
        run: |
          cd ${{ github.workspace }}
          cat > main.swift << 'EEOF'
          import UIKit

          // MARK: - App Delegate

          final class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let root = FileBrowserViewController(relativePath: "")
                  let nav = UINavigationController(rootViewController: root)
                  window?.rootViewController = nav
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          // MARK: - Entry point (this file must be named main.swift)

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EEOF

      - name: Generate Info.plist
        run: |
          cd ${{ github.workspace }}
          cat > Resources/Info.plist << 'MEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>TwentyOneS</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.s21</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>21s</string>
              <key>CFBundleDisplayName</key>
              <string>21s</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                      </array>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60@2x.png</string>
                          <string>AppIcon76x76@2x~ipad.png</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          MEOF

      - name: Build Application
        run: |
          cd ${{ github.workspace }}
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          xcrun swiftc main.swift SimpleUnzip.swift UIComponents.swift FileBrowserCore.swift FileBrowserTable.swift Viewers.swift PDFTools.swift \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios14.0 \
            -O \
            -framework UIKit \
            -framework Foundation \
            -framework PDFKit \
            -o TwentyOneS

          file TwentyOneS

      - name: Create IPA Package
        run: |
          cd ${{ github.workspace }}
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/TwentyOneS.app

          cp TwentyOneS build-output/Payload/TwentyOneS.app/TwentyOneS
          cp Resources/Info.plist build-output/Payload/TwentyOneS.app/Info.plist
          cp "Resources/AppIcon60x60@2x.png" build-output/Payload/TwentyOneS.app/
          cp "Resources/AppIcon76x76@2x~ipad.png" build-output/Payload/TwentyOneS.app/

          ldid -S build-output/Payload/TwentyOneS.app/TwentyOneS

          cd build-output
          zip -r -q ../artifacts/TwentyOneS.ipa Payload/
          cd ..

          echo "IPA contents:"
          unzip -l artifacts/TwentyOneS.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwentyOneS-IPA
          path: artifacts/TwentyOneS.ipa
          retention-days: 30
