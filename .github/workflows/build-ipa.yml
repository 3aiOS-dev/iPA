                                          _ = authManager.login(phoneNumber: fullPhoneNumber, password: password)
                                      } else {
                                          _ = authManager.signUp(
                                              phoneNumber: fullPhoneNumber,
                                              username: username,
                                              password: password,
                                              confirmPassword: confirmPassword
                                          )
                                      }
