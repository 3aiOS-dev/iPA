              static var storeSub: Color    { ThemePalette.sub }
              static var storePrimary: Color{ ThemePalette.primary }
              static var storePrimaryDk: Color{ ThemePalette.primaryDk }
              static var storePink: Color   { ThemePalette.accent }
              static var storeCyan: Color   { ThemePalette.cyan }
              static var storeYellow: Color { ThemePalette.yellow }
              static var storeBlush: Color  { ThemePalette.blush }
              static var storeDivider: Color{ ThemePalette.divider }
