                          .foregroundColor(active ? .white : .storeText)
                          .padding(.horizontal, 14).padding(.vertical, 8)
                          .background(Capsule().fill(active ? Color.storePrimary : Color.storeCard))
                          .overlay(Capsule().stroke(active ? Color.clear : Color.storeDivider, lineWidth: 1))
                  }
                  .buttonStyle(.plain)
              }
              private func handleAppear(app: StoreAPIApp) {
                  let threshold = max(0, visibleItems.count - 20)
                  if let idx = visibleItems.firstIndex(of: app), idx >= threshold {
                      if visiblePage + 1 < filteredPages { visiblePage += 1 }
                  }
              }
