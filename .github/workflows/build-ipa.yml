      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            Constants.swift \
            HapticManager.swift \
            Models.swift \
            Repositories.swift \
            FavoritesStore.swift \
            AuthManager.swift \
            Countries.swift \
            OnboardingView.swift \
            AuthViews.swift \
            StoreView.swift \
            ContentView.swift \
            VIP21StoreApp.swift \
            Settings.swift \
            StatusScreens.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework ImageIO \
            -framework MobileCoreServices \
            -framework Network \
            -framework CFNetwork \
            -framework CoreImage \
            -o VIP21Store
          file VIP21Store

