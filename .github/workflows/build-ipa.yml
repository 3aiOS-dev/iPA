              var name: String?
              var bundle_id: String?
              var version: String?
              var size_bytes: Int64?
              var error: String?
          }

          // ===================== AUTH =====================
          @MainActor
          final class CloudAuth: ObservableObject {
              static let shared = MainActor.assumeIsolated { CloudAuth() }

              @Published var accessToken: String? = UserDefaults.standard.string(forKey: "ones_access_token")
              @Published var refreshToken: String? = UserDefaults.standard.string(forKey: "ones_refresh_token")
              @Published var email: String? = UserDefaults.standard.string(forKey: "ones_email")
              @Published var userId: String? = UserDefaults.standard.string(forKey: "ones_user_id")
              @Published var lastError: String?
              @Published var busy = false

              var isSignedIn: Bool { accessToken != nil }
              // كل حساب جديد يصبح مشرفًا/أدمن تلقائيًا عبر قاعدة البيانات
              var isAdmin: Bool { isSignedIn }

              private init() {}

              private func persist(_ json: [String: Any]) -> Bool {
                  guard let token = json["access_token"] as? String else { return false }
                  accessToken = token
                  refreshToken = json["refresh_token"] as? String
                  if let user = json["user"] as? [String: Any] {
                      userId = user["id"] as? String
                      email = user["email"] as? String
                  }
                  UserDefaults.standard.set(accessToken, forKey: "ones_access_token")
                  UserDefaults.standard.set(refreshToken, forKey: "ones_refresh_token")
                  UserDefaults.standard.set(userId, forKey: "ones_user_id")
                  UserDefaults.standard.set(email, forKey: "ones_email")
                  return true
              }

              func signIn(email: String, password: String, done: @escaping (Bool) -> Void) {
                  post(path: "/token?grant_type=password", body: ["email": email, "password": password], done: done)
              }

              func signUp(email: String, password: String, done: @escaping (Bool) -> Void) {
                  post(path: "/signup", body: ["email": email, "password": password], done: done)
              }

              private func post(path: String, body: [String: Any], done: @escaping (Bool) -> Void) {
                  guard let url = URL(string: CloudConfig.authURL + path) else { done(false); return }
                  busy = true
                  var req = URLRequest(url: url, timeoutInterval: 30)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.setValue(CloudConfig.anonKey, forHTTPHeaderField: "apikey")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                  URLSession.shared.dataTask(with: req) { data, _, err in
                      DispatchQueue.main.async {
                          self.busy = false
                          guard let data = data,
                                let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                              self.lastError = err?.localizedDescription ?? "تعذّر الاتصال بالخادم"
                              done(false); return
                          }
                          if self.persist(obj) { self.lastError = nil; done(true) }
                          else {
                              self.lastError = (obj["msg"] as? String) ?? (obj["error_description"] as? String) ?? (obj["message"] as? String) ?? "فشل تسجيل الدخول"
                              done(false)
                          }
                      }
                  }.resume()
              }

              func signOut() {
                  accessToken = nil; refreshToken = nil; userId = nil; email = nil
                  ["ones_access_token", "ones_refresh_token", "ones_user_id", "ones_email"].forEach {
                      UserDefaults.standard.removeObject(forKey: $0)
                  }
              }
          }

          // ===================== REST CLIENT =====================
          @MainActor
          final class CloudAPI {
              static let shared = MainActor.assumeIsolated { CloudAPI() }
              private init() {}

              private func request(_ path: String, method: String = "GET", body: Data? = nil,
                                   prefer: String? = nil, isRest: Bool = true) -> URLRequest? {
                  let full = (isRest ? CloudConfig.restURL : CloudConfig.webBase) + path
                  guard let url = URL(string: full) else { return nil }
                  var req = URLRequest(url: url, timeoutInterval: 60)
                  req.httpMethod = method
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  if isRest { req.setValue(CloudConfig.anonKey, forHTTPHeaderField: "apikey") }
                  if let token = CloudAuth.shared.accessToken {
                      req.setValue("Bearer " + token, forHTTPHeaderField: "Authorization")
                  } else if isRest {
                      req.setValue("Bearer " + CloudConfig.anonKey, forHTTPHeaderField: "Authorization")
                  }
                  if let prefer = prefer { req.setValue(prefer, forHTTPHeaderField: "Prefer") }
                  req.httpBody = body
                  return req
              }

              private func send<T: Decodable>(_ req: URLRequest?, as type: T.Type, done: @escaping (T?, String?) -> Void) {
                  guard let req = req else { done(nil, "رابط غير صالح"); return }
                  URLSession.shared.dataTask(with: req) { data, response, err in
                      DispatchQueue.main.async {
                          if let err = err { done(nil, err.localizedDescription); return }
                          guard let data = data else { done(nil, "استجابة فارغة"); return }
                          if let http = response as? HTTPURLResponse, http.statusCode >= 400 {
                              done(nil, String(data: data, encoding: .utf8) ?? "خطأ \(http.statusCode)")
                              return
                          }
                          do { done(try JSONDecoder().decode(T.self, from: data), nil) }
                          catch { done(nil, error.localizedDescription) }
                      }
                  }.resume()
              }

              // ---------- APPS ----------
              func apps(done: @escaping ([CloudApp]) -> Void) {
                  send(request("/store_apps?select=*&is_published=eq.true&order=created_at.desc"), as: [CloudApp].self) { list, _ in
                      done(list ?? [])
                  }
              }

              func allApps(done: @escaping ([CloudApp]) -> Void) {
                  send(request("/store_apps?select=*&order=created_at.desc"), as: [CloudApp].self) { list, _ in done(list ?? []) }
              }

              func addApp(name: String, bundleId: String, version: String, size: Int64, category: String,
                          description: String, ipaURL: String, iconURL: String?, autoFetch: Bool,
                          done: @escaping (Bool, String?) -> Void) {
                  var payload: [String: Any] = [
                      "name": name, "bundle_id": bundleId, "version": version, "size_bytes": size,
                      "category": category, "description": description, "ipa_url": ipaURL, "auto_fetch": autoFetch
                  ]
                  if let iconURL = iconURL, !iconURL.isEmpty { payload["icon_url"] = iconURL }
                  let body = try? JSONSerialization.data(withJSONObject: payload)
                  send(request("/store_apps", method: "POST", body: body, prefer: "return=representation"),
                       as: [CloudApp].self) { list, err in done(list != nil && !(list!.isEmpty), err) }
              }

              func deleteApp(id: String, done: @escaping (Bool) -> Void) {
                  guard let req = request("/store_apps?id=eq.\(id)", method: "DELETE") else { done(false); return }
                  URLSession.shared.dataTask(with: req) { _, response, _ in
                      DispatchQueue.main.async {
                          let code = (response as? HTTPURLResponse)?.statusCode ?? 500
                          done(code < 400)
                      }
                  }.resume()
              }

              // ---------- AUTO FETCH FROM IPA ----------
              func fetchIpaMetadata(ipaURL: String, done: @escaping (IpaMetadata?) -> Void) {
                  let body = try? JSONSerialization.data(withJSONObject: ["ipa_url": ipaURL])
                  send(request("/api/public/ipa-metadata", method: "POST", body: body, isRest: false),
                       as: IpaMetadata.self) { meta, _ in done(meta) }
              }

              // ---------- CERTIFICATES ----------
              func certificates(activeOnly: Bool = false, done: @escaping ([CloudCertificate]) -> Void) {
                  let filter = activeOnly ? "&is_active=eq.true" : ""
                  send(request("/certificates?select=id,owner_name,is_active,expires_at\(filter)&order=created_at.desc"),
                       as: [CloudCertificate].self) { list, _ in done(list ?? []) }
              }

              func setCertificateActive(id: String, active: Bool, done: @escaping (Bool) -> Void) {
                  let body = try? JSONSerialization.data(withJSONObject: ["is_active": active])
                  guard let req = request("/certificates?id=eq.\(id)", method: "PATCH", body: body) else { done(false); return }
                  URLSession.shared.dataTask(with: req) { _, response, _ in
                      DispatchQueue.main.async { done(((response as? HTTPURLResponse)?.statusCode ?? 500) < 400) }
                  }.resume()
              }

              func uploadCertificateFile(data: Data, path: String, contentType: String, done: @escaping (String?) -> Void) {
                  guard let url = URL(string: CloudConfig.storageURL + "/object/certificates/" + path),
                        let token = CloudAuth.shared.accessToken else { done(nil); return }
                  var req = URLRequest(url: url, timeoutInterval: 120)
                  req.httpMethod = "POST"
                  req.setValue(contentType, forHTTPHeaderField: "Content-Type")
                  req.setValue(CloudConfig.anonKey, forHTTPHeaderField: "apikey")
                  req.setValue("Bearer " + token, forHTTPHeaderField: "Authorization")
                  req.httpBody = data
                  URLSession.shared.dataTask(with: req) { _, response, _ in
                      DispatchQueue.main.async {
                          let code = (response as? HTTPURLResponse)?.statusCode ?? 500
                          done(code < 400 ? path : nil)
                      }
                  }.resume()
              }

              func addCertificate(ownerName: String, p12Path: String, provisionPath: String, password: String,
                                  done: @escaping (Bool, String?) -> Void) {
                  let payload: [String: Any] = [
                      "owner_name": ownerName, "p12_path": p12Path,
                      "provision_path": provisionPath, "p12_password": password
                  ]
                  let body = try? JSONSerialization.data(withJSONObject: payload)
                  send(request("/certificates", method: "POST", body: body, prefer: "return=representation"),
                       as: [CloudCertificate].self) { list, err in done(list != nil, err) }
              }

              // ---------- DEVICES / UDID ----------
              func devices(done: @escaping ([CloudDevice]) -> Void) {
                  send(request("/devices?select=*&order=created_at.desc"), as: [CloudDevice].self) { list, _ in done(list ?? []) }
              }

              func device(udid: String, done: @escaping (CloudDevice?) -> Void) {
                  send(request("/devices?select=*&udid=eq.\(udid)"), as: [CloudDevice].self) { list, _ in done(list?.first) }
              }

              func linkSubscription(udid: String, code: String, done: @escaping (Bool, String?) -> Void) {
                  let payload: [String: Any] = [
                      "udid": udid, "subscription_code": code, "verified": true,
                      "verified_at": ISO8601DateFormatter().string(from: Date())
                  ]
                  let body = try? JSONSerialization.data(withJSONObject: payload)
                  send(request("/devices?on_conflict=udid", method: "POST", body: body,
                               prefer: "resolution=merge-duplicates,return=representation"),
                       as: [CloudDevice].self) { list, err in done(list != nil, err) }
              }

              // ---------- REAL SIGNING ----------
              func startInstall(appId: String, certificateId: String, udid: String?, done: @escaping (String?, String?) -> Void) {
                  var payload: [String: Any] = ["app_id": appId, "certificate_id": certificateId]
                  if let udid = udid, !udid.isEmpty { payload["udid"] = udid }
                  let body = try? JSONSerialization.data(withJSONObject: payload)
                  guard let req = request("/api/public/install", method: "POST", body: body, isRest: false) else {
                      done(nil, "رابط غير صالح"); return
                  }
                  URLSession.shared.dataTask(with: req) { data, _, err in
                      DispatchQueue.main.async {
                          guard let data = data,
                                let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                              done(nil, err?.localizedDescription ?? "تعذّر الاتصال بسيرفر التوقيع"); return
                          }
                          if let jobId = obj["job_id"] as? String { done(jobId, nil) }
                          else { done(nil, (obj["error"] as? String) ?? "فشل بدء التوقيع") }
                      }
                  }.resume()
              }

              func job(id: String, done: @escaping (CloudJob?) -> Void) {
                  send(request("/install_jobs?select=*&id=eq.\(id)"), as: [CloudJob].self) { list, _ in done(list?.first) }
              }

              func jobs(done: @escaping ([CloudJob]) -> Void) {
                  send(request("/install_jobs?select=*&order=created_at.desc&limit=50"), as: [CloudJob].self) { list, _ in done(list ?? []) }
              }
          }

