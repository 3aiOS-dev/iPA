          // ================= FORUM TAB VIEW — Twitter-style =================
          struct ONEsForumTabView: View {
              @ObservedObject private var content = ONEsContent.shared
              @ObservedObject private var session = ONEsSession.shared
              @ObservedObject private var extras = ONEsSocialExtras.shared
              @State private var section = 0
              @State private var query = ""
              @State private var showComposer = false
              @State private var showProfileEditor = false
              @State private var showAuth = false

              // 0:لك  1:الجميع  2:المتابَعون  3:الترند  4:المحفوظات  5:الأخبار  6:العروض  7:النشاط
              private var filtered: [ONEsPost] {
                  var list = content.posts
                  switch section {
                  case 2: list = list.filter { extras.following.contains($0.author) }
                  case 3: list = list.sorted { ($0.likes + $0.reposts * 2) > ($1.likes + $1.reposts * 2) }
                  case 4: list = list.filter { extras.bookmarks.contains($0.id) }
                  default: break
                  }
                  let q = query.trimmingCharacters(in: .whitespacesAndNewlines)
                  if !q.isEmpty {
                      list = list.filter {
                          $0.body.localizedCaseInsensitiveContains(q) ||
                          (content.names[$0.author] ?? "").localizedCaseInsensitiveContains(q)
                      }
                  }
                  return list
              }

              var body: some View {
                  NavigationStack {
                      ZStack(alignment: .bottomTrailing) {
                          Color.storeBg.ignoresSafeArea()

                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 0) {
                                  // Header — Twitter style
                                  HStack {
                                      if session.isSignedIn {
                                          Button { showProfileEditor = true } label: {
                                              ONEsAvatar(name: session.username, uid: session.userID, size: 32)
                                          }
                                      } else {
                                          Button { showAuth = true } label: {
                                              Image(systemName: "person.circle")
                                                  .font(.system(size: 22))
                                                  .foregroundColor(.white.opacity(0.7))
                                          }
                                      }
                                      Spacer()
                                      Text("المنتدى")
                                          .font(.system(size: 18, weight: .heavy))
                                          .foregroundColor(.white)
                                      Spacer()
                                      if session.isSignedIn {
                                          Button { showComposer = true } label: {
                                              Image(systemName: "plus")
                                                  .font(.system(size: 16, weight: .bold))
                                                  .foregroundColor(.white)
                                                  .frame(width: 32, height: 32)
                                                  .background(Circle().fill(
                                                      LinearGradient(colors: [Color.storePrimary, Color.storePink],
                                                                     startPoint: .topLeading, endPoint: .bottomTrailing)
                                                  ))
                                          }
                                          .buttonStyle(.plain)
                                      }
                                  }
                                  .padding(.horizontal, 16)
                                  .padding(.vertical, 10)

                                  // Tabs
                                  ONEsFeedTabBar(section: $section)

                                  Divider().overlay(Color.white.opacity(0.08)).padding(.top, 0)

                                  // Search bar
                                  HStack(spacing: 10) {
                                      Image(systemName: "magnifyingglass")
                                          .font(.system(size: 14))
                                          .foregroundColor(.white.opacity(0.35))
                                      TextField("", text: $query,
                                                prompt: Text("ابحث في المنتدى…").foregroundColor(.white.opacity(0.3)))
                                          .foregroundColor(.white)
                                          .font(.system(size: 14))
                                          .background(Color.clear)
                                          .tint(Color.storePrimary)
                                      if !query.isEmpty {
                                          Button { query = "" } label: {
                                              Image(systemName: "xmark.circle.fill")
                                                  .font(.system(size: 14))
                                                  .foregroundColor(.white.opacity(0.35))
                                          }
                                          .buttonStyle(.plain)
                                      }
                                  }
                                  .padding(.horizontal, 14).padding(.vertical, 10)
                                  .background(Capsule().fill(Color.white.opacity(0.05)))
                                  .padding(.horizontal, 16)
                                  .padding(.vertical, 8)

                                  // Stories row hidden on all sections for cleaner look
                                  // if section == 1 { ONEsStoriesRow() }

                                  // Section content
                                  if section == 7 {
                                      ONEsForumActivityView()
                                          .padding(.top, 12)
                                  } else if section == 5 {
                                      ONEsNewsList()
                                  } else if section == 6 {
                                      ONEsOffersList()
                                  } else if !session.isSignedIn && section != 5 && section != 6 && section != 7 {
                                      // Show auth prompt instead of inline auth
                                      VStack(spacing: 16) {
                                          Image(systemName: "person.crop.circle.badge.questionmark")
                                              .font(.system(size: 44))
                                              .foregroundColor(Color.storePrimary.opacity(0.6))
                                          Text("سجّل دخولك للمشاركة")
                                              .font(.system(size: 16, weight: .bold))
                                              .foregroundColor(.white)
                                          Button { showAuth = true } label: {
                                              Text("تسجيل الدخول / إنشاء حساب")
                                                  .font(.system(size: 14, weight: .bold))
                                                  .foregroundColor(.white)
                                                  .frame(maxWidth: .infinity)
                                                  .padding(.vertical, 12)
                                                  .background(
                                                      Capsule().fill(
                                                          LinearGradient(colors: [Color.storePrimary, Color.storePink],
                                                                         startPoint: .leading, endPoint: .trailing)
                                                      )
                                                  )
                                          }
                                          .buttonStyle(.plain)
                                          .padding(.horizontal, 40)
                                      }
                                      .padding(.vertical, 40)
                                      // Still show posts in anonymous mode for "لك" tab
                                      if section == 0 {
                                          LazyVStack(spacing: 12) {
                                              ForEach(filtered) { post in
                                                  ONEsPostCard(post: post, anonymous: false)
                                              }
                                          }
                                          .padding(.horizontal, 16)
                                      }
                                  } else {
                                      if filtered.isEmpty {
                                          VStack(spacing: 10) {
                                              Image(systemName: emptyIcon)
                                                  .font(.system(size: 34))
                                                  .foregroundColor(.white.opacity(0.25))
                                              Text(emptyMessage)
                                                  .font(.system(size: 13))
                                                  .foregroundColor(.white.opacity(0.5))
                                                  .multilineTextAlignment(.center)
                                                  .padding(.horizontal, 40)
                                          }
                                          .frame(maxWidth: .infinity)
                                          .padding(.vertical, 50)
                                      }
                                      LazyVStack(spacing: 12) {
                                          ForEach(filtered) { post in
                                              ONEsPostCard(post: post, anonymous: false)
                                          }
                                      }
                                      .padding(.horizontal, 16)
                                  }
                              }
                              .padding(.vertical, 10)
                              .padding(.bottom, 100)
                          }
                          .refreshable {
                              ONEsContent.shared.loadForum()
                          }

                          if false {
                              Button { showComposer = true } label: {
                                  Image(systemName: "plus")
                                      .font(.system(size: 24, weight: .bold))
                                      .foregroundColor(.white)
                                      .frame(width: 56, height: 56)
                                      .background(
                                          Circle().fill(
                                              LinearGradient(colors: [Color.storePrimary, Color.storePink],
                                                             startPoint: .topLeading, endPoint: .bottomTrailing)
                                          )
                                      )
                                      .shadow(color: Color.storePrimary.opacity(0.5), radius: 12, x: 0, y: 6)
                              }
                              .buttonStyle(.plain)
                              .padding(.trailing, 20)
                              .padding(.bottom, 24)
                          }
                      }
                      .sheet(isPresented: $showComposer) { ONEsComposerSheet() }
                      .sheet(isPresented: $showProfileEditor) { ONEsProfileEditorSheet() }
                      .fullScreenCover(isPresented: $showAuth) {
                          ForumAuthScreen()
                      }
                  }
                  .onAppear {
                      ONEsContent.shared.loadForum()
                      ONEsContent.shared.loadStoreContent()
                  }
              }

              private var emptyIcon: String {
                  switch section {
                  case 2: return "person.2"
                  case 3: return "flame"
                  case 4: return "bookmark"
                      case 7: return "bell.badge"
                  default: return "sparkles"
                  }
              }

              private var emptyMessage: String {
                  switch section {
                  case 2: return "تابع أشخاصًا ليظهر محتواهم هنا"
                  case 3: return "لا يوجد ترند بعد — انشر منشورًا مميزًا!"
                  case 4: return "لا توجد منشورات محفوظة"
                      case 7: return "لا يوجد نشاط جديد في المنتدى"
                  default: return "لا توجد منشورات بعد — كن أول من ينشر!"
                  }
              }
          }

          // ================= COMMENT ROW (with replies) =================
          struct ONEsCommentRow: View {
              let comment: ONEsComment
              let all: [ONEsComment]
              let depth: Int
              @Binding var replyTo: ONEsComment?
              @ObservedObject private var content = ONEsContent.shared
              @ObservedObject private var extras = ONEsSocialExtras.shared
              @ObservedObject private var session = ONEsSession.shared

              private var name: String {
                  content.names[comment.author] ?? (comment.authorName.isEmpty ? "مستخدم" : comment.authorName)
              }
              private var replies: [ONEsComment] { all.filter { $0.parentID == comment.id } }

              var body: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack(alignment: .top, spacing: 10) {
                          ONEsAvatar(name: name, uid: comment.author, size: depth > 0 ? 28 : 34)
                          VStack(alignment: .leading, spacing: 3) {
                              HStack(spacing: 6) {
                                  Text(name)
                                      .font(.system(size: 13, weight: .bold))
                                      .foregroundColor(.white)
                                  Text(onesTimeAgo(comment.createdAt))
                                      .font(.system(size: 11))
                                      .foregroundColor(.white.opacity(0.45))
                                  Spacer()
                                  if session.userID == comment.author {
                                      Button { extras.deleteComment(comment) } label: {
                                          Image(systemName: "trash")
                                              .font(.system(size: 11))
                                              .foregroundColor(.red.opacity(0.75))
                                      }
                                      .buttonStyle(.plain)
                                  }
                              }
                              ONEsRichText(text: comment.body, baseSize: 14)
                              Button { replyTo = comment } label: {
                                  Label("رد", systemImage: "arrowshape.turn.up.left")
                                      .font(.system(size: 11, weight: .bold))
                                      .foregroundColor(Color.storePrimary)
                              }
                              .buttonStyle(.plain)
                          }
                      }
                      ForEach(replies) { r in
                          ONEsCommentRow(comment: r, all: all, depth: depth + 1, replyTo: $replyTo)
                              .padding(.leading, 22)
                      }
                  }
