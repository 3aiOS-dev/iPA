              /// هالة متحركة لصفحة تفاصيل التطبيق (بدون مكعب 3D)
              static func detailAura(title: String) -> String {
                  let pal = ThemeManager.p
                  var dots = ""
                  for i in 0..<18 {
                      let l = (i * 53) % 100
                      let d = Double(i) * 0.32
                      let sz = 6 + (i % 4) * 4
                      dots += "<i style='left:\(l)%;width:\(sz)px;height:\(sz)px;animation-delay:\(d)s'></i>"
                  }
                  let body = """
                  <div class="halo"></div>
                  <div class="ring r1"></div><div class="ring r2"></div>
                  <div class="dots">\(dots)</div>
                  <div class="ttl">\(title)</div>
                  """
                  let css = """
                  .halo{position:absolute;left:50%;top:44%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;
                  background:radial-gradient(circle,\(pal.primaryHex)66,transparent 62%);filter:blur(8px);
                  animation:breathe 3.6s ease-in-out infinite}
                  @keyframes breathe{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.15);opacity:1}}
                  .ring{position:absolute;left:50%;top:44%;border-radius:50%;border:1.5px solid \(pal.accentHex)66}
                  .r1{width:150px;height:150px;margin:-75px 0 0 -75px;animation:sp 9s linear infinite}
                  .r2{width:210px;height:210px;margin:-105px 0 0 -105px;border-style:dashed;animation:sp 14s linear infinite reverse}
                  @keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
                  .dots{position:absolute;inset:0;overflow:hidden}
                  .dots i{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.55);
                  animation:rise 6s linear infinite}
                  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}
                  20%{opacity:.9}100%{transform:translateY(-300px) scale(1.1);opacity:0}}
                  .ttl{position:absolute;bottom:14px;width:100%;text-align:center;font-size:13px;font-weight:800;
                  text-shadow:0 2px 10px rgba(0,0,0,.4);opacity:.95}
                  """
                  return page(body, css)
              }

              /// خلفية متحركة ناعمة خلف أيقونة التطبيق (بدون رموز أو إيموجي)
              static func iconAura(seed: Int) -> String {
                  let pal = ThemeManager.p
                  var sparks = ""
                  for i in 0..<10 {
                      let l = (i * 37 + seed * 11) % 100
                      let t = (i * 23 + seed * 7) % 100
                      let d = Double(i) * 0.28
                      sparks += "<b style='left:\(l)%;top:\(t)%;animation-delay:\(d)s'></b>"
                  }
                  let body = """
                  <div class="wave"></div>
                  <div class="sparks">\(sparks)</div>
                  """
                  let css = """
                  .wave{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:44%;
                  background:conic-gradient(from 0deg,\(pal.primaryHex)55,\(pal.accentHex)44,\(pal.cyanHex)44,\(pal.primaryHex)55);
                  filter:blur(14px);animation:swirl 9s linear infinite}
                  @keyframes swirl{from{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12)}to{transform:rotate(360deg) scale(1)}}
                  .sparks{position:absolute;inset:0;overflow:hidden}
                  .sparks b{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;
                  box-shadow:0 0 8px \(pal.accentHex);animation:tw 2.6s ease-in-out infinite}
                  @keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1.5)}}
                  """
                  return page(body, css)
              }

