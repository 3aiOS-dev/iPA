      # =========================================================
      # SOURCE CODE - DateHelpers.swift
      # =========================================================
      - name: Generate code - DateHelpers.swift
        run: |
          cat > DateHelpers.swift << 'DATEHELP'
          import Foundation

          func parseDate(_ raw: String) -> Date? {
              let iso = ISO8601DateFormatter()
              iso.formatOptions = [.withInternetDateTime, .withFractionalSeconds]
              if let d = iso.date(from: raw) { return d }
              if let d = ISO8601DateFormatter().date(from: raw) { return d }
              let f = DateFormatter()
              f.locale = Locale(identifier: "en_US_POSIX")
              f.timeZone = TimeZone(secondsFromGMT: 0)
              for fmt in ["yyyy-MM-dd'T'HH:mm:ssZ", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd"] {
                  f.dateFormat = fmt
                  if let d = f.date(from: raw) {
                      return fmt == "yyyy-MM-dd" ? d.addingTimeInterval(86_399) : d
                  }
              }
              return nil
          }
          DATEHELP

      # =========================================================
      # SOURCE CODE - Models.swift (store models only)
      # =========================================================
      - name: Generate code - Models.swift
        run: |
          cat > Models.swift << 'VIPEOF'
          import Foundation

          struct StoreAPIResponse: Codable {
              let lastUpdated: String?
              let apps: [StoreAPIApp]

              enum CodingKeys: String, CodingKey {
                  case lastUpdated = "last_updated"
                  case apps
              }

              private struct AppsWrapper: Decodable {
                  let apps: [StoreAPIApp]
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.lastUpdated = try? c.decode(String.self, forKey: .lastUpdated)

                  // Try to decode as array directly
                  if let arr = try? c.decode([StoreAPIApp].self, forKey: .apps) {
                      self.apps = arr
                  } else if let wrapper = try? c.decode(AppsWrapper.self, forKey: .apps) {
                      self.apps = wrapper.apps
                  } else {
                      self.apps = []
                  }
              }

              func encode(to encoder: Encoder) throws {
                  var c = encoder.container(keyedBy: CodingKeys.self)
                  try c.encodeIfPresent(lastUpdated, forKey: .lastUpdated)
                  try c.encode(apps, forKey: .apps)
              }
          }

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let bundleVersion: String?
              let ipaSize: String?
              let githubUrl: String?
              let archiveUrl: String?
              let ipaUrl: String?
              let host: String?
              let icon: String?
              let description: String?
              let screenshots: [String]?
              let category: String?
              let createdAt: String?
              let updatedAt: String?
              let downloadURL: String?
              let down: String?
              let iconURL: String?
              let localizedDescription: String?
              let developerName: String?
              let version: String?
              let versionDate: String?
              let fullDate: String?
              let size: Double?
              let type: Int?

              enum CodingKeys: String, CodingKey {
                  case id, name, bundleId, bundleVersion, ipaSize, githubUrl, archiveUrl, ipaUrl, host, icon, description, screenshots, category, createdAt, updatedAt, downloadURL, down, iconURL, localizedDescription, developerName, version, versionDate, fullDate, size, type
              }

              var cleanSize: String {
                  if let s = size, s > 0 {
                      let f = ByteCountFormatter()
                      f.allowedUnits = [.useMB, .useGB, .useKB]
                      f.countStyle = .file
                      return f.string(fromByteCount: Int64(s))
                  }
                  return ipaSize ?? "-"
              }

              var cleanDescription: String {
                  (description ?? localizedDescription ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
              }

              var resolvedDownloadURL: String? {
                  ipaUrl ?? downloadURL ?? down ?? githubUrl ?? archiveUrl
              }

              var publishedDate: Date? {
                  let raw = createdAt ?? updatedAt ?? versionDate ?? fullDate
                  return raw.flatMap { parseDate($0) }
              }
          }

          struct DownloadRepository: Codable, Identifiable, Hashable {
              let id: String
              let name: String
              let feedURL: String
              let homepage: String
              let enabled: Bool
              let maxGB: Double
          }

          struct DownloadQuota: Codable, Identifiable, Hashable {
              let id: String
              let totalBytes: Int64
              let usedBytes: Int64
              var freeBytes: Int64 { max(0, totalBytes - usedBytes) }
          }
          VIPEOF

      # =========================================================
      # SOURCE CODE - Repositories.swift
      # =========================================================
      - name: Generate code - Repositories.swift
        run: |
          cat > Repositories.swift << 'VIPEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class RepositoriesStore: ObservableObject {
              static let shared = RepositoriesStore()
              @Published private(set) var repositories: [DownloadRepository]
              @Published private(set) var quota: DownloadQuota
              @Published private(set) var totalAppsAvailable: Int = 0

              private let keyRepos = "repositories.v1"
              private let keyQuota = "quota.v1"
              private let d = UserDefaults.standard

              private init() {
                  if let data = d.data(forKey: keyQuota),
                     let decoded = try? JSONDecoder().decode(DownloadQuota.self, from: data) {
                      self.quota = decoded
                  } else {
                      self.quota = DownloadQuota(id: "user-quota", totalBytes: 1000 * 1_073_741_824, usedBytes: 0)
                  }
                  if let data = d.data(forKey: keyRepos),
                     let decoded = try? JSONDecoder().decode([DownloadRepository].self, from: data) {
                      self.repositories = decoded
                  } else {
                      self.repositories = [
                          DownloadRepository(id: "21s-admin-panel", name: "لوحة تحكم ONEs",
                                             feedURL: "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app/api/public/store/apps",
                                             homepage: "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app",
                                             enabled: true, maxGB: 500),
                          DownloadRepository(id: "apptesters-mirror", name: "AppTesters Mirror",
                                             feedURL: "https://repo.apptesters.org/index.json",
                                             homepage: "https://apptesters.org",
                                             enabled: true, maxGB: 250),
                          DownloadRepository(id: "21s-originals", name: "ONEs Originals",
                                             feedURL: "https://21s.app/repo/apps.json",
                                             homepage: "https://21s.app",
                                             enabled: true, maxGB: 500)
                      ]
                  }
                  persistRepositories()
                  persistQuota()
              }

              func setEnabled(_ enabled: Bool, for repo: DownloadRepository) {
                  guard let idx = repositories.firstIndex(where: { $0.id == repo.id }) else { return }
                  repositories[idx] = DownloadRepository(id: repo.id, name: repo.name, feedURL: repo.feedURL,
                                                         homepage: repo.homepage, enabled: enabled, maxGB: repo.maxGB)
                  persistRepositories()
              }

              func resetQuotaUsage() {
                  quota = DownloadQuota(id: quota.id, totalBytes: quota.totalBytes, usedBytes: 0)
                  persistQuota()
              }

              func addUsedBytes(_ bytes: Int64) {
                  quota = DownloadQuota(id: quota.id, totalBytes: quota.totalBytes, usedBytes: quota.usedBytes + bytes)
                  persistQuota()
              }

              func updateTotalApps(_ count: Int) { totalAppsAvailable = count }

              private func persistRepositories() {
                  if let data = try? JSONEncoder().encode(repositories) { d.set(data, forKey: keyRepos) }
              }
              private func persistQuota() {
                  if let data = try? JSONEncoder().encode(quota) { d.set(data, forKey: keyQuota) }
              }
          }
          VIPEOF

      # =========================================================
      # SOURCE CODE - FavoritesStore.swift
      # =========================================================
      - name: Generate code - FavoritesStore.swift
        run: |
          cat > FavoritesStore.swift << 'FAVEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class FavoritesStore: ObservableObject {
              static let shared = FavoritesStore()
              @Published private(set) var items: [StoreAPIApp] = []
              private let key = "favorites.v1"
              private let d = UserDefaults.standard

              private init() { load() }

              private func load() {
                  guard let data = d.data(forKey: key),
                        let decoded = try? JSONDecoder().decode([StoreAPIApp].self, from: data) else { return }
                  items = decoded
              }
              private func save() {
                  if let data = try? JSONEncoder().encode(items) { d.set(data, forKey: key) }
              }

              func contains(_ app: StoreAPIApp) -> Bool { items.contains(where: { $0.id == app.id }) }

              func toggle(_ app: StoreAPIApp) {
                  if contains(app) {
                      items.removeAll { $0.id == app.id }
                      HapticManager.shared.impact(.light)
                  } else {
                      items.insert(app, at: 0)
                      HapticManager.shared.success()
                  }
                  save()
              }

              func remove(_ app: StoreAPIApp) {
                  items.removeAll { $0.id == app.id }
                  save()
              }
              func clearAll() {
                  items.removeAll()
                  save()
              }
          }

          struct FavoriteButton: View {
              let app: StoreAPIApp
              var size: CGFloat = 40
              @ObservedObject private var store = FavoritesStore.shared

              var body: some View {
                  let isFav = store.contains(app)
                  Button {
                      store.toggle(app)
                  } label: {
                      Image(systemName: isFav ? "heart.fill" : "heart")
                          .font(.system(size: size * 0.45, weight: .bold))
                          .foregroundColor(isFav ? .white : Color.storePink)
                          .frame(width: size, height: size)
                          .background(
                              Circle()
                                  .fill(isFav
                                        ? LinearGradient(colors: [Color.storePink, Color.storePrimary],
                                                         startPoint: .topLeading, endPoint: .bottomTrailing)
                                        : LinearGradient(colors: [Color.white], startPoint: .top, endPoint: .bottom))
                          )
                          .overlay(
                              Circle()
                                  .stroke(isFav ? Color.clear : Color.storeDivider, lineWidth: 1)
                          )
                          .shadow(color: isFav ? Color.storePink.opacity(0.35) : Color.black.opacity(0.06),
                                  radius: isFav ? 8 : 4, y: 2)
                  }
                  .buttonStyle(.plain)
                  .animation(.spring(response: 0.3, dampingFraction: 0.6), value: isFav)
              }
          }
          FAVEOF

      # =========================================================
      # SOURCE CODE - NotificationsManager.swift (simplified)
      # =========================================================
      - name: Generate code - NotificationsManager.swift
        run: |
          cat > NotificationsManager.swift << 'NOTEOF'
          import SwiftUI
          import UserNotifications

          struct AppNotificationItem: Identifiable, Equatable {
              let id = UUID()
              let title: String
              let body: String
              let icon: String
              var iconURL: String? = nil
              var badgeText: String? = nil
              let date = Date()
          }

          @MainActor
          final class NotificationsManager: ObservableObject {
              static let shared = MainActor.assumeIsolated { NotificationsManager() }
              @Published var enabled: Bool = UserDefaults.standard.object(forKey: "notif_enabled_21s") as? Bool ?? true
              @Published var history: [AppNotificationItem] = []
              @Published var banner: AppNotificationItem? = nil

              private init() {}

              func requestAuthorization() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }

              func setEnabled(_ value: Bool) {
                  enabled = value
                  UserDefaults.standard.set(value, forKey: "notif_enabled_21s")
                  if value { requestAuthorization() }
              }

              func push(title: String, body: String, icon: String = "bell.fill", iconURL: String? = nil, badgeText: String? = nil) {
                  let item = AppNotificationItem(title: title, body: body, icon: icon, iconURL: iconURL, badgeText: badgeText)
                  history.insert(item, at: 0)
                  if history.count > 60 { history.removeLast(history.count - 60) }
                  withAnimation(.spring(response: 0.4, dampingFraction: 0.8)) { banner = item }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 5) {
                      if self.banner?.id == item.id {
                          withAnimation(.easeOut(duration: 0.25)) { self.banner = nil }
                      }
                  }
                  guard enabled else { return }
                  let content = UNMutableNotificationContent()
                  content.title = title
                  content.body = body
                  content.sound = .default
                  let trigger = UNTimeIntervalNotificationTrigger(timeInterval: 0.5, repeats: false)
                  let request = UNNotificationRequest(identifier: item.id.uuidString, content: content, trigger: trigger)
                  Task { try? await UNUserNotificationCenter.current().add(request) }
              }

              func pushAppEvent(name: String, iconURL: String?, version: String?, isUpdate: Bool) {
