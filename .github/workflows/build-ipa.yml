name: بناء تطبيق 21s Pro Ultra Anime Edition

on:
  push:
    branches: [ main, ultra ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro.ultra"
  NEW_APP_NAME:  "21s Pro Ultra"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: ⚡ إعداد Xcode Ultra
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version
          defaults write com.apple.dt.Xcode ShowBuildOperationDuration -bool YES

      - name: ⚡ تثبيت الأدوات المطلوبة + ccache
        run: |
          brew untap aws/tap 2>/dev/null || true
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip zsign ccache 2>/dev/null || true
          echo 'export PATH="/opt/homebrew/opt/zip/bin:/opt/homebrew/opt/ccache/libexec:$PATH"' >> ~/.bash_profile
          export PATH="/opt/homebrew/opt/zip/bin:/opt/homebrew/opt/ccache/libexec:$PATH"
          ccache --max-size=5G
          ccache -z
          command -v ldid || { echo "❌ ldid غير مثبت"; exit 1; }
          command -v zip || { echo "❌ zip غير مثبت"; exit 1; }
          command -v zsign && echo "✅ zsign متوفر" || echo "⚠️ zsign غير متوفر"

      # =========================================================
      # RESOURCES & ASSETS - Anime Edition
      # =========================================================
      - name: 🎨 توليد أيقونات Anime Ultra
        run: |
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYIEOF'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import math

          def make_icon(size, path):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)

              # خلفية متدرجة أنمي (سايبربانك)
              for y in range(size):
                  t = y / size
                  r = int(10 * (1-t) + 40 * t)
                  g = int(12 * (1-t) + 10 * t)
                  b = int(35 * (1-t) + 60 * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b, 255))

              # هالة نيون
              for i in range(5):
                  alpha = 40 - i * 8
                  margin = int(size * 0.05) - i
                  draw.rounded_rectangle(
                      [margin, margin, size-margin, size-margin],
                      radius=size//5,
                      outline=(0, 255, 255, alpha),
                      width=max(2, size//30)
                  )

              # خطوط شبكية سايبربانك
              grid_color = (0, 255, 255, 15)
              for i in range(0, size, size//8):
                  draw.line([(i, 0), (i, size)], fill=grid_color, width=1)
                  draw.line([(0, i), (size, i)], fill=grid_color, width=1)

              # تأثير توهج
              glow = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              glow_draw = ImageDraw.Draw(glow)
              glow_draw.ellipse([size//4, -size//3, 3*size//4, size//3], fill=(255, 0, 255, 25))
              glow_draw.ellipse([-size//4, size//2, size//2, size+size//4], fill=(0, 255, 255, 20))
              img = Image.alpha_composite(img, glow)
              draw = ImageDraw.Draw(img)

              # خط الـ 21
              try:
                  font_size = int(size * 0.38)
                  font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", font_size)
              except:
                  font = ImageFont.load_default()
              text = "21"
              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              x = (size - tw) / 2 - bbox[0]
              y = (size - th) / 2 - bbox[1]

              # ظل نيون
              for offset in [(3,3), (-3,-3), (3,-3), (-3,3)]:
                  draw.text((x+offset[0], y+offset[1]), text, fill=(255, 0, 255, 80), font=font)
              draw.text((x, y), text, fill=(0, 255, 255, 255), font=font)

              # شارة PRO
              pro_font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", int(size*0.12)) if font != ImageFont.load_default() else font
              pro_text = "ULTRA"
              pbbox = draw.textbbox((0,0), pro_text, font=pro_font)
              pw, ph = pbbox[2]-pbbox[0], pbbox[3]-pbbox[1]
              px = size - pw - size//8
              py = size//8
              draw.rounded_rectangle([px-size//20, py-size//20, px+pw+size//20, py+ph+size//20], 
                                     radius=size//30, fill=(255, 0, 128, 240))
              draw.text((px, py), pro_text, fill=(255, 255, 255, 255), font=pro_font)

              img.save(path, "PNG")

          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYIEOF
          ls -lh Resources

      - name: 🎨 توليد خلفيات Anime Shader
        run: |
          mkdir -p Resources
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          sizes = [(1170,2532), (1290,2796)]  # iPhone sizes
          for w, h in sizes:
              img = Image.new("RGB", (w, h), (5, 5, 15))
              draw = ImageDraw.Draw(img)
              # شبكة نيون
              for i in range(0, w, 40):
                  draw.line([(i, 0), (i, h)], fill=(0, 255, 255, 8), width=1)
              for i in range(0, h, 40):
                  draw.line([(0, i), (w, i)], fill=(255, 0, 255, 8), width=1)
              # دوائر توهج
              draw.ellipse([w//2-200, h//3-200, w//2+200, h//3+200], fill=(40, 0, 80, 30))
              draw.ellipse([w//3-100, h//2-100, w//3+100, h//2+100], fill=(0, 40, 80, 30))
              img.save(f"Resources/LaunchImage_{w}x{h}.png")
          PYEOF

      - name: 📄 توليد بيانات التطبيق Ultra
        run: |
          mkdir -p Resources
          cat > Resources/apps_data.json << 'JEOF'
          {
            "name": "21s Store Pro Ultra",
            "identifier": "com.vip21.store.pro.ultra",
            "sourceURL": "https://repository.apptesters.org/apps.json",
            "kurdStoreURL": "https://kurdstore.info/store-data.json",
            "iconURL": "https://a.top4top.io/p_380487iqk0.jpeg",
            "website": "https://t.me/ClickStoreipaios",
            "subtitle": "متجر 21s Pro Ultra - إصدار أنمي خارق",
            "version": "9.0",
            "theme": "cyberpunk",
            "apps": []
          }
