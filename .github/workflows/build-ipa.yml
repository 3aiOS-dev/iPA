name: 21s Store (SwiftUI) - Clean Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME:  "21s"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:

      - name: Maximize build resources (1TB+ capacity)
        run: |
          echo "=== Build capacity check ==="
          df -h
          echo "=== macOS resource limits ==="
          ulimit -a
          echo "=== Available CPUs ==="
          sysctl -n hw.ncpu
          echo "=== Available memory ==="
          sysctl -n hw.memsize

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "ldid not installed"; exit 1; }
          command -v zip || { echo "zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS - download all Store images
      # =========================================================
      - name: Download project images
        run: |
          mkdir -p Resources
          # Login / Onboarding
          curl -L -o Resources/login_logo.png      "https://up6.cc/2026/07/178463790906632.png"
          curl -L -o Resources/register_logo.png   "https://up6.cc/2026/07/178463790901181.png"
          curl -L -o Resources/onboarding1.png    "https://up6.cc/2026/07/178463910434943.png"
          curl -L -o Resources/onboarding2.png    "https://up6.cc/2026/07/178463910431782.png"
          curl -L -o Resources/onboarding3.png    "https://up6.cc/2026/07/178463910425551.png"
          # Settings onboarding GIF
          curl -L -o Resources/settings_onboarding.gif "https://up6.cc/2026/07/178467999736562.gif"
          # Status / Error screens
          curl -L -o Resources/no_internet.gif         "https://up6.cc/2026/07/178493307055591.gif"
          # Thanks overlay
          curl -L -o Resources/thanks_overlay.gif      "https://up6.cc/2026/07/178480321212891.gif"

          # ===== Home top banner (4 images) =====
          curl -L -o Resources/home_banner1.jpeg "https://up6.cc/2026/07/178500243261191.jpeg"
          curl -L -o Resources/home_banner2.jpeg "https://up6.cc/2026/07/17850024326752.jpeg"
          curl -L -o Resources/home_banner3.jpeg "https://up6.cc/2026/07/178500243268853.jpeg"
          curl -L -o Resources/home_banner4.jpeg "https://up6.cc/2026/07/178500243271694.jpeg"

          # ===== Featured Games (4 images) =====
          curl -L -o Resources/featured_game1.png "https://up6.cc/2026/07/178500231365661.png"
          curl -L -o Resources/featured_game2.png "https://up6.cc/2026/07/178500231366962.png"
          curl -L -o Resources/featured_game3.png "https://up6.cc/2026/07/178500231369783.png"

          # ===== Recommended for you (4 images) =====
          curl -L -o Resources/recommended1.jpeg "https://up6.cc/2026/07/17850025527331.jpeg"
          curl -L -o Resources/recommended2.jpeg "https://up6.cc/2026/07/178500255274022.jpeg"
          curl -L -o Resources/recommended3.jpeg "https://up6.cc/2026/07/178500255277933.jpeg"
          curl -L -o Resources/recommended4.jpeg "https://up6.cc/2026/07/178500255280334.jpeg"

          # Alerts onboarding GIFs
          curl -L -o Resources/alerts_onboarding1.gif "https://up6.cc/2026/07/178467158819014.gif"
          curl -L -o Resources/alerts_onboarding2.gif "https://up6.cc/2026/07/178467158813032.gif"
          curl -L -o Resources/alerts_onboarding3.gif "https://up6.cc/2026/07/17846720131242.gif"

          file Resources/*.png Resources/*.jpeg Resources/*.gif 2>/dev/null || true
          ls -lh Resources

      - name: Generate top apps icons (TikTok, Spotify, YouTube, Telegram)
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os
          os.makedirs("Resources", exist_ok=True)

          def find_font(size, bold=True):
              for p in [
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/SFNSDisplay.ttf",
                  "/System/Library/Fonts/SFCompact.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              ]:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p, size)
                      except: pass
              return ImageFont.load_default()

          # ---- TikTok (black rounded square, white music note) ----
          W, H = 256, 256
          img = Image.new("RGB", (W, H), (0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((0, 0, W-1, H-1), radius=46, fill=(10, 10, 10))
          # offset "d" (cyan) behind "d" (magenta) note-like
          try:
              f1 = find_font(170, True)
              d.text((72, 38), "d", font=f1, fill=(255, 0, 80))    # magenta
              d.text((60, 30), "d", font=f1, fill=(0, 242, 234))    # cyan
          except Exception:
              pass
          img.save("Resources/topapp_tiktok.png", "PNG", optimize=True)

          # ---- Spotify (green circle, 3 curved white lines) ----
          img = Image.new("RGB", (W, H), (0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((0, 0, W-1, H-1), radius=46, fill=(30, 215, 96))
          cx, cy = 128, 128
          d.ellipse((0, 0, W-1, H-1), fill=(30, 215, 96))
          # three white arcs
          for (a, b) in [(70, 50), (90, 70), (110, 90)]:
              d.arc((cx - a, cy - b, cx + a, cy + b), start=200, end=340, fill=(255, 255, 255), width=10)
          d.ellipse((cx - 30, cy - 30, cx + 30, cy + 30), fill=(30, 215, 96))
          img.save("Resources/topapp_spotify.png", "PNG", optimize=True)

          # ---- YouTube (red rounded, white play triangle) ----
          img = Image.new("RGB", (W, H), (0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((0, 0, W-1, H-1), radius=46, fill=(255, 0, 0))
          # white triangle
          triangle = [(90, 70), (90, 186), (200, 128)]
          d.polygon(triangle, fill=(255, 255, 255))
          img.save("Resources/topapp_youtube.png", "PNG", optimize=True)

          # ---- Telegram (light blue, white paper plane) ----
          img = Image.new("RGB", (W, H), (0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((0, 0, W-1, H-1), radius=46, fill=(43, 169, 225))
          d.polygon([(70, 128), (190, 70), (170, 128), (190, 186)], fill=(255, 255, 255))
          d.polygon([(70, 128), (170, 128), (130, 150)], fill=(200, 230, 250))
          img.save("Resources/topapp_telegram.png", "PNG", optimize=True)

          print("Top app icons generated.")
          PYEOF
          ls -lh Resources/topapp_*.png

      - name: Generate category icon tiles (Games, Utilities, Entertainment, Social)
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          import os
          os.makedirs("Resources", exist_ok=True)

          # Render the colored rounded backgrounds + the central icon glyph
          W, H = 256, 256

          def make_tile(bg, glyph_color, glyph_draw, name):
              img = Image.new("RGB", (W, H), (255, 255, 255))
              d = ImageDraw.Draw(img)
              d.rounded_rectangle((24, 24, W-25, H-25), radius=44, fill=bg)
              glyph_draw(d, glyph_color)
              img.save(f"Resources/cat_{name}.png", "PNG", optimize=True)

          # ---- Games: blue background + white controller ----
          def games_glyph(d, color):
              # controller body
              d.rounded_rectangle((56, 96, 200, 168), radius=36, fill=color)
              d.ellipse((48, 80, 92, 124), fill=color)
              d.ellipse((164, 80, 208, 124), fill=color)
              # dpad
              d.rectangle((80, 122, 100, 138), fill=(80, 130, 230))
              d.rectangle((85, 117, 95, 143), fill=(80, 130, 230))
              # buttons
              d.ellipse((170, 122, 184, 136), fill=(80, 130, 230))
              d.ellipse((154, 138, 168, 152), fill=(80, 130, 230))
          make_tile((218, 230, 255), (60, 130, 230), games_glyph, "games")

          # ---- Utilities: green background + 2x2 grid ----
          def util_glyph(d, color):
              d.rounded_rectangle((80, 80, 116, 116), radius=10, fill=color)
              d.rounded_rectangle((140, 80, 176, 116), radius=10, fill=color)
              d.rounded_rectangle((80, 140, 116, 176), radius=10, fill=color)
              d.rounded_rectangle((140, 140, 176, 176), radius=10, fill=color)
          make_tile((220, 245, 230), (60, 200, 130), util_glyph, "utilities")

          # ---- Entertainment: pink background + white play ----
          def ent_glyph(d, color):
              d.rounded_rectangle((72, 72, 184, 184), radius=28, fill=color)
              d.polygon([(110, 100), (110, 156), (158, 128)], fill=(255, 200, 220))
          make_tile((255, 220, 232), (240, 100, 140), ent_glyph, "entertainment")

          # ---- Social: purple background + two people ----
          def social_glyph(d, color):
              # person 1
              d.ellipse((68, 84, 124, 140), fill=color)
              d.pieslice((56, 132, 200, 230), start=180, end=360, fill=color)
              # person 2 (overlap)
              d.ellipse((132, 96, 188, 152), fill=(255, 200, 230))
              d.pieslice((100, 144, 220, 230), start=180, end=360, fill=(255, 200, 230))
          make_tile((238, 222, 255), (170, 100, 230), social_glyph, "social")

          print("Category tiles generated.")
          PYEOF
          ls -lh Resources/cat_*.png

      - name: Generate app icons from the logo image
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image
          src = Image.open("Resources/login_logo.png").convert("RGBA")
          def make_icon(size, path):
              bg = Image.new("RGBA", (size, size), (10, 12, 18, 255))
              logo = src.resize((size, size))
              bg.alpha_composite(logo)
              bg.convert("RGB").save(path, "PNG")
          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYEOF
          ls -lh Resources

