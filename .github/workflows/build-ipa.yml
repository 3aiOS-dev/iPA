                  func ring(_ value: String, _ label: String, _ pct: Int, _ color: String) -> String {
                      return """
                      <div class="cell">
                        <div class="ring" style="background:conic-gradient(\(color) \(pct * 36)deg, \(color)1F 0deg)">
                          <div class="hole"><b>\(value)</b></div>
                        </div>
                        <span>\(label)</span>
                      </div>
                      """
                  }
                  let body = """
                  <div class="panel">
                    \(ring("\(apps)", "تطبيق", 8, pal.primaryHex))
                    \(ring("\(favorites)", "مفضلة", 5, pal.blushHex))
                    \(ring("\(updates)", "تحديث", 6, pal.cyanHex))
                  </div>
                  """
                  let css = """
