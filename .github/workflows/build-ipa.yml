                  task.cancel { [weak self] data in
                      Task { @MainActor in
                          self?.resumeData[id] = data
                          self?.updateTask(id: id, state: .paused)
                      }
                  }
              }

              func resumeDownload(id: UUID) {
                  guard let taskInfo = downloads.first(where: { $0.id == id }) else { return }
                  let downloadTask: URLSessionDownloadTask
                  if let data = resumeData[id] {
                      downloadTask = session.downloadTask(withResumeData: data)
                  } else {
                      guard let url = URL(string: taskInfo.downloadURL) else { return }
                      downloadTask = session.downloadTask(with: url)
                  }
                  downloadTask.taskDescription = id.uuidString
                  tasks[id] = downloadTask
                  downloadTask.resume()
                  updateTask(id: id, state: .downloading)
              }

              func cancelDownload(id: UUID) {
                  tasks[id]?.cancel()
                  tasks.removeValue(forKey: id)
                  resumeData.removeValue(forKey: id)
                  if let index = downloads.firstIndex(where: { $0.id == id }) {
                      if let path = downloads[index].localFilePath {
                          let url = downloadsRoot.appendingPathComponent(path)
                          try? fm.removeItem(at: url)
                      }
                      if let signed = downloads[index].signedFilePath {
                          let url = downloadsRoot.appendingPathComponent(signed)
                          try? fm.removeItem(at: url)
                      }
                      downloads.remove(at: index)
                      saveDownloads()
                  }
              }

              func installApp(id: UUID) {
                  guard let task = downloads.first(where: { $0.id == id }) else { return }
                  let installFile = task.signedFilePath ?? task.localFilePath
                  guard installFile != nil else { return }
                  updateTask(id: id, state: .installing)
                  let installURL = "itms-services://?action=download-manifest&url=\(task.downloadURL)"
                  if let url = URL(string: installURL) {
                      DispatchQueue.main.async {
                          UIApplication.shared.open(url) { success in
                              if !success {
                                  self.updateTask(id: id, state: .completed, error: "Failed to open install link")
                              }
                          }
                      }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 3) {
                      self.updateTask(id: id, state: .completed)
                  }
              }

              func setSignedPath(id: UUID, path: String, certID: UUID) {
                  if let index = downloads.firstIndex(where: { $0.id == id }) {
                      downloads[index].signedFilePath = path
                      downloads[index].usedCertificateID = certID
                      downloads[index].state = .signed
                      saveDownloads()
                  }
              }

              func fileURL(for task: DownloadTask) -> URL? {
                  if let signed = task.signedFilePath {
                      let url = downloadsRoot.appendingPathComponent(signed)
                      return fm.fileExists(atPath: url.path) ? url : nil
                  }
                  if let path = task.localFilePath {
                      let url = downloadsRoot.appendingPathComponent(path)
                      return fm.fileExists(atPath: url.path) ? url : nil
                  }
                  return nil
              }

              func shareApp(id: UUID, from viewController: UIViewController?) {
                  guard let task = downloads.first(where: { $0.id == id }),
                        let url = fileURL(for: task) else { return }
                  let activityVC = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                  if let popover = activityVC.popoverPresentationController {
                      popover.sourceView = viewController?.view
                      popover.sourceRect = CGRect(x: viewController?.view.bounds.midX ?? 0,
                                                   y: viewController?.view.bounds.midY ?? 0, width: 1, height: 1)
                  }
                  viewController?.present(activityVC, animated: true)
              }

              func deleteDownload(id: UUID) { cancelDownload(id: id) }

              private func updateTask(id: UUID, state: DownloadState? = nil, progress: Double? = nil,
                                     downloaded: Int64? = nil, total: Int64? = nil,
                                     path: String? = nil, error: String? = nil) {
                  if let index = downloads.firstIndex(where: { $0.id == id }) {
                      if let state = state { downloads[index].state = state }
                      if let progress = progress { downloads[index].progress = progress }
                      if let downloaded = downloaded { downloads[index].downloadedBytes = downloaded }
                      if let total = total { downloads[index].totalBytes = total }
                      if let path = path { downloads[index].localFilePath = path }
                      if let error = error { downloads[index].errorMessage = error }
                      if state == .completed || state == .failed || state == .signed {
                          downloads[index].endDate = Date()
                      }
                      saveDownloads()
                  }
              }

              private func saveDownloads() {
                  if let data = try? JSONEncoder().encode(downloads) {
                      UserDefaults.standard.set(data, forKey: "savedDownloads_v2")
                  }
              }

              private func loadDownloads() {
                  guard let data = UserDefaults.standard.data(forKey: "savedDownloads_v2"),
                        let saved = try? JSONDecoder().decode([DownloadTask].self, from: data) else { return }
                  downloads = saved.filter { $0.state != .downloading && $0.state != .installing && $0.state != .signing }
                  for i in downloads.indices where downloads[i].state == .downloading || downloads[i].state == .installing || downloads[i].state == .signing {
                      downloads[i].state = .paused
                  }
              }

              private func sendNotification(title: String, body: String) {
                  let content = UNMutableNotificationContent()
                  content.title = title; content.body = body; content.sound = .default
                  let request = UNNotificationRequest(identifier: UUID().uuidString, content: content, trigger: nil)
                  UNUserNotificationCenter.current().add(request)
              }

              var activeDownloads: [DownloadTask] { downloads.filter { $0.isActive } }
              var completedDownloads: [DownloadTask] { downloads.filter { $0.state == .completed || $0.state == .signed } }
              var totalDownloadedBytes: Int64 { downloads.filter { $0.state == .completed || $0.state == .signed }.reduce(0) { $0 + $1.totalBytes } }
          }

          extension DownloadManager: URLSessionDownloadDelegate {
              nonisolated func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                             didFinishDownloadingTo location: URL) {
                  guard let taskIDString = downloadTask.taskDescription,
                        let taskID = UUID(uuidString: taskIDString) else { return }
                  let filename = "\(taskID.uuidString).ipa"
                  let fm = FileManager.default
                  let base = (try? fm.url(for: .documentDirectory, in: .userDomainMask, appropriateFor: nil, create: true)) ?? fm.temporaryDirectory
                  let downloadsRoot = base.appendingPathComponent(AppConstants.downloadsDir, isDirectory: true)
                  if !fm.fileExists(atPath: downloadsRoot.path) { try? fm.createDirectory(at: downloadsRoot, withIntermediateDirectories: true) }
                  let destURL = downloadsRoot.appendingPathComponent(filename)
                  try? fm.removeItem(at: destURL)
                  try? fm.moveItem(at: location, to: destURL)
                  Task { @MainActor in
                      self.updateTask(id: taskID, state: .completed, path: filename)
                      self.tasks.removeValue(forKey: taskID)
                      self.resumeData.removeValue(forKey: taskID)
                      HapticManager.shared.success()
                      if let task = self.downloads.first(where: { $0.id == taskID }) {
                          self.sendNotification(title: "Download Complete", body: "\(task.appName) is ready to sign and install")
                      }
                  }
              }

              nonisolated func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                             didWriteData bytesWritten: Int64, totalBytesWritten: Int64,
                             totalBytesExpectedToWrite: Int64) {
                  guard let taskIDString = downloadTask.taskDescription,
                        let taskID = UUID(uuidString: taskIDString) else { return }
                  let progress = totalBytesExpectedToWrite > 0 ? Double(totalBytesWritten) / Double(totalBytesExpectedToWrite) : 0
                  Task { @MainActor in
                      self.updateTask(id: taskID, progress: progress, downloaded: totalBytesWritten, total: totalBytesExpectedToWrite)
                  }
              }

              nonisolated func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let taskIDString = task.taskDescription,
                        let taskID = UUID(uuidString: taskIDString) else { return }
                  if let error = error {
                      let nsError = error as NSError
                      if nsError.domain == NSURLErrorDomain && nsError.code == NSURLErrorCancelled { return }
                      Task { @MainActor in
                          self.updateTask(id: taskID, state: .failed, error: error.localizedDescription)
                          HapticManager.shared.error()
                      }
                  }
                  Task { @MainActor in
                      self.tasks.removeValue(forKey: taskID)
                  }
              }
          }
          VIPEOF

      - name: Generate code - AppsManager.swift
        run: |
          cat > AppsManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          enum AppFetchError: LocalizedError {
              case invalidURL(source: String)
              case noData(source: String)
              case decodeFailed(source: String)
              case network(source: String, message: String)
              var errorDescription: String? {
                  switch self {
                  case .invalidURL(let s):     return "\(s): Invalid URL"
                  case .noData(let s):         return "\(s): No data"
                  case .decodeFailed(let s):   return "\(s): Failed to decode data"
                  case .network(let s, let m): return "\(s): \(m)"
                  }
              }
          }

          @MainActor
          class AppsManager: ObservableObject {
              @Published var apps: [AppItem] = []
              @Published var isLoading = false
              @Published var errorMessage: String?
              @Published var recentSearches: [String] = []
              @Published var lastUpdated: Date?
              @Published var stats: StoreStats = StoreStats()

              func fetchApps() {
                  isLoading = true; errorMessage = nil
                  let group = DispatchGroup()
                  var combined: [AppItem] = []
                  var firstError: String?

                  group.enter()
                  fetchPrimary { result in
                      switch result {
                      case .success(let items): combined.append(contentsOf: items)
                      case .failure(let err):   if firstError == nil { firstError = err.localizedDescription }
                      }
                      group.leave()
                  }
                  group.notify(queue: .main) {
                      self.isLoading = false
                      self.lastUpdated = Date()
                      var seen = Set<String>()
                      let unique = combined.filter { item in
                          let key = item.bundleID.isEmpty ? item.name : item.bundleID
                          if seen.contains(key) { return false }
                          seen.insert(key)
                          return true
                      }
                      self.apps = unique
                      self.calculateStats()
                      if unique.isEmpty, let err = firstError { self.errorMessage = err }
                  }
              }

              private func fetchPrimary(completion: @escaping (Result<[AppItem], Error>) -> Void) {
                  guard let url = URL(string: AppConstants.storeURL) else {
                      DispatchQueue.main.async { completion(.failure(AppFetchError.invalidURL(source: "21s Source"))) }
                      return
                  }
                  URLSession.shared.dataTask(with: url) { data, _, err in
                      if let err = err {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.network(source: "21s Source", message: err.localizedDescription))) }
                          return
                      }
                      guard let data = data else {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.noData(source: "21s Source"))) }
                          return
                      }
                      var loaded: [AppItem] = []
                      if let resp = try? JSONDecoder().decode(AppsResponse.self, from: data) {
                          loaded = resp.apps
                      } else if let arr = try? JSONDecoder().decode([AppItem].self, from: data) {
                          loaded = arr
                      } else {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.decodeFailed(source: "21s Source"))) }
                          return
                      }
                      let enriched = loaded.map { app -> AppItem in
                          var mutable = app
                          if mutable.category == nil || mutable.category!.isEmpty {
                              mutable.category = Self.inferCategory(name: app.name, desc: app.localizedDescription)
                          }
                          return AppItem(
                              name: mutable.name, type: mutable.type, bundleID: mutable.bundleID,
                              bundleIdentifier: mutable.bundleIdentifier, version: mutable.version,
                              versionDate: mutable.versionDate, fullDate: mutable.fullDate,
                              size: mutable.size, down: mutable.down, downloadURL: mutable.downloadURL,
                              developerName: mutable.developerName,
                              localizedDescription: mutable.localizedDescription,
                              icon: mutable.icon, iconURL: mutable.iconURL,
                              category: mutable.category, source: .primary
                          )
                      }
                      DispatchQueue.main.async { completion(.success(enriched)) }
                  }.resume()
              }

              nonisolated static func inferCategory(name: String, desc: String) -> String {
                  let text = (name + " " + desc).lowercased()
                  let map: [(keys: [String], cat: String)] = [
                      (["game", "clash", "minecraft", "roblox", "pubg", "cod", "fifa", "call of duty", "play"], "Games"),
                      (["social", "chat", "instagram", "tiktok", "telegram", "whatsapp", "snapchat", "twitter", "x.com", "facebook"], "Social"),
                      (["music", "spotify", "soundcloud", "youtube", "video", "netflix", "tubi", "streaming"], "Entertainment"),
                      (["vpn", "security", "proxy", "shield", "protect", "firewall"], "Security"),
                      (["photo", "camera", "edit", "lightroom", "vsco", "capcut", "photoshop", "image"], "Photo & Video"),
                      (["learn", "education", "school", "duolingo", "quran", "language", "study"], "Education"),
                      (["shop", "store", "amazon", "noon", "delivery", "market", "shopping"], "Shopping"),
                      (["bank", "pay", "finance", "paypal", "crypto", "bitcoin", "wallet"], "Finance"),
                      (["productivity", "office", "word", "excel", "pdf", "scan", "notes", "task"], "Productivity"),
                      (["travel", "flight", "hotel", "map", "uber", "careem", "booking"], "Travel"),
                      (["health", "fitness", "workout", "gym", "diet", "meditation", "wellness"], "Health & Fitness"),
                      (["food", "restaurant", "recipe", "cook"], "Food"),
                      (["news", "newspaper", "bbc", "cnn", "aljazeera", "headlines"], "News"),
                  ]
                  for entry in map {
                      if entry.keys.contains(where: { text.contains($0) }) { return entry.cat }
                  }
                  return "Tools"
              }

              var newThisWeek: [AppItem] {
                  apps.filter { $0.isNew }.sorted { ($0.parsedDate ?? .distantPast) > ($1.parsedDate ?? .distantPast) }
              }

              func apps(for source: AppSource) -> [AppItem] {
                  switch source {
                  case .all:     return apps
                  case .primary: return apps.filter { $0.source == .primary }
                  }
              }

              func retryFetch() { fetchApps() }

              func loadRecentSearches() {
                  recentSearches = UserDefaults.standard.stringArray(forKey: "recentSearches") ?? []
              }

              func addRecentSearch(_ term: String) {
                  guard !term.isEmpty else { return }
                  recentSearches.removeAll { $0 == term }
                  recentSearches.insert(term, at: 0)
                  if recentSearches.count > 15 { recentSearches = Array(recentSearches.prefix(10)) }
                  UserDefaults.standard.set(recentSearches, forKey: "recentSearches")
              }

              private func calculateStats() {
                  let totalApps = apps.count
                  let totalSize = apps.reduce(0) { $0 + $1.size }
                  let newApps = newThisWeek.count
                  let popularApps = apps.filter { $0.isPopular }.count
                  let categories = Set(apps.compactMap { $0.category }).count
                  stats = StoreStats(totalApps: totalApps, totalSize: totalSize, newApps: newApps,
                                    popularApps: popularApps, categories: categories)
              }
          }
          VIPEOF

