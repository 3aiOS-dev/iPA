              private var cryptoChips: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Text("Top up with")
                          .font(.system(size: 13, weight: .bold))
                          .foregroundColor(.storeText)
                      HStack(spacing: 10) {
                          cryptoChip("USDT", color: Color(red: 0.15, green: 0.63, blue: 0.43))
                          cryptoChip("BTC",  color: Color(red: 0.97, green: 0.58, blue: 0.10))
