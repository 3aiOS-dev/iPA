      - name: توليد الكود - VIP21StoreApp.swift (بدون تغيير كبير)
        run: |
          cat > VIP21StoreApp.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UserNotifications

          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .onAppear {
                              requestNotifications()
                          }
                  }
              }
              func requestNotifications() {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
              }
          }

          class AppDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  return true
              }
              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           willPresent notification: UNNotification,
                                           withCompletionHandler handler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  handler([.banner, .sound, .badge])
              }
              func userNotificationCenter(_ center: UNUserNotificationCenter,
                                           didReceive response: UNNotificationResponse,
                                           withCompletionHandler handler: @escaping () -> Void) {
                  handler()
              }
          }

          extension UIWindowScene {
              var keyWindow: UIWindow? {
                  return windows.first(where: { $0.isKeyWindow }) ?? windows.first
              }
          }
          VIPEOF

      # =========================================================
      # BUILD
      # =========================================================
      - name: بناء التطبيق
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc             Constants.swift             HapticManager.swift             Models.swift             CertificateManager.swift             Signer.swift             AppsManager.swift             SharedComponents.swift             ContentView.swift             HomeTabView.swift             AppsTabView.swift             AppDetailView.swift             SigningTabView.swift             SettingsView.swift             VIP21StoreApp.swift             -sdk "$SDK"             -target arm64-apple-ios16.0             -O             -module-name VIP21Store             -framework SwiftUI             -framework UIKit             -framework Foundation             -framework UserNotifications             -framework UniformTypeIdentifiers             -framework WebKit             -o VIP21Store
          file VIP21Store

      - name: إنشاء حزمة IPA
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon60x60@3x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          cp Resources/apps_data.json            build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s-Pro-v9.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s-Pro-v9.ipa)"

      - name: التحقق من صحة حزمة IPA
        run: |
          echo "== محتويات ملف IPA =="
          unzip -l artifacts/21s-Pro-v9.ipa | head -35
          if ! unzip -l artifacts/21s-Pro-v9.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ خطأ: الحزمة لا تحتوي على App Bundle صحيح"
            exit 1
          fi
          echo "✅ الحزمة سليمة وتحتوي على App Bundle صحيح."

      - name: رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Pro-v9-Full-Edition
          path: artifacts/21s-Pro-v9.ipa
