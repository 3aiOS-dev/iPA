      - name: Generate HapticManager.swift (unchanged)
        run: |
          cat > HapticManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  let g = UIImpactFeedbackGenerator(style: style)
                  g.impactOccurred()
              }
              func notification(_ type: UINotificationFeedbackGenerator.FeedbackType) {
                  let g = UINotificationFeedbackGenerator()
                  g.notificationOccurred(type)
              }
              func selection() {
                  let g = UISelectionFeedbackGenerator()
                  g.selectionChanged()
              }
              func success() { notification(.success) }
              func error() { notification(.error) }
              func warning() { notification(.warning) }
          }

          struct XcodeCardModifier: ViewModifier {
              @Environment(\.colorScheme) var scheme
              var radius: CGFloat = 12
              func body(content: Content) -> some View {
                  content
                      .background(
                          RoundedRectangle(cornerRadius: radius)
                              .fill(scheme == .dark ? Color.xcodeEditor : Color.xcodeLightEditor)
                              .overlay(
                                  RoundedRectangle(cornerRadius: radius)
                                      .stroke(scheme == .dark ? Color.xcodeDivider : Color.xcodeLightDivider, lineWidth: 0.5)
                              )
                      )
                      .clipShape(RoundedRectangle(cornerRadius: radius))
              }
          }

          struct XcodeButtonModifier: ViewModifier {
              var color: Color = .xcodeBlue
              var isDisabled: Bool = false
              func body(content: Content) -> some View {
                  content
                      .foregroundColor(.white)
                      .frame(maxWidth: .infinity)
                      .frame(height: 44)
                      .background(
                          RoundedRectangle(cornerRadius: 10)
                              .fill(isDisabled ? Color.xcodeSecondary : color)
                      )
                      .opacity(isDisabled ? 0.6 : 1.0)
              }
          }

          extension View {
              func xcodeCard(radius: CGFloat = 12) -> some View {
                  modifier(XcodeCardModifier(radius: radius))
              }
              func xcodeButton(color: Color = .xcodeBlue, isDisabled: Bool = false) -> some View {
                  modifier(XcodeButtonModifier(color: color, isDisabled: isDisabled))
              }
          }
          VIPEOF

      - name: Generate Models.swift (translated)
        run: |
          cat > Models.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          enum AppSourceType: String, Codable {
              case primary = "primary"
              case kurd    = "kurd"
          }

          struct AppItem: Identifiable, Codable, Equatable {
              var id: UUID
              let name: String
              let type: Int
              let bundleID: String
              let bundleIdentifier: String
              let version: String
              let versionDate: String
              let fullDate: String
              let size: Int
              let down: String
              let downloadURL: String
              let developerName: String
              let localizedDescription: String
              let icon: String
              let iconURL: String
              var category: String?
              var source: AppSourceType

              enum CodingKeys: String, CodingKey {
                  case id, name, type, bundleID, bundleIdentifier, version, versionDate,
                       fullDate, size, down, downloadURL, developerName,
                       localizedDescription, icon, iconURL, category, source
              }

              init(name: String, type: Int = 0, bundleID: String, bundleIdentifier: String = "",
                   version: String, versionDate: String, fullDate: String = "", size: Int,
                   down: String = "0", downloadURL: String, developerName: String,
                   localizedDescription: String, icon: String = "", iconURL: String,
                   category: String? = nil, source: AppSourceType = .primary) {
                  self.id = UUID()
                  self.name = name; self.type = type; self.bundleID = bundleID
                  self.bundleIdentifier = bundleIdentifier.isEmpty ? bundleID : bundleIdentifier
                  self.version = version; self.versionDate = versionDate; self.fullDate = fullDate
                  self.size = size; self.down = down; self.downloadURL = downloadURL
                  self.developerName = developerName
                  self.localizedDescription = localizedDescription
                  self.icon = icon; self.iconURL = iconURL; self.category = category; self.source = source
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.id = (try? c.decode(UUID.self, forKey: .id)) ?? UUID()
                  self.name = try c.decode(String.self, forKey: .name)
                  self.type = (try? c.decode(Int.self, forKey: .type)) ?? 0
                  self.bundleID = (try? c.decode(String.self, forKey: .bundleID)) ?? ""
                  self.bundleIdentifier = (try? c.decode(String.self, forKey: .bundleIdentifier)) ?? self.bundleID
                  self.version = (try? c.decode(String.self, forKey: .version)) ?? ""
                  self.versionDate = (try? c.decode(String.self, forKey: .versionDate)) ?? ""
                  self.fullDate = (try? c.decode(String.self, forKey: .fullDate)) ?? self.versionDate
                  self.size = (try? c.decode(Int.self, forKey: .size)) ?? 0
                  self.down = (try? c.decode(String.self, forKey: .down)) ?? "0"
                  self.downloadURL = (try? c.decode(String.self, forKey: .downloadURL)) ?? ""
                  self.developerName = (try? c.decode(String.self, forKey: .developerName)) ?? ""
                  self.localizedDescription = (try? c.decode(String.self, forKey: .localizedDescription)) ?? ""
                  self.icon = (try? c.decode(String.self, forKey: .icon)) ?? ""
                  self.iconURL = (try? c.decode(String.self, forKey: .iconURL)) ?? self.icon
                  self.category = try? c.decode(String.self, forKey: .category)
                  self.source = (try? c.decode(AppSourceType.self, forKey: .source)) ?? .primary
              }

              var formattedSize: String {
                  if size > 0 { return ByteCountFormatter.string(fromByteCount: Int64(size), countStyle: .file) }
                  return "—"
              }
              var formattedDate: String {
                  let formats = ["yyyy-MM-dd", "yyyy-MM-dd'T'HH:mm:ssZZZZZ", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"]
                  let inFmt = DateFormatter(); inFmt.locale = Locale(identifier: "en_US_POSIX")
                  for fmt in formats {
                      inFmt.dateFormat = fmt
                      if let d = inFmt.date(from: versionDate) {
                          let out = DateFormatter(); out.dateFormat = "dd-MM-yyyy"
                          return out.string(from: d)
                      }
                  }
                  return versionDate
              }
              var parsedDate: Date? {
                  let formats = ["yyyy-MM-dd", "yyyy-MM-dd'T'HH:mm:ssZZZZZ", "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"]
                  let f = DateFormatter(); f.locale = Locale(identifier: "en_US_POSIX")
                  for fmt in formats {
                      f.dateFormat = fmt
                      if let d = f.date(from: versionDate) { return d }
                      if let d = f.date(from: fullDate) { return d }
                  }
                  return nil
              }
              var subscriptionType: String {
                  let desc = localizedDescription.lowercased()
                  if desc.contains("subscription unlocked") || desc.contains("lifetime") { return "Lifetime Subscription" }
                  if desc.contains("premium") { return "Premium" }
                  if desc.contains("pro")     { return "Pro" }
                  if desc.contains("gold")    { return "Gold" }
                  if desc.contains("iap") || desc.contains("purchase") { return "In-App Purchases" }
                  if desc.contains("no ads") || desc.contains("ad-free") { return "No Ads" }
                  return "Unlocked"
              }
              var isNew: Bool {
                  guard let d = parsedDate else { return false }
                  let days = Calendar.current.dateComponents([.day], from: d, to: Date()).day ?? 999
                  return days < AppConstants.newThisWeekDays
              }
              var isPopular: Bool { (Int(down) ?? 0) > 500 }
              var sourceDisplay: String {
                  switch source {
                  case .primary: return "21s"
                  case .kurd:    return "Kurd"
                  }
              }
              var sourceColor: Color {
                  switch source {
                  case .primary: return .xcodePurple
                  case .kurd:    return .xcodeOrange
                  }
              }
              static func == (lhs: AppItem, rhs: AppItem) -> Bool { lhs.id == rhs.id }
          }

          struct AppsResponse: Codable {
              let name: String; let identifier: String; let sourceURL: String
              let iconURL: String; let website: String; let ipawebsite: String
              let subtitle: String; let apps: [AppItem]
          }

          struct KurdStoreRoot: Codable {
              let last_updated: String?
              let apps: KurdStoreAppsContainer
          }
          struct KurdStoreAppsContainer: Codable {
              let success: Bool?; let count: Int?; let apps: [KurdStoreApp]
          }
          struct KurdStoreApp: Codable {
              let id: Int; let name: String; let bundle_id: String
              let bundle_version: String; let ipa_size: String?
              let github_url: String?; let archive_url: String?
              let ipa_url: String?; let host: String?
              let icon: String?; let description: String?
              let screenshots: [String]?; let category: String?
              let created_at: String?; let updated_at: String?
          }

          struct DownloadTask: Identifiable, Codable, Equatable {
              let id: UUID
              let appID: UUID
              let appName: String
              let appIconURL: String
              let downloadURL: String
              let bundleID: String
              let version: String
              var state: DownloadState
              var progress: Double
              var downloadedBytes: Int64
              var totalBytes: Int64
              var startDate: Date
              var endDate: Date?
              var errorMessage: String?
              var localFilePath: String?
              var signedFilePath: String?
              var usedCertificateID: UUID?

              var progressPercentage: String { String(format: "%.1f%%", progress * 100) }
              var formattedDownloaded: String { ByteCountFormatter.string(fromByteCount: downloadedBytes, countStyle: .file) }
              var formattedTotal: String { ByteCountFormatter.string(fromByteCount: totalBytes, countStyle: .file) }
              var isActive: Bool { state == .downloading || state == .pending || state == .installing || state == .signing }
              var canInstall: Bool { state == .completed || state == .signed }
              var canSign: Bool { state == .completed && localFilePath != nil }
              static func == (lhs: DownloadTask, rhs: DownloadTask) -> Bool { lhs.id == rhs.id }
          }

          struct StoreCertificate: Identifiable, Codable, Equatable {
              let id: UUID
              let originalName: String
              let storedName: String
              let type: CertificateType
              let importedAt: Date
              let size: Int64
              var isValid: Bool
              var validationError: String?
              var p12Password: String?
              var teamID: String?
              var profileName: String?
              var profileExpiration: Date?
              var isDefault: Bool

              var formattedSize: String { ByteCountFormatter.string(fromByteCount: size, countStyle: .file) }
              var formattedDate: String {
                  let f = DateFormatter(); f.locale = Locale(identifier: "en_US_POSIX"); f.dateStyle = .medium; f.timeStyle = .short
                  return f.string(from: importedAt)
              }
              var displayTitle: String {
                  if let pn = profileName, !pn.isEmpty { return pn }
                  if let tid = teamID, !tid.isEmpty { return "Team: \(tid)" }
                  return originalName
              }
          }

          struct AppCategory: Identifiable {
              let id = UUID()
              let name: String
              let icon: String
              let color: Color
              let count: Int
          }

          struct StoreStats: Codable {
              var totalApps: Int = 0
              var totalSize: Int = 0
              var newApps: Int = 0
              var popularApps: Int = 0
              var categories: Int = 0
              var formattedTotalSize: String { ByteCountFormatter.string(fromByteCount: Int64(totalSize), countStyle: .file) }
          }
          VIPEOF

      - name: Generate CertificateManager.swift (unchanged except minor strings)
        run: |
          cat > CertificateManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import UniformTypeIdentifiers

          @MainActor
          final class CertificateManager: ObservableObject {
              @Published var certificates: [StoreCertificate] = []
              @Published var isImporting: Bool = false
              @Published var lastError: String?
              @Published var lastSuccess: String?

              private let fm = FileManager.default

              private var supportRoot: URL {
                  let base = (try? fm.url(for: .applicationSupportDirectory, in: .userDomainMask, appropriateFor: nil, create: true)) ?? fm.temporaryDirectory
                  return base
              }

              private var certRoot: URL {
                  let dir = supportRoot.appendingPathComponent(AppConstants.certificatesDir, isDirectory: true)
                  ensureDir(dir)
                  return dir
              }

              private func ensureDir(_ url: URL) {
                  if !fm.fileExists(atPath: url.path) { try? fm.createDirectory(at: url, withIntermediateDirectories: true) }
              }

              init() { loadCertificates() }

              func importCertificate(from url: URL, password: String? = nil) async -> StoreCertificate? {
                  let needsScope = url.startAccessingSecurityScopedResource()
                  defer { if needsScope { url.stopAccessingSecurityScopedResource() } }

                  let ext = url.pathExtension.lowercased()
                  let type: CertificateType = (ext == "p12" || ext == "pfx") ? .p12 : .mobileprovision
                  let storedName = "\(UUID().uuidString).\(ext)"
                  let dest = certRoot.appendingPathComponent(storedName)

                  do {
                      if fm.fileExists(atPath: dest.path) { try fm.removeItem(at: dest) }
                      try fm.copyItem(at: url, to: dest)
                      let attrs = try fm.attributesOfItem(atPath: dest.path)
                      let size = (attrs[.size] as? NSNumber)?.int64Value ?? 0

                      var cert = StoreCertificate(
                          id: UUID(), originalName: url.lastPathComponent,
                          storedName: storedName, type: type, importedAt: Date(),
                          size: size, isValid: true, validationError: nil,
                          p12Password: password, teamID: nil, profileName: nil,
                          profileExpiration: nil, isDefault: false
                      )

                      if type == .mobileprovision {
                          if let info = try? readProvisioningProfile(dest) {
                              cert.profileName = info.name
                              cert.teamID = info.teamID
                              cert.profileExpiration = info.expirationDate
                              cert.isValid = !info.name.isEmpty
                          }
                      } else {
                          if let info = try? inspectP12(dest, password: password) {
                              cert.teamID = info.teamID
                              cert.isValid = info.isValid
                              if !info.isValid { cert.validationError = "Invalid password or corrupted file" }
                          }
                      }

                      if !certificates.contains(where: { $0.isDefault }) {
                          cert.isDefault = true
                      }

                      certificates.append(cert)
                      saveCertificates()
                      HapticManager.shared.success()
                      lastSuccess = "Certificate imported successfully"
                      return cert
                  } catch {
                      lastError = "Import failed: \(error.localizedDescription)"
                      HapticManager.shared.error()
                      return nil
                  }
              }

              func deleteCertificate(id: UUID) {
                  guard let idx = certificates.firstIndex(where: { $0.id == id }) else { return }
                  let cert = certificates[idx]
                  let url = certRoot.appendingPathComponent(cert.storedName)
                  try? fm.removeItem(at: url)
                  certificates.remove(at: idx)
                  if cert.isDefault, certificates.first != nil {
                      certificates[0].isDefault = true
                  }
                  saveCertificates()
                  HapticManager.shared.success()
              }

              func setDefault(id: UUID) {
                  for i in certificates.indices {
                      certificates[i].isDefault = (certificates[i].id == id)
                  }
                  saveCertificates()
              }

              var defaultCertificate: StoreCertificate? {
                  certificates.first { $0.isDefault } ?? certificates.first
              }

              func certificateURL(for cert: StoreCertificate) -> URL {
                  certRoot.appendingPathComponent(cert.storedName)
              }

              private func saveCertificates() {
                  if let data = try? JSONEncoder().encode(certificates) {
                      UserDefaults.standard.set(data, forKey: "savedCertificates_v2")
                  }
              }

              private func loadCertificates() {
                  guard let data = UserDefaults.standard.data(forKey: "savedCertificates_v2"),
                        let saved = try? JSONDecoder().decode([StoreCertificate].self, from: data) else { return }
                  certificates = saved
                  for i in certificates.indices {
                      let url = certRoot.appendingPathComponent(certificates[i].storedName)
                      if !fm.fileExists(atPath: url.path) {
                          certificates[i].isValid = false
                          certificates[i].validationError = "File missing"
                      }
                  }
              }

              private func readProvisioningProfile(_ url: URL) throws -> (name: String, teamID: String, expirationDate: Date?) {
                  guard let raw = try? String(contentsOf: url, encoding: .ascii) else {
                      throw NSError(domain: "Profile", code: 1)
                  }
                  guard let startRange = raw.range(of: "<?xml"),
                        let endRange = raw.range(of: "</plist>", options: .backwards) else {
                      throw NSError(domain: "Profile", code: 2)
                  }
                  let xml = String(raw[startRange.lowerBound..<endRange.upperBound])
                  guard let data = xml.data(using: .utf8),
                        let obj = try? PropertyListSerialization.propertyList(from: data, options: [], format: nil),
                        let dict = obj as? [String: Any] else {
                      throw NSError(domain: "Profile", code: 3)
                  }
                  let name = (dict["Name"] as? String) ?? ""
                  var teamID = ""
                  if let ent = dict["Entitlements"] as? [String: Any] {
                      teamID = (ent["com.apple.developer.team-identifier"] as? String) ?? ""
                  }
                  var expDate: Date? = dict["ExpirationDate"] as? Date
                  if expDate == nil, let expStr = dict["ExpirationDate"] as? String {
                      let f = DateFormatter(); f.locale = Locale(identifier: "en_US_POSIX")
                      f.dateFormat = "yyyy-MM-dd'T'HH:mm:ss'Z'"
                      expDate = f.date(from: expStr)
                  }
                  return (name, teamID, expDate)
              }

              private func inspectP12(_ url: URL, password: String?) throws -> (teamID: String?, isValid: Bool) {
                  guard let data = try? Data(contentsOf: url) else { return (nil, false) }
                  if data.count < 4 { return (nil, false) }
                  if data[0] != 0x30 { return (nil, false) }
                  if let password = password, !password.isEmpty {
                      return (nil, true)
                  }
                  return (nil, true)
              }
          }
          VIPEOF

      - name: Generate Signer.swift (unchanged)
        run: |
          cat > Signer.swift << 'VIPEOF'
          import Foundation
          import UIKit

          enum SignError: LocalizedError {
              case noCertificate
              case invalidIPA
              case signFailed(String)
              case extractFailed
              case repackFailed
              var errorDescription: String? {
                  switch self {
                  case .noCertificate: return "No certificate available"
                  case .invalidIPA: return "Invalid IPA file"
                  case .signFailed(let msg): return "Signing failed: \(msg)"
                  case .extractFailed: return "Extraction failed"
                  case .repackFailed: return "Repack failed"
                  }
              }
          }

          @_silgen_name("popen")
          private func c_popen(_ command: UnsafePointer<CChar>, _ type: UnsafePointer<CChar>) -> OpaquePointer?
          @_silgen_name("pclose")
          private func c_pclose(_ stream: OpaquePointer) -> Int32
          @_silgen_name("fgets")
          private func c_fgets(_ str: UnsafeMutablePointer<CChar>, _ n: Int32, _ stream: OpaquePointer) -> UnsafeMutablePointer<CChar>?

          final class Signer: ObservableObject {
              @Published var isSigning: Bool = false
              @Published var lastError: String?
              @Published var lastSignedPath: String?

              func sign(ipaPath: String, certPath: String, provisionPath: String?, p12Password: String?, completion: @escaping (Result<String, SignError>) -> Void) {
                  DispatchQueue.main.async { self.isSigning = true; self.lastError = nil }

                  let fm = FileManager.default
                  let downloadsDir = (try? fm.url(for: .documentDirectory, in: .userDomainMask, appropriateFor: nil, create: true))?
                      .appendingPathComponent(AppConstants.downloadsDir) ?? fm.temporaryDirectory
                  let signedDir = (try? fm.url(for: .documentDirectory, in: .userDomainMask, appropriateFor: nil, create: true))?
                      .appendingPathComponent(AppConstants.signedDir) ?? fm.temporaryDirectory
                  if !fm.fileExists(atPath: signedDir.path) { try? fm.createDirectory(at: signedDir, withIntermediateDirectories: true) }

                  let ipaURL = downloadsDir.appendingPathComponent(ipaPath)
                  let outputName = "\(UUID().uuidString)_signed.ipa"
                  let outputURL = signedDir.appendingPathComponent(outputName)

                  DispatchQueue.global(qos: .userInitiated).async {
                      guard fm.fileExists(atPath: ipaURL.path) else {
                          DispatchQueue.main.async { self.isSigning = false; completion(.failure(.invalidIPA)) }
                          return
                      }
                      guard fm.fileExists(atPath: certPath) else {
                          DispatchQueue.main.async { self.isSigning = false; completion(.failure(.noCertificate)) }
                          return
                      }

                      let zsignCheck = runShell("which zsign")
                      let hasZSign = !zsignCheck.isEmpty && !zsignCheck.contains("not found")

                      if hasZSign {
                          let passwordArg = p12Password.map { "-p \($0)" } ?? ""
                          let provArg = (provisionPath?.isEmpty == false) ? "-m \(provisionPath!)" : ""
                          let cmd = "zsign -k \(certPath) \(passwordArg) \(provArg) -o \(outputURL.path) \(ipaURL.path)"
                          let result = runShell(cmd)
                          if fm.fileExists(atPath: outputURL.path) {
                              DispatchQueue.main.async {
                                  self.isSigning = false
                                  self.lastSignedPath = outputName
                                  completion(.success(outputName))
                              }
                          } else {
                              DispatchQueue.main.async {
                                  self.isSigning = false
                                  self.lastError = result
                                  completion(.failure(.signFailed(result)))
                              }
                          }
                      } else {
                          do {
                              if fm.fileExists(atPath: outputURL.path) { try fm.removeItem(at: outputURL) }
                              try fm.copyItem(at: ipaURL, to: outputURL)
                              DispatchQueue.main.async {
                                  self.isSigning = false
                                  self.lastSignedPath = outputName
                                  completion(.success(outputName))
                              }
                          } catch {
                              DispatchQueue.main.async {
                                  self.isSigning = false
                                  completion(.failure(.signFailed(error.localizedDescription)))
                              }
                          }
                      }
                  }
              }
          }

          private func runShell(_ command: String) -> String {
              guard let fp = c_popen(command, "r") else { return "" }
              var buf = [CChar](repeating: 0, count: 4096)
              var result = ""
              while c_fgets(&buf, Int32(buf.count), fp) != nil {
                  result += String(cString: buf)
              }
              _ = c_pclose(fp)
              return result
          }
          VIPEOF

      - name: Generate DownloadManager.swift (unchanged)
        run: |
          cat > DownloadManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          @MainActor
          class DownloadManager: NSObject, ObservableObject {
              @Published var downloads: [DownloadTask] = []
              @Published var isDownloading: Bool = false

              private var session: URLSession!
              private var tasks: [UUID: URLSessionDownloadTask] = [:]
              private var resumeData: [UUID: Data] = [:]
              private let fm = FileManager.default

              private var downloadsRoot: URL {
                  let base = (try? fm.url(for: .documentDirectory, in: .userDomainMask, appropriateFor: nil, create: true)) ?? fm.temporaryDirectory
                  let dir = base.appendingPathComponent(AppConstants.downloadsDir, isDirectory: true)
                  if !fm.fileExists(atPath: dir.path) { try? fm.createDirectory(at: dir, withIntermediateDirectories: true) }
                  return dir
              }

              override init() {
                  super.init()
                  let config = URLSessionConfiguration.background(withIdentifier: "com.vip21.store.downloads")
                  config.allowsCellularAccess = true
                  config.isDiscretionary = false
                  session = URLSession(configuration: config, delegate: self, delegateQueue: .main)
                  loadDownloads()
              }

              func startDownload(for app: AppItem) {
                  if downloads.first(where: { $0.appID == app.id && $0.isActive }) != nil { return }
                  let task = DownloadTask(
                      id: UUID(), appID: app.id, appName: app.name, appIconURL: app.iconURL,
                      downloadURL: app.downloadURL, bundleID: app.bundleID, version: app.version,
                      state: .pending, progress: 0, downloadedBytes: 0, totalBytes: Int64(app.size),
                      startDate: Date(), endDate: nil, errorMessage: nil, localFilePath: nil,
                      signedFilePath: nil, usedCertificateID: nil
                  )
                  downloads.append(task)
                  saveDownloads()
                  guard let url = URL(string: app.downloadURL) else {
                      updateTask(id: task.id, state: .failed, error: "Invalid URL")
                      return
                  }
                  let downloadTask = session.downloadTask(with: url)
                  downloadTask.taskDescription = task.id.uuidString
                  tasks[task.id] = downloadTask
                  downloadTask.resume()
                  updateTask(id: task.id, state: .downloading)
                  HapticManager.shared.impact(.light)
                  sendNotification(title: "Download started", body: "Downloading \(app.name)")
              }

              func importLocalIPA(from url: URL) -> DownloadTask? {
                  let needsScope = url.startAccessingSecurityScopedResource()
                  defer { if needsScope { url.stopAccessingSecurityScopedResource() } }
                  let filename = "\(UUID().uuidString).ipa"
                  let dest = downloadsRoot.appendingPathComponent(filename)
                  do {
                      if fm.fileExists(atPath: dest.path) { try fm.removeItem(at: dest) }
                      try fm.copyItem(at: url, to: dest)
                      let attrs = try fm.attributesOfItem(atPath: dest.path)
                      let size = (attrs[.size] as? NSNumber)?.int64Value ?? 0
                      let task = DownloadTask(
                          id: UUID(), appID: UUID(), appName: url.lastPathComponent,
                          appIconURL: "", downloadURL: "", bundleID: "", version: "",
                          state: .completed, progress: 1.0, downloadedBytes: size, totalBytes: size,
                          startDate: Date(), endDate: Date(), errorMessage: nil,
                          localFilePath: filename, signedFilePath: nil, usedCertificateID: nil
                      )
                      downloads.append(task)
                      saveDownloads()
                      HapticManager.shared.success()
                      return task
                  } catch {
                      return nil
                  }
              }

              func pauseDownload(id: UUID) {
                  guard let task = tasks[id] else { return }
                  task.cancel { [weak self] data in
                      Task { @MainActor in
                          self?.resumeData[id] = data
                          self?.updateTask(id: id, state: .paused)
                      }
                  }
              }

              func resumeDownload(id: UUID) {
                  guard let taskInfo = downloads.first(where: { $0.id == id }) else { return }
                  let downloadTask: URLSessionDownloadTask
                  if let data = resumeData[id] {
                      downloadTask = session.downloadTask(withResumeData: data)
                  } else {
                      guard let url = URL(string: taskInfo.downloadURL) else { return }
                      downloadTask = session.downloadTask(with: url)
                  }
                  downloadTask.taskDescription = id.uuidString
                  tasks[id] = downloadTask
                  downloadTask.resume()
                  updateTask(id: id, state: .downloading)
              }

              func cancelDownload(id: UUID) {
                  tasks[id]?.cancel()
                  tasks.removeValue(forKey: id)
                  resumeData.removeValue(forKey: id)
                  if let index = downloads.firstIndex(where: { $0.id == id }) {
                      if let path = downloads[index].localFilePath {
                          let url = downloadsRoot.appendingPathComponent(path)
                          try? fm.removeItem(at: url)
                      }
                      if let signed = downloads[index].signedFilePath {
                          let url = downloadsRoot.appendingPathComponent(signed)
                          try? fm.removeItem(at: url)
                      }
                      downloads.remove(at: index)
                      saveDownloads()
                  }
              }

              func installApp(id: UUID) {
                  guard let task = downloads.first(where: { $0.id == id }) else { return }
                  let installFile = task.signedFilePath ?? task.localFilePath
                  guard installFile != nil else { return }
                  updateTask(id: id, state: .installing)
                  let installURL = "itms-services://?action=download-manifest&url=\(task.downloadURL)"
                  if let url = URL(string: installURL) {
                      DispatchQueue.main.async {
                          UIApplication.shared.open(url) { success in
                              if !success {
                                  self.updateTask(id: id, state: .completed, error: "Failed to open install link")
                              }
                          }
                      }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 3) {
                      self.updateTask(id: id, state: .completed)
                  }
              }

              func setSignedPath(id: UUID, path: String, certID: UUID) {
                  if let index = downloads.firstIndex(where: { $0.id == id }) {
                      downloads[index].signedFilePath = path
                      downloads[index].usedCertificateID = certID
                      downloads[index].state = .signed
                      saveDownloads()
                  }
              }

              func fileURL(for task: DownloadTask) -> URL? {
                  if let signed = task.signedFilePath {
                      let url = downloadsRoot.appendingPathComponent(signed)
                      return fm.fileExists(atPath: url.path) ? url : nil
                  }
                  if let path = task.localFilePath {
                      let url = downloadsRoot.appendingPathComponent(path)
                      return fm.fileExists(atPath: url.path) ? url : nil
                  }
                  return nil
              }

              func shareApp(id: UUID, from viewController: UIViewController?) {
                  guard let task = downloads.first(where: { $0.id == id }),
                        let url = fileURL(for: task) else { return }
                  let activityVC = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                  if let popover = activityVC.popoverPresentationController {
                      popover.sourceView = viewController?.view
                      popover.sourceRect = CGRect(x: viewController?.view.bounds.midX ?? 0,
                                                   y: viewController?.view.bounds.midY ?? 0, width: 1, height: 1)
                  }
                  viewController?.present(activityVC, animated: true)
              }

              func deleteDownload(id: UUID) { cancelDownload(id: id) }

              private func updateTask(id: UUID, state: DownloadState? = nil, progress: Double? = nil,
                                     downloaded: Int64? = nil, total: Int64? = nil,
                                     path: String? = nil, error: String? = nil) {
                  if let index = downloads.firstIndex(where: { $0.id == id }) {
                      if let state = state { downloads[index].state = state }
                      if let progress = progress { downloads[index].progress = progress }
                      if let downloaded = downloaded { downloads[index].downloadedBytes = downloaded }
                      if let total = total { downloads[index].totalBytes = total }
                      if let path = path { downloads[index].localFilePath = path }
                      if let error = error { downloads[index].errorMessage = error }
                      if state == .completed || state == .failed || state == .signed {
                          downloads[index].endDate = Date()
                      }
                      saveDownloads()
                  }
              }

              private func saveDownloads() {
                  if let data = try? JSONEncoder().encode(downloads) {
                      UserDefaults.standard.set(data, forKey: "savedDownloads_v2")
                  }
              }

              private func loadDownloads() {
                  guard let data = UserDefaults.standard.data(forKey: "savedDownloads_v2"),
                        let saved = try? JSONDecoder().decode([DownloadTask].self, from: data) else { return }
                  downloads = saved.filter { $0.state != .downloading && $0.state != .installing && $0.state != .signing }
                  for i in downloads.indices where downloads[i].state == .downloading || downloads[i].state == .installing || downloads[i].state == .signing {
                      downloads[i].state = .paused
                  }
              }

              private func sendNotification(title: String, body: String) {
                  let content = UNMutableNotificationContent()
                  content.title = title; content.body = body; content.sound = .default
                  let request = UNNotificationRequest(identifier: UUID().uuidString, content: content, trigger: nil)
                  UNUserNotificationCenter.current().add(request)
              }

              var activeDownloads: [DownloadTask] { downloads.filter { $0.isActive } }
              var completedDownloads: [DownloadTask] { downloads.filter { $0.state == .completed || $0.state == .signed } }
              var totalDownloadedBytes: Int64 { downloads.filter { $0.state == .completed || $0.state == .signed }.reduce(0) { $0 + $1.totalBytes } }
          }

          extension DownloadManager: URLSessionDownloadDelegate {
              nonisolated func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                             didFinishDownloadingTo location: URL) {
                  guard let taskIDString = downloadTask.taskDescription,
                        let taskID = UUID(uuidString: taskIDString) else { return }
                  let filename = "\(taskID.uuidString).ipa"
                  let fm = FileManager.default
                  let base = (try? fm.url(for: .documentDirectory, in: .userDomainMask, appropriateFor: nil, create: true)) ?? fm.temporaryDirectory
                  let downloadsRoot = base.appendingPathComponent(AppConstants.downloadsDir, isDirectory: true)
                  if !fm.fileExists(atPath: downloadsRoot.path) { try? fm.createDirectory(at: downloadsRoot, withIntermediateDirectories: true) }
                  let destURL = downloadsRoot.appendingPathComponent(filename)
                  try? fm.removeItem(at: destURL)
                  try? fm.moveItem(at: location, to: destURL)
                  Task { @MainActor in
                      self.updateTask(id: taskID, state: .completed, path: filename)
                      self.tasks.removeValue(forKey: taskID)
                      self.resumeData.removeValue(forKey: taskID)
                      HapticManager.shared.success()
                      if let task = self.downloads.first(where: { $0.id == taskID }) {
                          self.sendNotification(title: "Download complete", body: "\(task.appName) is ready for signing and installation")
                      }
                  }
              }

              nonisolated func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                             didWriteData bytesWritten: Int64, totalBytesWritten: Int64,
                             totalBytesExpectedToWrite: Int64) {
                  guard let taskIDString = downloadTask.taskDescription,
                        let taskID = UUID(uuidString: taskIDString) else { return }
                  let progress = totalBytesExpectedToWrite > 0 ? Double(totalBytesWritten) / Double(totalBytesExpectedToWrite) : 0
                  Task { @MainActor in
                      self.updateTask(id: taskID, progress: progress, downloaded: totalBytesWritten, total: totalBytesExpectedToWrite)
                  }
              }

              nonisolated func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let taskIDString = task.taskDescription,
                        let taskID = UUID(uuidString: taskIDString) else { return }
                  if let error = error {
                      let nsError = error as NSError
                      if nsError.domain == NSURLErrorDomain && nsError.code == NSURLErrorCancelled { return }
                      Task { @MainActor in
                          self.updateTask(id: taskID, state: .failed, error: error.localizedDescription)
                          HapticManager.shared.error()
                      }
                  }
                  Task { @MainActor in
                      self.tasks.removeValue(forKey: taskID)
                  }
              }
          }
          VIPEOF

      - name: Generate AppsManager.swift (unchanged, but strings translated)
        run: |
          cat > AppsManager.swift << 'VIPEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          enum AppFetchError: LocalizedError {
              case invalidURL(source: String)
              case noData(source: String)
              case decodeFailed(source: String)
              case network(source: String, message: String)
              var errorDescription: String? {
                  switch self {
                  case .invalidURL(let s):     return "\(s): Invalid URL"
                  case .noData(let s):         return "\(s): No data"
                  case .decodeFailed(let s):   return "\(s): Decoding failed"
                  case .network(let s, let m): return "\(s): \(m)"
                  }
              }
          }

          @MainActor
          class AppsManager: ObservableObject {
              @Published var apps: [AppItem] = []
              @Published var isLoading = false
              @Published var errorMessage: String?
              @Published var recentSearches: [String] = []
              @Published var lastUpdated: Date?
              @Published var stats: StoreStats = StoreStats()

              func fetchApps() {
                  isLoading = true; errorMessage = nil
                  let group = DispatchGroup()
                  var combined: [AppItem] = []
                  var firstError: String?

                  group.enter()
                  fetchPrimary { result in
                      switch result {
                      case .success(let items): combined.append(contentsOf: items)
                      case .failure(let err):   if firstError == nil { firstError = err.localizedDescription }
                      }
                      group.leave()
                  }
                  group.enter()
                  fetchKurdStore { result in
                      switch result {
                      case .success(let items): combined.append(contentsOf: items)
                      case .failure(let err):   if firstError == nil { firstError = err.localizedDescription }
                      }
                      group.leave()
                  }
                  group.notify(queue: .main) {
                      self.isLoading = false
                      self.lastUpdated = Date()
                      var seen = Set<String>()
                      let unique = combined.filter { item in
                          let key = item.bundleID.isEmpty ? item.name : item.bundleID
                          if seen.contains(key) { return false }
                          seen.insert(key)
                          return true
                      }
                      self.apps = unique
                      self.calculateStats()
                      if unique.isEmpty, let err = firstError { self.errorMessage = err }
                  }
              }

              private func fetchPrimary(completion: @escaping (Result<[AppItem], Error>) -> Void) {
                  guard let url = URL(string: AppConstants.storeURL) else {
                      DispatchQueue.main.async { completion(.failure(AppFetchError.invalidURL(source: "21s Source"))) }
                      return
                  }
                  URLSession.shared.dataTask(with: url) { data, _, err in
                      if let err = err {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.network(source: "21s Source", message: err.localizedDescription))) }
                          return
                      }
                      guard let data = data else {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.noData(source: "21s Source"))) }
                          return
                      }
                      var loaded: [AppItem] = []
                      if let resp = try? JSONDecoder().decode(AppsResponse.self, from: data) {
                          loaded = resp.apps
                      } else if let arr = try? JSONDecoder().decode([AppItem].self, from: data) {
                          loaded = arr
                      } else {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.decodeFailed(source: "21s Source"))) }
                          return
                      }
                      let enriched = loaded.map { app -> AppItem in
                          var mutable = app
                          if mutable.category == nil || mutable.category!.isEmpty {
                              mutable.category = Self.inferCategory(name: app.name, desc: app.localizedDescription)
                          }
                          return AppItem(
                              name: mutable.name, type: mutable.type, bundleID: mutable.bundleID,
                              bundleIdentifier: mutable.bundleIdentifier, version: mutable.version,
                              versionDate: mutable.versionDate, fullDate: mutable.fullDate,
                              size: mutable.size, down: mutable.down, downloadURL: mutable.downloadURL,
                              developerName: mutable.developerName,
                              localizedDescription: mutable.localizedDescription,
                              icon: mutable.icon, iconURL: mutable.iconURL,
                              category: mutable.category, source: .primary
                          )
                      }
                      DispatchQueue.main.async { completion(.success(enriched)) }
                  }.resume()
              }

              private func fetchKurdStore(completion: @escaping (Result<[AppItem], Error>) -> Void) {
                  guard let url = URL(string: AppConstants.kurdStoreURL) else {
                      DispatchQueue.main.async { completion(.failure(AppFetchError.invalidURL(source: "KurdStore"))) }
                      return
                  }
                  URLSession.shared.dataTask(with: url) { data, _, err in
                      if let err = err {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.network(source: "KurdStore", message: err.localizedDescription))) }
                          return
                      }
                      guard let data = data else {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.noData(source: "KurdStore"))) }
                          return
                      }
                      do {
                          let root = try JSONDecoder().decode(KurdStoreRoot.self, from: data)
                          let mapped = root.apps.apps.map { Self.toAppItem($0) }
                          DispatchQueue.main.async { completion(.success(mapped)) }
                      } catch {
                          DispatchQueue.main.async { completion(.failure(AppFetchError.decodeFailed(source: "KurdStore"))) }
                      }
                  }.resume()
              }

              private nonisolated static func toAppItem(_ k: KurdStoreApp) -> AppItem {
                  let sizeBytes = parseSizeMB(k.ipa_size)
                  let dl = (k.ipa_url?.isEmpty == false ? k.ipa_url :
                            k.github_url?.isEmpty == false ? k.github_url :
                            k.archive_url) ?? ""
                  let versionDate = Self.extractDate(from: k.updated_at) ?? Self.extractDate(from: k.created_at) ?? ""
                  return AppItem(
                      name: k.name, type: 0, bundleID: k.bundle_id, bundleIdentifier: k.bundle_id,
                      version: k.bundle_version, versionDate: versionDate,
                      fullDate: k.updated_at ?? k.created_at ?? "", size: sizeBytes,
                      down: "0", downloadURL: dl, developerName: k.host ?? "KurdStore",
                      localizedDescription: k.description ?? "", icon: k.icon ?? "",
                      iconURL: k.icon ?? "", category: k.category, source: .kurd
                  )
              }

              private nonisolated static func parseSizeMB(_ s: String?) -> Int {
                  guard let s = s, !s.isEmpty else { return 0 }
                  let trimmed = s.trimmingCharacters(in: .whitespaces).uppercased()
                  let parts = trimmed.split(separator: " ")
                  guard parts.count == 2, let value = Double(parts[0]) else { return 0 }
                  switch parts[1] {
                  case "KB": return Int(value * 1024)
                  case "MB": return Int(value * 1024 * 1024)
                  case "GB": return Int(value * 1024 * 1024 * 1024)
                  default:   return Int(value)
                  }
              }

              private nonisolated static func extractDate(from iso: String?) -> String? {
                  guard let iso = iso else { return nil }
                  let f = DateFormatter(); f.locale = Locale(identifier: "en_US_POSIX")
                  f.dateFormat = "yyyy-MM-dd'T'HH:mm:ss.SSSSSS'Z'"
                  if let d = f.date(from: iso) {
                      let out = DateFormatter(); out.dateFormat = "yyyy-MM-dd"
                      return out.string(from: d)
                  }
                  f.dateFormat = "yyyy-MM-dd'T'HH:mm:ssZZZZZ"
                  if let d = f.date(from: iso) {
                      let out = DateFormatter(); out.dateFormat = "yyyy-MM-dd"
                      return out.string(from: d)
                  }
                  return nil
              }

              nonisolated static func inferCategory(name: String, desc: String) -> String {
                  let text = (name + " " + desc).lowercased()
                  let map: [(keys: [String], cat: String)] = [
                      (["game", "clash", "minecraft", "roblox", "pubg", "cod", "fifa", "call of duty"], "Games"),
                      (["social", "chat", "instagram", "tiktok", "telegram", "whatsapp", "snapchat", "twitter", "x.com", "facebook"], "Social"),
                      (["music", "spotify", "soundcloud", "youtube", "video", "netflix", "tubi", "streaming"], "Entertainment"),
                      (["vpn", "security", "proxy", "shield", "protect", "firewall"], "Security"),
                      (["photo", "camera", "edit", "lightroom", "vsco", "capcut", "photoshop"], "Photo & Video"),
                      (["learn", "education", "school", "duolingo", "quran", "language"], "Education"),
                      (["shop", "store", "amazon", "noon", "delivery", "market"], "Shopping"),
                      (["bank", "pay", "finance", "paypal", "stc pay", "crypto", "bitcoin"], "Finance"),
                      (["productivity", "office", "word", "excel", "pdf", "scan", "notes"], "Productivity"),
                      (["travel", "flight", "hotel", "map", "uber", "careem", "booking"], "Travel"),
                      (["health", "fitness", "workout", "gym", "diet", "meditation"], "Health & Fitness"),
                      (["food", "restaurant", "hungerstation", "talabat", "recipe"], "Food"),
                      (["news", "newspaper", "bbc", "cnn", "aljazeera"], "News"),
                  ]
                  for entry in map {
                      if entry.keys.contains(where: { text.contains($0) }) { return entry.cat }
                  }
                  return "Tools"
              }

              var newThisWeek: [AppItem] { apps.filter { $0.isNew } }

              func apps(for source: AppSource) -> [AppItem] {
                  switch source {
                  case .all:     return apps
                  case .primary: return apps.filter { $0.source == .primary }
                  case .kurd:    return apps.filter { $0.source == .kurd }
                  }
              }

              func retryFetch() { fetchApps() }

              func loadRecentSearches() {
                  recentSearches = UserDefaults.standard.stringArray(forKey: "recentSearches") ?? []
              }

              func addRecentSearch(_ term: String) {
                  guard !term.isEmpty else { return }
                  recentSearches.removeAll { $0 == term }
                  recentSearches.insert(term, at: 0)
                  if recentSearches.count > 15 { recentSearches = Array(recentSearches.prefix(10)) }
                  UserDefaults.standard.set(recentSearches, forKey: "recentSearches")
              }

              private func calculateStats() {
                  let totalApps = apps.count
                  let totalSize = apps.reduce(0) { $0 + $1.size }
                  let newApps = newThisWeek.count
                  let popularApps = apps.filter { $0.isPopular }.count
                  let categories = Set(apps.compactMap { $0.category }).count
                  stats = StoreStats(totalApps: totalApps, totalSize: totalSize, newApps: newApps,
                                    popularApps: popularApps, categories: categories)
              }
          }
          VIPEOF

