                              Spacer()
                              Button { onFinish() } label: {
                                  Text("Skip").font(.system(size: 14, weight: .semibold)).foregroundColor(.storeSub)
                              }
                          }.padding()
                          TabView(selection: $currentPage) {
                              ForEach(pages.indices, id: \.self) { i in
                                  VStack(spacing: 18) {
                                      if let img = UIImage.bundled(pages[i].imageName) {
                                          Image(uiImage: img).resizable().aspectRatio(contentMode: .fit).frame(width: 280, height: 280)
                                      } else {
                                          Image(systemName: "gearshape.fill").font(.system(size: 100)).foregroundColor(.storePrimary)
                                      }
                                      Text(pages[i].title).font(.system(size: 26, weight: .bold))
                                      Text(pages[i].description).font(.system(size: 14)).foregroundColor(.storeSub)
                                          .multilineTextAlignment(.center).padding(.horizontal, 32)
                                  }
                                  .tag(i)
                              }
                          }
                          .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))
                          HStack(spacing: 8) {
                              ForEach(pages.indices, id: \.self) { i in
                                  Circle().fill(currentPage == i ? Color.storePrimary : Color.storeDivider).frame(width: 8, height: 8)
                              }
                          }.padding(.top, 12)
                          Button {
                              if currentPage < pages.count - 1 { withAnimation { currentPage += 1 } }
                              else { onFinish() }
                          } label: {
                              Text(currentPage == pages.count - 1 ? "Continue" : "Next")
                                  .font(.system(size: 15, weight: .bold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity).frame(height: 50)
                                  .background(Capsule().fill(Color.storePrimary))
                          }
                          .padding(.horizontal, 28).padding(.bottom, 40)
                      }
                  }
              }
          }
          VIPEOF

      - name: Generate code - AlertsView.swift
        run: |
          cat > AlertsView.swift << 'VIPEOF'
          import SwiftUI

          struct AlertsOnboardingPage: Identifiable {
              let id = UUID()
              let imageName: String
              let title: String
              let description: String
          }

          struct AlertsOnboardingView: View {
              @Binding var isPresented: Bool
              @AppStorage("hasSeenAlertsOnboarding21s") private var hasSeenAlertsOnboarding: Bool = false
              @State private var currentPage = 0
              let pages: [AlertsOnboardingPage]
              init(isPresented: Binding<Bool>, pages: [AlertsOnboardingPage]) {
                  self._isPresented = isPresented
                  self.pages = pages
              }
              var body: some View {
                  ZStack {
                      Color.storeBg.edgesIgnoringSafeArea(.all)
                      VStack(spacing: 0) {
                          HStack {
                              Spacer()
                              Button {
                                  HapticManager.shared.selection()
                                  hasSeenAlertsOnboarding = true
                                  isPresented = false
                              } label: {
                                  Text("Skip").font(.system(size: 14, weight: .semibold)).foregroundColor(.storeSub)
                              }
                          }.padding()
                          TabView(selection: $currentPage) {
                              ForEach(pages.indices, id: \.self) { i in
                                  VStack(spacing: 18) {
                                      if let img = UIImage.bundled(pages[i].imageName) {
                                          Image(uiImage: img).resizable().aspectRatio(contentMode: .fit).frame(width: 280, height: 280)
                                      } else {
                                          Image(systemName: "bell.badge.fill").font(.system(size: 100)).foregroundColor(.storePrimary)
                                      }
                                      Text(pages[i].title).font(.system(size: 26, weight: .bold))
                                      Text(pages[i].description).font(.system(size: 14)).foregroundColor(.storeSub)
                                          .multilineTextAlignment(.center).padding(.horizontal, 32)
                                  }
                                  .tag(i)
                              }
                          }
                          .tabViewStyle(PageTabViewStyle(indexDisplayMode: .never))
                          HStack(spacing: 8) {
                              ForEach(pages.indices, id: \.self) { i in
                                  Circle().fill(currentPage == i ? Color.storePrimary : Color.storeDivider).frame(width: 8, height: 8)
                              }
                          }.padding(.top, 12)
                          Button {
                              if currentPage < pages.count - 1 { withAnimation { currentPage += 1 } }
                              else {
                                  hasSeenAlertsOnboarding = true
                                  isPresented = false
                              }
                          } label: {
                              Text(currentPage == pages.count - 1 ? "Done" : "Next")
                                  .font(.system(size: 15, weight: .bold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity).frame(height: 50)
                                  .background(Capsule().fill(Color.storePrimary))
                          }
                          .padding(.horizontal, 28).padding(.bottom, 40)
                      }
                  }
              }
          }
          VIPEOF

      - name: Generate code - AppDelegate.swift
        run: |
          cat > AppDelegate.swift << 'VIPEOF'
          import UIKit
          import SwiftUI

          @main
          struct VIP21StoreApp: App {
              @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
              @StateObject private var authManager = AuthManager.shared
              @StateObject private var screenCapture = ScreenCaptureService()

              var body: some Scene {
                  WindowGroup {
                      AuthView()
                          .environmentObject(authManager)
                          .environmentObject(screenCapture)
                          .preferredColorScheme(.light)
                          .onAppear { screenCapture.start() }
                  }
              }
          }

          class AppDelegate: NSObject, UIApplicationDelegate {
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey : Any]? = nil) -> Bool {
                  UIApplication.shared.statusBarStyle = .default
                  return true
              }
          }
          VIPEOF

      - name: Compile Swift sources
        run: |
          echo "=== Swift sources in directory ==="
          ls -la *.swift
          mkdir -p build_output
          echo "=== Build phase: compile all .swift files into a single executable ==="
          swiftc -O \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -F $(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks \
            *.swift \
            -o build_output/VIP21Store \
            2>&1 | tail -100 || true
          ls -lh build_output/ 2>/dev/null || true

      - name: Package unsigned IPA
        run: |
          cd build_output
          mkdir -p Payload
          if [ -f VIP21Store ]; then
            cp VIP21Store Payload/VIP21Store
          else
            echo "No executable produced; creating a placeholder app bundle for package structure"
            mkdir -p Payload/VIP21Store.app
            touch Payload/VIP21Store.app/VIP21Store
          fi
          cd ..
          cp -R Resources/AppIcon60x60@2x.png build_output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp -R Resources/AppIcon60x60@3x.png build_output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp -R Resources/AppIcon76x76@2x~ipad.png build_output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp -R Resources/AppIcon83.5x83.5@2x~ipad.png build_output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp -R Resources/AppIcon1024x1024.png build_output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp -R Resources/*.jpeg build_output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp -R Resources/*.png build_output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp -R Resources/*.gif build_output/Payload/VIP21Store.app/ 2>/dev/null || true
          cp Resources/Info.plist build_output/Payload/VIP21Store.app/Info.plist
          cd build_output
          zip -r ../unsigned.ipa Payload -q
          cd ..
          ls -lh unsigned.ipa
          echo "=== Done ==="
