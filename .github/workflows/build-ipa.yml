      # =========================================================
      # SOURCE CODE - CachedAsyncImage.swift
      # High-perf image cache for 20K+ icons
      # =========================================================
      - name: Generate code - CachedAsyncImage.swift
        run: |
          cat > CachedAsyncImage.swift << 'VIPEOF'
          import SwiftUI
          import UIKit

          /// Async image with a three-tier cache:
          ///   L1: in-memory NSCache (small, fast)
          ///   L2: on-disk LRU (via DiskCache)
          ///   L3: network (URLSession)
          /// Built to handle tens of thousands of unique icons without
          /// running the device out of memory.
          struct CachedAsyncImage: View {
              let urlString: String?
              let size: CGFloat

              @State private var image: UIImage? = nil

              private static let memCache: NSCache<NSString, UIImage> = {
                  let c = NSCache<NSString, UIImage>()
                  c.countLimit = AppConstants.iconCacheMaxEntries
                  c.totalCostLimit = Int(AppConstants.iconsCacheMaxBytes)
                  return c
              }()

              var body: some View {
                  Group {
                      if let img = image {
                          Image(uiImage: img)
                              .resizable()
                              .scaledToFill()
                      } else {
                          placeholder
                      }
                  }
                  .frame(width: size, height: size)
                  .clipShape(RoundedRectangle(cornerRadius: size * 0.22, style: .continuous))
                  .task(id: urlString) { await load() }
              }

              @ViewBuilder
              private var placeholder: some View {
                  let url = urlString ?? ""
                  let initial = url.isEmpty ? "?" : String(url.last!).uppercased()
                  ZStack {
                      RoundedRectangle(cornerRadius: size * 0.22, style: .continuous)
                          .fill(LinearGradient(
                              colors: [Color.storePrimary, Color.storePrimaryDark],
                              startPoint: .topLeading, endPoint: .bottomTrailing
                          ))
                      Text(initial)
                          .font(.system(size: size * 0.4, weight: .bold))
                          .foregroundColor(.white)
                  }
              }

              private func load() async {
                  guard let s = urlString, let url = URL(string: s) else { return }
                  let key = s as NSString
                  if let cached = Self.memCache.object(forKey: key) {
                      self.image = cached
                      return
                  }
                  let region = DiskCache.shared.iconRegion
                  if let data = DiskCache.shared.read(forKey: s, in: region),
                     let img = UIImage(data: data) {
                      Self.memCache.setObject(img, forKey: key, cost: data.count)
                      self.image = img
                      return
                  }
                  do {
                      let (data, _) = try await URLSession.shared.data(from: url)
                      if let img = UIImage(data: data) {
                          Self.memCache.setObject(img, forKey: key, cost: data.count)
                          DiskCache.shared.write(data, forKey: s, in: region)
                          self.image = img
                      }
                  } catch {
                      // network failed - keep placeholder
                  }
              }
          }
          VIPEOF

