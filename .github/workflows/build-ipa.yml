              // MARK: - Admin control panel sync
              static let adminBaseURL = "https://project--5ffe1099-bf1d-4a9f-a669-a7bbab8edcea.lovable.app"

              private struct AdminReelsEnvelope: Decodable { let reels: [AdminReel] }
              private struct AdminReel: Decodable {
