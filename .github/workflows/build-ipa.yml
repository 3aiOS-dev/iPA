                                          .font(.system(size: 12, weight: .semibold))
                                          .foregroundColor(Color(red: 1.0, green: 0.55, blue: 0.6))
                                  }

                                  Button {
                                      if let url = URL(string: ActivationManager.activationNameLink) {
                                          UIApplication.shared.open(url)
                                      }
                                  } label: {
                                      HStack(spacing: 8) {
                                          Image(systemName: "paperplane.fill")
                                          Text(LS("احصل على كود الاشتراك"))
                                              .font(.system(size: 13, weight: .semibold))
                                      }
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 12)
                                      .background(RoundedRectangle(cornerRadius: 14).fill(.white.opacity(0.14)))
                                      .foregroundColor(.white)
                                  }
                              }
                              .padding(14)
                              .background(RoundedRectangle(cornerRadius: 20).fill(panel))
                              .padding(.horizontal, 22)

                              // ---- Verify button (opens the store when valid) ----
                              Button {
                                  focused = false
                                  HapticManager.shared.impact(.medium)
                                  activation.activate(code: input) { ok in
                                      if ok {
                                          activation.verify()
                                      } else {
                                          withAnimation(.default.repeatCount(3, autoreverses: true).speed(6)) { shake = true }
                                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.4) { shake = false }
                                      }
                                  }
                              } label: {
                                  HStack(spacing: 8) {
                                      if activation.isWorking { ProgressView().tint(.black) }
                                      Text(activation.isWorking ? LS("جارٍ التحقق…") : LS("تحقق"))
                                          .font(.system(size: 17, weight: .bold))
                                  }
                                  .frame(maxWidth: .infinity)
                                  .padding(.vertical, 17)
                                  .background(Capsule().fill(.white))
                                  .foregroundColor(.black)
                              }
                              .disabled(activation.isWorking || input.trimmingCharacters(in: .whitespaces).isEmpty)
                              .opacity(activation.isWorking || input.trimmingCharacters(in: .whitespaces).isEmpty ? 0.6 : 1)
                              .padding(.horizontal, 22)

                              VStack(spacing: 10) {
                                  GateFeatureRow(icon: "bolt.fill", title: LS("تثبيت مباشر"), subtitle: LS("بدون كمبيوتر أو أدوات خارجية"))
                                  GateFeatureRow(icon: "lock.shield.fill", title: LS("حماية كاملة"), subtitle: LS("اسم مرتبط بجهازك فقط"))
                                  GateFeatureRow(icon: "arrow.triangle.2.circlepath", title: LS("تحديثات مستمرة"), subtitle: LS("أحدث الإصدارات أولًا بأول"))
                              }
                              .padding(.horizontal, 22)
                              .padding(.bottom, 40)
                          }
                      }
                  }
                  .onAppear { activation.verify() }
              }
          }
          struct GateFeatureRow: View {
              let icon: String
              let title: String
              let subtitle: String
              var body: some View {
                  HStack(spacing: 12) {
                      Image(systemName: icon)
                          .font(.system(size: 16, weight: .bold))
                          .foregroundColor(.white)
                          .frame(width: 38, height: 38)
                          .background(Circle().fill(.white.opacity(0.14)))
                      VStack(alignment: .leading, spacing: 2) {
                          Text(title).font(.system(size: 14, weight: .bold)).foregroundColor(.white)
                          Text(subtitle).font(.system(size: 11)).foregroundColor(.white.opacity(0.65))
                      }
                      Spacer()
                  }
                  .padding(12)
                  .background(RoundedRectangle(cornerRadius: 16).fill(.white.opacity(0.08)))
              }
          }

          /// يغلّف المحتوى: يعرض شاشة وضع الاشتراك إن لم يكن التطبيق مفعّلًا.
          struct ActivationGateContainer<Content: View>: View {
              @ObservedObject private var activation = ActivationManager.shared
              private let content: () -> Content
              init(@ViewBuilder content: @escaping () -> Content) { self.content = content }

              var body: some View {
                  Group {
                      if activation.isActive {
                          content()
                      } else {
                          SubscriptionGateView()
                      }
                  }
                  .animation(.easeInOut(duration: 0.35), value: activation.isActive)
              }
          }
          ACTEOF

      - name: Generate code - Countries.swift
