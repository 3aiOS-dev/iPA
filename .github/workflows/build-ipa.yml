name: 21s Pro Login Only - SwiftUI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NEW_BUNDLE_ID: "com.vip21.store.pro"
  NEW_APP_NAME: "21s Pro"

jobs:
  build:
    runs-on: macos-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: Install required tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip 2>/dev/null || true
          command -v ldid || { echo "❌ ldid not installed"; exit 1; }
          command -v zip || { echo "❌ zip not installed"; exit 1; }

      # =========================================================
      # RESOURCES & ASSETS
      # =========================================================
      - name: Generate app icons
        run: |
          mkdir -p Resources
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont

          def make_icon(size, path):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              # Background gradient simulation
              for y in range(size):
                  t = y / size
                  r = int(15 * (1-t) + 8 * t)
                  g = int(18 * (1-t) + 10 * t)
                  b = int(30 * (1-t) + 15 * t)
                  draw.line([(0, y), (size, y)], fill=(r, g, b, 255))
              # Border
              margin = int(size * 0.06)
              draw.rounded_rectangle(
                  [margin, margin, size-margin, size-margin],
                  radius=size//5,
                  outline=(50, 120, 230, 255),
                  width=max(2, size//40)
              )
              # Text "21"
              try:
                  font_size = int(size * 0.38)
                  font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", font_size)
              except:
                  try:
                      font = ImageFont.truetype("/System/Library/Fonts/Supplemental/Arial Bold.ttf", font_size)
                  except:
                      font = ImageFont.load_default()
              text = "21"
              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              x = (size - tw) / 2 - bbox[0]
              y = (size - th) / 2 - bbox[1]
              # Shadow
              draw.text((x+2, y+2), text, fill=(0, 0, 0, 100), font=font)
              draw.text((x, y), text, fill=(70, 150, 255, 255), font=font)
              # PRO badge
              try:
                  pro_font = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", int(size*0.12))
              except:
                  pro_font = font
              pro_text = "PRO"
              pbbox = draw.textbbox((0,0), pro_text, font=pro_font)
              pw, ph = pbbox[2]-pbbox[0], pbbox[3]-pbbox[1]
              px = size - pw - size//8
              py = size//8
              draw.rounded_rectangle([px-size//20, py-size//20, px+pw+size//20, py+ph+size//20],
                                     radius=size//30, fill=(255, 50, 80, 220))
              draw.text((px, py), pro_text, fill=(255, 255, 255, 255), font=pro_font)
              img.save(path, "PNG")

          make_icon(120,  "Resources/AppIcon60x60@2x.png")
          make_icon(180,  "Resources/AppIcon60x60@3x.png")
          make_icon(152,  "Resources/AppIcon76x76@2x~ipad.png")
          make_icon(167,  "Resources/AppIcon83.5x83.5@2x~ipad.png")
          make_icon(1024, "Resources/AppIcon1024x1024.png")
          PYEOF
          ls -lh Resources

      - name: Generate Info.plist
        run: |
          mkdir -p Resources
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>           <string>en</string>
              <key>CFBundleExecutable</key>                  <string>VIP21Store</string>
              <key>CFBundleIdentifier</key>                  <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key>       <string>6.0</string>
              <key>CFBundleName</key>                        <string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundleDisplayName</key>                 <string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundlePackageType</key>                 <string>APPL</string>
              <key>CFBundleSignature</key>                   <string>????</string>
              <key>CFBundleShortVersionString</key>          <string>1.0</string>
              <key>CFBundleVersion</key>                     <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>LSRequiresIPhoneOS</key>                  <true/>
              <key>MinimumOSVersion</key>                    <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                          <string>AppIcon76x76</string>
                      </array>
                      <key>CFBundleIconName</key>
                      <string>AppIcon</string>
                      <key>UIPrerenderedIcon</key>
                      <false/>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon76x76</string>
                          <string>AppIcon83.5x83.5</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key>
                      <string>AppIcon</string>
                      <key>UIPrerenderedIcon</key>
                      <false/>
                  </dict>
              </dict>
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key>                     <string>LaunchBackground</string>
                  <key>UIImageName</key>                     <string>LaunchImage</string>
              </dict>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UIApplicationSupportsIndirectInputEvents</key>
              <true/>
          </dict>
          </plist>
          PEOF

      # =========================================================
      # SOURCE CODE - Login Only
      # =========================================================
      - name: Generate VIP21Store.swift
        run: |
          cat > VIP21Store.swift << 'SWIFTEOF'
          import SwiftUI
          import UIKit
          import Foundation
          import Combine

          // MARK: - Constants
          struct AppConstants {
              static let appName = "21s Pro"
              static let appVersion = "1.0"
              static let bundleID = "com.vip21.store.pro"
              static let userDefaultsKey = "vip21_users_v1"
              static let currentUserKey = "vip21_current_user_v1"
          }

          // MARK: - Colors
          extension Color {
              static let vipBackground = Color(red: 0.04, green: 0.05, blue: 0.08)
              static let vipCard = Color(red: 0.10, green: 0.11, blue: 0.14)
              static let vipBlue = Color(red: 0.20, green: 0.55, blue: 1.00)
              static let vipCyan = Color(red: 0.30, green: 0.75, blue: 0.95)
              static let vipPurple = Color(red: 0.65, green: 0.35, blue: 0.95)
              static let vipGreen = Color(red: 0.25, green: 0.85, blue: 0.45)
              static let vipRed = Color(red: 1.00, green: 0.30, blue: 0.25)
              static let vipText = Color(red: 0.90, green: 0.90, blue: 0.92)
              static let vipSecondary = Color(red: 0.55, green: 0.56, blue: 0.58)
          }

          // MARK: - Models
          struct AppUser: Codable, Identifiable {
              let id: UUID
              let email: String
              let username: String
              let password: String
              let createdAt: Date

              init(email: String, username: String, password: String) {
                  self.id = UUID()
                  self.email = email
                  self.username = username
                  self.password = password
                  self.createdAt = Date()
              }
          }

          // MARK: - Auth Manager
          @MainActor
          final class AuthManager: ObservableObject {
              @Published var currentUser: AppUser?
              @Published var isAuthenticated = false
              @Published var isLoading = false
              @Published var errorMessage: String?

              init() {
                  loadUser()
              }

              func signUp(email: String, username: String, password: String, confirmPassword: String) -> Bool {
                  isLoading = true
                  errorMessage = nil
                  defer { isLoading = false }

                  let e = email.trimmingCharacters(in: .whitespaces)
                  let u = username.trimmingCharacters(in: .whitespaces)

                  if e.isEmpty || !e.contains("@") || !e.contains(".") {
                      errorMessage = "Please enter a valid email"
                      return false
                  }
                  if u.count < 3 {
                      errorMessage = "Username must be at least 3 characters"
                      return false
                  }
                  if password.count < 6 {
                      errorMessage = "Password must be at least 6 characters"
                      return false
                  }
                  if password != confirmPassword {
                      errorMessage = "Passwords do not match"
                      return false
                  }

                  var users = loadAllUsers()
                  if users.contains(where: { $0.email.lowercased() == e.lowercased() }) {
                      errorMessage = "Email already registered"
                      return false
                  }
                  if users.contains(where: { $0.username.lowercased() == u.lowercased() }) {
                      errorMessage = "Username already taken"
                      return false
                  }

                  let newUser = AppUser(email: e, username: u, password: password)
                  users.append(newUser)
                  saveAllUsers(users)

                  currentUser = newUser
                  isAuthenticated = true
                  UserDefaults.standard.set(newUser.id.uuidString, forKey: AppConstants.currentUserKey)
                  return true
              }

              func login(email: String, password: String) -> Bool {
                  isLoading = true
                  errorMessage = nil
                  defer { isLoading = false }

                  let e = email.trimmingCharacters(in: .whitespaces)
                  if e.isEmpty || password.isEmpty {
                      errorMessage = "Please fill all fields"
                      return false
                  }

                  let users = loadAllUsers()
                  guard let user = users.first(where: {
                      ($0.email.lowercased() == e.lowercased() || $0.username.lowercased() == e.lowercased())
                      && $0.password == password
                  }) else {
                      errorMessage = "Invalid email/username or password"
                      return false
                  }

                  currentUser = user
                  isAuthenticated = true
                  UserDefaults.standard.set(user.id.uuidString, forKey: AppConstants.currentUserKey)
                  return true
              }

              func logout() {
                  currentUser = nil
                  isAuthenticated = false
                  UserDefaults.standard.removeObject(forKey: AppConstants.currentUserKey)
              }

              private func loadUser() {
                  guard let idString = UserDefaults.standard.string(forKey: AppConstants.currentUserKey),
                        let id = UUID(uuidString: idString) else { return }
                  let users = loadAllUsers()
                  if let user = users.first(where: { $0.id == id }) {
                      currentUser = user
                      isAuthenticated = true
                  }
              }

              private func loadAllUsers() -> [AppUser] {
                  guard let data = UserDefaults.standard.data(forKey: AppConstants.userDefaultsKey),
                        let users = try? JSONDecoder().decode([AppUser].self, from: data) else {
                      return []
                  }
                  return users
              }

              private func saveAllUsers(_ users: [AppUser]) {
                  if let data = try? JSONEncoder().encode(users) {
                      UserDefaults.standard.set(data, forKey: AppConstants.userDefaultsKey)
                  }
              }
          }

          // MARK: - Haptic
          class HapticManager {
              static let shared = HapticManager()
              func impact(_ style: UIImpactFeedbackGenerator.FeedbackStyle = .medium) {
                  UIImpactFeedbackGenerator(style: style).impactOccurred()
              }
              func success() {
                  UINotificationFeedbackGenerator().notificationOccurred(.success)
              }
              func error() {
                  UINotificationFeedbackGenerator().notificationOccurred(.error)
              }
          }

          // MARK: - Auth View
          struct AuthView: View {
              @StateObject private var authManager = AuthManager()
              @State private var isLoginMode = true
              @State private var email = ""
              @State private var username = ""
              @State private var password = ""
              @State private var confirmPassword = ""
              @State private var showPassword = false
              @State private var showConfirmPassword = false
              @State private var shake = false

              var body: some View {
                  Group {
                      if authManager.isAuthenticated {
                          WelcomeView(authManager: authManager)
                      } else {
                          authScreen
                      }
                  }
                  .animation(.easeInOut(duration: 0.3), value: authManager.isAuthenticated)
              }

              var authScreen: some View {
                  ZStack {
                      LinearGradient(
                          colors: [Color.vipBackground, Color(red: 0.06, green: 0.07, blue: 0.10)],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                      .ignoresSafeArea()

                      ScrollView(showsIndicators: false) {
                          VStack(spacing: 28) {
                              VStack(spacing: 12) {
                                  ZStack {
                                      Circle()
                                          .fill(Color.vipBlue.opacity(0.15))
                                          .frame(width: 90, height: 90)
                                      Image(systemName: "lock.shield.fill")
                                          .font(.system(size: 40, weight: .semibold))
                                          .foregroundColor(.vipBlue)
                                  }
                                  .padding(.top, 60)

                                  Text("21s Pro")
                                      .font(.system(size: 32, weight: .black, design: .rounded))
                                      .foregroundColor(.white)

                                  Text(isLoginMode ? "Welcome Back" : "Create Account")
                                      .font(.system(size: 16, weight: .medium))
                                      .foregroundColor(.vipSecondary)
                              }

                              VStack(spacing: 18) {
                                  inputField(title: "Email or Username", text: $email, icon: "envelope.fill", isSecure: false)

                                  if !isLoginMode {
                                      inputField(title: "Username", text: $username, icon: "person.fill", isSecure: false)
                                  }

                                  passwordField(title: "Password", text: $password, show: $showPassword)

                                  if !isLoginMode {
                                      passwordField(title: "Confirm Password", text: $confirmPassword, show: $showConfirmPassword)
                                  }

                                  if let error = authManager.errorMessage {
                                      HStack(spacing: 6) {
                                          Image(systemName: "exclamationmark.triangle.fill")
                                              .font(.system(size: 12))
                                              .foregroundColor(.vipRed)
                                          Text(error)
                                              .font(.system(size: 12, weight: .medium))
                                              .foregroundColor(.vipRed)
                                          Spacer()
                                      }
                                      .padding(.horizontal, 4)
                                      .transition(.opacity)
                                  }

                                  Button {
                                      HapticManager.shared.impact(.medium)
                                      handleAction()
                                  } label: {
                                      ZStack {
                                          RoundedRectangle(cornerRadius: 14)
                                              .fill(authManager.isLoading ? Color.vipSecondary : Color.vipBlue)
                                              .frame(height: 52)
                                          if authManager.isLoading {
                                              ProgressView().tint(.white)
                                          } else {
                                              Text(isLoginMode ? "Log In" : "Sign Up")
                                                  .font(.system(size: 16, weight: .bold))
                                                  .foregroundColor(.white)
                                          }
                                      }
                                  }
                                  .disabled(authManager.isLoading)
                                  .offset(x: shake ? -10 : 0)

                                  Button {
                                      withAnimation(.spring(response: 0.35)) {
                                          isLoginMode.toggle()
                                          authManager.errorMessage = nil
                                      }
                                  } label: {
                                      HStack(spacing: 4) {
                                          Text(isLoginMode ? "Don't have an account?" : "Already have an account?")
                                              .font(.system(size: 13))
                                              .foregroundColor(.vipSecondary)
                                          Text(isLoginMode ? "Sign Up" : "Log In")
                                              .font(.system(size: 13, weight: .bold))
                                              .foregroundColor(.vipBlue)
                                      }
                                  }
                              }
                              .padding(24)
                              .background(
                                  RoundedRectangle(cornerRadius: 24)
                                      .fill(Color.vipCard)
                                      .overlay(
                                          RoundedRectangle(cornerRadius: 24)
                                              .stroke(Color.white.opacity(0.06), lineWidth: 1)
                                      )
                              )
                              .shadow(color: .black.opacity(0.25), radius: 20, x: 0, y: 10)
                              .padding(.horizontal, 20)

                              Spacer(minLength: 40)

                              Text("Secure • Private • Professional")
                                  .font(.system(size: 11))
                                  .foregroundColor(.vipSecondary.opacity(0.5))
                          }
                      }
                  }
                  .preferredColorScheme(.dark)
              }

              func inputField(title: String, text: Binding<String>, icon: String, isSecure: Bool) -> some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Text(title)
                          .font(.system(size: 12, weight: .semibold))
                          .foregroundColor(.vipSecondary)
                      HStack(spacing: 10) {
                          Image(systemName: icon)
                              .font(.system(size: 14))
                              .foregroundColor(.vipBlue)
                              .frame(width: 20)
                          if isSecure {
                              SecureField("", text: text)
                                  .font(.system(size: 15))
                                  .foregroundColor(.vipText)
                          } else {
                              TextField("", text: text)
                                  .font(.system(size: 15))
                                  .foregroundColor(.vipText)
                                  .autocapitalization(.none)
                          }
                      }
                      .padding(14)
                      .background(
                          RoundedRectangle(cornerRadius: 12)
                              .fill(Color.black.opacity(0.2))
                              .overlay(
                                  RoundedRectangle(cornerRadius: 12)
                                      .stroke(Color.white.opacity(0.06), lineWidth: 1)
                              )
                      )
                  }
              }

              func passwordField(title: String, text: Binding<String>, show: Binding<Bool>) -> some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Text(title)
                          .font(.system(size: 12, weight: .semibold))
                          .foregroundColor(.vipSecondary)
                      HStack(spacing: 10) {
                          Image(systemName: "lock.fill")
                              .font(.system(size: 14))
                              .foregroundColor(.vipBlue)
                              .frame(width: 20)
                          if show.wrappedValue {
                              TextField("", text: text)
                                  .font(.system(size: 15))
                                  .foregroundColor(.vipText)
                          } else {
                              SecureField("", text: text)
                                  .font(.system(size: 15))
                                  .foregroundColor(.vipText)
                          }
                          Button {
                              show.wrappedValue.toggle()
                          } label: {
                              Image(systemName: show.wrappedValue ? "eye.slash.fill" : "eye.fill")
                                  .font(.system(size: 13))
                                  .foregroundColor(.vipSecondary)
                          }
                      }
                      .padding(14)
                      .background(
                          RoundedRectangle(cornerRadius: 12)
                              .fill(Color.black.opacity(0.2))
                              .overlay(
                                  RoundedRectangle(cornerRadius: 12)
                                      .stroke(Color.white.opacity(0.06), lineWidth: 1)
                              )
                      )
                  }
              }

              func handleAction() {
                  if isLoginMode {
                      let success = authManager.login(email: email, password: password)
                      if !success {
                          withAnimation(.default) {
                              shake = true
                          }
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.1) {
                              shake = false
                          }
                          HapticManager.shared.error()
                      } else {
                          HapticManager.shared.success()
                      }
                  } else {
                      let success = authManager.signUp(email: email, username: username, password: password, confirmPassword: confirmPassword)
                      if !success {
                          withAnimation(.default) {
                              shake = true
                          }
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.1) {
                              shake = false
                          }
                          HapticManager.shared.error()
                      } else {
                          HapticManager.shared.success()
                      }
                  }
              }
          }

          // MARK: - Welcome View
          struct WelcomeView: View {
              @ObservedObject var authManager: AuthManager
              @State private var animate = false

              var body: some View {
                  ZStack {
                      Color.vipBackground.ignoresSafeArea()

                      VStack(spacing: 24) {
                          Spacer()

                          ZStack {
                              Circle()
                                  .fill(Color.vipBlue.opacity(0.15))
                                  .frame(width: 120, height: 120)
                                  .scaleEffect(animate ? 1.1 : 1.0)

                              Image(systemName: "checkmark.seal.fill")
                                  .font(.system(size: 50))
                                  .foregroundColor(.vipGreen)
                          }

                          Text("Welcome, \(authManager.currentUser?.username ?? "User")!")
                              .font(.system(size: 28, weight: .black, design: .rounded))
                              .foregroundColor(.white)

                          Text("You have successfully logged in.")
                              .font(.system(size: 15))
                              .foregroundColor(.vipSecondary)

                          Spacer()

                          Button {
                              HapticManager.shared.impact(.medium)
                              authManager.logout()
                          } label: {
                              Text("Log Out")
                                  .font(.system(size: 16, weight: .bold))
                                  .foregroundColor(.white)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 52)
                                  .background(
                                      RoundedRectangle(cornerRadius: 14)
                                          .fill(Color.vipRed.opacity(0.8))
                                  )
                          }
                          .padding(.horizontal, 40)
                          .padding(.bottom, 40)
                      }
                  }
                  .onAppear {
                      withAnimation(.easeInOut(duration: 1.5).repeatForever(autoreverses: true)) {
                          animate = true
                      }
                  }
                  .preferredColorScheme(.dark)
              }
          }

          // MARK: - App Entry
          @main
          struct VIP21StoreApp: App {
              var body: some Scene {
                  WindowGroup {
                      AuthView()
                  }
              }
          }
          SWIFTEOF

      # =========================================================
      # BUILD
      # =========================================================
      - name: Build the app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          xcrun swiftc \
            VIP21Store.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0 \
            -O \
            -module-name VIP21Store \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework Combine \
            -o VIP21Store
          file VIP21Store

      - name: Create IPA package
        run: |
          mkdir -p artifacts
          rm -rf build-output
          mkdir -p build-output/Payload/VIP21Store.app
          cp VIP21Store                          build-output/Payload/VIP21Store.app/VIP21Store
          cp Resources/Info.plist                build-output/Payload/VIP21Store.app/Info.plist
          cp Resources/AppIcon60x60@2x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon60x60@3x.png       build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon76x76@2x~ipad.png  build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon83.5x83.5@2x~ipad.png build-output/Payload/VIP21Store.app/
          cp Resources/AppIcon1024x1024.png      build-output/Payload/VIP21Store.app/
          ldid -S build-output/Payload/VIP21Store.app/VIP21Store
          cd build-output && zip -r -q ../artifacts/21s.ipa Payload/ && cd ..
          echo "IPA: $(du -sh artifacts/21s.ipa)"

      - name: Verify IPA package
        run: |
          echo "== IPA Contents =="
          unzip -l artifacts/21s.ipa | head -30
          if ! unzip -l artifacts/21s.ipa | grep -q "Payload/VIP21Store.app/VIP21Store"; then
            echo "❌ Error: IPA does not contain a valid App Bundle"
            exit 1
          fi
          echo "✅ IPA is valid and contains the App Bundle."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 21s-Pro-Login-Only-v1
          path: artifacts/21s.ipa
