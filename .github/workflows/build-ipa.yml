          // ================= HELPERS (time / handle / accent) =================
          func onesTimeAgo(_ iso: String) -> String {
              let fmts = ["yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd'T'HH:mm:ssZ", "yyyy-MM-dd'T'HH:mm:ss"]
              var date: Date? = nil
              for f in fmts {
                  let df = DateFormatter()
                  df.locale = Locale(identifier: "en_US_POSIX")
                  df.timeZone = TimeZone(identifier: "UTC")
                  df.dateFormat = f
                  if let d = df.date(from: iso) { date = d; break }
              }
              guard let d = date else { return "" }
              let s = Int(Date().timeIntervalSince(d))
              if s < 60 { return "الآن" }
              if s < 3600 { return "\(s / 60) د" }
              if s < 86400 { return "\(s / 3600) س" }
              if s < 604800 { return "\(s / 86400) ي" }
              let df = DateFormatter()
              df.locale = Locale(identifier: "ar")
              df.dateFormat = "d MMM"
              return df.string(from: d)
          }

          func onesHandle(_ name: String) -> String {
              let clean = name.lowercased().filter { $0.isLetter || $0.isNumber || $0 == "_" }
              return "@" + (clean.isEmpty ? "user" : clean)
          }

          func onesAccent(_ seed: String) -> Color {
              let palette: [Color] = [Color.storePrimary, .pink, .purple, .teal, .orange, .blue, .green, .indigo]
              let idx = abs(seed.hashValue) % palette.count
              return palette[idx]
          }
