                                                                      startPoint: .topLeading, endPoint: .bottomTrailing), lineWidth: 2))
                            }
                        }

                        @ViewBuilder private var content: some View {
                            if appsManager.isLoading && appsManager.apps.isEmpty {
                                LoadingView()
                            } else if let err = appsManager.errorMessage, appsManager.apps.isEmpty {
                                ErrorView(message: err) { appsManager.retryFetch() }
                            } else {
                                switch selectedTab {
                                case .home:
                                    HomeTabView(appsManager: appsManager, downloadManager: downloadManager)
                                case .apps:
                                    AppsTabView(appsManager: appsManager, downloadManager: downloadManager)
