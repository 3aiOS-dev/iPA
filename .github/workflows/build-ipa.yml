          struct RoundedCorner: Shape {
              var radius: CGFloat
              var corners: UIRectCorner
              func path(in rect: CGRect) -> Path {
                  let p = UIBezierPath(roundedRect: rect, byRoundingCorners: corners,
                                       cornerRadii: CGSize(width: radius, height: radius))
                  return Path(p.cgPath)
              }
          }

          // MARK: - Comments View (standalone)
          struct CommentsView: View {
              let app: StoreAPIApp
              @Environment(\.dismiss) private var dismiss
              @State private var draft: String = ""
              @State private var comments: [Comment] = []
              @State private var isLoading = false

              struct Comment: Identifiable, Decodable {
                  let id: String
                  let author: String
                  let body: String
                  let reply: String?
                  let created_at: String?
              }

              private func loadComments() {
                  guard let url = URL(string: "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app/api/public/store/comments?app=\(app.id)") else { return }
                  isLoading = true
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      var list: [Comment] = []
                      if let data = data,
                         let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let items = obj["comments"] as? [[String: Any]] {
                          list = items.compactMap { dict in
                              guard let id = dict["id"] as? String,
                                    let author = dict["author"] as? String,
                                    let body = dict["body"] as? String else { return nil }
                              return Comment(id: id, author: author, body: body,
                                             reply: dict["reply"] as? String,
                                             created_at: dict["created_at"] as? String)
                          }
                      }
                      DispatchQueue.main.async {
                          self.comments = list
                          self.isLoading = false
                      }
                  }.resume()
              }

              private func sendComment() {
                  let text = draft.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !text.isEmpty else { return }
                  guard let url = URL(string: "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app/api/public/store/comments") else { return }
                  var req = URLRequest(url: url, timeoutInterval: 25)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  req.httpBody = try? JSONSerialization.data(withJSONObject: ["app_id": app.id, "body": text])
                  URLSession.shared.dataTask(with: req) { _, _, _ in
                      DispatchQueue.main.async {
                          draft = ""
                          loadComments()
                      }
                  }.resume()
              }

              var body: some View {
                  NavigationStack {
                      VStack {
                          HStack(spacing: 8) {
                              TextField("اكتب تعليقك...", text: $draft)
                                  .font(.system(size: 13))
                                  .foregroundColor(.storeText)
                                  .padding(.horizontal, 12).padding(.vertical, 10)
                                  .background(RoundedRectangle(cornerRadius: 14).fill(Color.storeCard))
                                  .overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.storeDivider, lineWidth: 1))
                              Button {
                                  sendComment()
                              } label: {
                                  Text("نشر")
                                      .font(.system(size: 13, weight: .bold))
                                      .foregroundColor(.white)
                                      .padding(.horizontal, 16).padding(.vertical, 10)
                                      .background(Capsule().fill(Color.storePrimary))
                              }
                              .disabled(draft.isEmpty)
                          }
                          .padding()

                          if isLoading {
                              ProgressView().padding()
                          } else if comments.isEmpty {
                              Text("لا توجد تعليقات بعد")
                                  .font(.system(size: 13))
                                  .foregroundColor(.storeSub)
                                  .padding()
                          } else {
                              ScrollView {
                                  LazyVStack(spacing: 12) {
                                      ForEach(comments) { c in
                                          VStack(alignment: .leading, spacing: 6) {
                                              Text(c.author)
                                                  .font(.system(size: 13, weight: .bold))
                                                  .foregroundColor(.storeText)
                                              Text(c.body)
                                                  .font(.system(size: 12))
                                                  .foregroundColor(.storeSub)
                                                  .fixedSize(horizontal: false, vertical: true)
                                              if let reply = c.reply, !reply.isEmpty {
                                                  HStack(alignment: .top, spacing: 6) {
                                                      Text("رد الإدارة:")
                                                          .font(.system(size: 11, weight: .bold))
                                                          .foregroundColor(.storePrimary)
                                                      Text(reply)
                                                          .font(.system(size: 11))
                                                          .foregroundColor(.storeSub)
                                                  }
                                                  .padding(8)
                                                  .background(RoundedRectangle(cornerRadius: 10).fill(Color.storeDivider.opacity(0.35)))
                                              }
                                          }
                                          .frame(maxWidth: .infinity, alignment: .leading)
                                          .padding(12)
                                          .background(RoundedRectangle(cornerRadius: 16).fill(Color.storeCard))
                                          .overlay(RoundedRectangle(cornerRadius: 16).stroke(Color.storeDivider, lineWidth: 1))
                                      }
                                  }
                                  .padding()
                              }
                          }
                      }
                      .background(Color.storeBg.ignoresSafeArea())
                      .navigationTitle("التعليقات")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button("إغلاق") { dismiss() }
