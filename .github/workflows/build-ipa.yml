      - name: Generate code - FavoritesStore.swift
        run: |
          cat > FavoritesStore.swift << 'FAVEOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class FavoritesStore: ObservableObject {
              static let shared = FavoritesStore()

              @Published private(set) var items: [StoreAPIApp] = []

              private let key = "favorites.v1"
              private let d = UserDefaults.standard

              private init() { load() }

              private func load() {
                  guard let data = d.data(forKey: key),
                        let decoded = try? JSONDecoder().decode([StoreAPIApp].self, from: data) else {
                      return
                  }
                  items = decoded
              }

              private func save() {
                  if let data = try? JSONEncoder().encode(items) {
                      d.set(data, forKey: key)
                  }
              }

              func contains(_ app: StoreAPIApp) -> Bool {
                  items.contains(where: { $0.id == app.id })
              }

              func toggle(_ app: StoreAPIApp) {
                  if contains(app) {
                      items.removeAll { $0.id == app.id }
                      HapticManager.shared.impact(.light)
                  } else {
                      items.insert(app, at: 0)
                      HapticManager.shared.success()
                  }
                  save()
              }

              func add(_ app: StoreAPIApp) {
                  if contains(app) { return }
                  items.insert(app, at: 0)
                  save()
              }

              func remove(_ app: StoreAPIApp) {
                  items.removeAll { $0.id == app.id }
                  save()
              }

              func clearAll() {
                  items.removeAll()
                  save()
              }
          }

          struct FavoriteButton: View {
              let app: StoreAPIApp
              var size: CGFloat = 40
              var style: Style = .filled
              enum Style { case filled, ghost }

              @ObservedObject private var store = FavoritesStore.shared

              var body: some View {
                  let isFav = store.contains(app)
                  Button {
                      store.toggle(app)
                  } label: {
                      Image(systemName: isFav ? "heart.fill" : "heart")
                          .font(.system(size: size * 0.45, weight: .bold))
                          .foregroundColor(isFav ? .white : Color.storePink)
                          .frame(width: size, height: size)
                          .background(
                              Circle()
                                  .fill(isFav
                                        ? LinearGradient(colors: [Color.storePink, Color.storePrimary],
                                                         startPoint: .topLeading, endPoint: .bottomTrailing)
                                        : LinearGradient(colors: [Color.white], startPoint: .top, endPoint: .bottom))
                          )
                          .overlay(
                              Circle()
                                  .stroke(isFav ? Color.clear : Color.storeDivider, lineWidth: 1)
                          )
                          .shadow(color: isFav ? Color.storePink.opacity(0.35) : Color.black.opacity(0.06),
                                  radius: isFav ? 8 : 4, y: 2)
                  }
                  .buttonStyle(.plain)
                  .animation(.spring(response: 0.3, dampingFraction: 0.6), value: isFav)
              }
          }
          FAVEOF

