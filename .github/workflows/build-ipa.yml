name: Build Jood IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ipa.yml"
      - "AppIcon60x60@2x.png"
      - "AppIcon76x76@2x~ipad.png"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required app icons
        shell: bash
        run: |
          set -euo pipefail
          test -f "AppIcon60x60@2x.png" || {
            echo "Missing AppIcon60x60@2x.png in the repository root"
            exit 1
          }
          test -f "AppIcon76x76@2x~ipad.png" || {
            echo "Missing AppIcon76x76@2x~ipad.png in the repository root"
            exit 1
          }

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Create the complete iOS project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p JoodApp/Sources
          mkdir -p JoodApp/Resources/Assets.xcassets/AppIcon.appiconset

          cat > project.yml <<'PROJECT'
          name: JoodApp
          options:
            bundleIdPrefix: org.neocities.joodipa
            deploymentTarget:
              iOS: "13.0"
            xcodeVersion: "16.0"
            createIntermediateGroups: true
          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: org.neocities.joodipa.app
              PRODUCT_NAME: Jood
              MARKETING_VERSION: "1.0.0"
              CURRENT_PROJECT_VERSION: "1"
              SWIFT_VERSION: "5.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              IPHONEOS_DEPLOYMENT_TARGET: "13.0"
              SUPPORTS_MACCATALYST: NO
              CODE_SIGN_STYLE: Automatic
              ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
              GENERATE_INFOPLIST_FILE: NO
          targets:
            JoodApp:
              type: application
              platform: iOS
              sources:
                - path: JoodApp/Sources
                - path: JoodApp/Resources
              info:
                path: JoodApp/Info.plist
              settings:
                base:
                  INFOPLIST_FILE: JoodApp/Info.plist
          PROJECT

          cat > JoodApp/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Jood IPA</string>
            <key>CFBundleName</key>
            <string>Jood</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$(MARKETING_VERSION)</string>
            <key>CFBundleVersion</key>
            <string>$(CURRENT_PROJECT_VERSION)</string>
            <key>UILaunchScreen</key>
            <dict>
              <key>UIColorName</key>
              <string>LaunchBackground</string>
            </dict>
            <key>UIRequiresFullScreen</key>
            <true/>
            <key>UIStatusBarHidden</key>
            <true/>
            <key>UIViewControllerBasedStatusBarAppearance</key>
            <true/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationPortraitUpsideDown</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoadsInWebContent</key>
              <false/>
            </dict>
          </dict>
          </plist>
          PLIST

          cat > JoodApp/Sources/AppDelegate.swift <<'SWIFT'
          import UIKit

          @main
          final class AppDelegate: UIResponder, UIApplicationDelegate {
              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil
              ) -> Bool {
                  true
              }

              func application(
                  _ application: UIApplication,
                  configurationForConnecting connectingSceneSession: UISceneSession,
                  options: UIScene.ConnectionOptions
              ) -> UISceneConfiguration {
                  let configuration = UISceneConfiguration(
                      name: "Default Configuration",
                      sessionRole: connectingSceneSession.role
                  )
                  configuration.delegateClass = SceneDelegate.self
                  return configuration
              }
          }
          SWIFT

          cat > JoodApp/Sources/SceneDelegate.swift <<'SWIFT'
          import UIKit

          final class SceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?

              func scene(
                  _ scene: UIScene,
                  willConnectTo session: UISceneSession,
                  options connectionOptions: UIScene.ConnectionOptions
              ) {
                  guard let windowScene = scene as? UIWindowScene else { return }

                  let window = UIWindow(windowScene: windowScene)
                  window.rootViewController = WebViewController()
                  window.makeKeyAndVisible()
                  self.window = window
              }
          }
          SWIFT

          cat > JoodApp/Sources/WebViewController.swift <<'SWIFT'
          import UIKit
          import WebKit

          final class WebViewController: UIViewController, WKNavigationDelegate {
              private let websiteURL = URL(string: "https://jood-ipa.neocities.org")

              private lazy var webView: WKWebView = {
                  let configuration = WKWebViewConfiguration()
                  configuration.websiteDataStore = .default()
                  configuration.allowsInlineMediaPlayback = true
                  configuration.mediaTypesRequiringUserActionForPlayback = []

                  let view = WKWebView(frame: .zero, configuration: configuration)
                  view.translatesAutoresizingMaskIntoConstraints = false
                  view.navigationDelegate = self
                  view.allowsBackForwardNavigationGestures = true
                  view.scrollView.contentInsetAdjustmentBehavior = .never
                  view.scrollView.alwaysBounceVertical = false
                  view.isOpaque = true
                  view.backgroundColor = .systemBackground
                  view.scrollView.backgroundColor = .systemBackground
                  return view
              }()

              private lazy var loadingIndicator: UIActivityIndicatorView = {
                  let indicator = UIActivityIndicatorView(style: .large)
                  indicator.translatesAutoresizingMaskIntoConstraints = false
                  indicator.hidesWhenStopped = true
                  return indicator
              }()

              private lazy var retryButton: UIButton = {
                  let button = UIButton(type: .system)
                  button.translatesAutoresizingMaskIntoConstraints = false
                  button.setTitle("Ø¥Ø¹Ø§Ø¯Ø© Ø§ÙÙØ­Ø§ÙÙØ©", for: .normal)
                  button.titleLabel?.font = .systemFont(ofSize: 18, weight: .semibold)
                  button.isHidden = true
                  button.addTarget(self, action: #selector(reloadWebsite), for: .touchUpInside)
                  return button
              }()

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .systemBackground
                  view.addSubview(webView)
                  view.addSubview(loadingIndicator)
                  view.addSubview(retryButton)

                  NSLayoutConstraint.activate([
                      webView.topAnchor.constraint(equalTo: view.topAnchor),
                      webView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      webView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      webView.bottomAnchor.constraint(equalTo: view.bottomAnchor),

                      loadingIndicator.centerXAnchor.constraint(equalTo: view.centerXAnchor),
                      loadingIndicator.centerYAnchor.constraint(equalTo: view.centerYAnchor),

                      retryButton.centerXAnchor.constraint(equalTo: view.centerXAnchor),
                      retryButton.centerYAnchor.constraint(equalTo: view.centerYAnchor)
                  ])

                  loadWebsite()
              }

              override var prefersStatusBarHidden: Bool { true }
              override var prefersHomeIndicatorAutoHidden: Bool { true }
              override var preferredScreenEdgesDeferringSystemGestures: UIRectEdge { .all }

              private func loadWebsite() {
                  guard let websiteURL else {
                      retryButton.isHidden = false
                      return
                  }
                  retryButton.isHidden = true
                  loadingIndicator.startAnimating()
                  webView.load(URLRequest(url: websiteURL, cachePolicy: .reloadRevalidatingCacheData))
              }

              @objc private func reloadWebsite() {
                  loadWebsite()
              }

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation?) {
                  loadingIndicator.stopAnimating()
                  retryButton.isHidden = true
              }

              func webView(
                  _ webView: WKWebView,
                  didFail navigation: WKNavigation?,
                  withError error: Error
              ) {
                  showRetry()
              }

              func webView(
                  _ webView: WKWebView,
                  didFailProvisionalNavigation navigation: WKNavigation?,
                  withError error: Error
              ) {
                  showRetry()
              }

              private func showRetry() {
                  loadingIndicator.stopAnimating()
                  retryButton.isHidden = false
              }

              func webView(
                  _ webView: WKWebView,
                  decidePolicyFor navigationAction: WKNavigationAction,
                  decisionHandler: @escaping (WKNavigationActionPolicy) -> Void
              ) {
                  guard let url = navigationAction.request.url else {
                      decisionHandler(.cancel)
                      return
                  }

                  if ["http", "https"].contains(url.scheme?.lowercased() ?? "") {
                      decisionHandler(.allow)
                  } else {
                      UIApplication.shared.open(url)
                      decisionHandler(.cancel)
                  }
              }
          }
          SWIFT

          ICON_DIR="JoodApp/Resources/Assets.xcassets/AppIcon.appiconset"
          cp "AppIcon60x60@2x.png" "$ICON_DIR/AppIcon60x60@2x.png"
          cp "AppIcon76x76@2x~ipad.png" "$ICON_DIR/AppIcon76x76@2x~ipad.png"

          # Build every required icon size from the two supplied master icons.
          sips -z 40 40   "AppIcon60x60@2x.png"       --out "$ICON_DIR/Icon-20@2x.png" >/dev/null
          sips -z 60 60   "AppIcon60x60@2x.png"       --out "$ICON_DIR/Icon-20@3x.png" >/dev/null
          sips -z 58 58   "AppIcon60x60@2x.png"       --out "$ICON_DIR/Icon-29@2x.png" >/dev/null
          sips -z 87 87   "AppIcon60x60@2x.png"       --out "$ICON_DIR/Icon-29@3x.png" >/dev/null
          sips -z 80 80   "AppIcon60x60@2x.png"       --out "$ICON_DIR/Icon-40@2x.png" >/dev/null
          sips -z 120 120 "AppIcon60x60@2x.png"       --out "$ICON_DIR/Icon-40@3x.png" >/dev/null
          sips -z 120 120 "AppIcon60x60@2x.png"       --out "$ICON_DIR/AppIcon60x60@2x.png" >/dev/null
          sips -z 180 180 "AppIcon60x60@2x.png"       --out "$ICON_DIR/Icon-60@3x.png" >/dev/null
          sips -z 20 20   "AppIcon76x76@2x~ipad.png"  --out "$ICON_DIR/Icon-20@1x-ipad.png" >/dev/null
          sips -z 29 29   "AppIcon76x76@2x~ipad.png"  --out "$ICON_DIR/Icon-29@1x-ipad.png" >/dev/null
          sips -z 40 40   "AppIcon76x76@2x~ipad.png"  --out "$ICON_DIR/Icon-40@1x-ipad.png" >/dev/null
          sips -z 76 76   "AppIcon76x76@2x~ipad.png"  --out "$ICON_DIR/Icon-76@1x-ipad.png" >/dev/null
          sips -z 152 152 "AppIcon76x76@2x~ipad.png"  --out "$ICON_DIR/AppIcon76x76@2x~ipad.png" >/dev/null
          sips -z 167 167 "AppIcon76x76@2x~ipad.png"  --out "$ICON_DIR/Icon-83.5@2x-ipad.png" >/dev/null
          sips -z 1024 1024 "AppIcon76x76@2x~ipad.png" --out "$ICON_DIR/Icon-1024.png" >/dev/null

          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images": [
              { "idiom": "iphone", "size": "20x20", "scale": "2x", "filename": "Icon-20@2x.png" },
              { "idiom": "iphone", "size": "20x20", "scale": "3x", "filename": "Icon-20@3x.png" },
              { "idiom": "iphone", "size": "29x29", "scale": "2x", "filename": "Icon-29@2x.png" },
              { "idiom": "iphone", "size": "29x29", "scale": "3x", "filename": "Icon-29@3x.png" },
              { "idiom": "iphone", "size": "40x40", "scale": "2x", "filename": "Icon-40@2x.png" },
              { "idiom": "iphone", "size": "40x40", "scale": "3x", "filename": "Icon-40@3x.png" },
              { "idiom": "iphone", "size": "60x60", "scale": "2x", "filename": "AppIcon60x60@2x.png" },
              { "idiom": "iphone", "size": "60x60", "scale": "3x", "filename": "Icon-60@3x.png" },
              { "idiom": "ipad", "size": "20x20", "scale": "1x", "filename": "Icon-20@1x-ipad.png" },
              { "idiom": "ipad", "size": "20x20", "scale": "2x", "filename": "Icon-20@2x.png" },
              { "idiom": "ipad", "size": "29x29", "scale": "1x", "filename": "Icon-29@1x-ipad.png" },
              { "idiom": "ipad", "size": "29x29", "scale": "2x", "filename": "Icon-29@2x.png" },
              { "idiom": "ipad", "size": "40x40", "scale": "1x", "filename": "Icon-40@1x-ipad.png" },
              { "idiom": "ipad", "size": "40x40", "scale": "2x", "filename": "Icon-40@2x.png" },
              { "idiom": "ipad", "size": "76x76", "scale": "1x", "filename": "Icon-76@1x-ipad.png" },
              { "idiom": "ipad", "size": "76x76", "scale": "2x", "filename": "AppIcon76x76@2x~ipad.png" },
              { "idiom": "ipad", "size": "83.5x83.5", "scale": "2x", "filename": "Icon-83.5@2x-ipad.png" },
              { "idiom": "ios-marketing", "size": "1024x1024", "scale": "1x", "filename": "Icon-1024.png" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON

          mkdir -p JoodApp/Resources/Assets.xcassets/LaunchBackground.colorset
          cat > JoodApp/Resources/Assets.xcassets/LaunchBackground.colorset/Contents.json <<'JSON'
          {
            "colors": [
              {
                "idiom": "universal",
                "color": {
                  "color-space": "srgb",
                  "components": { "red": "1.000", "green": "1.000", "blue": "1.000", "alpha": "1.000" }
                }
              }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON

          cat > JoodApp/Resources/Assets.xcassets/Contents.json <<'JSON'
          { "info": { "author": "xcode", "version": 1 } }
          JSON

          xcodegen generate

      - name: Build app for iPhone and iPad
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project JoodApp.xcodeproj \
            -scheme JoodApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/JoodApp.app"
          test -d "$APP_PATH"
          rm -rf Payload JoodApp-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload JoodApp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JoodApp-unsigned-IPA
          path: JoodApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
